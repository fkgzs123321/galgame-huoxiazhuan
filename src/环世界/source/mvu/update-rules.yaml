  # === 七、确定性骰子判定规则 ===
  骰子判定:
    引擎: "DDL确定性骰子引擎.txt（@@generate_before EJS预处理）"
    核心函数:
      _check: "attributeValue, seed, difficulty → {roll, threshold, result}"
      _lcgRoll: "seed, count, sides → 骰子数组（LCG伪随机）"
      _hashSeed: "seed → 正整数（djb2哈希）"
    判定流程:
      1_构造seed: "殖民者姓名 + 行为类型 + 当前时间（确保确定性可复现）"
      2_读取技能值: "getvar('stat_data.殖民者_X.技能名')"
      3_调用_check: "_check(技能值, seed, 难度)"
      4_调用技能公式: "如_buildSkill(技能值)获取产出参数"
      5_应用结果: "根据result等级调整变量更新"
    难度等级:
      普通: "threshold = 技能值"
      困难: "threshold = 技能值/2"
      极难: "threshold = 技能值/5"
    结果等级与变量影响:
      大成功:
        条件: "roll <= 5 或 roll <= threshold/5"
        产出: "翻倍"
        疲劳: "+3"
        心情: "+5"
        说明: "产出翻倍，疲劳消耗少，心情提升"
      极难成功:
        条件: "roll <= threshold/2"
        产出: "1.5倍"
        疲劳: "+4"
        说明: "产出1.5倍，疲劳消耗中等"
      普通成功:
        条件: "roll <= threshold"
        产出: "正常"
        疲劳: "+5"
        说明: "正常产出，标准疲劳消耗"
      失败:
        条件: "roll > threshold 且 roll < 96"
        产出: "无"
        疲劳: "+5"
        材料: "消耗"
        说明: "无产出，材料消耗，疲劳消耗"
      大失败:
        条件: "roll >= 96"
        产出: "无"
        疲劳: "+8"
        心情: "-10"
        事故: "触发事故（受伤/火灾/设备损坏）"
        说明: "事故触发，疲劳消耗大，心情下降，可能受伤"
    行为类型与技能映射:
      建造: "_buildSkill(建设技能)"
      采矿: "_mineSkill(采矿技能)"
      种植: "_cropSkill(种植技能)"
      烹饪: "_cookSkill(厨艺技能)"
      手工: "_craftSkill(手工技能, 所需技能)"
      艺术: "_artSkill(艺术品技能)"
      医疗: "_medSkill(医疗技能)"
      研究: "_researchSkill(研究技能)"
      射击: "_shootSkill(射击技能, 武器伤害, 命中修正)"
      格斗: "_meleeSkill(格斗技能, 武器伤害)"
      社交: "_socialSkill(社交技能)"
      畜牧: "_animalSkill(畜牧技能, 驯服难度)"

  # === 八、JSONPatch格式要求 ===
  格式要求:
    路径: "路径不带 stat_data 根键，使用/命名空间/字段名格式，如/殖民者_主角/饱腹"
    操作:
      replace: "替换值（最常用）"
      add: "新增字段（少用）"
      remove: "删除字段（禁止使用）"
    示例: |
      <UpdateVariable>
      <Analysis>Brief English analysis of changes</Analysis>
      <JSONPatch>
      [{"op":"replace","path":"/殖民者_主角/饱腹","value":77},{"op":"replace","path":"/殖民者_主角/疲劳","value":24}]
      </JSONPatch>
      </UpdateVariable>
