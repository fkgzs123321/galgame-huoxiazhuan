# 环世界 变量更新规则
# 本文件规定 AI 在 <UpdateVariable> 中更新 stat_data 变量的规则。
# 所有变量字段都有 schema.js 的 clamp 约束，超出范围会被自动截断。

变量更新规则:

  # === 一、每楼层固定衰减（30分钟/楼层） ===
  每楼层衰减:
    殖民者_主角:
      饱腹: { 衰减: 3, 范围: [0, 100], 说明: "每楼层饱腹-3，睡眠时不衰减" }
      疲劳: { 增长: 4, 范围: [0, 100], 说明: "每楼层疲劳+4，睡眠时-15" }
      娱乐: { 衰减: 2, 范围: [0, 100], 说明: "每楼层娱乐-2" }
    殖民者_2: { 同上: "与殖民者_主角一致" }
    殖民者_3: { 同上: "与殖民者_主角一致" }
    殖民者_4: { 同上: "与殖民者_主角一致" }
    殖民者_5: { 同上: "与殖民者_主角一致" }
    奴隶_1:
      饱腹: { 衰减: 4, 范围: [0, 100], 说明: "奴隶食物少，衰减更快" }
      疲劳: { 增长: 5, 范围: [0, 100], 说明: "奴隶劳动重，疲劳增长更快" }

  # === 二、每日更新（每游戏日=24楼层=12小时游戏时间） ===
  每日更新:
    殖民地:
      游戏日: { 增长: 1, 说明: "每游戏日+1" }
      袭击冷却: { 衰减: 1, 最小: 0, 说明: "每游戏日-1，归零后可能触发袭击" }
      季节: { 切换: "每28天切换一次季节", 说明: "春→夏→秋→冬循环" }
    殖民者_主角:
      周期日: { 增长: 1, 范围: [0, 28], 说明: "每游戏日+1，到28归零" }
      怀孕状态: { 条件增长: "若>0则+1，最大280", 说明: "怀孕天数每日+1" }
    殖民者_2: { 同上: "与殖民者_主角一致" }
    殖民者_3: { 同上: "与殖民者_主角一致" }
    殖民者_4: { 同上: "与殖民者_主角一致" }
    殖民者_5: { 同上: "与殖民者_主角一致" }

  # === 三、单轮变化上限 ===
  单轮上限:
    殖民者属性:
      心情: { 上限: 15, 说明: "单楼层心情变化不超过±15" }
      舒适度: { 上限: 10, 说明: "单楼层舒适度变化不超过±10" }
      美观度: { 上限: 10, 说明: "单楼层美观度变化不超过±10" }
      精力值: { 上限: 40, 说明: "单楼层精力变化不超过±40（NSFW消耗20-40）" }
    殖民者技能:
      说明: "技能不可通过单次行为大幅提升，需通过长期实践累积"
      单次上限: 1
      每日上限: 2
    殖民地经济:
      银两: { 上限: 500, 说明: "单笔交易不超过500银两" }
      财富总值: { 上限: 1000, 说明: "单轮财富变化不超过±1000" }
      威胁点数: { 上限: 20, 说明: "单轮威胁点数变化不超过±20" }

  # === 四、特殊更新规则 ===
  特殊规则:

    # 睡眠恢复
    睡眠:
      触发: "殖民者执行睡眠行为时"
      效果:
        疲劳: { 每楼层: -15, 最小: 0 }
        精力值: { 每楼层: +10, 最大: 100 }
        娱乐: { 每楼层: +3, 最大: 100 }

    # NSFW行为消耗
    NSFW:
      触发: "执行NSFW行为时"
      效果:
        精力值: { 消耗: [20, 40], 说明: "根据行为强度消耗20-40精力" }
        心情: { 变化: [-10, 20], 说明: "根据关系阶段和自愿度变化-10到+20" }
        饱腹: { 额外衰减: 2 }

    # 战斗影响
    战斗:
      触发: "参与战斗时"
      效果:
        心情: { 变化: [-20, 10], 说明: "杀人-20，受伤-10，胜利+10" }
        疲劳: { 额外增长: 5 }
        部位HP: { 变化: "按EJS战斗控制器计算结果" }

    # 食物消耗
    进食:
      触发: "食用食物时"
      效果:
        饱腹: { 恢复: "食物N值×10", 说明: "简餐N=0.9恢复9点饱腹" }

    # 心情阈值触发
    心情阈值:
      极低:
        条件: "心情<20"
        效果: "触发精神崩溃风险判定（按精神崩溃系统EJS计算）"
      低:
        条件: "心情<30"
        效果: "工作效率-30%，产出系数×0.7"
      高:
        条件: "心情>80"
        效果: "工作效率+10%，产出系数×1.1"
      极高:
        条件: "心情>85"
        效果: "触发灵感判定（按精神崩溃系统EJS计算）"

    # 部位HP规则
    部位HP:
      归零: "部位HP=0时该部位功能丧失"
      全部归零: "6部位HP全部归零→死亡"
      濒死: "躯干HP=0→濒死状态，需立即抢救"
      恢复: "HP恢复需医疗治疗，自然恢复每游戏日+5（需休息）"

    # 飞船进度
    飞船进度:
      计算公式: "飞船反应堆×33 + 飞船AI核心×34 + 飞船结构×33"
      完成条件: "飞船反应堆=3 AND 飞船AI核心=1 AND 飞船结构=1"
      说明: "进度100%时可发射飞船，达成终局"

  # === 五、场景模式更新规则 ===
  场景模式:
    说明: "AI 必须在每轮回复末尾的 <UpdateVariable> 中更新 stat_data.殖民地.当前场景"
    更新依据: "根据本轮对话内容判断当前主要活动场景"
    场景映射:
      日常:
        触发: "常规生活/无特殊事件/时间推进/睡眠/进食"
        EJS加载: 核心引擎+基础生存系统(14模块)
      战斗:
        触发: "遭遇敌人/袭击触发/战斗行为/征召"
        EJS加载: +袭击触发器+战斗控制器+武器表+弹药表+机械族表(5模块)
        效果:
          疲劳: { 额外增长: 8 }
          饱腹: { 额外衰减: 3 }
          精力值: { 消耗: [10, 30] }
      建设:
        触发: "建造/拆除/维修/规划区域"
        EJS加载: +建筑系统+装饰美观+材料表(3模块)
      种植:
        触发: "种植/收割/畜牧/驯服/采集"
        EJS加载: +种植畜牧+作物表+食物表+动物表(4模块)
      医疗:
        触发: "手术/治疗/疾病/成瘾/机械飞升/尸体处理"
        EJS加载: +医疗手术+疾病+成瘾+机械飞升+尸体处理+药品表(6模块)
        效果:
          部位HP: { 恢复: "按医疗技能计算" }
          精力值: { 消耗: [5, 15] }
      NSFW:
        触发: "性行为/亲密互动"
        EJS加载: +NSFW+生理周期+关系+奴隶(4模块)
        效果:
          精力值: { 消耗: [20, 40] }
          心情: { 变化: [-10, 20] }
          饱腹: { 额外衰减: 2 }
      贸易:
        触发: "交易/访客/派系任务/轨道贸易"
        EJS加载: +派系贸易+轨道贸易+派系任务+社交事件+派系定义(5模块)
      探索:
        触发: "远征/商队/考古/采矿/虫害/火灾"
        EJS加载: +远征商队+考古+虫害+采矿+火灾(5模块)
        效果:
          疲劳: { 额外增长: 3 }
          饱腹: { 额外衰减: 2 }
      研究:
        触发: "研究/制作/技能练习/艺术创作"
        EJS加载: +科技树+制作系统+技能成长+艺术品表(4模块)
      特殊事件:
        触发: "精神崩溃/污染/结局判定/儿童成长"
        EJS加载: +精神崩溃+污染+多结局+教育儿童(4模块)
    强制覆盖: "若袭击冷却≤0，Level0自动将场景强制设为战斗，无视AI设置值"

