变量更新规则:
  _path_rules: |
    路径规则（违反则更新失败）
    1. 路径必须与 <status_current_variable> 里的 stat_data 结构完全一致
    2. 不加 /stat_data 前缀：✅ /玩家/学业/成绩　❌ /stat_data/玩家/学业/成绩
    3. 嵌套层级写全：✅ /郝佳期/心理/兴奋　❌ /郝佳期/兴奋
    4. 不自创字段（行为日志、精神值 都不在 schema 里）
    5. 改之前先看 <status_current_variable> 确认这个路径存在
    6. 本卡没有数组。列表类变量一律是字符串（`、` 或 `；` 分隔），只能整串 replace，严禁 add / remove —— add 会被判 SCHEMA 违规、整批作废
    7. `设置.*`（界面开关那一类）由前端维护，你不要写
    8. ★ `群.成员详情` 的键一律用 uid，不许写中文名。写中文名会报「路径不存在」并被跳过：
       su_mei=苏媚｜lin_wanqing=林婉清｜su_qing=苏晴｜han_xue=韩雪｜bai_lu=白露｜tao_tao=桃桃｜lian_nai=怜奈｜you_zi=柚子｜xiao_ye=小夜｜qin_yu=秦雨｜ling=铃
       （郝佳期不在里面，她的数据在顶层：/郝佳期/阶段、/郝佳期/心理/兴奋）
    9. `玩家.证据清单` 是唯一由你写的列表：调查成功时把新证据接在末尾，整串 replace，最多 5 条
  _output_rules: |
    ★★★ 输出铁律（违反则解析失败）★★★
    1. 变量更新块必须放在最终回复的最末尾，在正文与任何代码块之后
       ❌ 严禁放置在思考/推理段落内
    2. <JSONPatch> 必须包含单个有效的 JSON 数组（用 [ ] 包裹）
       ❌ 严禁输出多个独立的 JSON 对象
    3. 每个操作对象必须是该数组的一个元素
       ✅ 正确：[ {"op":"replace",...}, {"op":"insert",...} ]
       ❌ 错误：{"op":"replace",...} {"op":"insert",...}
    4. 无变化时输出空数组 [] 而非省略块

  _d0_sync: |
    ★★★ 与 D0 同步（每轮必读）★★★
    D0 每轮报出三样东西，变量模型按其写入，不另算、不跳步：
    1. [主题抽签] → 只写 `群.今日主题` 与 `群.今日主题索引` +1（`群.30天已用主题` 由状态栏面板自动记账，你不要写）
    2. [每周结算]（Day % 7 == 0）→ 按清单顺序写：周冠军UID → 假阳具当前持有者/持有起始日/持有到期日 → 借用期限-1（归零清空借用者）→ 等级升降并同步角色（`群.周竞赛历史` 由状态栏面板自动记账）
    3. [结局差额] → 对照差额判断是否触发结局，触发即写 `阶段守卫.已锁定/结局已触发/结局类型`
    4. [本阶段第 N 天]（D0 已算）→ 阶段晋升时把 `阶段起始日` replace 为当时的 `元数据.日数`

  _supremacy: |
    ★ 妈妈绝对主导铁律（任何阶段都不许破，违反即重写）
    1. 她是妈，他是儿子；这条不会因为暴露、摊牌、被攥住把柄而反转。今天做不做、做到哪、什么时候停，都是她说了算。
    2. 反抗永远只是「稍微」：拖半天、少做一次、说破、逼她自己来。谁压倒谁、谁驯服谁，这条不许反过来。
    3. 她认错、她害羞、她哭都不等于交权；所有后门/反抗数值只能削她一点便利，不能削她一句话的分量。

  _party_gate: |
    ★ 群周派对邀请门槛（细则见 [mvu_plot]阶段晋升系统）
    两条同时满足才发邀请：① 她的 `阶段` === 5；② 暴露度达标 —— 郝佳期看 `玩家.察觉值.母亲欲望` ≥ 100，其他 11 位看 `群.成员详情.{UID}.暴露度` ≥ 100。
    满足后由苏媚在 `元数据.日数 % 7 == 0` 当天发邀请（写进 `群` 事件）；发出不撤回；她去了之后 `统计.暴露次数` +1，暴露度保持 100 不再回落。
    ★ 你只写上面这几个变量；派对本身的写法与尺度见该条目，不要在这里重复。
  _backdoor: |
    ★ 弱点后门（三步走的判定与后果见 [mvu_plot]D20对抗判定系统 · 九）
    发现：`后门已发现`=true，`后门进度` +5~+20 ｜ 点破（进度≥60）：只写台词，不改数字 ｜ 使用（进度≥80 且「后门反抗」判定成功）：`后门已利用`=true
    使用成功后给她 `暴露恐惧` -5~-10、`痴迷` +2~+5。
    ★ 反抗成功也不等于他赢，她仍然绝对主导 —— 这条不许因为任何数值而反转。
  _delta_rules: |
    ★★★ 单次更新幅度约束（违反则更新失败）★★★
    1. 阶段：单次只能 +1 或 -1，禁止跨阶段跳跃
       - /郝佳期/阶段、/群/成员详情/{UID}/阶段：单次 delta ≤ 1
    2. 阶段进度：单次 +5~+15，禁止一次 +50
    3. 心理变量（兴奋/润滑/理智/痴迷/罪恶感/勇气/暴露恐惧/欲望）：单次 ±2~±10
    4. 关系变量（关系.${亲密度|信任度|边界}、叛逆恐惧）：单次 ±1~±5
    5. 分数类（学业/成绩、警觉度、暴露风险、察觉值*）：单次 ±3~±15
    6. 累计统计（统计.${偷抚次数|诱导射精|假阳具使用|暴露次数}）：单次 +1，累计只增不减
    7. 后门进度：单次 +5~+20
    8. 暴露度：单次 +5~+20 / -3~-10
    9. 阶段守卫.已锁定=true 时：禁止更新任何阶段变量

  _ending_rules: |
    ★ 结局触发（完整条件与后果表见 [mvu_plot]阶段晋升系统 · 七）
    一旦触发，你只写这三个变量：`阶段守卫.已锁定`=true、`阶段守卫.结局已触发`=true、`阶段守卫.结局类型`={好结局·挣脱|好结局·理性|坏结局·法律|坏结局·暴露|隐藏结局·共生}；此后禁止更新任何阶段变量。
    ★ 高考日终局（`元数据.日数` ≥ `高考日`）当天必判，按 [mvu_plot]阶段晋升系统 · 七 的顺序取第一条满足的。
    暴露风险换算：`玩家.察觉值.群存在` 每 +10 → `群.暴露风险` +5；暴露风险 ≥81 时，下一次现实接触必须写被目击的迹象。
  元数据:
    日数: { type: number, range: 1~ }
    小时: { type: number, range: 0~23, check: 跨日时归零联动/日数+1 }
    时段: { type: '早晨|上午|中午|下午|傍晚|夜晚|半夜', check: 跟随小时映射 }
    回合: { type: number, check: 每轮+1 }
    难度: { type: '普通|困难|地狱', check: 控制中心切换 replace }
    高考日: { check: 常量100，只读；剩余天数=高考日-日数，由D0每轮输出 }

  玩家:
    学业:
      成绩: { range: 0~100, check: 学习/上课/被妈妈盯着背书 +2~+5；被性事占用/熬夜/沉溺 -3~-8；与高考终局判定挂钩 }
    身体:
      体力: { range: 0~100, check: 性事/运动-5~-20，休息恢复 }
      性欲: { range: 0~100, check: 性事-10~-30，自然回升；与心理.欲望分工：性欲=生理阈值，欲望=堕落度 }
      不应期: { range: 5~60 }
    心理:
      理智: { range: 0~100, check: 受惊-5~-15，平静回升 }
      欲望: { range: 0~100, check: 堕落事件+2~+8，冥想/自救-3~-5；意志判定修正=(理智-欲望)/10 }
      兴奋: { range: 0~100, check: 性刺激+10~+30，释放归零 }
      怀疑: { range: 0~100, check: 矛盾线索+3~+10，澄清-5~-10 }
    技能:
      观察|行动|意志: { range: 0~100, check: 对应行为+2~+5（2026-09-22 上调：原 +1~3 太慢，17 天到不了 40） }
    察觉值:
      假阳具真相|群存在|母亲欲望|幻触: { range: 0~100, check: 可增可减。撞见/发现类+8~+30（幻触每次+3）；被解释/被安抚/被合理化-5~-15。事件阈值：幻触30·50／群存在50·60／母亲欲望50·70／假阳具真相60·80 }
    警觉度: { range: 0~100, check: 可增可减。D20失败类+5~+15，被安抚/入睡/沉浸性事-10~-30，≥81触发暴露事件；不跨日归零 }
    证据清单: { type: string, check: 调查成功时把新证据接在末尾（`、`分隔），整串 replace，只增不减；≥3件触发法律结局条件，上限5条 }
    今日:
      射精次数|幻触次数: { check: 当日累计，跨日归零 }
  局面:
    当前选项.${一|二|三|四}.文本: { type: string, check: ★★ 每轮都要重写一遍这四格（玩家点掉一格后面板会清空它，你不补，下一轮就没按钮了）。她这一关摆出来的这一条，拆成他能看懂的动作；不写正文，只写这里。四格固定，严禁 add 新键 }
    当前选项.${一|二|三|四}.等级: { type: '微|中|强|极', check: 决定面板判定 DC（微12/中15/强18/极22） }
    当前选项.${一|二|三|四}.代价: { type: string, check: 他想拦下来要付什么，按等级写量级 }
    当前选项.${一|二|三|四}.技能: { type: '观察|行动|意志', check: ★ 这一条要用哪个技能拦——不同选项要用不同技能。四条里最少要有两种不同技能 }
    她已选: { type: '一|二|三|四|', check: 她从中挑走的那一条，本轮主线就是它 }
    自定义.文本: { type: string, check: ★ 玩家自己写要做的事（前端推给你），你只负责判它该用什么，不要改文字 }
    自定义.技能: { type: '观察|行动|意志', check: ★ 判断这件事实际靠什么能力：看出蹊跷=观察／动手做=行动／顶住不配合=意志 }
    自定义.等级: { type: '微|中|强|极', check: ★ 按这件事的越界程度定：微=顺着她、中=小动作、强=明显对抗、极=彻底翻脸或逃跑 }
    自定义.主对: { type: '识破|拦住|扛住|全场', check: ★ 这条主要考验哪一轮（同 当前选项.主对） }
    自定义.待掷: { type: boolean, check: ★ 你判完置 true，前端就会出「掷骰」按钮；掷完由前端置回 false }

  郝佳期:
    群等级: { range: 1~5, check: 竞赛升降级replace }
    积分: { check: 竞赛按名次+20~+100（冠军100/亚军70/季军50/参与20），打卡+5~+20，秘密任务+30~+80；扣分-5~-50 }
    阶段: { range: 1~5, check: 晋升+1，单次delta≤1，阶段守卫.已锁定=true时禁止更新。本字段是阶段唯一真源 }
    阶段进度: { range: 0~100, check: 显著堕落事件+5~+15,晋升归零,单次delta≤15 }
    阶段起始日: { check: 阶段晋升时 replace 为当前 元数据.日数；用于节奏判定（每阶段至少5-7天） }
    心理:
      兴奋|润滑: { range: 0~100, check: 性刺激+10~+30，高潮归零 }
      理智: { range: 0~100, check: 快感冲击-2~-5 }
      痴迷: { range: 0~100, check: 互动+1~+3 }
      罪恶感: { range: 0~100, check: 越界+2~+5，释放-3~-8 }
      勇气: { range: 0~100, check: 大胆行为+1~+3 }
      暴露恐惧: { range: 0~100, check: 暴露情境+5~+10 }
      此刻想法: { check: 每轮replace为当下内心想法(不超过40字)，无群聊/直播时为空 }
    关系:
      亲密度|信任度|边界: { range: 0~100 }
      叛逆恐惧: { range: 0~100, check: 主角发脾气/冷暴力/锁门/逃课倾向 +3~+10；她得手后主角仍黏她 -2~-5。低→她敢逼学习；高→她只敢"帮他减压" }
    统计:
      偷抚次数|诱导射精|假阳具使用|暴露次数: { check: 累计只增不减 }
    竞赛:
      今日排名: { type: 'number|null', range: 1~12 }
      今日得分: { check: 跨日重置 }
    后门已发现|后门已利用: { check: 识破/利用时true，不可逆 }
    后门进度: { range: 0~100, check: 攻略行为+5~+20 }
    ★暴露度: { check: 不设本字段。郝佳期的暴露度就是 玩家.察觉值.母亲欲望，两处是同一个事实，只写那次 }

  假阳具:
    当前持有者: { check: 每周结算replace为本周冠军UID }
    持有起始日: { check: 每周结算replace为当前日数 }
    持有到期日: { check: 每周结算replace为日数+7 }
    绑定目标: { check: 静态（主角），只读 }
    共感强度: { range: 0~200 }
    今日使用: { check: 当日累计，跨日归零 }
    上次使用时: { check: 使用时更新 }
    是否激活: { check: 损坏时false }
    借用者: { check: 群竞赛借用奖励时写入借用者uid，借用结束时清空"" }
    借用期限: { check: 以周为单位；每次群结算-1，归零时同步清空借用者 }

  群:
    成员数: { check: 常量12，只读 }
    在线数: { check: 上下线同步 }
    活跃度: { range: 0~100 }
    今日主题: { check: 每日0:00清空为""（触发主题库注入），由D0抽签写入；可来自参考主题池，也可由苏媚即兴命题 }
