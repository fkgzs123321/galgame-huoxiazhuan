    后门进度: { range: 0~100, check: 攻略行为+5~+15 }

  阶段守卫:
    结局已触发: { check: 结局触发true,同步更新已锁定+结局类型,不可逆 }
    结局类型: { type: '好结局·挣脱|好结局·理性|坏结局·法律|坏结局·暴露|隐藏结局·共生|null' }
    已锁定: { check: 结局触发后true,不可逆 }
    后日谈已读: { check: 结局后日谈阅读后true，不可逆 }
