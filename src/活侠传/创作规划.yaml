# ══════════════════════════════════════════════════════════════
mvu:
  structure: |
    顶层结构（对应 schema.ts 的 10 个键）：
    ├── 世界        时间 / 地点 / 行动点 / 门派规模与三项门槛 / 随机种子
    ├── 你          基础六项 + 六项性格 + 八系 + 三教 + 抗性 + 战斗派生
    ├── 天赋        原作 124 项
    ├── 秘籍        77 本；师授 / 自学
    ├── 物品        品质五档（凡良优珍绝）
    ├── 装备        兵器 / 防具 / 暗器袋 / 饰品
    ├── 关系        玩家↔NPC，双向好感分开存 + 认知（他知道什么）
    ├── 关系网      ★ NPC↔NPC，键按两人名字典序拼
    ├── 前置        ★★ 已解锁 / 已错过 / 本旬已用 / 可见条件 / 计数
    ├── 任务        主线 / 支线 / 事件标记
    └── 战斗        对手 / 血量 / 气 / 状态 / 日志 / 摘要

  variables:
    # ── 世界（时间与门派）──
    - path: 世界.年
      type: number
      range: 1~99
      check: ★ 只由引擎在跨旬时推进，AI 不得写
    - path: 世界.月
      type: number
      range: 1~12
      check: ★ 同上
    - path: 世界.旬
      enum: [上旬, 中旬, 下旬]
      check: ★ 同上。一旬三行动，用完即跨旬
    - path: 世界.行动次数
      type: number
      range: 0~5
      description: 本旬剩余行动点。基础 2，可升级到 5；本卡默认 3
      check: ★ 由引擎扣，AI 不得写
    - path: 世界.门派规模
      type: number
      range: 1~6
      description: 六阶段：日薄西山 / 云开见日 / 喷薄欲出 / 旭日东升 / 如日方中 / 烈日当空
      check: ★ 由引擎按 门人/向心/贡献度 三项门槛算，只升不降
    - path: 世界.随机种子
      type: number
      description: ★ 确定性伪随机（对应原作 FreeRandomState）。判定与战斗都读它，禁用 Math.random
      check: ★ 由引擎在战斗后推进，AI 不得写

    # ── 前置与错过（★★ 本卡核心机制）──
    - path: 前置.已错过
      description: ★★ 永久关闭的分支。对应原作 _modifyFlagsWhenFalse
      check: ★ 由引擎在过期窗关闭时追加。AI 不得写，也不得提及
    - path: 前置.本旬已用
      description: 本旬已执行的行动名，、分隔
      check: 跨旬时由系统清空
    - path: 前置.可见条件
      description: 玩家可见的解锁提示。原作 663 次判定里只有 3 处会给玩家看
      check: 极稀有，不可随意添加
    - path: 前置.计数
      type: z.record
      description: 原作 TC 前缀计数器（TC0001 用了 122 次）

    # ── 关系（双向 + 认知）──
    - path: 关系.<角色名>.好感
      type: number
      range: -100~100
      check: 他对 <user> 的观感。单次幅度 ≤ 10
    - path: 关系.<角色名>.我的好感
      type: number
      range: -100~100
      check: <user> 对他的观感。★ 与上面分开存，两边看法可以完全不同
    - path: 关系.<角色名>.认知
      description: ★★ 他知道什么 —— 认知边界机制的载体
      check: 只有他「在场且感知到」才能追加。不可删减，只能追加
    - path: 关系.<角色名>.欠人情
      type: number
      range: -9~9
      check: 帮了他 +1，他帮了你 -1
    - path: 关系.<角色名>.状态
      enum: [未识, 相识, 相熟, 交心, 决裂]
      check: 逐级推进，不可跳级

    - path: 关系网
      type: z.record
      description: ★ NPC↔NPC。开局 21 对由引擎建好
      check: |
        ★★ 键必须是「两人名按字典序拼成 甲|乙」，如 "唐中翎|唐默铃"。
        写反了同一对会存成两条，一条查得到一条查不到。不确定时宁可不写

    # ── 战斗 ──
    - path: 战斗.状态
      enum: [无, 进行中, 已结束]
      check: ★ 由引擎写
    - path: 战斗.气
      type: number
      range: 0~10
      description: 绝招资源。嘴炮可破
    - path: 战斗.日志
      description: 逐回合记录，、分隔。★ 由引擎写，含数字，只给界面看，不给 AI

