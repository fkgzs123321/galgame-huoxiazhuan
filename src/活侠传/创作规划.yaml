# 引擎与代码（非标准段落，记录本卡的实现约束）
engine:
  层: 引擎层（脚本/引擎.js，106 方法，零内容）/ 契约层（脚本/契约.ts，所有具体数字）
  接入: 脚本/前置运行时.ts · 结算.ts · 战斗结算.ts · 关系.ts · 物品.ts
  自测: _work/test-engine.ts(39) · test-battle.ts(23) · test-rel.ts(40) · test-item.ts(38) = 140 项
  红线:
    - 引擎层不得出现世界观 / 角色 / 地点 / 道具名
