机制说明:
- 四师兄好感度与价格
- 四师兄的好感越高，则对应的售价越低。
- 每点好感打折 1%, 上限为原价的 50%
- 且每购买 1000 文, 会提高 1 点四师兄的好感度。
- 因此，若想要消耗最少金钱买到最多东西，则可以分批多次 1000 文购买。
- 四师兄购买后可以直接饮食
- 若从四师兄互动后，若有购买茶、酒或食物时，
- 可以在同一次行动中直接使用，
- 一次行动只能使用一次食物。
- (但折纸不行, 只能在下一次男弟子房中休息使用。)
- 四师兄贩卖物品类别
- 其他门派的武功秘笈
- 购买之后，可以到唐门后山等触发修炼，
- 练到一定成熟度之后可以有能力值的增减，
- 部分武功可以触发战斗技能与战斗特性。
- 色纸
- 可以用来折纸，提高变心值 2 点，
- 累积一定变心值(10 点以上)后，触发变心之梦。
- 可以用来变更心上人。
- 茶、酒水、食物
- 可以用来恢复心相、增减性情、内力等能力。
- 江湖快报
- 购买后可以用来触发部分对话与剧情，
- 每个月份的都很独特。