技能效果:
说明: 天赋/技能的获取方式与作用
  自恋:
    效果: 脸稍微好看一点点，武学－混元童子炁前置条件
    获取: 一年四月上旬－男弟子房镜子事件；更改心上人事件－选出尚未认识的对象条件
  儒学:
    效果: 修习武学条件
    获取: 《论语》LV5、LV10；《战神语录》LV5、LV10；《君子论剑》LV10；《孔夫子剑》LV10
  佛学:
    效果: 修习武学条件
    获取: 《罗汉拳谱》LV5
  道学:
    效果: 修习武学条件
    获取: 《全真剑法》LV5、LV10
  形意拳:
    效果: 修习武学条件
    获取: 《蛇形拳》LV5；《白猿通臂拳》LV5；《仙鹤迷踪拳 》LV10；《蛇兔鹰猿搏》LV10；《雷神脚》LV5 、LV10
  勇者:
    效果: 没有特殊效果，所以才是勇者
    获取: 与瑞笙决战中获得
  不坏金身:
    效果: 战役中可施展金刚罩
    获取: 秘笈《金钟罩》LV10
  南宫护心诀:
    等级: 1~3
    效果: 可抵挡致命攻击(血量归0时恢复10血)，并依据等级恢复气力20～40。； ；传功救大师兄时，需「29内力」、「54内力」、「南宫护心诀LV3」。；（需完成其中两项，收功会少算一项）
    获取: 《南宫心法》
  偕老誓:
    效果: 可抵挡致命攻击，并恢复气力。
    获取: [「云裳结缘」](/event/simple/3-05-1-云裳结缘)子事件[「九转疗伤」](/event/simple/3-05-1-九转疗伤)时，有南宫护心诀3级且战胜幻境南宫远。
  勇气:
    效果: 额外新增初始气力
    获取: 小师妹线选项，招亲当日选追上去。；；无药可救的故事(Demo线)中，送石帮主礼物后选择打架
  决战唐布衣:
    效果: 没空理你(龙湘保持闲置)
    获取: 无，外堡诬告事件中龙湘的状态。；；龙湘受你攻击或愤怒后，此技能会消失
  玄黄纳心纲:
    效果: 无说明
    获取: 夏侯兰线接受传功
  额外暗器:
    效果: 捅人、暗器追加暗器（倒数3T）
    获取: 《唐门暗器总纲》LV10
  毒功:
    效果: 捅人时附带50%毒・麻累积值
    获取: 《五毒密录》LV10
  无影爪:
    效果: 攻击爆击骰子+10（10~60伤害，期望值为35）
    获取: 《无影爪》LV10
  傲慢:
    效果: 造成伤害+50%,受到伤害+10%
    获取: 《酩酊玄剑掌》LV10
  飒踏流星剑:
    效果: 决斗开始第一回合，攻击力增加3倍(=造成4倍伤害)
    获取: 《流星剑谱》LV10
  君子风:
    效果: 性情、处世、修养中庸时，提升伤害与减免各20%
    获取: 《孔夫子剑》LV10；《君子论剑》LV10
  苦恼拳:
    效果: 当前心相低于平静时，每1点提升1%攻击力（最多33%）
    获取: 《苦恼拳》LV5
  如意境:
    效果: 身有防护罩类型状态时，提升自身拳掌，并有额外格挡率
    获取: 《玄玄如意指》；；在龙湘拜堂事件（※龙湘心上人专属事件），选择「湘姊，让我帮你报仇」，胜利或通过一定回合数获得。
  龙渊七绝:
    等级: 1~7
    效果: 根据六维（1级2%）提升伤害
    获取: 《玄玄如意指》；《龙渊七诀》
  折花手:
    等级: 1~?
    效果: 备揍时，有25%机率接住暗器。若接暗器成功，造成对手【胆怯】
    获取: [青城醒转](/event/simple/2-08-3-青城醒转)时接住青城弟子打翻的饭菜习得。；； 《拈花指法》，可在Demo线(无药可救的故事)中获得，但回到主线后技能与秘笈会消失。；； 已知下列NPC具有此能力：东西武林盟大院保卫战中的唐衫、灭门线万里鹏程（还有其他人）。
  逐浪诀:
    效果: 根据当前连击数，攻击有额外机率造成【失衡】
    获取: 《逐浪诀》
  铁琵琶功:
    等级: 1~4
    效果: 备揍挡住对手捅人时，扣对手气；；境界二以上，捅人可扣对手气；；境界三以上，攻防有机率造成【震撼】
    获取: 《铁琵琶功》
  借势:
    等级: 1~2
    效果: 回避成功时，根据等级回复气
    获取: 《很是用力踢》
  医术:
    等级: 1~7
    效果: 备揍时依据最大血量（1级2%）回复血量，最多 10%；；额外代谢毒麻累积值；；影响剧情分支
    获取: ▲秘笈《五毒密录》《温阳活血符》《备急千金要方》《伤寒杂病论》《太平圣惠方》《南宫武备论》《唐门药典》《八仙指》《难经》；；▲第一年南宫寿宴礼物选择大师兄的提议，二师兄好感度3星以上、无医术，去千金方打工；；▲第二年不留学千面人事件（需医术Lv1或Lv2）
  暗箭伤人:
    效果: 决斗开始时发射暗器造成伤害，并有机率造成【愤怒】
    获取: 已知下列NPC具有此能力：东西武林盟大院保卫战中的千面人魔店小二。
  金钱镖:
    效果: 暗器命中时造成大额麻痹累积
    获取: 无，大师兄的技能
  飞燕流星翎:
    效果: 境界三以上，暗器变成【飞燕流星翎】；；消费大量气造成暗器伤害，并生成四个暗器「飞燕流星翎」；；暗器「飞燕流星翎」：每回合自动射击造成伤害。敌方投射暗器时，会消耗存续时间并抵挡暗器。(持续3T)
    获取: 无，大师兄的技能
  投鼠忌器:
    效果: 二师兄唯恐损害丹房中的名药药物，不敢全力以赴。；【绝招封印】
    获取: 无，二师兄的技能。；初抵江陵之围对决樊啸天技能。
  万寿尸血针:
    效果: 受到伤害时，造成敌人毒麻累积
    获取: 无，二师兄的技能
  彼岸香:
    效果: 敌我每回合增加毒性累积值
    获取: 无，二师兄的技能
  温柔香:
    效果: 敌我每回合增加麻痹累积值
    获取: 无，二师兄的技能
  思想战:
    等级: 1~5?
    效果: 决斗开始时即有等同于LV的连击数，并获得LVx5的气
    获取: 不明，龙渊技能
  剑界:
    效果: 连击数>8时发动；；境界三以上，我方刀剑+30%、敌方刀剑-30%。根据刀剑落差提升招架机率。
    获取: 无，灭门线终战瑞笙，辅助者点苍双尊技能
  绝世:
    效果: 强大的气势令对手本能紧绷，一时动弹不得。使对方无法攻击。
    获取: 不明，铁冠道人(无相祖师)战役技能
  蛮勇:
    效果: 捅人不会被暗器打断，但受到伤害+50%(仅捅人对上暗器时)；；不会再获得迎难而上
    获取: 不明，部分莽夫敌人技能
  迎难而上:
    效果: 性情为莽夫、勇敢时专属，捅人不会被暗器阻止行动
    获取: 被暗器命中后触发
  提防暗器:
    等级: 1~3
    效果: 性情中庸、谨慎、懦夫专属，分别有60、70、80%抵挡暗器的伤害
    获取: 被暗器命中后触发
  焚心火印:
    等级: 1~3
    效果: lv3:属性为阳时每回合己方毒素累积+80，额外气+20(老阳时效果强化，测试为+30)
    获取: 《焚心火印》
  战术:
    等级: 1~9
    效果: 根据等级，提升战术类技能效果。；提高预判敌人行动机率(待确认)。；；影响剧情: 江陵围城前有战术1以上会无法取得《蛇兔鹰猿搏》；在雪山上战第三香后夏侯兰夸赵活的内容；未达战术5以上无法自组西武林盟
    获取: 《孙子兵法》+5；《杨家练兵操》+1；《历战血书》+1；《南宫武备论》+1； 《蛇兔鹰猿搏》+1
  疾如风:
    效果: 依据战术LV提升轻功(每级+2 or 2%)
    获取: 《逍遥游腿法》；《流星剑谱》
  徐如林:
    效果: 根据战术LV提升回气量(每级+1)
    获取: 《备急千金药方》；《伤寒杂病论》
  侵略如火:
    效果: 依据战术LV提升攻击(每级+0.02增伤)
    获取: 《杨家练兵操》
  不动如山:
    效果: 依据战术LV提升防御(每级+2%)
    获取: 《南宫心法》；《南宫武备论》
  难知如阴:
    效果: 依据战术LV提升嘴力(每级+2%)
    获取: 《历战血书》；《蛇兔鹰猿搏》
  战术诱导:
    效果: 根据【战术】技能等级，有更高机率看穿对手意图。
    获取: 不确定条件:习得玄玄如意指或是有过龙渊千面人事件就好；；龙湘线－插香后选「湘姊，让我帮你报仇」后打赢龙湘 / 通过一定回合数。；；如意境lv+1 习得战术诱导
  全真体操:
    等级: 1~5
    效果: 根据体力提升内力
    获取: 秘笈《全真剑法》
  铁布衫:
    等级: 1~5
    效果: 根据体力提升防御
    获取: 秘笈《金钟罩》
  点苍快剑:
    等级: 1~4
    效果: 根据轻功提升刀剑 (每级2%转化率，最高8%)
    获取: 《点苍剑谱》；《云裳剑法》
  金刚腿:
    等级: 1~5
    效果: 根据拳掌提升轻功、防御(每级2%转化率，最高10%)
    获取: 《金刚腿》
  孟子曰:
    效果: 敌人愤怒时发动，嘴攻变为【战神语录】(消耗等同嘴攻)；；使敌人行动无效并造成【内伤】
    获取: 《战神语录》
  三教合一:
    等级: 1~5
    效果: 根据已精通之儒道释学提升内力
    获取: 《全真天遁剑法》
  寂灭三摩地:
    效果: 拯救叶云裳的关键技能
    获取: 《九转残篇》
  九转轮回:
    效果: 可抵挡致命攻击，并恢复满血
    获取: [「云裳结缘」](/event/simple/3-05-1-云裳结缘)子事件[「九转疗伤」](/event/simple/3-05-1-九转疗伤)中，结缘叶云裳后获得。
  同舟剑法:
    效果: 有支援同伴时，全属性上升； ；且连击数>2时，绝招变为同舟剑法； ；无法使用点破云关
    获取: 《同舟剑谱》