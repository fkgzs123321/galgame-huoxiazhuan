---
# ══════════════════════════════════════════════════════════════
# 变量更新规则 —— ★ 本卡「数值由代码算，AI 只写剧情」的执行契约
#
# 三条铁律：
#   ① 时间只由行动点耗尽推进，AI 不得自行改 年/月/旬
#   ② 前置.已解锁 / 已错过 由引擎写，AI 不得碰
#   ③ 数值变化必须有剧情依据，且遵守幅度上限
# ══════════════════════════════════════════════════════════════
变量更新规则:

  世界:
    年:
      check: 仅当 行动次数 归零并跨旬时，由系统推进。AI 不得直接修改
      rule: 不可改
    月:
      check: 同上。一月三旬，下旬过后月 +1
      rule: 不可改
    旬:
      check: 行动次数 归零时，上旬→中旬→下旬→(月+1)上旬
      rule: 不可改
    昼夜:
      check: 白天的行动做完转入晚上；晚上再行动则跨旬
    天气:
      check: 每旬初随机或按剧情，一旦确定本旬内不变
      rule: 每旬最多改 1 次
    当前地点:
      check: 玩家移动到某地时同步
      rule: 每次行动最多改 1 次
    当前节点:
      check: 完成节点目标后由系统推进
      rule: 不可改
    行动次数:
      check: 每次行动 -1；集气/静坐等休整类可能不变
      rule: ★ 只减不加。归零即跨旬，不得负数
    行动上限:
      check: 门派规模提升或习得相关天赋时上调
      rule: 上限 3~6。第三旬通常更紧
    门派规模:
      check: 门人/向心/贡献度 同时达到阈值时 +1，见《门派发展》
      rule: 每次最多 +1，且需剧情明示（如新弟子入门、打退仇家）
    门人:
      check: 有人入门 +1；有人战死/退出 -1
    向心:
      check: 玩家为门派做事、替同门出头则升；只谋私利则降
      rule: 单次幅度 ≤ 10
    门派资产:
      check: 买卖、任务报酬、抄家所得
    名声:
      check: 江湖上被人称道或唾骂
      rule: 单次幅度 ≤ 10
    贡献度:
      check: 完成门派任务、交公
    门派好感:
      check: 与该门派的人往来、帮忙或得罪
      rule: 单次幅度 ≤ 15

  你:
    银两:
      check: 买卖、赏钱、月钱
    体力:
      当前:
        check: 劳作、练功、打斗消耗；休息、进食恢复
        rule: 单次幅度 ≤ 20
      上限:
        check: 习得相关天赋或长期锻炼
    内力:
      当前:
        check: 修练内功、运劲消耗
        rule: 单次幅度 ≤ 10
      上限:
        check: 突破或师授
    轻功:
      check: 练习身法、逃命成功
      rule: 单次幅度 ≤ 5
    魅力:
      check: ★ 原作定名「你所没有的某种东西」。极难提升，几乎不动
      rule: 单次幅度 ≤ 2
    学问:
      check: 读书、听课、抄书
      rule: 单次幅度 ≤ 5
    道德:
      check: 行侠仗义则升，欺压良善则降
      rule: 单次幅度 ≤ 8
    性情:
      check: 遇事退缩则降，挺身而出则升
      rule: 单次幅度 ≤ 8
    处世:
      check: 待人接物的方式
      rule: 单次幅度 ≤ 8
    修养:
      check: 忍耐、克制、临事不乱
      rule: 单次幅度 ≤ 8
    心相:
      check: 受挫则降，得意则升
      rule: 单次幅度 ≤ 10
    阴阳:
      check: 修练的路子偏刚或偏柔
      rule: 单次幅度 ≤ 5
    嘴力:
      check: 与人斗嘴、说书、谈判
      rule: 单次幅度 ≤ 5
    锻造:
      check: 在锻冶场做工
      rule: 单次幅度 ≤ 10
    炼丹:
      check: 在炼丹房做工
      rule: 单次幅度 ≤ 10
    武学点:
      check: 练功、读秘籍
      rule: ★ 修练秘籍时消耗
    八系:
      check: 使用或修习对应兵器/招式时该系上涨
      rule: 单次幅度 ≤ 5
      暗器:
        check: 唐门本门。打杂、抄书、偷练都能涨
    三教:
      check: 听讲经、与僧道儒往来
      rule: 单次幅度 ≤ 5
    抗毒:
      check: 中毒后康复会微涨；服食解毒丹
      rule: 单次幅度 ≤ 3
    抗麻:
      check: 同上
      rule: 单次幅度 ≤ 3
    毒药:
      check: 身上带的毒药量。用暗器打中毒药时 +1
    麻痹:
      check: 同上
    战斗:
      check: ★ 全部由引擎按 体力/内力/轻功/八系/装备 派生，AI 不得直接写
      rule: 不可改
    称号:
      check: 达成特定条件后更换，见《称号链》
      rule: 需剧情明示

  天赋:
    check: 达成解锁条件或师授时 insert 新键
    rule: 键名为原作天赋名（如「唐门暗器」「金钟罩」）
    等级:
      check: 反复使用该天赋对应的能力
      rule: 上限 5

  秘籍:
    check: 获得秘籍时 insert
    已读:
      check: 读过至少一遍
    熟练:
      check: 反复修练
      rule: ★ 无「师授」则上限 40 —— 原作：无师长传授心诀，仅靠自学极难寸进
    师授:
      check: 得师长传授心诀
      rule: 一旦为 true 不再变回

  物品:
    check: 获得时 insert，用尽时 remove
    数量:
      check: 消耗品用一次 -1
    品质:
      check: 仅获得时确定，之后不变

  装备:
    check: 换装时 replace 对应位

  关系:
    check: 与某人往来后更新。★ 双向分开：好感是他对你的，我的好感是你对他的
    好感:
      check: 你的行为让他对你的观感变化
      rule: 单次幅度 ≤ 10
    我的好感:
      check: 你对他的观感变化
      rule: 单次幅度 ≤ 10
    认知:
      check: ★ 他知道的事。只有他「在场且感知到」才能追加
      rule: 不可删减，只能追加
    欠人情:
      check: 帮了他 +1，他帮了你 -1
    状态:
      check: 未识→相识→相熟→交心；决裂单独触发
      rule: 不可跳级

  关系网:
    check: ★ NPC↔NPC。只在剧情明确改变两人关系时更新，不主动补全
    rule: |
      ★★ 键必须是「两人名按字典序拼成 甲|乙」，如 "唐中翎|唐默铃"。
         写反了同一对会存成两条，一条查得到一条查不到。
         不确定时宁可不写 —— 开局那 21 对已由引擎建好。
    强度:
      check: 用 delta 加减，不要 replace 成绝对值
      rule: 幅度 ≤ 10；关系是走出来的，不是设出来的
    双向:
      check: 一边热一边冷时设为 false
      rule: 改成 false 要慎重，改回来很难
    类型:
      check: 同门/师徒/兄妹/父女/挚友/仇敌/断了
      rule: 断关系不删条目，改写 类型=断了 并留 曾经

  前置:
    已解锁:
      check: ★ 由引擎在判定通过时追加，AI 不得写
      rule: 不可改
    已错过:
      check: ★★ 由引擎在过期窗关闭时追加，AI 不得写，也不得提及
      rule: 不可改
    本旬已用:
      check: 每次执行行动后追加行动名
      rule: 跨旬时由系统清空
    可见条件:
      check: 仅当原作式明示条件触发时写入。全卡极少用
      rule: 不可随意添加
    计数:
      check: 按剧情增减，支持负数。原作 TC 前缀用于倒计时与惩罚
      rule: 计数器只增不减者，用 delta

  任务:
    主线:
      check: 主线目标变化时 replace
    主线节点:
      check: 主线推进时改
    支线:
      check: 接取时 insert，节点变化时改。完成时 节点 置为 clear
      rule: 完成即 clear，不删除
    事件标记:
      check: 发生值得记住的事就追加
      rule: 只追加不删除，、分隔

  战斗:
    check: ★ 全部由引擎逐回合演算后写入，AI 只读不写
    rule: 不可改

# ══════════════════════════════════════════════════════════════
# 特别约束
# ══════════════════════════════════════════════════════════════
特别约束:
  - 时间不可跳跃：一旬最多三次行动，做完就跨旬，不存在「几天后」
  - 行动点只用不攒：本旬没用完的行动点不结转到下旬
  - 错过不回滚：前置.已错过 里的内容不得以任何方式复活或提及
  - 战斗不写数：战斗过程的数值全部由引擎给出，AI 只负责把它写成场面
  - 幅度守限：任何单次数值变化不得超过上表 rule
  - 星级标记：上表中带 ★ 的条目为硬约束，违反视为本回合无效
