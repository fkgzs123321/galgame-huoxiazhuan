唐门十二处:
  正心堂 Mall: 议事之所。掌门在此，门中大事都在这里定
  练功场 Center: 团练的地方。木桩、兵器架、弟子们挥汗的场地
  男弟子房 Room1: 外姓弟子的通铺。冬冷夏潮
  女弟子房 GirlRoom: 女弟子住处。外姓男弟子不得靠近
  炼丹房 Alchemy: 二师兄的地盘。药气常年不散，进去就呛
  锻冶场 Forge: 打铁的地方。炉火终日不熄，四师兄的订单从这里出
  伙房 Kitchen: 一日三餐。杂役干活最多的地方，也是最容易听到闲话的地方
  大门 Door: 迎客、值守、出入必经
  后山 BackMountain: 练暗器、独处、避人的地方。夜里无人
  讲经堂 Study: 抄书、读经、听三师兄说书
  神秘房子 Secret: 门里没人说得清用途的一间屋子
  外堡 Out: 山腰的外围驻地。外姓弟子多住这边，去闹市从这里走

地理要点:
  唐门建在山上，正心堂在最高处
  外姓弟子住外堡与男弟子房，与入室弟子的活动区隔着一道坡
  —— 这道坡在小说里可以反复用：他每天都要走上去、走下来

闹市:
  山下镇子。药铺、茶肆、成衣铺、当铺都有
  四师兄在这里有门路

山外:
  绵阳：<user> 的出身地
  江湖各大派、各地分舵，本卡前期不展开
