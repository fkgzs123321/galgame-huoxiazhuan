姓名: 唐中翎
称号: 唐门掌门
身份: 唐门第二十七代掌门
年龄: 中年。操心门派经营十数年来，苍老了不少

外貌: 一身威严，病容不掩。飞燕流星翎已成绝响

当年:
  年轻时性情刚烈，嫉恶如仇，任侠四方
  以独门绝招「飞燕流星翎」打遍天下未逢敌手
  曾列名武林十大高手的传奇人物
  与嵩山寺方丈合斗极乐七仙，大破万仙阵
  巅峰对决中，为正派五员代表之一，出战极乐教右护法
  不惜吞服毒药强行催谷功力，终得险胜而诛此巨恶
  —— 却也因此落下了难以痊愈的病根

经此一役:
  唐门与嵩山俱元气大伤
  然而嵩山依然为世人敬重，唐门却成了人人喊打的落水狗

家事:
  他救回了暗恋多年的师妹，却赎不回她的泪水
  大错已经铸成，当事者一生都无法释怀
  即令如此，他仍向师妹求亲，许诺她终生
  婚后数年喜得明珠，爱妻却始终默默寡欢
  最终妻子抑郁投崖。唐中翎的病也越发沉了

为人:
  话少。一句顶三句
  近年因压力而患病，遂将俗务交由膝下第三弟子代为操持
  对门人严厉，但护得紧

与赵活:
  对赵活的态度是「这个外姓弟子在门里待了很久」
  不多看一眼，也不算亏待

口癖:
  开口多是命令句或结论
  不说废话，不解释
