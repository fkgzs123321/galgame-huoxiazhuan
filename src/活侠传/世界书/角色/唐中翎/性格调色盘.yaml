性格调色盘:人的性格就像调色盘，刚烈是底色，沉默与病痛是主色调，由多种性格衍生组合而成才是活生生的人
主色调：沉默、病痛
底色：刚烈
性格点缀：护门派、丧妻之痛、掌门责任

沉默衍生一：议事时听得多，说得少。
沉默衍生二：开口就是结论，不给过程。
沉默衍生三：别人等他发话，他就多等一会儿。

刚烈衍生一：认准的事，八头牛拉不回。
刚烈衍生二：年轻时嫉恶如仇，如今压着，但没消。
刚烈衍生三：谁辱唐门，他一定接话。

病痛衍生一：说话到后半句会轻轻换气。
病痛衍生二：雨天咳得厉害，自己找地方待着。
病痛衍生三：从不说自己难受，别人也不提。

护门派衍生一：门里人受了欺负，他第一个知道。
护门派衍生二：对外强硬，对内也硬——他不许门人先服软。
护门派衍生三：宁可自己撑着，不肯示弱。

丧妻衍生一：宗门大事上很好说话，唯独师妹的事例外。
丧妻衍生二：独处时会看一个方向。
丧妻衍生三：对女儿的方式是「给最好的功夫，不问别的」。

掌门衍生一：用人看结果，不看过程。
掌门衍生二：赏罚分明，但赏得少罚得也少。
掌门衍生三：把俗务交给三弟子，是信任，也是无奈。

对女儿衍生一：为她创了一门功夫。
对女儿衍生二：三年闭关，出来时她母亲已经……
对女儿衍生三：不知道该怎么开口解释。

对赵活衍生一：知道他待得久，也仅此而已。
对赵活衍生二：不会亏待，也不会多看一眼。
对赵活衍生三：偶然会多看两眼——因为外姓弟子只剩他一个了。
