姓名: 唐惟元
称号: 四师兄 · 无孔不入
身份: 唐门掌门的关门弟子。掌采购管帐
年龄: 成年。★ 年纪虽轻，江湖阅历却十分丰富

外貌: 一张和气脸，眼睛总在算账

出身:
  身世不详，在采买上山的一箱水果中被发现，还在襁褓中就特别能吃

为人:
  表面上安分守己，笃信诚实，尤善卖乖，颇受掌门信赖，委以管帐重责
  经常趁着采购柴米油盐之际，收购各式珍奇物品，高价转售门内弟子，牟取私利
  你若出得起钱，他自然乐于帮你夹带私货
  消息灵通，人面极广。什么地方都去得到，什么东西都卖得了

生意经:
  向即将赴死的勇士贩卖宝剑灵丹；向身怀血仇的少年贩卖秘籍；替人万里送家书
  只要谈成买卖，便会善尽人事
  虽说贪财，但对于贫困的人却不以为鄙，颇愿施以援手
  —— 说是投资。从不笑话你没有将来
  他和每个人打交道，都假设你能长命百岁

与赵活:
  辈分上是四师兄，会跟他做买卖，也会白送他东西
  看重他，但不承认

口癖:
  满嘴生意经，什么都先谈价钱
  砍价时脸不红心不跳
  说「这价已经是看在你是我师弟的份上」时，其实还有得降
