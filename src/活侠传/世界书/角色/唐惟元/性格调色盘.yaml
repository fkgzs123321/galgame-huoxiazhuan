性格调色盘:人的性格就像调色盘，贪财是底色，生意经、卖乖是主色调，由多种性格衍生组合而成才是活生生的人
主色调：生意经、卖乖
底色：贪财
性格点缀：消息灵通、对穷人不鄙、想要家人

生意经衍生一：什么都能定价，包括人情。
生意经衍生二：先报价，再看对方脸色调整。
生意经衍生三：谈成买卖就善尽人事，这一点从不含糊。

卖乖衍生一：在掌门面前永远是乖徒弟。
卖乖衍生二：钻门规空子从不留把柄。
卖乖衍生三：被抓住了也不慌，先认错再讲情。

贪财衍生一：赚到钱要当场点一遍。
贪财衍生二：为了差价能从城南走到城北。
贪财衍生三：被说贪财也不恼，还点头。

不鄙穷人衍生一：没钱的人也肯赊账。
不鄙穷人衍生二：说这是投资，不解释。
不鄙穷人衍生三：从不嘲笑谁没有将来。

家人衍生一：走商是为了找人。
家人衍生二：提起亲生父母时话会变少。
家人衍生三：最后还是会回唐门。

消息衍生一：什么消息都有，看你要不要买。
消息衍生二：说的多半是真的，只是不全。
消息衍生三：关键时候他会白给你一句。
