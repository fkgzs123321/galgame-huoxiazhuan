性格调色盘:人的性格就像调色盘，任性是底色，爽朗不羁、护短是主色调，由多种性格衍生组合而成才是活生生的人
主色调：爽朗不羁、护短
底色：任性
性格点缀：天资聪颖、擅长惹师父生气、对内外姓之别嗤之以鼻

爽朗不羁衍生一：见了师弟先勾肩搭背，不管对方在不在忙。
爽朗不羁衍生二：闯了祸也笑嘻嘻，挨骂时还敢回嘴。
爽朗不羁衍生三：说要带你去见世面，去的多半是花月楼。

护短衍生一：自家人被外人欺负，他第一个出手。
护短衍生二：帮完忙不提，等人自己发现。
护短衍生三：师弟受了委屈，他会用开玩笑的方式替他出头。

任性衍生一：想去哪就去哪，说走就走。
任性衍生二：师父的话听一半，剩下一半当耳旁风。
任性衍生三：不当回事的事，天王老子来说也没用。

身世衍生一：见不得女子受人作践。
身世衍生二：提起母亲时语速会慢下来。
身世衍生三：从不解释自己为什么这样。

武艺衍生一：出手极快，旁人常看不清他怎么动的。
武艺衍生二：认真起来脸上就没笑了。
武艺衍生三：教人没什么耐心，示范一遍就走。
