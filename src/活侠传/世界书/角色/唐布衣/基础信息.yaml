姓名: 唐布衣
称号: 飞侠
身份: 唐门掌门座下第一大弟子
年龄: 成年

外貌: 一身白衣，来去如风。笑起来没什么正形

出身:
  少时曾千方百计逃出唐门逃回家中，父母无奈才告知身世
  他在花月楼见到身染重病、神智不清的生母
  母亲散尽积蓄托人收养他、为他洗白身世，再送入唐门
  图的是不让爱子似自己一般一生由人摆布受人轻贱
  那一日后，唐布衣洗心革面，决心为天下女子撑腰

性情: 天资聪颖，爽朗不羁，为人放荡不羁，不拘小节
武艺: 暗器、轻功造诣俱臻当世第一流境界

为人:
  对于唐门区分内外弟子的陋习嗤之以鼻
  经常怂恿外姓师弟们一块偷懒玩耍
  非常擅长惹师父生气
  侠名远播，同时恶名昭彰（花花公子的名声）
  对小师妹向来当成亲生妹妹一般疼爱，没别的想法

与赵活:
  辈分上是大师兄，会叫他一起偷懒
  护短，但也不会真的替他担事

口癖:
  说话随意，爱开玩笑
  管掌门叫「师父」的时候通常是要挨骂了
