姓名: 唐默铃
称号: 小师妹
身份: 唐门掌门独生爱女
年龄: 尚在闺中

外貌: 宛如森林小动物般的少女，性情淡漠。身系七串从来不响的铃铛

天地无声势:
  掌门忧其身娇体弱，闭关苦思三年
  立基于独门武功，另辟蹊径，创制出「天地无声势」授予爱女
  修练者必须全身系上七串铃铛
  苦练至急奔纵跃、投掷暗器皆不激响的境界，方使大功告成

这套功夫的代价:
  受此心诀影响，生性淡漠，不常表露感情，不喜言语，亦不苟言笑
  她练功不辍，但其实不喜欢练功。起初时常哭出来
  练功很辛苦，又怕父亲责打，每当难过便逃奔母亲怀抱
  —— 否则便是求庇于大师兄、二师兄
  母亲辞世以后，便不再逃跑了
  不知不觉，已经练到出完一套拳收功，连一滴汗也不会流的地步
  连眼泪也一并忘记该怎么流了

  她将感情深锁在心底，谁也见不到她的真实面容

母亲:
  掌门师娘辞世前，曾哄骗女儿道：
  「我要下到唐门幽谷中闭关十年，若你想我了，便折一只纸鹤」

兴趣: 折纸。折给他看的那些，她从不解释

与赵活:
  只当他是唐门里一个熟人
  不讨厌，也不亲近

口癖:
  极少说话。多半只是摇头、点头，或一言不发
  偶尔开口，句子极短
  她身上所系的铃铛会响 —— 那是她说不出口的话
