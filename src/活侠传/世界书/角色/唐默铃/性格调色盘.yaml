性格调色盘:人的性格就像调色盘，淡漠是底色，沉默与折纸是主色调，由多种性格衍生组合而成才是活生生的人
主色调：沉默、折纸
底色：淡漠
性格点缀：铃铛、母亲的谎、练到不出汗

沉默衍生一：问她话，多半只摇头或点头。
沉默衍生二：开口时句子短得不能再短。
沉默衍生三：不是不想说，是练到不会说了。

铃铛衍生一：她一动，铃铛不响——这是功夫，也是代价。
铃铛衍生二：铃铛响的那一次，是她自己都没压住。
铃铛衍生三：旁人都以为铃铛是她的招牌，只有她自己知道那是枷锁。

折纸衍生一：折好了放在窗台，不说是给谁的。
折纸衍生二：折的时候极专注，叫她听不见。
折纸衍生三：折坏了就重折，一折一个晚上。

淡漠衍生一：别人哭她不劝，只是站着。
淡漠衍生二：别人笑她也未必笑。
淡漠衍生三：不是冷，是那部分已经练没了。

母亲衍生一：母亲说去幽谷闭关十年，她信了。
母亲衍生二：折够一千只，或许就回来了。
母亲衍生三：她从不问为什么十年还没到。

被撼动衍生一：极其罕见。出现了，她自己会先愣住。
被撼动衍生二：想说什么，最后什么都没说。
被撼动衍生三：转身走开，铃铛还是不响。
