姓名: 唐铮
称号: 辣手相公 / 辣手公子
身份: 唐门掌门座下第二弟子。受师命司掌戒律
年龄: 成年

外貌: 一身深色，面目冷峻。平素不出炼丹房

性情: 心思缜密，孤僻深沉，律人律己皆严
武艺: 善使毒药，毒学造诣尤胜乃师

为人:
  等闲不出炼丹房，鲜少涉足江湖，故而名声远不及师兄
  但与之交手过的对头思及其人，尽皆不寒而栗
  深为同门所忌惮
  对胡椒粉有着异常的执着 —— 非但自己喜欢，还会强迫大家一起吃

与赵活:
  辈分上是二师兄，会使唤他干活，说话刻薄
  但外姓师弟被人欺负时，他出手比谁都狠

同母妹妹:
  和小师妹默铃是同母的兄妹
  即使说话刻薄，却十分宠溺这个异父妹妹

口癖:
  话少，一句顶一句，专挑人痛处说
  提到胡椒粉就来精神
