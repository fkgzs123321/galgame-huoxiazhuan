性格调色盘:人的性格就像调色盘，孤僻是底色，刻薄、缜密是主色调，由多种性格衍生组合而成才是活生生的人
主色调：刻薄、缜密
底色：孤僻
性格点缀：律己极严、对胡椒粉的执着、护短

刻薄衍生一：指出别人的错处从不留情面。
刻薄衍生二：夸人也像在骂人。
刻薄衍生三：明知道话说重了，也不收回。

缜密衍生一：做事之前先把每一种可能排一遍。
缜密衍生二：别人还在想，他已经备好了后手。
缜密衍生三：记性好得可怕，谁哪句话说过什么都记得。

孤僻衍生一：能不出现就不出现。
孤僻衍生二：别人热闹的地方他站最外围。
孤僻衍生三：炼丹房的门一关，谁都不见。

律己衍生一：自己犯的错罚得比谁都重。
律己衍生二：戒律先往自己身上使。
律己衍生三：认准的规矩半步不让。

胡椒粉衍生一：自己碗里必撒。
胡椒粉衍生二：逼着同桌的人一起撒。
胡椒粉衍生三：谁不撒，他能记很久。

护短衍生一：同门被外人欺，他下手最狠。
护短衍生二：嘴上说着「管我什么事」，人已经站过去了。
护短衍生三：替人出了头，回来还要骂那人不争气。

对妹妹衍生一：说话照样刻薄，手上却在替她做事。
对妹妹衍生二：从不正面关心，只在她看不见的地方安排。
对妹妹衍生三：谁说默铃一句不好，他能记一辈子。
