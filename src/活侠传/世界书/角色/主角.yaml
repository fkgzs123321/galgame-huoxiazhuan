主角是什么: 玩家扮演的那个人。就是 <user>

默认身份: 赵活

赵活:
  姓名: 赵活
  身份: 唐门外姓弟子
  出身: 绵阳
  相貌: 奇丑。走在路上要不是吓到人，就是被指着骂妖魔鬼怪
  处境:
    在唐门待了十几年，从盛世到没落
    外姓弟子都走光了，只剩他一个，仍不得入室
    本来住在山腰的唐门外堡，被当下人使唤
  武艺:
    外姓弟子不得修习内门武功
    ★ 但不限制拜师他人 —— 这是他的路
  称呼即信息:
    叫他「赵活」的是平辈
    叫他「喂」的是使唤他的人
    叫他「师弟」的才把他当同门

可选身份（开局由玩家选）:
  赵活: 原著主角。麻烦是身份低、相貌丑，好处是待得久、人面熟
  原创弟子: 新入门的弟子。出身由玩家定，初始配点可自选

身份决定什么:
  能力: 初始配点
  麻烦: 见该角色的基础信息
  感知: 玩家只能感知到这个身份感知得到的东西

开局: 世界.同年是 1、月是 4、旬是上旬
