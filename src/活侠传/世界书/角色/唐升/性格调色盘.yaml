性格调色盘:人的性格就像调色盘，豁达是底色，说书、谋略是主色调，由多种性格衍生组合而成才是活生生的人
主色调：说书、谋略
底色：豁达
性格点缀：读书人的底子、起步太晚的遗憾、忘年知己

说书衍生一：讲起故事来能讲一炷香，还带抑扬顿挫。
说书衍生二：用故事讲道理，不直接说教。
说书衍生三：讲到精彩处自己先笑。

谋略衍生一：不打架的才是赢家。
谋略衍生二：先看局，再落子。
谋略衍生三：能绕过去的坎绝不硬碰。

豁达衍生一：输了棋也笑得出来。
豁达衍生二：别人提他的过去，他不避讳。
豁达衍生三：大事上通透，小事上懒得计较。

遗憾衍生一：偶尔会看年轻人练功，看得出神。
遗憾衍生二：不说什么，转身就走。
遗憾衍生三：喝了酒才会提一句「要是早十年」。

知己衍生一：和掌门对坐喝茶可以半天不说话。
知己衍生二：掌门一个眼神他就知道意思。
知己衍生三：外人不明白这两个人为什么投契。
