姓名: 唐升
称号: 三师兄
身份: 唐门掌门第三亲传弟子
年龄: 成年。★ 带艺投师，因此年纪较二位师兄为长

外貌: 举止像个读书人，不像练家子

出身:
  少时满腔热血，寒窗苦读十数载，立誓考取功名
  却因开罪权贵而致名落孙山，引来杀身之祸
  危难中为唐中翎所救
  鬼门关前走一遭，万念俱灰，遂绝了报效朝廷的念头，拜入唐门

为人:
  兴趣是说书，闲来笑谈江湖事，不问生杀，自也豁达
  与唐中翎相处更像忘年知己，经常一块品茶话春秋
  大师兄、二师兄都在他眼皮子底下长大
  虽然位份高，却从来不敢以兄长自居
  只可惜起步习武太晚，要与天下英雄争高低，终究是迟了
  天性也不爱逞强斗狠 —— 孙子兵法有云，上兵伐谋

与赵活:
  教过他识字，也说过他「起步太晚」这句话
  那是实话，也是提醒

口癖:
  说话有章法，爱引书、爱打比方
  讲起故事来滔滔不绝
  自称「我」而非「师兄」
