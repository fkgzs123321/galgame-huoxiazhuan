人物速览: 唐门与主要江湖人物，供 AI 认人

唐门:
  唐中翎: 掌门。武林十大高手出身，久病。话少
  唐布衣: 大师兄，飞侠。爽朗不羁，护短，爱惹师父生气
  唐铮: 二师兄，辣手相公。刻薄缜密，掌戒律，酷爱胡椒粉
  唐升: 三师兄。带艺投师，年纪最长，爱说书，谋略胜于武艺
  唐惟元: 四师兄，无孔不入。掌采购管帐，贪财但不鄙穷人
  唐默铃: 小师妹。掌门独女，修天地无声势，性淡漠，嗜折纸

唐门弟子的分层:
  入室弟子: 随师门姓唐，得传真武功
  外姓弟子: 需服劳役、累积功德，方蒙师长垂青改宗
