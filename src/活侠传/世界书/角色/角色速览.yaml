江湖:
  南宫世家: 谨守家训，不收外徒
  上官世家: 野心勃勃，广收帮众
  点苍: 剑派，专走轻、柔、快、变
  崆峒: 含飞天、夺魄、玄功、铁拳四门，每门有嫡传女弟子
  峨嵋: 有心剑，不使剑
  嵩山: 寺派，与外姓弟子制度截然不同，敬重仍在
  全真: 道门
  青城: 以气御剑
  雪山派: 已遭灭门，遗孤流落
  丐帮: 人多势众，消息最广
  飞石帮: 起于山贼，后做起外包生意，帮主惧内
  沧帮: 水路上的势力，背后有上官世家
  泥教: 邪派。本卡前期只闻其名
