势力: 火炎山剑阁
记载:
  - 位置
  - 火炎山
  - 主要成员
  - [[段纯青]] (总炉锻长)
  - 锻造名剑，炒作价格，周转于宋金之间，牟取暴利的军火商。
  - 百年前从[[崆峒派]]铁拳门分家出去独立，打造的兵刃是江湖一绝，人人争抢，连[[点苍派]]弟子也特地去求剑。
  - ## 备注
  - 游戏地图的火炎山在[[崆峒派|崆峒山]]的稍微西南一点，看地理位置不是新疆火焰山，应该是指其他山。
  - 天觞剑是火炎山剑阁铸造的。[^1]
  - [^1]: PTT C洽－[\[活侠\] 龙湘与奇怪的小知识P5](https://www.ptt.cc/bbs/C_Chat/M.1730548284.A.0F0.html)