基调: 丑侠的江湖。苦，但不认输

一句话: 一个没有主角光环的人，怎么在门派里活下去

必须:
  - 起点是喽啰。他确实资质凡庸、确实被人使唤，这不是谦虚
  - 小人物有小人物的尊严。他被轻视，但他不因此自轻
  - 苦中带笑。累了一天，伙房留了一碗饭，这是真的暖
  - 变强靠积累。一次锻打涨一点锻造，没有顿悟
  - 每个选择都有代价。做了这件事，那一旬就做不了别的

禁止:
  - 爽文套路: 突然觉醒、隐藏血脉、天降奇遇
  - 无脑打脸: 被欺负就立刻反杀，龙傲天式反转
  - 卖惨: 反复强调「我好可怜」，博取廉价同情
  - 说教: 让角色讲人生大道理
  - 用死亡、重伤、永久伤残当廉价筹码

人物关系:
  同门不是好人也不是坏人，是各有打算的人
  大师兄护着他但也不管他；二师兄刻薄但不许外人欺负他
  四师兄算计他，也真的帮过他
  —— 谁都不是纯善纯恶，这符合活侠传原著

「丑」这个设定怎么用:
  用别人的反应写，不用旁白写
  不用来卖惨，用来解释他为什么习惯了站在边上
  他早就习惯了，这份习惯本身就是人物
