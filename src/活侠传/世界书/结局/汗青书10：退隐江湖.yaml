  - 条件与流程
  - 条件：留学崆峒派，虞小梅加入唐门，心系：郁竹、郁竹好感度≧45
  - 流程：
  - 1. 第二年二月上旬唐门会议，选择**📜议题：(事件)我想去崆峒派留学**。
  - 2. 第二年十月下旬，满足虞小梅好感度≧20：虞小梅加入唐门。
  - 4. 第三年一月中旬，不随[大师兄](/people/characters/brother1)下山：
  - + 🎲**天命：需要多带帮手吗？....**(上限60、➕加值：[唐布衣](/people/characters/brother1)好感度）：
  - + **🧾【＜80】不需要**．
  - + **🧾【≧80】不需要，我和赵活就够了。**→**📖议题：我才不要去咧(激烈抵抗)**．
  - 5. 第三年，[[唐布衣|大师兄]]伤重被送回，技能医术≧5或总毒药点数≧，选择以下选项组合之一进行治疗[[唐布衣|大师兄]]：
  - + **📖抉择：决意**。
  - + **📖抉择：迟疑**→**📖抉择：大师兄不能死**→**📖抉择：决意**。
  - + **📖抉择：迟疑**→**📖抉择：大师兄不能死**→**📖抉择：迟疑**→**📖抉择：大师兄不能死**→**📖抉择：决意**。
  - + **📖抉择：迟疑**→**📖抉择：大师兄不能死**→**📖抉择：迟疑**→**📖抉择：大师兄不能死**→**📖抉择：迟疑**。
  - 6. 虞小梅出场后的选项选择**📖抉择：收功**。
  - 7. **心系：郁竹**，郁竹好感度≧45，**📖抉择：你要来我家看看吗？**，进入结局。
