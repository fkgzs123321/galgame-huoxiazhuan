  - 青城留学
  - 道可道，非常道。
  - 你所悟越深，能言越少，终至万籁俱寂，天地无声
  - 你没有留下足迹，不施不欠，就像自始自终不曾存
  - 在。
  - 流程
  - 青城留学期间，进行活动累积功勋点数，计点如下：
  - + 上清宫修真 +1
  - + 上清宫道士 +1
  - (误认地狱道时+0，拖五回合鬼卒助阵+1)
  - + 青城山镇医馆－青城弟子求诊 +2
  - + 常风观散步－吟啸、似有所悟、输给路人侠 -1
  - 二年九月下邹博归来后，拜访上清宫，若功绩点数≥6，触发嘉勉事件，选择【拜入青城】。