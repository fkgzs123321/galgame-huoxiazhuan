  - 被煮的狗
  - 兔死狗烹，你这走狗已经没有用了。用张大饼就能
  - 骗得你团团转，可真划算。
  - 条件与流程
  - 条件：道德＜40【坏人or恶徒】
  - 流程：
  - 第二年十月下旬，广州唐门袭击事件，选择**📖「弟子愿听师叔驱策！(背叛)」**(开启选项需到道德＜40【坏人or恶徒】)，与🗡️[掌门人](/people/characters/master)跟🗡️小师妹的决斗皆胜利。
  - 分歧与变化
  - 特定女性角色在唐门。
  - 下列角色在唐门时，剧情跟传奇文本会有差异。
  - + 叶云裳：剧情多出叶云裳被送回点仓派，传奇文本追记叶云裳及[叶云舟](/people/characters/special3)因此死亡
  - + 虞小梅：剧情跟传奇文本多出虞小梅被送回崆峒派。