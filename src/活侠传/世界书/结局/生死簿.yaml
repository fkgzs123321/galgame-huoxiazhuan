  - 生死簿 No.1
  - 砍死
  - 被砍了以后，就流血，然后死掉。
  - 在初遇叶家兄妹事件中其他战斗时战败都会触发
  - 南宫家贺礼送仇人后续战斗战败等。
  - 生死簿 No.2
  - 摔死
  - 重力与地面联手谋杀了你。
  - 1.登崖眺望选择休息后判定失败
  - 2.女子房埋伏，被小师妹开窗推下谷
  - 3.第一年五月下旬前触发后山砍柴（低机率）
  - 生死簿 No.3
  - 我憎恶著人间，一如人间憎恶我
  - 生命有不可承受之轻，心伤到绝地，
  - 了无生趣，死有何惧呢？
  - 生死簿 No.4
  - 毒死
  - 中毒而死。
  - 第一年四月上旬在炼丹房遇到二师兄选「正是找死，怎样」
  - 生死簿 No.5
  - 爆头
  - 你的脑壳爆掉了，场面异常血腥。
  - 一般指FPS游戏中的Headshot击杀。
  - 1.初遇叶家兄妹事件时，在船上选择装儍后骰出失败
  - 2.小师妹比武招亲晚上金乌上人来袭，选择围殴，打赢团战后，追击第一场对上铁拳弟子决斗战败且逃跑失败(不能留学崆峒派且入门铁拳门，不能小师妹、叶云舟、瑞笙同行下山，否则这场决斗直接跳过）
  - 生死簿 No.6
  - 谁也别想欺负我小师妹
  - 你为了捍卫小师妹，挺身而出做了一回英雄，
  - 纵使不为人知，亦死而无憾。
  - 在初遇叶家兄妹事件时，选择嘴他们，并且骰到80以上唬过后，与阎关三煞战斗时战败或是低血量
  - 生死簿 No.7
  - 屁力焦蛙
  - 从来没见过这种歹毒的武功，佩服佩服，失敬失敬。
  - 《Charlie's Angels》 台湾地区译名 -
  - 《霹雳娇娃》
  - 第一年四月上旬在伙房时，遇到大师兄骰到吓死