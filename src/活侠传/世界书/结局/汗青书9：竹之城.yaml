  - 你托人弄来了竹苗，在岛上种了一片竹林，自称城
  - 主，在竹林围绕之下享天年而终。
  - 条件与流程
  - 条件：留学崆峒派，虞小梅加入唐门，心上人郁竹、郁竹好感度≧45
  - 流程：
  - 1. 第二年二月上旬唐门会议，选择**📜「我想去崆峒派留学」**。
  - 2. 第二年十月下旬，虞小梅加入唐门(需要虞小梅好感度≧20)。
  - 3. 第三年一月中旬，不随[大师兄](/people/characters/brother1)下山。
  - + 🎲**天命：需要多带帮手吗？....**(上限60、➕加值：[唐布衣](/people/characters/brother1)好感度）：骰出**🧾【＜80】不需要**。
  - + 🎲**天命：需要多带帮手吗？....**(上限60、➕加值：[唐布衣](/people/characters/brother1)好感度）：骰出**🧾【≧80】不需要，我和赵活就够了。**，后续选择**📖「我才不要去咧(激烈抵抗)」**。
  - 4. 第三年一月下旬，[大师兄](/people/characters/brother1)重伤归来，选择治疗大师兄(开启选项需要医术≧5或总毒药点数≧250)。
  - + 选择**📖「决意」**。
  - + **📖「迟疑」**→**📖「大师兄不能死」**→**📖「决意」**。
  - + **📖「迟疑」**→**📖「大师兄不能死」**→**📖「迟疑」**→**📖「大师兄不能死」**→**📖「决意」**。
  - + **📖「迟疑」**→**📖「大师兄不能死」**→**📖「迟疑」**→**📖「大师兄不能死」**→**📖「迟疑」**。
  - 5. 虞小梅出场后的选项选择**📖「收功」**。
  - 6. 心上人郁竹，郁竹好感度≧45，选择**📖「没有」**，进入结局。
  - 分歧与变化
  - 角色属性
  - + 性情≧60【勇敢、莽夫】：影响结局前部分对话。
  - + 道德＜40【坏人、恶棍］：影响结局前部分对话。
  - + 修养＜60【中庸、暴躁、疯狂】：影响结局前部分对话。
  - + 战术≧2或学问≧50：会从郁竹的几句提示就推敲出大抵情势，影响结局前对话与传奇文本。