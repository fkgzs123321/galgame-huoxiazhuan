  - 条件：拜师夏侯兰，雪山行，道具有酒，心上人为夏侯兰
  - 流程：
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年三月上旬，需要进行门派抽签，入夺魂门时可认识夏侯兰
  - 第二次抉择**📖 抉择：为了师门名声赞同**。
  - 第二次抉择**📖 抉择：抱著被别派敌视的觉悟唱反调。**→**📖 抉择：无妨，我一起抽签便了，也省得令魏掌门为难**。
  - 3. **🎲 天命：门派抽签结果......**(上限 99)：骰出**🧾【＜ 75】夺魂门**，**加入夺魂门**。
  - 4. 第二年四月上旬动作前，被偷袭：
  - 1. **🎲 天命：结果......**(上限 90，➕ 加值：拳掌)：**🧾【＞ 50】防御成功**．
  - 2. **🆚 决斗：峨嵋弟子**需胜利 →**🆚 决斗：峨嵋弟子(&玄宫弟子《临阵指点》)**，败北或待第四回合结束战斗。
  - 3. 逃进森林后，🧾 议题任意选择，出森林，**🆚 决斗：峨嵋弟子(&玄宫弟子《临阵指点》)**，胜负不影响．
  - 4. 夏侯兰登场，第二次抉择**📖 抉择：以师礼拜谢**，**拜师夏侯兰**。
  - 5. 第三年六月上旬唐门会议，**📜 议题：(事件)雪山行**。
  - 6. 第三年七月中旬，七年之约事件：
  - 1. [[第三香]]登场，过程跟[[第三香]]生死不影响．
  - 2. 有酒类道具，让夏侯兰喝醉．
  - 3. 被夏侯兰点穴：
  - 4. 连续三次选择**📖 抉择：抵抗**(第二次选项开启需要夏侯兰喝醉，第三次选项开启需要心系：夏侯兰)，前三次 🎲 天命转盘结果不重要。
  - 5. 第四次天命转盘**🎲 天命：你的抵抗......**(上限 50，➕ 加值：夏侯兰好感度)：骰出**🧾【＝ 99】抵抗**．
  - 6. **🆚 决斗：夏侯兰**，败北被杀死．