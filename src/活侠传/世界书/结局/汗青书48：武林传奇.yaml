  - 武林传奇
  - 西武林盟
  - 耕阳读书斋将你的事迹编撰成书，发行于市。
  - 唐门活侠的大名一朝传遍中原，无人不知、无人不
  - 晓。
  - 你的名字，从今往后便是传说，受万人崇敬。
  - 条件与流程
  - 条件：西武林盟成功成立
  - 流程：
  - 1. 第三年十二月上旬最后一次行动前．[[众人的决策]]进入西武林盟剧情线．
  - 2. 第四年三月上旬，眉山决战，🗡️ 与武林盟主-[[瑞笙]]决斗，胜利后进入结局。
  - 分歧与变化
  - 战斗后选项
  - 传奇文本会战斗后选项改变。
  - 选择**📖「干了那么多坏事还想体面？去死！］**：[[瑞笙]]死亡、没有扮黑脸。
  - 选择**📖「有人必须为此负责。」**，或选择**📖「你有什么遗言？」**、再选择**📖「你已经做出选择了，就该负起责任。」**：[[瑞笙]]死亡，有扮黑脸。
  - 选择**📖「你有什么遗言？」**，再选择**📖「你应该将功赎罪。」**：[[瑞笙]]存活。
  - 主角结局
  - 选择**📖「干了那么多坏事还想体面？去死！］**，道德＜40【坏人、恶棍】：主角会没当上武林盟主，结尾前剧情会跟当上武林盟主时有很大差异。
  - 大师兄存活
  - 若[[唐布衣大师兄]]存活，会在结尾前剧情登场，
  - 四师兄归来
  - 若[四师兄](/people/characters/brother4)之前有归来，会在结尾前剧情登场。
  - 结缘对象
  - 根据结缘对象，结尾剧情会有差异，并取得对应的[风云史](/event/achievements/)。
  - ※武林传奇结缘优先度(v1.0.3200.2)：唐默铃＞龙湘＞夏侯兰
  - 夏侯兰：雪山派大弟子
  - 唐默铃：唐门女婿
  - 龙湘：忘忧侠侣
  - 小师妹回唐门
  - 若小师妹有出嫁，且[[瑞笙]]存活，结尾前剧情小师妹会回到唐门。(但是战斗后对话[[瑞笙]]有扮黑脸时才会赶后宫走，明显与此结果不符合）