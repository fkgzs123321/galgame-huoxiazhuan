  - 条件与流程
  - 条件：[[李富贵]]好感度＜20、技能：战术＜5或技能战术＜8，学问＜60
  - **流程：**
  - 1. 第三年十二月上旬最后一次行动前。[[李富贵]]好感度＜20、[[金乌上人]]存活或技能：战术＜5或技能战术＜8，学问＜60，进入[[众人的决策#_2%EF%B8%8F⃣无法成立西武林盟的决策|无法成立西武林盟的决策]]。
  - 2. 进行战他娘亲与退隐江湖进行投票：[[唐惟元|四师兄]]归来时多出[[唐惟元|四师兄]]投票，与小师妹结缘时多出小师妹投票
  - + 主角的决策：
  - + **📜议题「决策：战他娘亲」**：战他娘亲＋１票。
  - + **📜议题「决策：退隐江湖」**：退隐江湖＋１票。
  - + **🎲天命：三师兄的决策......**(上限70，➕加值：名声)：
  - + 骰出**🧾【＜60】遣散门人**：退隐江湖＋１票。
  - + 骰出**🧾【≧60】战他娘亲**：退隐江湖＋１票。
  - + **🎲天命：四师兄的决策......**(上限99，➕加值：名声)：
  - + 骰出**🧾【＜80】遣散门人**：退隐江湖＋１票。
  - + 骰出**🧾【≧80】战他娘亲**：退隐江湖＋１票。
  - + **🎲天命：小师妹的决策......**(上限99，➕加值：唐默铃好感度*0.1)：
  - + 骰出**🧾【＜30】纸被折成纸鹤了**：废票。
  - + 骰出**🧾【＜70】退隐江湖**：退隐江湖＋１票。
  - + 骰出**🧾【≧70】跟师兄一样**：主角的票数＋１。
  - 4. 满足以下条件，决定遣散唐门：
  - + 退隐江湖票数较多。
  - + 票数相等且主角选择退隐江湖，与🗡️[[唐升|三师兄]]决斗胜利。
  - + 票数相等且[[唐升|三师兄]]选择退隐江湖，与🗡️[[唐升|三师兄]]决斗败战。
  - 5. 前往大门，未满足其他遣散唐门系列结局(汗青书24~31)条件，进入结局。
