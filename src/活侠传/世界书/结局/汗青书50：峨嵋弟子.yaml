  - 你成为峨嵋弟子，享受和旁人一样的待遇与义务。
  - 以武林一员的身分参与了几件武林大事，无功无过
  - ，老了退隐。
  - 条件与流程
  - 条件：不留学
  - **流程：**
  - 1. 第二年二月上旬，直接选择**📜「退席」**，不去留学。
  - 2. [[唐娇娇]]登场比武事件：
  - 第二年二月上旬至第二年四月下旬，在练武场进行团练累积两次，第二年五月上旬唐门会议前发生[[唐娇娇]]登场比武事件。
  - 第二年五月期间，在练武场进行团练第二次后发生[[唐娇娇]]登场比武事件。
  - 3. 选择**📖「我就偏不信，上前领教」**，🗡️ 与[[唐娇娇]]决斗胜利，选择**📖「好，成亲吧」**，进入结局。
