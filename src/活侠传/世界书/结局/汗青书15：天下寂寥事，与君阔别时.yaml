  - 结缘
  - 仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换
  - 不了她嫣然一笑。活该一生煎熬，来赎她眼泪。
  - 流程
  - 1. 收留叶家兄妹。
  - 2. 二年不留学住破庙，防守唐门，心上人叶云裳，触发青城留学。
  - 2. 三年一月上，叶家兄妹去留转盘【叶云裳抵抗】。
  - 3. 三年三月期间，前往练功场或后山五次，发生[[唐惟元|四师兄]]邀请加入商队事件，第二选项选择**📖【好。】**
  - 4. 心上人叶云裳，叶云裳好感度≧40，进入结局。
  - 备注
  - 必须有青城留学，否则三年一月转【叶云裳抵抗】后，仍然会去金国。