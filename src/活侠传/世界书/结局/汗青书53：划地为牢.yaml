  - 谁也没留你，你却不舍走远。终你一生，困守于她
  - 坟前，流泪忏悔，可她怎会答应？
  - 条件
  - [青城醒转](/event/simple/2-08-3-青城醒转)事件中，道德＞20(坏人以上)，[[申屠龙]]想要把脉时，选择【不要】开打，战斗胜利。
  - 备注
  - 若道德≤20(恶棍)，会触发生死簿95「快剑封喉」。
  - 战斗只有四回合，而且第一回合因为【绝世】无法动弹，需靠大量天命点强化才可能成功。