  - 条件：留学崆峒派
  - 流程：
  - １、在擂台被打死
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. **📜 议题：(移动)无色广场**，**(自由)赌场**(开启需要银两 ≧2000)，累积赢得 5000 银两时发生抢劫，**📖 抉择：不给**．
  - 3. \*\*🆚 决斗：夺魂弟子(&铁拳弟子《铁壁神拳》，战败后被打死．
  - 郁竹≧20：追加郁竹《大铁锤》为我方决斗帮手．
  - ２、在玄宫弟子打死(疑似 Bug)
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年三月上旬，到达崆峒派，第二次抉择：
  - **📖 抉择：为了师门名声赞同**：➡️3.抽签
  - **📖 抉择：抱著被别派敌视的觉悟唱反调**：
  - **📖 抉择：我要去玄功们**：➡️4.加入玄功门
  - **📖 抉择：无妨，我一起抽签便了，也省得令魏掌门为难**：➡️3.抽签
  - 3. 抽签：**🎲 天命：门派抽签结果......**(上限 99)：**🧾【＜ 50】玄功门**：➡️4.加入玄功门
  - 4. 加入玄功门．
  - 5. 第二年三月中旬动作前，虞小梅带领游览崆峒派到玄功洞时，**📖 抉择：到小菊身边去**，**🆚 决斗：玄功弟子**，败战后被杀死．
  - ※整个莫名其妙，跟剧情毫无关系，疑似 Bug．(版本 1.0.3203.1)