  - 唐门覆灭
  - 夏侯兰
  - 结缘
  - 有了孩子以后，夏侯兰冰冷的心最终化了，而你也
  - 失宠了。
  - 她专心相夫教子，经常庆幸孩子像她不像你，也不
  - 许你打骂小孩，极端宠腻。
  - 为了孩子能有良好的教育，某天出门活捉了魏菊回家
  - 担任夫子。
  - 条件与流程
  - 条件：与夏侯兰结缘，进入顽抗到底剧情线．
  - **流程：**
  - 一、与夏侯兰结缘
  - 1. 第二年二月上旬唐门会议，**📜议题「我想去崆峒派留学」**。
  - 2. 第二年三月上旬，需要进行门派抽签，入夺破门始可认识夏侯兰
  - + 第二个选择**📖选项「为了师门名声赞同」**。
  - + 第二个选择**📖选项「抱著被别派敌视的觉悟唱反调。」**，第三个选择**📖选项「无妨，我一起抽签便了，也省得令魏掌门为难」**。
  - 3. **🎲天命：门派抽签结果......**(上限99)：骰出**🧾【＜75】夺魂门**，加入夺魂门。
  - 4. 第二年四月上旬，被偷袭，**🎲天命：结果......**(上限90，➕加值：拳掌)：骰出**🧾【＞50】防御成功**，🗡️与峨嵋弟子决斗胜利，🗡️再与峨嵋弟子决斗败战或待第四回合结束战斗。
  - 5. 逃进森林后，第一个选项后，🗡️出森林与峨嵋弟子再度决斗，胜负无关，第二个选项后，第三个选项选择**📖「以师礼拜谢」**，拜师夏侯兰。
  - 6. 第三年六月上旬唐门会议，**📜议题「雪山行」**。
  - 7. 第三年七月中旬被夏侯兰点穴后，连续三次选择**📖「抵抗」**(第二次选项开启需要被点穴前身上的道具有酒让夏侯兰喝醉，第三次选项开启需要心上人为夏侯兰)，前三次天命转盘结果不重要。
  - 8. 第四次天命转盘**🎲天命：你的抵抗......**(上限50，➕加值：夏侯兰好感度)：骰出**🧾【＝99】抵抗**。
  - 9. 🗡️与夏侯兰决斗胜利，与夏侯兰结缘，第三年八月上旬获得【夏侯兰的发带】。
  - 二、唐门围攻战
  - 1. 第三年十二月上旬最后一次行动前．[[众人的决策]]进入顽抗到底剧情线．
  - 2. 唐门围攻战：开始时间根据[[众人的决策]]的结果有差异
  - + [[众人的决策]]为1️⃣成立西武林盟的决策：第四年二月中旬剩下２个行动时开始．
  - + [[众人的决策]]为2️⃣无法成立西武林盟的决策：第四年一月中旬剩下2个动作时开始．
  - 3. **🎲天命：弟子出走结果......**(上限50，➕加值：向心/2)：
  - + **🧾【＝99】一个都没走**：门人-0．