  - 离开唐门
  - 你背叛了唐门。你说，是为了生存，为了荣华富贵
  - ，但内心深处，你知道自己背叛了那份比血还浓的
  - 师徒情。
  - 条件
  - 1. 一年四月中～二年一月下，贡献度<-150，因太懒散被逐出唐门。
  - 2. 二年不留学住在破庙，二年八月中道德坏人以下，选择【我要他妈的攻打唐门呀！】。二连战全部获胜，被掌门逐出唐门。