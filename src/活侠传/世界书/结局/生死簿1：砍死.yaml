  - 一、前往江陵途中被砍死
  - 1. 第二年二月上旬－唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年八月上旬，得知江陵城被泥教围攻，离开崆峒派，出发与唐门会合．
