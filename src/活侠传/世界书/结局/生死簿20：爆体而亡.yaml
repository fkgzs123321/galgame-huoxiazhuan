  - 条件：留学崆峒派
  - 流程：
  - １、练雪山心法走火入魔
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年三月上旬，需要进行门派抽签，入夺魂门时可认识夏侯兰
  - 第二次抉择**📖 抉择：为了师门名声赞同**。
  - 第二次抉择**📖 抉择：抱著被别派敌视的觉悟唱反调。**→**📖 抉择：无妨，我一起抽签便了，也省得令魏掌门为难**。
  - 3. **🎲 天命：门派抽签结果......**(上限 99)：骰出**🧾【＜ 75】夺魂门**，**加入夺魂门**。
  - 4. 第二年四月上旬动作前，被偷袭：
  - 1. **🎲 天命：结果......**(上限 90，➕ 加值：拳掌)：**🧾【＞ 50】防御成功**．
  - 2. **🆚 决斗：峨嵋弟子**需胜利 →**🆚 决斗：峨嵋弟子(&玄宫弟子《临阵指点》)**，败北或待第四回合结束战斗。
  - 3. 逃进森林后，🧾 议题任意选择，出森林，**🆚 决斗：峨嵋弟子(&玄宫弟子《临阵指点》)**，胜负不影响．
  - 4. 夏侯兰登场，第二次抉择**📖 抉择：以师礼拜谢**，**拜师夏侯兰**。
  - 5. **📜 议题：(移动)夺魂森林**，累积两次随机发生分心看师傅，惹师傅生气(夏侯兰好感度-1)→**📖 抉择：因为师父好看**．
  - 6. **📜 议题：(移动)夺魂森林**：
  - 1. 夏侯兰好感度分歧：
  - 夏侯兰好感度＜ 35：**📖 抉择：我不要啦！**：➡️2.夏侯兰提建议．
  - 夏侯兰好感度 ≧35：➡️2.夏侯兰提建议．
  - 2. 夏侯兰提建议：**📖 抉择：好吧**
  - 3. **🎲 天命：修练成效......**(上限 99，➕ 加值：修养、心相，➖ 减值：内力)：**🧾【＜ 20】走火入魔**，自爆死．
  - ２、被魏菊运功治疗炸死
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年十月上旬江陵围城与丐帮决战，王二壮叫阵，
  - 1. **🎲 天命：挑战者是......**(上限 99)：**🧾【≦80】不妙的人出手了**．
  - 2. 满足心系：魏菊：替魏菊接掌．
  - 3. **📖 抉择：好**．
  - 4. **🎲 天命：运功疗伤......**(上限 40，➕ 加值：内力)：**🧾【＜ 80】爆体而亡**，被炸死．