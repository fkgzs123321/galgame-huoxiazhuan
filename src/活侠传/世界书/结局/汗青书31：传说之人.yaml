  - 世人众说纷纭，都想知道那位头戴人皮面具的前辈
  - 高人是何方神圣，然而，你那天根本没戴面具。
  - 条件与流程
  - 条件：与夏侯兰结缘、道德≧60【好人、侠客】、遣散唐门
  - **流程：**
  - 一、与夏侯兰结缘
  - 1. 第二年二月上旬唐门会议，**📜议题「我想去崆峒派留学」**。
  - 2. 第二年三月上旬，需要进行门派抽签，入夺破门始可认识夏侯兰
  - + 第二个选项选择**📖选项「为了师门名声赞同」**。
  - + 第二个选项选择**📖选项「抱著被别派敌视的觉悟唱反调。」**，第三个选项选择**📖「无妨，我一起抽签便了，也省得令魏掌门为难」**。
  - 3. **🎲天命：门派抽签结果......**(上限99)：骰出**🧾【＜75】夺魂门**，加入夺魂门。
  - 4. 第二年四月上旬，被偷袭，**🎲天命：结果......**(上限90，➕加值：拳掌)：骰出**🧾【＞50】防御成功**，🗡️与峨嵋弟子决斗胜利，🗡️再与峨嵋弟子决斗败战或待第四回合结束战斗。
  - 5. 逃进森林后，第一个选项后，🗡️出森林与峨嵋弟子再度决斗，胜负无关，第二个选项后，第三个选项选择**📖「以师礼拜谢」**，拜师夏侯兰。
  - 6. 第三年六月上旬唐门会议，**📜议题「雪山行」**。
  - 7. 第三年七月中旬被夏侯兰点穴后，连续三次选择**📖选项「抵抗」**(第二次选项开启需要被点穴前身上的道具有酒让夏侯兰喝醉，第三次选项开启需要心上人为夏侯兰)，前三次天命转盘结果不重要。
  - 8. 第四次天命转盘**🎲天命：你的抵抗......**(上限50，➕加值：夏侯兰好感度)：骰出**🧾【＝99】抵抗**。
  - 9. 🗡️与夏侯兰决斗胜利，与夏侯兰结缘，第三年八月上旬获得【夏侯兰的发带】。
  - 二、遣散唐门
  - 1. 第三年十二月上旬最后一次行动前。[[李富贵]]好感度＜20、[[金乌上人]]存活或技能：战术＜5或技能战术＜8，学问＜60，进入[[众人的决策#_2%EF%B8%8F⃣无法成立西武林盟的决策|无法成立西武林盟的决策]]。
  - 2. 进行战他娘亲与退隐江湖进行投票：[[唐惟元|四师兄]]归来时多出[[唐惟元|四师兄]]投票。
  - + 主角的决策：
  - + **📜议题「决策：战他娘亲」**：战他娘亲＋１票。
  - + **📜议题「决策：退隐江湖」**：退隐江湖＋１票。
