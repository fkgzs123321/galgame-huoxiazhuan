  - 流程：
  - 1. 第三年十二月上旬剩下最后一个行动时，[[众人的决策]]进入**西武林盟**剧情线．
  - 2. 第四年二月中旬剩下两个动作时，西武林大会后开始[[东西武林盟会战]]，**📜议题：战役：唐门出击**．
  - 3. 中间过程有多种组合，大多不影响，除了以下满足以下条件时有特殊需求：
  - + [[武林大会]]未支持锦香宫，[[丹霞子]]未加入唐门，**📖抉择：紧闭大门**时，需要内力≧20且性情≧20．
  - + 承上，若还与夏侯兰结缘，需🗡️与[[万里鹏程]]决斗需胜利．
  - 4. 第一场⚔️战役胜负无关，**📖抉择：全力固守外堡**，⚔️战役败战后进入结局．
