  - １、被爱慕郁竹的人杀死
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. **📜 议题：(移动)铁拳巷**，第二次抉择选**📖 抉择：介入**，**🆚 决斗：夺魂弟子**，战败后被杀死．
  - ２、被爱慕虞小梅的人杀死
  - 1. 第二年二月上旬唐门会议，选择**📜 议题：(事件)我想去崆峒派留学**。
  - 2. 第二年三月中旬动作前，虞小梅带领游览崆峒派，结识虞小梅．
  - 3. 根据加入的崆铜门派选择对应议题，进行(自由)修练，随机发生虞小梅邀请跑步，**📖 抉择：追上去**．
  - 邀请跑步机率跟虞小梅好感度成正比．
  - 4. 跑步时随机发生**🆚 决斗：飞天弟子**，战败后被杀死．