  - 条件与流程
  - 条件：上官萤好感度 ≧30、心上人为上官萤、未与魏菊以外的人结缘、[[宋悲]]好感度＜ 20、道德＜ 40【坏人、恶棍】、门派规模＜ 3
  - 流程：
  - 1. 第三年十月中旬武林大会，上官萤好感度 ≧30，未与魏菊以外的人结缘、上官萤会说出她将被嫁到日本．
  - 2. 心系：上官萤，[[上官隼]]开放挑战时出现抉择，**📖 抉择：还是要去**，**🆚 决斗：[[上官隼]]**．
  - 3. 败北时满足[[宋悲]]好感度＜ 20、道德＜ 40【坏人、恶棍】、门派规模＜ 3，被[[上官隼]]杀死．
  - 备注
  - 与魏菊以外的人结缘时，如果结缘对象有同行到武林大会，上官萤会心想你身边已经有人了，为了不让你心有悬念，就不说出自己将远嫁日本．
  - 如果结缘对象没有同行道武林大会，上官萤会心想听说你身边已经有人了，为了不让你心有悬念，就不说出自己将远嫁日本．