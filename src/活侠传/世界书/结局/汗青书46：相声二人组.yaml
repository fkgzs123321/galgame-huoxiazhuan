  - 条件与流程
  - 条件：没有与人结缘、[[唐布衣|大师兄]]幸存，进入顽抗到底剧情线．
  - **流程：**
  - 1. 第三年十二月上旬最后一次行动前．[[众人的决策]]进入顽抗到底剧情线．
  - 2. 唐门围攻战：开始时间根据[[众人的决策]]的结果有差异．
  - + [[众人的决策]]为1️⃣成立西武林盟的决策：第四年二月中旬剩下２个行动时开始．
  - + [[众人的决策]]为2️⃣无法成立西武林盟的决策：第四年一月中旬剩下2个动作时开始．
  - 3. **🎲天命：弟子出走结果......**(上限50，➕加值：向心/2)：
  - + **🧾【＝99】一个都没走**：门人-0．
  - + **🧾【＞60】走了小部分人**：门人-5．
  - + **🧾【＞30】走了大部分人**：门人-20．
  - + **🧾【≦30】几乎走个精光**：门人归零，后面两场⚔️混战变成🗡️决斗．
  - 4. **🎲天命：第一战......**(上限99)：
  - + **🧾【＞60】足有100人**：
  - + 前面结果是**🧾【≦30】几乎走个精光**：🗡️与武林盟群侠决斗，需胜利．
  - + 其他：⚔️混战，需胜利．
  - + **🧾【＞30】三个高手**：无论对手是谁，🗡️决斗需胜利．
  - + **🧾【≦30】一个绝顶高手**：🗡️与[[万里鹏程]]决斗，需胜利．
  - 5. 冲下山去战他娘亲：
  - + 前面结果是**🧾【≦30】几乎走个精光**：🗡️与武林盟群侠决斗，需胜利
  - + 其他结果：
  - + **📖选项「全力突围」**：⚔️混战，胜负不影响．
  - + **📖选项「片甲不留」**：⚔️混战，需胜利→⚔️混战，胜负不影响．
  - 6. 🗡️与武林盟主－[[瑞笙]]决斗，胜利后，若没有结缘角色且[[唐布衣|大师兄]]幸存，进入结局．
