  - 慷慨就义
  - 战死
  - 你有路可活，可你非要做那唐门弟子，笑看生杀，
  - 慷慨赴义。
  - 条件与流程
  - 条件：无
  - 流程：
  - 1. 第三年十二月上旬剩下一个行动时，[[众人的决策]]，决定进入顽抗到底剧情线或西武林盟剧情线。
  - 顽抗到底
  - 1. 唐门围攻战：开始时间根据[[众人的决策]]的结果有差异．
  - + [[众人的决策]]为1️⃣成立西武林盟的决策：第四年二月中旬剩两次行动时开始．
  - + [[众人的决策]]为2️⃣无法成立西武林盟的决策：第四年一月中旬剩两次动作时开始．
  - 2. **🎲天命：弟子出走结果......**(上限50，➕加值：向心/2)：
  - + **🧾【＝99】一个都没走**：门人-0．
  - + **🧾【＞60】走了小部分人**：门人-5．
  - + **🧾【＞30】走了大部分人**：门人-20．
  - + **🧾【≦30】几乎走个精光**：门人归零，后面两场⚔️战役变成🆚决斗．
  - 3. **🎲天命：第一战......**(上限99)：
  - + **🧾【＞60】足有100人**：
  - + 前面结果是**🧾【≦30】几乎走个精光**：**🆚决斗：武林盟群侠**，战败后进入结局．
  - + 其他：⚔️战役，一败涂地进入结局．
  - + **🧾【＞30】三个高手**：无论对手是谁，🆚决斗战败后进入结局．
  - + **🧾【≦30】一个绝顶高手**：**🆚决斗：[[万里鹏程]]**，战败后进入结局．
  - 西武林盟
  - 1. 第三年十二月上旬剩一次行动时，[[众人的决策]]进入**西武林盟**剧情线．
  - 2. 第四年二月中旬剩两次动作时举办西武林大会后开始[[东西武林盟会战]]：
  - + 与小师妹结缘且**📖抉择：请小师妹守卫三师兄**：小师妹守唐门大院．
  - + **📜议题：决斗：护卫三师兄**：
  - 1. 🆚与两位刺客决斗，需胜利．
  - 2. **🎲天命：武林盟的消耗......**(上限50，➕加值：(西武林盟的)向心，➖减值：(武林盟的)向心，其他多种调整值)：
  - + 调整值列表与条件：
  - ➕设陷阱 5：[[众人的决策#说服峨嵋派|接管掌门牌令后设陷阱]]．
  - ➕四师兄的阴损伎俩 5：[[四师兄远游经商|四师兄回到唐门]]．
  - ➕嵩山十八铜人 10：[[福辒]]加入唐门．
  - ➕丐帮 15：[[众人的决策|由李富贵说服丐帮(新派)]]．
  - ➕丐帮 5：[[众人的决策#其他门派|大义分舵成为唐门外姓弟子]]