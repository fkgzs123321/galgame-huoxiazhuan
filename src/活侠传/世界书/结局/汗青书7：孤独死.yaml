  - 孤独死
  - 万籁俱寂，天地无声，你终于找到了安宁。
  - 条件与流程
  - 途径一: 南宫寿宴
  - 条件：
  - 南宫仇人线，大师兄邀请上台说相声时，选择📖退隐江湖。
  - 流程：
  - 第一年十月上旬，唐门会议决定南宫家寿宴礼时，🎲转盘骰出大师兄的建议。
  - [唐布衣](/people/characters/brother1)好感＜35、修养＜40【暴躁、疯狂】，解锁选项📖退隐江湖。
  - 途径二: 云裳结缘事件
  - 条件：
  - [「云裳诀别」](/event/simple/3-05-1-云裳诀别)的子事件[「山道之战」](/event/simple/3-05-1-山道之战)时，「战铁冠道人」获胜。
  - 流程：
  - [收留叶氏兄妹](/event/simple/1-08-1-叶氏行踪风波)。
  - 第二年二月上旬，不[留学崆峒](/event/simple/2-02-1-留学讨论)。
  - 第二年六月上旬，[离家出走住破庙](/event/simple/2-06-1-离家出走)。
  - 第二年八月中旬触发[留学青城](/event/simple/2-08-2-唐门迎敌)。
  - 第二年十二月上旬[「叶云舟归来」](/event/simple/2-12-1-叶云舟归来)时，有触发🚩听说寂灭三摩地。
  - 第三年一月上旬[「叶氏兄妹离去」](/event/simple/3-01-1-叶氏兄妹离去)时，让叶云裳留在唐门。
  - 第三年五月上旬[「师妹招亲后半」](/event/simple/3-05-1-师妹招亲后半)时，有满足🚩云裳结缘前置，以进入[「云裳结缘」](/event/simple/3-05-1-云裳结缘)系列事件。
  - [「云裳诀别」](/event/simple/3-05-1-云裳诀别)时，选择三次👉「软性对策」。
  - [「山道之战」](/event/simple/3-05-1-山道之战)时，「战段智秀」获胜，接「战铁冠道人」再获胜即可。
  - 备注：
  - 战斗特殊机制，见[「山道之战」](/event/simple/3-05-1-山道之战)条目。
  - 战斗只有八回合，且第一回合因为【绝世】无法动弹，需要大量天命点强化才可能成功。