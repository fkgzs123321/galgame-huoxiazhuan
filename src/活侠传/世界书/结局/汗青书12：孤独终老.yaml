  - 孤独终老
  - 你身边的花盛开又谢，来去匆匆，而你始终孤独。
  - 条件与流程
  - 条件：无。
  - **流程：**
  - 1. 第三年三月期间，前往练功场或后山五次，发生[[唐惟元|四师兄]]邀请加入商队事件，第二个选项选择**📖抉择：【好。】**
  - 2. 心上人不是唐默铃或唐默铃好感度＜30，进入结局。
  - 分歧与变化
  - 角色属性
  - 以下条件是否满足影响邀请事件部分对话，不影响传奇文本
  - + 处事≦40【知礼、娇情】
  - + 道德≦40【坏人、恶棍】
  - + 处事≧60【豪爽、粗鲁】
  - + 修养≦40【暴躁、疯狂】
  - + 学问≧45
  - + 道德≦40【坏人、恶棍】且修养＞40【中庸、沉著、君子】：邀请事件中获得1000银两。
  - 持有银两
  - 是否满足银两≧10000会影响邀请事件部队对话，不影响传奇文本。
  - 四师兄的好感度
  - [[唐惟元]]好感度≧45，[[唐惟元|四师兄]]是自己主动邀请加入商队，好感度＜45则是受[[唐升|三师兄]]之托邀请加入商队，不影响传奇文本。
  - 第一个选项
  - 影响选项后的对话，不影响传奇文本。
  - 大师兄与二师兄的好感度
  - 不影响传奇文本。
  - + [[唐布衣]]好感度≧45：知道[[唐布衣|大师兄]]生前想当相声戏子。
  - + [[唐布衣]]好感度≧40且[[唐布衣]]好感度≧[[唐铮]]好感度：对话中憧憬[[唐布衣|大师兄]]，
  - + [[唐铮]]好感度≧40且[[唐铮]]好感度＞[[唐布衣]]：对话中憧憬[[唐铮|二师兄]]。
  - + [[唐布衣]]好感度＜40且[[唐铮]]好感度＜40：对话中憧憬[[唐中翎|掌门人]]。
  - 心上人
  - 不影响传奇文本。
  - + 唐默铃：影响邀请事件部分对话，结局前会追加跟小师妹道别的场景，若第二年二月上旬有与小师妹约定离开时会先告知的事件(需要唐默铃好感度≧40)，道别时会多一句台词。
  - + 上官萤：影响邀请事件部分对话。