  - 一、与龙湘结缘
  - 1. 第三年十月中旬武林大会，锦香宫被揭发后，龙湘来投靠唐门时，选择**📖选项「不顾旁人冷眼收留龙湘」**，龙湘加入唐门．
  - 2. 第三年十二月上旬最后一次行动前．[[众人的决策]]进入顽抗到底剧情线．
  - 3. 第三年十一月中旬至第三年十二月下旬期间，至后山挑柴，随机看到龙湘练剑，选择**📖选项「我来告诉你，用剑」**，🗡️与龙湘决斗，胜负无关．
  - + 撞见龙湘练剑事件实际到第四年一月下旬期间都能触发，但如果在收到飞鸽传书的时间后才触发，则无法结缘．
  - 5. **📜议题「初识之时」**与**📜议题「初识之时」**(先后顺序无关)→**📜议题「龙湘的心事」**(开启议题需要心上人为龙湘)，
  - 6. **🎲天命：龙湘的反应......**(上限70，➕加值：龙湘好感度/2)：**🧾【≧60】说**→**📜议题「心魔」**→**📖选项「我有心上人，就是你．」**．
  - 7. 收到飞鸽传书，过程不影响，与龙湘结缘，获得【**龙湘的发簪**】．
  - + [[众人的决策]]为1️⃣成立西武林盟的决策：第四年一月下旬，收到飞鸽传书．
  - + [[众人的决策]]为2️⃣无法成立西武林盟的决策：第三年十二月下旬，收到飞鸽传书．
