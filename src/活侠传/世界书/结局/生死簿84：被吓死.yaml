  - 条件与流程
  - 条件：武林大会不支持锦香宫，[[丹霞子]]未加入唐门，成立西武林盟
  - 流程：
  - １、武林大会不支持锦香宫．
  - 1. 第三年十月中旬武林大会，锦香宫被揭发为人间到后，**龙湘不加入唐门**．
  - 龙湘好感度＜ 30、没有投靠唐门．
  - 龙湘来投靠唐门时选择**📖 抉择：局势未明了，避免连累师门，先不表态**．
  - 2. 锦香宫被正派围剿时，**📜 议题：(事件)袖手旁观**或**📜 议题：(事件)与正道同一阵线**，不支持锦香宫．
  - ２、西武林盟剧情线
  - 1. 第三年十二月上旬剩一次行动时，[[众人的决策|需要进入西武林盟剧情线]]．
  - 2. 第四年二月中旬剩两次行动时，[[东西武林盟会战]]：
  - 1. **📜 议题：(事件)战役：唐门出击**．
  - 2. [[丹霞子]]未加入唐门，**📖 抉择：闭紧大门**([[丹霞子]]加入唐门则不发生抉择)．
  - 3. 内力＜ 20 或性情＜ 20【懦夫】，被吓死．