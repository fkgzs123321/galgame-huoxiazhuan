  - 恩仇的尽头
  - 夏侯兰
  - 你的怒火将天边的云霞都烧得通红。
  - 报了恩，也报了仇。恩怨皆成灰，席卷上天，随风
  - 远去。
  - 条件与流程
  - 条件：留学崆峒派，拜师夏侯兰
  - **流程：**
  - 1. 第二年二月上旬，直接选择**📜「我想去崆峒派留学」**。
  - 2. 第二年三月上旬，进行门派抽签，
  - + 第二个选项选择**📖「为了师门名声赞同」**。
  - + 第二个选项选择**📖「抱著被别派敌视的觉悟唱反调。」**，第三个选项选择**📖「无妨，我一起抽签便了，也省得另魏掌门为难」**。
  - 3. **🎲天命：门派抽签结果......**(上限99)：骰出**🧾【＜75】夺魂门**，加入夺魂门。
  - 4. 第二年四月上旬，　被偷袭，**🎲天命：结果.....**(上限90，➕加值：拳掌)：骰出**🧾【＞50】防御成功**，🗡️与峨嵋弟子决斗胜利，🗡️再与峨嵋弟子决斗败战或待第四回合结束战斗。
  - 5. 逃进森林后，第一个选项后，🗡️出森林与峨嵋弟子再度决斗，胜负无关，第二个选项后，第三个选项选择**📖「以师礼拜谢」**，拜师夏侯兰。
  - 6. 第三年五月上旬，小师妹比武招亲当晚，[[金乌上人]]来袭，选择**📖「不讲武德群而殴之」**，⚔️混战败战。
  - 7. 随夏侯兰与[[解无尘]]杀上崆峒派，🗡️与[[金乌上人]]决斗胜利，进入结局。
  - 分歧与变化
  - 小师妹同行下山
  - 若小师妹同行下山（需要心上人唐默铃且唐默铃好感度≧50)，小师妹会被[[金乌上人]]点穴绑走，不影响传奇文本。