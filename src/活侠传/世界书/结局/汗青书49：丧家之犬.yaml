  - 条件与流程
  - 条件：举办西武林大会，[[南宫深]]好感度≧20。
  - 流程：
  - 1. 第三年十二月上旬剩下一个行动时，[[众人的决策]]，进入西武林盟剧情线。
  - 2. 第四年二月中旬剩下两个行动，举办西武林大会。
  - 3. 东西武林盟会战：
  - + **📜议题：决斗：护卫三师兄**：
  - 1. 两场🗡️决斗胜利，
  - 2. **🎲天命：武林盟的消耗......**(上限60，➕➖加减值：双方向心力及支援势力)：**🧾【＜90】遭遇顽强抵抗，损伤惨重** 或著 **🧾【＜45】损伤轻微，狠狠蹂躏了西武林盟**。
  - 3. ⚔️战役，战败时满足[[南宫深]]好感度≧20则进入结局。
  - + **📜议题：战役：唐门出击**，
  - 1. 防守外堡，过程有多种组合大多不影响，除了满足以下条件有特殊要求：
  - + 若[[武林大会]]未支持锦香宫，[[丹霞子]]未加入唐门，**📖抉择：紧闭大门**时，需要内力≧20且性情≧20．
  - + 承上，若还与夏侯兰结缘，需🗡️与[[万里鹏程]]决斗需胜利．
  - 2. ⚔️战役输赢无关，**📖抉择：兵分两路，一半固守外堡周旋，一半上大院准备决战：**。
  - 3. **🎲天命：大院的情况......**(上限60，➕加值：向心力及支援势力、➖减值：敌方向心力)：
  - + **🧾【＜30】唐门大势已去** 或著 **🧾【＜66】战况激烈**：
  - 1. **🎲天命：你的对手......**(上限99，➕加值：[[南宫深]]好感度、➖减值：上官萤好感度)：**🧾【＜70】南宫深（凤凰肩甲）**。
  - * ※若与夏侯兰或龙湘结缘，此步骤跳过。
  - 2. 🗡️与[[南宫深]]决斗，战败时未满足[[飞侠归来]]且满足[[南宫深]]好感度≧20，进入结局。
  - + **🧾【≧66】来得及时**：⚔️战役，战败时满足[[南宫深]]好感度≧20则进入结局。
  - 分歧与变化
  - 进入结局的方式
  - 只有🗡️与[[南宫深]]决斗战败的方式进入结局可以看到完整剧情．
  - 结缘对象
  - 若有结缘对象，不同的结缘对象，结局剧情跟传奇文本会有差异。
  - + 唐默铃：逃往东海
  - + 夏侯兰：回大雪山
  - + 龙湘：逃往金国
