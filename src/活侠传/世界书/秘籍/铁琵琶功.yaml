  - 铁琵琶功：
  - 备揍挡住对手捅人时，扣对手气。
  - 境界二以上，捅人可扣对手气。
  - 境界三以上，攻防有机率造成【震撼】(防御-50%)
  - ## 获得方式
  - 围城事件－心上人魏菊，替魏菊挡招后接受内功治疗，并答应拜入崆峒后获得(需内功≧40)
  - ## 备注
  - 崆峒秘宝，不得外传
  - 飞天门《一趾驭风》、夺魄门《镇魂功》、铁拳门《伤拳》、玄功门《铁琵琶功》，都是出自南岳真经的神通
