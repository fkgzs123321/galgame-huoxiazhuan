秘籍: 八门锁金刀
记载:
  - 青城秘笈，根据《奇门遁甲》中八门方位、星象、地形所制定的单人阵法。
  - 将此阵法分拆化简，融会入刀招，即成为八门锁金刀，精妙无穷。
