秘籍: 雪球教战守则
记载:
  - 作者叶云裳，字迹很娟秀，笔锋有些稚趣，就像她的人一般。
  - 这书写了她的雪仗技巧，煞有其事分了《正攻》、《奇袭》两篇，此书中的招数，多数是她想像出来的。
  - 包含了在雪球里藏石头、毛虫或者雪球塞裤管等等无所不用其极的残忍伎俩。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 暗器1、道德-1
  - LV2
  - 暗器2、道德-2
  - LV3
  - 暗器3、道德-3
  - LV4
  - 暗器4、道德-4
  - LV5
  - 暗器5、战术LV1、道德-
  - 5 (25)
  - ## 获得方式
  - 青城留学九月下旬之前，修练三次后触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，叶云裳≥35赠送。