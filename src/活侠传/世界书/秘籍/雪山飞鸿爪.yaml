秘籍: 雪山飞鸿爪
记载:
  - 你恩师夏侯兰集夺魄、雪山两家之神髓，去芜存菁，又揉合了控鹤气功，终于创制出的神
  - 技。
  - 旨不在杀伤，乃是专门对付高手用的武功，就算是天下最高明的轻功，也捉得到。
  - 发力恰似飞鸿踏雪泥，泥上偶然留指爪，鸿飞那复计东西？轻描淡写抓出，力使三分藏七
  - 分，后著隐于无形。破坏敌人架势，而我迅速回气，施以夺命猛袭。
