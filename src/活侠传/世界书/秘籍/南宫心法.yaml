  - 5 (50)
  - 南宫护心诀：血量归0时恢复10血，且依据等级恢复气力 20~40
  - 不动如山：依据战术LV提升防御
  - ## 获得方式
  - 围城事件－南宫远赠送(不拿钱切磋，血量介于40%~80%)
  - 二年十月中旬－四师兄买物($2500)
  - ## 备注
  - 若打算以医术救大师兄，建议学满取得南宫护心诀。
  - 最高境界为《偕老誓》，阴柔内力与嫡传内息水乳交融，合而为一，宛如一缕香魂，相护到老。
  - [[叶云裳]]线施功拯救时，若已经习得南宫护心诀，则技能消灭，习得偕老誓。~~来自南宫远的爱~~
  - 偕老誓：可抵挡致命攻击，恢复100气力。