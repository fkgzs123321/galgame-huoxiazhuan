  - 虎啸功：境界二以上，嘴攻变为「虎啸吼」，消费额外内力，使嘴攻具有实质伤害。
  - ## 获得方式
  - 青城留学，同时满足以下条件后，九月上~十一月中，由申屠龙赠送：
  - 1. 九月下旬之前，修练三次后触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，取得三五斩妖剑后并将其练满。
  - 2. 申屠龙好感度≥15，修练有一定几率与他切磋，至少一次。
  - 3. 满足以上条件，自动触发[「申屠赠礼」](/event/simple/2-09-1-申屠赠礼)后获得。