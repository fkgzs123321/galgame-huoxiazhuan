秘籍: 点苍棒法
记载:
  - 叶云裳擅自涂改点苍剑谱所创的棒法。
  - 没有杀伤力可言，但是补完了点苍剑法中不尽人意的缺憾之处，料敌所不料，单论招数变化，不失为妙著，就是卑鄙了一点，正常人不会这样。
  - ## 效果
  - 前提：道德
  - 等级
  - 效果
  - 武学点
  - LV1
  - LV2
  - 刀剑1、道德-1
  - LV3
  - 刀剑2、道德-1
  - LV4
  - 刀剑2、做人没有下限LV1、道德-2
  - LV5
  - 刀剑2、做人没有下限LV1、道德-2
  - LV6
  - 刀剑3、做人没有下限LV1、道德-3
  - LV7
  - 刀剑4、做人没有下限LV1、战术LV1、道德-3
  - LV8
  - 刀剑4、做人没有下限LV1、战术LV1、道德-4
  - LV9
  - 刀剑4、做人没有下限LV1、战术LV1、道德-4
  - LV10
  - 刀剑5、做人没有下限LV1、战术LV1、难知如阴LV1、道德-5
  - 5 (50)
  - 做人没有下限：道德越低，爆击骰越多。
  - 战术：根据等级，提升战术类技能效果，影响部分剧情。
  - 难知如阴：依据战术LV提升嘴力(每级+1)
  - ## 获得方式
  - 二年青城留学九月下旬之前，修练三次后触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，转盘【申屠龙的抵抗】