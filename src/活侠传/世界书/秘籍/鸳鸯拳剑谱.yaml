秘籍: 鸳鸯拳剑谱
记载:
  - 崆峒、唐门侠侣闭关钻研出的合击之术。
  - 一人使拳，一人使剑，交相互补，琴瑟和谐，越是心意相通威力越强。
  - 你有秘笈，但是没有伴侣。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑1、拳掌1、变心+
  - LV2
  - 刀剑2、拳掌1、变心+
  - LV3
  - 刀剑3、拳掌2、变心+
  - LV4
  - 刀剑4、拳掌2、变心+
  - LV5
  - 刀剑5、拳掌3、变心+
  - 5 (25)
  - ## 获得方式
  - 二年十二月下旬－下山召集门人中，战胜异宗恋唐门女弟子获得(天命骰名声补正，需≦19)
  - ## 备注
  - 练此秘笈，便能控制换心上人的时机，被大宋~~渣男~~所爱之书