秘籍: 登云踏．望月
记载:
  - 你唐门大师兄登徒子行径中自创的武功，收录于登云梯续集。
  - 为了求见美人，可以登云上楼台，其中踏月式是由这路轻功衍生出的攻招，「月」指光辉，暗喻所有加诸于己的兵刃。
  - 故而踏月式的真义是专门踏到别人兵刃上，居高临下踩人脸面。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 轻功1、拳掌1
  - LV2
  - 轻功1、拳掌1
  - LV3
  - 轻功2、拳掌2
  - LV4
  - 轻功2、拳掌2
  - LV5
  - 轻功3、拳掌3
  - 5 (25)
  - ## 获得方式
  - 二年崆峒派留学拜师[[夏侯兰]]，在夺魄森林修练，师父累积两次不耐烦后会提到[[唐布衣|大师兄]]，再次进森林，聊天议题选大师兄后取得。
  - ## 备注
  - 由[[夏侯兰]]所笔，揉合了[[唐布衣|大师兄]]的《登云踏》与雪山派的《梅梢望月步》