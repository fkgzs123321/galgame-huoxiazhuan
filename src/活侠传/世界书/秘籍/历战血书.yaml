秘籍: 历战血书
记载:
  - 修罗道法王军旅生涯中随笔的手记，所载内容与其说是武功，不如说是沙场见闻。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 嘴力1、学问1
  - 10
  - LV2
  - 嘴力2、刀剑1、拳掌1、轻功1、体力1、学问2
  - LV3
  - 嘴力3、刀剑2、拳掌2、轻功2、体力2、学问3
  - LV4
  - 嘴力4、刀剑2、拳掌2、轻功2、体力2、学问4
  - LV5
  - 嘴力5、刀剑2、拳掌2、轻功2、体力2、学问5、难知如阴
  - LV6
  - 嘴力6、刀剑3、拳掌3、轻功3、体力3、学问6、难知如阴
  - 10
  - LV7
  - 嘴力7、刀剑4、拳掌4、轻功4、体力4、学问7、难知如阴
  - 10
  - LV8
  - 嘴力8、刀剑4、拳掌4、轻功4、体力4、学问8、难知如阴
  - 10
  - LV9
  - 嘴力9、刀剑4、拳掌4、轻功4、体力4、学问9、难知如阴
  - 10
  - LV10
  - 嘴力10、刀剑5、拳掌5、轻功5、体力5、学问10、难知如阴、战术LV1
  - 10 (80)
  - 难知如阴：依据战术LV提升嘴力(每级+1)
  - 战术：根据等级，提升战术类技能效果，影响部分剧情
  - ## 获得方式
  - 四书事件
  - 三年四月上旬－四师兄买物($2500)
  - ## 备注
  - 此书可窥见修罗道法王的前半生，杀的人都是在两国交征的战场之上。可见修罗法王不是恶人，甚至可说是大宋的护国神将