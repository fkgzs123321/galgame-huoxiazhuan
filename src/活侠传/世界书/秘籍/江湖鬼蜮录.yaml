秘籍: 江湖鬼蜮录
记载:
  - 记载了种种江湖伎俩的醒世录，撰书人本意是提醒无辜百姓，莫受人欺，须知人心隔肚皮，害人之心不可有，防人之心亦不可无。
  - 奈何此书落到坏人手里，登时就变成诈骗宝典，怎么带劲怎么来。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 性情-1、道德-1、处世+1
  - LV2
  - 性情-2、道德-2、处世+2
  - LV3
  - 性情-3、道德-3、处世+3
  - LV4
  - 性情-4、道德-4、处世+4
  - LV5
  - 性情-5、道德-5、处世+5、石灰粉
  - 5 (25)
  - 石灰粉：气10，备揍指令变为【石灰粉】，造成【目盲】(有30%机率攻击未命中，持续1T)
  - ## 获得方式
  - 一年四月上旬－四师兄买物($900)
  - 千面人事件－选外门弟子，聊到龙湘时选择让人担心
  - 外出行商－被偷两次钱会触发四师兄送书
  - ## 备注
  - 版本v1.0.3131 气20 -> 10
  - 破庙公子侠事件，修练1级可治疗石灰粉泼眼（医术1或炼丹点数≥30也可）