秘籍: 唐门暗器总纲
记载:
  - 唐门弟子人手一本的武功秘笈，与《毒经》并列二宝。
  - 若无师长传授心诀、运劲手法，仅靠自学极难寸进。
  - 开篇《忘形论》你已读得滚瓜烂熟。
  - ## 效果
  - 需求：LV1~5－无，LV6以上－学问>=10
  - 等级
  - 效果
  - 武学点
  - LV1
  - 轻功1、嘴力1
  - LV2
  - 轻功1、嘴力1、暗器1
  - LV3
  - 轻功2、嘴力2、暗器2
  - LV4
  - 轻功3、嘴力3、暗器2
  - LV5
  - 轻功4、嘴力4、暗器2
  - LV6
  - 轻功4、嘴力4、暗器3
  - LV7
  - 轻功5、嘴力5、暗器4
  - LV8
  - 轻功6、嘴力6、暗器4
  - LV9
  - 轻功6、嘴力6、暗器4
  - LV10
  - 轻功7、嘴力7、暗器5、额外暗器
  - 9 (50)
  - 额外暗器：捅人、暗器追加倒数3T的暗器攻击
  - 嘴力是隐藏加值，没有显示在修练页上
  - ## 获得方式
  - 初始获得
  - ## 备注
  - 无论是捅人或暗器都会有追加攻击，推荐修练