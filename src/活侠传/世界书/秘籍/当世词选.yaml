秘籍: 当世词选
记载:
  - 一本很新的书，几经波折才流转到你手里。
  - 前半篇收录了近代词家的名词佳句，包含晏殊、范仲淹、欧阳修、柳永、三苏等才子的杰作。
  - 后半篇则收录了当世文人的作品，最末数页被人刻意抹黑破坏，已不可读，隐约可见作者姓魏。
  - ## 效果
  - 需求：学问25 或 修养40
  - 等级
  - 效果
  - 武学点
  - LV1
  - 学问1、修养+1、处世靠中
  - LV2
  - 学问2、修养+2、处世靠中
  - LV3
  - 学问4、修养+3、处世靠中
  - LV4
  - 学问5、修养+4、处世靠中
  - LV5
  - 学问6、修养+5、处世靠中
  - 5 (25)
  - 处世靠中：处世若50，则-1
  - ## 获得方式
  - 青城留学，第一次点选常风观触发[「初入常风观」](/event/simple/2-08-3-初入常风观)事件获得。