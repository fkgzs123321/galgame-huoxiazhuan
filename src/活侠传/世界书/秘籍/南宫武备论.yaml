秘籍: 南宫武备论
记载:
  - 南宫高祖，武林盟主南宫智的手书抄本。笔力雄健，一撇一捺宛若横扫千军，常为南宫族人习帖练字所临摹。
  - 虽不记载武功，却杂记了南宫智生平所悟，有兵法、学问、医术、心路历程、当代流行穿搭、笑话。
  - 其实这书还满好看的。
