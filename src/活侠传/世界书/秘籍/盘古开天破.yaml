秘籍: 盘古开天破
记载:
  - 静江九县小盟主方震天的成名绝技，本是奇门武功，要以铁锤与钉子合使。
  - 机缘巧合为方震天所得，声称这是他苦心创制的独门武功，为免被人看出手脚，将原本锤法改为刀法，至于钉法则略去不用，因此平空多了许多意义不明的怪招，破绽不小。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑1、体力1、性情+1、处世+1
  - LV2
  - 刀剑2、体力2、性情+2、处世+2
  - LV3
  - 刀剑4、体力3、性情+3、处世+3
  - LV4
  - 刀剑5、体力4、性情+4、处世+4
  - LV5
  - 刀剑6、体力5、性情+5、处世+5
  - 5 (25)
  - ## 获得方式
  - 青城留学九月下旬之前，修练三次触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，转盘【申屠龙抵抗】获得点苍棒法。九月上~二年十月中[「云裳秘笈」](/event/simple/2-09-1-云裳秘笈)事件，转盘【盘古斧】获得。