  - 傲慢：造成伤害+50%，受到伤害+10%
  - ## 获得方式
  - 需未留学，经过千面人魔事件认识[[龙渊]]，与[[龙湘]]结缘时聊守信用赠送
  - ## 备注
  - 是[[龙渊]]与[[王二壮]]喝醉时互殴创出来的武功
  - 取得时间点已近结局，又需大量黄酒，必须提前准备才可能学成