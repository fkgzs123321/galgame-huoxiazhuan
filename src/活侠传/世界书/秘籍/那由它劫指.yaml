秘籍: 那由它劫指
记载:
  - 一本古老的指谱，由梵文写成，深藏于藏经阁之下，若非地震，恐怕永世不见天日。
  - 那由他是为佛教数字概念，意为「多不胜数」。
  - 劫则是天竺的时间通称，历经成、住、坏、空之后，即为一大劫，故行此功须参悟禅
  - 机，不生不灭，以色身历劫无尽，方始证悟大道。
