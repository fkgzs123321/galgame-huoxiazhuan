秘籍: 蛇形拳
记载:
  - 丐帮善牧蛇，丐帮的蛇形拳不只是模仿蛇形，而是货真价实地与爱蛇共斗，出拳、出腿全都需与蛇相配合，除了啄击、缠绕擒拿以外还藏著一记隐形杀招，招数使老的时候，就是必杀之时 ── 蛇会猝不及防冲出袖子咬人一口！
