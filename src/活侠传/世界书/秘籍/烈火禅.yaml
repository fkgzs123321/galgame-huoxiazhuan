  - 5 (50)
  - 烈火禅：【愤怒】时不再捅人，变成嘴攻并口喷烈火造成敌人【燃烧】(每回合失去 7%生命，持续 3T)
  - ## 获得方式
  - 二年崆峒派留学－飞天门季试一胜([[虞小梅]]好感 ≧25)或二胜([[虞小梅]]好感＜ 25)奖励
  - ## 备注
  - 打坐浮空、手脚伸长打人、口吐烈火，都是捏他《快打旋风》的达尔西姆。