秘籍: 莲花落
记载:
  - 丐帮人人都会唱的帮歌莲花落，其实是讲究求生技巧的一部内功歌诀。
  - 每夜收工以后，由辈分较老的乞丐带著小辈齐唱，边唱边以筷敲碗，以此掌握节拍，配合歌曲换气，吐纳习惯自然养成。
  - 只不过歌词往往粗鄙不堪，有辱斯文，有些对著姑娘家唱还会被报官。
