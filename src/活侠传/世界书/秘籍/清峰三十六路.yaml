  - ## 获得方式
  - 青城留学期间，进行活动累积功勋点数，计点如下：
  - + 上清宫修真 +1
  - + 上清宫道士 +1
  - (误认地狱道时+0，拖五回合鬼卒助阵+1)
  - + 青城山镇医馆－青城弟子求诊 +2
  - + 常风观散步－吟啸、似有所悟、输给路人侠 -1
  - 二年九月下邹博归来后，拜访上清宫，若功绩点数≥6，触发[邹博嘉勉](/event/simple/2-09-3-邹博嘉勉)事件获得。