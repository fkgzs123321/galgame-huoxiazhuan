秘籍: 玄玄如意指
记载:
  - 武林盟主大侠龙渊七种成名绝技之一。
  - 玄玄如意，妙手空空，能以素手接人兵器，探人衣囊，无往不利。
  - 龙渊少年时没少用这招扒人钱财，直到他醒悟茁壮，一肩扛起武林命运，才将秘笈中窃物的手法删除。
