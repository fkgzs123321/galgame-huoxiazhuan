秘籍: 揍狗拳
记载:
  - 《道德经》云：「天地不仁，以万物为刍狗。」
  - 揍狗拳指称的狗，并非真狗，而是世间所有敌人。无论是谁都一视同仁，将他当狗毒打。区区狗仔，何足惧哉？只要认定自己会赢，气势压过对方，那怕是狼、是虎也得在你面前夹著尾巴逃跑。
  - ## 效果
  - 需求：拳掌 10
  - 等级
  - 效果
  - 武学点
  - LV1
  - 拳掌1
  - LV2
  - 拳掌2
  - LV3
  - 拳掌3
  - LV4
  - 拳掌4
  - LV5
  - 拳掌5、揍狗拳
  - 5 (25)
  - 揍狗拳：敌人气低于自身时，获得【揍狗拳】，捅人变为【追击】，追加额外气的伤害。
  - ## 获得方式
  - 二年崆峒派留学－铁拳门季试胜出(争议)
  - 围城事件－诊治阿牛后，挟持阿牛决斗
  - ## 备注
  - 狂犬的招牌绝技，简而言之就是往死里打