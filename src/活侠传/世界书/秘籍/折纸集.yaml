秘籍: 折纸集
记载:
  - 收录了古今流行的折纸方案，纸盒、纸船、纸蛙、纸鹤、纸鱼、纸花、纸剑到纸登云梯。
  - 画工细腻，解说清晰，有了这本书，谁都能够成为折纸战士。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 形意拳LV1、性情-2
  - 20 (20)
  - ## 获得方式
  - 不留学，破庙线通报唐门，在讲经堂转盘【折纸集】获得
  - ## 备注
  - [[唐中翎|掌门]]托[[唐惟元|四师兄]]带回，送给[[唐默铃|小师妹]]。
  - 小师妹十分高兴，书中每一样她都要折，折到没色纸了，就把歪主意打到秘笈上，偷偷撕书，书皮扔床底藏起来，撕完了自己的秘笈，就撕旁人的。最后东窗事发，小师妹被掌门家法伺候，书也被封印。
  - 《折纸战士》是台湾漫画家周显宗的漫画作品。