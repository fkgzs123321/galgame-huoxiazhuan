秘籍: 斩天黑翼双龙剑
记载:
  - 需要刀剑齐使才能施展，命名浮夸，招数本身却似乎华而不实，凭著气势一阵乱砍，意外很多人吃这套。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑1、嘴力1、性情+1、处世+1
  - LV2
  - 刀剑1、嘴力2、性情+2、处世+2
  - LV3
  - 刀剑2、嘴力3、性情+3、处世+3
  - 5 (15)
  - ## 获得方式
  - 三年四月上旬－四师兄买物($2000)
  - 招亲事件剧情(心上人唐默铃)
  - 青城留学九月下旬之前，修练三次触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，转盘【申屠龙抵抗】获得点苍棒法。九月上~二年十月中[「云裳秘笈」](/event/simple/2-09-1-云裳秘笈)事件，转盘【黑龙剑】获得。
  - ## 备注
  - 齐壬的招牌绝技，一共七十二式
  - ~~声光俱佳，会吸引女人的目光~~