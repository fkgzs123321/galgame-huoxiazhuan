  - 5 (50)
  - 铁布衫：根据体力提升防御
  - 金钟罩：气≧20可使用，消耗10气，备揍指令变为【金钟罩】，执行后获得【护体气罩】。此外，根据内力50%转防御
  - 【护体气罩】效果－所受捅人、绝招伤害按75%~100%比例反弹给对手，触发后移除
  - 不坏金身：【战役】可施展金刚罩。
  - ## 获得方式
  - 四书事件
  - 二年十月中旬－四师兄买物($3500)
  - ## 备注
  - 反弹流必备招式，配合医术的回血，可以活活反死敌人