秘籍: 金钟罩
记载:
  - 嵩山派的经典硬气功，乃是嵩山寺十八铜人的拿手绝活。
  - 金钟罩兼修内外，外壮筋骨，内固脏腑，功成之人身似铜铁，纵有拳脚加诸于身，亦不痛不痒。
  - ## 效果
  - 需求：佛学LV1
  - 等级
  - 效果
  - 武学点
