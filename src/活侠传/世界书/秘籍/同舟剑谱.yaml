  - 10
  - LV5
  - 刀剑15、拳掌-6、暗器-6、轻功10、同舟剑法
  - 10 (50)
  - 同舟剑法：当连击数大于2时，绝招变成【同舟剑法】，根据当前连击数影响伤害。当连击数大于12时，清除所有连击数。
  - ## 获得方式
  - 叶家兄妹前往武林大会，[[叶云舟]]代表[[唐门]]出战。三年十二月收到武林盟檄文，询问叶云舟意见获得。
  - ## 备注
  - 原本叫「沉舟剑谱」，指破釜沉舟，为求胜不择手段，自绝后路。但[[赵活]]觉得不吉利，向[[叶云舟]]说你自管去求胜无妨，背后有我守著。于是改名「同舟剑谱」，代表风雨同舟、同舟共济。
