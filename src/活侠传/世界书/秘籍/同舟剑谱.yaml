秘籍: 同舟剑谱
记载:
  - 苍松剑客叶云舟习剑半生一切所得，在风雨山与恩师诀别之际始终顿悟。
  - 剑出如奔雷，凌驾于点苍所有快剑之上，乃是唐门的剑法。
  - ## 效果
  - 需求：点破云关
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑3、拳掌-1、暗器-1、轻功2
  - 10
  - LV2
  - 刀剑6、拳掌-2、暗器-2、轻功4
  - 10
  - LV3
  - 刀剑9、拳掌-4、暗器-4、轻功6
  - 10
