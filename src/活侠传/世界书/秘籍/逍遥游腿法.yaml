秘籍: 逍遥游腿法
记载:
  - 全真派的轻功兼腿法，逍遥游出自庄子一书，亦是古琴曲。
  - 全真派弟子每日练功时会由传功师父奏曲，鲲化为鹏、翼若垂云、将徙天地、上干青霄、扶摇万里、御风冷然、气适北溟、磅礡万物、翱翔广和九段奏完，方始收功。
