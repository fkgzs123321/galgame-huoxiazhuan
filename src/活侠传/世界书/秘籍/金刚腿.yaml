秘籍: 金刚腿
记载:
  - 嵩山派名扬天下的硬功之一，由踢桩功为根基，习练者双腿系沙袋，轮流踢踹木桩百次为一趟，初习者分早午晚日踢三趟，随著功力日深，一日踢上十趟、二十趟都是日常。
  - 及至百日，除却沙袋，脚腿轻灵而势猛如昔，根基已成，再练技巧，弹、蹬、踹、砸、摆、点、撩、扫，八字腿诀，无一不是脚到擒来。
