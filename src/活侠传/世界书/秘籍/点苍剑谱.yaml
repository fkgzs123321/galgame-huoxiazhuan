秘籍: 点苍剑谱
记载:
  - 点苍派剑谱，专走轻、柔、快、变的路子。
  - 一旦使开，剑意绵绵不绝，有如行云流水般灵动飘逸。
  - ## 效果
  - 需求：LV1~5－无，LV6 以上－刀剑>=10
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑1、轻功1
  - LV2
  - 刀剑2、轻功2
  - LV3
  - 刀剑3、轻功3
  - LV4
  - 刀剑4、轻功4
  - LV5
  - 刀剑5、轻功5、点苍快剑LV1
  - LV6
  - 刀剑6、轻功6、点苍快剑LV1
  - LV7
  - 刀剑7、轻功7、点苍快剑LV1
  - LV8
  - 刀剑8、轻功8、点苍快剑LV1
  - LV9
  - 刀剑9、轻功9、点苍快剑LV1
  - LV10
  - 刀剑10、轻功10、点苍快剑LV2、点破云关
  - 9 (50)
  - 点苍快剑：根据轻功提升刀剑
  - 点破云关：当连击数大于2时，绝招变成【点破云关】，根据当前连击数影响伤害。当连击数大于8时，清除所有连击数。耗气12。
  - ## 获得方式
  - 四书事件
  - 买牛事件－跟叶家兄妹要钱获得
  - 二年一月上旬－四师兄买物
  - 二年崆峒派留学－无色广场逛街，四师兄买物($2500)
  - ## 备注
  - 点破云关适合搭配徐如林，只要能凑到连击数就能连段到尾。
  - 点苍剑法第一式『苍松迎客』、第七式，『白虹贯日』、十四式『凤鸣朝阳』、~~六十六式『握手言和』~~