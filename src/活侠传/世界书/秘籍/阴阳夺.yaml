  - ## 获得方式
  - 青城留学九月下旬之前，修练三次后触发[青城排挤](/event/simple/2-08-3-青城排挤)事件，获得[[三五斩妖剑]]。
  - 十一月下旬[青城段考](/event/simple/2-11-3-青城段考)离开时，遇地狱道选择帮青城。
  - 剧情自动触发跟随[赵逵上山](/event/simple/2-11-3-赵逵上山)，下山时申屠龙好感≥20赠送。