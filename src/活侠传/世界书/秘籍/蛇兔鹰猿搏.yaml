  - ## 获得方式
  - 二年崆峒派留学－拜师夏侯兰，先取得《很是用力踢》，三年招亲去后山练功拜祭。
  - ## 备注
  - 形意拳可找[[蛇形拳]]学。
  - 虽然这是[[峨嵋派]]绝学，但[[解无尘]]却恨不得快快把这秘笈脱手，说梦里祖师爷画像夜夜骂他不肖，只在意自己，不找传人。见[[赵活]]是[[夏侯兰]]徒弟，算是晚辈，又在[[崆峒派]]留学，应该不介意在峨嵋挂个名，就塞给赵活了。