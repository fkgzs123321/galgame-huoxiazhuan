秘籍: 杨家练兵操
记载:
  - 北宋杨门忠烈的练兵体操。
  - 号称体操，然而为了确实提高沙场生还率，本操的锻炼强度不仅远超朝廷正规军，甚至比武林中小门派的功法还要严格，杂以棍操、一百零八阵操、铜锤十八打，这套体操即令是武林中人，怕也没几个受得了。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 体力1
  - LV2
  - 体力2
  - LV3
  - 体力3
  - LV4
  - 体力4
  - LV5
  - 体力5、侵略如火、战术LV1
  - 5 (25)
  - 侵略如火：依据战术 LV 提升攻击
  - 战术：根据等级，提升战术类技能效果，影响部分剧情
  - ## 获得方式
  - 二年崆峒派留学－窝居随机，战胜宋兵获得
  - 围城事件中得知大师兄伐金，选跟去被打昏后获得
  - 三年四月上旬－四师兄买物($900)