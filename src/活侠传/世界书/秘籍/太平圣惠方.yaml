秘籍: 太平圣惠方
记载:
  - 翰林医官奉太宗皇帝诏令所编纂的医书。
  - 包括诊法、处方用药、五脏诸病、内、外、妇、儿、服食、丹药、外益、针灸等内容。
  - 原典足有一百册，你所得者仅为纲目，因为二师兄认为略去的内容是常识，你应该要知道。
