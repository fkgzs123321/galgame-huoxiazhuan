  - ## 获得方式
  - 抓鸡事件－战胜全真弟子获得(不烤鸡)
  - 二年崆峒派留学－无色广场逛街，四师兄买物($800)
  - 二年三月上旬－四师兄买物
  - 围城事件－南宫远赠送(不拿钱切磋，我方血量 ≤40%)
  - PS. 负道德 + 名声不可过高