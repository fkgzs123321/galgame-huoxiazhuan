秘籍: 唐门药典
记载:
  - 唐门祖传医书，当世唯一以毒用药的医书。
  - 揉合苗疆、佛家学说，观一碗水有八万四千虫，虫即为毒，亦分五行六合，对应五脏六腑，多则害，少则病，尽则虚，错则狂。
  - 人非不害于五毒，实乃毒性未发而已，唯得用药养之，使其顺心不逆，躯毒为己用，则百病难侵。
