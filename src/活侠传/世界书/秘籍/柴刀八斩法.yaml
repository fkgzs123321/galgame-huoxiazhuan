秘籍: 柴刀八斩法
记载:
  - 峨嵋还是剑派时，遗传下来的古老锻身法，化繁为简，大开大阔，刚猛之处，却又峰回路转，留有余地。
  - 八路斩法看似平凡，其实，练不出高深武功，但于强健体魄、拉身筋骨助益匪浅。
