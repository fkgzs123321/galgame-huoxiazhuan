  - 等级
  - 效果
  - 武学点
  - LV1
  - 体力2、刀剑1
  - LV2
  - 体力3、刀剑2
  - LV3
  - 体力5、刀剑3
  - LV4
  - 体力6、刀剑4
  - LV5
  - 体力8、刀剑5
  - 5 (25)
  - ## 获得方式
  - 二年不留学－二月上旬至五月下旬团练累积两次后，五月上旬至下旬团练打赢[[唐娇娇|狄傲]]
