  - ## 获得方式
  - 曾在🚩崆峒地牢救小梅(v1.0.5000.13尚未解锁)。
  - [参观锦香宫](/event/simple/3-09-3-参观锦香宫)时向导人选【🎲＜35 画中仙】。
  - [锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)时选择[挑战画中仙](/event/simple/3-09-3-挑战画中仙)。
  - 挑战画中仙后，心上人非虞小梅，修练玄烛心经的人选择👉「我来练」获得。
  - ## 备注
  - 锦香宫不传之秘
  - 此功性属阴寒，可以调伏心焦、火气
  - 温夫人创此玄功，为的便是让宫人清心，不受激情所惑，能下冷静决断。
  - 心无罣碍，回首前程往事，回忆越清晰，心意越坚决。