秘籍: 掷石问天
记载:
  - 飞石帮镇帮秘笈，是帮主年轻时得高人传授的独门暗器手法。
  - 据说练到精深处，可以在平静水面上以飞石点水，弹跳八十八次。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 体力1、暗器1
  - LV2
  - 体力2、暗器1
  - LV3
  - 体力3、暗器2
  - LV4
  - 体力4、暗器2
  - LV5
  - 体力5、暗器3
  - 5 (25)
  - ## 获得方式
  - 一年伙房－和大师兄打飞石帮
  - ## 备注
  - 实际上是[[石公远]]总结他束发以前的掷石心得，后来被[[石夫人]]拿去复制，称此书有高深武功，唯帮中弟子可以传阅，压根算不上什么真本领。
  - 被[[唐布衣]]手里使出却是脱胎换骨，石子飞旋跳跃，竟能转弯袭人后背，一股气连珠价掷出，顿时如四面八方的石弹雨包围对方，不愧是忘形篇。