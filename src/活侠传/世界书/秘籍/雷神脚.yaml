  - 神雷：境界三以上，绝招变为【神雷】。纵身上跃，必定使敌人所有指令无效。并根据形意拳精通数提升伤害。
  - ## 获得方式
  - 需同时符合以下条件：
  - [[唐娇娇]]、[[唐衫]]加入唐门，唐衫随大师兄下山，武林大会接纳唐衫。
  - [[福韫]]需好感小于20，没加入唐门，否则三年十二月下会出使峨嵋。
  - 西武林线，四年一月上派[[唐衫]]去说服峨嵋派，回来后与唐衫比试，教他忘形篇。
  - ## 备注
