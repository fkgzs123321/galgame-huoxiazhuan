秘籍: 罗汉拳谱
记载:
  - 嵩山寺中被盗出的拳经，是嵩山武功之根本，易学难精。
  - 流转民间的罗汉拳谱在数百年间衍生出诸多套路，各领风骚，每本都不太一样，你也不知手里这本是否原版，你既然捡到了这本拳谱，你就有佛缘，练它。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 拳掌1
  - LV2
  - 拳掌2
  - LV3
  - 拳掌4
  - LV4
  - 拳掌5
  - LV5
  - 拳掌6、佛学LV1
  - 5 (25)
  - ## 获得方式
  - 一年四月上旬－四师兄买物($1000)
  - 外出－闹市逛街，福蕴赠送
  - ## 备注
  - 初期能最快取得佛学的秘笈