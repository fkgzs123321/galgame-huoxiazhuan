  - ## 获得方式
  - 围城事件－外出练拳南宫深赠送（处世≧中庸）
  - 三年四月上旬－四师兄买物($1500)
  - ## 备注
  - 南宫深赠送传奇文本：南宫深知你未得师长点拨，深患你强行修练内功，导致阴阳背离，伤身损脉，遂赠你一套内功图录，名唤巫山洞府九宝图。
  - 南宫深谦说习之不能练就绝世武功，只能调顺两仪，温养五行，于你必有助益，其实他是怕你得知此图贵重，不肯轻易便收。