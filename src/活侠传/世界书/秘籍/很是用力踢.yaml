  - ## 获得方式
  - 围城事件－丐帮优势，撤退客栈(需战术 LV0)遇到丐帮，得风神救场，花一千块取得
  - 二年崆峒派留学－拜师夏侯兰，三年招亲去后山练功拜祭
  - ## 备注
  - 形意拳可找[[蛇形拳]]学
  - 由[[解无尘]]家学《风神步》与峨嵋绝学《[[雷神脚]]》合一演变而来