  - ## 获得方式
  - 需完成以下所有条件：
  - 1. 曾🚩[留学青城](/event/simple/2-08-2-唐门迎敌)。
  - 2. 二年十二月上[叶云舟归来](/event/simple/2-12-1-叶云舟归来)时，叶云裳好感≥30且技能《医术》≥3，以触发🚩「听说寂灭三摩地」。
  - 3. 三年一月上[叶氏兄妹离去](/event/simple/3-01-1-叶氏兄妹离去)时，心上人是叶云裳，兄妹争论时掷骰到【🎲≥80 叶云裳抵抗】，再选择👉「劝叶云舟留」。
  - 4. 满足以上，则[叶氏兄妹离去](/event/simple/3-01-1-叶氏兄妹离去)最后，会由唐芳赠送此秘笈。
  - ## 备注
  - 结缘[[叶云裳]]必修秘笈，三年五月[[唐默铃|小师妹]]招亲前一定要读满，等什么，快读啊！！！