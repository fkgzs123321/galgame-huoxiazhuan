  - ## 获得方式
  - 龙湘破庙事件－帮公子侠战胜全真弟子获得
  - 唐门债务>-9000，上官萤拜访事件，四师兄转盘随机赠送（四师兄好感需低于60）
  - 青城留学，四师兄转盘随机赠送
  - 二年－四师兄买物($1200)
  - ## 备注
  - 道学的入门秘笈
  - 据说藏著一层奥秘，七人一组可以施展北斗七星阵法，七个大婶拿锅铲都能战胜武林高手