秘籍: 白猿通臂拳
记载:
  - 峨嵋派白猿祖师的成名绝技，严格来说也算是一种猴拳，却与民间所传的猴拳南辕北辙。劲由背发，经肩过肘通达手指，是为通臂。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 拳掌+1、轻功+1
  - LV2
  - 拳掌+2、轻功+1
  - LV3
  - 拳掌+3、轻功+2
  - LV4
  - 拳掌+4、轻功+2
  - LV5
  - 拳掌+5、轻功+3、形意拳LV1
  - 5 (25)
  - 形意拳：修习特定武学的条件
  - ## 获得方式
  - 二年崆峒派留学点穴事件－防御成功，第二战不要赢，选平辈礼
  - 四师兄贩卖(第二年十月~第三年三月)