秘籍: 三五斩妖剑
记载:
  - 东汉道人张陵所传，揉合正一道学问的青城派独门剑法。
  - 强调以气御剑，于剑中求道，剑路光明正大，斩妖伏魔。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 刀剑2、内力2
  - LV2
  - 刀剑4、内力5
  - LV3
  - 刀剑6、内力7
  - LV4
  - 刀剑8、内力10
  - LV5
  - 刀剑10、内力12
  - 4 (15)
  - ## 获得方式
  - 二年青城留学九月下旬之前，修练三次后触发[「青城排挤」](/event/simple/2-08-3-青城排挤)事件，转盘【叶云裳的恐吓】