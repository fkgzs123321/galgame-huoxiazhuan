秘籍: 仙鹤迷踪拳
记载:
  - 崆峒派．飞天门的传世武学。
  - 身法轻灵，拳快步松，最是敏捷多变。时而漫步闲游，时而振翅急袭，叫人捉摸不透，防不胜防。
  - 只是这路拳法过于复杂，共有三十六路、七十二变、百零八种后著，甚难熟练，因此飞天门中反倒鲜少有人深入钻研。
  - ## 效果
  - 等级
  - 效果
  - 武学点
  - LV1
  - 轻功1、拳掌1
  - LV2
  - 轻功1、拳掌1、爆发1
