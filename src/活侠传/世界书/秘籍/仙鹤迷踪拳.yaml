  - 5 (50)
  - 形意拳：修习特定武学的条件
  - 仙鹤迷踪步：备揍成功后，获得一个「仙鹤迷踪」，根据轻功 50%提升回避率，持续 2 回合。
  - ## 获得方式
  - 二年崆峒派留学－飞天门季试二胜([[虞小梅]]好感 ≧25)或三胜([[虞小梅]]好感＜ 25)奖励
  - 三年招亲－留学飞天门，打赢[[金乌上人]]，[[颜疆]]死亡时赠送
  - ## 备注
  - 由小梅传授给火闪电，连只鸟都懂武功！