事件: 唐门战后
时序: 第2年8月中旬
系列: 共 4 环
  收拾残局:
    触发:
      - 接续[「唐门迎敌」](/event/simple/2-08-2-唐门迎敌)事件
    经过:
      - 练功场对话，检定上一事件是否参与「院内大战」：
      - 若未参与大战：
      - 叶云裳在唐门: 对话差分。
      - 处世＜60: 对话差分。
      - 接「传承小剑」阶段。
      - 若有参与大战：
      - 道德≤40〔道德-1、银两+1000〕
      - 性情<60: 对话差分。
      - 贡献度+40、向心+3。
      - 处世<60: 对话差分。
      - 贡献度≥50: 对话差分。
      - 回唐门主画面，点选男弟子房以接「地窖情况」阶段。
    数值:
      道德: -1
      向心: +3
  地窖情况:
    触发:
      - 接续「收拾残局」阶段
      - 且有参与大战
    经过:
      - [「唐门迎敌」](/event/simple/2-08-2-唐门迎敌)中🚩破庙资讯量≧3: 对话差分
      - 处世<60: 对话差分。
      - 嘴力≥30: 对话差分。
      - 性情≤40: 对话差分。
      - 被俘虏骂，触发🎲天命：
      - 上限50，修养补正，处世扣除。
      - 【🎲＜30 揍他们】〔道德-2、修养-1、性情+1、心相+20、拳掌+1〕
      - 【🎲＜70 骂回去】: 再触发🎲天命：
      - 上限50，嘴力补正。
      - 【🎲＜80 寡不敌众】〔心相-30、修养-2、嘴力+2、处世+1〕
      - 【🎲≧80 胜利】〔嘴力+2、修养-1〕
      - 【🎲≧70 彻底无视】〔修养+1、处世-1〕
      - 接「二师兄处置」阶段。
    数值:
      道德: -2
      性情: +1
      心相: -10
      拳掌: +1
      嘴力: +4
  二师兄处置:
    触发:
      - 接续「地窖情况」阶段
    经过:
      - • 道德≤40或修养≤40: 修养-1、道德-1、唐铮好感-1。
      - • 唐铮好感＜20: 二师兄踢你一脚。
      - • 性情≤40: 唐铮好感+1。
      - • 处世＜60: 对话差分。
      - • 接「传承小剑」阶段。
    数值:
      道德: -1
      唐铮好感: +1
  传承小剑:
    触发:
      - 接续「收拾残局」或
      - 「二师兄处置」阶段
    经过:
      - 曾参与大战: 对话差分。
      - 🚩破庙资讯量≧3: 对话差分。
      - 未参与大战〔性情-1、心相-15〕
      - 检定🚩破庙资讯量：
      - 🚩破庙资讯量≧3〔唐中翎好感+2〕
      - 🚩破庙资讯量＜3〔唐中翎好感+1〕
      - 👉选项：拿到传承小剑
      - 「端详」 → 全锻造点数≥50: 对话差分。
      - 「舔舔看」〔性情+2、唐铮好感-1〕
      - 性情≤40: 对话差分。
      - 👉选项：给二师兄传承小剑?
      - 「不要」〔性情+1〕
      - 「可以」〔处世-1、唐铮好感-1〕 → 全锻造点数≥50: 对话差分。
      - 解锁装备[「唐门传承小剑」](/system/forge-roadmap)。
      - 性情+1、心相+50、贡献度+50。
      - 若曾🚩[「收留叶氏兄妹」](/event/simple/1-08-1-叶氏行踪风波): 设置🚩「叶云舟不在唐门」。
      - 设置🚩「四师兄不在唐门」。
      - 事件结束，回唐门日常指令。
    数值:
      性情: +3
      心相: +35
      唐中翎好感: +1
      唐铮好感: -1
    选项:
      - 舔舔看（性情+2、唐铮好感-1）
      - 不要（性情+1）
      - 可以（处世-1、唐铮好感-1）