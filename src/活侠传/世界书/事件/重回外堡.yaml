事件: 重回外堡
时序: 第2年7月上旬
系列: 共 2 环
  重回外堡:
    触发:
      - [不留学崆峒](/event/simple/2-02-1-留学讨论)且
      - [「多人拜师」](/event/simple/2-05-1-多人拜师)时已赎回外堡
    经过:
      - • 心相-10。
      - • 叶云裳好感＜30: 事件结束，回离家出走日常养成。
      - • 叶云裳好感≥30: 接「云裳捣蛋」阶段。
    数值:
      心相: -10
  云裳捣蛋:
    触发:
      - 接续「重回外堡」阶段
      - 且叶云裳好感≥30
    经过:
      - • 处世＞40: 心相-10。
      - • 修养≥40: 心相+30、心相-10。
      - • 心上人为叶云裳: 变心-3。
      - • 心上人非叶云裳: 变心+4。
      - • 修养≥40: 处世-1、嘴力+1、叶云裳好感+1。
      - • 心上人为叶云裳: 对话差分。
      - • 若🚩[「离家出走住破庙」](/event/simple/2-06-1-离家出走): 对话差分。
      - 👉选择: 信不信?
      - 「信」〔处世-1、修养+1〕
      - 「不信」〔处世+1、嘴力+1〕
      - • 显示叶云裳作弄你插图。
      - 🎲天命: 你的下场 (上限50、修养补正、性情扣除、心相补正)
      - 【＜50】蹂躏方案甲〔名声+1、心相-15、叶云裳好感+3〕
      - 【≥50】蹂躏方案乙 → 进监狱〔心相-15、叶云裳好感+3、🚩「被关次数」+1〕
      - • 事件结束，回离家出走日常养成。
    数值:
      心相: -20
      嘴力: +2
      叶云裳好感: +3
    选项:
      - 信（处世-1、修养+1）
      - 不信（处世+1、嘴力+1）
