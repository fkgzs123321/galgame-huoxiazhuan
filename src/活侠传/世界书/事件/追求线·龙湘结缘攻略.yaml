  - 或第四年一月下旬(成立西武林盟)
  - 龙湘结缘
  - 需满足条件3、4才能触发。
  - 完成此事件，获得道具【龙湘的发簪】后，即完成结缘。
  - 无论战斗输赢都能与龙湘结缘，但若战斗输给龙湘(8回合后的自动落败除外)会无法与龙渊对话。
  - 若第二年走不留学-客栈线，由于经历了[巧遇龙渊](/event/simple/2-08-3-巧遇龙渊)事件，此处有龙渊剧情差分及新增📜「守信用」，可得秘笈[《酩酊玄剑掌》](/system/books/book_3010)。但要注意第二年六月前，若叶云裳好感≧30，会无法进客栈线。
  - 若龙渊好感8以上，可得秘笈[《龙渊七绝》](/system/books/book_7013)。
