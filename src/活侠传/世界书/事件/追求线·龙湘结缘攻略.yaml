  - [众人的决策](/event/detailed_description/3-12-1-众人的决策)
  - 决策结果不可以是遣散唐门。
  - 若遣散唐门，且满足条件2，进入后山会触发:
  - 1. 若有其他结缘者，心上人为龙湘，选择📖「湘姊，你要不要跟我来呢?」，🗡️对决胜利后，选择📖「我是不会放你走的」，会进入[汗青书24: 赶海人](/event/ends/end-24)，无法结缘。
  - 2. 其他情况，会触发龙湘三年之约事件，无法结缘。
