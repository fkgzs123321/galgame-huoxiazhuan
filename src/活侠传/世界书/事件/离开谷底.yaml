事件: 离开谷底
时序: 第3年5月上旬
系列: 共 3 环
  返回唐门:
    触发:
      - 接续[「九转疗伤」](/event/simple/3-05-1-九转疗伤)子事件
    经过:
      - 显示叶云裳爬出井外动画。
      - 唐升好感≥30: 向心+2。
      - 处世＜60: 对话差分。
      - 贡献度≥20: 对话差分。
      - 处世≥60: 向心+2。
      - 接「三师兄闲聊」阶段。
    数值:
      向心: +4
  三师兄闲聊:
    触发:
      - 接续「返回唐门」阶段
    经过:
      - 触发 ☯议题选单:
      - 闲聊 ☯「小师妹的事」:
      - • 处世+1、贡献度+10。
      - • 瑞笙好感≥20: 对话差分。若唐默铃好感≥40，道德-1。
      - • 处世≥60: 道德-1、嘴力+1、修养-1。
      - • 设置🚩「谈论小师妹」。
      - • 接「叶云舟谈话」。
      - 闲聊 ☯「我和云裳的事」:
      - • 处世≤40: 对话差分。
      - • 道德≤40: 对话差分。
      - • 修养检定:
      - • 修养≥60: 若处世≤40，对话差分。
      - • 修养＜60: 若道德≤40，对话差分。设置🚩「和三师兄吵架」，嘴力+1、处世+1。
      - • 设置🚩「谈论叶云裳」。
      - • 接「叶云舟谈话」。
    数值:
      道德: -2
      嘴力: +2
    备注: 目前无法加瑞笙好感。
  叶云舟谈话:
    触发:
      - 接续「三师兄闲聊」阶段
    经过:
      - 复合检定:
      - • 有🚩和三师兄吵架: 嘴力+1。
      - • 未🚩和三师兄吵架、且唐升好感≥40: 若性情≥60，对话差分。
      - 检定与三师兄谈论的话题:
      - • 若🚩谈论叶云裳: 对话差分。若🚩[在谷底吃到毒菇](/event/simple/3-05-1-谷底生活)，再差分。
      - • 若🚩谈论小师妹: 对话差分。
      - 处世≥60: 对话差分。
      - 处世＜60: 对话差分。
      - 心相+30。
      - 检定是否[🚩经历侠影寄云舟](/event/simple/1-04-3-初遇叶氏兄妹):
      - • 有: 叶云舟好感+3。
      - • 没有: 叶云舟好感+1。
      - 处世＜60: 对话差分。
      - 处世≥60: 对话差分。
      - 曾[🚩经历侠影寄云舟](/event/simple/1-04-3-初遇叶氏兄妹): 对话差分。
      - 心相+10。
      - 心相+10、心相+10、心相+10、心相+30。
      - 曾[🚩经历侠影寄云舟](/event/simple/1-04-3-初遇叶氏兄妹): 对话差分。
      - 心相+20、叶云舟好感+3。
      - 处世≥60: 叶云舟好感+2。
      - 获得宝物[「叶云裳的梳子」](/people/characters/girl2)，触发选项:
      - • 👉「拿去卖」: 对话差分。
      - • 👉「当然知道」: 对话差分。
      - 显示动画。
      - 性情≥60: 对话差分。
      - 事件结束，回唐门养成指令。
    数值:
      嘴力: +1
      心相: +120
      叶云舟好感: +2