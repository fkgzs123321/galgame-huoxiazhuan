事件: 青城醒转
时序: 第2年8月下旬
系列: 共 6 环
  青城醒转:
    触发:
      - 接续[「重伤梦境」](/event/simple/2-08-2-重伤梦境)事件
    经过:
      - 房内醒来，触发复合检定(不符才检定下一项):
      - 1. 阴阳＜40: 设置阴阳=10、体力-3、内力-2、处世-2。
      - 2. 阴阳≥40: 设置阴阳=90、体力-2、内力-3、处世+2、修养-1。
      - 3. 其他(见备注): 体力-1、内力-1。
      - 醒来后做的事，触发选项:
      - 👉 「出门看看」: 接「申屠道长」阶段。
      - 👉 「翻箱倒柜」(需道德＜40): 道德-1、性情+1、修养-1，触发🎲天命。
      - 🎲找到什么(上限99):
      - 【🎲＜33 钱】: 银两+500。
      - 【🎲＜66 钱?】: 道德-1，解锁武器[「金钱剑」](/system/forge-roadmap)。
      - 【🎲≥66 秘笈】: 道德-1，获得秘笈[《八门锁金刀》](/system/books/book_2008)。
      - 设置🚩「翻箱倒柜」，接「申屠道长」阶段。
    数值:
      道德: -3
      性情: +1
    备注: 阴阳检定: 应不存在

 「其他」的情况。可

 能是情况2欲设置≥60

 ，但设定错误。
  申屠道长:
    触发:
      - 接续「青城醒转」阶段
    经过:
      - 初识[申屠龙](/people/characters/special405)。
      - 借你的脉听听，触发选项:
      - 👉 「不要」:
      - • 性情-1。
      - • 修养≤40: 对话差分。
      - • 接「战申屠龙」阶段。
      - 👉 「好啊」:
      - • 处世+1、性情+1。
      - • 接「把脉缘由」阶段。
    数值:
      性情: +0
  战申屠龙:
    触发:
      - 接续「申屠道长」阶段
    经过:
      - 触发对决🆚「战申屠龙」:
      - • 若战斗中使用任何攻击手段: 设置🚩「贸然出手」。
      - • 第五回合自动判定落败。
      - 对决结果检定:
      - • 胜利且道德≤20: 叶云舟好感-99，进入[生死簿95:《快剑封喉》](/event/badends/#生死簿-No.95)。
      - • 胜利且道德＞20: 叶云舟好感-99，进入[汗青书53:《划地为牢》](/event/ends/end-53)。
      - • 落败且有🚩贸然出手: 申屠龙好感-2，接「把脉缘由」阶段。
      - • 落败且未🚩贸然出手: 武学+5、心相-20，接「把脉缘由」阶段。
    数值:
      心相: -20
      叶云舟好感: -99
      申屠龙好感: -2
  把脉缘由:
    触发:
      - 接续前两阶段
    经过:
      - • 心相+50。
      - • 道德≥40且处世＜40: 对话差分。
      - • 修养≤40: 对话差分。
      - 触发道德检定:
      - • 道德≥40: 检定🚩(未知旗标)，对话差分。
      - • 道德＜40: 检定🚩(未知旗标)，心相-10，对话差分。
      - 获得秘笈[《无为丹法》](/system/books/book_7015)，接「房内闲聊」阶段。
    数值:
      心相: +40
  房内闲聊:
    触发:
      - 接续前两阶段
    经过:
      - • 若有🚩翻箱倒柜: 叶云裳好感-1。
      - • 触发☯议题介面。
      - ☯ 事件「把脉」:
      - • 若[🚩经历侠影寄云舟](/event/simple/1-04-3-初遇叶氏兄妹)，且当时未向叶云舟协助: 叶云裳好感+1。
      - • 修养≤40: 对话差分。
      - • 解锁以下各项☯议题。
      - ☯ 闲聊「唐门的情况」:
      - • 处世≥40: 对话差分。
      - • 若心上人为唐默铃，且唐默铃好感≥30: 对话差分。
      - • 若心上人为唐默铃，且未先☯ 闲聊「叶云裳的病情」: 叶云裳好感-1。
      - • 若心上人非唐默铃，且唐默铃好感≥30: 对话差分。
      - ☯ 闲聊「云裳的病情」:
      - • 若未先☯ 闲聊「唐门的情况」，且未先☯ 闲聊「申屠龙」: 叶云裳好感+1。
      - • 修养≥40: 对话差分。
      - • 学问＜25: 对话差分。
      - • 性情＜60: 对话差分。
      - ☯ 闲聊「申屠龙」:
      - • 心相-15。
      - ☯ 事件「休息」:
      - • 若未☯ 闲聊「唐门的情况」: 处世-1、贡献度-10、唐中翎好感-1。
      - • 若未☯ 闲聊「云裳的病情」: 处世+2、变心+3、叶云裳好感-2。
      - • 饭盒滑落，触发🎲天命(上限60，拳掌补正):
      - 【🎲＜60 打翻】: 心相-15，若处世≥60则对话差分，获得物品[豆沙包](/system/items/)+1。
      - 【🎲≥60 接住】: 心相+10、心相-30、技能[《折花手》](/system/skill)+1。
      - • 性情检定: ≤40则心相-20，＞40则心相-10。
      - • 心相+50。
      - • 心相＜80: 心相-10、性情-1、处世-1。
      - • 接续「休息」阶段。
    数值:
      心相: -10
      性情: -1
      叶云裳好感: -2
      唐中翎好感: -1
