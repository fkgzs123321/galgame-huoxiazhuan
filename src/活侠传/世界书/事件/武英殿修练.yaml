事件: 武英殿修练
时序: 第3年9月下旬
系列: 共 3 环
  练武切磋:
    触发:
      - 🚩锦香宫作客
      - 已[「参观锦香宫」](/event/simple/3-09-3-参观锦香宫)
      - 点选 ☯「修练: 武英殿」
    经过:
      - 若初次修练，触发介绍剧情:
      - • 性情≤40: 对话差分。
      - 对决对象，触发🎲天命(上限99):
      - 【🎲＜60 前途无量锦香宫弟子】: 接「年轻弟子切磋」阶段。
      - 【🎲≥60 老成持重锦香宫弟子】: 接「老成弟子切磋」阶段。
    旗标:
      - 锦香宫作客
  年轻弟子切磋:
    触发:
      - 接续「练武切磋」阶段
      - 且【🎲＜60 前途无量锦香宫弟子】
    经过:
      - 触发对决 🆚战锦香弟子，结果检定:
      - 败:
      - • 武学+2、心相-10、名声+1、锦香宫好感+1。
      - • 获得称号[风度翩翩丑郎君](/people/title-list)。
      - • 若🚩和虞小梅结缘: 虞小梅好感-1。
      - 胜:
      - • 武学+4、心相-20。
      - • 设置🚩指导锦香弟子次数+1。
      - 无论胜败，开启修练介面，关闭后接续以下。
      - 检定「🚩指导锦香弟子次数≥3，且未🚩触发妒忌」:
      - 不符合: 事件结束，回锦香宫养成指令选单。
      - 符合: 触发复合检定(不符才会检定下一项):
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 接[「郁竹妒忌」](/event/simple/3-09-3-郁竹妒忌)事件。
      - • 🚩[虞小梅同行武林大会](/event/simple/3-08-2-邀请虞小梅): 接[「虞小梅妒忌」](/event/simple/3-09-3-虞小梅妒忌)事件。
      - • 其他: 事件结束，回锦香宫养成指令选单。
    数值:
      心相: -30
      锦香宫好感: +1
      虞小梅好感: -1
    备注: 🚩指导锦香弟子次数: 初始值0
  老成弟子切磋:
    触发:
      - 接续「练武切磋」阶段
      - 且【🎲≥60 老成持重锦香宫弟子】
    经过:
      - 触发对决 🆚战锦香弟子，结果检定:
      - 败:
      - • 武学+2。
      - 胜:
      - • 武学+4、心相-20。
      - • 武学+4、名声+1，设置🚩指导锦香弟子次数+1。
      - 无论胜败，开启修练介面，关闭后接续以下。
      - 检定「🚩指导锦香弟子次数≥3，且未🚩触发妒忌」:
      - 不符合: 事件结束，回锦香宫养成指令选单。
      - 符合: 再检定🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹):
      - • 有同行: 接[「郁竹妒忌」](/event/simple/3-09-3-郁竹妒忌)事件。
      - • 未同行: 事件结束，回锦香宫养成指令选单。
    数值:
      心相: -20
    备注: • 🚩指导锦香弟子次数: 初始值0

 • 虞小梅不会妒忌老成弟子。