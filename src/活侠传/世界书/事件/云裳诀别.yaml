事件: 云裳诀别
时序: 第3年5月上旬
系列: 共 3 环
  叶云啾:
    触发:
      - 接续[「师妹招亲后半」](/event/simple/3-05-1-师妹招亲后半)
      - 且有🚩云裳结缘前置
    经过:
      - 叶云裳假冒身份求亲剧情。
      - 赵活带走叶云裳。
      - 接「对策选择」阶段。
    旗标:
      - 云裳结缘前置
  对策选择:
    触发:
      - 接续「叶云啾」阶段
    经过:
      - 赵活对叶云裳的对策，触发选项:
      - 👉「硬派对策」:
      - • 检定🚩软性对策次数:
      - • 若🚩软性对策次数=0: 处世+2、修养-1。
      - • 若🚩软性对策次数=1: 处世+2、修养-1。
      - • 若🚩软性对策次数=2: 处世+1。
      - • 心相-10。
      - • 贡献度≥50: 对话差分。
      - • 完成[风云史00:《命中有数》](/event/achievements/#风云史-No.00): 对话差分。
      - • 接[「金乌闹事」](/event/simple/3-05-1-金乌闹事)事件
      - 👉「软性对策」:
      - • 若心相＜0，或心上人非叶云裳，或🚩强制硬派: 封闭此选项。
      - • 检定🚩软性对策次数:
      - 若🚩软性对策次数=0:
      - • 若处世＜60，对话差分。
      - • 设置🚩软性对策次数+1。
      - • 重复「对策选择」阶段。
      - 若🚩软性对策次数=1:
      - • 叶云舟好感检定:
      - • 若叶云舟好感＜30: 处世+1、叶云裳好感-1。
      - • 若叶云舟好感≥30: 叶云裳好感+1。
      - • 检定[《九转残篇》](/system/books/book_8109)修练成果:
      - • 若修练完(10级): 对话差分。
      - • 若10＞修练等级≥1: 对话差分，设置🚩「强制硬派」。
      - • 若修练等级＜1: 对话差分，设置🚩「强制硬派」。
      - • 设置🚩软性对策次数+1。
      - • 重复「对策选择」阶段。
      - 若🚩软性对策次数=2:
      - • 接「云裳诀别」阶段。
    数值:
      心相: -10
      叶云裳好感: +1
    备注: 🚩软性对策次数

 的初始值为0。
  云裳诀别:
    触发:
      - 接续「对策选择」阶段
    经过:
      - 处世≥60: 对话差分。
      - 学问≥50: 对话差分。
      - 心相-10、心相-15。
      - 心相-20。
      - 道德检定:
      - 若道德≥60:
      - • 曾🚩[经历侠影寄云舟](/event/simple/1-04-3-初遇叶氏兄妹): 对话差分。
      - • 性情≥40: 对话差分。
      - 若道德＜60:
      - • 学问≥40: 嘴力+1。
      - • 性情≥60: 对话差分。
      - 性情≥40: 对话差分。
      - 接[「山道之战」](/event/simple/3-05-1-山道之战)子事件。
    数值:
      心相: -45
      嘴力: +1