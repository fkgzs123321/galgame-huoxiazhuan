事件: 虞小梅妒忌
时序: 第3年9月下旬
系列: 共 3 环
  小梅下毒:
    触发:
      - 见[「武英殿修练」](/event/simple/3-09-3-武英殿修练)事件
    经过:
      - 设置🚩「触发妒忌」。
      - 变心次数检定:
      - 变心次数≤1:
      - • 处世检定:
      - • 处世≤40: 对话差分。若道德≤40，再差分。
      - • 处世＞40: 对话差分。若道德≤40，再差分。
      - 变心次数＞1:
      - • 道德≤40: 对话差分。
      - 性情≥60: 嘴力+1。
      - 接「病娇小梅」阶段。
    数值:
      嘴力: +1
  病娇小梅:
    触发:
      - 接续「小梅下药」阶段
    经过:
      - 触发对决 🆚战虞小梅:
      - • 我方初始麻痹+100。
      - • 第1回合触发对话及以下流程:
      - • 敌方血量-20% x 4次。
      - • 敌方血量-25% x 1次。
      - 对决结果无影响，接「落井下石」阶段。
  落井下石:
    触发:
      - 接续「病娇小梅」阶段
    经过:
      - 心上人为虞小梅: 对话差分。
      - 心相-30、向心+3，龙湘好感-1。
      - 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
    数值:
      心相: -30
      向心: +3
      龙湘好感: -1