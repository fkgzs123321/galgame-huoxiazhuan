追求线: 唐默铃结缘攻略
记载:
  - 结缘必要条件
  - 建议及备注
  - 第三年五月上旬
  - 小师妹招亲-[金乌闹事](/event/simple/3-05-1-金乌闹事)
  - 收到金乌闹事消息后下山，需满足以下条件:
  - 心上人为唐默铃
  - 唐默铃好感50以上
  - 则小师妹会跟随你前往。
  - 若心上人非唐默铃，可在男弟子房折纸增加变心点。
  - 好感度刷法: 后山练功随机触发烤鱼事件。
  - 第三年五月上旬
  - 小师妹招亲-[对决金乌](/event/simple/3-05-1-对决金乌)
  - 此战必须胜利。
  - 若选择📜「不讲武德群而殴之」，需要连战皆胜；若选择📜「决斗」则直接进入。
  - 若满足条件1，对决金乌只会有一场。
  - 修养中庸以上会比较好打。
  - 第三年五月上旬
  - 小师妹招亲-[师妹的归宿](/event/simple/3-05-1-师妹的归宿)
  - 需满足条件1、2
  - 后山触发🎲天命并掷骰到【≧50】「小师妹是我的!」
  - 唐默铃好感≧60，即可触发结缘事件。
  - 对话后得到道具【小师妹的香囊】，即完成结缘。
  - 好感≧60的条件: 事实上只要满足条件1、2，并正常游玩都会达标。
  - 结缘后改变的事件
  - 改变内容
  - 结缘后任意时间点
  - 伙房[「小师妹代班」](/system/training/)
  - 本事件插图改变。
  - 结缘后任意时间点
  - 下山闹市逛街
  - 新增唐默铃同游事件[「得意洋洋」](/system/training/)。
  - 心相+30
  - 结缘后任意时间点
  - 后山练功[「小师妹烤鱼」](/system/training/)
  - 拒绝的结果改为与唐默铃一起练功。
  - 武学+3、心相+5
  - 第三年八月中旬
  - [大会请帖](/event/simple/3-08-2-大会请帖)
  - 若唐升好感≧35，且满足下列条件，可让唐默铃同行武林大会:
  - 若道德≧60，三师兄直接让你带她去。
  - 若道德＜60，选择「可以(撒谎)」才可以带去。
  - 建议带她去，可以加一堆好感。
  - 第三年九月上旬
  - 到第四年十月上旬
  - [前往武林大会](/event/simple/3-09-1-前往武林大会)
  - [锦香宫作客](/event/simple/3-09-3-锦香宫事件集)
  - 旅途事件: 战役可设置唐默铃参加、多处剧情变化。
  - 锦香宫: 多处剧情变化。
  - 锦香宫: 华音阁增加[「小师妹鼓掌」](/system/training/)事件。
  - 第三年十月中旬
  - [武林大会](/event/simple/3-10-2-武林大会)
  - 多处剧情变化。
  - 唐默铃可参与战役及决斗。
  - 第三年十二月中旬剩2行动点
  - [众人的决策](/event/detailed_description/3-12-1-众人的决策)-遣散唐门
  - 女弟子房剧情差分。
  - [退隐江湖](/event/ends/end-25)结局演出为与唐默铃陪伴版本。
  - 第四年一月中旬(不成立西武林盟而顽抗到底)
  - 或第四年二月中旬(成立西武林盟)
  - 伴侣之约
  - 至女弟子房可触发为唐默铃梳头事件。
  - 若不触发此事件，则剩2行动点时自动触发唐默铃等不到你的事件。
  - 第四年一月中旬剩两次行动(不成立西武林盟而顽抗到底)
  - 或第四年二月中旬剩两次行动(成立西武林盟失败而顽抗到底)
  - [唐门围攻战](/event/detailed_description/4-01-2-唐门围攻战)
  - 唐默铃可加入终战。
  - 终战获胜后可进入汗青书[《唐门薪火》](/event/ends/end-37)。
  - 若有触发梁有诗拯救叶云裳，结局剧情会不同。
  - 若与多人结缘，灭门线结局结缘优先度(v1.0.3201.1)：
  - 唐默铃＞叶云裳＞上官萤＞虞小梅＞郁竹＞魏菊＞夏侯兰＞龙湘
  - 第四年二月中旬剩两次行动
  - [东西武林盟会战](/event/detailed_description/4-02-2-东西武林盟会战)
  - 唐默铃参战。
  - 可选择让她同行或护卫三师兄。
  - 多处剧情、战斗变动。
  - 若选择让唐默铃护卫三师兄，并决策出击外堡，可获得技能「勇气2」。
  - 第四年三月上旬
  - 眉山决战
  - 剧情有唐默铃陪同。
  - 结局画面与小师妹相伴。
  - 战胜可达成[风云史《唐门女婿》](/event/achievements/#风云史-No.13)。