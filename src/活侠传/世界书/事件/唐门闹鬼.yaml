事件: 唐门闹鬼
时序: 第2年3月下旬
系列: 共 5 环
  闹鬼传闻:
    触发:
      - 赵活在唐门
      - 叶云裳在唐门
      - 满足以上，时间到自动触发
    经过:
      - 师兄弟讨论闹鬼议题，赵活好奇，贡献度检定:
      - 贡献度＜0:
      - • 向心-1、心相-10。
      - 贡献度≥0: 性情检定:
      - • 性情≥60: 对话差分。
      - • 性情＜60: 心相-5。
      - • 性情-1。
    数值:
      向心: -1
      心相: -15
      性情: -1
  唐铮询问:
    触发:
      - 接续「闹鬼传闻」阶段
    经过:
      - 二师兄出现。
      - • 贡献度＜0: 对话差分。
      - 唐铮好感度检定:
      - • 唐铮好感度＜20: 心相-10。
      - • 唐铮好感度≥20: 心相-5。
      - 二师兄询问传闻:
      - • 性情≥60: 对话差分。
      - • 贡献度≥30: 对话差分。
      - • 性情≥60: 对话差分。
      - 敢不敢去捉鬼，性情检定:
      - • 性情≥40: 对话差分。
      - • 40＞性情≥20: 对话差分。
      - • 性情＜20: 对话差分。
      - 随二师兄去捉鬼，触发🎲天命(上限50、性情补正、唐铮好感补正):
      - 【🎲＜50 我才不去】:
      - • 接「武力逼迫」阶段。
      - 【🎲≥50 不能让二师......不能让鬼被二师兄捉了】:
      - • 贡献度+15、向心+1。
      - • 接「真相大白」阶段。
    数值:
      心相: -15
      向心: +1
  武力逼迫:
    触发:
      - 接续「唐铮询问」阶段
      - 且【🎲＜50 我才不去】
    经过:
      - 师兄弟武力逼迫你前往，触发战役⚔️战唐门弟子。
      - • 战役结果无影响，性情-1、心相-15、武学+4。
      - 修养≤40: 处世+1。
      - 接「真相大白」阶段。
    数值:
      性情: -1
      心相: -15
  真相大白:
    触发:
      - 接续「唐铮询问」或「武力逼迫」阶段
    经过:
      - 性情＜60: 对话差分。
      - 显示鬼手动画。
      - 全武学点数≥100: 对话差分。
      - 二师兄解救，性情检定:
      - • 性情＜60: 心相-15。
      - • 性情≥60: 唐铮好感+1。
      - 接「惩罚主谋」阶段。
    数值:
      心相: -15
      唐铮好感: +1
  惩罚主谋:
    触发:
      - 接续「真相大白」阶段
    经过:
      - 两位师妹受罚后，叶云裳供出四师兄提供机关手。
      - • 检视机关手: 若全锻造点数≥60，对话差分。
      - • 连你一起罚: 若全武学点数≥100，对话差分。
      - 替你自己讨公道，触发选项:
      - 👉 「发射壮士飞爪」: 心相+40、道德-1、向心+2、唐惟元好感-1。
      - 👉 「饶了四师兄」: 贡献度-20、向心-2、唐惟元好感+2。
      - 事件结束，接唐门养成指令。
    数值:
      心相: +40
      道德: -1
      向心: +0
      唐惟元好感: +2