事件: 云裳秘笈
时序: 第2年9月上旬
  云裳秘笈:
    前置: 青城排挤
    触发:
      - 曾触发过[「青城排挤」](/event/simple/2-08-3-青城排挤)事件
      - 该事件「求教申屠」阶段掷骰到【🎲＜50 申屠龙抵抗】
      - 该事件结束两旬后触发(需在本事件时间范围内)
    经过:
      - 与碧波子对练过后，修养检定:
      - • 修养≤40: 嘴力+1、处世+1。
      - • 修养＞40: 对话差分。
      - 你很臭，心相-10。
      - 叶云裳给的秘笈，触发🎲天命(上限99):
      - 【🎲＜50 我左手一柄盘古斧】: 获得秘笈[《盘古开天破》](/system/books/book_2011)。
      - 【🎲≥50 我右手两根黑龙剑】: 获得秘笈[《斩天黑翼双龙剑》](/system/books/book_2005)。
      - 云裳为你费心，心相+30。
      - 事件结束，回青城日常养成。
    数值:
      嘴力: +1
      心相: +20