事件: 上官对策
时序: 第3年10月中旬
系列: 共 8 环
  脚本判定:
    触发:
      - 接续[大会开始](/event/simple/3-10-2-大会开始)
    经过:
      - 上官隼接受挑战，依照赵活情况决定剧情脚本:
      - • 心上人为上官萤，且🚩[得知上官萤远嫁日本](/event/simple/3-10-2-友人问候)(见备注): 接「私人情仇」阶段。
      - • 其他情况: 接「门派恩怨」阶段。
    备注: 🚩「得知上官萤远嫁日本」的条件:

 上官萤好感≥30
 无魏菊以外结缘者
  私人情仇:
    触发:
      - 接续「脚本判定」阶段
    经过:
      - 道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 修养-1。
      - 是否挑战上官隼，触发选项:
      - 👉「还是要去」:
      - • 贡献度-20。
      - • 性情检定:
      - • 性情≤40: 向心-2。
      - • 性情＞40: 向心+1。
      - • 设置🚩「为上官萤出战」。
      - • 接「挑战上官隼」阶段。
      - 👉「不去」:
      - • 心相-20。
      - • 再触发选项:
      - 👉「偷袭师弟」
      - • 道德-2、向心-1。
      - • 向心-2。
      - • 接「挑战上官隼」阶段。
      - 👉「门派为重」
      - • 心相-20、性情-2、修养+1、向心+3、变心+2。
      - • 事件结束，接[「各派角逐」](/event/simple/3-10-2-各派角逐)事件。
    数值:
      向心: -1
      心相: -40
      道德: -2
      性情: -2
    备注: 注意若👉「偷袭师弟」，

 不会设置🚩为上官萤出战。
  门派恩怨:
    触发:
      - 接续「脚本判定」阶段
    经过:
      - 是否挑战上官隼，触发选项:
      - 👉「好，我去揍他一顿」:
      - • 解锁此选项需性情≥60。
      - • 性情+1、处世+2。
      - • 道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 修养-1。
      - • 接「挑战上官隼」阶段。
      - 👉「暂且放他一马」:
      - • 性情-1、修养+1、向心+2。
      - • 心上人为上官萤: 对话差分。
      - • 事件结束，接[「各派角逐」](/event/simple/3-10-2-各派角逐)事件。
    数值:
      性情: +0
      向心: +2
  挑战上官隼:
    触发:
      - 接续「私人情仇」或
      - 「门派恩怨」阶段
    经过:
      - 处世＜60: 对话差分。
      - 宋悲好感≥30: 对话差分。
      - 上官萤好感≥40: 心相+20。
      - 性情≥60: 对话差分。
      - 上官萤好感≥40: 对话差分。
      - 检定「心上人为上官萤，且🚩[得知上官萤远嫁日本](/event/simple/3-10-2-友人问候)」:
      - • 符合: 接「正攻」阶段。
      - • 不符: 触发选项:
      - 👉「正攻」:
      - • 接「正攻」阶段。
      - 👉「礼贤下士」:
      - • 解锁此选项需嘴力≥50。
      - • 设置🚩「激怒上官隼」。
      - • 接「对决上官隼」阶段。
    数值:
      心相: +20
  正攻:
    触发:
      - 接续「挑战上官隼」阶段
    经过:
      - 检定「心上人为上官萤，且🚩[得知上官萤远嫁日本](/event/simple/3-10-2-友人问候)」:
      - 符合:
      - • 道德≥40: 对话差分。
      - 不符:
      - • 性情≤40: 对话差分。
      - 接「对决上官隼」阶段。
  对决上官隼:
    触发:
      - 接续「挑战上官隼」
      - 或「正攻」阶段
    经过:
      - 设置🚩「挑战上官隼」。
      - 触发对决 🆚战上官隼:
      - • 若🚩激怒上官隼: 敌方初始状态「愤怒」。
      - 对决结果检定:
      - 落败:
      - • 设置🚩「挑战上官隼落败」。
      - • 若宋悲好感＜20，且道德＜40，且门派规模＜3: 进入[生死簿78:《莽撞而死》](/event/badends/badend-78)。
      - • 武学+3、名声-2。
      - • 🚩成为崆峒掌派人: 对话差分。
      - • 上官萤好感≥40: 对话差分。
      - • 心上人为上官萤，且🚩[得知上官萤远嫁日本](/event/simple/3-10-2-友人问候): 对话差分。
      - • 道德≤40: 对话差分。
      - 获胜:
      - • 设置🚩「挑战上官隼获胜」。
      - • 检定「心上人为上官萤，且🚩[得知上官萤远嫁日本](/event/simple/3-10-2-友人问候)」:
      - • 符合: 对话差分。
      - • 不符: 若道德≤40，对话差分。若处世＜60，宋悲好感+1。
      - • 检定🚩成为崆峒掌派人:
      - • 有成为: 名声+4。若🚩和魏菊结缘，魏菊好感+2。
      - • 未成为: 名声+4。
      - 接「确认伤势」阶段。
    数值:
      宋悲好感: +1
      魏菊好感: +2
  确认伤势:
    触发:
      - 接续「对决上官隼」阶段
    经过:
      - 检定🚩和魏菊结缘:
      - 有结缘:
      - • 检定🚩「挑战上官隼」胜败:
      - • 🚩挑战上官隼获胜: 若道德≤40，对话差分。
      - • 🚩挑战上官隼落败: 魏菊好感-1。
      - • 修养≤40: 处世+2、魏菊好感-1。
      - • 上官萤好感检定:
      - • 上官萤好感≥40: 对话差分，接「上官萤关心」阶段。
      - • 上官萤好感＜40: 门派资产+100。事件结束，接[「各派角逐」](/event/simple/3-10-2-各派角逐)事件。
      - 未结缘:
      - • 复合检定(不符才检定下一项):
      - • 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - • 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - • 其他: 无特别剧情。
      - • 🚩挑战上官隼获胜: 对话差分。
      - • 🚩[唐芳归来](/event/simple/1-09-1-唐芳归来): 对话差分
      - • 上官萤好感检定:
      - • 上官萤好感≥40: 对话差分，接「上官萤关心」阶段。
      - • 上官萤好感＜40: 门派资产+100。事件结束，接[「各派角逐」](/event/simple/3-10-2-各派角逐)事件。
    数值:
      魏菊好感: -1
  上官萤关心:
    触发:
      - 接续「确认伤势」阶段
    经过:
      - 门派资产+100
      - 🚩和魏菊结缘: 对话差分。
      - 出战理由检定:
      - • 🚩为上官萤出战: 对话差分。
      - • 非🚩为上官萤出战: 对话差分。
      - 性情检定:
      - • 性情≤40: 对话差分。
      - • 性情＞40: 对话差分。若🚩和魏菊结缘，魏菊好感-1。
      - 出战理由检定:
      - • 🚩为上官萤出战: 对话差分。
      - • 非🚩为上官萤出战: 对话差分。
      - 🚩和魏菊结缘: 对话差分。
      - 检定🚩和魏菊结缘:
      - • 🚩和魏菊结缘: 对话差分。若🚩为上官萤出战，再差分。
      - • 非🚩和魏菊结缘: 无特别对话。
      - 🚩为上官萤出战:
      - • 对话差分。
      - • 检定🚩「挑战上官隼」胜败:
      - • 🚩挑战上官隼获胜: 对话差分。
      - • 🚩挑战上官隼落败: 对话差分。
      - 唐惟元好感＜40: 对话差分。
      - 出战理由检定:
      - • 🚩为上官萤出战: 若处世≤40，对话差分。
      - • 非🚩为上官萤出战: 对话差分。
      - 事件结束，接[「各派角逐」](/event/simple/3-10-2-各派角逐)事件。
    数值:
      魏菊好感: -1