      - ☯ 事件:「召唤店小二」
      - 触发选项👉
      - 「叫叫看而已」〔道德-1、修养-1、处世+1〕
      - 「一桶热水」(需银两≧50) → 一桶热水
      - • 回☯议题选单。
      - 一桶热水
      - • 银两-50。
      - 修养检定
      - 修养≧40〔嘴力+1〕
      - 修养＜40〔心相+20〕
      - • 心相+30、修养+1。
      - ☯ 闲聊:「怨恨」
      - 修养检定
      - 修养≧40〔修养-1〕
      - 修养＜40〔修养-1、道德-1〕
      - • 回☯议题选单。
      - ☯ 闲聊:「将来的事」
      - • 需已进行☯ 闲聊:「怨恨」。
      - • 银两＜100: 对话差分。
      - • 心上人为唐默铃: 对话差分。
      - 道德检定
      - 道德≤40:
      - • 认识宋悲: 对话差分。
      - • 刘颚好感≧5: 对话差分。
      - • 心上人为上官萤: 对话差分。
      - 道德＞40:
      - • 叶云舟好感≧10且叶云裳好感≧10: 对话差分。
      - • 回☯议题选单。
    数值:
      道德: -2
      嘴力: +1
      心相: +50
    选项:
      - 叫叫看而已（道德-1、修养-1、处世+1）
  入住破庙:
