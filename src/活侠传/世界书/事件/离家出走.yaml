事件: 离家出走
时序: 第2年6月上旬
系列: 共 6 环
  愤而离家:
    窗口: 时序 39 ~ 39
    触发:
      - 第二年二月上旬[留学讨论](/event/simple/2-02-1-留学讨论)中
      - 不选择留学崆峒，直接退席
    经过:
      - • 曾触发[丐帮与嵩山打架](/event/simple/1-08-3-丐帮与嵩山打架)且🚩李富贵不在唐门: 心相-15。
      - • 性情≧40: 对话差分。
      - • 修养＜20且道德＜20: 道德-1、修养-1、性情+1。
      - • 唐铮好感≧25: 对话差分。
      - • 接「山下闲晃」阶段
    数值:
      心相: -15
      道德: -1
      性情: +1
  山下闲晃:
    触发:
      - 接续「愤而离家」阶段
    经过:
      - 性情检定
      - 性情≧60〔性情+1〕
      - 性情＜60〔心相-10〕
      - • 心上人为唐默铃或叶云裳: 心相-20。
      - • 性情＜60: 对话差分。
      - • 银两＜50: 心相-20。
      - • 唐升好感≧25: 银两+2000、设置🚩「三师兄送钱」。
      - 触发选项👉：早餐
      - 「寒酸早餐」(需银两＜50)〔
      - 银两-10、心相-10
      - 飞石帮好感≧3：心相+20
      - 〕
      - 「普通早餐」(需银两≧50)〔银两-50〕
      - 「奢华早餐」(需银两≧300)〔银两-300、心相+30、名声+1、性情+1〕
      - • 性情≤40: 对话差分。
      - • 曾与丐帮抢菜: 对话差分。
      - • 银两≧1000: 对话差分。
      - 触发选项👉：住处
      - 「住破庙」 → 「入住破庙」阶段
      - 「住客栈」(需银两≧1000) → 「入住客栈」阶段
    数值:
      性情: +2
      心相: -10
    备注: -
  入住客栈:
    触发:
      - 👉住客栈
    经过:
      - • 若叶云裳不在唐门，或叶云裳好感＜30:
      - • 银两-1000。
      - • 处世＜60: 对话差分。
      - • 设置🚩「离家出走住客栈」。
      - • 接「客栈议题」阶段。
      - • 若[叶云裳在唐门](/event/simple/1-08-1-叶氏行踪风波)，且叶云裳好感≧30: 触发选项👉
      - 「强词夺理」〔嘴力-1、道德-1、处世+1、名声-1〕
      - • 心上人非叶云裳: 变心+3。
      - 「挺过分的」〔处世-1〕
      - 「是晁和」(需[晁和在唐门](/event/simple/1-08-3-晁和入门))〔处世+1、道德-1、嘴力+1〕
      - • 修养≤40: 对话差分。
      - • 无论选项为何: 设置🚩「被叶云裳通缉」。
      - • 接「入住破庙」阶段。
    数值:
      嘴力: +0
      道德: -2
    选项:
      - 强词夺理（嘴力-1、道德-1、处世+1、名声-1）
      - 挺过分的（处世-1）
  客栈议题:
    触发:
      - 见「入住客栈」阶段
    经过:
      - ☯ 离开:「先睡饱」
