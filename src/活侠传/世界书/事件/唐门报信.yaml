事件: 唐门报信
时序: 第2年8月中旬
系列: 共 8 环
  回山路程:
    触发:
      - 接续「[破庙密谋](/event/simple/2-08-2-破庙密谋)」事件
    经过:
      - • [破庙密谋](/event/simple/2-08-2-破庙密谋)曾设置🚩「被灌酒」: 对话差分。
      - • 心上人检定
      - 心上人非唐默铃: 触发🎲天命，上限99。
      - 🎲【＜50 野兽】 → 接🆚「对决野猪」阶段。
      - 🎲【≧50 斥侯】 → 接🆚「对决山贼」阶段。
      - 心上人为唐默铃: 触发🎲天命，上限99。
      - 🎲【＜33 野兽】 → 接🆚「对决野猪」阶段。
      - 🎲【＜66 斥侯】 → 接🆚「对决山贼」阶段。
      - 🎲【≧66 小动物】 → 接「遭遇师妹」阶段。
  对决野猪:
    触发:
      - 🆚「对决野猪」
    经过:
      - • 设置🚩「回程遭遇野猪」。
      - • 战斗结果检定
      - 胜利 → 接「返抵唐门」阶段。
      - 落败 → 进入[生死簿72: 被猪拱死](/event/badends/badend-72)。
  对决山贼:
    触发:
      - 🆚「对决山贼」
    经过:
      - • 设置🚩「回程遭遇山贼」。
      - • 战斗结果检定
      - 胜利 → 接「返抵唐门」阶段。
      - 落败 → 进入[生死簿73: 小菜之死](/event/badends/badend-73)。
  遭遇师妹:
    触发:
      - 见「回山路程」阶段
    经过:
      - • 设置🚩「回程遭遇小师妹」。
      - • 心相+30。
      - • 处世＜60: 嘴力+1、唐默铃好感+1。
      - • 唐默铃好感+2。
      - • 接「返抵唐门」阶段。
    数值:
      心相: +30
      嘴力: +1
      唐默铃好感: +2
  返抵唐门:
    触发:
      - 接续前三阶段。
    经过:
      - 🚩「回程遭遇小师妹」检定
      - 是 → 对话差分。
      - 否〔轻功+1〕
      - 🚩[「许大鲸入唐门」](/event/simple/1-09-2-初识福韫)检定
      - 是 → 接🆚「战唐大鲸」阶段
      - 否 → 接「报告密谋」阶段。
  战唐大鲸:
    触发:
      - 「返抵唐门」阶段
      - 触发🆚「战唐大鲸」
    经过:
      - 对决结果检定
      - 获胜: 武学+5，道德检定
      - 道德≤40〔心相-20、性情-1〕
      - 道德≤40: [叶云裳在唐门](/event/simple/1-08-1-叶氏行踪风波) → 对话差分。
      - 道德＞40〔唐铮好感+1、唐铮好感+1〕
      - 道德＞40: [叶云裳在唐门](/event/simple/1-08-1-叶氏行踪风波)且叶云裳好感≥20〔心相+20〕
      - 获胜 → 接「报告密谋」阶段。
      - 落败: 性情≥60 → 对话差分。
      - 落败: 检定: 叶云裳在唐门，且叶云裳好感≥20
      - 是: 设置🚩「叶云裳罩」〔心相+20、银两+1000〕 → 接「报告密谋」阶段。
      - 否: 设置🚩「二师兄罩」 → 接🆚「再战唐大鲸」阶段。
    数值:
      心相: +20
      性情: -1
      唐铮好感: +1
    选项:
      - 叶云裳罩（心相+20、银两+1000）
  再战唐大鲸:
    触发:
      - 「战唐大鲸」阶段
      - 触发🗡️「再战唐大鲸」
    经过:
      - 对决结果检定
      - 获胜或5回合平手
      - 👉选项: 如何处置唐大鲸
      - 「该知道分寸」〔道德+1、性情-1、唐铮好感-1〕
      - 「二师兄发落」〔心相-10〕
      - 👉选项: 说些什么
      - 「唐门武功厉害」〔唐铮好感+1〕
      - 「别恃强凌弱」〔道德+1〕
      - 「去洗把脸」〔处世-1、修养+1〕
      - 全炼丹点数≥50 → 对话差分。
      - 唐铮好感≥20 → 对话差分。
      - → 接「报告密谋」阶段。
      - 落败〔性情-99〕 → 进入[汗青书51: 窝囊死](/event/ends/end-51)
    数值:
      道德: +2
      性情: -100
      心相: -10
      唐铮好感: +1
    选项:
      - 该知道分寸（道德+1、性情-1、唐铮好感-1）
      - 二师兄发落（心相-10）
      - 唐门武功厉害（唐铮好感+1）
      - 别恃强凌弱（道德+1）
      - 去洗把脸（处世-1、修养+1）
  报告密谋:
    触发:
      - 见前三阶段
    经过:
      - 「[破庙密谋](/event/simple/2-08-2-破庙密谋)」事件成果检定
      - 🚩「破庙资讯量」= 1〔唐铮好感+1、心相+20、心相-20〕
      - 🚩「破庙资讯量」= 2
      - 🚩「破庙资讯量」= 2〔唐铮好感+1、心相+20、心相-20〕
      - 全武学点数≥120〔唐铮好感+1〕
      - 道德≤40 → 对话差分。
      - 全武学点数≥120 → 对话差分。
      - 🚩「破庙资讯量」= 3: 触发选项
      - 「好心」〔道德+1、处世-1、心相-10〕
      - 「嫁祸」〔性情-1、处世-1、唐铮好感+2〕
      - 「嫁祸」: 道德≥40 → 对话差分。
      - 性情≥40 → 对话差分
      - [叶云裳在唐门](/event/simple/1-08-1-叶氏行踪风波)且心上人为叶云裳 → 对话差分
      - 心上人为唐默铃 → 对话差分
      - → 接[「唐门迎敌」](/event/simple/2-08-2-唐门迎敌)事件。
    数值:
      心相: -10
      道德: +1
      性情: -1
      唐铮好感: +2
    选项:
      - 好心（道德+1、处世-1、心相-10）
      - 嫁祸（性情-1、处世-1、唐铮好感+2）