事件: 友人问候
时序: 第3年10月中旬
系列: 共 6 环
  上官萤问候:
    触发:
      - 接续[「会前事项」](/event/simple/3-10-2-会前事项)事件
    经过:
      - 若上官萤好感＜30:
      - • 跳过此阶段，接「南宫浅问候」阶段。
      - 复合检定(不符才判断下一项):
      - • 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 银两+1000。
      - • 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 结缘者检定:
      - 🚩无结缘者，或🚩和魏菊结缘:
      - • 🚩和魏菊结缘: 对话差分。
      - • 处世≥40: 对话差分。
      - • 🚩和魏菊结缘: 对话差分。
      - • 设置🚩「得知上官萤远嫁日本」(见备注)。
      - • 心上人检定:
      - • 心上人为上官萤: 心相-50。
      - • 心上人非上官萤: 心相-20。
      - 其他(有结缘者但非魏菊):
      - • 复合检定:
      - • 🚩武林大会同行有小师妹或虞小梅或郁竹或叶云裳: 对话差分。
      - • 未🚩和上官萤结缘: 对话差分。
      - 🚩[虞小梅同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - 复合检定:
      - • 🚩小师妹同行武林大会: 上官萤好感-1。
      - • 🚩叶云裳同行武林大会: 上官萤好感-1。
      - • 其他: 对话差分。
      - 🚩[郁竹同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - 接「南宫浅问候」阶段。
    数值:
      心相: -70
      上官萤好感: -1
    备注: 🚩得知上官萤远嫁日本:

 不确定旗标实际意义是上

 官萤是否远嫁日本，或是

 她确定远嫁日本但赵活是

 否得知此事。
  南宫浅问候:
    触发:
      - 接续「上官萤问候」阶段
    经过:
      - 若南宫浅好感＜30:
      - • 跳过此阶段，接「樊啸天问候」阶段。
      - 🚩[虞小梅同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - 修养≥60: 对话差分。
      - 复合检定(不符才判断下一项):
      - • 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - • 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 🚩[南宫浅打通经脉](/event/simple/2-10-1-江陵决战准备): 对话差分。
      - 检定江湖快报数量:
      - • 快报数量＜6: 对话差分。
      - • 快报数量≥6: 触发选项:
      - 👉「不是好人」:
      - • 处世+1、修养-1，南宫浅好感-2。
      - • 道德≤40: 对话差分。
      - • 设置🚩「警告袁乘风不是好人」。
      - 👉「别说坏话」:
      - • 修养+1、处世-1，南宫浅好感+2。
      - 检定🚩警告袁乘风不是好人:
      - • 有警告: 阶段结束，接「樊啸天问候」阶段。
      - • 未警告: 接续以下。
      - 处世＜60: 南宫浅好感+3。
      - 检定🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹):
      - 郁竹有同行:
      - • 学问检定:
      - • 学问≥50: 学问+2、郁竹+1。
      - • 学问＜50: 处世检定:
      - • 处世≥60: 对话差分。
      - • 处世＜60: 处世-1、道德-1、性情+1，郁竹好感+1。
      - • 南宫浅好感+4。
      - • 设置🚩「南宫浅黑化」-3。
      - • 设置🚩「南宫浅获六戒刀」。
      - 郁竹未同行:
      - • 对话差分。
      - 南宫浅好感≥45: 南宫浅好感+2。
      - 🚩郁竹同行武林大会:
      - • 对话差分，触发选项:
      - 👉「值得」:
      - • 嘴力+1、处世+2、郁竹好感+2。
      - 👉「拿去还」:
      - • 处世-2、修养+2、性情-1、道德+1，南宫家好感+1。
      - • 银两+2000、门派资产+200。
      - • 南宫浅好感-2。
      - • 设置🚩「南宫浅黑化」=2。
      - 接「樊啸天问候」阶段。
    数值:
      道德: +0
      性情: +0
      嘴力: +1
      南宫浅好感: -2
      郁竹好感: +2
      南宫家好感: +1
  樊啸天问候:
    触发:
      - 接续「南宫浅问候」阶段
    经过:
      - 若樊啸天好感＜30:
      - • 跳过此阶段，接「飞石帮问候」阶段。
      - 性情＜60: 对话差分。
      - 接「飞石帮问候」阶段。
  飞石帮问候:
    触发:
      - 接续「樊啸天问候」阶段
    经过:
      - 若未🚩[助石帮主夫妇和好](/event/simple/3-01-3-围观卧云岗):
      - • 跳过此阶段，接「瑞笙问候」阶段。
      - 飞石帮众问是否有话给帮主，触发选项:
      - 👉「没什么好说」:
      - • 修养±1、处世±1、性情±1、向心+1。
      - 👉「多谢」:
      - • 修养+1、处世-1，飞石帮好感+1。
      - • 设置🚩「武林大会对飞石帮友善」。
      - 👉「滚」:
      - • 修养-1、处世+1、向心+2。
      - 接「瑞笙问候」阶段。
    数值:
      向心: +3
      飞石帮好感: +1
  瑞笙问候:
    触发:
