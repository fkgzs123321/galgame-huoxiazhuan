      - • 跳过此阶段，接[「大会开始」](/event/simple/3-10-2-大会开始)事件。
      - 复合检定(不符才判断下一项):
      - 未🚩[和唐默铃结缘](/event/pursuit/girl0):
      - • 再复合检定:
      - • 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - • 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖):
      - • 设置🚩「小师妹同行武林大会与瑞笙见面」。
      - 其他(与唐默铃结缘但未同行):
      - • 对话差分。
      - 检定🚩「和唐默铃结缘」:
      - 有结缘:
      - • 🚩[叶云舟去金国求医](/event/simple/3-01-1-叶氏兄妹离去): 对话差分。
      - • 接「战瑞笙」阶段。
      - 未结缘:
      - • 接续以下。
      - 🚩叶云舟去金国求医: 对话差分。
      - 心上人检定:
      - 心上人为唐默铃:
      - • 修养-2、处世+1、心相-50。
      - • 设置🚩「武林大会揍瑞笙」。
      - • 🚩叶云舟去金国求医: 对话差分。
      - • 接[「大会开始」](/event/simple/3-10-2-大会开始)事件。
      - 心上人非唐默铃:
      - • 触发选项:
      - 👉「嫉妒」:
      - • 道德-1、处世+1。
      - • 🚩无结缘者: 对话差分。
      - • 道德≤40: 对话差分。
      - • 🚩叶云舟去金国求医: 对话差分。
      - 👉「恭喜」:
      - • 修养+1、处世+1。
      - • 道德≤40: 对话差分。
      - • 瑞笙好感+2。
      - • 🚩叶云舟去金国求医: 对话差分。
      - 接[「大会开始」](/event/simple/3-10-2-大会开始)事件。
    数值:
      心相: -50
      道德: -1
      瑞笙好感: +2
  战瑞笙:
