事件: 云裳商议
时序: 第2年10月中旬
系列: 共 8 环
  安抚云裳:
    触发:
      - 接续[「遭遇段智秀」](/event/simple/2-10-2-遭遇段智秀)事件
    经过:
      - 叶云裳慌乱，性情检定:
      - 性情≤40: 旱雷预兆，对话差分。
      - 性情＞40: 云裳无语，对话差分。呼唤云裳，再次性情检定:
      - • 性情＜80: 不能自乱，叶云裳好感+1。
      - • 性情≥80: 我去拼命，对话差分。
      - 认识缘由，接「对策商议」。
    数值:
      叶云裳好感: +1
  对策商议:
    触发:
      - 接续「安抚云裳」阶段
    经过:
      - 触发 ☯议题选单:
      - 闲聊 ☯「慎防隔墙有耳」:
      - • 进行任意「闲聊☯」后关闭此选项。
      - • 接「防止窃听」阶段。
      - 闲聊 ☯「那家伙真的是幕后黑手!」:
      - • 进行任意「闲聊☯」后关闭此选项。
      - • 接「指控黑手」阶段。
      - 闲聊 ☯「松烟阁少主」:
      - • 接「少主身世」阶段。
      - 闲聊 ☯「你们反目成仇的理由」:
      - • 需闲聊☯「松烟阁少主」解锁此选项。
      - • 接「反目理由」阶段。
      - 闲聊 ☯「动机」:
      - • 需闲聊☯「你们反目成仇的理由」解锁此选项。
      - • 接「动机推测」阶段。
      - 离开 ☯「对策」:
      - • 接「对策制定」阶段。
  防止窃听:
    触发:
      - 接续「对策商议」阶段
      - 且☯「慎防隔墙有耳」
    经过:
      - 上屋凝望，性情-2。
      - 回「对策商议」阶段。
    数值:
      性情: -2
  指控黑手:
    触发:
      - 接续「对策商议」阶段
      - 且☯「那家伙真的是幕后黑手!」
    经过:
      - 亲眼所见，修养-1、性情+1。
      - 花钱收买，触发道德检定:
      - • 道德≥60: 教人寒心，对话差分。
      - • 道德＜60: 无话可说，对话差分。
      - 回「对策商议」阶段。
    数值:
      性情: +1
  少主身世:
    触发:
      - 接续「对策商议」阶段
      - 且☯「松烟阁少主」
    经过:
      - 亦曾兄妹，心上人检定:
      - • 心上人为叶云裳: 心相-30。
      - • 心上人非叶云裳: 心相-10。
      - 说来话长，触发选项:
      - 👉「完整版」:
      - • 设置🚩「了解段氏世系」，显示段氏世系谱 (内容整理于[大理段氏世系](/other/dali-duan-lineage))。
      - • 荒淫无道: 若道德≤40，引以为戒，心相-10。
      - • 既好且坏: 道德检定:
      - • 道德≤40: 对我是好，心相+20。若心上人非叶云裳，变心+2。
      - • 道德＞40: 料君亦是，对话差分。
      - • 段正淳: 触发选项:
      - • 👉「下巴」: 就很尖，对话差分。
      - • 👉「他是不是又出家了?」: 对一半，对话差分。
      - • 听完段氏世系: 学问+1。
      - • 流放点苍，道德检定:
      - • 道德≥60: 可怜，对话差分。
      - • 道德＜60: 活该，对话差分。
      - 👉「一言以蔽之」:
      - • 长话短说，处世+2。
      - • 高手邻居，性情检定:
      - • 性情≥60: 那倒是，对话差分。
      - • 性情＜60: 睡得不稳，对话差分。
      - 回「对策商议」阶段。
    数值:
      心相: -30
  反目理由:
    触发:
      - 接续「对策商议」阶段
      - 且☯「你们反目成仇的理由」
    经过:
      - 愧对哥哥，叶云舟好感检定:
      - 叶云舟好感≥40:
      - • 性情≤40: 对话差分。
      - • 叶云裳好感+2。
      - 叶云舟好感＜40:
      - • 无特别对话，处世检定:
      - • 处世≥40: 好个屁，修养-1。若道德≤40，云裳暗贬，对话差分。
      - • 处世≥40: 经不起试炼。若道德≤40，云裳明贬，心上人检定:
      - • 若心上人叶云裳，叶云裳好感-1。
      - 回「对策商议」阶段。
    数值:
      叶云裳好感: -1
  动机推测:
    触发:
      - 接续「对策商议」阶段
      - 且☯「动机」
    经过:
      - 大理动机: 学问≥30，对话差分。
      - 泥教动机，触发复合判定:
      - 若技能[「战术」](/system/skill)≥3:
      - • 设置🚩「分析主谋」。
      - • 怀疑金国，叶云裳好感+1。
      - 若技能「战术」＜3，且🚩[破庙资讯量](/event/simple/2-08-2-破庙密谋)= 3:
      - • 假冒泥教，对话差分。
      - 若技能「战术」＜3，且🚩破庙资讯量＜ 3:
      - • 对话差分。
      - 检定🚩分析主谋:
      - 若未🚩分析主谋，触发选项:
      - 👉「不要死」: 我偏要死，叶云裳好感+1。
      - 👉「你不会死」: 我不爱听，叶云裳好感-1。
      - 若有🚩分析主谋:
      - • 无特别对话。
      - 回「对策商议」阶段。
    数值:
      叶云裳好感: -1
  对策制定:
    触发:
      - 接续「对策商议」阶段
      - 且☯「对策」
    经过:
      - 若未曾任一闲聊☯: 这么干脆，叶云裳好感-1、处世+3。
      - 谋定后动: 若修养≥40，对话差分。
      - 回搬救兵: 若道德≤40，对话差分。
      - 事件结束，接[「投喂云裳」](/event/simple/2-10-2-投喂云裳)事件。
    数值:
      叶云裳好感: -1