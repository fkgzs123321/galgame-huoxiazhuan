事件: 四师兄访青城
时序: 第2年10月上旬
系列: 共 4 环
  遭遇四师兄:
    触发:
      - 青城留学线
      - 唐惟元好感≥30
      - 满足以上，时间到自动触发
    经过:
      - 自言自语: 若心相≥70，对话差分。
      - 没有人性: 若道德≥40，对话差分。
      - 魔王当宝: 心上人为叶云裳，对话差分。
      - 迟早水落石出: 若性情≤40，唐惟元好感+1。
      - 四师兄要你请客，触发选项:
      - 👉「想的美」:
      - • 你好意思: 嘴力+1。
      - • 叶云裳出现，反让四师兄请客: 心相+30。
      - 👉「请就请」(需银两≥500):
      - • 设置🚩「赵活请客」，处世+1、唐惟元+1。
      - • 请客花费，银两检定:
      - • 银两≥2000: 银两-2000、唐惟元好感+3、叶云裳好感+2。
      - • 2000＞银两≥1200: 银两-1200、唐惟元好感+2、叶云裳好感+1。
      - • 1200＞银两≥500: 银两-500、唐惟元好感+1、叶云裳好感+1。
      - • 让你破费: 若处世≥60，嘴力+1。
      - 接「趁机看货」阶段。
    数值:
      嘴力: +2
      心相: +30
      唐惟元好感: +1
      叶云裳好感: +1
  趁机看货:
    触发:
      - 接续「遭遇四师兄」阶段
    经过:
      - 四师兄邀请看货，检定🚩赵活请客:
      - • 有🚩赵活请客: 对话差分，若修养≥60再差分。
      - • 无🚩赵活请客: 对话差分。
      - 决定是否看货，触发选项:
      - 👉「买」:
      - • 开启商店面板，商品价格为原价的50%。
      - • 接「唐芳迟来」阶段。
      - 👉「送」:
      - • 接「师兄赠礼」阶段。
    备注: 此时刚好新货上架，

 很值得事先存钱买。
  师兄赠礼:
    触发:
      - 接续「趁机看货」阶段
      - 且选择👉「送」
    经过:
      - 四师兄送的礼物，触发🎲天命(上限99):
      - 【🎲＜50 垃圾】:
      - • 触发对决🆚「战四师兄」，对决结果检定:
      - • 获胜: 武学+4、唐惟元好感-2。
      - • 落败: 对话差分。
      - • 无论胜败，胜者痛揍一顿: 修养-1、心相-25。
      - 【🎲＜80 武功秘笈(垃圾)】:
      - • 检定是否拥有秘笈[《全真剑法》](/system/books/book_7002):
      - • 已经拥有: 心相-20。
      - • 尚未拥有: 获得秘笈[《全真剑法》](/system/books/book_7002)。
      - 【🎲≥80 江陵特产(垃圾)】:
      - • 获得物品[「湘妃鱼糕」](/system/items/)+1。
      - • 谅你不曾吃过: 若性情≤40，对话差分。
      - 接「唐芳迟来」阶段。
    数值:
      心相: -45
      唐惟元好感: -2
  唐芳迟来:
    触发:
      - 接续「趁机看货」或「师兄赠礼」阶段
    经过:
      - 唐芳迟来，听说有人请客，触发选项:
      - 👉「没有」:
      - • 对话差分。
      - 👉「没办法」(需银两≥500):
      - • 处世+2、银两-500、贡献度+20、唐铮好感+1。
      - 事件结束，回青城养成指令。
    数值:
      唐铮好感: +1
    备注: 唐铮好感增加:

 不会有图形提示。