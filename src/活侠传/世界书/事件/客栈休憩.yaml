事件: 客栈休憩
时序: 第3年10月中旬
系列: 共 4 环
  休憩选项:
    触发:
      - 接续[「入住客栈」](/event/simple/3-10-2-入住客栈)事件
    经过:
      - 触发 ☯议题选项:
      - 闲聊 ☯「叫一桶水洗澡」:
      - • 接[「房内洗澡」](#房内洗澡)阶段。
      - 事件 ☯「下楼喝酒」:
      - • 解锁此选项需已闲聊 ☯「叫一桶水洗澡」。
      - • 接[「下楼喝酒」](#下楼喝酒)阶段。
      - 事件 ☯「一觉睡到天亮」:
      - • 接[「就寝入眠」](#就寝入眠)阶段。
  房内洗澡:
    触发:
      - 接续[「休憩选项」](#休憩选项)阶段
      - 且闲聊 ☯「叫一桶水洗澡」
    经过:
      - 银两检定:
      - • 银两≥200: 银两-200。
      - • 银两＜200: 贡献度-10、门派资产-20。
      - 修养+1、心相+20。
      - 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅):
      - • 银两检定:
      - • 银两≥1000: 银两-1000。
      - • 银两＜1000: 门派资产-100、贡献度-20。
      - • 处世＜60: 对话差分。
      - • 道德≤40: 对话差分。
      - • 曾🚩[与画中仙决斗](/event/simple/3-09-3-挑战画中仙): 对话差分。
      - • 心相+50，虞小梅好感+3。
      - 回[「休憩选项」](#休憩选项)阶段。
    数值:
      心相: +70
      虞小梅好感: +3
  下楼喝酒:
    触发:
      - 接续[「休憩选项」](#休憩选项)阶段
      - 且闲聊 ☯「下楼喝酒」
    经过:
      - 设置🚩「下楼喝酒」。
      - 检定「🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟)，且🚩[叶云舟在唐门](/event/simple/3-10-2-点苍逆徒#师徒对决)」:
      - • 符合: 接[「南溪夜访」](/event/simple/3-10-2-南溪夜访)事件。
      - • 不符: 接续以下。
      - 处世≤40: 对话差分。
      - 触发选项:
      - 👉 「额外打赏」:
      - • 解锁此选项需银两≥100。
      - • 道德+1、处世+1、银两-100。
      - 👉 「有劳了」:
      - • 对话差分。
      - 检定🚩和魏菊结缘:
      - • 有结缘: 接[「魏菊侍酒」](/event/simple/3-10-2-魏菊侍酒)事件。
      - • 未结缘: 独自酌酒剧情，后接[「翌日早晨」](/event/simple/3-10-2-翌日早晨)事件。
    数值:
      道德: +1
  就寝入眠:
    触发:
      - 接续[「休憩选项」](#休憩选项)阶段
      - 且事件 ☯「一觉睡到天亮」
    经过:
      - 复合检定(不符才检定下一项):
      - • 以下段落较长，以分隔线分开。
      - -----1. 若🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖)，且心上人为唐默铃-----
      - 唐默铃好感+2。
      - 道德≥40: 对话差分。
      - 心相+20、心相+20。
      - 触发选项:
      - 👉 「当山贼」:
      - • 解锁此选项需道德＜40。
      - • 道德+1、嘴力+1，唐默铃好感+1。
      - 👉 「开店」:
      - • 唐默铃好感+3。
      - 心相+10。
      - -----2. 若🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟)，且心上人为叶云裳-----
      - 叶云裳好感+2。
      - 道德≥40: 对话差分。
      - 检定🚩[叶云舟同行武林大会](/event/simple/3-10-2-点苍逆徒#师徒对决):
      - • 符合: 对话差分。若性情≥40，再差分。
      - • 不符: 对话差分。
      - 心相+30。
      - 心相+30。
      - -----3. 若🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹)，且心上人为郁竹-----
      - 郁竹好感+2。
      - 性情≥40: 对话差分。
      - 触发选项:
      - 👉 「都不给点甜头」:
      - • 嘴力+1、处世-1、性情+1。
      - 👉 「在身边就很好」:
      - • 修养+1、性情-1、处世-1，郁竹好感+1。
      - 道德≥40: 对话差分。
      - 心相+30。
      - 心相+20，郁竹好感+2。
      - -----4. 其他-----
      - 心相+30。
      - ----------
      - 接[「翌日早晨」](/event/simple/3-10-2-翌日早晨)事件。
    数值:
      心相: +190
      道德: +1
      嘴力: +2
      性情: +0
      唐默铃好感: +3
      叶云裳好感: +2
      郁竹好感: +2