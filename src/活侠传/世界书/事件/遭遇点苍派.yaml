      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)旅途前半随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 检定🚩[宋悲同行武林大会](/event/simple/3-09-1-遭遇官兵):
      - -----宋悲有同行-----
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - -----宋悲未同行-----
      - 叶氏兄妹同行判定:
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟)且🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟)且🚩[叶云裳未同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
