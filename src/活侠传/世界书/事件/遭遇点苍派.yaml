      - 接「点苍对策」阶段。
  点苍对策:
    触发:
      - 接续「遭遇点苍派」阶段
    经过:
      - 对待点苍的对策，触发选项:
      - 👉「忍气吞声」:
      - • 性情-1、处世-2、修养+1、名声-1。
      - • 叶云舟好感+1、叶云裳好感-1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 👉「一对一切磋」:
      - • 性情+2。
      - • 接「点苍弟子切磋」阶段。
      - 👉「战你娘亲」:
      - • 性情+1、处世+2、名声+1。
      - • 接「战点苍派」阶段。
    数值:
      性情: +2
      叶云舟好感: +1
      叶云裳好感: -1
  点苍弟子切磋:
    触发:
      - 接续「点苍对策」阶段
    经过:
      - 触发对决 🆚战点苍弟子:
      - 对决结果检定:
      - 落败:
      - • 进入[生死簿51:《点苍剑下亡魂》](/event/badends/#生死簿-No.51)。
      - 获胜: 触发选项:
      - 👉「杀害」: 名声+2、向心+2，点苍派好感-2。
      - 👉「手下留情」: 道德+2、处世-1、修养+1，点苍派好感+1。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      向心: +2
      道德: +2
      点苍派好感: +1
  战点苍派:
    触发:
      - 接续「点苍对策」阶段
    经过:
      - 触发战役 ⚔️战点苍派:
      - 战役结果检定:
      - • 落败: 名声-3、心相-20、向心-3，叶云舟好感-1、唐升好感-3。
      - • 获胜: 名声+3、向心-2，唐升好感-1、点苍派好感-2。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      心相: -20
      向心: -5
      叶云舟好感: -1
      唐升好感: -1
      点苍派好感: -2