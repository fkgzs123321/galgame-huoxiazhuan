事件: 入住客栈
时序: 第3年10月中旬
  入住客栈:
    触发:
      - 接续[「各派支持」](/event/simple/3-10-2-各派支持)、
      - [「武林公敌」](/event/simple/3-10-2-武林公敌)，或
      - [「泥教来袭」](/event/simple/3-10-2-泥教来袭)事件
    经过:
      - 显示大地图移动。
      - 🚩[武林公敌同意留下](/event/simple/3-10-2-武林公敌#独自出面)，且🚩[助石帮主夫妇和好](/event/simple/3-01-3-围观卧云岗): 对话差分。
      - 🚩武林公敌同意留下，且🚩助石帮主夫妇和好: 若处世≥60，对话差分。
      - 🚩成为崆峒掌派人:
      - • 处世检定:
      - • 处世≥60: 心相+10。
      - • 处世＜60: 对话差分。
      - • 🚩和魏菊结缘: 魏菊好感+1。
      - • 检定🚩和魏菊结缘:
      - 未结缘:
      - • 对话差分。
      - 有结缘:
      - • 🚩[各派支持度](/event/simple/3-10-2-公审唐门#公审总结)＜0: 对话差分。
      - • 心上人检定:
      - • 心上人为魏菊: 心相+50。
      - • 心上人非魏菊: 心相+20、道德-1。
      - 🚩各派支持度＜0:
      - • 性情检定:
      - • 性情＜60: 对话差分。
      - • 性情≥60: 对话差分。
      - 🚩[唐门收留龙湘](/event/simple/3-10-2-锦香真相#龙湘求助): 对话差分。
      - 🚩[樊啸天加入唐门](/event/simple/3-10-2-公审唐门#丐帮表态):
      - • 🚩[樊啸天拜师夏侯兰](/event/simple/2-04-1-助你收心): 对话差分。
      - • 触发选项:
      - 👉「让狗睡外面」:
      - • 处世-1，樊啸天好感-1。
      - • 道德≤40: 对话差分。
      - 👉「有钱能使鬼推磨」:
      - • 解锁此选项需银两≥1000。
      - • 处世+1、性情+1、修养-2。
      - • 处世＜60: 对话差分。
      - • 银两-1000、名声-1，樊啸天好感+3。
      - 检定🚩[武林大会伤亡情况](/event/simple/3-10-2-战后闲聊#伤亡情况):
      - 1. 🚩武林大会死伤惨重: 对话差分。
      - 2. 🚩武林大会有死有伤: 对话差分。
      - 3. 🚩武林大会无人送命: 对话差分。
      - 心相=0: 体力-1、性情-1、修养-1。
      - 🚩[大会后与上官萤有约](/event/simple/3-10-2-战后闲聊#致哀南宫): 对话差分。
      - 接[「客栈休憩」](/event/simple/3-10-2-客栈休憩)事件。
    数值:
      心相: +80
      道德: -1
      性情: +0
      魏菊好感: +1
      樊啸天好感: +3