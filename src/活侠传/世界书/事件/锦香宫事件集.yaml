事件: 锦香宫事件集
时序: 第3年9月下旬
系列: 共 6 环
  前往锦香宫:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)结尾选择
      - 事件 ☯「锦香宫作客」
    经过:
      - 请见[「前往锦香宫」](/event/simple/3-09-3-前往锦香宫)事件
    备注: 选择 ☯「锦香宫作客」时

 ，会设置🚩「锦香宫作客」。
  龙湘夜游:
    触发:
      - 🚩锦香宫作客
      - 龙湘好感≥40
      - 时间范围内，自动触发
    经过:
      - 请见[「龙湘夜游」](/event/simple/3-09-3-龙湘夜游)事件。
    旗标:
      - 锦香宫作客
    备注: [结缘龙湘](/event/pursuit/girl8)必要事件。
  锦香宫
自由行动:
    触发:
      - 🚩锦香宫作客
      - 时间范围内，每行动点开始时触发
    经过:
      - 触发 ☯议题选单:
      - 其他 ☯「休息」:
      - • 行动次数-1，心相+40。
      - 事件 ☯「参观锦香宫」:
      - • 行动次数-1，接[「参观锦香宫」](/event/simple/3-09-3-参观锦香宫)事件。
      - • 一次性事件，触发后关闭选项。
      - 其他 ☯「华音阁」:
      - • 解锁此选项需已 ☯参观锦香宫。
      - • 行动次数-1，接[「华音阁」](/system/training/)随机养成事件。
      - 事件 ☯「修练: 武英殿」:
      - • 解锁此选项需已 ☯参观锦香宫。
      - • 行动次数-1，接[「武英殿修练」](/event/simple/3-09-3-武英殿修练)事件。
      - 事件 ☯「挑战画中仙」:
      - • 解锁此选项需🚩[知道画中仙即仙儿](/event/simple/3-09-3-参观锦香宫)。
      - • 行动次数-1，接[「挑战画中仙」](/event/simple/3-09-3-挑战画中仙)事件。
      - • 一次性事件，触发后关闭选项。
      - 事件 ☯「洞庭游」:
      - • 此选项目前关闭。
    数值:
      心相: +40
    旗标:
      - 锦香宫作客
    备注: 本项实为留宿锦香宫期间的[养成指令](/system/training/)集合，

