事件: 遭遇段智秀
时序: 第2年10月中旬
系列: 共 7 环
  旱天雷响:
    触发:
      - 青城留学线
      - 时间到自动触发
    经过:
      - 不祥之兆: 若性情≤40，心相-10。
      - 叶云裳惊吓，道德检定:
      - 道德≥60:
      - • 云裳依偎，心相+30、叶云裳好感+1。
      - • 心上人非叶云裳: 变心+4。
      - 道德＜60:
      - • 比我还坏，对话差分。
      - 接「长老议事」阶段。
    数值:
      心相: +20
      叶云裳好感: +1
  长老议事:
    触发:
      - 接续「旱天雷响」阶段
    经过:
      - 邹博与长老讨论召开比试。
      - 铁冠道人携段智秀出场。
      - 接「门外闲聊」阶段。
  门外闲聊:
    触发:
      - 接续「长老议事」阶段
    经过:
      - 出门遇青城弟子，🚩青城功勋检定:
      - 🚩青城功勋≥5:
      - • 道长问好，对话差分。
      - • 性情＞40: 无稽之谈，叶云裳好感+1。
      - • 免费取用哥哥，叶云裳好感+1。
      - 🚩青城功勋＜5:
      - • 道长不问好，修养检定:
      - • 修养≤40: 心相-15。
      - • 修养＞40: 心相-5。
      - 唐门杂鱼，复合检定:
      - 嘴力≥30且性情≥60:
      - • 处世-1，道德检定:
      - • 道德≤40: 是我老婆，嘴力+1、叶云裳好感-1。
      - • 道德＞40: 天仙下凡，叶云裳好感+1。
      - 嘴力＜30或性情＜60:
      - • 软弱抱怨，对话差分。
      - 接续的阶段，复合检定:
      - • 曾触发[「申屠遇袭」](/event/simple/2-09-3-申屠遇袭)，且申屠龙好感≥20: 接「申屠避难」阶段。
      - • 其他情况: 接「冤家路窄」阶段。
    数值:
      心相: -20
      嘴力: +1
      叶云裳好感: +1
    备注: 🚩青城功勋: 透过[养成事件](/system/training/)获得。
  申屠避难:
    触发:
      - 接续「门外闲聊」阶段
    经过:
      - 申屠龙又被娘子追，设置🚩「申屠龙在场」。
      - 评论追逐申屠龙的娘子们，变心次数检定:
      - 变心次数≥2:
      - • 身在福中不知福，叶云裳好感-2，处世检定:
      - • 处世≥60: 人之常情，申屠龙好感-1。
      - • 处世＜60: 我说笑的，对话差分。
      - 变心次数＜2: 无特别对话。
      - 若完成[风云史00:《命中有数》](/event/achievements/#风云史-No.00): 申屠龙内心戏，对话差分。
      - 接「冤家路窄」阶段。
    数值:
      叶云裳好感: -2
      申屠龙好感: -1
  冤家路窄:
    触发:
      - 接续「门外闲聊」或「申屠避难」阶段
    经过:
      - 铁冠道人携段智秀出场。
      - 叶云裳告知段智秀为点苍人，处世检定:
      - • 处世＜60: 几时有你，对话差分。
      - • 处世≥60: 那就不怪，对话差分。
      - 段智秀指认云裳，你的反应，触发🎲天命:
      - (上限99，修养扣除，处世扣除)
      - 【🎲＜50 先打几拳再说!】: 接「战段智秀」阶段。
      - 【🎲≥50 立刻告状!】: 接「赵活告状」阶段。
  战段智秀:
    触发:
      - 接续「冤家路窄」阶段
      - 且【🎲≥50 立刻告状!】
    经过:
      - 赵活怒言: 处世+1、修养-1、青城派好感-1。
      - 触发对决🆚「战段智秀」(见备注)，对决结果检定:
      - 对决获胜:
      - • 武学+6、青城派好感-1，对话差分。
      - • 若🚩申屠龙在场: 使得不坏，申屠龙好感+1。
      - • 哥哥武功真高: 叶云裳好感+1。
      - • 段智秀怀疑不是唐门武功，触发嘴力检定:
      - • 嘴力＜40: 你管什么，对话差分。
      - • 嘴力≥40: 杀龟拳，嘴力+1、修养-1。
      - • 若🚩申屠龙在场，申屠龙好感检定:
      - • 申屠龙好感≥25: 来者是客，对话差分。
      - • 申屠龙好感＜25: 无话可说，对话差分。
      - 对决平局:
      - • 武学+4，对话差分。
      - • 若🚩申屠龙在场，申屠龙好感检定:
      - • 申屠龙好感≥25: 旗鼓相当，对话差分。
      - • 申屠龙好感＜25: 无话可说，对话差分。
      - 对决落败:
      - • 体力-1、内力-1，对话差分。
      - • 若🚩申屠龙在场: 太多丑角，申屠龙好感-2。
      - 无论对决结果，接「赵活告状」阶段。
    数值:
      嘴力: +1
      青城派好感: -1
      申屠龙好感: -2
      叶云裳好感: +1
    备注: 🆚「战段智秀」特殊机制:

 • 第1回合叶云裳加入我方，敌方愤怒。

 • 0%＜敌方血量≤50%: 敌方新增辅助「铁冠道人」。

 • 0%＜敌方血量≤40%: 强制结束，对决平局。

 • 第8回合: 强制结束，对决平局。
  赵活告状:
    触发:
      - 接续「冤家路窄」或「战段智秀」阶段
    经过:
      - 赵活述破庙之事，检定🚩「申屠龙在场」及处世＜60: 四种情况对话差分。
      - 段智秀否认: 若处世＜60，对话差分。
      - 若🚩申屠龙在场: 铁冠询问申屠龙，对话差分。
      - 叶云裳助言，段智秀反驳: 若🚩申屠龙在场，对话差分。
      - 有何利益: 若处世≥60，对话差分。
      - 杀你无责: 若性情≥60，对话差分。
      - 铁冠袒护: 若🚩申屠龙在场，对话差分。
      - 是非不分: 若性情≥60，对话差分。
      - 不予追究: 若🚩申屠龙在场，对话差分。
      - 段智秀藉机讨好叶云裳，修养检定:
      - • 修养≤40: 对话差分。若🚩申屠龙在场，申屠龙好感-1。
      - • 修养＞40: 无特别对话。
      - 赵活与叶云裳离去，余下众人对话。
      - 检定🚩申屠龙在场，以及完成[风云史00:《命中有数》](/event/achievements/#风云史-No.00): 四种情况对话差分。
      - 接[「云裳商议」](/event/simple/2-10-2-云裳商议)事件。
    数值:
      申屠龙好感: -1