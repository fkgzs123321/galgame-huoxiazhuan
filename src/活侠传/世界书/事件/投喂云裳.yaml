事件: 投喂云裳
时序: 第2年10月中旬
系列: 共 3 环
  求援后续:
    触发:
      - 接续[「云裳商议」](/event/simple/2-10-2-云裳商议)事件
    经过:
      - 求援无音信，第二名唐门弟子出发。
      - 飞鸽扑身，道德检定:
      - • 道德≥40: 怎么回事，对话差分。
      - • 道德＜40: 捉来吃，道德-1。
      - 无糖哥哥挨人揍，学问检定:
      - • 学问≥30: 乱七八糟，对话差分。
      - • 学问＜30: 无话可说。
      - 鸽子飞走，道德检定:
      - • 道德≥40: 无特别对话。
      - • 道德＜40: 餐点飞走，对话差分。
      - 接「通关密语」阶段。
    数值:
      道德: -1
  通关密语:
    触发:
      - 接续「求援后续」阶段
    经过:
      - 云裳房门通关密语，触发选项:
      - 👉「山林墨骨书香，花街锦衣铜臭」:
      - • 答案错误，对话差分。
      - • 人走餐留，修养检定:
      - • 修养≤40: 逼我开门，对话差分。
      - • 修养＞40: 你趁热吃，叶云裳好感+2。
      - 👉「不吃我拿走了喔」:
      - • 拿捏住你，处世+1、嘴力+1。
      - 👉「朗读飞鸽传书」:
      - • 答案正确，心相+10、叶云裳好感+1。
      - 接「投喂云裳」阶段。
    数值:
      嘴力: +1
      心相: +10
      叶云裳好感: +1
  投喂云裳:
    触发:
      - 接续「通关密语」阶段
    经过:
      - 房内投喂云裳，银两检定:
      - • 银两≥1000: 满意就好，银两-1000、叶云裳好感+2。
      - • 1000＞银两≥500: 钱不大够，银两-500、叶云裳好感+1。
      - • 银两＜500: 我没钱了，银两-50，对话差分。
      - 云裳揭露段智秀讨好自己。
      - 求援唐门弟子路上遇段智秀。
      - 事件结束，接青城养成指令。
    数值:
      叶云裳好感: +1