事件: 云裳倒地
时序: 第2年11月上旬
系列: 共 8 环
  云裳倒地:
    触发:
      - 青城留学线
      - 时间到自动触发
    经过:
      - 叶云裳从往事噩梦苏醒。
      - 被迷倒的赵活惊醒: 抗毒+1、抗麻+1。
      - 修养≥40: 对话差分。
      - 云裳剧情，无差分:
      - • 内心争辩、下定决心。
      - • 计诱段智秀。
      - • 因锦囊信笺倒地。
      - 接「门外等待」阶段。
    数值:
      抗毒: +1
      抗麻: +1
  门外等待:
    触发:
      - 接续「云裳倒地」阶段
    经过:
      - 赵活与段智秀门外等待云裳的诊断结果。
      - 修养＜60: 对话差分。
      - 修养＜60: 对话差分。
      - 修养≤40: 对话差分。
      - 触发选项:
      - 👉「骂他，挑衅他，伺机揍他」:
      - • 处世≥60: 心相-20。
      - • 心相-20、处世+1、青城派好感-1。
      - 👉「安静的等」:
      - • 对话差分。
      - 道德≤40: 对话差分。
      - 处世≥40: 对话差分。
      - 接「询问段智秀」阶段。
    数值:
      心相: -40
      青城派好感: -1
  询问段智秀:
    触发:
      - 接续「门外等待」
      - 、「反问题一」或
      - 「反问题二」阶段
    经过:
      - 触发 ☯议题选单:
      - 离开 ☯「已无话可说」:
      - • 若🚩问答次数=0: 对话差分。
      - • 接「诊断结果」阶段。
      - 闲聊 ☯「你的目的」:
      - • 接「反问赵活」阶段。
      - 闲聊 ☯「那封信」:
      - • 若曾经🆚[「战段智秀」](/event/simple/2-10-2-遭遇段智秀): 对话差分。
      - • 若全炼丹点数≥60: 设置🚩「主使情报」。
      - • 接「反问赵活」阶段。
      - 闲聊 ☯「幕后主使」:
      - • 检定🚩主使情报:
      - • 无🚩主使情报: 对话差分。
      - • 有🚩主使情报: 处世＜60，对话差分。获得[《枯荣神功上卷》](/system/books/book_7017)。
      - • 无论是否得知，接「反问赵活」阶段。
    备注: 如欲获得《枯荣神功上卷》，则闲聊

 ☯「那封信」需先于 ☯「幕后主使」。
  反问赵活:
    触发:
      - 接续「询问段智秀」阶段
    经过:
      - 检定🚩问答次数(初始值为0):
      - 🚩问答次数=0: 接「反问题一」阶段。
      - 🚩问答次数=1: 接「反问题二」阶段。
      - 🚩问答次数=2: 接「反问题三」阶段。
  反问题一:
    触发:
      - 接续「反问赵活」阶段
    经过:
      - 设置🚩问答次数=1，触发选项:
      - 👉「平平无奇唐门弟子」:
      - • 处世-1。
      - • 接「反问题二」阶段。
      - 👉「我是你的恶梦」:
      - • 嘴力+1、性情+1。
      - • 接「反问题二」阶段。
      - 👉「大宋赵氏宗亲」:
      - • 嘴力+2、道德-1。
      - • 设置🚩「冒充宋室」。
      - • 接「询问段智秀」阶段。
    数值:
      嘴力: +3
      性情: +1
      道德: -1
    备注: 仅回答👉「大宋赵氏」才

 可能问完赵活的三个问题。
  反问题二:
    触发:
      - 接续「反问赵活」
      - 或「反问题一」阶段
    经过:
      - 设置🚩问答次数=2。
      - 道德≥40: 对话差分。
      - 嘴力+1。
      - 接「询问段智秀」阶段。
    数值:
      嘴力: +1
  反问题三:
    触发:
      - 接续「反问赵活」阶段
    经过:
      - 触发🎲天命:
      - (上限99，叶云裳好感扣除、叶云舟好感补正)
      - 【🎲＜50 她在唐门交到了朋友吗?】:
      - • 若道德＜40，对话差分。
      - 【🎲＜80 她可曾提起我的事?】:
      - • 若未🚩[了解段氏世系](/event/simple/2-10-2-云裳商议): 心相+10。
      - 【🎲≥80 叶云舟的近况】:
      - • 道德≤40: 对话差分，处世检定:
      - • 处世≥60: 对话差分。
      - 接「诊断结果」阶段。
    数值:
      心相: +10
  诊断结果:
    触发:
      - 接续「询问段智秀」
      - 或「反问赵活」阶段
    经过:
      - 性情≥60: 对话差分。
      - 处世＜60: 对话差分。
      - 修养检定:
      - • 修养≥40: 处世-1。
      - • 修养＜40: 道德-1、嘴力-1
      - 心相-20。
      - 心上人检定:
      - 若心上人为叶云裳:
      - • 道德＜60: 对话差分。
      - • 心相-20。
      - 若心上人非叶云裳:
      - • 对话差分。
      - 再次心上人检定:
      - 若心上人为叶云裳:
      - • 叶云裳好感+2。
      - • 若道德＜40且性情≥60: 嘴力+2、叶云裳好感-1。
      - 若心上人非叶云裳:
      - • 对话差分。
      - 事件结束，回青城养成指令。
    数值:
      道德: -1
      嘴力: +1
      心相: -40
      叶云裳好感: -1