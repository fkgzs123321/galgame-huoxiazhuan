事件: 遭遇嵩山派
时序: 第3年9月上旬
  遭遇嵩山派:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)旅途后半随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 嵩山派好感检定:
      - 嵩山派好感≤0:
      - • 向心-1、道德+1。
      - • 设置🚩「嵩山派同行武林大会」。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 嵩山派好感＞0:
      - • 嵩山派好感+1。
      - • 检定🚩[福韫同行武林大会](/event/simple/3-09-1-前往武林大会):
      - 福韫未同行:
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 福韫有同行:
      - • 🚩和虞小梅结缘: 对话差分。
      - • 嵩山派邀请留学，触发选项:
      - 👉「容我拒绝」:
      - • 处世+1、性情+1。
      - • 对话差分。
      - 👉「十分乐意」:
      - • 获得秘笈[《那由它劫指》](/system/books/book_4005)。
      - • 道德+3、学问+2，嵩山派好感+2。
      - • 设置🚩「答应去嵩山留学」。
      - • 设置🚩「觉慧赠那由他劫指」。
      - • 取消🚩「福韫同行武林大会」。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      向心: -1
      道德: +4
      性情: +1
      嵩山派好感: +2