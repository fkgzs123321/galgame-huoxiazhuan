事件: 剑圣传承
时序: 第4年2月下旬
系列: 共 2 环
  云裳有约:
    触发:
      - 西武林盟路线
      - 满足🚩剑圣传承前置(见备注)
      - 时间范围内，点选「大门」触发
    经过:
      - 道德≤40: 对话差分。
      - 检定🚩叶云舟在唐门:
      - 若🚩叶云舟不在唐门(当前版本办不到):
      - • 接「参悟极招」阶段。
      - 若🚩叶云舟在唐门:
      - • 叶云舟是否出现，触发🎲天命(上限99):
      - 【🎲＜50 叶云舟出现了】:
      - • 体力检定:
      - 1. 体力＜50: 对话差分。
      - 2. 80＞体力≥50: 对话差分。
      - 3. 体力＞80: 对话差分。
      - • 体力+2、名声+1、银两+3000、贡献度+20、叶云舟好感+2。
      - • 道德≤40: 对话差分。
      - • 心相-30。
      - • 设置🚩「剑圣传承被叶云舟终止」。
      - • 设置🚩「完成剑圣传承支线」。
      - • 事件结束，回唐门养成指令。
      - 【🎲≥50 叶云舟没出现】:
      - • 接「参悟极招」阶段。
    数值:
      心相: -30
      叶云舟好感: +2
    旗标:
      - 剑圣传承前置
    备注: 要触发🚩剑圣传承前置:

 • 曾经🚩[听过剑圣极招](/event/simple/3-05-1-谷底生活)。

 • 成功进入[东西武林盟会战](/event/detailed_description/4-02-2-东西武林盟会战)。

 • 会战时，🚩叶云裳在唐门(需[结缘](/event/pursuit/girl2))

 • 战后叶云裳找赵活时，叶云裳好感≥50。
  参悟极招:
    触发:
      - 接「云裳有约」阶段
    经过:
      - 处世≥60: 对话差分。
      - 若有🚩叶云裳学琴: 对话差分。
      - 刀剑≥80: 对话差分。
      - 刀剑≥80: 对话差分。
      - [技能](/system/skill)检定，若无「同舟剑法」且有「点破云关」:
      - • 触发🎲天命:
      - • (上限30，刀剑x0.8、修养、心相补正，若🚩叶云裳学琴再+20)
      - 【🎲＜50 你什么也没想明白】: 未领悟极招。
      - 【🎲＜65 第一极招】: 领悟「剑圣第一极招」。
      - 【🎲＜85 第二极招】: 领悟「剑圣第二极招」。
      - 【🎲≥85 第三极招】: 领悟「剑圣第三极招」。
      - 技能检定不符: 无特别剧情。
      - 检定是否领悟剑圣极招:
      - 若领悟任何极招:
      - • 武学+5。
      - • 觉醒相应的极招技能。
      - • 处世＜60: 对话差分。
      - • 叶云裳好感+1。
      - 若未领悟任何极招:
      - • 拥有技能，复合检定(不符才检定下一项):
      - 1. 有「同舟剑法」: 对话差分。
      - 2. 无「点破云关」: 对话差分。
      - 3. 其他(有「点破云关」只是未领悟): 无特别对话。
      - • 心相+100、叶云裳好感+3。
      - 设置🚩「完成剑圣传承支线」。
      - 事件结束，回唐门养成指令。
    数值:
      心相: +100
      叶云裳好感: +3
    备注: 剑圣极招实际强度不如同舟剑法。