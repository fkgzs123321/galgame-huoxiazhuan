事件: 申屠遇袭
时序: 第2年9月下旬
系列: 共 3 环
  申屠遇袭:
    触发:
      - 青城留学线
      - 在事件时间范围内
      - 常风观散步指令，随机触发(权重100)
      - 一次性事件，不可重复触发
    经过:
      - 申屠龙被女子包围。
      - 申屠龙反应: 若完成[风云史00:《命中有数》](/event/achievements/#风云史-No.00)，对话差分。
      - 申屠龙怎么利用你，触发🎲天命(上限50，申屠龙好感补正):
      - 【🎲＜50 盾牌】:
      - • 女子嫌弃: 心相-10、心相-10、心相-10。
      - • 当作盾牌: 体力-1、心相-15。
      - • 接「解释缘由」阶段
      - 【🎲≧50 暗器】:
      - • 撞倒女子: 若修养≤40，对话差分。
      - • 丑男非礼: 若道德≤40，对话差分。
      - • 路见不平: 若处世≥40，对话差分。
      - • 接「对决拳师」阶段。
    数值:
      心相: -45
  对决拳师:
    触发:
      - 接续「申屠遇袭」阶段
      - 【🎲≧50 暗器】
    经过:
      - 触发🆚「对决拳师」。
      - 对决结果检定:
      - 对决落败:
      - • 心相-50、名声+3、贡献度-30、叶云裳好感-1。
      - • 增加被关剧情，设置🚩「被关次数」+1。
      - • 增加向叶云裳解释剧情。
      - • 事件结束，回青城养成指令。
      - 对决胜利:
      - • 若道德≤40，对话差分。
      - • 接「解释缘由」阶段。
    数值:
      心相: -50
      叶云裳好感: -1
  解释缘由:
    触发:
      - 接续「申屠遇袭」或「对决拳师」阶段
    经过:
      - 赵活抱怨: 若修养＜60，对话差分。
      - 申屠解释: 申屠龙好感+1。
      - 承蒙相救，修养检定:
      - • 修养＜60: 对话差分。
      - • 修养≧60: 申屠龙好感+2 。
      - 若申屠龙好感≧20:
      - • 颇有妙用，对话差分。
      - • 增加常风观散步遇见申屠龙机率(见备注)。
      - 事件结束，回青城养成指令。
    数值:
      申屠龙好感: +2
    备注: • 散步遇见申屠龙需🚩青城散步≧3。

 • 🚩青城散步: 透过[养成事件](/system/training/)获得。
 
 • 遇申屠龙机率增加: 权重由30增加为60。