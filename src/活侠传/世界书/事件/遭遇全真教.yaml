事件: 遭遇全真教
时序: 第3年9月上旬
系列: 共 3 环
  遭遇全真教:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)旅途后半随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 检定🚩[宋悲同行武林大会](/event/simple/3-09-1-遭遇官兵)以及门派规模:
      - 宋悲有同行:
      - • 向心+1、心相+10、名声+1。
      - • 上官家好感+1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 宋悲未同行，且门派规模≥3:
      - • 心相+10、名声+1。
      - • 全真教好感+1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 宋悲未同行，且门派规模＜3:
      - • 接「全真对策」阶段。
    数值:
      向心: +1
      心相: +20
      上官家好感: +1
      全真教好感: +1
  全真对策:
    触发:
      - 接续「遭遇全真教」阶段
    经过:
      - 对待全真的对策，触发选项:
      - 👉「欠揍」:
      - • 性情+1、处世+2、道德-2、修养-2。
      - • 尹志平好感-2、唐升好感-2。
      - • 接「战全真长老」阶段。
      - 👉「河水不犯井水」:
      - • 处世-1、性情-1、修养+1、向心-1。
      - • 唐升好感+1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      性情: +0
      道德: -2
      向心: -1
      尹志平好感: -2
      唐升好感: +1
  战全真长老:
    触发:
      - 接续「全真对策」阶段
    经过:
      - 触发对决 🆚战全真长老:
      - 对决结果检定:
      - 落败:
      - • 进入[生死簿66:《被道士当妖怪误杀》](/event/badends/#生死簿-No.66)
      - 获胜:
      - • 武学+4、名声+2、向心+1。
      - • 嘴力≥50: 名声+2、向心+1，全真以外五大派及南宫家好感+1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      向心: +2
      及南宫家好感: +1