事件: 遭遇峨嵋派
时序: 第3年9月上旬
系列: 共 4 环
  遭遇峨嵋派:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)路程随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 检定🚩[宋悲同行武林大会](/event/simple/3-09-1-遭遇官兵):
      - 有同行:
      - • 向心+1、心相+10、名声+1。
      - • 上官家好感+1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 未同行:
      - • 接「峨嵋对策」阶段。
    数值:
      向心: +1
      心相: +10
      上官家好感: +1
  峨嵋对策:
    触发:
      - 接续「遭遇峨嵋派」阶段
    经过:
      - 对待峨嵋的对策，触发选项:
      - 👉「揍他们」:
      - • 性情+2、处世+2、道德-3、修养-3。
      - • 解无尘好感-2、唐升好感-2、峨嵋派好感-2。
      - • 接「战峨嵋派」阶段。
      - 👉「无所谓」:
      - • 修养+1、处世±1、性情±1。
      - • 峨嵋派好感+1。
      - • 解无尘好感检定:
      - • 解无尘好感＜30: 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - • 解无尘好感≥30: 解无尘邀请切磋，再触发选项:
      - 👉「请指教」:
      - • 解锁此项需性情≥40。
      - • 性情+1、处世+1。
      - • 解无尘好感+2。
      - • 接「解无尘切磋」阶段。
      - 👉「才不要」:
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 👉「才不要(偷袭)」:
      - • 解锁此项需道德＜40。
      - • 性情+1、处世-1、道德-2。
      - • 设置🚩「偷袭解无尘」。
      - • 接「解无尘切磋」阶段。
    数值:
      性情: +4
      道德: -5
      解无尘好感: +2
      唐升好感: -2
      峨嵋派好感: +1
  战峨嵋派:
    触发:
      - 接续「峨嵋对策」阶段
    经过:
      - 触发战役 ⚔️战峨嵋派:
      - 战役结果检定:
      - • 落败: 名声-2、心相-20、向心-2，唐升好感-3。
      - • 获胜: 武学+4、名声+2、向心+1。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      心相: -20
      向心: -1
      唐升好感: -3
  解无尘切磋:
    触发:
      - 接续「峨嵋对策」阶段
    经过:
      - 触发对决 🆚战解无尘:
      - • 若有🚩偷袭解无尘: 敌方血量-20%。
      - 对决结果检定:
      - 落败:
      - • 武学+4、心相-20、体力-1。
      - • 解无尘好感+2。
      - • 设置🚩「曾败于解无尘」。
      - • 若有🚩偷袭解无尘: 对话差分。
      - 获胜:
      - • 武学+6、心相+20、名声+3。
      - • 设置🚩「曾战胜解无尘」。
      - • 若有🚩偷袭解无尘: 对话差分。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      心相: +0
      解无尘好感: +2