事件: 失魂醒转
时序: 第3年11月上旬
系列: 共 5 环
  梦中仙人:
    触发:
      - 接续[「对决金乌」](/event/simple/3-05-1-对决金乌)事件
      - 的「走马看花」阶段
    经过:
      - 设定时间为第三年十一月上旬。
      - 触发选项:
      - 👉「带我走」:
      - • 接[「长眠」](#长眠)阶段。
      - 👉「放不下」:
      - • 再触发选项:
      - 👉「放弃」:
      - • 接[「长眠」](#长眠)阶段。
      - 👉「回去」:
      - • 性情+2。
      - • 命运＜10: 对话差分。
      - • 接[「醒转」](#醒转)阶段。
    数值:
      性情: +2
  长眠:
    触发:
      - 接续[「梦中仙人」](#梦中仙人)阶段
    经过:
      - 命运＜10: 对话差分。
      - 进入[汗青书06:《睡死》](/event/ends/end-6)。
  醒转:
    触发:
      - 接续[「梦中仙人」](#梦中仙人)阶段
    经过:
      - 设置🚩「四师兄在唐门」。
      - 设置🚩「龙湘不在唐门」。
      - 设置🚩「上官萤不在唐门」。
      - 解锁称号[「唐门丑侠」](/people/title-list)。
      - 接[「战三师兄」](#战三师兄)阶段。
  战三师兄:
    触发:
      - 接续[「醒转」](#醒转)阶段
    经过:
      - 触发对决 🆚战唐升:
      - • 第3回合: 事件对话。
      - • 第4回合: 事件对话。
      - 对决结果检定:
      - • 获胜: 对话差分。
      - • 落败: 对话差分。
      - 接[「恢复记忆」](#恢复记忆)阶段。
  恢复记忆:
    触发:
      - 接续[「战三师兄」](#战三师兄)阶段
    经过:
      - 赵活恢复记忆。
      - 事件结束，接[唐门养成指令](/system/training/)。