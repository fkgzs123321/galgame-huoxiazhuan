事件: 申屠赠礼
时序: 第2年9月上旬
系列: 共 2 环
  新的秘笈:
    触发:
      - 曾在[「青城排挤」](/event/simple/2-08-3-青城排挤)事件中获得[《三五斩妖剑》](/system/books/book_2009)
      - 《三五斩妖剑》修练完毕
      - 曾在常风观修练时，触发与申屠龙对练(需申屠龙好感≥15)
      - 时间范围内，自动触发
    经过:
      - 与申屠龙对练获得肯定，申屠龙好感+2。
      - 获赠秘笈[《虎啸功》](/system/books/book_7016)。
      - 接「云裳回礼」阶段。
    数值:
      申屠龙好感: +2
  云裳回礼:
    触发:
      - 接续「新的秘笈」阶段
    经过:
      - 触发🎲天命，云裳回赠申屠龙的礼物(上限99):
      - 【🎲＜33 雪球教战守则二】: 对话差分。
      - 【🎲＜66 盘古开天破】: 对话差分。
      - 【🎲≥66 斩天黑翼双龙剑】: 对话差分。
      - 事件结束，回青城留学养成指令。
    备注: 礼物差异，目前看不出对
