事件: 人间落幕
时序: 第3年10月中旬
系列: 共 4 环
  恶斗尾声:
    触发:
      - 接续[「围攻锦香」](/event/simple/3-10-2-围攻锦香)事件
    经过:
      - 锦香宫战局不利，温夫人下令收拢宫人。
      - 检定🚩[武林大会支持锦香宫](/event/simple/3-10-2-唐门抉择):
      - 有支持锦香宫:
      - • 复合检定(不符才检定下一项):
      - 1. 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - 2. 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 3. 其他: 无特别对话。
      - • 检定🚩成为崆峒掌派人:
      - • 有成为掌派: 若未🚩和郁竹结缘，对话差分。
      - • 未成为掌派: 无特别对话。
      - 未支持锦香宫:
      - • 对话差分。
      - 接[「战后谈判」](#战后谈判)阶段。
  战后谈判:
    触发:
      - 接续[「恶斗尾声」](#恶斗尾声)阶段
    经过:
      - 温夫人与敌方对话。
      - 🚩[武林大会支持锦香宫](/event/simple/3-10-2-唐门抉择): 对话差分。
      - 释明对话，检定🚩武林大会支持锦香宫:
      - 有支持锦香宫:
      - • 福韫好感检定:
      - • 福韫好感≥20: 嘴力+2。
      - • 福韫好感＜20: 嘴力+1。
      - 未支持锦香宫:
      - • 无特别对话。
      - 上官隼要李富贵收尾，检定🚩武林大会支持锦香宫:
      - 有支持锦香宫:
      - • 丐帮好感≥5: 若李富贵好感≥10，对话差分。
      - 未支持锦香宫:
      - • 对话差分。
      - 李富贵表态，检定🚩武林大会支持锦香宫:
      - 有支持锦香宫:
      - • 李富贵好感检定:
      - • 李富贵好感≥10: 若修养≤40，对话差分。若龙湘好感≥30，对话差分。
      - • 李富贵好感＜10: 若龙湘好感≥30，对话差分。
      - 未支持锦香宫:
      - • 对话差分。
      - 温夫人训斥龙湘，检定🚩[唐门收留龙湘](/event/simple/3-10-2-锦香真相#龙湘求助):
      - • 有收留: 龙湘+3。
      - • 未收留: 对话差分。
      - 上官隼欲亲自了断，检定🚩武林大会支持锦香宫:
      - 有支持锦香宫:
      - • 处世≤40: 对话差分。
      - • 性情≤40: 对话差分。
      - 未支持锦香宫
      - • 无特别对话。
      - 🚩唐门收留龙湘: 对话差分。
      - 接[「锦香终曲」](#锦香终曲)阶段。
    数值:
      嘴力: +3
  锦香终曲:
    触发:
      - 接续[「战后谈判」](#战后谈判)阶段
    经过:
      - 温夫人欲与宫人自焚而死，上官隼成全。
      - 检定🚩[武林大会支持锦香宫](/event/simple/3-10-2-唐门抉择):
      - 有支持锦香宫:
      - • 🚩[唐门收留龙湘](/event/simple/3-10-2-锦香真相#龙湘求助): 对话差分。
      - • 处世＜60: 对话差分。
      - • 🚩成为崆峒掌派人: 对话差分。
      - • 🚩唐门收留龙湘: 龙湘好感+2。
      - • 🚩唐门收留龙湘: 对话差分。
      - 未支持锦香宫:
      - • 对话差分。
      - 温夫人与龙湘道别，检定🚩武林大会支持锦香宫:
      - 有支持锦香宫:
      - • 🚩唐门收留龙湘: 对话差分。
      - • 🚩成为崆峒掌派人: 对话差分。
      - 未支持锦香宫:
      - • 对话差分。
      - 温夫人与画中仙商议，检定🚩[与画中仙决斗](/event/simple/3-09-3-挑战画中仙):
      - 有决斗:
      - • 🚩[带小梅拜见锦香宫](/event/simple/3-10-2-武林交际#拜会锦香): 对话差分。
      - 未决斗:
      - • 无特别对话。
      - 温夫人收拢宫人点火，锦香宫最后一曲《子夜寄君书》。
      - 🚩唐门收留龙湘: 对话差分。
      - 复合检定(不符才检定下一项):
      - 1. 🚩唐门收留龙湘: 对话差分。
      - 2. 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - 3. 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 4. 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - 5. 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - 6. 🚩和魏菊结缘: 对话差分。
      - 7. 其他: 对话差分。
      - 赵活与同行者对话，复合检定:
      - 1. 🚩唐门收留龙湘:
      - • 对话差分。
      - 2. 🚩小师妹同行武林大会:
      - • 检定🚩武林大会支持锦香宫:
      - • 有支持: 修养≤40，对话差分。
      - • 未支持: 对话差分。
      - • 心上人为唐默铃: 唐默铃好感+2。
      - 3. 🚩叶云裳同行武林大会:
      - • 叶云裳好感+2。
      - • 🚩[叶云裳学琴](/system/training/): 对话差分。
      - 4. 🚩虞小梅同行武林大会:
      - • 检定🚩与画中仙决斗:
      - 有决斗:
      - • 道德检定
      - • 道德≤40: 虞小梅好感+2。
      - • 道德＞40: 对话差分。
      - • 心上人检定:
      - • 心上人为虞小梅: 虞小梅好感+4。
      - • 心上人非虞小梅: 道德-2、处世-2、虞小梅好感-3。
      - 未决斗:
      - • 心上人检定:
      - • 心上人为虞小梅: 虞小梅好感+2。
      - • 心上人非虞小梅: 道德-2、处世-2。
      - 5. 🚩郁竹同行武林大会:
      - • 🚩[武林大会袖手旁观](/event/simple/3-10-2-唐门抉择): 对话差分。
      - • 心上人检定:
      - • 心上人为郁竹: 郁竹好感+2。
      - • 心上人非郁竹: 对话差分。
      - 6. 🚩和魏菊结缘:
      - • 🚩武林大会袖手旁观: 对话差分。
      - • 魏菊好感+2。
      - 7. 其他:
      - • 无特别剧情。
      - 上官萤好感≥30: 对话差分。
      - 接[「最后计策」](#最后计策)阶段。
    数值:
      道德: -4
      龙湘好感: +2
      唐默铃好感: +2
      叶云裳好感: +2
      虞小梅好感: +2
      郁竹好感: +2
      魏菊好感: +2
  最后计策:
    触发:
      - 接续[「锦香终曲」](#锦香终曲)阶段
    经过:
      - 温夫人张弦代语，交代锦香宫人。
      - 画中仙易容脱逃。
      - 燃烧烟味暗含毒性，全炼丹点数检定:
      - • 全炼丹≥200: 对话差分。
      - • 200＞全炼丹≥100: 对话差分。
      - • 全炼丹＜100: 对话差分。
      - 以下长段剧情，无差分:
      - • 温夫人最后计策揭晓，虚构毒药威胁武林。
      - • 画中仙易容为温夫人，姊妹对决。
      - • 南宫远上前制止，温夫人背刺。
      - • 南宫远、温夫人共赴黄泉。
      - 接[「战后闲聊」](/event/simple/3-10-2-战后闲聊)事件。