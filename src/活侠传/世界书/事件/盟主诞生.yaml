事件: 盟主诞生
时序: 第3年10月中旬
系列: 共 5 环
  比武尾声:
    触发:
      - 接续[「各派角逐」](/event/simple/3-10-2-各派角逐)或
      - [「点苍逆徒」](/event/simple/3-10-2-点苍逆徒)事件
    经过:
      - 见到向无忧连胜，道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 嘴力+1、修养-1。
      - 卧云岗回程🚩[旅伴龙湘](/event/simple/3-01-3-围观卧云岗): 对话差分。
      - 卧云岗回程🚩旅伴龙湘: 对话差分。
      - 向无忧邀请三大世家代表叙话。
      - • 有🚩[叶云舟代表唐门出战](/event/simple/3-10-2-点苍逆徒)或🚩[挑战上官隼](/event/simple/3-10-2-上官对策): 对话差分。
      - • 性情≥60: 对话差分。
      - • 南宫家好感≥5: 对话差分。
      - 接「向无忧一问」阶段
    数值:
      嘴力: +1
  向无忧一问:
    触发:
      - 接续「比武尾声」阶段
    经过:
      - 向无忧第一问，泥教与正道可否和解，触发选项:
      - 👉「可以共存」:
      - • 性情+1、处世+1、嘴力+1、名声-1。
      - • 刘颚好感+1、车轩辕好感+1、赵逵好感+1。
      - • 锦香宫好感+1、上官家好感-1。
      - • 六大派除峨嵋之外好感各-1。
      - 👉「势不两立」:
      - • 60＞处世≥40: 对话差分。
      - • 道德≤40: 对话差分。
      - • 赵逵好感-2、刘颚好感-2。
      - • 上官家好感+1。
      - • 六大派除峨嵋之外好感各+1。
      - 接「向无忧二问」阶段
    数值:
      性情: +1
      嘴力: +1
      刘颚好感: -2
      车轩辕好感: +1
      赵逵好感: -2
      锦香宫好感: +1
      上官家好感: +1
  向无忧二问:
    触发:
      - 接续「向无忧一问」阶段
    经过:
      - 向无忧第二问，是否愿意卫国抗金，触发选项:
      - 👉「正常人」:
      - • 性情+2、处世-1、道德+2、名声+1。
      - • 道德≤40: 对话差分。
      - • 学问检定:
      - • 学问＜40: 对话差分。
      - • 学问≥40: 道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 处世-2。
      - 👉「不是正常人」:
      - • 道德-2。
      - • 检定「性情≥80且道德＜40」:
      - 符合:
      - • 道德-2、性情+1、处世+2、修养-2。
      - • 宋悲好感-3、刘颚好感+3、瑞杏好感+1。
      - • 六大派好感-1。
      - 不符:
      - • 无特殊剧情。
      - 接「向无忧三问」阶段
    数值:
      性情: +3
      道德: -2
      宋悲好感: -3
      刘颚好感: +3
      瑞杏好感: +1
      六大派好感: -1
  向无忧三问:
    触发:
      - 接续「向无忧二问」阶段
    经过:
      - 向无忧第三问，国仇家恨无止尽，百姓受苦如何解。
      - • 学问≥45: 对话差分。
      - 南宫远回答，天下大同由我开始。
      - • 🚩[知晓温夫人身份](/event/simple/3-10-2-温夫人托付): 对话差分。
      - • 🚩知晓温夫人身份: 对话差分。
      - 是否认同南宫远，触发选项:
      - 👉「认同」:
      - • 处世-1、道德+1、修养+1，南宫家好感+1。
      - 👉「不认同」:
      - • 处世+1、修养-1。
      - • 道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 上官家好感+1。
      - 接「盟主诞生」阶段。
    数值:
      道德: +1
      南宫家好感: +1
      上官家好感: +1
  盟主诞生:
    触发:
      - 接续「向无忧三问」阶段
    经过:
      - 向无忧推举南宫远做盟主。
      - 你的反应，触发选项:
      - 👉「我来当」:
      - • 处世+2、修养-3。
      - • 设置🚩「支持自己当盟主」。
      - • 若🚩[支持自己当掌门](/event/simple/1-06-1-掌门的安排): 解锁[风云史07:《野心勃勃》](/event/achievements/#风云史-No.07)。
      - • 修养≤40: 对话差分。
      - • 心相-30。
      - 👉「退场」:
      - • 处世-1、修养+1。
      - • 道德≥40: 对话差分。
      - 事件结束，接[「武林交际」](/event/simple/3-10-2-武林交际)事件。
    数值:
      心相: -30