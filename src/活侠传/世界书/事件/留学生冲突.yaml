事件: 留学生冲突
时序: 第2年3月上旬
系列: 共 3 环
  冲突爆发:
    触发:
      - 不留学崆峒
      - 参数🚩留学纠纷≥5(见备注)
      - 时间范围内，自动触发
    经过:
      - 处世≥60: 对话差分。
      - 触发⚔️战役: 留学生混战。
      - 无论战役结果，接「唐铮责问」阶段。
    旗标:
      - 留学纠纷
    备注: 🚩留学纠纷: 执行[养成指令](/system/training/)时，

 若触发留学生纷争事件可累积，

 若=-1则不再触发纷争事件。
  唐铮责问:
    触发:
      - 接续「冲突爆发」阶段
    经过:
      - 触发选项:
      - 👉「沉默」:
      - • 唐默铃好感+1。
      - • 设置🚩「留学纠纷」=-1。
      - • 事件结束，回唐门养成指令。
      - 👉「只是切磋」:
      - • 嘴力检定:
      - • 嘴力＜25: 接「接受处罚」阶段。
      - • 嘴力≥25: 再次嘴力检定:
      - • 嘴力＜30: 接「接受处罚」阶段。
      - • 嘴力≥30: 贡献度+10。再次嘴力检定:
      - • 嘴力＜35: 接「接受处罚」阶段。
      - • 嘴力≥35，见以下:
      - • 贡献度+20。
      - • 贡献度+10、嘴力+1、名声+1、六大派好感+1。
      - • 设置🚩「留学纠纷」=-1。
      - • 事件结束，回唐门养成指令。
    数值:
      嘴力: +1
      唐默铃好感: +1
      六大派好感: +1
  接受处罚:
    触发:
      - 接续「唐铮责问」阶段
    经过:
      - 性情≤40: 对话差分。
      - 蛇的种类，触发🎲天命(上限99):
      - 【🎲＜33 丐帮的蛇】: 体力-3、轻功-1、抗麻+2。
      - 【🎲＜66 苗疆的蛇】: 体力-4、抗毒+2。
      - 【🎲≥66 唐门的蛇】: 体力-3、轻功-2、内力+1、抗麻+1、抗毒+1。
      - 贡献度+10、心相-30、命运+1、六大派好感+1。
      - 行动次数-1(若无行动次数则次旬再扣)。
      - 设置🚩「留学纠纷」=-1。
      - 事件结束，回唐门养成指令。
    数值:
      抗麻: +3
      抗毒: +3
      心相: -30
      六大派好感: +1