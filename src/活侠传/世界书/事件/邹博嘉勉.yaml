事件: 邹博嘉勉
时序: 第2年9月下旬
系列: 共 3 环
  邹博约谈:
    前置: 邹博归来
    触发:
      - 青城留学线
      - 已触发[「邹博归来」](/event/simple/2-09-3-邹博归来)
      - 🚩青城功勋≥6
      - 满足以上，点选上清宫指令触发
      - 一次性事件，不可重复触发
    经过:
      - 上清宫邹博约谈: 性情≤40，对话差分。
      - 猜测约谈理由: 心相-15。
      - 是否适应青城，触发选项:
      - 👉「在下适应良好」:
      - • 处世-1。
      - 👉「青城什么都好，但是太清闲了一点」:
      - • 处世+1。
      - • 处世≥60: 修养-1。
      - 何事吩咐: 若性情≤40，对话差分。
      - 接「邹博嘉勉」阶段。
    数值:
      心相: -15
    旗标:
      - 青城功勋
    备注: 🚩青城功勋: 透过[养成事件](/system/training/)获得。
  邹博嘉勉:
    触发:
      - 接续「邹博约谈」阶段
    经过:
      - 勤勉之人: 若处世≥60，对话差分。
      - 三字心诀: 获得秘笈[《清峰三十六路》](/system/books/book_4009)。
      - 闲的奥义: 若技能[「道学」](/system/skill)≥3，武学+4。
      - 武功真髓: 若修养≥60，武学+4。
      - 青城派首重气功，触发选项:
      - 👉「你觉得有道理」: 武学+2、暗器-1。
      - 👉「你存疑」: 若全武学点数≥100，武学+4、暗器+1。
      - 先天不足: 心相-15，检定技能[「医术」](/system/skill):
      - • 医术≥3: 青城派好感+1。
      - • 医术＜3: 心相-10。
      - 接「入门邀请」阶段。
    数值:
      暗器: +0
      心相: -25
      青城派好感: +1
  入门邀请:
    触发:
      - 接续「邹博嘉勉」阶段
    经过:
      - 邹博邀请入门，亲自指点你，触发选项:
      - 👉「好，我要拜入青城习道」:
      - • 进入汗青书20: [《入无穷之门，游无极之野》](/event/ends/end-20)。
      - 👉「但是我就是想当大侠」:
      - • 处世＜60: 对话差分。
      - • 青城派好感+1。
      - 事件结束，回青城养成指令。
    数值:
      青城派好感: +1