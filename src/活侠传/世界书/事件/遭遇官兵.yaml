事件: 遭遇官兵
时序: 第3年9月上旬
  遭遇官兵:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)旅途前半随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 宋悲提供官兵护航协助，触发选项:
      - 👉「接受好意」:
      - • 处世-2、名声+2。
      - • 唐中翎好感-3、上官家好感+3。
      - • 设置🚩「宋悲同行武林大会」。
      - • 关闭[地狱道](/event/simple/3-09-1-地狱道拦路)、[畜生道](/event/simple/3-09-1-畜生道拦路)、[饿鬼道](/event/simple/3-09-1-饿鬼道拦路)拦路事件。
      - 👉「自己走」:
      - • 处世+2、名声+1、向心+2。
      - • 宋悲+2、唐中翎好感+2。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      向心: +2
      唐中翎好感: +2
      上官家好感: +3