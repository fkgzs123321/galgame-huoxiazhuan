事件: 会前事项
时序: 第3年10月中旬
系列: 共 4 环
  会前事项:
    触发:
      - 接续[「抵达会场」](/event/simple/3-10-2-抵达会场)事件
    经过:
      - 触发 ☯议题选单:
      - • 以下选项皆为一次性，执行后即关闭。
      - 事件 ☯「唐门精神喊话」:
      - • 接「精神喊话」阶段。
      - 事件 ☯「观察来了谁」:
      - • 接「观察会场」阶段。
      - 事件 ☯「等大会开始」:
      - • 接「等待大会」阶段。
  精神喊话:
    触发:
      - 接续「会前事项」阶段
      - 时 ☯「唐门精神喊话」
    经过:
      - 贡献度-30，取消🚩(未知旗标)。
      - 武林大会同行者，复合检定(不符才判断下一项):
      - • 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - • 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 郁竹好感+1。
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。若🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟)，再差分。
      - • 其他: 对话差分。
      - 复合检定:
      - • 🚩小师妹同行武林大会: 若心上人为唐默铃，唐默铃好感+1。
      - • 🚩叶云裳同行武林大会: 对话差分。
      - 复合检定:
      - • 🚩小师妹同行武林大会: (无内容)。
      - • 🚩虞小梅同行武林大会: (无内容)。
      - • 🚩郁竹同行武林大会: (无内容)。
      - • 🚩叶云舟同行武林大会，且🚩叶云裳同行武林大会: (无内容)。
      - • 🚩叶云舟同行武林大会，且🚩叶云裳未同行武林大会: (无内容)。
      - 🚩虞小梅同行武林大会: 对话差分。
      - 🚩虞小梅同行武林大会: 虞小梅好感+1。
      - 🚩郁竹同行武林大会: 郁竹好感+1。
      - 🚩小师妹同行武林大会: 唐默铃好感+1。
      - 🚩叶云裳同行武林大会: 叶云裳好感+1。
      - 🚩叶云舟同行武林大会: 叶云舟好感+1。
      - 心相+20、向心+3、名声+1。
      - 门派规模≥3: 名声-1、宋悲好感-1、点苍派好感-1。
      - 🚩成为崆峒掌派人: 若🚩和魏菊结缘，魏菊好感+2。
      - 回「会前事项」阶段。
    数值:
      心相: +20
      向心: +3
      郁竹好感: +1
      唐默铃好感: +1
      虞小梅好感: +1
      叶云裳好感: +1
      叶云舟好感: +1
      宋悲好感: -1
      点苍派好感: -1
      魏菊好感: +2
  观察会场:
    触发:
      - 接续「会前事项」阶段
      - 时 ☯「观察来了谁」
    经过:
      - 🚩[福韫未死亡](/event/simple/3-02-1-一波暂平): 对话差分。
      - 检定🚩[金乌上人死亡](/event/simple/3-05-1-对决金乌):
      - • 死亡: 对话差分。
      - • 未死亡: 若🚩[颜疆死亡](/event/simple/3-05-1-对决金乌)，对话差分。
      - 武林大会同行者，复合检定(不符才判断下一项):
      - • 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - • 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - • 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 其他: 对话差分。
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟):
      - • 🚩叶云裳同行武林大会: 对话差分。
      - • 🚩听三师兄说过岭南派: 对话差分。
      - • 🚩叶云裳同行武林大会: 叶云舟好感+1、叶云裳好感+1。
      - 回「会前事项」阶段。
    数值:
      叶云舟好感: +1
      叶云裳好感: +1
  等待大会:
    触发:
      - 接续「会前事项」阶段
      - 时 ☯「等大会开始」
    经过:
      - 复合检定(不符才判断下一项):
      - • 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - • 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - • 其他: 对话差分。
      - 复合检定:
      - 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖):
      - • 心上人为唐默铃: 心相+20、唐默铃好感+2。
      - 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟):
      - • 性情≥60: 对话差分。
      - 🚩虞小梅同行武林大会:
      - • 处世≥60: 对话差分。
      - 🚩郁竹同行武林大会:
      - • 处世≥60: 对话差分。
      - • 郁竹好感+2。
      - 🚩和魏菊结缘:
