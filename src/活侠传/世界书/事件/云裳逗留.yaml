事件: 云裳逗留
时序: 第2年9月上旬
系列: 共 4 环
  云裳捣蛋:
    触发:
      - [前往青城留学](/event/simple/2-08-2-唐门迎敌)
      - 时间到自动触发
    经过:
      - 评论唐芳不守时，复合检定:
      - • 处世≥60，且无技能[《医术》](/system/skill): 性情+1、叶云裳好感-1。
      - • 处世＜60，或技能《医术》≥1: 对话差分。
      - 接「申屠待遇」阶段。
    数值:
      性情: +1
      叶云裳好感: -1
  申屠待遇:
    触发:
      - 接续「云裳捣蛋」阶段
    经过:
      - 叶云裳对申屠道长差别待遇，心上人检定:
      - 心上人非叶云裳: 叶云裳好感-2。
      - 心上人为叶云裳: 道德检定:
      - • 道德≤40: 心相-10。
      - • 道德＞40: 心相-20。
      - • 无论道德高低，叶云裳好感+1。
      - 云裳澄清: 若处世≥60，对话差分。
      - 赵活吃醋: 若叶云裳好感≥30，对话差分。
      - 接「云裳捉弄」阶段。
    数值:
      心相: -30
      叶云裳好感: +1
  云裳捉弄:
    触发:
      - 接续「申屠待遇」阶段
    经过:
      - 云裳发作: 心相-10。
      - 哪里不妥: 心相-10。
      - 云裳想吃冰糖葫芦，🎲触发天命(上限70、修养扣除、处世补正):
      - 【🎲＜50 揍烂屁股】: 叶云裳好感-3，设置🚩「揍烂屁股」。
      - 【🎲≥50 揍烂屁股未遂】: 叶云裳好感+1。
      - 接「病情诊断」阶段。
    数值:
      心相: -20
      叶云裳好感: +1
  病情诊断:
    触发:
      - 接续「云裳捉弄」阶段
    经过:
      - 切换夜晚背景，显示晚饭插图，银两-100。
      - 赵活为叶云裳把脉，技能[《医术》](/system/skill)检定:
      - 若无技能《医术》: 道德检定:
      - • 道德≤40: 心相+20。若🚩揍烂屁股，再道德-3、心相+100。
      - • 道德＞40: 对话差分。
      - • 心相-20、抗麻+1。
      - • 事件结束，回青城养成指令。
      - 若技能《医术》等级为1、2、3:
      - • 道德≤40: 对话差分。
      - 若技能《医术》等级≥4:
      - • 内力-1。
      - • 处世≥60: 性情-1。
      - • 获得秘笈[《八仙指》](/system/books/book_6012)。
      - 唐芳追云裳，复合检定:
      - 若道德＜40，且🚩揍烂屁股:
      - • 回味手感: 道德-3，心上人检定:
      - • 若心上人为叶云裳: 心相+100。
      - • 若心上人非叶云裳: 变心+6、心相+20。
      - 若其他情况: 无额外剧情。
      - 事件结束，回青城养成指令。
    数值:
      心相: +220
      抗麻: +1
      性情: -1
      道德: -3