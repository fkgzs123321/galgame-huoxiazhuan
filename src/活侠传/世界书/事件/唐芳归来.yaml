事件: 唐芳归来
时序: 第1年9月上旬
系列: 共 2 环
  唐芳归来:
    触发:
      - [唐铮诊断](/event/simple/1-08-3-唐铮诊断)事件一旬后
      - 且在本事件可触发时间范围内
    经过:
      - 练武场对话，向心检定:
      - • 向心＜50: 心相-20、修养-1。
      - • 向心≥50: 对话差分。
      - 大院门外有人求助，触发选项:
      - 👉「出去看看」: 修养+1。
      - 👉「不去」: 处世+1。
      - 无论选项，出门外查看，遇见唐芳。
      - 处世＜60: 对话差分。
      - 接「丹房报到」阶段。
    数值:
      心相: -20
  丹房报到:
    触发:
      - 接续「唐芳归来」阶段
    经过:
      - 帮唐芳捡拾行李结果，触发🎲天命(上限99，处世扣除):
      - 【🎲＜30 少得可怜】: 对话差分。
      - 【🎲＜70 五成，聊胜于无】: 获得秘笈[《难经》](/system/books/book_8107)。
      - 【🎲≧70 全部找回了】: 唐铮好感+2，叶云裳讨要蜜饯，触发选项:
      - 👉「留著自己吃」: 修养-1、处世-1、叶云裳好感-1，获得物品[「中药蜜饯」](/system/items/)+1。
      - 👉「好啦给你」: 叶云裳好感+3。
      - 设置🚩「唐芳归来」。
      - 设定「下山郊游」事件于一旬后触发(需在该事件自身期限内)。
      - 事件结束，接唐门养成指令。
    数值:
      唐铮好感: +2
      叶云裳好感: +3