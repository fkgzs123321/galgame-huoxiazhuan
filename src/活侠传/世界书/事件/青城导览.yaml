事件: 青城导览
时序: 第2年8月下旬
系列: 共 6 环
  云裳唤醒:
    触发:
      - 接续[「青城醒转」](/event/simple/2-08-3-青城醒转)事件
    经过:
      - • 修养＜60: 处世+1。
      - 叶云裳亲切的唤醒服务，触发选项:
      - 👉 「欠揍」:
      - • 显示云裳捉弄插图。
      - • 设置🚩「叶云裳病情」+1。
      - 👉 「没辙」:
      - • 叶云裳好感+1。
      - 叶云裳告知申屠道长嫌弃你，触发选项:
      - 👉 「哇，那怎么好意思」:
      - • 处世-1、修养+1。
      - 👉 「岂有此理，竟敢嫌我」:
      - • 道德-1、修养-1、处世+1，触发修养检定:
      - • 修养≥40: 对话差分。道德≥60再差分。
      - • 修养＜40: 叶云裳好感-2。
      - 处世≥60: 叶云裳好感-1。
      - 接「常风观」阶段。
    数值:
      道德: -1
      叶云裳好感: -1
    备注: 🚩「叶云裳病情」
没什么用。
  常风观:
    触发:
      - 接续「云裳唤醒」阶段
    经过:
      - 全武学点数≥100: 叶云裳好感+1。
      - 接「上清宫」阶段。
    数值:
      叶云裳好感: +1
  上清宫:
    触发:
      - 接续「常风观」阶段
    经过:
      - 碧波子道歉[「青城醒转」](/event/simple/2-08-3-青城醒转)时送饭滑落，触发选项:
      - 👉 「小事一桩，道长别放在心上」:
      - • 处世-1、修养+1、青城派好感+1。
      - 👉 「道歉的诚意呢?」:
      - • 道德-1、处世+1、性情+1、修养-1、嘴力+1。
      - • 嘴力≥25: 对话差分，若有接住饭盒再差分。
      - • 获得物品[「降真香」](/system/items/)。
      - • 处世＜60: 对话差分。
      - • 青城派好感-1，设置🚩「勒索青城弟子」。
      - 叶云裳要成为青城弟子的心魔，触发选项:
      - 👉 「拜托你收敛一点」:
      - • 若未🚩勒索青城弟子: 叶云裳好感-1。
      - 👉 「纵容她」:
      - • 道德-1、修养-1、处世+1、叶云裳好感+2、青城派好感-1。
      - 接「青城山景」阶段。
    数值:
      道德: -2
      性情: +1
      嘴力: +1
      青城派好感: -1
      叶云裳好感: +2
  青城山景:
    触发:
      - 接续「上清宫」阶段
    经过:
      - 青城山景比眉山好，触发选项:
      - 👉 「自家风景最美」: 触发处世检定:
      - • 若处世＜60: 对话差分。再检定性情＞40则心相-15、叶云裳好感+2。
      - • 若处世≥60: 叶云裳好感-1。
      - • 嘴力+1、修养-1。
      - 👉 「你说得对」:
      - • 学问≥30: 心相+20、叶云裳好感+2。
      - 接「青城山镇」阶段。
    数值:
      嘴力: +1
      心相: +20
      叶云裳好感: +2
  青城山镇:
    触发:
      - 接续「青城山景」阶段
    经过:
      - 爱心投喂，叶云裳，触发银两检定:
      - • 若银两≥1000，触发🎲天命(上限99):
      - 【🎲＜33 贫民点心】: 叶云裳好感+1、厨艺+1。
      - 【🎲＜66 平民点心】: 银两-100、心相+10。
      - 【🎲≥66 濒冥点心】: 若处世＜60则心相-10。银两-300、叶云裳好感+3。
      - • 若1000＞银两≥300，触发🎲天命(上限99):
      - 【🎲＜60 贫民点心】: 效果同上述。
      - 【🎲≥66 平民点心】: 效果同上述。
      - • 若银两＜300，直接进入「贫民点心」，效果同上述。
      - 接「返回青城」阶段。
    数值:
      心相: +10
      叶云裳好感: +3
  返回青城:
    触发:
      - 接续「青城山镇」阶段
    经过:
      - 美好的时光，心相+30。
      - 若有🚩勒索青城弟子: 对话差分。
      - 返抵青城，检定🚩勒索青城弟子:
      - • 若有勒索: 心相-30。
      - • 若未勒索: 心相+15。
      - 事件结束，接青城留学养成指令。
    数值:
      心相: +15