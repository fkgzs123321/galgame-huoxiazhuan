事件: 下山郊游
时序: 第1年9月中旬
系列: 共 6 环
  行前准备:
    触发:
      - 赵活在唐门
      - 叶云裳在唐门
      - [「唐芳归来」](/event/simple/1-09-1-唐芳归来)事件的一旬后
      - 满足以上且在本事件期限内，自动触发
    经过:
      - 唐默铃与叶云裳准备外出，唐铮确认准备。
      - 上官萤在唐门: 对话差分。
      - 触发处世检定:
      - 处世≤40: 设置🚩「赵活登场」，唐默铃好感+1，叶云裳好感检定:
      - • 叶云裳好感≧25: 心相-20，叶云裳好感+1。
      - • 叶云裳好感＜25: 心相+10，心上人检定:
      - • 心上人为叶云裳: 变心-1。
      - • 心上人非叶云裳: 变心+1。
      - • 上官萤在唐门: 上官萤好感+1。
      - 处世＞40: 赵活未登场。
      - 上官萤在唐门: 对话差分。
      - 若有🚩赵活登场: 对话差分。
      - 接「唐铮担忧」阶段。
    数值:
      心相: -10
      唐默铃好感: +1
      叶云裳好感: +1
      上官萤好感: +1
    备注: 上官萤在唐门: 

 • 始于[「唐门财务改善」](/event/simple/1-08-1-唐门财务改善)事件，

 • 终于[「唐门内战」](/event/simple/2-12-3-唐门内战)事件。
  唐铮担忧:
    触发:
      - 接续「行前准备」阶段
    经过:
      - 检定🚩赵活登场:
      - 若有🚩赵活登场: 心上人检定:
      - • 心上人为唐默铃: 对话差分。
      - • 心上人为叶云裳: 对话差分。
      - • 心上人为其他: 对话差分。
      - 若未🚩赵活登场: 性情检定:
      - • 性情≤40: 对话差分。
      - 赵活交代完伙房事项，处世检定:
      - • 处世＜60: 修养+1。
      - • 处世≧60: 对话差分。
      - 赵活出发暗中跟随，修养检定:
      - • 修养≥40: 对话差分。
      - • 修养＜40: 修养-1、贡献度-5。
      - 若上官萤在唐门: 对话差分，接「冰糖葫芦」阶段。
      - 若上官萤不在唐门: 对话差分，接「唐芳随行」阶段。
  冰糖葫芦:
    触发:
      - 接续「唐铮担忧」阶段
      - 且上官萤在唐门
    经过:
      - 唐芳对话，处世检定:
      - • 处世≤40: 道德-1、性情-1。
      - • 处世＞40: 对话差分。
      - 阻止叶云裳吃甜食，触发🆚「对决上官萤」，对决结果检定:
      - 对决胜利:
      - • 设置🚩「殴打上官萤」、设置🚩「被关次数」+1。
      - • 上官家好感-1、武学+6、上官萤好感-4、唐默铃好感-2、叶云裳好感-2。
      - • 道德＜40: 嘴力+1、道德-2。
      - • 银两-1000、贡献度-10、门派资产-100。
      - • 事件结束，接唐门养成指令。
      - 对决落败，或5回合战斗结束:
      - • 对话差分，接「师姑找碴」阶段。
    数值:
      道德: -3
      性情: -1
      嘴力: +1
      上官家好感: -1
      上官萤好感: -4
      唐默铃好感: -2
      叶云裳好感: -2
  唐芳随行:
    触发:
      - 接续「唐铮担忧」阶段
      - 且上官萤不在唐门
    经过:
      - 唐芳随行剧情。
      - 接「师姑找碴」阶段。
  师姑找碴:
    触发:
      - 接续「冰糖葫芦」或「唐芳随行」阶段
    经过:
      - 唐小楼师姑对唐芳恶言剧情。
      - 若[晁和在唐门](/event/simple/1-08-3-晁和入门)，对话差分。
      - 检定「上官萤在唐门」:
      - 若上官萤在唐门:
      - • 对话差分。
      - • 若曾触发[假字据](/event/simple/1-08-2-假字据)，对话差分。
      - • 接「赵活叫卖」阶段。
      - 若上官萤不在唐门:
      - • 对话差分。
      - • 事件结束，接唐门养成指令。
    备注: 此即著名的 「[萤魔](/people/characters/girl4#萤魔)」立绘出处。
  赵活叫卖:
    触发:
      - 接续「师姑找碴」阶段
      - 且上官萤在唐门
    经过:
      - 赵活叫卖冰糖葫芦结果，触发🎲天命(上限50、嘴力1/2补正、名声1/2补正、道德扣除):
      - 【🎲＜50 惨澹】: 樊啸天好感+2、心相-20、银两-60、名声+2。
      - 【🎲＜80 过得去】: 心相+10、名声-1、银两+30、上官萤好感+1。
      - 【🎲≥80 大获好评】: 嘴力+1、道德-1、银两+60、上官萤好感+2。
      - 事件结束，接唐门养成指令。
    数值:
      嘴力: +2
      心相: -10
      道德: -1
      樊啸天好感: +2
      上官萤好感: +2