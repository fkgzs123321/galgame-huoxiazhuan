事件: 道长地位
时序: 第2年8月下旬
系列: 共 4 环
  巧遇道长:
    触发:
      - 申屠龙好感≥10
      - 青城留学常风观散步，随机触发
      - 一次性事件，不可再次触发
    经过:
      - 与申屠龙散步巧遇两位长老:
      - • 处世≤40: 对话差分。
      - • 处世≤40: 青城派好感+1。
      - 问候用词疑问，触发复合检定:
      - • 若学问≥40，或技能[《道学》](/system/skill)≥2，或处世≤40: 对话差分。
      - • 其他情况: 处世+1、青城派好感-1。
      - 接「突遇猛兽」阶段。
    数值:
      青城派好感: -1
  突遇猛兽:
    触发:
      - 接续「巧遇道长」阶段
    经过:
      - 野猪追著铁冠道人而来，触发选项:
      - 👉 「这里就交给我吧」:
      - • 性情+1。
      - • 触发🆚「对决野猪」。
      - • 对决后接「击退野猪」阶段。
      - 👉 「申屠道长快用你无敌的武功想想办法啊!」:
      - • 接「击退野猪」阶段
    数值:
      性情: +1
  击退野猪:
    触发:
      - 接续「突遇猛兽」阶段
    经过:
      - 对决结果检定:
      - 🆚「对决野猪」获胜:
      - • 武学+2、申屠龙好感+1，修养检定:
      - • 修养≤40: 嘴力+1、处世+1。
      - • 修养＞40: 若道德＜40则嘴力+1。
      - 🆚「对决野猪」落败:
      - • 心相-20、名声-1、申屠龙好感-1、青城派好感-1。
      - 🆚「对决野猪」落败，或未🆚「对决野猪」: 增加申屠龙击退野猪剧情。
      - 接「道长地位」阶段。
    数值:
      嘴力: +1
      心相: -20
      申屠龙好感: -1
      青城派好感: -1
  道长地位:
    触发:
      - 接续「击退野猪」阶段
    经过:
      - 时间≤二年十月上旬: 对话差分。
      - 赵活自我思索，事件结束，回青城日常养成。