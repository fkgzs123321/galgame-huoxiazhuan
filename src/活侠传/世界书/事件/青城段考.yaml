事件: 青城段考
时序: 第2年11月下旬
系列: 共 10 环
  段考开始:
    触发:
      - 青城留学线
      - 时间到自动触发
    经过:
      - 青城派好感检定:
      - 青城派好感≤2:
      - • 性情检定:
      - • 性情≥60: 对话差分。
      - • 性情＜60: 嘴力检定:
      - • 嘴力≥30: 修养-2、道德-1、嘴力+1、处世+1。
      - • 嘴力＜30: 对话差分。
      - 青城派好感＞2:
      - • 触发选项:
      - 👉「公平对决」: 处世检定:
      - • 处世≥60: 性情+1。
      - • 处世＜60: 处世+1、嘴力+1。
      - 👉「务必放水」:
      - • 性情≤40: 对话差分。
      - • 设置🚩「约定放水」。
      - 解锁装备[「牛皮制服」](/system/forge-roadmap)。
      - 道德检定:
      - • 道德≥40: 对话差分。
      - • 道德＜40: 暗器+1。
      - 心相+50。
      - 触发选项:
      - 👉「想必不能」: 对话差分。
      - 👉「花钱就能」: 设置🚩「预测段智秀胜」。
      - 道德≤40: 对话差分。
      - 若🚩预测段智秀胜: 对话差分。
      - 接「依序比试」阶段。
    数值:
      道德: -1
      嘴力: +2
      性情: +1
      暗器: +1
      心相: +50
  依序比试:
    触发:
      - 接续「段考开始」阶段
    经过:
      - 叶云裳好感检定:
      - 叶云裳好感≥30:
      - • 接「怀素想起」阶段
      - 叶云裳好感＜30:
      - • 触发🎲天命(上限60、名声补正):
      - 【🎲＜30 你被遗忘了】:
      - • 修养检定:
      - • 修养≤40: 心相-20。
      - • 修养＞40: 心相-10。
      - • 接「趁机下山」阶段。
      - 【🎲＜60 不平道长想起了你】:
      - • 接「不平想起」阶段。
      - 【🎲≥60 怀素道长想起了你】:
      - • 接「怀素想起」阶段。
    数值:
      心相: -30
  不平想起:
    触发:
      - 接续「依序比试」阶段
    经过:
      - 性情-1。
      - 接「高和子比试」阶段。
    数值:
      性情: -1
  高和子比试:
    触发:
      - 接续「不平想起」阶段
    经过:
      - 触发🆚「对决高和子」。
      - 对决结果检定:
      - 获胜:
      - • 武学+4、名声+1。
      - • 心相+30。
      - 落败:
      - • 处世＜60: 对话差分。
      - 接「趁机下山」阶段。
    数值:
      心相: +30
  怀素想起:
    触发:
      - 接续「依序比试」阶段
    经过:
      - 叶云裳好感≥30: 对话差分。
      - 叶云裳好感检定:
      - 叶云裳好感≥30:
      - • 对话差分。
      - 叶云裳好感＜30:
      - • 若青城派好感＞2: 对话差分，检定🚩约定放水:
      - • 无🚩约定放水: 对话差分。
      - • 有🚩约定放水: 对话差分，性情检定:
      - • 性情＜60: 对话差分，道德检定:
      - • 道德≤40: 对话差分。
      - 接「停风子比试」阶段。
  停风子比试:
    触发:
      - 接续「怀素想起」阶段
    经过:
      - 触发🆚「对决停风子」。
      - • 若有🚩约定放水: 敌方状态「手下留情」。
      - • 若有🚩约定放水，且敌方血量≤50%: 敌方状态「愤怒」。
      - • 11回合自动平手。
      - 对决结果检定:
      - • 获胜: 接「战胜停风子」阶段。
      - • 平手: 接「战平停风子」阶段。
      - • 落败: 接「战败停风子」阶段。
  战胜停风子:
    触发:
      - 接续「停风子比试」阶段
    经过:
      - 检定🚩约定放水:
      - 若有🚩约定放水:
      - • 名声+2、道德-1、处世+1、武学+2。
      - • 青城派好感+1。
      - 若未🚩约定放水:
      - • 武学+5、名声+2。
      - 道德检定:
      - • 道德≤40: 嘴力+1。
      - • 道德＞40: 对话差分。
      - 叶云裳好感检定:
      - 叶云裳好感≥30:
      - • 对话差分。
      - 叶云裳好感＜30:
      - • 对话差分。
      - • 若有🚩约定放水: 对话差分。
      - 叶云裳好感≥30: 对话差分。
      - 接「趁机下山」阶段。
    数值:
      道德: -1
      嘴力: +1
      青城派好感: +1
  战平停风子:
    触发:
      - 接续「停风子比试」阶段
    经过:
      - 检定🚩约定放水:
      - 若有🚩约定放水:
      - • 武学+2、名声+1、处世+1。
      - • 青城派好感+2、申屠龙好感+1。
      - 若未🚩约定放水:
      - • 武学+2、名声+1。
      - 叶云裳好感检定:
      - 叶云裳好感≥30:
      - • 对话差分。
      - 叶云裳好感＜30:
      - • 对话差分，青城派好感检定:
      - • 青城派好感＞2: 检定🚩约定放水:
      - • 若有🚩约定放水: 对话差分。
      - 接「趁机下山」阶段。
    数值:
      青城派好感: +2
      申屠龙好感: +1
  战败停风子:
    触发:
      - 接续「停风子比试」阶段
    经过:
      - 叶云裳好感检定:
      - 叶云裳好感≥30:
      - • 对话差分。
      - • 武学+2、名声-2、心相-15。
      - 叶云裳好感＜30:
      - • 对话差分。
      - • 武学+2、心相-10。
      - 若有🚩约定放水: 名声-1。
      - 叶云裳好感≥30: 对话差分。
      - 接「趁机下山」阶段。
    数值:
      心相: -25
  趁机下山:
    触发:
      - 见以上阶段
    经过:
      - 修养检定:
      - 修养＞40:
      - • 对话差分。
      - 修养≤40:
      - • 青城派好感≥5: 对话差分。
      - • 心相-10、青城派好感-1。
      - 泥教鬼卒出现，触发选项:
      - 👉「青城对我有恩，必须帮忙」:
      - • 接[「赵逵上山」](/event/simple/2-11-3-赵逵上山)事件。
      - 👉「绕道而行」:
      - • 道德检定:
      - • 道德≤40: 性情-2、道德-1。
      - • 道德＞40: 处世-1、性情-1、道德-1、心相-15。
      - • 接[「逃离青城」](/event/simple/2-11-3-逃离青城)事件。
    数值:
      心相: -25
      性情: -3
      道德: -2
      青城派好感: -1
    备注: 如欲加地狱道好感，此时

 需👉帮忙青城且道德＞40。