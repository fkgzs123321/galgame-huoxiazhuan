事件: 九转疗伤
时序: 第3年5月上旬
系列: 共 6 环
  九转疗伤:
    触发:
      - 接续[「谷底生活」](/event/simple/3-05-1-谷底生活)子事件
    经过:
      - 叶云裳第二次噩梦，大限将至。
      - 叶云裳好感≥70: 对话差分(百万赵活)。
      - 显示插图。
      - 叶云裳好感检定
      - • 叶云裳≥70: 对话差分。
      - • 叶云裳＜70: 对话差分。若处世≥60，再差分。
      - 疗伤开始:
      - • 体力-1。
      - • 体力-1、抗麻-1。
      - • 体力-1、抗毒-1。
      - • 体力-1、内力-1。
      - • 体力-2、内力-2、抗毒-1、抗麻-1。
      - 叶云裳好感≥70: 对话差分。
      - 进入意识幻境对战异种真气，接「战幻境邹博」阶段。
    数值:
      抗麻: -2
      抗毒: -2
  战幻境邹博:
    触发:
      - 接续「九转疗伤」阶段
    经过:
      - 触发对决🆚「战幻境邹博」
      - • 敌方状态: 「养命丹」、「彼岸香」、「胡椒粉毒」。
      - • 第2回合: 我方新增辅助叶云裳。
      - 对决结果检定:
      - 落败:
      - • 进入[汗青书54:《与你同行》](/event/ends/end-54)。
      - 获胜:
      - • 技能[「道学」](/system/skill)等级检定:
      - • 道学等级≥4: 内力+3。
      - • 4＞道学等级≥2: 内力+2。
      - • 道学等级＜2: 内力+1。
      - • 接「战幻境南宫远」阶段。
  战幻境南宫远:
    触发:
      - 接续「战幻境邹博」阶段
    经过:
      - 触发对决🆚「战幻境南宫远」
      - • 敌方状态: 「养命丹」、「彼岸香」、「胡椒粉毒」。
      - • 我方辅助: 叶云裳。
      - 对决结果检定:
      - 落败:
      - • 进入[汗青书54:《与你同行》](/event/ends/end-54)。
      - 获胜:
      - • 技能[「南宫护心诀」](/system/skill)等级检定:
      - • 「南宫护心诀」练满3级: 技能[「偕老誓」](/system/skill)取代「南宫护心诀」。
      - • 「南宫护心诀」未练满3级: 体力+2 / 内力+1。
      - • 接「战幻境段智秀」阶段。
  战幻境段智秀:
    触发:
      - 接续「战幻境南宫远」阶段
    经过:
      - 触发对决🆚「战幻境段智秀」
      - • 敌方状态: 「养命丹」、「彼岸香」、「胡椒粉毒」。
      - • 我方辅助: 叶云裳。
      - 对决结果检定:
      - 落败:
      - • 进入[汗青书54:《与你同行》](/event/ends/end-54)。
      - 获胜:
      - • 秘笈[《枯荣神功上卷》](/system/books/book_7017)修练等级检定。
      - • 《枯荣神功上卷》练满10级: 内力+5、阴阳±40。
      - • 《枯荣神功上卷》未练满10级: 阴阳±20。
      - • 接「战幻境点苍双尊」阶段。
  战幻境点苍双尊:
    触发:
      - 接续「战幻境段智秀」阶段
    经过:
      - 触发对决🆚「战幻境点苍双尊」
      - • 敌方状态: 「养命丹」、「彼岸香」、「胡椒粉毒」。
      - • 敌方辅助: 「点苍双尊」。
      - • 我方辅助: 叶云裳。
      - 对决结果检定:
      - 落败:
      - • 进入[汗青书54:《与你同行》](/event/ends/end-54)。
      - 获胜:
      - • 接「云裳结缘」阶段。
  云裳结缘:
    触发:
      - 接续「战幻境点苍双尊」阶段
    经过:
      - 解除🚩「经脉闭塞」及🚩「失魂落魄」状态。
      - 叶云裳好感≥70: 对话差分。
      - 性情≥60: 对话差分。
      - 二师兄相救剧情。
      - 唐铮好感≥40: 对话差分。
      - 修养＜60: 对话差分。
      - 性情≥40: 对话差分。
      - 性情≥40: 对话差分。
      - 处世＜60: 对话差分。
      - 显示插图。
      - 爽死，心相+100。
      - 获得技能[「九转轮回」](/system/skill)。
      - 设置🚩「和叶云裳结缘」。
      - 接[「离开谷底」](/event/simple/3-05-1-离开谷底)子事件。
    数值:
      心相: +100