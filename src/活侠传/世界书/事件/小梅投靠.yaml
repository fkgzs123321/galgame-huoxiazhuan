事件: 小梅投靠
时序: 第2年10月下旬
系列: 共 3 环
  阿花姑娘:
    触发:
      - 🚩[认识虞小梅](/event/simple/2-03-2-鹤手出游)(需[留学崆峒](/event/simple/2-02-1-留学讨论))
      - 虞小梅好感≥20
    经过:
      - 修养检定:
      - • 修养≤40: 性情+1、向心+1。
      - • 修养＞40: 对话差分。
      - 包办阿花工作，触发选项:
      - 👉「好吧」:
      - • 道德+2、处世-1。
      - • 处世≤40: 对话差分。
      - • 道德+1、贡献度-20、虞小梅好感+1(无图像提示)。
      - • 设置🚩「答应包办工作」。
      - 👉「没门」:
      - • 修养-1、处世+1、虞小梅好感+2(无图像提示)。
      - • 有[建设外堡](/system/facility): 对话差分。
      - • 设置🚩「拒绝包办工作」。
      - 🚩拒绝包办工作: 对话差分。
      - 心上人为虞小梅: 对话差分。
      - 处世＜60: 对话差分。
      - 接「小梅拜门」阶段
    数值:
      性情: +1
      向心: +1
      道德: +3
      虞小梅好感: +2
  小梅拜门:
    触发:
      - 接续「阿花姑娘」阶段
    经过:
      - 心上人为虞小梅: 对话差分。
      - 小梅欲拜入唐门，询问赵活意见，触发选项:
      - 👉「可以」:
      - • 设置🚩「支持小梅拜门」。
      - • 虞小梅好感+2。
      - 👉「不行」:
      - • 设置🚩「反对小梅拜门」。
      - • 修养-2、道德-1、性情+2、唐中翎好感-1、唐升好感-1。
      - 接「小梅闲聊」阶段。
    数值:
      道德: -1
      性情: +2
      虞小梅好感: +2
      唐中翎好感: -1
      唐升好感: -1
  小梅闲聊:
    触发:
      - 接续「小梅拜门」阶段
    经过:
      - 检定对小梅拜门态度:
      - • 🚩支持小梅拜门: 对话差分。
      - • 🚩反对小梅拜门: 心相-10。
      - 心上人为虞小梅: 性情+1、嘴力+1、心相+30。
      - 小梅如何称呼赵活，触发选项:
      - 👉「师兄」:
      - • 性情+1、处世+1、心相+30。
      - 👉「师弟」:
      - • 性情-1、处世-1、修养+1、心相+20。
      - 👉「官人」:
      - • 性情+1、嘴力+1、虞小梅好感+1。
      - • 心上人非虞小梅: 道德-1、变心+10。
      - • 虞小梅好感≥35: 对话差分。
      - 设置🚩「收留虞小梅」。
      - 设置🚩「虞小梅在唐门」。
      - 事件结束，回唐门养成指令。
    数值:
      心相: +70
      性情: +2
      嘴力: +2
      道德: -1
      虞小梅好感: +1