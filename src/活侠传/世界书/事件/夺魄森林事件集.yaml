事件: 夺魄森林事件集
时序: 第2年4月上旬
系列: 共 9 环
  首次练功:
    触发:
      - 🚩[拜师夏侯兰](/event/simple/2-04-1-衣服遭窃)
      - 首次进入夺魄森林触发
    经过:
      - 👉选择：打一套拳看看 → 事件结束
      - 「使出无影爪」 〔
      - 《无影爪》LV≧5：夏侯兰+1
      - 《无影爪》LV<5：夏侯兰-1
      - 〕
      - 「随兴发挥」 〔武学+3、夏侯兰+1〕
    备注: 此事件占用一次行动
  修缮树屋:
    触发:
      - 夏侯兰好感≥20
      - 进入夺魄森林，随机触发
    经过:
      - ☯事件：修缮树屋 → 事件结束 〔
      - 性情>40：心相-10
      - 银两+300、夏侯兰+2
      - 处世≦40：银两-400、道德+1
      - 〕
    数值:
      心相: -10
      道德: +1
    备注: 结束后接夺魄森林修练指令
  铁伞秘密:
    触发:
