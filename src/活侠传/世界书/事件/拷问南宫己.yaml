事件: 拷问南宫己
时序: 第2年9月上旬
系列: 共 9 环
  拷问人选:
    触发:
      - [🚩「离家出走住破庙」](/event/simple/2-06-1-离家出走)且
      - [「唐门迎敌」](/event/simple/2-08-2-唐门迎敌)后未🚩「留学青城」
    经过:
      - 修养≤40：对话差分。
      - 👉选项：拷问人选
      - 「我试试」〔道德-1、性情+1〕 → 修养判定
      - 「二师兄」 → 接「二师兄出马」阶段。
      - 修养判定
      - 修养≤40 → 接「二师兄出马」阶段。
      - 修养＞40 → 性情检定
      - 性情检定
      - 性情≥80〔道德-2、处世+1、修养-1〕 → 道德≤40：对话差分 → 接「二师兄出马」阶段。
      - 性情＜80 → 复合检定
      - 复合检定
      - 性情≤40且道德≥60：对话差分 → 接「赵活出马」阶段。
      - 性情＞40且道德≥60：对话差分 → 接「赵活出马」阶段。
      - 其他：对话差分 → 接「赵活出马」阶段。
    数值:
      道德: -3
      性情: +1
    旗标:
      - 离家出走住破庙
      - 留学青城
    选项:
      - 我试试（道德-1、性情+1）
  赵活出马:
    触发:
      - 接续「拷问人选」阶段
      - 且👉「我试试」、
      - 修养＞40且性情＜80
    经过:
      - 👉选项：拷问方法
      - 「肉体摧残」 → 接「肉体摧残」阶段。
      - 「精神伤害」 → 接「精神伤害」阶段。
  肉体摧残:
    触发:
      - 接续「赵活出马」阶段
      - 且👉「肉体摧残」
    经过:
      - 🆚对决南宫己 (敌方血量60%以下会触发胆怯，可用于减少敌方气力)
      - 对决结果检定
      - 胜利〔处世+3、心相-30、唐铮好感-2、贡献度-30〕 → 接「南宫己招供」阶段。
      - 敌方气力≤7结束战斗：对话差分 → 接「南宫己招供」阶段。
      - 落败 → 进入[「生死簿101: 被反震而死」](/event/badends/#生死簿-No.101)。
    数值:
      心相: -30
      唐铮好感: -2
  精神伤害:
    触发:
      - 接续「赵活出马」阶段
      - 且👉「精神伤害」
    经过:
      - 道德检定
      - 道德≥40 → 天命判定(道德≥40)
      - 道德＜40 → 天命判定(道德＜40)
      - 🎲天命：天命判定(道德≥40) (上限50，嘴力补正)
      - 【🎲＜70 南宫护心诀】：说服失败 → 修养＜60〔修养-1、心相-15〕 → 接「二师兄出马」阶段。
      - 【🎲≧70 想过爹娘吗?】：设置🚩「赵活说服成功」 → 接「南宫己招供」阶段。
      - 🎲天命：天命判定(道德＜40) (上限50，嘴力补正)
      - 【🎲＜70 南宫护心诀】：与道德≥40的同名结果相同。
      - 【🎲≧70 笑】：胡言吓唬 → 接「南宫己招供」阶段。
    数值:
      心相: -15
  二师兄出马:
    触发:
      - 见以上阶段
    经过:
      - • 设置🚩「二师兄拷问」。
      - • 接「南宫己招供」阶段。
  南宫己招供:
    触发:
      - 见以上阶段
    经过:
      - 🚩二师兄拷问：对话差分。
      - 修养≤40：对话差分。
      - [叶云裳在唐门](/event/simple/1-08-1-叶氏行踪风波)：对话差分。
      - 拷问过程检定
      - 🚩二师兄拷问 → 唐铮好感判定
      - 🚩赵活说服成功 → 👉选项：南宫己的处置
      - 胡言吓唬 → 接续「南宫己妙用」阶段。
      - 唐铮好感判定
      - 唐铮好感≧30〔性情-1〕 → 事件结束，回唐门日常指令。
      - 唐铮好感＜30〔性情-1、唐铮好感-1〕 → 事件结束，回唐门日常指令。
      - 👉选项：南宫己的处置
      - 「求情」 → 接续「代为求情」阶段。
      - 「食言」〔道德-2、性情-1、处世-1〕 → 接续「南宫己妙用」阶段。
    数值:
      性情: -3
      道德: -2
      唐铮好感: -1
    选项:
      - 食言（道德-2、性情-1、处世-1）
  代为求情:
    触发:
      - 接续「南宫己招供」阶段
      - 且👉「求情」
    经过:
      - 性情-1、唐铮好感-1。
      - 🎲天命：少废话 (上限50，唐铮好感补正)
      - 【🎲＜20 很可疑】 → 进入[「生死簿99: 走路不看路而死」](/event/badends/#生死簿-No.99)。
      - 【🎲＜70 少废话】〔体力-3、抗毒+2、抗麻+2〕 → 接续「求情的下场」阶段。
      - 【🎲≧70 少废话】〔体力-1、内力+2、抗毒+1、抗麻+1、阴阳±10〕：设置🚩「二师兄手下留情」 → 60＞阴阳≥40: 内力+2 → 接续「求情的下场」阶段。
    数值:
      性情: -1
      抗毒: +3
      抗麻: +3
      唐铮好感: -1
  求情的下场:
    触发:
      - 见以上阶段
    经过:
      - 行动次数-1。
      - 复合检定
      - 叶云裳在唐门：设置🚩「小师妹出场」、🚩「唐芳出场」。
      - 不符但唐默铃好感≧15：设置🚩「小师妹出场」。
      - 其他≧15：对话差分。
      - 若🚩小师妹出场
      - 心上人为唐默铃〔心相+20〕
      - 心上人非唐默铃〔变心+2〕
      - 若🚩唐芳出场
      - 若🚩二师兄手下留情：对话差分。
      - 若🚩小师妹出场〔唐默铃好感+1〕
      - 若未🚩小师妹出场，且未🚩唐芳出场〔心相-10〕
      - 设置🚩「帮南宫己求情」。
      - 事件结束，回唐门日常指令。
    数值:
      心相: +10
      唐默铃好感: +1
  南宫己妙用:
    触发:
      - 见「南宫己招供」阶段
    经过:
      - 👉选项：是否开其他药柜
      - 「开开看」 → 进入[「生死簿100: 手贱而死」](/event/badends/#生死簿-No.100)。
      - 「听令行事」 → 事件结束，回唐门日常指令。