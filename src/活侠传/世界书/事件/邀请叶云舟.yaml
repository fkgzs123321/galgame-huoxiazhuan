事件: 邀请叶云舟
时序: 第3年8月中旬
系列: 共 3 环
  邀请云舟:
    触发:
      - 叶云舟在唐门(见备注)
      - 时间范围内，点选「大门」触发
    经过:
      - 有[建设外堡](/system/facility): 对话差分。
      - 设置🚩「叶云舟同行武林大会」。
      - 检定🚩[和叶云裳结缘](/event/simple/3-05-1-九转疗伤):
      - 有🚩和叶云裳结缘:
      - • 叶云舟好感＜40: 对话差分。
      - • 🚩小师妹不在唐门(见备注): 对话差分。
      - • 接「云裳请求」阶段。
      - 未🚩和叶云裳结缘:
      - • 事件结束，回唐门养成指令。
    备注: 在目前版本(v1.0.5000.13)中:

 • 🚩叶云舟在唐门: 绑定🚩和叶云裳结缘。

 • 🚩和叶云裳结缘: 绑定🚩小师妹不在唐门。
  云裳请求:
    触发:
      - 接续「邀请云舟」阶段
      - 或由本阶段重复。
    经过:
      - 若第一次进入本阶段，设置🚩「问叶云舟次数」=0。
      - 叶云裳想一起去，请你替她求情，触发选项:
      - 👉「帮她求情」:
      - • 叶云舟好感-1。
      - • 处世≤40: 对话差分。
      - • 叶云舟好感检定:
      - • 叶云舟好感＜40: 对话差分。
      - • 叶云舟好感≥40: 检定曾在[药铺](/system/facility)触发🚩[触发叶云舟煎药侠](/system/training/):
      - • 未触发: 叶云舟好感+1。
      - • 曾触发: 若处世＜60，叶云舟好感+4。
      - • 设置🚩「叶云裳同行武林大会」。
      - • 事件结束，接唐门养成指令。
      - 👉「你问你哥」:
      - • 检定🚩问叶云舟次数:
      - 若🚩问叶云舟次数＜3:
      - • 处世+1、叶云舟好感+1。
      - • 设置🚩问叶云舟次数+1。
      - • 重复本阶段。
      - 若🚩问叶云舟次数=3:
      - • 嘴力+1、叶云裳好感-3。
      - • 触发选项:
      - 👉「没自信哄好」:
      - • 有建设外堡: 对话差分。
      - • 心相+20、叶云舟好感+2、叶云裳好感-2。
      - 👉「交给我吧」(需银两＞3000):
      - • 银两-600、叶云裳好感+1。
      - • 银两-600、叶云裳好感+1。
      - • 触发🎲天命(上限99):
      - 【🎲＜60 一桌子菜】:
      - • 处世≥60: 对话差分。
      - • 叶云裳好感+2。
      - • 银两-1800。
      - • 若处世＜40且修养≥60且银两≥200: 银两-200、叶云裳好感+3。
      - • 心相+10。
      - • 道德≤40: 对话差分。
      - • 事件结束，接唐门养成指令。
      - 【🎲≥60 被搭讪了】:
      - • 处世≥60: 叶云裳好感-1。
      - • 再次触发🎲天命(上限50，嘴力、名声、道德补正):
      - 【🎲＜80 你就是凶手】:
      - • 接「战官兵」阶段。
      - 【🎲≥80 说服成功】:
      - • 处世≤40: 对话差分。
      - • 道德≤40: 对话差分。
      - • 设置🚩「大地图追加新通缉犯」。
      - • 事件结束，接唐门养成指令。
    数值:
      嘴力: +1
      心相: +30
      叶云舟好感: +2
      叶云裳好感: -1
    备注: 若要🚩叶云裳同行武林大会:

 不要👉「你问你哥」3次就行。
  战官兵:
    触发:
      - 接续「云裳请求」阶段
    经过:
      - 触发对决🆚「战官兵」:
      - • 敌方辅助: 官差x3。
      - • 敌方状态: 官差。
      - • 第9回合: 自动落败。
      - 对决结果检定:
      - 对决获胜:
      - • 处世+2、性情+1、宋悲好感-1。
      - • 触发选项:
      - 👉「问心无愧」:
      - • 处世+2、性情+1、道德+1。
      - • 道德≤40: 对话差分。
      - • 有建设外堡: 对话差分。
      - • 名声+3。
      - • 设置🚩「大地图追加新通缉犯」。
      - • 事件结束，接唐门养成指令。
      - 👉「追究到底」:
      - • 道德-2、性情+1。
      - • 事件结束，接唐门养成指令。
      - 对决落败:
      - • 若道德≤40，处世检定:
      - • 处世≤40: 嘴力+1。
      - • 处世＞40: 性情+1。
      - • 宋悲好感检定:
      - • 宋悲好感≥20: 宋悲好感+2。
      - • 宋悲好感＜20: 宋悲好感+1。
      - • 门派资产+200。
      - • 道德检定:
      - • 道德≥60: 宋悲好感+3。
      - • 道德＜60: 若修养≤40，处世+2、性情+2、宋悲好感-2。
      - • 设置🚩「被关次数」+1。
      - • 事件结束，接唐门养成指令。
    数值:
      性情: +6
      道德: -1
      嘴力: +1
      宋悲好感: -2
    备注: 🚩被关次数: 没什么用。