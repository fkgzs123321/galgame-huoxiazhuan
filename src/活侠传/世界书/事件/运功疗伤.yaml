事件: 运功疗伤
时序: 第1年5月上旬
  运功疗伤:
    触发:
      - 在[练功场团练](/system/training/)触发过二师兄带练
      - 时间范围内，自动触发
    经过:
      - 体力-1。
      - 体力检定:
      - • 体力＜30: 体力-1、唐铮好感-1。
      - • 体力≥30: 唐铮好感+1。
      - 触发选项:
      - 👉「三师兄」:
      - • 处世-1、体力+1、贡献度-10。
      - • 设置🚩「三师兄运功」。
      - 👉「自己」(需心相≥50):
      - • 处世＜60: 对话差分。
      - • 性情+1、唐升好感+1。
      - • 唐升好感≥20: 唐中翎好感+1。
      - • 体力+1、心相-20。
      - 处世≥60: 嘴力+1、性情-1、唐铮好感+1。
      - 曾触发[「唐铮诊断」](/event/simple/1-08-3-唐铮诊断)事件: 对话差分。
      - 有🚩三师兄运功: 对话差分。
      - 触发选项:
      - • 👉「内功烂」: 性情-1。
      - • 👉「不救俗人」: 处世+2、嘴力+1、唐铮好感-1。
      - 曾触发「唐铮诊断」事件: 对话差分。
      - 事件结束，回唐门养成指令。
    数值:
      性情: -1
      心相: -20
      嘴力: +2
      唐铮好感: -1
      唐升好感: +1
      唐中翎好感: +1