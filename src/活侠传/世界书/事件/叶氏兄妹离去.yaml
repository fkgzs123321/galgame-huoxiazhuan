事件: 叶氏兄妹离去
时序: 第3年1月上旬
系列: 共 8 环
  兄妹争论:
    触发:
      - 曾🚩[收留叶氏兄妹](/event/simple/1-08-1-叶氏行踪风波)
      - 时间到自动触发
    经过:
      - 叶云舟要带叶云裳离去。
      - 兄妹两人讨论结果，触发天命🎲:
      - (上限50，叶云裳好感补正)
      - 【🎲＜80 离开唐门】:
      - • 小医仙梁有诗传闻: 江陵瑞笙未知检定，对话差分。
      - • 接「唐门送行」阶段。
      - 【🎲≥80 叶云裳抵抗】:
      - • 接「云裳抵抗」阶段。
    备注: 未知检定: 待测。
  云裳抵抗:
    触发:
      - 接续「兄妹争论」阶段
      - 且【🎲≥80 叶云裳抵抗】
    经过:
      - 叶云裳求助唐门人。
      - 叶云裳求助于你，触发选项:
      - 👉「劝叶云舟留」:
      - • 处世检定:
      - • 处世＜60: 叶云舟好感-1。
      - • 处世≥60: 叶云舟好感-3。
      - • 叶云裳好感≥30: 对话差分。
      - • 检定🚩青城留学:
      - • 无🚩青城留学: 若性情＜40，设置🚩「超怕」。
      - • 有🚩青城留学: 性情-2，性情检定:
      - • 性情≥40: 设置🚩「怕」。
      - • 性情＜40: 设置🚩「很怕」，处世检定:
      - • 处世≥60: 叶云裳好感+2。
      - • 处世＜60: 叶云裳好感+1、叶云舟好感+1。
      - • 接「战叶云舟」阶段。
      - 👉「劝叶云裳走」:
      - • 心相-30。
      - • 接「唐门送行」阶段
    数值:
      性情: -2
      心相: -30
      叶云舟好感: +1
      叶云裳好感: +1
  战叶云舟:
    触发:
      - 接续「云裳抵抗」阶段
    经过:
      - 触发🆚「对决叶云舟」:
      - • 敌方状态: 浩劫余生、血量-30%、虚脱。
      - • 若🚩怕: 我方初始气力-5。
      - • 若🚩很怕: 我方初始气力-8。
      - • 若🚩超怕: 我方胆怯。
      - 决斗结果检定:
      - • 获胜: 武学+5、叶云裳好感+1。
      - • 落败: 性情-2、心相-20、叶云裳好感-1。
      - 唐芳登场，接「唐芳建议」阶段。
    数值:
      性情: -2
      心相: -20
      叶云裳好感: -1
  唐芳建议:
    触发:
      - 接续「战叶云舟」阶段
    经过:
      - 触发 ☯议题选单:
      - 闲聊 ☯「唐芳的伤情」:
      - • 若未🚩询问云裳伤情，且未闲聊 ☯「治疗方法」: 处世-1、修养+1、贡献度+10。
      - • 检定「[医术](/system/skill)等级≥4或全炼丹点数≥120」:
      - • 符合条件: 对话差分。
      - • 不合条件: 若处世≥60，嘴力+1、道德-1。
      - • 回 ☯议题选单。
      - 闲聊 ☯「云裳的伤情」:
      - • 设置🚩「询问云裳伤情」。
      - • 性情＜60: 对话差分。
      - • 回 ☯议题选单。
      - 闲聊 ☯「治疗方法」:
      - • 检定🚩询问云裳伤情:
      - 若已🚩询问云裳伤情:
      - • 医术等级: 对话差分。
      - • 曾🚩留学青城: 接「无能为力」阶段。
      - • 未🚩留学青城: 接「唐芳赠丹」阶段。
      - 若未🚩询问云裳伤情:
      - • 若第一次问疗法: 处世+2、修养+1、心相-10，设置🚩「先问疗法」。
      - • 若非第一次问疗法: 处世+2、修养+1、心相-10、叶云裳好感-1、叶云舟好感-1。
      - • 回 ☯议题选单。
    数值:
      嘴力: +1
      道德: -1
      心相: -20
      叶云裳好感: -1
      叶云舟好感: -1
  无能为力:
    触发:
      - 接续「唐芳建议」阶段
    经过:
      - [医术](/system/skill)≥3: 对话差分。
      - 是否继续事件，复合检定:
      - • 若心上人非叶云裳: 事件结束，接唐门养成指令。
      - • 若未🚩[听说寂灭三摩地](/event/simple/2-12-1-叶云舟归来): 事件结束，接唐门养成指令。
      - • 非以上情况，则接续以下。
      - 处世≥60: 对话差分。
      - 道德≤40: 嘴力+1、修养-1。
      - 触发选项:
      - 👉「洗耳恭听」:
      - • 设置🚩「洗耳恭听」、修养+1。
      - • 技能[「佛学」](/system/skill)≥2或学问≥40: 对话差分。
      - • 佛学≥1或学问≥30: 对话差分。若佛学≥3或学问≥50，再对话差分。
      - • 佛学≥3或学问≥50: 对话差分。若佛学≥3，再对话差分。
      - • 再触发选项:
      - • 👉「没有对错」: 学问+1、修养+1。若处世≥60，处世-1。
      - • 👉「我怎么知道」: 学问-1、道德-1。
      - • 佛学＜1且学问＜30: 学问+1。
      - • 接「九转轮回」阶段。
      - 👉「你别岔开话题」:
      - • 若🚩先问疗法: 对话差分。
      - • 处世+1、修养-1。
      - • 接「九转轮回」阶段。
    数值:
      嘴力: +1
      道德: -1
  九转轮回:
    触发:
      - 接续「无能为力」阶段
    经过:
      - 若🚩洗耳恭听: 对话差分。
      - 若🚩大师兄幸存: 对话差分。
      - 唐铮好感≥30: 对话差分。
      - 触发选项:
      - • 👉「认同」: 性情+1。
      - • 👉「不予置评」: 性情-1。
      - 性情≥60: 对话差分。
      - 获得秘笈[《九转残篇》](/system/books/book_8109)。
      - 事件结束，回唐门养成指令。
    数值:
      性情: +0
    备注: 此时应尚未设置

 🚩大师兄幸存，

 是否误植，待测。
  唐芳赠丹:
    触发:
      - 接续「唐芳建议」阶段
    经过:
      - 若心上人为叶云裳: 对话差分。
      - 对云裳说的话，触发选项:
      - • 👉「乖乖听话」: 对话差分。
      - • 👉「等你回来」: 对话差分。
      - • 👉「不要走」: 道德-1、体力-1。
      - 设置🚩「唐芳赠丹」。
      - 接「唐门送行」阶段。
    数值:
      道德: -1
  唐门送行:
    触发:
      - 接续「兄妹争论」
      - 、「云裳抵抗」或
      - 「唐芳赠丹」阶段
    经过:
      - 处世≥40: 对话差分。
      - 心上人检定:
      - 心上人为叶云裳:
      - • 道德≤40: 对话差分。
      - • 心相-30。
      - • 叶云裳好感≥50: 对话差分。
      - 心上人非叶云裳:
      - • 对话差分。
      - 心上人为叶云裳: 对话差分，若叶云裳好感≥50再差分。
      - 叶云裳好感≥50: 获得秘笈[《云裳剑谱》](/system/books/book_2302)。
      - 处世≤40: 对话差分。
      - 显示插图。
      - 若无🚩唐芳赠丹: 设置🚩「点苍剑鬼前提」。
      - 设置🚩叶云裳不在唐门、🚩叶云舟不在唐门、🚩叶云舟去金国求医。
      - 事件结束，回唐门养成指令。
    数值:
      心相: -30