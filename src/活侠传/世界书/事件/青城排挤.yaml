事件: 青城排挤
时序: 第2年8月下旬
系列: 共 3 环
  青城排挤:
    触发:
      - 青城留学
      - 常风观修练次数≥3
    经过:
      - 心相-15。
      - 触发🎲天命(上限50，修养补正，处世扣除):
      - 【🎲＜50 生气了】: 道德-1、修养-1、处世-1、性情-1、嘴力+1、青城派好感-1。
      - 【🎲≥50 没生气】: 处世-1、修养+1、心相-10、青城派好感+1。
      - 接「云裳捉弄」阶段。
    数值:
      心相: -25
      道德: -1
      性情: -1
      嘴力: +1
      青城派好感: +1
  云裳捉弄:
    触发:
      - 接续「青城排挤」阶段
    经过:
      - 修养≤40: 申屠龙好感-1。
      - 心上人叶云裳: 叶云裳好感+1、处世-1。
      - 道德≥40: 性情-1、心相-10。
      - 叶云裳好感≥35: 获得秘笈[《雪球教战守则》](/system/books/book_8003)。
      - 学问≥30: 对话差分。
      - 处世≤40: 对话差分。
      - 叶云裳好感≥35: 性情-1、心相-10。
      - 接「求教申屠」阶段。
    数值:
      性情: -2
      心相: -20
      申屠龙好感: -1
      叶云裳好感: +1
  求教申屠:
    触发:
      - 接续「云裳捉弄」阶段
    经过:
      - 触发🎲天命(上限60，申屠龙好感补正):
      - 【🎲＜50 申屠龙抵抗】:
      - • 修养≥40: 对话差分。
      - • 获得秘笈[《点苍棒法》](/system/books/book_2303)。
      - • 设定「云裳秘笈」事件时间为两旬后(需在该事件自身期限内)。
      - 【🎲≥50 叶云裳恐吓】:
      - • 处世＜60: 申屠龙好感+1
      - • 获得秘笈[《三五斩妖剑》](/system/books/book_2009)。
      - • 处世≤40: 叶云裳好感-1、申屠龙好感+1。
      - • 触发选项:
      - 👉 「你功劳最大」: 若道德≥40则对话差分。
      - 👉 「受害者不同」: 嘴力+1、处世+1、叶云裳好感-1。
      - • 若取得[风云史00:《命中有数》](/event/achievements/#风云史-No.00): 触发额外剧情(暂名「申屠残魂」)。
      - 事件结束，接青城留学养成指令。
    数值:
      嘴力: +1
      申屠龙好感: +1
      叶云裳好感: -1