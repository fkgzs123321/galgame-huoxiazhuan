    触发:
      - 接续「参观锦香宫」阶段
      - 且【🎲＜70 随便抓】
    经过:
      - 龙湘好感≥40或名声≥50: 对话差分。
      - 检定拥有江湖快报数量:
      - • 数量≥6: 处世-1、心相+10、龙湘好感+1。
      - • 数量＜6: 对话差分。
      - 心相+20、变心+2。
      - 触发选项:
      - 👉「你可愿随我游湖?」:
      - • 处世-2、性情+1、变心+8。
      - • 已有结缘者: 道德-2。
      - • 处世≤40: 嘴力+1、道德-1。
      - • 嘴力≥40: 嘴力+1。
      - • 名声-2、龙湘好感-2、锦香宫好感-1。
      - • 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
      - 👉「多谢向导」:
      - • 龙湘好感检定(以下段落较长，以分隔线分开):
      - -----龙湘好感＜40-----
      - • 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
      - -----龙湘好感≥40-----
      - 心上人检定:
      - • 心上人为龙湘: 心相+40。
      - • 心上人非龙湘: 处世＜60，对话差分。
      - 心上人为龙湘: 心相-20。
      - 心上人非龙湘: 变心检定:
      - • 变心≤5: 设置🚩「婉拒盛雪协助」。
      - • 变心＞5: 对话差分。
      - 检定🚩婉拒盛雪协助:
      - 婉拒:
      - • 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
      - 未婉拒:
      - • 道德检定:
      - • 道德≤40: 对话差分。
      - • 道德＞40: 设置🚩「盛雪刺探龙湘心意」。
      - • 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
