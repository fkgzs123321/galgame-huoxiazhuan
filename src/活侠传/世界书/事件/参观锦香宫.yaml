      - • 曾救: 对话差分。
      - • 未救: 道德≥40，对话差分。
      - 检定曾🚩崆峒地牢救小梅:
      - 曾救:
      - • 处世≤40: 对话差分。
      - • 触发选项:
      - • 👉「希望不是」: 道德+1。
      - • 👉「是的话杀了你」: 对话差分。
      - 未救:
      - • 瑞笙好感≥30: 对话差分。
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 嘴力+2、心相-30。
      - 检定曾🚩崆峒地牢救小梅:
      - • 曾救: 设置🚩「知道画中仙即仙儿」。
      - • 未救: 对话差分。
      - 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
