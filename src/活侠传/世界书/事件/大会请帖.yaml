事件: 大会请帖
时序: 第3年8月中旬
系列: 共 7 环
  师弟通报:
    触发:
      - 时间到自动触发
    经过:
      - 检定[初战金乌上人](/event/simple/3-05-1-对决金乌)结果:
      - • 获胜: 对话差分。
      - • 落败: 若修养≤40，心相+10、处世+1。
      - 道德检定:
      - 道德≤40: 性情检定:
      - • 性情≤40: 对话差分。
      - • 性情＞40: 对话差分。
      - 道德＞40: 性情检定:
      - • 性情≤40: 对话差分。
      - • 性情＞40: 检定初战金乌结果:
      - • 获胜: 向心+2。
      - • 落败: 对话差分。
      - 接「宋悲来访」阶段。
    数值:
      心相: +10
      向心: +2
  宋悲来访:
    触发:
      - 接续「师弟通报」阶段
    经过:
      - 🚩[唐门内战上官萤帮助唐门](/event/simple/2-12-3-唐门内战): 对话差分。
      - 检定🚩认识宋悲:
      - 已🚩认识宋悲:
      - • 处世≥60: 对话差分。
      - • 宋悲好感≥20: 对话差分。
      - 未🚩认识宋悲:
      - • 处世≤40: 对话差分。
      - • 设置🚩「认识宋悲」。
      - • 道德检定:
      - • 道德≥40: 若处世≤40，对话差分。
      - • 道德＜40: 触发选项:
      - 👉「正面嘴攻」:
      - • 性情+2、处世+1、修养-1、嘴力+1、宋悲好感-1。
      - • 嘴力≥40: 嘴力+1、宋悲好感-1。
      - 👉「迂回嘴攻」(需嘴力≥40):
      - • 嘴力+2、修养+1、处世-1。
      - 道德≥40: 对话差分。
      - 接「请柬送达」阶段。
    数值:
      性情: +2
      嘴力: +4
      宋悲好感: -1
    备注: 🚩唐门内战上官萤帮助唐门:

 需[切鱼刀](/system/forge-roadmap)，目前无法触发。
  请柬送达:
    触发:
      - 接续「宋悲来访」阶段
    经过:
      - 🚩[天武门加入唐门](/event/simple/2-09-1-四师兄会合): 对话差分。
      - 宋悲好感≥20: 对话差分。
      - 宋悲好感检定:
      - 宋悲好感＜20:
      - • 对话差分。
      - 20≤宋悲好感＜35:
      - • 对话差分。
      - • 宋悲好感≥35:
      - • 性情＜60: 对话差分。
      - • 性情＞40: 宋悲好感+1。
      - 🚩和唐默铃结缘: 对话差分。
      - 接「对策讨论」阶段。
    数值:
      宋悲好感: +1
  对策讨论:
    触发:
      - 接续「请柬送达」阶段
    经过:
      - 触发 ☯议题选单:
      - 离开 ☯「武林大会」:
      - • 接「带队人选」阶段。
      - 闲聊 ☯「朝廷」:
      - • 🚩和唐默铃结缘: 对话差分。
      - • 若全真派好感≥5，或嵩山派好感≥5，或尹志平好感≥10，或福韫好感≥10: 续下列检定:
      - • 若学问≥45，或[「佛学」](/system/skill)等级≥3，或[「道学」](/system/skill)等级≥3: 唐升好感+1。
      - • 学问≥50: 唐升好感+3。若🚩和唐默铃结缘，唐默铃好感+2。
      - • 回 ☯议题选单。
      - 闲聊 ☯「南宫同盟」:
      - • 解锁此项的条件未知。
    数值:
      唐升好感: +3
      唐默铃好感: +2
  带队人选:
    触发:
      - 接续「对策讨论」阶段
    经过:
      - 🚩和唐默铃结缘: 对话差分。
      - 修养＜40: 嘴力+1、道德-1、唐升好感-1。
      - 带回正题方式，触发选项:
      - • 👉「友善」: 对话差分。
      - • 👉「不友善」: 嘴力+1、道德-1、修养-2、唐升好感-1。
      - 若道德＜60或处世≥60: 处世+1、唐升好感+1。
      - 带队人选，触发天命🎲:
      - (上限99，唐升好感、修养、性情补正，处世扣除)
      - 【🎲＜60 四师弟】:
      - • 修养≤40: 对话差分。
      - • 处世≥60: 对话差分。
      - • 性情≤40: 对话差分。
      - 【🎲≧60 你】:
      - • 性情≤40: 唐升好感-1。
      - 检定🚩和唐默铃结缘:
      - • 有结缘: 接「师妹请求」阶段。
      - • 未结缘: 接「商议结束」阶段。
    数值:
      嘴力: +2
      道德: -2
      唐升好感: -1
  师妹请求:
    触发:
      - 接续「带队人选」阶段
    经过:
      - 唐升好感检定:
      - 若唐升好感＜35:
      - • 道德检定:
      - • 道德≤40: 对话差分。
      - • 道德＞40: 若处世＜20，嘴力+1、处世-1、唐默铃好感-1、唐升好感+2。
      - • 接「商议结束」阶段。
      - 若唐升好感≧35:
      - • 道德检定:
      - • 道德≥60: 唐默铃好感+2、设置🚩「小师妹同行武林大会」。
      - • 道德＜60: 嘴力+1，触发选项:
      - • 👉「不可以(诚实)」: 处世+2、性情+2、唐默铃好感+3、唐升好感-2。
      - • 👉「可以(撒谎)」: 设置🚩「小师妹同行武林大会」。
      - • 接「商议结束」阶段。
    数值:
      嘴力: +2
      性情: +2
      唐默铃好感: +3
      唐升好感: -2
  商议结束:
    触发:
      - 接续「带队人选」或
      - 「师妹请求」阶段
    经过:
      - 事件结束，回唐门养成指令。