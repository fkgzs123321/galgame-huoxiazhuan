事件: 遭遇青城派
时序: 第3年9月上旬
系列: 共 7 环
  遭遇青城派:
    触发:
      - [「前往武林大会」](/event/simple/3-09-1-前往武林大会)路程随机触发
      - 机率权重10
      - 一次性，不可重复触发
    经过:
      - 检定🚩[留学青城](/event/simple/2-08-2-唐门迎敌):
      - • 未留学青城: 接「青城对策」阶段。
      - • 有留学青城: 接「邹博谈话」阶段。
  青城对策:
    触发:
      - 接续「遭遇青城派」阶段
    经过:
      - 对待青城的对策，触发选项:
      - 👉「申屠龙是坏人」:
      - • 解锁此项需🚩[卧云岗事件跟随下山](/event/simple/3-01-2-卧云岗事件)。
      - • 对话后事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 👉「不甘示弱」:
      - • 性情+1、处世+1、修养-2。
      - • 接「战邹博」阶段。
      - 👉「走为上策」:
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      性情: +1
  战邹博:
    触发:
      - 接续「青城对策」阶段
    经过:
      - 触发对决 🆚战邹博:
      - 对决结果检定:
      - 落败:
      - • 武学+4、向心-2，道德检定:
      - • 道德≤40: 嘴力+1、修养-1。
      - • 道德＞40: [卧云岗事件](/event/simple/3-01-2-卧云岗事件)路线检定:
      - • 🚩卧云岗事件跟随下山: 接「指控申屠龙」阶段。
      - • 🚩卧云岗事件山上留守: 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
      - 获胜:
      - • 武学+6、名声+5，[卧云岗事件](/event/simple/3-01-2-卧云岗事件)路线检定:
      - 🚩卧云岗事件跟随下山:
      - • 接「指控申屠龙」阶段。
      - 🚩卧云岗事件山上留守:
      - • 心相+20、向心+5。
      - • 青城派好感-2，其余五大派好感-1。
      - • 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      向心: +3
      嘴力: +1
      心相: +20
      青城派好感: -2
      余五大派好感: -1
  指控申屠龙:
    触发:
      - 接续「青城对策」或
      - 「战邹博」阶段
    经过:
      - 设置🚩「向邹博指控申屠龙」。
      - 检定🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅):
      - 虞小梅有同行:
      - • 道德≤40: 对话差分。
      - • 🚩[唐娇娇加入唐门](/event/simple/2-05-1-峨嵋狄傲): 对话差分。
      - 虞小梅未同行:
      - • 心相-20、向心+2、贡献度+20。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      心相: -20
      向心: +2
  邹博谈话:
    触发:
      - 接续「遭遇青城派」阶段
    经过:
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 处世检定:
      - 处世＜60:
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 处世≥60:
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 拥有技能[「经脉闭塞」](/system/skill): 对话差分。
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟):
      - • 对话差分，检定🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟):
      - • 有同行，对话差分。
      - 是否向邹博告状，触发选项:
      - 👉「道别」:
      - • 接续「事件尾声」阶段。
      - 👉「告状」:
      - • 解锁此项需🚩[卧云岗事件跟随下山](/event/simple/3-01-2-卧云岗事件)或🚩[和叶云裳结缘](/event/pursuit/girl2)。
      - • 检定[卧云岗事件](/event/simple/3-01-2-卧云岗事件)路线:
      - 🚩卧云岗事件山上留守:
      - • 接「指控铁冠道人」阶段。
      - 🚩卧云岗事件跟随下山:
      - • 青城派好感-1，设置🚩「向邹博指控申屠龙」。
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - • 检定🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟):
      - • 未同行: 对话差分。
      - • 有同行: 向心+2、贡献度+20、叶云舟+1、青城派好感+2。
      - • 检定🚩[和叶云裳结缘](/event/pursuit/girl2):
      - • 未结缘: 对话差分，接「事件尾声」阶段。
      - • 有结缘: 触发选项:
      - • 👉「告状」: 接「指控铁冠道人」阶段。
      - • 👉「道别」: 接「事件尾声」阶段。
    数值:
      向心: +2
      青城派好感: +2
  指控铁冠道人:
    触发:
      - 接续「邹博谈话」阶段
    经过:
      - 设置🚩「向邹博指控铁冠道人」。
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 性情≥60: 对话差分。
      - 道德≥40: 对话差分。
      - 性情＜60: 对话差分。
      - 🚩[卧云岗事件跟随下山](/event/simple/3-01-2-卧云岗事件): 对话差分。
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 修养检定:
      - 修养≤40:
      - • 嘴力+1、性情+1，青城派好感-1。
      - • 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 叶云舟好感-1。
      - 修养＞40:
      - • 对话差分。
      - 🚩[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。
    数值:
      嘴力: +1
      性情: +1
      青城派好感: -1
      叶云舟好感: -1
  事件尾声:
    触发:
      - 接续「邹博谈话」阶段
    经过:
      - 处世[叶云舟同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 事件结束，回[「前往武林大会」](/event/simple/3-09-1-前往武林大会)事件。