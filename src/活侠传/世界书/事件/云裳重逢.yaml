事件: 云裳重逢
时序: 第2年10月中旬
  云裳重逢:
    触发:
      - 🚩赵活在唐门
      - 🚩参加江陵大战([崆峒留学](/event/simple/2-02-1-留学讨论)线)
      - 🚩叶云裳在唐门(曾[收留叶氏兄妹](/event/simple/1-08-1-叶氏行踪风波))
      - 叶云裳好感≥30
      - 时间到自动触发
    经过:
      - 触发选项:
      - 👉「我跳」(需入夺魄门):
      - • 叶云裳好感检定:
      - • 叶云裳＜40: 对话差分。
      - • 叶云裳≥40: 心上人检定:
      - • 心上人为叶云裳: 心相+20。
      - • 心上人非叶云裳: 变心+5。
      - • 叶云裳好感+5。
      - 👉「打屁股」:
      - • 再触发选项:
      - • 👉「见好就收」: 心相-20、修养+1、叶云裳好感+1、叶云舟好感+1。
      - • 👉「打爆」: 心相-20、向心+1、叶云裳好感+2。
      - 👉「下山玩」:
      - • 处世≥60: 对话差分。
      - • 心上人为 唐默铃: 心相+20。
      - • 银两检定:
      - • 银两≥1500: 唐默铃好感+2、叶云裳好感+2、银两-1500。若唐默铃好感≥40，对话差分。
      - • 1500＞银两≥1000: 唐默铃好感+2、叶云裳好感+1、银两-1000。
      - • 1000＞银两≥500: 道德-1、唐默铃好感+1、叶云裳好感+1、银两-500。
      - • 银两＜500: 贡献度-20、唐默铃好感+1、叶云裳好感+1、银两-500。
      - 事件结束，回唐门养成指令。
    数值:
      心相: +0
      向心: +1
      道德: -1
      叶云裳好感: +1
      叶云舟好感: +1
      唐默铃好感: +1
    旗标:
      - 赵活在唐门
      - 参加江陵大战
      - 叶云裳在唐门