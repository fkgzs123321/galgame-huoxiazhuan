事件: 叶云舟归来
时序: 第2年12月上旬
系列: 共 5 环
  云舟归来:
    触发:
      - 🚩[离家出走住破庙](/event/simple/2-06-1-离家出走)
      - 叶云裳在唐门
      - 时间到自动触发
    经过:
      - 🚩[留学青城](/event/simple/2-08-2-唐门迎敌): 对话差分。
      - 设置🚩「叶云舟在唐门」。
      - 🚩留学青城: 对话差分。
      - 处世≤40: 对话差分。
      - 叶云舟好感+1。
      - 🚩留学青城: 对话差分。
      - 学问≥50: 叶云舟好感+1。
      - 检定🚩留学青城:
      - 未🚩留学青城:
      - • 事件结束，回唐门养成指令。
      - 有🚩留学青城:
      - • 处世≥60: 对话差分。
      - • 再检定: 叶云裳好感≥30，且[「医术」](/system/skill)等级≥3:
      - 不满足条件: 接「报告掌门」阶段。
      - 满足条件:
      - • 性情≤40: 对话差分。
      - • 设置🚩「听说寂灭三摩地」。
      - • 再检定: 技能[「佛学」](/system/skill)等级≥3，或学问≥70:
      - 不满足条件:
      - • 对话差分。
      - 满足条件:
      - • 福韫好感≥20: 对话差分。
      - • 叶云裳好感+2。
      - 接「报告掌门」阶段。
    数值:
      叶云舟好感: +1
      叶云裳好感: +2
  报告掌门:
    触发:
      - 接续「云舟归来」阶段
    经过:
      - 修养＜40: 处世+1、修养-1、叶云裳好感+1。
      - 学问≥30: 唐中翎好感+1、叶云裳好感+1。
      - 修养≥60: 对话差分。
      - 道德≤40: 对话差分。
      - 接续「云舟闲聊」阶段。
    数值:
      叶云裳好感: +1
      唐中翎好感: +1
  云舟闲聊:
    触发:
      - 接续「报告掌门」阶段
    经过:
      - 触发 ☯议题选单:
      - 离开 ☯「早点休息」:
      - • 处世≤40: 对话差分。
      - • 接「段智秀后续」阶段。
      - 闲聊 ☯「叶兄如何从战场幸存」:
      - • [「战术」](/system/skill)等级≥3: 叶云舟好感+1。
      - • 若未🚩聊过听云剑: 对话差分，设置🚩「聊过听云剑」。
      - • 处世≤40: 嘴力+1、修养-1。
      - • 变心次数≥2: 对话差分。
      - • 听说叶云舟被吐蕃公主招婿，触发选项:
      - • 👉「成亲了?」: 嘴力+1。
      - • 👉「神豹的考验?」: 对话差分。
      - • 设置🚩「听过叶云舟被吐蕃招婿」。
      - • 回 ☯议题选单。
      - 闲聊 ☯「听云剑在他人手里」:
      - • 若🚩聊过听云剑，此选项关闭。
      - • 设置🚩「聊过听云剑」。
      - • 回 ☯议题选单。
      - 闲聊 ☯「隐情」:
      - • 处世≥60: 对话差分。
      - • 修养≥40: 对话差分。
      - • 曾触发[「初遇叶氏兄妹」](/event/simple/1-04-3-初遇叶氏兄妹)事件: 对话差分。
      - • 回 ☯议题选单。
      - 闲聊 ☯「骂段智秀」:
      - • 如何骂，触发🎲天命(上限99，嘴力补正、道德扣除、修养扣除)
      - • 【🎲＜50 合理抱怨】: 叶云舟好感+1、心相+10。
      - • 【🎲＜80 情绪发言】: 处世+1、修养-1、嘴力+1。
      - • 【🎲≥80 没有理智】: 道德-2、嘴力+2、处世+2、修养-2、心相+20、叶云舟好感-1。
      - • 回 ☯议题选单。
      - 决斗☯「点心残渣属于我」:
      - • 接「抢残渣」阶段。
    数值:
      嘴力: +5
      心相: +30
      道德: -2
      叶云舟好感: -1
  抢残渣:
    触发:
      - 接续「云舟闲聊」阶段
      - 且☯「点心残渣属于我」
    经过:
      - 触发🆚「对决叶云舟」，结果检定:
      - 获胜:
      - • 武学+5。
      - • 处世≥40: 对话差分。
      - • 叶云舟好感+1。
      - • 接「段智秀后续」阶段。
      - 落败:
      - • 若唐铮好感≥30: 贡献度+20。事件结束，回唐门养成指令。
      - • 若唐铮好感＜30: 触发🆚「对决野狼」，结果检定:
      - • 获胜: 事件结束，回唐门养成指令。
      - • 落败: 进入[生死簿102:《狼的宵夜》](/event/badends/#生死簿-No.102)。
    数值:
      叶云舟好感: +1
  段智秀后续:
    触发:
      - 接续「云舟闲聊」或
      - 且「抢残渣」阶段
    经过:
      - 闲聊段智秀后续。
      - 事件结束，回唐门养成指令。