事件: 四师兄江陵回归
时序: 第2年10月中旬
  师兄回归:
    触发:
      - 接续[「回归唐门」](/event/simple/2-10-1-回归唐门)事件
      - 或在唐门十月中自动触发
    经过:
      - • 设置当下时间为第二年十月中旬。
      - • 若🚩[「离家出走住破庙」](/event/simple/2-06-1-离家出走): 对话差分。
      - • 若🚩[「收留叶氏兄妹」](/event/simple/1-08-1-叶氏行踪风波): 设置🚩「叶云舟在唐门」。
      - • 设置🚩「四师兄在唐门」。
      - • 事件结束，回唐门日常养成。
    备注: • 不确定如何非经[「回归唐门」](/event/simple/2-10-1-回归唐门)触发。

 • 🚩四师兄在唐门: 主要为了破庙线，

 因[「唐门战后」](/event/simple/2-08-2-唐门战后)曾设置🚩四师兄不在唐门。