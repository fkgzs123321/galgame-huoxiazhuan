事件: 山道之战
时序: 第3年5月上旬
系列: 共 4 环
  遇段智秀:
    触发:
      - 接续[「云裳诀别」](/event/simple/3-05-1-云裳诀别)子事件
      - 且选择三次软性对策
    经过:
      - 修养≤40: 对话差分。
      - 性情≤40: 对话差分。
      - 曾🚩[听过叶云舟被吐蕃招婿](/event/simple/2-12-1-叶云舟归来): 对话差分。
      - 曾🚩[冒充宋室](/event/simple/2-11-1-云裳倒地): 对话差分。
      - 触发对决🆚「战段智秀」
      - • 敌方状态: 单手、愤怒。
      - • 若🚩冒充宋室: 初始对话差异、敌方初始气力-10。
      - • 第2回合: 移除敌方「单手」状态。
      - 对决结果检定:
      - 获胜:
      - • 武学+4。
      - • 若🚩冒充宋室: 对话差分。
      - • 处世≥40: 对话差分。
      - • 接「战铁冠道人」阶段。
      - 落败:
      - • 处世≥40: 对话差分。
      - • 若🚩冒充宋室: 对话差分。
      - • 性情≤40: 对话差分。
      - • 接「铁冠真身」阶段。
  战铁冠道人:
    触发:
      - 接续「战段智秀」阶段
      - 且对决获胜
    经过:
      - 设置我方初始血量，检定「战段智秀」时最低血量:
      - • 最低血量＞80%: 初始血量100%。
      - • 80%≥最低血量＞50%: 初始血量80%。
      - • 50%≥最低血量＞30%: 初始血量50%。
      - • 最低血量＜30%: 初始血量30%。
      - 设置第2回合我方气力值减少量，性情检定:
      - • 性情≥80: 气力不减。
      - • 80＞性情≥60: 气力-3。
      - • 60＞性情≥40: 气力-5。
      - • 40＞性情≥20: 气力-10。
      - • 性情＜60: 气力-10、增加「胆怯」状态。
      - 设置🚩「保护云裳次数」=0。
      - 触发对决🆚「战铁冠道人」
      - • 敌方初始状态:「无相神功・参同秘契」、「绝世」、「千变万化」。
      - • 我方初始状态:「栈道不稳」。
      - • 初始血量及第二回合气力减少，请见上述。
      - • 第3回合: 若(战斗前的)轻功＜40，我方新增状态「失衡」。
      - • 第3回合: 我方新增状态「分心」。
      - • 若🚩保护云裳次数=3: 战斗落败。
      - • 第9回合: 自动落败。
      - 对决结果检定:
      - 获胜:
      - • 进入[汗青书07:《孤独死》](/event/ends/end-7)。
      - 未满4回合落败:
      - • 进入[生死簿103:《护花使者》](/event/badends/#生死簿-No.103)。
      - 4回合以上落败:
      - • 检定🚩未知参数(见备注):
      - • 参数值＜1: 无特别剧情。
      - • 参数值≥1: 心相-30，若修养≤40则对话差分，续检定:
      - • 参数值=1: 性情+1、叶云裳好感+1。
      - • 参数值=2: 性情+2、叶云裳好感+2。
      - • 参数值=3: 性情+3、叶云裳好感+3。
      - • 对话差分。
      - • 接续「铁冠真身」阶段。
    数值:
      心相: -30
      性情: +6
      叶云裳好感: +3
    备注: 未知参数疑似为bug:

 1. 可能欲检定🚩「保护云裳次数」但设错。

 2. 🚩「保护云裳次数」可能也有无法增加的bug。
