事件: 翌日早晨
时序: 第3年10月中旬
系列: 共 2 环
  江湖速报:
    触发:
      - 接续[「客栈休憩」](/event/simple/3-10-2-客栈休憩)、
      - [「魏菊侍酒」](/event/simple/3-10-2-魏菊侍酒)，或
      - [「南溪夜访」](/event/simple/3-10-2-南溪夜访)事件
    经过:
      - 客栈少年宣传昨日武林大会传闻。
      - 少年对唐门态度，触发 🎲天命:
      - • 上限80，名声补正。
      - 【🎲＜33 不支持】:
      - • 检定「修养≥60或学问≥50」:
      - • 符合: 处世-1、嘴力+1。
      - • 不符: 若道德≤40，对话差分。
      - 【🎲＜66 有点支持】:
      - • 心相+10。
      - • 唐布衣好感≥30: 心相+20、嘴力+1。
      - • 修养检定:
      - • 修养≤40: 心相-20。若道德≤40，对话差分。
      - • 修养＞40: 若🚩和魏菊结缘，魏菊好感+1。
      - • 心相-10。
      - 【🎲≥66 唐门死忠拥护者】:
      - • 🚩认识刘颚: 对话差分。
      - • 心相+20。
      - 检定「🚩[各派支持度](/event/simple/3-10-2-公审唐门#公审总结)＜0，且🚩[武林公敌同意留下](/event/simple/3-10-2-武林公敌#独自出面)」:
      - • 符合: 若修养≥40或嘴力≥40，对话差分。
      - • 不符: 对话差分。
      - 性情≤40或学问≥40或[战术](/system/skill)等级≥1: 对话差分。
      - 刘颚、赵逵、车轩辕、王二壮之中，最高好感≥3: 对话差分。
      - 瑞笙好感≥20: 对话差分。
      - 瑞笙好感检定:
      - • 瑞笙好感≥20: 对话差分。
      - • 瑞笙好感＜20: 对话差分。
      - 瑞笙好感检定:
      - • 瑞笙好感≥20: 对话差分。若处世≥60，再差分。
      - • 瑞笙好感＜20: 对话差分。
      - 有🚩[下楼喝酒](/event/simple/3-10-2-客栈休憩#下楼喝酒): 对话差分。
      - 接[众人会合](#众人会合)阶段。
    数值:
      嘴力: +2
      心相: +20
      魏菊好感: +1
  众人会合:
    触发:
      - 接续[江湖速报](#江湖速报)阶段
    经过:
      - 复合检定(不符才检定下一项):
      - 1. 🚩小师妹[同行武林大会](/event/simple/3-08-2-大会请帖): 对话差分。
      - 2. 🚩叶云裳[同行武林大会](/event/simple/3-08-2-邀请叶云舟): 对话差分。
      - 3. 🚩虞小梅[同行武林大会](/event/simple/3-08-2-邀请虞小梅): 对话差分。
      - 4. 🚩郁竹[同行武林大会](/event/simple/3-08-2-邀请郁竹): 对话差分。
      - 5. 🚩和魏菊结缘:
      - • 检定🚩[魏菊喝醉](/event/simple/3-10-2-魏菊侍酒#劝酒):
      - • 未喝醉: 对话差分。
      - • 有喝醉: 触发选项:
      - • 👉「有」: 修养-1、处世+1、性情+1。若处世≤40，再嘴力+1、处世-1。
      - • 👉「没有」: 修养+1、处世-1，魏菊好感-1。
      - 6. 其他: 无特别剧情。
      - 🚩[唐门收留龙湘](/event/simple/3-10-2-锦香真相#龙湘求助):
      - • 对话差分。
      - • 🚩虞小梅同行武林大会: 虞小梅好感-2，心相-30、变心+7。若道德≤40，对话差分。
      - 🚩[叶云舟同行武林大会](/event/simple/3-10-2-点苍逆徒#师徒对决):
      - • 瑞笙好感检定:
      - • 瑞笙好感≥20: 心相+30、名声+2，叶云舟好感+2。
      - • 瑞笙好感＜20: 心相+20、叶云舟好感+2。若处世≤40，对话差分。
      - 复合检定:
      - 1. 🚩和魏菊结缘: 对话差分。
      - 2. 🚩小师妹同行武林大会: 对话差分。
      - 3. 🚩叶云裳同行武林大会: 对话差分。
      - 4. 🚩虞小梅同行武林大会: 对话差分。
      - 5. 🚩郁竹同行武林大会: 对话差分。
      - 6. 其他: 无特别剧情。
      - 性情≤40: 向心+2。
      - 接[「启程返家」](/event/simple/3-10-2-启程返家)事件。
    数值:
      性情: +1
      心相: +20
      向心: +2
      魏菊好感: -1
      虞小梅好感: -2
      叶云舟好感: +2