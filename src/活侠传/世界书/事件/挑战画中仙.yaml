事件: 挑战画中仙
时序: 第3年9月下旬
系列: 共 3 环
  挑战画中仙:
    触发:
      - 🚩[知道画中仙即仙儿](/event/simple/3-09-3-参观锦香宫)
      - [「锦香宫自由行动」](/event/simple/3-09-3-锦香宫事件集)时
      - 选择事件 ☯「挑战画中仙」
      - 一次性，不可重复触发
    经过:
      - 触发选项:
      - • 👉「撒谎」: 嘴力+1、处世-1。
      - • 👉「诚实」: 处世+1。
      - 唐默铃好感检定:
      - 唐默铃好感≥30:
      - • 🚩认识瑞笙: 对话差分。
      - • 虞小梅好感-1。
      - 唐默铃好感＜30:
      - • 🚩认识瑞笙: 对话差分。
      - • 心上人为虞小梅: 虞小梅好感+1。
      - 挑战人选，触发🎲天命:
      - (上限99，性情、处世补正)
      - 【🎲＜60 小梅】:
      - • 性情≤40: 对话差分。
      - • 接「奖赏」阶段。
      - 【🎲≥60 我来】:
      - • 性情+1、处世+1。
      - • 性情≤40: 对话差分。
      - • 接「赵活挑战」阶段。
    数值:
      嘴力: +1
      性情: +1
      虞小梅好感: +1
  赵活挑战:
    触发:
      - 接续「挑战画中仙」阶段
    经过:
      - 触发对决 🆚战画中仙:
      - • 若心上人非虞小梅: 新增我方状态「小梅的守望」。
      - • 若心上人为虞小梅: 新增我方状态「小梅的守望」。
      - 对决结果检定:
      - 落败:
      - • 进入[生死簿77:《看不顺眼被杀》](/event/badends/#生死簿-No.77)
      - 获胜:
      - • 武学+4、心相-20。
      - • 心上人检定:
      - • 心上人为虞小梅: 处世+1、修养+1、虞小梅好感+1。
      - • 心上人非虞小梅: 心相-20。
      - 接「奖赏」阶段。
    数值:
      心相: -40
      虞小梅好感: +1
    备注: 两个「小梅的守望」:

 同名但效果不同，

 心上人版本可加气力。
  奖赏:
    触发:
      - 接续「挑战画中仙」
      - 或「赵活挑战」阶段
    经过:
      - 道德-1。
      - 谁练玄烛心经，触发选项:
      - 👉「小梅练」:
      - • 处世+1、道德+1、虞小梅好感+2。
      - • 心上人检定:
      - • 心上人非虞小梅: 设置🚩「小梅全属性弱化」、🚩「小梅练玄烛心经」。
      - • 心上人为虞小梅: 道德检定:
      - • 道德≤40: 嘴力+1、修养-1、虞小梅好感+1。
      - • 道德＞40: 虞小梅好感+1。
      - 👉「我来练」:
      - • 解锁此项需心上人非虞小梅。
      - • 道德-1、处世+1、虞小梅+2。
      - • 获得秘笈[《玄烛心经》](/system/books/book_7011)。
      - 心相-20。
      - 设置🚩「小梅学会一趾驭风」。
      - 设置🚩「与画中仙决斗」。
      - 事件结束，回[锦香宫自由行动](/event/simple/3-09-3-锦香宫事件集)。
    数值:
      道德: -1
      嘴力: +1
      心相: -20
      虞小梅好感: +1