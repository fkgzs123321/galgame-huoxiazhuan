  - > 「别人辛苦努力练了几十年，我们嘴皮子掀几下就能让他死。这才是真正的高明，为此你们必须发自内心融会，以言行体会。」
  - [[岭南派]]弟子，岭南四丑之一。
  - 十岁不到就学会轻功，翻进别人院中偷东西、纵火。一日失风被人拿住，按刑统起码要笞五十，急中生智，想到偷窥可没有律法能罚，便谎称窥探人家洗澡才进的院子，说[[叶云裳]]的背上刺著藏宝图，转移焦点后逃走，害叶家兄妹从此被江湖人追捕。对此沾沾自喜，和[[陈倔]]争吵谁比较厉害。
  - 在武林大会污蔑[[唐门]]是魔教党羽，之后在客栈遇到[[南溪]]，被一剑杀死。