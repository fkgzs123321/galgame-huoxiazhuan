  - > 「牢牢记住一件事：我们岭南派弟子没有错，我们永远不会错，你不要向内找，要向外找！我们伤害别人都是为了正义！」
  - [[岭南派]]弟子，岭南四丑之一。
  - 曾在临安贬低抹黑[[魏菊|魏才女]]，害她人没入仕就先得罪同僚，被逼下嫁粗鄙武官，发誓一生不作诗。对此沾沾自喜，和[[林志恒]]争吵谁比较厉害。
  - 在武林大会污蔑[[唐门]]是魔教党羽，之后在客栈遇到[[南溪]]，被一剑杀死。