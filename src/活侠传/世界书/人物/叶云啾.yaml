  - > 「吾乃叶云舟之弟、叶云裳之兄，叶家排行第二，点苍第一怪贱手，叶云啾！」
  - 叶家三兄妹之二兄，一袭点苍绿衣，个头矮小。在[[唐默铃|小师妹]]婚宴上，[[南宫深]]、[[解无尘]]二位高手入场将决胜负之际，提剑乱入，扬言要作[[唐门]]女婿。
  - 实际上是[[叶云裳]]假扮，一眼被[[赵活]]认出。
  - 后日曾用同样打扮约[[叶云舟]]见面，他却一时认不出来，做亲哥的有够失败。