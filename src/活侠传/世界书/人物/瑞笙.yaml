  - 称号
  - 缟衣剑少
  - 关系
  - [[万里鹏程]] (前辈)
  - [[瑞杏]] (族妹)
  - [[夏灵犀]] (后宫)
  - [[南溪]] (后宫)
  - [[梁有诗]] (后宫)
  - [[孟仙谣]] (后宫)
