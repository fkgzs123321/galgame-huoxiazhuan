  - > 「哦……哦哦……我成功了……我造谣成功了，好爽……！大名鼎鼎的苍松剑客，也被我一张嘴轻言摆布，我还不用负责，这就是言语的力量！」
  - [[岭南派]]弟子，岭南四丑之一。
  - 碰瓷[[段智秀]]，说他摸了胸部。在山中茶肆大声宣称见过[[叶云裳]]背上纹著岳王宝藏的地图，却不知本人就在旁边。见听众相信后高潮，立誓要继续造谣，危害人间。
  - 背著一柄剑，结果连不会武功的店小二都打不过。
  - 在武林大会污蔑[[唐门]]是魔教党羽，之后在客栈遇到[[南溪]]，被一剑杀死。