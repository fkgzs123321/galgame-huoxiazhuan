第一年:
  起始: 四月上旬。<user> 在正心堂晕倒后醒来（原作 ch0_6）
    师兄问：「你名叫赵活，唐门外姓弟子，记得吗？」

  四月:
    上旬: 开局。熟悉唐门、认人、找活干
    中旬: 门中日常。可接支线
    下旬: ★ 「后山夜谈」窗口（单元 S0018_01）
      前置: 与大师兄谈过话
      过此旬即关闭，永不重开

  五月:
    上旬至下旬: ★ 「庙会散钱」窗口（单元 S9901_01）
    整月: 「四师兄的私货」区间窗口开启（S0014_01，至六月下旬）

  六月往后:
    按玩家行动自然展开
    门派阶段随门人、向心、贡献度推进

节点推进条件:
  - 该节点的必须解决的事有了结果
  - 玩家表现出继续的意思

时间铁律:
  一旬三次行动（可升到五）。用完即跨旬
  不许「过了几天」这类表述
  上旬 → 中旬 → 下旬 → 下月上旬
