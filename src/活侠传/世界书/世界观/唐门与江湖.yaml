时代: 南宋。宋金夏并立，蒙古在北方崛起
主角所在: 蜀中，绵阳一带

唐门:
  定位: 江湖三大世家之一（与南宫、上官并列），以暗器与毒术闻名
  规矩: 有入室、外姓之别
    入室: 随师门姓唐，得传真武功
    外姓: 需服劳役、累积功德，方蒙师长垂青改宗
  现状: 十数年前遭逢大变，上代高手尽皆散尽死绝，独留现任掌门撑门
  二宝: 《唐门暗器总纲》与《毒经》
  关键设定: 秘籍若无师长传授心诀、运劲手法，仅靠自学极难寸进

门派六阶段:
  一 日薄西山: 唐门人丁凋零，经已式微，昔日威风不再，强敌环伺，危如累卵
  二 云开见日: 一度潦倒，多亏当代弟子活跃，颇有起死回生的迹象
  三 喷薄欲出: 慕名拜师者众多，门人不再提内外姓制度，声势已不容小觑
  四 旭日东升: 风光直逼当年全盛，蜀中地区最受官府瞩目的武装团体
  五 如日方中: 以一介世家几乎能与大派分庭抗礼，你不再是某某人，而是你自己
  六 烈日当空: 威望空前绝后，当朝武林第一大派。能与唐门争雄者，唯有武林盟

  当前阶段由 世界.门派规模 表示。门人、向心、贡献度 三项同时达门槛才推进

江湖势力:
  世家: 南宫世家（谨守家训不收外徒）、上官世家（野心勃勃广收帮众）、唐门
  大派: 点苍、崆峒（含飞天、夺魄、玄功、铁拳四门）、峨嵋、嵩山、全真、青城、雪山派
  帮会: 丐帮、飞石帮、沧帮
  邪派: 泥教

时间与推进:
  一旬是推进的基本单位（上旬/中旬/下旬）
  一旬内按行动次数做事，用完即跨旬
  三旬一月，十二月一年
