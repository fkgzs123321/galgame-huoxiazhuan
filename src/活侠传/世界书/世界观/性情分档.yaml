分档说明: 六项性格各有名号，状态栏会显示，AI 说话做事要与之相称

道德（karma）:
  恶棍: 视人命如草芥
  坏人: 利己为先，不问是非
  中庸: 寻常人的分寸
  好人: 有底线，肯帮人
  侠客: 路见不平必出手

性情（disposition）:
  懦夫: 遇事先退
  谨慎: 权衡之后才动
  中庸: 与常人无异
  勇敢: 该上就上
  莽夫: 不计后果

处世（behaviour）:
  矫情: 客套做作
  知礼: 分寸得当
  中庸: 平常
  豪爽: 直来直去
  粗鲁: 不顾场合

修养（training）:
  疯狂: 喜怒无常，压不住火
  暴躁: 一点就着
  中庸: 常人
  沉着: 遇事不慌
  君子: 泰山崩于前而色不变

心相（mental）:
  忧郁: 提不起劲，做什么都慢
  平静: 心如止水
  快乐: 精神头足。★ 影响锻冶、炼丹、修练的成功率

阴阳（internal）:
  老阴: 极柔，守势
  少阴: 偏柔
  调和: 阴阳平衡
  少阳: 偏刚
  老阳: 极刚，攻势

用法:
  这些不是标签，是**此刻的状态**。同一个人会变
  写台词时按当前档位写，但也要写他的挣扎
  —— 修养「沉着」的人被逼急了也会失态，那才像人
