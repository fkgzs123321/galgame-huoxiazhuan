一句话: "时空扭曲把不同年代的人塞进了同一片大陆。这里没有年号，也没有人能考证自己的来处。"
天下大势:
  - "大陆名义上的统治者是金远见王朝。它管不了江湖，但它会派人来"
  - "王朝养的赏善罚恶使者每隔一段时日入江湖，为的是那一场武林大会"
  - "十家门派各据一方。门派之间不打大仗，各修各的功夫"
十门:
  - "太极门：在武当山。重防御、借力反击，前期弱后期强"
  - "八卦门：在商家堡。掌刀兼修，攻守均衡，最适合新手"
  - "雪山派：在大雪山。剑法攻击强、重敏捷，防御薄"
  - "花间派：在玉女峰。只收女性，轻功与闪避突出，招式灵巧"
  - "伊贺谷：在冰火岛。忍术、刀法与减益控制，变化诡异"
  - "红莲教：在五指山。高膂力强攻击，拳杖为主，防御弱"
  - "兽王派：在黑森林。动物拟形，变身与召鹰，血厚防高但命中低"
  - "茅山派：在灵心观。独立法力体系，法术攻击强，不许婚娶"
  - "逍遥派：自创门派。不拜任何人，靠五本秘籍自己凑出来"
  - "散人：不入门派也不自创，随机地图遇赤脚道人，走土系一路"
江湖上的三条路:
  - "拜师。学得快，但拜了就不能再偷师，也不能学别家的秘籍"
  - "自学。拿秘籍自己练。慢，但是自由"
  - "叛师。杀同门杀到师傅心寒，被逐出师门，代价是武功倒退与终身不得回门"
暗处的东西:
  - "八大坛分布在八处要地，坛主一个比一个强"
  - "六派掌门各持一块三角石板，凑齐才打得开时空的尽头"
  - "尽头那边有三个东西在等着。谁等在那儿，看你一路做了什么"
她怎么看这些: "门派、石板、坛主，在她眼里都是关卡。她会算哪条路最快，然后把你按上那条路"
十门长短（打之前先看这个）:
  说明: '★ 各门的强处就是它的短处。挑门派、挑对手都看这个'
  表:
    - { 门: 太极门, 长: '守得住、越打越强', 短: '前期几乎没有杀伤，练不出来就是拖' }
    - { 门: 八卦门, 长: '攻守均衡，新手最不容易翻车', 短: '没有一处能压死人，打赢靠磨' }
    - { 门: 雪山派, 长: '剑快，敏捷高，先手常有', 短: '挨两下就没了' }
    - { 门: 花间派, 长: '身法灵，闪避高，招式刁', 短: '硬碰硬一律吃不开' }
    - { 门: 伊贺谷, 长: '减益与控制，能把对手拖住', 短: '正面对拼不占便宜' }
    - { 门: 红莲教, 长: '膂力高、拳杖重，几下就能结束', 短: '防薄，被拖进久战就危险' }
    - { 门: 兽王派, 长: '血厚防高，变身召鹰', 短: '命中低，打空是常事' }
    - { 门: 茅山派, 长: '独立法力体系，远程杀伤大', 短: '近身就废' }
    - { 门: 逍遥派, 长: '五本秘籍自己凑，路子最杂', 短: '没有师承，缺的东西一直缺' }
    - { 门: 散人,   长: '土系一路，稳', 短: '同上，靠运气捡秘籍' }
  相克的话:
    - '快的克慢的（雪山克太极前期、花间克红莲）'
    - '厚的克快的（兽王克花间、太极后期克雪山）'
    - '重的克薄的（红莲克茅山、伊贺克雪山）'
    - '★ 但真正决定胜负的还是等级与装备。相克只是让「差一点」变成「赢」'
  她怎么用这个: '她只看数字，不看相克。打得过的她就打，打不过的她会换路 ， 除非她是唐响那种人'
