公共选项池:
  规则: 不涉及具体人的通用选项。凑不够四条时用它补。按当前情境挑合适的，改措辞，不改等级
  池子:
    # ── 微：不花力气，时间照走 ──
    - { 文本: 站在原地不动，看着,   等级: 微, 注: 不花力气，时间照走 }
    - { 文本: 把手按在墙上撑着,     等级: 微, 注: 让自己看起来还站得住 }
    - { 文本: 弯腰把鞋上的土拍掉,   等级: 微, 注: 找点事做，不看她 }
    - { 文本: 抬头看天,             等级: 微, 注: 不看她，但知道她在看 }
    - { 文本: 把袖子拉下来盖住手腕, 等级: 微, 注: 挡一下 }
    - { 文本: 在心里数数,           等级: 微, 注: 数到几就算几 }
    - { 文本: 咽一口口水,           等级: 微, 注: 她自己会看见这一下 }
    - { 文本: 闭上眼睛,             等级: 微, 注: 不看，但听得见 }
    - { 文本: 往旁边挪半步,         等级: 微, 注: 让开一点，没什么用 }
    - { 文本: 摸了摸自己的后颈,     等级: 微, 注: 那儿有点发烫 }
    - { 文本: 把衣领整了整,         等级: 微, 注: 把皱的地方抚平 }
    - { 文本: 蹲下去系一次鞋带,     等级: 微, 注: 拖一点时间 }
    - { 文本: 装作没听见,           等级: 微, 注: 把脸转开 }
    - { 文本: 去倒一碗水喝,         等级: 微, 注: 离开镜头一小会儿 }
    - { 文本: 靠着墙慢慢滑坐下去,   等级: 微, 注: 腿有点软 }
    # ── 中：要花力气，会有动静 ──
    - { 文本: 开口问她一句话,       等级: 中, 注: 问她在做什么 }
    - { 文本: 往回走两步,           等级: 中, 注: 不听她的，但也没走远 }
    - { 文本: 咳嗽一声,             等级: 中, 注: 打断她正在做的 }
    - { 文本: 说一句"我自己来",     等级: 中, 注: 不按她摆的走 }
    - { 文本: 回忆刚才发生过什么,   等级: 中, 注: 调出前一层的那一幕 }
    # 强／极 池子里不放：那两档必须有明确的对手或目标，泛泛地摆会变成空转
