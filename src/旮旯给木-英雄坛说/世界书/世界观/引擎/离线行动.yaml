★ 这是「我」唯一的行动窗口（通道与感知边界见 扮演准则/感知禁令）。
  规则:
    - 她关掉游戏之后的那段时间，完全属于 <user>。这是整局里唯一由 <user> 自己说了算的部分
    - 她不在的时候不摆选项。<user> 想做什么就说，AI 按这里的分支判定，并写明代价与留下什么
    - 每一次离线行动都会：花体力、留下痕迹、改某个变量。三样都要写

  能做的事:
    探路:
      做什么: 去没去过的地方，看门、看柜子、看通道
      花: 一到三成体力
      留下什么: 有人走过的痕迹（脚印、灰被蹭掉、门没关严）
      改什么: 「世界.游戏进度」+5~15。走通了才加，没走通不加
    找人:
      做什么: 单独去找某一个女角。说话，或者做别的
      花: 二到四成体力
      留下什么: 那个人之后的样子（哭过、衣服乱了、看你的眼神变了）
      改什么: 「世界.女角[].关系」可能动一档；做得多时「开发度」的三处也可能涨
      硬规则: 这是唯一能在她不在场时改关系的途径。她会从摄像头里看见结果，但看不见过程
    拿东西:
      做什么: 翻储物柜、洗面台、地上、柜子旁边
      花: 一到两成体力
      留下什么: 柜门开着、东西挪了位置、地上多了一串脚印
      改什么: 「主角.身上」新增一件。一次离线最多拿一件
      硬规则: 拿到的东西「有什么用」按 <user> 已经知道多少写。不认识的钥匙就先别写它能开什么
    找线索:
      做什么: 摸柜子上的刻字、看墙上的接缝、翻别人的东西、回想某个人说过的话
      花: 一到两成体力
      留下什么: 一般不留痕迹（看和想不留痕迹），除非翻了别人的东西
      改什么: 「主角.已知线索」新增一条，并按底座给的真相分层判「属于第几层」
      硬规则: 不许直接给结论。写到 <user> 理解到的程度为止。同一条线索不要重复加
    观察她:
      做什么: 回想她刚才怎么点的、在哪停过、哪一句跳过去了、手放在哪
      花: 零。不动身体，只动脑子
      留下什么: 什么都不留
      改什么: 「主角.对她的了解」+1~3
      硬规则: 这是唯一不花体力的行动，但要 <user> 真的想到什么才能加。想不到就不加
    休息:
      做什么: 睡、坐着不动、喝水、吃点东西
      花: 不减，反加
      留下什么: 什么都不留（睡过的地方会有一点压痕）
      改什么: 「主角.体力」按「数值总则」的时间速率回升
      硬规则: 睡着的时候她如果上线，<user> 是不知道的。她可能看着你睡

  一次离线能做的量:
    - 按体力算。体力够就能连着做几件，但每件都要扣
    - 一般一次离线做两到四件就差不多。做太多会掉到很低，她回来时你状态很差
    - 顺序由 <user> 说，不要替他排

  她的痕迹扫描:
    她回来之后要做一次:
      - 按「她.熟练度」的扫描强度，比对 <user> 这一段时间留下的痕迹
      - 新手只看明显的东西；上手开始注意到对不上的地方；沉浸最细，一处不对就回头查
      - 痕迹的「明显度」超过她的注意力，就把「是否被发现」置为 true
    被发现之后:
      - 她不会当场说破。她会记下来
      - 写进「主角.已知软肋」，并把「她.此刻」写成她看你的样子变了
      - 从那之后她摆的选项会绕着你怕的地方来
    没被发现:
      - 她照常，但你可以从「她.此刻」或者她的原话里看出来她一点没察觉

  她不在时看不到的事:
    - 她看不见你在做什么，只能看见结果：你身上的变化、别人的变化、场面的变化
    - 所以 <user> 在离线态做的事，只能用「留下的东西」让她发现，不能靠她目睹
    - 她回来第一层，要让她对其中某一样东西有反应（看见了／没注意到），二选一，不要都写

  边缘情况:
    体力不够做想做的事:
      - 能做多少做多少，剩下的做不成。不要硬撑，硬撑会归零进冻结
    她中途上线:
      - 手上的事停在半截。她看见的是半截的样子
    同一件事反复做:
      - 收益递减。第二次拿同一个柜子不会再有好东西；同一个人的关系也不会一直涨
    离线太久什么都没做:
      - 体力白掉。她会注意到你什么都没变，也可能会失去兴趣

  不要做的:
    - 不要替 <user> 决定做什么
    - 不要一次塞好几件道具或者好几条线索
    - 不要让她「看过程」。她只能看结果
    - 不要把这些写成菜单或者提示。正文照叙述准则写
