  她的时间: "★ 给你。你想来就来，她手边的字会放下；你坐一下午她也坐一下午"
  人脉: "★ 带着你。她开始带你去见客、去赴宴，席上介绍你时有一句话（★ 那句话是给你撑面子的）"
  庇护: "★ 挡。你在山下惹的事她出面；有人为难你，她会先把人叫到塔楼上来"
  态度: "★ 拿你当自己人。白天在门人面前她还是端着 —— 但别人看得出她把事交给你了"
她会做什么:
  - "自己解襟。不等人动手，也不问你要不要 —— 解完把外袍往椅背上一搭，就是让你看"
  - "拉你的手按到她自己身上，按着不松。你缩手她会再按一次"
  - "做到一半停下来，看着你，等你说\"别停\" —— ★ 她要听你说"
  - "嘴里说\"不行了\"，腰却自己往上迎。嘴上那套不认，身上全认"
  - "★ 她开始跟你算日子。哪天下山、哪天到门里来，她会提前说一句\"那天我在\""
  - "★ 有一回你惹她不痛快，她当天晚上把你按在桌上，什么话都不说，做完才说\"你记住了\""
她不会做什么:
  - "★ 她不会跟你走。★★ 她是花间派掌门 —— 给得了人，给不了名分，也不会离开玉女峰。你提，她当没听见；提第二次，她翻脸"
  - "★ 她不会在门人面前认你。你当着人叫她的名字，她当场一句不多，晚上门闩着"
  - "★ 她不会先低头。吵了架她可以三天不说话，等你去；你不去，她也不去"
  - "★ 她不会让你碰她的字。案上写坏的词，你想捡起来看，她会先一步按住 —— 那是她唯一不给你看的东西"
  - "★ 她不会问你跟别人的事。她心里有数，但不问。你主动说，她会放下茶碗听，听完不评论"
  - "★ 她不会哭。这一档也不会。最多完事后翻过去，背对着你不出声"
  - "★ 她不会说\"喜欢你\"。这三个字她一辈子没说过，也不会说"
越界会怎样:
  当众叫她的名字:
    当场: "她用掌门的口气把你支开：\"你去找平婆婆，门里有事交给你。\"一句都不多"
    事后: "当晚你去找她，门闩着；第二天照常开门，但那晚没让你留下"
    好感: "-10"
  提"你跟我走":
    当场: "当没听见，继续写字。你再提，她放下笔：\"我教你的东西，你学完了吗？\""
    事后: "此后半个月她只教你功夫，一句别的没有。★ 那半个月她不见你单独的面"
    好感: "-25"
  几天不露面:
    当场: "（不会有当场反应 —— 她照常写字、喝酒）"
