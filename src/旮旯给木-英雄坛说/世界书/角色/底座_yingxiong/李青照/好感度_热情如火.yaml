_怎么触发: "只当 关系.李青照.好感度 落在「热情如火」这一档时，这份才进上下文（门控写在 tavern-cards-state.json 的 李青照_好感度_热情如火 里）"
区间: "= 100（且她的任务全部完成）"
她对你的态度: "全开。到这一档，她那一面才是冲着你的。"
她给你什么:
  武功: "★ 独门绝招 ——「柳浪闻莺」。这一步再没有保留。★ 互学武功的正体就在这里"
  任务: "★ 不再给你派人做了 —— 她开始跟你商量事：门里怎么走、哪个人能用、要不要接某家的帖子"
