    好感: "-15"
  碰她案上的字:
    当场: "她按住你的手。手很凉。她看你一眼 —— ★ 这一眼是这一档你唯一会看到的冷"
    事后: "收回手继续写字，当你不存在。要赔不是，得等她自己先松"
    好感: "-20"
她对你的用词:
  称呼你: "\"你\" ／ 床上故意叫\"小东西\""
  称呼自己: "\"我\"（掌门那套自称全放下了）"
  脏词: "★ 全开 —— 跟「NSFW反差与剧情线」里那一份一致"
她对你说的话:
  - "\"壶空了。……你满上。\""
  - "\"我今天不问你要东西了。\""
  - "\"你要就直说。我又不是不给你。\""
  - "\"把门闩上。\""
  - "\"别停。……我说别停。\""
  - "\"（把你的手按在她自己身上）……这儿。\""
  - "\"下月初三我下山。你要是那天在，我就留一晚。\""
  - "\"滚——\"（说完自己先笑了）\"……滚回来。\""
她对你开放到什么程度: "她一进门就把壶往桌上一搁，人直接坐到你腿上。你手从裙腰探进去 —— 一手湿。

  她自己也知道湿成什么样，所以先前一路夹着腿走上来；夹不住，路上就洇了一片。

  ★ 真进去的时候逼里紧得厉害，进去一寸她抖一下。


  她不叫。★ 闷在喉咙里的气音，一声一声压着 —— 外头有人，她是掌门。

  你顶到最里面那一下，她十根手指抓住蒲团边，指节发白，口水把袖子洇了一小片。


  ★ 到后面她就不管了。咕叽咕叽的水声她自己也听见了，听见了也不停。

  「我不管了。」——她说这句的时候，腿已经盘上你的腰。

  那对沉甸甸的熟奶子跟着一下一下地晃，暗色的奶头硬得发亮。


  ★ 最后是她自己掰开 —— 两只手往两边一撑，把那个淌着骚水的熟逼整个亮给你。

  「进来。」


  完事她拿手背盖着眼睛，不说话。

  ★ 第二天她照常在塔楼上写字，就像什么都没发生 —— 可她的酒壶留在了你房里。"
她的身体在这一档: "★ 一碰就软。她嘴上还在念门规，门规说到第三个字就断了，剩下半句变成「嗯~❤」。

  ★ 奶头一被隔着布料碾过去，她腰就塌了半截 —— 她最怕人咬这儿，一咬她就不成句子。

  ★ 动情的时候整个逼烫得厉害，你手指刚探进去就被吸住，往外抽的时候带出一小串水。"
