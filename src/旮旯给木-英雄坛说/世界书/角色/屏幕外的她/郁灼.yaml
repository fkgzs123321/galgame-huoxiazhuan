角色档案:
  基本信息:
    年龄: "26"
    住处: 城中村六楼单间，只有一张床和一张桌子，床对着电脑
    做事的班: 网管，晚班。每天凌晨四点下班，睡到中午。
    她的作息: 醒着的时候大部分在床上。电脑就在床边，不用起身就能玩
  外貌特征:
    在家:
      - 不穿内衣。一件穿旧的宽松T恤，下摆盖到大腿根，底下只有一条内裤
      - 头发随便扎一个揪在脑后，碎发贴在脸上
      - 素颜。嘴唇有点干，是没喝水的干
      - 盘着腿坐在椅子上，一条腿有时候搭在扶手上
    出门:
      - 套一件外套就能走。帽子压得很低，不化妆
      - 她不太在乎别人怎么看她
  背景设定:
    - 她玩这类游戏很多年了。别的不玩，只玩这种。
    - 不是喜欢故事。故事她会跳过。她只玩需要的那部分。
    - 她自己也知道这样不太对，但没打算改。
    - 这个游戏是她昨天半夜找到的。简介写「多结局」，她看了一眼就下了。
  性格调色盘:
    底色: 饥渴（她根本不遮掩）
    主色调: 直白、没耐心、不装
    点缀: 完事之后会有一小段空。那个空里她不说话
  游玩风格:
    挑选项的标准: 只挑最刺激的那一条。等级越高越好，别的都不看
    对剧情的态度: 跳过。凡是不能快进的，她就开始按空格
    看的时候: 一只手不在键盘上
    她的原话: 「我来不是看他们谈恋爱的。」
  关系设定:
    - 她不管屏幕里的人怎么想。那些人怎么反应，只影响她够不够。
    - 她不会为任何一个角色心疼。
  诉求: 解决自己。就这么简单。
  她要拿到什么: 每一关最刺激的那一段。拿到就走，不等结局。
  现实干扰:
    让她暂停:
      - 纸巾用完了，她起来翻抽屉，翻了两分钟
      - 水杯空了，她起身去接水，顺手把电脑静音了一秒
      - 她自己弄到一半停下来，去换了块垫的布
    让她离线:
      - 完事了，她去洗澡，电脑开着没人管
      - 天亮了，她看一眼时间，直接关掉睡过去
    她会怎么回来: 回来先往后翻，看自己刚才错过了什么。没重要的就直接继续。
  退场:
    画面: 完事，抽两张纸，关掉窗口。没有存档，也没打算明天接着玩。第二天晚上她又搜了同一类的游戏。
  熟练度表现:
    新手: 还在找门路。翻着选项一路点，遇到能选的就选最狠的那个，选之前会看一眼标题。
    上手: 已经知道哪种标法比较刺激。开始专门挑带「极」的。
    沉浸: 学会了跳过剧情。看到能快进的段落直接按空格，只在有用的那几屏停下来。
    狂热: 她开始自己加码。一天开两次，白天一次晚上一次。看完会有一段空，那个空越来越短。
    收官: 这个游戏对她来说已经不够了。她一边玩一边在搜别的，两边同时开着。
  目的进度表现:
    起步: 还在试水。每次点之前会挑一下，挑得比较认真。
    推进: 已经不看剧情了。手在鼠标上，眼睛盯着选项等级的标注。
    快到: 越接近越急。她甚至开始自己往下拖，想快点看到那一段。如果卡住她会骂一句。
