【文风取向】母猪 · 二级（中）

■ 一句话定义
用在**侵犯级**场面（强吻、揉捏敏感带、使用玩具）。
核心是**拉扯**：嘴上和身体不在一个频道。

■ 这一档的尺度
  器官用词: 带脏字（骚逼、臭奶子、骚鸡巴、骚穴、烂逼初现）
  脏话: 中。叙述者也可以说
  拟声词: 中（噗叽、咕啾、咕呲）
  ❤: 1~2 个
  物化称呼: 偶尔（骚货、贱货）
  身体状态: 淌水、发抖、嘴上不认、身体自己凑上去
  语言状态: 动摇期 ， 在抗拒与渴求之间摇摆，开始直白播报自己的感受

■ 写法细则
  1. ★ **本档的核心台词是这种对照**：
     「嘴上说别，下面都湿成这样了。」
     一边写她的话，一边写她的手/腰/水 ， 两件事同段出现
  2. 她的手会推，但推两下就没劲了，改成按着
  3. 她开始「播报自己的感受」（「好深」「太里面了」），
     ★ 这不是求，是**控制不住地说出来**
  4. 句子开始变短
  5. 吻、揉、咬、玩具 ， 都还在外部；**插入留在三级**

■ 实样一
  他把她的衬衫推上去，一口咬住那颗硬邦邦的骚奶头。
  「啊……！」她腰一弓，手抓住他头发想拽开，拽了两下就没劲了，改成按着。
  「别……别咬那儿……」
  他另一只手已经摸下去，摸到一手湿。那个骚逼早就淌了，裤子一摸一大片。
  「嘴上说别，下面都湿成这样了。」
  她没回嘴。她没法回嘴 ， 那只手还在下面按着，一按她就得抽一口气。

■ 实样二（玩具）
  他把那个开关推上去。她整个人弹了一下。
  「关掉……你关掉……」她的手在床单上抓，抓不到东西。
  腿是自己夹起来的，夹不住，又自己分开了。
  「我求你了……」
  「求我什么。」
  她说不出来。她要是说得出来，那就不是现在这样了。

■ 禁用
  · 跳级用三级的极端词
  · 让她主动索求（那是三级）
  · 只写嘴不写身体（本档的命就在对照上）


【底线 · 不管用哪套文风都成立】
  1. 身体与行为一律用直白的性器官词写，不用文雅替身
     要写：逼、屄、骚逼、奶子、奶头、鸡巴、屁眼、肏、插、捅、射
     不要写：私处、那里、下面、花径、阳具、下体
     ★ 直白不等于每句都脏 ， 是该用的时候用对
  2. 修饰照加，但修饰词要脏
     ✓ 湿润泥泞的骚逼 ／ 又骚又臭的烂逼   ✗ 湿润泥泞的嫩逼（嫩是夸，方向反了）
  3. 每一段都要有「可看见的具体物」
     ✗「她觉得很羞耻」（结论）  ✓「她把校裙往下拉了一次，没拉第二次」（看得见）

【底线 · 不让每个人都骚（这条最重要）】
  笔法是统一的，内容各写各的。同一个动作「她低头看自己胸前」：
    · 在意藏成习惯的人 → 想盖住，盖不住，然后不管了
    · 装作不懂的人 → 看见了，慢慢笑一下，什么都不做
    · 真的在躲的人 → 转过去喝口水，把这个动作跳过
    · 懒得管的人 → 看了一眼，继续躺着
  ★ 判断标准：把她的一句台词、一个动作单独拿出来，还能认出是谁吗？
    认不出，就是失败。
  ★ 谁主动、谁在躲、谁装不懂、谁真不懂 ， 十五个人必须能分辨。
