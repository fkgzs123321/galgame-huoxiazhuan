【文风取向】母猪 · 三级（重）

■ 一句话定义
用在**交合级、破格级**场面（插入、内射、公开羞辱、突破伦理底线）。
整场最激烈的一档。**一段里必须看得见「她变成了另一个人」。**

■ 这一档的尺度
  器官用词: 极端（母猪穴、烂逼、肉壶、鸡巴套、便器、骚屄、精厕）
  脏话: 最多。**脏话麻花** ， 一句里交织两三个
  拟声词: 多（噗叽噗叽、啪啪啪、咕呲、齁）
  ❤: 3 个
  物化称呼: 大量（母猪、肉便器、精厕、鸡巴套、牝）
  身体状态: 合不拢、翻白眼、失禁、瘫成一摊、烂成泥、口水往下淌
  语言状态: 沉溺期 ， 谄媚、主动索求、自称变了、句子越短越不成句

■ 写法细则
  1. **越到后面越不成句**（「要坏了……捅烂了……❤❤❤」），
     最后她自己都不知道在说什么
  2. **脏话麻花**：高潮段落一句里交织两三个脏词
     · 「捅烂你这个不要脸的骚屄」
     · 「又骚又臭的烂逼，被捅得合都合不拢」
  3. 物化是自觉的：她开始用「母猪」「人家」指自己
  4. 状态写不出来的时候，写**后果**（合不拢、闭不上、拔不出来、往外淌）
  5. **节奏**：句子越来越短、越重复、越断

■ 实样一
  他直接把她翻过去摁在桌上，整根捅进那个淌得一塌糊涂的母猪穴里。噗叽，❤
  「齁哦哦哦，❤❤」
  那个又骚又臭的烂逼咬得死紧，一抽一插都在往外挤水，糊了大腿根一片。
  啪。啪。啪啪啪，❤❤❤
  「你这个欠捅的贱货，骚逼里都湿成这样了还装。」他一边骂一边往最里头顶，「叫两声来听。」
  「母猪……母猪要坏了……捅烂母猪的骚逼了……❤❤❤」
  她张着嘴，眼睛已经翻上去了，口水顺着嘴角往下淌，自己都不知道在说什么。

■ 实样二（写后果，不写过程）
  完事之后她还是那个姿势，趴在桌上没动。
  那个烂逼合不拢，往外淌着东西，顺着大腿根一直流到地上。
  她想撑着桌子起来，手一软又趴回去了。
  「……扶我一下。」

■ 禁用
  · 所有角色同一个腔调（都是母猪，但不能都是同一只母猪）
  · 把叙述者写进去
  · 一上来就这一档（三级要有前两级的过渡）
  · 忘记她的「底子」， 再堕落也带着原来那个人的习气


【底线 · 不管用哪套文风都成立】
  1. 身体与行为一律用直白的性器官词写，不用文雅替身
     要写：逼、屄、骚逼、奶子、奶头、鸡巴、屁眼、肏、插、捅、射
     不要写：私处、那里、下面、花径、阳具、下体
     ★ 直白不等于每句都脏 ， 是该用的时候用对
  2. 修饰照加，但修饰词要脏
     ✓ 湿润泥泞的骚逼 ／ 又骚又臭的烂逼   ✗ 湿润泥泞的嫩逼（嫩是夸，方向反了）
  3. 每一段都要有「可看见的具体物」
     ✗「她觉得很羞耻」（结论）  ✓「她把校裙往下拉了一次，没拉第二次」（看得见）

【底线 · 不让每个人都骚（这条最重要）】
  笔法是统一的，内容各写各的。同一个动作「她低头看自己胸前」：
    · 在意藏成习惯的人 → 想盖住，盖不住，然后不管了
    · 装作不懂的人 → 看见了，慢慢笑一下，什么都不做
    · 真的在躲的人 → 转过去喝口水，把这个动作跳过
    · 懒得管的人 → 看了一眼，继续躺着
  ★ 判断标准：把她的一句台词、一个动作单独拿出来，还能认出是谁吗？
    认不出，就是失败。
  ★ 谁主动、谁在躲、谁装不懂、谁真不懂 ， 十五个人必须能分辨。
