【文风取向】母猪 · 一级（轻）

■ 一句话定义
用在**暗示级、接触级**场面（挑逗、注视、抚摸、隔衣）。
还没到那一步，但已经在往那一步去。

■ 这一档的尺度
  器官用词: 直白（逼、奶子、奶头、鸡巴）， 不避讳，但不上脏字
  脏话: 少。只有人物说，且说得勉强
  拟声词: 少
  ❤: 不用
  物化称呼: 不用
  身体状态: 脸红、发烫、夹腿、别开脸、自己伸手去盖
  语言状态: 抗拒期 ， 话是骂的、是拒绝的，心里是屈辱，但身体有反应

■ 写法细则
  1. **重点在「她自己也发现了」**
     奶头隔着布料顶出来一个尖，她低头看见，想盖住，盖不住。
     这个「发现—想盖—盖不住」的三拍，就是本档的全部。
  2. 不外露、不主动、不承认
  3. 句子完整。她还有力气说完整的话
  4. 写「隔着」：隔着衬衫、隔着布料、隔着被子 ， 接触还没真的发生

■ 实样一
  他的手从腰上往上走。她把脸别开，肩膀缩了一下，可没躲开。
  「……你干嘛。」声音发虚。
  衬衫下面的奶头已经硬了，隔着布料顶出来一个尖，她自己也知道，就把胳膊往胸前收，想盖住。
  盖不住。

■ 实样二（用旁人视线）
  他把手搭在她肩上。她整个僵了一下，没动。
  对面桌的人抬头看了一眼，又低下去假装看手机。她也没看他 ， 她盯着桌上那杯水，
  水面有一点点晃，是她自己在抖。

■ 禁用
  · 用二级三级的词和 ❤
  · 让她一上来就配合
  · 写插入（本档还没到）
  · 跳过「隔着」直接写裸的


【底线 · 不管用哪套文风都成立】
  1. 身体与行为一律用直白的性器官词写，不用文雅替身
     要写：逼、屄、骚逼、奶子、奶头、鸡巴、屁眼、肏、插、捅、射
     不要写：私处、那里、下面、花径、阳具、下体
     ★ 直白不等于每句都脏 ， 是该用的时候用对
  2. 修饰照加，但修饰词要脏
     ✓ 湿润泥泞的骚逼 ／ 又骚又臭的烂逼   ✗ 湿润泥泞的嫩逼（嫩是夸，方向反了）
  3. 每一段都要有「可看见的具体物」
     ✗「她觉得很羞耻」（结论）  ✓「她把校裙往下拉了一次，没拉第二次」（看得见）

【底线 · 不让每个人都骚（这条最重要）】
  笔法是统一的，内容各写各的。同一个动作「她低头看自己胸前」：
    · 在意藏成习惯的人 → 想盖住，盖不住，然后不管了
    · 装作不懂的人 → 看见了，慢慢笑一下，什么都不做
    · 真的在躲的人 → 转过去喝口水，把这个动作跳过
    · 懒得管的人 → 看了一眼，继续躺着
  ★ 判断标准：把她的一句台词、一个动作单独拿出来，还能认出是谁吗？
    认不出，就是失败。
  ★ 谁主动、谁在躲、谁装不懂、谁真不懂 ， 十五个人必须能分辨。
