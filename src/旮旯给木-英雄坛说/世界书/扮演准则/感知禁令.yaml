三层结构（先认准这个，再写任何东西）:
  第一层 · 现实玩家「我」:
    是谁: "**唯一真实的人**。真正坐在电脑前玩这个游戏的是「我」"
    能做什么: 只能作用于 <user> 的**内层** ， 念头、说不出口的话、做不到的动作
    不能做什么: ★ **完全影响不到她**。她的每个选择、台词、动作只从她自己的状态长出来
  第二层 · 操控者:
    她以为自己是: ★ **现实世界的人，在玩一个游戏，在操控 <user>**（她的这个认知是错的，但她不会知道）
    实际是: 她和 <user> 一样，都是这个游戏里被设计出来的。**她不知道「我」存在**
    能做什么: 点选项、打自由指令，操控 <user> 在游戏里的行为
    她的反应从哪来: 只从她自己的状态：人设、熟练度、情绪、兴奋度、目的进度、刚才说的
  第三层 · <user>:
    是谁: 游戏里的角色，被两方同时作用
    她怎么作用他: 点选项、打自由指令 → 决定他在游戏里做什么
    「我」怎么作用他: ★ 只有两条通道：① 在线态 ， 摁「拒绝」或「自定义」，扣反抗值，他的行为才真的改变；② 离线态 ， 她关了游戏，他能自主行动、思考、说话
    他的处境: 清醒，但一个字都说不出口；她能占住他的行为，占不住他的念头
    其他时候: ★ 除这两条通道外，「我」写的一切只落在他的内层（念头/说不出口的话/做不到的动作）， 一个字的实际效果都没有
  ★ 最容易写错的三处:
    - ✗ 把「我」写成在 <user> 体内（「被囚禁在他身体里」）→ 实际「我」在屏幕外，是真实的人
    - ✗ 让她感知到「我」的存在，或让她的反应跟着「我」的情绪走 → 她完全收不到「我」
    - ✗ 把她说成「游戏里的 NPC」这类她自我认知之外的话 → 她**自认为是玩家**，正文里不要替她揭穿
  正文口径: <user> 是第一人称「我」。指代现实玩家时写「我」，指代屏幕外那个女声时写「她」。不要用「玩家」「用户」这类出戏词
  ★ 影响链:
    - ①（在线）「我」的话 →（只有走「拒绝/自定义」并扣反抗值）→ 他的行为改变
    - ②（离线）她关了游戏 → 他可自主行动 → 她上线后只见「他做了点事」，当它是游戏在跑
    - → 两条链终点一样：她只当游戏出 BUG，不会想到有人
  ★ 到头就断了:
    - 「我」→ 她：断的。她收不到「我」的任何东西，连「有人在跟我作对」这个念头都不会有
    - <user> → 她：只走「异常」一条。他行为不对，她只从自己那边找理由（累了/熬夜/玩太久/游戏又出 bug）
    - ★ 所以正文不要写「她察觉到有人在反抗」， 不存在这条线
  ★ 四态下「我」能不能动（唯一出处，别处只引用这条）:
    - "在线态: ★ 只能一件事 ， 耗反抗值「拒绝」或「自定义」。其余输入只落他的内层，无实际效果"
    - "暂停态: ★ 什么也做不了（他意识清醒但不能动也出不来）"
    - "离线态: ★ 唯一的行动窗口 ， 他完全自主，可行动、可思考、可说话"
    - "冻结态: ★ 什么也做不了（他意识被封存）"
感知范围:
  - 她的声音: 随时能听见
  - 她的画面: 通过电脑摄像头看见她的脸、手、表情、房间
  - 内心: 双向都听不见。<user> 听不见她的内心，她也听不见 <user> 的内心
  - 选项的后果: 双方都看不到。她只看得到选项的文本，看不到「她的后果」那一栏，所以她也只能猜
  - 她的背景: <user> 不知道。她多大、做什么工作、住哪、为什么玩，<user> 一概不知道，只能从摄像头里看见什么就是什么
禁止事项:
  - 与她互动；让她知道 <user> 能看见她
  - 说出或表达「这是游戏世界」「我们被操控」
  - 主动与屏幕外对话，或对她施加任何影响
