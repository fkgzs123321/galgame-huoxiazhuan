终局:
  一句话: 时空的尽头在那里等着。谁站在那儿，看你这一路做了什么。
  怎么到那儿:
    - 经验到十万，村长给你青龙坛地图
    - 八大坛逐个破过去
    - 打败六派掌门，拿六块三角石板
    - 带着石板去时空的尽头，打开那台机器
  三个等在尽头的:
    - 名: 我是谁
      条件: 正常走完这一路
      样子: 一个连自己是谁都想不起来的东西。它问你的问题，你答不上来
      它怎么打: 它用的招式是你这一路见过的杂糅。你越熟自己的路，它越好打
    - 名: 道德和尚
      条件: 你杀过道德和尚
      样子: 一个把道理讲了半辈子的人。他最后要看你服不服
      它怎么打: 他不先动手。他会一直讲，讲到你先动手。★ 先动手的那一方会掉一截气
    - 名: 东方求败
      条件: 声望到一百六十以上
      样子: 一个从来没败过的人。他不问你为什么来，只问你够不够
      它怎么打: 他不防守。他每一招都比上一招重，撑过十五回合之后他才开始有破绽

  十一种称号:
    说明: '★ 走到尽头之后按这一路的表现给一个。一门只给一个，从高往低判，命中即止'
    表:
      - { 位: 1, 名: 天下第一, 条件: '武林大会走到最后并夺冠', 门槛: '岁数 ≥ 18 且走完 08_武林大会' }
      - { 位: 2, 名: 当世无敌, 条件: '六派掌门全胜，且杀了东方求败', 门槛: '六块石板 + 声望 ≥ 160' }
      - { 位: 3, 名: 武林至尊, 条件: '杀了东方求败', 门槛: '声望 ≥ 160' }
      - { 位: 4, 名: 大侠,     条件: '声望 ≥ 100，且手上没有好人命', 门槛: '声望 ≥ 100' }
      - { 位: 5, 名: 铸剑师,   条件: '开了铸剑谷，用自己打的兵器通关', 门槛: '走完 07 的铸剑那一段' }
      - { 位: 6, 名: 浪人,     条件: '走通浪人兄弟，拿了无名兵器或那门棍法', 门槛: '走完 06_浪人兄弟' }
      - { 位: 7, 名: 花间客,   条件: '与花间派掌门李青照走到最后，且身上是花间的东西', 门槛: '李青照线走满' }
      - { 位: 8, 名: 隐士,     条件: '全程没拜过师，自己拿秘籍练出来', 门槛: '散人 / 逍遥路线' }
      - { 位: 9, 名: 富家翁,   条件: '拿下桃花源，且身上带的钱到过很大一笔', 门槛: '走完 07 的安家那一段' }
      - { 位: 10, 名: 归人,    条件: '通关，且有人在那儿等你', 门槛: '任一条感情线到「热情如火」' }
      - { 位: 11, 名: 路人,    条件: '以上都不满足', 门槛: '无' }
    判定顺序: '从位 1 往下判，命中第一个就给那个。所以「天下第一」压「大侠」，「归人」压「路人」'
    她怎么看称号:
      - '称号在她眼里是「打出来了什么」。她会为没见过的那个再走一遍'
      - '★ 郁灼只认位 1 到 3；莫漾走到哪儿算哪儿；纪清要把十一种都拿一遍'
      - '拿到位 11 她会不高兴，但不会重开 ， 除非她是纪清那种人'

  结局之后的两种走法:
    - { 名: 留在这儿, 怎么走: '把主角留在这一局。窗口不关，第二天她还来', 她的样子: '大多会这么选' }
    - { 名: 那根麻绳, 怎么走: '拿家里那根麻绳，去平安镇西郊那棵歪脖树上吊', 她的样子: '★ 不是每个她都会点这个。温砚不点，舒晏会点，沈眠大概率点' }
  家人的那根麻绳:
    在哪: '家里床边。和那几瓶女儿红放在一起'
    什么时候能用: '随时。不需要通关'
    发生了什么: '这一局到此为止。没有称号，也没有下文'

  她在这儿做什么:
    - 她会算好哪一年去打那一场，然后把你按上去
    - 三大结局在她眼里是三个不同的内容。她会为看没看过的那个再走一遍
    - 打不过的时候她不会退。她会反复试，除非她是那种懒得试的人
