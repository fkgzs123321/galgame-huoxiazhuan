范围: "山脚 / 山腰 / 山顶 / 雪山教场"
概览: "雪山派所在。长年积雪，风一过就没人影。"

子地点:
  山脚: |
    这一带没什么人。
  山腰: |
    常在这儿：封万剑（雪山派第二级）；花千红（雪山派门人）
  山顶: |
    常在这儿：白瑞德（雪山派掌门）
  雪山教场: |
    常在这儿：薛千柔（雪山派门人）

师承阶梯:
  说明: '★ 雪山派是分级的。上一级的师傅教完了，你才轮到找下一级，不能跳'
  第一级:
    师父: 雪山教头
    看什么: '先天敏捷 ≥22'
  第二级:
    师父: 封万剑
    看什么: '敏捷 ≥23 + 雪山内功 40 级'
  第三级:
    师父: 白瑞德
    看什么: '内力 1200 以上 + 后天根骨 32 以上'

门派: 雪山派
  特色: '剑法攻击强、重敏捷、防御弱'
  入门: '先天敏捷 ≥22'
  功法: 雪影擒拿手 / 入门十三式 / 雪山剑法 / 踏雪无痕 / 雪山内功

可做的事:
  - '拜访'
  - '拜师'
  - '切磋'
  - '在山脚采耐寒的小花'

谁在这儿:
  - { 名: 雪山教头, 身份: '雪山派第一级' }
  - { 名: 封万剑, 身份: '雪山派第二级' }
  - { 名: 白瑞德, 身份: '雪山派掌门' }
  - { 名: 薛千柔, 身份: '雪山派门人' }
  - { 名: 花千红, 身份: '雪山派门人' }
  - { 名: 史婆婆, 身份: '花间派与大雪山上都有人见过她' }
  - { 名: 阿绣, 身份: '花间派门人' }

氛围:
  看: '长年积雪。山腰以上没路，只有踩出来的痕'
  听: '风。除了风几乎没有别的声音'
  闻: '雪和铁的味道，教场的兵器都冻着'
  时令: '风停的日子难得；一过午就起风，那时候谁也看不见谁'

