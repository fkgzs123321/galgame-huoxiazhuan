范围: "观门 / 前殿 / 后屋"
概览: "茅山派所在。观里烧的香味道很淡。这里的人不婚娶。"

子地点:
  观门: |
    这一带没什么人。
  前殿: |
    常在这儿：葛洪（茅山派第一级）；留孙真人（茅山派第二级）
  后屋: |
    常在这儿：茅盈（茅山派掌门）；明月（灵心观后屋的人）

师承阶梯:
  说明: '★ 茅山派是分级的。上一级的师傅教完了，你才轮到找下一级，不能跳'
  第一级:
    师父: 葛洪
    看什么: '先天悟性 ≥28'
  第二级:
    师父: 留孙真人
    看什么: '天师正道 80 以上'
  第三级:
    师父: 茅盈
    看什么: '后天悟性 40 以上 + 内力 1300 以上'

门派: 茅山派
  特色: '★ 独立法力体系；法术攻击强；★ 不能结婚'
  入门: '先天悟性 ≥22'
  功法: 天师掌法 / 灵符身法 / 谷衣心法 / 天师正道 / 万鸦咒 / 玄冰咒 / 五雷咒

可做的事:
  - '拜访'
  - '拜师'
  - '切磋'
  - '给后屋那个人捐钱'

谁在这儿:
  - { 名: 葛洪, 身份: '茅山派第一级' }
  - { 名: 留孙真人, 身份: '茅山派第二级' }
  - { 名: 茅盈, 身份: '茅山派掌门' }
  - { 名: 明月, 身份: '灵心观后屋的人' }

氛围:
  看: '观门不大，前殿也小。后屋最里面有一间亮着灯'
  听: '很静。香火声都没有'
  闻: '香。味道很淡，淡到像不是烧给自己闻的'
  时令: '逢七做法事，那天观里人多；平时只有那几个不婚娶的人'

