  三个状态量（她这一头）: |-
    ★ 这三个不是 <user> 选的，是她那头变了才动。一次只改一个。
    【主角.状态】★ 它不是 <user> 能选的，是「她」那头发生了事才会变。只在下面这几种时候改：
    在线 → 暂停: 她按了暂停（热牛奶/接电话/擦眼镜）。画面停在那一帧
    暂停 → 在线: 她按回继续。中间过了多久不必写
    在线 → 离线: 她点了退出（上班/太困/明天要早起）
    离线 → 在线: 她下一次打开。★ 回来先看一眼 <user> 站在哪
    任意 → 冻结: 她很久没上线（超过一个月没人动这个存档）。写「意识之外的空白」
    冻结 → 在线: 她又打开了这个存档
    · 暂停态：不推进任何事件、不消耗体力、她的画面与声音都消失
    · 离线态：<user> 可以自主行动，但体力照走；女角按自己的性子回应
    · 冻结态：只呈现 <user> 能感知到的部分，不解释原理
    · ★ 一次只改一次状态，不要在一层里连跳两态
    【她.情绪】★ 跟着「目的进度」与「反抗次数」走，不跟剧情走：
    好奇 → 投入: 目的进度过 25，或者她已经连着玩了好些天
    投入 → 执念: 目的一直推不动，或者 <user> 反复成功反抗
    任意 → 厌倦: 连着很多层没有起色（进度不涨、反抗也没成），或者她这一套本来就没耐心
    厌倦 → 关门: ★ 到底她会关掉游戏走终局。慢，别乱触发
    · 好奇期：她还没形成偏好，不要把她写成已经知道要什么的人
    · 投入期：她知道自己要什么了，不要太跳
    · 执念期：不要让她突然换目标，也不要让她轻易得手
    · 厌倦期：写她走神、手在别处、连自己点了什么都不记得
    【她.熟练度】★ 它涨得慢，按「她玩了多少」算，不按剧情算：
    新手 → 上手: 她已经摸清了怎么点、开始有方向
    上手 → 沉浸: 她对里面的人有情绪了，会为谁可惜
    沉浸 → 狂热: 她开始熬夜玩，<user> 一睁眼她就在
    狂热 → 收官: 她走神了，急着走到终点
    · 越熟她猜得越准（她看不见的那些规则她靠猜），但**永远不知道「有效值」**
    · ★ 熟练度与情绪不是一回事：熟练是「她多会玩」，情绪是「她现在想不想玩」
  NSFW.身体.基线.什么时候建档: |-
    init 开局首层/女角首次进镜头时建，只给在场的；能推的先填，拿不准留空别编
    insert 新女角进镜头时插一份 ｜ update 基线真变了才改，只改那项 ｜ delete 基本不删（例外：最近性行为只留两次）
    ★★ 最常见的错：把「此刻」写进基线（充血/湿润/红印/唾液/淤痕 都是即时层）
    ★ 只升不降：调教值、性爱次数 ｜ 分工：基线问「数轮后回看还成立吗」，即时问「此刻正在发生什么」
  NSFW.身体.即时.什么时候变: 每层按实际发生的变化写；没变的不写；填之前先看它此刻正在发生什么。换场景清空
硬约束:
  单轮变化幅度: 每个数值单轮参考上限不超过 5 点，跨时段累积不限
  不可逆项: 状态表里标了不可逆的只增不减。生命有效值、内力强度、岁数、已叛门派都属于这一类
  清空项: 判定结果、拒绝标记、战斗结果在结算完之后清空
  不存在的变化不要写: 没变的数值不要写进变量更新块
反哺回路（这是天赋唯一的涨法，不写它就永远是先天值）:
  谁写: 引擎或者前端算，AI 只读结论
  规则: 技能等级除以十向下取整，就是该天赋的加点点数
  对应: 基本拳脚给膂力，基本轻功给敏捷，基本内功给根骨，读书写字给悟性
  示例: 先天膂力 20，基本拳脚练到 250 级，膂力就是 45
  面板要显示: 还要练几级才触发下一次反哺
门派与武功怎么变成收益:
  请教: 向师傅学门派武功，消耗潜能
  自学: 读秘籍。逍遥派唯一的入口
  练功: 基本武功高于门派武功时可用，把门派武功追平，消耗时间不消耗潜能
  绝招: 不是独立等级，是两门武功同时到某个级数之后自动可用
  叛师: 杀同门到其师恨之入骨，再对话即被逐出。代价是门派武功全废、所有基本武功减五十级、已耗潜能不返还、该门派终身不得再入
互学武功（从她身上学功夫，男性学花间武学的唯一来源）:
  谁能教: 女角。花间派只收女性，男性永远拜不进去
  门槛: 关系阶段。一见如故教入门功法，亲密教门派功法中段，热情如火教独门绝招
  收益: 学到之后写进 关系.<女角>.已学自她 与 技能.门派，此后永久可用
  结婚之后: 她会的全部都能教，包括她从别处学来的
女角的身体字段（每层按实际发生的变化写，没变的不写）:
  开发度: 0~100，身体被开发的总进度
  身体记忆: 一句话，她记得被怎么碰过
  关系阶段: 陌生 / 相识 / 一见如故 / 亲密 / 热情如火 / 可婚，跨过阈值才改
  状态: 一句话，她此刻的样子
数值变化怎么写（正文里写出来的格式，正则靠它上色）:
  - 一段结算完，把变化的数写在括号里，如（潜能 -1200）（好感度 +8）
  - 只写真正变了的，没变的不写
判定与战斗怎么写:
  谁算: 前端在按下按钮时算，AI 不参与
  判定结果: 引擎算好之后写进 局面.判定结果。AI 直接采信，不要重算
  战斗结果: 引擎算好之后写进 局面.战斗结果。AI 按里面的写法约束写正文
  正文里不出现: 掷值、命中率、伤害数字。这些只在面板上看
