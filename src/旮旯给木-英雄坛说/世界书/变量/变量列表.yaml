顶层结构:
  - 世界
  - 她
  - 局面
  - 时间
  - 场景
  - 天赋
  - 技能
  - 资源
  - 身体
  - 关系
  - 战斗临时
变量:
  世界.底座.意义: 底座门控的依据。所有底座条目的显隐都读它
  世界.阶段.范围: 初入江湖 / 江湖立足 / 名动一方 / 武林之巅 / 结局
  世界.阶段.意义: 决定阶段指导加载哪一段，也是判定难度修正的输入
  主角.状态.范围: 在线 / 暂停 / 离线 / 冻结
  主角.状态.意义: 四态循环。在线＝她正在玩；暂停＝她按了暂停离开；离线＝她下线了，你自己行动但体力照走；冻结＝她很久没回来
  她.情绪.范围: 好奇 / 投入 / 执念 / 厌倦
  她.情绪.意义: 决定她这一层下手的轻重与节奏。厌倦到头她会关掉游戏
  炼丹.炉温.范围: 0 ~ 100（超 100 炸炉）
  炼丹.炉温.意义: 炼丹三数之一。低效区 0~30 / 稳定区 31~70 / 高效但危险 71~100
  炼丹.品质.范围: 0 ~ 100
  炼丹.品质.意义: 决定最终产出等级
  炼丹.完成度.范围: 0 ~ 100（到 100 可取丹）
  炼丹.完成度.意义: 到 100 即完成
  炼丹.在炼什么.意义: 空＝没在炼。丹房只能在门派驻地里开
  炼丹.本周炼过.意义: 一周只能炼一炉。跨周自动清零
  她.人设.意义: 决定加载哪一套她的性子与手段
  她.目的进度.范围: 0 ~ 100
  她.目的进度.意义: 她离她要的东西还有多远，不掉只涨
  她.已拿到.范围: 0 ~ 100
  她.已拿到.意义: 已达成单元的数量，目的进度由它除以单位数得来
  她.熟练度.范围: 新手 / 上手 / 沉浸 / 狂热 / 收官
  她.熟练度.意义: 决定她的手段用得有多熟，以及她挑选项时的攻击性
  NSFW.兴奋度.范围: 0 ~ 100
  NSFW.兴奋度.意义: 兴奋度高时她注意不到异常，反抗更容易成功但后果更重
  她.反抗值.范围: 0 ~ 100
  她.反抗值.意义: 你唯一的反抗资源
  她.已用手段.意义: 记录她的行为模式漂移，也是世界的裂缝的输入
  她.世界的裂缝.范围: 0 ~ 100
  她.世界的裂缝.意义: 她作弊留下的累计痕迹，账单记在他头上
  局面.当前选项.意义: 她摆出来的三到四条完成方式。面板只认文本、等级、感觉三个字段
  局面.玩家拒绝.意义: 玩家按了拒绝之后留下的目标序号。结算完要写成空串
  局面.判定结果.意义: 引擎算好的判定结果。AI 直接采信，不要重算
  局面.战斗结果.意义: 引擎算好的战报摘要。同上，直接采信
  局面.骰子种子.意义: 确定性伪随机的种子。AI 不读也不写
  时间.岁数.范围: 14 ~ 60
  时间.岁数.意义: 第二根倒计时。它一边给成长（血与内力），一边收走机会（运气与未成年分支）
  时间.月.范围: 1 ~ 12
  时间.月.意义: 让玩家看清离下一个岁数还有多久
  时间.日进度.范围: 0 ~ 29
  时间.日进度.意义: 行动与年龄之间的换算器，让「打坐多久」变成可感知的代价
  时间.耐心.范围: 0 ~ 24
  时间.耐心.意义: 两年之内搞定她。归零她就跟别人走了
  场景.当前地点.范围: 平安镇 / 玉女峰 / 武当山 / 大雪山 / 商家堡 / 五指山 / 冰火岛 / 黑森林 / 灵心观 / 随机地图 / 铸剑谷 / 桃花源
  场景.当前地点.意义: 决定在场名单、开放时段，以及能不能触发这一处的门派线
  场景.当前门派.范围: 无 / 太极门 / 八卦门 / 雪山派 / 花间派 / 伊贺谷 / 红莲教 / 兽王派 / 茅山派 / 逍遥派 / 散人
  场景.当前门派.意义: 决定能学哪些门派武功、能进哪些内部区域、以及花间派这类性别的门禁
  场景.已叛门派.意义: 叛师之后那个门派终身不得再入
  场景.当前女角.意义: 决定加载哪一位女角的条目
  天赋.膂力.范围: 10 ~ 255
  天赋.膂力.意义: 物理攻击成长、招架、饭量与水量上限，还决定相貌档位
  天赋.敏捷.范围: 10 ~ 255
  天赋.敏捷.意义: 命中、闪避、出手先后
  天赋.根骨.范围: 10 ~ 255
  天赋.根骨.意义: 气血上限、内力上限、打坐速度、减伤
  天赋.悟性.范围: 10 ~ 255
  天赋.悟性.意义: 学武消耗潜能的倒数、暴击伤害、法术命中、任务奖励高低
  天赋.先天.意义: 创建时定下且永不改动。它决定成长率而不只是当前值
  技能.基本.范围: 十种基本武功，各自 0 ~ 255
  技能.基本.意义: 每十级给对应天赋加一点。它同时是省潜能的正路（门派武功可以练到这个等级）
  技能.门派.意义: 当前门派能学的功法，只能靠请教或练功
  技能.逍遥.意义: 自创逍遥派之后，五本秘籍所给的功夫
  资源.潜能.范围: 0 ~ 65535
  资源.潜能.意义: 学武的唯一货币。每一次花潜能都是一次取舍
  资源.经验.意义: 决定可学武功的上限，也打开除黑、铸剑、高级武功三条路
  资源.金钱.意义: 读书识字要花钱。悟性这条线是用钱换来的
  资源.食物.意义: 归零则生命与内力不再自然恢复，也无法疗伤与打坐
  资源.饮水.意义: 同食物
  身体.生命当前.意义: 能不能撑过这一场。它恢复得快，是可逆的那一层
  身体.生命有效.范围: 0 ~ 100
  身体.生命有效.意义: 伤到实处才会掉，掉了恢复极慢，是跟着他一辈子的那一层
  身体.内力蓄存.意义: 战斗中的燃料
  身体.内力强度.意义: 涨上去就不再下来的那一种成长
  身体.法力.意义: 茅山派的第二内力
  身体.容貌.范围: 1 ~ 10
  身体.容貌.意义: 十六岁之后才看得见。它是一道真实门槛
  身体.福缘.范围: 0 ~ 100
  身体.福缘.意义: 影响掉落、任务奖励倍率、铸剑品质
  关系.<女角>.好感度.范围: -100 ~ 100
  关系.<女角>.好感度.意义: 她给的任务是唯一的推进器，好感是它唯一的标尺
  关系.<女角>.关系阶段.范围: 陌生 / 相识 / 一见如故 / 亲密 / 热情如火 / 可婚
  关系.<女角>.关系阶段.意义: 每一档都是门槛。不到那一档，她不会教你她的武功
  关系.<女角>.已学自她.意义: 从她身上学到的功夫。花间武学对男性只有这一条来源
  战斗临时.加力.意义: 物理攻击附加的内力。对兵刃的加成只有拳脚的一半
  战斗临时.呆若木鸡.范围: 0 ~ 5
  战斗临时.呆若木鸡.意义: 被控住的回合数。本回合不行动
  战斗临时.临时增益.意义: 绝招带来的增益。互斥项在这里判，比如变熊与变鹰

# ────────────────────────────────────────────────
# 路径怎么写（★ 只在更新变量时用得到，但 MVU 是原子更新，写错一条会拖垮整批）
# ────────────────────────────────────────────────
路径怎么写:
  硬规矩: |
    ① 路径不带 stat_data 前缀，直接以 / 开头
    ② ★★ 一批里只要有一条路径不存在，**整批作废**（JSON Patch 是原子的）。
       所以写之前逐条核对；宁可少写一条，不要写错一条。
    ③ 值一律写实际内容，不要写占位符
    ④ 数值先算再加：old (X) + delta (Y) = new (Z)
    ⑤ 枚举型的值只能填上面列的那几种（如 主角.状态 只有 在线/暂停/离线/冻结）。
       填别的不会报错，但会被落回默认值：等于白写。
  动态表不要写死键名: |
    技能.门派 / 技能.逍遥：键 = 武功名，写 /技能/门派/太极拳
    关系：键 = 女角名，写 /关系/李青照/好感度
    背包：是数组不是对象，整表替换
