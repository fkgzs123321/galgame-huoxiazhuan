时间轴索引:
  模型: 年龄主轴 + 两年倒计时
  一句话: 从十四岁起，一年一岁。这门功夫得练上很多年，而她等不了那么久。
  时间怎么走:
    - 一次行动约走三日。三十日是一个月，十二个月是一岁
    - 打坐与练功都是挂着时间走的。练一整夜就是过了一夜
    - 家里床边那瓶女儿红，喝一瓶就过去三个月
  关节点:
    - 岁数: 14
      门槛: 无
      可以做什么: 选天赋、拜师、打基本功。身上的钱只够买几件粗布
      锚点: 时空装置把你丢在平安镇
    - 岁数: 16
      门槛: 无
      可以做什么: 相貌开始可见，有些门第的门槛要拿它来量
      锚点: 山间盆地那一页纸从此拿不到了
    - 岁数: 18
      门槛: 无
      可以做什么: 可以开始接她的任务
      锚点: 她第一次把一件事交给你
    - 岁数: 20
      门槛: 要有桃花源
      可以做什么: 可以谈婚嫁
      锚点: 月下老人肯跟你说话了
    - 岁数: 22
      门槛: 无
      可以做什么: 与年纪有关的那些门全关了
      锚点: 无
    - 岁数: 30
      门槛: 无
      可以做什么: 气血不再随岁数涨
      锚点: 无
    - 岁数: 60
      门槛: 无
      可以做什么: 内力不再随岁数涨
      锚点: 无
  耐心:
    长度: 二十四个月
    起点: 认识她那天
    到期: 她跟别人走了，这条线就此关掉
    怎么延长: 延长不了。所以两年之内不可能全都收下，得先挑
  她怎么用这条轴: 她算的是最快的那条路。哪一年能拿到什么，她心里有数，比你清楚
  路线依赖:
    说明: '★ 八章不是线性。看清楚谁卡谁，别在不该去的地方耗时间'
    主线:
      - '01_入江湖 → 02_立足：拜了师才进第二章'
      - '02_立足 → 03_除黑：经验 ≥ 十万，且村长那一关过了'
      - '03_除黑 → 04_六派掌门：八坛破完，六派掌门才值得打'
      - '04_六派掌门 → 05_时空的尽头：六块石板凑齐'
    支线:
      - '06_浪人兄弟：随时可去，★ 但要先杀掉哥哥，弟弟那边才会动'
      - '07_铸剑与安家：经验 ≥ 十五万 + 钱够。★ 屋子要在 20 岁之前弄好（谈婚嫁要它）'
      - '08_武林大会：岁数到十八 + 十个海外仙丹 + 十瓶女儿红'
    '★ 三条线互不阻塞，但共用同一份经验与时间。哪条先走，就是她的选择。'

  推进清单（每章要做的动作）:
    01_入江湖: ['认全平安镇六个片区', '找老婆婆接第一份活', '决定要不要跟顾炎武读书写字', '挑门派并入门']
    02_立足: ['向师父请教（花潜能）', '练功 / 打坐（挂时间）', '干活攒潜能 或 去衙门接除恶', '同门切磋（输了掉一半潜能与武功）']
    03_除黑: ['把经验攒到十万', '找村长拿青龙坛地图', '逐个破八个坛', '★ 打完不给潜能，只给经验与钱']
    04_六派掌门: ['按最弱的先挑（自己判断）', '每位掌门打赢拿一块石板', '凑齐六块']
    05_时空的尽头: ['带石板去打开机器', '打完门口那一个，往下走', '★ 后面还有，别以为一次就完']
    06_浪人兄弟: ['去冰火岛渡口遇哥哥', '决定打不打（打了才继续）', '撑过弟弟二十回合', '再找他开复仇战']
    07_铸剑与安家: ['找干将拿兵器，跟莫邪打四次（必须用他给的）', '打赢开铸剑谷', '爬上山打掉山大王，拿下桃花源']
    08_武林大会: ['凑齐十个海外仙丹 + 十瓶女儿红', '找渡口那个人', '再找顾炎武', '再找神秘人', '★ 去平一指药铺报名时留意那几句话']
