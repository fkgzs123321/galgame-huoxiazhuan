08_武林大会:
  一句话: "这条线藏在渡口那个人手里，前面几个条件一个都不能少"
  什么时候进: "岁数到十八，且东西带够"
  地点: "冰火岛渡口 → 药铺 → 五指山 → 冰火岛另一条道"
  这一段该发生什么:
    - "带十个海外仙丹与十瓶女儿红去找渡口那个人，他会收下，再让你拿猪肉与女儿红去找顾炎武"
    - "顾炎武让你去找神秘人。神秘人告诉你金远见要开武林大会"
    - "★ 去平一指的药铺报名时，**你会听见他与人说的那几句话**"
    - "那几句听完，你就得回去找顾炎武商量：假装成另一边的人混进去"
    - "事成之后拿到请帖与一艘船，从冰火岛另一条道进去"
  出场人物: "浪人乙 / 顾炎武 / 神秘人 / 平一指"
  她能拿到什么: "武林大会的入场资格，以及一条完全不同的剧情线"
  她的性子怎么表现: "★ 这条线是**听完一段话才分叉**的。她会特意在那间药铺多站一会儿"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她会把十个仙丹十瓶酒备齐，一个不少'
  丰娆: '她嫌凑东西麻烦，这一章会拖很久'
  舒晏: '★ 她会特意在平一指那间药铺多站一会儿'
  唐响: '她不管条件，先跑去渡口问'
  沈眠: '她不太想让你进大会（人太多）'
  莫漾: '凑东西这种活她不做'
  纪清: '她把每一步的条件都对齐了才动'
  郁灼: '她只等药铺那几句话'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
