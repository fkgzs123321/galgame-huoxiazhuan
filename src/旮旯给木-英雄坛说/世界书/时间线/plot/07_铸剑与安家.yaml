07_铸剑与安家:
  一句话: "给自己打一把兵器，再给自己找一间屋子"
  什么时候进: "经验 ≥ 十五万，且钱够"
  地点: "黑森林第二间屋子 / 武当山与黑衣大盗旁那两座山"
  这一段该发生什么:
    - "干将会给你四样兵器，让你一样样地用，跟莫邪连打四次。**必须用他给的那一把打赢**"
    - "打赢了开铸剑谷，自己打的兵器不随退出消失，也不能扔不能卖"
    - "另一头：爬上山打掉山大王，那片桃花源就是你的家"
    - "**有了家才能谈婚嫁**"
  出场人物: "干将 / 莫邪 / 山大王"
  她能拿到什么: "一把随身的兵器，一间屋子"
  她的性子怎么表现: "打兵器要花时间与钱，她会算值不值；屋子那边她反而不会跳，因为**后面对着一条线**"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她会算打兵器值不值，屋子她一定要'
  丰娆: '铸剑那四次她嫌烦，屋子她反而认真，因为后面连着一条线'
  舒晏: '她要看你用别人给的兵器打四次能不能撑住'
  唐响: '她先把山大王打了，屋子先拿下'
  沈眠: '屋子对她来说是你有了根，她不太想给'
  莫漾: '铸剑跳，屋子也拖'
  纪清: '四把兵器她都要试一遍，记下差别'
  郁灼: '她只打山大王，铸剑太磨'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
