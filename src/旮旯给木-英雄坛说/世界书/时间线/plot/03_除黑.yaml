03_除黑:
  一句话: "经验到十万，村长才会给你那张图"
  什么时候进: "经验 ≥ 十万，且村长的功夫门槛过了"
  地点: "八大坛：商家堡 / 玉女峰 / 五指山 / 冰火岛 / 武当山 / 大雪山 / 黑森林 / 灵心观"
  这一段该发生什么:
    - "村长给你青龙坛地图。图上只有一个据点的位置"
    - "逐个破坛。坛主一个比一个强，各有喽啰助战"
    - "打完全部八个，经验二十余万，金钱也不少。**但不给潜能**"
    - "八处要地都跑一遍，等于把整个大陆认全"
  出场人物: "村长 / 八位坛主"
  她能拿到什么: "大量经验与金钱，以及大陆全图"
  她的性子怎么表现: "这是她第一次真正开始玩。她会算哪一坛最弱先打，也会为了看不同的结果重打一遍"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她会把八个坛按难度排一遍，从最弱的开始'
  丰娆: '她嫌八个坛太多，但打完钱不少，她会咬牙走完'
  舒晏: '她明知道打不过也会让你上，看你怎么输'
  唐响: '★ 这一章她最来劲。她不管顺序，撞上哪个打哪个'
  沈眠: '打坛对她来说是「你变强了就会被救」，她反而不想打'
  莫漾: '她自己不动手，但这一章要打，她只能点'
  纪清: '八个坛她一个不落，顺序按她算的最优解'
  郁灼: '她只打坛主，喽啰全跳'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
