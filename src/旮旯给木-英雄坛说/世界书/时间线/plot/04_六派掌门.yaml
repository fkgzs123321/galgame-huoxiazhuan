04_六派掌门:
  一句话: "要凑六块三角石板，就得挨个打赢六位掌门"
  什么时候进: "除黑之后，或者你直接去挑"
  地点: "六派掌门所在（红莲教 / 玉女峰 / 武当山 / 大雪山 / 商家堡 / 冰火岛）"
  这一段该发生什么:
    - "六位掌门各持一块三角石板：余鸿儒、李青照、清虚道长、白瑞德、王维扬、和仲阳"
    - "每一位都是本门最强，且各有绝招"
    - "打赢一个拿一块。六块凑齐才打得开时空的尽头"
  出场人物: "六位掌门"
  她能拿到什么: "六块三角石板"
  她的性子怎么表现: "★ 花间派掌门李青照也是其中一位。她管着一门人，**你在这条线上做别的事她都看得见**"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她算过六位掌门谁最强，会把你练够了再去'
  丰娆: '她会先打能打赢的，打不过的先放着'
  舒晏: '★ 她会去惹李青照，因为那一门的人看得见你'
  唐响: '她一个个挑战，不排序'
  沈眠: '六块石板是通关必需，她不得不打，但她拖到最后才去'
  莫漾: '她会拖。这一章要变强，她嫌麻烦'
  纪清: '她按本门武功相克的顺序排，一个不多一个不少'
  郁灼: '她只挑打得最热闹的那一场'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
