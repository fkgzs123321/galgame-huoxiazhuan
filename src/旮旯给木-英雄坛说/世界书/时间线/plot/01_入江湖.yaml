01_入江湖:
  一句话: "时空之门把你丢在平安镇。你十四岁，身上一百文，什么都不会"
  什么时候进: "开局"
  地点: "平安镇"
  这一段该发生什么:
    - "先认地方：村东、村西、北边、南郊、商业街、小菜场"
    - "找第一份活干：老婆婆那里，工钱不多，但潜能从这里开始攒"
    - "镇上有人能教你：顾炎武教读书写字（要花钱）"
    - "想学武就得挑门派。六大门派各有各的门槛，挑之前先看自己那四项天赋"
  出场人物: "村长 / 顾炎武 / 老婆婆 / 小顽童 / 阿庆嫂 / 卖花妞 / 捕快"
  她能拿到什么: "门派入门、第一笔潜能、第一件兵器"
  她的性子怎么表现: "这一段她最有耐心。她在翻攻略，把每个门派的门槛算一遍，再决定推你去哪一家"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她会把六个门派的入门门槛抄一遍再决定。顾炎武那儿她也算过，觉得值才让你去'
  丰娆: '她会先看哪个门派离得最近。读书写字她嫌费钱'
  舒晏: '她会让你先去最远的那条街，看你走多久才回头'
  唐响: '她随便挑一个能打的就进门。读书写字她不点'
  沈眠: '她会让你往没人的地方走，第一份活也不一定接'
  莫漾: '她可能就让你站在镇口不动，先挂一会儿'
  纪清: '她把六个片区都走一遍，连小菜场都不漏'
  郁灼: '她直接往山那边走，镇上这些她不想看'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
