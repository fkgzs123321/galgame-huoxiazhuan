05_时空的尽头:
  一句话: "门后面那几个人，一个比一个藏得深"
  什么时候进: "六块石板凑齐"
  地点: "时空的尽头"
  这一段该发生什么:
    - "按你这一路的表现，等在门口的是不同的一个"
    - "打完一个，后面还有。**「你是最后的对手」这句话在这条线上一句都不成立**"
    - "走到最后，会有一个你一直没怀疑过的人站出来"
  出场人物: "我是谁 / 谁是我 / 东方求败 / 道德和尚"
  她能拿到什么: "通关，以及一个称号（十一种之一）"
  她的性子怎么表现: "她会为了看没看过的结局再走一遍。走得越熟，她越快"
  结局之后: "有两种走法：一个是拿家里的麻绳去平安镇西郊那棵歪脖树，一个是真的重来一遍"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '她会先看你这一路的表现，挑那个最像「好结局」的门'
  丰娆: '她快速打过去，结局看一个就走'
  舒晏: '★ 她故意看最难看的那个结局'
  唐响: '她直接推门，不管是谁'
  沈眠: '她走到这儿，是想看你会不会有人来接'
  莫漾: '她打到这儿基本是挂机挂着走完的'
  纪清: '★ 三个门她都要看一遍，一个一个来'
  郁灼: '她只看最刺激的那一场，看完就关'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
