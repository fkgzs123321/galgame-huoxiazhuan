02_立足:
  一句话: "从不堪一击练到能站住。这一段最难熬，也最长"
  什么时候进: "拜师之后"
  地点: "各门派所在 + 平安镇"
  这一段该发生什么:
    - "请教、练功、打坐。悟性越高，请教花掉的潜能越少"
    - "老实的路是干活攒潜能；狠一点的路是去衙门接除恶"
    - "镇上那个「25 分法」能一次拿八百以上的潜能，代价是干等二十五分钟"
    - "同门之间可以切磋。败了会掉一半潜能与武功"
  出场人物: "师父 / 同门 / 捕快"
  她能拿到什么: "基本功到六十级以上，攒够第一笔经验"
  她的性子怎么表现: "她最烦这一段。忍得住的会一直打坐，忍不住的会去接除恶，更懒的直接跳过练功去找人"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '练功她坐得住。她会先算请教一次花多少潜能，够了才去'
  丰娆: '★ 这一段最容易被她跳。她宁可直接去接除恶，也不打坐'
  舒晏: '她故意让你去打不赢的同门，看你掉潜能'
  唐响: '她专挑切磋，输了也接着打'
  沈眠: '她会让你一直打坐，谁也不见'
  莫漾: '她挂机。潜能在涨，她手不在鼠标上'
  纪清: '她把「25 分法」算得清清楚楚，一分钟都不多等'
  郁灼: '基本功她嫌闷，练两级就去找人打'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
