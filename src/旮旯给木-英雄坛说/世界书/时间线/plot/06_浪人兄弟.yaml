06_浪人兄弟:
  一句话: "冰火岛渡口那两个浪人，是整个游戏藏得最深的一段"
  什么时候进: "去冰火岛渡口，或者做了那个跟哥哥有关的决定"
  地点: "冰火岛渡口"
  这一段该发生什么:
    - "先遇上哥哥。你可以打，也可以不打"
    - "**你杀了哥哥之后，弟弟那边才有事发生**：撑过二十回合他会停手，再找他才开那场复仇战"
    - "赢了他，拿无名剑（随你的门派而定）与无名甲。**输了他会真的杀了你，后果跟自尽一样**"
    - "他手上还压着另一件事：不拜门派 + 读书写字到八十级，他教你反两仪棍法"
  出场人物: "浪人甲 / 浪人乙"
  她能拿到什么: "终极装备，或者一门别处学不到的棍法"
  她的性子怎么表现: "★ 这一段有「一条路走了就没法回头」的分支。有的她会先存两个档，有的她只走一遍"

她的表现（八套速查）:
  说明: '★ 同一章，八个人做法完全不同。照当前「她.人设」取对应那一行'
  通用: '（见上一行的「她的性子怎么表现」）'
  温砚: '★ 她会先看有没有别的走法，能不杀就不杀'
  丰娆: '她直接打了，因为打了才开下面'
  舒晏: '她让你杀，然后看弟弟那边'
  唐响: '她先打哥哥，再打弟弟，一场不落'
  沈眠: '她不想让你身上多一条命，这一章她会绕开'
  莫漾: '她会跳过整章'
  纪清: '★ 她会存两个档，两条路都走'
  郁灼: '她只看复仇那一场'
  贯穿全书:
    温砚: '先把这一章的门槛一条条查清楚，再动手。她宁可慢，也不让你白疼一次'
    丰娆: '这一章太长了她就不耐烦，会找最省事的那条路，能跳就跳'
    舒晏: '她故意挑难走的那条，还喜欢在同一段来回看，看你什么时候顶不住'
    唐响: '她不看门槛，先撞上去。撞完再看要不要改'
    沈眠: '这一章里凡是「有人会来救你」的分支，她一概不点'
    莫漾: '她大概率不动手，把光标放那儿，看你自己耗'
    纪清: '她不是在走，是在把这一章的数算明白。少一格都不行'
    郁灼: '凡是这章里最没意思的那几段，她全跳，只看最刺激的'
