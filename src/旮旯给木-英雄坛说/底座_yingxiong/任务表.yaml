# ════════════════════════════════════════════════════════════
# 底座_yingxiong · 任务表（E9 的参数）
# ════════════════════════════════════════════════════════════
# 引擎层（引擎模板/引擎能力/任务引擎.txt）只提供能力：
#   接取（前置/任务位）/ 进度（计数·收集·判定）/ 结算（完成与失败都落账）/ 期限
# 具体有哪些任务、给什么、什么后果 —— 全在这张表。
#
# ★ 两条铁律（照 E9 的设计）：
#   ① **失败也是结算** —— 任务的重量一半在失败后果上（好感掉、线关掉）
#   ② 女角任务是 T3 阶段唯一的推进器，所以它的后果必须写实
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  任务位上限: 3
  说明: '同时最多做三件。多于三件就该让人觉得「他一天忙不过来」'

任务表:

  # ── 公门（潜能的主要来源）──
  除恶:
    名: 除恶
    类型: 计数
    前置: [{ 字段: 经验, 至少: 1000 }]
    需要: 15
    可重复: true
    接的谁: 捕快
    完成后果: { 潜能: 800, 声望: 2 }
    失败后果: { 声望: -3 }
    说明: '一批十五个目标，其中三个厉害的。★ 潜能只能靠这个和干活来，打坛主不给潜能'
  搬石头:
    名: 搬石头
    类型: 计数
    前置: [{ 字段: 经验, 至少: 1000 }]
    需要: 8
    可重复: true
    期限: 30
    接的谁: 工地管事 / 石料管事
    完成后果: { 潜能: 120, 金钱: 30 }
    失败后果: { }
    说明: '按趟算。★ 一天只让搬几趟 —— 这条限制写在管事身上，不在这个表里'

  # ── 门派（师承的推进）──
  门派功课:
    名: 门派功课
    类型: 计数
    前置: [{ 字段: 拜师, 至少: 1 }]
    需要: 20
    可重复: true
    接的谁: 当前门派的第二级师傅
    完成后果: { 门派武功等级: 2, 好师徒: 1 }
    失败后果: { 好师徒: -1 }
    说明: '练够二十次门派武功。★ 接了不做会掉师傅的观感'

  # ── 女角任务（★ T3 唯一的推进器）──
  她的托付:
    名: 她的托付
    类型: 判定
    需要: 1
    可重复: false
    接的谁: 当前女角
    完成后果: { 好感度: 8, 关系阶段推进: 1 }
    失败后果: { 好感度: -6 }
    说明: |
      ★ 这是这张卡里最重要的一类任务。
      每个女角会给一件「只有你做得了」的事 —— 做了，她记着；没做，她也记着。
      **失败后果必须写实**：不是「什么都没发生」，是「她下次不找你了」。
  她的忌讳:
    名: 她的忌讳
    类型: 判定
    需要: 1
    可重复: false
    接的谁: 撞见的另一位女角
    完成后果: { 好感度: -20, 关系封闭: 1 }
    失败后果: { 好感度: -40 }
    说明: '★ 这不是「接」的任务 —— 是被看到时的结算。见 世界观/底座_yingxiong/关系封闭'

  # ── 主线（剧情推进）──
  村长的地图:
    名: 村长的地图
    类型: 判定
    前置: [{ 字段: 经验, 至少: 100000 }]
    需要: 1
    可重复: false
    接的谁: 村长
    完成后果: { 关卡推进: 1 }
    失败后果: { }
    说明: '★ 门槛只看经验，不看功夫。原文是「在你功夫不灵光的时候是不会给你地图的」'
  一坛:
    名: 一坛
    类型: 判定
    需要: 1
    可重复: false
    接的谁: 拿到地图后自动接
    完成后果: { 经验: 50000, 下一坛地图: 1 }
    失败后果: { }
    说明: '每坛只能打一次。★ 想刷喽啰就别杀坛主（坛主一死这一坛就没了）'

  # ── 隐藏线（渡口那位）──
  浪人的三件事:
    名: 浪人的三件事
    类型: 收集
    需要清单:
      - { 字段: 海外仙丹, 至少: 10 }
      - { 字段: 女儿红, 至少: 10 }
    可重复: false
    接的谁: 浪人乙
    完成后果: { 武林大会开场: 1 }
    失败后果: { }
    说明: '★ 三件事里两件要条件齐了才谈（读书八十级 / 带够东西）'
  浪人的仇:
    名: 浪人的仇
    类型: 判定
    前置: [{ 字段: 浪人甲已死, 至少: 1 }]
    需要: 1
    可重复: false
    接的谁: 浪人乙（撑过二十回合之后）
    完成后果: { 无名剑: 1, 无名甲: 1 }
    失败后果: { 命: -1 }
    说明: '★★ 这是全卡唯一一个「输了会死」的任务。失败后果必须写死 —— 输了就是死了，不是「被打败」'

# ── 与别的引擎的接口 ──
接口:
  与E9: '能力在 任务引擎.txt，这里是它的参数'
  与T3关系: '「她的托付 / 她的忌讳」是关系推进的唯一通道 —— 不要让好感只靠说话涨'
  与E13状态: '接了不做会挂一个减益状态（记着这件事），做完了摘掉'
  与她的手段: '★ 她会**跳过**不想做的任务（快进），也会**挂机**让期限到期 —— 这两件事都要在痕迹里留账'
