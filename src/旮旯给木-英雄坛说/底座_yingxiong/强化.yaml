# 强化（改造版）· 借自参考项目「主神空间」
#
# ★ 为什么改：原来的强化是「线性加价 + 每层递增材料」——**温和、无赌性、没保底**。
#   主神空间那套是「成功率递减 + 后果分级 + 垫子保底」，**这才是强化该有的手感**。
#
# ★ 在引擎层还是底座层：**机制在引擎层**（`机制/物品引擎.txt` 的 强化相关函数）；
#   本文件是**参数**（成功率表 / 材料 / 保底规则）。

强化:
  上限: 16
  说明: '打 +号（+1 … +16）。越往后越难，失败可能掉级、归零、甚至把东西打碎。'

  # ★★★ 核心：三段分界线
  成功率表:
    - { 从: 0,  到: 1,  成功率: 1.00, 失败: '必成' }
    - { 从: 1,  到: 2,  成功率: 1.00, 失败: '必成' }
    - { 从: 2,  到: 3,  成功率: 1.00, 失败: '必成' }
    # ── 降级区（+3 ~ +6）：失败只掉 1 级，损失小 ──
    - { 从: 3,  到: 4,  成功率: 0.95, 失败: '掉1级', 区: 降级区 }
    - { 从: 4,  到: 5,  成功率: 0.90, 失败: '掉1级', 区: 降级区 }
    - { 从: 5,  到: 6,  成功率: 0.80, 失败: '掉1级', 区: 降级区 }
    - { 从: 6,  到: 7,  成功率: 0.75, 失败: '掉1级', 区: 降级区 }
    # ── 归零区（+7 ~ +9）：失败直接回 +0，前功尽弃 ──
    - { 从: 7,  到: 8,  成功率: 0.62, 失败: '归零', 区: 归零区 }
    - { 从: 8,  到: 9,  成功率: 0.54, 失败: '归零', 区: 归零区 }
    - { 从: 9,  到: 10, 成功率: 0.41, 失败: '归零', 区: 归零区 }
    # ── 分解区（+10 ~ +16）：失败东西直接没 ──
    - { 从: 10, 到: 11, 成功率: 0.34, 失败: '分解', 区: 分解区 }
    - { 从: 11, 到: 12, 成功率: 0.28, 失败: '分解', 区: 分解区 }
    - { 从: 12, 到: 13, 成功率: 0.21, 失败: '分解', 区: 分解区 }
    - { 从: 13, 到: 14, 成功率: 0.17, 失败: '分解', 区: 分解区 }
    - { 从: 14, 到: 15, 成功率: 0.14, 失败: '分解', 区: 分解区 }
    - { 从: 15, 到: 16, 成功率: 0.10, 失败: '分解', 区: 分解区 }
  三个分界: '跑 +0~+2 白送 ｜ +3~+6 只掉级 ｜ ★ +7 起归零 ｜ ★ +10 起会碎'

  # 每层倍率（加成缩放）
  每层倍率: 0.1
  加成算法: '加成 = 基础 × (1 + 0.1 × 层数)'
  每层材料: { 铁: 2, 灵石: 1 }

  # ── 两个辅助道具（现买现用，不占背包）──
  强化符:
    效果: '成功率 +12%'
    价: '按等级计，越高越贵'
  保护石:
    门槛: 7
    效果: '本次失败不归零、不分解（停在原地）'
    说明: '★ 只有 +7 起能勾。冲 +10 以上几乎必带'

  # ── ★★ 垫子保底 ──
  垫子:
    上限: 10
    计数条件: '★ 只有东西真的被【分解】时计数 +1（掉级、归零都不算）'
    效果: '攒满 10 → 下一发必成（100%）'
    用后: '清零'
    高玩玩法: '拿便宜的垃圾货故意冲爆攒计数，攒满再用必成那一发推主力'

  # ── 「结束强化」才兑现属性 ──
  结束强化:
    作用: '强化只是把 +号 打上去；【结束强化】才把好处兑现到面板上（重算加成、加词缀）'
    词缀节奏: '每升 4 级追加一条词缀/特效'
    自动触发: '关掉面板或换一件东西时自动收尾'

  # ── 技能强化（同一个形状）──
  技能强化:
    上限: 10
    每层效果: 0.05
    每层材料: { 灵石: 2, 铁: 1 }
    作用: '每层给该技能的判定强度 +5%'
    说明: '★ 与装备强化是同一个形状 —— 拿材料叠层、封顶、每层递增，只是作用对象不同'
