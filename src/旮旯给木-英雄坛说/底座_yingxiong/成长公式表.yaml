# ════════════════════════════════════════════════════════════
# 底座_yingxiong · 成长公式表（C1 / C2 / C3 / C4 的参数）
# ════════════════════════════════════════════════════════════
# 这是给代码读的（0 token，不进 prompt）。
#
# ★★ 两条纪律 ★★
#   ① **只写原作明确的公式。** 原作没公开的一律标「待定」，绝不自造数值。
#   ② C4 算出来的东西**只进面板，不进世界书**。
#      判据：「这数值是在帮玩家玩，还是在替 AI 记账？」→ 记账 → 不给 AI。
#
# 与 E3 判定引擎的关系（重要）：
#   E3 的差值 D = 能力值 P - 要求值 R + 环境修正 E
#   英雄坛说原作的「总等级差决定命中率」**就是 D 的现成实现**：
#     同等级命中 45%、躲闪 40%；差 20 级以上 → 命中 1%
#   → C4 的产出（武功总评）就是喂给 E3 的 P
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  用途: 'C1 等级制状态 / C2 反哺回路 / C3 资源门 / C4 派生计算 的参数表'

# ════════════════════════════════════════════════════════════
# C1 · 等级制状态
# ════════════════════════════════════════════════════════════
C1_等级制状态:
  等级范围: '0 ~ 255'
  常规上限: 250
  极限上限: 255
  突破上限的条件: '现代移植版：需去侠客岛找本门石碑（门派武功）或小虾石碑（基本武功）才能到 255'

  成本曲线:
    依据: '原作：悟性越高，学得越快、消耗潜能越少；每种武功学满需要潜能约 1114 万 ÷ 悟性'
    公式: '该技能从 L 升到 L+1 的潜能消耗 = k × (L + 1) ÷ 悟性'
    类型: linear
    k: 355.06
    k的来历: '由「学满一门 = 1114 万 ÷ 悟性」在悟性 30、0→250 级的条件下反解（solveK），不是随手填的'
    验证: 'scripts/test-growth.mjs 的闭环段：反解 k 后算回的总量对上 1114万/悟性，误差 < 1%'
    ⚠️不确定度: '原作只给了「学满一门」这一个总量锚点，**没给曲线的形状**。linear 是最保守的假设。
             用攻略里「6000 潜能可把两门练到 30 级」粗算会发现偏贵 → **k 是我们唯一需要按手感调的数**。
             若要更贴原作，可改 类型: quadratic 或调 k，两者都不动引擎代码（只改这一行）'
    备注: '1114 万是「学满一门」的总量，可用于反推 k 的区间'

  练功:
    条件: '基本武功等级 > 门派武功等级'
    消耗: '时间（不耗潜能）—— 这是省潜能的正路'
    上限: '最多练到与基本武功同级；超 1 级提示「根基不足」'
    例外: '内功与知识类不能练功，只能靠请教'

  门槛:
    - '经验决定可学武功的上限（「见识所限」）'
    - '拜师限制：一旦拜师或自创门派，不能再偷师或学秘籍'

# ════════════════════════════════════════════════════════════
# C2 · 反哺回路（★ 英雄坛说的核心机制）
# ════════════════════════════════════════════════════════════
C2_反哺回路:
  规则: '技能等级 ÷ 10 取整 = 该天赋的加点点数；天赋现值 = 先天值 + 加成总和'
  依据: '原作原文「若要提高一点后天天赋，便需要把相对应的技能提高十级」'
  映射:
    - { 源: 基本拳脚, 目标: 膂力, 每N级: 10 }
    - { 源: 基本轻功, 目标: 敏捷, 每N级: 10 }
    - { 源: 基本内功, 目标: 根骨, 每N级: 10 }
    - { 源: 读书写字, 目标: 悟性, 每N级: 10 }
  面板要求: '★ 必须显示「再练 N 级 → 天赋 +1」—— 这是反哺回路唯一的可玩性出口'
  不可逆: '反哺是单向的（技能只会涨），所以天赋只增不减'

# ════════════════════════════════════════════════════════════
# C3 · 资源门（消耗与门槛）
# ════════════════════════════════════════════════════════════
C3_资源门:
  请教: { 消耗: 潜能, 备注: '向师傅学门派武功' }
  读书写字: { 消耗: ['潜能', '金钱'], 备注: '★ 原作里这是唯一同时要钱的技能 —— 悟性线是用钱换的' }
  自学: { 消耗: 无, 备注: '读秘籍；逍遥派唯一入口' }
  练功: { 消耗: 时间, 备注: '不耗潜能' }
  铸剑: { 门槛: ['经验 ≥ 150000', '金钱 ≥ 100000', '打过莫邪四次'], 备注: '见 原作资料.md §十七' }
  拜师: { 门槛: '见 门派表.yaml 的师承条件', 备注: '先天属性 + 已学武功等级 + 内力' }
  除黑: { 门槛: '经验 ≥ 100000 找村长拿青龙坛地图' }

# ════════════════════════════════════════════════════════════
# C4 · 派生计算（★ 全部只在面板里算）
# ════════════════════════════════════════════════════════════
C4_派生计算:
  纪律: '本节的产出**不写进状态表、不进世界书**。面板算完只把「结果」交给 AI'

  原作明确的:
    - 名: 年龄增长
      公式: '年龄 +1 → 生命上限 +20（30 岁停）+ 内力上限 +20（60 岁停）'
      来源: 原作原文
    - 名: 经验兑换内力上限
      公式: '每 1000 经验 → 内力上限 +1，最多 +1250'
      来源: 现代移植版攻略
    - 名: 加力对兵刃的折扣
      公式: '加力对兵刃的加成 = 对拳脚的一半'
      来源: 原作原文
    - 名: 命中与闪避
      公式: '同等级：命中 45% / 躲闪 40%；等级差 ≥20 → 命中 1%'
      来源: 交大版攻略（★ 这是 E3 判定链的现成输入）
    - 名: 雪花六出段数
      公式: '每 30 级 +1 次，最多 6 次（雪山派拜师白瑞德后可到 11 剑）'
      来源: 原作原文

  原作未公开（★ 部分已定稿，见下节）:
    - 名: 攻击力
      输入: [膂力, 基本拳脚等级, 门派拳脚等级, 武器]
      公式: '★ 仍未定'
      说明: '原作只说「膂力对攻击力有百分比加成，先天膂力越高每点加成越高」，没给公式。
            不阻塞做卡：面板先按等差实现，手感不对再调系数'
    - 名: 防御
      输入: [根骨, 基本招架等级, 装备]
      公式: '★ 仍未定'
    - 名: 生命上限 / 内力上限
      输入: [根骨, 基本内功等级, 门派内功等级, 衣服强化]
      公式: '★ 仍未定（已知的两项加成：年龄 +20/岁、经验每 1000 兑 +1 内力上限）'
    - 名: 武功总评
      输入: [内功, 拳脚或兵刃, 轻功, 招架]
      公式: '★ 已定稿，见下节'
      档位表: '49 档称号，见 原作资料.md §四'

  已定稿:
    定于: '2026-09-16'
    决策人: '用户把这一项交给 AI 定（原话「我不懂，看怎么合理合适，怎么来」）'
    总评:
      方式: '加权平均（引擎的 overall()）'
      参与: [内功, 拳脚或兵刃, 轻功, 招架]
      不参与: [暗器, 知识]
      依据: '原作原文「暗器和知识不贡献总评」'
      权重: '四项各 1 —— 手感不对就改这里，不动代码'
    命中与闪避:
      方式: '原作的等级差曲线（引擎的 rateFromDiff()）'
      参数: { 基准: 45, 斜率: 2.2, 下限: 1, 上限: 95 }
      来历: '由原作两个锚点线性插值：同等级 45%、差 20 级 1% → 斜率 = (45 − 1) ÷ 20 = 2.2'
      说明: '这不是自造的系数，是两个点唯一确定的一条直线'
    伤害与档位:
      方式: 'E3 的 judge()'
      公式: 'D = 我方总评 − 对方总评 → 大成功 ×1.5 / 成功 ×1.0 / 勉强 ×0.6 / 大失败 ×2.0'
      说明: '与同级生2 完全同构，零新增实现'
    战斗粒度:
      方式: '面板内部逐回合真跑，AI 只拿摘要'
      说明: '架构约束不是选择题 —— AI 是语言模型跑不了回合循环，
            只能「代码跑完 → 结果交给 AI 写叙事」，与「判定放在按钮那一刻」同构'
    未选的两条路:
      标定式: '做不到 —— 网上没有可靠的逐级实测数据，反推无从下手'
      纯E3: '会丢掉原作 45%/40% 的手感，而那是原作最可辨认的特征'
    实现与验证:
      引擎: '引擎模板/引擎能力/成长引擎.txt（C1~C4，不含任何内容）'
      项目副本: '机制/成长引擎.txt'
      测试: 'scripts/test-growth.mjs → 58/58 通过，末段用本表参数做闭环验证'

# ════════════════════════════════════════════════════════════
# 悟性与潜能的关系（原作给了总量，没给曲线）
# ════════════════════════════════════════════════════════════
悟性:
  已知: '学满一门武功需约 1114 万 ÷ 悟性 的潜能'
  推论: '悟性翻倍 → 成本减半'
  用途: 'C1 成本曲线的分母'
  待定: '初始悟性的取值区间是 10~30；加上读书识字反哺后可达 255'
