# NPC 作息：什么时候在哪
#
# ★ 为什么需要：89 个 NPC 只写了「所在」，没写「什么时候在」。
#   于是「去客栈找人」这件事永远是成的 —— 半夜也成。这不合理。
#
# ★ 做法：不逐个写（67 种身份），按**身份里的关键词**归大类，同档作息一致。
#   个别有特殊作息的，写在下面的「特殊」里覆盖。
#   依据：他们的「身份」（档案里已有）+ 「所在」（档案里已有）。作息是该身份的常规，不是新设定。

NPC作息:
  说明: '★ 找人的时候，先看他在哪一档。档外的例外看「特殊」'

  大类:
    - 名: 门派高层
      认: ['掌门', '第一级', '第二级', '第三级', '师傅', '教头', '长老', '护法', '盟主']
      作息: '常年在自己那处。早课与晚课一定在，午后可能外出'
      什么时候不在: '每月逢七（做法事/点名）去主殿；下雨天多半在屋里'

    - 名: 门人弟子
      认: ['门人', '弟子', '传人', '教众']
      作息: '早课、午练、晚课。练功场与住处两头'
      什么时候不在: '集市的日子会下山买东西；被派出去做事就整日不在'

    - 名: 坛主与喽啰
      认: ['坛主', '喽啰', '总瓢把子']
      作息: '★ 坛主从头到尾在自己坛里。喽啰轮班守门'
      什么时候不在: '坛主几乎不离开。喽啰换班时有一段时间门口没人'

    - 名: 店家
      认: ['掌柜', '老板', '老板娘', '伙计', '小二', '厨', '裁缝', '铁匠', '贩', '商']
      作息: '天亮开门，天黑关板。中间不歇'
      什么时候不在: '赶集日提前一个时辰开门；天冷时开门晚；年节前后关两三天'

    - 名: 公门人
      认: ['捕快', '捕', '官兵', '兵', '守卫', '巡街', '衙']
      作息: '★ 轮班。白天一班、夜里一班，换班在黄昏'
      什么时候不在: '换班前后各有一小段找不到人；出事的时候全员上街'

    - 名: 镇上闲人
      认: ['孩子', '小书童', '小女孩', '老头', '老翁', '游', '闲', '公子']
      作息: '白天在街上晃。孩子在村东与商业街之间跑'
      什么时候不在: '天黑就回家。下雨天不出来'

    - 名: 武人过客
      认: ['大盗', '侠', '浪人', '江湖人', '独脚', '采花', '盗', '镖']
      作息: '★ 没有固定作息。在哪儿遇上就算'
      什么时候不在: '他们本来就不在同一个地方连着待两天'

    - 名: 隐者与方外
      认: ['道人', '和尚', '真人', '修士', '真人看门']
      作息: '大多时候在屋里。清晨与黄昏各出来一次'
      什么时候不在: '白天有人上山他反而不出来；夜里那一段最静'

    - 名: 幕后
      认: ['幕后', '尽头', '不可见', '来历不明']
      作息: '★ 常驻，但只有走到它面前才见得到。不按作息算'
      什么时候不在: '——'

  特殊:
    - { 名: 桃花, 为什么: '她一直在三清殿外的台阶上。下雨天才挪到屋檐下' }
    - { 名: 老婆婆, 为什么: '她上午在村东，午后不一定。讲起从前话很长，一讲就到天黑' }
    - { 名: 卖花妞, 为什么: '花卖完就走。卖完得早她反而会在原地多站一会儿' }
    - { 名: 神秘女子, 为什么: '★ 她出现在村西是随机的。同一个时辰去看，有时在有时不在' }
    - { 名: 何铁手, 为什么: '兵器铺的活要火。她开炉的日子不见客' }

  面板要用的:
    - '按地点筛人时，★ 先按大类作息过滤，再看「特殊」覆盖'
    - '★ 找不到人不要写成「不在」，写成「这时候不在」并给出他该在的时候'
    - '同一个人连着两次找不到，第三次他一定在（免得卡任务）'

  她怎么用这个:
    - '她算过谁什么时候在。★ 她会把两件事排在同一趟路上，省时间'
    - '找不到人的时候她会空等，除非她是丰娆那种人（她会改去别处）'
