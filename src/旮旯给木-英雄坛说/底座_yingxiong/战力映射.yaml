# NPC 战力 → 品质档 的映射
#
# ★ 为什么需要：NPC 档案里的「战力」是**描述档**（顶级 / 掌门以上 / 低至中…），
#   不是数字。面板要按品质档上色、英雄榜要按战力排名，都需要先归一成数值。
#
# ★ 出处：参考项目「火影」的做法 —— AI 写的东西天然不规范，
#   **每个字段都要多认几种写法**（它的 RANK_ALIASES / STAT_FIELDS 就是这么干的）。

战力映射:
  说明: '描述档 → 品质档（同时给一个数值强度，供英雄榜排序）'

  # 键 = 档案里可能出现的写法（一个档可以认多种）
  表:
    - { 档: q5, 强度: 90, 认: ['顶级', '绝顶', '天下第一', '深不可测', '无人能敌', '传说'] }
    - { 档: q4, 强度: 70, 认: ['掌门以上', '掌门级', '宗师', '绝顶高手', '一时之选'] }
    - { 档: q3, 强度: 50, 认: ['高', '较高', '一流', '高手', '好手', '精英'] }
    - { 档: q2, 强度: 34, 认: ['中上', '中高', '略高'] }
    - { 档: q1, 强度: 22, 认: ['低至中', '中', '中等', '一般', '寻常'] }
    - { 档: q0, 强度: 8,  认: ['低', '很低', '普通', '杂鱼', '不会武', '凡人', ''] }

  # 没写战力的，按「身份」推（54 人没写 —— 多是镇上的店铺伙计、村妇、官员）
  按身份:
    - { 档: q3, 强度: 50, 认: ['掌门', '教主', '坛主', '帮主', '盟主', '宗师', '长老', '护法'] }
    - { 档: q2, 强度: 34, 认: ['教头', '师傅', '师父', '师兄', '师姐', '弟子', '门人'] }
    - { 档: q1, 强度: 22, 认: ['护卫', '捕快', '兵', '镖师', '打手', '江湖人'] }
    - { 档: q0, 强度: 8,  认: ['老板娘', '老板', '掌柜', '伙计', '小二', '厨', '掌柜', '商贩', '农夫', '村妇', '婆婆', '老翁', '官', '县令', '书吏', '医', '郎中小二'] }

  默认: { 档: q0, 强度: 8 }
