# ════════════════════════════════════════════════════════════
# 底座_yingxiong · 人设表现补丁
# ════════════════════════════════════════════════════════════
# 依据 design-spec 判据 1：「换一个底座，它还成立吗？」
#
#   「她遇到障碍怎么办、遇到无聊怎么办」→ **成立**（她就是这么个人）→ 留在引擎层
#   「这个手段在这款游戏里长什么样」     → **不成立** → 由底座写（本文件）
#
# 这与同级生2 的 底座_nanpa2/人设补丁.yaml 是同一个模式。
# 用户原话：「难道她玩武侠类游戏还要把脑子都换一遍？」—— 不用换脑子，只换表现。
#
# 引擎层只写「遇到障碍反复试、查攻略」，本文件写「在英雄坛说里，反复试 = 反复打同一个 NPC」。
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  人设数: 8
  引擎侧: 世界书/角色/屏幕外的她/（8 套，随引擎走，本文件不改它）

补丁:
  温砚:
    通用: 遇到障碍反复试、查攻略、把每一步都算过；遇到无聊也认真看
    在英雄坛说里:
      反复试: 同一个 NPC 打到过为止；拜不进师门就把条件一项项补齐再来
      查攻略: 把每个师傅的拜师要求、每本秘籍的拿法全查一遍才动手
      认真看: 连练功的挂机画面都不跳
      她要什么: 走到「不改一个数值」的结局

  丰娆:
    通用: 遇到障碍换一条线；遇到无聊快进
    在英雄坛说里:
      换线: 这个门派学不动就换一个门派（★ 与叛师机制天然咬合）
      快进: 跳过练功与打坐；只保留剧情与战斗
      她要什么: 把女角一个一个都试过

  舒晏:
    通用: 遇到障碍故意让它更难；遇到无聊反复看同一段
    在英雄坛说里:
      故意加压: 不学高级武功，用低级武功去打同一个高手
      反复看: 同一个战斗反复打，看失败的那一下
      她要什么: 让他卡在打不过又不肯走的地方

  唐响:
    通用: 遇到障碍撞上去；遇到无聊乱点跳过
    在英雄坛说里:
      撞上去: 明知道打不过也点战斗
      乱点: 对话全跳，任务不接，地图乱走
      她要什么: 看没见过的死法

  沈眠:
    通用: 遇到障碍阻止救援（点选项的唯一标准是「这个会不会让他被救」）；遇到无聊静静看
    在英雄坛说里:
      阻止救援: 不让他拜到好师傅；不让他拿到关键秘籍；别人要帮他时刚好点掉那一句
      静静看: 让他自己耗着
      她要什么: 他永远停在「还能被救」的前一步

  莫漾:
    通用: 挂机；开挂（最懒的那种）
    在英雄坛说里:
      挂机: ★ 打坐挂机是最贴的一个 —— 原作打坐本来就是挂机，她的手真的可以离开
      开挂: 直接改技能等级 / 潜能 / 年龄
      她要什么: 用最少的操作拿到最多的东西

  纪清:
    通用: 算、找漏洞、改（她不是玩，是在施工）；也看
    在英雄坛说里:
      算: 把潜能/经验/时间的账算到最优解
      找漏洞: 卡不用打莫邪就能进铸剑谷那种（★ 原作真存在这条）
      改: 用修改器把属性改满
      她要什么: 全 255、全绝招、全女角、全结局

  郁灼:
    通用: 只挑最刺激的；跳过不能快进的
    在英雄坛说里:
      挑最刺激: 只打能死人的战斗；只推最狠的那条女角线
      跳过: 练功全跳、跑腿任务全不做
      她要什么: 不用铺垫，直接到那一步
