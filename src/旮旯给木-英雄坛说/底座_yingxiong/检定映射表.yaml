# 检定映射表 · 杂项检定怎么套用判定
#
# ★ 来源：参考项目「主神空间」的《杂项检定映射表》
# ★ 它不是新系统，是**映射** —— 把一个具体行为（开箱/说服/求爱…）
#   映射到「普通检定 or 对抗检定」，并给出四件事：
#     ① 用哪个属性   ② 是不是对抗   ③ 有没有好感修正   ④ 后果挂哪
#
# ★ 在我们这里：谁在检？
#   · 战斗与日常 → `<user>`（面板给按钮）
#   · 社交/求爱  → `<user>` 的社交动作（也走对抗检定）
#   · 她的选择   → 不走这张表（她的选项由她自己挑）

检定:
  # ── 基础两类 ──
  普通: '人 vs 固定难度 —— 走 judge()'
  对抗: '人 vs 会抵抗的对手 —— 走 judgeContest()'

  # ★ 我方属性取的是**六维**（膂力/敏捷/根骨/悟性 + 容貌/福缘）
  六维说明: '本卡没有独立的"感知/意志"项 → 统一用【悟性】兼任心智与识破'

  表:
    - { 检定: 开锁,     方式: 普通, 我方: 敏捷, 对方: '', 好感: 无, 后果: '大成功额外掉落；失败触发机关；大失败锁死' }
    - { 检定: 拆机关,    方式: 普通, 我方: 敏捷, 对方: '', 好感: 无, 后果: '大失败机关走火' }
    - { 检定: 潜行,     方式: 对抗, 我方: 敏捷, 对方: 悟性, 好感: 无, 后果: '输被发现 → 进战斗' }
    - { 检定: 搜查,     方式: 普通, 我方: 悟性, 对方: '', 好感: 无, 后果: '成功得线索' }
    - { 检定: 说服,     方式: 对抗, 我方: 容貌, 对方: 悟性, 好感: 有, 后果: '立场改变，好感 ±' }
    - { 检定: 威吓,     方式: 对抗, 我方: 膂力, 对方: 根骨, 好感: 有, 后果: '屈服或激怒' }
    - { 检定: 欺骗,     方式: 对抗, 我方: 容貌, 对方: 悟性, 好感: 无, 后果: '被拆穿则好感 −−' }
    - { 检定: 求爱,     方式: 对抗, 我方: 容貌, 对方: 悟性, 好感: 主导, 门槛: 20, 后果: '关系推进，好感大幅 ±' }
    - { 检定: 砍价,     方式: 对抗, 我方: 容貌, 对方: 悟性, 好感: 有, 后果: '价格浮动' }
    - { 检定: 医术,     方式: 普通, 我方: 悟性, 对方: '', 好感: 无, 后果: '成功止血疗伤' }
    - { 检定: 辨认,     方式: 普通, 我方: 悟性, 对方: '', 好感: 无, 后果: '成功认出人或物' }
    - { 检定: 轻功赶路,  方式: 普通, 我方: 敏捷, 对方: '', 好感: 无, 后果: '成功省时；大失败崴脚' }
    - { 检定: 硬扛,     方式: 普通, 我方: 根骨, 对方: '', 好感: 无, 后果: '成功扛住；大失败受伤' }
    - { 检定: 喝酒,     方式: 对抗, 我方: 根骨, 对方: 根骨, 好感: 有, 后果: '谁先倒' }

  # ★ 好感修正（社交类用）
  好感修正:
    - { 档: 敌对, 修正: -20 }
    - { 档: 冷淡, 修正: -10 }
    - { 档: 中立, 修正: 0 }
    - { 档: 友好, 修正: +10 }
    - { 档: 亲密, 修正: +20 }
    - { 档: 挚爱, 修正: +30 }

  # ★★ 求爱门槛
  求爱门槛: 20
  求爱门槛说明: |
    ★ 好感低于 20 时，求爱**直接极难或必败** —— 防一上来硬求爱靠运气成功。
    出处：主神空间的原文。

  # ★ 对抗检定的强度差（谁的底子更厚）
  强度差说明: |
    对抗检定 = **绝对强度差 + 相对修正差**（两个都要算）。
    ★ 只算相对修正会丢掉绝对强弱 ——
      全 2 的杂鱼和全 500 的神，相对修正都 ≈ 0。
    强度分来源：武功总评 / 阶位 / 战力档。
