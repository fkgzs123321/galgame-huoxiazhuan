# ════════════════════════════════════════════════════════════
# 底座_yingxiong · T1 时间表
# ════════════════════════════════════════════════════════════
# 格式遵循 引擎模板/机制层规范.md 的 T1（时间表）。
# 本表是「英雄坛说 = 年龄主轴 + 两年倒计时」的落地。
#
# 原作依据（见 底座_yingxiong/原作资料.md §七）：
#   · 出生 14 岁；游戏中一年长 1 岁
#   · 打坐 / 练功是「挂机过程」，时间计入岁数
#   · 喝一瓶女儿红 → 时间流逝 3 个月
#   · 年龄 +1 → 血量 +20、内力 +20；30 岁后不加血，60 岁后不加内
#   · 年龄越大，运气越差、出手越先
#   · 结婚门槛 18 岁（英雄坛回忆站）/ 20 岁（黄金版、复刻版）
#   · 「必须在两年之内搞定她，否则她就跟别人跑了」
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  来源: 英雄坛说（文曲星 / 黄金 / 白金 / RMXP 复刻）
  模型: 年龄主轴 + 两年倒计时

时间:
  单位: 行动
  单位说明: 打坐一次 / 练功一次 / 请教一次 / 做一次任务 / 走一趟远门，各算一次行动
  单位换算: '1 行动 ≈ 3 日（★ 原作未明示，这是我们定的默认值，可调）'
  大单位: 月
  月含日数: 30
  大单位数: 12
  更大单位: 年
  起点年龄: 14
  推进者:
    操控者: true
    日历: true
    系统: false
  不可阻挡: 日历
  显示: [岁数, 月, 耐心剩余月数]

时间触发器:
  - 名: 月结算
    时机: 每跨过 1 月
    动作:
      - 女角好感度自然衰减（若该月未与她互动）
      - 耐心剩余月数 -1
      - 任务冷却重置
    可见: 状态栏（月）

  - 名: 年结算
    时机: 每跨过 12 月
    动作:
      - 年龄 +1
      - 若年龄 ≤ 30 → 生命上限 +20
      - 若年龄 ≤ 60 → 内力上限 +20
      - 若年龄 ≥ 22 → 停止「未成年人」分支（菜花宝典、部分任务不可再触发）
      - 运气 -1（年龄越大运气越差）
      - 出手顺位 +1（年龄越大出手越先）
    不可逆: true
    可见: 状态栏（岁数）
    意义: '**年龄是这张卡的第二根倒计时**：它一边给你成长（血/内力），一边收走机会（运气/未成年分支）'

  - 名: 期限到期
    时机: 某个女角的「耐心」归零
    动作:
      - 该女角线关闭（好感度锁死、不可再攻略）
      - 她的目的进度按该女角权重扣减
      - 世界提示一次（她跟别人跑了）
    不可逆: true
    可见: 状态栏（该女角的期限）
    意义: '**逼玩家做取舍**：两年内不可能全收，必须先挑'

她:
  说明: '操控者的状态（引擎级，所有底座共用，本表只登记英雄坛说的取值）'
  熟练度:
    范围: [新手, 上手, 沉浸, 狂热, 收官]
    初值: 新手
    增长: 累计游玩时长 / 关卡数
    意义: 决定她的手段用得有多熟、以及她挑选项的攻击性
  兴奋度:
    范围: 0 ~ 100
    初值: 0
    衰减: 每层少量回落
    意义: 兴奋度高时她注意不到异常（= 反抗更容易成功，但后果更重）
  反抗值:
    范围: 0 ~ 100
    初值: 100
    增长: 缓慢自然回复
    消耗: '微 3~5 / 中 10~15 / 强 25~35 / 极 50+'
    意义: 玩家唯一的反抗资源
  已用手段:
    类型: 记录表（record）
    内容: '[挂机, 快进, 反复看, 故意加压, 阻止救援, 开挂, 跳过]'
    意义: 决定她的行为模式漂移；也是「世界的裂缝」的输入
  世界的裂缝:
    范围: 0 ~ 100
    初值: 0
    增长: 每次她开挂 +N
    阈值: [ {≥30: 女角记忆开始错乱}, {≥60: 时间跳变}, {≥90: 矛盾事实并存且所有人都当真} ]
    不可逆: true
    意义: '**她作弊的账单，记在 <user> 头上**'
