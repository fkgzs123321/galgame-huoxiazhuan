# ── 各类东西怎么定品级（★ 规则由契约给，引擎不认识「武功」「丹药」这些词）──
品级判定:
  兵器衣裳:
    规则: '按价格折算：加成 = 价格 ÷ 100；价格本身决定档位'
    分界: { 凡品: '100 文以下', 良品: '100 ~ 2000 文', 上品: '2000 ~ 10000 文', 精品: '10000 ~ 50000 文', 极品: '50000 文以上' }
  武功:
    规则: '按师承层级与门派地位'
    分界: { 良品: '入门基本功', 上品: '门派主力功法', 精品: '进阶功法', 极品: '镇派绝学' }
  绝招:
    规则: '按条件严苛度（几门同时达到多少级）'
    分界: { 上品: '单条件', 精品: '双条件', 极品: '三门以上同时到位' }
  任务:
    规则: '按前置门槛与后果重量'
    分界: { 良品: '日常，无门槛', 上品: '有前置条件', 精品: '涉及不可逆的关系变化', 极品: '输了会死，或永久关闭一条线' }
  丹药材料:
    规则: '按获取难度'
    分界: { 良品: '镇上买得到', 上品: '要打特定的人', 精品: '要走到深处才捡得到', 极品: '只有隐藏线才有' }
  NPC:
    规则: '战力档直接对到品质档'
    分界: { 凡品: 100, 良品: 300, 上品: 1000, 精品: 10000, 极品: 30000, 绝品: 50000 }

品质图例说明: '★ 颜色顺序是行业共识：灰 < 白 < 绿 < 蓝 < 紫 < 橙 < 金。玩家看颜色就知道好坏，不用读字。'

掉落修正:
  影响字段: 福缘
  每点权重: 0.02
  上限: 3
  说明: '福缘越高，高档位权重越高（低档被稀释）。★ 原作「福缘影响掉落」就是这一条'

# ── E8-c 强化（自制兵器专属）──

# ── 装备强化（已有，补说明）──
强化说明: '★ 装备强化：拿材料往一件装备上叠层。层数越高加成越大，但每层更贵。上限 10 层。'

# ── 技能强化（★ 新增，与装备强化同一个形状）──
技能强化:
  上限: 10
  每层效果: 0.05
  每层材料: { 灵石: 2, 铁: 1 }
  递增: '第 N 层要 灵石 × 2 × N'
  说明: '★ 技能强化与装备强化是同一个形状（拿材料叠层、层数封顶、每层递增），
    只是作用对象不同：一个加「这门功夫判定时的强度」，一个加「这件装备的加成」。
    —— 这也是「强化」该在引擎层而不是分别写两套的原因。'
  作用: '每层给该技能的判定强度 +5%（在 判定引擎 的 P 值上乘算）'

