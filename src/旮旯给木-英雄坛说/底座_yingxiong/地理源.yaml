平安镇:
  范围: 村东 / 村西 / 村北 / 南郊 / 商业街 / 小菜场
  概览: 大陆中心的一座小镇。所有人第一次睁眼都在这里。武馆、客栈、当铺、裁缝店、兵器铺、药店、赌馆、衙门都在几条街上。
  可做的事: 接活挣钱 / 买药买衣 / 打听消息 / 钓鱼换钱 / 在衙门接除恶
  谁在这儿: 何铁手 / 潘小莲 / 卖花妞 / 阿庆嫂 / 中年妇人 / 老婆婆 / 神秘女子
  关键词: [平安镇, 村东, 村西, 客栈, 衙门]

玉女峰:
  范围: 房屋一 / 房屋一大厅 / 内屋 / 房屋二 / 后院 / 塔楼 / 塔楼花园
  概览: 花间派所在。满山的花，房子藏在花里。门规只收女性，可山道并不拦男人。
  可做的事: 拜访 / 切磋 / 学艺（限女性） / 在塔楼花园看花
  谁在这儿: 李青照 / 公孙大娘 / 聂隐娘 / 红拂女 / 柳如是 / 李师师 / 薛涛 / 绿珠 / 桑轻虹 / 阿绣 / 唐晚词 / 入画 / 小红 / 听琴 / 司棋 / 侍书 / 茶花女 / 平婆婆 / 瑞婆婆 / 史婆婆
  注: 男性进不了门派内部，但峰上这些人是能见到的。所以男性的花间武学只有从她们身上学这一条路
  关键词: [玉女峰, 花间派, 玉女, 塔楼]

武当山:
  范围: 山脚 / 三清殿 / 练功场 / 山间盆地
  概览: 太极门所在。台阶一层一层往上，越往上越静。半山腰右拐下去有一处盆地。
  可做的事: 拜访 / 拜师 / 切磋 / 在山间盆地翻找
  谁在这儿: 古松道长 / 苍月道长 / 清虚道长 / 桃花
  注: 山间盆地有一页纸。十六岁以下、没拜过师、戴着眼罩、身上背着案子的人才拿得到
  关键词: [武当山, 太极门, 武当, 山间盆地]

大雪山:
  范围: 山脚 / 山腰 / 山顶 / 雪山教场
  概览: 雪山派所在。长年积雪，风一过就没人影。
  可做的事: 拜访 / 拜师 / 切磋 / 在山脚采耐寒的小花
  谁在这儿: 雪山教头 / 封万剑 / 白瑞德 / 薛千柔 / 花千红 / 史婆婆 / 阿绣
  关键词: [大雪山, 雪山派, 雪山]

商家堡:
  范围: 房间一 / 房间二 / 房间三 / 大堂 / 内厅
  概览: 八卦门所在。堡里人不多，钱不少。有人穷得叮当响，有人出手就是几万。
  可做的事: 拜访 / 拜师 / 切磋 / 在大堂内厅见掌门
  谁在这儿: 商宝震 / 商剑鸣 / 王维扬 / 商老太 / 马春花 / 商宝霞
  关键词: [商家堡, 八卦门, 商家]

五指山:
  范围: 山道 / 教坛 / 坛内
  概览: 红莲教所在。教众穿各色衣服，站的位次按颜色分。
  可做的事: 拜访 / 拜师 / 切磋
  谁在这儿: 方长老 / 余鸿儒 / 王璁儿 / 唐思儿
  关键词: [五指山, 红莲教, 红莲]

冰火岛:
  范围: 渡口 / 忍者学院 / 东厢 / 乱石礁
  概览: 伊贺谷所在。一边是热泉一边是雪，岛如其名。
  可做的事: 拜访 / 拜师 / 切磋 / 在渡口打听
  谁在这儿: 腾王丸 / 花十郎 / 和仲阳
  关键词: [冰火岛, 伊贺, 伊贺谷]

黑森林:
  范围: 林口 / 深处 / 第二间屋子
  概览: 兽王派所在。越往里越不见天。第二间屋子里住着两口子，会铸兵刃。
  可做的事: 拜访 / 拜师 / 切磋 / 找干将铸剑（经验十五万以上才够）
  谁在这儿: 华佗 / 北海鳄神 / 娜可露 / 干将 / 莫邪
  关键词: [黑森林, 兽王派, 干将, 铸剑]

灵心观:
  范围: 观门 / 前殿 / 后屋
  概览: 茅山派所在。观里烧的香味道很淡。这里的人不婚娶。
  可做的事: 拜访 / 拜师 / 切磋 / 给后屋那个人捐钱
  谁在这儿: 葛洪 / 留孙真人 / 茅盈 / 明月
  关键词: [灵心观, 茅山派, 茅山]

随机地图:
  范围: 入口 / 左一片 / 右一片 / 房子 / 山洞 / 野外
  概览: 从矿洞右边的路标进去。地形与道路每次都不同，走过的路不认第二次。
  可做的事: 找月老说亲 / 找赤脚道人拜师 / 找易容师改模样 / 撞见平时撞不见的人
  注: 里面有几处固定的地方，华山、塞外龙门客栈、生死门。想退回入口只需一直往左走
  关键词: [随机地图, 月老, 赤脚道人, 易容师]
