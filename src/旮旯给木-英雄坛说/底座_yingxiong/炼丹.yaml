# 炼丹（丹房）
#
# ★ 来源：参考项目「姬侠传」的炼丹小游戏（`alchemy.html`）——同题材同形态，
#   这套设计的价值在于：**温度是资源+风险（高倍率 vs 炸炉）、完成度与品质此消彼长**，
#   逼玩家做取舍，而不是无脑点。
#
# ★ 它是纯前端算的（不花 AI 额度），AI 只负责把结果写成正文。
#   与我们的「判定引擎」同一个原则：数值前端算，AI 只读结论。
#
# ★ 摆在引擎层还是底座层？—— 判据「换底座还成立吗」：
#   炉温/品质/完成度的**机制**是通用的 → 引擎层
#   但「丹参/当归/没药/沉香」这四味药是**英雄坛说的内容** → 本文件（底座）

炼丹:
  在哪: 丹房（门派驻地内，★ 只在驻地里能炼 —— 同参考项目的「据点」概念）
  频次: 每周一次
  药材需求: 6 ~ 10 个（投入越多，起手品质越高）

  三个数:
    炉温: { 范围: '0 ~ 100+', 危险线: 100, 说明: '超过 100 直接炸炉，全部损失' }
    品质: { 范围: '0 ~ 100', 说明: '决定最终产出等级' }
    完成度: { 范围: '0 ~ 100', 说明: '到 100 即炼丹完成，可以取丹' }

  起手: '初始品质 = (投入药材数 − 6) × 5'
  操作次数: 15

  # ★ 倍率随炉温变：温度越高效率越高，但越接近炸炉
  炉温倍率:
    - { 区间: '0 ~ 30',   倍率: '0.3 ~ 0.5', 区: 低效 }
    - { 区间: '31 ~ 70',  倍率: '0.5 ~ 1.0', 区: 稳定 }
    - { 区间: '71 ~ 100', 倍率: '1.0 ~ 1.8', 区: '高效但危险' }

  五种操作:
    - { 名: 猛火, 炉温: '+25 ~ +35', 品质: '−5 ~ −2',   完成度: 0,          说明: '快速升温，略伤品质' }
    - { 名: 文火, 炉温: '+5 ~ +10',  品质: '+3~+6 ×倍率', 完成度: '+4~+8 ×倍率', 说明: '微调温度，稳中有进' }
    - { 名: 投药, 炉温: '−15 ~ −5',  品质: '+2~+4 ×倍率', 完成度: '+8~+15 ×倍率', 说明: '降温，大幅提完成度' }
    - { 名: 冷凝, 炉温: '−30 ~ −20', 品质: '+8~+12 ×倍率', 完成度: '+0~+2',    说明: '大幅降温，提品质' }
    - { 名: 淬炼, 炉温: '+5 ~ +10',  品质: '+5~+8 ×倍率', 完成度: '−10 ~ −5',  说明: '★ 提品质，但降完成度（取舍）' }

  丹炉状态:
    - { 炉温: '< 30',   名: 冷寂, 说明: '效率低' }
    - { 炉温: '30 ~ 70', 名: 正常, 说明: '最佳区间' }
    - { 炉温: '71 ~ 90', 名: 炽热, 说明: '高效，需注意降温' }
    - { 炉温: '> 90',   名: 将炸, 说明: '★ 危险，赶紧冷凝' }
    - { 炉温: '> 100',  名: 炸炉, 说明: '失败，药材全损' }

  # ★ 四味药（英雄坛说的内容 —— 这一节才是底座该填的）
  药材:
    - { 名: 丹参, 对应: 膂力, 价: 500 }
    - { 名: 当归, 对应: 悟性, 价: 500 }
    - { 名: 没药, 对应: 根骨, 价: 500 }
    - { 名: 沉香, 对应: 敏捷, 价: 500 }

  产出:
    - { 品质: '100',   丹: 九转金丹, 档: 绝品, 效果: '指定属性 +3' }
    - { 品质: '90~99', 丹: 易筋丹,   档: 极品, 效果: '随机属性 +2' }
    - { 品质: '75~89', 丹: 培元丹,   档: 精品, 效果: '随机属性 +1' }
    - { 品质: '50~74', 丹: '普通丹药', 档: 上品, 效果: '随机得 大力丸/筋骨贴/金疮药/霹雳丸 之一' }
    - { 品质: '< 50',  丹: '（无产出）', 档: 凡品, 效果: '白费一批药材' }

  # ★ 11 种随机事件（变数来源）
  随机事件:
    - { 类: 负面, 名: 寒潮, 标: '❄️', 效果: '炉温 −15，下次猛火减半' }
    - { 类: 负面, 名: 淤积, 标: '🚫', 效果: '下次冷凝失效' }
    - { 类: 负面, 名: 反噬, 标: '🔥', 效果: '每轮品质 −5，持续 3 轮' }
    - { 类: 负面, 名: 心魔, 标: '😵', 效果: '下次波动翻倍' }
    - { 类: 正面, 名: 祥瑞, 标: '✨', 效果: '品质 +15' }
    - { 类: 正面, 名: 顿悟, 标: '💡', 效果: '下次不耗操作次数' }
    - { 类: 正面, 名: 风助, 标: '🌪️', 效果: '下次猛火效果 ×2.5' }
    - { 类: 正面, 名: 护主, 标: '🛡️', 效果: '抵挡一次炸炉' }
    - { 类: 中性, 名: 沸腾, 标: '♨️', 效果: '所有效果翻倍，持续 2 轮' }
    - { 类: 中性, 名: 阴火, 标: '🔄', 效果: '下次温度变化反转' }
    - { 类: 中性, 名: 凝丹, 标: '💎', 效果: '倍率锁定 1.5x，持续 2 轮' }
  事件概率: 每次操作 15%

  炼丹要诀:
    - 控温优先 —— 炉温守在 40~70，兼顾效率与安全
    - 冷凝救命 —— 炉温逼近 90 就用冷凝
    - 品质优先 —— 完成度够了就多用淬炼
    - 看事件 —— 正面事件能大幅提效，负面要及时应对
    - 药材配比 —— 想提哪个属性就多投哪味药

变量什么时候变（★ 从变量的更新规则挪来：炼丹是面板算的，AI 只看结果，不必每层都想）:
  # ── 炼丹：三个数都由面板算，AI 只认结果 ──
  炼丹.炉温.什么时候变: 面板炼丹页操作时改（猛火 +25~35 / 小火 +8~12 / 搅动 ±0 / 封炉 −15）
  炼丹.炉温.边界: ★ 超 100 直接炸炉：药材全损、在炼什么写空、完成度归零
  炼丹.品质.什么时候变: 面板炼丹页操作时改
  炼丹.完成度.什么时候变: 面板炼丹页操作时改，到 100 可取丹
  炼丹.在炼什么.什么时候变: 投入药材开炉时写丹方名；取丹或炸炉后写成空串
  炼丹.本周炼过.什么时候变: 开炉时写 true；跨周（时间.月 变化）时面板自动清成 false
  炼丹.上次产出.什么时候变: 取丹时写上一炉出了什么
