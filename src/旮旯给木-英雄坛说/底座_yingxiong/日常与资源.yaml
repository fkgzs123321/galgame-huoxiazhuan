# 日常与资源（体力 / 行动点 / 记忆点 / 天赋效果）
#
# ★ 来源：参考项目「姬侠传」（同题材武侠养成酒馆卡）
# ★ 判据「换底座还成立吗」：
#   体力/行动点/记忆点这套**机制**是通用的（任何养成底座都要）
#   → 机制在引擎层（判定引擎的 judgeAction / judgeProc）；
#     本文件是**参数**，每个底座自己填。

日常:
  时间单位:
    一年: 48 周
    一月: 4 周
    说明: '★ 可配。换底座时改这里，引擎不写死'
  每周行动点: 3
  跳过一周:
    动作: ['时间推进一周', '行动点重置', '重置每周一次的互动（送礼/切磋）', '可能触发事件']

  体力:
    范围: '0 ~ 100'
    上限: 100
    作用: '★ 是【乘法因子】—— 它低，所有日常行动的成功值都会被压低'
    恢复: '休息一次 +30 ~ 50（按地点品质）'
    消耗来源: '每个日常行动结束时按结果扣（大成功 0 / 成功 5 / 一般 10 / 失败 15 / 大失败 20）'
    公式: '见 判定引擎.txt 的 judgeAction()'
    意义: |
      ★ 这套设计的巧妙在「成功度 = 体力消耗」：
      成功省体力、失败费体力 → **越弱越累**（正负反馈闭环）。
      玩家会自然地"体力低时先休息"，而不是无脑刷。

  记忆点:
    公式: '最大记忆点 = 学识 ÷ 20（向下取整）'
    占用: '每个已装备的技能按等级占 1 ~ 3 点'
    规则: '超过上限时无法装备新技能，须先卸下'
    意义: |
      ★「学过」不等于「带上」。这让"学识"从废属性变成关键的容量资源。
      对应我们的「技能装备槽」—— 现在我们的技能是学了就永久生效。

# ★★ 天赋的触发式效果（不是"加数值"，是"按概率触发特殊效果"）
#    来源：姬侠传的「心性→概率免费行动 / 魅力→概率好感翻倍」
#    要点：① 玩家能感知到触发（有提示）② 只放大好的、不放大坏的
天赋效果:
  - 名: 膂力
    对应: '打铁 / 练武'
    触发: '做完力气活后，按其值的概率额外产出一份'
    概率: '膂力 ÷ 2 (%)'
    文案: '膂力过人，这一趟多出了一份'
  - 名: 敏捷
    对应: '探索 / 轻功类'
    触发: '探索时按其值的概率避开一次麻烦（不进入遭遇判定）'
    概率: '敏捷 ÷ 2 (%)'
    文案: '身法快，那点动静被他先听见了'
  - 名: 根骨
    对应: '休息 / 抗伤'
    触发: '休息时按其值的概率多回一份体力'
    概率: '根骨 ÷ 2 (%)'
    文案: '底子厚，歇一趟就缓过来了'
  - 名: 悟性
    对应: '学习 / 请教'
    触发: '请教时按其值的概率【不消耗潜能】'
    概率: '悟性 ÷ 2 (%)'
    文案: '一下子想通了，这一层没花力气'

天赋效果说明: |
  ★ 四条都遵守两条：
    ① 触发时有明确提示（玩家能感知到"我的属性起作用了"）
    ② 只放大好的，不放大坏的（失败时不会因为属性低而更糟）
  ★ 概率公式统一为 `属性值 ÷ 2 %`（走 判定引擎.txt 的 judgeProc()）

据点:
  说明: '★ 来源：主神空间的「乐园」概念 —— 某些功能只有回到据点才能用'
  英雄坛说的据点: ['本派驻地', '各派驻地的客栈']
  只在据点可用: ['请教（拜师学艺）', '强化（兵器与武功）', '炼丹', '打坐恢复']
  不在据点: ['赶路中', '任务世界里', '受伤未愈时']
  表现: '入口变灰 + 提示「须回驻地」'
  意义: |
    ★ 让"地点"有功能意义，不只是背景描述。
    玩家会自然形成"回山门处理事务、下山就是冒险"的节奏。
