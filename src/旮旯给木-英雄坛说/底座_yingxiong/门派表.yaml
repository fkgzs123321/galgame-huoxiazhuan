# ════════════════════════════════════════════════════════════
# 叛师（★ 用户定案：借《暴走英雄坛》那套移植进来）
# ════════════════════════════════════════════════════════════
# ⚠️ 声明：文曲星原版**没有**叛师机制。原文只写了「一旦拜师或者自创门派后，
#    将不能再去偷师学艺或者学习秘籍了」= 一次性选择。本条是用户拍板移植的设计，
#    出处是手游《暴走英雄坛》。写进条目时必须按「设计」而非「原作」表述。
# ════════════════════════════════════════════════════════════
叛师:
  触发: '杀同门师兄弟（或本门 NPC）使师傅好感度降到「恨之入骨」，再与师傅对话'
  好感度五档: [恨之入骨, 冷若冰霜, 态度平和, 一见如故, 热情如火]
  代价:
    - '门派武功全部作废（等级清零）'
    - '所有基本武功 -50 级'
    - '已消耗的潜能不返还'
    - '该门派永久不可再入（记入 场景.已叛门派）'
  意义: '★ 换门派 = 换女角线的第二周目玩法。代价够重，所以这是一次真实的选择'
  本卡适配: '叛师后可以投另一个门派 → 那条门派线上原本见不到的女角全部解锁；代价是五十级基本功，等于把成长重走一遍'

# ════════════════════════════════════════════════════════════
# 功法逐级：一个功法从 1 级到 255 级，中间有哪些台阶
#   节点全部有出处：
#     10 级 = 反哺第一点（C2）｜20 级 = 师承门槛（门派表）｜30 级 = 练功省潜能（C1）
#     80 / 100 / 120 = 绝招三档（门派表）｜250 = 常规上限｜255 = 需石碑突破（C1）
#   这里写「到那个节点能感觉到什么」，不写具体数值（数值由成长公式算）
# ════════════════════════════════════════════════════════════
功法逐级:
  通用节点:
    - { 级: 10,  什么: '该功法对应的天赋 +1（反哺第一点）', 出处: 'C2 反哺回路' }
    - { 级: 20,  什么: '能过最低一档师承门槛', 出处: '门派表·师承' }
    - { 级: 30,  什么: '练功可以开始省潜能（基本武功等级 > 门派武功等级 才能练）', 出处: 'C1 练功条' }
    - { 级: 80,  什么: '第一档绝招开的线', 出处: '门派表·绝招' }
    - { 级: 100, 什么: '第二档绝招', 出处: '门派表·绝招' }
    - { 级: 120, 什么: '第三、四档绝招（该门最强的几招）', 出处: '门派表·绝招' }
    - { 级: 250, 什么: '常规上限，再往上要突破', 出处: 'C1 等级范围' }
    - { 级: 255, 什么: '★ 要去侠客岛找石碑才过得去（门派武功找本门石碑，基本武功找小虾石碑）', 出处: 'C1 突破上限的条件' }

  各类功法的感觉:
    拳脚:
      - '低段：出手快，但打在硬东西上自己发麻'
      - '中段：能连着出，也收得住'
      - '高段：一下能把人打得站不住'
    剑法 / 刀法:
      - '低段：快，但收势不稳'
      - '中段：能连成一套，破绽在换手那一下'
      - '高段：出手之前对手已经在躲了'
    内功:
      - '★ 特殊：只能靠请教，不能练功'
      - '低段：内力蓄存涨得快'
      - '中段：真气满了强度永久涨一截（涨上去就不下来）'
      - '高段：能以内力对拼（震字诀那一类）'
    轻功 / 身法:
      - '低段：跑得快，跳得高'
      - '中段：闪避开始有实际作用'
      - '高段：出手之前先到，收手之后才被看见'
    知识类（读书写字）:
      - '★ 特殊：靠钱与时间，不靠潜能'
