# 战斗系统（七行动 · 克制链 · 场地 · 敌人风格）
#
# ★ 来源：参考项目「姬侠传」（同题材武侠养成的回合制战斗）
# ★ 为什么改：我们原来的战斗是「数值对比 + 骰子」——**结果由数值决定，玩家没得选**。
#   这一套是「**选行动 → 克制关系 → 结算**」——**选择决定结果**，玩家每回合都有事做。
# ★ 它在引擎层（机制通用），本文件填参数与内容。
#
# 判据（面板职责边界）：战斗行动属于「<user> 侧的动作」→ 面板可以给按钮。

战斗:
  气:
    上限: 10
    初始: 0
    每回合自动回复: 0       # 只能靠「集气」
    意义: '★ 气是资源。绝招要 5 点 → 必须攒 → 攒的时候有风险'

  行动:
    - { 名: 集气,  键: Q, 耗气: 0, 效果: '气 +1', 性质: 蓄 }
    - { 名: 防御,  键: W, 耗气: 0, 效果: '本回合大幅减伤', 性质: 守 }
    - { 名: 轻攻击, 键: E, 耗气: 1, 伤害: 1.0, 效果: '100% 基础伤害', 性质: 攻 }
    - { 名: 重攻击, 键: R, 耗气: 2, 伤害: 1.5, 效果: '150% 基础伤害', 性质: 攻 }
    - { 名: 绝招,  键: T, 耗气: 5, 伤害: 3.0, 效果: '300% 基础伤害，且无视防御', 性质: 攻 }
    - { 名: 嘴炮,  键: Y, 耗气: 0, 效果: '挑衅：使对方无法防御 / 无效化绝招', 性质: 扰 }
    - { 名: 道具,  键: U, 耗气: 0, 效果: '使用一件战斗道具', 每场限: 1, 性质: 辅 }

  # ★ 克制链：石头剪刀布式的关系。这是整套战斗的深度来源
  克制:
    - { 由: 防御,   制: 轻攻击, 效果: '大幅减伤（见下表）' }
    - { 由: 防御,   制: 重攻击, 效果: '减伤（见下表）' }
    - { 由: 重攻击, 制: 轻攻击, 效果: '无效化对方轻攻击，并照常造成伤害' }
    - { 由: 绝招,   制: 轻攻击, 效果: '无效化' }
    - { 由: 绝招,   制: 重攻击, 效果: '无效化' }
    - { 由: 绝招,   制: 防御,   效果: '★ 无视防御减伤（绝招打防御照样满伤）' }
    - { 由: 嘴炮,   制: 绝招,   效果: '无效化对方绝招的伤害' }
    - { 由: 嘴炮,   制: 防御,   效果: '破防：对方气 −1，并进入挑衅状态' }

  防御减伤:
    轻攻击: 0.15      # 被防御时只受 15%
    重攻击: 0.25
    绝招: 1.0         # 无视防御

  挑衅:
    持续: 2 回合
    效果: ['无法使用防御', '气 −1（若有）']

  # ★ 场地效果：持续 3 回合，对双方都生效 —— 改变战局规则，而非单纯加 buff
  场地效果:
    - { 名: 杀意, 标: '🔥', 效果: '双方伤害 ×1.5，但每次攻击自己受造成伤害的 25%' }
    - { 名: 瘴疠, 标: '☠️', 效果: '双方每回合损失 10% 当前生命' }
    - { 名: 固守, 标: '🛡️', 效果: '双方的防御效果提升为完全免伤' }
    - { 名: 气海, 标: '✨', 效果: '双方每回合自动 +1 气' }
    - { 名: 缠斗, 标: '🤝', 效果: '双方无法使用嘴炮' }
    - { 名: 回春, 标: '💚', 效果: '双方每回合恢复 10% 最大生命' }
  场地说明: '持续 3 回合；可能不触发任何场地'

  # ★ 敌人风格：给敌人「行为模式」而非「数值档」—— 玩家能读对手
  敌人风格:
    - { 名: 风, 特点: '快攻', 偏好: [轻攻击, 嘴炮], 色: '#5ca3d8' }
    - { 名: 火, 特点: '爆发', 偏好: [重攻击],       色: '#e05a4a' }
    - { 名: 林, 特点: '蓄力', 偏好: [集气, 绝招],    色: '#4f8f6b' }
    - { 名: 山, 特点: '防守', 偏好: [防御],         色: '#c69c6d' }

  战斗道具:
    - { 名: 大力丸, 效果: '本场所有伤害 ×1.25' }
    - { 名: 筋骨贴, 效果: '本场所受伤害 ÷1.25' }
    - { 名: 金疮药, 效果: '立即恢复 30% 最大生命' }
    - { 名: 霹雳丸, 效果: '立即对敌造成 1.5 倍攻击伤害' }

  # ── 英雄坛说的内容（这一节才是底座该填的）──
  我方行动命名:
    集气: 吐纳
    防御: 守势
    轻攻击: 快招
    重攻击: 沉招
    绝招: 杀手
    嘴炮: 叫阵
    道具: 取物
  叫阵文案: ['「就这点本事？」', '「让让，别挡道。」', '「你师父没教过你怎么站？」']
