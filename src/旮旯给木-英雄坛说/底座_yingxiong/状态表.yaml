# ════════════════════════════════════════════════════════════
# 底座_yingxiong · T2 状态表
# ════════════════════════════════════════════════════════════
# 格式遵循 引擎模板/机制层规范.md 的 T2。
# 每个状态必须填「意义」——它回答用户定的第三问：
#   **这个数值改变了玩家的什么体验？** 答不出的状态不许存在。
#
# 五条过审规律（出自 同级生2/变量人工过审.md，本表已逐条执行）：
#   ① 别让两个变量说同一件事   ② 同一个模拟就合并
#   ③ 为不存在的 UI 备的变量要删   ④ 常量不是变量   ⑤ 同一条事实不给两个载体
#
# ★ 派生值不进本表（攻击 / 命中 / 闪避 / 招架 / 生命上限 / 内力上限）
#   它们是 f(天赋, 技能等级)，由 C4 派生计算在【面板】里算 → 见 成长公式表.yaml
#   理由：用户判据「这数值是在帮玩家玩，还是在替 AI 记账？」→ 记账 → 不给 AI
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  来源: 英雄坛说（文曲星 / 黄金 / 白金 / RMXP 复刻 / 现代移植版）
  说明: '本表的六个分组对应机制层规范 T2 的六类输入'

# ════════════════════════════════════════════════════════════
# 一、时间（4）
# ════════════════════════════════════════════════════════════
时间:
  - 名: 岁数
    范围: 14 ~ 60
    初值: 14
    增长: 每跨 12 个月 +1（不可阻挡）
    衰减: 无
    周期: 年
    阈值: [ {=16: 相貌开始可见、菜花宝典分支关闭}, {=18: 可开始攻略她的任务}, {=20: 可结婚}, {=22: 未成年人分支全部关闭}, {≥30: 不再加生命上限}, {≥60: 不再加内力上限} ]
    不可逆: true
    可见: 状态栏
    意义: '年龄是这张卡的第二根倒计时：给成长（血/内力），收机会（运气/未成年分支）'

  - 名: 月
    范围: 1 ~ 12
    初值: 1
    增长: 累计日数满 30 时 +1
    周期: 月
    阈值: [ {=12: 岁数 +1 且月归 1} ]
    不可逆: true
    可见: 状态栏
    意义: 玩家看清「离下一个岁数还有多久」

  - 名: 日进度
    范围: 0 ~ 29
    初值: 0
    增长: 每消耗一次行动 +3（见 时间表.yaml）
    周期: 无
    不可逆: true
    可见: 状态栏（进度条）
    意义: 行动点与年龄之间的换算器；让「打坐多久」变成可感知的代价

  - 名: 耐心
    范围: 0 ~ 24
    初值: 24
    增长: 无（只减）
    衰减: 每跨 1 月 -1
    周期: 月
    阈值: [ {=0: 该女角线关闭 + 目的进度按权重扣减} ]
    不可逆: true
    可见: 状态栏（当前攻略对象的剩余月数）
    意义: '**两年之内搞定她，否则她就跟别人跑了**（原作原文）——逼玩家取舍，不可能全收'

# ════════════════════════════════════════════════════════════
# 二、场景与身份（5）
# ════════════════════════════════════════════════════════════
场景:
  - 名: 当前地点
    初值: 平安镇·村东
    范围: 平安镇 / 玉女峰 / 武当山 / 大雪山 / 商家堡 / 五指山 / 冰火岛 / 黑森林 / 灵心观 / 随机地图 / 铸剑谷 / 桃花源
    增长: 移动（消耗行动）
    阈值: []
    不可逆: false
    可见: 状态栏
    意义: 决定在场名单（谁能遇到）、开放时段、以及能不能触发该地点的门派线

  - 名: 当前门派
    初值: 无
    范围: 无 / 太极门 / 八卦门 / 雪山派 / 花间派 / 伊贺谷 / 红莲教 / 兽王派 / 茅山派 / 逍遥派 / 散人
    增长: 拜师或自创（**两者互斥，一次性选择**）
    衰减: 叛师时归「无」
    阈值: []
    不可逆: false
    可见: 状态栏
    意义: '决定能学哪些门派武功、能进哪些内部区域、以及花间派这类性别的门禁'

  - 名: 已叛门派
    类型: 记录表
    初值: []
    增长: 每次叛师 push 原门派
    意义: '**叛师后终身不得回原门派** —— 这张表就是那句话的执行件'

  - 名: 当前女角
    初值: 空
    范围: 33 位女角之一 / 空
    增长: 进入她的所在场景或点名找她时确定
    阈值: []
    不可逆: false
    可见: 状态栏
    意义: 决定加载哪一位的条目（EJS 门控的输入）

  - 名: 阶段
    初值: 初入江湖
    范围: 初入江湖 / 江湖立足 / 名动一方 / 武林之巅 / 结局
    增长: 元经验（武功总评）跨过门槛时切换
    阈值: []
    不可逆: true
    可见: 状态栏
    意义: 决定阶段指导加载哪一段；也是判定难度修正的输入

# ════════════════════════════════════════════════════════════
# 三、A 天赋（4 现 + 4 先天）
# ════════════════════════════════════════════════════════════
# ★ C2 反哺回路的主战场：技能每 10 级 → 对应天赋 +1
天赋:
  - 名: 膂力
    范围: 10 ~ 255
    初值: 由创建时决定（10~30）
    增长: 基本拳脚每 10 级 +1
    衰减: 无
    周期: 无
    阈值: [ {<15: 相貌姣好}, {≥15: 相貌较差} ]
    不可逆: false
    可见: 属性面板
    意义: '物理攻击成长 + 招架 + 饭量水量上限（终生不改）+ 相貌档位'

  - 名: 敏捷
    范围: 10 ~ 255
    初值: 由创建时决定
    增长: 基本轻功每 10 级 +1
    阈值: [ {≥22: 可拜雪山派} ]
    不可逆: false
    可见: 属性面板
    意义: 命中 + 闪避 + 出手先后

  - 名: 根骨
    范围: 10 ~ 255
    初值: 由创建时决定
    增长: 基本内功每 10 级 +1
    阈值: [ {≥32: 可拜白瑞德（雪山掌门）} ]
    不可逆: false
    可见: 属性面板
    意义: 气血上限 + 内力上限 + 打坐速度 + 减伤 + 外貌

  - 名: 悟性
    范围: 10 ~ 255
    初值: 由创建时决定
    增长: 读书识字每 10 级 +1
    阈值: [ {≥22: 可拜茅山派}, {≤18: 可拜兽王派} ]
    不可逆: false
    可见: 属性面板
    意义: '学武速度（消耗潜能的倒数）+ 暴击伤害 + 法术命中 + 任务奖励'

  - 先天四值:
    类型: 记录表
    初值: '{膂力: X, 敏捷: X, 根骨: X, 悟性: X}'
    内容: 创建时决定，**选定后不能改**
    意义: '决定「成长率」而不只是当前值 —— 先天膂力高则每点膂力的攻击加成更高。这是原作机制，不是装饰'

# ════════════════════════════════════════════════════════════
# 四、B 技能（容器 · ★ C1 等级制状态）
# ════════════════════════════════════════════════════════════
技能:
  结构: '键 = 技能名，值 = 等级（0 ~ 255）'
  等级上限: 255
  可见: 技能面板（等级条 + 下一级成本 + 能否学）
  意义: '**这张卡的主成长轴**：不是人物升级，是每门武功单独升级；总评由内功/拳脚兵刃/轻功/招架综合评定'
  注: 未学的技能不占变量位（只记录已学）

  基本武功:
    - 基本内功
    - 基本轻功
    - 基本拳脚
    - 基本剑术
    - 基本刀法
    - 基本杖法
    - 基本鞭法
    - 基本法术
    - 基本招架
    - 读书写字

  门派武功:
    太极门: [太极拳, 太极剑, 玄虚刀法, 太极神功, 万流归一]
    八卦门: [八卦游身掌, 八阵八卦掌, 八卦刀, 混元一气功, 游龙身法]
    雪山派: [雪影擒拿手, 入门十三式, 雪山剑法, 踏雪无痕, 雪山内功]
    花间派: [一剪梅花手, 花团鞭法, 柳叶刀法, 飞蝶身法, 三花聚顶, 驻颜术]
    伊贺谷: [无法拳, 川枫一刀流, 无影遁形, 扶桑忍术]
    红莲教: [太祖长拳, 乱披风杖法, 鹤翔身法, 普天同济, 红莲教义]
    兽王派: [鹰爪功, 猛虎拳, 赤尻连拳, 鳄灵刀, 五禽戏, 龙象般若功, 灵通心诀]
    茅山派: [天师掌法, 灵符身法, 谷衣心法, 天师正道, 万鸦咒, 玄冰咒, 五雷咒]
    逍遥派: [三花聚顶, 川枫一刀流, 猛虎拳, 吸血大法, 驻颜术]

  三入口:
    - 请教: 向师傅，耗潜能（★ C3 资源门）
    - 自学: 读秘籍（逍遥派唯一入口）
    - 练功: 基本武功等级 > 门派武功时可用，把门派武功练到与基本同级（不耗潜能，耗时间）
    - 限制: '内功与知识类不能练功，只能靠请教'

  绝招解锁:
    载体: 不进变量（由技能等级推导，见 门派表.yaml 的门派绝招条件）
    意义: '避免「技能等级」与「绝招已解锁」两个变量说同一件事'

# ════════════════════════════════════════════════════════════
# 五、C 资源（5）
# ════════════════════════════════════════════════════════════
资源:
  - 名: 潜能
    范围: 0 ~ 65535
    初值: 100
    增长: 做任务 / 打恶人 / 闭关奇遇
    衰减: 请教时消耗
    阈值: [ {=65535: 超过自动归零（原作机制）} ]
    不可逆: false
    可见: 状态栏
    意义: '学武的唯一货币 —— 玩家每一次花潜能都是一次取舍'

  - 名: 经验
    范围: 0 ~ 200000
    初值: 0
    增长: 战斗 / 任务 / 打坛主
    阈值: [ {≥1000: 可接搬石头}, {≥100000: 村长给青龙坛地图}, {≥150000: 可找干将铸剑}, {≥800000: 可向独行大侠学基本武功到 250} ]
    不可逆: false
    可见: 状态栏
    意义: '决定可学武功的上限（见识所限）+ 打开三条主线（除黑 / 铸剑 / 高级武功）'

  - 名: 金钱
    范围: 0 ~ 99999999
    初值: 100
    增长: 干活 / 钓鱼 / 打怪 / 卖物
    衰减: 买东西 / 学读书写字 / 铸剑
    阈值: [ {≥100000: 可铸剑} ]
    不可逆: false
    可见: 状态栏
    意义: '读书识字要花钱 —— 悟性这条线是**用钱换的**，这是原作很狠的一笔'

  - 名: 食物
    范围: 0 ~ 上限（饭量，由膂力决定）
    初值: 满
    增长: 吃东西 / 喝水
    衰减: 随行动消耗
    阈值: [ {=0: 生命与内力不再自然恢复 + 无法轻功传送/疗伤/打坐} ]
    不可逆: false
    可见: 状态栏
    意义: '**膂力同时决定饭量** —— 把他调高攻击力的同时让他更容易饿，这是原作的取舍设计'

  - 名: 饮水
    范围: 0 ~ 上限（水量，由膂力决定）
    初值: 满
    增长: 喝水
    衰减: 随行动消耗
    阈值: [ {=0: 同食物} ]
    不可逆: false
    可见: 状态栏
    意义: 同食物

# ════════════════════════════════════════════════════════════
# 六、E 身体（7）
# ════════════════════════════════════════════════════════════
身体:
  - 名: 生命当前
    初值: 100
    范围: 0 ~ 生命上限
    增长: 休息 / 吸气 / 药物
    衰减: 战斗中受伤
    阈值: [ {=0: 死亡（原作会轮回复活但要蒙受重大损失）} ]
    不可逆: false
    可见: 状态栏
    意义: '能不能撑过这一场 —— 但它恢复快，是「可逆」的那一层'

  - 名: 生命有效
    说明: 以百分数表示（100% = 没受伤）
    初值: 100
    范围: 0 ~ 100
    增长: '疗伤（需内功 30 级以上）'
    衰减: '战斗中被击中实体'
    阈值: [ {=0: 死亡} ]
    不可逆: true
    可见: 状态栏
    意义: '★ **不可逆损伤的那一层**：有效值降下去恢复极慢，且它会拖住上限。原作三层生命的第二层'

  - 名: 内力蓄存
    范围: 0 ~ 内力强度
    初值: 0
    增长: '打坐（挂机，时间计入岁数）'
    衰减: '加力 / 绝招 / 疗伤'
    不可逆: false
    可见: 状态栏
    意义: 战斗中的燃料

  - 名: 内力强度
    范围: 0 ~ 9999
    初值: 0
    增长: '打坐使真气充沛到一定程度 → 永久提高（★ 不可逆成长）；年龄 +1 → +20；经验每 1000 → +1（上限 +1250）'
    衰减: 无
    阈值: [ {≥某值: 蓄存量自动调节到与强度相同} ]
    不可逆: true
    可见: 状态栏
    意义: '★ 原作最漂亮的一条成长：**有些东西涨上去就永远不下来了**。与「生命有效值」构成一对'

  - 名: 法力
    范围: 0 ~ 上限
    初值: 0
    增长: '冥思（茅山派专属）'
    衰减: '法术 / 法点'
    不可逆: false
    可见: '状态栏（仅茅山派可见）'
    意义: 茅山派的第二内力

  - 名: 容貌
    范围: 1 ~ 10
    初值: 由先天膂力推导（<15 姣好）
    增长: '驻颜术 / 16 岁后自然变化 / 道具'
    阈值: [ {≥某档: 可拜李青照（花间派掌门）} ]
    不可逆: false
    可见: '状态栏（16 岁后才可见）'
    意义: '★ 原作里它是**隐藏属性**，但确实是一道门派门槛 —— 保留这个「看不见但要满足」的性质'

  - 名: 福缘
    范围: 0 ~ 100
    初值: 128 减去随机（原作未明示，取中位）
    增长: '给茅山派第二个屋子的人捐 500000'
    衰减: '年龄增长（运气变差）'
    不可逆: false
    可见: 状态栏
    意义: '影响掉落、任务奖励倍率、铸剑品质 —— 原作里是「运气」的可操作版本'

# ════════════════════════════════════════════════════════════
# 七、F 关系（每位女角一份）
# ════════════════════════════════════════════════════════════
# ★ 她给任务 → 完成加好感、失败扣好感（原作原文）。这是 T3 阶段表的推进器
# 下面四个字段，每位女角各一份
关系:
  - 名: 好感度
    范围: -100 ~ 100
    初值: 0
    增长: '完成她给的任务 / 互学武功 / 送礼 / 陪她'
    衰减: '任务失败 / 长期不接触（月结算）/ 被她撞见你与别人'
    阈值: [ {≥某值: 解锁下一步任务}, {=100: 可结婚} ]
    不可逆: false
    可见: 关系面板
    意义: '她给的任务是唯一的推进器；好感是它唯一的标尺'

  - 名: 关系阶段
    范围: 陌生 / 相识 / 一见如故 / 亲密 / 热情如火 / 可婚
    初值: 陌生
    增长: '好感度跨过门槛'
    不可逆: false
    可见: 关系面板
    意义: '★ 做成「可读但不可精确计算」的档位，而不是连续值 —— 让它参与判定要求值修正（E3.3 的修正二）'

  - 名: 已学自她
    类型: 记录表
    初值: []
    增长: '互学武功时 push 技能名'
    意义: '★ 「互学武功 = 只给她的独门绝招」的执行件；也是花间派武学对男性玩家的唯一来源'

  - 名: 耐心
    见: 时间.耐心

# ════════════════════════════════════════════════════════════
# 八、战斗临时（3 · 战斗内有效，战斗结束清空）
# ════════════════════════════════════════════════════════════
战斗临时:
  - 名: 加力
    范围: 0 ~ 内力强度
    初值: 0
    增长: 战斗中设定
    意义: '物理攻击附加的内力。★ 对兵刃的加成只有拳脚的一半（原作机制）'
  - 名: 呆若木鸡
    范围: 0 ~ 5
    初值: 0
    意义: '被控制的回合数 —— 原作唯一的硬控制状态'
  - 名: 临时增益
    类型: 记录表
    内容: '[变熊术, 变鹰术, 冰心诀, 三花, 化掌为刀, 忍法影分身, 飞鹰召唤, 阴阳诀]'
    意义: '绝招产生的 buff；互斥项（变熊 ↔ 变鹰）在这里判'
