# 英雄榜（打榜）
#
# ★ 来源：参考项目「主神空间」的**竞技场**
# ★ 为什么加：我们现在的"变强"**没有目标** —— 练了武功做什么？
#   打榜给了「明确的目标 + 可量化的进度」，而且**复用现有战斗**（不用另写）。
# ★ 英雄坛说的对应物：**江湖英雄榜**（各派高手在榜，打赢就顶替他的名次）

英雄榜:
  在哪: '各派驻地 / 大镇的客栈（★ 据点内）'
  频次: '随时可打，但每天限 3 场（防刷）'

  榜单:
    分档:
      - { 名: 本门榜, 门槛: 无, 说明: '同门师兄弟的名次' }
      - { 名: 江湖榜, 门槛: '武学总评 300+', 说明: '各派好手' }
      - { 名: 天下榜, 门槛: '武学总评 1000+', 说明: '★ 榜上有名者，多半是掌门级' }
    生成: '按当前阶位生成一批对手（有缓存，同一天刷新不变）'
    榜单长度: 100
    排名显示: '#名次 名字 · 门派 · 品级 · 强度'

  挑战:
    规则: '★ 赢了【直接顶替】他的名次（打赢 #30 你就变 #30）→ 一路往上打就能爬榜'
    对手强度: '自动配齐装备与武功，是个完整对手（不是软柿子）'
    消耗: '体力 20 / 行动点 1'
    连胜: '连胜有加成（每连胜 +1 成奖励，上限 +5 成）'
    失败: '名次不变，当天还能再打'

  奖励:
    - { 名次: '100 名开外', 奖励: '少量经验' }
    - { 名次: '前 100', 奖励: '银两 + 物品，连胜另有加成' }
    - { 名次: '第 1 名', 奖励: '★ 唯一称号（全卡只一个，被别人打下去就失去）' }
  称号: ['天下第一', '武林至尊', '当世无敌']

  意义: |
    ★ 这条设计的价值在于「**给玩家一个可量化的目标**」：
    · 变强有了用处（打得过谁，排名就是标尺）
    · 复用现有战斗（不用另写一套）
    · 唯一称号是**零和**的（你上去别人就下来）→ 排行榜自带张力
