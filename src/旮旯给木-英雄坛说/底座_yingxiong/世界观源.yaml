武林格局:
  一句话: "时空扭曲把不同年代的人塞进了同一片大陆。这里没有年号，也没有人能考证自己的来处。"
  天下大势:
    - "大陆名义上的统治者是金远见王朝。它管不了江湖，但它会派人来"
    - "王朝养的赏善罚恶使者每隔一段时日入江湖，为的是那一场武林大会"
    - "十家门派各据一方。门派之间不打大仗，各修各的功夫"
  十门:
    - "太极门：在武当山。重防御、借力反击，前期弱后期强"
    - "八卦门：在商家堡。掌刀兼修，攻守均衡，最适合新手"
    - "雪山派：在大雪山。剑法攻击强、重敏捷，防御薄"
    - "花间派：在玉女峰。只收女性，轻功与闪避突出，招式灵巧"
    - "伊贺谷：在冰火岛。忍术、刀法与减益控制，变化诡异"
    - "红莲教：在五指山。高膂力强攻击，拳杖为主，防御弱"
    - "兽王派：在黑森林。动物拟形，变身与召鹰，血厚防高但命中低"
    - "茅山派：在灵心观。独立法力体系，法术攻击强，不许婚娶"
    - "逍遥派：自创门派。不拜任何人，靠五本秘籍自己凑出来"
    - "散人：不入门派也不自创，随机地图遇赤脚道人，走土系一路"
  江湖上的三条路:
    - "拜师。学得快，但拜了就不能再偷师，也不能学别家的秘籍"
    - "自学。拿秘籍自己练。慢，但是自由"
    - "叛师。杀同门杀到师傅心寒，被逐出师门，代价是武功倒退与终身不得回门"
  暗处的东西:
    - "八大坛分布在八处要地，坛主一个比一个强"
    - "六派掌门各持一块三角石板，凑齐才打得开时空的尽头"
    - "尽头那边有三个东西在等着。谁等在那儿，看你一路做了什么"
  她怎么看这些: "门派、石板、坛主，在她眼里都是关卡。她会算哪条路最快，然后把你按上那条路"
这个世界的规矩:
  一句话: "它是虚拟世界，可就照真实世界来运转。你会老，会饿，会渴，会缺钱。"
  时间:
    - "一年涨一岁。岁数上去了，气血与内力跟着涨，但运气会差，出手会快"
    - "打坐与练功都是挂着时间走的，练一整夜就是过了一夜"
    - "家里床边那瓶女儿红，喝一瓶就过去三个月"
  身体:
    - "生命分三层。最大值是上限，当前值是一时之伤，有效值才是真的伤到哪儿了"
    - "有效值掉下去恢复极慢，而且会一直拖着你"
    - "内力分两层。蓄存量是手里的，强度是身子里的。真气满了强度会永久涨一截，那一次涨上去就不下来了"
    - "饿了渴了，不但不回复，连轻功赶路与打坐疗伤都做不了"
  江湖:
    - "输了要折一半潜能，还要掉武功"
    - "切磋不会死，但血照掉"
    - "声望是别人怎么看你的账。杀好人降，杀坏人升"
  她的处境: "她不知道这些。她只知道哪个数字涨得快、哪条路最短。你替她受着"
公共选项池:
  规则: "不涉及具体人的通用选项。凑不够四条时用它补"
  取用: "按当前情境选合适的，改措辞，不改等级"
  池子:
    - 文本: "站在原地不动"
      等级: "微"
      注: "不花力气，但时间照走"
    - 文本: "什么都不做，看着"
      等级: "微"
      注: "放弃这一层，交给她"
    - 文本: "把手背到身后"
      等级: "微"
      注: "让她看出你不打算动手"
    - 文本: "往后退半步"
      等级: "微"
      注: "不跑，只把距离拉开"
    - 文本: "把刀往回收一寸"
      等级: "微"
      注: "收刀不归鞘"
    - 文本: "看一眼天色"
      等级: "微"
      注: "外面快黑了"
    - 文本: "擦一下手上的灰"
      等级: "微"
      注: "擦干净，也把这几息拖过去"
    - 文本: "在心里数还剩几个人"
      等级: "微"
      注: "数到几就算几"
    - 文本: "闭上眼"
      等级: "微"
      注: "不看。但听得见"
    - 文本: "咬住不出声"
      等级: "强"
      注: "把声音压在喉咙里"
    - 文本: "问她一句"
      等级: "中"
      注: "开口问她想干什么"
    - 文本: "回想她刚才停在哪儿"
      等级: "中"
      注: "调出刚才那两息"
    - 文本: "找个借口走开"
      等级: "中"
      注: "说有事，去一趟"
    - 文本: "伸手去够那个东西"
      等级: "强"
      注: "主动伸手"
    - 文本: "硬做一件她没让做的事"
      等级: "极"
      注: "这一下要花反抗值，代价写在 反抗与判定 里"
关系封闭:
  这是什么: "两条线同时推到一定程度，其中一条会永久关掉。关掉之后没有回头路。这是「只能挑几个」这条规则真正咬人的地方"
  为什么这里一定会有封闭:
    - "耐心只有两年。三十五位里不可能全收"
    - "门派是排他的。拜了太极门就学不到花间的功夫，想换只能叛师，而叛师的代价写在 门派表 里"
    - "所以封闭不是惩罚，是时间与门槛算出来的结果"
  哪些线互相冲突:
    按门派分堆:
      - "同门之间最排他。同一个门派里的两个人，往往只能走通一条"
      - "跨门派之间要看地点。玉女峰与平安镇隔得远，跑一趟就少一个月的进度"
    最排他的: "花间派掌门李青照。她管着一门人，谁在她眼皮底下动别人都能看见"
    最不排他的: "平安镇上那几位。街面上的人各过各的，撞见的概率低"
    逐对关系怎么算: "由代码按「同门／同地／期限」算。这里只写封闭之后怎么演"
  封闭之后:
    - "那条线的人不再出现在她的选项池里"
    - "她不会解释为什么，也不会有过渡"
    - "已经拿到的关系值留着，但事件不再推进"
    - "<user> 能感觉到「这条路走不通了」，但说不清是哪一步走错的"
  不要做的:
    - "不要在正文里说「这条线锁了」「因为互斥」"
    - "不要让她为此道歉或者解释"
    - "不要把它写成惩罚，写成时间不够的样子"
