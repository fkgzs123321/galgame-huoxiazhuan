meta:
  底座: yingxiong
  参考: 色色灵感状态栏V3.738 的四张表分层思路（见 引擎能力/参考-色色灵感状态栏.md）
穿着:
  部位:
    - 外衫
    - 下裳
    - 里衣
    - 布袜
    - 鞋履
    - 佩饰
  层次:
    外衫: 1
    下裳: 1
    鞋履: 1
    布袜: 2
    佩饰: 3
    里衣: 4
  说明: ★ 层次 1 是外层，4 是最贴身。脱衣从 1 开始，穿衣从 4 开始
  时代约束: 武侠背景。不要出现现代内衣（文胸/内裤）的说法，用里衣、抹胸、汗巾这类词
  她的衣柜: ★ 女角身上有什么，按各自的门派与身份定（花间派讲究，雪山派单薄，镇上的姑娘素）
身体:
  分层: 即时 = 场景级，换场景只清这一层；基线 = 数轮后仍成立，换场景原样保留
  ★ 即时层（换场景清空）:
    胸前:
      字数: 30
      填什么: 充血勃起 / 乳尖硬挺 / 被揉捏后的红印 / 溢乳
      空值: 未变化
      禁填: 稳定特征（罩杯、形状）、数值型进度
    下身:
      字数: 30
      填什么: 湿润程度 / 分泌物状态 / 充血肿胀 / 收缩蠕动 / 插入后的扩张 / 内射后的精液 / 宫口变化 / 受精卵着床
      空值: 未变化
      禁填: 稳定基线（结构、颜色）、数值进度
    口:
      字数: 20
      填什么: 被使用后的红肿 / 唾液拉丝 / 嘴角溢出液体
      空值: 未变化
      禁填: 稳定特征
    后庭:
      字数: 20
      填什么: 括约肌松弛 / 红肿 / 被扩张
      空值: 未变化
      禁填: 稳定特征
    四肢与痕迹:
      字数: 30
      填什么: 大腿内侧发红 / 腰部淤痕 / 锁骨咬痕 / 手腕勒痕
      空值: 正常
      禁填: 稳定特征
  ★ 基线层（换场景原样保留）:
    身高体重:
      字数: 20
      填什么: 身高 + 体型一句话
      何时改: 基本不改（成长期例外）
    体态:
      字数: 30
      填什么: 身形比例、辨识度特征（沙漏 / 窄肩宽胯 / …）
      何时改: 基本不改
    常年特征:
      字数: 40
      填什么: 疤 / 痣 / 胎记 / 常年戴的东西
      何时改: 真的变了才改
    性情倾向:
      字数: 40
      填什么: 她自己那一套：不是人设标签，是在这件事上的倾向
      何时改: 慢变
    经验:
      字数: 30
      填什么: 她对这件事的认知与掌握程度
      何时改: 经历后改
    下体状态:
      字数: 90
      填什么: 处女膜状态 / 结构 / 分泌基线
      何时改: 永久变化时才改
    后庭状态:
      字数: 70
      填什么: 开发程度 / 括约肌 / 颜色 / 敏感反应
      何时改: 开发变化时改
    泌乳与体液:
      字数: 70
      填什么: 乳汁与爱液的分泌基线倾向 / 触发强度 / 体质
      何时改: 体质永久变化时改
    淫语风格:
      字数: 80
      填什么: 言辞量 / 风格 / 称呼 / 高潮时的表达
      何时改: 从人设基线出发，可随机发散
    羞耻点:
      字数: 100
      填什么: 核心羞耻点 + 击穿防线的言行 + 崩溃阈值 + 产生效果
      何时改: 慢变
    调教值:
      范围: 0 ~ 1000
      初值: 0
      规则: ★ 只升不降
      何时改: 每次相应经历后加
    性爱次数:
      类型: 整数
      规则: 每次结束后 +1
      何时改: 每次
    最近性行为:
      字数: 100
      格式: YYYY-MM-DD/{地点与体位玩法简述}
      规则: 保留最近两次，分号分隔；正在发生的标 (未结束)，结束就移除标注
    对主角的称呼:
      字数: 15
      填什么: 当前专属称呼
      何时改: 随关系变化
  ★ 为什么这么细: V3.738 的办法：每列都写死「填什么 / 多少字 / 什么算空 / 禁止填什么」。只给字段名，AI 就会把稳定特征填进即时层、把变量写成一大段。
  ★ 引擎层对应物: 引擎模板/引擎能力/NSFW显示契约.md（换底座也成立的那部分在那边）
  建档节点:
    init: 开局首层或女角第一次真正进镜头时建。只给在场的建；能推的先填，拿不准留空，别编
    insert: 新女角进镜头时插一份
    update: 基线真的变了才改（疤/痣/体型/永久状态/称呼/经验），只改变的那项
    delete: 基本不删。唯一例外：最近性行为保留两次，第三次挤掉最旧
    ★ 最常见的错: 把「此刻」写进基线。充血/湿润/红印/唾液/淤痕 全是即时层的
    ★ 只升不降: 调教值、性爱次数 —— 记的是发生过的事，不会被后来的事抹掉
    ★ 分工: 基线问「数轮后回看这句还成立吗」，即时问「此刻身体正发生什么」。都答不上来的不写
周期表:
  孕:
    名: 孕
    总轮: 9
    叠加上限: 1
    可中断: true
    阶段:
      - 到第几轮: 0
        名: 初期
        表现: 看不出，只是容易累、容易饿
      - 到第几轮: 3
        名: 中期
        表现: 小腹开始显，旧衣裳紧了，走路慢半拍
      - 到第几轮: 6
        名: 后期
        表现: 走不动远路，坐久了要扶腰，夜里睡不安稳
    结束时:
      人口: 1
      耐心: -3
    中断后果:
      身体: -20
    说明: ★ 结束时不是「什么都不发生」—— 落账：多一个人，而她的耐心少了三个月
  养伤:
    名: 养伤
    总轮: 4
    叠加上限: 3
    可中断: false
    阶段:
      - 到第几轮: 0
        名: 初伤
        表现: 动作一大就牵扯
      - 到第几轮: 2
        名: 将合
        表现: 能动了，但用不出全力
    结束时:
      生命: 50
    说明: 不可中断 —— 伤是自己好的，没有「不治了」这种选法
  闭关:
    名: 闭关
    总轮: 8
    叠加上限: 1
    可中断: true
    阶段:
      - 到第几轮: 0
        名: 入定
        表现: 不见人，饭放在门口
      - 到第几轮: 4
        名: 冲关
        表现: 脸色发白，屋里会有细微的气流
    结束时:
      内力上限: 100
    中断后果:
      内力: -30
    说明: ★ 闭关和「她挂机」会在时间线上撞到一起 —— 都占时间，两件事不能同时
档位表:
  - 门槛: 0
    名: 无
    部位表现:
      胸前: 未变化
      下身: 未变化
      口: 未变化
      后庭: 未变化
  - 门槛: 20
    名: 微动
    部位表现:
      胸前: 呼吸快了一点，衣料跟着起伏
      下身: 未变化
      口: 话变少了
  - 门槛: 40
    名: 起了
    部位表现:
      胸前: 隔着衣裳能看出形状
      下身: 开始发潮，走路时不自在
      口: 说话要停一下
  - 门槛: 60
    名: 明显
    部位表现:
      胸前: 衣料被顶出痕迹，碰一下就缩
      下身: 湿了，裙下能看出颜色变化
      口: 气息不稳，声音发软
  - 门槛: 80
    名: 难忍
    部位表现:
      胸前: 充血发红，她自己也忍不住去按
      下身: 顺着腿往下走，站不住
      口: 只能出声，说不出完整的句子
      后庭: 不自觉地收
  - 门槛: 95
    名: 溃
    部位表现:
      胸前: 一碰就颤，已经不听她的
      下身: 一片湿，两腿合不上
      口: 喊出来，她自己都捂不住
      后庭: 一阵一阵地缩
推进规则:
  单轮上限: 25
  每轮衰减: 5
  说明: |
    ★ 单轮封顶 25 —— 不许「一上来就满格」。上一段还在闲聊，下一段就到顶，读的人会出戏。
    ★ 每轮衰减 5 —— 冷下来是慢的，但会冷。她不可能一整场都维持在高位。
    ★ 她的兴奋度高会降低判定成功率（见 反抗与判定 的「三段修正」），
      但那件事在判定引擎里算，这里只管**她现在是什么状态**。
接口:
  与E3判定: 她的兴奋度是判定的乘数（手不稳、容易点偏），但不要写进他的身体感受
  与E13状态: 即时反应可以转成持续状态（红肿、胀痛这种会延续几轮的）
  与E6她的手段: 她开挂改数值时可能直接改基线 —— 那是她最重的手段，痕迹记进 世界的裂缝
  与C7施展条件: 带着某些周期/状态时，有些招式用不出来（用 C7 的「没状态」条件表接）
