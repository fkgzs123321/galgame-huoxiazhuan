# ════════════════════════════════════════════════════════════
# 人设映射（8 套「她」各取哪一子集）
# ════════════════════════════════════════════════════════════
# 判据来自各人设的「游玩风格」（见 世界书/角色/屏幕外的她/ 与 人设补丁.yaml）：
#   她想要什么 → 决定她把哪些单元算成「必须拿到的」
# ════════════════════════════════════════════════════════════
人设映射:
  温砚:
    她要什么: '走到一个一个数值都没被改过的结局'
    单元: [A1, A2, A3, A4, A6, C01, C02, C03, C04, C05, C09, C10, D01, D03]
    说明: '正路走完，不杀好人、不叛师、不拿菜花宝典。她的清单最短也最难 —— 因为全都得靠打'

  丰娆:
    她要什么: '把每一个女角都看过一遍'
    单元: [B01, B02, B03, B04, B05, B06, B07, B08, B09, B10, B11, B12, B13, B14, B15, B16, B17, B18, B19, B20, B21, B22, B23, B24, B25, B26, B27, B28, B29, B30, B31, B32, B33, B34, B35, C06, D06]
    说明: '★ 她的清单就是 35 位女角。这条线必然是碎的 —— 两年期限装不下 35 个人，所以她会一直快进、一直换线'

  舒晏:
    她要什么: '让他卡在打不过又不肯走的地方'
    单元: [A4, A6, C02, C03, C04, C05, D03]
    说明: '只挑最难的单元（打通八大坛、集石板、打 BOSS、绝招齐、返璞归真、铸剑挑战）。她不要结局，她要过程里的那一下'

  唐响:
    她要什么: '看没见过的死法'
    单元: [C05, C07, C08, C03, A5, D02, D03]
    说明: '全 BOSS + 叛师 + 三大结局分支，一样不留'

  沈眠:
    她要什么: '他永远停在还能被救的前一步'
    单元: [B21, B22, B23, D06]
    说明: '★ 她的清单最短：只保留市井里的那几位。其余全部主动放弃 —— 因为收得越多，他被救的机会越多'

  莫漾:
    她要什么: '用最少的操作拿到最多的东西'
    单元: [A1, A5, C01, C02, B23]
    说明: '只取门槛最低、收益最大的那几个。她的进度条大概永远到不了 100，她也不在乎'

  纪清:
    她要什么: '全 255、全绝招、全女角、全结局'
    单元: 全部    # 特殊值：= 全部 61 个单元（体检脚本会展开）
    说明: '★ 唯一一个单位数是 61 的人设。她是唯一一个把「100%」当成目的本身的人'

  郁灼:
    她要什么: '不用铺垫，直接到那一步'
    单元: [B03, B21, B27, B30, C05, C07, C08, D03]
    说明: '只挑最狠的那几位女角 + 全部 BOSS。跳过一切铺垫类单元（练功、任务、收集）'

校验:
  - '★ 每个单元必须能从 原作资料.md 或 门派表.yaml 里找到出处 —— 不许出现没有出处的单元'
  - '★ 单元不许重复计算同一件事（同一条事实不给两个载体）'
  - '★ 女角单元的判定口径统一：推到「热情如火」并拿到她的独门绝招，才算 1 个'
