# ════════════════════════════════════════════════════════════
# 底座_yingxiong · T4 目的清单（goal_units）
# ════════════════════════════════════════════════════════════
# 职责：把「她的目的进度 0~100」从**想象出来的数字**，变成**可枚举清单**。
#
# 引擎侧只认两个数：
#   单位数   —— 该人设取了多少个单元（本文件给）
#   已达成数 —— 运行时「已达成单元列表」的长度
#   进度     = 已达成数 / 单位数 × 100
#
# ★★ 与原作的关系：英雄坛说天然就有一条可枚举链（武林大会 → 八大坛 → 三石板 → 三 BOSS），
#    所以本表不是硬凑的收集列表，是把原作本来就有的目标链 + 女角线 + 武功线合成一张。
#
# ⚠️ 数据修正（2026-09-16）：原作女性 NPC 实际 **36 位**，
#    其中「小女孩」归 NPC 不做 NSFW（红线）→ **可攻略 35 位**。
#    此前 原作资料.md 写「合计 33 位」是我数错了，已同步修正。
# ════════════════════════════════════════════════════════════

meta:
  底座: yingxiong
  单元总数: 61
  分类: '武功 A(9) / 女角 B(35) / 主线 C(10) / 事件 D(7)'
  进度公式: '已达成数 ÷ 该人设的单位数 × 100'

