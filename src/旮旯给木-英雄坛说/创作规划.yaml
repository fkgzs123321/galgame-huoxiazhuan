project:
  name: 旮旯给木-英雄坛说
  worldbookName: 旮旯给木-英雄坛说
  form: charactercard
  mvu: true
  ui_mode: text
  底座: yingxiong
  机制层: 引擎模板/（跨底座共用，不随本卡变）
事实来源:
  说明: ★ 本卡的事实来源分两层。这份规划是**索引**，不是内容源。
  机制层: 引擎模板/ —— E0-E6 引擎能力 + T1-T4 契约表 + 校验器
  底座层: 底座_yingxiong/ 22 份契约 —— 本卡专有，条目内容以它们为准
  设计稿: 设计规划.md —— 决策记录与理由（不在 prompt 里）
  铁律: 改条目内容 → 改契约；不要改这份规划。
world:
  overview: 时空扭曲把不同年代的人塞进了同一片大陆。这里没有年号，也没有人能考证自己的来处。
  时间模型: 年龄主轴 + 两年倒计时（一年长一岁，两年之内得挑）
  regions:
    - name: 平安镇
      scenes:
        - 村东
        - 村西
        - 村北
        - 南郊
        - 商业街
        - 小菜场
      description: 大陆中心的一座小镇。所有人第一次睁眼都在这里。武馆、客栈、当铺、裁缝店、兵器铺、药店、赌馆、衙门都在几条街上。
    - name: 玉女峰
      scenes:
        - 房屋一
        - 房屋一大厅
        - 内屋
        - 房屋二
        - 后院
        - 塔楼
        - 塔楼花园
      description: 花间派所在。满山的花，房子藏在花里。门规只收女性，可山道并不拦男人。
    - name: 武当山
      scenes:
        - 山脚
        - 三清殿
        - 练功场
        - 山间盆地
      description: 太极门所在。台阶一层一层往上，越往上越静。半山腰右拐下去有一处盆地。
    - name: 大雪山
      scenes:
        - 山脚
        - 山腰
        - 山顶
        - 雪山教场
      description: 雪山派所在。长年积雪，风一过就没人影。
    - name: 商家堡
      scenes:
        - 房间一
        - 房间二
        - 房间三
        - 大堂
        - 内厅
      description: 八卦门所在。堡里人不多，钱不少。有人穷得叮当响，有人出手就是几万。
    - name: 五指山
      scenes:
        - 山道
        - 教坛
        - 坛内
      description: 红莲教所在。教众穿各色衣服，站的位次按颜色分。
    - name: 冰火岛
      scenes:
        - 渡口
        - 忍者学院
        - 东厢
        - 乱石礁
      description: 伊贺谷所在。一边是热泉一边是雪，岛如其名。
    - name: 黑森林
      scenes:
        - 林口
        - 深处
        - 第二间屋子
      description: 兽王派所在。越往里越不见天。第二间屋子里住着两口子，会铸兵刃。
    - name: 灵心观
      scenes:
        - 观门
        - 前殿
        - 后屋
      description: 茅山派所在。观里烧的香味道很淡。这里的人不婚娶。
  factions:
    - name: 太极门
      description: 重防御、借力反击；前期弱、后期强。入门：无
      territory: 武当山
      key_members:
        - 古松道长
        - 苍月道长
        - 清虚道长
    - name: 八卦门
      description: 掌刀兼修、攻守均衡；适合新手。入门：膂力 > 15 的男性
      territory: 商家堡
      key_members:
        - 商宝震
        - 商剑鸣
        - 王维扬
    - name: 雪山派
      description: 剑法攻击强、重敏捷、防御弱。入门：先天敏捷 ≥22
      territory: 大雪山
      key_members:
        - 雪山教头
        - 封万剑
        - 白瑞德
    - name: 花间派
      description: ★ 只收女性；轻功与闪避突出，招式灵巧。入门：★ 女性 + 先天膂力 ≤15
      territory: 玉女峰
      key_members:
        - 平婆婆
        - 桑轻虹
        - 李青照
    - name: 伊贺谷
      description: 忍术、刀法与减益控制；变化诡异。入门：先天膂力 > 20
      territory: 冰火岛
      key_members:
        - 腾王丸
        - 花十郎
        - 和仲阳
    - name: 红莲教
      description: 高膂力、强攻击；拳杖为主，防御偏弱。入门：先天膂力 > 18
      territory: 五指山
      key_members:
        - 方长老
        - 余鸿儒
    - name: 兽王派
      description: 动物拟形武功、变身与召鹰；血厚防高、命中偏低。入门：★ 先天悟性 ≤18
      territory: 黑森林
      key_members:
        - 华佗
        - 北海鳄神
        - 娜可露
    - name: 茅山派
      description: ★ 独立法力体系；法术攻击强；★ 不能结婚。入门：先天悟性 ≥22
      territory: 灵心观
      key_members:
        - 葛洪
        - 留孙真人
        - 茅盈
    - name: 逍遥派
      description: ★ 自创门派：不拜任何门派，靠五本秘籍自己凑出来。入门：★ 未拜任何门派 + 集齐五本秘籍的功夫
      territory: 无（自创）
      key_members: []
  旁支:
    - "0"
  战力档: 见 底座_yingxiong/战力映射.yaml
characters:
