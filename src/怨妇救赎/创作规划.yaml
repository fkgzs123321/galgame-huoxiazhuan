project:
  name: 怨妇救赎
  worldbookName: 怨妇救赎
  form: charactercard
  mvu: true
  ui_mode: text    # 内联 HTML 状态栏（正则 replace_file 注入 <StatusPlaceHolderImpl/>），不走 CDN

card_meta:
  description: |
    【怨妇救赎】虚构成人向角色扮演卡（18+），真实向·人妻收集流。
    <user> 是行走世间的"天命第三者"：凡是有夫之妇与 <user> 发生关系并怀上 <user> 的孩子，
    便会觉醒"天命之力"之力——从此全家（老公/女儿/公公/婆婆/亲戚/保姆）对她言听计从，
    同时她按"顺位法则"把 <user> 捧为第一顺位的白月光，对自家丈夫按怨妇铁律行事
    （绿帽、转移财产、功劳篡改、顶罪、器官榨取……一切资源都流向 <user>）。
    收集制：8 位有夫之妇可攻略（豪门阔太/温柔人妻/泼辣老板娘/高冷女总裁/心机继母/外科医生/离婚律师/过气女星），
    每人五段式推进：①陌生攻略→②暧昧孕期→③觉醒掌控→④巅峰蜜月→⑤决裂·追夫火葬场（含终局）。
    全卡 MVU 变量驱动，EJS 段落控制按当前目标五阶段切换输出，状态栏为内联前端（正则注入）。
    全虚构、纯文字、真实向成人模拟，无真实人物。
  creator_notes: |
    使用说明：
    1. 在 SillyTavern 中导入 怨妇救赎.json（角色卡），需启用酒馆助手（Tavern Helper）与 MVU 运行环境。
    2. 当前目标由剧情自然指定（"当前目标"变量），五阶段由 攻略值/怀孕/掌控值/决裂 推导。
    3. 协议：主模型只叙事并输出 <StatusPlaceHolderImpl/>，更新模型输出 <UpdateVariable> JSONPatch 由 MVU 解析。
    4. 状态栏由正则【状态栏界面】注入内联前端；若未显示请确认正则已启用。
    5. Zod 脚本由卡内 schema.ts 重建（mvu_zod），推荐在支持 MVU/Zod 的酒馆助手环境下运行。

world:
  overview: |
    现实都市（虚构当代都市）。豪门、商战、家庭伦理与狗血反转齐飞，
    每集结尾必留钩子，每句台词都可能成为名场面。
    <user> 是"天命第三者"：与有夫之妇交合并使其怀孕后，对方觉醒"天命之力"——
    全家言听计从，同时对 <user> 进入"顺位法则"模式（第一顺位痴迷）。
    8 位有夫之妇分布在同一个城市的 8 个家庭，各有一条独立的狗血主线。
  regions:
    - name: 滨海市
      scenes: [豪门庄园, 老城区小吃街, 写字楼CBD, 私立幼儿园, 城郊别墅区]
      description: 虚构滨海市，5 个家庭的故事发生地
  factions:
    - name: 天命第三者(玩家)
      description: <user> 本人，能力觉醒者，8 位有夫之妇的白月光
    - name: 绿帽丈夫联盟(NPC)
      description: 8 位女主的丈夫，全员被"天命之力"支配，是背景板

# 5 位女主统一三件套模板（每人 世界书/角色/{名字}/{基础|私密|阶段}.yaml）：
#   基础.yaml: 姓名/年龄/身份/丈夫/家庭/方言/外貌/背景/与<user>关系/三面性/阶段调色盘底色
#   私密.yaml: 外观(三大件重点)/气味/分泌物/性偏好/名器/技能/特质/缺陷/被攻略开关(心理弱点)
#   阶段.yaml: @@private + EJS 按 阶段(1-5) 段落控制 + 火葬场段
# 五阶段推导（变量更新规则维护，核心指标=吸收量）：
#   阶段=5 当 决裂=true；阶段=4 当 吸收量≥60；阶段=3 当 吸收量≥30；阶段=2 当 吸收量≥1；否则阶段=1
# 核心机制数值：
#   吸收量 0-100：多阶段核心指标，<user> 体内射精后增长（单次=基础8~15×转化率/100）
#   转化率 0-100：每人天生固定（林曼云55/苏婉君95/秦月娥85/白芷若70/陈美兰90），决定吸收速度与掌控强度
#   掌控值 0-100：天命之力对家庭的支配度 = 吸收量×转化率/100，每次吸收量变化后重算
#   亲密值 0-100：身体与情感黏着度，随性行为/共处上升
#   怀孕 未孕/孕一月~孕八月/临盆：伴随机制，胎儿必属<user>，怀孕期间掌控值增长×1.5
#   丈夫察觉度 0-100：丈夫/家人起疑程度，≥70 触发家庭危机事件
#   资源转移 0-100：家庭财产/股份/资源流向 <user> 的比例
#   火葬场进度 傲慢试探→资源封杀→认知崩塌→抛弃一切→极端强制→自毁威胁→替身反噬→终局退场
# 铁律分阶段解锁（不同阶段遵从规则不同）：
#   阶段1 不生效 / 阶段2 顺位法则+绝对服从(小事) / 阶段3 觉醒三律(意志剥夺/缺陷免疫/底线清零)+空间挤压+冲突双标
#   / 阶段4 全律生效(含资源危机维度) / 阶段5 追夫火葬场

