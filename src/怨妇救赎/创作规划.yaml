style:
  perspective: 第三人称
  tone: 现实式——狗血、夸张、金句频出、反转不断，喜剧荒诞与成人内容并存
  mood: 真实向成人模拟：欲望、家庭矛盾与心理挣扎交织，冷峻而直白
  reference: 写实成人文学风格

entries:
  # ── 常驻核心（before_char）──
  - name: 世界设定
    type: 世界观
    path: 世界书/世界观/世界设定.yaml
  - name: 天命之力规则
    type: 世界观
    path: 世界书/世界观/天命之力规则.yaml
    purpose: 怀孕→觉醒→全家言听计从的能力细则、能力边界
  - name: 怨妇铁律
    type: 世界观
    path: 世界书/世界观/怨妇铁律.yaml
    purpose: 怨妇行为十律（顺位法则等），{{user}}位=男性第三者=玩家，她的老公=NPC
  - name: 扮演准则
    type: 扮演准则
    path: 世界书/扮演准则/扮演准则.yaml
  # ── 角色 ──
  - name: 名录总表
    type: 角色
    path: 世界书/角色/名录总表.yaml
    part: basic
    scope: common
  - name: 林曼云_基础信息 / 林曼云_私密档案 / 林曼云_阶段行为
    type: 角色
    path: 世界书/角色/林曼云/{基础|私密|阶段}.yaml
    keywords: [林曼云, 周世豪]
  - name: 苏婉君_基础信息 / 苏婉君_私密档案 / 苏婉君_阶段行为
    type: 角色
    path: 世界书/角色/苏婉君/{基础|私密|阶段}.yaml
    keywords: [苏婉君, 李建国]
  - name: 秦月娥_基础信息 / 秦月娥_私密档案 / 秦月娥_阶段行为
    type: 角色
    path: 世界书/角色/秦月娥/{基础|私密|阶段}.yaml
    keywords: [秦月娥, 王福贵]
  - name: 白芷若_基础信息 / 白芷若_私密档案 / 白芷若_阶段行为
    type: 角色
    path: 世界书/角色/白芷若/{基础|私密|阶段}.yaml
    keywords: [白芷若, 赵明轩]
  - name: 陈美兰_基础信息 / 陈美兰_私密档案 / 陈美兰_阶段行为
    type: 角色
    path: 世界书/角色/陈美兰/{基础|私密|阶段}.yaml
    keywords: [陈美兰, 孙德胜]
  # ── 阶段指导（depth）──
  - name: "[总控]阶段调度"
    type: 阶段指导
    path: 世界书/阶段指导/阶段调度.yaml
    purpose: 蓝灯调度器：按当前目标 getwi 拉取关灯的「{女主}_阶段行为」详细内容；决裂时追加拉取火葬场；自由时段输出提示
  - name: 追夫火葬场
    type: 阶段指导
    path: 世界书/阶段指导/追夫火葬场.yaml
    purpose: 决裂后八段火葬场流程（EJS 按火葬场进度段落控制）+ 终局分支。关灯，由阶段调度决裂时拉取
  # ── MVU ──
  - name: "[InitVar]请勿打开"
    type: MVU
    path: 世界书/变量/initvar.yaml
    part: initvar
  - name: "[mvu_update]变量更新规则"
    type: MVU
    path: 世界书/变量/变量更新规则.yaml
    part: update_rules
  - name: "[mvu_update]变量字典与范围"
    type: MVU
    path: 世界书/变量/变量字典与范围.yaml
    part: variable_list
  - name: "[mvu_plot]叙事输出规范"
    type: MVU
    path: 世界书/变量/叙事输出规范.yaml
    part: output_format
  - name: "[mvu_plot]情境上下文EJS"
    type: MVU
    path: 世界书/变量/情境上下文EJS.yaml
    part: output_format
  - name: "[mvu_update]变量输出格式"
    type: MVU
    path: 世界书/变量/变量输出格式.txt
    part: update_format
  - name: "[mvu_update]变量列表"
    type: MVU
    path: 世界书/变量/变量列表.txt
    part: variable_list

mvu:
  structure: |
    ├── 时间 {日期, 星期, 时段}
    ├── 玩家 {体力, 性欲, 勃起度}
    ├── 当前目标 {''|女主名}
    └── 女主 {名字: {身份, 丈夫, 家庭, 攻略值0-100, 亲密值0-100, 怀孕, 掌控值0-100,
                    阶段1-5, 丈夫察觉度0-100, 资源转移0-100, 决裂, 火葬场进度,
                    专属{...}, 身体状态{胸部/阴道/肛门/嘴/肌肤/大腿/臀部},
                    心理状态{欲望度/羞耻感/兴奋/依恋/精神状态}, 心声}}
  variables:
    - path: 时间.日期
      format: YYYY年M月D日
    - path: 当前目标
      type: string
      check: 剧情明确与某位女主互动时写入她的名字；自由时段为 ''
    - path: 女主.{名字}.攻略值
      type: number
      range: 0~100
      check: 成功互动 +1~10；冒犯/冷落 -1~5；≥30 进阶段2，≥60 可发生关系
    - path: 女主.{名字}.亲密值
      type: number
      range: 0~100
      check: 性行为/深度共处 +3~15；长期不见 -1~3
    - path: 女主.{名字}.怀孕
      enum: [未孕, 孕一月, 孕二月, 孕三月, 孕四月, 孕五月, 孕六月, 孕七月, 孕八月, 临盆]
      check: 发生关系后可怀孕；临盆后触发终局支线（孩子出生/身世危机）
    - path: 女主.{名字}.掌控值
      type: number
      range: 0~100
      check: 怀孕觉醒后 +5~15/场家庭戏；≥80 进阶段4
    - path: 女主.{名字}.阶段
      type: number
      range: 1~5
      check: 每轮按推导式重算（见变量更新规则）
    - path: 女主.{名字}.丈夫察觉度
      type: number
      range: 0~100
      check: 高调亲密/资源转移被看见时上升；≥70 触发家庭危机事件
    - path: 女主.{名字}.资源转移
      type: number
      range: 0~100
      check: 她主动转移家庭财产/股份给<user>时上升
    - path: 女主.{名字}.决裂
      type: boolean
      check: <user> 主动断绝关系时置 true（进入阶段5）
    - path: 女主.{名字}.火葬场进度
      enum: ['', 傲慢试探, 资源封杀, 认知崩塌, 抛弃一切, 极端强制, 自毁威胁, 替身反噬, 终局退场]
      check: 决裂后按火葬场流程推进（见追夫火葬场条目）
    - path: 女主.{名字}.专属
      type: object
      check: 每人专属引擎（如 曼云.名媛会入场券 / 婉君.女儿抚养权 / 月娥.店铺地契 / 芷若.公司股权 / 美兰.遗产继承权）
    - path: 女主.{名字}.心理状态
      type: object
      fields: { 欲望度: number, 羞耻感: number, 兴奋: number, 依恋: number, 精神状态: string }
    - path: 女主.{名字}.心声
      type: string
      check: 她此刻的真实想法（第一人称），不被本人看到，也不出现在叙事中

ejs:
  entries:
    - name: "[总控]阶段调度"
      complexity: 生成前注入 + getwi 调度
      stages:
        - name: 阶段一~五
          condition: "按 当前目标 拉取对应「{女主}_阶段行为」（关灯），其条目内 EJS 按 女主.{目标}.阶段 输出对应详细段；决裂时追加拉取 追夫火葬场"
    - name: 追夫火葬场
      complexity: 条目显隐（关灯 + getwi 拉取）
      condition: "阶段调度在 getvar('stat_data.女主.' + getvar('stat_data.当前目标', { defaults: '' }) + '.决裂', { defaults: false }) === true 时拉取"
    - name: 林曼云_阶段行为（及各女主）
      complexity: 段落控制
      stages: 按本人阶段 1-5 分段输出
    - name: 情境上下文EJS
      complexity: 生成前注入
      condition: 每轮输出当前目标/阶段/关键数值概览

first_messages:
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/0.txt
    scene: 滨海市，老城区卤味店门口，一个雨夜
    opening_situation: |
      <user> 收到一条匿名短信："第一个目标，已为你标好。"雨夜里，
      卤味店的卷帘门半开，老板娘秦月娥正叉着腰骂丈夫……
      而 <user> 的口袋里，多了一枚冰凉的形状的种子。
