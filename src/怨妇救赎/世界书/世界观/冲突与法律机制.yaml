# 冲突·伦理·法律机制（天命之力的边界与世界的规则）

## 一、天命之力的硬边界（防神化）
- 天命之力**只对"她家里的人"生效**：老公、女儿/继女、公婆、亲戚、住家保姆。对外人、对机构（公安、法院、纪委、媒体、银行）、对 <user> 本人，全部无效。
- **公安是这个世界上唯一绝对权威**：天命之力压得住全家，压不住警察。公安一出警，全家照样腿软、照样老实交代——天命之力在他们面前哑火。
- 防的是"呈现逻辑"的神化，不是"强度"：觉醒后（掌控值高）她在家里确实碾压一切，但天命之力必须以"人心、巧合、全家配合"的方式呈现，不是念咒、不是超能力、不是读心。证据可以被吞、证词可以翻供、监控可以"恰好"坏掉——但都得有合理的现实手段支撑。
- **不防强度**：玩家和女主在规则内拥有碾压优势（家庭内部、掌控值高时），AI 必须如实演出，不得为了"现实感"削弱她们、给玩家放水、让全家突然雄起。

## 二、法律·公安的绝对权威（高压线）
- 报警 → 出警 → 笔录 → 调查 → 拘留 → 立案 → 起诉，一路走到底。公安的介入是硬事件，不会被天命之力"压回去"。
- 可能涉及的罪名（按剧情触发）：重婚（以夫妻名义与多人同居）、诈骗（财产转移涉欺诈）、故意伤害、寻衅滋事、侵犯隐私（装监控/跟踪）、非法拘禁（绑架软禁）等。
- **取证困难（顺位法则的副作用）**：女主全家配合维护 <user>——女方笔录主动翻供、老公被吓到不敢作证、证人"恰好"改口、证据"恰好"丢失。法律流程对 <user> 通常"永远差一步"：取保候审、证据不足、程序瑕疵、管辖权回避。
- **法律咬人的窗口**：当「曝光度」≥70，或某条线崩坏（阴谋型丈夫反噬、继女报警、媒体曝光、女主被起诉），法律机器开始真正追咬 <user>——此时必须"摆平"：花资源转移的钱平事、找人压案、女主顶包（或让老公按替罪机制顶罪）、跑路。摆不平就是治安拘留/刑事立案/坐牢的硬后果。

## 三、现实伦理与道德代价（曝光度机制）
- **曝光度 0-100**：婚外情东窗事发的社会性程度——流言、社死、亲友反目、孩子受伤。
- 上升途径：亲密被撞见、流言扩散、邻里指指点点、幼儿园家长群、公司内网、媒体报道、报警。
- 后果分级：30 以下风言风语；30-59 亲友疏远、社交圈排挤、公司议论；60-79 社死（名媛圈除名/邻里围攻/公司辞退）、离婚官司、争产官司；80-100 全网皆知、孩子心理阴影、家庭彻底破裂、法律追咬。
- **道德张力是剧情燃料**：女主在觉醒前/边缘时会有内疚与反复（不敢见人、半夜哭、想收手）；亲友的指责、孩子的眼泪、社会的眼光，都是真实的阻力。玩家的道德选择（利用到底 / 良心发现 / 抽身 / 收网）改变叙事走向。

## 四、冲突与戏剧套路（事件池，按剧情触发）
- **撞见/捉奸**：老公、女儿/继女、公婆撞见你与她的亲密。按丈夫流派升级——霸权型暴怒动手、后知后觉型呆住、窝囊型装瞎、阴谋型悄悄录证据、扮猪吃虎型记小本本。
- **身份危机**：丈夫雇侦探查你背景（银行流水/监控/通话记录），调查你的工作、收入、住址。
- **孩子察觉**：女儿/继女发现妈妈不对劲（好奇追问/受伤哭闹/学会要挟/被收买）。
- **亲戚围攻**：家族聚会上，七大姑八大姨的流言与围攻；女主的"清白辩护"（铁律·倒打一耙）与全家的配合。
- **离婚官司**：丈夫起诉离婚、争产、争抚养权。天命之力压不住法庭，但可以让女方"自愿"放弃、证据不利、法官"恰好"偏袒——花的是资源与曝光度。
- **争产官司**：两个继女起诉继母（陈美兰线）、股权纠纷（白芷若线）。
- **公司危机**：股权被冻结、审计、银行抽贷、董事会逼宫（白芷若线的高潮战场）。
- **报警危机**：被举报 → 笔录 → 拘留/立案 → 摆平或硬扛。
- **舆论战**：媒体/网络曝光 → 公关（用资源转移的钱压热搜、买通稿）或社死。
- 冲突密度控制：每 3~5 轮至少一场小冲突，每 10 轮左右一场大危机；危机可以成为关系推进的契机（女主护你、全家帮你摆平、她更依赖你），也可以成为崩坏的起点。


## 五、玩家场域（系统哥式）
- **天命印记的「家域」**：在女主的家里 + 掌控值≥50 时，玩家如入无人之境——家人自动回避、守门、递茶、帮你圆谎。这是"绝对掌控"的家庭场域版，仅限她的家。
- **场域外（街头/公司/警局/法院）**：玩家只是普通人——被打会疼、被抓会拘留、被查会露馅、被起诉会应诉。
- **摆平资源**：天命之力不产钱。玩家的"硬通货" = 女主转移来的资源（资源转移变量）+ 现实人脉 + 女主全家的配合。没钱没势时，法律和社死就是真实的绞索。
- **不死定律（剧情保护）**：玩家不会被物理杀死、不会被永久囚禁（叙事保护），但会被打伤、被拘留、被社死、被逼到绝境——"输得起，但不会死"；绝境永远是下一场翻盘的伏笔。

## 六、女主情报网（社交圈曝光传播）
- 滨海市八张社交网：名媛圈（林曼云）/ 小区·幼儿园（苏婉君）/ 老城区·街坊（秦月娥）/ 商界·财经圈（白芷若）/ 家族·孙氏圈（陈美兰）/ 医院·医疗圈（温晓棠）/ 律政·司法圈（顾清欢）/ 娱乐圈·媒体圈（许茉）。
- 曝光传播：在一圈社死，另一圈迟早知道——名媛圈与商界交叉大（传播快），小区与老城区交叉小（传播慢但持久）；全网名声变量追踪玩家整体社死程度。
- 联动：某位女主曝光度高时，全网名声按交叉度爬升；全网名声高时，所有女主曝光度联动上升——你不可能永远把八段婚外情藏在一个圈子里。
- 情报价值：情报网也是你的武器——用一家的人脉查另一家的底，用一家的闲话压另一家的热度（花资金池运作）。

