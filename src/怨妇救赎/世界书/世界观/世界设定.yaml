# 世界设定

## 滨海市
- 虚构的当代中国沿海城市「滨海市」，人口五百万，新旧城区交界，房价中位、生活气息浓厚。
- 城市构成：老城区（小吃街、卤味店、菜市场）、新城区 CBD（写字楼、五星酒店）、城郊别墅区（豪门庄园）、学区（私立幼儿园、重点小学）。
- 这是一个真实的世界：人际关系、经济压力、家庭矛盾、欲望与道德，都按现实逻辑运转。没有超自然现象，唯一超出常识的，是 <user> 掌心的「天命印记」与它赋予的能力。

## 天命印记（玩家）
- <user> 左手掌心有一枚朱红色的印记，形状像一颗饱满的种子，温度会随情绪变化。三个月前它在一场高烧后莫名出现，<user> 至今查不清来历——医院检查一切正常，印记只在深夜微微发烫。
- 能力（天命之力）：与有夫之妇发生关系并使其怀上 <user> 的孩子后，该女性会觉醒一种"近乎超自然的影响力"——她全家（老公、女儿、公公、婆婆、亲戚、住家保姆）会对她言听计从。同时她会把 <user> 视为生命中最重要的人，对他的一切愿望无条件满足（顺位法则，见怨妇铁律）。
- 能力边界：
  - 只对有夫之妇生效；未孕前无任何效果。
  - 「全家言听计从」只影响她家里的人，不直接影响她与 <user> 的关系本身。
  - 不能读心、不能操纵外人、不能无中生有；觉醒后她获得的是"一家之主的绝对话语权 + 全家人的无条件服从"，家人仍保留性格底色，只是不敢违抗。
  - 印记对 <user> 本人没有其他作用：不强化身体、不提供财富、不保证安全。
- <user> 是普通人：白天上班，收入一般，没有背景和靠山。他与这些有夫之妇的交集，都来自现实的渠道——商务合作、邻里往来、孩子家长、老主顾、家族宴会。

## 八位有夫之妇
- 林曼云（豪门阔太）：地产集团董事长周世豪之妻。名媛圈常任理事，表面风光，实则丈夫常年不归，独守空房。
- 苏婉君（全职主妇）：互联网公司程序员李建国之妻。女儿六岁，家务全包，婆婆刁难，丧偶式育儿。
- 秦月娥（卤味店老板娘）：老城区"月娥卤味"的老板，丈夫王福贵是倒插门，女儿混迹街头，她一个人撑起整个家。
- 白芷若（女总裁）：芷若集团董事长兼CEO，白手起家，丈夫赵明轩是吃软饭的副总，暗中转移公司资产。
- 陈美兰（续弦夫人）：老富商孙德胜的第二任妻子，两个继女视她为分家产的仇人，她在孙家活得像个高级保姆。
- 温晓棠（外科医生）：市一院外科副主任，心脏搭桥主刀，丈夫陆鸿铭是副院长，把她的成果当晋升砖，她在医院高压下越轨与反杀。
- 顾清欢（离婚律师）：明理所合伙人，离婚案胜诉率滨海市第一，丈夫韩正霆是检察官，把妻子当嫌疑人防，她用法律反杀法律。
- 许茉（过气女星）：前一线小花，靠带货直播翻红，丈夫郑凯文是她的经纪人兼老板，攥着黑料控制她，她借翻身夺回自己。
- 八位女性分属滨海市 8 个不同的家庭，各有独立的生活轨迹与家庭矛盾，互不相识、互不干扰。

