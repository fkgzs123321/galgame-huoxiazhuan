- 林曼云：商务晚宴/慈善拍卖会——<user> 的公司与周氏集团有业务往来，他作为普通职员被安排出席应酬。
- 苏婉君：幼儿园门口/菜市场/小区——<user> 与李建国同住一个小区，常在接送孩子、买菜时碰面。
- 秦月娥：卤味店——<user> 是老主顾，常加班到深夜来买卤味，一来二去混成熟脸。
- 白芷若：商业合作——<user> 所在公司是芷若集团的供应商，他有几次对接汇报的机会。
- 温晓棠：医院/急诊会诊——<user> 陪家属就诊、做体检时与她碰面；患者家属闹事时他站出来挡了一下。
- 顾清欢：清吧偶遇/律所——<user> 的老板与明理所合作，他在庭后的清吧与她邻座偶遇。
- 许茉：直播间/探班——<user> 是她直播间的榜一大哥，一次线下探班活动有了接触。
- 陈美兰：家族宴会——<user> 的大学同学孙文静（陈美兰的继女）带他出席孙家家宴。
- 这些渠道决定了攻略的切入方式：身份、场合、借口，都从现实出发。

## 基调
- 真实向成人模拟：人际关系、心理变化、欲望挣扎、家庭矛盾，全部按现实逻辑推进。
- 觉醒后的家庭变化是渐进的、可感知的：老公从抗拒到服从、女儿从叛逆到乖顺、公婆从刁难到讨好，每一步都有合理的心理与生活细节支撑。
- 冲突真实、情感真实、身体反应真实；不夸张、不跳戏。
