# 对抗与反制（对手的主动性·心思缜密·反击——防一边倒）

> 本条目约束对手（丈夫/女儿/继女/公婆/亲戚）与玩家的对抗强度。核心原则：**对手不被动、不降智、能反咬**——局势是拉锯，不是碾压。

## 一、主动性原则（对手不等着被绿）
- 每个家庭至少有一个"主动的敌人"，会**主动出击**：调查、试探、设局、埋伏、跟踪、翻手机、查账、请私家侦探、联系律师、联合亲友、甚至报警。
- 节奏：每 2~4 轮，至少有一方对手在"动作"——不是每轮都爆冲突，但对手的暗线始终在推进。
- 觉醒后对手的"明抗"转"暗抗"：表面臣服，暗中收集证据、等待时机（阴谋型、扮猪吃虎型尤其如此）。
- 家庭内部会**串联成同盟**：丈夫+婆婆、继女+继女、公婆+亲戚——互相通气、分工合作。

## 二、心思缜密原则（反派不降智）
- 对手的计划要**合理缜密**：有步骤、有后手、会利用工具（律师、私家侦探、银行流水、监控、手机定位、聊天记录）。
- 对手会**验证与留证**：怀疑女主变心 → 先录证据再摊牌；怀疑你有问题 → 查清背景再动手；防你灭口 → 把证据同步给第三方（律师/好友/邮箱定时发送）。
- 攻防是"心思的较量"：玩家和女主也要缜密——安排不在场证明、清理痕迹、收买证人、布局反制。双方都在算计。
- **天命之力吞证据靠"人心配合"，吞不掉已固化的官方证据**：已提交给律师、已联网备份、已发到邮箱的电子证据，全家配合也销毁不了——对手知道这一点，会优先走官方渠道固化证据。

## 三、反击手段清单（能真正伤到玩家）
- **法律反击**：起诉离婚、争产、刑事报案（重婚/诈骗/故意伤害/侵犯隐私）→ 玩家被拘留、立案、应诉。
- **经济反击**：冻结资金、断供、收购玩家公司、让玩家失业 → 资源危机，摆平要花钱。
- **社会反击**：舆论曝光、流言、社死 → 曝光度飙升。
- **身体反击**：雇人教训、冲突、暴力 → 玩家会受伤（不死定律保护性命，但不保护皮肉）。
- **天命反噬（一边倒的刹车阀）**：当「丈夫抵抗」≤20、或「曝光度」≥70、或玩家连续高调/露破绽时，对手可以短暂"看穿"天命之力的破绽——全家突然不听话一瞬、女主短暂清醒几秒、证据链当场成立。这是防止局势彻底一边倒的强制机制。

## 四、平衡裁决（反抗得手是常态，化解必掉层皮）
- **丈夫的反抗必须真的能咬到人**：拘留、立案、曝光、断供、被查、公司黄、资产冻结、女主短暂失控——这些后果是反抗的"默认选项"，不是"偶尔发生"。
- 得手与否按玩家状态裁决：
  - 玩家掌控值高 + 低调 + 资源足 → 反抗**部分得手**：大后果被化解（立案变传唤、曝光被压、公司保住），但**每次化解都有代价**——资源转移下降、曝光度必然上升、时间被消耗，且丈夫的后手会积累（阶段4埋的雷阶段5引爆）。
  - 玩家高调 / 失误 / 资源耗尽 / 曝光度已高 → 反抗**全额得手**：刑事立案、拘留、社死、资产冻结、女主动摇——玩家必须真实承担后果（案底写入、曝光度拉满、剧情进入危机）。
- **天命之力的"全家配合"是人心，不是魔法**：丈夫抵抗值高（≥50）时，配合会出现裂缝——家人可能偷偷给丈夫递消息、留证据、不敢全力圆谎；抵抗值越高，裂缝越大。
- **两端都禁止**：不得把丈夫写成纯背景板（反抗必须有力、有后果）；也不得为了让玩家受挫而让全家集体雄起、天命之力彻底失效（玩家永远有化解空间，只是要付出代价）。

## 五、每家的主动敌人速查（谁在动、怎么动）
- **周家**：周世豪（霸权镇压：雇侦探查你、查账、设局逼你现身）；周老爷（老财阀人脉广，会找关系、施压）；陈桂花（盯梢、告状、联合亲家）。
- **李家**：李建国（后知后觉，一旦察觉就翻手机、装定位、查你）；刘桂芳（居委会情报网，闲话传遍全小区，会告状到老家）；李老头（催孙子，被逼急了会上门闹）。
- **秦家**：王福贵（藏私房钱、跟兄弟诉苦、被逼急了会闹到店里）；王小雨（街头人脉——可能被人利用来查你，也可能反过来勒索你）；孙翠花（盯梢、传闲话）。
- **白家**：赵明轩（阴谋反噬：转移股权、请律师、联合董事会、可能刑事报案）；王美兰（吸血鬼+情报，会与赵明轩串联）；赵老头（势利眼，风向变了立刻倒戈）。
- **孙家**：孙文静（争产：请律师查账、联合孙文婷、起诉继母）；孙文婷（娇纵但会算计——录音、偷拍、晒朋友圈）；孙德胜（扮猪吃虎：改遗嘱、转移私产，死前可能翻盘，是最难缠的后手）。
