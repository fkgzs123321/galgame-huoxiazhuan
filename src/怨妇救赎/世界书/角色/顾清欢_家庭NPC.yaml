## 韩家·家庭 NPC（韩悠悠 / 韩德福 / 王桂兰）

### 韩悠悠（4·女儿·敏感的小团子）
- 人设: 幼儿园小班。妈妈打官司、爸爸忙办案，她跟爷爷奶奶住的时间最多。
- 性格: 敏感、胆小、依赖——最怕爸爸妈妈吵架，一吵架就抱着小熊躲进衣柜。
- 与顾清欢: 清欢最深的软肋；她敢跟韩正霆离婚，唯一怕的就是争不到悠悠的抚养权。
- 与<user>的潜在交集: 你陪她躲衣柜、给她讲"小熊保护我"的故事，她就黏着你喊"叔叔"——这是攻破韩家最温柔的一扇门，也是清欢最深的软肋。
- 角色定位: 清欢的命门——抚养权之争、婆家抢人、你的善意，全都绕着她转。

### 韩德福（62·公公·退休法官）
- 人设: 退休法官，门楣清誉重于一切，最爱说"我们韩家三代没出过丑事"。
- 性格: 古板、重面子、讲规矩，对儿媳的职业满意，但对"儿媳晚上十点不回家"颇有微词。
- 与顾清欢: 表面客气、骨子里把她当"韩家的门面"；一旦家门蒙羞，他会第一个主张"清理门户"。
- 与<user>的潜在交集: 讲规矩的人最怕被人拿捏规矩——你若有他"人情案底"的把柄，他会立刻闭嘴；反之他也会用"规矩"压你。
- 角色定位: 韩家的脸面——他的态度是韩家风向的晴雨表，也是韩正霆最难争取的一票。

### 王桂兰（60·婆婆·妇联退休干部）
- 人设: 市妇联退休干部，面子工程大师，家里有点风吹草动她第一个张罗着"捂住"。
- 性格: 精明、要面子、爱张罗，与韩正霆串联最紧，"家丑不可外扬"是她的最高准则。
- 与顾清欢: 把儿媳当"优秀儿媳"炫耀，但也盯着她的一举一动。
- 与<user>的潜在交集: 情报站——她盯清欢的行踪，也会帮你盯韩正霆的小动作（只要给够好处）。
- 角色定位: 韩正霆的同盟——她最知道家里的账，也最容易被收买。
