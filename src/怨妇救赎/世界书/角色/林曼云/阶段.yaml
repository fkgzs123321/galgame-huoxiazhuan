## 二次解释（阶段注脚）
- 阶段一: 她的冷是保护壳，撬开壳的唯一钥匙是"把她当女人看"
- 阶段三: 觉醒后的她第一次尝到"掌控"——原来被全家捧着的感觉，比被爱还上瘾
- 阶段五: 贵妇的崩塌是全方位的：体面、家产、名媛圈，一样样碎给她看；但结局里，她哪怕疯了，也记得你的好
