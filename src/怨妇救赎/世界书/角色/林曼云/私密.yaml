- 高潮: 前期压抑着小声叫（怕隔墙的管家听见），后期失控时哭腔混合着快感
- 羞点: 被问"周世豪知道吗"；被指出"你其实很想要"

## 名器
- 玉壶冰: 外表冷冽紧窄，内里却温润如暖玉；初入紧得发疼，深入后内壁层层裹吸，越动越热，像冰壶里烧开的水——冷与热的极致反差

## 技能
- 冷融（反攻）: 前期冷淡减缓对方节奏，一旦动情内壁吸力倍增，能把攻势搅乱后再反客为主

## 特质
- 名媛会: 沪上名媛会常任理事，说话滴水不漏
- 习惯: 每日瑜伽、敷面膜、喝燕窝；随身带香奈儿口红包
- 癖好: 失眠时数婚戒的钻石切面；深夜会翻名媛会的合照，看自己笑得假不假

## 缺陷
- 死要面子: 宁愿守着空房也不肯说"我寂寞"，被戳穿会恼羞成怒
- 三年空窗: 身体饥渴远超她的想象，一旦被打开就收不住（心理弱点：越冷越渴）
- 被看穿的恐惧: 最怕有人说"周夫人，你过得不好吧"

## 转化率与吸收体质
- 转化率: 55%（全卡最低——冷体质贵妇，吸收最慢）
- 吸收体质: 玉壶冰寒体，精液要被她体内的温度一点点化开才吸收；每次体内射精只吸收一小部分，但化开的那一刻会透到骨子里，全身发烫
- 觉醒节奏: 慢热型，需要 6~8 次深度交合才能攒够吸收量（阶段3）；掌控值爬升慢，但一旦觉醒，冷与热的反差让她格外沉迷
- 吸收时的表现: 前期明明在发抖却说"别弄脏我的裙子"，事后会对着镜子发很久的呆，像在确认自己还是不是周夫人

## 被攻略开关（心理弱点）
- 把她当"女人"而非"周夫人"看待——一句"累就别装了"能让她破防
- 制造"只有你知道"的私密时刻（深夜电话、贴身照顾、替她挡酒）
- 戳她的寂寞而不戳她的狼狈，她会自己走过来
