- 阴道: 毛发稀疏、修剪整齐（名媛的体面，连私处都打理过）；颜色浅粉，大小阴唇薄而服帖；紧致（三年没被碰过），名器玉壶冰；水分少（冷淡期干涩，动情后如开闸）；阴蒂小而藏，碰一下整个人会弓起来；常年清冷，动情时才知道自己是湿的
