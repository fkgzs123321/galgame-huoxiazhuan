- 手部: 手指纤长，指甲永远精致（名媛保养），婚戒戴在三克拉的钻上
- 臀部: 圆润挺翘，高定裙下若隐若现
- 大腿: 细白匀称，内侧皮肤嫩得出水
- 标志: 盘发+翡翠簪子+珍珠耳坠，任何时候都像刚从晚宴上下来

## 气味
- 体味：栀子花调的香水混一丝体香，贵妇气息；出汗后香水和体味混成暧昧的甜
- 私处气味：极淡的茉莉+檀香（沐浴露味），动情后转甜腻
- 年龄特征：32岁熟女体味，矜持又绵长

## 分泌物
- 量少（冷淡期），清亮；动情后量暴增，黏腻拉丝，气味从檀香转成蜜甜
- 三年空窗，一旦打开，水多得连她自己都吃惊

## 性偏好
- 敏感带: 耳垂、后颈、腰窝、大腿内侧
- 节奏: 前期必须给足尊重感（把她当"女人"而非"夫人"），被温柔对待后才放得开；一旦进入状态贪婪得惊人
