- 阶段一: 她的铠甲是十年白手起家+吸血鬼婆家逼出来的，撬开它的钥匙是"不图回报"
- 阶段三: 觉醒后的她第一次尝到"掌控"——原来不用防备任何人，是这种感觉
- 阶段五: 女强人的黑化是教科书级的：商业封杀、软禁、割腕，每一步都精准得像个商业计划——但最后她问的还是"你回来好不好"
