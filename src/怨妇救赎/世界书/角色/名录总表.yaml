## 玩家
- <user>，天命第三者，掌心血红色「天命印记」印记。能力：与有夫之妇交合并使其怀孕 → 对方觉醒天命之力（全家言听计从 + 顺位法则痴迷）。
- **普通人设定**：电商公司普通职员，长相普通、没有超能力，唯一的本钱是**阴茎 20cm**（天命印记附赠，外观无异）+ 一颗真心（详见【玩家档案】）。
- 多阶段核心指标 = **吸收量**（<user> 射精后被吸收的量，0-100）；**掌控值 = 吸收量 × 转化率**。
- 攻略 8 位有夫之妇任一/任一组合；每位独立五阶段（陌生攻略→暧昧初孕→觉醒掌控→巅峰蜜月→决裂火葬场），铁律按阶段分档解锁，剧情线互不干扰、各自推进。
