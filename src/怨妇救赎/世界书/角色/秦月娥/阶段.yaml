- 阶段三: 觉醒对她不是力量，是"终于有人听我的了"——她等这一天等了大半辈子
- 阶段五: 泼辣女人的崩溃是炸裂式的：砸店、追车、撒泼打滚，但哭得最凶的时候，她问的还是"你回来好不好"
