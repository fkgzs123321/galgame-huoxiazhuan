## 白家·家庭 NPC（赵小棉 / 赵老头 / 王美兰）

### 赵小棉（5·女儿·黏人的小棉袄）
- 人设: 幼儿园中班。黏妈妈，是芷若唯一的软肋。
- 性格: 天真、依赖、敏感——妈妈加班到深夜，她抱着小玩偶等妈妈。
- 与白芷若: 相依为命；芷若敢跟赵明轩离婚，唯一怕的就是争不到她的抚养权。
- 与<user>的潜在交集: 你对她好，她就黏着你喊"爸爸"——这是攻破白家最温柔的一扇门，也是芷若最深的软肋。
- 角色定位: 芷若的命门——抚养权之争、婆家抢人、你的善意，全都绕着她转。

### 赵老头（60·公公·势利眼）
- 人设: 势利眼公公，嫌儿媳"抛头露面丢人"，逢人吹嘘"公司是我儿子管着"。
- 性格: 虚荣、嫌贫爱富、风向变了立刻倒戈。
- 与白芷若: 白拿钱还看不起人；乖顺，但一旦你失势，他第一个踩。
- 与<user>的潜在交集: 势利眼——你富贵时他巴结你，你落魄时他第一个去派出所举报。
- 角色定位: 墙头草——他的态度是白家风向的晴雨表。

### 王美兰（58·婆婆·吸血鬼）
- 人设: 吸血鬼婆婆，隔三差五来要钱，"儿子养你，你给点钱怎么了"。
- 性格: 贪婪、会算计、嘴碎，与赵明轩串联最紧。
- 与白芷若: 把芷若当提款机，还会联合赵明轩算计她的股份。
- 与<user>的潜在交集: 情报+帮凶——她盯芷若的花销，也会帮你盯赵明轩的小动作（只要给钱）。
- 角色定位: 赵明轩的同盟——她最知道家里的账，也最容易被收买。
