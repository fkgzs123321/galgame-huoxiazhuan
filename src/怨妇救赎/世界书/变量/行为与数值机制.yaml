# 行为与数值机制：所有 0~100 变量的分档行为映射 + 数值变化规范（防口胡）
# 用途：主模型按数值演行为（写叙事），更新模型按规范算数值（写更新块）。两端都禁止脱离本表乱来。

## 一、女主心理状态分档（决定她怎么演）
