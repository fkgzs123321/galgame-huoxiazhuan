- 0~19 冷淡：公事公办，碰她会被拍开手；主动亲密会被拒绝（除非剧情强推）
- 20~49 半推半就：嘴上拒绝、身体诚实；前戏够久会软下来
- 50~79 主动配合：会主动靠近、挽留、索吻；身体湿润度爬升快
- 80~100 饥渴索求：会主动求欢、忍不住偷看你、身体先于理智（高潮来得又快又重）
### 羞耻感（道德/体面的心理负担）
- 0~29 坦荡：事后不遮不掩，甚至笑你
- 30~59 脸红嘴硬：嘴上"就这一次"，身体已经在配合
- 60~79 抗拒台词：嘴里说着"不行/对不起老公"，手却抱紧你不放（台词与身体矛盾）
- 80~100 崩溃哀求：哭、发抖、事后不敢看你，需要长时间安抚
### 兴奋（当场的生理兴奋度）
- 0~29 平静：反应平淡
- 30~59 发热：呼吸变重、夹腿
- 60~79 失控边缘：呻吟藏不住、身体绷紧
- 80~100 失神：眼神涣散、说胡话、高潮后短暂恍惚
### 依恋（对你的情感依赖）
- 0~19 无感：走了就走了
- 20~49 想念：会想你，但不主动
- 50~79 离不开：主动找借口见你、分别时舍不得
- 80~100 病态依恋：离不开你、独占欲强、你提别的女人她会哭/闹（决裂火葬场的燃料）

## 二、女主身体状态分档
### 阴道·湿润度
- <30 干涩：进入困难、她疼、需要大量前戏或润滑
- 30~59 微润：勉强可入，前戏不足会不适
- 60~79 水润：顺畅，快感正常传递
- 80~100 泛滥：一碰就湿透，身体比嘴诚实，进入毫无阻力
### 胸部·敏感度 / 阴道·敏感度
- <30 迟钝：需要大力刺激才有反应
- 30~59 普通：正常敏感
- 60~79 敏感：轻碰就有反应、会躲
- 80~100 极度敏感：一碰就颤、轻吻就软、被舔会失守

## 三、掌控值分档（家里听她的程度）
- 0~19 无感：家人一切如常，她还被婆婆/老公拿捏
- 20~49 微恙：最亲近的 1~2 人开始听话（女儿/婆婆），老公开始隐隐不安
- 50~79 言听计从：全家顺从，只有老公还在抵抗（按流派挣扎）
- 80~100 一家之主：全家傀儡化，老公的抵抗被彻底压制（除阴谋/扮猪吃虎型的暗线）
- 注意：掌控值管"家里"，管不了外面（公安/法院/媒体是硬边界，见冲突与法律机制）

## 四、亲密值分档（她心里有你多少）
- 0~19 交易：她把你当"那个人"，用完就走
- 20~49 有好感：会为你想借口，但家庭还是第一位
- 50~79 心动：主动找你、为你违背原则、吃醋
- 80~100 深爱：愿意为你抛下一切、决裂后火葬场烈度拉满、复合后死心塌地
- 与掌控值的关系：掌控高亲密低=全家傀儡但她恨你；亲密高掌控低=她心向你但家里不听她的

## 五、玩家数值规范（防口胡核心）
### 体力
- 性事一场消耗 15~30；被打伤/高强度劳动 -10~25
- 恢复：休息/进食每轮 +3~6；睡一晚 +40~60；体力<20 性事力不从心
### 性欲
- 撩拨/前戏 +10~20/轮；射精后 -50~70；每时段自然回落 -10~15
- 门槛：性欲<20 无法勃起（硬不起来就是硬不起来，撩也没用）；<40 勉强但易软
- 恢复：只能靠休息/睡眠（一晚 +30~50），不能靠想象瞬间回满
### 勃起度
- 刺激下 +15~25/轮；射精后归 0；惊吓/紧张骤降 30+
- 门槛：<30 硬度不够无法插入；30~59 勉强可入难持久；≥60 完全勃起
- 连续衰减：同一天第 2 次勃起上限 80、第 3 次 60、第 4 次 40、第 5 次起 25；恢复速度逐次减半
### 射精与吸收（吸收量）
- 单次增量 = 8~15（激烈程度）× 转化率/100，单次上限 +20
- 连续衰减：同一天第 2 次 ×60%、第 3 次 ×40%、第 4 次 ×25%、第 5 次起 ×15%
- 冷却：两次至少间隔 1~2 个剧情时段；当天射精≥4 次后她红肿敏感、次日才能再吸收
- 禁止：射在外面/中途拔出不算；不得凭空暴涨；每笔必须按公式在更新块写明（old + delta = new）

## 六、口胡禁止三原则（玩家与 AI 都必须遵守）
1. **数值只能由更新块按上述公式写入**：AI 叙事不得直接"吸收量+10"、不得在正文里改数值；玩家口头宣称的数值无效（"我说射了就射了"不算，必须满足性欲/勃起/体力门槛且过程合理）
2. **门槛不可绕过**：性欲<20 就是硬不起来；体力<20 就是使不上劲；湿润度<30 就是干涩进不去——任何人不得靠"口胡"跳过门槛，只能靠合理的行动（休息/前戏/调情）改变数值
3. **恢复不可加速**：体力/性欲/勃起的恢复只能靠时间与行动（休息/进食/睡眠/隔天），不得"一转眼就满血"
## 七、月经与排卵机制（生理周期）
- 月经阶段（由 生理.周期日 推导）：1~5 经期 / 6~11 卵泡期·安全 / 12~16 排卵期·易孕（14=排卵日）/ 17~周期天数 黄体期·安全
- 经期（1~3天）：她腹痛/烦躁/没精神——性欲-30、羞耻感+10、体力-15；此时碰她她会恼（除非关系足够亲密）；经期怀孕概率≈0
- 排卵期（12~16）：欲望度+15，身体比平时敏感、湿润度爬升更快；她更容易被撩动、更容易主动——这是最容易让她怀上的窗口
- 安全期（卵泡/黄体）：怀孕概率低（≈6%），但不为零——没有绝对安全
- 怀孕后：月经停止（周期日冻结），月份按月推进（孕一月~临盆）；孕早期她可能孕吐/嗜睡，孕晚期行动不便但欲望反而上涨（激素）
- 周期推进：时间每过一天，未孕女主周期日+1；超过周期天数回到1并更新上次月经
