# 变量更新规则：更新块按本规则算数值。口胡禁止/衰减/门槛总则见【行为与数值机制】。

时间:
  日期: format YYYY年M月D日，跨日更新
  星期: 与日期联动
  时段: '上午'|'下午'|'晚上'|'深夜'

玩家:
  体力:
    range: 0~100
    check:
      - 性事/劳动/受伤 -5~25；静坐进食 +3~6/轮；睡眠 +40~60；<20 性事力不从心；0 力竭昏迷
  性欲:
    range: 0~100
    check:
      - 前戏/撩拨 +10~20/轮；射精后 -50~70；每时段自然 -10~15；<20 无法勃起，<40 勉强易软；恢复靠休息睡眠
  勃起度:
    range: 0~100
    check:
      - 刺激 +15~25/轮；射精后归0；惊吓骤降30+；<30 硬度不足无法插入，30~59 难持久，≥60 完全勃起
      - 连续衰减：同日第2次上限80/第3次60/第4次40/第5次起25，恢复逐次减半

当前目标:
  type: ''|女主名
  check: 与某位女主明确互动时写入；每次只写一人；自由时段可为''

女主.${名字}:
  吸收量:
    range: 0~100（只增不减）
    check:
      - 仅体内射精后增长 = 基础8~15（激烈度）× 转化率/100，单次上限+20
      - 连续衰减：同日第2次×60%/3次×40%/4次×25%/5次起×15%；两次间隔1~2时段；当日≥4次次日才能再吸收
      - 体外射精/中途拔出不算；禁止凭空暴涨
  转化率:
    check: 建档固定（曼云55/婉君95/月娥85/芷若70/美兰90/晓棠60/清欢75/茉茉65）；决定吸收速度与掌控强度
  掌控值:
    check: = 吸收量×转化率/100（每次吸收量变化后重算取整）；未孕不涨，怀孕后生效（孕期×1.5）；分档家庭影响见行为机制
  亲密值:
    range: 0~100
    check:
      - = 情感依恋度（不是性欲）。亲密/交心 +3~15，被真心对待+5~20；长期不见-1~3/轮；吃醋-10~20
      - 影响：主动找你的频率、出轨心理负担、觉醒后忠诚度、火葬场烈度。亲密≠掌控：掌控管家里，亲密管心里
  丈夫抵抗:
    check:
      - 建档初始（世豪90/建国70/福贵40/明轩95/德胜85/鸿铭80/正霆85/凯文78）
      - 掌控值每+10 抵抗按流派定速降10~25（霸权/阴谋/扮猪吃虎/程序正义/舆论操纵慢；窝囊/后知后觉/道貌岸然快）
      - ≥60挣扎（按流派反抗）/ 30~59沉默妥协 / 1~29臣服 / 0跪舔；赵明轩≤20触发反噬事件
  曝光度:
    check: 撞见/流言/曝光/报警 +5~30；<30风言 / 30~59疏远排挤 / 60~79社死+官司 / 80+全网+法律追咬；公关可降
  案底:
    type: ''|治安拘留|刑事立案|取保候审
    check: 报警/立案写入，摆平更新；有案底时家域仍有效但压不住公安
  危机状态:
    type: ''|传唤|拘留|立案|诉讼|和解|坐牢
    check: 按危机事件条目推进；非空时该女主家域受限
  怀孕:
    type: '未孕'|'孕一月'~'临盆'
    check:
      - 仅体内射精后判定：概率=15%基础×时期系数×吸收量系数（公式见生理.周期日）
      - <user> 可"故意让她怀上"强制成功；胎儿必属<user>
      - 怀孕后月经停止（生理冻结）、按月份推进；孕早期孕吐/嗜睡，孕晚期欲望反涨；不直接改阶段
  生理.周期天数:
    check: 建档固定（曼云28/婉君30/月娥27/芷若26/美兰31/晓棠29/清欢28/茉茉25）
  生理.周期日:
    check:
      - 时间每过一天未孕女主+1；>周期天数回1并更新上次月经；怀孕后冻结
      - 阶段推导：1~5经期 / 6~11卵泡·安全 / 12~16排卵·易孕(14=排卵日) / 17~周期天数黄体·安全
      - 经期1~3天性欲-30/羞耻+10/体力-15；排卵期(12~16)欲望+15更易主动
  生理.上次月经:
    check: 周期日回1时更新为当天日期；用于推算预产期（末次月经+280天）
  阶段:
    check: 每轮强制重算：决裂→5 / 吸收量≥60→4 / ≥30→3 / ≥1→2 / 否则1
  丈夫察觉度:
    check: 高调亲密/资源转移被看见 +5~20；≥70触发家庭危机事件
  资源转移:
    check: 女主主动转移财产给<user>上升；阶段3起快速增长；100=家产尽归
  决裂:
    check: <user>主动断绝→true（阶段5）；复合→false回阶段4
  火葬场进度:
    check: 仅决裂=true时按追夫火葬场逐段推进；终局退场=悲剧收尾，复合则清空
  专属.${key}:
    check: 每人专属引擎（曼云名媛会/婉君抚养权/月娥店契/芷若股权/美兰遗产/晓棠论文权/清欢律所执照/茉茉工作室合同）；按剧情更新
  名器/技能:
    check: 建档固定（玉壶冰/暖玉/熟透/龙泉/暗井/银针/竹节/星涡；冷融/绵缠/热浪/盘根/吸髓/回春/缜密/星引）
  身体状态.${部位}.${字段}:
    check: 按刺激更新，冷却回落；湿润度<30干涩/30~59微润/60~79水润/80+泛滥；湿润度随欲望度爬升更快
  心理状态.${欲望度|羞耻感|兴奋|依恋}:
    check: 按亲密与关系更新；分档行为映射见【行为与数值机制】
  心理状态.精神状态:
    check: 正常/恍惚/失神/依恋/崩溃/病态
  心声:
    check: 内心活动显著变化时更新（第一人称，不出现在叙事）
