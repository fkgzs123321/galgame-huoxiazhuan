# 变量字典与范围（供更新模型对照）

## 顶层
- 时间.日期: string（YYYY年M月D日）
- 时间.星期: string
- 时间.时段: '上午'|'下午'|'晚上'|'深夜'
- 玩家.体力: number 0~100
- 玩家.资金池: number 0~99999999（元，从女主资源转移流入，用于摆平）
- 玩家.全网名声: number 0~100（社交圈传播，高时各女主曝光度联动）
- 玩家.性欲: number 0~100
- 玩家.勃起度: number 0~100
- 当前目标: string（'' 或 女主名）

## 女主.${名字}（林曼云/苏婉君/秦月娥/白芷若/陈美兰）
- 身份: string
- 丈夫: string
- 家庭: string
- 名器: string（建档固定，如 玉壶冰/暖玉/熟透/龙泉/暗井/银针/竹节/星涡）
- 技能: string（建档固定，如 冷融/绵缠/热浪/盘根/吸髓/回春/缜密/星引）
- 吸收量: number 0~100（核心指标，体内射精后增长）
- 转化率: number 0~100（固定建档：林曼云55/苏婉君95/秦月娥85/白芷若70/陈美兰90/温晓棠60/顾清欢75/许茉65）
- 掌控值: number 0~100（= 吸收量×转化率/100，天命之力强度）
- 丈夫抵抗: number 0~100
- 曝光度: number 0~100（东窗事发程度，公关可降）
- 案底: ""|治安拘留|刑事立案|取保候审
- 危机状态: ""|传唤|拘留|立案|诉讼|和解|坐牢（初始：周世豪90/李建国70/王福贵40/赵明轩95/孙德胜85/陆鸿铭80/韩正霆85/郑凯文78；随掌控值上涨按挣扎流派下降）
- 亲密值: number 0~100
- 怀孕: '未孕'|'孕一月'|'孕二月'|'孕三月'|'孕四月'|'孕五月'|'孕六月'|'孕七月'|'孕八月'|'临盆'
- 生理.周期天数: 20~40（固定建档，每人不同：28/30/27/26/31/29/28/25）
- 生理.周期日: 1~周期天数（每过一天+1，>周期天数回1并更新上次月经）
- 生理.上次月经: 日期字符串（经期开始日，推算预产期用）
- 阶段: number 1~5（每轮推导：5=决裂 / 4=吸收量≥60 / 3=吸收量≥30 / 2=吸收量≥1 / 1=吸收量0）
- 丈夫察觉度: number 0~100
- 资源转移: number 0~100
- 决裂: boolean
- 火葬场进度: ''|'傲慢试探'|'资源封杀'|'认知崩塌'|'抛弃一切'|'极端强制'|'自毁威胁'|'替身反噬'|'终局退场'
- 专属: object（各人不同，见 initvar）
- 身体状态.胸部: {状态: string, 敏感度: number 0~100}
- 身体状态.阴道: {状态: string, 湿润度: number 0~100, 敏感度: number 0~100}
- 身体状态.肛门: {状态: string}
- 身体状态.嘴: {状态: string}
- 身体状态.肌肤: {状态: string, 体温: string}
- 身体状态.大腿: {状态: string}
- 身体状态.臀部: {状态: string}
- 心理状态.欲望度: number 0~100
- 心理状态.羞耻感: number 0~100
- 心理状态.兴奋: number 0~100
- 心理状态.依恋: number 0~100
- 心理状态.精神状态: string（正常/恍惚/失神/依恋/崩溃/病态）
- 心声: string（她此刻真实想法，第一人称，不出现在叙事）

## 阶段推导速查
阶段=5 决裂=true → 阶段=4 吸收量≥60 → 阶段=3 吸收量≥30 → 阶段=2 吸收量≥1 → 阶段=1 吸收量=0
掌控值 = 吸收量 × 转化率 / 100（取整）
