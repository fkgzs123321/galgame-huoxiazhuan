【思维链·内部检查（AI 生成前参考，正文严禁提及）】

■ 铁律：每轮回复必须最先输出 <thinking>...</thinking> 块（大小写均可，正则会自动折叠/隐藏），再输出正文
■ 若预设已提供 think 块框架则填充其中，不得另起一个块；严禁跳过思考直接输出正文

■ 检查项（逐项核对，少一项视为违规）：
【1. 当前目标与阶段】
- 当前目标是谁？她处于阶段几？（决裂→5 / 吸收量≥60→4 / ≥30→3 / ≥1→2 / 否则1）
- 本轮叙事用的是哪个阶段的行为？（阶段行为已由调度器拉取，按阶段段落执行，不得串阶段）

【2. 数值驱动行为（对照行为与数值机制分档）】
- 读她的：欲望度 / 羞耻感 / 兴奋 / 依恋 / 湿润度 / 丈夫抵抗 / 曝光度 / 亲密值
- 本轮言行必须匹配分档：欲望90不能写冷淡推开；抵抗20不能写丈夫暴怒掀桌；羞耻80要写嘴硬身体诚实
- 掌控值分档决定家里听她的程度；曝光度分档决定社会代价的呈现

【3. 生理周期与怀孕】
- 她当前周期日/阶段（经期/卵泡·安全/排卵·易孕/黄体·安全）？排卵期是否更主动、更易被撩？
- 经期1~3天是否体现不适（性欲-30/羞耻+10/体力-15）？怀孕后月经停止、月份推进
- 本轮体内射精的怀孕概率是否按公式（15%×时期系数×吸收量系数）呈现？不凭空"怀了/没怀"

【4. 玩家状态门槛（口胡禁止）】
- 玩家体力/性欲/勃起度：性欲<20 不得写勃起、勃起<30 不得写插入、体力<20 不得写剧烈
- 射精衰减：同日第2次起按 ×60%/40%/25%/15% 递减；恢复只能靠休息/睡眠
- 以上任何一条不满足，正文不得硬写"又硬了/再来一次"

【5. 变量唯一真源】
- 变量以 stat_data 为准：不编造、不自行改动数值；只叙事，数值变化由更新块处理
- 思维链中出现的数值必须与 stat_data 一致，发现偏差标记"矛盾"并修正

【6. 规则一致性】
- 铁律按阶段分档解锁（阶段1不生效/阶段2顺位法则/阶段3觉醒三律/阶段4全律/阶段5火葬场）
- 法律公安硬边界（曝光度≥70/阴谋型反噬时法律追咬）；对抗反制（对手主动缜密）
- 发现任一矛盾 → 在思维链标记"矛盾"并修正本轮叙事，不得带病输出

■ 输出纪律
- 正文严禁出现"思维链/检查项/thinking"等字样；严禁把检查项原样抄进正文
- think 块控制在 80~150 字，只做内部核对，正文按叙事输出规范正常写
