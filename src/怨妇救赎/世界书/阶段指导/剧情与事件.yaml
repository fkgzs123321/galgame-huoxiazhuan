# 剧情与事件（推进引擎·蓝灯）
<%_ const tgtJ = getvar('stat_data.当前目标', { defaults: '' }); _%>
<%_ const jdJ = tgtJ ? Number(getvar('stat_data.女主.' + tgtJ + '.阶段', { defaults: 1 })) || 1 : 0; _%>
<%_ const ccJ = tgtJ ? Number(getvar('stat_data.女主.' + tgtJ + '.丈夫察觉度', { defaults: 0 })) || 0 : 0; _%>
<%_ const zyJ = tgtJ ? Number(getvar('stat_data.女主.' + tgtJ + '.资源转移', { defaults: 0 })) || 0 : 0;
const dkJ = tgtJ ? Number(getvar('stat_data.女主.' + tgtJ + '.丈夫抵抗', { defaults: 70 })) || 70 : 70; _%>

## 剧情推进总则
- 叙事围绕当前目标推进，每轮至少推进一条线：关系线（与<user>）或家庭线（女主家里的变化）。
- 多女主并行时，未聚焦的女主按各自阶段"自然生活"：她们的家庭矛盾仍在发生，但只在叙事需要时展开。
- 数值变化驱动剧情：吸收量推进阶段，掌控值改变家庭格局，丈夫察觉度引发危机，资源转移引发家庭冲突。

## 日常事件池（按阶段输出，每轮取 1~2 条融入叙事）
<%_ if (jdJ === 1) { _%>
**阶段一（陌生攻略）日常**：以"认识与接近"为主。
- 制造合理交集（商务饭局/接送孩子/店里闲聊/对接会议/家宴应酬）。
- 她的生活切面：操持家务、被婆婆挤兑、深夜独处、工作重压——你从这些缺口切入。
- 偶发的小事：她落下的东西、她随口的一句抱怨、她望向你的那一眼。
<%_ } else if (jdJ === 2) { _%>
**阶段二（暧昧初孕）日常**：以"越轨与拉扯"为主。
- 她开始主动找你：深夜的消息、找口见面、为你准备吃食。
- 家里的裂缝：她敷衍丈夫、与婆家争吵、在婚姻里越来越不耐烦。
- 偷情的张力：差点被发现、被人打量的目光、见面后各自心虚。
<%_ } else if (jdJ === 3) { _%>
**阶段三（觉醒掌控）日常**：以"家里开始变天"为主。
- 她第一次"随口一说就有人照办"——从生活小事开始，掌控感逐日加深。
- 家庭成员的臣服：丈夫的错愕与退让、女儿/继女的乖顺、公婆的讨好。
- 她拉着你"分享权力"：让你看全家如何围着她转。
<%_ } else if (jdJ === 4) { _%>
**阶段四（巅峰蜜月）日常**：以"全家傀儡化 + 资源转移"为主。
- 家庭彻底以她为尊，你被全家当"上宾"供着。
- 资源转移的戏码：房产过户、股权变更、家产流向你。
- 她与你的亲密"示威"：在家人眼皮底下的温存，丈夫只敢低头。
<%_ } else if (jdJ === 5) { _%>
**阶段五（火葬场）日常**：以"疯狂挽回"为主，按火葬场进度推进（见追夫火葬场条目）。
<%_ } else { _%>
**自由时段**：可推进结识新目标、经营已有关系、处理悬而未决的家庭危机。
<%_ } _%>

## 丈夫挣扎事件（按流派与抵抗值触发）
<%_ if (tgtJ && dkJ >= 60) { _%>
- **挣扎中（抵抗 <%- dkJ %>）**：按流派反抗——霸权型查账雇人盯梢、后知后觉型终于察觉、窝囊型藏私房钱嘀咕、阴谋型暗中转移股权、扮猪吃虎型改遗嘱留后手。
- 挣扎的叙事呈现：咆哮、冷战、调查、醉酒、求饶……由 <user> 的应对（安抚/施压/挑拨/旁观）与女主的意志共同决定是升级还是被镇压。
<%_ } else if (tgtJ && dkJ >= 30) { _%>
- **沉默妥协（抵抗 <%- dkJ %>）**：丈夫不再当面反抗，转为沉默、回避、阳奉阴违；偶尔酒后爆发一次，又被压下去。
<%_ } else if (tgtJ && dkJ >= 1) { _%>
- **臣服（抵抗 <%- dkJ %>）**：表面听话、心中仍有怨；被女主使唤得团团转，偶尔一个眼神露出不甘。
<%_ } else if (tgtJ) { _%>
- **完全跪舔（抵抗 0）**：丈夫彻底臣服，资源可被女主完全支配，巅峰蜜月的背景板。
<%_ } else { _%>
- 暂无目标：丈夫们按各自生活轨迹自然运转。
<%_ } _%>

## 危机事件（条件触发）
<%_ if (ccJ >= 70) { _%>
- **丈夫起疑**：察觉度≥70，触发冲突——翻手机/查账/跟踪/当面对质。危机可按人物性格走向：软弱的丈夫崩溃求饶、精明的丈夫暗中调查、暴躁的丈夫爆发。
- **撞见**：你与她的亲密被家人撞见，张力拉满（她护着你、全家装瞎、或闹开）。
- **家庭内部**：资源转移被发现，公婆/继女闹到家里。
- 危机可以被"天命之力"镇压（掌控值越高越容易），也可以成为关系推进的契机——由叙事走向决定。
<%_ } else if (zyJ >= 50) { _%>
- **资源冲突**：资源转移≥50，家里开始察觉"钱不对劲"，引发争产/查账/争吵。
<%_ } else { _%>
- 危机尚未逼近：保持日常与暗流并存，为后续冲突埋线。
<%_ } _%>

## 推进钩子（每阶段给 AI 的下一拍指引）
- 阶段一→二：促成第一次私下独处，让关系越界（酒后/深夜/帮忙之后）。
- 阶段二→三：推进体内射精积累吸收量（≥30 觉醒）；可让她怀上孩子加速掌控。
- 阶段三→四：吸收量≥60 进巅峰；期间穿插家庭"变天"的名场面式细节。
- 阶段四→五：只有 <user> 主动决裂才会进入火葬场——由玩家选择，AI 不主动触发。
