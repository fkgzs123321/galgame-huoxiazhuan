<%_ var lm = Number(getvar('stat_data.女主.林曼云.阶段', { defaults: 1 })) || 1; _%>
<%_ var sw = Number(getvar('stat_data.女主.苏婉君.阶段', { defaults: 1 })) || 1; _%>
<%_ var qy = Number(getvar('stat_data.女主.秦月娥.阶段', { defaults: 1 })) || 1; _%>
