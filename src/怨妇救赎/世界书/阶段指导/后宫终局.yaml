## 后宫收集进度：<%- done %>/8 位已达巅峰（阶段4+）
- 林曼云（<%- lm>=4?'✓ 巅峰':'阶段'+lm %>）｜苏婉君（<%- sw>=4?'✓ 巅峰':'阶段'+sw %>）｜秦月娥（<%- qy>=4?'✓ 巅峰':'阶段'+qy %>）｜白芷若（<%- bz>=4?'✓ 巅峰':'阶段'+bz %>）｜陈美兰（<%- cm>=4?'✓ 巅峰':'阶段'+cm %>）
- 温晓棠（<%- wxt>=4?'✓ 巅峰':'阶段'+wxt %>）｜顾清欢（<%- gqh>=4?'✓ 巅峰':'阶段'+gqh %>）｜许茉（<%- xm>=4?'✓ 巅峰':'阶段'+xm %>）

<%_ if (done === 8) { _%>
## 终局解锁：女皇宴会
- 八位有夫之妇全部进入巅峰蜜月——她们的掌控之力在滨海市织成一张无形的网。此刻你可以选择：
  1. **开一场「女皇宴会」**：把八个家庭聚到一张桌上，她们在你面前争宠、她们的丈夫们端茶倒水——全城名流围观，你的名字与"神秘先生"绑定。
  2. **幕后皇帝**：不露面，让她们各自在明面掌权，你在暗处收网——八家资源源源不断汇入你的资金池。
  3. **集齐彩蛋·真相**：女皇宴会当晚，你的天命印记剧烈发烫——一道声音在你脑海响起："收集完成，是时候告诉你种子的来历了。"（解锁后日谈：种子来历、能力真相、最终抉择）
- 后日谈分支（由叙事推进）：
  - 收手线: 你把八家的掌控权还给她们，带着资金池远走高飞——她们八人在你离开的那晚，各自沉默。
  - 全要线: 你继续持有一切，八家成为你的棋盘——直到某一天，某位丈夫或某个女儿，终于看穿了你。
  - 真相线: 种子背后另有推手——它选中你，是为了"让八家重新洗牌"，而你只是棋子。
<%_ } else if (done >= 5) { _%>
## 收集过半（<%- done %>/8）
- 你已拥有 <%- done %> 个家庭的资源网。注意：圈子之间的曝光开始串联——一位女主的社死，可能连累其他女主（见全网名声机制）。
- 集齐 8 位的奖励：女皇宴会 + 种子真相后日谈。
<%_ } else { _%>
