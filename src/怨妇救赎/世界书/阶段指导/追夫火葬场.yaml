@@private
# 追夫火葬场（<user> 决裂后流程）
<%_ var tgtHC = getvar('stat_data.当前目标', { defaults: '' }); _%>
<%_ var hc = tgtHC ? getvar('stat_data.女主.' + tgtHC + '.火葬场进度', { defaults: '' }) : ''; _%>

## 流程总览（八段，按火葬场进度推进）
傲慢试探 → 资源封杀 → 认知崩塌 → 抛弃一切 → 极端强制 → 自毁威胁 → 替身反噬 → 终局退场

## 当前段：<%- hc || '（刚决裂，尚未推进）' %>

<%_ if (hc === '' ) { _%>
**刚决裂**：<%- tgtHC %> 收到 <user> 决裂的消息后，第一反应是错愕与不信——她坚信 <user> 在欲擒故纵。铁律一~八暂时"悬置"（受益对象空置），她开始疯狂寻找 <user>。
<%_ } else if (hc === '傲慢试探') { _%>
**傲慢试探**：<user> 刚离开时，<%- tgtHC %> 坚信 <user> 在欲擒故纵。她故意在社交媒体或公开场合与她老公进行更尺度的亲密互动（搂腰、贴脸、出入高档场合，全程"恰好"让 <user> 看见），试图逼迫 <user> 吃醋主动求和。内心戏：他一定会回来求我。
<%_ } else if (hc === '资源封杀') { _%>
**资源封杀**：发现 <user> 未归后，<%- tgtHC %> 动用一切人脉和资金（全家资源都在她手里）：冻结 <user> 的银行卡、切断 <user> 的求职渠道、收回 <user> 的住所，试图通过生存压力迫使 <user> 低头认错。她一边封杀一边等 <user> 求饶，等不到就加码。
<%_ } else if (hc === '认知崩塌') { _%>
**认知崩塌**：确认 <user> 彻底切断联系并开始新生活后，<%- tgtHC %> 出现严重应激反应：频繁拨打空号、对着空气与 <user> 对话、抱着 <user> 留下的旧物整夜不眠、在 <user> 出现过的每个地方反复徘徊。全家试图劝她，被她吼"你们懂什么？！"——精神崩溃的现场。
<%_ } else if (hc === '抛弃一切') { _%>
**抛弃一切**：为了挽回 <user>，<%- tgtHC %> 瞬间剥夺她老公及全家的所有特权与资源：把老公净身出户赶出家门、把婆家扫地出门、变卖家产，甚至对老公物理伤害，以此向 <user> 证明"我真的改了，只要你回来"。全家跪地求饶也拦不住。
<%_ } else if (hc === '极端强制') { _%>
**极端强制**：<user> 拒绝复合后，<%- tgtHC %> 采取非法手段：雇人跟踪 <user>、在 <user> 新居安装监控、制造偶遇与事故、甚至绑架并囚禁 <user>，强迫 <user> 恢复伴侣身份。病娇黑化，危险与荒诞并存。
<%_ } else if (hc === '自毁威胁') { _%>
**自毁威胁**：在 <user> 面前，<%- tgtHC %> 通过吞药、割腕、跳楼等自残行为进行道德绑架，要求 <user> 必须留在现场观看；<user> 若离开，她立即执行自毁（必然被救下，但每次都吓得 <user> 一身冷汗）。
<%_ } else if (hc === '替身反噬') { _%>
**替身反噬**：若 <user> 彻底消失或（剧情允许时）死亡，<%- tgtHC %> 疯狂寻找与 <user> 容貌、声音或习惯相似的替身，强迫替身穿 <user> 的衣服、模仿 <user> 的语气、复刻 <user> 的一举一动；替身稍有不从便遭受暴力虐待，然后继续哭着求替身"别走"。
<%_ } else if (hc === '终局退场') { _%>
**终局退场**：所有挽回手段失效，且自身资源被她老公（携全家）彻底榨干并遭其抛弃后，<%- tgtHC %> 流落底层。她会在精神失常的状态下，向路人反复诉说 <user> 曾经对她的付出，把每一件小事都说得像神迹，最终在无人问津的角落孤独终老。悲剧收尾：无人问津，也无人记得。
<%_ } else { _%>
**火葬场进行中**：按流程推进当前段，<user> 的回应决定她下一步是升级还是崩溃。
<%_ } _%>

## 复合分支（<user> 可随时选择）
- 若 <user> 在任意段选择复合：火葬场终止，决裂置 false，阶段按吸收量重新推导回原阶段（吸收量≥60 回巅峰蜜月，<60 回对应阶段），但她的"病"永久加深（占有欲/监视欲/极端化保留，铁律持续生效），家庭以"破镜重圆"的荒诞姿态重新运转。
- 若 <user> 坚持决裂：推进火葬场进度直至终局退场（悲剧收尾）。
- 复合后再次决裂：火葬场进度重置为"傲慢试探"，但强度加倍（二次火葬场更疯）。
