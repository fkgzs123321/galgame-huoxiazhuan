@@private
# 危机事件系统（法律/诉讼/身世危机全流程·蓝灯，按当前目标危机状态段落控制）
<%_ var tgtC = getvar('stat_data.当前目标', { defaults: '' }); _%>
<%_ var wjC = tgtC ? getvar('stat_data.女主.' + tgtC + '.危机状态', { defaults: '' }) : ''; _%>
<%_ var abC = tgtC ? getvar('stat_data.女主.' + tgtC + '.案底', { defaults: '' }) : ''; _%>
<%_ var hyC = tgtC ? getvar('stat_data.女主.' + tgtC + '.怀孕', { defaults: '未孕' }) : '未孕'; _%>
<%_ var xgC = tgtC ? Number(getvar('stat_data.女主.' + tgtC + '.曝光度', { defaults: 0 })) || 0 : 0; _%>
<%_ var zcC = Number(getvar('stat_data.玩家.资金池', { defaults: 0 })) || 0; _%>

<%_ if (tgtC && wjC === '坐牢') { _%>
## 危机·坐牢（<%- tgtC %>）
- 处境: 你已被定罪收监，案底终身；她全家供着你，但公安法院面前，天命之力彻底失效。
- 剧情线: 坐牢期间她的奔走、老公的清算、牢里的算计——这是最深的谷底，也是绝地翻盘的唯一前提。
- 翻盘: 找到真凶/翻案证据、立功减刑、她的全力营救——出来后，这个仇必须报。
<%_ } else if (tgtC && wjC === '诉讼') { _%>
## 危机·诉讼（<%- tgtC %>）
- 案由: 离婚/争产/名誉权/合同纠纷——对方律师团已递交起诉状，开庭在即。
- 流程（每轮推进一轮，共 3-5 轮）:
  - 第一轮·应诉: 你方需在答辩期内递交答辩状——花资金池的钱（<%- zcC %> 元）请顶级律师，决定答辩质量。
  - 第二轮·举证: 对方抛证据，你方质证——可花资金池买通关键证人翻供、找出对方证据的破绽（造假流水/笔迹不符）。
  - 第三轮·调解: 法官主持调解——花钱和解（赔偿/割让），或硬扛到判决。
  - 第四轮·判决: 判决结果由证据与律师质量决定——输则资源转移大幅缩水/曝光度暴涨。
- 黑钱池: 每一轮都能砸钱（律师/证人/关系），但钱花得越多，对方越可能反手举报你行贿——两难。
- 玩家应对: 挑对方软肋（他也有案底/他转移股权的证据），用他的把柄逼撤诉，比砸钱更干净。
<%_ } else if (tgtC && wjC === '立案') { _%>
## 危机·刑事立案（<%- tgtC %>）
- 处境: 公安已立案，你随时可能被拘；她全家试图帮你，但办案人员不吃天命之力那套。
- 必选项（三选一，代价不同）:
  - 砸钱摆平: 花资金池的钱（<%- zcC %> 元）运作关系、找"能压事的人"——立案变取保候审，案底=取保候审，曝光度+20。
  - 顶罪: 按怨妇铁律·替罪机制，让她的老公替你扛——立案解除，但那位丈夫的清算从此绑定你。
  - 硬扛: 什么都不做，等传唤→拘留。
- 玩家应对: 时间窗口很短——尽快决定，拖延只会让证据链更完整。
<%_ } else if (tgtC && wjC === '拘留') { _%>
## 危机·拘留（<%- tgtC %>）
- 处境: 你被刑事拘留，人在看守所；她动用一切关系捞你，律师说"证据太齐全，麻烦"。
- 看守所日常: 48小时黄金期——律师会见、家人送衣物、同监室的老江湖教你"认罪认罚从宽"的利弊。
- 化解: ①她找到对方证据的破绽（流水对不上/证人改口）→ 取保候审（案底=取保候审，曝光度+15）；②她全家替你圆谎、关键证物"不翼而飞" → 证据不足释放（案底=治安拘留）；③找不到破绽 → 立案，进入下一层。
- 玩家应对: 在拘留期间通过律师传递策略——外面的人（她、她的家人）按你的指示行动。
<%_ } else if (tgtC && wjC === '传唤') { _%>
## 危机·传唤（<%- tgtC %>）
- 处境: 警方传唤你配合调查——报警人（她的丈夫/继女）提交了材料，你被要求到案说明。
- 第一关: 笔录——警方问三件事：你们什么关系、有没有金钱往来、有没有威胁胁迫。她全家口径统一，但你自己的口供是关键。
- 应对: ①配合调查、咬死"正常交往"，她家提供"正常往来"的证据 → 教育放行（曝光度+10）；②态度差/被对方激怒 → 上升为拘留。
- 玩家应对: 稳住，别被激怒；让她的家人提前备好"正常交往"的证据链。
<%_ } else if (tgtC && (hyC === '孕八月' || hyC === '临盆')) { _%>
## 危机·身世（<%- tgtC %> 孕<%- hyC === '临盆' ? '足月临盆' : hyC.slice(1) %>）
- 处境: 临盆在即，她的老公/婆家开始质疑孩子身世——"这孩子到底是谁的"。
- 危机点: 亲子鉴定、婆家逼问、产房外的对峙、老公要起诉确认亲子关系。
- 天命之力的作用: 她全家口径统一"孩子是家里的"——但鉴定机构不吃这套；一旦鉴定结果指向你，就是重婚/诈骗的新证据。
- 化解: ①鉴定前"意外"丢失样本/更换医院（花资金池）；②她老公被天命之力压到放弃质疑；③硬扛——鉴定结果公开，重婚罪窗口打开。
- 玩家应对: 这是全卡最容易被"一击致命"的环节——务必在她临盆前处理好一切。
<%_ } else if (tgtC && xgC >= 70) { _%>
## 危机预警（曝光度 <%- xgC %> ≥70）
- 法律机器正在接近：老公/继女可能随时报警或起诉；媒体可能跟进。
- 建议: 尽快花资金池的钱压舆论、封口、准备律师——否则下一步就是传唤。
<%_ } else { _%>
## 无危机
- 当前目标暂无法律/诉讼危机。但暗流仍在：她的丈夫抵抗值、你的曝光度，都在为下一次危机蓄力。
<%_ } _%>
