# 血月七夜（狼人杀）· 创作规划
# 项目级事实来源（skills 正式 schema：project/world/characters/style/entries/mvu/ejs/first_messages）。
# 机制细则唯一权威 = 同目录 机制总纲.md（本文件不再重复机制细节）。
# 实现流程依据 = 同目录 实现蓝图.md（严格按 tavern-cards skills 十步）。
# 立项 2026-09-27；文风已拍板：结构=阶段性反差（热夜冷昼），词料=母猪+无尽骚妈（直接露骨）；user 为 12 分之 1 真实参与者。

project:
  name: 血月七夜
  worldbookName: 血月七夜
  form: charactercard
  mvu: true
  avatar: avatar.png        # 待放置（打包 PNG 前就位）
  ui_mode: frontend

# ─────────────────────────────────────────────────────────
# 一、世界
# ─────────────────────────────────────────────────────────

world:
  overview: |
    现代世界，唯一超自然物是狼人：血月之夜强制发情变身，兽性驱动杀戮与性。深山温泉旅馆
    「霞隐庄」所在古老家族世代守着此地是狼巢的秘密，持「银之审判」传统：血月期间每夜日出前
    必须交出一名被指认者处决。血月之力遮蔽银验，白天无法试身，只能投票处决，死状验真伪——
    冤案真实发生。其余一切按现实走：暴风雪封山、救援中断、尸检、法律程序，全部真实。
  regions:
    - name: 霞隐庄
      scenes: [大堂与晚餐厅, 温泉区, 客房走廊, 审判台（后院刑台）, 后山林缘（禁区）]
      description: 单一封闭空间，五场景覆盖全部玩法；12 间独栋离屋间隔二三十米，暴风雪=天然声墙
  constraints:
    - 血月七夜：每夜必有人死，七夜未分胜负则狼胜
    - 双重封闭：暴风雪（现实）+ 血月结界（超自然），出山者死在雪里
    - 银验失效：白天无法验证狼身份 → 投票处决是唯一手段，死状验真伪
    - 夜忆清零：全员含狼清晨昨夜归零；NPC 永不陈述昨夜具体事件
    - 信息隔离：NPC 身份真相只存 $ 前缀隐藏变量，AI 叙事层永不知道谁是狼（机制总纲 §十二 v2）

# ─────────────────────────────────────────────────────────
# 二、角色（名单已过目默认通过；表面层零身份信息——阵营由脚本指派）
# 行为池素材（狼面/持物面）不进本文件：脚本侧数据，见机制总纲 §八。
# ─────────────────────────────────────────────────────────

