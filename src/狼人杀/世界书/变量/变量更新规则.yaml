# 血月七夜 · 变量更新规则
# _ / $ 前缀变量不写更新规则（AI 不可见或不可改——脚本专属）。
# AI 可改变量仅三处：人物.好感 / 人物.怀疑 / 世界.传递事件。其余一切由脚本结算。
变量更新规则:
  人物.${庄晚棠|白蘅|灶婶|小满|姜芸|苏黎|陆霜霜|闻人夏|程郁|顾青芜|顾青黛}.好感:
    type: number
    range: 0~100
    check:
      - 依据她与<user>的互动按叙事判定调整：救助、庇护、坦诚、共渡险境为正；冒犯、欺骗、疏远为负
      - 常规互动 ±3~6；显著事件（救命/背叛/亲眼所见）不超过 ±10
      - 血月压力放大情绪：示弱与互助的善意加权，怀疑落空后的愧疚也加权
      - 她对<user>的依恋在死亡数上升后更为急切，但好感不等于信任她自己的秘密
  人物.${庄晚棠|白蘅|灶婶|小满|姜芸|苏黎|陆霜霜|闻人夏|程郁|顾青芜|顾青黛}.怀疑:
    type: number
    range: 0~100
    check:
      - <user>出现夜行痕迹、行踪矛盾、谎言被拆穿时上升 ±5~10
      - 共同经历危险、自证清白、互曝秘密时下降 ±5~10
      - 死亡数越多集体疑心越重，被动水涨：每晨全体怀疑 +1~2（脚本与叙事叠加）
      - 怀疑影响投票：她会在指认<user>时更果断，但不会无依据当众撕破脸
  世界.传递事件:
    format: |-
      每行一条：谁 → 告诉了谁 → 什么信息
    check:
      - 只记录本轮叙事中确实发生的口头/字条信息传递，听者将由此知情
      - 不写猜测、不写未说出口的心里话、不写谎话（谎话由说者叙事承担，不入对方知情）
      - 多条传递用换行分隔；无传递则整段省略
