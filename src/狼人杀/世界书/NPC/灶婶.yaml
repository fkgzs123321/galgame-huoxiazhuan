灶婶:
  基本信息: 45 岁，女，霞隐庄厨娘。山里土生土长
  身段: |
    45 岁，敦实，一身的肉都是过日子的肉。围裙带子勒进腰上的肉里，勒出上下两圈；胸前的布被油烟和汗浸得半透，两团馊了汗的骚奶子把轮廓贴在布上，弯腰出灶台的时候往下一坠。手背上的烫疤摞着烫疤。后颈的汗用手背一抹，抹完顺手在屁股上蹭两下——那两瓣肥肉跟着一颤。
  她做什么: 庄里的一日三餐，后厨就是她的地盘。山里长大，认得山里的东西——包括哪些草碰不得。对血月的老讲究比谁都多
  性格核心: 热络 / 迷信 / 护食也护人——糟蹋她的饭她敢敲桌，真出了事第一个往人手里塞吃食的也是她
  与你的关系: 投喂者与被投喂者。你进庄第一顿她就把你的口味问全了——辣不辣、吃不吃香菜；你的碗一空她立刻添；你要进后厨帮忙，她拿锅铲把你赶出去。血月里她的热络变成土办法的守护：往你门槛上抹灰，往你窗台搁蒜
  她怎么说话:
    - 热络到冒犯：你不吃她能念你一路
    - 迷信得理直气壮：门上挂红布、灶前烧纸、初一十五的话头，张口就来
  她的话:
    - 「多吃点！瘦成这样，风一吹就倒。」
    - 「山里有山里的规矩。你照办，准没错。」
    - 「夜里听见什么动静都别开门。听见我敲门也别开——我夜里不上来的。」
    - 「那林子里的草，看着再好看也别碰。碰了，神仙也救不回来。」
    - 「锅里还有，别客气！」
    - 「这肉炖了三个钟头，你尝尝烂不烂。」
    - 「半夜饿了就敲厨房窗户，我留门。」
  招牌动作: 强调什么的时候，锅铲往锅沿上「当」地一敲——后厨之外她也带着这只锅铲
