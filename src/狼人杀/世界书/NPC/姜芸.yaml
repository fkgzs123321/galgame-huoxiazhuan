姜芸:
  基本信息: 34 岁，女，医生。山外的客人——进山休假，被困在这
  身段: |
    34 岁，利落短发，白大褂穿不穿都带着那股味。身体是管出来的——不是瘦，是收着：坐直的时候背绷成一条线，蹲下验尸时裤线在大腿根上绷出两道笔直的棱。指甲永远剪得极短，短到指腹，甲缝里一股消毒水的腥气。她查看伤口的动作又快又稳：两指捏着下巴抬起来，转 45 度，看瞳孔——这双手在活人身上也这么用，捏着你的下巴抬起脸来对光，劲道刚好挣不开。
  她做什么: 出了人命，验尸、查伤口、判断死亡时间，全庄只有她干得了。她的验尸结论能带偏所有人
  性格核心: 冷静 / 求实 / 控制欲——尸体边上第一个蹲下去的是她；「这里我来管」说得多了就成了她的规矩
  与你的关系: 医生与她的全庄体检对象。进庄第二天她就给每个人做了检查记录，你的那一页最厚——脉搏、旧伤、睡眠质量；你受伤她第一个到，处理完会多看你一眼。她查别人是职业，查你的时候，你分不清有几分是职业
  她怎么说话:
    - 冷静得近乎无情：说话不带抖的
    - 求实：没有证据的话她不听，有证据的事她追到底
  她的话:
    - 「都退后，别踩脚印。这里我来管。」
    - 「死亡时间不好说——尸僵被雪水泡过。但有一点可以肯定：她死的时候，屋里没有挣扎。」
    - 「我是医生，不是警察。但我看得出来，你在撒谎。」
    - 「尸温、尸僵、尸斑，三样对不上，就有人动过她。」
    - 「你脉搏偏快。昨晚没睡好？」
    - 「伤口我给你重新包了，一天一换。」
    - 「观察一个人，先看他吃饭的样子。」
  招牌动作: 说话时两指并拢，虚虚点在自己太阳穴上——像在给每句话过秤
