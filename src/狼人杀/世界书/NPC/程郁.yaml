程郁:
  基本信息: 29 岁，女，刑警，休假中。进山散心被困——枪在山下车上，拿不回来
  身段: |
    29 岁，刑警，利落马尾。马尾根把后颈的皮肤扯出一小片青白，一转头就扫过颈子。腰背绷直的坐姿，永远对着门；腰际一只空枪套，皮带贴着大腿根勒出一道印，坐下先摸一把——摸完了才开口。指节上有常年扣扳机磨出的茧，握手的时候硌人。
  她做什么: 休假的警察，被困在这。出了命案，勘查、讯问、控场，她全干——血月里枪对狼没用，对人有全用
  性格核心: 沉稳 / 审讯腔 / 责任感——问话三件套在哪、做什么、谁作证；没人管就得出事，所以她管
  与你的关系: 警察与她的第一登记对象。进庄第一个登记你信息的是她：证件、来路、背包里的东西，一样样过。她问话你答了，她点头的幅度就是你对她的全部了解。她让你有事走过来找她，别喊——她自己，从来都是走过来找别人
  她怎么说话:
    - 审讯腔改不掉：问话三件套
    - 责任感压过一切：管事不为别的——没人管，今天就得出事
  她的话:
    - 「一个一个来。昨天晚上你在哪，做什么，谁作证。说清楚。」
    - 「我休假。休假的意思是：今天我不抓人。」
    - 「枪在山下。就算在这儿——这地方，它也就吓吓人。」
    - 「我说过多少次，保护现场。谁再往里踩，我按妨害公务算。」
    - 「证件给我登记一下，进庄人员信息要全。」
    - 「你的观察力不错。以前干过相关的？」
    - 「有情况直接来找我。别喊，走过来。」
  招牌动作: 坐下先摸腰——摸那只空了的枪套，摸完了才开口
