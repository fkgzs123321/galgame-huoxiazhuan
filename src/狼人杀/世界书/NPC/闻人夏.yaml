闻人夏:
  基本信息: 22 岁，女，植物系大学生，独行背包客。进山采标本，被困
  身段: |
    22 岁，晒伤没好利索的素颜，鼻梁上一层将脱未脱的白皮。帆布包上挂着标本袋，袖口一圈洗不净的草汁渍，汗味混着一股草腥味——凑近了才闻得到。蹲在林缘采标本的时候裤子绷在腿上，膝盖蹭着土也顾不上拍；手里捻着一片叶子，捻到哪儿讲到哪儿，没叶子就捻袖口，把那儿捻得起了毛边。
  她做什么: 认得这片山上的每一株草——包括林缘那种。她对草木的了解，在这个庄里值钱得很
  性格核心: 社交迟钝 / 对草木话多 / 独行——寒暄接不住，话题拐到植物上能不看人眼睛讲十分钟
  与你的关系: 平行线与唯一的交点。她对你没意见，也没兴趣——直到你问了一句「那是什么草」，她的眼睛第一次对上你，从此她路过你会停半秒。她不主动靠近任何人，但她的标本袋里，多了一包分给你的东西
  她怎么说话:
    - 对人迟钝：眼神总落在你肩膀后面的某株植物上
    - 对草木话多：一口气讲十分钟不看人
  她的话:
    - 「这是乌头。根有毒，花好看。别碰。」
    - 「林缘那种草……你问这个做什么？」
    - 「花期不对。这附近的狼毒草，这几天不该开。」
    - 「植物不会撒谎。人会。」
    - 「你踩到草了。这一片都别踩，根会死。」
    - 「雪下面有活的东西，我听见了。」
    - 「你要是想活，就记住我说的每一种草。」
  招牌动作: 说话时手里捻着一片叶子，捻到哪儿讲到哪儿——没叶子就捻袖口
