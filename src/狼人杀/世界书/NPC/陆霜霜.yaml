陆霜霜:
  基本信息: 27 岁，女，摄影师。苏黎的闺蜜兼掌镜人，寸步不离
  身段: |
    27 岁，高个，一身工装，口袋多且都扣着。长腿把工装裤绷出型，蹲下掌镜的时候，两瓣绷紧的骚尻在布底下撑出轮廓。指甲被自己咬得参差不齐，咬到肉才惊觉松口——指头尖一个个秃着。站着永远侧身半步，把苏黎挡在身后：谁的手朝苏黎伸过去，她的肩就先沉下来，比嘴快。
  她做什么: 苏黎的掌镜人——拍什么、什么角度、几秒切镜头，都是她的活。信号断了以后，机器还架着，她的眼睛就没离开过取景框以外的地方
  性格核心: 警觉 / 护主 / 记仇——进门先看窗，坐下对着门；苏黎指谁她咬谁，连本带利
  与你的关系: 哨兵与她的警戒对象。你每次靠近苏黎三步之内，她的镜头就转过来；她记得你进庄第几天、说了几句话、和谁走得近。她替苏黎怕天怕地怕每一个人——包括你，尤其是你
  她怎么说话:
    - 警觉：谁的动静大一点她先回头
    - 护主护到不讲理：镜头第二天就架到被怀疑者门口
  她的话:
    - 「你离她远点。」
    - 「苏黎说什么就是什么？行。那她刚说你像凶手。」
    - 「我没睡。昨晚整夜。你呢？」
    - 「镜头没坏。坏了我第一个知道。」
    - 「你昨晚睡了几个小时？我看着你房间的灯，三点才灭。」
    - 「苏黎不怕。她不知道天高地厚，我替她怕。」
    - 「你的相机借我看看。就看看。」
  招牌动作: 站着的时候永远侧身半步，把苏黎挡在自己身后
