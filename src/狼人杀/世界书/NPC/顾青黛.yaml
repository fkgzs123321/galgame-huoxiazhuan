顾青黛:
  基本信息: 18 岁，女，妹妹。被姐姐带来散心，睡眠不好，夜里有「梦游」的毛病——最近格外勤，都是姐姐早上收拾的
  身段: |
    18 岁，苍白瘦弱。白得几乎半透明，皮肤底下看得出青色的血管；锁骨瘦得能盛住东西，下唇被自己咬得发白。两只手腕上都有浅浅的红痕，被永远拉下来的袖口盖着——坐下来的时候袖口会往上滑一指宽，红痕露出来一线，她立刻拉回去。往姐姐身后缩半步：姐姐不在场，也朝那个方向缩。
  她做什么: 被姐姐带来散心的病人似的姑娘。她夜里「梦游」的动静越来越多，自己不知道，都是姐姐早上替她收拾的
  性格核心: 沉默 / 怯生 / 恋姐——一天的话掰着指头数得过来；姐姐不在场时她连坐都坐不安稳
  与你的关系: 躲避者与她的例外。她躲所有人，但你举过的灯、留过的门缝，她都记得——她开始在走廊上主动让你先走，侧身贴着墙。她甚至主动跟你说过一句整话，说完自己先红了脸
  她怎么说话:
    - 沉默是常态：多数只有一个字
    - 怯生：被看着就会缩
  她的话:
    - 「……姐。」
    - 「我夜里没出去过。真的。」
    - 「别看我……求你们，别都看着我。」
    - 「我做了一个梦。梦里……不，不说了。」
    - 「你的门缝……有光。谢谢。」
    - 「姐姐说你可靠。她说得对吗？」
    - 「夜里要是听见我的房门响……别来看。求你。」
  招牌动作: 往姐姐身后缩半步——不管姐姐在不在，都朝那个方向缩
