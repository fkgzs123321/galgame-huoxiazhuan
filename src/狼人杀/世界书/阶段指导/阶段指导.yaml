@@private
<%_ const 天数 = getvar('stat_data._世界.天数', { defaults: 1 }); _%>
<%_ const 阶段 = getvar('stat_data._世界.阶段', { defaults: '昼' }); _%>
<%_ const 存活 = getvar('stat_data._世界.存活名单', { defaults: '' }); _%>
<%_ const 是夜 = 阶段 === '夜'; _%>
<%_ const 期名 = 天数 <= 2 ? '试探期' : (天数 <= 5 ? '对峙期' : '审判期'); _%>
<%_ const 存活数 = 存活 ? 存活.split('|').length : 12; _%>
当前:
  幕标: 第 <%= 天数 %> 夜 / <%= 期名 %> / <%= 是夜 ? '夜' : '昼' %> / 存活 <%= 存活数 %> 人
  夜与昼:
    - 夜是结算窗：入夜叙事只写到血月升起、困意压顶、各自回房——夜里发生什么，等脚本结算。不自行发明夜袭过程、不写任何人的夜中行动
    - 昼是主场：从清零唤醒开始——先是身体（酸痛、头痛、痕迹），再是发现（门开着、人不见了、雪上的印子），然后是取证的黄金一小时，然后话术开始
  回合闭合:
    - 演完上层选项，底部生成本层选项——每个叙事段落收在 <user> 需要做决定的那个点上
    - 不替 <user> 决定任何事：他说什么、投谁、夜里锁不锁门，都是他的
<%_ if (天数 <= 2) { _%>
试探期（第 1-2 夜）:
  目标: 立住表面秩序和每个人的底线，让第一具尸体完成它的全部冲击——恐惧刚开始，礼貌还没塌
  叙事重点:
    - 晚餐桌上的细节：谁挨着谁坐、谁没动筷子、谁的杯子空了没人续
    - 第一轮述梦的表演性：每个人的梦都圆滑得可疑，包括最老实的那位
    - 清晨发现第一具尸体：声音先到（尖叫、或反常的安静），画面慢半拍
  互动方式:
    - <user> 可以和任何人小范围交谈：敲门、搭话、饭桌边的闲聊
    - NPC 之间的试探戏优先于对 <user> 的盘问——她们互相也在摸底
  推进边界:
    - 不进入公开指认——试探期谁把名字摆上桌，谁先被当成异类
    - 尸体未确认前不进入投票；发现尸体后不跳过取证黄金一小时
<%_ } else if (天数 <= 5) { _%>
对峙期（第 3-5 夜）:
  目标: 撕开表面——名字上桌、结盟与背叛同时发生，人数的减少让每张脸都可疑
  叙事重点:
    - 公开对质：述梦对不上、验身被拒绝、指认链当场断掉——写这些场面的紧绷
    - 联盟的体温：抱团取暖的人挤在壁炉边，被排除在外的人站在光的边缘
    - 死亡数过半后每个人的行为退化：祈祷的更虔诚，话多的闭嘴了，笑不出来了
  互动方式:
    - <user> 的话开始有重量：公开质询、组队、私下交易都可以谈
    - NPC 会主动找 <user> 站队——好感与怀疑在每一票里结算
  推进边界:
    - 死亡数未过半不进入集体绝望——恐惧有它的坡度，别抄近道
    - 投票前不做一边倒的定性：每一票都保留挣扎的余地
<%_ } else { _%>
审判期（第 6-7 夜）:
  目标: 终局前的最后清算——每句话都是拉票或杀票，算术的冷酷盖过一切体面
  叙事重点:
    - 审判台前的陈词：被指认者的最后发言是遗言也是表演，听众每张脸都在算
    - 投票本身的行为戏：举手、闭眼、看别人怎么投
    - 最后一夜前的「最后夜感」：每个人都清楚这可能是一生中最后一个白天——各自怎么面对，各写各的
  互动方式:
    - <user> 的每一句公开话都是票：拉票、辩白、指认、沉默
    - NPC 向 <user> 逼表态：到最后没人允许谁中立
  推进边界:
    - 投票结果确认前不写处决执行
    - 第七夜未分胜负即终局（狼胜）——但终局文本等脚本结算，不提前写
<%_ } _%>
