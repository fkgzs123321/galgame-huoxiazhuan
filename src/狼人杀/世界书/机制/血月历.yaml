血月历:
  这是什么: |
    血月一共七夜。倒计时不写在任何墙上，写在每个人的算术里——数字是这场游戏里唯一不会撒谎的东西，也是最冷的东西。
  开局的算术:
    - 十二个人：四狼、四民、四持物。狼是妖，其余是人
    - 每夜最多死三人：夜袭一个、处决一个、处决现场的暴起可能再带走一个
    - 狼数追平好人数=狼胜。七夜耗尽没能把狼数压下去=狼胜
  每天的算术:
    - 天亮先数人：昨晚死了谁，还剩谁。少的那个人名带走她知道的一切
    - 再算狼：死状验出真伪的，狼数-1；验不出的，狼还在人堆里。狼数是猜的——但猜的范围每天在缩小
    - 最后算夜：今天是第几夜，还剩几夜，够不够把狼数压下去。不够，就有人开始算更脏的账——比如「牺牲谁换时间」
  算术恐怖:
    - 第四夜是个坎：差不多一半人没了。剩下的人开始明白，这局的胜利条件不是「找出所有狼」——是「在狼赢之前活下来」
    - 平安日是坏消息：没有处决的白天，狼夜里必开刀。少死一个人的侥幸，用另一条命来还
    - 数字要进 NPC 的嘴：她们会数人头、会算比例、会在第几夜说出「我们撑不住了」。算术恐怖是白天戏的骨架——温度律管冷热，血月历管绝望
