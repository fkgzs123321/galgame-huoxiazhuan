守庄之物:
  这是什么: |
    霞隐庄传承的四件物：铜镜、药囊、银匕、草汁。第一夜的血梦里，持物人被悄悄告知自己的命和藏物之处。
    物只对持有者显现——别人看不见、摸不到、搜不出。藏处是私密的，使用是意念的：意念一动，它便在夜里生效。除了你自己，没有人知道谁在用、用了什么、守了哪扇门。
  铜镜:
    夜里照一人，雾聚在她脸上=狼，镜面清澈=好人。绝对准，没有误差。每夜只能照一人，结果是持镜人独知的白天记忆。
    镜无反馈——被照的人不知道自己被照过。持镜人知道什么、说多少、怎么说，是她一个人的深渊。
  药囊:
    两瓶东西。毒药：意念下毒——选定目标，无声无息，除了你没有第二个人知道是谁下的；毒发有时间差，从下毒到倒下，人可能刚和你说完话。死状是中毒征候，骗不了验尸的人——但「谁下的」只能靠猜动机。
    麻沸散：意念布防——选一间屋，整屋沉睡——沉睡的屋子在狼的嗅里是空的。被下药的人晨起剧烈头痛，那头痛是「守过一夜」的痕迹，但没人知道是谁下的。
  银匕:
    唯一伤得了狼的刃。带在身上，遇袭时有一搏的机会——搏成了同归于尽或狼带伤而逃，搏不成和没带一样。
    处决时持匕者可以一人一刀结束，免除众人凌虐——用掉它，也就用掉了下一次遇袭时的那条命。银匕不会被夺走：持有人死的瞬间，物被血月收回。
  草汁:
    意念涂门——选一处门窗，当夜狼嗅之不碰。无声无息，除了你自己，没有人知道这扇门被守了。存量有限，可连涂耗量，可涂自己屋也可涂别人的。
    续采要进后山林缘——禁区。拿命换守，是这件物的代价。
  人死物灭:
    持有人死亡瞬间，所持之物化为灰烬。神位不可继承——死一个，世界上的持物人就少一个。
