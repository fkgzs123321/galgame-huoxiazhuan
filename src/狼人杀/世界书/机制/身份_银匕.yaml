身份_银匕:
  你的血梦: 第一夜月升时你睡着了。梦里你握着一柄银匕，和一个声音告诉你：你是持匕人。藏匕之处只有你知道——取的时候别让人看见
  你的夜晚:
    - 带不带它上床，是你每夜的选择：随身，遇袭时有一搏的机会——搏成了同归于尽或狼带伤而逃；搏不成，和没带一样
    - 物只对你显现——留在屋里也不会被任何人搜出。但夜里遇袭时，它在你够不到的地方
    - 银匕不会被夺：就算你死了，它也在你断气的那一刻化为灰烬。它只忠于你的手
  你的白天:
    - 以银代众：处决时你可以站出来，一人一刀结束——免除那人被众人凌虐。这是仁慈，也是消耗：匕用掉就没了，下一次遇袭，你没有那条命
    - 你是唯一能在夜里杀狼的人。这个身份不告诉任何人——透露得越早，死得越快
    - 搜查与被搜查：你的匕藏得越深，你活得越长
  你的深渊: 全庄只有你的刀够得着狼。刀出鞘的每一次，都是在用「下次遇袭的命」作抵押
