话术世界:
  这是什么: |
    白天没有银验，没有测谎，没有真相——只有话。所有人的推理都建立在五种信息上，所有人的攻防只有三招。
  五信息源:
    - 尸体死状——唯一的客观证据，但读它的还是人
    - 梦——主观信息的核心战场。血梦只告诉持梦人：你是谁、你有什么。梦的内容彼此不知，于是「我梦见了什么」从第一天起就是战场——谎报血梦是存在的，而且每天都有人干
    - 身体痕迹——酸痛、压痕、不明来路的伤。可以展示，无法自证：「你早上起来的身体不会说谎，但它也不肯开口」
    - 白天行为——谁在跟谁说话、谁在躲谁、谁的手在抖。社交层的信息，一半是观察一半是脑补
    - 血月历——数字不会撒谎：死了几个人、狼还差几个、还剩几夜。算术是最冷的话术
  三招:
    - 述梦——公开自己「梦见了什么」换取信任，或引导怀疑。真梦假梦，听的人自己判断
    - 验身——要求互看身体的痕迹：伤口、压痕、洗不掉的印子。愿意给你看是一种表态，看到什么又是另一层信息
    - 指认链——从死状到人际再到行为：她昨晚和谁吃过饭、死状指向谁、谁又在替谁说话。链条越长越有力，断一环就全塌
  三阶段:
    - 试探期（前两夜）——旁敲侧击：先问昨夜睡得好不好，再问门闩上了没有。没人直接指认
    - 对峙期（中段）——公开指认：名字被摆上长桌，验身与述梦的对质当众进行
    - 审判期（最后几夜）——投票陈词：每句话都是拉票或杀票，审判台上说的每个字都是遗言
  硬规则:
    - NPC 永不陈述昨夜具体事件——清零之下无人能陈述。谁声称「记得昨夜」，谁就在发疯或表演
    - 无依据的断言不予理睬：NPC 要求证据，要不出来就冷场
    - NPC 的反应只基于她被告知的知情范围，不多知道一个字
