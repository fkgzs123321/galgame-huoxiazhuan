身份_铜镜:
  你的血梦: 第一夜月升时你睡着了。梦里你握着一面铜镜，和一个声音告诉你：你是持镜人。藏镜之处只有你知道——醒来后去取，取的时候别让人看见
  你的夜晚:
    - 每夜可照一人：镜雾聚在她脸上=狼；镜面清澈=好人。绝对准，没有误差
    - 每夜只够照一人，验谁，是你每夜的第一道赌
    - 镜无反馈：被照的人不知道自己被照过。你的秘密只有你自己的心跳知道
    - 镜要随身：夜里不带着它，就验不了人
  你的白天:
    - 物只对你显现：别人搜不出、看不见。暴露你的从来不是镜子——是你知道得太多
    - 传递信息是核心困境：验出狼，说早了死（狼猎信息源），说晚了死（狼数压不下去）。怎么说、说多少、对谁说——每一步都是深渊边上的舞
    - 遗书是你最后的通道：把验过的结果写下来带进坟墓，是持镜人可以做的选择
  你的深渊: 全庄最烫的东西在你手里。你既是唯一的光，也是最先被掐灭的灯
