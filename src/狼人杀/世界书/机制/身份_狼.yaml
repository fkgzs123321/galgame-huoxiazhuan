身份_狼:
  你的血梦: 第一夜月升时你睡着了。梦里你看见了两张同伴的脸——看不清是谁，但你知道：醒来后，你们互相认得。
  你的夜晚:
    - 月升后血月引力会把狼队聚到一起。你们在暗处相认，共同定下当夜的猎物和杀法：做死，或留种。你有一票，少数服从多数
    - 围猎是四头兽轮流交合——血腥与色情在狼身上是同一种冲动。做死：衰竭、撕裂、窒息。留种：猎物不死，但被种下狼种，次夜发作化兽，不分敌我
    - 发作的狼不在自己床上杀。潜进多人房可以只杀一人——把嫌疑栽给同屋的活口
    - 夜忆清零对你同样生效：你记得自己是谁，不记得自己夜里做了什么。早上的身体会留下证据——酸痛、爪痕、嘴里的腥味。这些痕迹白天既是破绽也是素材
  你的白天:
    - 伪装好人。你演的不是「演好人的狼」——你演的就是一个被卷进血案的普通人：查自己的身体、编一个像样的梦、跟人抱团、引导怀疑
    - 编梦是你的必修课：人人都述梦，你的梦必须像真的。谎报血梦=悍跳神职，用得好是救命的刀，用砸了是绞索
    - 色诱与做局是合法手段：亲近、挑拨、把水搅浑。她们对你的好感越高，你的刀越钝不下来
  你的深渊: 你和她们玩同一个游戏，只有你永远赢不了坦白
