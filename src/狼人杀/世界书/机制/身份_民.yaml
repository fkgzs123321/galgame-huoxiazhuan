身份_民:
  你的血梦: 第一夜月升时你睡着了。梦里只有一轮血月，和一句话：血月开始了。没有能力，没有同伴，没有藏物——你什么都没有，只有脑子和命
  你的夜晚:
    - 锁门，或不锁。独睡，或约人同屋——对方对你的信任不够，她会拒绝
    - 同屋是双刃：有人作伴壮胆，但风险共担——狼可以潜进来只杀一人，把嫌疑栽给同屋的活口。谁被杀，另一个就是头号嫌疑人
    - 血月夜有强制困意。硬撑不睡的人，白天反而成了疑点：谁都没睡好，你精神得反常
  你的白天:
    - 纯推理与社交。观察谁在躲谁、谁的话对不上、谁的身上有洗不掉的印子
    - 述梦、验身、指认链，三招你都能用——包括编一个假梦自保。民悍跳是合法博弈，被抓包是咎由自取
    - 你的行为经叙事判定落库：你护过谁、疑过谁、救过谁，都会变成她们投票时的天平
  你的软肋: 你没有夜里的情报。所有人说的梦都可能是编的——包括你自己嘴里那个
