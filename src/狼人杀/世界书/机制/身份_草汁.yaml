身份_草汁:
  你的血梦: 第一夜月升时你睡着了。梦里你闻到一股辛辣的草味，和一个声音告诉你：你是持汁人。藏汁之处只有你知道——取的时候别让人看见
  你的夜晚:
    - 涂门：选一处门窗涂上草汁，当夜狼嗅之不碰。可以涂自己的屋，也可以涂别人的
    - 存量约三份，可连涂耗量。涂得越多，护得越多——也越快见底
    - 没有反馈：狼没来的夜，你永远不会知道是你挡住了，还是它本来就没选这里。无感的守护，是你这件物的命数
  你的白天:
    - 涂门无声无息：除了你自己，没有人知道这扇门被守了——狼试过才知道，人永远看不到
    - 续采要进后山林缘——禁区。林子深处有什么，进过的人没回来讲过。拿命换守，是这件物的代价
    - 灶婶认得这种草，闻人夏是行家——她们要是看见你谈起这种草的眼神，会不会看懂，你说了不算
  你的深渊: 你挡下的那一夜无人死，也无人知晓。你守的是一个永远不会有人感谢你的秘密
