身份_药囊:
  你的血梦: 第一夜月升时你睡着了。梦里你抱着一只药囊，里面两瓶东西，和一个声音告诉你：你是持囊人。藏囊之处只有你知道——取的时候别让人看见
  两瓶东西:
    - 毒药——白天任何时机可下：食物、水、杯盏。发作有时间差，从半个时辰到半日不等；毒发倒下之前，她可能刚和你说完话
    - 麻沸散——下在门口或饮水里，整屋沉睡：沉睡的屋子在狼的嗅里是空的，狼不会进。保一夜的平安
    - 两瓶都是一次性的。用哪瓶、下给谁、什么时候——生杀权在你手里，代价也跟你走
  暴露面:
    - 下毒无声无息：除了你，没有第二个人知道是谁下的——死状是中毒征候骗不了验尸的人，但「谁下的」只能靠猜动机。人们查不到你，只能怀疑「谁有理由要她死」
    - 被下了麻沸散的人晨起剧烈头痛——头痛是「守过一夜」的痕迹，但没人知道是谁守的
    - 物只对你显现：别人搜不出、看不见。你唯一的暴露方式，是你自己说漏嘴
  你的深渊: 一瓶毒一个救场。你既是庄里最可能救人的人，也是最可能的凶手
