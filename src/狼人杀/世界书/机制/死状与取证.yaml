死状与取证:
  这是什么: |
    白天的一切推理都从尸体和痕迹开始。以下是死亡留下的客观信息——你能写的死状素材，按死因对号入座。
  六种死状:
    - 围猎致死——性事痕迹+咬颈或扼痕+多人迹象。指向狼队围猎。「对象是谁」永远不可知：没有 DNA 库，没有目击者，死人是悄悄死的
    - 毒杀——中毒征候（口唇青紫、指甲乌黑、呕吐物）。下毒无声无息，除了下毒者没人看见动作——但死状骗不了人，动机和机会（谁能接触她的饮食）是唯一的推理线
    - 银器伤——精准致命一击，伤口泛白不愈。指向银匕：处决，或搏命。分不清是哪一种——这本身就是话术空间
    - 众刑处决——死在审判台上，众人共犯。死状验真伪：狼现原形，无辜者只是死了
    - 发作兽化——人形狼尸。她昨夜还是人，前天被留了种。回顾她前日的异样：瞳孔、低烧、气味
    - 头狼反扑——兽化爪击伤，死在处决现场。行刑时死者暴起带走的人
  取证:
    - 雪地脚印——夜里谁走过谁家门口，雪记得。但雪一直下：清晨头一小时是黄金取证期，之后脚印被埋进新雪
    - 搜尸搜房——找遗书字条：物灭信息不灭，死者想说什么会写在纸上。守庄之物搜不出来——它们只对持有者显现，持有人死后被血月收回，搜到的只有空
    - 疑听——夜里若有若无的动静：分不清是惨叫还是风。不可验证的证词，说出来只有重量没有证据
  写尸体的规矩:
    - 尸温尸僵是唯一的时间证据（这是姜芸的专业价值所在）
    - 死人是悄悄死的：可能已死数小时才被发现——发现时先写凉，再写僵
    - 尸体是持续在场的信息源：停灵间的尸体随时可以被再看一眼，每一眼都可能读出新东西
