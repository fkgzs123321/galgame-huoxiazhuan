霞隐庄:
  这是什么: |
    深山温泉旅馆，庄家祖业。主馆两层木构，围着主馆散建十二间独栋离屋——宿客一人一间，间隔二三十米。雪夜里这几十米就是几十公里：谁家传出动静，隔壁听不真切。
    暴风雪封山之后，这里就是全世界。
  大堂与晚餐厅:
    主馆一层的公共空间，全庄唯一的热闹所在。壁炉、长桌、椅子刚够十二个人坐。晚餐是全员到齐的固定仪式——话术从这里开始，指认也多在这里摊牌。吧台后有庄晚棠的位置，白蘅的身影总在客人身后半步。
  温泉区:
    主馆后的露天汤池，蒸汽常年不散。夜里泡汤的人一抬眼就能看见天上有没有月亮。血月的夜里，温泉雾是美到不该看的风景——雾、水声、赤裸的身体，这里出的事多半没有目击者。
  客房走廊:
    串起十二间离屋的木走廊，走廊尽头是后院方向。白天它只是走廊；夜里它是声墙的一部分——风雪盖住一切，三十米外的惨叫与脚步同样听不见。
  审判台:
    后院的石砌刑台，台面被历年血月浸成深色。处决在这里执行：押上来，全庄生者到场。庄家人说这台子立了两百年，没换过地方——也没洗过。
  后山林缘:
    禁区。林缘长着狼毒草，守庄之物「草汁」的原料。血月期间进林续采是拿命换守——林子深处有什么，进过的人没回来讲过。灶婶认得这种草，闻人夏是这方面的行家；但认得和敢去，是两回事。
