  -- UPDATE 示例：更新反派林天状态
  UPDATE important_npc SET "评价值"=95,"良知值"=50,"系统状态"='活跃',"当前阶段"='满分巅峰',"所在地点"='林天会所',"心情"='玩味',"最后更新"='01-01 14:00' WHERE "姓名"='林天';

  -- UPDATE 示例：更新主角user状态
