# SQL填表规则 · 系统哥的末日 v3.1（中文列名 + NTR 特有字段）
# 适配 chatSheets 模板，AI 通过 <UpdateTable> 块输出 SQL，SPV 扩展自动执行
# v3.1：所有列名中文化（双引号包裹），protagonist_info 34列，important_npc 87列

表格总数: 11
数据流: 用户点击"📦 创建系统哥的末日表格模板"按钮 → AutoCardUpdaterAPI.importTemplateFromData 创建11张表 → AI 输出 <UpdateTable> 块执行 SQL

SHEETS:
  global_state: 全局数据表(13列,单行,row_id=1)
  world_map_points: 世界地图点(8列,多行)
  map_elements: 地图元素表(7列,多行)
  factions: 势力表(6列,多行)
  protagonist_info: 主角信息(34列,单行,row_id=1,含11列NTR特有字段)
  important_npc: 重要角色表(87列,多行,含30+NSFW字段+23列NTR特有字段+反派林天专属字段)
  inventory: 物品表(6列,多行)
  equipment: 装备表(6列,多行)
  quests: 任务表(9列,多行)
  chronicle: 纪要表(5列,多行)
  check_suggestions: 检定建议表(3列,固定5行)

# ===== WHERE 条件规则（核心） =====
WHERE规则:
  global_state: WHERE row_id=1
  protagonist_info: WHERE row_id=1
  important_npc: WHERE "姓名"='角色名'（如 WHERE "姓名"='林天' / WHERE "姓名"='苏婉'）
  inventory: WHERE "物品名称"='物品名'
  equipment: WHERE "装备名称"='装备名'
  quests: WHERE "名称"='任务名'
  chronicle: WHERE "编码索引"='AM0001'
  check_suggestions: WHERE row_id=N (1~5)
  world_map_points: WHERE "详细地点"='地点名'
  map_elements: WHERE "元素名称"='元素名'
  factions: WHERE "名称"='势力名'

# ===== 各表规则 =====
规则:
  global_state:
    行数: 1
    初始化: 开场白首轮INSERT一行(row_id=1)，后续禁止INSERT第二行
    更新: 每轮回复结束时UPDATE唯一行
    删除: 禁止
    说明: |
      存储当前地点/时间/天数/时段/难度/场景概览/不可逆flag
      NTR主题中的全局进度（游戏阶段/当前章节/绑定进度等）

  world_map_points:
    行数: 多行
    初始化: 开场白首轮INSERT已知地点
    更新: 探索状态变化时UPDATE对应行
    删除: 禁止
    说明: NTR场景中各地点(user家/林天会所/绑定场所/妻子娘家等)

  map_elements:
    行数: 多行
    初始化: 开场白首轮INSERT已知元素
    更新: 状态变化时UPDATE
    删除: 元素消失时DELETE
    说明: 剧情物品/威胁/龙套/地标

  factions:
    行数: 多行
    初始化: 开场白首轮INSERT已知势力
    更新: 关系变化时UPDATE
    删除: 禁止
    说明: NTR主题中的各方势力(林天集团/user方/苏婉娘家等)

  protagonist_info:
    行数: 1
    初始化: 开场白首轮INSERT一行(row_id=1)
    更新: 每轮回复结束时UPDATE唯一行
    删除: 禁止
    说明: |
      主角user状态表，34列。
      基础23列：身份/六维属性/三生存/三副状态/经济/分段修饰符
      NTR特有11列（独立列，不再压缩到special_attributes）：
      - "财富等级" TEXT (A1~A10)
      - "财富值" INTEGER
      - "婚姻状态" TEXT (完好/动摇/破裂/离婚/丧偶)
      - "反抗力" INTEGER 0-100
      - "觉醒度" INTEGER 0-100
      - "理智值" INTEGER 0-100
      - "心理状态" TEXT
      - "怀疑度" INTEGER 0-100
      - "证据数量" INTEGER
      - "与妻子关系" TEXT
      - "最后更新" TEXT

  important_npc:
    行数: 多行
    初始化: |
      开场白首轮INSERT所有已知角色：
      - 反派林天（含评价值/良知值/系统状态等专属字段）
      - 已绑定/待绑定的女性角色（含绑定等级/绑定状态等NTR字段）
      - 其他重要NPC（家属/同事等，NTR字段使用默认值）
    更新: 每轮回复结束时UPDATE当前互动角色行（其他角色按需UPDATE）
    删除: 禁止
    说明: |
      核心表，87列。
      基础字段64列：身份/4维关系值/阶段/攻略状态/30+ NSFW字段
      NTR特有11列：
      - "绑定等级" TEXT (A1~A10)
      - "绑定顺序" INTEGER 1-10
      - "绑定状态" TEXT (已绑定/绑定中/待绑定/已解绑/死亡)
      - "绑定深度" INTEGER 0-100
      - "清醒频率" INTEGER 0-100
      - "解绑代价" TEXT
      - "NTR玩法类型" TEXT
      - "占有印记" TEXT
      - "EJS阶段" TEXT
      - "绑定时期" TEXT
      - "上次清醒瞬间" TEXT
      关系字段3列：
      - "原伴侣" TEXT (默认'无')
      - "子女信息" TEXT (默认'无')
      - "家庭关系" TEXT
      反派林天专属9列（其他角色留空或使用默认值）：
      - "评价值" INTEGER 0-100
      - "良知值" INTEGER 0-100
      - "OOC计数" INTEGER
      - "系统状态" TEXT (活跃/警告/解绑)
      - "评价趋势" TEXT
      - "当前阶段" TEXT
      - "心情" TEXT
      - "玩法偏好" TEXT
      - "当前目标" TEXT
      林天作为反派存入此表，"是否在攻略中"=0，"关系阶段"='仇视'
      NSFW字段直接使用独立列（"罩杯"/"胸围"/"湿润度"/"兴奋度"/"精液残留"等）

  inventory:
    行数: 多行
    初始化: 开场白首轮INSERT初始物品
    更新: 数量变化时UPDATE
    删除: 消耗完时DELETE
    说明: 证据物品/关键道具/特殊物品

  equipment:
    行数: 多行
    初始化: 开场白首轮INSERT初始装备
    更新: 状态变化时UPDATE
    删除: 装备销毁时DELETE
    说明: 特殊装备/可使用道具

  quests:
    行数: 多行
    初始化: 开场白首轮INSERT主线任务
    更新: 进度变化时UPDATE
    删除: 任务放弃时DELETE
    说明: NTR主题任务(绑定苏婉/收集证据/反抗林天/觉醒/复仇等)

  chronicle:
    行数: 多行
    初始化: 开场白首轮INSERT开局纪要
    更新: 禁止UPDATE
    删除: 禁止DELETE
    说明: 编码格式AM0001起，时间跨度格式??-?? ??:?? ~ ??-?? ??:??

  check_suggestions:
    行数: 5
    初始化: 开场白首轮INSERT 5行(row_id=1~5)
    更新: 每轮回复开始时UPDATE全部5行
    删除: 禁止
    说明: 每轮给user的5个检定建议

