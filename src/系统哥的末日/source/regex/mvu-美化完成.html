<style>
  .neko-complete summary::marker {
    display: none;
  }
  .neko-complete[open] > div {

  }
  .neko-complete[open] .neko-toggle::after {
    content: attr(data-open);
  }
  .neko-complete:not([open]) .neko-toggle::after {
    content: attr(data-close);

  @keyframes neko-happy {
    0%, 100% {

  }

  @keyframes text-shimmer {
    0% {
      background-position: 0% center;
    }
    100% {
      background-position: 200% center;
    }
  }

  @keyframes neko-slide-in {
    from {
      opacity: 0;
      transform: translateY(-8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
