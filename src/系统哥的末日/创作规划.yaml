  - { name: 家属_孙家与周家, type: NPC, path: 世界书/NPC/家属_孙家与周家.txt, keywords: [孙建国, 陈浩, 李建国, 李承乾, 李老太爷, 李雪] }
  - { name: 家属_郑家与沈家, type: NPC, path: 世界书/NPC/家属_郑家与沈家.txt, keywords: [郑鸿远, 郑老爷子, 李文轩, 陈泽, 吴小婷, 郑鸿涛, 郑鸿波] }
