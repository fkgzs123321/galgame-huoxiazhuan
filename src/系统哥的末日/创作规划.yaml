# ─────────────────────────────────────────────────────────
# 三、文风
# ─────────────────────────────────────────────────────────

style:
  perspective: 第三人称有限（默认跟 <user>；林天独自行动时切全知）
  base_layer: 淫视（叙述者本身就是下流胚子，镜头贴在肉体上，主语尽量落在器官／部位上）
  overlay_layers:
    - name: 无尽骚妈
      when: 绑定深度 < 60（尚未完全绑定）
      how: 远看体面、近看揭布；脏度全部交给台词；叙述只给体面、交代动作、写旁人反应
    - name: 母猪
      when: 绑定深度 >= 60（完全绑定之后）
      how: 感官饱和（动态／声音／状态／体液四类每段各一次）；器官词不重复同一个；越到后面句子越短
  hard_rules:
    - 全文禁用破折号与顿号排比
    - 规则条目禁 Markdown 粗体
    - 非性场景照样过淫视滤镜，但事件本身必须清楚成立
    - 器官初次出现必须点名器官名并带脏／臭／腥／黑定语，禁模糊指代（那两团／那瓣／那处）
    - 四禁句式：她觉得／她不知道／她经常／她喜欢
    - 尺度放大的是幅度、范围、数量与持续时间，不是形容词的强度

