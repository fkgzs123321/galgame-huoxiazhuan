  # 判定链（与 机制/判定引擎.txt、面板脚本、交涉体系.txt 四处同源）
  判定链:
    D: P - R + E
    P: 加权(执行者四维, 强度权重)
    R: 基准值 × 场景难度乘数 + 目标个体修正 + 阶段修正
    E: 证据修正（减半）＋ 技能修正（复盘 15／旧情 20／传媒线 25）
    S: clamp(50 + D, 5, 95)
    V: LCG(seed) × 100，seed = 章节×100000 + 回合×1000 + 交涉回合×7 + 1
    档位: 由 D 与成败联合决定（大成功 1.5／成功 1.0／勉强成功 0.6／失败 1.0／大失败 2.0）
    难度乘数: 轻松 0.8／普通 1.0／挑战 1.2（他的产业内）／地狱 2.0
    结算: 执行者判成功 → 己方共识分 + 4×效果倍数；判失败 → 己方共识分 −2，另一方共识分 + 4×效果倍数


