# ─────────────────────────────────────────────────────────
# 五、MVU
# ─────────────────────────────────────────────────────────

mvu:
  structure: |
    顶层结构：
    ├── 世界
    │   ├── 时间（YYYY/MM/DD-HH:MM）
    │   ├── 地点
    │   ├── 章节
    │   └── 回合
    ├── 镜头
    │   ├── 对象（当前镜头落在谁身上）
    │   └── 绑定深度（镜像，供文风门控读）
    ├── 反派状态（林天）
    │   ├── 财富等级 A1~A15
    │   ├── 资产（元）
    │   ├── 评价值 0~100
    │   ├── 绑定名额上限 / 已用
    │   ├── 道具与技能余量
    │   └── 系统暴走次数
    ├── 绑定花名册（z.record，键＝真名，10 位）
    │   ├── 时期（enum 7 值）
    │   ├── 绑定深度 0~100
    │   ├── 心理旋钮
    │   ├── 身体状态
    │   └── 专属（record）
    ├── 玩家（<user>）
    │   ├── 资产 / 公司状态
    │   ├── 交涉四维（气势/口才/情报/地位）
    │   ├── 精神与身体
    │   └── 证据链
    └── 交涉状态
        ├── 回合 / 上轮双方骰 / 上轮判定
        └── 交涉历史
  variables:
    - { path: 世界.时间, format: YYYY/MM/DD-HH:MM, description: 当前场景时间 }
    - { path: 世界.地点, description: 当前场景（上海内具体场所） }
    - { path: 世界.章节, type: number, range: 1~99, description: 当前章节 }
    - { path: 世界.回合, type: number, range: 1~99, description: 本章第几轮 }
    - { path: 镜头.对象, description: 当前镜头落在谁身上（角色真名；无女性在场时填"林天"） }
    - { path: 镜头.绑定深度, type: number, range: 0~100, description: 镜像当前对象的绑定深度，供文风门控读 }
    - { path: 反派状态.财富等级, enum: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, A11, A12, A13, A14, A15] }
    - { path: 反派状态.资产, type: number, description: 单位为元 }
    - { path: 反派状态.评价值, type: number, range: 0~100, check: 主角 OOC／剧情不合理／女性解绑或死亡／<user> 成功反抗时下降；章节小结回升 }
    - { path: 反派状态.绑定名额上限, type: number, range: 0~10 }
    - { path: 反派状态.系统暴走次数, type: number, range: 0~3, description: 评价值第 3 次归零才真解绑 }
    - { path: 绑定花名册, type: z.record, description: 键＝女性真名（10 位） }
    - { path: 玩家.资产, type: number }
    - { path: 玩家.公司状态, enum: [正常, 承压, 濒临破产, 已失去] }
    - { path: 玩家.交涉.气势, type: number, range: 0~100 }
    - { path: 玩家.交涉.口才, type: number, range: 0~100 }
    - { path: 玩家.交涉.情报, type: number, range: 0~100 }
    - { path: 玩家.交涉.地位, type: number, range: 0~100 }
    - { path: 玩家.证据链, type: z.array, description: 已固定的证据条目，限 8 条 }
    - { path: 交涉状态.回合, type: number }
    - { path: 交涉状态.上轮玩家骰, type: number, range: 1~20 }
    - { path: 交涉状态.上轮对手骰, type: number, range: 1~20 }
    - { path: 交涉状态.上轮判定, description: 按 6 档门槛算出的档位 }
    - { path: 交涉状态.交涉历史, type: z.array, description: 每轮追加，限 10 条 }

ejs:
  entries:
    - name: 上海
      complexity: 条目显隐
      condition: "getvar('stat_data.世界.地点', { defaults: '' }).length > 0"
    - name: 场景_林天产业
      complexity: 条目显隐
      condition: "['外滩顶层公寓','夜场','便利店','城郊别墅'].some(k => getvar('stat_data.世界.地点', { defaults: '' }).includes(k))"
    - name: 场景_苏婉与市区
      complexity: 条目显隐
      condition: "['苏婉集团','陆家嘴','老城厢','钢琴','家'].some(k => getvar('stat_data.世界.地点', { defaults: '' }).includes(k))"
    - name: 骚妈层
      complexity: 条目显隐
      condition: "getvar('stat_data.镜头.绑定深度', { defaults: 0 }) < 60"
    - name: 母猪层
      complexity: 条目显隐
      condition: "getvar('stat_data.镜头.绑定深度', { defaults: 0 }) >= 60"
    - name: 评价值档位主持
      complexity: 段落控制
      stages:
        - { name: 满分狂欢, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) >= 100" }
        - { name: 巅峰期, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) >= 80" }
        - { name: 警觉期, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) >= 60" }
        - { name: 危机期, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) >= 40" }
        - { name: 崩坏期, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) >= 20" }
        - { name: 解绑边缘, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) > 0" }
        - { name: 系统解绑, condition: "getvar('stat_data.反派状态.评价值', { defaults: 100 }) === 0" }
    # 角色条目：多阶段 = 段落控制（按时期 7 档）；基础信息/调色盘/多阶段 一律带「镜头对象」@@if 门控
    - name: 苏婉_多阶段
      complexity: 段落控制
      stages:
        - { name: 目标期, condition: "period === '当前目标'" }
        - { name: 错位期, condition: "period === '刚被控制'" }
        - { name: 绑定瞬间, condition: "period === '绑定瞬间'" }
        - { name: 绑定深化, condition: "period === '绑定深化'" }
        - { name: 完全绑定, condition: "period === '完全绑定'" }
        - { name: 濒临解绑, condition: "period === '濒临解绑'" }
        - { name: 已解绑, condition: "period === '已解绑'" }

first_messages:
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/0.txt
    scene: 夜里的家，客厅灯没关
    opening_situation: |
      苏婉回来得很晚。她换鞋的时候没弯腰，鞋就那么踩掉了。
      <user> 坐在客厅等她，桌上那碗汤已经凉透。
      她想说点什么，开口第一句是问他公司那个项目能不能让出来。
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/1.txt
    scene: 苏婉集团总部的会议室，早上九点
    opening_situation: |
      <user> 提早到会议室，撞见苏婉在打电话。
      她背对着门，声音很低，说"我知道了，我会跟他说"。
      挂掉电话转身看见他，她笑了一下，那个笑是给外人用的。

# ─────────────────────────────────────────────────────────
# 六、机制契约表（★ 改机制必看这一节：改一漏一的唯一解药）
# ─────────────────────────────────────────────────────────
# 判据（照 workspace 三判据过）：
#   ① 换题材还成立吗 ② 含不含「具体内容」 ③ 是否为别的功能提供能力
# 结论：死心塌地系统 / 财富等级 / 评价值 / 评论 含具体内容 → 归「要素」，载体在世界观；
#       交涉 d20 / 回合结构 换题材仍成立且不含内容 → 归「机制」，载体在阶段指导。
# ★ 机制条目只写「规则与阈值」，不写变量路径；变量路径的家是 变量更新规则.yaml。
# ★ 这条边界必须守住：两边都写路径 → 改一处漏一处。

mechanisms:
  - name: 绑定与解绑
    owner: 世界观/死心塌地系统
    reads: [绑定花名册.*.时期, 绑定花名册.*.绑定深度, 反派状态.财富等级, 反派状态.绑定名额上限, 反派状态.已绑定数]
    writes: [绑定花名册.*.时期, 绑定花名册.*.绑定深度, 反派状态.已绑定数, 镜头.对象, 镜头.绑定深度]
    trigger: 与目标肢体接触满一分钟 且 目标财富等级不高于宿主
    rule: 名额溢出时最早绑定者自动解绑；解绑代价按深度分失忆／发疯／死亡三档
    surface: 状态栏「绑定花名册」

  - name: 阶段推进
    owner: 阶段指导/回合行动规则
    reads: [绑定花名册.*.时期, 绑定花名册.*.绑定深度, 反派状态.评价值, 玩家.觉醒度]
    writes: [绑定花名册.*.时期, 绑定花名册.*.绑定深度]
    trigger: 一次实质性的顺从或让渡 / 一次有效唤醒 / 一次清醒瞬间 / 评价值跌破崩坏线
    rule: 单次只走一档；已解绑后不再变；改档必须同时给出对应深度区间
    surface: 状态栏＋她的面板

  - name: 评价值与档位授权
    owner: 世界观/人设崩塌评价系统（定义）＋ 阶段指导/评价值档位主持（每轮主持）
    reads: [反派状态.评价值]
    writes: [反派状态.评价值, 反派状态.系统暴走次数, 反派状态.各技能余量]
    trigger: 林天自相矛盾／同一套路重复／剧情逻辑漏洞／被绑定者解绑或死亡／<user> 一次有效反击
    rule: 单次下降 ≤3、回升 ≤12、每档至少停一轮；归零前两次是暴走、第三次才真解绑
    surface: 状态栏「评价值条」＋档位名

  - name: 交涉判定
    owner: 阶段指导/交涉体系
    reads: [玩家.交涉.气势|口才|情报|地位, 交涉状态.玩家共识分|对手共识分, 玩家.证据链, 玩家.觉醒度]
    writes: [交涉状态.*, 玩家.共识分相关, 玩家.反抗力, 玩家.觉醒度]
    trigger: 双方行动在同一场合撞上且都要从对方手里拿东西
    rule: d20＋属性/5＋策略＋情境＋技能，林天固定 +8、<user> 固定 -8；<user> 侧门槛累计提高十点；六档差值
    surface: 交涉面板（四维／共识分／骰值／判定）

  - name: 清醒瞬间
    owner: 阶段指导/交涉体系
    reads: [绑定花名册.*.清醒频率, 绑定花名册.*.绑定深度]
    writes: [绑定花名册.*.绑定深度, 绑定花名册.*.最近一次清醒]
    trigger: 每轮交涉掷 1~100，≤ 清醒频率即为出现
    rule: 深度 ≥80 百分百被压掉；≥90 连掷都不掷；成功唤醒过一次后难度翻倍
    surface: 交涉面板「判定结果条」

  - name: 系统权限与道具
    owner: 世界观/死心塌地系统
    reads: [反派状态.评价值, 反派状态.财富积分, 反派状态.各技能余量]
    writes: [反派状态.时停剩余|预感剩余|掌控剩余|救场剩余|第四面墙剩余|强制洗白可用|财富积分, 玩家.证据链]
    trigger: 由林天在回合内主动使用；暴走／洗白由评价值阈值触发
    rule: 用完即止、章节切换不重置；买道具扣财富积分；评分值档位开放或收回
    surface: 状态栏「系统余量」

  - name: 回合结构
    owner: 阶段指导/回合行动规则
    reads: [世界.章节, 世界.回合, 反派状态.评价值]
    writes: [世界.时间, 世界.地点, 世界.回合, 世界.章节, 评论.倾向|热门]
    trigger: 每轮固定五段
    rule: 单轮至多一次决定性进展；进展直指林天时按评价值判一次巧合化解；每章一个节点
    surface: 状态栏「时间／章节」

  # ── 一致性自检（每次改机制条目或变量后跑）──
  # 1. node 引擎模板/scripts/verify-dirty-ratio.mjs src/系统哥的末日
  # 2. node 引擎模板/scripts/verify-prompt-budget.mjs src/系统哥的末日
  # 3. forge validate-mvu 系统哥的末日
  # 4. node _tools/sysbro/audit-closed-loop.mjs          （死变量/无来源/面板不可见 三项都要 0）
  # 5. node _tools/sysbro/test-card-judge.mjs            （判定链 19 项）
  # 6. 本表逐行对：机制条目里的每个阈值，是否都有对应变量在 writes 列里

# ─────────────────────────────────────────────────────────
# 七、T2 契约表（照 机制层规范.md §三 的字段定义写）
#   ★ 「意义」是必填项 —— 说不清意义的字段就不该存在
# ─────────────────────────────────────────────────────────
契约_状态表:
  - 名: 评价值
    范围: 0 ~ 100
    初值: 80
    增长: 水军（每章 1~3）／强制洗白（回 60）／舆论风暴卡（+4）
    衰减: 单次 ≤3；五种来源：林天自相矛盾、同一套路重复、剧情逻辑漏洞、被绑定者解绑或死亡、<user> 一次有效反击
    周期: 每档至少停一轮
    阈值: [{ 0: 系统解绑并触发终局 }, { 1~19: 生命保护解除 }, { 20~39: 判断开始出错 }, { ≥90: 第四面墙可用 }]
    不可逆: false
    可见: 状态栏（大数字＋档位名＋色条）
    意义: "读者口碑。它同时是林天的能力刻度、道具余量的开关、以及终局的计时器 —— 玩家盯着它就知道自己还剩多少时间"
  - 名: 绑定深度
    范围: 0 ~ 100（每人一条）
    初值: 100（刚绑定时）
    增长: 指令触发、被动玩弄、道具加深卡
    衰减: 清醒瞬间（−1~2）、深度加深卡的反向、解绑
    周期: 无
    阈值: [{ ≥60: 文风切母猪层 }, { ≥80: 清醒百分百被压掉 }, { ≥90: 唤醒尝试全部无效 }]
    不可逆: false
    可见: 状态栏（名册行内小条）＋ 她的档案
    意义: "系统攥住她的强度。它是文风开关、清醒判定门槛、解绑代价等级的三合一读数 —— 玩家看它就知道还能不能撬"
  - 名: 时期
    范围: 当前目标 / 刚被控制 / 绑定瞬间 / 绑定深化 / 完全绑定 / 濒临解绑 / 已解绑
    初值: 当前目标
    增长: 一次实质性的顺从或让渡，单次只走一档
    衰减: 有效唤醒 / 清醒瞬间 / 评价值跌破崩坏线，单次只回一档
    周期: 无
    阈值: [{ 已解绑: 不再改变，直到重新绑定 }]
    不可逆: false
    可见: 状态栏名册 ＋ 她的档案
    意义: "掠夺走到哪一步。它决定这个角色条目渲染哪一档，也是玩家判断这个人还能不能救的坐标"
  - 名: 清醒频率
    范围: 0 ~ 100（每人一条）
    初值: 按人物给
    增长: 长时间没有清醒尝试、或她刚被推深一档
    衰减: 她这一场出现过清醒瞬间
    周期: 无
    阈值: [{ 0: 不会被唤醒 }]
    不可逆: false
    可见: 状态栏名册 ＋ 她的档案
    意义: "她反抗的底子。清醒瞬时掷 1~100 与它比较，是玩家唯一能算概率的东西"
  - 名: 觉醒度
    范围: 0 ~ 100
    初值: 10
    增长: 交涉失手、亲眼撞见说不通的事
    衰减: 舆论风暴卡、第四面墙
    周期: 无
    阈值: [{ ≥70: 可识破系统预判与水军 }, { ≥71: 可推出系统的存在 }]
    不可逆: false
    可见: 状态栏
    意义: "他离真相多近。到七十以上，林天的一半手段当场失效 —— 这条彻底改变了博弈的形态"
  - 名: 反抗力
    范围: 0 ~ 100
    初值: 20
    增长: 交涉得手（+1~2）
    衰减: 交涉失手（−4~9）、僵持三轮（−6）、道具
    周期: 无
    阈值: [{ 0: 他放弃反抗 }]
    不可逆: false
    可见: 状态栏
    意义: "他还能不能打。与觉醒度分工明确：一个是他知道多少，一个是他还能做什么"
  - 名: 财富积分
    范围: 0 起，无上限但被限购约束
    初值: 500
    增长: 每轮恢复到「资产÷800万」与当前值里较大者
    衰减: 购买商品
    周期: 每轮恢复一次
    阈值: []
    不可逆: false
    可见: 状态栏系统余量
    意义: "他唯一的资源约束。每章限购三件，逼他压 <user> 与推别人的深度之间二选一"
  - 名: 系统暴走次数
    范围: 0 ~ 3
    初值: 0
    增长: 评价值归零时 +1
    衰减: 无
    周期: 无
    阈值: [{ 1: 第一次暴走事件开启 }, { 2: 第二次 }, { 3: 真正解绑并触发终局 }]
    不可逆: true
