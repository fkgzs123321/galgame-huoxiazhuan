@@generate_before
<%
/* 判定注入 · 机制层 · 把面板已经算好的交锋判定渲染进 prompt
   引擎实现在 机制/判定引擎.txt，由前端面板执行；这里只传达结论。
   本条不含任何具体内容，改机制时不需要动它。 */
var _J = getvar('stat_data.交涉状态', { defaults: {} }) || {};
var _出 = '';
if (_J && _J.本轮判定) {
  var _档 = String(_J.上轮判定 || '');
  var _倍 = Number(_J.效果倍数 || 1);
  var _P  = Number(_J.能力值 || 0);
  var _R  = Number(_J.要求值 || 0);
  var _S  = Number(_J.成功率 || 0);
  var _V  = Number(_J.掷值 || 0);
  _出 =
    '本层交锋判定（引擎已经算好，直接采信，不要自己重算、不要改数、不要另掷）：\n' +
    '  对手：' + String(_J.对象 || '无') + '　幕次：' + String(_J.幕次 || '') + '　第 ' + String(_J.回合 || 0) + ' 回合\n' +
    '  他的能力值 ' + _P + '　对　对手侧要求值 ' + _R + '　差值 ' + Math.round((_P - _R) * 100) / 100 + '\n' +
    '  成功率 ' + _S + '%　掷值 ' + _V + '　→ 结论：' + String(_J.本轮判定 || '') + '　档位：' + _档 + '（效果 ×' + _倍 + '）\n' +
    '  按这个结论结算：共识分、反抗力、觉醒度、以及证据是否被销毁，全部照上面的档位与倍数走。\n' +
    '  正文只写谁压住了谁、谁把话说死了、谁的手在抖。不要出现成功率、掷值、差值、档位这些词。\n' +
    '  结算完之后，把「交涉状态.本轮判定」写成空串。';
}
%>
<%= _出 %>
