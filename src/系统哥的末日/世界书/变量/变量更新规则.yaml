变量更新规则:
  _path_rules: |
    路径规则（违反则更新失败）
    1. 与 <status_current_variable> 里的 stat_data 结构完全一致
    2. 不加 /stat_data 前缀。嵌套层级写全
    3. 不自创字段。schema 里没有的一律不许写
    4. 列表类变量只有两个，且都是字符串，不是数组：/玩家/证据链（上限 8 条）与 /交涉状态/交涉历史（上限 10 条）。写法是整串 replace，条目之间用「；」分隔，右端追加新的一条；超过上限时把最前面那条删掉再写回。禁止用 add 往数组里插（本卡的列表不是数组，add 会整批作废）
    5. /设置/主题 由前端维护，不要写
    6. /绑定花名册 的键是真名，只有十个：陈雪华｜林雅芝｜王秀兰｜赵敏｜孙莉｜周慧敏｜吴琼｜郑秀｜苏婉｜沈梦瑶
    7. /镜头/对象 只能写这十个人之一，或写「林天」

  _output_rules: |
    输出格式（违反则解析失败）
    1. 变量更新块放在最终回复的最末尾，在正文与任何代码块之后。严禁放进思考段落
    2. <JSONPatch> 里是一个 JSON 数组用方括号包裹。严禁输出多个独立对象
    3. 无变化时输出空数组，不要省略这一块

  _stage_rules: |
    阶段与绑定深度的对应（每轮必读，两处必须对得上）
    唯一阶段真源是 绑定花名册.{真名}.时期，取值七个。绑定深度是 0~100 的数值，表示系统此刻把她攥得多紧，也是文风门控的开关。
    时期 = 当前目标 或 刚被控制 → 深度 0（还没被绑）
    时期 = 绑定瞬间 → 深度 100（刚绑，攥得最紧）
    时期 = 绑定深化 或 完全绑定 → 深度 80~100
    时期 = 濒临解绑 → 深度 40~79
    时期 = 已解绑 → 深度 0~39，并写明解绑代价落在哪一档
    时期怎么动：绑定成功当场写 绑定瞬间、深度置 100；之后她每做一次实质性的顺从或让渡，时期往后走一档，单次只走一档，不许跳；<user> 的唤醒、她的清醒瞬间、评价值跌破崩坏线，都往回推一档；到 已解绑 之后不再变。
    镜头.绑定深度 每轮必须等于 镜头.对象 那个人的 绑定深度。对象是林天时写 0。这是文风门控的唯一依据，不许漏。

  _delta_rules: |
    单次更新幅度（违反则更新失败）
    时期：单次一档，禁止跳。绑定深度：±1~±10。清醒频率：±1~±10。
    评价值：降 ≤3，升 ≤12，每档至少停一轮。
    觉醒度：±1~±5。反抗力：降 ≤10，升 ≤4。
    交涉四维：±1~±3，四维单局成长总和 ≤15。
    财富等级：单次一级，升一级要写出钱从哪来，同时把 绑定名额上限 加一（封顶 10）。
    资产：单次变动不超过当前值的两成，并购与升阶除外。
    共识分：±0~±10。各项余量：用一次减一，只减不增，章节切换不重置。
    财富积分：等于资产除以一百万；每轮恢复到「资产除以八百万」与当前值里的较大者，商店购买时扣除。

  _forced_rules: |
    每轮强制输出（不许省略）
    一 世界.${时间|回合}。回合加一，时间按剧情写实
    二 镜头.${对象|绑定深度}
    三 反派状态.评价值。哪怕没变也写一遍当前值
    四 反派状态.${时停剩余|预感剩余|掌控剩余|救场剩余|第四面墙剩余|财富积分}
    五 交涉状态.${能力值|要求值|成功率|掷值|上轮判定|效果倍数}。这六项一律照抄判定引擎给的值，禁止编造、禁止自己算。不是交涉轮就不写（或写 0 与「无」）
    六 评论.倾向

  世界:
    时间:
      format: ${YYYY/MM/DD}-${HH:MM}
      check:
        - 按剧情实际推进写实，跨昼要说清是第二天
        - 不许用「过了几天」这类跳过写法
    地点:
      check:
        - 写具体场所名：家｜苏婉集团总部｜外滩会所｜外滩顶层公寓｜城郊别墅｜夜场｜便利店｜老城厢｜菜场｜幼儿园｜医院
        - 场景切换时更新，同一场景内不要反复改
    章节:
      type: number
      range: 1~99
      check:
        - 六到八轮算一章，节点结算之后加一
    回合:
      type: number
      range: 1~99
      check:
        - 每轮加一

  镜头:
    对象:
      check:
        - 本轮镜头落在谁身上写谁。十位女性写真名，无女性在场写「林天」
        - 多人在场时写被拍得最细的那一个
    绑定深度:
      type: number
      range: 0~100
      check:
        - 等于 镜头.对象 那个人的 绑定深度，对象是林天时写 0。每轮必写

  反派状态:
    财富等级:
      type: A1 | A2 | A3 | A4 | A5 | A6 | A7 | A8 | A9 | A10 | A11 | A12 | A13 | A14 | A15
      check:
        - 升一级要一笔站得住的进项，正文写出这笔钱从哪来，同时 绑定名额上限 加一
    资产:
      type: number
      check:
        - 单位元。并购、升阶、被没收这类大事件才大动
    交涉:
      气势~地位:
        type: number
        range: 0~100
        check:
          - 他的四维。开局八十五到九十二，成长是 <user> 的两倍速
          - 他在交涉里赢下来一次，对应那一维加一到三；输掉一次不加
          - 这个四维不显示给 <user>，只用来算他要摆多高的门槛
    评价值:
      type: number
      range: 0~100
      category:
        100: 满分狂欢，肆无忌惮，金色特权解锁
        80~99: 巅峰期，故意留破绽
        60~79: 警觉期，收着演，加快进度
        40~59: 危机期，收敛，查对手软肋，商店限购
        20~39: 崩坏期，动违法手段，判断开始出错
        1~19: 解绑边缘，卖惨洗白，生命保护解除
        0: 系统解绑，前两次为暴走，第三次真解绑
      check:
        - 只由五种原因降：林天自相矛盾、同一套路重复、剧情逻辑漏洞、被绑定者解绑或死亡、<user> 做成一次有效反击
        - 下降时正文要写出对应画面，不许只写数字
    绑定名额上限:
      type: number
      range: 0~10
      check:
        - 只有升财富等级时才加一
    已绑定数:
      type: number
      range: 0~10
      check:
        - 绑定成功加一，解绑减一。超过上限时最早绑定的那个自动解绑，按她的深度判代价
    系统暴走次数:
      type: number
      range: 0~3
      check:
        - 评价值归零时加一。第三次归零是真正的解绑，触发结局
    时停剩余:
      type: number
      check:
        - 使用时减一。用完即止
    预感剩余:
      type: number
      check:
        - 每章最多三次，使用时减一
    掌控剩余:
      type: number
      check:
        - 每章最多三次，使用时减一
    救场剩余:
      type: number
      check:
        - 整局一次，用掉写到 0
    强制洗白可用:
      type: boolean
      check:
        - 整局一次。评价值低于 20 才可触发，触发后写 false
    财富积分:
      type: number
      check:
        - 见 _delta_rules
    第四面墙剩余:
      type: number
      check:
        - 整局三次。评价值不低于 90 时可用，用一次减一

  绑定花名册:
    type: |-
      {
        [真名: string]: {
          时期: '当前目标' | '刚被控制' | '绑定瞬间' | '绑定深化' | '完全绑定' | '濒临解绑' | '已解绑';
          绑定深度: number; // 0~100 系统攥住的强度，也是文风门控开关
          清醒频率: number; // 0~100 越高越容易在交涉中出现清醒瞬间
          最近一次清醒: string; // 时间与场合，没有写「无」
          身体状态: { 湿润: number; 乳尖: boolean };
          占有印记: string; // 身上留下的固定痕迹，没有写「无」
        }
      }
    check:
      - 键用真名。写别的名字会报路径不存在并被跳过
      - 时期与绑定深度必须按 _stage_rules 对齐
      - 深度到 60 以上这一段自动走母猪层文风，60 以下走骚妈层，不要手动干预文风
    最近一次清醒:
      check:
        - 她上一次出现清醒瞬间的时间与场合，没出现过写「无」
        - 只在她真的掷出清醒瞬间时改这一条，别的时候不要动
    身体状态:
      湿润:
        type: number
        range: 0~100
        check:
          - 她被林天碰过、被指令触发、或长时间处在场域内就往上走，单次加五到二十
          - 场面冷下来、她清醒、或离开场域就往下走，单次减五到十五
          - 这个数只写她的即时身体反应，不代表她的意愿。正文里身体先答应的写法就用它
      乳尖:
        type: boolean
        check:
          - 被含、被捻、被冷气激到、或指令触发时置 true
          - 场面结束后回落，通常同一次输出内就会回到 false，不需要专门写一轮
    占有印记:
      check:
        - 她身上固定留下的痕迹，没有写「无」
        - 新增印记必须是正文里真的发生过的事，不许凭空添
        - 印记会累积，写在同一个字符串里，用顿号隔开

  玩家:
    财富等级:
      type: A1 | A2 | A3 | A4 | A5 | A6 | A7 | A8 | A9 | A10 | A11 | A12 | A13 | A14 | A15
      check:
        - 开局 A9。资产大幅流失时跟着降级
    资产:
      type: number
      check:
        - 单位元。被转移、被冻结、诉讼费、调查费都落到这个数上
    公司状态:
      type: 正常 | 承压 | 濒临破产 | 已失去
      check:
        - 被抽走一个项目降一档，拿回来可回升
    觉醒度:
      type: number
      range: 0~100
      category:
        0~30: 只察觉异常，不知道系统
        31~70: 开始拼凑模式，怀疑有人护着林天
        71~100: 能识破系统预判与水军，能推出系统的存在
      check:
        - 由他亲眼撞见的事推进。高于 70 时系统预判与水军对他失效
        - 不许因为数值让他直接知道系统，知道之前必须有对应画面
    反抗力:
      type: number
      range: 0~100
      check:
        - 交涉失手、盟友反水、证据被销毁时降；交涉得手、拿到新证据时升
    交涉:
      气势~地位:
        type: number
        range: 0~100
        check:
          - 只有他真正拿下一件事时才涨，不许随剧情自动涨
    证据链:
      type: string
      value: 用「；」分隔的证据清单，上限 8 条
      check:
        - 调查成功时接在最右端：写清是什么证据、从哪来、证明了什么
        - 同一条只能用一次。交涉中被销毁时把它从串里删掉
        - 超过 8 条时删掉最前面那条，再整串 replace 写回
    与妻子关系:
      type: 亲密 | 疏远 | 敌对 | 断裂
      check:
        - 跟着苏婉的时期走，可以比她慢一档。不许她还没变质就写断裂

  交涉状态:
    进行中:
      type: boolean
      check:
        - 进入交涉写 true，结算完成写 false
        - 从 false 改成 true 的那一次是「新交涉开始」，必须按下面那条把六个计数清零
    新交涉开局清零（false 改 true 的同一次输出里做，不许拖到下一轮）:
      - /交涉状态/回合 归零
      - /交涉状态/玩家共识分 与 /交涉状态/对手共识分 归零
      - /交涉状态/能力值、/交涉状态/要求值、/交涉状态/成功率、/交涉状态/掷值 归零
      - /交涉状态/上轮判定 写「无」，/交涉状态/效果倍数 写 1，/交涉状态/本轮判定 写空串
      - /交涉状态/幕次 写「寒暄」
      - /交涉状态/交涉历史 整串清空
      - 理由: 这些是「本场」的计数与读数，不清零就会跨场累积，共识分一到三十就永远判他得手
    对象:
      check:
        - 对手名字，可以是林天、某个被绑定者、某个家属、也可以是机构
    回合:
      type: number
      check:
        - 交涉每走一轮加一
    幕次:
      type: 寒暄 | 辞锋 | 共识 | 结束
      check:
        - 三幕按顺序走，不许跳。结算完写「结束」
    玩家共识分:
      type: number
      check:
        - 到 30 判玩家在这一场得手
    对手共识分:
      type: number
      check:
        - 到 30 判对手在这一场得手
    能力值:
      type: number
      range: 0~100
      check:
        - 判定引擎给的 P，照抄，不要自己算
    要求值:
      type: number
      range: 0~100
      check:
        - 判定引擎给的 R，照抄，不要自己算
    成功率:
      type: number
      range: 0~100
      check:
        - 判定引擎给的 S，等于 50 加差值再钳在 5 到 95 之间。照抄
    掷值:
      type: number
      range: 0~100
      check:
        - 判定引擎给的 V，照抄，禁止编造，禁止写 0
    上轮判定:
      check:
        - 按判定引擎的五档写：大成功｜成功｜勉强成功｜失败｜大失败。没进交涉写「无」
        - 档位是引擎按「差值＋成败」联合判的，不许改写
    效果倍数:
      type: number
      check:
        - 跟着档位走：大成功 1.5｜成功 1｜勉强成功 0.6｜失败 1｜大失败 2
        - 结算共识分、反抗力、评价值时乘上它
    本轮判定:
      type: string
      check:
        - 这是一次性触发串。面板写完、引擎条目读到并渲染进信息区，你结算完之后写回空串
        - 不要在这里写正文，不要改它的内容
    交涉历史:
      type: string
      value: 用「；」分隔的回合记录，上限 10 条
      check:
        - 每轮在最右端接一条：第 N 回合 · 能力值 P 对 要求值 R · 成功率 S 掷值 V · 判定 Y
        - 超过 10 条时删掉最前面那条，再整串 replace 写回

  评论:
    倾向:
      type: 叫好 | 中性偏叫好 | 中性偏吐槽 | 吐槽 | 弃书
      check:
        - 跟着评价值走：七十以上叫好｜五十到六十九中性偏叫好｜三十到四十九中性偏吐槽｜十到二十九吐槽｜十以下弃书
    热门:
      check:
        - 写这一轮最扎眼的那一条评论正文，带用户名。没有写空字符串

  设置:
    骰子种子:
      type: number
      check:
        - 判定引擎的伪随机种子。由前端面板在每次判定时写入（记录本轮用的是哪个种子）
        - AI 不要写它。它的用处是让同一个回合重新渲染时得到同一个结果
        - 它只增不减，不需要归零，也不要加到信息区
    主题:
      type: 夜间 | 日间
      check:
        - 由前端面板维护，AI 不要写
        - 面板读到「日间」时切亮色配色，读到别的或空值时用夜间。这一条只影响外观，不影响任何机制

  清醒频率的单字段规则（它写在每个真名下，形状见上面 绑定花名册 的 type）:
    range: 0~100
    check:
      - 她这一场出现过清醒瞬间就往下走
      - 长时间没有清醒尝试、或她刚被推深一档就往上走，代表系统在压
      - 单次幅度 ±1~±10，不许一次归零或拉满
      - 深度到八十以上的人，这个数写成多少都不影响判定（清醒被百分百压掉），但它仍然要如实写
