# ════════════════════════════════════════════════════════════
# euphoria 契约表（T1~T4）
#
# 依据：引擎模板/机制层规范.md §三
# 引擎层 = 引擎能力 + 契约表；底座 = 填这几张表 + 提供内容条目。
# 本文件是 euphoria 这个底座填的表。
#
# 写法要求（来自机制层规范）：
#   每个状态必须填「意义」—— 回答一个问题：
#     这个数值改变了玩家的什么体验？
#   答不出的状态不许存在。
# ════════════════════════════════════════════════════════════

meta:
  底座: euphoria
  来源: euphoria（CLOCKUP / 2011）
  说明: 密室逃脱。七个人被关在白色设施里，他做钥匙，女角做锁孔。屏幕外有一个女玩家在操控他

# ════════════════════════════════════════════════════════════
# T1 · 时间表
# ════════════════════════════════════════════════════════════
T1 时间表:
  推进单位: 层
  单位上限: 一层 = 一次回复 = 游戏里大约十分钟。不设层数硬上限，靠「她的上线时长」自然截断
  大单位: 关卡
  推进者:
    她: 在线态。她点了几下选项，这一层就过去
    日历: 离线态。她不在时世界照走，体力按离线速率掉
    系统: 关卡完成时切关。五扇门，一关一扇
  不可阻挡:
    - 离线态的时间流逝。她不点也在走，体力和痕迹一起变
    - 她什么时候上线、什么时候下线。这一点 <user> 决定不了
  第二条计时线:
    装置倒计时: 每一关有层数上限（8/8/7/6/5），每过一层 -1，不管她在不在线；归零即处刑
    和她的时间的区别: 她下线时她的时间停住，装置倒计时照走
  可停:
    暂停态: 世界完全静止，时间不流动，体力不扣
  尺度参照:
    五轮游戏: 大约一小时

# ════════════════════════════════════════════════════════════
# T2 · 状态表
# ════════════════════════════════════════════════════════════
T2 状态表:
  主角:
    - 名: 反抗值
      意义: 玩家唯一能反抗的资本。它决定「拒绝」这个按钮还灵不灵
      范围: 0~100
      初值: 50
      增长: 离线自主行动，每次 +2~5
      衰减: 拒绝选项按等级扣（微 3~5 / 中 10~15 / 强 25~35 / 极 50 以上）；反抗失败也照样扣
      周期: 无
      阈值: 归零即深度顺从，拒绝按钮消失，只能等离线时间把它缓慢回充
      备注: 单次变化上限的唯一例外，拒绝「极」时可以一次扣 50 以上

    - 名: 体力
      意义: 她不在的时候，你的自由是有价格的
      范围: 0~100
      初值: 100
      增长: 睡满一觉 +30~50；进食 +5~10
      衰减: 离线态每过一段 -1~3
      周期: 离线态按段结算
      阈值: 归零即冻结态，意识封存
      备注: 终局之后它是「最后一次自由」的倒计时

    - 名: 状态
      意义: 决定这一层你能做什么。是唯一直接改变操作方式的字段
      范围: 在线／暂停／离线／冻结
      初值: 在线
      增长: 不适用（由她的行为和体力决定）
      衰减: 不适用
      周期: 每层重写
      阈值: 体力归零 → 冻结；她回来 → 在线

    - 名: 对她的了解
      意义: 你唯一的武器。它决定「她的倾向暗示」能看清到什么程度
      范围: 0~100
      初值: 0
      增长: 通过摄像头观察她，按观察到的具体行为累积
      衰减: 不落（她是同一个人，看清了就看清了）
      周期: 无
      阈值: 0-20 只知道她在犹豫｜21-50 看出她中意哪一类｜51-80 看出她盯着哪个选项｜81+ 能确定她会点哪个

    - 名: 身体.忍耐度
      意义: 这一层你还能撑几下。它是「当场交代」的计时器
      范围: 0~100
      初值: 100
      增长: 事后回升
      衰减: 她继续往下点就扣
      周期: 每层
      阈值: 归零 → 当层交代（射精／失禁／崩溃，随场景定）

    - 名: 身体.敏感度
      意义: 你的身体正在被她改变的证据。它涨得慢落得也慢，是你逃不掉的痕迹
      范围: 0~100
      初值: 0
      增长: 被持续刺激，+3~8／次
      衰减: 连续三天没有新刺激，每天 -1~2
      周期: 每层
      阈值: 越高，同样刺激下的反应越剧烈、忍耐度上限越低

    - 名: 身体.累计次数
      意义: 只增不减的真计数器。数字本身没有意义，但它一直在涨
      范围: 0 以上，无上限
      初值: 0
      增长: 每发生一次 +1
      衰减: 不落（这是全卡唯一的单向计数器）
      周期: 无
      阈值: 无

    - 名: 不可逆损伤
      意义: 永远不会消退的东西。和「身体痕迹」的区别就在这：那些会淡，这些不会
      范围: 记录（动态键）
      初值: 空
      增长: 她做出永久性伤害的选择时新增，一层最多一条
      衰减: 不落（写进去就不能撤回）
      周期: 无
      阈值: 无

    - 名: 痕迹 / 已知软肋 / 身上 / 已知线索 / 已封死的路 / 身体痕迹
      意义: 六个记录表，各记一件事。痕迹是你留下的，软肋是她摸清的，身上是你拿到的，线索是你查出来的，封死的路是你拒掉的，身体痕迹是她造成的
      范围: 记录（动态键）
      初值: 空
      增长: 各自的事件触发时新增
      衰减: 痕迹的「明显度」每过一天 -1~2；软肋、封死的路、不可逆损伤不落
      周期: 无
      阈值: 痕迹明显度超过她的注意力 → 被发现
      备注: 封死的路只会变长；它越长，你能选的越少

    - 名: $骰子种子
      意义: 让判定可复现。同一回合重新渲染必须得到同一个结果
      范围: 整数
      初值: 20260914
      增长: 每次投掷后更新
      衰减: 不适用
      周期: 每次判定
      阈值: 无
      备注: AI 既看不到也不更新它，由脚本读写

  她:
    - 名: 人设
      意义: 这一局坐在屏幕前的是谁。它决定她点什么、怎么说话、想要什么
      范围: gentle／greedy／smirking／daredevil／quiet／indifferent／completionist
      初值: gentle
      增长: 不适用
      衰减: 不适用
      周期: 每层重写
      阈值: 无
      备注: 开局定下就不再变，只有情绪被推到极端才允许漂移

    - 名: 熟练度
      意义: 她上手到什么程度。它同时管三件事：上线时长与间隔、痕迹扫描强度、反抗成功率的惩罚
      范围: 新手／上手／沉浸／狂热／收官
      初值: 新手
      增长: 按累计上线次数与总时长推进，两次跨档至少隔十层
      衰减: 连续七天没上线，回退一档（收官退回沉浸）
      周期: 跨档时
      阈值: 反抗成功率惩罚 0 / 0.1 / 0.2 / 0.3 / 0.4

    - 名: 兴奋度
      意义: 她此刻有多上头。它决定她点得有多狠、以及她注不注意得到异常
      范围: 0~100
      初值: 0
      增长: 剧情出现她的兴奋点，+10~25；开始自慰直接推到 70 以上
      衰减: 长时间平淡或触及她反感的内容，-10~20
      周期: 每层
      阈值: 达到 80 她跳出选项、改自由打字；高潮后进入贤者时间，选项变温和但痕迹扫描加强
      备注: 无 UI 提示。她兴奋的时候注意不到异常，那是 <user> 唯一的机会

    - 名: 情绪
      意义: 她还想不想玩下去。它是她退场的另一条路
      范围: 好奇／投入／执念／厌倦
      初值: 好奇
      增长: 目的进度推进时往「投入」走
      衰减: 目的进度停滞 + 反抗次数累积，往「厌倦」走
      周期: 每层
      阈值: 掉到「厌倦」并连着十层没起色 → 她腻了，触发终局

    - 名: 目的进度
      意义: 她这一次玩想要的东西，拿到多少了。满值她就会关掉游戏
      范围: 0~100
      初值: 0
      增长: 没有统一公式，由她那一套人设的「诉求」段定义
      衰减: 同样由人设定义（打断她的收集顺序、没能把关系弄碎，都会退）
      周期: 每层
      阈值: 满值 → 她得手了，触发终局
      备注: 和关卡进度是两条独立轴。她完全可能在游戏没通关时就达成目的

    - 名: 游玩时长
      意义: 显示用。她屏幕边缘写着你被玩了多少小时
      范围: 字符串，如「12 小时」
      初值: 0 小时
      增长: 按她实际在线时间累加
      衰减: 不落
      周期: 每层
      阈值: 无

    - 名: 刚才说的 / 此刻 / 身体
      意义: 她这一侧给 <user> 看的三样。台词、她在做什么、她身体此刻的样子
      范围: 字符串（她.身体 是五个字符串字段）
      初值: 空
      增长: 每层按她的实际状态重写
      衰减: 每层重写（不是累加）
      周期: 每层
      阈值: 无
      备注: 离线时留空的要留空，不要编

  世界:
    - 名: 底座
      意义: 换一个值等于换一个游戏玩。引擎层不动，她还是那一个她
      范围: euphoria（未来会有别的底座）
      初值: euphoria
      增长: 不适用
      衰减: 不适用
      周期: 不适用
      阈值: 它同时是所有底座条目的门控条件

    - 名: 当前关卡
      意义: 现在开到第几关。它决定选项池从哪一节取
      范围: 第一关～第五关（各带场景名）
      初值: 第一关·监视器装置房
      增长: 关卡进度满 → 切下一关
      衰减: 不退
      周期: 切关时
      阈值: 五扇门全开 → 进「世界.篇章 = 学园」（只有叶线走得到）

    - 名: 关卡进度
      意义: 这一关完成多少了。它决定这扇门什么时候开
      范围: 0~100
      初值: 0
      增长: 她选的选项被完整执行时 +10~30，单层不超过 +30
      衰减: 被她拒绝而卡住时不推进；把某些地方弄坏了 -10~20
      周期: 每层
      阈值: 满值 → 门开，切下一关

    - 名: 场景 / 当前线 / 篇章
      意义: 三个位置字段。场景是现在在哪，当前线是走谁的线，篇章是密室还是学园
      范围: 场景自由文本；当前线 未定／梨香／菜月／凛音／合欢／叶／鬼畜；篇章 密室／学园／记忆
      初值: 中央大厅 / 未定 / 密室
      增长: 玩家主动移动到别的地方时改
      衰减: 不适用
      周期: 每层可重写
      阈值: 只有叶线走得到「学园」和「记忆」

    - 名: 女角[].关系
      意义: 她跟 <user> 走到哪一步了。它决定她下次上线看到的选项列表
      范围: 陌生／警惕／动摇／依附／崩坏
      初值: 陌生
      增长: 看谁的关系统最高，加上她的人设偏好谁
      衰减: 太久没接触会退
      周期: 每层重写
      阈值: 每次改变要有一个明显的事件（谁把话说开了、谁被弄坏了）

    - 名: 女角[].开发度（胸／阴部／后穴，各一处）
      意义: 三个部位的开发程度。它是选项池里「极」级选项能不能出现的条件
      范围: 0~100
      初值: 0
      增长: 该部位被实际使用时 +3~8
      衰减: 落后于其他部位太多时回填
      周期: 每层
      阈值: 某处开发度不足时，指向它的「极」级选项不出现

  局面:
    - 名: 自定义意图
      意义: 他唯一一次能按自己意思动的机会。代价大到整局只够搏一两次
      范围: 字符串
      初值: 空
      增长: 玩家在界面上写一条意图时填入
      衰减: 结算完清空
      周期: 每层
      阈值: 消耗 70、基础成功率 5。凑不够 70 就按不下去

    - 名: 误点
      意义: 这一层她点错了。它给 <user> 一个意外之喜
      范围: 真／假
      初值: 假
      增长: 每层出招时按熟练度掷一次（新手 15% / 上手 10% / 沉浸 6% / 狂热 3% / 收官 8%）
      衰减: 每层重置
      周期: 每层
      阈值: 命中时她点的是她本来不想点的那个，要写她的反应

    - 名: 她已选
      意义: 这一层她点了哪个。它是下一层「她已经做了什么」的依据
      范围: 字符串
      初值: 空
      增长: 结算时填入
      衰减: 下一层开始时清空
      周期: 每层
      阈值: 无

  终局:
    - 名: 已触发
      意义: 游戏结束了。世界停止推进，只剩最后一次自由
      范围: 真／假
      初值: 假
      增长: 她的目的进度满值，或她腻了，它变 true
      衰减: 不落（触发就是触发）
      周期: 无
      阈值: 变 true 的同时把「剩余体力」回满为 100

    - 名: 剩余体力
      意义: 最后一次自由还剩多少。它决定你最后能做哪一件事
      范围: 0~100
      初值: 0（未触发时无意义）
      增长: 触发终局时一次性回满 100
      衰减: 终局里每做一件事扣对应消耗
      周期: 每件事
      阈值: 归零即真的结束

    - 名: 选择
      意义: 你最后选了哪一件事。它是全卡的收尾方式
      范围: last_person／last_record／destroy_all／gaze／cross_line／null
      初值: null
      增长: 不适用
      衰减: 不适用
      周期: 一次性
      阈值: cross_line 需要「对她的了解」达到 80 才出现

# ════════════════════════════════════════════════════════════
# T3 · 阶段表（她的手段随熟练度递进）
# ════════════════════════════════════════════════════════════
T3 阶段表:
  说明: euphoria 的递进不是 NSFW 尺度，而是「她对这个游戏的熟练度」。它决定她能用出什么手段，也就是 <user> 要面对的难度形状
  新手:
    她的手段: 照着游戏提示点，选项念出声再点
    给 <user> 的空间: 大。她犹豫得久，倾向暗示很好读
    痕迹扫描: 弱，只看明显的东西
  上手:
    她的手段: 开始有方向，知道自己在找什么
    给 <user> 的空间: 中。她点得快了，但还会误点
    痕迹扫描: 变细，会注意到对不上的地方
  沉浸:
    她的手段: 会用游戏内的机制，会为了某个女角绕路
    给 <user> 的空间: 小。她开始针对你留过的痕迹
    痕迹扫描: 最细，一处不对就会回头查
  狂热:
    她的手段: 熬夜玩，跳过对话，直接冲内容
    给 <user> 的空间: 很小。但因为她太快，反而漏掉细节
    痕迹扫描: 因为快而漏，这是唯一的缝隙
  收官:
    她的手段: 走神、刷手机、急着走到终点
    给 <user> 的空间: 看人设。有的她这时最松，有的她这时最狠
    痕迹扫描: 最疏，不回头

# ════════════════════════════════════════════════════════════
# T4 · 目的清单（goal_units）
#
# 把「她的目的进度 0-100」从想象出来的数字，变成可枚举清单。
# 进度 = 已达成数 / 该人设的单位数 × 100
# ════════════════════════════════════════════════════════════
T4 目的清单:
  格式:
    单元: 可枚举的内容清单，每格对应一件具体的事
    人设映射: 每套人设取哪一子集
    进度公式: 已达成数 / 该人设的单位数 × 100

  通用单元池:
    通关: 一扇门对应一格，五扇门五格
    看遍身体: 每个女角 × 三个部位，看她有没有把每一处都推到过
    把他逼到极限: 忍耐度在某一层归零，每归零一次一格
    毁掉一条关系: 把某个女角的关系推到「崩坏」，每崩一个一格
    走到尽头: 抵达终局，一格
    解锁一条线: 当前线从「未定」切到某个女角，每条线一格
    让他自己伸手: 他在离线态主动做了本该被逼着做的事，一格

  人设映射:
    gentle:
      取: [走到尽头]
      单位数: 1
      说明: 她只要把他活着带到终点。这一格拿不到，她就不算赢
    greedy:
      取: [看遍身体]
      单位数: 15
      说明: 五个人三处，一处一格。她要把每一格都点到
    smirking:
      取: [把他逼到极限]
      单位数: 3
      说明: 三次极限就够她满足了，之后她会走
    daredevil:
      取: [解锁一条线, 走到尽头]
      单位数: 8
      说明: 六条线加两端。她要把没走过的那条走一遍
    quiet:
      取: [毁掉一条关系, 走到尽头]
      单位数: 6
      说明: 五个崩坏加一个终局。她要看的是这个
    indifferent:
      取: []
      单位数: 0
      说明: 她没有目的。进度不涨，她只可能走「她腻了」那条路退场
    completionist:
      取: [看遍身体, 毁掉一条关系, 把他逼到极限, 走到尽头, 解锁一条线, 让他自己伸手]
      单位数: 34
      说明: 全部收集。任何一格缺着，她都不会关掉游戏

  引擎侧只认两个数:
    单位数: 该人设取了多少格
    已达成数: 运行时的「已达成单元列表」长度
