# ============================================================
mvu:
  structure: |
    顶层结构：
    ├── 主角
    │   ├── 反抗值：0-100，拒绝选项的燃料
    │   ├── 体力：0-100，离线自由的时间代价
    │   ├── 状态：在线｜暂停｜离线｜冻结
    │   ├── 对她的了解：0-100，决定「她的倾向暗示」的清晰度
    │   ├── 痕迹：动态键记录，离线行为留下的痕迹（含内容、明显度、是否被发现）
    │   ├── 已知软肋：动态键记录，她已摸清并会绕开的
    │   ├── 身体：你的身体账单（忍耐度／累计次数／敏感度／身体痕迹）
    │   └── $骰子种子：LCG 伪随机的种子（AI 不可见，脚本读写）
    ├── 她
    │   ├── 人设：7 套 id 之一
    │   ├── 熟练度：新手｜上手｜沉浸｜狂热｜收官
    │   ├── 兴奋度：0-100，无 UI 提示
    │   ├── 情绪：好奇｜投入｜执念｜厌倦
    │   ├── 目的进度：0-100，她想要的东西达成到哪一步。推进条件与反抗效果由各套人设的「诉求」段分别定义，没有统一公式
    │   └── 游玩时长：显示用，她屏幕边缘写着你被玩了多少小时
    ├── 世界（模块化：底座可换，故全部用通用容器）
    │   ├── 底座：euphoria（换值 = 换一个游戏）
    │   ├── 当前关卡：由底座包定义
    │   ├── 关卡进度：0-100
    │   ├── 场景
    │   └── 女角（动态键）
    │       └── <角色名>
    │           ├── 关系：陌生｜警惕｜动摇｜依附｜崩坏
    │           ├── 状态
    │           ├── 开发度：0-100，被做到哪一步
    │           └── 身体记忆：她的身体记住了什么
    ├── 局面
    │   ├── 当前选项：动态键记录，本层浮现的三到四个选项
    │   ├── 她的倾向：她倾向点哪个（清晰度随「对她的了解」）
    │   └── 她已选：她最终点的那个，结算后填
    └── 终局
        ├── 已触发：boolean
        ├── 剩余体力：0-100，最后一次自由的倒计时
        └── 选择：last_person｜last_record｜destroy_all｜gaze｜cross_line｜null

  variables:
    # ── 主角 ──
    - path: 主角.反抗值
      type: number
      range: 0~100
      check: 离线自主行动缓慢累积；在线被逼做屈辱之事剧烈累积；拒绝选项按等级扣点。耗尽进入「深度顺从」，不显示拒绝按钮，随离线时间缓慢回充
    - path: 主角.体力
      type: number
      range: 0~100
      description: 离线自由的时间代价，归零即冻结
      check: 离线态随时间线性扣减；暂停态不扣；睡眠/进食/静止可恢复
    - path: 主角.状态
      enum: [在线, 暂停, 离线, 冻结]
      description: 当前所处状态，决定可行动范围
    - path: 主角.对她的了解
      type: number
      range: 0~100
      check: 通过摄像头观察她（她的吐槽、房间细节、习惯、自慰时机、对哪类选项有反应）累积；0-20 只知道她在犹豫，21-50 能看出她中意哪一类，51-80 能看出她盯着哪个选项，81+ 能确定她会点哪个；「越界一次」终局需 ≥80
    - path: 主角.痕迹
      type: z.record
      description: 离线行为留下的记录（内容、明显度、是否被发现）；她上线时按熟练度扫描，被发现则触发惩罚
    - path: 主角.已知软肋
      type: z.record
      description: 她已摸清并在后续选项中主动绕开的软肋；越反抗越长，越长越难反抗
    - path: 主角.身体.忍耐度
      type: number
      description: 每层的即时承受力，0~100；归零当层就交代；上限随敏感度下降
    - path: 主角.身体.累计次数
      type: number
      description: 被用了多少次，只增不减，没有上限
    - path: 主角.身体.敏感度
      type: number
      description: 被改写的程度，0~100，只增不减；越高反应越剧烈、忍耐上限越低
    - path: 主角.身体.身体痕迹
      type: z.record
      description: 留在身体与场景上的东西（含来源、是否消退）；与她造成的其他痕迹区分开
    - path: 主角.$骰子种子
      type: number
      description: LCG 伪随机的种子，AI 不可见、脚本读写；每次投掷后更新，保证同一回合重新渲染结果一致

    # ── 她 ──
    - path: 她.人设
      enum: [gentle, greedy, smirking, daredevil, quiet, indifferent, completionist]
      description: 开局启动的屏幕外玩家，决定选项倾向、自慰形式与结局走向
    - path: 她.熟练度
      enum: [新手, 上手, 沉浸, 狂热, 收官]
      description: 决定上线时长/间隔、痕迹扫描强度
    - path: 她.兴奋度
      type: number
      range: 0~100
      check: 由剧情节点确定性驱动（非随机）；高时选项激进但注意不到 BUG；高潮后进入贤者时间，选项变温和但痕迹扫描加强
    - path: 她.情绪
      enum: [好奇, 投入, 执念, 厌倦]
      description: 决定人设漂移与选项倾向；目的进度卡住 + 反抗次数共同触发漂移
    - path: 她.目的进度
      type: number
      range: 0~100
      description: 达成即她退场、触发终局
    - path: 她.游玩时长
      description: 显示用；她屏幕边缘写着你被玩了多少小时

    # ── 世界（模块化：底座可换，故用通用容器，换底座不需改结构） ──
    - path: 世界.底座
      enum: [euphoria]
      description: 当前生效的 galgame 底座包 id；换值即路由到另一套世界观/女角/关卡 —— 等于换一个游戏
    - path: 世界.当前关卡
      description: 当前关卡标识，由底座包定义（如 Euphoria 的「第一关·监视器装置房」）
    - path: 世界.关卡进度
      type: number
      range: 0~100
      description: 当前关卡内的推进度
    - path: 世界.场景
      description: 当前所在场景，由底座包定义
    - path: 世界.女角.开发度
      type: number
      description: 每位女角被做到哪一步，0~100；涨得比关系慢，不因关系变化自动涨
    - path: 世界.女角.身体记忆
      description: 每位女角的身体记住了什么；与关系无关，且很难消除
    - path: 世界.女角
      type: z.record
      description: 以角色名为键（动态键），值为 { 关系, 状态 }；换底座无需改动

    # ── 局面 ──
    - path: 局面.当前选项
      type: z.record
      description: 本层浮现的三到四个选项（文本、反抗等级、反抗消耗、她的后果、触发条件）；供状态栏渲染选项卡，她只会选其中一个
    - path: 局面.她的倾向
      description: 她的倾向暗示，清晰度由「主角.对她的了解」决定；不得直接写出她最终的选择
    - path: 局面.她已选
      description: 她最终点的选项标识，结算后填写，下一层开始时清空

    # ── 终局 ──
    - path: 终局.已触发
      type: boolean
    - path: 终局.剩余体力
      type: number
      range: 0~100
      description: 最后一次自由的倒计时
    - path: 终局.选择
      enum: [last_person, last_record, destroy_all, gaze, cross_line]
      description: 空值表示尚未选择

# ============================================================
ejs:
  entries:
    # 底座包路由：切换 `世界.底座` 的值即换一套世界观/女角/关卡 —— 模块化的总开关
    - name: 密室世界
      complexity: 条目显隐
      condition: "getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'"

    # 屏幕外的她：7 套只渲染当前启动的那一套
    - name: 她_温砚
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:gentle'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'gentle')"
    - name: 她_丰娆
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:greedy'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'greedy')"
    - name: 她_舒晏
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:smirking'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'smirking')"
    - name: 她_唐响
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:daredevil'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'daredevil')"
    - name: 她_沈眠
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:quiet'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'quiet')"
    - name: 她_莫漾
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:indifferent'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'indifferent')"
    - name: 她_纪清
      complexity: 条目显隐
      condition: "matchChatMessages(['GGPLAYER:completionist'], { start: 0 }) || (!matchChatMessages(['GGPLAYER:'], { start: 0 }) && getvar('stat_data.她.人设', { defaults: 'gentle' }) === 'completionist')"
    # 她的阶段：熟练度五阶段段落控制
    - name: 熟练度阶段
      complexity: 段落控制
      stages:
        - name: 新手期
          condition: "getvar('stat_data.她.熟练度', { defaults: '新手' }) === '新手'"
        - name: 上手期
          condition: "getvar('stat_data.她.熟练度', { defaults: '新手' }) === '上手'"
        - name: 沉浸期
          condition: "getvar('stat_data.她.熟练度', { defaults: '新手' }) === '沉浸'"
        - name: 狂热期
          condition: "getvar('stat_data.她.熟练度', { defaults: '新手' }) === '狂热'"
        - name: 收官期
          condition: "getvar('stat_data.她.熟练度', { defaults: '新手' }) === '收官'"

    # 阶段指导：四态段落控制
    - name: 阶段指导
      complexity: 段落控制
      stages:
        - name: 在线态
          condition: "getvar('stat_data.主角.状态', { defaults: '在线' }) === '在线'"
        - name: 暂停态
          condition: "getvar('stat_data.主角.状态', { defaults: '在线' }) === '暂停'"
        - name: 离线态
          condition: "getvar('stat_data.主角.状态', { defaults: '在线' }) === '离线'"
        - name: 冻结态
          condition: "getvar('stat_data.主角.状态', { defaults: '在线' }) === '冻结'"

    # 终局：仅在触发后渲染
    - name: 终局
      complexity: 条目显隐
      condition: "getvar('stat_data.终局.已触发', { defaults: false }) === true"

