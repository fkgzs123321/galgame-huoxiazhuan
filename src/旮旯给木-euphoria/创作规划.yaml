# ============================================================
# 契约表（T1~T4）
# 引擎层 = 引擎能力 + 契约表；底座 = 填这几张表 + 提供内容条目。
# 本底座的表在 项目根的 机制.yaml（工程文件，不注册为条目、不进 prompt）。
# 依据：引擎模板/机制层规范.md 的 §三
# ============================================================

first_messages:
  - format: 说明式
    output_path: 开场白/0.md
    purpose: 告知玩家这是什么卡、状态栏怎么看、7 套「屏幕外的她」在哪里启动。非游玩入口，仅作前置说明

  # 游玩入口：表单式。玩家在这里选她，前端界面把对应场景送进对局
  - format: 表单式
    output_path: 开场白/1.md
    purpose: 开局菜单。<OpeningPlaceHolder/> 由开局表单界面替换为 11 个选项，每个选项对应下面一条额外开场白

  # 7 套额外开场白：每套配一份 initvar_override，把 她.人设 初始化成对应值
  # 编号约定：开场白/N.txt 与 开场白/initvar/N.yaml 必须同号
  - format: 叙事式
    word_count: 550~700
    output_path: 开场白/2.txt
