# ============================================================
# 旮旯给木 · 创作规划.yaml
# 结构遵循 tavern-cards/references/requirements/planning-yaml.md
# entries 数组顺序 = 默认创作顺序 = 项目级事实来源
# ============================================================
#
# 【模块化架构】本卡是「引擎 + 可插拔底座」，分两层解耦：
#
#   ① 引擎层 ENGINE —— 与底座完全无关，换底座时一行不动
#      · 机制：四态循环 / 反抗与判定 / 她的愉悦线 / 剧情推进
#      · 约束：叙述准则 / 感知禁令
#      · 流程：阶段指导 / 终局
#      · 【屏幕外的她】7 套人设 —— 同样属于引擎层
#        她换了底座，等于「换一个游戏玩」；她的目的、性癖、兴奋点、底线、
#        选项偏好全部不变，变的只是她手上这个游戏的世界与女角。
#        所以她与底座解耦，随引擎走。
#      目录：世界书/世界观/引擎/ 、世界书/扮演准则/ 、世界书/角色/屏幕外的她/
#
#   ② 底座包 BASE —— 换掉整包 = 换一个游戏
#      目录：世界书/世界观/底座_<id>/ 、世界书/角色/底座_<id>/
#      已实装：底座_euphoria
#      接口契约（底座包必须提供这 5 件，缺一即接不上引擎）：
#        1. 世界观条目（世界规则、空间、该 galgame 的核心设定）
#        2. 游戏内女角清单（每人 basic + personality，走「角色」类型）
#        3. 关卡序列（关卡名、顺序、推进条件）
#        4. 选项树（★ 底座包的核心交付物。每关 15-25 个选项，每项标注：
#           文本 / 反抗等级（微·中·强·锁）/ 反抗消耗 / 她选它的后果 / 触发条件）
#        5. 终局映射（该底座的结局如何对应「她的目的达成」）
#
#   分界判据：**看它是否随「换游戏」而变**。
#     屏幕外的她 → 不变 → 引擎层
#     游戏内女角与世界观 → 变 → 底座包
#
# 换底座的操作：改 `世界.底座` 的值 + 放入对应底座包 → EJS 自动路由 → 新游戏。
# ============================================================

project:
  name: 旮旯给木
  worldbookName: 旮旯给木
  form: charactercard
  mvu: true
  ui_mode: frontend          # 双栏：主界面=galgame世界 / 角落=摄像头小窗（你看到的她）

# ============================================================
world:
  overview: |
    纯白密室。一处没有窗、没有影、声音会来回弹的空间。
    你和数名女性被关在这里，被要求完成一场"游戏"：男性是钥匙，女性是锁孔。
    每完成一关，解锁一扇通向外面的门。拒绝参加的人会被当着所有人处死——
    第一个拒绝的班长死在电椅上，那是所有人共同的锚点。
    所有人由此明白：不遵从指令，就会死在这里。
    而在这之上还有一层：屏幕外有一个女人正在玩这个游戏，
    她替你选选项、替你说话，而你【完全清醒】地看着这一切发生。
  regions:
    - name: 纯白密室
      scenes: [中央大厅, 监视器装置房, 玻璃房, 洗手间, 储物间, 天台]
      description: 全白、无窗、回响空旷。每完成一关解锁一扇门；监视器装置是整个空间的枢纽
    - name: 密室之外
      scenes: [地面, 榊野市街道, 学园, 主角住所, 海岸]
      description: 逃出后回到的世界——但你不知道这个世界是不是也是"被制造的"
  factions:
    - name: 密室系统
      description: 发布关卡指令、处决违规者、控制空间。它之上还有"制造者"
      territory: 纯白密室
      key_members: [系统音]

