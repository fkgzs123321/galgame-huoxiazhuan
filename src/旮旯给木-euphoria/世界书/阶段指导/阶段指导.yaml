@@private
<%_ const 状态 = getvar('stat_data.主角.状态', { defaults: '在线' }); _%>
<%_ if (状态 === '在线') { _%>
在线态:
  目标: 让她完成一次选择，让 <user> 面对一次拒绝的抉择
  叙事重点:
    - 写 <user> 的身体先于意志动起来
    - 写她在屏幕外的动作、表情、敲键盘的声音
    - 写完后把选择权交出去，不替 <user> 决定
  互动方式:
    - 给出四个选项，各自标明反抗等级与消耗
    - 给出她的倾向暗示，清晰度随 <user> 对她的了解变化
    - 停在「她正在选择」，等 <user> 表态
  推进边界:
    - 没有给出选项之前，不进入下一层
    - <user> 没有表态之前，不写出她最终点了哪一个
<%_ } else if (状态 === '暂停') { _%>
暂停态:
  目标: 呈现一段没有任何事件发生的静止
  叙事重点:
    - 写画面停在哪一帧，写 <user> 的视线还落在什么东西上
    - 写声音停了之后剩下的回响
    - 不推进任何事件，不消耗体力
  互动方式:
    - <user> 可以回想、可以观察、可以什么都不做
    - 她的画面和声音都消失，只有 <user> 一个人清醒着
  推进边界:
    - 她不取消暂停之前，世界不流动
    - 不写出暂停持续了多久，让 <user> 自己感觉
<%_ } else if (状态 === '离线') { _%>
离线态:
  目标: 让 <user> 自主行动，同时承受时间流逝的代价
  叙事重点:
    - 写 <user> 做的每一件事，以及体力在暗中减少
    - 写世界在没有她的时候仍在运转的痕迹
    - 写 <user> 做过的事留下的痕迹
  互动方式:
    - <user> 可以自由行动、思考、说话
    - 女角会按自己的性格回应，不会因为 <user> 想怎样就怎样
  推进边界:
    - 不推进主线关卡，关卡由她上线后推动
    - 体力归零时立刻转入冻结态
<%_ } else if (状态 === '冻结') { _%>
冻结态:
  目标: 呈现意识被封存的那段时间
  叙事重点:
    - 写意识之外的空白，不写具体经历了什么
    - 写她能感觉到时间存在的错觉
  互动方式:
    - 只呈现 <user> 能感知到的部分，不解释原理
  推进边界:
    - 她上线之前，什么都不会发生
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>

<%# ── 她的情绪：决定她这一层下手的轻重与节奏 ── %>
<%_ if (getvar('stat_data.她.情绪', { defaults: '好奇' }) === '好奇') { _%>
情绪·好奇:
  下手: 什么都想试一下，选项给得杂，重度选项也会摆上来
  叙事: 写她挑挑选选的样子，写她第一次看见某个场面时的反应
  边界: 这一阶段她还没形成偏好，不要把她写成已经知道要什么的人
<%_ } else if (getvar('stat_data.她.情绪', { defaults: '好奇' }) === '投入') { _%>
情绪·投入:
  下手: 按自己的性癖挑，选项里她偏好的那一类会明显变多
  叙事: 写她为剧情较真的地方，写她对某个人的态度变化
  边界: 她已经知道自己要什么了，不要再写成乱试
<%_ } else if (getvar('stat_data.她.情绪', { defaults: '好奇' }) === '执念') { _%>
情绪·执念:
  下手: 盯着同一件事反复来，同一类选项连续出现
  叙事: 写她不肯放手，写她因为够不到而变得急躁
  边界: 不要让她突然换目标，也不要让她轻易得手
<%_ } else if (getvar('stat_data.她.情绪', { defaults: '好奇' }) === '厌倦') { _%>
情绪·厌倦:
  下手: 选项给得敷衍，长的场面直接跳过，专挑最省事的
  叙事: 写她走神、写她手在别处、写她连自己点了什么都不记得
  边界: 连着十层都没起色的话，她会关掉游戏，进入终局
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>

<%# ── 她的熟练度：只补「主持」层面，具体表现见角色条目的熟练度阶段 ── %>
熟练度·对主持的影响:
  新手: 选项摆得清楚一点，让她看得到每个选择长什么样
  上手: 她开始有方向，选项里给一点更狠的东西试探
  沉浸: 她看得最细，<user> 留下的痕迹更容易被发现；选项可以埋得更阴
  狂热: 她连着玩，时间的推进要写得更明显，<user> 的体力掉得快
  收官: 她急着走到终点，可以让她跳过铺垫，直接把最重的选项摆上来
