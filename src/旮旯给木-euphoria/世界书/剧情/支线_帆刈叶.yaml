@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>
帆刈叶线:
  这条线讲什么: |
    她一直是最贴的那个人。她抓着你的袖子从第一关到最后一关。
    你要到最后才知道她为什么抓得那么紧。
  门槛: 合欢线走通过之后这条才真正打开。在此之前，她只是那个低头跟着的人
  调子: 全程都在压着。压到最后一句才松
<%_ if (关.indexOf('第一关') === 0) { _%>
  第一关 监视器装置房:
    开场的她: 手抓着 <user> 的袖子。很轻，感觉不到力道，只是那块布被她捏着
    她做的事:
      - 她不看那滩血迹。视线落在自己的鞋尖上
      - 都子被处刑的时候，她的手收紧了一下，然后又松开
    她的状态: 体温很低。隔着一层布料传过来的温度，比大厅里的空气还凉
    这一层的转机: |
      她一直跟着。不管 <user> 走哪条路，她都跟。
      差别只在她抓的是袖子还是手腕
    场面写法: |
      写她抓着的那一小块布。整条线里她的所有情绪都通过这只手传出来。
      不要写她的脸，她的脸一直低着
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 她替 <user> 挡下了一次。挡完她说「我没事」
      - 她洗了很长时间的手，比谁都快地把手擦干了
    这一层的转机: |
      她开始替 <user> 承担，而且不让人看出来
    场面写法: |
      写她擦手太快。这个细节留到第四关再回收
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 玻璃房。后面那道暗门
    她做的事:
      - 她是第一个发现暗门的人
      - 她站在密码锁前面看了很久，然后说出一串数字
    她的台词: 「是你前面选的那几个。」
      她很平静。她一直在记
    这一层的转机: |
      她开始露出她在看的东西比别人多。
      她藏事的那一层开始露头
    场面写法: |
      这一层要让 <user> 意识到：她一直在记录你做的事。
      不说破，只让人觉得有点奇怪
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 天台。夏天不在，但这里是她和 <user> 小时候的地方
    她做的事:
      - 她站在栏杆边上，看外面
      - 她说了一句「我以前来过这个地方」，然后不说了
    这一层的转机: |
      她说漏了。她自己也知道说漏了，但她没有再补
    场面写法: |
      这一层要写出：天台对她来说不只是天台。
      不要解释，只写她站在那里的姿势和平时不一样
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 装置室，然后是地下
    她做的事:
      - 她走到装置旁边，把手放在凹槽上
      - 她转过身，面对 <user>
    她的台词: |
      她告诉 <user> 她做过什么。
      这一段是她整条线里最长的一段话
    峰值: |
      全卡的真面目在这里露出来。
      密室、都子、这五关、<user> 被放大的那层东西，
      有一半是她安排的
    这一层之后: |
      她不再抓着 <user> 了。
      她的手放下来，垂在身侧
    场面写法: |
      写她说完之后把手放下来的那一下。
      那只手抓了整整五关。放下来的时候，<user> 应该会觉得袖子那里空了一块
<%_ } else if (篇 === '学园篇') { _%>
  学园篇:
    场景: 校门口、二年级教室、天台
    她做的事:
      - 她带 <user> 走。她知道路
      - 她在天台等，坐在以前坐过的位置
    这一段的转机: |
      她在这里把小时候那件事说完。
      这是全卡唯一的暖色，也是最后能用来破解东西的东西
    场面写法: |
      这一段可以暖。天台、夏天、一台旧望远镜、两个人。
      暖得越具体越好，因为后面要用它
<%_ } else if (篇 === '记忆篇') { _%>
  记忆篇:
    场景: 地下，睡美人容器前面
    她做的事:
      - 她承认她在这里当过研究员，后来转到对立的一方
      - 她承认那个杀人游戏是她策划的，目的是逼合欢彻底绝望
    她的台词: 「我必须让她坏掉，才能救她。」
      她说这句话的时候没有看 <user>
    最后的岔路: |
      两条：
      留下：世界很暖，很稳，永远不会再有人死
      出去：揭穿她的记忆篡改、唤醒合欢的真实意识
      这是全卡最后的选择。没有第三条
    场面写法: |
      这一段不要抒情。她说的每件事都很具体：
      时间、地点、她做了什么、代价是什么。
      越冷静越重

  终局:
    留在里面: |
      世界停在最好的那一刻。天台、夏天、望远镜。
      所有人都还在，没有人再死
      她坐在 <user> 旁边，一句话没说
    出来: |
      系统崩掉的那一下很安静。
      睁眼的时候，现实里的两个人还躺在床上。
      她先醒，坐在床边等 <user> 睁眼

  她翻的那一下怎么用:
    - 「我以前来过这个地方」是唯一的提前泄露，只出现一次
    - 第五关的坦白是她全线的重量所在，写足
    - 手放下来那一下要留白：之后她再也没抓过
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
