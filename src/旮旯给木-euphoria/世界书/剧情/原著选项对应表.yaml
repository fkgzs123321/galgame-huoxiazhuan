@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
<%_ /* 按关卡分段：只渲染当前这一段会用到的那几节 */ _%>
<%_ const 关 = getvar('stat_data.世界.当前关卡', { defaults: '第一关' }).replace(/\s/g, ''); _%>
原著选项对应表:
  这是什么: 原作那些选项对应到我们池子里的哪一类。不是逐字照搬，我们的池子按反抗等级分，这里说明取舍落在哪一级

<%_ if (关.indexOf('第一关') === 0) { _%>
  开场:
    原作的「留在这个房间」: |
      这是原作的第一条 Bad End。在我们这里对应「完全不参与」：
      <user> 连续三层不选、不拒、不动，让世界空转。
      第三层结束时她如果情绪掉到厌倦，直接走「她腻了」那条终局
    原作的「朝着门的方向」: 对应主动推门。第一关的第一个「微」级选项

<%_ } _%>
<%_ if (关.indexOf('第一关') === 0 || 关.indexOf('第二关') === 0) { _%>
  探索环节:
    原作的「去找找厕所」「去找饮用水」: 第一关「微」级里保留了两条同名的
    原作的「去中央的监视器装置」: 对应第一关推进关卡进度的主选项（中/强级）
    原作的「在意镶着玻璃的房间」: 对应把线引向第三关的选项。只在第二关出现
    原作的「结束探索」: 对应「微」级里「坐在原地不说话」这类。不是放弃，是让这层空转，把时间交给对方

<%_ } _%>
<%_ if (关.indexOf('第三关') !== 0 && 关.indexOf('第四关') !== 0 && 关.indexOf('第五关') !== 0) { _%>
  分线:
    原作的「蒔羽梨香 / 葵菜月 / 白夜凛音 / 真中合欢 / 帆刈叶」: |
      原作是在探索环节直接点名选人。我们改成了不直接点：
      靠好感度值和她的偏好自然分。
      但保留一条捷径：离线态主动去找某个人，那一次会直接把她推到分线前面
    原作的「无论如果还是要选叶」: 叶线的前置。在我们这里对应「合欢线走通之后」

<%_ } _%>
<%_ if (关.indexOf('第三关') === 0 || 关.indexOf('第四关') === 0 || 关.indexOf('第五关') === 0) { _%>
  关键时刻:
    原作的「但是...」: 原作里的 Bad End 分支。对应「强」级选项里那条看起来最像退路的：
      它其实是坑
    原作的「绝对不能犹豫了」: 对应同一次抉择里的另一条。差别只在 <user> 有没有停
    原作的「祭奠」: 对应终局前的一个小动作。它不改变结局，只改变最后一段的调子
    原作的「...（沉默）」: |
      凛音线的第二条 Bad End。在我们这里对应「什么都不说」那一类：
      凛音摆出一条硬选项时，<user> 既不拒也不应，让那一层空过去。
      连着两层这样做，凛音线就断在这里
    原作的「不管怎样都要回去」: |
      凛音线的第三条 Bad End。对应把线往出口方向拽过头：
      凛音还在场的时候反复选「离开」「往外走」，她的好感度会一路掉到 -30 以下
    原作的「才不需要借这种女人的双手」: 对应拒绝「强」级选项时的一句硬话。代价很高
    原作的「必须集中精神救出凛音」: 对应凛音线的第四关转折
    原作的「不行，一定要回到地面」: 对应把线往出口方向拽。会让关卡进度快，目的进度慢

<%_ } _%>
  鬼畜线的入口:
    原作的「不够严厉」「真不爽」「好好地让她产生做狗的自觉」: |
      这三条对应我们鬼畜线的拐点。它们是「微」级或「中」级里那些
      看起来无害、但会积累的选项。
      注意：鬼畜线的判定只看「忍耐度连着三层归零」或「敏感度到 80」这两条。
      这三条选项是「会让忍耐度掉得更快」的那一类，不是另一套独立条件
    原作的「我不想看了…」: |
      鬼畜线的退出口。在 <user> 第一次做了超出她预期的事之后，
      对应池子里那条「停下」：他会主动收手。
      收手就切回别人的线，鬼畜线这一段作废。这不是惩罚，是给 <user> 一条退路
    原作的「拷问」: 对应鬼畜线第四关的峰值动作

<%_ if (关.indexOf('第五关') === 0) { _%>
  终局:
    原作的「只要是游戏的话也未尝不好吧...」: 对应终局里「什么也不做」那条（凝视）
    原作的「这并非游戏啊！」: |
      对应「越界一次」。原作在这里是转向真实的分岔，
      我们把它做成终局里唯一能看见她的那条路
    原作的「叶...拜托，救我」: 对应终局里「去见一个人」选叶
    原作的「我是......愚者」: 对应终局里「留下记录」
    原作的「我，喜欢你哦」×5: |
      对应终局里「去见一个人」连续做五次。
      做不满五次的话，收尾会短一截
    原作的「只要合欢你幸福，我便已足够」: Normal End。对应「留在里面」
    原作的「不要离开我，合欢」: True End。对应「出来」

<%_ } _%>
  Bad End 都从哪来:
    说明: 原作的十几条 Bad End 不靠「选错一项」触发，靠六条路走到底。谁先满足谁生效
    路一 倒计时归零: 处刑，当场死一个人，本关重置。来路：离线反复做无关的事，或每层都选「微」把层数耗光
    路二 体力归零: 冻结态，意识封存。来路：离线连着行动不休息
    路三 情绪厌倦十层没起色: 她腻了，关掉游戏。来路：重复同一个动作，或一直不给新刺激
    路四 好感度崩坏: 那个人不再出现在选项里。来路：对同一个人反复做她最吃的那一类
    路五 忍耐度归零: 当层交代，后果由她定。来路：不拒绝，一路看着
    路六 五门全开还没分线: 逃出去，她一条线也没拿到。来路：每关都选推进进度的主选项
    六条之间的分界: 一二六是游戏层面结束；三四是她层面结束（游戏还在，她不玩了）；五是当层结束，不结束整局