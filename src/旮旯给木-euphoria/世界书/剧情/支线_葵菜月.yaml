@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>
葵菜月线:
  这条线讲什么: |
    一个习惯了把所有事都扛下来的人，在一个扛不下来的地方。
    她不是在救谁，她是在还一笔自己给自己开的账。
  调子: 前面稳，中间裂，最后碎得很轻
<%_ if (关.indexOf('第一关') === 0) { _%>
  第一关 监视器装置房:
    开场的她: 站在队伍最前面，两只手扣在一起，指节抵着指节
    她做的事:
      - 系统宣布规则之后，她数了两遍人数。声音不大，但每个人都听见了
      - 数到 <user> 的时候，她的视线在你脸上停了半秒，然后滑开
    她的台词: 「先确认人数。都还在。」
      像在教室里点名
    这一层的转机: |
      她把所有人都记进了自己的账。从这一刻起，每一个少掉的人都是她的
    场面写法: |
      写她那件套裙绷得太紧，领口第一颗扣子勒着脖子。
      她一直不脱。这件衣服是她最后的身份
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 她替 <user> 洗手上的血。温水，动作很慢，一句话没说
      - 洗完她把水关了，看了很久自己的手
    这一层的转机: |
      她开始不睡。别人休息的时候她坐着，一个人守着门口
    场面写法: |
      写她洗手的那一段。水温刚好，她的手比水热。
      洗完之后她没有擦干，就那样晾着
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 单面镜。她站在镜子前面
    她做的事:
      - 她把校服重新整理了一遍，扣子扣到最上面那颗
      - 她对着镜子里的自己说了一句「还不可以倒」
    这一层的转机: |
      她开始替所有人做决定。她会说「就这样办」，
      然后自己先去做。没有人拦得住
    场面写法: |
      镜子里的她和镜子外的她一模一样。这一层不要给她任何破绽，
      破绽留到下一层
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 没有灯的那段楼梯
    她做的事:
      - 她在黑暗里扶了一下墙。那一下没扶稳，肩膀撞到了
      - 她以为没人听见。她站直了，继续往上走
    这一层的转机: |
      她第一次露出撑不住的样子。她自己不承认，但身体已经先说了
    场面写法: |
      只写那一声闷响，和她随后立刻站直的肩。
      不要写她心里在想什么。她的心里从来不承认这件事
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 装置室。她站在控制台边上
    她做的事:
      - 她把手放在控制台上，指腹摩挲着边缘
      - 她看了很久那个装置，然后转过身面对所有人
    她的台词: 「我扛不动了。」
      五个字。说完她笑了，很难看
    峰值: |
      这句之后她对 <user> 的态度整个换。
      她不再替 <user> 做决定，也不再挡在前头。
      她开始需要人扶
    这一层之后: |
      她会问人问题。她会说「你觉得呢」。
      这是她在整条线里第一次把选择交出去
    场面写法: |
      写她说这句话之前那几秒的安静。所有人都在等她开口，
      而她这次没有马上开口

  终局:
    她倒下: |
      她在最后一段撑不住了。她坐在地上，没有再站起来。
      她不说话，但她的眼睛一直在跟着 <user> 走
    她被人接住: |
      有人把她接住了。她愣了很久，然后哭了。
      这是她整条线里唯一一次哭，而且哭得很短

  她翻的那一下怎么用:
    - 「我扛不动了」这句是全线的轴。前面所有层都在为它蓄力
    - 说完之后她的语气要变：从命令句变疑问句
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
