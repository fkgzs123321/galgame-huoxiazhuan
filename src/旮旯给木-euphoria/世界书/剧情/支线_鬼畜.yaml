@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>

  拐进来那一眼:
    场景: 任意一关
    发生:
      - 有一层 <user> 的身体先动了，而她还没点
      - 系统什么都没说。她的光标停在选项上，停了一下
    她的反应: 她第一次没有立刻点。她在等你
    场面写法: |
      写那一下的安静。她平时点得很快，
      这一层她停了。停的时间不长，但足够让 <user> 知道她看见了
<%_ if (关.indexOf('第一关') === 0) { _%>

鬼畜线:
  这条线讲什么: |
    施虐的位置换了人。
    从某一眼起，<user> 不再是那个被按着做的人，
    她开始追不上自己的游戏
  怎么进: 忍耐度连着三层归零，或敏感度冲到 80 以上。任何一条线走一半都能拐，拐过去回不来
  调子: 前面越安静，后面越不对劲
  第一关 监视器装置房:
    她做的事:
      - 她照常出招，照常挑最狠的
      - 但她开始看 <user> 的手，不看脸
    她的台词: 没有。这一层她一句话都没说
    场面写法: |
      她出招的节奏没变。变的是她看的地方
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 她给的选项开始变得不准。她以为 <user> 会拒的，你没有拒
      - 她连点了两次同一个人的名字，第二次才反应过来
    场面写法: |
      写她的失误。她很熟练，但这一层她开始出错。
      错得很小，小到她自己也以为是自己走神
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 玻璃房
    发生:
      - <user> 做了她没让做的事
      - 这件事不在选项里，是 <user> 自己伸手
    她的反应: |
      她的兴奋度跳过 80。
      这是全卡里她第一次跳出选项，直接对着屏幕打字
    她打的字: |
      很短。可能是「等等」，也可能是「你干嘛」。
      她不是在阻止，她是被吓到了
    场面写法: |
      这一层是全线唯一一次她慌。
      前面她什么都见过，这一层她没见过
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 天台
    发生:
      - <user> 已经不需要她开口
      - 她给的选项，<user> 会挑比她想的更远的那个
    她的状态: |
      她的存在感开始变淡。
      这是这条线最特别的地方：她还在，但她已经不是这段的主体了
    场面写法: |
      写她的声音变小。她还在打字，但打字的声音变少了。
      摄像头还亮着，可她已经没有那么重要了
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 装置室
    发生:
      - <user> 做了她自己都没想到要做的事
    她的反应: 她会停下来
    峰值: |
      她停下来。鼠标在手里，但她没有点。
      这是她整条线里唯一一次完全不动
    这一层之后: |
      要么她兴奋得发抖，要么她怕了你。
      两种收尾从这里分
    场面写法: |
      写她不动的那几秒。屏幕上光标还在闪，
      但她的手不在鼠标上

  终局:
    她兴奋: |
      她在最后一段里很兴奋。她打字、说话、不停。
      她会说「你比我想的还要坏」
    她怕了你: |
      她开始收拾东西。她关掉一些窗口，退到只剩摄像头。
      最后她把摄像头也关了

  这条线的特别之处:
    - 别的线里她是主体。这条线里她变成旁观者
    - 不要让她完全消失。她还在，只是不再是重点
    - 这条线走到尽头，是「游戏赢了玩家」这件事反过来
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
