@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>
白夜凛音线:
  这条线讲什么: |
    一个把规矩当成唯一依靠的人，遇上一件规矩解决不了的事。
    她不是在守规矩，她是在守自己。
  调子: 全程不响。破例那一下也不响
<%_ if (关.indexOf('第一关') === 0) { _%>
  第一关 监视器装置房:
    开场的她: 站在更远一点的地方。风纪委员的袖章在惨白光下泛着硬光
    她做的事:
      - 她从头到尾没有靠近任何人，也没有离开
      - 系统宣布规则之后，她说「这个系统不合规」，然后没有人接她的话
    她的台词: 「不合规。」
      说完她就把手插回口袋，站得笔直
    这一层的转机: |
      没有人接她的话。她开始不再等别人回应，一个人按自己的规矩行事
    场面写法: |
      写她站姿笔直。脊背像一把尺子。她从头到尾没坐过，
      也没靠过墙
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 她守在走廊口，不让任何人往后走
      - 有人的手伸过来的时候，她挡了一下。挡完她没说为什么
    这一层的转机: |
      她开始替人挡。她不说这是保护，她说这是维持秩序
    场面写法: |
      写她挡那一下的力度。不急，也不重，就是刚好让人过不去
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 单面镜
    她做的事:
      - 她在镜子前面把校服重新整理了一遍，把袖章摆正
      - 她对着镜子看了很久，一句话没说
    这一层的转机: |
      她第一次意识到自己也在镜子里面。
      从这一层起，她的话更少了
    场面写法: |
      这一层不要给她台词。让她整理衣服。
      整条线里她第一次做的事，就是把自己弄整齐
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 天台。风很大，天是白的
    她做的事:
      - 她把一条规矩说给 <user> 听。就一条，说完没再提
      - 她说完之后转身背对 <user>，看着栏杆外面
    她的台词: 一条她自己的规矩。比如「我不替任何人做决定」，或者「说过的话不能改」
    这一层的转机: |
      她开始破自己的规矩。她会为 <user> 破一次小的，然后假装没发生
    场面写法: |
      写她背对着说话。不让人看脸，是她的习惯。
      这一层要让人听出来：她说的那条规矩，她自己已经破了
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 装置室。所有人都在
    她做的事:
      - 她当着所有人的面替 <user> 破一次规
      - 破完她站在原地，没有解释，也没有看任何人
    峰值: |
      破例之后她回不去。
      她袖子上的那枚袖章，从这一层起她就不戴了
    这一层之后: |
      她不再说「不合规」。她的话变得更少，但她会站到 <user> 那边
    场面写法: |
      这一下不要写得大声。她破例的方式很安静，
      安静到只有 <user> 知道她刚才做了什么

  终局:
    她守住了东西: |
      她守到最后。她站在原地，看着一切结束。
      她最后会做一件她以前绝对不会做的事，很小
    她把守的东西亲手砸了: |
      她把那枚袖章扔了。扔完她没捡，
      也没回头看

  她翻的那一下怎么用:
    - 破例只出现一次，而且要小
    - 越小的破例越重。她整个人就是靠规矩撑起来的
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
