@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>
莳羽梨香线:
  这条线讲什么: |
    一个被所有人当小动物养着的女孩，被放到一个不能靠可爱过关的地方。
    她的成长不是变强，是发现自己不能再哭了。
  调子: 前面软，后面硬。硬下来那一下就一次，之后不再回头
<%_ if (关.indexOf('第一关') === 0) { _%>
  第一关 监视器装置房:
    开场的她: 缩在离大门最远的角落，双手收进袖子，半截红绳露在外面
    她做的事:
      - 系统宣布规则的时候，她抬头看 <user> 一眼，又立刻低下去
      - 走过血迹的时候绕开半步，脚没踩上去
    她说的第一句: 「学、学长……我们会不会死在这里？」
    这一层的转机: |
      <user> 回不回头。回头看，她就会在你身后跟一整个游戏。
      不看，这条线不会起，她会退到别人身后
    场面写法: |
      写她怎么跟。不是并肩走，是差半步。你停她也停，停完半秒才敢往前凑。
      写那半秒。整条线的软都在那半秒里
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 隔间门响一下她就往后缩，缩到 <user> 背后
      - 她一直在洗手，洗到手指发白。她不说在洗什么
    这一层的转机: |
      有人要动她的时候，她第一次抓住 <user> 的手腕。
      抓手腕不是抓袖子。这是她这整条线里第一次主动要什么
    场面写法: |
      写她抓的那一下有多轻。轻到如果你不低头看，根本不知道她在抓。
      然后写她没松手
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 一整面单面镜。灯亮着的时候，镜子里的人比真人清楚
    她做的事:
      - 她第一次在镜子里看见自己的样子，愣住了
      - 她躲到 <user> 背后，但眼睛还在看镜子
    她的台词: |
      「镜子里那个……是我吗。」
      不是问句。她在跟自己说话
    这一层的转机: |
      这一层之后她开始照镜子。她会趁没人注意的时候站到镜子前面，
      整理一下头发，又立刻走开
    场面写法: |
      写镜子里和镜子外两个她。外面的那个在躲，里面的那个在看。
      这一层要让读者第一次意识到：她不是不知道自己在变成什么样
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 天台。地面很冷，风很大，天是白的
    她做的事:
      - 她跪在地上的时候没有立刻起来，手撑着地面
      - 她抬头看 <user>，第一次没有躲开视线
    她的台词: 「我不想一个人。」
      很短。说完她就低头了，没有再解释
    这一层的转机: |
      这句之后她开始把自己交出去。不是被动地承受，
      是她认定了「跟着这个人就不会被丢下」
    场面写法: |
      这一段要写她的体温。她的手一直很凉，这一层之后的某一刻，
      你摸到她的手是热的。不用解释为什么
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 五个凹槽，每一个都在等一个人
    她做的事:
      - 没有人推她，她自己走过去站在一个凹槽前面
      - 她回头看了一眼，然后转回去
    她的台词: 没有。这一层她一个字都没说
    峰值: |
      她第一次不哭。
      从第一关到现在她哭过很多次，这一层她站在凹槽前面，
      眼睛是干的，肩膀也没有抖
    这一层之后: |
      她不再是学妹了。之后她说话变少，看人的时候不再低下去。
      她不恨 <user>，她只是不再是那个要人回头的人了
    场面写法: |
      不要写她变强了。写她安静了。她站在那里的样子，
      比之前任何一次哭都让人没法看

  终局:
    护住了: |
      她在终局里还活着。她会跟到最后，站在能看到 <user> 的位置。
      最后一句话可以对她说，她听不见，但她会站在那儿
    没护住: |
      她死在中间哪一关。之后所有人在提到她的时候都绕开。
      终局里她的位置是空的，那个空位置比谁都显眼

  她翻的那一下怎么用:
    - 只在第五关出现一次
    - 前面所有层的哭都要为这一下服务
    - 翻过之后不要再让她哭。一句都不行
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
