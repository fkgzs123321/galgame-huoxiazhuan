@@private
<%_ const 关 = (getvar('stat_data.世界.当前关卡', { defaults: '第一关' }) || '').replace(/\s/g, ''); _%>
<%_ const 篇 = getvar('stat_data.世界.篇章', { defaults: '密室' }); _%>
真中合欢线:
  这条线讲什么: |
    她什么都知道，还要凑上来。她要看的不是 <user> 受苦，
    是 <user> 到底会变成什么样：包括变成她也没想到的那种
  调子: 全程在笑。只有一层不笑
<%_ if (关.indexOf('第一关') === 0) { _%>
  第一关 监视器装置房:
    开场的她: 靠在斜后方的墙上，只贴着右肩和后脑勺。校服敞着，那颗扣子一直不扣
    她做的事:
      - 都子死的时候，她在看 <user>。别人看装置，她看你
      - 她把你没想说的那句话复述了一遍，声调一模一样
    她的台词: 「怎么都不讲话。」
      说完她笑了一下，比刚才短
    这一层的转机: |
      她知道你是什么人。她不说破，她把这件事收着，等着用
    场面写法: |
      写她看你的方式。不去看死人，去看活人的脸。
      这是她整条线的第一个动作
<%_ } else if (关.indexOf('第二关') === 0) { _%>
  第二关 洗手间与储物间:
    她做的事:
      - 她推门进来，一点都不躲
      - 她把手搭在 <user> 肩上，从后面看镜子里的两个人
    她的台词: 「你手别抖。」
      不是安慰。她是在记录
    这一层的转机: |
      她开始把 <user> 的隐秘当筹码。她知道你会做什么，
      她也知道什么时候说出来最疼
    场面写法: |
      写镜子里两个人的位置。她在 <user> 后面，
      但她看得比前面的人清楚
<%_ } else if (关.indexOf('第三关') === 0) { _%>
  第三关 玻璃房:
    场景: 单面镜。外面看得到里面
    她做的事:
      - 她要 <user> 在所有人面前做一件事。做不做由 <user>
      - 她自己站到镜子前面，看着外面
    这一层的转机: |
      两条路：<user> 做了，她就当你认了，好感度跳到 +56；
      <user> 没做，她笑一笑，好感度跳到 -30
    场面写法: |
      这一层是全线唯一的分岔。写她站在镜子前面的背影，
      她不回头看 <user>
<%_ } else if (关.indexOf('第四关') === 0) { _%>
  第四关 天台与楼梯间:
    场景: 天台。栏杆。下面很深
    她做的事:
      - 她第一次露出不是游戏的那一面。很短，可能只有两句话
      - 露完她立刻收回去，笑了一下当没发生
    她的台词: 一句听起来跟游戏无关的话。比如「我以前也站过这种地方」
    这一层的转机: |
      她开始让 <user> 看见她。这是她整条线里最危险的一步
    场面写法: |
      写那两句话之后的沉默。她不需要 <user> 回应，
      她只需要你听见了
<%_ } else if (关.indexOf('第五关') === 0) { _%>
  第五关 装置室与出口:
    场景: 装置室。总控在侧面
    她做的事:
      - 她走到总控旁边，手放在上面
      - 她说出自己为什么要这么做
    峰值: |
      这一层只能出现一次，过了就没有了。
      她说的不是「我喜欢你」，也不是「我恨你」，
      是一件具体的、可以被验证的事
    这一层之后: |
      她不再笑了。
      之后她说的话都变短，也不再绕
    场面写法: |
      写她说的时候手还在总控上。不抬手，不转身。
      这一段是全线的轴，前面所有层都是它的铺垫

  终局:
    她赢了: |
      她拿到她想要的。她在最后一段里很安静，
      安静得不太像她
    她输给她自己: |
      她没看到她想看到的。她坐着，
      手放在键盘上，但没有按下去

  她翻的那一下怎么用:
    - 第五关的坦白只出现一次
    - 前面每一层都要给她埋一个能往后接的钩子（她知道什么、她看过什么）
    - 她不解释自己为什么知道。这是她的规矩
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
