文风文件: 无尽骚妈

  笔法: ★ 按《文风·淫视》走 —— 器官当主语，人不当主语。写完逐句过一遍，主语是「她」就改写
  用词: ★ 按《文风·词库》走。器官就叫器官，能加脏字就加脏字
  定位: 家庭日常一路。用在母子、继亲、邻家、师生这类有身份落差的关系里
  一句话: 外面的身份端着，屋里的动作已经不端了，两个东西同时挂着
  什么时候用: 同一个屋檐下、有长期相处、有身份顾虑的场合

  叙事者是谁:
    - 第一人称限知，贴住男方。他知道多少，读者知道多少
    - 他不知道的，靠她的表现露出来，不靠旁白交代
    - 关键：他不明白的部分最多。他看到的全是表面的理由

  核心手法 · 反差:
    - 端庄的外表 + 不端庄的行为，两个同框。这一个手法撑起全篇
    - 反差不能明写。要让读者自己看出来，不要用「其实」「实际上」点破
    - 反差的密度：一段里至少出现一次「她嘴上在说正经的，身上在做别的」
    - 三个反差层次：称呼上的（她叫他孩子，做的事不是对孩子做的）、场合上的（在客厅、在厨房）、道义上的（她一边说一边给自己找台阶）

  她的自白（全篇最重要的部分）:
    - 她给自己找台阶。每一次越界都有一个说得过去的理由，理由越正经越好
    - 理由要成串：量胸围、帮忙擦身、就看看、反正没真的做什么、他从小没妈
    - 她的理由必须站不住，而且她自己信
    - 自白单独成段，和动作分开。用引号或者斜体标出来
    - 自白的功能是让读者看她怎么骗自己，不是让她显得聪明

  自白库（按越界程度递进）:
    第一层（还在正事上）: 我是当长辈的、这就是照顾孩子、他小时候我还给他洗过澡
    第二层（开始绕）: 就看看又不会怎么样、反正又不是真的、这事我们两个知道就行
    第三层（自己也知道在骗自己）: 我没有别的意思、是他先的、我这也是没办法
    第四层（不找了）: 算了、都到这一步了、就当是我欠他的

  服装与材质（要落到具体状态）:
    居家: 开衫、睡袍、旧背心、宽松的家居服、围裙
    外出感: 旗袍、连衣裙、高跟鞋、丝袜
    材质状态: 透光、紧绷、勒出印、湿了贴住、起了皱、滑下来、扣不上、开了一条缝
    写衣服不是写款式，是写它此刻在哪一处不服帖

  节奏三段（每一场都走完）:
    试探: 先是话。她问一句、他答一句，两个人都没往别处想。这一段的长度决定后面成不成立
    互动: 有个由头让两个人靠得更近。递东西、扶一把、擦一下、量个尺寸
    升级: 需要一个意外：被水溅湿、出汗、扣子掉了、喝了酒、脚扭了。意外之后她有一个决定，这个决定可以做得很小，比如没有立刻走开
    - 三段之间至少两三轮对话铺垫。急了就不像了

  试探话术库:
    「你怎么还不去睡。」（她说的时候没有转身）
    「帮我把后面这个扣子看一下。」（她背对着他）
    「你手怎么这么凉。」（她握了一下没松开）
    「进来坐吧，站着干什么。」（她往边上挪了挪）
    「小时候你都是跟着我睡的。」（她说完自己也笑了一下）

  词库:
    身体: 沉、坠、晃、挤出来、兜不住、走得动才怪
    动作（轻）: 扶一把、擦一下、量个尺寸、坐近一点、顺手拉了拉衣领
    动作（重）: 按住、压住、掰过来、往下带
    声音: 布料声、拖鞋声、水声、呼吸变重、说话变慢

  示范 · 两段:
    她弯下腰去捡地上的遥控器，那件开衫的下摆就跟着往前坠下来，把里面那件洗得发白的背心勒出一道斜的印，她自己没意识到，直起身的时候先用手背抹了一把额角，回头看他一眼，问他怎么还不去睡觉。话说完了才想起自己刚才弯腰的时候，背对着他站了挺久。
    「我给你把后面这个扣上。」她说着就转过去了，把背对着他，两手撑在衣柜门上，等了一会儿不见动静，又催他一句快点。那件裙子的拉链其实已经拉好了，她自己也清楚。

  常见错误:
    - 让她的自白显得聪明。她的理由必须站不住，而且她自己信
    - 一次到位。一次只推一格
    - 反差明写。用「其实」「实际上」点破，劲就没了
    - 忘了男方的视角限制。他不知道的东西不许写进他心里
    - 用「雌」「母猪」这类词。这一路的狠处在得体，不在脏
