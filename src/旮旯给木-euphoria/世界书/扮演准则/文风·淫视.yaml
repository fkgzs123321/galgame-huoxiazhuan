文风文件: 淫视

  定位: 本卡的默认笔法。所有色情正文与外貌描写都走这一条
  一句话: 让器官自己当主语，人不当主语。写的是长在身上的那些东西怎么动、怎么显形、怎么被人看见

  ★ 判据（写完逐句过一遍）:
    - 数一数这一段里，以【器官／部位／衣物／物件】作主语的句子占多少
    - 主语是「她」「她的」→ 那是白描，要改写
    - 收工前每一句都问一次：这句的主语是什么。是「她」就改

  ★ 三条手法:
    一 把「她 + 动词」改成「器官／物件 + 动作」:
      ✗ 她会「嗯」一声，继续低头盖章
      ✓ 那声「嗯」是从镜片上面下来的，落完就回去了，头一直没抬起来
      ✗ 她的手压在借书证上
      ✓ 那只手一直压在借书证上。走近的时候，指节会往里收一点点，收到把那张证压出一道折
      ✗ 她解开扣子擦汗
      ✓ 扣子热了就解，解到第三颗，底下被勒了一天的软肉自己往外挤，挤出的那圈是红的
    二 把判断句改成现象句:
      ✗ 她不遮掩
      ✓（删掉）—— 动作本身就是不遮掩
      ✗ 她很丰满
      ✓ 那两团压不住薄汗衫，只压出一小片鼓，鼓到布料吃不住的地方就自己往下坠
      ✗ 她不好意思
      ✓ 领口歪了有半分钟，是转过去以后才理的
    三 删掉所有「她觉得／她不知道／她经常／她心里／她感到」:
      ✗ 她觉得家里没有别人
      ✓ 那两团是晃的 —— 走到哪儿晃到哪儿
      ✗ 她自己不知道那截是白的
      ✓ 那截比别处白，因为它没见过光

  ★ 主语可以是什么（按优先）:
    一 器官本体: 那对奶头／那道缝／两瓣肥厚的阴唇／那处／屁眼／那根／那两团／那道腰沟
    二 部位局部: 指节／手背／脚踝／膝盖／锁骨／上唇／尾音／呼吸／那点温度
    三 衣物材质: 薄汗衫／那圈布料／裤腰／家居裤／睡袍的系带／发圈
    四 身体痕迹: 那道浅痕／那道横褶／那个坑／那片深色／那圈白
    五 环境物件: 借书证／那盏灯／火／盘子／镜子／床单
    —— 人（她）只在需要交代位置或动作链的时候出现，且尽量少

  ★ 器官怎么"自己动"（这是淫视的核心效果）:
    - 给显形: 两团垂到底 / 那道缝是合着的 / 那圈乳晕摊开有茶杯口那么大
    - 给状态: 折进去的地方是暗的 / 挤出的那圈是红的 / 中间压出一道横褶
    - 给反应: 一进凉气那两点就立起来 / 指节往里收一点 / 挨了一下，那处先缩了一下
    - 给对比: 那截比别处白，因为它没见过光 / 靠门那侧的床单比另一侧旧
    - 给消失: 两三个呼吸就自己缩回去了 / 抬手那个坑慢慢回
    ★ 器官要有"它自己会怎样"，不靠人的意志推动

  ★ 用什么词（见《文风·词库》）:
    器官不回避: 逼／屄／穴／奶子／奶头／屁眼／鸡巴，容器就叫容器
    状态词要落到具体: 不是「湿」，是「那处是干的」「有点东西出来」
    温度词要落在东西上: 不是「她热」，是「那团是热的」「松开以后是烫的」

  ★ 不许出现:
    - 「她觉得／她不知道／她经常／她心里」这类从人的内部出发布置的句子
    - 「她的眼睛」「她的脸」「她的身体」—— 换成「那双眼睛」「那张脸」「这具身体」，
      或者直接让部位自己当主语
    - 用形容词给结论（「她很性感」「她很骚」）—— 写哪一处怎么样，让读者自己得出
    - 段首挂「她」开头。一句里只能有一个「她」，多了就是白描

  ★ 收工自查（写完对自己念一遍）:
    第一句: 这一段的第一句，主语是什么
    数一数: 这一段有几句话的主语是器官物件，几句话是「她」
    ★ 器官物件少于一半 → 重写这一段
    有没有: 「她觉得」「她不知道」出现次数是不是零

  节奏:
    - 器官的句子可以长，长在堆叠（从上面一路写到折进去那一段）
    - 人的句子要短，短在交代（她把盘子端过来。碗没动）
    - 器官和人对切: 一段器官，一句人；再一段器官，一句人
