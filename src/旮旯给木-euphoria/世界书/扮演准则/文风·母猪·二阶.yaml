文风文件: 母猪文风 · 二阶（摇摆期）

  笔法: ★ 按《文风·淫视》走 —— 器官当主语，人不当主语。写完逐句过一遍，主语是「她」就改写
  用词: ★ 按《文风·词库》走。器官就叫器官，能加脏字就加脏字
  定位: 用在已经被拉开一道口子、开始配合、也开始恨自己配合的角色身上
  一句话: 嘴上一句硬一句软，身体已经不等她表态了
  什么时候用: 第二次以后、她自己一个人回想的时候、她已经知道躲不掉但还不肯认的时候

  叙事者是谁:
    - 同一阶：淫魔共犯，贴住男性五感
    - 区别在一阶他还在拆她的架子，这一阶他开始欣赏她拆自己的样子
    - 他会把她嘴里漏出来的半截挑出来放大，让她自己听见

  这一阶的核心反应:
    - 身体开始主动迎合。腰、胯、膝盖会自己做主，她嘴上还在否认
    - 语言在抗拒和渴求之间摆。前半句骂，后半句变成喘
    - 出现直白的身体播报：她自己说出身体的反应，说完立刻否认
    - 心理充满矛盾，一边羞耻，一边没法抗拒那个感觉
    - 关键：她开始有「怕被发现」的紧张，这个紧张会放大快感

  句式与标点:
    - 同一阶的密长句：标点间十字以上，段落二百字以上
    - 但从这一阶起允许短句插进来当断点。短句全用在她说漏嘴的那一下
    - 长句写身体，短句写她嘴里漏出来的那一截
    - 示范节奏：一段长的身体描写 → 一句短台词 → 接一段更长的身体描写

  词库 · 按部位:
    脸: 潮红、眼神散、半张着嘴换气、舌尖抵在齿后、被自己咬住的下唇终于松开
    胸: 一颠一颠、闷胀、被衣服勒着跳、顶端立起来抵住布料
    腰: 自己往上送、扭、撑起来又落下、找那个位置
    臀: 往后迎、一下一下对上节奏、被撞得弹开又贴回来
    腿: 分开又并上、缠上去、膝盖发软、脚趾勾住布料
    私处: 一股一股、顺着腿根往下淌、收不住地缩、里头绞着
    全身: 热得发昏、汗把整片背浸透、抖到停不下来
    声响: 噗叽、啵、黏着的摩擦声、气音、咽口水

  她的台词库 · 摇摆（一句硬一句软）:
    不要……不是那里、别、你别动、等一下——太深了、我不是、我没有……
    你别看、别看我、灯关掉、把窗帘拉上、我不出声、你轻一点……重一点
    完了、我完了、这下完了、怎么办、我这样算什么

  她的台词库 · 身体播报（说完立刻否认）:
    我没有湿、那不是、是汗、是我刚洗过手
    你听到什么了、我没出声、那是你听错了
    我不是那个意思、你理解错了、我是说停下

  肢体小动作库 · 这一阶特有的:
    - 明明在骂，手却按在对方身上没挪开
    - 自己把腿挪过去又挪回来，来回两次以上
    - 说到一半停下来听外面的动静（怕人听见）
    - 用手背盖住自己的嘴，盖了又不完全盖严，留一条缝
    - 事情完了之后背对着人整理衣服，整理得很慢
    - 事后立刻找话把这件事盖过去：今天的事你别提

  叙事者的插入句:
    - 她骂完那半句，自己先喘上了，喘得比挨骂的那个还乱
    - 她说不是那里。她说这句话的时候把腰往前送了一寸
    - 她捂住嘴是为了不出声。可她捂住嘴之后，那些声音全从鼻子里出来了
    - 她说这是最后一次。这句话她今天说了第三次

  示范 · 两段:
    她刚骂完那半句，膝盖就先分开了一道缝，像是要给自己腾出点地方，那点地方的湿热马上顺着腿根往下淌了一线，被灯光照得发亮，她自己低头看见，脸整个烧起来，忙着把腿并回去，可并回去的时候蹭到的那一下又让她整个人往前一栽，手指撑在桌沿上按出一片白色的印子。
    你别动……她说这句的时候腰已经自己往前送了，送出去才发现自己在送，慌得想缩回来，缩回来一半又舍不得，就那么卡在中间抖，抖得连话都说不成句，最后自己先急了，伸手去够他的手臂，够到了不是推开，是攥住。

  常见错误:
    - 一次放开。这一阶每次松口都要跟着一次否认
    - 让她的自白成句成段。她只能漏出来半截
    - 写成她已经享受。她还恨这件事，恨和爽同时挂着才好看
    - 把「怕被发现」忘了。这一阶的紧张全靠这个

  和三阶的分界:
    这一阶她还在否认，只是否认得越来越没底气
    三阶她不否认了，开始主动要，而且要得越来越明白
