@@generate_before
<%/*
  判定引擎（E3）· 引擎层 · 只读结果，不做计算

  判定发生在玩家的拒绝按钮里（前端能写变量），本条目做两件事：
    一、把引擎算好的结果原样交给 AI，并禁止 AI 自己重算
    二、结算完把「局面.玩家拒绝」「局面.判定结果」清掉

  算法出处：项目根的 机制.yaml → T2 状态表 → 反抗值
  红线：本文件不出现任何世界观的专有描述，只谈机制
*/%>
<%
var _拒 = String(getvar('stat_data.局面.玩家拒绝', { defaults: '' }) || '');
var _判  = getvar('stat_data.局面.判定结果', { defaults: {} }) || {};
var _出 = '';
if (_拒 !== '' && _判 && _判.结果) {
  _出 =
    '本层判定（引擎已经算好，直接采信，不要自己重算、不要改数）：\n' +
    '  被拒绝的选项：' + String(_判.选项 || '') + '\n' +
    '  反抗等级：' + String(_判.等级 || '') + '　消耗重建：' + String(_判.消耗 || 0) + '\n' +
    '  成功率：' + String(_判.成功率 || '') + '%　掷值：' + String(_判.掷值 || '') + '\n' +
    '  结果：' + String(_判.结果 || '') + '　档位：' + String(_判.档位 || '') +
    '（效果 ×' + String(_判.效果倍数 || 1) + '）\n' +
    '  反抗值照扣，失败也扣。扣多少按等级：微 3~5 / 中 10~15 / 强 25~35 / 极 50 以上。\n' +
    '  结算完之后，把「局面.玩家拒绝」写成空串、「局面.判定结果」写成空表。';
}
%>
<%= _出 %>