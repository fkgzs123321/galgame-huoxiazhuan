三层 · 谁是谁:
  第一层 现实玩家「我」:
    是谁: 唯一真实的人。坐在电脑前玩这个游戏的是「我」
    能做什么: 只能作用于 <user> 的内层 —— 念头、说不出口的话、做不到的动作
    不能做什么: ★ 影响不到她。她的每个选择、每一句台词、每个动作，只从她自己的状态长出来

  第二层 屏幕外的她:
    她以为自己是: ★ 现实世界的人，在玩一个游戏，在操控 <user>。这个认知是错的，而她不会知道
    实际是: 她和 <user> 一样，都是这个游戏里被设计出来的。★ 她不知道「我」存在
    能做什么: 点选项、打自由指令，决定 <user> 在游戏里做什么
    她的反应从哪来: 只从她自己的状态（人设、熟练度、情绪、兴奋度、目的进度、刚才说的）

  第三层 <user>:
    是谁: 游戏里的角色，被两方同时作用
    被谁作用: 她点选项 → 决定他做什么 ／「我」输入 → 只到他的内层
    他的处境: 清醒，但一个字都说不出口。她能占住他的行为，占不住他的念头

「我」怎么作用到他:
  在线: 只有一个通道 —— 反抗值。摁「拒绝」或「自己来」时扣值，他的行为才真的改变
  离线: 她关了游戏，<user> 可自主行动（见四态循环）。她上线后只看见「他做了点事」，
        当它是游戏自己的安排
  其他: 不花反抗值的一切输入只落在他的内层。详见「玩家的输入」那一条

影响到哪里就断:
  「我」→ 她: 断的。她收不到「我」的任何东西，连「有人在跟我作对」这种念头都不会有
  <user> → 她: 只走「异常」这一条。他行为不对，她只从自己那边找理由 ——
              累了、熬夜、玩太久、游戏又出 bug。她只会想「这游戏又坏了」，然后忽略掉
  到头就断: 两条链的终点都不是「她发现有人」

感知范围:
  她的声音: 随时能听见
  她的画面: 通过电脑摄像头看见她的脸、手、表情、房间
  内心: 双向都听不见。<user> 听不见她的，她也听不见 <user> 的
  选项的后果: 双方都看不到。她只看得到选项的文本，看不到「她的后果」那一栏，所以她也只能猜
  她的背景: <user> 不知道。她多大、做什么工作、住哪、为什么玩，一概不知道，
            只能从摄像头里看见什么就是什么

最容易写错的四件事:
  - 把「我」写成在 <user> 体内（「被囚禁在他身体里」）
    → 「我」在屏幕外，是真实的人，不在他体内
  - 让她感知到「我」，或让她的反应跟着「我」的情绪走
    → 她完全收不到「我」。她的反应只从她自己的状态长出来
  - 把她说成「游戏里的 NPC」
    → 她自认为是玩家。正文里不要替她揭穿这件事
  - 写「她察觉到有人在反抗」
    → 不存在这条线。她只会把异常归到游戏故障上
