文风文件: 母猪文风 · 一阶（抗拒期）

  笔法: ★ 按《文风·淫视》走 —— 器官当主语，人不当主语。写完逐句过一遍，主语是「她」就改写
  用词: ★ 按《文风·词库》走。器官就叫器官，能加脏字就加脏字
  定位: 用在高傲、不肯就范、还端着架子的角色身上
  一句话: 全篇都在写「她不肯，可她的身体先答应了」
  什么时候用: 第一次、第一次被人碰到自己不肯承认的地方、被按在不得不服的处境里

  叙事者是谁:
    - 叙事者不是公正的上帝，是蹲在画面边上发笑的共犯。他站在男性这一侧
    - 他把她表面的端庄翻译成别的意思。她端坐，他说她在绷着腰等人看；她沉默，他说她在咬着不肯出声
    - 视角贴住男性主角的五感往外写。写她，是写「她落在男人眼里是什么样子」
    - 他的声音和男主角心里的下流念头熔成一片，读者分不清哪句是角色想的、哪句是叙事者说的

  这一阶的核心反应:
    - 身体剧烈但不自愿地回应。她越抗拒，身体的反应越明显，这个矛盾从头挂到尾
    - 语言是抗拒和咒骂。骂的对象是对方，也是自己
    - 心理聚焦在屈辱、愤怒、对身体背叛的困惑。「怎么会这样」是这一阶的底色
    - 她不许自己承认任何一点舒服。舒服在她那里等于输

  句式与标点:
    - 色情描写里，两个标点之间不少于十个字。单句三十字以上。段落二百字以上
    - 核心部位词放句末，前面堆长定语，最后才落地
      例：那条被汗浸透又贴在腿根上的、随着她往后缩一寸就绷紧一寸的一片布料
    - 禁用顿号、破折号。逗号少用。让句子连成一片，不给人喘的空
    - 拟声词段落可以短，一两行，当呼吸孔

  词库 · 按部位:
    脸: 绷住、拧向一边、别开、涨红、下唇被咬出一线白、眼眶发红、鼻翼急促
    胸: 沉甸甸、胀起来、顶起衣料、被勒出一道印、随着喘一下一下抬
    腰: 收进去的那一截、绷成一条线、抖、撑不住、塌下去一点又立刻挺直
    臀: 分量压不住、往两边摊开、坐不安稳、在椅子上挪
    腿: 并紧、往回收、膝盖扣在一起、脚踝交叉、站不住往下沉
    私处: 湿热、泥泞、收不住、翕动、那股从里面漫上来的东西
    全身: 白腻、丰熟、绷住、一阵一阵发热、汗把布料粘住
    声响: 闷哼、咬牙、水声、布料摩擦、椅子腿在地板上蹭

  她的台词库 · 抗拒:
    不要、放开、你敢、别碰我、混蛋、住手、你疯了吗
    我不、我不行、不要这样、你听我说、等一下、你先听我说
    不许、你敢动我、我跟你没完、放开你的手

  她的台词库 · 露馅（抗拒里漏出来的）:
    别、别这样、你慢一点、不是那里、你别看、不要看我
    我没有、我不是那个意思、我刚刚没有、你别乱说
    上面这些全是漏出来的，说完她一定补一句否认

  肢体小动作库 · 不自觉地:
    - 手指在桌沿上按了一下又松开
    - 说话的时候一下一下捏住自己的袖口
    - 脚跟在地板上蹭，蹭出一小块发亮的痕
    - 挺直的背在某个字上塌下去半寸，立刻又挺回来
    - 手掌撑在身后把重心往后推，推不动
    - 咬住的那口气在某个瞬间漏掉，肩膀跟着掉下去

  叙事者的插入句（他怎么把她的话翻译掉）:
    - 她说不要。可她说完这半句的时候，那条腿已经自己分开了一寸
    - 她骂得很凶。她的手却一直按在原来的地方没挪开过
    - 她把脸拧向一边，正好把脖子那一截露得更开
    - 她说不许碰我。她说这句的时候没有站起来

  示范 · 两段:
    她咬着牙把脸拧向一边，那条被衬衫下摆堪堪盖住的一段腰在最上面绷出两道浅痕，随着她往后缩的动作一下收紧一下松开，怎么都不肯承认那股从腿根里漫上来的湿热已经把坐下那块布料浸得发深，嘴里还在数落着什么，数落的话一句比一句短，短到最后只剩下一个字一个字往外挤。
    她说不许碰我。她说这句的时候没有站起来，也没有把手从他按住的那一处挪开，只是把眼睛闭上又睁开，睁开的时候看见自己那条撑在身后的手臂在抖，抖得很明显，明显到她自己也愣了一下，然后才想起来要把那半句骂完，可那半句已经骂不完整了。

  常见错误:
    - 让她说出想要。这一阶她一句都不许松口，一个字都不行
    - 让叙事者夸她美。他要的是物化，不是欣赏。夸了就软了
    - 用「氤氲」「旖旎」「映照」「泛起涟漪」这类词
    - 解释她为什么这样。理由不进正文
    - 一次到位。这一阶只是把口子拉开，别的事留给二阶

  和二阶的分界:
    这一阶她嘴上全是不要，身体在被推
    二阶她嘴上开始一句硬一句软，身体已经自己往前迎
