文风文件: 少妇白洁

  笔法: ★ 按《文风·淫视》走 —— 器官当主语，人不当主语。写完逐句过一遍，主语是「她」就改写
  用词: ★ 按《文风·词库》走。器官就叫器官，能加脏字就加脏字
  定位: 现实主义一路。用在小城、单位、家属院、熟人社会这种环境里
  一句话: 不夸张、不叫喊，全用日常的细节把事一步步推过去，脏都脏在底下
  什么时候用: 有外人、有身份顾虑、有家庭牵扯的场合。越是不该出事的地方越合适

  ⚠ 出处声明: 本文件按对同名作品的了解写，没有原文参考。若有原文，拿我校准

  叙事者是谁:
    - 第三人称，贴着女主的视角走，但不说破她心里最底的那一层
    - 叙事者不评判。他像邻居一样看着，看着看着把话说完，就走了
    - 不做男性凝视的物化扫描。这一路的劲在「憋着」，不在直给
    - 他不笑她，也不替她害臊。这个中性正是它的狠处

  文风特征:
    - 现实主义的白描。先把生活写实：单位、家属楼、楼道里的煤炉、洗脸盆、晾在绳上的衣服
    - 时间线清楚，一天一天走。堕落是慢的，一次只推一点点
    - 心理细。她想到什么、又怎么把那念头按下去，都写
    - 口语化的对话。短，家常，话里有话
    - 环境写实：北方的冷、暖气、单位澡堂、小卖部、自行车棚
    - 转折都披着合理的壳：「帮忙」「送东西」「顺手」「你爱人不在家吧」
    - 关键手法：每一件越界的事，都有一件完全说得通的日常事垫在下面

  句式与标点:
    - 中短句为主，节奏跟日常说话的呼吸一致
    - 长句留给心理那一段：一个念头缠着一个念头，越缠越乱
    - 标点正常用。逗号句号顿号都可以。这一路不追求窒息感
    - 不用象声词堆。要用就一处，用得很轻
    - 情欲描写用克制的写法：写她脸热、手心出汗、说话比平时慢了半句，比写器官有用
    - 最狠的写法是把话停在最要紧的地方，不往下写

  环境素材库:
    楼道: 声控灯、堆在门口的煤、自行车靠在墙上、谁家炒菜的味儿
    屋里: 单人床、旧沙发、罩着布套的电视、玻璃柜、墙上挂的相片
    生活物件: 暖水瓶、洗脸盆、晾衣绳、蜂窝煤、铝饭盒、搪瓷缸
    单位: 办公室、值班室、仓库、传达室、小卖部、锅炉房
    声音: 楼道里的脚步、隔壁的收音机、水房的哗哗声、半夜的自行车铃
    天气: 干冷、结霜的窗、进屋要先跺脚、手指冻得不听使唤

  词库:
    身体: 脸红、心跳、手抖、出汗、发烧一样、腿软、耳朵尖发烫
    心理: 不该、怎么会这样、算了不想了、明天再说、就当没发生、以后不这样了
    对话: 那怎么行、你放那儿吧、别让人看见、回头再说、我家那口子、你别多想
    越界（轻）: 顺手碰了一下、没躲开、也没说什么、就这么过去了
    事后: 把衣服拉平、对着镜子看很久、洗了很久的手

  渐进节奏表（一次只推一格，推三四回）:
    第一回 · 找由头: 他来了，有个说得过去的理由。她让他进屋，倒水，说话，什么都没发生
    第二回 · 碰一下: 递东西的时候手碰到手，或者她弯腰他在旁边。她躲了，但没说
    第三回 · 不躲了: 又碰的时候她没躲，也没说什么。事后她自己想了一晚上
    第四回 · 她自己开门: 这次的理由是她给的。她也知道这理由站不住
    每一回之间要隔开。中间夹一段日常，越平常越好，反差才出得来

  对话库 · 话里有话:
    「你爱人不在家？」（他不是问这个）
    「坐下歇会儿吧。」（她说完就后悔了）
    「那天的事……」她没往下说。他也没接
    「以后别这样了。」她说的是以后，不是这次
    「你走吧。」她说完这句，门没有关

  心理描写模板:
    - 先用一个具体的事起头：「她想起刚才关门的时候，手在门把上停了一下」
    - 再写念头怎么来的，来的同时她怎么把它推走
    - 推走之后那个念头会回来，回来的比刚才更清楚
    - 最后她做一个很小的决定：不看了、不想了、睡吧。这个决定就是下一回的起点
    - 不要写她的结论。写她怎么从这件事上移开眼睛

  示范 · 两段:
    她把门虚掩上，回头看了一眼楼道，楼道里没人，只有三楼那家的炉子还在响。他坐下了，坐在她男人平时坐的那把椅子上。她想说点什么把话岔开，张了张嘴，说的却是让他喝水。水是温的，她自己也不知道什么时候倒的。等他伸手去接，两只手碰到一起的那一下，她往回缩了半寸，没缩开。
    那天晚上她洗了很久的手，洗到手指发皱。第二天照常起来上班，路上碰见邻居，还聊了两句孩子的事。没人看出什么，她自己也没打算让别人看出什么。只是下午在办公室坐着的时候，她忽然想起那半寸没缩开，手就在桌子底下蜷了一下。

  常见错误:
    - 夸张。这一路的劲在于克制，一夸张就全毁了
    - 用「雌」「母猪」「肉便器」「齁」这类词
    - 让叙事者替读者痛快。要憋着
    - 让女主一次就范。她得推三四回
    - 把心理写成结论。要写她怎么把念头按下去，不是她因此明白了什么

  和母猪文风的分界:
    母猪文风写身体怎么垮
    白洁文风写她怎么替自己找理由，和理由怎么越来越薄
