文风文件: 母猪文风 · 三阶（沉溺期）

  笔法: ★ 按《文风·淫视》走 —— 器官当主语，人不当主语。写完逐句过一遍，主语是「她」就改写
  用词: ★ 按《文风·词库》走。器官就叫器官，能加脏字就加脏字
  定位: 用在已经整只陷进去、不再挣扎、主动要的角色身上
  一句话: 全篇只有一件事，她要，而且她比谁都知道该怎么要
  什么时候用: 她已经自己找上门、自己动手、主动安排的时候

  叙事者是谁:
    - 同一阶、二阶：淫魔共犯
    - 这一阶叙事的劲全在她身上。她说什么、怎么扭、怎么求，一路写下去
    - 叙事者几乎退到后面，让她的动作和声音占满画面

  这一阶的核心反应:
    - 身体完全配合，而且自己找角度、自己找节奏
    - 语言是谄媚和主动索求。自称换掉：「我」「人家」「妹妹」，按人设定
    - 心理那一层退到后面，被崇拜和渴求顶掉
    - 高潮可以连着给，一次比一次重，间隔越来越短
    - 她开始关心对方的反应：够不够、还要不要、这样对不对

  句式与标点:
    - 密长句推到最满。这一阶可以整段一句话，从入到出写在一句里
    - 拟声词大量嵌入词组，不作单独感叹。写「噗叽一声吞进去」，不写「发出噗叽声」
    - 她的台词可以长，一段里连着几行都是她说
    - 标点：句末可以甩心形。几个心看烧到什么程度
    - 段落比前两阶更长，二百五十字以上都算正常

  词库 · 按部位:
    脸: 仰起来、翻上去只剩一线、舌头收不住、口涎挂在下巴、涕泪糊开、五官散掉
    胸: 甩荡、拍出响、被捏出指印、顶端肿了、随着撞击乱蹦
    腰: 塌出一个弧、自己往上顶、扭成圈、停不下来
    臀: 一片红、撞出波、被掰开、迎得比撞得还急
    腿: 缠紧不放、绷直成线、抽、往下滑又被捞回来
    私处: 一缩一缩收着、往外挤、黏成一片、连着手心一起湿
    全身: 软成一摊、抖到停不下来、热得发昏、汗把身下的布洇透
    声响: 噗叽、啵、啪、咕啾、黏着的拔出声

  她的台词库 · 索求:
    还要、别停、再来、给我、就这里、别走、抱我、看着我叫
    不够、太少了、你快点、你别动让我来、我自己来
    我不行了、我要、我快到了、等我一下、一起

  她的台词库 · 谄媚与认输:
    都听你的、你说怎样就怎样、我是你的、只要你高兴
    我认输、比不过你、我输了、我以后就跟着你
    你把我惯坏了、这样下去我怎么办、我回不去了

  台词里的破碎感（关键，不要写成完整句子）:
    - 话要断。一句里断两到三次，用省略号和波浪号连接
    - 重复同一个词：「还要还要」「不行了不行了」「等一下等一下」
    - 尾音拖长：「别停～」「再来一次嘛～」
    - 允许语句不通、主谓颠倒、说到一半换成喘
    - 心形标在这里。一个心是刚上来，两个是压不住，三个是什么都不管了

  肢体小动作库 · 这一阶特有的:
    - 主动伸手去拉对方的手，按在自己身上某个地方
    - 自己调整位置，调整到更好的角度还会满意地哼一声
    - 事情中间睁眼去看对方的反应，看完闭上眼更用力
    - 完事之后不让人走，用腿夹住或者手绕过去
    - 事后主动提下一次：明天、晚上、你什么时候有空

  叙事者的插入句:
    - 她不再问为什么了。她现在只问还有没有
    - 她叫他慢一点。可她自己的腰一点没慢
    - 这一次她没有捂嘴。她不管外面听不听得见了
    - 她说这是最后一次。这句话她已经不说了

  示范 · 两段:
    她整个人往后仰过去，被那一记顶得连声音都散了，胸口那两块被托得高高的肉跟着晃出一片白，晃完还没来得及停又被下一记撞得重新荡开，腰自己往上迎，迎得比刚才那一下更实，嘴里那串齁叫已经碎成一片不成句的音，只剩下尾音还挂着几个心，手指在床单上抓了一把又一把，抓不住，索性松开去够他的手臂，够到就抱着不放。
    还要～她自己把腿抬起来搭上去的时候说的这句，说完还嫌不够，又伸手过来拉着他的手往下按，按到地方了才松口气，哼了一声算是满意，接着就自己动起来，动到后面连哼都哼不出，只剩下从鼻子里漏出来的那些气音和偶尔绊在喉咙里的半句好听的，碎在两个人中间谁也听不完整。

  常见错误:
    - 再写抗拒。这一阶她一句不要都没有
    - 让她说完整的话。她的话要碎、要断、要重复
    - 心形每个句尾都挂。挂多了就不值钱了
    - 忘了她还在关心对方。这一阶她是主动的，不是被用的

  和二阶的分界:
    二阶她说「不要」但身体在迎
    三阶她不说不要了，她说「还要」
