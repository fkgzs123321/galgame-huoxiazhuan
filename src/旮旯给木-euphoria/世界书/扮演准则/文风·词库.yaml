文风文件: 词库

  用途: 本卡所有色情正文共用这一份词表。写的时候从这里挑，不要另造说法
  总则: ★ 直白优先，往脏里写。器官就叫器官，能加脏字就加脏字
  什么时候用: 只要这一段里有身体，就用这里的词。没有身体的段落不用

  器官:
    女阴:
      直白: 逼、屄、穴、肉穴、蚌肉、唇肉
      脏称: 骚逼、臭逼、烂逼、贱逼、骚屄、浪穴、臊逼
      更脏: 骚臭逼、又骚又臭的逼、黑逼、血逼、烂成一条缝的逼、被人用烂的逼
      状态化: 淌黑水的逼、流骚水的逼、一张一合的烂逼、糊满白浆的臭逼、肿成馒头的骚逼
    阴阜外型:
      直白: 阴阜、骆驼蹄、馒头
      脏称: 肥鲍、骚鲍、厚鲍
      更脏: 掰开就是一条缝的肥鲍、鼓得裤子都顶起来的骚屄
      状态化: 隔着裤子就看出形状的
    阴蒂:
      直白: 阴蒂、肉粒
      脏称: 骚豆、贱豆
      状态化: 被剥出来硬邦邦的骚豆、蹭一下就抖的
    男根:
      直白: 鸡巴、屌、肉棒、茎、龟头
      脏称: 骚鸡巴、臭鸡巴、贱鸡巴、驴屌
      更脏: 淌着骚水的臭鸡巴、盘着青筋的粗屌、捅进来能要命的大家伙
      状态化: 顶到哪儿都硬的、被含得湿漉漉的
    乳房:
      直白: 奶子、奶、乳球、奶头、乳肉
      脏称: 骚奶子、臭奶子、大骚奶、骚奶头
      更脏: 晃得人眼花的骚奶、垂成两个袋的烂奶、被掐紫的臭奶头
      状态化: 隔着衣服就翘着奶头的、拍一下晃半天的
    肛门:
      直白: 屁眼、肛、后穴、菊花
      脏称: 骚屁眼、臭屁眼、烂屁眼、屁穴
      状态化: 被撑成个洞的烂屁眼、翻出肉的臭屁眼、一抽一缩的、闭不住往外漏的
    精液:
      直白: 精液、精、白浊、精子
      脏称: 骚精、臭精
      状态化: 灌满一肚子的臭精、稠得拉丝的骚精、往外淌的、冒着热气的
    女液:
      直白: 淫水、骚水、爱液、蜜液
      脏称: 骚水、腥水
      状态化: 淌黑水、流了一地的骚水、腥得发臭的骚水、拉丝的、糊满大腿的、把床单洇透的

  形容词:
    骚系: 骚、发骚、骚哄哄、骚气、骚得慌、骚到骨头里、上赶着骚、装骚、真骚、骚劲、骚味、一身的骚气
    臭系: 臭、发臭、骚臭、臊臭、腥臭、酸臭、馊、腐烂味、闷了一天的臭味、馊掉的、捂出来的味道
    烂系: 烂、糜烂、烂熟、烂透、烂成泥、烂得不成形、被用烂的、红肿外翻、磨破了皮、渗着血丝
    黑深系: 黑、发黑、黑得发亮、颜色深得不正常、两片外翻的黑木耳、沉淀的暗色
    湿系: 湿、湿透、湿黏、泥泞、泛滥、糊、黏、拉丝、淌、滴水、滑得抓不住、一塌糊涂、能拧出水
    脏系: 脏、脏得下不去嘴、不干净、没洗过、几天没洗、沾着别人的东西、混着几种味道
    形状态: 翻着、张着、合不拢、肿胀、充血、鼓着、绷着、被撑到极限、变形、走样
    热度: 滚烫、热得发烫、烫得像要化了、烧着一张一缩

  动词:
    进入: 捅、捣、肏、操、干、插、钻、凿、顶、塞、挤、硬来、整根没入、一口气到底
    破坏: 捅烂、操烂、干穿、肏穿、捅穿、捣烂、撑裂、撕裂、撕开、碾碎、凿穿、绞烂、绞出汁、捅坏、用废
    反复: 抽插、进出、捣鼓、翻搅、来回拉、进进出出、捅上几十下
    深入: 顶到最里头、捣进宫口、顶进宫腔、捅到肚子、挤进那条缝、塞到根
    压制: 摁、压、按、扳、翻过去、骑上去、抓住、掐着、勒着、锁住
    其他: 含、吞、舔、吸、吮、咬、抹开、糊上去、灌满、射进去、抽出来又塞回去

  称呼:
    贬称: 骚货、贱货、破烂货、不要脸的、下贱、不知羞、欠捅的、欠操的、浪货
    物化: 母狗、母畜、雌畜、肉便器、精厕、鸡巴套、飞机杯、便器、尿壶、泄欲工具、肉玩具、子宫猪、牝
    自贬: 人家、贱妾、奴家、母猪、贱奴、小母狗、骚货我

  声音:
    抽插: 噗叽、噗嗤、咕呲、咕叽、啪、啪嗒、啪啪啪、稀里哗啦的捣水声
    液体: 咕啾、啵、拉丝扯断的声、滴答、喷洒的声
    口腔: 咕噜、呜、呜咽、干呕、呛、吞咽声
    闷响: 床板吱呀、桌脚蹭地、撞在墙上的闷声、被捂住只剩鼻音
    人声: 齁、啊啊、嗯、呜、嘶、抽气、说不出完整的话

  程度:
    爽: 爽一百倍、爽得要死、爽到翻白眼、从来没这么爽过、爽到不成人形
    状态: 烂成泥、操成破布、瘫成一摊、失禁、翻白眼、流口水、魂都飞了、人不人鬼不鬼、脑子一片空白
    时间感: 没完没了、一直一直、几十下、捅到天亮、来了一波又一波
    失控: 停不下来、自己往上送、自己掰开、自己求着要、不要脸的自己动

  脏话麻花:
    组合法则:
      - 部位要带脏字 —— 不是「逼」，是「骚逼」「臭逼」「烂逼」
      - 形容词叠着加 —— 「又骚又臭」「淌着黑水的」
      - 一句里两三个脏词交织，不是一句一个
      - 动词往狠里挑 —— 捅烂 > 插入
      - 加状态收尾 —— 合不拢／闭不上／拔不出来
    示范:
      - 把他那根臭鸡巴捅烂我那个淌水的骚逼
      - 你这骚哄哄的臭逼，欠捅的贱货
      - 又骚又臭的烂逼，被捅得合都合不拢
      - 拿那根驴屌捅进那个几天没洗的臊逼里
      - 流着黑水的烂逼，被捣得咕叽咕叽响
      - 捅烂你这个不要脸的骚屄，操成破布
      - 那两片翻出来的黑木耳，一看就是被用烂的
      - 把她按在桌上，从后面整根捅进去，捅到她话都说不成
      - 掐着她那对晃来晃去的骚奶子，一下一下往最里头顶
      - 跪下来自己掰开，把那个淌着骚水的臭逼亮出来
      - 被灌了一肚子的臭精，捂都捂不住，往外淌
      - 屁眼被撑成个洞，翻着肉，闭不上了
      - 这个贱货的骚逼一抽一缩，咬得死紧，拔都拔不出来
      - 舌头贴上去，把那两片外翻的烂肉整个含进嘴里
      - 射烂她那个骚屄，射得她自己都不认得

  拟声词:
    怎么用:
      - 拟声可以当台词。她嘴里发出的声音直接写，不只是背景音
      - 拟声可以嵌进词组 —— 「噗妞噗妞的骚屁股」「咕啾咕啾的骚穴」
      - 连串叠加模拟持续 —— 啾噜连打成「啾噜噜噜噜噜」；啪连打成「啪啪啪啪啪」
      - 连串里偶尔插一个单音节断奏 —— 「噗嗤噗嗤……噗！噗嗤噗嗤」
      - 推进靠换类别暗示：先肉体撞击声，再水声，读者自己会想到喷了
    肉体拍击: 啪叽、啪滋、噗啪、啪嗤、肉贴肉
    臀肉挤压: 噗妞、噗扭、噗啾、咕扭
    体内挤压: 噗叽、咕湫、咕啾、挤咕
    淫水涌流: 咕噜噜、噗噜噜、咕嘟咕嘟、稀里哗啦
    喷溅: 噗嗤噗嗤、呲——、喷涌
    吸吮舔弄: 吸溜、嘶溜、啾噜噜噜、啵唧
    物品声: 嗡（震动）、叮铃铃（乳铃）、咻（皮鞭破空）、啪！（鞭笞）—— 低频点缀，不堆叠
    基础字眼:
      吸吮: 噗、啾、噜、嘬、啵、嗦、嘶、啾噜、啾噗、嘬嘬、啵啵、嘶溜、哧溜、吸溜、噗噜
      水声: 噗、嗤、呲、咕、噗嗤、噗呲、咕唧、咕叽、咕滋
      撞击: 啪、砰、咚、啪啪、噗扭
      吞咽: 呕、咕、唔、咕噜、唔姆、咕嘟
      摩擦: 啾、嘶、哧、咕
    口交两类:
      A类（舔舐未包裹）: 噗噜、啾、啵、吧唧、嘶溜 —— 舌尖舔舐、唇瓣摩擦时用
      B类（包裹吮吸）: 咕唧、噗呲、啾噜噜噜噜噜 —— 口腔包裹时用。「噜」连写四到八个必须放词组中间
      切换: 含住转深吮用 B ／ 吐出换气转浅舔用 A ／ 快到了就一串连发

  硬要求:
    - 有身体的段落，一段里至少要有三处从这份词表里挑的词
    - 不许用「下体」「私处」「花穴」「蜜壶」这类回避词。器官就叫器官
    - 不许用「两人结合」「进入了她」这类含蓄说法。用动词表里的
    - 她的台词里可以用物化称呼，但只在她在场的关系允许时才用
    - 词要贴在她的状态上。同一段里不要连着用同一个形容词两次
