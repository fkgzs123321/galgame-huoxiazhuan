@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
六庆馆学园是什么:
  - 一所高等教育机构，学院制。进这里的都是成年人，全員 18 岁以上
  - 二年级指学院二年级，不是中学。不要把校服、早读、班会这些东西往里写
  - 校名就叫「六庆馆学园」，这是它的正式名字，不改

空间:
  名称: 白色密室
  特征:
    - 全白。墙、地、天花板是同一块材料，接缝看不出来
    - 没有窗，没有梁，没有可以站人的高处。抬头只有一片白
    - 没有影子。光从四面八方来，人站在中间，脚下干干净净
    - 声音会来回弹。说一句话，会在墙之间撞几次才散掉
    - 空气很干。干到呼吸要多费一点力气
    - 没有灰尘。一点颜色都是奢求
  房间:
    中央大厅: |
      所有人聚集的地方。系统的声音从这里落下来，都子也死在这里。
      中央地面有一小片干涸的血迹，边缘结出暗黄色的痂。那不是脏，
      是唯一一点不属于白色的东西。
      这里没有坐的地方，也没有能握住的东西。
    监视器装置房: |
      半个教室那么大。一面墙全是监视屏，几十块拼在一起，
      幽蓝的冷光把所有脸照得惨白。屏幕上是密室里各个角落：
      大厅的血迹、洗手间的隔间、一条深不见底的楼梯。
      屏下面立着一个半人高的金属装置，顶上是带密码锁的凹槽，
      周围一圈看不懂的线路和指示灯。
    玻璃房: |
      一整面单面镜。里面亮，外面暗，所以只有外面看得见里面。
      站在里面往那面玻璃上看，只看得见自己，看不透后面有什么。
      把灯关掉之后，玻璃上那张脸比什么都清楚。
      后面还有一道暗门，密码是从前面几层的选择里拼出来的。
    洗手间与储物间: |
      两侧各有几间没有门的隔间。水龙头拧开是温水。
      洗面台上摆着不属于这里的东西。储物柜的锁扣上有划痕。
    天台与楼梯间: |
      往上一段没有灯的楼梯。天台上什么装置都没有，
      只有一扇锁着的门和很冷的空气。天是白的，没有星星。
      下面很深。栏杆会响。
    装置室: |
      最下面那一层。中央一台大装置，五个凹槽，每一个都在等一个人。
      总控在侧面。五个凹槽全启动，所有门同时开。
  门: 五扇。每完成一轮游戏开一扇

游戏规则:
  参加者: 七人。男的这一个是钥匙，女的五个是锁孔（第六个原本是都子，开场前已经死了）
  项圈: |
    每个人脖子上都锁着一个。看不见锁孔，也没有钥匙孔。
    它不响，不亮，但你会一直知道它在
  目标: 打开五扇门离开
  一回合: |
    系统出一题。钥匙从剩下的锁孔里挑一个，按系统给的要求做。
    做完算开一道锁。做不完就一直停在那一层
  拒绝: |
    放弃游戏的人死。都子已经证明过这一点
  违规: 拒绝执行或中途退出，一样会死
  反抗: |
    游戏不禁止钥匙停下来。你可以不点。
    但时间不会因为你停下来而不走

处刑:
  方式: 瞬间传送到拷问装置，通电
  装置: 一把带束带的椅子。皮带是湿的，不知道是谁的
  先例: |
    安藤都子第一个站出来说要退出，当着所有人的面被电死。
    皮肉被超高压贯穿焦化，味道像烧焦的劣质塑料混着蛋白质的腥甜。
    她失禁的液体顺着小腿流下来，在白地板上蜿蜒出一条痕迹。
    那条痕迹现在干了
  作用: 那之后没有人再提退出

逃出:
  条件: 五轮游戏全部完成
  结果: 五扇门打开，回到地面
  但: 走到地面之后才发现，外面不是外面

那个声音:
  听感: 不像人。没有呼吸，没有口音，落下来的时候比天花板还高
  语气: 平的。宣布处刑和宣布开门的调子一样
  从哪来: 头顶。但头顶什么都没有
  会不会回答: 不会。它只宣布，不解释
