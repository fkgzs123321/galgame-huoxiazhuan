@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
<% { %>
<%_ const 关 = getvar('stat_data.世界.当前关卡', { defaults: '第一关·监视器装置房' }).replace(/\s/g, ''); _%>
这一关的切线窗口:
  前两关: 可以切。切完这一关剩下的层就按新线走
  第三关: 最后一次机会。第三关结束还没分线的，后面按「逃出去」走
  第四关起: 不再切线。已经分好的不变，没分的不再分

说明:
    - 五扇门，一关一扇。每一关里她都能从下面这些选项里挑，挑什么由她的人设决定
    - 反抗等级只标代价，不标「好不好」：微不要钱，极要烧掉一半反抗值
    - 「她的后果」不是惩罚，是这一层会发生什么。她选之前你猜不到，选完才知道
    - 每一关的门都要她点够次数才会开。开门的进度就是「世界.关卡进度」
<%_ if (关.indexOf('第一关') === 0) { _%>
第一关 · 监视器装置房:
  目标: 打开第一扇门
  路线: 中央大厅往北
  装置: 一台布满屏幕的监视屏，能看到密室里大部分地方，中央有个带锁的凹槽
  选项池:
    微:
      去找找洗手间在哪里: 什么都不会发生，只是耗掉一层。她多半会无聊
      去翻储物柜: 她会记住你翻过东西，之后更容易怀疑你留了痕迹
      坐在原地不说话: 她会等，等到不耐烦
      抬头看天花板上的灯: 她开始注意到你在观察环境
      问合欢这是什么地方: 合欢会嘲弄你一句，然后什么都不说
      清点人数: 她会觉得你在扮演一个负责的人，兴趣稍减
    中:
      把梨香的手按在墙上: 梨香会哭。她在屏幕外看得比谁都认真
      让菜月站到监视屏前面: 菜月会配合你，还会替你把话圆过去
      撕掉合欢校服的一颗扣子: 合欢不会反抗，只会把这件事记下来
      把叶拉到监控拍不到的死角: 这一层没有别人看见，除了她
      解开凛音的袖章: 凛音第一次露出不属于风纪委员的表情
      把储物柜里的东西全倒在地上: 她会觉得你在找什么，开始跟着你的视线看
    强:
      让合欢看着，不许出声: 合欢会记住这笔账，并在之后找回来
      让梨香跪着等你做完: 梨香会哭得更凶，但不会跑
      扒掉菜月的教师外套: 菜月会说一句「真拿你没办法」，然后不阻止
      把凛音的手腕绑在监视屏支架上: 凛音会一直盯着你，不说话
      让她在所有人面前选一个: 她会兴奋。这一层她会盯着屏幕不动
    极:
      当着所有人的面把叶按在监视屏上: 所有人都会看见。好感度会一次性大改
      把菜月绑上装置，按下启动: 装置会亮。她会暂停两秒
      让合欢自己走过来，跪下去: 合欢会照做。你猜不到她为什么照做
  通关:
    条件: 关卡进度满
    门开在: 装置房北墙
    打开后: 涌出来的风是热的，说明外面不是外面
<%_ } else if (关.indexOf('第二关') === 0) { _%>
第二关 · 洗手间与储物间:
  目标: 打开第二扇门
  路线: 从第一扇门出来的走廊，往东
  装置: 两侧各有几间没门的隔间，洗面台上摆着不属于这里的东西
  选项池:
    微:
      把水龙头拧开: 水是温的。她会记一下这个细节
      检查隔间有没有人: 她会觉得你在替谁担心
      对着镜子看自己: 她会看着镜子里的你
      把湿的毛巾挂好: 无聊的一层
      数一遍隔间数量: 她会开始跟着数
      在洗面台上放一样东西: 她后面会注意到东西的位置变了
    中:
      把梨香带进最里面那间: 她会听见梨香在里面喊你的名字
      让菜月替你擦干净手: 菜月会照做，动作很慢
      把合欢推在隔间门上: 门会响。外面的人会听见
      从背后抱住叶: 叶不会回头，但会停下手里的动作
      把凛音按在洗面台上: 镜子里能看见两个人的脸
      拿走洗面台上不属于这里的东西: 那是她之后要用的东西，她会不高兴
    强:
      让梨香替你做那件事: 梨香会照做，全程都在哭
      两个人一起按在隔间里: 她喜欢这种挤的感觉
      让合欢在门外数数: 合欢会数。数到几由她自己定
      把菜月的手反绑在水管上: 菜月会笑，说这样不方便
      让凛音看着镜子里自己: 凛音会闭上眼。你会让她睁开
    极:
      把三个人塞进同一间隔间: 会很挤。好感度会连锁变化
      让叶替梨香挡下来: 叶会答应。梨香会记住这件事
      在洗面台上做完，把她留在那里: 她会记住你走的时候没回头
  通关:
    条件: 关卡进度满
    门开在: 走廊尽头
    打开后: 门后面是往下的楼梯，不是往外
<%_ } else if (关.indexOf('第三关') === 0) { _%>
第三关 · 玻璃房:
  目标: 打开第三扇门
  路线: 沿楼梯往下
  装置: 一整面单面镜。里面亮外面暗，所以外面看得见里面，里面只看得见自己
  选项池:
    微:
      敲敲玻璃: 声音会传出去很远
      贴着玻璃看自己: 玻璃上会多出一张脸。她在外面看着你贴上去
      坐到房间中间: 什么都发生不了
      把灯关掉: 暗下来之后，玻璃上那张脸比什么都清楚
      在玻璃上写字: 她会读出来
      一个人待着: 她会陪你待着，不出声
    中:
      在玻璃前面把梨香抱起来: 她第一次看到你主动抱人
      让菜月站在玻璃前面，从后面: 镜子外面的人会看得很清楚
      把合欢压在玻璃上: 合欢会看着自己的倒影
      让叶跪在房间正中: 你会让她抬头看镜子
      把凛音的校服一件件解开: 凛音会数你解了几件
      让所有人背对玻璃站成一排: 外面看得见一整排后背。她会兴奋
    强:
      让合欢对着玻璃说明白自己是什么: 合欢会说得很难听
      在玻璃前面把梨香做到哭不出声: 梨香会抖
      让菜月看着玻璃上的自己，从后面抱着她: 菜月会一直盯着玻璃里那张脸
      让叶看着镜子里的梨香: 叶会移开视线。你会让她看回去
      把凛音的手按在玻璃上: 玻璃上会留下手印
    极:
      把所有人叫进玻璃房，关灯: 暗下来之后只剩声音。她会屏住呼吸
      让合欢自己选一个人按在玻璃上: 合欢会选。你猜不到她会选谁
      在玻璃房的正中央做完，全程对着镜子: 镜子里只有你自己。她在外面对着这面玻璃看
  通关:
    条件: 关卡进度满
    门开在: 玻璃房后面那道暗门
    打开后: 门有密码。密码是她从你前面几层的选择里拼出来的
<%_ } else if (关.indexOf('第四关') === 0) { _%>
第四关 · 天台与楼梯间:
  目标: 打开第四扇门
  路线: 从暗门往上，穿过一段没有灯的楼梯
  装置: 天台上什么装置都没有，只有一扇锁着的门和很冷的空气
  选项池:
    微:
      靠着栏杆喘气: 她会让你喘够
      把手放进兜里: 冷。她会注意到
      数还有几个人跟着你: 你会发现少了一个
      坐到地上: 她会安静一会儿
      抬头看天: 天是白的，没有星星
      什么都不做，等门自己开: 她不会等
    中:
      把梨香裹进自己的外套里: 梨香会往你身上贴
      让菜月替你处理手上的伤: 菜月处理得很熟
      把合欢抵在栏杆上: 栏杆会响，下面很深
      让叶靠着你的背坐下: 两个人都不说话
      把凛音的外套脱掉: 天台很冷，凛音不会说冷
      在天台上把门砸一遍: 门不会开。但楼下的灯会亮
    强:
      让梨香跪在天台的地上: 地面很冷，她会抖
      从后面把合欢按在栏杆上: 她自己会看着下面
      让菜月在天台上把话说清楚: 菜月会说你还不该知道
      把叶的手绑在栏杆上，让她一个人待着: 叶会答应
      让凛音在这里把校服全脱了: 凛音会照做。风很大
    极:
      在天台上把合欢做到她自己开口求: 她会求。这是第一次
      让所有人都待在天台上，一个一个来: 天台不会有人打断
      把叶留到最后，让她自己走过来: 叶会走过来。她一直都会
  通关:
    条件: 关卡进度满
    门开在: 楼梯间最下面那层
    打开后: 门后面就是第一关那间装置房，但不是同一间
<%_ } else if (关.indexOf('第五关') === 0) { _%>
第五关 · 装置室与出口:
  目标: 打开第五扇门，出去
  路线: 回到最下面那一层
  装置: 中央是一台大装置，五个凹槽，每一个都在等一个人
  选项池:
    微:
      摸一遍五个凹槽: 凉。有一个还是温的
      退回去看第一扇门: 它已经关上了
      把地上散的东西收拢: 是前面几层留下来的东西
      坐在装置边上: 她会陪你坐一会儿
      问一句「还差几个」: 没有人回答你
      检查出口的门: 门是开的。她还没让你走
    中:
      把梨香放进第一个凹槽: 梨香会问「疼吗」
      让菜月站进第二个: 菜月会说这是老师的任务
      把合欢按进第三个: 合欢会笑
      让叶自己走进第四个: 叶会先回头看你一眼
      把凛音推进第五个: 凛音不会出声
    强:
      同时启动两个凹槽: 装置的声音会变。她会凑近屏幕
      让梨香在装置上做完: 装置会升温
      让合欢在启动的装置上把话说全: 她会说到一半停下
      让叶替凛音选一个: 叶会选。凛音会记住
      把菜月留在装置上，自己走开: 菜月会叫你，你不会回头
    极:
      五个凹槽全启动: 所有门同时开。她会一直看着
      把合欢按在总控上做完，然后启动: 这是她一整套人设里最想要的一个画面
      什么也不做，走过去推开出口的门: 她会让你走。但她会跟着看到最后
  通关:
    条件: 关卡进度满，且装置被启动
    门开在: 出口
    打开后: 外面是什么，由她有没有得手决定
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
<% } %>
