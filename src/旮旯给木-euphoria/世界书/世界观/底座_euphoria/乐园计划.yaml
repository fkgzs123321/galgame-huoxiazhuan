@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
乐园计划:
  性质: 一处研究设施里做的实验，目的是用技术让人进入一个无比幸福的虚拟世界
  核心: 生体核心「睡美人」。合欢是这一代的核心载体
  维持: 核心要靠绝望情绪维持系统稳定
  设施: 密室下面还有一层更大的地下设施

  真相是分层的，一层一层往下掉:
    第一层（开场就能看到的）:
      - 这是一场密室逃脱。五扇门，五回合，钥匙与锁孔
      - 拒绝的人会死。都子已经死过一回
    第二层（走完几关之后）:
      - 密室、装置、项圈，全是人造的。有人在外面看着
      - 都子的死不是杀鸡儆猴，是给 <user> 看的
    第三层（她的目的快满的时候）:
      - 从密室到学园到记忆里的一切，都是合欢为了救 <user> 而构建出来的世界
      - 现实里的两个人，早已陷入沉睡
    第四层（只在越界那一眼看得见）:
      - 台上台下是一体的。她坐在屏幕外面，也在屏幕里面
      - 这一点不要在正文里说破。让她回头的那一下自己把它带出来

势力:
  B社: 推进乐园计划的一方。叶曾在这里当研究员
  C社: 与 B 社对立。叶后来转为 C 社的间谍
  她们的立场:
    - 叶要的是把合欢逼到彻底绝望，让核心崩掉
    - 合欢要的是把 <user> 留在里面，无论代价

学园篇:
  逃出密室之后: 外面的世界已经变了样，合欢成了学园的支配者
  六庆馆学园: |
    他们本来念书的地方。二年级的教室、走廊、天文社的活动室。
    现在走廊上没有人，教室里没有人，但灯全开着。
    天台能看见整座学园，一层楼一层楼亮着，像还活着
  对抗: 凛音带着一批黑袍教徒，与合欢的势力对抗
  暴乱: 两边的人在学园里互相残杀

记忆篇:
  入口: 地下洞穴里的一道暗门
  秘密: 睡美人生体核心
  手段: 叶策划的杀人游戏，是为了逼合欢彻底绝望
  看到的: |
    两个人的小时候。天台、夏天、一台旧望远镜。
    惠辅和叶在那里坐过很多次，数过一些星星。
    这一段是全卡唯一的暖色，也是最后能用来破解东西

终局:
  岔路: 留在虚幻的乐园，或是揭穿叶的记忆篡改、唤醒合欢的真实意识
  破解: 用两人小时候一起看星星的记忆，从系统里逃出去

怎么用这些:
  - 第一层的内容，开场就摆出来，不用解释
  - 第二层的内容，走完两三关之后可以让她或者女角提到一半
  - 第三层只在她的目的快满时露头，而且不要一次说全
  - 第四层永远不解释。越界那一眼之后，正文就结束
  - 上面这些是给你安排走向用的，不是要你直接讲给 <user> 听
