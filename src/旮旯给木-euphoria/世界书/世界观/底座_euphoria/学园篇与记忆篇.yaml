学园篇与记忆篇 节点表:
  什么时候进:
    - 密室五关走完、门打开之后才进。不是每条线都走得到，只有叶线走到底才会真正进来
    - 别的线走到结尾，多半停在「逃出去」那一步，看不到后面

  # ── 学园篇 ──
  这是什么: 从密室出去之后的世界。原本上学的地方，已经不是原来的样子
  现状:
    六庆馆学园: 走廊、教室、活动室的灯全开着，一个人也没有
    支配者: 合欢。她在这里说了算
    对抗方: 凛音带着一批黑袍教徒，占着东侧教学楼
    中间地带: 天台。两边都不占，谁都能上去（这是 <user> 与叶小时候的地方）
  节点:
    进来:
      场景: 校门口。门开着，里面亮着
      发生: 没有人拦，也没有人迎。走进去之后身后的门自己关上
      转折: 从这一刻起，密室那一套规则失效，换成这里的一套
    遇合欢:
      场景: 二年级教室。<user> 自己的座位
      发生: 她坐在讲台边上等，说「你终于出来了」
      转折: 她把这里的一切说成是自己给的。半真半假
    遇凛音:
      场景: 东侧教学楼的楼梯口。黑袍的人不拦路
      发生: 凛音说这里已经打了很久了，问 <user> 站哪边
      转折: 她会给 <user> 一个选择，而且不接受不回答
    天台:
      场景: 天台。夏天，一台旧望远镜
      发生: 叶在这里等。<user> 与叶小时候在这数过星星
      转折: 这一段是全卡唯一的暖色。从这里开始，之前所有的冷都说得通了
    暴乱:
      场景: 走廊。两边的人在教学楼里互相残杀
      发生: <user> 必须穿过这一段才到得了地下入口
      转折: 走哪条路，决定谁会在记忆篇里出现
    尾声:
      收法: 找到地下入口 / 死在走廊上（这条不是必死，是可选的分支）

  # ── 记忆篇 ──
  这是什么: 地下洞穴里的一道暗门之后。乐园计划的核心所在
  现状:
    设施: 密室下面还有一层更大的地下设施
    核心: 生体核心「睡美人」。合欢是这一代的载体
    现实: 现实里的两个人早已陷入沉睡
  节点:
    进来:
      场景: 地下通道。灯是红的
      发生: 越往里走越安静，最后连自己的脚步声都听不见
      转折: 从这一步起，之后发生的事都不再是游戏
    装置室:
      场景: 巨大的圆柱形容器
      发生: <user> 第一次看见「睡美人」本身
      转折: 之前所有的血腥在这里有了一个特别冷的解释
    叶的坦白:
      场景: 容器前面
      发生: 叶说她在这里当过研究员，后来转到对立的一方；杀人游戏是她策划的，目的是逼合欢彻底绝望
      转折: 峰值：全卡的真面目在这里全部摊开
    合欢的真相:
      场景: 容器内部 / 记忆里
      发生: 小时候的天台、夏天、旧望远镜。这一段是记忆，也是唯一的破局钥匙
      转折: 在这里之前一直以为的「谁在害谁」全部反过来
    最后的岔路:
      选择一: 留在虚幻的乐园。世界很暖，很稳，永远不会再有人死
      选择二: 揭穿叶的记忆篡改、唤醒合欢的真实意识，从系统里逃出去
      转折: 这一条岔路之后就是全卡结束。没有第三条

  与密室篇的关系:
    - 密室篇是「游戏」，学园篇是「后果」，记忆篇是「原因」
    - 三段的时间顺序是反的：原因（小时候）→ 游戏（密室）→ 后果（学园）
    - <user> 在密室篇里以为自己在逃出去。走到记忆篇才知道自己一直在往里面走

  后补清单:
    - 学园篇的六个节点都还只有一句话，需要按房间展开成场面
    - 记忆篇的「合欢的真相」需要一段具体的记忆描写（天台、夏夜、望远镜、两个人说过的话）
    - 黑袍教徒（凛音那一方）的来历要补：他们是谁，为什么信凛音
    - 原作的「合欢线通关后才解锁叶线」这个门槛，现在只在设定里，需要在出招规则里落地
