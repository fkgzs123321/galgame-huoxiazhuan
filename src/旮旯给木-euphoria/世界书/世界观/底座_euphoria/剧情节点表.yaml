@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
<% { %>
<%_ const 线 = getvar('stat_data.世界.当前线', { defaults: '未定' }); _%>
剧情节点表:
  这是什么:
    - 六条线的骨架。每条线在每一层该发生什么，落在这里
    - 具体的场面、对话、动作，按这张表往下写。表是骨架，场面是肉
    - 一张表里的「第几层」是粗数，实际按关卡进度走
  通用节奏:
    第 1-2 关: 铺底。所有人还在，谁都没亮底牌。她的偏好开始露头
    第 3 关: 分水岭。至少一个人被迫表态，线在这里分开
    第 4 关: 加压。选定的那条线开始要人付出东西
    第 5 关: 见底。这条线的峰值，之后不可逆
    终局: 收尾。她关掉游戏之后那一段自由

  # ── 莳羽梨香线 ──
  分线条件: 她的好感度最早到 +31，且 <user> 在离线态朝她走过一次
<%_ if (线 === '莳羽梨香') { _%>
  节点__莳羽梨香:
    第1-2关:
      场景: 大厅→监视器房。她一直跟在半步外
      发生: 她第一次主动开口问「我们会不会死在这里」
      转折: <user> 回不回头，决定这条线起不起
    第3关:
      场景: 玻璃房。她第一次看见自己在镜子里的样子
      发生: 她躲到 <user> 背后，手抓的不是袖子是手腕
      转折: 好感度跳到 +56
    第4关:
      场景: 天台。地面很冷
      发生: 她在天台第一次说出「我不想一个人」
      转折: 这句之后，她开始把自己交出去
    第5关:
      场景: 装置室。五个凹槽
      发生: 她自己去站在凹槽前面，不用别人推
      转折: 峰值：她第一次不哭。这一下之后她不再是学妹
    终局:
      收法: 护住了 / 没护住，两种完全不同的结尾
  与原著的接口: 原作梨香线是推荐顺序的第一条，核心是「任性又怯懦的小动物被推到极限」

  # ── 葵菜月线 ──
  分线条件: 她好感度最早到 +31，或连续三层替 <user> 承担
<%_ } else if (线 === '葵菜月') { _%>
  节点__葵菜月:
    第1-2关:
      场景: 大厅。她数了两遍人数
      发生: 她开始记账：谁在哪、谁少了、谁还能动
      转折: 她把所有人都当成自己的责任
    第3关:
      场景: 洗手间。洗面台
      发生: 她替 <user> 把手上的血洗掉，一句话没说
      转折: 好感度跳到 +56，但她开始不睡
    第4关:
      场景: 楼梯间，没有灯那段
      发生: 她在黑暗里扶了一把墙，被 <user> 听见了
      转折: 她第一次露出撑不住的样子
    第5关:
      场景: 装置室。她站在控制台边上
      发生: 她第一次说「我扛不动了」
      转折: 峰值：这一句之后她对 <user> 的态度整个换
    终局:
      收法: 她倒下 / 她终于被人接住
  与原著的接口: 原作菜月线第二，核心是「成年人做派在没有道理的地方一点点碎掉」

  # ── 白夜凛音线 ──
  分线条件: 她好感度最早到 +31，且 <user> 当着她的面破过一次规
<%_ } else if (线 === '白夜凛音') { _%>
  节点__白夜凛音:
    第1-2关:
      场景: 大厅→监视器房。她一直站在门口
      发生: 她说出这个系统不合规，然后没人接她的话
      转折: 她开始一个人按自己的规矩行事
    第3关:
      场景: 玻璃房。单面镜
      发生: 她在镜子前面把校服重新整理了一遍
      转折: 好感度跳到 +31
    第4关:
      场景: 天台。风很大
      发生: 她把自己的一条规矩说给 <user> 听，说完就没再提
      转折: 她开始破自己的规矩
    第5关:
      场景: 装置室
      发生: 她当着所有人的面替 <user> 破一次规
      转折: 峰值：之后她回不去
    终局:
      收法: 她守住了东西 / 她把守的东西亲手砸了
  与原著的接口: 原作凛音线核心是「规矩是她的依靠，也是她的壳」

  # ── 真中合欢线 ──
  分线条件: 她好感度最早到 +31，或从第一关就被她当众点破过
<%_ } else if (线 === '真中合欢') { _%>
  节点__真中合欢:
    第1-2关:
      场景: 大厅。她靠在墙上
      发生: 她把只会说给 <user> 听的那句话又说了一遍
      转折: 她开始把 <user> 的隐秘当筹码
    第3关:
      场景: 玻璃房
      发生: 她让 <user> 在所有人面前做一件事，做不做由 <user>
      转折: 好感度跳到 +56或「警惕」，两条路
    第4关:
      场景: 天台。栏杆
      发生: 她第一次露出不是游戏的那一面，很短
      转折: 好感度跌到 -56 再往下
    第5关:
      场景: 装置室。总控
      发生: 她说出自己为什么要这么做
      转折: 峰值：这一层只能出现一次，过了就没有了
    终局:
      收法: 她赢了 / 她输给她自己
  与原著的接口: 原作合欢线是通关 Euphoria 线的钥匙，核心是「她什么都知道，还要凑上来」

  # ── 帆刈叶线（Euphoria 线）──
  分线条件: 合欢线通过后这条才真正打开。在此之前，她只是那个抓袖子的人
<%_ } else if (线 === '帆刈叶') { _%>
  节点__帆刈叶:
    第1-2关:
      场景: 大厅。她抓着袖子，很轻
      发生: 她一直低着头，但每次 <user> 动她都跟着动
      转折: 好感度在 +56 以上锁死，不会再掉
    第3关:
      场景: 玻璃房。暗门
      发生: 她第一个发现暗门的密码和 <user> 之前的选择有关
      转折: 她藏事的那一层开始露头
    第4关:
      场景: 天台
      发生: 她说「我以前来过这个地方」，然后不说了
      转折: 好感度跳到 +31
    第5关:
      场景: 装置室→地下
      发生: 她告诉 <user> 她做过什么
      转折: 峰值：全卡的真面目在这里露出来
    终局:
      收法: 留在里面 / 出来
  与原著的接口: 原作 Euphoria 线是核心真相所在，有 Normal End 和 True End

  # ── 鬼畜线 ──
  怎么进: 忍耐度连着三层归零，或敏感度冲到 80 以上。任何一条线走到一半都可以拐，拐过去回不来
<%_ } else if (线 === '鬼畜') { _%>
  节点__鬼畜:
    第1-2关:
      场景: 任意
      发生: 有一层 <user> 的身体先动了，而她还没点
      转折: 系统什么都没说，但她的光标停了一下
    第3关:
      场景: 玻璃房
      发生: <user> 做了她没让做的事
      转折: 她的兴奋度跳过 80，第一次直接打字
    第4关:
      场景: 天台
      发生: <user> 已经不需要她开口
      转折: 她的存在感开始变淡。这是这条线最特别的地方
    第5关:
      场景: 装置室
      发生: <user> 做了她自己都没想到要做的事
      转折: 峰值：她会停下来
    终局:
      收法: 她兴奋 / 她怕了你
  与原著的接口: 原作鬼畜 End 是独立分支，核心是「施虐者的位置换人了」
  后补清单:
    - 每条线的「第1-2关」都还只是骨架，需要按关卡序列里的具体房间和选项填场面
    - 原作的 Bad End 条件（如「留在这个房间」「但是…」「这并非游戏啊」）要逐条对应到我们的选项池里
    - 学园篇与记忆篇目前只有设定，没有节点，需要单独一张表
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
<% } %>
