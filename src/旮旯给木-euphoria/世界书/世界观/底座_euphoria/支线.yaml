@@if getvar('stat_data.世界.底座', { defaults: 'euphoria' }) === 'euphoria'
<% { %>
<%_ const 线 = getvar('stat_data.世界.当前线', { defaults: '未定' }); _%>
支线:
  怎么分线:
    - 每个女角都有一条自己的线。走哪条，看谁的好感度最高，加上她偏好谁
    - 她偏好的那条会被她一直往前推；但 <user> 在离线态可以自己改方向
    - 两条线都推高时会打架。这时候别替 <user> 选，把两边的代价都摆出来
    - 一条线走到底，别的线不会消失，只会变冷。冷掉的线在终局里会有人来
  共同的开头:
    从密室醒来到第一关，所有人都还在。五回合是分线的地方：
    她连着把关卡引向谁，谁那条线就起头
<%_ if (线 === '莳羽梨香') { _%>
  莳羽梨香线:
    起头: 她一直跟在你身后。你回头一次，这条线就亮
    中间: 她越来越依赖，也越来越怕。依赖和怕同时涨，涨到某一层会断
    峰值: 她在你面前第一次不哭。那一下之后她不再是学妹了
    她的线会撞谁: 叶。叶看得最清楚，也最不舒服
    结局倾向: 护住了 / 没护住，是两种完全不同的收尾
<%_ } else if (线 === '葵菜月') { _%>
  葵菜月线:
    起头: 她替你承担。你什么都不用说，她自己会站出来
    中间: 她把所有事都扛下来，扛到看不出她还在撑着
    峰值: 她第一次说「我扛不动了」。这一句之后，她对你的态度会变
    她的线会撞谁: 她自己。她不允许自己承认需要人
    结局倾向: 她倒下 / 她终于被人接住
<%_ } else if (线 === '白夜凛音') { _%>
  白夜凛音线:
    起头: 她按规矩办事。你破一次规矩，她就多看你一眼
    中间: 规矩和你的存在开始冲突。她不说，但她开始破自己的规矩
    峰值: 她当着别人的面替你破一次规。之后她回不去了
    她的线会撞谁: 合欢。合欢最清楚怎么把规矩拆开
    结局倾向: 她守住了东西 / 她把守的东西亲手砸了
<%_ } else if (线 === '真中合欢') { _%>
  真中合欢线:
    起头: 她从第一层就在看你。她会先动手，也会先说话
    中间: 她把你往深处带，一层一层松你的绳子
    峰值: 她说出自己为什么要这么做。这一层只能出现一次
    她的线会撞谁: 叶。两个人从头到尾在抢同一个人
    结局倾向: 她赢了 / 她输给她自己
<%_ } else if (线 === '帆刈叶') { _%>
  帆刈叶线（Euphoria 线）:
    起头: 她抓着你的袖子。她一直是最贴的那个
    中间: 她藏的事一层层翻开。她不只是青梅竹马
    峰值: 她告诉你她做过什么。到这里全卡的真面目才露出来
    她的线会撞谁: 合欢。这一条是主线，合欢线通了才真正走得进来
    结局倾向: 两条分岔：留在里面 / 出来。这一条的分岔是全卡最后的岔路
<%_ } else if (线 === '鬼畜') { _%>
  鬼畜线:
    怎么进: 忍猭度连着三层归零，或者敏感度冲到 80 以上
    中间: 你不再是「被按着做」的那个，你开始自己伸手
    峰值: 你做了她自己都没想到要做的事。她会停下来
    结局倾向: 她兴奋 / 她怕了你。两种收尾
    注意: 这条线里她的存在感会变淡：她已经追不上你了
  线之间的关系:
    - 梨香线 → 菜月线 → 凛音线 → 合欢线，是原作给的推荐顺序。你不需要照着走，但走这个顺序能看到最多的真相
    - 叶线是收口。别的线走得越多，叶线里能懂的东西越多
    - 任何一条线走到一半可以拐去鬼畜线。拐过去就回不来
  不要让这些线变成菜单:
    - 不要提示 <user> 「你现在在梨香线」
    - 分线靠的是谁的好感度高、她往哪引、你在离线态做了什么
    - <user> 应该是在很后面才自己意识到「原来这一局一直在往一个人那边走」
<%_ } else { _%>
兜底: 上面的条件都不满足时（变量是意外值），本条目渲染为空，不要自己编内容
<%_ } _%>
<% } %>
