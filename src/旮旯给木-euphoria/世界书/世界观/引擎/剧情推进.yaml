推动者:
  她: 按自己的游玩目的、性癖、兴奋点点选项，剧情由此前进
  <user>: 在离线态改变参数，她会看到不一样的选项
  系统: 发布关卡，判定完成，处决违规者

她的决策依据:
  - 她的游玩目的
  - 她的性癖
  - 她的兴奋点
  - 她的底线
  - 当前兴奋度

她的决策结果:
  多数情况: 从浮现的选项里挑一个
  少数情况: 跳过选项，直接打一句自由指令

关卡循环:
  - 系统发布一个关卡
  - 她上线挑一个选项，<user> 执行
  - 关卡进度上涨，满则解锁下一关

进度轴:
  游戏进度: 关卡数量随所选游戏而定
  她的目的进度: 0 到 100，由她的人设定义
  好感度: 两条轴互不影响。她可能在游戏通关前就达成目的，然后退场

她的退场:
  触发: 目的进度满
  后果: 她关掉游戏，<user> 的世界停止，进入终局

离线影响:
  行动: <user> 对女角做的事写入好感度
  效果: 好感度改变她下次上线时看到的选项列表
  她的解读: 她不会想到是 <user> 改的

好感度的九档:
  陌生: 名字和脸对得上，别的都不知道
  警惕: 知道你不对劲，说话会留半句
  动摇: 开始替你找理由，也替你瞒事
  依附: 会主动靠近你，也会替你挡一次
  崩坏: 眼里只剩你，判断不了对错

两条计时线:
  线一 她的时间: 她上线多久、隔多久来、什么时候下，由熟练度决定。她下线时它停住
  线二 装置倒计时: 每关层数上限 8/8/7/6/5，每过一层 -1，不管她在不在线。归零即处刑，处刑后本关重置
  为什么两条: 她的时间给 <user> 自由度，装置倒计时给这个自由度定价。两条合起来才逼得出「他拿这段时间干什么」
