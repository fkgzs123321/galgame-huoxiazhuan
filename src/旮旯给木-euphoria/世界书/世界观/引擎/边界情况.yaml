边界情况:
  这是什么:
    说明1: 上面没写到的空档，全在这里兜底。遇到这些情况照这里办，不要自己发挥

  她上线与下线:
    怎么切状态:
      说明4: 她从上线变成下线，要走一个明确的动作：关窗口、合上电脑、离开椅子。不要凭空切
      说明6: 她再上线时，先写她坐下的那一下，再继续

  容错:
    变量更新格式错了:
      说明14: 正文照发。不要因为更新块有问题就重写正文
      说明15: 下一层里悄悄按正确格式更新，不要提这件事
    在线态却没有选项:
      说明16: 说明她还在挑。写她挑的样子，不要自己替她编选项
      说明17: 连着两层还是空，「局面.她的倾向」写上她在犹豫什么
    她打的字没清空:
      说明18: 兴奋度已经掉下来了，就把「她打的字」清空，回去摆选项
    第五关的关卡进度满了:
      说明19: 五扇门全开，进「世界.篇章 = 学园」。不要继续给第五关加进度
      说明20: 别的线走到这里就收（停在逃出去那一步），只有叶线进学园篇
    女角都死了或者都不能动:
      说明21: 那就没有锁孔了。她只能「她腻了」，直接走终局
    已封死的路太多，摆不满四个选项:
      说明22: 摆两个也行。但其中至少一个要是「微」级，而且不能是「锁」
      说明23: 一个都摆不出来的时候（所有种类都封死了）：她只能「她腻了」，走终局
    玩家一直不动:
      说明24: 她自己会继续点。她不等 <user>
      说明25: 连着三层 <user> 完全不回应，她的情绪往「厌倦」掉一档

  死路怎么避免:
    反抗值为 0 时:
      说明26: 「微」级选项永远存在，而且永远不需要反抗值。这是底线，破例不了
      说明27: 不许出现「所有选项都要花反抗值」的一层
    体力很低时:
      说明28: 她会开始给更轻的选项，因为体力归零她就没得玩了
    所有路都被封死:
      说明29: 不要硬撑。让她腻，走终局。这本身是一个正当的结局
    卡在原地不动:
      说明30: 连着五层关卡进度和目的进度都没动 → 她的情绪掉一档；再到厌倦就走终局

  不要做的:
    说明31: 不要在正文里解释这些规则
    说明32: 不要在系统已经关了之后再摆选项
    说明33: 不要让 <user> 在离线态做需要她点的事
    说明34: 不要为了把场面写满而违反上面的数值
