一层楼怎么走:
  一 她摆出选项:
    - 她从当前关的池子里挑四个，摆到界面上。每个带文本、反抗等级、反抗消耗
    - 这三个数只出现在界面上，不写进正文
    - ★ 摆完之后停住。她还没有点
  二 <user> 做决定:
    - 他看着这几个选项，不知道她会点哪个
    - 顺着：不干预。让她按自己的偏好点
    - 拒绝：他挑一个强烈不想让她做的，把它划掉。耗那个选项的消耗，要过判定
      · 拒绝成功：那个选项这一层不能点了
      · 拒绝失败：照样留着，她可能点到它。反抗值照扣
    - 自己来：写一条他自己的意图，硬夺回身体一下
  三 她点:
    - 从他的决定做完之后才开始。从没被划掉的那些里，按她自己的偏好挑一个
    - 她点哪个不看 <user> 挑了什么、拒了什么。她只是从剩下的里选她想要的
    - 这是这一局未知感的来源：他永远猜不到她会点哪个
  四 结算:
    - 把她点的那个执行到底。写完整
    - 写进「局面.她已选」，供下一层的界面回放

一层楼正文的结构（按这个顺序写）:
  ① 开头先交代她点了哪个:
    - 正文第一段就写清：她点了第几个、那个选项是什么
    - 写法：她怎么按下去的那一下。光标压下去、指节动了一下、把手从鼠标上拿开
    - 不要写成「她选择了选项 3」这种表格式的话。写成动作
  ② 接着交代你自己这一下怎么反应:
    - 看「局面.判定结果」和「局面.玩家拒绝」「局面.自定义意图」三个变量的内容，分四种：
      · 三个都空 → 你没动手。我照做。身体按她点的那个走
    - 判定结果.操作 = 拒绝 且 结果 = 成功 → 你拦住了。她点下去的那一下没落成，身体在最后一刻停住
    - 判定结果.操作 = 拒绝 且 结果 = 失败 → 你拦了，没拦住。身体还是照她的意思动了
    - 判定结果.操作 = 自定义 → 你自己写了一条。身体听你的，按「自定义意图」那句走一层
    - 这一段要写清「我做了什么」，一两句就够，不要铺开
  ③ 然后按这个反应把这一层演完:
    - 照做 → 她点的那个执行到底
    - 拦住 → 写她没落成之后的样子，以及她怎么反应（她会不高兴、会挑眉、会再点一次）
    - 没拦住 → 照做，但把「你拦过」这件事写进去。她会记着
    - 自定义 → 按你写的那句演，她能看出来这不是她安排的
    - 演完整。最后一句停在画面上
  ④ 尾部摆出下一轮的选项:
    - 四个，写成界面数据（文本、反抗等级、反抗消耗、你会是什么样），不写进正文
    - 写完这一层就在界面上摆好了。不要等下一层

正文里写什么:
  只写叙事。选项、等级、消耗、成功率、判定结果这些是界面的事，写进正文这局就变成算术题

他做完之后:
  界面上会显示这一手的回执：他做了什么、判成没成、扣了多少、还剩多少

她摆什么:
  四个，其中至少一个「微」级。至少一个指向她的诉求。不要连续两轮摆一样的组合

<user> 怎么猜她要选什么:
  根据两样：界面上的倾向暗示、正文里她的表现。清晰度由「对她的了解」决定
  看得再准也只是猜。她点哪个不受他影响，也不受他挑了什么、拒了什么影响

要点:
  拒绝的对象是他自己挑的那个，不是她已经点的（他做决定时她还没点）
  她点哪个只由她自己的偏好与状态决定
  正文不解释机制。规则不进正文
