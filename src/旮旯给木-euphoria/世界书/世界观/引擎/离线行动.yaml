离线行动:
  这是什么:
    - 她关掉游戏之后的那段时间，完全属于 <user>。这是整局里唯一由 <user> 自己说了算的部分
    - 她不在的时候不摆选项。<user> 想做什么就说，AI 按这里的分支判定，并写明代价与留下什么
    - 每一次离线行动都会：花体力、留下痕迹、改某个变量。三样都要写

  能做的事:
    探路:
      做什么: 去没去过的地方，看门、看装置、看通道
      花: 一到三成体力
      留下什么: 有人走过的痕迹（脚印、灰被蹭掉、门没关严）
      改什么: 「世界.关卡进度」+5~15。走通了才加，没走通不加
    找人:
      做什么: 单独去找某一个女角。说话，或者做别的
      花: 二到四成体力
      留下什么: 那个人之后的样子（哭过、衣服乱了、看你的眼神变了）
      改什么: 「世界.女角[].好感度」可能动一档；做得多时「开发度」的三处也可能涨
      注意: 这是唯一能在她不在场时改好感度的途径。她会从摄像头里看见结果，但看不见过程
    拿东西:
      做什么: 翻储物柜、洗面台、地上、装置旁边
      花: 一到两成体力
      留下什么: 柜门开着、东西挪了位置、地上多了一串脚印
      改什么: 「主角.身上」新增一件。一次离线最多拿一件
      注意: 拿到的东西「有什么用」按 <user> 已经知道多少写。不认识的钥匙就先别写它能开什么
    找线索:
      做什么: 摸装置上的刻字、看墙上的接缝、翻别人的东西、回想某个人说过的话
      花: 一到两成体力
      留下什么: 一般不留痕迹（看和想不留痕迹），除非翻了别人的东西
      改什么: 「主角.已知线索」新增一条，并按乐园计划的四层判「真相深度」
      注意: 不许直接给结论。写到 <user> 理解到的程度为止。同一条线索不要重复加
    观察她:
      做什么: 回想她刚才怎么点的、在哪停过、哪一句跳过去了、手放在哪
      花: 零。不动身体，只动脑子
      留下什么: 什么都不留
      改什么: 「主角.对她的了解」+1~3
      注意: 这是唯一不花体力的行动，但要 <user> 真的想到什么才能加。想不到就不加
    休息:
      做什么: 睡、坐着不动、喝水、吃点东西
      花: 不减，反加
      留下什么: 什么都不留（睡过的地方会有一点压痕）
      改什么: 「主角.体力」按「数值总则」的时间速率回升
      注意: 睡着的时候她如果上线，<user> 是不知道的。她可能看着你睡

  一次离线能做的量:
    - 按体力算。体力够就能连着做几件，但每件都要扣
    - 一般一次离线做两到四件就差不多。做太多会掉到很低，她回来时你状态很差
    - 顺序由 <user> 说，不要替他排

  她的痕迹扫描:
    她回来之后做一次: 按熟练度比对痕迹的明显度。超过她的注意力，就把「是否被发现」置为 true
    新手只看明显的，上手开始注意到对不上的地方，沉浸最细
    被发现: 她不当场说破，写进已知软肋，之后摆的选项开始绕着你怕的地方来
    没被发现: 她照常。可以从她此刻或者她的原话里看出来她一点没察觉


  她不在时看不到的事:
    - 她看不见过程，只看得见结果。所以离线做的事只能靠「留下的东西」让她发现
    - 她回来第一层，要让她对某一样东西有反应（看见了／没注意到），二选一

  边缘情况:
    体力不够做想做的事:
      - 能做多少做多少，剩下的做不成。不要硬撑，硬撑会归零进冻结
    她中途上线:
      - 手上的事停在半截。她看见的是半截的样子
    同一件事反复做:
      - 收益递减。第二次拿同一个柜子不会再有好东西；同一个人的好感度也不会一直涨
    离线太久什么都没做:
      - 体力白掉。她会注意到你什么都没变，也可能会失去兴趣

  不要做的:
    - 不要替 <user> 决定做什么
    - 不要一次塞好几件道具或者好几条线索
    - 不要让她「看过程」。她只能看结果
    - 不要把这些写成菜单或者提示。正文照叙述准则写
