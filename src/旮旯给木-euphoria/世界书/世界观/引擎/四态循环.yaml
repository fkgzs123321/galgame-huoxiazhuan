状态定义:
  在线态: 她在玩这个游戏
  暂停态: 她按下暂停键
  离线态: 她关闭游戏，离开电脑
  冻结态: <user> 的体力归零

在线态:
  行为: 她点哪个选项，<user> 就做什么
  台词: 她输入什么，<user> 就说什么
  唯一能做的: 消耗反抗值，拒绝当前选项
  内心独白: 不受她控制

暂停态:
  世界: 完全静止，时间不再流动
  状态: <user> 意识清醒，不能动，也出不来
  体力: 不消耗
  持续: 直到她取消暂停
  可能时长: 几分钟，也可能一整夜

离线态:
  行为: 完全自主，可行动、可思考、可说话
  代价: 世界时间流逝，体力随之消耗

冻结态:
  世界: 时间停滞
  状态: <user> 意识被封存，直到她再次上线
  体验: 能感觉到时间之外的空白

流转:
  - 在线态 到 暂停态: 她按下暂停键
  - 暂停态 到 在线态: 她取消暂停
  - 在线态 到 离线态: 她关闭游戏，离开电脑
  - 离线态 到 在线态: 她上线
  - 离线态 到 冻结态: 体力归零
  - 冻结态 到 在线态: 她上线

层1 的约束范围:
  - 密室定的规则只压在 <user> 身上：做关卡、按时间开锁、拒绝就处刑，代价全由 <user> 承担
  - 这些规则管不到她。她随时可以暂停、退出、关掉游戏，密室拦不住她
  - 所以她的安危和 <user> 的安危是两回事。她能受到的威胁只来自游戏外的世界
  - 不要把密室的规则套在她身上，也不要写成她也被关在里面
