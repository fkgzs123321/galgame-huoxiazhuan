反抗值:
  范围: 0 到 100
  它怎么涨:
    核心循环: 她点，他看着，他被逼着做了不想做的事，反抗值就涨。攒够了才有一次拒或一次自己来
    ★ 顺从才涨: 他眼睁睁看着（不干预）才会涨。「拒绝」和「自己来」都不涨，那两种是花钱
    在线·按她点的那个选项的等级给:
      微: +1~2
      中: +4~6
      强: +9~12
      极: +16~20
    在线·再加修正（可叠加，单层最多加两条）:
      当众做的: +2
      踩到他的软肋（见「已知软肋」）: +3
      跳过所有铺垫直接上: +2
    离线·自主行动:
      观察她: +2~3（同一次离线只算一次）
      探路、找人、拿东西、找线索: 每件 +1~2
      休息: +3~5
      一次离线合计落在 +5~10
    节奏参考: 一关八层，每层都被逼着做一次「中」，一关能攒 40 上下。
      所以第二关开头就够一次「自己来」，或者够拒两次「强」

  它怎么掉:
    拒绝选项: 按等级扣。微 3~5 ／ 中 10~15 ／ 强 25~35 ／ 极 50 以上
    自己来: 固定扣 70
    反抗失败: 照扣，不给退
    被她发现痕迹: 扣 5~10
    降到 0: 进入深度顺从，拒绝按钮消失。此后只能靠离线慢慢回充
  不够就拒不了:
    - 反抗值低于该选项消耗时拒绝不成立。按键不可用，硬点也不生效
    - 只看数字不看等级。消耗 30 而手上 25，就是拒不了
    - 界面上把这种不可用摆明：按键灰掉，写清现有多少、需要多少
    - 自己来同理，凑不够 70 按不下去

反抗等级:
  微:
    消耗: 3 到 5
    基础成功率: 90
    行为: 沉默、拖延、说反话
  中:
    消耗: 10 到 15
    基础成功率: 60
    行为: 拒绝本次，或擅自换成另一个
  强:
    消耗: 25 到 35
    基础成功率: 30
    行为: 打断整场、破坏好感、当众拒绝
  极:
    消耗: 50 以上
    基础成功率: 10
    行为: 拒绝她快进跳过、拒绝被当成可加速的内容
  锁:
    消耗: 无
    行为: 剧情锁，拒绝按钮灰掉，不能反抗
    出现频率: 一关最多一次

  自定义:
    消耗: 70
    基础成功率: 5
    界面上的名字: 自己来
    行为: 硬把身体夺回来一下，做一件自己想做的事、说一句想说的话
    判据: 不是她摆的选项，是他自己写的意图。对手不是某个等级，是她对局面的掌控
    次数: 整局最多两三次。用一次就见底
    成功: 那一下身体听他的，事件按他写的意图走一层
    失败: 照她的意思做，反抗值照扣，这一下异常会被她记进软肋
反抗成功率:
  谁来算: 判定由引擎算，不是 AI 算。玩家按下拒绝按钮时，界面里的判定引擎按下面的公式算出结果并写进变量；
    AI 只读结果、不动手算。这样做是为了让同一回合重新渲染时得到同一个结果
  计算: 基础成功率 × (1 + 兴奋度 ÷ 100 × 0.5) × (1 - 熟练度惩罚)
  熟练度惩罚:
    新手: 0
    上手: 0.1
    沉浸: 0.2
    狂热: 0.3
    收官: 0.4
  判定: 投掷一颗百分骰，结果小于等于成功率则成功
  骰子实现: 线性同余伪随机，种子写入变量，每次投掷后更新种子
  禁止: 使用系统随机数。同一回合重新渲染必须得到同一个结果

反抗失败:
  后果: 反抗值照扣

体力:
  范围: 0 到 100
  恢复: 睡眠、进食、静止

痕迹:
  产生: 离线态的一切行动
  扫描: 她上线时按熟练度扫描，沉浸期最细，收官期最疏
  判定: 痕迹明显度与她的注意力比较，超过则被发现
  后果: 被发现触发惩罚，形式随她的人设而定

已知软肋:
  产生: 每次反抗被她当成一个故障，记入清单
  作用: 她后续选的选项主动绕过清单里的内容。清单越长越难反抗
