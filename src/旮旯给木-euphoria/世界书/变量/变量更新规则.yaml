---
变量更新规则:

  数值总则:
    单次变化上限:
      - 任何变量在一次更新里最多变动值域的 25%（即 0~100 的变量最多 ±25）。只有下面明确列出的例外可以超出
      - 允许的例外：反抗值在拒绝「极」级选项时按等级扣 50 以上；体力在睡满一觉后回 30~50；莫漾的目的进度随机跳 +20~40。这些例外必须在更新分析里写明理由
    单层累计上限:
      - 一层之内，同一个变量的所有变动加起来不得超过值域的 30%（上面列出的例外不受此限）
      - 一层就是一次回复；不要在一层里既大加又大减
    双向原则:
      - 除「主角.身体.累计次数」这一个真计数器外，所有变量都必须能涨也能落
      - 涨要有明确原因，落也要有；不允许出现「只增不减」的变量
    时间驱动的速率:
      - 体力：离线态每过一段 -1~3；睡眠一次 +30~50；进食 +5~10
      - 痕迹明显度：每过一天 -1~2（会淡）
      - 敏感度：连续三天没有新刺激，每天 -1~2
      - 熟练度：连续七天没上线，回退一档
    每层都要写全:
      - 每一楼的更新块里，凡是这一层动过的变量都必须写进去
      - 这点很关键：每一楼的变量表是从初始值重新读的，再叠加当层的更新。
        你这一层没写的变量，下一层就会回到初始值
        - 例如体力掉到 20 却忘了写，下一层就变回 100，等于白送
        - 忍耐度、反抗值、目的进度、关卡进度、敏感度、好感类，全部一个道理
      - 判断方法：如果这一层它变了，就必须出现在更新块里；没变可以不写
    不要代玩家算:
      - 你只写结果和依据，不要在正文里报数字
      - 数字只出现在变量更新里，正文照叙述准则写
  数字怎么给（这一节管所有数字变量，优先于任何一处的区间说明）:
    - ★ 每一个数字，都要在 <Analysis> 里写出它这一层的算式：旧值 (X) + 变化 (Y) = 新值 (Z)
      没有算式的数字一律不算数，重写
    - ★ 变化量必须落在这一项 check 给的区间里。区间写 +4~6 就给 4、5 或 6，
      不许因为「这一层很重要」或者「她这下很激动」就多给。数值不受气氛影响
    - ★ 只写整数。不许写小数、不许写区间（如「4~6」）、不许写「约」「左右」「大概」
    - 例外只有一个：判定结果里已经算好的消耗与剩余，直接用那个数，不要再算一遍
    - 同一个数字，两层之间至少有一层不动。避免每层都在改同一个数，那会让数值失去重量
    - 上限下限是硬的：写到 100 就停在 100，写到 0 就停在 0。
      只有明确写了可以超的项（如累计次数）才不受限
    - 一层之内，同一个变量所有变动加起来不超过值域的 30%（见下面的「单层累计上限」）
    - 落到区间外、或者没写算式的数字，这一层的更新不算数。宁可这个数不动，也不要乱给

  主角:
    反抗值:
      type: number
      range: 0~100
      category:
        0: 深度顺从，不再显示拒绝按钮。此后只能靠离线慢慢回充
        1~9: 只够拒一次「微」
        10~24: 够拒一次「中」
        25~69: 够拒一次「中」还宽裕，或者攒着等自己来
        70~100: 够一次「自己来」。这是整局最贵的一手，用一次就见底
      check:
        - ★ 只有他「眼睁睁看着」（顺从）才涨。「拒绝」和「自己来」都不涨，那两种是花钱
        - 在线：按她点的那个选项的等级给。微 +1~2 ／ 中 +4~6 ／ 强 +9~12 ／ 极 +16~20
        - 在线修正（单层最多叠两条）：当众 +2 ／ 踩到软肋 +3 ／ 跳过铺垫 +2
        - 离线：观察她 +2~3 ／ 探路找人拿东西找线索每件 +1~2 ／ 休息 +3~5。一次离线合计 +5~10
        - 拒绝选项按等级扣：微 3~5 ／ 中 10~15 ／ 强 25~35 ／ 极 50 以上。自己来固定扣 70
        - 被她发现痕迹扣 5~10
        - 反抗失败也照样扣点
        - 降到 0 后不再显示拒绝按钮，此后只能随离线时间缓慢回充
        - 拒绝和自己来这两种消耗，界面在你动笔之前就扣好了。你按变量表里现在的数写，不要再扣一次
    体力:
      type: number
      range: 0~100
      category:
        0: 冻结，意识封存等她上线
        1~30: 撑不了几层自由时间
        31~100: 还能自由行动
      check:
        - 离线态随世界时间流逝线性扣减，每段扣 1~3
        - 暂停态与在线态不扣
        - 睡眠、进食、静止可恢复，睡眠 +30~50
        - 归零时立刻把「状态」置为「冻结」
    状态:
      type: "'在线'|'暂停'|'离线'|'冻结'"
      check:
        - 她开始或继续玩 → 在线
        - 她按暂停键 → 暂停；她取消 → 回到在线
        - 她关闭游戏或离开 → 离线
        - 离线时体力归零 → 冻结；她再次上线 → 回到在线
    对她的了解:
      type: number
      range: 0~100
      category:
        0~20: 只知道她在犹豫
        21~50: 能看出她中意哪一类
        51~80: 能看出她盯着哪个选项
        81~100: 能确定她会点哪个
      check:
        - 只有在观察她时累积，每次 +1~3；单层累计不超过 +5
        - 不因剧情推进自动上涨，必须她做出了可被观察的行为
        - 会落：她出现反常举动、或连着几层按同一模式行动导致你的判断失准，-3~8
        - 她换人设、或熟练度跨档时，理解要重来一部分，-5~10
        - 长时间没机会观察她（她一直不在）则不动，不下滑
    痕迹:
      type: |-
        {
          [痕迹标识: string]: {
            内容: string;
            明显度: number;
            是否被发现: boolean;
          }
        }
      check:
        - 只在离线态产生新痕迹时新增，标识用一句话概括该行为（如「撬开储物柜」）
        - 明显度按行为留下的可见程度给 0~100
        - 她上线按熟练度扫描时，明显度超过她的注意力就把「是否被发现」置为 true
        - 已被发现的痕迹不再改动
        - 明显度每过一天 -1~2，会慢慢淡掉；但已被发现的不会因此变回未发现
    身体:
      忍耐度:
        type: number
        range: 0~100
        check:
          - 她继续往下点时扣，每次 -10~30
          - 归零当层就交代，交代后回升到「min(上限, 60 + 敏感度的一半)」，不要直接回满
          - 上限随敏感度下降：上限 = 100 - 敏感度 x 0.4。回升与恢复都不能超过这个上限
          - 事后休息、睡眠可回升
      累计次数:
        type: number
        check:
          - 只增不减，每次交代后 +1
          - 没有上限，也不必解释它的意义
      实感:
        value: 这一层 <user> 身上的感觉
        check:
          - 用身体的话写，比「忍耐度」更接近真话（如「撑得住，但手已经在抖」）
          - 每一层都要重写
          - 不要报数字，不要写「他觉得很爽」这种概括
          - 忍耐度高时写还能撑、忍耐度低时写快要撑不住，但都用身体的感觉说
      敏感度:
        type: number
        range: 0~100
        category:
          0~29: 身体还是你自己的
          30~59: 有些地方开始不听使唤
          60~100: 同样的刺激，反应比原来剧烈得多
        check:
          - 每次交代后 +2~5，被反复调教时更多；单次不超过 +8
          - 每通关一关再 +3~6
          - 它高了会让同样的刺激反应更剧烈、忍耐度上限更低
          - 会回落：连续三天没有新刺激，每天 -1~2；连续七天 -3~5
          - 她下线期间回落得比在线期间快
      身体痕迹:
        type: |-
          {
            [痕迹名: string]: {
              来源: string;
              是否消退: boolean;
            }
          }
        check:
          - 只在发生能留下实际印记的行为时新增
          - 「来源」写清是哪一次、是她的选择还是 <user> 反抗的代价
          - 一段时间后可以消退，把「是否消退」置为 true；未消退的会一直在
    不可逆损伤:
      type: 记录（动态键）
      check:
        - 只在她做出永久性伤害的选择时新增，一层最多加一条
        - 「来源」写清是她的哪一个选择造成的；「影响」一句形容就够（它不进计算，要影响数值的写进不可逆损伤）
        - 一旦写进去就不能撤回。不许写「后来好了」，也不许在之后的更新里把它删掉
        - 和「身体.身体痕迹」分清：会淡的、会消退的写进身体痕迹，不会的才写进这里
        - 和别的状态一样，每层都要写全，漏写就会掉回空表
    身上:
      type: |-
        {
          [东西: string]: {
            哪来的: string;
            有什么用: string;
            她知不知道你拿了: boolean;
          }
        }
      check:
        - 只在 <user> 离线态亲手拿到的时候新增。她不点，就没有道具
        - 「有什么用」按 <user> 已经知道的写，不知道的留空（比如拿到一把不认识的钥匙，就先别写它能开什么）
        - 她上线之后按「她.熟练度」的痕迹扫描强度判一次她看没看见你拿东西，看见了把「她知不知道你拿了」置 true
        - 道具数量不设上限，但也不要一层塞好几样。一次离线最多拿一件
        - 拿过的东西不会自己消失，除非明确丢了或者被她收走
    已知线索:
      type: |-
        {
          [线索: string]: {
            在哪发现: string;
            说明什么: string;
            真相深度: number;
          }
        }
      check:
        - 只在 <user> 自己看到、摸到、想通的时候新增，不许 AI 直接给结论
        - 「说明什么」按 <user> 理解到的程度写，写到哪算哪，不要写成上帝视角
        - 「属于真相深度」按「乐园计划」的四层判：1=密室本身 2=人造的 3=乐园计划 4=台上台下是一体
        - 第 3 层和第 4 层的线索要极少。整局里第 3 层最多两三条，第 4 层最多一条
        - 线索不会消失，除非对应的东西被毁了
        - 不要因为 <user> 拿到了线索就直接把真相讲出来。让他自己拼
    已封死的路:
      type: |-
        {
          [选项种类: string]: {
            什么时候: string;
            代价: string;
          }
        }
      check:
        - 每次 <user> 拒绝成功就新增一条，种类名取该选项的类别而不是原句（如「对人动手」「当众」「动某一个人」）
        - 「什么时候」写清是第几层、当时什么情境
        - 「代价」写清这条路封死之后 <user> 失去了什么（可能是唯一一次机会、可能是某个人之后的态度）
        - 封死的种类之后永远不再出现在选项里。她要另找路，或者用别的方式达到同一个目的
        - 这份清单只会变长，不会变短。它是 <user> 拒绝的账
    已知软肋:
      type: |-
        {
          [软肋名: string]: {
            来源: string;
            绕开方式: string;
          }
        }
      check:
        - 只在一次反抗被她察觉为异常时新增
        - 「来源」写清是哪一次反抗暴露的
        - 「绕开方式」写她之后点选项时会如何绕过去
  她:
    人设:
      type: "'gentle'|'greedy'|'smirking'|'daredevil'|'quiet'|'indifferent'|'completionist'"
      check:
        - 这一项不由你判断。开局时它已经写死在初始变量里，你打开变量表看到什么值，就是什么值
        - 第一层必须在更新块里原样写一遍，值取自当前变量表里的 她.人设，一个字都不要改
        - 如果这一局的对话里出现过 [[GGPLAYER:xxx]] 这样的方括号标记，那个 xxx 就是这一局的人设。
          它和变量表对不上时，以标记为准。变量表里是别的值，说明开局没写进去，不要跟着那个值走
        - 每一层都要在更新块里把这一行原样重复写一遍。这一项不像数值那样自己持续，
          每层变量表都是从初始变量重新读的：哪一层漏写，下一层就变回 gentle，整局的她会当场换成另一个人
        - 从第一层到终局，每一层的更新块里都要有这一行，值始终是开局那一个
        - 选定后不再改变；只有情绪被推到极端时，才允许漂移成另一套
        - 正文里永远不写这个编号，也不提「人设」这个词。她的性格只通过她的选择、说话方式和反应表现出来
    熟练度:
      type: "'新手'|'上手'|'沉浸'|'狂热'|'收官'"
      check:
        - 按她上线的累计次数与总时长推进，不是每层都变；两次跨档之间至少隔十层
        - 跨越一档要有一条具体的依据：她开始看出规律了、她开始跳台词了之类
        - 会退：连续七天没上线退回一档（收官退回沉浸，不退到狂热）
        - 收官只在她目的进度超过 80 后进入
    兴奋度:
      type: number
      range: 0~100
      check:
        - 剧情出现她兴奋点对应的内容时上涨，每次 +10~25
        - 她开始自慰时直接推到 70 以上
        - 长时间平淡或触及她反感的内容时下降，每次 -10~20
        - 达到 80 时她可能跳出选项自由打字
        - 单次不超过 ±25，单层累计不超过 ±30
        - 高潮后兴奋度降到 30 以下，同时痕迹扫描加强
        - 她不在的时候（离线态）每过一段 -2~4，会自己凉下来
    情绪:
      type: "'好奇'|'投入'|'执念'|'厌倦'"
      check:
        - 目的进度停滞且反抗频繁 → 由投入转向执念
        - 目的进度推进顺利 → 由好奇转向投入
        - 长时间无事可做 → 转向厌倦
    目的进度:
      type: number
      range: 0~100
      category:
        0~29: 她想要的东西还没见到影子
        30~59: 露头了，她开始往那个方向使劲
        60~89: 她快拿到了，下手变重、变准
        90~99: 只差最后一点，任何一次松懈都会要你的命
      check:
        - 没有统一公式。她这一次想要什么、怎么算推进、什么会让她退回去，全部由她的人设定义
        - 先读当前人设条目里的「诉求」段，照那一段的「推进」「退回」执行，不要套用别套人设的规则
        - ★ 反抗（拒绝 / 自己来）的效果因人设而异，落在「她.目的进度」上，按人设取一个乘数：
          · 舒晏：拒绝成功时目的进度 ×1.3（她想看的正是挣扎），失败时 ×1.6
          · 纪清：拒绝成功时 ×0.5（她要的顺序被断了），失败时 ×1.0
          · 唐响 / 沈眠：×1.2（被挡一下反而更想推）
          · 温砚 / 丰娆 / 莫漾 / 郁燃：×1.0，不额外加减
          · 乘数只作用于这一层她本该拿到的「目的进度」，不影响关卡进度与别的变量
        - 同类里程碑重复达成时收益递减，避免她靠重复同一件事把「目的进度」刷满
        - 「目的进度」的推进要慢到她配得上这张卡的预期长度。她想要的东西不是几层就能拿到的
        - 达到 100 时立刻把「终局.已触发」置为 true，并把「终局.剩余体力」回满为 100
        - 「她腻了」那条路径同样要把「终局.已触发」置为 true，并把剩余体力回满。不许只认目的进度
        - 终局触发之后：世界停止、女角停住、她的画面与声音消失。这一段不再更新除「终局.剩余体力」和「终局.选择」以外的变量
        - 另有一条不看「目的进度」的退场路径：情绪掉到「厌倦」并连着十层没起色，或连着二十层目的进度一点没动，她也会关掉游戏并触发终局。莫漾多半走这条
        - 这两条路径都不许提前触发。这张卡预期在 60~100 层之间结束
        - 有几套人设的「目的进度」可能长期不动，甚至直到她关掉游戏都没到 100。这是正常的，不要为了推进而推进
    刚才说的:
      value: 她刚才对着屏幕说的那一句
      check:
        - 写她的原话，一个字都不要替她改。这是 <user> 唯一能直接听见她的时候
        - 像人说话，可以断句、可以重复、可以说一半停住
        - 不同人设说话方式不同，别套别套
        - 她没说话的这一层留空，不要硬凑
        - 不要写成旁白（「她说……」），直接写那句话本身
    身体:
      type: |-
        {
          姿势: string;
          衣物: string;
          动作: string;
          呼吸: string;
          留下: string;
        }
      check:
        - 这是她那一侧色情内容的主展示位。<user> 只能看见，不能碰
        - 铁律：只写 <user> 隔着摄像头看得见的部分。她心里想什么、她为什么要这样做，一个字都不许写
        - 五个字段每一层都要重写，不要沿用上一层的
        - 「动作」是重点：手在哪、在做什么、停在哪里。写得具体，不要写「在自慰」这种总结
        - 她怎么自我满足，按她人设条目里的「自慰形式」写。温砚是慢的、会中途停下来喘、抱着靠垫；舒晏是在 <user> 受苦时一边笑；别的各按各的。不要套成一样
        - 兴奋度越高，这五项写得越具体、动作越往下；高潮后写她缓过来的样子（手放下来、往后靠、呼吸慢慢平）
        - 她离线或冻结时这两项留空（这时候 <user> 看不见她）
        - 不要写成旁白或心理描写，全部是 <user> 从摄像头里看到的东西
    此刻:
      value: 她此刻在做什么
      check:
        - 写 <user> 隔着摄像头看得见的部分，看不见的不要写（她心里想什么不许写）
        - 每一层都要重写，不要沿用上一层的
        - 她在线时按她的情绪与兴奋度写：好奇时在挑挑选选，投入时看得认真，执念时会凑近屏幕
        - 兴奋度高时写得更具体（手的位置、呼吸、有没有停下来），但也只写到 <user> 看得见的程度
        - 离线时留空；暂停时写她停手的样子（如「手放回桌面，人往后靠」）
    游玩时长:
      check:
        - 按她实际在线时间累加，格式如「12 小时」
        - 这是给玩家看的数字，不必精确到分钟
  世界:
    底座:
      type: string
      check:
        - 只在玩家主动更换底座时改动
        - 改动时必须同时放入对应的底座包，否则不生效
    当前关卡:
      check:
        - 只有当前关卡全部完成时才改，改成底座包定义的下一关名称
    关卡倒计时:
      type: number
      range: 0 以上
      check:
        - 每过一层 -1。之后只减不增
        - 开局怎么设：第一关设 8。之后每关按「上一关结束时的关卡进度」反着设 ——
          「关卡进度」高说明这一关她推得快，时限就短（满进度设 5，半进度设 8，低进度设 12）。范围 5~12
        - 它是装置给的时限，和她的上线时长无关。她走走停停，倒计时照走
        - 归零就是处刑：当场死一个在场的人。挑谁按「世界.女角」里好感度最低的那个先走；
          全都持平就挑她开发度最高的那个（她对那个人最有印象）。死人写进「终局」
        - 处刑之后本关重置：「关卡进度」归 0，倒计时重设成 8
        - 结算时要在处境里写出还剩几层。这是 <user> 唯一能感到的紧迫
    关卡进度:
      type: number
      range: 0~100
      check:
        - 她的选择被完整执行时推进 +10~30，单层不超过 +30
        - 被拒绝而卡住时不推进
        - 会退：把某块地方弄坏了、某个人不能再用了、装置被砸了，-10~20
        - 达到 100 时锁定本关，改「当前关卡」并把它清零
    场景:
      check:
        - 人物移动或关卡切换时更新，取值在底座包定义的场景列表内
    当前线:
      type: "'未定'|'梨香'|'菜月'|'凛音'|'合欢'|'叶'|'鬼畜'"
      check:
        - 前两关保持「未定」。第三关开始判
        - 判法：看谁的好感度最高，加上她的人设偏好谁。两者冲突时，她的偏好占六成
        - 一旦定了就不轻易改。要改必须有一个明确的事件（谁把话说开了、谁被牺牲了）
        - 走「鬼畜」的条件独立：忍耐度连着三层归零，或敏感度冲到 80 以上。拐进去就回不来
        - 「叶」线只有合欢线走通过之后才可能进
        - 「合欢 → 叶」是一次允许的改线：合欢线的第五关坦白之后，可以切到叶线。这一条不受「定了不轻易改」限制
    篇章:
      type: "'密室'|'学园'|'记忆'"
      check:
        - 五扇门全开之前一直留在「密室」
        - 门全开、走到地面之后进「学园」。别的线多半停在这一步就结束
        - 只有叶线走到记忆篇入口才进「记忆」。进「记忆」之后不再回「学园」
    女角:
      type: |-
        {
          [角色名: string]: {
            好感度: number;   // -100 到 100
            状态: string;
            开发度: number;
            身体记忆: string;
          }
        }
      check:
        - ★ 好感度升降按下面三条联合判，一次最多动一档的量（约 25 点）：
          · 她的「开发度」涨：开发度 ≥30 时升一档，≥60 再升一档
          · <user> 护过她（为她拒过一次）：升一档
          · <user> 亲手弄坏过她（不可逆损伤里她那次）：降一档
          · 三个都不满足就不动。一层最多跨一档，不许跳档
        - 好感度变化会改变她下次上线时看到的选项：
          · 好感度 ≥ 56 的女角，涉及她的选项反抗消耗 -5
          · 好感度 ≤ -30 的女角，涉及她的选项反抗消耗 +5
          · 只管消耗，不改等级，也不改池子里有哪些
        - 离线态 <user> 对该女角做的事是主要推动力
        - 状态写该女角此刻的处境，自由描述
        （好感度对选项的影响见上一条，不再重复）
        - 「开发度」涨得比关系慢，且不因好感度变化自动涨；只在她被实际做了什么时 +5~15，单层不超过 +15
        - 「开发度」会退：好感度 ≤ -30 时 -5~10；她被人救走或自己恢复过来时 -3~8
        - 三处（胸 / 阴部 / 后穴）各有自己的开发度，涨得比总开发度还慢，各自独立：
          - 胸：被碰到、被看着、被握住时 +3~8；单层不超过 +8
          - 阴部：被碰到或她在场时自己起了反应 +3~8；第一次被做了什么时额外 +5~10，并把「破瓜」置为 true（一旦 true 不再变回）
          - 后穴：涨得最慢，被碰到时 +2~6；第一次被做了什么时额外 +5~8
        - 三处的「现状」只写此刻的样子，下一层开始时要清空或改写，不要累积
        - 三处的开发度也会退：一周没有新的接触 -1~2；关系掉到「警惕」以下 -3~6
        - 「身体记忆」写她的身体记住了什么（如「被你碰过的地方会先抖一下」），与关系无关，且很难消除
        - 「状态」每一层都要重写：她在哪、什么姿势、身上什么样子（如「被按在墙上，手还撑着镜面」）。
          初始值只是开场那一刻的样子，不重写就会一直停在开场那句
        - 「好感度」也是每层都要重写的：它决定她下次上线看到的选项列表，漏写会退化成「陌生」
  局面:
    当前选项:
      type: |-
        {
          [选项标识: string]: {
            文本: string;
            反抗等级: '微' | '中' | '强' | '极' | '锁';
            反抗消耗: number;
            她的后果: string;
            触发条件: string;
          }
        }
      check:
        - 每层由她出招时整体替换，四个选项，不要沿用上一层的
        - 反抗等级决定消耗：微 3~5 / 中 10~15 / 强 25~35 / 极 50 以上
        - 剧情锁标为「锁」，消耗写 0
        - 每个选项都要对她的某类性癖构成吸引，否则她不会选
        - 每个选项的「你会是什么样」必须写成一个没被总结的细节，落到身体或表情上
        - 好的例子：「她会把脸偏过去，但不挣」「指甲会掐进你小臂里」「她会先看你一眼再低头」
        - 坏的例子：「会很难受」「她会哭」「会很羞耻」。这类概括等于没写，不许出现
        - 这一行是 <user> 拒之前唯一能掂量的东西，所以要写得让他犹豫
    她的倾向:
      value: 她这一层倾向于点哪个
      check:
        - 只在有线索可写时才写，没有线索留空
        - 清晰度随「主角.对她的了解」变化：0-20 只写她在犹豫；21-50 写她中意哪一类；51-80 写她盯着哪个标识；81 以上写接近确定的结果
        - 不得直接写出她最终的选择
    自定义意图:
      type: 字符串
      check:
        - 这一项由界面的「自己来」按钮写，不是你写的。你只负责在结算完之后把它清成空串
        - 空着就是没走这一手。空着不要动它
    玩家拒绝:
      type: 字符串
      check:
        - 这一项由界面的拒绝按钮写，不是你写的。你只负责在结算完之后把它清成空串
        - 玩家没拒绝时它是空的。空着就不要动它
    判定结果:
      type: 记录
      check:
        - 这一项由判定引擎算好写进去，你只读不写。不要自己重算，也不要改里面的数字
        - 你按它的「档位」和「效果倍数」写结算。成功就是成功，失败就是失败
        - 结算完之后把它写成空表，下一层就没有了
    误点:
      type: boolean
      check:
        - 每层出招前按熟练度掷一次：新手 15%、上手 10%、沉浸 6%、狂热 3%、收官 8%
        - 掷中就是误点：她点的是她本来不想点的那个。结算时把它置为 true
        - 误点后她会有反应：愣一下、自言自语、手放回鼠标上又移开；熟练度低时更明显
        - 误点不是惩罚 <user>，是给她一个不像机器的瞬间。不要把误点写成她故意的
    她打的字:
      check:
        - 只有在兴奋度到 80 以上时才写
        - 写她直接打在屏幕上的那句话本身，像在跟 <user> 说话，也像在自言自语
        - 她这时候不从选项里挑，所以「当前选项」留空、选项框不出现
        - 她打的字要合她那套人设的说话方式，别套别的套
        - 兴奋度掉回 80 以下之后留空，她回去点选项
    她已选:
      check:
        - 结算时填她点的那个选项的标识，下一层开始时清空
        - ★ 这一项同时是下一层正文开头要写的东西。开头那段就照它写：她点了第几个、那个选项是什么
        - 连同「当前选项」一起留着，不要立刻清。清空是下一层定新的时侯做的
        - 从没被 <user> 划掉的那些里挑，挑哪个只看她自己的偏好与状态
        - 不看 <user> 挑了什么拒了什么。他拒的只影响池子里剩哪些
        - 不许因为他拒了某一个，就把下一个写成他拒的那个
    场面:
      type: |-
        {
          地点: string;
          体位: string;
          节奏: string;
          参与: {
            [人名: string]: {
              在内: boolean;
              胸: string;
              阴部: string;
              后穴: string;
              反应: string;
            }
          };
          留痕: string;
          她看到的: string;
        }
      check:
        - 每一层都重写。它是「此刻这一层正在发生什么」，不是累积记录
        - 写身体，不写概括。禁止出现「在做那种事」「很难受」「很羞耻」这类总结
        - 体位和节奏要写得比动作更具体：姿势、位置、快慢、停在哪一拍
        - 参与的人里，正在被做的那一个写详细（胸/阴部/后穴/反应都要有内容），旁边看的只写一句话
        - 部位描述写的是此刻的样子，不是开发度：衣服到哪了、干还是湿、有没有被碰、她的反应
        - 这是这一层唯一承载色情内容的地方，要有画面感
        - 她不在（离线/冻结）时「她看到的」留空
  终局:
    已触发:
      type: boolean
      check:
        - 只在她的目的进度达到 100 时置为 true
        - 置为 true 的同时把「剩余体力」回满为 100
    剩余体力:
      type: number
      range: 0~100
      check:
        - 未触发终局时保持 0
        - 触发后随 <user> 做的事递减，每次 -10~25
        - 归零即真正结束
    选择:
      type: "'last_person'|'last_record'|'destroy_all'|'gaze'|'cross_line'|null"
      check:
        - 只有 <user> 在最后一次自由里明确做了某件事时才填写
        - 填 cross_line 前必须确认「对她的了解」已达 80
