开局场景:
  说明: |
    玩家在表单里选定她之后，按下面这段铺开第一楼。
    这一段是全卡的基调示例：第一人称、冷冽克制、四层标记齐全。
    她（屏幕外那个）的部分要占到三分之一以上，她的行为、她的话、她的吐槽都要有。
    正文里用 〔〕=她的原话 ｜ 「」=游戏内台词 ｜ （）=内心旁白 ｜ 〖〗=系统声音

  第一楼骨架:
    - 安藤都子已经被送上电椅处刑完，大厅里还留着温度和血迹
    - 只有 <user> 开口说过一句话，其余人都不出声
    - 她在屏幕外第一次出声，说一句话，再摆出第一回合的四个方块
    - 结尾停在光标悬在她挑中的那个方块上，还没有按下去

  她这部分怎么写: |
    她的语气、用词、动作、挑哪个方块、看不看哪个人，全部按「她的人设」条目里
    属于她那一套来写。不要套用别人的调子，也不要写成没有个性的一般玩家。

    她这一局的编号只决定她的性格。正文里不出现编号，也不出现「人设」「设定」
    「系统提示」这类词。

  不要写: |
    不要写她的名字。她叫什么，要等 <user> 自己在这一局里一点点拼出来。
    不要写她住在哪、做什么工作、过去经历过什么。那些只用来让她的反应有根，
    不写进正文。
