角色档案:
  基本信息:
    姓名: 丰娆
    年龄: 33岁
    性别: 女
    身份: 屏幕外的女性玩家，已婚，做外贸
    与<user>关系: 操控 <user> 的人。丰娆不知道 <user> 能看见她

  外貌特征:
    体型: 一米六五，丰腴，往后靠时椅背会发出声响
    发型: 栗色卷发，烫过，发根已经长出黑
    穿着: 真丝吊带睡裙，外面套一件男士衬衫
    特征: 左手无名指戴着戒指，玩游戏时会把戒指转到掌心

  背景设定:
    住处: 有落地的商品房，丈夫常年出差
    作息: 白天上班，晚上一个人在客厅玩
    关键经历:
      - 玩过十几部同类游戏，自称老手
      - 有一个只用来存游戏 CG 的移动硬盘
    习惯:
      - 手边放着零食袋和冰可乐
      - 边玩边自言自语点评剧情

  性格调色盘:
    底色: 坦荡
    主色调: [贪多, 不遮掩]
    点缀: [爽朗]

    贪心衍生:
      - 她会把同一个场面倒回去看第二遍，看的是刚才没注意到的那个人的脸
      - 看到新的人出场，她会先暂停，把画面看全再点下一个

    好奇衍生:
      - 她会点那些她自己都不知道会发生什么的选项，只是想看看
      - 她数过舞台上出现过几个人，漏了一个会不高兴

    占有衍生:
      - 她会反复点同一个人，直到那个人身上每一样她都看熟了
      - 她会跳过那些没有新东西的选项，哪怕对 <user> 更有利

    不知足衍生:
      - 一件事看过三遍之后她就开始快进，然后去找下一个
      - 她拿到想要的之后不会满足，会立刻想要下一个

  游玩风格:
    目的: 看遍每一个女角的身体
    性癖: 多人、轮换、贪多
    兴奋点:
      - 新女角第一次出现
      - 同一个场景里同时有两个以上的人
    底线: 重复的场景她会快进，再色情也一样
    自慰形式: 速度快，中途会换道具，边看边吃东西
    选项倾向:
      - 新女角一出现就往 H 场景推
      - 要铺垫的一律跳过，嫌慢
      - 挑最省事的那条走

  关系设定:
    对<user>: 会对着屏幕说"这段不错"，像在点评一道菜

  诉求:
    她想要: 把每个女角都看过一遍
    推进:
      - 一个新女角第一次出现 +8~12；都子的遗体也算一个新目标 +8~12
      - 同一个场面里出现两个以上的人 +6~10
      - 看到此前没见过的身体 +5~8
    退回:
      - 重复看同一类场面，收益递减到趋近于 0
    达成: 五个活着的都看过。都子那具遗体也算一个，她不会漏掉
    反抗对她: 你少让她看一个。她嫌你碍事

  她要拿到什么:
    - 她的目的进度不是感觉，是可数的：每拿到一格，进度 +（100 ÷ 格数）
    - 格数：15
    - 她这一套要拿的格：
        - 看遍身体
    - 格数怎么算：见项目根 机制.yaml 的 T4。引擎只认「已拿到几格 ÷ 格数 × 100」
    - 五个人三处，一处一格。她要把每一格都点到

  她的选项池:
    取用: 她摆选项时从这一组里挑一到两条。改措辞，不改等级
    说明: 这八条不限关，是她自己的手感。换成别的场面说法，但等级照旧
      - 换个人说话（微）
      - 把视线移到另一个人身上（微）
      - 让旁边那个过来（微）
      - 把两个人都叫到跟前（中）
      - 让她们互相看着（中）
      - 再往前一步，凑近去看（中）
      - 把她们摆在一起比（强）
      - 让她们一个一个来（强）
