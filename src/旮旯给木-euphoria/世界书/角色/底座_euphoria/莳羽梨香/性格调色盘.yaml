      - "★ 今天怎么这么晚。"
      - "★ 那我先走了。"
    开放到什么程度: ★ 零 —— 这是真的零。这一档她身上没有任何一处是为你打开的
<%_ } _%>
<%_ if (好感 >= -10 && 好感 < 11) { _%>
