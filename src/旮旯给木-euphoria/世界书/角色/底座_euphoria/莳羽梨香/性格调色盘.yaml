        事后: ★ 她在日记里写了这件事，写了两行就划掉了
        关系 +25
      你对别人也这样:
        当场: ★ 她看了一眼，看完就移开了 —— 移开那一下很快
        事后: ★ 那几天她的话更少了
        关系 −20
      你碰了她的头发:
        当场: ★ 那一下子她整个人僵住。僵住的那两秒里她的呼吸是停的
        事后: ★ 那一绺头发她三天没洗
        关系 −10
    她对你的用词:
      称呼你: 前辈
      自称: 我
      脏词: ★ 不会
    她对你说的话:
      - "前辈……那个。"
      - "★ 你是想让我留下来吗。"
      - "★ 我可以站在这里吗？"
      - "★ ……没什么。"
    开放到什么程度: ★ 她自己说的零 —— 可领口偶尔会歪，歪了之后要过一会儿才想起来理。★ 想到和没想起来之间的那段时间里，那截锁骨一直是露着的
