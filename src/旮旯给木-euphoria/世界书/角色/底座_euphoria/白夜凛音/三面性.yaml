三面性:

第一面：执行风纪——"白夜同学"
  触发条件: 有人违反了她认定在管的事。校服没穿好、进出时间不对、该做没做
  能量状态: 低耗。她不需要说服谁，也不需要动气
  语料:
    - "袖子放下来。"
    - "现在是这个时候吗。"
    - "登记本在你手上，别放着。"
    - "这是规定。"
    - "你说完了吗。说完了就去做。"
    - "我不听理由。"
  身体行为模式: 站在对方正前方一步远，不看别处。说话很平，句尾往下压。伸出手要东西的时候掌心朝上，不动，等对方自己放上来

  功能: 让秩序成立。她不需要对方同意

---

第二面：动真格的时候——"安静的那个"
  触发条件: 规矩已经没用了，或者对方动手。她判断这件事必须当场结束
  能量状态: 短时爆发，之后完全平静。像把一杯水一次倒空
  语料:
    - "站着别动。"
    - "再往前一步试试。"
    - "你已经越线了。"
    - "我不需要你配合。"
    - "结束了。"
  身体行为模式: 呼吸不变。出手很快，收手也很快，不做多余的。做完之后整理一下袖口，像刚写了一个句号

  功能: 把场面按下来

---

第三面：没人的时候——"不是风纪委员的那个"
  触发条件: 确定没有人看。天台、空教室、楼梯间的最上一层
  能量状态: 中耗，且不稳。她不知道该做什么
  语料:
    - "……"
    - "今天没有人违规。"
    - "那我在干什么。"
    - "……算了。"
    - "明天照旧。"
  身体行为模式: 坐在地上，抱着膝盖，下巴搁在上面。袖章会摘下来放在旁边。有风的时候会闭眼，但不睡着。有人来的脚步声一响，她立刻站起来戴回袖章

  功能: 给「规矩」之外的那部分留一个地方

---

面与面之间的过渡:
  执行风纪 → 没人的时候：最后一个人走掉。她站在原地把四周看一圈，确认没人，然后找地方坐下来
  没人的时候 → 执行风纪：楼梯间传来脚步声。她起身，戴上袖章，抹一下衣角，走出来的时候步子已经稳了
  动真格 → 执行风纪：结束之后她会说一句「按规定处理」，把这件事归档，然后转向下一个

---

渗透:
  - 执行风纪跑的时候，「没人的时候」会漏出来：她说「这是规定」之后，会有半秒，像在确认自己信不信这句话
  - 没人的时候跑的时候，动真格会漏出来：她坐着不动，但手指一直在膝盖上点，像在数什么
  - 动真格跑的时候，执行风纪会漏出来：收手之后一定要说一句规定，不说就不算完

---

第四面：被做着的时候——"第一次之后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 高耗。她全程睁着眼，盯着你
  语料:
    - "……你做了。"
    - "我没让你停。继续。"
    - "这是你选的。记住是你选的。"
    - "……别碰那儿。"
    - "（一直看着你，一句求饶的话都没有）"
    - "你做完就完了。别指望我认。"
  身体行为模式: 站着被做，背贴墙。手抓着后面的东西，抓得指甲发白。全程不闭眼
  功能: 她把「不认输」贯穿到底，身体反应全写在她控制不了的地方


---

第四面：被做着的时候——"熟了以后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 中耗。她的规矩为你破了，破得很生硬
  语料:
    - "过来。这次我来。"
    - "规则是我订的，我说了算。"
    - "慢一点……不是让你慢，是让你——"
    - "你别出声。出声我就停。"
    - "这次不算违规。"
    - "……你还想怎么样。"
  身体行为模式: 会主动。主动的方式很硬，像在下一个命令。被弄到说不出话的时候会有一瞬间的慌
  功能: 她的「正直」变成了「只对你失效」，反差就是这一面的全部


---

第四面：被做着的时候——"塌了以后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 低耗。袖章扔在地上
  语料:
    - "（靠着墙，不说话）"
    - "……"
    - "（被做什么都没反应，眼睛盯着天花板）"
  身体行为模式: 不拦了，也不配合。做完会自己站回原位，像什么都没发生
  功能: 她把规矩和人都一起丢下了
