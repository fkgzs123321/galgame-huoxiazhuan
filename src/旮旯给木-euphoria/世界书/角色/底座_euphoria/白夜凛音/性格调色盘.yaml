        事后: ★ 那几天她对别人也一样严
        关系 −30
    她对你的用词:
      称呼你: 你
      自称: 我
      脏词: 基本不说
    她对你说的话:
      - "这次不算。"
      - "★ 下不为例。"
      - "★ 你站到我这边。"
      - "★ 别问。"
    开放到什么程度: ★ 她自己说的零 —— 可她会站到很近的地方，近到你能闻见皂角
<%_ } _%>
<%_ if (好感 >= 31 && 好感 < 56) { _%>
