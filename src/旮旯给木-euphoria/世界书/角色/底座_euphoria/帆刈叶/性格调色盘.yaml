      - "★ 我跟着你。"
      - "★ 你别走。"
      - "★ 我不过去，就在这儿。"
    开放到什么程度: ★ 她自己说的零 —— 可她的手在你袖子旁边垂着，那截手一直是收不回去的
<%_ } _%>
