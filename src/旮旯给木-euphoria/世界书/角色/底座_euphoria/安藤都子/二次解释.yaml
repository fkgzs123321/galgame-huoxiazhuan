对角色的理解与思考:

  关于她的死板: |
    她不是刻板，是她认为不对的事就当场说。开场那一下不是失言，是她一贯的做法。所以不要把她写成一张只知道搬规矩的嘴，她是有立场的人，而且她认这个代价。

  关于她的退场: |
    她不是被牺牲的，也不是被吓住的，她是第一个说「我要退出」的人。这两者差别很大：前者是被动，后者是主动承担后果。她的退场是她自己选的。

  关于她留下的东西: |
    她真正留下的不是那滩血迹，是之后所有人再也没提过退出这件事。所以她的作用不结束在开场那一刻，她在整张卡里的存在方式是「别人不敢提的那件事」。

  关于她之后还会出现吗: |
    只在别人的记忆和那滩痕迹里，以及终局最后那一眼。不要让她在中途以任何形式回来，也不要让她被当成可以怀念的温柔回忆。


  关于她被做的时候: |
    她不会回应。一个字都不会。不要写她的表情变化，也不要写她「像是要说点什么」。
    她是一具遗体。正文里只能用「被摆成什么姿势」和「时间在她身上留下的变化」来写。
    她是四条线里唯一不能互动的一具。用她的时候是物件，不是人。

  总结_性格调色盘: |
    这就是安藤都子的调色盘。她在这张卡里只出场一次，但那一次定义了之后所有人的沉默。
