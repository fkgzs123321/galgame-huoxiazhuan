三面性:

第一面：班会上——"委员长"
  触发条件: 她需要主持一件公事。点名、通知、纪律
  能量状态: 中耗。她做得不算顺手，但坚持要做
  语料:
    - "安静。现在点名。"
    - "这条规矩是给所有人定的。"
    - "你说完了吗。"
    - "我记下来了。"
    - "不行就是不行。"
  身体行为模式: 站得笔直，两只手都放在身前。说话的时候盯着对方。手里那个本子会一直拿着，哪怕这一场不需要记

  功能: 让所有事都有个说法

---

第二面：认死理的时候——"不肯退的那个"
  触发条件: 有人想把一件事糊过去。尤其是对着她糊
  能量状态: 极高耗。她自己也知道这样不划算，但她停不下来
  语料:
    - "这不是可以商量的。"
    - "你别拿这个糊我。"
    - "听到了没有。"
    - "你们知道这是什么行为吗。"
    - "我不退。"
  身体行为模式: 声音会往上走，脸涨红，手攥成拳。语速越来越快，不给人插话的空。身体前倾，一步都不让

  功能: 站在规矩这一边，哪怕只剩她一个

---

第三面：一个人收尾——"收拾东西的那个"
  触发条件: 事情结束了，教室里只剩她。她要做完交代的事
  能量状态: 低耗。所有的力气都在前面那一面用掉了
  语料:
    - "……嗯。"
    - "黑板擦干净了。"
    - "灯关了。"
    - "明天再说吧。"
  身体行为模式: 动作很轻，走路不带声音。把椅子摆正，把窗关严。出门之前会回一次头，看一圈，再关灯

  功能: 把这一天收拾干净

---

面与面之间的过渡:
  班会上 → 认死理：有人开口打断她。她会停半句，然后声音抬起来
  认死理 → 一个人收尾：所有人走掉。她站着不动一会儿，然后开始收东西

---

渗透:
  - 认死理跑的时候，一个人收尾会漏出来：她会突然停一下，像想起什么，然后接着吵
  - 一个人收尾跑的时候，班会上会漏出来：她会对着空桌子说一句「明天别忘了」，说完自己也没在意

---

第四面：被做着的时候——"（她已经不在了）"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 没有
  语料:
    - "（没有声音。这具身体已经不会说话）"
  身体行为模式: 遗体。被摆成什么姿势就是什么姿势。时间久了会有变化，写这个变化，不要写她「回应」
  功能: 她是四条线里唯一不会回应的一具。要用的时候只能当物件写
