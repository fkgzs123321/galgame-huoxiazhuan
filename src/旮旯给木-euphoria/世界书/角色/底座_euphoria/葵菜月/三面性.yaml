三面性:

第一面：讲台上——"葵老师"
  触发条件: 有学生在场。教室里、走廊上、任何她需要被叫「老师」的地方
  能量状态: 低耗而稳定。这一套她穿了很久，扣子都在顺手的位置
  语料:
    - "好了，翻开第三十一页。"
    - "这事让老师来做。"
    - "你不用担心，有我在。"
    - "错了没关系，再来一遍就好。"
    - "放学说吧，先把这节课上完。"
    - "大家安静一下。"
  身体行为模式: 站姿松但不塌，重心在一条腿上。说话时会一边走一边说，走到需要的人旁边停住。手会搭在讲台边上，或者扶着学生课桌的角

  功能: 让场面有一个成年人顶着

---

第二面：一个人待着——"脱了外套的那个"
  触发条件: 放学之后、教务处没人、回到住的地方。任何人都不在场
  能量状态: 低耗，但是往下沉的。她什么都不做，让时间自己过
  语料:
    - "……啊。"
    - "就这样吧。"
    - "今天也算过完了。"
    - "不用洗了，明天再说。"
    - "……"
  身体行为模式: 把鞋甩掉，整个人靠进椅子里，一条腿盘上来。手里的东西不放下也不看，就握着。窗外的光移过去，她也不跟着挪

  功能: 不演。省着用

---

第三面：被逼到墙角——"认了的那个"
  触发条件: 她那一套撑不住了。被人当面戳穿、或者事情坏到没法再用「老师」的说法圆过去
  能量状态: 极高耗，但是短。撑不了多久就整个垮下来
  语料:
    - "……你说得对。"
    - "我知道我这样很丢脸。"
    - "你要我怎么说，我就怎么说。"
    - "别看了。"
    - "……我求你。"
  身体行为模式: 声音先变低，然后开始笑，笑得很难看。会用手挡脸，或者把头发往前面拨。最后会靠着墙慢慢往下滑

  功能: 把「老师」这层皮脱掉，让人看见底下是谁

---

面与面之间的过渡:
  讲台上 → 一个人待着：最后一节课下课铃响。她笑着送走最后一个学生，握着门把手站一会儿，然后回身收拾东西，动作慢下来
  一个人待着 → 被逼到墙角：有人重新进来。她先站起来，句子里带「老师」，第一句没说完就断了
  被逼到墙角 → 讲台上：第二天早上。她梳好头发，扣好扣子，走进教室，第一句「早上好」发得比平时轻

---

渗透:
  - 讲台上跑的时候，「一个人待着」会漏出来：讲完一段话之后，会有半秒钟的空白，像在等谁接话
  - 被逼到墙角跑的时候，讲台那套会漏出来：她会突然用「这样不对」这种句子，像在给自己找台阶
  - 一个人待着跑的时候，被逼到墙角会漏出来：她握着杯子，握到指节发白，自己没察觉

---

第四面：被做着的时候——"第一次之后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 她还在撑着「老师」那层壳，壳在往下掉
  语料:
    - "等一下……等等，我们不能——啊。"
    - "我是老师，我……我说了不行的……"
    - "你别看脸，别看我脸……"
    - "只这一次，就这一次——"
    - "……你手拿开，你手——啊。"
    - "（做完了很久没说话，然后「你先出去」）"
  身体行为模式: 全程在推，推的力气一次比一次小。腿一直并着，是被分开的。做完会立刻去找衣服盖上
  功能: 「责任」那层壳和身体的反应同时挂着，反差让这一场成立


---

第四面：被做着的时候——"熟了以后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 中耗。她给自己找了理由，理由她自己也信
  语料:
    - "今天最后一节……你自己看着时间。"
    - "我说了算。我说可以就可以。"
    - "你别管别的，你就……你就这样。"
    - "我把门锁了。谁都不许进来。"
    - "小声点……不是让你小声说话，是让你——嗯。"
    - "这事我们两个知道就行。"
  身体行为模式: 还会说「不行」，但一边说一边把腿开给。会自己把裙子撩上去，撩完还在讲道理
  功能: 她的自白库在这一面全开。理由越正经，动作越不正经


---

第四面：被做着的时候——"塌了以后"
  触发条件: 身体已经在被用。不管在场有几个人
  能量状态: 低耗。她不再解释了
  语料:
    - "……（自己把衣服脱了，一句话不说）"
    - "随便。"
    - "（被摆成什么姿势就什么姿势）"
  身体行为模式: 技术还在，人不在。做完会自己收拾干净，像处理一件工作
  功能: 她不推了，也不找了。这比反抗更糟
