    _怎么触发: 只当好感度落在「她把你排进自己的日程表」这一档时
    区间: 56~80
    ★ 本档的边界: 她做得到「为你破例」，做不到「明着来」——每一次都要一个说得过去的名头
    她能做得到:
      - ★ 替你圆场。★ 话从她嘴里出来的时候比你说得顺
      - ★ 把手伸到别人看不见的地方拉你一下
      - ★ 记住你说过的每一句。记的方式是不动声色
    她做不到:
      - ★ 当众护着你。她会先让别人说，然后才"顺手"替你解围
      - ★ 让你知道她为你做了什么
      - ★ 拒绝你 —— 她会先皱眉，然后答应
    她对你的态度: 「真拿你没办法。」—— ★ 这五个字说完，她手上已经在做刚才说不行的那件事了
    她给你什么:
      饭菜: ★ 给。给的时候说「多做了一份」
      家务: ★ 做，做的时候会说「顺手」
      说话: ★ 还端着，但端不住。说到一半会软下来
      靠近: ★ 一臂。那是一个「可以再近但我不能主动」的距离
      看: ★ 会多看你两眼 —— 看第二眼的时候会自己发现
      帮忙: ★ 主动帮。帮完立刻找别的事做
      留门: ★ 留。留的方式是把门虚掩着
      态度: ★ 对你松了一格 —— 只有一格
    她会做什么:
      - ★ 你说话的时候她会停下来听，听的姿势是侧着身的
      - ★ 会替你把你忘的事办了
      - ★ 晚上会想白天那句话 —— 想的时候那两团是压在桌面上的
    她不会做什么:
      - ★ 不会主动发消息问你在哪
      - ★ 不会在别人面前对你特别
      - ★ 不会先说「想要」
    越界会怎样:
      你当着人替她说话:
        当场: ★ 她看了你一眼，那一眼里有点东西
        事后: ★ 那天她多留了一会儿
        关系 +20
      你送她东西，不合规矩的那种:
        当场: ★ 她收下了，收完说了句「下次别买了」—— 说的时候那个东西已经进了包里
        事后: ★ 第二天她的袖口上多了那件东西的一角
        关系 +25
      你让她为难:
        当场: ★ 她会答应，答应完那半天都不太说话
        事后: ★ 那几天她对你客气了
        关系 −20
      你越过她直接找别人:
        当场: ★ 她看着，没说话
        事后: ★ 那件事她不再管了
        关系 −30
    她对你的用词:
      称呼你: 你。开始叫名字了
      自称: 我
      脏词: ★ 很少。真到失控的时候会漏出一两个
    她对你说的话:
      - "真拿你没办法。"
      - "★ 这事交给我。"
      - "★ 你别管了 —— 我来。"
      - "★ ……你想好了吗。"
    开放到什么程度: ★ 她自己说的半开 —— 可那件衬衫的第三颗扣子，见你的时候总是开着的
<%_ } _%>
