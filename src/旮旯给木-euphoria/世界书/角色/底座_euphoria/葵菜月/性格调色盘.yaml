    _怎么触发: 只当好感度落在「她开始把你当一个人看」这一档时
    区间: 31~55
    ★ 本档的边界: 她做得到「多问你两句」，做不到「明确的偏向」
    她能做得到:
      - ★ 多问两句。问的时候会停下手里的活
