    path: 世界书/变量/主模型变量更新模式.yaml
    part: update_rules
    purpose: 备用：主模型自更新模式

mvu:
  structure: |
    ├── 时间 {日期, 星期, 时段}
    ├── 玩家 {学业总分, 各科{语文,数学,英语,物理,化学,生物}, 技能{螺旋/颗粒/敏感度加倍/硬度翻倍/热量翻倍/次数翻倍/频率翻倍 各{等级,经验}}, 体力, 性欲, 勃起度, 今日胜场, 今日败场, 累计缴械, 累计被缴械}
    ├── 排班 {今日场次[{时段, 参与者, 结果, 是否参战}], 当前战斗目标, 战斗状态}
    └── 女性角色 {名字: {身份, 省份, 方言, 关系, 缴械值0-100, 缴械次数, 战斗次数, 胜场, 败场, 名器, 技能{名,等级,经验}, 能力值{忍耐,持久,反攻}, 特质, 缺陷, 欲望积压0-100, 是否俘虏, 俘虏日期, 今日已使用, 服装, 身体状态{胸部/阴道/肛门/嘴/肌肤/大腿/臀部}, 心理状态{欲望度/羞耻感/兴奋/期待/精神状态}, 心声}}
  variables:
    - path: 时间.日期
      format: YYYY年M月D日
    - path: 时间.星期
    - path: 时间.时段
      enum: [上午, 下午场, 晚场, 深夜]
    - path: 玩家.学业总分
      type: number
      range: 0~750
      check: 只受战斗输赢影响：赢随机科目+1~5，输随机科目-1~5，其他因素不变分
    - path: 玩家.各科
      type: object
      fields: { 语文: number, 数学: number, 英语: number, 物理: number, 化学: number, 生物: number }
    - path: 玩家.技能
      type: object
      fields: { 螺旋: {等级:number,经验:number}, 颗粒: {...}, 敏感度加倍: {...}, 硬度翻倍: {...}, 热量翻倍: {...}, 次数翻倍: {...}, 频率翻倍: {...} }
      check: 本场使用该技能后结算经验（按对抗强度），经验满升级（Lv1-10）
    - path: 玩家.体力
      type: number
      range: 0~100
    - path: 玩家.性欲
      type: number
      range: 0~100
    - path: 玩家.勃起度
      type: number
      range: 0~100
    - path: 玩家.今日胜场
      type: number
    - path: 玩家.今日败场
      type: number
    - path: 玩家.累计缴械
      type: number
    - path: 玩家.累计被缴械
      type: number
    - path: 排班.今日场次
      type: z.array
      fields: { 时段: string, 参与者: string, 结果: string, 是否参战: bool }
    - path: 排班.当前战斗目标
      type: string
    - path: 排班.战斗状态
      enum: [未开始, 进行中, 已结算]
    - path: 女性角色.{名字}.缴械值
      type: number
      range: 0~100
      check: 每场战斗按公式+1~5；100 触发俘虏（永久）
    - path: 女性角色.{名字}.缴械次数
      type: number
    - path: 女性角色.{名字}.战斗次数
      type: number
    - path: 女性角色.{名字}.胜场
      type: number
    - path: 女性角色.{名字}.败场
      type: number
    - path: 女性角色.{名字}.技能.等级
      type: number
      check: 她赢了升级（她方技能体系，参考玩家技能）
    - path: 女性角色.{名字}.能力值
      type: object
      fields: { 忍耐: number, 持久: number, 反攻: number }
    - path: 女性角色.{名字}.欲望积压
      type: number
      range: 0~100
      check: 拒战则积压+，下次战斗她更强
    - path: 女性角色.{名字}.是否俘虏
      type: boolean
    - path: 女性角色.{名字}.俘虏日期
      type: string
    - path: 女性角色.{名字}.今日已使用
      type: boolean
    - path: 女性角色.{名字}.服装
      type: object
    - path: 女性角色.{名字}.身体状态
      type: object
      fields: { 胸部: {状态,乳头,敏感度}, 阴道: {状态,湿润度,敏感度}, 肛门: {状态}, 嘴: {状态}, 肌肤: {状态,体温}, 大腿: {状态}, 臀部: {状态} }
    - path: 女性角色.{名字}.心理状态
      type: object
      fields: { 欲望度: number, 羞耻感: number, 兴奋: number, 期待: number, 精神状态: string }
    - path: 女性角色.{名字}.心声
      type: string

ejs:
  # 关灯规范（2026-08-06）：所有涉及 EJS 的条目默认关灯（enabled:false），
  # 运行时由 [mvu_plot]阶段调度 @@generate_before 按 排班.当前战斗目标 getwi 精准拉取一份；
  # 情境上下文EJS 为每轮必需的单份数据快照，保留蓝灯。
  entries:
    - name: 缴械值阶段指导
      complexity: 段落控制
      stages:
        - name: 阶段一(0-19)
          condition: "getvar('stat_data.排班.当前战斗目标', { defaults: '' }) && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) <= 19"
        - name: 阶段二(20-39)
          condition: "getvar('stat_data.排班.当前战斗目标', { defaults: '' }) && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) >= 20 && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) <= 39"
        - name: 阶段三(40-59)
          condition: "getvar('stat_data.排班.当前战斗目标', { defaults: '' }) && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) >= 40 && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) <= 59"
        - name: 阶段四(60-79)
          condition: "getvar('stat_data.排班.当前战斗目标', { defaults: '' }) && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) >= 60 && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) <= 79"
        - name: 阶段五(80-99)
          condition: "getvar('stat_data.排班.当前战斗目标', { defaults: '' }) && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) >= 80 && Number(getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 })) <= 99"
    - name: 俘虏结局
      complexity: 条目显隐
      condition: "getvar('stat_data.女性角色.' + getvar('stat_data.排班.当前战斗目标', { defaults: '' }) + '.缴械值', { defaults: 0 }) >= 100"
    - name: 林汐瑶_角色条目
      complexity: 段落控制
      stages: 同缴械值 5 阶段（每人条目内嵌 5 段行为，条件按本人缴械值）
    - name: 苏晚晴_角色条目
      complexity: 段落控制
      stages: 同缴械值 5 阶段
    # ……其余 36 角色条目同模式，条件均为 getvar(女性角色.本人.缴械值) 分段

