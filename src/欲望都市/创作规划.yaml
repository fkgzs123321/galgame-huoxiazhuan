# 每个角色条目（38 人统一模板，创作阶段每人按此字段写全，千人千面靠差异化取值）：
#   basic: 姓名/年龄/身份/家乡/方言
#   外观: 逐部位详细描写模板（每人差异化取值，写实）。胸/阴道/肛门三大件=重点部位，在完整描写基础上再加深一层（生理反应/敏感细节/被碰反馈），其余部位同样完整详细描写，不简述：
#     - 身材: 身高/体重/体型/体态
#     - 胸部[重点]: 罩杯/胸型/大小/乳晕(大小颜色)/乳头(大小形状)/手感/敏感反应(充血/硬挺/一碰就立/玩捏反应)/衣物映衬
#     - 阴道[重点]: 毛发(无/稀疏/浓密,颜色)/颜色粉嫩度/大小阴唇(大小形状颜色)/紧致度/名器/水分(量稠拉丝)/处女与处女膜/易孕与否/阴蒂敏感带/常年潮湿与否
#     - 肛门[重点]: 颜色深浅/褶皱细密/毛发/紧致度/括约肌(力量/收缩反应)/敏感度/肉感/被碰反应
#     - 腰部: 线条/马甲线/腰窝/敏感反应
#     - 手部: 手指/指甲/保养习惯/手部小动作
#     - 臀部: 形状/手感/反应
#     - 大腿: 线条/肤质/内侧/触感
#     - 其他: 颈/锁骨/耳/脚/背等按人差异化完整描写
#   性格: 三面性（人前/独处/私密时）
#   气味: 写实体香（如 茉莉混汗味/墨香/海风咸味/奶香/洗衣粉味等，随情绪/出汗变化）
#   分泌物: 写实体液特征（量/稠度/气味/颜色/拉丝状态/特殊时期变化）
#   性偏好: 床上偏好（敏感带/喜欢的节奏/体位偏好/高潮表现/羞点）
#   名器: 写实/古典雅称，写实描述内里构造（紧窄/深浅/褶皱/润泽/温度），不用夸张或恶搞命名
#   战斗档案（每人必填，数值差异化）：名器防御值 X/10 + 能力值{忍耐,持久,反攻}各1-10 + 技能名（独有机制+具体数值）
#   技能: 每人独有技能（名+独有机制），格式：效果描述 + 触发条件 + 具体数值（力度/间隔/次数上限/叠加/冷却/命中率），不许雷同套话
#   特质: 身体特征/习惯/环境细节
#   缺陷: 可利用的心理或生理弱点（数值化：如 体力-2/怕痒-3）
#   5 阶段行为: 按缴械值 0-19/20-39/40-59/60-79/80-99 五段，各段行为/言语/身体反应（EJS 段落控制）
#   NSFW语料: 方言荤话/口癖/叫床习惯差异化
# ============ 量化战斗公式（写入 世界书/世界观/战斗系统.yaml） ============
# 战斗面板为"防守值血条"模式：每名女性有防守值（上限由档案导出），主角每回合攻击削减，清零 = 她败北
#   她的防守值上限 = 20 + 名器防御值×2 + (忍耐/持久/反攻最高值)×1.5（约 30~55，战斗档案直接写死）
#   每回合：你的攻击力 A = Σ(本场使用技能效果值) + 状态修正(体力/性欲/勃起度折算0-5) + d10
#           她本回合减伤 = 名器防御值 + (本回合能力值/5) + 欲望积压修正 + d10
#           伤害 = A - 减伤（下限0），扣除防守值
#   欲望积压修正: 积压≥60 → 减伤-2；积压≥80 → 减伤-4（拒战越久越容易败）
#   4 回合内防守值清零 → 你胜：缴械值 +（越快赢越多：1回合清+5/2回合+4/3回合+3/4回合+2），随机科目+1~5
#   4 回合未清零 → 按剩余防守值判定：剩<30% 算平，缴械值+1；剩≥30% 你败，缴械值-（1~3），随机科目-（1~5）
# 缴械值 100 → 俘虏（永久）。每回合数值由额外模型结算后写入结果块，面板按结果块更新。
# ============ 主角七技能数值表（写入 世界书/世界观/技能树.yaml，Lv1-10，每场使用+10~20经验，满100升级） ============
# 螺旋: 效果值=Lv×1.5（每回合给对方叠加麻痒点，麻痒≥5 触发失神1回合）
# 颗粒: 效果值=Lv×1（刺激加深，对方减伤-1/回合）
# 敏感度加倍: 对方敏感度×（1+Lv×0.1），Lv10=×2（配合麻痒类效果翻倍）
# 硬度翻倍: 效果值=Lv×1.2（对方"研磨/挤压"类减伤减半）
# 热量翻倍: 效果值=Lv×1.5（对寒系名器雪窦/寒玉/雪润效果×2；对方过热失神概率+10%）
# 次数翻倍: 连击次数×（1+Lv×0.2），连击触发她"失神"判定
# 频率翻倍: 频率=Lv×10次/分，超过她"承受阈值"时每回合她减伤-1
