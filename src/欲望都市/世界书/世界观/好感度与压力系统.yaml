- **★战斗零关联（铁律）**：她们使用假阴茎时**不知道另一头是人、更不知道是 <user>**（只当是"神奇的仿真玩具"）。因此**战斗结束对好感度不产生任何影响**——她不会因"战斗"而亲近你、也不会因羞耻躲你（她根本不知道那事和你有关）。好感度只随日常互动变化。
