# 好感度与压力系统（她侧独立生活 · 蓝灯常驻）
# 核心原则：女性的世界独立运转——压力、欲望、情绪全部来自她们自己的生活（学业/工作/家庭/孤独/生理需求），
# 不是围着 <user> 转。<user> 只是她们日常交集之一，绝不是她们欲望的来源。
# 数值落点：stat_data.女性角色.名字.压力值（0~100）与 好感度（0~100）。

## 一、压力值（她自己的生活压力，0~100，独立运转）
### 压力构成（按身份，AI 按身份挑对应来源写，全部要有日常触发落脚点）
- **学生（15人）**——多重压力叠加：
  - 学业压力：模考排名、作业量、课堂被点名、高考倒计时（触发：发卷子、排名公布、难题卡壳）
  - 家庭期望压力：家长电话查成绩、目标院校、家里砸钱陪读的愧疚（触发：接家长电话、成绩单寄回家）
  - 同侪压力：同桌卷、班长带头、别人晚自习加时（触发：看到别人刷题、被比较）
  - **欲望压力**：青春期荷尔蒙躁动、对性好奇却压抑（触发：身体莫名发烫、梦见被触碰、看到保健课内容）——这是她们开始使用假阴茎的心理动因之一
- **老师（7人）**：
  - 授课压力：教学指标、升学率、公开课/评课、学生成绩拖后腿（触发：监考、阅卷、被教务谈话）
  - 职称/考核压力：评职称材料、年度考核、论文（触发：整理材料、评优名单）
  - 年龄/家庭压力：大龄未婚、更年期潮热、异地分居（触发：相亲安排、体检报告、深夜独处）
- **陪读妈妈（15人）**：
  - 生计压力：房租、菜钱、摊位生意、异地开销（触发：买菜算账、房东催租、生意冷清）
  - 孤独压力：老公不在身边、陌生城市没熟人、只有妈妈群（触发：深夜独自看电视、想家、女儿住校不在家）
  - 前程焦虑：女儿成绩起伏、高考志愿、陪读价值感（触发：看女儿成绩单、和其他妈妈比娃）
- **主角妈妈**：
  - 经济压力：房租、节俭、生活费（触发：算开销、跟老家比价）
  - 期望压力：把儿子供出头的执念、对"复刻自己人生"的恐惧（触发：看你学习、跟工友打电话）

### 压力波动（AI 按触发写回）
- **上升**：压力事件 +10~20（考试失利/被批评/冲突/家里出事/生理期不适/欲望积压≥60 的焦躁 +2/时段）
- **下降**：释放事件 -10~20（考完/被夸/休息好/跟人聊天倾诉/用假阴茎释放后 -10~15/睡好觉 -5）
- **欲望联动**：欲望积压 ≥60 时压力值额外 +2/时段（生理需求未满足的焦躁）——用假阴茎释放后两者同降。

### 分档表现（AI 叙事按档写，数值与表现一致）
