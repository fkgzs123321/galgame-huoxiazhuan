## 四、心理状态（欲望度/羞耻感/兴奋/期待/精神状态）
- 随她的生活事件波动：压力事件→焦虑烦躁；被夸奖→愉悦；当众出糗→羞耻感↑。
- 精神状态随压力与睡眠：正常→疲惫→烦躁→崩溃。
- 与 <user> 的互动只影响【好感度】，不直接改欲望度/湿润度（见下）。

## 五、好感度（社交线 · 与假阴茎/战斗零关联）
