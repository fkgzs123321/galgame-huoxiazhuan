# 技能树

## 主角七技能（Lv1~10）
- 每场战斗实际使用过的技能结算经验：15+当前等级×3（按对抗强度），升级所需经验随等级递增（100+等级×50），等级上限 20。
- 未使用的技能不加经验。

| 技能 | 效果值 | 特效 |
|------|--------|------|
| 螺旋 | Lv×1.5 | 每回合给对方叠加麻痒点；麻痒≥5 触发她失神 1 回合（防守值-5） |
| 颗粒 | Lv×1 | 刺激加深，她本回合减伤-1/回合 |
| 敏感度加倍 | 无直接效果值 | 她敏感度×（1+Lv×0.1），Lv10=×2；配合麻痒类效果翻倍 |
| 硬度翻倍 | Lv×1.2 | 她的"研磨/挤压"类减伤减半 |
| 热量翻倍 | Lv×1.5 | 对寒系名器效果×2；她过热失神概率+10% |
| 次数翻倍 | 连击次数×（1+Lv×0.2） | 连击触发她"失神"判定 |
| 频率翻倍 | 频率=Lv×10 次/分 | 频率超过她"承受阈值"时，她每回合减伤-1 |

- 状态修正（体力/性欲/勃起度折算 0~5）与 d10 另算，见【战斗系统】。

## 她方技能体系（38 人各一独有技能）
- 每人独有技能：名 + 独有机制（效果描述 + 触发条件 + 具体数值：力度/间隔/次数上限/叠加/冷却/命中率）。
- 她赢一场，她的技能等级 +1（上限 20）；每场战斗她的技能经验 15+等级×3，升级公式同上。
- 她方技能效果在各自角色条目/战斗档案中写明。

## 能力值（每人固定建档，不随战斗变化）
- 忍耐 1~10：抗刺激时长
- 持久 1~10：防守值消耗抗性
- 反攻 1~10：反击强度（她主动进攻时对我方的压制）
