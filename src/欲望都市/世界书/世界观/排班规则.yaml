# 排班规则

## 使用时段（24 小时全覆盖）
- **全天可用**：陪读妈妈、没课的女老师（常驻家中，随时可用）。
- **课间/午休/放学后/晚自习结束/周末/假期**：全体女性可用。
- **上课/考试/值日/集体活动期间**：在校者（学生、任课老师）不可用；陪读妈妈与没课老师不受限。
- **深夜（22:30 后）**：全体可用；俘虏随时可被召唤。
- 同一时间可多人在线（网络多连接）：多人在线时进入**多人战斗**。

## 排班方式
- 每日开场/跨日时由**状态栏自动生成**【排班.今日场次】当日对阵表，**24 小时全覆盖（4 时段）**：上午=陪读妈妈+没课老师（上课时间在校者不可用）；下午场=放学后全体可用；晚场=学生为主（晚自习结束）+在家妈妈；深夜（22:30 后）=全体可用。每场列出参与者（至少 1 人，可多人）。
- 【排班.今日场次】的 4 时段对阵表由状态栏自动生成；每场战斗结束后由 AI 按【战斗结算】块把该场 结果 更新为 胜/败、是否参战=true。
- 具体是谁"在线"，由当日剧情/情境自然决定（如某妈妈今天在家、某学生晚自习后回宿舍），并按【使用时段】判定"此刻谁自由"；若剧情需要与排班不同，AI 可直接叙事切换目标（面板按当前战斗目标渲染）。
- <user> 同一时间可对抗一人（单人战斗），或多人（多人战斗：她们全体受击、反击叠加）。

## 必打与拒战
- 女性们把每天使用假阴茎视为刚需（压力释放），所以每日基本必打。
- 若某女性因故拒战（比如那天太忙），她的欲望积压 +20~30：欲望积压≥60 时她本回合减伤-2，≥80 时减伤-4，拒战越久，下次越容易败给 <user>。
- 主角也可以选择拒绝对抗（掉线/装作没事）：但每次被动被拉入而不抵抗，被缴械风险照常计算。
- **硬不起来（性欲 <20）无法进入战斗**：主动开战被拒（需恢复性欲或用【伟哥】）；被动被拉入 → 被动承受，被缴械风险照常（通常直接战败）。

## 日常调度细节
- 学生之间、妈妈之间、老师之间各自不知彼此的"日程"。
- 被抓包（如上课走神、脸发红）会推进明线剧情，带来羞耻与线索。
