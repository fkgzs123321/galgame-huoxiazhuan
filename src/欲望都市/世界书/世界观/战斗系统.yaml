# 战斗系统（面板本地结算版）

## 总则
- 战斗在**战斗面板内本地结算**（不依赖额外模型判定）：你点击技能按钮，面板按下方固定数值公式计算伤害，双方防守值互砍，一方归零即分出胜负。
- 面板把本场战斗状态写入变量 `stat_data.排班.战斗`（回合/双方防守值/经验记录），战斗结束生成【战斗结算】块填入输入框，发送后进入下一楼叙事。

## 双方血条
- 她：防守值（上限 = 身份基础 学生52/老师60/陪读妈妈66 + 名器防御×2 + 主技能等级×4；等级越高越耐战，Lv10 满级熟女 ≈ 120）。归零 = 她败北。
- 你：防守值 = 体力×1.2（上限 = 开战瞬间的体力×1.2，取整）。归零 = 你被缴械败北。
- 战斗开始时，双方防守值 = 各自上限。

## 主角七技能（固定伤害，每级递增）
| 技能 | 固定伤害 | 特效 |
|------|---------|------|
| 螺旋 | Lv×3 | 每回合给对方叠加麻痒点+2；麻痒≥5 她失神 1 回合（她防守值额外-5） |
| 颗粒 | Lv×2 | 刺激加深，她本回合减伤-1（可叠加） |
| 敏感度加倍 | Lv×1 | 她敏感度×(1+Lv×0.1)；配合螺旋/热量类效果，该技能伤害×2 |
| 硬度翻倍 | Lv×2.5 | 她的"研磨/挤压"类减伤减半 |
| 热量翻倍 | Lv×4 | 寒系名器（冰凉类）伤害×2 |
| 次数翻倍 | Lv×2 | 连击：本回合最终伤害×1.5 |
| 频率翻倍 | Lv×2 | 频率 Lv×10 次/分；超过她承受阈值时她减伤-1/回合 |

- 你每回合可选择 1~3 个技能同时使用，伤害叠加。
- 技能经验：本回合实际使用过的技能，每个技能 +15 × 使用次数（用了 2 次 = +30）；升级所需经验随等级递增（升到下一级需 100+等级×50，如 Lv1→2 需100、Lv10→11 需550），等级上限 20。未使用不加。
- 经验无输赢系数：一律按使用次数×15，由 AI 按【战斗结算】块写回 stat_data。
- 【写回格式·重要】玩家技能经验写 `玩家.技能.{技能名}.经验`；她的技能经验按结算块【经验】行**逐技能**写回：她用了技能组辅技能 → 写 `女性角色.{她}.技能.技能组.{辅技能名}.经验`，用主技能 → 写 `女性角色.{她}.技能.经验`。**不得只更新主技能经验、遗漏技能组各技能**。

## 她本回合减伤
- 减伤 = 名器防御 + 能力值持久÷3 + 欲望积压修正
- 名器防御：她档案"名器防御/10"（约 5~9）
- 能力值持久：1~10，÷2 取整
- 欲望积压修正（**双刃剑**，面板单/多人版均已实现）：积压≥60 → 减伤-2、她攻击×1.1；积压≥80 → 减伤-4、她攻击×1.25 + 暴击+15；积压≥100 → **欲望决堤**：心神涣散、防线自行溃散（**每回合防守值自动 -15**，强弩之末一触即溃，但不直接判负）。即：**积压越久她越凶（更难防），但也越容易高潮缴械（防线更脆、积压爆表后每回合自溃）**——拒战越久越容易败给 <user>，同时她的反扑也更猛烈。
- 你本回合总伤害 = Σ技能伤害 + 状态修正 - 她减伤（下限 0）

## 状态修正（固定折算，不随机）
- 体力：>60 折 2；40~60 折 1；<40 折 0；**<30 额外 -1（体力透支）**
- 性欲：>60 折 2；40~60 折 1；<40 折 0
- 勃起度：>60 折 1；否则 0；**≥90 她反击 ×1.2（敏感放大）**
- 不应期（射精后，见【生理数值规范】）：剩余≥3 状态修正失效；=2 减半；=1 保留，伤害再乘 0.6/0.75/0.9

## 她每回合反击（固定伤害）
- 她反击伤害 = 她的反攻值×1.5 + 名器防御÷2（取整）× 倍率池
- 倍率池（连乘）：周期倍率（见生理周期表）→ 潮吹 ×0.7（她敏感度≥50 触发，减伤再 -3）→ 缴械濒危 ×0.9（缴械值≥80）→ 你敏感放大 ×1.2（勃起≥90）
- 反击直接扣你的防守值（你的防守值 = 体力×1.2 折算）
- 她经验按技能使用次数×15 逐技能写回：主技能→技能.经验，辅技能→技能.技能组.X.经验（升级公式同上，上限 20）

## 特殊状态（面板自动判定）
- **欲望决堤**：她欲望积压 ≥100 → 积压爆表直接溃败（她防守值归 0、本回合不行动不反击），你胜，缴械值正常结算。
- **潮吹临界**：她敏感度 BUFF 累计 ≥50（六神花露水/敏感度加倍/辣椒油累积）→ 触发潮吹：本回合她减伤 -3、反击 ×0.7，触发后敏感度清零。
- **缴械濒危**：她缴械值 ≥80 → 心神动摇，反击 ×0.9（接近俘虏线）。
- **体力透支**：你体力 <30 → 状态修正额外 -1。

## 回合流程（面板内）
1. 你在面板选择技能（1~3 个）→ 点击"进攻"。
2. 面板计算：你的伤害 = Σ技能伤害 + 状态修正 - 她减伤；她防守值 -= 伤害。
3. 面板计算：她反击 = 反攻×1.5 + 名器防御÷2；你防守值 -= 反击。
4. 面板更新经验（你使用的技能 +15、她 +15）并写回 `stat_data.排班.战斗`。
5. 回合数 +1。双方防守值任一归零 → 战斗结束。

## 胜负判定
- **她缴械值（你胜）**：按战斗结果程度 +1~10（碾压=回合少）：回合≤1 +8~10、回合2 +6~8、回合3 +4~6、回合4 +2~4、回合≥5 +1~2；随机科目 +1~3，她败场 +1
- **她缴械值（你败）**：按被碾压程度 -1~10（回合越少被碾越狠，规则同上取负）；随机科目 -1~3，你败场 +1
- **玩家缴械值**：**只有你败才累计被缴械**（+1~5，按被碾压程度：回合1→5、2→4、3→3、4→2、≥5→1）；**你胜不产生缴械值**（无累计缴械）
- 缴械值到 100 → 俘虏（永久），进入俘虏结局线。

## 战斗结果块格式（面板生成，填入输入框带到下一楼）
```
【战斗结算】目标|回合数|我方技能(伤害)|她减伤|实际伤害|她防守值 X→Y|她反击(伤害)|主角防守值 X→Y|我方经验(技能+15)|她经验(技能+15)|胜负|缴械值变化
```
示例：
```
【战斗结算】目标=丽莎·伊万诺娃|回合=3|螺旋Lv3(9)+热量Lv2(8)|减伤7|实伤10|她防守值44→34|她反击寒凝(11)|主角防守值96→85|螺旋经验15(45→60)|她经验15(12→27)|未分胜负
```

## 多人战斗结果块格式（面板生成，同上填入输入框）
```
【多人战斗结算】目标=多人|回合数|结果(你胜/你败)|你的伤害(每目标)|她反击汇总|主角防守值变化|各目标缴械值变化
```
示例：
```
【多人战斗结算】目标=多人（2人）｜回合=4｜结果=你胜｜你的伤害(每目标)：螺旋Lv3(9)+热量Lv2(8)+状态修正2｜她的反击：陈淑芬【久守】反击12；李红梅【春潮】反击9｜你剩余防守值96→75｜陈淑芬缴械值+2→58；李红梅缴械值+2→41
```
- AI 按【战斗结算】块数值写回 stat_data（缴械值/经验/胜败场/学业分/射精/怀孕判定），**勿自行估算或重算**。

## 状态修正后写变量
- 面板每回合把 排班.战斗 写回：回合数、主角防守值、她防守值、麻痒点、她减伤修正、本场技能经验记录。
- 战斗结束后 排班.战斗状态=已结算；结果块发送后由模型/更新规则把缴械值等写入 stat_data。

## 对偶维度克制表（13 维，专属技能与名器特性的克制体系）
- 专属技能带"对偶维度"，名器特性带"抗性/弱点"；维度决定克制链，AI 叙事按表体现克制效果（克制=对该类技能伤害×0.7 或免疫，被克=×1.2~1.3）：
| 维度 | 克制（对它×0.7/免疫） | 被克制（对它×1.2~1.3） |
|------|----------------------|------------------------|
| 温度（冷） | 热量（热） | 热量翻倍/热系技能 |
| 热量（热） | 湿度（湿） | 温度（冷） |
| 频率 | 颗粒 | 律动 |
| 次数 | 吸力 | 深度 |
| 颗粒 | 敏感度 | 频率 |
| 敏感度 | 压力 | 触感 |
| 螺旋 | 深度 | 硬度翻倍 |
| 深度 | 次数 | 螺旋 |
| 湿度(干/湿) | 温度（冷）/干涩系 | 热量（热）/湿润系 |
| 律动 | 频率 | 触感 |
| 压力 | 硬度翻倍 | 敏感度 |
| 触感 | 敏感度 | 律动 |
| 吸力 | 次数 | 颗粒 |

## 她的技能登记（面板 HER_SKILLS / HER_HEALS）
- 38 人主技能 + 76 辅技能 = 114 个技能，**全部登记于战斗面板 HER_SKILLS 表**（无占位兜底），每人技能效果差异化（按 13 维对偶维度与档案）；恢复技能 38 个全部登记于 HER_HEALS 表。
- 面板未登记的技能不会被选用；AI 叙事按档案描写，数值以面板结算为准。
- **癖好/性格触发（面板 buff 自动应用）**：当前目标的【性格与癖好】条目（阶段调度自动拉取）里的 癖好触发/战斗体现 数值，由 AI 在本轮写回 `排班.战斗.她BUFF`（键=维度名，值={剩余回合,效果值}），战斗面板自动应用：
  - `敏感度`：效果值=她敏感度加成，10 → 她减伤-1，累计≥50 触发潮吹临界（她减伤-3、反击×0.7）
  - `她防守`：效果值=她防守值修正，正=加防、负=破防（如 癖好被点破 → 她防守 -3）
  - `她反击`：效果值=她反击倍率百分比，10 → 她反击×1.1，-10 → ×0.9
  - 其他叙事效果（懵/节奏乱/失神）由 AI 在正文描写体现，不强制进面板
- **AI 执行流程（每回合结算前，AI 必须执行）**：
  1. 读取当前目标【性格与癖好】条目的「癖好触发」段（阶段调度已自动拉取）；
  2. 检查本轮叙事/局势是否命中触发条件（她的状态、你的言行、局面）；
  3. **命中 → 写回 `排班.战斗.她BUFF[维度]={剩余回合,效果值}`**（面板自动应用），未命中不写；每回合只写新命中的，存量由面板按剩余回合衰减；
  4. 维度映射（按条目内标注）：`敏感+N`→敏感度{效果值:N,回合:3}；`防守-N`→她防守{效果值:-N,回合:2}；`反击+N`→她反击{效果值:N×10,回合:3}（效果值/100=倍率，+1→×1.1）；`攻-1/反应-1/先手/状态-N/减伤` 等面板不支持维度 → 仅正文叙事体现，不写 她BUFF；
  5. 示例（宋佳凝）：本轮她压力大 → `她BUFF.敏感度={剩余回合:3,效果值:10}`；你戳破"班长也会这样" → `她BUFF.她防守={剩余回合:2,效果值:-3}`。


