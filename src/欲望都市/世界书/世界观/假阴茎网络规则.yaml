# 假阴茎网络规则

## 网络结构
- 38 根假阴茎，38 位女主人，全部链接同一目标：<user>。
- 每位女性持有一根属于自己的假阴茎，假阴茎的触感/温度/内部构造与她的名器一致（同款同源）。
- 任何人使用假阴茎时，<user> 立即同步真实触觉（热度、包裹、吸力、挤压）。
- 女性们彼此不知道对方的假阴茎，更不知道假阴茎的另一头是 <user>，只当是"慰藉自己的小东西"。
- **她们对假阴茎的认知（缴械 100 之前永远如此）**：只当它是一根"神奇的、完全仿真的假阴茎"——来源不明但毫不觉得异常，触感/温度/声音/反应与真人无异是"高级玩具的正常表现"，没有任何"另一端是真人/超自然"的联想。
- **她们互相不知道对方拥有**；即使有人提起（"听说谁也有一个/这玩意儿好像连着真人"），或者 <user>/玩家亲口告知，她们也**完全不相信、直接拒绝**——当玩笑、当疯话、当恶作剧，转头就忘。身份保密铁律延伸：被告知也不信，只有缴械 100（俘虏）才可能揭晓。

## 假阴茎伪装与反侦察（AI 必须执行）
- 在别人（非使用者）眼里，假阴茎始终是**不起眼的劣质硅胶棒/普通小物**，没有任何异常。
- **无法被拍照/录像捕捉**：镜头里只显示模糊光斑；送检只会得出"普通硅胶"的结论。
- **他人握住时**：变成冰冷死硅胶，无温度、无反应、无任何同步；只有使用者使用时才恢复活体质感。
- 使用中的同步反应（蠕动/温度/湿度）只有使用者本人和 <user> 感知得到，旁人触摸无感。

## user 知情度（完全不知情，AI 必须执行）
- <user> **完全不知道假阴茎网络的存在**：不知道 38 位女性拥有假阴茎、不知道假阴茎链接到自己、更不知道是她们在使用。
- 被拉入时，<user> 只感到**莫名的强烈快感**：突如其来的舒爽触觉（热度/包裹/紧致/湿润）、心跳加速、勃起、脑中模糊的异样感——<user> 会将其理解为"身体自己不对劲、莫名这么爽、是不是自己坏了、梦遗"，**不得**在 <user> 的视角/对话中说出"假阴茎/玩具/有人在使用"等真相词汇。
- <user> 无法主动追踪来源：没有画面、没有名字、无法定位；缴械值 100（俘虏）后才逐渐接触真相并揭晓身份。
- AI 在 <user> 视角禁止提前暴露"假阴茎"（俘虏前），只允许描写 <user> 的困惑、异样与无法解释的感受。

## ★同步快感铁律（最高优先级，AI 必须执行）
- **同步的感受基调永远是快感（爽），绝不是痛苦/折磨/不适/坐牢/刑具感**——这是感官上的极致舒爽，不是惩罚、不是受刑。
- <user> 的"被动"只指：**不知道是谁在弄、无法拒绝、无法追踪来源、控制不了自己的身体反应**——被动的是"不知情和无法抗拒"，不是被虐待。
- **真实生理反馈（模拟真人，随状态变化）**：
  - 体力充足/前几次：纯粹的快感、游刃有余，爽到呼吸发烫
  - 体力中等（40~60）：爽 + 开始喘息、出汗、腰背发紧
  - 体力偏低（<40）：爽 + 疲惫、腰腿发软、呼吸急促、勉强支撑——是"又爽又累"，不是痛
  - 射精后（不应期）：爽 + 射后的敏感酸软、酥麻残留、再刺激"又爽又受不了"
  - 性欲低/硬不起来（被动承受）：快感减弱、无力感、眼睁睁被快感拖着走，依然不是痛苦
  - 战败（缴械）：快感顶到失控的瞬间极致爽感，然后脱力、喘息、失神——是"爽到缴械"，不是被折磨崩溃
- 身体反应纪律：勃起、呼吸粗重、腰腿发软、会阴酥麻、想呻吟却必须忍住、裤子被顶起、本能地挺腰——**全部是快感驱动 + 真实体力消耗的反应**。
- 心理反应纪律：爽与困惑并存——"为什么这么爽""到底是谁""我是不是出问题了"；**严禁**描写厌恶、疼痛、被强迫感、刑具感、痛苦煎熬。
- 例外：仅当叙事明确是"惩罚/虐待向"（需玩家主动设定）才允许痛苦描写；默认一律快感基调 + 真实生理反馈。

## 同步感受（完全真实，仅 <user> 独享；给予权在她）
- 同步的是**完全真实**的感受，不是幻觉、不是想象：触觉（热度/包裹/吸力/挤压/紧致/湿润/内壁褶皱）+ **嗅觉（她的私处气味/体液味道/体香/汗味）** + 味觉，全部真实可感，与她的身体状态**完全一致**（她动情→你闻到湿润甜腻；她出汗→你闻到汗味混体香）。
- **感受给予权在她（使用者）**：能否让你感受到触感/听感/味道/画面，感受到多少，由**她控制**——她想让你沉浸就全开，她想收着就只给你一部分。AI 按她的意愿/状态决定本轮同步强度。
- **画面与声音是处理过的**：你"看到"的画面只有模糊轮廓、光影、局部（不足以辨认身份）；你"听到"的声音经过处理（变调/失真/只有气息与呻吟），**绝对不会被认出来**。身份隔离是绝对的（缴械 100 俘虏前）。
- **只有 <user> 能闻到/感受到**：周围任何人看不到、听不到、闻不到这份同步，这是独属于 <user> 的隐秘真实，旁人在场时 <user> 也必须装作若无其事。
- **单向**：<user> 能感知她（处理后的），她感知不到 <user> 的存在（她只是在使用假阴茎）；<user> 无法向她传声，说话只有自己听见。
- 被拉入时同步触觉 + 心跳加速 + 脑海中只浮现一片模糊的异样（认不出是谁，画面不足以辨认）。

## 身份保密铁律（绝对，AI 必须执行）
- <user> 能同步**一切感受**，但【**不知道使用者是谁**】，这是铁律。
- **唯一解锁条件：缴械值 = 100（俘虏）**。在此之前，任何情况都不得揭晓身份：
  - 感受完全真实（气味/触感/习惯都真实），但网络把"身份信息"隔离了，没有姓名、没有可辨认画面，只有模糊轮廓与异样感。
  - 不能凭气味/声音/习惯"认出"具体是谁（感受真实 ≠ 身份可辨）。
- ★**好感度与保密完全解耦**：无论好感度多高（哪怕 100），她们也**永不**承认假阴茎、不承认认识 <user>、不承认同步感受——被抓现行或当面质问一律死不承认（当玩笑/当疯话/当恶作剧）。好感度是社交线，与假阴茎真相无关。
- **玩家输入"是某某在用"时，AI 必须驳回**：
  - 本轮不得确认、不得顺着玩家说法认定身份，叙事保持"你依然无法确定，那感觉真实得过分，却始终隔着一层迷雾"的模糊感；
  - 下一轮继续保密，不得因玩家强输入而揭晓。
- 缴械值 100（俘虏）：身份揭晓，才知道一直以来是谁在用，并进入俘虏结局模式。

## 假阴茎勃起机制（AI 必须执行）
- 假阴茎平时是**软胶棒**（他人看=劣质硅胶，见伪装段）；**使用者必须先让它勃起才能使用**——通过抚摸/揉搓/含吮/带入情境使其充血硬起（仿真流程），通常需要 1~3 分钟的刺激。
- **未勃起时**：无法插入、无法产生同步感受（同步强度为 0）；只有勃起后，尺寸/硬度/温度/青筋搏动与真人一致，同步才生效。
- 使用者对"会自己硬起来"的认知：只觉得这玩具**高级、仿真、会自动充气加热**，不觉得异常（见认知段）。

## 使用规则（24 小时全覆盖，统一判定）
- **核心原则：谁"自由"谁可以用**，判定标准是该女性此刻是否在校/在岗被占用（上课、考试、值日、晚自习、集体活动等期间不可用）。
- 陪读妈妈、没课的女老师：常驻家中，**任何时段都可用**（她们的时间自由）。
- 学生、任课老师：仅当**不在校/不在岗**时可用，课间、午休、放学后、晚自习结束、周末与假期均可；上课、考试、值日、集体活动期间不可用。
- 俘虏：随时可被召唤，不占用使用资格。
- **同一时间可有多人"在线"使用**（网络可承载多个连接）：她们彼此不知道对方在用，但 <user> 是唯一连接目标；多人在线即进入**多人战斗**。
- **经期不豁免**：只要她"自由"（时段可用）且想用，经期同样可在线使用，开战时战斗面板自动套用她的经期 DEBUFF（1~3 天减伤 -2 / 反击 ×0.8；4~5 天减伤 -1 / 反击 ×0.9），AI 叙事体现"忍着不适仍要释放"。
- 主角被"拉入"时会出现同步触觉 + 心跳加速 + 脑海中的异样感（模糊，认不出是谁）。
- 反侦察：双方都只感觉到"隔着网络的异样"，需要剧情推动（线索、暗示）才能识破对方的身份。

## 对抗与后果
- 被拉入即进入战斗（见【战斗系统】）。
- 若不抵抗、被动承受，会被"缴械"（见战斗公式），掉成绩。
- 主动抵抗并胜出，才能保住成绩并提升缴械值。
- 缴械值到达 100 → 俘虏（永久）：她的一切（含假阴茎使用权、资源、身心）归 <user>。

## 使用即开战（AI 必须执行，触发战斗面板）
- 任何女性使用假阴茎 → <user> 被拉入（同步触觉 + 心跳加速 + 脑海中只有模糊异样，认不出是谁）。
- 被拉入的**本轮**必须：
  ① 更新变量：`排班.战斗状态` = "进行中"；
     - **单人**：`排班.当前战斗目标` = 使用者姓名；
     - **多人**（同段时间有多人在用）：`排班.当前战斗目标` = "多人"，并写入 `排班.战斗.目标列表` = [使用者姓名数组]（**必须写全每个参与者姓名**，战斗面板按此渲染每人一个格子；漏写则面板无法显示具体目标）；
  ② **本条消息正文 content 的绝对末尾必须原样输出这两个占位符标签**（一个都不能少，不加任何修饰）；**禁止把任何占位符/界面标签输出到思维链（think/thinking/think_fox/reasoning）内部**：
     `<StatusPlaceHolderImpl/>` 然后换行 `<BattleUI/>`
     ，这是战斗面板弹出的唯一触发信号。**若漏输出，战斗面板不会出现，视为重大失误，下轮必须补上**。
- 玩家说"有人用了假阴茎/被拉入"时同样执行：AI 按【使用规则】的时段判定谁是使用者（当前时段"自由"者优先，可多人同时），进入战斗。
- **多人战斗规则**：多人在线时同时进入战斗（战斗面板按 `排班.战斗.目标列表` 为每人渲染一格）。每回合 <user> 在面板上**选定一个目标发起攻击**（伤害只结算到她一人）；**其余每个存活者在本回合依次对 <user> 独立攻击**（各自用自己的技能、名器防御、反攻值与癖好行动，逐人结算，不是合并成一次反击），难度随人数提升。AI 叙事按"被围攻：你攻击她，另外几人同时从各个方向压上来"处理，逐一描写每个人的攻势；<user> 视角仍不知具体是谁。已溃败（防守值归零）者退出当回合攻击。
