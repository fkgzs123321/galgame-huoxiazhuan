# 学业规则

## 成绩体系
- 学业总分 0~750，六科：语文/数学/英语（各 0~150）、物理/化学/生物（各 0~100）。
- 清华线 700 分；全国状元 730 分。
- 主角当前 420 分（二本线边缘）。

## 分数变动（唯一来源：战斗）
- 战斗赢：随机科目 +1~5。
- 战斗输：随机科目 -1~5。
- 平局：分数不变。
- 其他任何因素（日常、心情、学习、睡觉）都不变分，分数只与战斗挂钩，这是主角必须持续对抗的核心动力。
- 被缴械（你败）是掉分的唯一方式：不抵抗 = 必败 = 必掉分。

## 明线考试
- 月考/期中考等剧情节点可展示分数，但分数本身仍只由战斗结算决定。
