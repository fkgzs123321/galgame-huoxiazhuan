## 战斗面板联动
- 面板结算"你射精"（她战败时）自动写：射精次数+1、射精冷却、勃起度归0、体力扣减。
- 面板结算"她战败"（内射）时：若处于排卵窗口且未避孕/备孕，按概率判定怀孕并写变量。
- 面板上方显示当前月经状态/怀孕状态，战斗前 AI 与面板一致判断可否开战。
