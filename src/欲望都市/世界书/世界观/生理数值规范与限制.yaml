#### 三值联动总则
- 数值是**唯一真源**（stat_data.玩家.体力/性欲/勃起度），AI 描写必须与数值一致，禁止"数值已低还精力充沛/数值已高还若无其事"的脱节。
- 日常事件（吃饭/睡觉/上课/运动/互动）导致的增减由 AI 写回 stat_data（体力/性欲/勃起度路径），与战斗面板结算的同一套数值协同。
- 状态栏已显示 体力/性欲/勃起度，AI 按面板数值描写，玩家可对照。

