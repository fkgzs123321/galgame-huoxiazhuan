### 射精规则（由 体力/性欲/勃起度 驱动，无每日次数硬上限）
- **射精去向（由使用者念头决定，AI 按此叙事）**：她让你射进去 → 精液射入她的子宫，**永不漏出、永不外流**；她不让你射进去 → 射在你的内裤上。输了提前缴械 = 已射精（同上判定）。
- **射精门槛（三条件缺一不可）**：勃起度 ≥ 60（充分勃起）且 性欲 ≥ 30 且 体力 ≥ 30。任一不足即无法射精（性欲不足=射不出，体力不足=心有余力不足，勃起不足=起不来）。
- **射精消耗（公式，随当日次数递增）**：
  - 体力：-(10 + 当日已射次数×5) → 第1次 -10、第2次 -15、第3次 -20……
  - 性欲：-(30 + 当日已射次数×10) → 第1次 -30、第2次 -40、第3次 -50……
  - 勃起度：归 0
- **次数自然限制（取代"每天 3 次"硬上限）**：每次射精后 体力/性欲 下降，当 体力 < 30 或 性欲 < 30 时自动无法再射；一般 2~3 次后见底，但高体力高性欲者可突破（具体以数值为准）。
- **射精后不应期**：`射精冷却剩余` = 4 + 当日已射次数×4（第1次4 / 第2次8 / 第3次12）。**推进规则：仅战斗回合内每回合 -1（面板自动递减）；日常没有"回合"概念，冷却不在日常递减**——日常的不应期状态由数值体现（性欲/体力不足自然射不出、勃起度上限减半、状态栏显示"不应期"不显示剩余回合数）；新的一天（跨日推进）清零。冷却归 0 前无法再次射精；冷却期间勃起度上限减半（软）。
- **强行射精（数值不足仍射）**：射精困难（量少/断续）、体力额外 -10、性欲额外 -20；若体力 < 15 直接虚脱倒地，本日无法再战。
- **恢复（公式，AI 按此更新）**：
  - 性欲：过夜自然 +15（上限100）；亲密互动/视觉刺激 +5~15/次；性欲 < 20 时晨勃消失。
  - 体力：过夜 +40、三餐 +10/餐、休息半日 +20（上限100）；体力 < 15 无法战斗（硬限制）。
  - 勃起度：**数值事件驱动，没有"回合"概念**——射精归 0；受刺激（视觉/贴身/道具伟哥/技能效果）按事件 +5~15（不是自动递增）；无刺激自然回落 -5~10/小时；晨勃（睡眠后 50~80）；**战斗内不自动衰减**（只由道具/技能/射精等数值事件改变，如伟哥+40、薄荷油-20）。
- 写回：`玩家.生理.今日射精次数`、`射精冷却剩余`、`最后射精日期`。

### 体力恢复
