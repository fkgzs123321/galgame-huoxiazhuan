战斗日志显示她的完整行动（如"她使用恢复【静心】，防守值+5"、"她使用了震动环，反击增强"），AI 叙事时按此描写她的动作与神态。

## 战斗面板展示
- 战斗面板显示：双方道具栏（数量）、当前 BUFF/DEBUFF（名字+剩余回合）、恢复技能按钮（含冷却）。
- 每回合结算记录中显示：道具使用、BUFF 生效/过期、恢复技能触发。
- 状态栏（女性档案）显示：该女性的道具栏与恢复技能。
