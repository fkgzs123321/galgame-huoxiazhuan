# 道具与恢复技能系统（面板本地结算）

## 总则
- 道具、BUFF/DEBUFF、恢复技能全部在战斗面板内本地结算（不依赖额外模型），写回 `stat_data`。
- 道具存放在各自变量层：玩家道具 `stat_data.玩家.道具栏`；她的道具 `stat_data.女性角色.名字.道具栏`。
- BUFF/DEBUFF 为战斗内临时状态，存放在 `stat_data.排班.战斗.主角BUFF / 她BUFF`（记录剩余回合与效果值），战斗结束清空。

## 玩家道具栏（stat_data.玩家.道具栏，数量 0~99）
| 道具 | 效果 | 持续 | 获取 |
|------|------|------|------|
| 印度神油 | 本场攻击力+3（主角BUFF: 攻击+3） | 3 回合 | 商店/剧情 |
| 伟哥 | 勃起度+40，攻击力+2 | 2 回合 | 商店/剧情 |
| 辣椒油 | 她麻痒+3/回合，她减伤-2（变态玩法） | 2 回合 | 隐藏渠道 |
| 六神花露水 | 她敏感度+20，她减伤-1（清凉刺激） | 2 回合 | 小卖部 |
| 清凉油 | 清除自身麻痒 DEBUFF 并回复防守值+5 | 立即 | 小卖部 |
| 润滑液 | 她减伤-2（湿滑难防） | 1 回合 | 商店 |

- 玩家可在战斗面板选择道具，每回合最多使用 1 个道具。
- 使用道具时：数量 -1，效果写入 `排班.战斗.主角BUFF` 或 `排班.战斗.她BUFF`。

## 每回合行动规则（技能/道具/恢复 三选一 + 互斥）
- 玩家每回合只能选 **1 个技能** 或 **1 个道具**（二选一，互斥），也可都不选（恢复技能算独立行动，同样占用本回合）。
- 她方同理：每回合只有 1 个行动，恢复 / 道具 / 技能攻击 三选一；她用道具的回合只生效道具+基础反击，不发动技能特效。
- 技能有冷却（面板显示剩余回合，冷却中灰色不可点）：控制技 3 回合 / 防御技 2 回合 / 辅助技（加倍/翻倍类）1 回合 / 主攻技无冷却。
- 技能均独立生效（不再需要配合）：敏感度加倍 = 她敏感度+10 BUFF + 她减伤-1；次数翻倍 = 单回合伤害×1.5；热量翻倍对寒系名器×2。

## 副API描写模式（可选增强）
- 战斗面板的**数值结算永远本地完成**（不依赖任何额外模型），副API只负责把干枯日志变成"她的反应/回击"剧情描写。
- **触发条件**：只有玩家在动作框填写了攻法描写时才调用副API；留空 = 纯面板计算，秒结算，不走API。
- **副API设置位置**：酒馆「扩展 → 酒馆助手」的接口设置；面板用 `generate`（酒馆助手接口）生成，默认使用酒馆当前启用的预设，也可用代理预设/自定义API（酒馆助手内配置）。
- **输出约束（已内置于面板提示词）**：只输出中文叙事 2~3 句（60~120字，上限150），严禁输出数值/JSON/结算/胜负判定，只描写她的反应+回击。
- 副API不可用或关闭时自动降级为纯数值日志，战斗不中断。面板有"副API描写 开/关"按钮。

## 她的道具栏（stat_data.女性角色.名字.道具栏）
- 每人持有少量道具（数量 0~5），由剧情/档案决定。
- 常见她方道具：润滑液（自己减伤-2）、**薄荷油**（你勃起度-20）、**震动环**（她反击+2，2回合）、**冰袋**（她减伤+2，2回合）。
- 她的道具由面板按机制自动使用（每回合触发一次，概率/条件触发）。

## BUFF / DEBUFF 规则（持续回合制）
- 结构：`{ 名字: { 剩余回合: N, 效果值: V } }`，每回合结算时剩余回合 -1，归 0 移除。
- 玩家 BUFF（主角BUFF）：攻击+3（印度神油）、攻击+2（伟哥）、防御+5（提肛）等。
- 玩家 DEBUFF（主角BUFF 效果值为负）：攻击-1~2（絮语/软语/起伏）、麻痒（她方麻痒技能）等。
- 她 BUFF（她BUFF）：减伤+2（冰袋/归元）、反击+2（震动环）等。
- 她 DEBUFF（她BUFF 效果值为负）：减伤-2（辣椒油/润滑液）、敏感度+20（六神花露水）、麻痒（螺旋）等。
- 麻痒点满值触发失神：她麻痒≥5 失神（防守值额外-5）；你麻痒≥4~5 失神（本回合伤害减半）。

