## 她的技能组（多技能）
- 每个女角色不止一个技能：`技能.名` 是主技能（招牌技），`技能.技能组` 里是 1~2 个辅技能（每人 2~3 个技能）。
- 面板每回合按局势从技能组选技能：低血量 → 防御技（雪沁/初雪/冻紧/纵深/环锁类）；你攻击强化/高勃起 → 控制技（潮动/节拍/错拍/轻触/怕痒类）；你低体力 → 消耗技（枯磨/催旺/缠嘬/包容类）；否则用主技能。
- 技能组技能同样升级：每次使用 15+等级×3 经验，升级公式随等级递增（写回 `技能.技能组.X`），上限 20。
- 面板显示她全部技能卡（主技能 + 辅技能，含等级/效果）。

## 她购买道具（成长机制）
- 她有意识地购买道具：战斗结束她赢（你败）时，她会用零花钱去小卖部补货 1~2 个道具（写回她的道具栏）；她输也有 40% 概率补 1 个。
- 可购买：润滑液/冰袋/震动环/薄荷油/辣椒油/清凉油。
- 结算块会显示"她动向：她得意地/不甘心地去小卖部补了货：道具+N"，AI 叙事时描写她逛街买道具的场景。

## 她的 AI 回合（战斗面板自动执行，AI 叙事时呼应）
每回合她自动决策行动（优先级：恢复 > 道具 > 技能攻击），面板记录并写回变量：
1. **恢复**：她防守值被打到 <35% 且有恢复技能时触发（每场最多 2 次，冷却 3 回合），防守值+5~7，本回合不反击
2. **道具**：她道具栏有道具且每场使用 <2 次时，随机用 1 个进攻道具（薄荷油降你勃起/辣椒油给你麻痒）或防守道具（震动环反击+2/冰袋减伤+2/润滑液减伤+2），消耗数量
3. **技能攻击**：默认行动，发动她的专属技能（反击增强/控制/麻痒/削弱），含技能倍率与震动环加成

