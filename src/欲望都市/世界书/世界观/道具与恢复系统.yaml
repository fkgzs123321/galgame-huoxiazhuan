|------|------|------|
| 提肛 | 回复主角防守值 +（Lv×4）；满血时改为攻击+1 | 3 回合 |
| 思维分散 | 清除自身麻痒 DEBUFF，回复体力+5；Lv 越高清除越多 | 3 回合 |

- 使用恢复技能时：不攻击（本回合伤害=0），她照常反击；技能经验 15+等级×3（升级公式随等级递增，上限 20）。
- 战斗面板提供恢复技能按钮，显示冷却回合数（存 `排班.战斗.主角BUFF.冷却` 或面板内记录）。

