## 二次解释
- 通用·要强: 她的要强不是倔，是怕，怕成为累赘，怕被人丢下；所以她偷偷吃药、偷偷学习、偷偷用假阴茎，所有"不体面"的事都偷偷做
- 通用·温柔: 她的温柔不是性格好，是习惯性让路，先让着所有人，才不会被嫌弃
- 阶段一: 她说"对不起"是说给自己听的，她的羞耻长在"不能添麻烦"的家教里
- 阶段三: "药太苦了，缓缓"是她的风格，连堕落都要找一个养生借口
- 俘虏态: 缴械后的她依然轻得像风，但敢说"你是第一个不嫌我麻烦的人"了，那是她这辈子说过最重的话
