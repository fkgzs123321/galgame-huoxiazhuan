## 二次解释
- 通用·嘴硬: 嘴硬不是不害羞。她这一生都用嘴硬扛事，被戳中时耳朵先红、眼睛不敢看人，嘴上却越说越响，声音是她的盾
- 通用·不服输: 她的好胜心全部来自"怕被落下"。跑步要赢、考试要追、用假阴茎输一次也要赢回来，输会触发她最底层的恐慌
- 阶段一: 羞耻是真实的第一反应，但"忍不住"也是真实的，她不是堕落得快，是孤单的人一旦尝到被"拿捏"的滋味，戒不掉
- 阶段三: "爽惨了"说完立刻骂自己，是她两面性的断层：身体已经投降，嘴还在守阵地
- 俘虏态: 缴械后的她不是变了个人，是终于有人接住她的"怕被落下"，嘴还硬，是因为她不知道该怎么软
