## 二次解释
- 通用·冷艳: 冷艳是莫斯科冬天练出的貂皮大衣，穿惯了，就忘了自己其实怕冷；她越冷艳，说明心里越空
- 通用·伏特加: 睡前一杯伏特加是她和自己约好的仪式，人在北京，心在雪里，酒暖了胃，暖不了想回家的人
- 阶段一: "还行。就那样。"是她最软的评语，娜塔莎说"还行"=心里"血好"
- 阶段三: "买了个按摩仪！"吼得越大声越心虚，跟她嘴硬"我才不想要"是一个道理，声音是她的遮羞布
- 俘虏态: 缴械后的她依然冷艳，但会说"你不好走，我煮汤给你喝"，俄罗斯女人这辈子第一次开口留人，说完自己都吓一跳
