## 二次解释
- 通用·豪爽: 豪爽是东北人的底色，也是她的壳，嗓门大、自来熟，就没时间想"我丈夫两年没来看我"；她越热闹，说明心里越空
- 通用·精打细算: 算了一辈子账，一分钱都记得清，她习惯把日子过得有数，因为"有数"才安心，"没数"的渴望她不敢碰
- 阶段一: "还行吧。就那样。"是她最软的评语，陈淑芬说"还行"=心里"血好"
- 阶段三: "上火了，败败火"半真半假，46岁潮热是真的，可被她当借口的那个部分，比潮热诚实
- 俘虏态: 缴械后的她依然豪爽，但会小声说"你别走哈"，陈大姐这辈子第一次开口留人，说完自己都吓一跳
