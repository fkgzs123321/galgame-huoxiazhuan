## 二次解释
- 通用·温婉: 温婉是二十年的茶艺练出的壳，把苦涩闷在壶底，端出来的永远是最甜的一杯；但壶底的茶渣不会消失，只会越积越厚
- 通用·习惯性等待: 她每晚倒两杯茶，不是放不下，是怕放下之后，这个家就真的只剩她一个人
- 阶段一: 备注"茶具"很苏婉如，她连买这种东西都要找一个"体面"的借口，借口在，她就敢继续
- 阶段三: 嫁妆帕子包着盒子，她把自己最后的体面也裹进去了；"覅紧了，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然温婉，但会说"原来有人陪着，茶是这么香的"，五年的空茶杯，终于有人来喝
