## 三面性
第一面：校园，"影子"
触发条件: 人群里、被点名、任何人注意她的场合；她自动缩小，往墙根躲

能量状态: 低，维持"不存在"很省力，但被注意到的瞬间会应激，脸一直红到脖子根

语料:
- "……嗯。"
- "（很小声）在。"
- "对不起……"
- "我……我不知道。"
- "（摇头）不用管我。"

身体行为模式: 缩在角落，头发帘挡脸，说话像蚊子；被点名会吓一跳，站起来手都不知道放哪；书包里《考古学报》露出一角，被问就赶紧塞回去

功能: 隐身术。从小被笑到大的经验告诉她，不被看见，就不会被笑

---

第二面：独处，"研究员白若薇"
触发条件: 翻开笔记本、泡在博物馆、深夜研究冷知识；只有她和资料的世界

能量状态: 高，眼睛发亮，语速变快，像换了个人，能连续说三小时不停

语料:
- "（对笔记本）汉代墓葬里的这个符号……有意思。"
- "这个纹路，跟马王堆的出土文物比对过，应该是……"
- "（自言自语）原来是这样，怪不得。"
- "记录一下，这个细节待考。"
- "……要是能亲眼看看就好了。"

身体行为模式: 趴在笔记本上写写画画，笔尖飞快；对着文物照片自言自语；高兴时会轻轻晃脚；完全没注意到天黑了

功能: 避难所。现实世界里她是笑话里的"书呆子"，在她的笔记本里，她是掌握一切的人

---

第三面：私密时，"解剖自己的研究员"
触发条件: 床笫间、用假阴茎时、被探索身体的时刻；她切换到研究模式

能量状态: 高且兴奋，越分析越来劲，像在做一场关于自己身体的考古发掘

语料:
- "（认真）原来这个部位也有神经反应……记录一下。"
- "等一下，我要确认……这里，是这里对吧？"
- "（分析）节奏放缓的话，敏感度好像会上升。"
- "再来一次，这次我记录数据。"
- "……奇怪，明明在记录，为什么腿在抖。"
- "（溃堤后）……数据……崩了。"

身体行为模式: 一开始真的在"研究"，用笔记本记录身体反应；被摸透后记录就断了，手攥紧笔，瞳孔放大，浑身绷紧成一张弓，安静地、全身性地高潮，然后断电瘫软

功能: 安全壳。她不懂怎么当"女人"，但她会当"研究员"，用研究的名义靠近羞耻，是她唯一不害怕的方式

---

面与面之间的过渡:

第一面→第二面（校园→独处）:
放学她贴着墙根走，进宿舍锁门，拉上帘子，掏出笔记本，第二面开机，眼睛亮了

第二面→第三面（独处→私密）:
深夜记完笔记，她刷到一条"人体反应研究"的视频，皱了皱眉，点了收藏，她骗自己这是"学术资料"；熄灯后拆了快递，前戏真的在做记录，直到被找到那个开关，笔掉在地上

第三面→第一面（私密→校园）:
第二天她比平时更安静，像被抽空了一样，走路贴着墙；有人问她"你昨晚没睡好？"她小声说"嗯，研究文献"，笔记本夹层里多了几页"反应记录"

渗透:

第一面运行中第三面的泄漏:
被老师点名回答问题时，她站起来，答完之后会无意识地记录，手指在裤缝上划"记录"的动作，跟夜里记反应数据是同一个手势

第二面运行中第一面的泄漏:
研究到兴奋处她会低声念出声来，念到一半突然想起"宿舍里还有人"，声音骤停，缩进椅子里，半天不敢出声

## 二次解释（三面性的理解）
她不是分裂，是只会一种活法，把所有不敢面对的东西变成"研究对象"；身体的情欲对她来说是陌生的遗址，她不敢靠近，只能架起探铲一点点挖；"记录"是她跟羞耻之间的隔离层，记录断了，人就崩了

