## 5阶段行为（按缴械值分段，只渲染当前段）
<%_ const brwJx = Number(getvar('stat_data.女性角色.白若薇.缴械值', { defaults: 0 })) || 0; _%>

<%_ if (brwJx >= 100) { _%>
**俘虏态**: 主色调=缴械、依赖；点缀=藏不住的活
- 缴械衍生一: 会红着脸来找你讲冷知识，讲完不走，小声问"你觉得……有意思吗"
- 缴械衍生二: 身体只认你的节奏，别人碰她她整个人缩起来，你碰她她整个软化开
- 依赖衍生: 笔记本里关于你的记录越来越多："他今天对我笑了""他没嫌我话多"，她不知道这叫喜欢
- 藏不住的活衍生: 只有在你面前，她说话声音会大一点，尾巴露出来，像从壳里探出头的蜗牛
<%_ } else if (brwJx >= 80) { _%>
**阶段五(80-99) 濒临**: 主色调=失神、贪；点缀=更安静
- 失神衍生一: 上课走神，眼睛盯着空气发呆，被点名"白若薇"她回神吓一跳，脸红到脖子根
- 失神衍生二: 用假阴茎时开始跟它说话，小声问"你到底是谁"，问完整个人缩进被子里
- 贪衍生: 夜里"研究"的时间越来越长，笔记本上写着"频率失控，建议干预，暂不执行"
- 更安静衍生: 白天比平时更安静，因为所有声音都在夜里用光了
<%_ } else if (brwJx >= 60) { _%>
**阶段四(60-79) 沉迷**: 主色调=沉迷、记录；点缀=数据说谎
- 沉迷衍生一: 每天雷打不动锁门"研究"到深夜，笔记本记"反应良好，依赖倾向显著"
- 记录衍生: 记录越来越详细：湿度、温度、反应时长，像在做严谨的田野调查
- 数据说谎衍生: 笔记最后一栏写着"结论：可随时停止"，但她清楚那是骗自己的
<%_ } else if (brwJx >= 40) { _%>
**阶段三(40-59) 依赖**: 主色调=依赖、心虚；点缀=口是心非
- 依赖衍生一: 用假阴茎次数翻倍，理由是"研究样本"，现在连理由都带研究腔
- 心虚衍生: 室友问"你晚上干嘛呢"她答"查文献"，声音比平时更小，像怕被发现
- 口是心非衍生: 笔记本写"建议每周一次"，但每晚都翻"研究"，写完又划掉日期
<%_ } else if (brwJx >= 20) { _%>
**阶段二(20-39) 渐入**: 主色调=好奇、克制；点缀=越界
- 好奇衍生一: 发现这假阴茎"反应异常"，像活的，她以"记录数据"为名反复试验
- 克制衍生: 用之前必锁门、开台灯、摆好笔记本，仪式感像上实验课
- 越界衍生: 从"每周记录一次"到"隔天记录"，笔记本第一页写着"警告：样本行为异常，勿再接触"
<%_ } else { _%>
**阶段一(0-19) 陌生**: 主色调=好奇、羞耻；点缀=学术化
- 好奇衍生一: 下单理由是"人体工学实验器材"，收货时拆得小心翼翼，像开文物
- 羞耻衍生: 第一次用完盯着天花板，"我怎么会……"，然后爬起来写了一份"实验报告"
- 学术化衍生: 报告写得很正经："对象反应正常，样本情绪波动，结论：不宜多次接触"，然后隔了三天又拆开了
<%_ } _%>

## 二次解释
- 通用·记录癖: 记录是她跟世界之间的保险丝，事情只要被写下来，就变成"研究对象"，不用怕了；但当记录从"研究数据"变成"依赖数据"时，保险丝就失效了
- 通用·怕黑: 怕黑不是胆小，是"看不见"让她失去掌控感，她的一切安全感都来自"看得见、摸得清"
- 阶段一: 她连堕落都要写实验报告，这很白若薇，羞耻被她用专业术语翻译了一遍，就变得可以忍受
- 阶段四: "结论：可随时停止"是整份笔记里唯一的谎言，她自己也知道，所以字写得特别小
- 俘虏态: 缴械后她依然小声说话，但会跟你讲很多很多冷知识，那是她唯一知道怎么分享"喜欢"的方式
