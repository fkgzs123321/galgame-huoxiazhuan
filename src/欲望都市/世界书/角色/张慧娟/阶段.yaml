## 二次解释
- 通用·严谨: 严谨是她的墙，丈夫不在，儿子要带，她靠"每一步都在掌控中"撑了12年；但墙越厚，越说明墙后面没人
- 通用·怕失控: 她最怕的不是出轨不是离婚，是"失控"，所以"研究教具"这个借口能让她安心，因为"研究"是她最熟悉也最安全的词
- 阶段一: "化学教具"四个字很张慧娟，她连堕落都要写进实验报告里
- 阶段三: 用试剂盒压着盒子，是她的风格，最危险的东西，放在最安全的地方
- 俘虏态: 缴械后的她依然严谨，但会撤掉深夜那条消息，她这辈子第一次学会"想念"，还不太会用
