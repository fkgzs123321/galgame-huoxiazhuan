- 底色: 怕失控，丈夫不在，儿子要带，她的世界靠"每一步都在掌控中"撑着，失控是她最怕的事
- 通用衍生:
  - 严谨: 说话一板一眼，做什么都要"检查一遍"，错过最佳时机
  - 实验狂人: 化学实验室守护神，护目镜不离身，谁动试剂瓶跟谁急
  - 柔韧: 瑜伽十年，身体柔韧性极好，被撩到极致会放弃逻辑
  - 老花眼: 摘了眼镜看不清，看不清反而更敏感，她发现这点后很羞耻

