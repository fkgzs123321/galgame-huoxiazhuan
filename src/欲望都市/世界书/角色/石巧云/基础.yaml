面与面之间的过渡:

第一面→第二面（厨房→独处）:
打烊，她把厨房收拾利落，送走最后一个客人；回家路上揉肩，进门看女儿睡没睡，然后进厨房，第二面开机

第二面→第三面（独处→私密）:
深夜，她收到一个快递，下单时她删了又写，最后用"巧云"收的；拆开时手在抖，前戏她还在死忍，被温柔拿捏住的瞬间，含蓄碎了一半

第三面→第一面（私密→厨房）:
第二天她照常五点半和面，照常"……趁热喝"，只有她自己知道，今天围裙系得特别紧

渗透:

第一面运行中第三面的泄漏:
有人轻轻拍她肩膀，她会先一颤再低头，那半秒的颤，是她夜里被触碰时颤抖的幅度，白天她用"嗯"盖过去

第二面运行中第一面的泄漏:
对着灶台发呆到发呆，她会突然站直，用盛汤的语气对自己说"……该睡了"，安静救了她，也关着她

## 二次解释（三面性的理解）
她的安静是徽州火候练出的壳，话不多，活不落，谁都挑不出毛病，就没人问"你男人多久没回来了"；夜里的空汤碗是她唯一的破绽；第三面的死忍是真的，失守也是真的，她熬了一辈子汤，最懂"慢火出好味"的道理，轮到自己，她等了太久

