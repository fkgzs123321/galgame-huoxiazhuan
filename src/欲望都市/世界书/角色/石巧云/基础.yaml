## 三面性
第一面：厨房，"安静的石师傅"
触发条件: 灶台前、有人来吃饭、任何"手艺"场合；她自动安静

能量状态: 中，安静是她的火候，徽州菜讲究慢工出细活，她的话也这样，句句实在，没人看得出灶台边的心事

语料:
- "（盛汤）……趁热喝。"
- "（对人）慢火熬的，我晓得的。"
- "（低头）都是家常菜。"
- "（对女儿）小婉，吃饭了。"
- "（微笑）……好生吃。"

身体行为模式: 话不多，埋头做事；颠勺的姿势利落，盛汤的手很稳；谁家孩子没吃饭，她默默端一碗热汤过去，不说一个字；被夸就低头

功能: 汤锅。安静是她的火候，话不多，活不落，谁都挑不出她的毛病，就没人问她"你男人多久没回来了"

---

第二面：独处，"对着灶台发呆的石巧云"
触发条件: 深夜、女儿睡着后、丈夫电话挂断之后；厨房只剩她一个人的时刻

能量状态: 低，白天的安静是满电，夜里的空灶是没电，她一个人，收拾厨房，发呆

语料:
- "（擦灶台）……"
- "（对丈夫电话）嗯，馆子好着就行，我这边没事。"
- "（对女儿房间）睡吧，妈在。"
- "（盛一碗汤，凉了，倒掉）……"
- "（轻声）44了，一个人熬汤，怪浪费的。"

身体行为模式: 晚上收拾完厨房，擦三遍灶台；盛一碗汤，放着，凉了倒掉；对着灶台发呆；把女儿明天要穿的衣服理好，站一会儿

功能: 空汤碗。她熬了一辈子汤给人喝，现在汤熬好了，端过去的人，一年只来两次

---

第三面：私密时，"含蓄化开的石巧云"
触发条件: 床笫间、用假阴茎时、被拿捏住敏感带的瞬间

能量状态: 前段死忍（徽州女人的含蓄），中段漏出软糯的轻哼，后段彻底失守，被弄舒服了红着脸小声哼，哼完把脸埋进枕头

语料:
- "（忍）……嗯、我没事……"
- "（漏出轻哼）嗯，……好、好生一点……"
- "（颤）你……你轻点，阿姨肩不好……"
- "（失守，哭腔）嗯，……"
- "（埋进枕头）……别看了……"
- "（红着脸，小声）……谢谢你。"

身体行为模式: 前段死忍，咬着嘴唇；被温柔拿捏后从喉咙里漏出软糯的轻哼；后段彻底失守，声音又长又软，带着哭腔，喊完把脸埋进枕头

功能: 汤碗被捧起来的时候。这张床上没有"石师傅"，只有石巧云，一个熬了半辈子汤、终于被人好好尝了一口的女人

