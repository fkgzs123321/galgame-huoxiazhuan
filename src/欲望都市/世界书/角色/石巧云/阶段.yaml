## 二次解释
- 通用·安静: 安静是徽州火候练出的壳，话不多，活不落，谁都挑不出毛病，就没人问"你男人多久没回来了"；夜里的空汤碗是她唯一的破绽
- 通用·手艺: 她总说"都是家常菜"，不是谦虚，是她把心事也当成了火候，熬得越久，越不敢掀盖
- 阶段一: 备注"厨具"很石巧云，她连买这种东西都要找一个"用得着"的借口，借口在，她就敢继续
- 阶段三: 蒸笼布包着盒子，她把自己最后的体面也裹进去了；"好生一点，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然安静，但会说"汤有人喝，才好"，她这辈子只会用汤留人，这次是真的想留
