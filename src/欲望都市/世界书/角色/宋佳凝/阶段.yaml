- 依赖衍生一: 用假阴茎次数翻倍，理由是"放松计划"，其实睡前不用就睡不着
- 心虚衍生: 室友问"你最近锁门干嘛"她播音腔上线"做听力"，声音大得心虚
- 身体先投降衍生: 白天依然铁面无私，晚上却把待办清单改成"23:00 放松"，然后红着脸划掉"放松"两个字写上"用一下"
