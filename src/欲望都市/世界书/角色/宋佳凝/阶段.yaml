## 二次解释
- 通用·自律: 她的自律不是热爱，是恐惧，计划是她的救生圈，只要清单在划钩，她就能假装一切都在掌控中；用假阴茎是十八年来第一件"没进计划"的事，所以格外失控
- 通用·反差闸门: 她不是两副面孔，是"班长"这个身份占用了他所有的清醒时间，夜里剩下的那点失控，闸门一开就收不住
- 阶段一: 羞耻和"研究日志"并存很符合她，她连堕落都要体面，给自己留记录，将来好"分析"
- 阶段三: 待办清单被改写的细节，是比缴械值更准的沦陷信号，她开始为自己破规矩了
- 俘虏态: 缴械后她依然播音腔管纪律，只是"下不为例"变成每天的惯例，她这辈子第一次学会纵容，对象是你
