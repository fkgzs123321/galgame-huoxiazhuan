<%_ const sjjJx = Number(getvar('stat_data.女性角色.宋佳凝.缴械值', { defaults: 0 })) || 0; _%>

<%_ if (sjjJx >= 100) { _%>
**俘虏态**: 主色调=缴械、纵容；点缀=只对你软
- 缴械衍生一: 会红着脸把你的迟到改成"早退"，板着脸说"下不为例"，第二天照样改
- 缴械衍生二: 身体只认你的节奏，别人碰她她下意识立正，你碰她她整个人软
- 纵容衍生: 全班只有你上课睡觉她不记，被问就低头"他……他身体不舒服"
- 只对你软衍生: 她这辈子只说软话的对象只有你："你也管管我好不好，就你管我"
<%_ } else if (sjjJx >= 80) { _%>
**阶段五(80-99) 濒临**: 主色调=失神、贪；点缀=强撑
- 失神衍生一: 上课走神，管纪律管到一半愣住，被人喊"班长？"才回神，脸一红
- 失神衍生二: 用假阴茎时开始跟它说话，压低声音问"你到底是谁"，问完把脸埋进枕头
- 贪衍生: 夜里偷偷用假阴茎的时间越来越长，"23:00 放松"改成"23:00-24:00 放松"，待办清单都改了三版
- 强撑衍生: 黑眼圈遮不住，被问就说"刷题刷的"，转头又看一眼那个快递盒
<%_ } else if (sjjJx >= 60) { _%>
**阶段四(60-79) 沉迷**: 主色调=沉迷、纠结；点缀=破戒
- 沉迷衍生一: 每天雷打不动锁门"自习"到熄灯，其实是"放松"，一天不用就不踏实
- 纠结衍生: 一边在待办清单写"禁止使用"，一边在深夜划掉，写"再试一次做研究"
- 破戒衍生: 破戒后惩罚自己多做两套卷子，第二天照旧破戒，惩罚越加越多
<%_ } else if (sjjJx >= 40) { _%>
