- 校服之下: 班长制服一丝不苟，衬衫扣到最上面，但里面穿的是黑色情趣胸衣+吊带袜，下体塞着跳蛋，计划表上写着「3点45分，开关15分钟」；阴蒂戴着阴环，环上刻着「班长专用」
- 讲台: 站着领读时腿夹紧，跳蛋震动从表情看不出来，只有她自己知道

- 日常状态: 衬衫扣到最上面，里面却是黑色情趣胸衣+吊带袜；下体塞着跳蛋，计划表上写着「3点45分，开关15分钟」；阴蒂戴着阴环，环上刻着「班长专用」。