**俘虏态**: 主色调=缴械、依恋；点缀=藏不住的柔
- 缴械衍生一: 会红着脸给你泡茶、带她做的点心，说"老家的味道，尝尝"，被夸就捻手帕
- 缴械衍生二: 身体只认你的节奏，别人碰她她端庄退半步，你碰她她整个人软
- 依恋衍生: 会给你讲她丈夫的故事，讲着讲着发现自己在笑，五年了，她第一次不带着哭腔回忆
- 藏不住的柔衍生: 只有你面前她会说"原来有人陪着，茶是这么香的"，说完红了脸，转身去倒茶
<%_ } else if (twqJx >= 80) { _%>
