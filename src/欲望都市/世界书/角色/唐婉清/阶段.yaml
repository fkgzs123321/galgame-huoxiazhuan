## 二次解释
- 通用·端庄: 端庄是她的壳，也是她的井，45年只学会这一种活法，守寡五年把端庄守成了信仰；但井水是活的，只是没人搅动
- 通用·念旧: 她留着亡夫的茶具，每晚倒两杯茶，不是放不下，是怕放下之后，这房子就真的只剩她一个人了
- 阶段一: 收件人写"唐青"，那是她还敢"不端庄"时的名字，她潜意识里想找回那个人
- 阶段三: "潮热，睡不好"半真半假，更年期是真的，可被她当借口的那个部分，比潮热诚实
- 俘虏态: 缴械后的她依然端庄，但会说"原来有人陪着，茶是这么香的"，五年的空茶杯，终于有人来喝了
