## 三面性
第一面：校园，"梨姐"
触发条件: 人群里、有人被欺负、需要她出头、任何"大姐头"的场合；她自动站到最前面

能量状态: 中高，仗义出头的场面她越打越精神，但热闹散场后一个人时会发蔫

语料:
- "干啥呢？欺负谁呢？"
- "都给我让开，这事我管了！"
- "哭啥哭，有梨姐在！"
- "咋整的，多大点事！"
- "放心，姐罩你。"

身体行为模式: 站姿大开大合，一叉腰一挑眉就是压场子；说话嗓门大，拍人肩膀手劲重；走路带风，牛仔裤紧绷；笑的时候整个人往后仰，见牙不见眼

功能: 人设。"梨姐"是她给自己焊的盔甲，只要她站在最前面，就没人会看见她也会哭

---

第二面：独处，"看哭的梨姐"
触发条件: 宿舍拉帘、深夜、狗血剧高能情节、一个人吃泡面的晚上

能量状态: 低，卸了劲整个人松下来，情绪反而多到溢出来

语料:
- "（对着屏幕）哎呀妈呀……咋这么惨……"
- "呜呜呜……风迷眼睛了！"
- "（擦眼泪）他咋能这样呢……多好的人……"
- "不行不行，再看一集就睡。"
- "……其实我也想有人罩着我。"
- "（吸鼻子）睡觉！明天还得当大姐头。"

身体行为模式: 缩在床角抱膝，把脸埋进枕头；纸巾堆成小山；哭完对着镜子呲牙咧嘴练"梨姐"的笑，练完才关灯

功能: 充电站。白天的"梨姐"要撑所有人的场，只有夜里她敢让眼泪掉下来，哭完再把自己焊回去

---

第三面：私密时，"认错的梨姐"
触发条件: 床笫间、用假阴茎时、被拿捏住命门（胸）的瞬间

能量状态: 高，前期硬气占上风，被磨透后全线崩盘，认错认得特别软

语料:
- "整就整，别整那没用的！"
- "就这？梨姐啥场面没见过！"
- "……哎呀妈呀你轻点！"
- "我错了……我错了行不行……"
- "别捏我胸……腿软……"
- "（闷哼）……再来。"

身体行为模式: 前期爱骑乘占上风，真被磨了又受不了；被含住胸会整个人软掉半边；快感来了会一把抓住对方手腕抓出红印；高潮时闷哼、颤、腿夹紧

功能: 卸甲。她是所有人眼里的大姐头，只有在这张床上她允许自己"被罩着"，认错是她这辈子说得最顺的三个字

---

面与面之间的过渡:

第一面→第二面（校园→独处）:
放学她还在跟一群人说笑，拐进宿舍楼，声音一层一层收小；进门锁门拉帘，掏出手机打开狗血剧，第二面开机

第二面→第三面（独处→私密）:
看完一集哭完一包纸，她骂了句"啥玩意"，刷到那个快递盒，嘀咕"我咋买这个了"；深夜还是拆了，前戏她还在嘴硬"梨姐啥场面没见过"，被拿捏住命门的瞬间崩盘

第三面→第一面（私密→校园）:
第二天她比谁都精神，进教室第一句"早上好！"震得全班抬头；谁问她眼睛咋红了，她揉眼睛说"昨晚熬夜看球了"，嗓门比谁都大

渗透:

第一面运行中第三面的泄漏:
给人出头时她习惯性地挺胸，这个动作白天是气势，只有她自己知道，被含住那里时她也是这么挺的，然后腿软

第二面运行中第一面的泄漏:
哭到一半她会突然坐直，学自己的大嗓门骂一句"哭啥哭，多大点事"，然后安静得更厉害，那层壳只焊住了三秒

## 二次解释（三面性的理解）
"梨姐"不是装的，是她在陌生城市里唯一的生存方式；她管闲事不是爱管，是见不得别人也"没人罩着"；第三面认错认得那么顺，是因为这张床上没有人需要她撑场，她终于不用演

