## 二次解释
- 通用·嘴硬心软: 她嘴上的凶和心里的软是同一边的，嘴上"整就整"，真被磨了求饶比谁都快；她骂人是为了掩饰心软，不是真的硬
- 通用·管闲事: 她管闲事不是爱管，是见不得别人"没人罩着"，她太清楚那个滋味，所以谁她都罩
- 阶段一: 她的羞耻来得快去得也快，因为"扛事"是她的本能，扛羞耻也一样，骂自己一句就翻篇
- 阶段三: "解压"这个借口太像她，她连安慰自己都用大姐头的语气
- 俘虏态: 缴械后的她还是那个罩人的梨姐，只是开始有人罩她了，她嘴上凶，心里第一次尝到"被接住"的滋味
