## 三面性
第一面：校园，"快乐的小太阳"
触发条件: 人群里、任何说话场合；她自动开机，嘴停不下来

能量状态: 中高，外向是她的语言天赋，说话越多越开心，像金毛撒欢

语料:
- "你好！我很好！"
- "同学！这个，怎么讲？"
- "我觉得你很好！很帅！"
- "啊！我的中文又错了！哈哈哈哈！"
- "我爱中国！我爱北京烤鸭！"

身体行为模式: 说话带手势，眉飞色舞；中文说错自己先笑；走路带风，金发一甩一甩；跟谁都自来熟，拍拍肩膀就称兄道弟；被纠正中文会夸张地"哦，！"一声，然后记下来

功能: 太阳模式。把话说得多多的，把笑撒得满满的，这样莫斯科的夜晚就不会追到北京来了

