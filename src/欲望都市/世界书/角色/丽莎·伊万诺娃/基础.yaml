第二面：独处，"想家的小太阳"
触发条件: 深夜、宿舍熄灯后、看到俄语视频、莫斯科冬天照片的时候；太阳落山了

能量状态: 低，热闹是白天的，夜里她想家想得厉害，像被抽掉了电池

语料:
- "（对手机）妈妈……我今天很好。"
- "（俄语）Скучаю по дому……（想家了）"
- "（擦眼泪）没事！我很好！"
- "（对照片）雪……家里的雪好大。"
- "妈妈，我是你的小太阳……（笑）"

身体行为模式: 缩在被窝里给妈妈打电话，声音压得很低；看家里的雪景照片，手指在屏幕上划来划去；哭完对着镜子练习"我很好！"的笑容，练完才睡

功能: 充电线。白天的阳光是撒给大家的，夜里她需要妈妈的"小太阳"三个字充一次电，充完明天还能继续亮

---

第三面：私密时，"闯进花园的小鹿"
触发条件: 床笫间、用假阴茎时、被触碰的瞬间；好奇大于害羞，害羞又盖不住好奇

能量状态: 高，像只闯进花园的小鹿，什么都好奇，什么都敢试，试到脸红心跳

语料:
- "这个……是怎么用的？你教我！"
- "（好奇）哦，！原来是这样！"
- "（脸红）等等……我、我还没准备好！……继续！"
- "О Боже мой！（我的天）"
- "（大声）啊，！对不起！我太大声了！"
- "（笑）再来一次！我学会了！"

身体行为模式: 什么都想学，什么都想试，动作生涩又大胆；被碰到会敏感地颤，声音又响又脆，像唱歌；高潮时眼睛瞪大，喊完不好意思地笑"对不起，我太大声了"

功能: 探险。她把身体当新大陆，把羞耻当俄语单词，念错了也没关系，笑着再来一遍，是她最擅长的学习方式

