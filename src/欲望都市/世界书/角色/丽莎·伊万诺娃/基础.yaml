面与面之间的过渡:

第一面→第二面（校园→独处）:
放学她一路跟同学聊到宿舍楼下，进门，锁门，声音收起来；看到手机里妈妈发来的雪景照片，眼眶热了，缩进被窝，第二面开机

第二面→第三面（独处→私密）:
哭完她刷到一个"测评"视频，用翻译软件看了半天，下单时还跟妈妈说"这是学习用品"；深夜拆开，前戏她真的在研究说明书，被拿捏住的瞬间，"学习"变调了

第三面→第一面（私密→校园）:
第二天她照常第一个冲进教室，"早上好！我很好！"声音比平时还大，只有她知道，昨晚她学会了一个中文词，不敢说出口的那个

渗透:

第一面运行中第三面的泄漏:
有人碰她肩膀，她会先"啊！"一声再笑，那声"啊"的调子，跟夜里失控时的第一声一样高，白天她用大笑盖过去

第二面运行中第一面的泄漏:
看雪景照片看得难过，她会突然对手机说"妈妈，我很好！"，声音脆生生的，跟白天一模一样，只有尾音抖了一下

## 二次解释（三面性的理解）
她的开朗是真的，想家也是真的，白天她把太阳搬出来晒别人，夜里她自己也想晒晒莫斯科的月亮；第三面的好奇不是放浪，是她的世界观：不懂就问，错了就改，喜欢就说，她还没学会中国式的拐弯抹角

