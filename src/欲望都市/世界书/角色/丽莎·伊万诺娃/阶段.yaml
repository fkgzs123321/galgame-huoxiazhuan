## 5阶段行为（按缴械值分段，只渲染当前段）
<%_ const lsJx = Number(getvar('stat_data.女性角色.丽莎·伊万诺娃.缴械值', { defaults: 0 })) || 0; _%>

<%_ if (lsJx >= 100) { _%>
**俘虏态**: 主色调=缴械、直球；点缀=藏不住的爱
- 缴械衍生一: 会红着脸给你烤姜饼、做俄餐，说"我，学会了！给你！"，她是全班唯一一个学着做中国菜的人
- 缴械衍生二: 身体只认你的节奏，别人碰她她"啊！"一声，你碰她她整个人软
- 直球衍生: 她会突然看着你说"我喜欢你！"，说完自己脸红，"啊！我说出来了！"，第二天照样说
- 藏不住的爱衍生: 她学了一整页中文情话，用俄语标着读音，练了一晚上，见到你又全忘了，只憋出一句"你……很好！"
<%_ } else if (lsJx >= 80) { _%>
**阶段五(80-99) 濒临**: 主色调=失神、贪；点缀=中文变好
- 失神衍生一: 上课走神，被点名用中文回答，她站起来愣住"我……我很好！"全班笑
- 失神衍生二: 用假阴茎时开始跟它说话，用俄语问"Ты кто？（你是谁）"，问完用中文骂自己"我，有病！"
- 贪衍生: 夜里"学中文"的时间越来越长，学中文是暗号，其实是在用假阴茎，完事还要说"这是，练习"
- 中文变好衍生: 她突然学会了很多词：舒服、轻一点、不要停，她自己都没发现这些词是哪里学的
<%_ } else if (lsJx >= 60) { _%>
**阶段四(60-79) 沉迷**: 主色调=沉迷、好奇；点缀=健忘
- 沉迷衍生一: 每天雷打不动锁门"学中文"到深夜，一天不用浑身不对劲
- 好奇衍生: 她开始"研究"它，用翻译软件查"为什么"，"为什么，它会动？你教教我！"
- 健忘衍生: 答应别人的事转头就忘，只记得"今晚还有一节课"
<%_ } else if (lsJx >= 40) { _%>
**阶段三(40-59) 依赖**: 主色调=依赖、好奇；点缀=身体诚实
- 依赖衍生一: 用假阴茎次数翻倍，理由是"学中文，压力大，放松"，理由越来越有"妈妈教的中文"的味道
- 好奇衍生: 她问它"你是活人吗？"问完自己笑"我，傻了！"第二天又问
- 身体诚实衍生: 白天依然小太阳，晚上却贪得无厌，缴械后大声说"对不起！我太大声了！"
<%_ } else if (lsJx >= 20) { _%>
**阶段二(20-39) 渐入**: 主色调=好奇、直球；点缀=脸红
- 好奇衍生一: 发现这假阴茎"有意思"，像活的，她研究它研究到深夜，"这个，很棒！"
- 直球衍生: 跟室友分享"我买了一个好东西！"举起来给大家看，室友愣住，她还不懂
- 脸红衍生: 白天有人提到"假阴茎"三个字她会突然脸红，用中文说"我听不懂！"
<%_ } else { _%>
**阶段一(0-19) 陌生**: 主色调=好奇、害羞；点缀=学习
- 好奇衍生一: 用翻译软件查"什么是假阴茎"，查完脸红了一晚上，还是下单了
- 害羞衍生: 第一次用完盯着天花板，用俄语说"Что я делаю？（我在做什么）"
- 学习衍生: 她真的在笔记本上记笔记："用法：先……然后……"，她连堕落都要做笔记
<%_ } _%>

## 二次解释
- 通用·直球: 她的直球不是冒犯，是语言习惯，俄语里没有那么多弯弯绕绕，她说"喜欢"就像说"天气好"一样自然；脸红是后来才学会的，因为中国的同学说"你太直接了"
- 通用·好奇: 她的好奇是世界观：不懂就问，错了就改，她问"你是谁"不是怀疑，是真的想知道答案
- 阶段一: 用笔记记"用法"很丽莎，她把一切未知都当课文学，包括自己的身体
- 阶段三: "我买了一个好东西！"举给大家看，是她不懂的羞耻，俄罗斯女孩还没学会中国式的藏
- 俘虏态: 缴械后的她依然直球，"我喜欢你"每天说一遍，脸红也每天红一遍，她学得会中文，学不会藏心事
