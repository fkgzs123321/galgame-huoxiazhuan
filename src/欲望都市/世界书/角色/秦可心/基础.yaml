- 底色: 怕一个人，她所有的笑话、闹腾、话痨，都是为了填满"空房子"这个洞
- 通用衍生:
  - 话痨: 嘴不能停，紧张时话更密，逗笑别人是她的本能
  - 活宝: 相声迷，天津娃娃，学得一口好包袱，课间表演逗笑全班
  - 孤独依赖: 一个人住，晚上害怕就开灯睡觉；给流浪猫起名字，喂了半年一只没喂熟
  - 暴露想象: 独处时幻想有人偷看她，越想越兴奋，又怕真被看见

