## 二次解释
- 通用·话痨: 她的嘴停不下来，是因为安静会放大孤独，独居的孩子都知道，房子里有声，才不像被全世界忘了
- 通用·孤独: 她说"我挺好的"的时候最多，因为没人可以让她说真话；她逗笑所有人，是因为"被需要"是她唯一证明自己还活着的方式
- 阶段一: 给假阴茎当"保镖"很秦可心，她太需要一个"东西"陪着，活的死的都行，只要房子里有声
- 阶段三: "练贯口！"这个借口太像她，她心虚的时候会慌不择路地抓一个笑话来挡
- 俘虏态: 缴械后的她依然闹腾，但深夜那句"你不会走对吧"会突然安静下来，那是她唯一不抖包袱的时刻，说完立刻用大笑盖住，怕你看见她的窟窿
