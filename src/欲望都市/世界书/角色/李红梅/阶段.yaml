## 二次解释
- 通用·威严: 威严是责任焊的铠甲，她不是天生冷硬，是"不能垮"逼出来的；越威严的人，松开的时候越吓人
- 通用·隐忍: 八年她什么都自己扛，因为没人可以让她靠；"被温柔对待"是她最缺也最怕的东西，缺是因为没有，怕是因为承受不起
- 阶段一: 她羞耻是因为她真的看重"老师"这个身份，她是全班唯一的"妈"，这个包袱她背了八年，第一次想为自己放下
- 阶段三: "失眠，管用"半真半假，她用假阴茎之后睡得反而好，这是她没敢承认的沦陷证据
- 俘虏态: 缴械后的她依然威严，但"我其实很累"只说给你听，八年来她第一次允许自己不是铁打的
