- 制服之下: 职业套装里是黑色束胸衣+吊带袜，束胸衣勒出深深的乳沟；下体塞着跳蛋，训话时开最小档；阴部纹着「纪律」两个金字
- 威严: 站在讲台上训话，声音威严，只有她自己知道跳蛋在震

