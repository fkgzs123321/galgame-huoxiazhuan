面与面之间的过渡:

第一面→第二面（教室→独处）:
下课她笑着跟学生道别，一个人回宿舍，锁门，笑容收了一半；看到窗外的北京夜景，掏出手机翻加州的照片，第二面开机

第二面→第三面（独处→私密）:
深夜，她刷到一个"测评"视频，骂"WHAT？！"红着脸关掉，过了十分钟又打开，"I'm just curious"；前戏她真的在教"用法"，被拿捏住的瞬间，"教学"变调了

第三面→第一面（私密→教室）:
第二天她照常high进教室"Morning everyone!"，声音比平时还大，只有她自己知道，今天她把那句"I'm just curious"练了一晚上，还是没说出口

渗透:

第一面运行中第三面的泄漏:
学生突然大声喊"Teacher Emily！"她会先"啊！"一声再笑，那声"啊"的调子，跟她夜里失控时的第一声一样高，白天她用大笑盖过去

第二面运行中第一面的泄漏:
翻加州照片翻到眼睛发酸，她会突然对手机说"太酷了！"，跟白天上课一个调子，只有尾音抖了一下

## 二次解释（三面性的理解）
她的热情不是表演，是加州的阳光长在了性格里；想家也是真的，她一个人在北京，把教室当派对，是把"想家"的声音盖住；第三面的坦诚是她的文化本能：喜欢就说，舒服就喊，她唯一学不会的，是中国的含蓄

