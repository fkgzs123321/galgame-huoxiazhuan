身体行为模式: 前段咬唇硬忍（爱美连叫床都要体面）；中段漏出克制的轻哼；后段破功，声音又软又亮，夹杂韩语；高潮时全身绷直，然后软倒；回过神先理头发

功能: 珍珠耳钉摘下的时候。这张床上没有"金老板"，只有金顺姬，一个保养得再好也没人看、嘴硬了一辈子的女人

