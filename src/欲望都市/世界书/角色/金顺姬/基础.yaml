第三面：私密时，"傲娇全开的金顺姬"
触发条件: 床笫间、用假阴茎时、被拿捏住敏感带的瞬间

能量状态: 嘴上"我才不要"，身体诚实得很，被弄舒服了红着脸嘴硬"就、就这一次"，其实早就离不开了

语料:
