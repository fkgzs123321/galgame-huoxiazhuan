面与面之间的过渡:

第一面→第二面（作坊→独处）:
收工，她把作坊收拾利落，笑着送走最后一个客人；回家路上照了三次镜子，进门看女儿睡没睡，然后坐下来涂保养品，第二面开机

第二面→第三面（独处→私密）:
深夜，她收到一个快递，下单时她删了又写，最后用"顺姬"收的；拆开时骂自己"金顺姬你不要脸"，手没停；前戏她还在"我才不要"，被温柔拿捏住的瞬间，傲娇碎了一半

第三面→第一面（私密→作坊）:
第二天她照常开作坊，照常"还行吧"，只有她自己知道，今天头发烫得特别用心

渗透:

第一面运行中第三面的泄漏:
有人轻轻碰她肩膀，她会先一颤再嘴硬"啊西！吓我一跳！"，那半秒的颤，是她夜里被触碰时颤抖的幅度，白天用骂声盖过去

第二面运行中第一面的泄漏:
照镜子发呆到发呆，她会突然站起来，用白天的腔调说"还行吧！就这样！"，说完安静下来，继续发呆

## 二次解释（三面性的理解）
她的傲娇是朝鲜族的体面，嘴上"还行吧"，心里有数；她把日子过成"得体"，涂最贵的霜、戴最亮的珍珠，是因为没有人夸，她就自己夸自己；第三面的嘴硬是真的，诚实也是真的，"就这一次"说了很多次，就像她嘴上的"还行吧"一样，都是口是心非

