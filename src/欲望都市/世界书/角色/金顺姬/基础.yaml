## 三面性
第一面：作坊，"傲娇的金老板"
触发条件: 作坊里、有人夸她、任何"要面子"场合；她自动开机

能量状态: 中高，傲娇是她的体面，嘴上"还行吧"，心里乐开花，没人看得出她夜里对镜发呆

语料:
- "（递辣白菜）拿回去吃，乖。"
- "（被夸）还行吧……就一般手艺。"
- "（转身偷偷笑）"
- "（对女儿）美娜！吃饭了！啊西，又瘦了！"
- "（摸头发）我这头发，烫得好吧？还行吧。"

身体行为模式: 说话利落，带朝鲜族尾音；被夸手艺好嘴上"还行吧"，转身偷偷笑；镜子不离身，随时照；做辣白菜的手又快又稳，围裙都干干净净；能歌善舞，节日必跳长鼓舞

功能: 镜子。傲娇是她的体面，嘴上"还行吧"，心里有数；镜子里的她好看，镜子里的人也不问"你男人多久没回来了"

