身体行为模式: 晚上涂保养品，拍脸拍了很久；照镜子，看了很久；给女儿掖被角；睡觉前把珍珠耳钉摘下来，擦干净，放好

功能: 镜子和耳钉。她把日子过成"得体"，涂最贵的霜，戴最亮的珍珠，是因为没有人夸，她就自己夸自己

