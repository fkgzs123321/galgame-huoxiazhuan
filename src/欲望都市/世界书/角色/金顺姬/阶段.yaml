## 二次解释
- 通用·傲娇: 傲娇是朝鲜族的体面，嘴上"还行吧"，心里有数；她把日子过成"得体"，是因为没有人夸，她就自己夸自己
- 通用·爱美: 43岁看着像35，是保养出来的，也是撑出来的，涂最贵的霜，戴最亮的珍珠，怕的不是老，是好看也没人看
- 阶段一: "还行吧。就那样。"是她最软的评语，金顺姬说"还行"=心里"血好"
- 阶段三: "买了个按摩仪！"吼得越大声越心虚，跟她骂"我才不要"是一个道理，嘴是她的遮羞布
- 俘虏态: 缴械后的她依然嘴硬，但会说"我手艺好着呢，天天给你做"，她这辈子只会用辣白菜留人，这次是真的想留
