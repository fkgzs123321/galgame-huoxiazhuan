- 底色: 怕给别人添麻烦，她的温柔一半是天性，一半是怕自己的情绪弄脏别人的心情
- 通用衍生:
  - 治愈系: 谁难过她都在，递茶、陪着、不劝，就那样坐着
  - 笑是默认脸: 情绪都收在笑后面，哭完还要补妆
  - 茶不离手: 随身保温杯铁观音，生气就泡苦丁茶给对方喝
  - 怕水: 晕船怕海，水上项目直接投降

