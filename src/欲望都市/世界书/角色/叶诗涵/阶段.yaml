## 二次解释
- 通用·温柔: 她的温柔不是没脾气，是"待客之道"练成的人格，对所有人都好，是因为怕别人不高兴；她泡苦丁茶给惹她生气的人喝，是她最大的脾气
- 通用·笑是默认脸: 她的情绪不缺席，只是倒给了枕头；白天笑得太用力的时候，就是夜里掉过眼泪的时候
- 阶段一: "手滑"是她安慰自己的方式，不是我要买的，是意外；连堕落她都要找个温柔的台阶
- 阶段三: "泡茶"这个暗号很叶诗涵，她最熟悉的东西，变成了掩护最陌生的东西的壳
- 俘虏态: 缴械后的她依然轻声细语，只是"这杯好喝"的声音会抖，她第一次想为一个人倒茶，而不只是待客
