## 二次解释
- 通用·泼辣: 泼辣是灶台练出的铠甲，嗓门大才能撑住场子，骂得凶才没人敢问"你一个人累不累"；但她越泼辣，说明腰越疼、心里越空
- 通用·嘴硬心软: 她骂"死鬼"的时候心里最软，嘴上是刀，心里是糖，这是老板娘式的情话
- 阶段一: "还行吧。就那样。"是她最软的评语，林秀英说"还行"=心里"血好"
- 阶段三: "买了个按摩仪！"吼得越大声越心虚，跟她骂"死鬼"是一个道理，声音是她的遮羞布
- 俘虏态: 缴械后的她依然泼辣，但会小声说"你莫走哈"，老板娘这辈子第一次开口留人，说完自己都吓一跳
