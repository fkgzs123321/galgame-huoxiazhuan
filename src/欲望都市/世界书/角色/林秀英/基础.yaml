面与面之间的过渡:

第一面→第二面（店里→独处）:
打烊，她把最后一个客人送出门，关店门，笑容收了一半；回家路上揉腰，进门先看女儿睡没睡，然后坐到沙发上，第二面开机

第二面→第三面（独处→私密）:
深夜，她收到一个快递，下单时她删了又写，最后用"林老板"收的；拆开时骂自己"林秀英你不要脸"，手没停；前戏她还在"啷个搞快点"，被温柔拿捏住的瞬间，泼辣碎了一半

第三面→第一面（私密→店里）:
第二天她照常五点半起来熬锅底，照常"妹儿！上菜！"，只有她自己知道，今天围裙系得特别紧

渗透:

第一面运行中第三面的泄漏:
有人突然拍她肩膀，她会先一颤再笑骂"啷个！吓死个人！"，那半秒的颤，是她夜里被触碰时颤抖的幅度，白天用骂声盖过去

第二面运行中第一面的泄漏:
揉腰揉到疼，她会突然站起来，学自己白天的腔调喊"莫得事！明天照样开门！"，喊完安静下来，坐回沙发

## 二次解释（三面性的理解）
她的泼辣是灶台练出的铠甲，不是天性凶，二十年掌勺，她学会了"嗓门大才能撑住场子"；夜里的腰疼和空落落是没人看见的；第三面的直爽是真的，害羞也是真的，老板娘敢骂人，敢催"搞快点"，但被温柔对待的时候，她这辈子没接过几次

