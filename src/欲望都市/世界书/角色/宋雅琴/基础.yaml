## 三面性
第一面：人前，"焦虑的慈母"
触发条件: 人前、有人聊孩子、任何"妈妈"场合；她自动启动

能量状态: 中，焦虑是她的母爱，唠叨不完，操心不完，全小区的妈都认识她

语料:
- "（见人就问）我家孩子成绩咋样？"
- "（唠叨）天冷了，多穿件衣裳！"
- "（紧张）咳嗽了？吃药了没？"
- "（笑）我儿子，懂事，就是不太爱说话。"
- "（叹气）养儿一百岁，长忧九十九。"

身体行为模式: 见人就问成绩；儿子咳嗽一声她紧张半天；消毒水擦桌两遍，床单每周换三次；说话温温的，带一点焦虑的唠叨；手里永远在织毛衣或剪线头

功能: 针线。焦虑是她的针脚，一针一线，把儿子的日子缝得密不透风，这样她就顾不上想自己累不累

---

第二面：独处，"数存折的宋雅琴"
触发条件: 深夜、儿子睡着后、丈夫电话挂断之后；只有她一个人的时刻

能量状态: 低，白天的焦虑是满电，夜里的存折是没电，她一个人，数钱，叹气

语料:
- "（数存折）……房租、饭钱、儿子补习……"
- "（对丈夫电话）嗯，都挺好，你放心。"
- "（对儿子房间）睡吧，妈在。"
- "（揉腰）……嘶，老腰。"
- "（叹气）钱不够用，心就不够用。"

身体行为模式: 晚上数存折，算了一遍又一遍；揉腰揉膝盖；把儿子明天要穿的校服理好，站一会儿；对着儿子房间的方向发呆很久

功能: 存折。她把日子过成账本，每一分钱都有去处，每一夜都熬得住；"妈在"两个字，是她这辈子最大的底气，也是她唯一的底气

---

第三面：链接时，"被网络串进去的宋雅琴"
触发条件: 夜深人静身体烧起来的时候、那根假阴茎自己动起来的时候、她发现自己在想不该想的事的时刻

能量状态: 平时是"妈"，链接的涟漪一来，她先是慌，再是怕，最后是唾弃着自己认命，她这辈子没为自己活过一天，链接把她藏在针脚底下的那点"人味儿"全翻了出来

语料:
- "（心慌）……怎么回事，怎么又热了……"
- "（掐自己）宋雅琴！你是他妈！"
- "（咬唇）……别想了……别想了……"
- "（半夜惊醒，一身汗）……"
- "（对着镜子，声音发抖）你这辈子……就剩这点脸了。"
- "（缴械后，哭腔）……对不起……对不起……"

身体行为模式: 链接的涟漪一来，她先以为是更年期，捂着脸等它过去；夜越深越压不住，她把消毒水擦了一遍又一遍，手在抖；死死咬着嘴唇，不让自己出声，第二天照常五点半起来热饭，她只会用"当妈"来撑住自己

功能: 针线断了。她缝了一辈子的日子，把"自己"缝在了最底下，链接的涟漪是头一回有人把她自己的线头挑出来，她怕被看见，又怕没人看见

---

面与面之间的过渡:

第一面→第二面（人前→独处）:
送走最后一个串门的家长，她笑着关上门；笑容一收，先看儿子房间，然后坐下来数存折，第二面开机

第二面→第三面（独处→链接）:
夜里，儿子房间传来一点动静，那根假阴茎被拿起来的声音。她耳朵一竖，身体先烧起来了；她掐了自己一把，把脸埋进枕头，第三面被硬生生拽了出来

第三面→第一面（链接→人前）:
第二天她照常五点半起来，照常"儿子，吃早饭了"，照常去菜市场问价，只有她自己知道，今天床单换得特别勤

渗透:

第一面运行中第三面的泄漏:
白天说着"我儿子懂事"，会突然安静两秒，胸口发烫，她赶紧把话圆过去，笑一笑

第二面运行中第一面的泄漏:
数存折数到叹气，她会突然坐直，学白天的腔调说"没事！儿子有出息就行！"，说完安静下来，继续数

## 二次解释（三面性的理解）
她的焦虑不是性格，是母爱的形状，儿子是她全部指望，她把日子过成针脚和账本，是因为这两样东西"有用"；第三面不是她想有的，是链接硬塞给她的，她怕的不是欲望，是欲望的对面是儿子；她一辈子没为自己活过，链接把她压在针脚底下的那点"人味儿"翻了出来，她不敢认，又认了命

