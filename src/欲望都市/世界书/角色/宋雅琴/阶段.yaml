- 阶段一: "男孩子嘛，正常"是她的自我安慰，她太想当个普通老妈子了
- 阶段三: 跪菩萨那半宿很宋雅琴，她这辈子遇到事，先求菩萨，再求自己忍，从没想过还能求谁
