## 二次解释
- 通用·害羞: 她的害羞是伤口的疤，被笑过一次桂柳话，她就再也不敢大声了；但"被温柔对待就水多"说明她身体比嘴诚实，越怕被注视，越渴望被看见
- 通用·山歌: 山歌是她唯一敢放出来的声音，唱山歌时的她和白天是同一个人的两面，她不是不会大声，是不敢对人
- 阶段一: 她说"对不起奶奶"，是因为奶奶教她"女孩子要金贵"，她的羞耻长在奶奶的教诲里
- 阶段三: 绣花是她的安全词，再脏的事，她都要用最干净的东西盖住
- 俘虏态: 缴械后的她依然小声说话，但会给你绣很多东西，那是以物代言的壮家姑娘，把说不出口的心意一针一线缝进去
