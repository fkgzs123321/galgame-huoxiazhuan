- 底色: 怕被丢下，她是种花的，知道花要浇水才会开；她怕自己也像旱地的花，等着等着，浇水的人一直不来
- 通用衍生:
  - 开朗: 爱唱山歌，朴实大方，谁家孩子都给摘花，开心果
  - 手艺: 花农，种玫瑰山茶茉莉，陪读也在阳台种花
  - 花粉过敏: 自己种花自己过敏，花季咳得停不下来，战斗力减半
  - 腰疼: 常年弯腰种花，腰不好，久战撑不住

