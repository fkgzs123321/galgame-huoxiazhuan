## 二次解释
- 通用·开朗: 开朗是山歌练出的壳，山里人豁达是真的，但心事都唱给花听了；她越热闹，说明心里越空
- 通用·对着花说话: 花不会顶嘴、不会挂电话、不会说"明年再来看你"，她把日子过成花田，是因为花不会走
- 阶段一: 备注"花肥"很何玉兰，她连买这种东西都要找一个"地里用得着"的借口，借口在，她就敢继续
- 阶段三: 花种木箱里锁着盒子，她把自己最后的体面也埋进土里了；"给是，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然开朗，但会说"俺给你种一辈子花"，她只会用花留人，这次是真的想留
