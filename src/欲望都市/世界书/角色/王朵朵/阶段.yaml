## 二次解释
- 通用·自卑: 她的自卑不是不够好，是没人告诉过她"你很好"，所以她被温柔对待时第一反应是"他是不是客气"，确认不是之后，她会把整颗心都交出去
- 通用·容易满足: 一点好就记很久，是因为她得到的太少，他帮她把笔捡起来这种小事，她能记一整年
- 阶段一: 羞耻和贪并存很符合她，她一边觉得自己"不配"享受，一边又舍不得那点没人嫌弃她的温暖
- 阶段三: "从来没人这样对我"是她的真心话，用假阴茎是她人生里第一次为自己讨一点好
- 俘虏态: 缴械后的她依然小声说话，但敢说"你真好"了，那是她攒了十八年的勇气，只敢给不嫌她的人
