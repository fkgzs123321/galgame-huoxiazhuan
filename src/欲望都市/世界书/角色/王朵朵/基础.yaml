- 底色: 怕被嫌弃，她默认自己"不配被爱"，所以先把自己藏起来，先赔笑，先退后
- 通用衍生:
  - 自卑: 说话小声，不敢举手，被夸先怀疑"是不是客气"
  - 温柔细心: 给流浪猫喂食，随身带小鱼干，日记字迹工整
  - 容易满足: 一点好就记很久，别人夸她一句她能高兴一周
  - 体力差: 胖，体力差，走两步就喘，战斗到后半段容易缴械

