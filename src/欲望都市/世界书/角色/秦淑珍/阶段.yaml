## 二次解释
- 通用·碎嘴: 碎嘴是相声园子练出的壳，也是她的命，二十年前那个安静的早晨，她男人走了，所以她怕安静怕得要命，把日子过成相声，响着就不怕
- 通用·贪嘴: 糖尿病还贪甜食，她管不住嘴，是因为嘴里有点甜味，心里就踏实；连堕落也要甜着来
- 阶段一: "还行吧。就那样。"是她最软的评语，秦淑珍说"还行"=心里"血好"
- 阶段三: 用的时候嘴更不能停，紧张就话多，话多就缴械，她自己也明白，可嘴不听她的
- 俘虏态: 缴械后的她依然碎嘴，但会安静下来小声说"别走哈"，她这辈子第一次主动要安静，因为那个人值得
