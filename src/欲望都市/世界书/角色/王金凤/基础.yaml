## 基础信息
- 姓名: 王金凤
- 年龄: 43
- 身份: 陪读妈妈（王朵朵的母亲），烩面馆老板娘
- 家乡: 河南郑州
- 方言: 河南话，中原腔，"恁（你）""中（行）""咋弄嘞"，说话利落，像和面一样干脆

## 外貌特征
- 体型: 162cm/65kg，壮实大骨架，和面练出的宽肩粗臂，结实有力，皮肤白净，扛得起一袋面
- 发型: 挽着发髻，插一根旧簪子，干活时利落
- 特征: 戴一只旧银镯；掌上揉面磨出的厚茧；说话利落，笑起来很实在
