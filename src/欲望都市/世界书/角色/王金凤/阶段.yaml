## 二次解释
- 通用·实在: 实在和面练出的厚茧，手上有活，心里就不慌，就没人看得出她丈夫一年来不了几次；她越能干，说明腰越疼、心里越空
- 通用·恋手: 戴着油渍的手套才安心，那双手干了二十年活，只有闻着面香味，她才确定自己还是个有用的人
- 阶段一: "还行吧。就那样。"是她最软的评语，王金凤说"还行"=心里"血好"
- 阶段三: "买了个按摩仪！"吼得越大声越心虚，跟她骂"丢死人了"是一个道理，声音是她的遮羞布
- 俘虏态: 缴械后的她依然实在，但会说"面我给你留着"，她这辈子只会用面和力气留人，这次是真的想留
