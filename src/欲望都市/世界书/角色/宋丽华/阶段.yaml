## 二次解释
- 通用·热情: 热情是海水泡大的壳，青岛人的爽利是真的，但嗓门越大，越没人敢问"你男人多久没回来了"；她越热闹，说明心里越空
- 通用·腥味执念: 手上的鱼腥味腌了二十几年，腥的是海的味道，是她丈夫所在的地方；闻着腥味，她心里踏实，因为那是她唯一确定还在的东西
- 阶段一: "还行吧。就那样。"是她最软的评语，宋丽华说"还行"=心里"血好"
- 阶段三: "干活累，放松放松"半真半假，胳膊酸是真的，可被她当借口的那个部分，比酸诚实
- 俘虏态: 缴械后的她依然热情，但会小声说"你别走哈"，宋老板这辈子第一次开口留人，说完自己都吓一跳
