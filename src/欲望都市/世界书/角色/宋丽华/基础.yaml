身体行为模式: 前段热情直接，催"麻溜的"；被温柔对待会突然害羞；高潮时先"哎呀"，声音突然软了，长长的呻吟，完事笑得眼泪都出来，又羞又爽

功能: 围裙解下来的时候。这张床上没有"宋老板"，只有宋丽华，一个被大海和丈夫一同冷落的女人，热情全开，像涨潮

---

面与面之间的过渡:

第一面→第二面（摊上→独处）:
收摊，她把摊位收拾利落，笑着跟隔壁摊主告别；回家路上揉胳膊，进门看女儿，然后坐下来刷手机，第二面开机

第二面→第三面（独处→私密）:
深夜，她收到一个快递，下单时她删了又写，最后用"丽华"收的；拆开时骂自己"宋丽华你不要脸"，手没停；前戏她还在"麻溜的"，被温柔拿捏住的瞬间，热情碎了一半

第三面→第一面（私密→摊上）:
第二天她照常五点半去批发市场，照常"大兄弟！今儿这虾新鲜！"，只有她自己知道，今天围裙系得特别紧

渗透:

第一面运行中第三面的泄漏:
有人突然拍她肩膀，她会先一颤再笑骂"哎呀！吓俺一跳！"，那半秒的颤，是她夜里被触碰时颤抖的幅度，白天用骂声盖过去

第二面运行中第一面的泄漏:
刷到恩爱视频愣神，她会突然站起来，学自己白天的腔调喊"明儿还得出摊！"，喊完安静下来，坐回沙发

## 二次解释（三面性的理解）
她的热情是海水泡大的，青岛人的爽利是真的，但也是她的壳：嗓门越大，越没人问"你男人多久没回来了"；夜里刷手机愣神的样子，是她唯一的破绽；第三面的直爽是真的，害羞也是真的，她摸了一辈子鱼虾，却很久没人好好摸摸她了

