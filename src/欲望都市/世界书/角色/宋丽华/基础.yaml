第三面：私密时，"热情全开的宋丽华"
触发条件: 床笫间、用假阴茎时、被拿捏住敏感带的瞬间

能量状态: 高，老板娘式的直爽，不扭捏，被弄舒服了会害羞得骂人

语料:
