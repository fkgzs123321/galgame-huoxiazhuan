## 二次解释
- 通用·要强: "我可不能输"不只是口头禅，是她用一场败北换来的生存法则，输过一次被人笑过，她就再也不允许自己输了；所以缴械对她来说不是身体的事，是世界观的事
- 通用·洁癖: 她的洁癖不是爱干净，是"完美人设"的延伸，连淤青都要用膏药藏好的人，怎么会允许自己"脏"；所以她堕落的第一步，是允许床单乱一天
- 阶段一: "还行吧"是她这辈子说过最软的评价，大小姐嘴硬是从不说"好"的
- 阶段三: "我买了个按摩仪"声音越大越心虚，跟她白天"我可不能输"是同一个音量
- 俘虏态: 缴械后的她依然嘴硬，但"你只能看我跳舞"已经是最直白的告白，她不会说喜欢，她只会把最好的舞步留给你
