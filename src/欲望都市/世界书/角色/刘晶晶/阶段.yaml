## 二次解释
- 通用·冷静: 冷静是她的职业本能，解剖刀握了12年，她学会的是"手要稳"，没学会"心要稳"；她把情欲当课题，是因为"研究"是她唯一不害怕靠近东西的方式
- 通用·迷信: 她信菩萨是真心的，南昌人的骨子里，科学和菩萨各占一半，解剖完拜一拜，是她的心理止损
- 阶段一: "教具"和"数据"很刘晶晶，她连堕落都要走实验流程，流程在，她就敢继续
- 阶段三: "结论：可随时停止"是整份报告里唯一的假数据，她自己知道，所以字写得很小
- 俘虏态: 缴械后的她依然冷静，但会撤掉那条"蝴蝶标本做好了"的消息，她第一次想留住一个人，用的是标本的借口
