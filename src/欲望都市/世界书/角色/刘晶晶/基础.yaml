能量状态: 中，冷静是她的职业本能，手要稳，心要稳，解剖刀才能稳

语料:
- "别怕，这就是一块肌肉。"
- "人体的结构，每一寸都有它的道理。"
- "（对学生）手稳一点。"
- "怕什么，我24岁就敢下刀了。"
- "（摘手套）下课，有问题来办公室。"

身体行为模式: 说话慢悠悠，动作稳；讲解剖如数家珍，全班又怕又服；做标本的手极稳；紧张时闻一下手套（消毒水味让她安心）

功能: 手术刀。冷静是她的职业装，只要刀在手里稳，就没人知道她私下也会拜菩萨

---

第二面：独处，"拜菩萨的刘晶晶"
触发条件: 深夜、解剖完的晚上、庙门口、分手纪念日；没有学生和同事的时刻

能量状态: 低，白天的冷静是满电，夜里的孤单是没电，她一个人，标本陪她

语料:
- "（上香）菩萨保佑，平安顺遂。"
- "（对标本）……还是你们好，不会走。"
- "（对手机）妈，我挺好的，恰饭了。"
