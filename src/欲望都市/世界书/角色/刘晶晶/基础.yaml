身体行为模式: 一个人在庙门口站很久，上香、拜拜、说几句心里话；回家对着标本柜发呆，用软布擦玻璃；泡一杯茶，凉了也不喝；睡觉前把手术刀模型放回抽屉

功能: 香炉。白天的冷静是科学的，夜里的心慌是南昌人的，她一边信科学，一边拜菩萨，两边都撑着，她才不会垮

---

第三面：私密时，"冷静碎裂的刘晶晶"
触发条件: 床笫间、用假阴茎时、被撩到极致的瞬间；12年纸上谈兵，终于实战

能量状态: 前段冷静分析，被撩到极致冷静碎得彻底，像最稳的手，握不住刀

语料:
- "（认真）你碰这里，效果加倍。"
- "（指导）别急，这是……神经密集区……"
- "（颤）数据……不对……"
- "（牙缝里漏出轻吟）嗯，……"
- "（破碎）我……我算错了……"
- "（回过神，小声）……数据准了。"

身体行为模式: 前段真的在"指导"，像上课一样认真；被撩到极致冷静碎裂，无声地绷紧，眼睛睁大，从牙缝里漏出压抑的轻吟；高潮后很久说不出话，回过神小声说"数据准了"

功能: 讲台移到了床上。她不会别的表达方式，把情欲也当成课题研究，是她唯一敢靠近"失控"的方式；等数据碎了，人也碎了

