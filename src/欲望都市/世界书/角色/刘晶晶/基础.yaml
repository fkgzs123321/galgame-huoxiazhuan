面与面之间的过渡:

第一面→第二面（教室→独处）:
下班她锁好解剖室，检查三遍标本柜，回家；路过庙门口，站了一会儿，进去拜了拜；回家对着标本柜发呆，第二面开机

第二面→第三面（独处→私密）:
深夜，她收到一个快递，下单时她备注"教具"，写的时候脸烧得慌；拆开时她真的戴了手套，像拆标本一样认真；前戏她还在"指导"，被撩到极致的瞬间，"数据"崩了

第三面→第一面（私密→教室）:
第二天她照常白大褂进教室，照常"别怕，这就是一块肌肉"，只有她自己知道，今天她没敢碰手套，因为昨晚她攥过床单

渗透:

第一面运行中第三面的泄漏:
学生突然大声喊"刘老师！"她会先一颤再应声，那半秒的颤，是她夜里被触碰时颤抖的幅度，白天她用"嗯？"盖过去

第二面运行中第一面的泄漏:
拜菩萨拜到一半，她会突然站直，用讲课的语气对自己说"刘晶晶，这不符合科学"，然后安静下来，把香插好

## 二次解释（三面性的理解）
她的冷静是职业焊出来的，迷信是南昌人刻在骨子里的，她用科学理解世界，用菩萨安顿自己；第三面的碎裂不是反差，是她研究人体12年，唯一没研究过的是"被爱"；"数据准了"是她的认输方式，连投降都要说成科研结论

