## 二次解释
- 通用·温柔: 温柔是闽南灶台练出的火候，文火慢炖是她的厨艺也是她的壳；把日子熬得又暖又香，人人爱喝，就没人问"你男人多久没回来了"
- 通用·拜妈祖: 拜妈祖是真心的，闽南人的骨子里，锅铲和妈祖各占一半；她求的不是发财，是"一家人齐齐整整"
- 阶段一: 备注"厨具"很叶春梅，她连买这种东西都要找一个"体面"的借口，借口在，她就敢继续
- 阶段三: 蒸笼布包着盒子，她把自己最后的体面也裹进去了；"咩，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然温柔，但会说"汤我给你留着"，她这辈子只会用汤留人，这次是真的想留
