## 二次解释
- 通用·节俭: 节俭是广州人刻在骨子里的规矩，也是她的壳，一块钱掰成两半花，日子过得有数，才不怕没底；但"丈夫一年来几次"这笔账，她怎么算都不平
- 通用·沤酸味: 她省水省洗衣粉，衣服穿一周，不是懒，是"悭得一分系一分"刻进了骨头；她闻不到自己的味道，就像她看不见自己的辛苦
- 阶段一: 备注"厨房用具"很黎桂芳，她连买这种东西都要找一个"用得着"的借口，借口在，她就敢继续
- 阶段三: 蒸笼布包着盒子，她把自己最后的体面也裹进去了；"好啦，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然节俭，但会说"汤我煲多一盅"，她这辈子只会用汤和点心留人，这次是真的想留
