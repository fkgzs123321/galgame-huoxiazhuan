## 二次解释
- 通用·沉静: 沉静是四十年刀工练出的壳，手稳心就稳，是她唯一学会的活法；但纸屑簌簌落下的时候，她的心事也像纸屑一样落了一地，只是没人捡
- 通用·恋物: 旧衬衫是亡夫留下的，不是放不下，是夜里抱着衬衫，她才能假装不是一个人睡
- 阶段一: 备注"纸样"很白秋月，她连买这种东西都要找一个"体面"的借口，借口在，她就敢继续
- 阶段三: 用旧衬衫包着盒子，她把自己最后的体面也裹进去了；"莫麻达，最后一次"说一次软一分
- 俘虏态: 缴械后的她依然沉静，但会说"额给你剪一辈子的窗花"，四十年只给别人剪喜字，这次她想给自己留一个
