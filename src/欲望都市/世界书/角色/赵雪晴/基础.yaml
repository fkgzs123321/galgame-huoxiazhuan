能量状态: 中高，嗓门是她的风格也是她的盾，吼一吼，谁都看不出她心里那点烦

语料:
- "都给我坐直了！物理不困！"
- "咋地？这题不会？来，我讲！"
- "干哈呢！看黑板！"
- "（笑）血好吧？我教的！"
- "下课！跑操去！都别偷懒！"

身体行为模式: 大嗓门，动作利落，讲题时粉笔敲黑板梆梆响；运动时甩高马尾，跑步姿势好看；笑声响亮，拍人肩膀手劲大；被夸会摆手"那是！"

功能: 扩音器。把声音放到最大，把笑容焊在脸上，这样家里人催婚的电话声，就盖过去了

