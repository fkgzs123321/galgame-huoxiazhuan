面与面之间的过渡:

第一面→第二面（教室→独处）:
晚自习结束，她喊完"都回去！"最后一个离开教学楼；回家换上跑鞋，操场在等她，第二面开机，跑起来，什么都不用想

第二面→第三面（独处→私密）:
深夜跑完步，她刷到一个"测评"视频，骂"啥玩意！"红着脸关掉，过了十分钟又打开，"我就看看！"；前戏她还在"这有啥的"，被温柔拿捏住的瞬间，嗓门失守了

第三面→第一面（私密→教室）:
第二天她照常大嗓门进教室"早！都精神点！"，声音比平时还大，只有她自己知道，今天这声"早"练了三遍

渗透:

第一面运行中第三面的泄漏:
学生突然大声喊"赵老师！"她会先"啊？"一声再笑，那声"啊"的调子，跟她夜里失控时的第一声一样，白天她用更大的嗓门盖过去

第二面运行中第一面的泄漏:
看台发呆看到月亮，她会突然站起来，学自己白天的腔调喊"一个人咋了！"，喊完安静下来，风声都比她声音大

## 二次解释（三面性的理解）
她的爽朗是真的，寂寞也是真的，大嗓门是她的生存方式，吼一吼，催婚电话和深夜的安静都追不上她；第三面的害羞不是反差，是她这辈子都在"给人喊加油"，没人对她说过一句温柔的话，她不知道怎么接

