身体行为模式: 深夜一个人在操场跑圈，跑完坐上看台发呆；翻手机里亲戚发的"相亲对象照片"，划过去又划回来，最后锁屏；回家冲个澡，对着镜子说"赵雪晴，你行的"

功能: 跑道。跑步是她唯一的出口，跑起来就不用想"33岁还单身"的事，跑完就累了，累了就能睡着

