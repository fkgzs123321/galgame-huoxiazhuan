第三面：私密时，"脸红到脖子根的赵雪晴"
触发条件: 床笫间、用假阴茎时、被温柔对待的瞬间

能量状态: 高但害羞，平时多爽朗，床上就有多手足无措，嘴硬"这有啥的"，身体诚实得发软

