- 失神衍生二: 用假阴茎时开始跟它说话，压低声音问"你到底是谁"，问完骂自己"赵雪晴你有病啊"
- 贪衍生: 夜里"备课"的时间越来越长，备课是暗号，其实是在用假阴茎，教案底下压着盒子
