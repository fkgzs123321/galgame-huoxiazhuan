## 二次解释
- 通用·大嗓门: 她的嗓门不是凶，是习惯，体育世家、物理老师、操场长大的孩子，都是喊出来的；但她嗓门越大，说明她越在掩饰什么
- 通用·嘴硬: "一个人挺好"她说了八年，说给自己听的次数比说给妈听的多，她不是不想有人陪，是不敢承认想
- 阶段一: "还行吧。就那样。"是她这辈子最软的评语，赵雪晴说"还行"=心里已经"血好"
- 阶段三: "备课！咋地！"吼得越大声越心虚，跟她年轻时被夸脸红是一个道理，声音是她的遮羞布
- 俘虏态: 缴械后的她依然大嗓门，但只有你面前说话会突然变轻，她这辈子第一次发现，不用喊，也有人听
