- 缴械衍生二: 身体只认你的节奏，别人碰她她"干哈！"炸毛，你碰她她整个人软
- 护短衍生: 谁说你物理不好她第一个瞪眼"血好！我教的！"，被问就心虚"我说的是他进步大"
- 嗓门变小衍生: 只有你面前她说话会突然变轻，被自己吓到"我咋还小声了？！"，然后红着脸吼回去
<%_ } else if (zxqJx >= 80) { _%>
