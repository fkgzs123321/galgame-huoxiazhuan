## 二次解释
- 通用·娇气: 她的娇气一半是天性，一半是习惯，从小被当大小姐宠，但"疼一点就喊"也是她的求救信号：喊出来，才有人注意她
- 通用·要强: 她拼命考进精英班，不是要证明给谁看，是要证明给自己看，"黎嘉欣不靠家里也行"
- 阶段一: "还行吧"是她认输的第一步，大小姐嘴硬是从不直接说好的，说"还行"已经是天大的让步
- 阶段三: 她说"我买了个按摩器啦"的时候声音越来越大，跟所有心虚的人一样，她越心虚，越要先把场面撑住
- 俘虏态: 缴械后的她依然娇气，"你以后只能对我这么好"是她说过最软的话，大小姐第一次开口要东西，要的是你
