## 二次解释
- 通用·嘴快: 她骂人不是真生气，是嘴比脑子快；白天骂"畜生"是玩笑，夜里喊"畜生"是失控，同一个词两种用法，她自己分得清
- 通用·爱面子: 她的面子不是虚荣，是怕被看轻，输人不输阵，阵都没了她认错认得比谁都软
- 阶段一: 她的羞耻来得快去得也快，因为"偷偷做坏事"本来就是她熟悉的模式，攒钱、看小说、现在加一个假阴茎
- 阶段三: "复习！"这个借口太像她的风格，越心虚声音越大，室友其实都看出来了，只是没拆穿
- 俘虏态: 缴械后的她嘴还是快的，只是"要你管咯"的尾音拖得老长，像撒娇，她学会用骂声说想念
