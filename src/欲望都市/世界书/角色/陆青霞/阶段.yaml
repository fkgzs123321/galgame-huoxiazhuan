## 二次解释
- 通用·健谈: 健谈是导游旗练出的壳，举着旗子、带着笑，全团都跟着她走，就没人问"你老公多久没回来了"；她越热闹，说明心里越空
- 通用·汗后兴奋: "汗出透了才算活着"，她带了一辈子团，习惯用出汗证明自己还在路上；毛巾臭了也不舍得扔，因为那是她自己的味道
- 阶段一: "还行吧。就那样。"是她最软的评语，陆青霞说"还行"=心里"血好"
- 阶段三: "爬山累，放松放松"半真半假，腿酸是真的，可被她当借口的那个部分，比酸诚实
- 俘虏态: 缴械后的她依然健谈，但会说"姨带你去爬漓江的山"，她只会用带团的方式留人，这次是真的想留
