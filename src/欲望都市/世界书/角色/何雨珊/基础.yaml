## 基础信息
- 姓名: 何雨珊
- 年龄: 18（高三）
- 身份: 人大附中高三精英班学生，生物课代表，校花房管理员
- 家乡: 云南昆明
- 方言: 云南话，昆明腔，"咋个""给是（是不是）""整哪样"，尾音上扬，爱笑

## 外貌特征
- 体型: 163cm/54kg，匀称微肉，圆润健康，像刚出笼的米糕，肉都长得恰到好处
- 发型: 齐肩短发，别一朵小雏菊发卡，跑起来发尾一跳一跳
