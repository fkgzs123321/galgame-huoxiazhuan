- 底色: 怕被当成麻烦，花农家的孩子懂事早，心事咽下去，笑挂上去，不给任何人添麻烦
- 通用衍生:
  - 元气: 说话带笑，走路带小跳，心情不好的时候反而笑得更用力
  - 爱花: 花房管理员，随身带小喷壶，看到蔫的花就心疼
  - 慢热: 交心慢，但一旦认定了就掏心窝子
  - 花粉过敏: 自己种的花自己咳，花粉季战斗力减半

