## 二次解释
- 通用·元气: 她的阳光是真的，但也是习惯，花农家的孩子知道，花向阳才开，人向笑才暖；她心情不好时笑得更大声，因为不想让任何人担心
- 通用·慢热: 慢热不是冷淡，是心事要焐热才说得出口；花房是她唯一的出口，她对着花说的话，比对人说的多十倍
- 阶段一: 她连羞耻都带着花香，"对不起爸妈""跟花道歉"，她的道德感长在花田里
- 阶段三: "花要浇水呀！"这个借口太像她，她心虚的时候会下意识躲进最熟悉的东西里
- 俘虏态: 缴械后的她依然元气满满，只是"你好像我的花"这句话，是她这辈子说过最直白的情话
