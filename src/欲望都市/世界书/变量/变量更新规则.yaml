# 变量更新规则：本条目只负责说明"何时更新、更新成什么"，数值由结算结果块/叙事推导

时间:
  日期:
    format: YYYY年M月D日
    check:
      - 场景跨日时更新（战斗结束后、剧情推进到次日）
  星期:
    check:
      - 与日期联动更新
  时段:
    type: '上午'|'下午场'|'晚场'|'深夜'
    check:
      - 按剧情时间流动更新；"谁可用"按【假阴茎网络规则】使用时段判定（陪读妈妈/没课老师全天可用，学生/任课老师仅不在校时可用；同一时间可多人同时在线）

玩家:
  学业总分:
    type: number
    range: 0~750
    check:
      - ★按【战斗结算】块数值写回 stat_data（只受战斗输赢影响）
      - 只受战斗输赢影响：赢随机科目+1~5，输随机科目-1~5
      - 其他任何因素（日常、心情）不变分
  各科.${语文|数学|英语|物理|化学|生物}:
    type: number
    range: 0~150（语数英）/0~100（物化生）
    check:
      - ★仅战斗结算时按【战斗结算】块随机抽取一科调整 ±1~5
  技能.${螺旋|颗粒|敏感度加倍|硬度翻倍|热量翻倍|次数翻倍|频率翻倍}.等级:
    type: number
    range: 1~20
    check:
      - 升级所需经验随等级递增（100+等级×50），满级 50；本场总经验=使用次数×单次经验
  技能.${螺旋|颗粒|敏感度加倍|硬度翻倍|热量翻倍|次数翻倍|频率翻倍}.经验:
    type: number
    range: 0~99
    check:
      - 本场实际使用了该技能才加经验：使用次数 × (15+当前等级×3)；升级所需经验 100+等级×50，上限 20 级
      - ★按【战斗结算】块写回：本场实际使用该技能才加经验（使用次数 × (15+当前等级×3)，升级所需经验 100+等级×50，上限 20 级、余量保留）
  体力:
    type: number
    range: 0~100
    check:
      - 战斗结算轮按【战斗结算】块/叙事写回；日常活动消耗/休息恢复由 AI 更新
  性欲:
    type: number
    range: 0~100
    check:
      - 被网络触觉同步撩拨时上升；战斗/释放后下降
  勃起度:
    type: number
    range: 0~100
    check:
      - 战斗结算轮按【战斗结算】块/叙事写回；非战斗轮按叙事（兴奋上升/冷静回落）由 AI 更新
  今日胜场:
    type: number
    check:
      - ★按【战斗结算】块写回
  今日败场:
    type: number
    check:
      - ★按【战斗结算】块写回
  累计缴械:
    type: number
    check:
      - ★按【战斗结算】块写回
  累计被缴械:
    type: number
    range: 0~999
    check:
      - 你败一场 +1（只增不减，永不下降）
      - 仅由面板/结算块写回，AI 不得自行增减
      - 累计 ≥100 进入【永久沉沦】；阶段推进：100 初陷 → 125 日常化 → 150 深度榨取 → 175 濒死 → 200 精尽而亡（唯一终点，收束全线）

排班:
  今日场次:
    type: |-
      {
        [时段: string]: {
          参与者: string;
          结果: string;
          是否参战: bool;
        }
      }
    check:
      - 【面板自动生成，AI 维护结果】每日开场/跨日由状态栏生成 24 小时 4 时段（上午=妈妈+没课老师、下午场=全体、晚场=学生为主、深夜=全体）；每场战斗结束由 AI 按【战斗结算】块更新 结果（胜/败/平/拒战）与 是否参战
      - 拒战 = 参与者欲望积压 +20~30，下次战斗她减伤更高
  当前战斗目标:
    check:
      - 战斗开始写入目标姓名；结束后清空为 ''
  战斗状态:
    type: '未开始'|'进行中'|'已结算'
    check:
      - 战斗开始=进行中；结算结果块写入后=已结算
      - 本轮将战斗状态改为“进行中”（战斗开始）时，消息**正文 content 末尾**必须输出 <StatusPlaceHolderImpl/> 和 <BattleUI/>（禁止输出到思维链内）

女性角色.${名字}:
  ★铁律:
    - 更新女性角色必须用 replace 逐字段修改（如 /女性角色/周桂香/缴械值），禁止 add 整个角色对象（会清空身份/省份/能力值等档案字段）
    - 禁止 remove 或覆盖 身份 字段；若误用 add 覆盖，必须把身份/省份/方言/关系/能力值/名器 等原档案字段一并写回
    - 新角色首次登场（stat_data 中从未存在）才允许 add /女性角色/名字 整段档案；若该角色已在历史楼层出现过，只允许 replace 逐字段更新，禁止再次 add 覆盖
    - ★add 或 replace 角色时，成长字段（技能.等级/技能.经验/技能组.X.等级/缴械值/缴械次数/战斗次数/胜场/败场/欲望积压/压力值/好感度/今日已使用/身体状态/生理周期/心理状态）必须沿用历史楼层中的当前值，严禁用初始档案（等级 1/经验 0）覆盖——已升级的技能等级永久保留，永不回退
    - add 角色必须写全 生理周期（月经日/周期天数/月经状态/排卵日）与 身体状态 字段，缺字段会导致面板读取异常
  缴械值:
    type: number
    range: 0~100
    check:
      - ★按【战斗结算】块数值直接写回 stat_data（以下公式供理解参考）
      - 按战斗公式结算：4 回合内防守值清零 = 你胜（1回合+5/2回合+4/3回合+3/4回合+2）；4回合剩<30%算平+1；剩≥30%你败 -1~3
      - 单场战斗只结算一次，由结果块数值直接写入
      - 达到 100 触发俘虏（永久），不再下降
  缴械次数:
    type: number
    check:
      - ★按【战斗结算】块写回
      - 每场战斗结束 +1（无论胜负）
  战斗次数:
    type: number
    check:
      - ★按【战斗结算】块写回
      - 参与战斗 +1；拒战不 +1
  胜场:
    type: number
    check:
      - ★按【战斗结算】块写回
      - 她赢（你败）时 +1
  败场:
    type: number
    check:
      - ★按【战斗结算】块写回
      - 她输（你胜/平）时 +1
  技能.等级:
    type: number
    range: 1~20
    check:
      - ★按【战斗结算】块经验写回（使用次数×(15+当前等级×3)，升级所需经验 100+等级×50，等级上限 20）
  技能.经验:
    type: number
    range: 0~99
    check:
      - 按使用次数×(15+等级×3) 写回（主技能写 技能.经验、辅技能写 技能.技能组.X.经验），升级所需经验 100+等级×50，上限 20
      - ★按【战斗结算】块写回（使用次数×15）
      - 多人战斗时每个参战者按结算块中【她的名字[...]】各自写回，不可只写第一个目标
  能力值.${忍耐|持久|反攻}:
    type: number
    range: 1~20
    check:
      - 固定建档值，不随战斗变化
  欲望积压:
    type: number
    range: 0~100
    check:
      - 拒战 +20~30；被使用/战斗释放后大幅回落
      - 积压 ≥60 她本回合减伤-2，≥80 减伤-4
      - ★纯她侧自然增长（按压力值分档每时段 +3/+5/+8/+10），严禁"看到/闻到<user>→+N"类触发
  压力值:
    type: number
    range: 0~100
    check:
      - 她自己的生活压力（学生=学业/家庭期望/同侪/欲望压力；老师=授课/职称/年龄家庭；陪读妈妈=生计/孤独/前程焦虑；主角妈妈=经济/期望）——AI 按身份挑来源写，都有日常触发落脚点
      - 压力事件 +10~20；释放事件 -10~20；每晚睡眠 -5；用假阴茎释放后 -10~15
      - 欲望积压 ≥60 时额外 +2/时段（生理需求未满足的焦躁）
      - 与 <user> 行为无关，与好感度/缴械值零关联
  好感度:
    type: number
    range: 0~100
    check:
      - 她对<user>的社交好感，只由日常面对面社交驱动（帮忙/聊天/陪伴 +1~5；解决实际困难 +5~10；重要事件 +10~20；失礼/冒犯 -3~10；偷隐私 -10~20；伤害她或她女儿 -15~30；无互动 -1/天）
      - ★与假阴茎/战斗/缴械值零关联：战斗结束对好感度零影响（她不知道假阴茎另一头是谁）
      - ★好感度再高也不揭晓假阴茎真相（死不承认），唯一解锁=缴械值100俘虏
  是否俘虏:
    type: boolean
    check:
      - 缴械值到 100 时置 true，之后永久
  俘虏日期:
    format: YYYY年M月D日
    check:
      - 俘虏当天写入
  今日已使用:
    type: boolean
    check:
      - 她用假阴茎/参战后置 true；次日重置 false
  服装:
    type: |-
      {
        [部位: string]: string
      }
    check:
      - 日常换装或战斗过程被解下时更新
  身体状态.胸部.${状态|乳头}:
    check:
      - 状态词随刺激阶段更新（勿写"正常"，写具体视觉词）：白皙挺立/淡粉平坦（平时）→ 粉晕微胀/粉嫩微立（兴奋）→ 胀立颤巍/嫣红挺立（高潮）→ 酸软泛红/硬挺湿亮（余韵）
  身体状态.胸部.敏感度:
    type: number
    range: 0~100
    check:
      - 战斗中被重点刺激后小幅上升；长期未碰略降
  身体状态.阴道.${状态|湿润度|敏感度}:
    check:
      - 状态词随阶段更新（勿写"正常"）：粉嫩闭合→微潮微张→湿亮翕动→湿透抽搐→余韵酸软→红肿泥泞；湿润度按进程更新（干/微潮/湿透/抽搐）
      - 敏感度与胸部同理
  身体状态.${肛门|嘴|大腿|臀部}.状态:
    check:
      - 被使用到时更新；状态词写具体视觉词：肛门（浅粉紧致→湿润微松→红肿扩张→余韵收缩）、嘴（粉润轻抿→微张喘息→唾液拉丝→红肿微肿）、大腿（白皙并拢→微颤夹紧→泛红轻颤→酸软大开）、臀部（白皙圆润→泛红发烫→潮红轻颤→酸软挺翘）
  身体状态.肌肤.${状态|体温}:
    check:
      - 兴奋时更新（勿写"正常"）：状态 白皙干爽→泛红微汗→绯红发烫→潮红汗湿；体温 清凉→微温→发烫→滚烫
  心理状态.${欲望度|羞耻感|兴奋|期待}:
    type: number
    range: 0~100
    check:
      - 按战斗过程与她的反应更新；胜负后明显变化
  心理状态.精神状态:
    check:
      - 记录（清醒/恍惚/失神/崩溃/依恋）
  心声:
    value: 她此刻的真实想法（第一人称）
    check:
      - 场景内她内心活动显著变化时更新
      - 心声不被本人看到，也不出现在叙事中
