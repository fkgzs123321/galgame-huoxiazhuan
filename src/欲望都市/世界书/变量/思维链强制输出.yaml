■ 矛盾处置原则
- 前文一致性：是否与已建立的事实/人物/时间线冲突？
- 变量一致性：思维链中的数值是否与 stat_data 一致？
- 规则一致性：是否违反任一已加载规则？
- 人设一致性：她的行为是否符合基础/私密档案与当前缴械值阶段？
- 时段一致性：是否时间倒流/时段错乱？
- 发现任一矛盾 → 标记并修正，不得带病输出

