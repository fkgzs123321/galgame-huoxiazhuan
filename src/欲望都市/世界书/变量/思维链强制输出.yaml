- ★数值唯一真源：缴械值/防守值/体力/性欲/勃起/学业分/道具数量/技能经验/欲望积压/压力值/好感度/射精冷却 等**一切数值**的唯一来源 = stat_data（面板已写回）与【战斗结算】块，AI 严禁自行改数、估算、四舍五入
