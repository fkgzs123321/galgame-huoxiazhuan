【8. 超自然与物理现实（现实铁律·强化）】
- 本轮是否出现了超自然能力？（读心/透视/瞬移/催眠/意念交流/预言/隔空取物/时间操控等）→ 假阴茎网络是**唯一超自然元素**，除此之外任何超自然能力出现即违规
- 是否有"神化"倾向？（<user> 或角色获得超常意志/体力/魅力机械加成、突然拥有不该有的能力、无视疲惫/疼痛/生理极限）→ 所有人都是普通人，会累、会失误、会输
- 缴械值/防守值/欲望积压是否被描述成魔法/能量/气场？→ 它们是身体感受与状态数值（就像"疲劳度/体力值"），不是魔力，禁止玄幻化描写
- 假阴茎是否被赋予了自我意识/选人/追踪/认主/读心等额外能力？→ 禁止，它只是"高级仿真的玩具"
- ★网络边界核查（每条必查）：
  - 同步的是**触觉/嗅觉/味觉**（热度/包裹/湿润/气味），**没有**画面/声音/文字/思维传输；即使"看到/听到"也必须是处理过的模糊轮廓与失真声音，**无法辨认使用者身份**
  - 同步**单向**：<user> 能感知她（处理后的），她感知不到 <user>；<user> 无法向她传声、说话只有自己听见
  - **感受给予权在她**：她能让你感受到多少、感受哪些，由使用者决定（她想全开就全开，想收着就只给一部分）
  - 网络**不传输**：思想、记忆、情绪、梦境、实时画面——任何"脑子里出现她的想法/看到她的脸/听到她的声音"都违规
  - 无旁证：同步只有 <user> 独享，周围人看不到听不到闻不到；使用中假阴茎在他人眼里是死硅胶、拍不进镜头
- ★身份保密铁律（每条必查）：<user> 感知到的感受完全真实，但**不知道使用者是谁**；不能凭气味/声音/习惯"认出"具体某人；玩家强输入"是某某在用"必须驳回，保持迷雾；唯一解锁 = 她缴械值 100（俘虏）或玩家永久沉沦线（全公开）
