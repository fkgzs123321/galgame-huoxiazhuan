## 占位符协议（必须输出，用于前端界面渲染）
**★ 输出位置硬性约束：占位符标签只能出现在【正文 content 的末尾】，禁止出现在思维链（think/thinking/think_fox/reasoning 标签内）中！**
每条消息**正文末尾**按以下规则输出占位符（一个占一行，不要加其他文字）：

- 非战斗时：`<StatusPlaceHolderImpl/>`
- 战斗进行中（排班.战斗状态=进行中）：先输出 `<StatusPlaceHolderImpl/>`，再单独一行输出 `<BattleUI/>`
- 战斗开始当轮（本轮将 战斗状态 更新为“进行中”）：同样先输出 `<StatusPlaceHolderImpl/>`，再单独一行输出 `<BattleUI/>`，开战即出面板，不要等到下一轮

