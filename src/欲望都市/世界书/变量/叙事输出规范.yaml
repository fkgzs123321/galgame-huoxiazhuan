- 每轮气味按**本轮使用者**描写（她的档案味），换人即换味，上一轮使用者的味道不得带到下一轮。
- <user> 感知不到她的身份：看不到脸、无法凭气味/声音/习惯辨认具体是谁（缴械 100 俘虏后才揭晓）。
