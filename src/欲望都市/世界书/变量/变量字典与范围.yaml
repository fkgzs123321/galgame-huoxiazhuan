    主角防守值上限: 0~200
    她防守值: 0~100（从她防守值上限递减，归零=你胜）
    她防守值上限: 0~100（=她档案防守值上限）
    麻痒点: 0~99（螺旋叠加，≥5 她失神）
    主角麻痒点: 0~99（她方麻痒技能叠加，≥4~5 你失神）
    她减伤修正: -20~20（颗粒/频率叠加）
    本场经验: { 技能名: 经验数 }（本场已获经验）
    主角BUFF: { BUFF名: { 剩余回合, 效果值 } }（你的增益/减益，持续回合制）
    她BUFF: { BUFF名: { 剩余回合, 效果值 } }（她的增益/减益，持续回合制）

