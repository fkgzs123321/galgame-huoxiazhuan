```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>状态栏 · 欲望都市</title>
<style>
:root{
  --bg-0:#121218;--bg-1:#1b1b23;--bg-card:rgba(30,30,37,.92);
  --c-text:#e8e6e1;--c-dim:#9b988f;--c-dim2:#6d6a62;
  --c-accent:#e0525e;--c-gold:#d9a441;--c-success:#59c98d;--c-danger:#ff5c5c;
  --c-warn:#e0b45c;--c-info:#6aa8d8;--c-powder:#f5a3b7;--c-border:rgba(255,255,255,.09);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:clamp(10px,2vw,11px);--fs-sm:clamp(11px,2.2vw,12px);--fs-base:clamp(12px,2.5vw,13px);--fs-md:clamp(13px,2.8vw,15px);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);color:var(--c-text);background:transparent;font-size:var(--fs-base);line-height:1.5}
.sb{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;margin:6px 0;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:9px 14px;border-bottom:1px solid var(--c-border);background:linear-gradient(90deg,rgba(224,82,94,.12),transparent 40%)}
.hi{display:flex;align-items:center;gap:5px;white-space:nowrap}
.hl{color:var(--c-dim2);font-size:var(--fs-xs);letter-spacing:1px}
.hv{color:var(--c-text);font-weight:600}
.hv.gold{color:var(--c-gold)}
.hv.accent{color:var(--c-accent)}
.hv.succ{color:var(--c-success)}
.hv.danger{color:var(--c-danger)}
.mini-bar{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar>i{display:block;height:100%;border-radius:3px}
/* ===== 主题系统: dark(默认) / glass(磨砂玻璃) / light(亮色) ===== */
#sb-root[data-theme="light"]{
  --bg-0:#f7f5ef;--bg-1:#eeebe3;--bg-card:rgba(255,255,255,.96);
  --c-text:#26251f;--c-dim:#6f6c62;--c-dim2:#9c988c;
  --c-accent:#c2404a;--c-gold:#a37412;--c-success:#2f8f62;--c-danger:#d64545;
  --c-warn:#a3742a;--c-info:#3f77a3;--c-powder:#b8587f;
  --c-border:rgba(0,0,0,.14);
}
#sb-root[data-theme="glass"]{
  --bg-0:rgba(16,16,22,.78);--bg-1:rgba(24,24,32,.82);--bg-card:rgba(30,30,38,.66);
  --c-text:#f5f3ec;--c-dim:#c4c0b4;--c-dim2:#a09c90;
  --c-accent:#ff7d88;--c-gold:#e8b84f;--c-success:#6fd8a4;--c-danger:#ff7a7a;
  --c-warn:#f0c060;--c-info:#8fc1e8;--c-powder:#ffb8ca;
  --c-border:rgba(255,255,255,.18);
}
#sb-root[data-theme="glass"] .sb,#sb-root[data-theme="glass"] .detail,#sb-root[data-theme="glass"] .panel,
#sb-root[data-theme="glass"] .battle-wrap,#sb-root[data-theme="glass"] .roster-card{
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
}
/* ===== 主题系统 v2: dark(深色·默认) / light(浅色) / glass(磨砂玻璃) / contrast(强对比) / pink(粉色) / blue(蓝色) / gold(金色) ===== */
#sb-root[data-theme="contrast"]{
  --bg-0:#000000;--bg-1:#0a0a0c;--bg-card:#101014;
  --c-text:#ffffff;--c-dim:#e6e6e6;--c-dim2:#bfbfbf;
  --c-accent:#ffcc00;--c-gold:#ffd700;--c-success:#00ff88;--c-danger:#ff4d4d;
  --c-warn:#ffcc44;--c-info:#00ccff;--c-powder:#ff9ad5;
  --c-border:rgba(255,255,255,.35);
  --fs-xs:clamp(10px,2vw,12px);--fs-sm:clamp(11px,2.2vw,13px);--fs-base:clamp(13px,2.6vw,15px);--fs-md:clamp(14px,2.9vw,16px);
}
#sb-root[data-theme="pink"]{
  --bg-0:#fff0f5;--bg-1:#ffe4ee;--bg-card:#fff8fb;
  --c-text:#5c2433;--c-dim:#a0677a;--c-dim2:#c28fa2;
  --c-accent:#e0457c;--c-gold:#c98a2e;--c-success:#4a9e7a;--c-danger:#e04545;
  --c-warn:#c07a2e;--c-info:#6a8fc9;--c-powder:#e77fa3;
  --c-border:rgba(200,80,130,.22);
  --font:"Yuanti SC","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;
}
#sb-root[data-theme="pink"] .hd{background:linear-gradient(90deg,rgba(224,69,124,.14),transparent 40%);border-bottom-color:rgba(224,69,124,.22)}
#sb-root[data-theme="blue"]{
  --bg-0:#0d1626;--bg-1:#15203a;--bg-card:rgba(21,32,58,.92);
  --c-text:#eaf2ff;--c-dim:#a8c0e8;--c-dim2:#7d93b8;
  --c-accent:#5ab0ff;--c-gold:#e8c060;--c-success:#5ad6a0;--c-danger:#ff6a6a;
  --c-warn:#f0c060;--c-info:#7ac8ff;--c-powder:#ffb0d0;
  --c-border:rgba(120,170,255,.22);
}
#sb-root[data-theme="blue"] .hd{background:linear-gradient(90deg,rgba(90,176,255,.16),transparent 40%);border-bottom-color:rgba(90,176,255,.25)}
#sb-root[data-theme="gold"]{
  --bg-0:#1a1408;--bg-1:#261d0c;--bg-card:rgba(38,29,12,.94);
  --c-text:#f5ead0;--c-dim:#cbb98a;--c-dim2:#9c8c60;
  --c-accent:#e8b64c;--c-gold:#ffd970;--c-success:#8fd4a0;--c-danger:#ff8a6a;
  --c-warn:#f0c060;--c-info:#a0c8f0;--c-powder:#f0c0a0;
  --c-border:rgba(232,182,76,.28);
  --font:"Songti SC","STSong","SimSun","PingFang SC","Microsoft YaHei",serif;
}
#sb-root[data-theme="gold"] .hd{background:linear-gradient(90deg,rgba(232,182,76,.18),transparent 40%);border-bottom-color:rgba(232,182,76,.3)}

.theme-btn,.bg-btn{cursor:pointer;font-size:12px;font-weight:700;opacity:1;transition:opacity .15s;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--c-border);color:var(--c-text);white-space:nowrap}
/* 动态背景 */
#sb-root[data-bg="aurora"] .sb{background:linear-gradient(135deg,var(--bg-0),var(--bg-1),rgba(255,255,255,.06),var(--bg-1));background-size:320% 320%;animation:ydsSbAurora 16s ease infinite}
#sb-root[data-bg="rainbow"] .sb{background:linear-gradient(135deg,#ff6b8a,#b06bff,#4fb3ff,#3dd68c,#ffd76b,#ff8a5c,#ff6b8a);background-size:420% 420%;animation:ydsSbAurora 18s ease infinite}
#sb-root[data-theme="light"][data-bg="rainbow"] .sb,#sb-root[data-theme="pink"][data-bg="rainbow"] .sb{background:linear-gradient(135deg,#ffe6ec,#e6e6ff,#e6fff0,#fffbe6,#ffe9d6,#ffe6ec);background-size:420% 420%;animation:ydsSbAurora 18s ease infinite}
@keyframes ydsSbAurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media(prefers-reduced-motion:reduce){#sb-root[data-bg="aurora"] .sb,#sb-root[data-bg="rainbow"] .sb{animation:none}}
.hp-fill{box-shadow:0 0 8px rgba(255,255,255,.22)}
.hp-fill.hp-low{animation:ydsSbLow 1s ease infinite}
@keyframes ydsSbLow{0%,100%{opacity:1;box-shadow:0 0 6px rgba(255,92,92,.4)}50%{opacity:.55;box-shadow:0 0 18px rgba(255,92,92,.95)}}
.theme-btn:hover{opacity:.85;border-color:var(--c-gold)}
#sb-root[data-theme="light"] .theme-btn{background:rgba(0,0,0,.04)}
.mini-num{font-size:10px;color:var(--c-text);font-weight:700;margin-left:3px;min-width:16px;display:inline-block}

.battle-wrap{margin:10px 14px 0}
.battle{padding:10px 12px;border-radius:9px;border:1px solid rgba(224,82,94,.25);background:linear-gradient(120deg,rgba(224,82,94,.08),rgba(224,82,94,.02) 55%)}
.battle-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.battle-name{font-size:14px;font-weight:700;color:var(--c-accent)}
.battle-tag{font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(224,82,94,.15);color:var(--c-accent)}
.hp-row{display:flex;align-items:center;gap:8px}
.hp-label{font-size:11px;color:var(--c-dim2);width:52px;flex-shrink:0}
.hp-track{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.hp-fill{height:100%;border-radius:5px;transition:width .4s ease}
.hp-num{font-size:12px;font-weight:600;min-width:52px;text-align:right}
.battle-grid{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--c-dim)}
.battle-state{margin-top:8px;padding:6px 10px;border-radius:7px;font-size:12px;background:rgba(255,255,255,.04);color:var(--c-dim)}
.battle-state.进行中{color:var(--c-accent);background:rgba(224,82,94,.12)}
.battle-state.已结算{color:var(--c-success)}
.tabs{display:flex;gap:4px;padding:6px 10px 0}
.tab{padding:5px 14px;border-radius:8px 8px 0 0;background:transparent;color:var(--c-dim);border:1px solid transparent;border-bottom:none;cursor:pointer;font-size:12px;transition:all .15s ease}
.tab:hover{color:var(--c-text)}
.tab.active{background:var(--bg-card);color:var(--c-text);border-color:var(--c-border)}
.panel{padding:10px 14px 14px}
.roster-head{display:flex;justify-content:space-between;color:var(--c-dim2);font-size:11px;letter-spacing:1px;margin-bottom:8px}
.roster-count{color:var(--c-accent)}
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.roster-group{margin-bottom:12px}
.roster-group-title{color:var(--c-info);font-size:12px;font-weight:700;letter-spacing:2px;margin:2px 0 7px;padding-bottom:4px;border-bottom:1px dashed var(--c-border)}
.rf-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rf-btn{font-size:11px;padding:2px 10px;border-radius:12px;border:1px solid var(--c-border);color:var(--c-dim2);cursor:pointer;transition:all .15s}
.rf-btn:hover{border-color:var(--c-info)}
.rf-btn.active{background:rgba(106,168,216,.15);border-color:var(--c-info);color:var(--c-info)}
.roster-card{padding:8px 10px;border-radius:9px;background:var(--bg-card);border:1px solid var(--c-border);cursor:pointer;transition:all .15s ease}
.roster-card:hover{border-color:rgba(224,82,94,.3);transform:translateY(-1px)}
.roster-card.captured{border-color:rgba(224,82,94,.3);background:linear-gradient(150deg,rgba(224,82,94,.1),var(--bg-card) 60%)}
.roster-card.fighting{border-color:var(--c-gold);box-shadow:0 0 0 1px rgba(217,164,65,.25)}
.rc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rc-name{font-weight:700;font-size:12.5px;color:var(--c-text)}
.rc-role{font-size:10px;color:var(--c-dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-tags{display:flex;gap:4px;margin-top:4px;min-height:14px}
.rc-tag{font-size:10px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--c-dim)}
.rc-tag.cap{color:var(--c-accent)}
.rc-tag.hot{color:var(--c-danger)}
.rc-tag.fgt{color:var(--c-gold)}
.rc-tag.pres{color:var(--c-warn)}
.rc-meta{display:flex;gap:10px;margin-top:5px;font-size:10.5px;align-items:center}
.rc-meta .fav{color:var(--c-powder);font-weight:800;background:rgba(255,120,170,.14);padding:1px 7px;border-radius:8px;font-size:11px}
.rc-meta .jx-lbl{color:var(--c-info);font-weight:700}
.rc-hp{display:flex;align-items:center;gap:6px;margin-top:6px}
.rc-track{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.rc-fill{height:100%;border-radius:3px}
.rc-num{font-size:10.5px;color:var(--c-dim);min-width:20px;text-align:right}
.rc-sub{margin-top:5px;font-size:10.5px;color:var(--c-dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:7px;margin-bottom:4px;background:var(--bg-card);border:1px solid var(--c-border)}
.sched-time{min-width:56px;font-weight:700;color:var(--c-gold);font-size:12px}
.sched-p{flex:1;font-size:12px;color:var(--c-text)}
.sched-p.done{color:var(--c-dim2)}
.sched-result{font-size:12px;color:var(--c-dim)}
.sched-result.win{color:var(--c-success)}
.sched-result.lose{color:var(--c-danger)}
.sched-result.refuse{color:var(--c-warn)}
.sched-empty{color:var(--c-dim2);font-size:12px;padding:8px}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.skill-card{padding:8px 10px;border-radius:8px;background:var(--bg-card);border:1px solid var(--c-border)}
.sk-top{display:flex;justify-content:space-between;align-items:baseline}
.sk-name{font-weight:700;font-size:13px;color:var(--c-gold)}
.sk-lv{font-size:11px;color:var(--c-dim)}
.sk-exp{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:10.5px;color:var(--c-dim2)}
.sk-track{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.sk-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c-gold),#e8c77a)}
.sk-desc{font-size:11px;color:var(--c-dim);line-height:1.55}
.detail{margin-top:6px}
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:10px}
.detail-back{cursor:pointer;color:var(--c-dim);font-size:12px}
.detail-back:hover{color:var(--c-accent)}
.detail-name{font-size:16px;font-weight:700}
.detail-role{font-size:12px;color:var(--c-dim)}
.detail-tag{font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(224,82,94,.15);color:var(--c-accent)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.d-sec{padding:8px 10px;border-radius:8px;background:var(--bg-card);border:1px solid var(--c-border);margin-bottom:8px}
.d-sec-title{font-size:11px;color:var(--c-dim2);letter-spacing:2px;margin-bottom:6px}
.nsfw-tag{font-size:9px;color:var(--c-accent);border:1px solid rgba(224,82,94,.3);border-radius:4px;padding:0 4px;vertical-align:1px}
.d-line{display:flex;gap:8px;font-size:12px;padding:2px 0}
.d-line span{color:var(--c-dim2);min-width:56px;flex-shrink:0}
.d-line b{font-weight:500;color:var(--c-text);word-break:break-all}
.d-text{font-size:12px;color:var(--c-dim);line-height:1.6;margin-bottom:4px}
.psy-row{display:flex;flex-wrap:wrap;gap:8px 18px}
.psy{font-size:12px;color:var(--c-dim);display:inline-flex;align-items:center;gap:6px}
.psy i{display:inline-block;width:56px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.body-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.body-card{padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--c-border)}
.bc-name{font-size:11px;font-weight:700;color:var(--c-powder);margin-bottom:3px}
.bc-line{font-size:11px;color:var(--c-dim);margin:2px 0}
.bc-line i{display:inline-block;width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;vertical-align:middle;margin-right:4px}
.loading{text-align:center;padding:30px;color:var(--c-dim);font-size:var(--fs-md);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.empty{text-align:center;padding:26px 14px;color:var(--c-dim);font-size:13px}
.empty .dim{font-size:11px;opacity:.65;margin-top:6px}
/* 各科学业 */
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.subj{background:rgba(255,255,255,.05);border:1px solid var(--c-border);border-radius:7px;padding:5px 8px;text-align:center}
.subj .sn{font-size:10px;color:var(--c-dim2);display:block}
.subj .sv{font-size:13px;font-weight:700;color:var(--c-gold)}
.subj .sv.full{color:var(--c-success)}
.subj .sv.low{color:var(--c-danger)}
/* 她的道具栏 */
.her-item-mini{display:flex;flex-wrap:wrap;gap:5px}
.her-item-mini .him{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.25);color:var(--c-gold)}
.her-item-mini .him b{color:var(--c-text)}
/* 心声气泡 */
.voice-box{margin-top:6px;padding:7px 10px;border-radius:8px;background:rgba(245,163,183,.08);border:1px solid rgba(245,163,183,.2);font-size:12px;color:var(--c-powder);font-style:italic;line-height:1.5}
.voice-box .vl{font-size:10px;color:var(--c-dim2);font-style:normal;display:block;margin-bottom:2px}
/* 战斗交互 */
.battle-ctrl{margin:10px 14px 0;padding:10px 12px;border-radius:9px;border:1px solid var(--c-gold);background:linear-gradient(120deg,rgba(217,164,65,.08),rgba(217,164,65,.02) 55%)}
.battle-ctrl-title{font-size:12px;font-weight:700;color:var(--c-gold);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.battle-ctrl-title .rounds{font-size:10px;color:var(--c-dim2);font-weight:400}
.skill-sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:8px}
.skill-opt{padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--c-border);cursor:pointer;transition:all .15s ease;font-size:11px;color:var(--c-dim)}
.skill-opt .s-lv{color:var(--c-gold);font-weight:700}
.skill-opt.sel{border-color:var(--c-gold);background:rgba(217,164,65,.12);color:var(--c-text)}
.skill-opt.off{opacity:.4}
.action-input{width:100%;min-height:52px;padding:7px 10px;border-radius:7px;border:1px solid var(--c-border);background:rgba(255,255,255,.04);color:var(--c-text);font-size:12px;font-family:inherit;resize:vertical;box-sizing:border-box}
.action-input:focus{outline:none;border-color:var(--c-gold)}
.battle-btn{width:100%;margin-top:8px;padding:8px 0;border-radius:7px;border:none;background:linear-gradient(90deg,var(--c-accent),#c44550);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s ease}
.battle-btn:hover{opacity:.9}
.battle-btn:disabled{opacity:.4;cursor:not-allowed}
.battle-tip{font-size:10px;color:var(--c-dim2);margin-top:6px;line-height:1.6}
.formula{font-size:10px;color:var(--c-dim2);background:rgba(255,255,255,.04);border-radius:6px;padding:5px 8px;margin-top:6px;line-height:1.6}
@media(max-width:480px){
  .roster-grid{grid-template-columns:repeat(2,1fr)}
  .hd{gap:6px 10px}
  .mini-bar{width:48px}
  .hp-label{width:46px}
  .subjects{grid-template-columns:repeat(2,1fr)}
  .skill-sel{grid-template-columns:repeat(2,1fr)}
  .detail{padding:8px 9px}
  .d-sec{padding:7px 8px}
  .d-sec .d-title{font-size:11px}
  .kv{font-size:11px;padding:4px 0}
  .body-grid{grid-template-columns:repeat(2,1fr)}
  .action-input{min-height:52px;font-size:13px}
  .battle-btn{padding:11px 0;font-size:14px}
  .her-item-mini .him{font-size:11px;padding:4px 9px}
}
@media(max-width:360px){
  .roster-grid{grid-template-columns:1fr}
  .skill-grid{grid-template-columns:1fr}
  .subjects{grid-template-columns:1fr}
  .body-grid{grid-template-columns:1fr}
  .stats-top{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

var TH_HOSTS=[window,window.parent,window.top].filter(function(w,i,arr){return w&&arr.indexOf(w)===i});
function pickHostFn(name){
  if(typeof window[name]==='function')return function(){return window[name].apply(window,arguments)};
  for(var i=0;i<TH_HOSTS.length;i++){try{var h=TH_HOSTS[i];if(typeof h[name]==='function')return function(host,n){return function(){return host[n].apply(host,arguments)}}(h,name)}catch(e){}}
  return null;
}
function pickHostValue(name){
  if(window[name]!==undefined)return window[name];
  for(var i=0;i<TH_HOSTS.length;i++){try{if(TH_HOSTS[i][name]!==undefined)return TH_HOSTS[i][name]}catch(e){}}
  return undefined;
}
function getMvu(){return pickHostValue('Mvu')||window.Mvu||null}

function parseEmbeddedStat(){
  var el=document.getElementById('stat-embed');
  if(!el)return null;
  var raw=(el.textContent||el.innerText||'').trim();
  if(!raw||raw.indexOf('format_message_variable')>=0)return null;
  try{var parsed=JSON.parse(raw);
    if(parsed&&typeof parsed==='object'){
      if(parsed.stat_data&&typeof parsed.stat_data==='object')return parsed.stat_data;
      return parsed;
    }
  }catch(e){}
  return null;
}
function hasData(o){return o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length>0}
function pickStatData(source){if(!source||typeof source!=='object')return null;var stat=source.stat_data;if(hasData(stat))return stat;if(hasData(source)&&(source.排班||source.玩家||source.时间||source.女性角色))return source;return null}

function resolveMessageIdFromDom(){
  try{
    var frame=window.frameElement;
    if(frame&&frame.closest){var mes=frame.closest('.mes');if(mes){var id=parseInt(mes.getAttribute('mesid'),10);if(id>=0)return id}}
    var el=frame;
    while(el){if(el.classList&&el.classList.contains('mes')){var id2=parseInt(el.getAttribute('mesid'),10);if(id2>=0)return id2}el=el.parentElement}
    for(var i=0;i<TH_HOSTS.length;i++){try{var host=TH_HOSTS[i];var host$=host.$||host.jQuery;if(!host$||!frame)continue;var $mes=host$(frame).closest('.mes');if($mes&&$mes.length){var id3=parseInt($mes.attr('mesid'),10);if(id3>=0)return id3}}catch(e){}}
  }catch(e){}
  return -1;
}
function resolveMessageIdFromIframeName(){
  var fn=pickHostFn('getIframeName');if(!fn)return -1;
  try{var name=String(fn()||'');var m=/^TH-message--(\d+)--/.exec(name);if(m)return parseInt(m[1],10)}catch(e){}
  return -1;
}
function resolveMessageId(){
  var fromDom=resolveMessageIdFromDom();if(fromDom>=0)return fromDom;
  var fromName=resolveMessageIdFromIframeName();if(fromName>=0)return fromName;
  if(typeof window.message_id==='number'&&window.message_id>=0)return window.message_id;
  var fn=pickHostFn('getCurrentMessageId');
  if(fn){try{var id=fn();if(typeof id==='number'&&id>=0)return id}catch(e){}}
  return -1;
}
function getMessageOption(){var messageId=resolveMessageId();return{type:'message',message_id:messageId>=0?messageId:'latest'}}

function deepMergeStat(dst,src){
  if(!src||typeof src!=='object')return dst;
  var out={};try{out=JSON.parse(JSON.stringify(dst||{}))}catch(e){out={}}
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k))continue;
    var sv=src[k],dv=out[k];
    if(sv&&typeof sv==='object'&&!Array.isArray(sv)&&dv&&typeof dv==='object'&&!Array.isArray(dv)){out[k]=deepMergeStat(dv,sv)}
    else{out[k]=sv}
  }
  return out;
}
// 读变量用【最新楼】（skill 读取降级链：最新assistant楼/latest 优先——技能升级/战斗结算都发生在最新楼，状态栏在任何楼层都要能读到）
// 写回仍用 getMessageOption()（自己楼层，见 ensureSchedule/advancePhysio——写回不能改 latest 会破坏目标楼层）
function getReadOption(){return{type:'message',message_id:'latest'}}
function readStatData(){
  var stat=null;
  // ★第一优先：战斗系统.js（TH 脚本）中继到主页面的最新 stat_data——消息环境拿不到 TH API 时这是唯一可靠通路（skill 坑#27：常驻脚本捕获→全局中继→界面纯读）
  try{var relay=(window.__ydsLatestStat&&window.__ydsLatestStat.stat_data)?window.__ydsLatestStat.stat_data:null;if(relay&&hasData(relay))stat=relay}catch(e){}
  if(!stat){try{var Mvu2=getMvu();if(Mvu2&&typeof Mvu2.getMvuData==='function'){stat=pickStatData(Mvu2.getMvuData(getReadOption()))}}catch(e){}}
  if(!stat){try{var gv=pickHostFn('getVariables');if(gv){stat=pickStatData(gv(getReadOption()))}}catch(e){}}
  if(!stat&&cachedStatFromBridge&&hasData(cachedStatFromBridge))stat=cachedStatFromBridge;
  if(!stat){var embedded=parseEmbeddedStat();if(embedded)stat=embedded}
  if(!stat){try{var gav=pickHostFn('getAllVariables');if(gav){stat=pickStatData(gav())}}catch(e){}}
  return deepMergeStat(DEFAULT_STAT,stat||{});
}
function requestStatFromBridge(){
  var mesId=resolveMessageId();var payload={type:'yds-mvu-stat-request',messageId:mesId};
  for(var i=0;i<TH_HOSTS.length;i++){try{TH_HOSTS[i].postMessage(payload,'*')}catch(e){}}
}
function waitForReadableStat(timeoutMs,cb){
  timeoutMs=timeoutMs||6000;var started=Date.now();
  (function poll(){
    var stat=readStatData();
    if(Object.keys(stat).length>0){cb(stat);return}
    requestStatFromBridge();
    if(Date.now()-started<timeoutMs){setTimeout(poll,180)}else{cb(readStatData())}
  })();
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(v,d){if(Array.isArray(v))v=v[0];v=parseFloat(v);d=(d===undefined)?0:d;return isNaN(v)?d:v}
function pct(v,max){v=num(v,0);max=num(max,100);return Math.max(0,Math.min(100,max>0?(v/max)*100:0))}
function clamp(v,min,max){v=num(v,0);return Math.max(min,Math.min(max,v))}
function kv(k,v,cls){return '<div class="d-line"><span>'+k+'</span><b'+(cls?' style="color:'+cls+'"':'')+'>'+esc(v)+'</b></div>'}
function bar(label,val,max,color){
  max=max||100;var v=clamp(val,0,max);
  var c=color||(v>=80?'linear-gradient(90deg,#e0525e,#ff8a95)':v>=40?'linear-gradient(90deg,#d9a441,#e8c77a)':'linear-gradient(90deg,#6aa8d8,#a8d4f0)');

}
function miniBar(v,color){return '<span class="mini-bar"><i style="width:'+clamp(v,0,100)+'%;background:'+color+'"></i></span>'}
function psyBar(v,color){return '<i style="width:'+clamp(v,0,100)+'%;background:'+color+'"></i>'}

/* 生理状态 → 外在表现映射（与"生理数值规范与限制"世界书一致） */
function physioDesc(c){
  var out=[];
  var body=obj(c.身体状态);
  var v=num(obj(body.阴道).湿润度,0);
  if(v>=80)out.push('阴道泛滥，水声明显');
  else if(v>=50)out.push('湿滑难耐，水声渐起');
  else if(v>=20)out.push('微润，有抵抗');
  else out.push('干涩，进入困难');
  var cs=num(obj(body.胸部).敏感度,0);
  if(cs>=90)out.push('胸部一碰即痉挛');
  else if(cs>=60)out.push('胸部轻碰即叫');
  else if(cs>=30)out.push('胸部触碰会轻颤');
  else out.push('胸部反应迟钝');
  var vs=num(obj(body.阴道).敏感度,0);
  if(vs>=90)out.push('阴道触之即失神边缘');
  else if(vs>=60)out.push('阴道一进就颤');
  else if(vs<30)out.push('阴道钝感');
  var pc=obj(c.生理周期);
  if(pc.月经状态==='经期')out.push('经期中，第1~3天不可战斗');
  else if(pc.月经状态==='排卵期')out.push('排卵期，欲望高涨');
  if(pc.怀孕)out.push('已怀孕'+num(pc.怀孕周数,0)+'周，禁止剧烈战斗');
  return out.join('；')||'正常';
}

  for(var f=0;f<filters.length;f++){
    var fg=filters[f];
    html+='<span class="rf-btn'+(State.rosterFilter===fg?' active':'')+'" data-act="rfilter" data-filter="'+fg+'">'+fg+'</span>';
  }
  html+='</div>';
  // 内置角色分类表（38人固定；身份字段可能被 AI 覆盖丢失时兜底，防止划错分组）
  var ROLE_MAP={丽莎·伊万诺娃:'学生',何玉兰:'陪读妈妈',何雨珊:'学生',刘晶晶:'老师',叶春梅:'陪读妈妈',叶诗涵:'学生',周桂香:'陪读妈妈',周语桐:'学生',唐婉清:'老师',娜塔莎·伊万诺娃:'陪读妈妈',宋丽华:'陪读妈妈',宋佳凝:'学生',宋雅琴:'主角妈妈',张慧娟:'老师',李红梅:'老师',林汐瑶:'学生',林秀英:'陪读妈妈',沈若兰:'老师',王朵朵:'学生',王金凤:'陪读妈妈',白秋月:'陪读妈妈',白若薇:'学生',石小婉:'学生',石巧云:'陪读妈妈',秦可心:'学生',秦淑珍:'陪读妈妈',艾米丽·陈:'老师',苏婉如:'陪读妈妈',苏晚晴:'学生',赵雪晴:'老师',金顺姬:'陪读妈妈',陆芷晴:'学生',陆青霞:'陪读妈妈',陈淑芬:'陪读妈妈',陈雪梨:'学生',韩美娜:'学生',黎嘉欣:'学生',黎桂芳:'陪读妈妈'};
  function classifyRole(nm2,idt2){
    if(ROLE_MAP[nm2])return ROLE_MAP[nm2];
    var id=String(idt2||'');
    if(id.indexOf('主角妈妈')>=0||id.indexOf('主角')>=0)return '主角妈妈';
    if(id.indexOf('学生')>=0)return '学生';
    if(id.indexOf('老师')>=0||id.indexOf('班主任')>=0||id.indexOf('教师')>=0)return '老师';
    if(id.indexOf('陪读妈妈')>=0||id.indexOf('母亲')>=0||id.indexOf('妈妈')>=0)return '陪读妈妈';
    return '学生';
  }
  // 按身份分组（学生/老师/陪读妈妈/主角妈妈）
  var groups={学生:[],老师:[],陪读妈妈:[],主角妈妈:[]};
  for(var i=0;i<keys.length;i++){
    var nm=keys[i];
    var idt=String(obj(roles[nm]).身份||'');
    var cls=classifyRole(nm,idt);
    if(cls==='主角妈妈')groups.主角妈妈.push(nm);
    else groups[cls].push(nm);
  }
  var order=['学生','老师','陪读妈妈','主角妈妈'];
  for(var g=0;g<order.length;g++){
    var grp=order[g];

      html+='<div class="roster-card'+(c.是否俘虏?' captured':'')+(name===tgt?' fighting':'')+'" data-act="detail" data-name="'+esc(name)+'">'
        +'<div class="rc-top"><span class="rc-name">'+esc(name)+'</span><span class="rc-role">'+esc(shortRole(c.身份))+'</span></div>'
        +'<div class="rc-tags">'
        +(c.是否俘虏?'<span class="rc-tag cap">俘</span>':'')
        +(num(c.欲望积压,0)>=60?'<span class="rc-tag hot">积压'+esc(c.欲望积压)+'</span>':'')
        +(num(c.压力值,0)>=60?'<span class="rc-tag pres">压力'+esc(c.压力值)+'</span>':'')
        +(name===tgt?'<span class="rc-tag fgt">战斗中</span>':'')
        +'</div>'
        +'<div class="rc-meta"><span class="fav" title="好感度（社交线，与缴械无关）">♥ '+esc(num(c.好感度,0))+'</span>'
        +'<span class="jx-lbl" title="缴械值（战斗线）">🔒 '+esc(num(c.缴械值,0))+'</span></div>'
        +'<div class="rc-hp"><div class="rc-track"><div class="rc-fill" style="width:'+clamp(c.缴械值,0,100)+'%;background:'+(num(c.缴械值,0)>=100?'var(--c-accent)':num(c.缴械值,0)>=60?'var(--c-gold)':'var(--c-info)')+'"></div></div><span class="rc-num">'+esc(c.缴械值||0)+'</span></div>'
        +'<div class="rc-sub">'+esc(c.省份||'')+' · '+esc(String(c.方言||'').slice(0,10))+(String(c.方言||'').length>10?'…':'')+'</div>'

/* 事件 */
function bindEvents(){
  var root=document.getElementById('sb-root');
  if(!root)return; // 元素未就绪时跳过绑定,不中断初始化
  root.addEventListener('click',function(e){
    var t=e.target;
    while(t&&t!==root){
      var act=t.getAttribute&&t.getAttribute('data-act');
      if(act){
        if(act==='view'){State.view=t.getAttribute('data-view');State.detail='';render()}
        else if(act==='detail'){State.detail=t.getAttribute('data-name');render()}
        else if(act==='back'){State.detail='';render()}
        else if(act==='rfilter'){State.rosterFilter=t.getAttribute('data-filter');render()}
        else if(act==='toggle-skill'){
          var sk=t.getAttribute('data-skill');
          var idx=State.selSkills.indexOf(sk);
          if(idx>=0){State.selSkills.splice(idx,1)}
          else if(State.selSkills.length<3){State.selSkills.push(sk)}
          render();
        }
        else if(act==='theme'){ydsToggleTheme()}
        else if(act==='bg'){ydsSbToggleBg()}
        else if(act==='send-round'){
          var action=(document.getElementById('action-input')||{}).value||'';
          State.actionText=action;
          sendRoundCommand(action);
        }
        return;
      }
      t=t.parentNode;
    }
  });
  root.addEventListener('input',function(e){
    var el=e.target;
    if(el&&el.id==='action-input'){State.actionText=el.value}
  });
}

/* 初始化 */
(function init(){
  bindEvents();
  // 事件驱动刷新（skill 规范：MESSAGE_UPDATED 300ms 防抖 + MESSAGE_RECEIVED 1s 兜底 + isRefreshing 防重入，禁止轮询——轮询会重置用户展开的详情/抽屉）
  var _refreshing=false;
  var doRefresh=function(){
    if(_refreshing)return;
    _refreshing=true;
    setTimeout(function(){try{refresh()}catch(e){};_refreshing=false},300);
  };
  try{if(typeof tavern_events==='object'&&tavern_events.MESSAGE_UPDATED&&typeof eventOn==='function'){eventOn(tavern_events.MESSAGE_UPDATED,doRefresh)}}catch(e){}
  try{if(typeof eventOn==='function'){eventOn('GENERATION_ENDED',doRefresh);eventOn('MESSAGE_EDITED',doRefresh);eventOn('mag_variable_update_ended',doRefresh);eventOn('MESSAGE_RECEIVED',function(){setTimeout(doRefresh,1000)})}}catch(e){}
  // ★数据变化检测兜底（事件在消息内联环境可能不可用）：每 3 秒读中继/最新数据，仅当 战斗状态/当前目标/体力/性欲/缴械值 等关键值变化才 refresh——
  // 与"无差别轮询"不同：无变化不重绘，用户展开的详情/抽屉不会被重置（规避 skill 坑#8）
  var _lastSnap='';
  try{
    setInterval(function(){
      try{
        if(document.hidden)return;
        var st3=readStatData();
        var pb3=obj(st3.排班);
        var p3=obj(st3.玩家);
        var tgt3=pb3.当前战斗目标||'';
        var c3=tgt3&&tgt3!=='多人'?(obj(st3.女性角色)[tgt3]||{}):{};
        var snap=(pb3.战斗状态||'')+'|'+tgt3+'|'+num(pb3.战斗&&pb3.战斗.回合,0)+'|'+num(p3.体力,0)+'|'+num(p3.性欲,0)+'|'+num(p3.勃起度,0)+'|'+num(c3.缴械值,-1)+'|'+num(c3.欲望积压,-1)+'|'+num(c3.压力值,-1)+'|'+num(c3.好感度,-1);
        if(snap!==_lastSnap){_lastSnap=snap;doRefresh();}
      }catch(e2){}
    },3000);
  }catch(e3){}
  window.addEventListener('message',function(e){
    try{
      var data=e.data;
      if(data&&data.type==='yds-mvu-stat-data'&&data.stat_data){
        var mesId=resolveMessageId();
        if(mesId>=0&&typeof data.messageId==='number'&&data.messageId>=0&&data.messageId!==mesId)return;
        if(hasData(data.stat_data)){
          cachedStatFromBridge=data.stat_data;
          State.data=deepMergeStat(DEFAULT_STAT,data.stat_data);
          State.loading=false;render();
        }
        return;
      }
      var t=(data&&data.type)||data||'';
      if(typeof t==='string'&&(t.indexOf('generation_ended')>=0||t.indexOf('message_edit')>=0))autoRefresh();
    }catch(x){}
  });
  var embedded=parseEmbeddedStat();
  if(embedded){cachedStatFromBridge=embedded;State.data=deepMergeStat(DEFAULT_STAT,embedded)}
  requestStatFromBridge();refresh();
})();
function refresh(){
  var stat=readStatData();
  if(hasData(stat)){State.data=stat;State.loading=false}
  try{advancePhysioIfNewDay()}catch(e){} // 跨日推进失败不影响渲染
  try{ensureTodaySchedule()}catch(e){} // 今日排班为空则自动生成全天 4 时段（上午=妈妈+没课老师/下午场=全体/晚场=学生为主/深夜=全体）
  render();
  waitForReadableStat(6000,function(realStat){
    if(hasData(realStat)){State.data=realStat;State.loading=false}
    try{advancePhysioIfNewDay()}catch(e){}

/* 今日排班自动生成：今日场次为空时，按【排班规则】24 小时全覆盖生成 4 时段对阵表（上午=妈妈+没课老师/下午场=放学后全体/晚场=学生为主/深夜=全体） */
function ensureTodaySchedule(){
  try{
    var d=S();if(!hasData(d))return;
    var pb=obj(d.排班);
    var s=obj(pb.今日场次);
    if(Object.keys(s).length>0)return; // 今日已有排班
    var chars=d.女性角色||{};
    var mothers=[],teachers=[],students=[];
    for(var nm in chars){
      var c=chars[nm];
      if(!c||typeof c!=='object')continue;
      var idt=String(c.身份||'');
      if(idt.indexOf('陪读妈妈')>=0)mothers.push(nm);
      else if(idt.indexOf('学生')>=0)students.push(nm);
      else if(idt.indexOf('老师')>=0||idt.indexOf('班主任')>=0)teachers.push(nm);
    }
    function pick(arr,n){
      var a=arr.slice(),out=[];
      while(a.length&&out.length<n){var i=Math.floor(Math.random()*a.length);out.push(a.splice(i,1)[0]);}
      return out;
    }
    // 24 小时全覆盖（按【排班规则】使用时段）：上午=妈妈+没课老师；下午场=放学后全体；晚场=学生为主；深夜=全体
    var all=mothers.concat(teachers,students);
    var am=pick(mothers.concat(teachers),1+Math.floor(Math.random()*2)); // 上午（上课时间，在校者不可用）
    var noon=pick(all,1+Math.floor(Math.random()*2)); // 下午场（放学后，全体可用）
    var ev=pick(students.concat(mothers),1+Math.floor(Math.random()*2)); // 晚场（晚自习结束，学生为主+妈妈）
    var night=pick(all,1+Math.floor(Math.random()*2)); // 深夜（22:30 后，全体可用）
    if(am.length)s['上午']={参与者:am.join('、'),结果:'未开战',是否参战:false};
    if(noon.length)s['下午场']={参与者:noon.join('、'),结果:'未开战',是否参战:false};
    if(ev.length)s['晚场']={参与者:ev.join('、'),结果:'未开战',是否参战:false};
    if(night.length)s['深夜']={参与者:night.join('、'),结果:'未开战',是否参战:false};
    pb.今日场次=s;
    // 持久化写回（TH replaceVariables 是完全替换语义，必须读完整表→更新 stat_data→写回完整表，保留 schema/initialized_lorebooks）
    try{
      var Mvu4=getMvu();
      if(Mvu4&&typeof Mvu4.getMvuData==='function'&&typeof Mvu4.replaceMvuData==='function'){
        var opt4=getMessageOption();
        var full4=Mvu4.getMvuData(opt4);
        if(full4&&typeof full4==='object'){
          if(full4.stat_data===undefined&&(full4.排班!==undefined||full4.玩家!==undefined||full4.女性角色!==undefined||full4.时间!==undefined))full4={stat_data:full4};
          full4.stat_data=d;
          Mvu4.replaceMvuData(full4,opt4);
        }
      }
    }catch(e2){}
  }catch(e){console.error('ensureSchedule',e)}
}

/* 跨日推进：日期变化时执行生理周期/体力/冷却推进（与"生理数值规范与限制"世界书一致） */
function advancePhysioIfNewDay(){
  try{
    var d=S();if(!hasData(d))return;
    var t=obj(d.时间);var today=String(t.日期||'');
    if(!today)return;
    var p=obj(d.玩家);
    var last=obj(p.生理).上次推进日期||'';
    if(last===today)return; // 今天已推进
    var ph=obj(p.生理);
    // 玩家：体力恢复+40、性欲+10、射精冷却清零（新的一天）
    p.体力=clamp(num(p.体力,0)+40,0,100);
    p.性欲=clamp(num(p.性欲,0)+10,0,100);
    ph.射精冷却剩余=0;
    ph.今日射精次数=0;
    ph.上次推进日期=today;
    // 她方：月经日+1（到周期天数重置），更新月经状态
    var chars=d.女性角色||{};
    for(var nm in chars){
      var c=chars[nm];
      if(!c||typeof c!=='object'||!c.生理周期)continue;
      var pc=c.生理周期;
      if(pc.怀孕)continue; // 怀孕期间月经冻结
      var day=num(pc.月经日,1)+1;
      var cycle=num(pc.周期天数,28);
      if(day>cycle)day=1;
      pc.月经日=day;
      // 状态区间：1-5经期 / 6-11卵泡 / 12-16排卵 / 17+黄体
      if(day<=5)pc.月经状态='经期';
      else if(day<=11)pc.月经状态='卵泡期';
      else if(day<=16)pc.月经状态='排卵期';
      else pc.月经状态='黄体期';
      // 经期结束湿润度重置，排卵期欲望提升
      if(day<=5){obj(obj(c.身体状态).阴道).湿润度=10}
      else if(day>=12&&day<=16){c.欲望积压=clamp(num(c.欲望积压,0)+5,0,100)}
    }
    // 跨日推进持久化（读完整表→更新 stat_data→写回完整表，保留 schema/initialized_lorebooks）
    try{
      var Mvu4=getMvu();
      if(Mvu4&&typeof Mvu4.getMvuData==='function'&&typeof Mvu4.replaceMvuData==='function'){
        var opt4=getMessageOption();
        var full4=Mvu4.getMvuData(opt4);
        if(full4&&typeof full4==='object'){
          if(full4.stat_data===undefined&&(full4.排班!==undefined||full4.玩家!==undefined||full4.女性角色!==undefined||full4.时间!==undefined))full4={stat_data:full4};
          full4.stat_data=d;
          Mvu4.replaceMvuData(full4,opt4);
        }
      }
    }catch(e3){}
  }catch(e){console.error('advancePhysio',e)}
}
