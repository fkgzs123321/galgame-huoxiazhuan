    appearance: [长发，常戴发箍；表情常年是"这能卖多少钱"]
    curse: 无
    personality:
      base: 精明
      main: [精明, 冷静, 拜金]
      accent: [乐子人, 无情, 讲义气]
    tri_faceted:
      needed: false
  - name: 天道霞
