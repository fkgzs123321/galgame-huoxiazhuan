      complexity: 段落控制
      stages:
        - name: 日常期
          condition: "getvar('stat_data.世界.篇章段', { defaults: '开局期' }) !== '后期'"
        - name: 争夺期
          condition: "getvar('stat_data.世界.篇章段', { defaults: '开局期' }) === '后期' && getvar('stat_data.道具.咒泉乡地图', { defaults: '无' }) === '有'"
        - name: 决裂期
          condition: "getvar('stat_data.世界.篇章段', { defaults: '开局期' }) === '后期' && getvar('stat_data.世界.水脉', { defaults: '咒泉' }) === '断流'"
    # 地点与道具门控
    - name: 咒泉洞
      complexity: 条目显隐
      condition: "getvar('stat_data.世界.当前地点', { defaults: '' }).includes('咒泉洞')"
    - name: 咒泉洞争夺战
      complexity: 条目显隐
      condition: "getvar('stat_data.世界.已发生节点', { defaults: '' }).includes('卷37')"
    - name: 止水桶与开水壶
      complexity: 条目显隐
      condition: "getvar('stat_data.世界.已发生节点', { defaults: '' }).includes('卷24') || getvar('stat_data.道具.止水桶', { defaults: '无' }) === '有' || getvar('stat_data.道具.开水壶', { defaults: '无' }) === '有'"
    - name: 溺泉图鉴_细则
      complexity: 条目显隐
      condition: "getvar('stat_data.你.泉种', { defaults: '' }).length > 0"
    - name: 主角
      complexity: 段落控制

# ══════════════════════════════════════════════════════════════
# 五、开场白（4 个，四条不同感知通道，分属原作不同篇章段）
# ══════════════════════════════════════════════════════════════

first_messages:
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/0.txt
    phase: 开局期 · 卷1「乱马来了」
    scene: 雨天，天道道场玄关
    channel: 听觉
    opening_situation: |
      <user> 抵达天道道场的第一天，雨没停过。
      拉门被撞开，一个熊猫拖着行李走进来，身后跟着一个湿透的、扎着小辫子的女孩。
      屋里三姐妹的反应各不相同。婚约这个词第一次被摆到桌上。
      结尾停在：那个女孩头发还在滴水，她盯着 <user>，一句话没说。
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/1.txt
    phase: 开局期 · 卷1（校园侧）
    scene: 春，风林馆高中校门
    channel: 视觉
    opening_situation: |
      <user> 转学进风林馆高中的第一天。
      木刀横在校门口，一个长发男人正在对每一个路过的女生念诗；操场那头有女生在踢碎瓦片。
      <user> 谁都不认识，但所有人都已经注意到 <user> 了。
      结尾停在：木刀指向 <user> 的鼻尖，还没落下。
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/2.txt
    phase: 开局期 · 卷1 前史（中国修行）
    scene: 阴天，咒泉乡的泉群之间
    channel: 温度与体感
    opening_situation: |
      <user> 站在一根插在泉水里的长竹竿上，脚底打滑。
      下面是一片看不出深浅的水，水边插着写了字的木牌，导游在远处喊什么，听不清。
      竹竿开始转了。掉进哪一眼泉，从此就是哪一种命。
      结尾停在：竹竿断了，身体已经开始往下落，还没入水。
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/3.txt
    phase: 中期 · 卷10 猫饭店开张
    scene: 夜，猫饭店
    channel: 嗅觉与味觉
    opening_situation: |
      八角、猪油、烧热的铁锅、还有一点说不清的猫味。
      <user> 坐在猫饭店的角落，店里只有一个矮小的老太太在擦碗，和一个一直在笑的长发女孩。
      门外有脚步声，很稳，来的人不止一个。
      结尾停在：老太太把碗放下，说了一句听不懂的中国话，然后笑了。
