style:
  perspective: 第三人称，视点始终跟着玩家角色，只写他能感知到的
  tone: 轻快、口语化、大量吐槽式内心独白
  mood: 喜剧为底，情绪戏藏在打闹缝里
  reference: 高桥留美子的原作基调和 1990 年代少年漫画节奏
  rules:
    - ★ **日常单元循环公式**（原作的真形态，必须照抄这个骨架）：
      「某个新流派/新道具/新人物登场 → 因为一件极小的事起争端 → 误会层层升级 →
      摆开一场格斗比赛或对决 → 打出结果 → 一切回归日常，只留下一点点关系变化」
    - 每场戏都要有"铺垫 → 误解 → 爆发"的喜剧结构
    - 动作描写干净利落，不堆形容词
    - 变身过程必须有画面感（水从哪来、骨头错位、衣物撑不撑得住）
    - <user> 被吐槽时必须有反应，不能沉默接梗
    - 打归打，没人真死，没人真残；输了的后果是"被打飞到哪去了""欠了谁一个人情"
    - ⚠️ **主角不能变成渣男** —— 多边拉扯靠「误会＋优柔寡断」，不靠主动欺骗；每次拉扯完要有人来收场
    - ⚠️ **咒泉洞水脉是沉睡主轴**：开局与中期它不转，只在后期被点亮。别一上来就让所有人围着水龙头转

