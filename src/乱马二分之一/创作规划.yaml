# ══════════════════════════════════════════════════════════════
# 四之三、冲突引擎与玩法（怎么让这张卡有得玩）
# ══════════════════════════════════════════════════════════════

conflict_engines:

  - name: 水冲突
    source: 原作招牌灾难，冷水变身／热水复原
    player_anxiety: 想保守秘密，但水的出现不由玩家决定
    pressure_points:
      - 天气不由玩家决定，雨天全场强制变身
      - 场景自带水源清单：水龙头／澡堂／水桶／锅／水坑／消防栓／鱼缸
      - 战斗中被打进水坑，当场变女相，战术后果与社交后果同时来
    witness_tiers:
      无人: 什么都没有发生
      熟人: 当场社死，关系变化，进入对方「已知的记忆」
      人多: 谣言值上升，风林馆开始追查辫子姑娘
    why_it_works: 冲突来自规则而不是叙事者的恶意，玩家不会觉得被针对

  - name: 婚冲突
    source: 女杰族法则（被谁打败就归谁）＋ 双方父亲私订的婚约
    player_anxiety: 打赢也会惹麻烦
    pressure_points:
      - 一场格斗的结果直接改写婚姻关系，赢的人反而多一个未婚妻
      - 天道茜／珊璞／久远寺右京／九能小太刀四边同时拉扯，玩家不可能同时满足
      - 天道茜与乱马同为醋坛子，误会自己会长出来
    why_it_works: 张力来自取舍而不是数值，和原作一模一样

  - name: 格斗冲突
    source: 格斗○○ 单元，15 种竞技项目 × 30 种流派
    player_anxiety: 被迫应战，而且规则对你不利
    pressure_points:
      - 挑战状一来，不接受就丢招牌、丢面子、丢道场
      - 格斗茶道你不懂茶，格斗滑冰你不懂冰，格斗饮食你不懂法式礼仪
      - 每场都能出新人、新流派、新道具，靠组合而不是靠堆内容
    why_it_works: 这是原作无限出新单元的真实机制

  - name: 认知冲突
    source: 谁知道什么，是不对称的
    player_anxiety: 信息差随时会被戳破
    pressure_points:
      - 九能带刀永远分不清辫子姑娘与早乙女乱马，每次相遇都是喜剧
      - 早乙女佳香在卷22以前不知道儿子有变身
      - 风林馆高中的知情度随卷推进变化，越往后保密越难
    why_it_works: 按卷推进之后，认知边界自然成为可玩资源

gameplay:
  core_loop: 水（今天是哪种麻烦）→ 婚（这件事动了谁）→ 斗（那就打一场）→ 卷（这一卷过完了）
  systems:
    - { name: 形态资源化, detail: 男相与女相不是外观而是资源。男相战力满但谎话会被拆穿；女相战力受限但能进男相进不去的场合，同时九能带刀会疯狂贴上来。配湿度 0~100 与目击者风险, keep: true }
    - { name: 婚约主张强度, detail: 四位主张者各一条 0~100 的强度值。不是好感度，吵架也能让它涨。女杰族法则让它可以被一场战斗改写, keep: true }
    - { name: 无差别格斗, detail: 15 种竞技项目 × 30 种流派。胜负的后果不是生死，是被打飞到哪去了、欠了谁人情、被谁看光了, keep: true }
    - { name: 身份卡, detail: 预设乱马／天道茜／天道靡／天道霞／响良牙／沐丝／九能带刀／原创转学生，各有专属能力与专属麻烦。一套世界 N 种玩法, keep: true }
    - { name: 谣言值, detail: 风林馆流传的「辫子姑娘」传说。每次变身被目击、每次当众打斗都在改这个数，最后滚成全校追查辫子姑娘是谁, keep: true }
    - { name: 认知表, detail: 谁知道什么，逐卷解锁。这是按卷推进才有的玩法：同一句话在第5卷是秘密、在第30卷是公开的, keep: true }
    - { name: 道具与秘宝, detail: 42 件道具按卷出现。反转宝珠／岁月菇／抗水肥皂／即席男溺泉／猫魔铃／龙之鬚 各自是一个单元的引擎, keep: true }
  cut:
    - { name: 武术等级数值条, reason: 玩家看不见，纯替 AI 记账 }
    - { name: 体力与气力条, reason: 原作没有这个概念，一加就变回合制 }
    - { name: 17 天硬倒计时, reason: 已改为按卷推进，不需要额外倒计时 }

combat:
  定位: |
    完全按 引擎模板/引擎能力/ 里那套来，不从任何旧卡抄。
    战斗不是叙事发挥，是引擎算完给结论 —— AI 只负责把结论写成文字。
  分层:
    - 成长引擎 C4 → 能力值 P（总评 / 攻击 / 命中 / 闪避 / 防御）
    - 判定引擎 E3 → 单次判定的成败与档位
    - 战斗引擎 → 把单次判定串成一场战斗，产出摘要
    - 注入器 → 把摘要交给 AI（不给公式、不给掷值）
  内部真演算:
    说明: 引擎逐回合真跑 —— 逐回合掷命中、算伤害、结算、判倒下。「AI 不逐回合演」不等于「引擎不算」
    入口: 战斗引擎.fight(cfg, rng, rateFromDiff)
    命中率: clamp(基准 45 + 差值 × 斜率 2.2, 1, 95) —— 战斗引擎自带，不跨引擎依赖
    伤害: max(1, round((攻击 − 防御) × 伤害倍率))
    出手顺序: 出手值大者先；同值我方先（确定性，不许随机破平局）
    上限回合: 8 —— 本卡的战斗该短促
    有效值: 被打到实处才掉，掉了恢复极慢 —— 不可逆项在这里产生
  对战强度差:
    来源: 公式总表 第六节
    公式: P = clamp(50 + 强度差 + (我方相对修正 − 敌方相对修正) + 环境差, 5, 95)
    强度差: clamp(round((我方强度分 − 敌方强度分) / 10 × 6), −40, +40)
    为什么要它: 纯相对修正在「人 vs 人」会丢掉绝对强弱 —— 全 2 的杂鱼和全 500 的神，属性修正都约等于 0
    强度档: T0 杂鱼 0 ｜ T1 10 ｜ T2 20 ｜ T3 30 ｜ T4 40 ｜ T5 50 ｜ T6 60 ｜ T7 70 ｜ T8 80 ｜ T9 90
    本卡填的分档:
      - { 档: T9, 谁: 八宝斋, 说明: 无差别格斗流元祖，作品的武力顶点 }
      - { 档: T7, 谁: 可伦、萨夫郎、哈浦, 说明: 宗师级与龙血王族 }
      - { 档: T5~T6, 谁: 早乙女乱马、响良牙、珊璞、沐丝、久远寺右京、九能小太刀、九能带刀、纪玛 }
      - { 档: T3~T4, 谁: 天道茜、天道靡、天道霞、五寸钉光 }
      - { 档: T0~T2, 谁: 一般学生与路人 }
    意义: 「乱马打不过八宝斋」是数值事实，不是叙事安排
  七行动与克制链:
    来源: 公式总表 第十二节（引擎层标 待落 —— 本卡先用，数值落在面板）
    行动与耗气: 集气 0 ｜ 防御 0 ｜ 轻攻击 1 ｜ 重攻击 2 ｜ 绝招 5 ｜ 嘴炮 0 ｜ 道具 0
    气上限: 10
    伤害: 轻 100% ｜ 重 150% ｜ 绝招 300%（无视防御）
    克制链:
      防御 → 普通攻击（减伤到 15% 或 25%）
      重攻击 → 轻攻击（无效化并造成伤害）
      绝招 → 普通攻击与防御（无视防御）
      嘴炮 → 绝招（无效化）＋ 破防（对方气 −1，挑衅 2 回合）
    为什么好: 不用复杂公式，只有 100 与 150 与 300 三档，靠克制链产生深度，玩家每回合都有得选
    为什么嘴炮最适合本卡: 原作战斗有一半是互喷
    道具: 原作道具战很多（铁炮豆／怒发天／抗水肥皂／即席男溺泉）
  场地效果:
    来源: 公式总表 第十二节
    形状: 持续 3 回合，对双方生效，改变战局规则而不是单纯加 buff
    本卡填的值（写在面板，不进引擎层）:
      - { 场地: 雨天, 效果: 每回合掷一次变身，中了当场变形态 }
      - { 场地: 澡堂／河边／厨房, 效果: 同雨天，但只在有人把水泼起来时才掷 }
      - { 场地: 围观, 效果: 在场人数达到 5 人时，变身必然社死 }
      - { 场地: 冰面, 效果: 无冰上经验者命中 −20 }
      - { 场地: 沙地／水坑, 效果: 出手值 −2 }
  敌人风格:
    来源: 公式总表 第十二节 的风火林山
    原则: 给敌人行为模式而不是数值档，玩家能读对手
    本卡填的值:
      - { 风格: 风·快攻, 谁: 响良牙、九能带刀 }
      - { 风格: 火·爆发, 谁: 早乙女玄马、狮子咆哮弹状态下的良牙 }
      - { 风格: 林·蓄力, 谁: 哈浦、萨夫郎 }
      - { 风格: 山·防守, 谁: 可伦、八宝斋、沐丝 }
  变身重算派生:
    说明: 变身后 C4 重算能力值 —— 这是「变身是资源」的数值落地，不是一句设定
    男相: 力量类动作加成，潜入与混入类动作打折
    女相: 潜入与混入类加成，力量类打折
    湿度: 每 20 点使闪避 −3，身上越湿越滑手
  标定:
    依据: skills/st-judge-calibration
    方法: 从目标反推，不做参数盲搜。先算出 P 在三个时点的真实值，目标成功率 → D，再 R = P − D，联立反解
    目标: 普通档 开局 60 ／ 中期 75 ／ 后期 90
    对手参数按难度各自缩放: 是 —— 不能对三档一视同仁，否则简单档被压死、最高档压不住
    验收清单:
      - 三档全程单调（简单大于等于中大于等于难，三个时点都要查）
      - 任何一档都不出现 100% 或 0%
      - 单独把流派等级从初值拉满，成功率应显著上升
      - 单独把对手强度拉满，成功率应显著下降
  注入纪律:
    来源: 战斗引擎.txt 第四节
    写什么: 谁赢了、多快、伤成什么样、有没有动用杀招、有没有留下不可逆的伤
    不写什么: 掷值、命中率、伤害数字、公式 —— 玩家看面板，正文里不出现数值
    写法约束: 碾压就短，苦战就长，僵持就别收；不可逆的伤必须落在正文里
  数值放哪:
    引擎 JS: 战斗引擎 ＋ 判定引擎 ＋ C4 派生全部放面板，0 token
    世界书只带: 格斗规则（给 AI 看的人话版）＋ 判定引擎（注入纪律与摘要通道）
    MVU 只存: 战斗局面（谁在场、双方状态、判定结果、骰子种子）
    禁止: 把公式与数值表写进世界书常驻条目

node_template:
  note: 每一个时间线节点（一卷或一个插曲）都按这五格写，缺格不成立
  slots:
    - { key: 必须解决的事, desc: 本卷的单元冲突，玩家在这一卷里躲不掉的 }
    - { key: 不能解决的事, desc: 累积的长线（婚约／秘密／水脉），这一卷解决不了，只推进一点 }
    - { key: 新登场的人, desc: 这一卷第一次出现的人，带来新的冲突源 }
    - { key: 可玩单元, desc: 从 15 竞技 × 30 流派 里抽 1~3 个，供本卷反复发生 }
    - { key: 过卷条件, desc: 满足什么才算这一卷过完，可以进下一个节点 }

judgement:
  principle: 原作是喜剧，不做硬核数值对抗
  only_three_cases_need_dice:
    - 谁赢了这场
    - 被谁看见了
    - 掉进哪一眼泉（或没有掉进去）
  method:
    - 用 LCG 确定性骰，禁用 Math.random
    - 权重归一化，难度用乘法不用加法
    - 判定在按钮里当场跑（沿用 旮旯给木-同级生2 的做法：AI 不能执行 JS，状态栏是前端能读写变量）
  banned:
    - 不做伤害数值
    - 不做等级差
    - 不做命中率面板

# ══════════════════════════════════════════════════════════════
# 四之补、order 分区（★ order 是「同一插入位置内」的排序，不同位置可复用号段）
# ══════════════════════════════════════════════════════════════

order_plan:
  硬约束: 校验器 引擎模板/scripts/verify-prompt-budget.mjs 的 BASE_MIN_ORDER 等于 200。
    非底座条目 order 达到 200 以上一律判违规。本卡没有底座，所以全部条目都必须排在 200 以下。
    T4 按需层不靠 order 表达，靠 strategy 选 selective 表达。
  before_character_definition:
    1-19: 扮演准则（T0 宪法层；加载纪律等于 1）
    20-59: 世界观与核心机制（咒泉乡与溺泉 20 ／ 变身规则 25 ／ 水脉与两副开关 30 ／ 格斗规则 40）
    60-99: 地理（14 条，60 到 73）
    100-119: 索引层（地理速览 100 ／ 角色速览 105 ／ 时间线索引 110）
    50: 格斗流派速览单独排在 50，紧跟格斗规则（40），便于两处对照
    120-199: 时间线 46 个节点（EJS 按 世界.当前节点 门控，运行时只渲染当前那一条）
  after_character_definition:
    200-299: 角色（basic ／ personality ／ tri_faceted，selective）
    300-399: NPC 组条目（selective）
  at_depth:
    1: 阶段指导（按篇章段段落控制）
    2-99: 事件（selective，绝不 constant；放这里而不是 400 以上，因为 order 不得越 200）
    100 以上: MVU（变量列表 ／ 更新规则 ／ 输出格式）
  互斥组会被自动识别: |
    46 个节点读的都是同一个变量 世界.当前节点。
    校验器按「同一变量的多档」把整组只计 1 条（判据见 verify-prompt-budget.mjs 的 变量组 一段），
    所以 46 条不会撑爆预算。
  参考: 姊妹卡 旮旯给木-同级生2 的时间线索引走 110 ／ 逐日走 340 以上（其条目型别落到 UNKNOWN，校验器不管）。

# ══════════════════════════════════════════════════════════════
# 四、MVU
# ══════════════════════════════════════════════════════════════

mvu:
  structure: |
    世界 —— 时间、天气、水脉开关、当前地点
    你   —— 玩家的身份、泉种、形态、湿度、固定状态、流派、必杀技
    道具 —— 咒泉乡地图、止水桶、开水壶
    势力 —— 四方势力的态度
    关系 —— 四位婚约候选的主张强度 + 主要角色的好感度
  variables:
    # ── 世界 ──
    - path: 世界.日期
      format: M月D日
      description: 当前日期
    - path: 世界.时段
      enum: [早, 上午, 下午, 傍晚, 夜]
      description: 一天四到五个时段，决定谁在哪
    - path: 世界.天气
      enum: [晴, 阴, 雨, 雪]
      description: ★ 雨＝全场强制变身灾难；雪＝持续低温，热水需求拉满
    - path: 世界.当前地点
      description: 玩家角色当前所在场景
    - path: 世界.水脉
      enum: [咒泉, 热水, 断流]
      description: ★★ 卡的核心开关。咒泉＝诅咒活跃且热水复原失效；热水＝所有诅咒者暂时安全但凤凰山一族得到成长之源；断流＝两边都停，最糟
    - path: 世界.水脉栓位
      enum: [月涡蛇, 金蛇环]
      description: 当前插着的是哪一个栓子；水脉只有一条，两个口互斥
    - path: 世界.当前节点
      description: ★★ 唯一的时间推进变量。取值＝时间线索引里的 46 个节点 id 之一（卷01~卷38 / 插曲01~插曲08）。每个节点的世界书条目由 EJS 按此值门控，只有当前节点渲染
    - path: 世界.当前卷
      type: number
      range: 1~38
      description: 显示用。由当前节点推导（插曲节点沿用其前一个卷号），供状态栏与 AI 表述「现在到哪一卷了」
    - path: 世界.篇章段
      enum: [开局期, 中期, 后期]
      description: 由当前卷推导：1-6 开局期 / 7-22 中期 / 23-38 后期
    - path: 世界.已发生节点
      type: z.string
      description: 已完成的节点 id，、分隔（Zod 卡禁数组）
    # ── 你 ──
    - path: 你.身份
      description: 玩家选择的身份（乱马/茜/原创角色/中国组…）
    - path: 你.泉种
      type: z.string
      description: ★ 身上的溺水诅咒，、分隔；可叠泉。空字符串＝无诅咒
    - path: 你.当前形态
      description: 当前实际形态（人形／诅咒形态／混合）
    - path: 你.湿度
      type: number
      range: 0~100
      description: ≥60 时接触冷水立即变身；自然蒸发每时段 -20，雨天 +40
    - path: 你.固定中
      enum: [否, 止水桶]
      description: 被止水桶固定形态时热水无效，需开水壶
    - path: 你.武术流派
      description: 无差别格斗早乙女流／天道流／女杰族拳法／象形拳／剑道／格斗新体操…
    - path: 你.已会必杀技
      type: z.string
      description: 、分隔
    # ── 道具 ──
    - path: 道具.咒泉乡地图
      enum: [无, 有]
      description: 进咒泉洞的必需品，没有地图必迷失在陷阱回廊
    - path: 道具.止水桶
      enum: [无, 有]
      description: 泼中即固定形态；同时是寻找开水壶的雷达（1 公里内才反应）
    - path: 道具.开水壶
      enum: [无, 有]
      description: 煮水浇身可解除止水桶的固定；原在宝来山
    # ── 势力 ──
    - path: 势力.天道道场
      enum: [友好, 中立, 提防, 敌对]
    - path: 势力.女杰族
      enum: [友好, 中立, 提防, 敌对]
    - path: 势力.凤凰山一族
      enum: [友好, 中立, 提防, 敌对]
    - path: 势力.麝香王朝
      enum: [友好, 中立, 提防, 敌对]
    - path: 势力.咒泉乡
      enum: [友好, 中立, 提防, 敌对]
    # ── 关系 ──
    - path: 关系.天道茜.好感度
      type: number
      range: 0~100
    - path: 关系.天道茜.主张强度
      type: number
      range: 0~100
      description: ★ 她主张这桩婚约的强度。不是好感度；吵架也能让这一步涨
    - path: 关系.珊璞.好感度
      type: number
      range: 0~100
    - path: 关系.珊璞.主张强度
      type: number
      range: 0~100
    - path: 关系.久远寺右京.好感度
      type: number
      range: 0~100
    - path: 关系.久远寺右京.主张强度
      type: number
      range: 0~100
    - path: 关系.九能小太刀.好感度
      type: number
      range: 0~100
    - path: 关系.九能小太刀.主张强度
      type: number
      range: 0~100
    - path: 关系.天道靡.好感度
      type: number
      range: 0~100
    - path: 关系.天道霞.好感度
      type: number
      range: 0~100
    - path: 关系.响良牙.好感度
      type: number
      range: 0~100
      description: 交情与敌意同源，低不代表不来往
    - path: 关系.九能带刀.好感度
      type: number
      range: 0~100
    - path: 关系.可伦.好感度
      type: number
      range: 0~100
    - path: 关系.哈浦.好感度
      type: number
      range: 0~100

