      age: 中年
      gender: 男（诅咒形态为熊猫）
      identity: 乱马之父兼师傅；无差别格斗早乙女流开祖
      relationship: 天道早云的同门师兄弟；擅自定下乱马的婚约
    appearance: [壮硕，胡子拉碴，常年一身旧道服]
