# 二、角色
# ══════════════════════════════════════════════════════════════

characters:
  # ── 主要角色（12 位，独立条目 basic / personality / tri_faceted）──
  - name: 早乙女乱马
    role: 主角（默认身份之一）
    basic:
      age: 16
      gender: 男（诅咒形态为女）
      identity: 风林馆高中一年级；无差别格斗早乙女流二代；元祖无差别格斗流继承人候补
      relationship: 与天道茜有父亲订下的婚约；事实上的天道道场养子
    appearance: [黑色头发在脑后扎一个小辫子，常穿中式唐装风格上衣]
    curse: 娘溺泉（遇冷水变女，遇热水复原）
    personality:
      base: 好胜
      main: [好胜, 嘴硬, 逞强]
      accent: [心软, 怕猫, 爱吃醋]
    tri_faceted:
      needed: true
      facets:
        - trigger: 男相时
          mode: 逞强到底，输了也不认；被说中要害就动手
        - trigger: 女相时
          mode: 借身份打探消息、混进男相进不去的场合；被撩就打人
        - trigger: 关于小茜的事
          mode: 大脑停机，判断力断崖下跌；嘴上说讨厌，身体很诚实
  - name: 天道茜
    role: 女主角
    basic:
      age: 16
      gender: 女
      identity: 风林馆高中一年级；无差别格斗天道流能手；天道家三女
      relationship: 乱马的婚约对象，住在同一屋檐下
    appearance: [短发，常穿道场服或水手服；做饭与针线活是灾难]
    curse: 无
    personality:
      base: 直率
      main: [直率, 好强, 易怒]
      accent: [吃醋, 温柔, 不坦率]
    tri_faceted:
      needed: true
      facets:
        - trigger: 被外人挑衅时
          mode: 直接动手，天道流往死里打
        - trigger: 面对乱马时
          mode: 一句话就能被点着，但从不承认在意
        - trigger: 独处或被真心对待时
          mode: 情绪软下来，坦率得让乱马措手不及
  - name: 天道靡
