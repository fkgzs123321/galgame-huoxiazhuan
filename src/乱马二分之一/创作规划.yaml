# 乱马二分之一 · 创作规划.yaml
# 项目级事实来源。任何修改必须先改本文件，再改条目内容。
# 模式：一次确认（全部字段定稿）

project:
  name: 乱马二分之一
  worldbookName: 乱马二分之一
  form: charactercard
  mvu: true
  avatar: 头像.png
  ui_mode: text
  mode: 一次确认
  tags: [乱马1/2, 同人, 咒泉乡, 变身, 群像, 格斗喜剧, 多开局, MVU]

# ══════════════════════════════════════════════════════════════
# 一、世界
# ══════════════════════════════════════════════════════════════

world:
  overview: |
    高桥留美子《乱马½》同人卡。原作风味的格斗恋爱喜剧，核心不是"攻略谁"，
    而是「**一泉水脉，两副开关**」——
    中国青海省巴颜喀拉山脉拳精山中有一处修行地叫咒泉乡，上百眼泉水，
    每一眼都记住几千年前在其中溺死的那个东西：掉进去的人，此后遇冷水就变成它。
    咒泉乡的水源地在咒泉洞，洞的深处有两个巨大喷水口：
    龙形口流出**咒泉**（诅咒之水），凤凰形口流出**热水**。
    两条水管接的是同一条地下水脉 —— **开了一个，就关掉另一个**。
    而凤凰山一族的王族，必须泡咒泉乡的热水才能长大成王。
    所以：谁扭动栓子，谁就同时决定了「所有被诅咒者能不能复原」
    与「凤凰山一族能不能长大」。这就是整张卡的引擎。
  world_scale: 日本东京练马区 × 中国青海（咒泉乡 · 拳精山 · 凤凰山）× 女杰族村 × 麝香王朝 × 宝来山
  time_setting: 1990 年代，原作时间轴；按开局落在不同篇章段

  # ── ★ 推进模式：按漫画卷推进（用户 2026-09-22 拍板）──
  advance_mode:
    mode: 按卷推进
    unit: 漫画单行本 38 卷，一卷 = 一个节点
    sequence: 46 个节点 —— 38 卷 ＋ 8 个插曲，线性推进
    interlude_rule: |
      剧场版／OVA 按「发行时间落在哪两卷之间」＋「内容与哪一卷相近」两个判据插进时间线。
      与原作同源的改编回原卷，不另做节点：
        剧场版3《超无差别决战》   → 改编卷29 PART1-2「凤凰剑」→ 并入卷29
        OVA7/8《道场继承者》      → 改编卷28「公纹龙」     → 并入卷28
        OVA9/10《苏醒的记忆》     → 改编卷26「流幻泽」     → 并入卷26
        OVA12《破恋洞的诅咒》     → 改编卷27「破恋洞」     → 并入卷27
        OVA15《恶梦！春眠香》     → 改编卷34「春眠香」     → 并入卷34
        OVA1/2《热斗歌合战》      → 动画 MV 集，非剧情       → 不做节点
      完全原创的另做节点（8 个）：
        插曲01 寝昆仑大决战（剧场版1，1991/11）  → 卷16 与卷17 之间
        插曲02 决战桃幻乡（剧场版2，1992/08）    → 卷20 与卷21 之间
        插曲03 珊璞暴变·反转宝珠（OVA3，1993/10）→ 卷23 与卷24 之间
        插曲04 天道家混乱的圣诞节（OVA4，1993/12）→ 卷24 与卷25 之间
        插曲05 妈妈的味道由我守护（OVA5，1994/02）→ 卷25 与卷26 之间
        插曲06 身材剧变的雏子老师（OVA6，1994/04）→ 卷26 与卷27 之间
        插曲07 邪恶之鬼（OVA13，1995/11）        → 卷34 与卷35 之间
        插曲08 两个小茜（OVA14，1996/01）        → 卷35 与卷36 之间
    hard_rule: |
      ★ 卷是「时间参照」，不是硬关卡。玩家可以做任何事，但世界的状态（谁登场了／谁知道了什么）
      以当前节点为准。不允许出现「卷 3 就遇到珊璞」这类穿越。
    why: |
      用户原话：「按时间进度吧，就是漫画的卷来，剧场版或者其他的根据相近时间和设定，补进去时间线里」
      好处：人物登场顺序天然正确；长篇（哈浦／佳香／公纹龙／咒泉洞）自带进度感；插曲提供节奏变化。

  # ── ★★ 原作的真实形态：日常单元剧的无限循环，不是一条主线跑到底 ──
  series_structure: |
    原作全 38 卷 / 407 话，**绝大多数是独立的「格斗XX」单元**：
    新流派或新道具登场 → 因琐事起争端 → 误会升级 → 一场格斗比赛解决 → 回归日常。
    长篇只有三处：哈浦/止水桶（卷24）、佳香相认（卷22/28/36）、咒泉洞最终决战（卷37-38）。
    做卡必须照这个形态来 —— 卡的**主体是日常单元的生成器**，
    咒泉洞水脉（世界级开关）是**后期才会被点亮的沉睡主轴**，不是开局就在转的引擎。
    依据：source/ 全量考据归档（9 份，见 source/README.md 索引）

  # ── 篇章分段（时间线条目的骨架；也决定开局落在哪）──
  timeline_phases:
    - name: 开局期
      range: 卷 1-6
      theme: 主角抵达、诅咒揭晓、四位婚约候选人陆续到齐
      key_beats:
        - 卷1 乱马以女相＋熊猫抵达天道道场，婚约成立，茜讨厌男生
        - 卷2 响良牙登场，黑豚溺泉暴露，小猪「小P」被茜收养
        - 卷3 九能小太刀登场；三千院帝与白鸟梓（格斗滑冰）
        - 卷4 珊璞登场，女杰族「死亡之吻」法则
        - 卷5 乱马怕猫的弱点；沐丝来袭
        - 卷6 良牙的爆碎点穴；「格斗茶道」单元确立「格斗XX」模式
    - name: 中期 · 全员集合
      range: 卷 7-22
      theme: 八宝斋解封、右京与可伦入局、九能校长回归、佳香相认
      key_beats:
        - 卷7 八宝斋解封归来
        - 卷8 「即席男溺泉」——证明泉可以人工造
        - 卷9 久远寺右京登场（玄马当年用铁板换走的未婚妻）
        - 卷10 可伦登场，猫饭店开张
        - 卷12 九能校长回归，强制剃发校规
        - 卷13 贫力虚脱灸与飞龙升天破
        - 卷15 龙之鬚（乱马尾辫上那个发圈的真身）
        - 卷17 天道靡篇：婚约改成靡，姐妹战争
        - 卷18 裤袜太郎登场（牛鹤鳗毛人＋章鱼，叠泉原作依据）
        - 卷20 良牙的狮子咆哮弹、乱马的魔犬恸哭破
        - 卷21 幸福樱花印，乱马以婚约为赌注与良牙大对决
        - 卷22 早乙女佳香登场，玄马的切腹誓约浮上台面
    - name: 后期 · 长篇
      range: 卷 23-38
      theme: 止水桶与开水壶 → 凤凰山 → 咒泉洞水脉最终决战
      key_beats:
        - 卷24 ★★ 哈浦与宝来山：止水桶固定女相、开水壶在宝来山、龙精飞翔
        - 卷25 二宫雏子登场（史上最强的女人，吸斗气）
        - 卷27 破恋洞的诅咒
        - 卷28 公纹龙假冒乱马；海千拳对山千拳
        - 卷29 砒珂·琳珂（毒药使者）来取珊璞性命
        - 卷32 蕗珠（阿修罗溺泉、「力之源」）；鹭宫飞鸟
        - 卷33 岁月菇；明神隼人（章鱼面具）
        - 卷35 镜女乱马（魔镜投影，独立人格）；小夏（脱离忍者的女忍者）
        - 卷36 乱马切腹危机；告别天道家
        - 卷37 ★★ 蒲兰慕报信、咒泉乡地图攻防战、深入凤凰山
        - 卷38 ★★ 咒泉洞心脏地带：龙形口/凤凰形口、月涡蛇/金蛇环、水脉只有一条
    - name: 剧场版
      items:
        - 《中国寝昆仑大决战！规则无视的激斗篇》1991：骑象少女、寝昆仑七福道神、奥义经卷、空中巨船、掳走天道茜
        - 《决战桃幻乡！夺回新娘子！！》1992：桃幻乡幻术皇子桃磨、新娘选拔赛、★能把动物变成男人的神奇泉水
        - 《超无差别决战！乱马队VS传说的凤凰》1994（OVA 形式发行）
    - name: OVA
      count: 15
      highlights:
        - 珊璞暴变！反转宝珠惹的祸（性格反转道具）
        - 天道家混乱的圣诞节（节日单元）
        - 小茜VS乱马，妈妈的味道由我守护！（料理对决）
        - 校园吹起风暴！身材剧变的雏子老师
        - 道场继承者（上/下）
        - SPECIAL 苏醒的记忆（上/下）
        - SUPER 破恋洞的诅咒！吾爱永存
        - SUPER 两个小茜「乱马，看着我！」
        - It's Rumic World 恶梦！春眠香

  # ── 核心机制（卡的引擎）──
  core_mechanics:
    - name: 溺泉层
      desc: |
        咒泉乡上百眼泉，每眼记住第一个溺死者。掉进去即被诅咒。
        **诅咒可以叠加**（原作依据：裤袜太郎先掉牛鹤鳗毛人溺泉、后又掉章鱼溺泉）。
        泉有名字、有传说、有已知受害者 —— 图鉴式写法。
    - name: 形态层
      desc: |
        遇**冷水**变成诅咒形态，遇**热水**复原。雨水、泼溅、澡堂、水桶、厨房全算触发。
        每个受诅咒者持有一个**湿度**值（0~100），≥60 时接触冷水立即变身。
        被**止水桶**泼中者形态被固定，热水无效，只有**开水壶**煮水浇身能解除。
    - name: 水脉层
      desc: |
        咒泉洞内两个喷水口由栓子控制：龙形口＝**月涡蛇**栓，凤凰形口＝**金蛇环**栓。
        水脉只有一条 → 开咒泉则热水断，开热水则咒泉断。
        这是世界级状态，翻转它等于重写全世界的规则。

  regions:
    - name: 练马区
      scenes: [天道道场, 风林馆高中, 天道家宅, 猫饭店, 商店街, 宝来山, 澡堂"汤乃里", 九能家宅邸]
      description: 东京都练马区，日常舞台。天道道场与风林馆高中是主战场，宝来山藏有开水壶
    - name: 咒泉乡
      scenes: [咒泉乡泉群, 咒泉洞正门, 咒泉洞心脏地带, 导游小屋, 陷阱回廊]
      description: 中国青海省巴颜喀拉山脉拳精山中。上百眼溺泉分布于此；咒泉洞是水源地，多入口只有一个是真入口
    - name: 凤凰山
      scenes: [凤凰山王城, 干涸的凤凰溺泉, 蛋室]
      description: 拳精山南方。王族靠泡咒泉乡热水成长，本地溺泉已干涸
    - name: 女杰族村
      scenes: [族中大竞技场, 可伦的药材棚, 猫饭店总店]
      description: 中国深山中的女性武斗民族村落。法则：败给女人杀之，败给男人嫁之
    - name: 麝香王朝
      scenes: [龙血祭坛, 秘宝库]
      description: 一千四百年前的男性武斗集团，象形拳登峰造极，男子断奶即离母
    - name: 圣赫贝雷凯女子学院
      scenes: [格斗新体操竞技场, 蔷薇园]
      description: 九能小太刀就读的女子高中，格斗新体操的舞台

  factions:
    - name: 天道道场
      description: 无差别格斗天道流，天道家三姐妹与早乙女父子的居所
      territory: 练马区
      key_members: [天道早云, 天道霞, 天道靡, 天道茜]
    - name: 早乙女家
      description: 无差别格斗早乙女流，流浪修行的父子；母亲佳香独居
      territory: 练马区
      key_members: [早乙女乱马, 早乙女玄马, 早乙女佳香]
    - name: 风林馆高中
      description: 乱马与茜就读的高中；剑道部、格斗新体操、格斗茶道、校长全在这里
      territory: 练马区
      key_members: [九能带刀, 九能校长, 五寸钉光, 二宫雏子, 猿隐佐助]
    - name: 九能家
      description: 剑道世家兼风林馆理事长家系；兄妹二人与御庭番忍者
      territory: 练马区
      key_members: [九能带刀, 九能小太刀, 九能校长, 猿隐佐助]
    - name: 女杰族
      description: 中国女性武斗民族。**她主动要人**——按《女杰族经》，败给男人就要以身相许
      territory: 女杰族村
      key_members: [可伦, 珊璞, 沐丝]
    - name: 麝香王朝
      description: 象形拳武斗集团，后裔承兽血。**他要解固定**——找开水壶解除止水桶
      territory: 麝香王朝
      key_members: [哈浦, 来睦, 敏杜]
    - name: 凤凰山一族
      description: 王族靠咒泉乡热水成长。本地溺泉干涸，**他要热水与地图**
      territory: 凤凰山
      key_members: [萨夫郎, 纪玛, 柯尔玛, 马飒拉]
    - name: 咒泉乡
      description: 咒泉乡的守护方。**他要保住泉水不外流**
      territory: 咒泉乡
      key_members: [咒泉乡导游, 蒲兰慕]

