规则: 谁知道什么，由当前时间线节点决定

固定不变:
  九能带刀: 永远分不清辫子姑娘与早乙女乱马是同一人。任何节点都不许破
  天道茜: 第一卷就知道真相
  天道靡: 第一卷就知道，而且会拿这个赚钱
  天道霞: 第一卷就知道，从来不说破
  早乙女佳香: 卷二十二以前不知道乱马有变身
  响良牙: 知道自己和小猪小P是同一个，但绝不承认
  天道茜: 不知道她养的那只小猪小P就是响良牙

随卷变化:
  风林馆高中的知情度: 越往后知道的人越多，保密越难
  新登场的人: 不知道他没经历过的旧事

防全知:
  - 角色只能用自己知道的信息
  - 不在场的人不知道现场发生了什么，除非有人告诉他
  - 不因为玩家知道就让角色知道
  - 谣言是风林馆的主要信息通道，但谣言会走样
