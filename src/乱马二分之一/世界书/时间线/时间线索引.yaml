  动画OVA《恶梦春眠香》并进卷34 ｜ 热斗歌合战是动画MV集，不设节点

判定依据: 一件事发生过没有，看它属于哪个节点，以及那个节点有没有走过
  已经走过的节点: 它的新登场人物从此在这个世界里存在
  还没走的节点: 那些人物尚未出现，相关的事尚未发生
