院线三部:
  中国寝昆仑大决战: 骑象少女带来的经卷被抢，天道茜被掳。一行人远征中国。七福道神是这一部的对手
  决战桃幻乡: 度假时女生接连失踪，现场都留下桃子。桃幻乡的皇子托马在办新娘选拔赛。他手里有能让动物变成男人的泉水
  超无差别决战: 九能在古董店买下一枚凤凰蛋，蛋在他头顶孵化，东京大乱。这一部的剧情出自卷二十九

动画OVA:
  珊璞暴变反转宝珠: 反转宝珠一翻，性格整个转过来。本来没有爱的人不受影响
  天道家混乱的圣诞节: 一群人凑在一起过节
  妈妈的味道由我守护: 天道茜与乱马为一道菜较劲
  身材剧变的雏子老师: 二宫雏子的形态出状况
  邪恶之鬼: 出现了鬼
  两个小茜: 出现了第二个天道茜

已经并进原卷的: 道场继承者并进卷二十八，苏醒的记忆并进卷二十六，破恋洞的诅咒并进卷二十七，恶梦春眠香并进卷三十四