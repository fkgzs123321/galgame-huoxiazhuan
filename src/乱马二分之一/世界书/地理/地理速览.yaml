日本东京都练马区:
  天道道场: 无差别格斗天道流本家。早乙女父子与八宝斋寄居在此
  天道家宅: 道场紧邻。饭桌是修罗场
  风林馆高中: 乱马与天道茜就读。校长室也在校内
  猫饭店: 可伦与珊璞开的中餐馆。沐丝在这里打工
  右京轩: 久远寺右京的御好烧店
  小乃接骨院: 小乃东风的诊所。天道家隔壁
  九能家宅邸: 九能兄妹的家，御庭番忍者住在里面
  澡堂: 变身戏的主场
  宝来山: 开水壶流落在此。哈浦与乱马在这里打过一场

中国青海省:
  咒泉乡: 拳精山中。百余眼溺泉
  咒泉洞: 咒泉乡的水源地。四千年
  拳精山: 咒泉乡所在的山
  凤凰山: 拳精山以南。凤凰族住在山顶

中国其他:
  女杰族村: 珊璞、沐丝、可伦的故乡。母系村落
  麝香王朝据点: 哈浦一族的王家城，在深山里

其他学校:
  圣赫贝雷凯女子学园: 九能小太刀就读
  科尔霍兹学园高中: 三千院帝与白鸟梓就读，格斗滑冰的搭档
  青春学园: 今条真理子就读，格斗啦啦队

篇章地点:
  破恋洞: 一起进去的情侣必定分手
  流幻泽飞御森林: 真之介与祖父看守巨型动物的地方
  岁月菇森林: 乱马与良牙在这里变小
  海月滨: 海边。有只温驯的水母大王爱把人抛起来
  西瓜岛: 九能在这里练切西瓜练到失忆
  古河温泉: 玄马与佳香度蜜月的地方

剧场版的舞台:
  寝昆仑: 中国山区。七福神的地盘
  桃幻乡: 南海的浮空岛。那里的桃树汁液能让人变成男人
