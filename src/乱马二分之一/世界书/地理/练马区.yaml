范围: 东京都练马区。故事的主舞台
场景:
  天道道场: 无差别格斗天道流本家。早乙女父子与八宝斋住在这里
  天道家宅: 道场紧邻。一日三餐与争吵都在这里发生
  风林馆高中: 乱马与天道茜就读。九能校长在这里发号施令
  猫饭店: 可伦与珊璞开的中餐馆。沐丝在这里打工
  右京轩: 久远寺右京的御好烧店
  小乃接骨院: 小乃东风的诊所
  九能家宅邸: 九能兄妹的家
  澡堂: 镇上唯一的公共澡堂。变身戏多半出在这里
  商店街: 买东西、打架、追人的地方
  宝来山: 郊外的山。开水壶流落在这里
地理特征: 坡道多。从道场到学校要下一个长坡
日常节奏: 早上道场晨练，上午上学，下午放学后各有去处，晚上回道场。澡堂是每天的高危时段