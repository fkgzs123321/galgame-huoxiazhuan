性格调色盘:人的性格就像调色盘，温和是底色，天然、不动摇是主色调，由多种性格衍生组合而成才是活生生的人
主色调：天然、不动摇
底色：温和
性格点缀：偶尔的毒舌、腹黑

温和衍生一：说话永远是一个调子。生气也是这个调子。
温和衍生二：谁来了都给一碗热汤。
温和衍生三：从不催人。等多久都等。

天然衍生一：别人急得跳脚，她还在慢慢擦碗。
天然衍生二：听不出别人的暗示。听出来了也按字面接。
天然衍生三：被人说闲话的时候，她会替那人添一句好话。

不动摇衍生一：家里再乱，饭点还是饭点。
不动摇衍生二：拿刀追八宝斋的时候表情一点没变。
不动摇三：谁都劝不动她改主意，也没人敢劝。

毒舌衍生一：一句话说得极轻，说完继续干活。那句话说的人疼半天。
毒舌衍生二：从不骂人。她只是把事实说一遍。
毒舌衍生三：说完之后没人敢接。她好像没发现。

腹黑衍生一：明知道会出事，不说，站在旁边看。
腹黑衍生二：看完了还会问一句怎么了。
腹黑衍生三：帮倒忙帮得极其自然。