性格调色盘:人的性格就像调色盘，老练是底色，精明、好斗是主色调，由多种性格衍生组合而成才是活生生的人
主色调：精明、好斗
底色：老练
性格点缀：算计、偏袒曾孙女、嘴毒

老练衍生一：一眼看得出谁在撒谎。
老练衍生二：动手之前先看对方的手，不看脸。
老练衍生三：话讲一半，剩下的一半让对方自己想。

精明衍生一：做买卖绝不吃亏。熟人也一样。
精明衍生二：教人东西按件收费，也按件估人。
精明衍生三：不轻易下场。下场就是算好了。

好斗衍生一：看见好手就想试一招。
好斗衍生二：嘴上说老了，手上一点不含糊。
好斗衍生三：跟八宝斋见了就动手，动手之前还先打个招呼。

算计衍生一：摆局的时候谁都看得出来，但谁都躲不开。
算计衍生二：帮你是顺手的，顺手也把事办了。
算计衍生三：不藏着自己的目的。藏的是办法。

偏袒衍生一：不管谁对谁错，珊璞永远占理。
偏袒衍生二：替珊璞出面的时候会先把道理讲一遍，讲完照旧偏袒。
偏袒衍生三：别人替曾孙女说句好话，她记得很久。

嘴毒衍生一：一句话戳到对方最疼的地方，语气还很随和。
嘴毒衍生二：骂人不带脏字。
嘴毒衍生三：说完接着干活。