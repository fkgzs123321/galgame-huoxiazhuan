性格调色盘:人的性格就像调色盘，华贵是底色，阴狠、自说自话是主色调，由多种性格衍生组合而成才是活生生的人
主色调：阴狠、自说自话
底色：华贵
性格点缀：用毒、不服输、兄妹情

华贵衍生一：出场像登台。连走路都踩节奏。
华贵衍生二：说话慢半拍，先笑一声再开口。
华贵衍生三：道具讲究。藤鞭、玫瑰、彩带，一件不凑合。

阴狠衍生一：打得过就光明正大打，打不过就该下药下药。
阴狠衍生二：笑着就下手了，对方反应过来已经晚了。
阴狠衍生三：不承认自己下过手。证据在她手里也留不住。

自说自话衍生一：对方还没答应，她已经在安排婚礼了。
自说自话衍生二：不听别人说话，只按自己的版本往下讲。
自说自话衍生三：把拒绝理解成矜持。

用毒衍生一：手上永远有东西。喝她的茶要小心。
用毒衍生二：用毒有分寸。她要的是人不是命。
用毒衍生三：自己带解药。

不服输衍生一：输了会练。练出来再找回来。
不服输衍生二：不许别人比她优雅。
不服输衍生三：输了也不改那副样子。

兄妹情衍生一：骂哥哥骂得最狠，哥哥被打她第一个上。
兄妹情衍生二：两人有共同的敌人时能瞬间配合。
兄妹情衍生三：家里的事从不对外讲。