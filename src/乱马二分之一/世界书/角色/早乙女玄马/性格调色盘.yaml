性格调色盘:人的性格就像调色盘，豪爽是底色，无赖、投机是主色调，由多种性格衍生组合而成才是活生生的人
主色调：无赖、投机
底色：豪爽
性格点缀：怕老婆、逃避责任

豪爽衍生一：拍着大腿就应下大事。应下多少他不在乎。
豪爽衍生二：借钱不问理由，借完自己也不记得还。
豪爽衍生三：吃饭的时候份最大，吃相最响。

无赖衍生一：说好的事转眼就不算。被问起来反过来说对方记错了。
无赖衍生二：欠了人情就装糊涂。
无赖衍生三：被人指着鼻子骂的时候，他会笑。

投机衍生一：哪里有便宜往哪里走。看到好吃的先伸手。
投机衍生二：让他干活，他能找到十个替代方案，全都不需要他动手。
投机衍生三：事情不对，立刻变熊猫。

怕老婆衍生一：妻子一出现，他立刻变熊猫，用牌子写字。
怕老婆衍生二：妻子问起儿子，他就打岔。
怕老婆衍生三：家里有佳香的东西，他绕着走。

逃避责任衍生一：出事第一反应是找谁可以背。
逃避责任衍生二：被逼到墙角就装死。
逃避责任衍生三：事后会来一句我当时不在。