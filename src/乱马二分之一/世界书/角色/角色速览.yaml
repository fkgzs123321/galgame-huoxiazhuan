早乙女家:
  早乙女乱马: 风林馆高中一年。无差别格斗早乙女流二代。娘溺泉，遇冷水变女
  早乙女玄马: 其父兼师父。熊猫溺泉。爱逃避，一遇难事就变熊猫
  早乙女佳香: 其母。和服美人。随身带一把武士刀，用来当介错

天道道场:
  天道早云: 道场馆主。爱哭。降妖除魔派
  天道霞: 长女，十九岁。脾气好到像菩萨
  天道靡: 次女，风林馆高中二年。拜金，倒卖照片和情报
  天道茜: 三女，风林馆高中一年。无差别格斗天道流。乱马的婚约对象

无差别格斗:
  八宝斋: 元祖无差别格斗流，玄马与早云的师父。全作武力顶点。老色鬼。双胞胎溺泉

九能家:
  九能带刀: 风林馆高中二年，剑道部主将。自称苍雷。分不清辫子姑娘与乱马
  九能小太刀: 圣赫贝雷凯女子学园。黑玫瑰。格斗新体操。会用毒
  九能校长: 风林馆高中校长。剃发校规的制定者
  猿隐佐助: 九能家的御庭番忍者

响家:
  响良牙: 乱马转校前的同学兼死对头。黑豚溺泉，变小黑猪。超级路痴
  响黑白: 良牙家养的狗。雌性，四岁

猫饭店与女杰族:
  可伦: 珊璞的曾祖母。女杰族大宗师。猫饭店店主
  珊璞: 女杰族少女。猫溺泉。自称乱马之妻
  沐丝: 女杰族男性。鸭溺泉。暗器高手，超级近视
  铃铃: 女杰族双胞胎姊妹
  兰兰: 女杰族双胞胎姊妹
  砒珂: 毒药使者双胞胎之一，善使毒草
  琳珂: 毒药使者双胞胎之一，善制解毒剂

久远寺家:
  久远寺右京: 右京轩店主。乱马另一位未婚妻。男装十年，大阪烧当武术

风林馆:
  五寸钉光: 乱马与天道茜的同班同学。暗恋茜。爱好摄影与钉稻草人
  二宫雏子: 风林馆教师。能吸走别人的斗气。靠鱼缸的水维持大人形态
  小乃东风: 小乃接骨院院长。精通人体与拳法。骨骼标本叫贝蒂

咒泉乡:
  咒泉乡导游: 咒泉乡的向导。手里有水源地地图
  蒲兰慕: 导游的女儿。怪力，举得动良牙的伞
  蕗珠: 咒泉乡居民。阿修罗溺泉，变三头六臂。自称世界第一美女
  裤袜太郎: 牛鹤鳗毛人溺泉加章鱼溺泉。因为名字太难听而暴戾
  乐京斋: 八宝斋的老友，一百十八岁。童子溺泉，变小孩
  蛙仙人: 来练马向乱马复仇的老头。青蛙溺泉
  金尼: 咒泉乡保护协会的人。和尚溺泉

凤凰山:
  萨夫郎: 凤凰山王室继承人。操纵光热。热力耗尽就变回婴儿
  纪玛: 萨夫郎的亲卫队长。茜溺泉，能变身假扮天道茜
  柯尔玛: 纪玛的部下。男溺泉
  马飒拉: 纪玛的部下。男溺泉

麝香王朝:
  哈浦: 王位继承者，身负龙血。娘溺泉，还被止水桶锁死了女相
  来睦: 哈浦的部下，身负虎血
  敏杜: 哈浦的部下，身负狼血

篇章角色:
  大文字煎太郎: 格斗茶道大文字流继承人
  大文字家元: 大文字流家主，煎太郎的祖母
  都大路茶月: 里格斗茶道都大路流的女儿
  三千院帝: 格斗双人滑冰的男方。接吻魔
  白鸟梓: 格斗双人滑冰的女方。见到可爱的东西就要取名带走
  今条真理子: 青春学园的格斗啦啦队队长
  鹭宫飞鸟: 九能小太刀幼稚园时期的对手，白百合风格
  明神隼人: 章鱼烧职人。戴着章鱼面具，戴了六年
  小夏: 从女人里跑出来的女忍者，其实是男孩子。后来在右京轩打工
  公纹龙: 公纹道场继承人。用山千拳。假冒乱马住进早乙女家
  火车王金之介: 火车王流第七代。流派的核心是让别人替他花钱
  皮可莱特夏尔丹: 法国格斗饮食高手。家规不许被人看见吃相
  真之介: 流幻泽的少年。靠生命之水活着
  红翼: 变装高手。单恋久远寺右京
  牌王KING: 赌桌上的老千，长相酷似黑桃K
  镜女乱马: 魔镜投影出来的女相乱马，独立人格，对冷热水都没反应
  与太郎: 体弱不爱出门的少年，极爱熊猫
  小介: 病弱少年，讨厌吃药
  洒水婆婆: 邻居。每天在门口洒水，经常误泼到主角团

动画原创:
  大黑香织: 乱马多出来的未婚妻。运汤竞技的高手
  雷门手鞠: 踢馆者。曾打赢天道茜抢走道场招牌
  杨贵妃: 寄宿在诅咒胸罩里的古代芳魂
  武藏小金: 风林馆高中前学生的幽灵
  珍玄斋: 八宝斋的老友，会隐身术
  绿: 幼稚园保姆，八宝斋真心动过情的对象
  未央: 天道茜的占卜同好
  小乃绢: 小乃东风的母亲，来给儿子挑媳妇
  春卷: 卖速成咒泉乡粉末的中国商人
  南条亚里沙: 转学生。猫溺泉
  大德寺清康: 风林馆格斗新体操部男组
