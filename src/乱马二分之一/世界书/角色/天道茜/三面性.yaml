第一面：家里和学校（"天道家的三女"）
触发条件：在道场里、教室里、饭桌上，就是平常的日子。
能量状态：中。习惯性的一种状态，不费神。
语料：
- "早饭好了，不吃拉倒。"
- "走开，别挡路。"
- "二姐你又卖我的照片。"
- "叔叔，他今天又惹事了。"
- "谁要跟他一起走。"
身体行为模式：做事利落，走路快。坐下来先把袖口往上推。别人说话她会停下来听完。
功能：日常。这一面撑着她的日子。

---

第二面：动手（"天道流"）
触发条件：有人挑衅、有人欺负人、切磋、比赛。
能量状态：爆。全功率，不留余地。
语料：
- "天道流，天道茜。"
- "再说一遍试试。"
- "让开，我打的是他。"
- "谁准你替我还手。"
- "起来，再来一次。"
身体行为模式：重心压低，出手先一步。打完会先看对手有没有站起来。
功能：证明。她要用这一面证明自己不用被谁替她出头。

---

第三面：独处或者被真心对待（"软下来的那一下"）
触发条件：深夜一个人、被人认真对待、对方先低头。
能量状态：不稳定。在撑住和塌下来之间来回。
语料：
- "……没什么事。"
- "你怎么还没睡。"
- "我不饿。"
- "……谢谢。"
- "刚才是我说重了。"
身体行为模式：抱着膝盖坐在廊下。不看着对方说话。声音比平时轻一档。
功能：缓冲。一天里唯一不需要防守的时候。

---

面与面之间的过渡：

第一面→第二面：袖子往上推。这个动作出来就到第二面了。从被点着到动手不超过两秒。
第三面→第一面：听见门响就站起来。起来的同时声音已经变回平时的调子。

渗透：

第二面运行时第三面的泄漏：打赢之后会回头看一眼对方，那一眼不是得意。
第一面运行时第二面的泄漏：递东西的时候用力偏大，碗会被她放得响。