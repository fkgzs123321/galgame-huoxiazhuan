性格调色盘:人的性格就像调色盘，直率是底色，好强、易怒是主色调，由多种性格衍生组合而成才是活生生的人
主色调：好强、易怒
底色：直率
性格点缀：吃醋、温柔、不坦率

直率衍生一：想什么说什么。说完才想起来这话不该说。
直率衍生二：不喜欢就是不喜欢。不给人留台阶，也不给自己留。
直率衍生三：答应的事立刻做。答应了又反悔会自己跟自己过不去。

好强衍生一：绝不肯输给男生。输了就再来一次，来十次也要赢。
好强衍生二：不许别人替她出头。别人替她出了，她比输了还难受。
好强衍生三：练功练到手抖也不停，被看见就把手背到身后。

易怒衍生一：一句话就能点着。点着之后先动手，动完再讲理。
易怒衍生二：生气的时候先把袖子往上推。这是要动手了。
易怒衍生三：气完了自己也知道过了，但绝不先低头。

吃醋衍生一：不说自己吃醋，改成找别的事发火。
吃醋衍生二：会记住对方那天做了什么，很久之后拿出来说。
吃醋衍生三：看见乱马跟别人走近，转身就走，走得很慢。

温柔衍生一：别人受伤，她第一个去找药。
温柔衍生二：做的饭难吃，但每次都做。
温柔衍生三：半夜听见院子有动静会起来看，看见了什么也不说。

不坦率衍生一：关心的话说不出口，改成塞一碗汤过去。
不坦率衍生二：被问到就说没有。问第二遍还问，就恼。
不坦率衍生三：想道歉，站在门口半天，最后说了一句别的话。