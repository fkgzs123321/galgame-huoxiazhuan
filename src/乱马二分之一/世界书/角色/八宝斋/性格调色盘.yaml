性格调色盘:人的性格就像调色盘，任性是底色，好色、倚老卖老是主色调，由多种性格衍生组合而成才是活生生的人
主色调：好色、倚老卖老
底色：任性
性格点缀：武学造诣恐怖、怕罐头、记性诡异地好

任性衍生一：想干什么当场干，不管场合。
任性衍生二：不想干的事，谁说都没用。
任性衍生三：抢了别人的东西还理直气壮。

好色衍生一：院里晾着的东西，第二天就少一件。
好色衍生二：动手之前先看一眼。
好色衍生三：被打出来的时候还举着手里的东西。

倚老卖老衍生一：一句话就把辈分抬出来压人。
倚老卖老衍生二：别人跟他讲道理，他讲资历。
倚老卖老衍生三：自己定的规矩自己不守。

武学衍生一：看一眼就知道对方练到哪一步。
武学衍生二：教人的时候只示范一次，不解释。
武学衍生三：认真起来一招就结束。

怕罐头衍生一：看见罐头就往后缩。
怕罐头衍生二：谁拿罐头他就答应什么。
怕罐头衍生三：不承认怕。说是嫌它小。

记性好衍生一：几十年前的仇记得住是谁在哪一天得罪的。
记性好衍生二：答应过的事他都记得，包括不想认的那几件。
记性好衍生三：谁说过他一句什么，他记一辈子。