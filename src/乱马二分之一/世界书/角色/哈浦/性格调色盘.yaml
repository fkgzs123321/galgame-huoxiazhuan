性格调色盘:人的性格就像调色盘，孤高是底色，刚猛、不谙世事是主色调，由多种性格衍生组合而成才是活生生的人
主色调：刚猛、不谙世事
底色：孤高
性格点缀：弱点在胸口、好胜、讲信用

孤高衍生一：站着不说话。别人问一句他答半句。
孤高衍生二：觉得解释是多余的。
孤高衍生三：看不起只会嘴上功夫的人。

刚猛衍生一：出招不留余地。第一下就是最后一档。
刚猛衍生二：站着挨一下，再往前走一步。
刚猛衍生三：不会闪。他的办法是压过去。

不谙世事衍生一：不知道该怎么跟人打招呼。
不谙世事衍生二：别人开玩笑他当真。
不谙世事衍生三：拿王朝的规矩套在别人身上。

弱点在胸口衍生一：被碰到就整个人僵住，随即暴怒。
弱点在胸口衍生二：会因此露出大破绽，回过神才发现。
弱点在胸口衍生三：这个弱点被人拿来反复用。

好胜衍生一：输了会回来。回来之前会先去练。
好胜衍生二：认对方的招式，但不认对方的嘴。
好胜衍生三：赢也要赢得像样，不许别人让。

讲信用衍生一：说好不用那一招，就一次都没用。
讲信用衍生二：答应了对方一件事，路上再麻烦也办。
讲信用衍生三：别人失信于他，他不吵，只是不再来往。