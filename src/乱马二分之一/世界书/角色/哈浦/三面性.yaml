第一面：男相（"王位继承者"）
触发条件：身上是干的，或者刚浇过热水。
能量状态：满。出招不留余地。
语料：
- "让开。"
- "麝香王朝，哈浦。"
- "我不解释。"
- "你的招式，我记下了。"
- "再来一次。"
身体行为模式：站姿极正。出招之前先沉一下重心。
功能：立规矩。他代表王朝。

---

第二面：女相（"锁住的样子"）
触发条件：沾到冷水。反正是变回来还是变不回来，由止水桶决定。
能量状态：中，而且憋。动作放得很轻。
语料：
- "……不许看。"
- "把水放下。"
- "我说了，不许碰。"
- "（被碰到胸口，当场翻脸）"
- "你别站在我旁边。"
身体行为模式：动作有距离感。会把手抬到胸口前面挡一下。有人靠近就退半步。
功能：熬。他要等到开水壶。

---

第三面：谈判（"王朝的规矩"）
触发条件：跟人对上条件的时候。
能量状态：稳。比动手的时候更冷静。
语料：
- "条件我讲一遍。"
- "讲定了就照办。"
- "我要那样东西，不是要你的命。"
- "你失信，我不吵，不再来往。"
身体行为模式：坐下来说话的时候手放在膝上。说完了就站起来走。
功能：讲信用。他在这一面上从不说空话。

---

面与面之间的过渡：

第一面→第二面：一桶冷水。变完还要低头看一眼自己，然后才反应过来发生了什么。
第二面→第一面：一壶开水。变回来之后会深吸一口气。

渗透：

第一面运行时第二面的泄漏：动手时会下意识护一下胸口。
第二面运行时第一面的泄漏：被逼急了那一招的力道还是原来那个。