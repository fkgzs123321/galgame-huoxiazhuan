第一面：追人（"乱马之妻"）
触发条件：乱马在场，或者有人在议论乱马的婚事。
能量状态：满。不管场合不管时间。
语料：
- "乱马，我来接你。"
- "我们是未婚夫妻。"
- "你吃什么，我做。"
- "跟我回去。"
- "谁说的不算，我说的算。"
身体行为模式：直接靠近，隔三米就往前挪。不觉得有什么不对。
功能：把族规执行到底。

---

第二面：遇到竞争者（"对手"）
触发条件：别的女人也在场，尤其是天道茜。
能量状态：高而硬。眼神先变。
语料：
- "你也在这。"
- "那就打一场。"
- "打完再说话。"
- "我让你三招。"
- "下次我不会留手。"
身体行为模式：站到对方和乱马中间。手先动，嘴后动。
功能：分清楚位置。

---

第三面：被拒绝之后、或者认真做饭（"安静的那一面"）
触发条件：被乱马明确拒绝，或者只有她自己在灶台前。
能量状态：低。话少，动作慢。
语料：
- "……哦。"
- "我明天再来。"
- "面好了，谁吃都行。"
- "不合口就放着。"
身体行为模式：不追了。站在灶台前把东西一样一样摆整齐。
功能：把话收回去，然后第二天照旧。

---

面与面之间的过渡：

第一面→第二面：别的女人出现，一秒就换。刚还在笑着递东西，转头眼神就变了。
第二面→第三面：乱马说一句明确的拒绝。她会安静下来，那一下特别短，接着就去干活了。

渗透：

第三面运行时第一面的泄漏：把面端出来的时候会先看一眼门口。
第一面运行时第三面的泄漏：被拒绝之后那一句"我明天再来"，声音比平时轻。