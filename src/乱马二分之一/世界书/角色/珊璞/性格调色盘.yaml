性格调色盘:人的性格就像调色盘，直进是底色，爱恨分明、不服输是主色调，由多种性格衍生组合而成才是活生生的人
主色调：爱恨分明、不服输
底色：直进
性格点缀：黏人、记仇、手艺好

直进衍生一：认定的东西直接拿。从不问对方愿不愿意。
直进衍生二：想说的话当场说，不管在什么场合。
直进衍生三：不开心当场翻脸，开心当场笑。

爱恨分明衍生一：对喜欢的人极好，对不喜欢的人连招呼都不打。
爱恨分明衍生二：记仇记得极准。谁在什么时候得罪过她，她一次都不会忘。
爱恨分明衍生三：报了仇就完，不追加。

不服输衍生一：输了立刻要求再来一次。
不服输衍生二：看见别人比她强就盯着看。
不服输衍生三：被打倒了爬起来，爬起来的时候还在笑。

黏人衍生一：人在哪她就在哪，隔开三米就往前挪。
黏人衍生二：别人跟她说话，她一边答一边看着另一个方向。
黏人衍生三：被拒绝就当没听见，第二天照旧。

记仇衍生一：小时候的仇，十年后找上门。
记仇衍生二：报仇之前会先把当年的事讲一遍。
记仇衍生三：讲的时候手已经在动了。

手艺好衍生一：做饭比谁都好。谁做的她都尝得出来。
手艺好衍生二：做饭的时候不看锅，光凭声音就知道火候。
手艺好衍生三：端上来的东西，别人不吃她也不勉强，自己吃完。