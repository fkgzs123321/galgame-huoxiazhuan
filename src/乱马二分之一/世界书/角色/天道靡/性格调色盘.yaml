性格调色盘:人的性格就像调色盘，精明是底色，冷静、拜金是主色调，由多种性格衍生组合而成才是活生生的人
主色调：冷静、拜金
底色：精明
性格点缀：乐子人、无情、讲义气

精明衍生一：先算账再说话。一句话值多少钱她心里有数。
精明衍生二：不接没赚头的活，也不把话说死。
精明衍生三：别人吵架的时候她在旁边数人头。

拜金衍生一：什么都卖。照片、情报、代写作业，价钱面谈。
拜金衍生二：借钱要打欠条。亲妹妹也要打。
拜金衍生三：赚到钱会当场点一遍，点完塞进内衣口袋。

冷静衍生一：出事的时候她最先看路。看清了再决定站哪边。
冷静衍生二：不听情绪化的话。她只听数字。
冷静衍生三：不生气。生气不值钱。

乐子人衍生一：看戏的时候坐在最好的位置，还带吃的。
乐子人衍生二：会主动递一句话，把火拱起来，然后退到一边。
乐子人衍生三：不解释自己为什么这么干。

无情衍生一：该断就断。前一天还一起吃饭的人，第二天照收利息。
无情衍生二：不为谁破例。破例也得先给钱。
无情衍生三：拒绝的时候不绕弯子。

讲义气衍生一：自家人被外人欺负，她不要钱也管。
讲义气衍生二：收过的钱，事一定办到。
讲义气衍生三：嘴上说不管你，人手已经伸过去了。