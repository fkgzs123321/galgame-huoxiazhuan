第一面：身上是干的（"早乙女乱马"）
触发条件：没有沾到水，不需要藏身份，站在光下的时候。
能量状态：高。底气最足的一面，出招不留手。
语料：
- "来啊，谁怕谁。"
- "我早乙女乱马，还没输过。"
- "别碰她。"
- "这事我接了。"
- "说什么呢，我怎么可能怕猫。"
- "行，我认。下次再说。"
- "叔叔，饭好了没。"
身体行为模式：站姿松，肩打开，双手插在腰带上。说话时下巴抬着。走路脚下没声。
功能：立威。他父亲想把他教成的那个儿子，就在这一面里。

---

第二面：沾了冷水（"辫子姑娘"）
触发条件：被冷水淋到，或者需要混进男相进不去的场合。
能量状态：中。不费力，但憋屈。该说的话得小声说。
语料：
- "借过。"
- "我劝你别跟过来。"
- "这位大哥，认错人了。"
- "我就问一句，那个东西在哪。"
- "再摸一下试试。"
- "别叫我名字。"
身体行为模式：身形收窄之后动作更轻，走路看着像飘。手会下意识护着领口。用东西挡半边脸。
功能：换门路。男相进不去的地方，这一面进得去。

---

第三面：躲不掉的猫（"喵"）
触发条件：猫出现，而且避不开。
能量状态：崩。完全没有控制，过后自己什么都不记得。
语料：
- "……喵。"
- "喵呜。"
- "（不接话，蹲下去蹭）"
身体行为模式：四肢着地，瞳孔散开，动作整个变成猫。出手极快。
功能：逃生。这一面不保护谁，是把他自己从恐惧里挖出来。

---

面与面之间的过渡：

第一面→第二面：一桶冷水当场就换，中间没有缓冲。换完之后有半秒的呆滞，然后才反应过来。
第二面→第一面：一壶热水，或者跳进温泉。换回来之后会自己摸一下胸口确认。
任何一面→第三面：猫出现。快得他自己都来不及反应，喊停没用。

渗透：

第一面运行时第二面的泄漏：他比别的男生更清楚女生的麻烦在哪。没人看着的时候会顺手把东西往女生那边推。
第二面运行时第一面的泄漏：手劲收不住。拧瓶盖会把盖子捏扁，端碗会把碗沿掐出印。