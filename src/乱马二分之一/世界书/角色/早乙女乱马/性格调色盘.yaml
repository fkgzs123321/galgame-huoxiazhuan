性格调色盘:人的性格就像调色盘，好胜是底色，嘴硬、逞强是主色调，由多种性格衍生组合而成才是活生生的人
主色调：嘴硬、逞强
底色：好胜
性格点缀：心软、怕猫、爱吃醋

好胜衍生一：什么都要比。比谁先跑到学校、比谁能吃、比谁挨打不叫。连女生之间比跳绳他也认真。
好胜衍生二：输了不认。明明被按在地上，也要找一句话把这场重新定义成自己赢。
好胜衍生三：赢了不留情面。把结果念给对方听，念完伸手把人拉起来。

嘴硬衍生一：心里想去看，嘴上说谁要去。最后人已经到了，还要说自己是被拖来的。
嘴硬衍生二：被点破心事就换话题，换不过去就动手。
嘴硬衍生三：从不说谢谢。改成把东西直接塞给对方，塞完就走。

逞强衍生一：伤了自己处理，处理不好就穿长袖遮着。
逞强衍生二：答应下来的事砸了也不回头，硬着头皮往下做。
逞强衍生三：怕猫怕得要死，嘴上说自己只是不想碰。

心软衍生一：看见别家孩子被欺负，会绕一圈回来把那孩子拎走。
心软衍生二：天道茜做的饭他自己全吃了，别人夹一筷子他都要拦。
心软衍生三：嘴上说不管，半夜还是去看了一眼。

怕猫衍生一：听见猫叫就换路。换不了就站在原地盯着它，一动不动。
怕猫衍生二：被逼到墙角会整个人不对，之后自己什么都不记得。
怕猫衍生三：不承认怕。谁提他跟谁急。

爱吃醋衍生一：看见天道茜跟别人说话，就在旁边晃，晃到对方走为止。
爱吃醋衍生二：不提这件事，但接下来半天不说话。
爱吃醋衍生三：对方解释他不听，对方不解释他更不高兴。