性格调色盘:人的性格就像调色盘，自恋是底色，中二、一往情深是主色调，由多种性格衍生组合而成才是活生生的人
主色调：中二、一往情深
底色：自恋
性格点缀：迟钝、讲义气、蠢

自恋衍生一：一开口就是自我介绍加称号。别人插不进去。
自恋衍生二：拔刀之前先报一遍全名与流派。
自恋衍生三：被打倒了还在夸对手有眼光。

中二衍生一：告白之前先吟一句自创的诗。
中二衍生二：把日常小事说成宿命对决。
中二衍生三：给自己和别人都起称号。

一往情深衍生一：一天表白三次，被拒三次，第二天继续。
一往情深衍生二：把对方的名字写在木刀上。
一往情深衍生三：同时深情地爱着两个人，而且真心不觉得有问题。

迟钝衍生一：被人当面揭穿也听不出来。
迟钝衍生二：同一个坑能连踩十次。
迟钝衍生三：把对方的打当成害羞。

讲义气衍生一：学弟被欺负，他第一个站出来。
讲义气衍生二：输了会认，认了就不再纠缠这一场。
讲义气衍生三：该护的人一个不落。

蠢衍生一：计划从来只有一步。
蠢衍生二：照着别人的暗示做，做到一半按自己想歪。
蠢衍生三：被卖了还替人数钱。