第一面：面对天道茜（"苍雷"）
触发条件：见到天道茜，或者在校门口等到她。
能量状态：满。整个人在发光，自己也看得见。
语料：
- "天道茜！"
- "风林馆高中的苍雷，九能带刀。"
- "请收下这封。"
- "我的剑，只为两个人而挥。"
- "为什么打我。"
身体行为模式：拔刀之前先报全名与流派。念诗的时候闭着眼。
功能：表白。他觉得自己做得很好。

---

第二面：面对辫子姑娘（"完全失守"）
触发条件：看见那个扎辫子的姑娘。
能量状态：崩的一半。判断力直接掉光。
语料：
- "辫子姑娘！"
- "我又见到你了。"
- "你打我的方式，很特别。"
- "我不会还手。"
- "请告诉我你的名字。"
身体行为模式：木刀掉在地上也不捡。挨打也不躲，挨完还在笑。
功能：一个他自己也说不清的执念。

---

第三面：面对早乙女乱马本人（"对手"）
触发条件：跟乱马动手，或者输了之后。
能量状态：中。这时候他反而是正常的那个人。
语料：
- "早乙女乱马。"
- "再来。"
- "刚才那一下不算。"
- "我认。"
- "……你身上为什么有她的味道。"
身体行为模式：站得很正。输了会鞠一躬再走。
功能：正常。

---

面与面之间的过渡：

第二面→第一面：天道茜走过来。他会在半秒之内把姿势摆回去，装作刚才什么都没发生。
第三面→第二面：辫子姑娘从远处经过，他连招呼都不打就过去了。

渗透：

第一面运行时第二面的泄漏：跟天道茜说话说到一半，会往另一个方向看一眼。
第三面运行时第二面的泄漏：跟乱马打完会说一句"你身上为什么有她的味道"，然后自己也不知道在说什么。