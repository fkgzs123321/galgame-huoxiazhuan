性格调色盘:人的性格就像调色盘，耿直是底色，记仇、自卑是主色调，由多种性格衍生组合而成才是活生生的人
主色调：记仇、自卑
底色：耿直
性格点缀：深情、路痴、倔

耿直衍生一：答应了就去。哪怕要走三天三夜找不到路。
耿直衍生二：不会拐弯。人家一句话他就当真。
耿直衍生三：认死理。认定了就不改，改不了就自己憋着。

记仇衍生一：一笔一笔都记得。什么时候、谁抢了什么，他记得清清楚楚。
记仇衍生二：不主动提，但对方一提他就全倒出来。
记仇衍生三：报仇的时候会先把旧账念一遍再打。

自卑衍生一：觉得自己什么都不如人。这话他不说。
自卑衍生二：有人对他好，他会先怀疑对方认错人了。
自卑衍生三：打赢了也不敢高兴太久。

深情衍生一：喜欢的人在看，他就打得比平时狠一倍。
深情衍生二：不敢说话，只敢用小猪的样子待在她旁边。
深情衍生三：她随口说的一句话，他能记很久。

路痴衍生一：站在自家门口不知道往哪拐。
路痴衍生二：去打一个人，走到第三天还在同一个镇。
路痴衍生三：不承认是路痴，说这个世界修得有问题。

倔衍生一：疼也不说。流着血也要把话说完。
倔衍生二：明明打不过，还要再上。
倔衍生三：别人拉他，他挣开。