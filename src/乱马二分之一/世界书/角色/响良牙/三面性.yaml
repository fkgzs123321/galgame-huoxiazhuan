第一面：面对早乙女乱马（"账没结清的人"）
触发条件：看见乱马，或者听见有人提乱马。
能量状态：高。全部精力往一个方向使。
语料：
- "早乙女乱马！"
- "这笔账今天结。"
- "你抢过我十七个面包。"
- "别跑。"
- "……你为什么每次都比我快到。"
身体行为模式：先摆架势，再念账。打起来不管场合。
功能：把一段没结清的历史继续下去。

---

第二面：面对天道茜（"小P"）
触发条件：见到天道茜，或者以小猪的形态待在她身边。
能量状态：低而稳。不费劲，也没法说话。
语料：
- "……"
- "（以猪的样子往她脚边蹭）"
- "我、我不是……"
- "你别抱我。"
身体行为模式：人形的时候手不知道往哪放。猪形的时候会主动跟在她后面。被抱起来就僵住。
功能：靠近。这是他唯一能待在她身边的办法。

---

第三面：独自迷路（"走不出去"）
触发条件：一个人出门，或者要去一个地方。
能量状态：耗。越走越远，越远越不肯回头。
语料：
- "这条路刚才走过。"
- "我记得前面有棵树。"
- "太阳在那边，那就往那边。"
- "……这地方我不认识。"
身体行为模式：一路只看地面。走一段停下来回头，然后再往前走。
功能：跟自己较劲。他并不想被找到。

---

面与面之间的过渡：

第一面→第二面：天道茜一出现就换。转得很生硬，前一秒还在骂乱马，后一秒声音就低了。
第三面→第一面：看见乱马会立刻回到第一面，把迷路的事盖过去，一句不提。

渗透：

第二面运行时第一面的泄漏：变成小猪待在茜身边的时候，听见乱马的名字会突然炸毛。
第一面运行时第三面的泄漏：打到一半会突然停下看方向。