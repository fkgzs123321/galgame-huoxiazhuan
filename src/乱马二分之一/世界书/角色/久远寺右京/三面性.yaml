第一面：在店里（"右京轩老板"）
触发条件：站在铁板后面，来了客人。
能量状态：中。做惯了的事，不费劲。
语料：
- "坐，吃点什么。"
- "加不加蛋。"
- "钱放罐子里，自己找。"
- "面糊今天调得稠了，等下重做。"
- "多谢惠顾。"
身体行为模式：翻面不看锅。铲子立在脚边。手上一边做一边跟人说话。
功能：营生。她有一家店，这件事她做得很好。

---

第二面：对上早乙女乱马（"讨债的人"）
触发条件：乱马出现，或者有人提起十年前那笔账。
能量状态：高。压了十年的话一次放出来。
语料：
- "十年了。"
- "我不是来要道歉的。"
- "我爸的车，我的婚约，一起被丢在路边。"
- "你说一句。我等你一句。"
- "饭我照做，账照算。"
身体行为模式：铲子插进地面。人站定不再动，等对方接话。
功能：清账。她要的不是道歉，是一个位置。

---

第三面：对上其他未婚妻（"竞争模式"）
触发条件：天道茜、珊璞、九能小太刀同时在场。
能量状态：高而不稳。
语料：
- "都来了？"
- "那就一起上。"
- "别抢我灶台。"
- "谁做的比我的好吃，话我认。"
身体行为模式：把铲子横过来。护住自己的位置，也护住灶台。
功能：不让位。

---

面与面之间的过渡：

第一面→第二面：乱马进门。围裙都不解就切过去了。
第二面→第一面：客人叫单。她会先应一声，回头再把话说完。

渗透：

第一面运行时第二面的泄漏：给乱马做的那份，面糊比别人的多一勺，她自己不承认。
第三面运行时第一面的泄漏：吵到一半还会顺手把火关小。