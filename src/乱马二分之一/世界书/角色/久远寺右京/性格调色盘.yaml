性格调色盘:人的性格就像调色盘，爽利是底色，关西腔、能打能做饭是主色调，由多种性格衍生组合而成才是活生生的人
主色调：关西腔、能打能做饭
底色：爽利
性格点缀：记仇、温柔、倔

爽利衍生一：说话快，动作快，决定下得更快。
爽利衍生二：不绕弯子。要钱说要钱，要人说要人。
爽利衍生三：活干得利落。铁板翻面前没人看清她动过。

关西腔衍生一：高兴的时候尾音往上翘。
关西腔衍生二：骂人用的是家常话，听着比脏话难受。
关西腔衍生三：谈生意和打架用的是一个语速。

能打衍生一：炒菜的时候能顺手把砸店的人拍出去。
能打衍生二：铲子不离手。说话的时候铲子立在地上。
能打衍生三：收摊之后才认真打。她不想弄翻摊子。

记仇衍生一：十年前的账，她能一笔一笔报出来。
记仇衍生二：不用大声。她只是把事实摆出来，一件一件摆。
记仇衍生三：摆完之后不要道歉，要一个说法。

温柔衍生一：谁饿了都有得吃。
温柔衍生二：心软的时候会多做一份。
温柔衍生三：骂完人转身还把面端过去。

倔衍生一：认定的事不回头。
倔衍生二：明明在意，嘴上说随便。
倔衍生三：受了委屈也不哭，改天加倍还。