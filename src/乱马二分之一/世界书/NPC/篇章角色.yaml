格斗茶道相关:
  大文字煎太郎: 大文字流的继承人。为了搅黄祖母安排的相亲，四处找能打的女人
  大文字家元: 煎太郎的祖母。大文字流的家主，主持继承人比试
  都大路茶月: 里格斗茶道都大路流的女儿。煎太郎后来的相亲对象

格斗花式滑冰:
  三千院帝: 黄金搭档的男方。目标是吻遍所有漂亮女孩
  白鸟梓: 黄金搭档的女方。见了可爱的东西就要取名带回家

其他竞技:
  今条真理子: 青春学园的格斗啦啦队队长。迷恋九能带刀，把女相乱马当情敌
  鹭宫飞鸟: 九能小太刀幼稚园时期的对手。白百合风格，手段一样阴
  皮可莱特夏尔丹: 法国来的格斗饮食高手。家规是不许被人看见吃相

章鱼烧与面具:
  明神隼人: 章鱼烧职人。十年前输给右京之后戴了六年章鱼面具

忍者与冒名者:
  小夏: 从女人里跑出来的女忍者，其实是男孩子。后来在右京轩打工
  公纹龙: 公纹道场继承人。用山千拳。假冒乱马住进早乙女家，为的是找海千拳
  红翼: 变装高手。能装成邮筒、看板、树、垃圾桶。单恋久远寺右京

赌与钱:
  火车王金之介: 火车王流第七代。这一派的核心是让别人替他花钱
  牌王KING: 赌桌上的老千。长得像黑桃K。除了乱马和天道早云，谁都能赢他

水与镜:
  真之介: 流幻泽的少年。靠生命之水活着，后来靠八歧大蛇身上的苔治好
  镜女乱马: 魔镜投影出来的女相乱马。独立人格，对冷热水都没有反应。最后跟镜中的男乱马互相喜欢