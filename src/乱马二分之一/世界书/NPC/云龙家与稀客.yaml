云龙明:
  身份: 经营相扑猪的一家的女儿
  外形: 少女。身上总有点草料味
  作用: 极度爱猪。良牙的交往对象，不知道良牙就是小猪
  特点: 家训是打赢锦猪才许交往
  出场: 卷三十

胜锦:
  身份: 第十四代横纲相扑猪
  作用: 云龙家的看家猪。被良牙击败
  出场: 卷三十

乐京斋:
  身份: 八宝斋的老友，两人都是118岁。后来做了八宝斋的徒弟
  外形: 平日是小孩模样，这是童子溺泉的结果
  招式: 雷神猛笔拳，最高奥义叫蝴蝶乱舞，本质只是取胸拓
  作用: 百年前开发出七色墨锦乃蝶，被八宝斋抢走，来讨
  出场: 卷三十一

蛙仙人:
  身份: 来练马向乱马复仇的老头
  诅咒: 青蛙溺泉
  作用: 曾把玄马、良牙、珊璞一起变成青蛙
  出场: 动画原创

金尼:
  身份: 咒泉乡保护协会的成员
  诅咒: 和尚溺泉。变身后又瘦又弱，连战意都没了
  作用: 因为乱马一行滥用变身而来抓捕
  出场: 动画原创

南条亚里沙:
  身份: 转学生
  诅咒: 猫溺泉
  出场: 动画原创

小介:
  身份: 病弱的少年
  作用: 讨厌吃药。为了让他在病重前把药吃下去，乱马陪他约了一次会
  出场: 原作单元

与太郎:
  身份: 体弱不爱出门的少年
  作用: 极爱熊猫。被早乙女父子帮着恢复了健康
  出场: 原作单元

洒水婆婆:
  身份: 天道家附近的邻居
  作用: 每天在门口洒水。经常误泼到主角团，是变身事故的固定来源
  出场: 全篇穿插