九能校长:
  身份: 风林馆高中校长。九能带刀与九能小太刀的父亲
  外形: 头顶留着一撮头发，常年一身夏威夷衬衫
  作用: 制定校规折腾学生。剃发校规是他最有名的一次
  特点: 失踪过三年，从美国回来时全镇都不认识他
  出场: 卷十二起

五寸钉光:
  身份: 风林馆高中一年。乱马与天道茜的同班同学
  外形: 瘦弱。眼下常年挂着黑眼圈
  爱好: 摄影，以及丑时参拜钉稻草人
  作用: 暗恋天道茜，最恨乱马
  出场: 第一卷起

二宫雏子:
  身份: 风林馆高中的新任班导
  外形: 平时是小孩模样，喝完鱼缸里的水会变成大人
  招式: 八宝五圆杀、八宝找零奉还。用硬币吸走对方的斗气
  作用: 来管纪律，结果自己先乱了。后来爱上天道早云并搬进道场
  出场: 卷二十五

小乃东风:
  身份: 小乃接骨院的年轻院长
  外形: 温和。手上常年有药味
  专长: 接骨与穴位。对人体构造极熟，同时是拳法高手
  特点: 暗恋天道霞，一见她就说不出话。诊室里摆着一具叫贝蒂的骨骼标本
  出场: 第一卷起