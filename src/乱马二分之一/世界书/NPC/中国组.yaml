沐丝:
  身份: 女杰族男性。珊璞的儿时玩伴，现在是猫饭店的杂工
  外形: 长年戴一副厚眼镜，一摘就什么都看不见
  招式: 暗器。袖子里、鸭羽底下都藏东西。鹰爪拳、白鸟拳、鸡卵拳
  诅咒: 鸭子溺泉。遇冷水变鸭
  作用: 追求珊璞，把乱马当情敌
  出场: 卷五起常驻猫饭店

裤袜太郎:
  身份: 咒泉乡出身。名字是八宝斋给起的
  外形: 变了身是牛头、雪人身子、鹤翼、鳗尾的四不像，后来又长出章鱼脚
  诅咒: 牛鹤鳗毛人溺泉加章鱼溺泉，两种叠在一起
  作用: 因为名字太难听而暴戾，反复来日本逼八宝斋改名
  出场: 卷十八、卷二十三

蕗珠:
  身份: 咒泉乡居民。自称世界上最美的人
  外形: 少女。变身后是三头六臂的阿修罗
  诅咒: 阿修罗溺泉。变阿修罗时体温极高，能放热风把冷水变成热水
  招式: 火龙大轮舞、雷蛇天诛杀
  作用: 力之源被裤袜太郎偷走，追到日本来
  出场: 卷三十二