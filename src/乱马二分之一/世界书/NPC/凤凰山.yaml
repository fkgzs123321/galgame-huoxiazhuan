萨夫郎:
  身份: 凤凰山王室的继承人
  外形: 平日是幼童模样。真正的王能自己涌出光与热
  能力: 巨型火球、飞行、天下瞬灭皇球弹。断肢能再生
  处境: 本地山顶溺泉干涸，他长不大，没有武力也没有特殊能力
  作风: 自私高傲。为了抢热水不惜掐断咒泉乡的水
  结局: 与乱马一战耗尽热力，变回婴儿。战后地脉变动，本地泉复活
  出场: 卷三十七、卷三十八

纪玛:
  身份: 萨夫郎的亲卫队长。半海鸟的鸟人
  诅咒: 茜溺泉。她把天道茜扔进一眼空泉，让那眼泉记住了茜的样子，从此能变身假扮她
  招式: 飞鸟千斩翼。振翅生出斩裂
  作用: 识破天道茜是乱马的弱点，奉命把她掳到咒泉乡
  出场: 卷三十七、卷三十八

柯尔玛:
  身份: 纪玛的部下。半乌鸦的少年鸟人
  诅咒: 男溺泉，能变成人形
  特点: 依赖纪玛指挥，怕冷水
  出场: 卷三十七、卷三十八

马飒拉:
  身份: 纪玛的部下。半乌鸦鸟人
  诅咒: 男溺泉
  出场: 卷三十七、卷三十八