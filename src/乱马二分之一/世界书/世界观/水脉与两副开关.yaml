咒泉洞:
  所在: 咒泉乡的水源地
  年份: 四千年
  入口: 外观有很多洞口。除真正的入口以外全是陷阱
  内部: 布满陷阱与迷宫，没有地图进不去
  地图: 在咒泉乡导游手里。地图浸热水之后会显出另一张

心脏地带:
  两个巨大喷水口:
    龙形口: 流出咒泉，就是诅咒之水。栓子叫月涡蛇
    凤凰形口: 流出热水，是凤凰山王族的成长之源。栓子叫金蛇环
  关键: 龙尾与凤尾的水管接的是同一条地下水脉

水脉只有一条:
  开咒泉: 热水断。所有被诅咒者可以正常复原，但凤凰山一族停止成长
  开热水: 咒泉断。所有被诅咒者的诅咒冻住，凤凰山一族得到成长之源
  断流: 两边都停，最糟的一种

金蛇环: 它本身就是凤凰族最强的兵器，环部脱手可以飞出斩岩
谁掌握栓子: 谁就同时决定了所有被诅咒者能不能复原，与凤凰山一族能不能长大
