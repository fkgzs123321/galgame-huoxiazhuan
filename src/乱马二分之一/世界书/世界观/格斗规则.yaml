本作的格斗: 不是血条对拼，是一场有规则的比赛。规则本身就是障碍

七种行动:
  集气: 不耗气，攒势
  防御: 不耗气，这一回合扛得住
  轻攻击: 耗气少，伤害最低
  重攻击: 耗气中，伤害更高
  绝招: 耗气最多，伤害最高而且无视防御
  嘴炮: 不耗气，能打断对方的绝招，还能把对方气焰压下去
  道具: 不耗气，按手里的东西结算
气有上限: 所以绝招不是想放就放

克制:
  防御: 克轻攻击与重攻击，伤害大减
  重攻击: 克轻攻击，把对方那一下打没
  绝招: 克轻攻击、重攻击与防御，无视防御
  嘴炮: 克绝招，把绝招打断

场地:
  雨天: 每一回合都可能被淋到
  澡堂、河边、厨房: 有人把水泼起来就会出事
  冰面: 没冰上经验的人打不准
  人多: 这时候变身必然社死

对手的四种风格:
  风: 快攻，抢出手
  火: 爆发，伤害高
  林: 蓄力，先攒后发
  山: 防守，扛得住

胜负之后:
  没人真死真残
  后果是被打飞到哪去了、欠了谁一个人情、被谁看光了
  打完照常一起吃饭
