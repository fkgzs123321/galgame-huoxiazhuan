位置: 中国青海省巴颜喀拉山脉拳精山中
泉数: 百余眼
泉边: 插着修行用的长竹竿。每眼泉旁有木牌，写明这眼泉的由来
成因: 每一眼泉记住第一个在其中溺死的东西。此后掉进去的人变成它的样子
触发: 遇冷水变成那样，浇热水复原。雨水同样算

已知泉种:
  娘溺泉: 一千五百年前有个年轻女子溺死。变年轻女子
  熊猫溺泉: 两千年前有只熊猫溺死。变熊猫
  黑豚溺泉: 一千二百年前有只小黑猪溺死。变小黑猪
  猫溺泉: 一千八百年前有只猫溺死。变猫
  鸭子溺泉: 一千三百年前有只鸭子溺死。变鸭子
  牛鹤鳗毛人溺泉: 两千五百年前有鳗鱼、鹤和骑着牛的雪人同时溺死。变牛头、雪人躯干、鹤翼、鳗尾的四不像
  章鱼溺泉: 长出一身章鱼触手
  双胞胎溺泉: 只让头上的肿包变成两个
  童子溺泉: 变小孩
  阿修罗溺泉: 四千年前有阿修罗溺死。变三头六臂
  男溺泉: 变年轻男子。所有人找的就是这一眼
  青蛙溺泉: 变青蛙
  和尚溺泉: 变瘦弱温厚的和尚，连战意都没了
  茜溺泉: 故事末期才成形。一眼空泉记住了天道茜的样子
  善男溺泉: 至今无人中招

叠加: 可以。先掉牛鹤鳗毛人溺泉、再掉章鱼溺泉，两种诅咒合成一体
抵消: 男溺泉是模板泉，理论上能抵掉身上原有的诅咒。全作没有任何人成功过
新泉: 不许临时编一眼新的泉。已有的泉也不许改效果

泉种与人的关系:
  泉不会改变人的性格与判断力，只改变别人怎么看他
  同一眼泉的不同人，变出来的样子也不完全一样
