竞技项目:
  格斗茶道: 用茶釜、柄杓、茶杓打。边点茶边攻防。大文字流与都大路流两家
  格斗新体操: 彩带、棍棒、呼啦圈都是武器。九能小太刀、今条真理子、鹭宫飞鸟
  格斗花式滑冰: 冰上的双人项目。三千院帝与白鸟梓是黄金搭档
  格斗啦啦队: 拿助威动作打人，绒球与指挥棒是械。青春学园今条真理子
  格斗晚宴: 法式。规矩是不许让对方看见你咀嚼的样子
  格斗送饭: 送餐竞速，可以砸对方的食盒。猫饭店对大黑流
  餐桌格斗: 吃饭的时候卡位
  格斗游泳: 水里比。二宫雏子会背泳施展八宝找零奉还
  格斗书法: 笔墨与镇纸当武器
  格斗将棋: 棋子变成人形叠上去压对手
  强力羽毛板球
  地狱篮球赛
  借债王对借债女王: 比谁先花到自己的钱

流派:
  无差别格斗早乙女流: 早乙女玄马开创，早乙女乱马继承
  无差别格斗天道流: 天道早云，天道茜
  元祖无差别格斗流: 八宝斋。前两流都出自这一门
  中国女杰族拳法: 可伦、珊璞、沐丝、铃铃、兰兰
  象形拳: 麝香王朝。哈浦、来睦、敏杜
  暗器术: 沐丝。鹰爪拳、白鸟拳、鸡卵拳、鸵鸟脚
  剑道: 九能带刀
  大阪烧格斗: 久远寺右京。铁板与铁铲
  爆破点穴: 响良牙
  狮子咆哮弹: 响良牙。越不幸越强
  飞龙升天破: 早乙女乱马。可伦传授
  魔犬恸哭破: 早乙女流秘技。蓄气之后大骂对方
  猛虎落地势: 正座撑地一味道歉。打不了架
  火中天津甘栗拳: 超高速连拳
  猫拳: 怕猫怕到极点会自我猫化，这时无敌
  海千拳与山千拳: 早乙女流的两种邪拳。公纹龙用山千拳
  龙精飞翔: 哈浦。升空往地面放气炮
  飞刀龙斩破: 哈浦。三日月形气刃
  飞鸟千斩翼: 纪玛。振翅生出斩裂
  天下瞬灭皇球弹: 萨夫郎。化身为超大火炎弹
  黑玫瑰旋风与黑玫瑰吹雪: 九能小太刀
  八宝五圆杀与八宝找零奉还: 二宫雏子。用硬币吸走斗气
  雷神猛笔拳与蝴蝶乱舞: 乐京斋。要配七色墨锦乃蝶才完整
  裤袜流星脚: 裤袜太郎
  火龙大轮舞与雷蛇天诛杀: 蕗珠
  火车王流: 火车王金之介。核心是不花自己的钱
  猿隐流卡拉克利豪斯术: 猿隐佐助
