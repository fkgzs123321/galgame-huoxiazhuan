冷热双水:
  冷水: 变成诅咒形态
  热水: 复原
  判定: 以实际接触为准。少量水只影响被浇到的部位
  瓶装泉水: 不失效，能带着走

湿度:
  范围: 零到一百
  六十: 沾到冷水立即变身
  自然蒸发: 每时段减二十
  淋雨: 加四十
  落水: 直接拉满
  变身之后: 归零

体态差异:
  男相: 力量类动作顺手。混进女校、女浴场这类场合做不到
  女相: 身法与混入顺手，力量类动作打折。九能带刀会疯狂贴上来
  不变的部分: 人格、判断力、说话方式、怕猫

止水桶与开水壶:
  止水桶: 麝香王朝的秘宝。用它打的水叫定貌之水，泼中即永久锁定当前形态，热水无效
  开水壶: 另一件秘宝。煮沸后浇身可解除锁定。原在日本宝来山
  雷达: 止水桶同时是找开水壶的雷达，只在一公里之内有反应

例外:
  镜女乱马: 魔镜投影出来的，对冷热水都没有反应，是独立人格
  猫拳: 与水温无关。怕猫到极点会自我猫化，这时能让他恢复的只有天道茜

诅咒从没被解除过: 全作三十八卷无人成功。可以给希望，不许兑现
