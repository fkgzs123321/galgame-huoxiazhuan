# 09 · 核心机制与设定（做卡时直接引用这一份）
# 这里只写「可被卡实现的规则」，不写剧情

settings:

  # ── 一、变身机制 ──
  - name: 冷热双水
    rule: 接触冷水 → 变成诅咒形态；浇热水 → 复原
    detail: 以「接触水」为准，不看水量；少量水只影响被浇到的部位
    exploit: 装瓶携带的泉水不失效 → 水可以当成道具带着走
    card_use: 天气（雨／雪）、场景（澡堂／厨房／水桶）、战斗（被打进水坑）三处触发

  - name: 诅咒叠加
    rule: 异种泉叠加融合
    evidence: 裤袜太郎先入牛鹤鳗毛人溺泉、后入章鱼溺泉，两种诅咒合成一体
    card_use: 允许玩家往上堆诅咒，这是「泉种」变量的扩展基础

  - name: 模板泉抵消
    rule: 男溺泉被视为「模板泉」，可作为解药抵消原诅咒
    caveat: 作者访谈承认男溺泉是真解药，但为保留女乱马而未在作品中治愈
    original_rule: 原作全 38 卷**从未有任何角色成功解除诅咒** —— 这是铁律
    card_use: 可以放出希望（即席男溺泉、桃幻乡的树液），但不许兑现

  - name: 即席男溺泉
    rule: 把男溺泉浓缩成粉末，撒入任意水体使其一次性具备男溺泉效力
    limit: 效力只一次，过后恢复原诅咒
    card_use: 合法的「限时解咒」道具，正好符合原作「给希望不给结果」

  - name: 止水桶固定
    rule: 被止水桶的水泼中后，形态被永久锁定，热水无效
    counter: 只有开水壶（煮沸后浇身）能解除
    radar: 止水桶是寻找开水壶的雷达，但仅在 1 公里范围内有反应
    card_use: 形态系统的「硬锁」状态 + 麦高芬线索链

  - name: 猫拳（非溺泉机制）
    rule: 恐猫到极点即自我猫化，与水温无关
    effect: 战中心智同猫、战力无敌
    counter: 能让他恢复正常的只有天道茜
    card_use: 乱马专属的「失控形态」；也解释了他的致命弱点

  - name: 镜女乱马（例外）
    rule: 魔镜投影出的女相乱马，对冷热水均无变身反应，是独立人格

  # ── 二、咒泉洞 ──
  - name: 咒泉洞
    rule: 咒泉乡水源地，四千年历史
    entrance: 外观多洞口，除真入口外全为陷阱
    interior: 陷阱与迷宫，无地图无法进入
    map: 咒泉乡地图在导游手里；浸热水后会显出另一张图
    card_use: 后期主线的「副本」关卡

  - name: 两个喷水口与两副栓子
    rule: 心脏地带有龙形与凤凰形两个巨大喷水口
    dragon: 龙形口出「咒泉」（诅咒之水），开关栓子＝月涡蛇
    phoenix: 凤凰形口出「热水」（凤凰山王族成长之源），开关栓子＝金蛇环
    key: 龙尾与凤尾的水管同接唯一的地下水脉 —— 水脉只有一条，热水一出，咒泉即断流
    consequence: 谁扭栓子，谁就同时决定了「所有被诅咒者能不能复原」与「凤凰山一族能不能长大」
    card_use: 世界级状态机（世界.水脉 = 咒泉 / 热水 / 断流）；全卡最终的两难

  # ── 三、女杰族 ──
  - name: 女杰族法则
    source: 《女杰族经》
    rule: 女战士被外人打败时 —— 对方是女的，给死亡之吻杀了她；对方是男的，以身相许
    consequence: 珊璞被女乱马打败故追杀；被男乱马打败后转为追求
    media: 《女杰族月报》（内部报刊，天然的信息泄漏与喜剧装置）
    card_use: 「被谁打败就归谁」的婚约生成器；剧情冲突的合法来源

  - name: 女杰族村落
    nature: 母系社会，村里女孩非常强
    card_use: 中国侧的据点与舞台

  # ── 四、麝香王朝 ──
  - name: 麝香王朝习俗
    origin: 一千四百年前形成的纯男性武斗集团
    practice: 捕获野兽投入女溺泉变成女人后婚配，后代继承兽之能力
    modern: 今已改为与附近乡村女子相亲成婚
    taboo: 男孩一断奶即被带离母亲身边，不知女性为何物
    blood: 王者一族为继承龙血者
    card_use: 「从未见过女人」这个设定天然生产喜剧（哈浦一伙的每一次登场）

  # ── 五、凤凰山 ──
  - name: 凤凰族成长机制
    rule: 王族必须到咒泉乡温泉沐浴，才能完成形态变化成为真正的王
    local: 凤凰山山顶自有咒泉乡，但因水势险峻，溺死者皆为鸟类；山麓居民有鸟翼鸟爪
    crisis: 本地溺泉干涸 → 萨夫郎长期保持幼童形态，无武力也无特殊能力
    king_power: 真正的凤凰山之王能自体内涌出光与热并自由调节，为居民供光供暖
    saffron_flaw: 调节力未完成的萨夫郎等于「拆掉保险栓的火焰喷射器」；与乱马一战耗尽热力后退化为婴儿
    resolution: 两人激战使地下水脉变动，原本干涸的山顶溺泉重新涌出
    card_use: 「资源争夺」的正剧主线；与咒泉洞水脉天然咬合

  # ── 六、其他可玩设定 ──
  - name: 贫力虚脱灸
    rule: 中灸者战力尽失如婴儿；解法记录在「破灸法人体图」上
    card_use: 「临时削弱主角」的合法手段

  - name: 岁月菇
    rule: 食用或入水后年龄按数目增减
    card_use: 年龄变化的单元玩法

  - name: 印刻卵
    rule: 破壳后吐丝裹人成巨蛋；出壳时第一眼所见者即为主人
    card_use: 「临时认主」单元

  - name: 反转宝珠
    rule: 正面时爱增，反转则爱转憎；本来无爱者无效
    card_use: 关系系统的翻转道具（注意：本来无爱者无效 —— 这才是它好笑的原因）

# ══════════════════════════════════════════════════════════════
# 做卡时必须遵守的原作铁律
# ══════════════════════════════════════════════════════════════

iron_rules:
  - 全 38 卷里，**没有任何角色成功解除诅咒** —— 可以给希望，不许兑现
  - 打归打，**没人真死、没人真残**；输了的后果是「被打飞到哪去了」「欠了谁一个人情」
  - 作品的真形态是**日常单元剧的无限循环**，主线只占最后两卷
  - 变成女相不会改变乱马的人格与战力判断，只改变**别人怎么对他**
  - 九能带刀**始终不知道**「辫子姑娘」与乱马是同一人 —— 这条不许破
