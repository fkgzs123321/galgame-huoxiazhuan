# 04 · 咒泉乡 溺泉与诅咒
# 定位：这是全卡最核心的设定层

# ══════════════════════════════════════════════════════════════
# 一、地点与来源
# ══════════════════════════════════════════════════════════════

location:
  country: 中国
  province: 青海省
  mountain_range: 巴颜喀拉山脉
  mountain: 拳精山（咒泉乡位于其南麓）
  spring_count: 百余眼（原作有「上百处」与「百余眼」两种表述）
  maintained_by: 咒泉乡导游（常驻，熟知各泉来历）
  markers: 泉中立有修行用长竹竿；各泉附木牌，记载该泉的悲惨传说（某某年前有某某溺死）
  note: 九寨沟的部分泉眼被认为是原型 ☆

# ══════════════════════════════════════════════════════════════
# 二、泉种总表
# ══════════════════════════════════════════════════════════════
# formed = 泉形成年代 ｜ form = 变身形态 ｜ victims = 已知受诅咒者

springs:
  - { name: 娘溺泉, alias: 女溺泉, jp: ニャンニーチュアン, formed: 1500年前, form: 年轻女子, victims: [早乙女乱马, 哈浦, 一只猴子（变猴娘）] }
  - { name: 熊猫溺泉, jp: ションマオニーチュアン, formed: 2000年前, form: 大熊猫, victims: [早乙女玄马] }
  - { name: 黑豚溺泉, jp: ヘイトウェンニーチュアン, formed: 1200-1250年前, form: 小黑猪, victims: [响良牙] }
  - { name: 猫溺泉, jp: マオニーチュアン, formed: 1800年前, form: 猫, victims: [珊璞, 南条亚里沙] }
  - { name: 鸭子溺泉, jp: ヤーズニーチュアン, formed: 1300年前, form: 鸭, victims: [沐丝] }
  - { name: 牛鹤鳗毛人溺泉, jp: ニウホーマオレンニーチュアン, formed: 2500年前, form: 牛头 + 雪人躯干 + 鹤翼 + 鳗尾, victims: [裤袜太郎], note: 原作最惨的泉；传说 2500 年前有鳗鱼、鹤和骑着牛的雪人同时溺死 }
  - { name: 章鱼溺泉, formed: 未详, form: 追加章鱼触手, victims: [裤袜太郎], note: 「叠泉」的原作依据 }
  - { name: 双胞胎溺泉, jp: シュアンションツーニーチュアン, formed: 未详, form: 仅头上肿包变两个, victims: [八宝斋], note: 八宝斋原本拿错的是善男溺泉 }
  - { name: 善男溺泉, jp: シャンナンニーチュアン, formed: 1000年前, form: 未详, victims: [], note: 原作中无人中招 }
  - { name: 童子溺泉, jp: トンツーニーチュアン, formed: 未详, form: 小孩, victims: [乐京斋（变乐太郎）] }
  - { name: 阿修罗溺泉, jp: アシウルオニーチュアン, formed: 4000年前, form: 三头六臂阿修罗, victims: [蕗珠] }
  - { name: 男溺泉, jp: ナンニーチュアン, formed: 未详, form: 年轻男子, victims: [柯尔玛, 马飒拉], note: 众人寻找的「解咒之泉」；作者访谈称是真解药 ? }
  - { name: 池蛙溺泉, jp: チュウワニーチュアン, formed: 1991年前, form: 青蛙, victims: [蛙仙人], note: 日文原名未确认 ? }
  - { name: 和尚溺泉, jp: フーシャンニーチュアン, formed: 999年前, form: 瘦弱温厚、丧失战意, victims: [金尼] }
  - { name: 茜溺泉, jp: アカネニーチュアン, formed: 故事末期（空泉被「染」）, form: 天道茜的外貌, victims: [纪玛], note: 纪玛把天道茜扔进一眼空泉使其记住了茜的形貌，用来假扮她 }
  - { name: 翼龙溺泉, formed: 史前 ?, form: 粉末状, victims: [一只鸟], note: 以粉末形式流通 }
  - { name: 剑齿虎溺泉, formed: 史前 ?, form: 粉末状, victims: [一只猫], note: 同上 }

# 凤凰山自有的一处咒泉乡（山顶）
phoenix_spring:
  location: 凤凰山山顶
  character: 因地势险峻，溺死其中的皆为鸟类
  effect: 山麓居民世代饮其水，生有鸟翼鸟爪
  status: 已干涸（起因：王族倾轧）
  revival: 终章乱马与萨夫郎激战使地下水脉变动，原本干涸的山顶溺泉重新涌出

# ══════════════════════════════════════════════════════════════
# 三、咒泉洞（水源地）
# ══════════════════════════════════════════════════════════════

jusenkyo_cave:
  history: 四千年
  entrance: 外观有多个洞口，除真入口外全为陷阱
  interior: 布满陷阱与迷宫，用来防入侵者
  requirement: 没有标示水源地的地图根本进不去（地图在咒泉乡导游手里）
  map_detail: 咒泉乡地图浸热水后会显出另一张图 ★
  map_fate: 可伦曾把地图撕成五片分别保管，仍被纪玛取回 ☆
  heart:
    desc: 心脏地带并列两个巨大喷水口
    outlets:
      - name: 龙形喷水口
        output: 咒泉（诅咒之水）
        valve: 月涡蛇
      - name: 凤凰形喷水口
        output: 热水（凤凰山王族成长之源，非诅咒）
        valve: 金蛇环
    key_rule_mark: 龙尾与凤尾的水管同接唯一的地下水脉 —— 水脉只有一条，所以热水一出，咒泉即断流
    weapon_note: 金蛇环同时是凤凰族最强古兵器，环部可脱手飞出斩岩

# ══════════════════════════════════════════════════════════════
# 四、变身机制
# ══════════════════════════════════════════════════════════════

transformation:
  trigger: 接触冷水 → 变成诅咒形态；浇热水 → 复原
  judgement: 以「接触水」为准；少量水只影响被浇到的部位（八宝斋只用一滴双胞胎溺泉水，只让头上瘤子变成两份）
  bottled: 装瓶携带的泉水不失效
  stacking:
    can_stack: 是 —— 裤袜太郎先入牛鹤鳗毛人溺泉、后入章鱼溺泉，两种诅咒合成一体
    template_override: 男溺泉被视为「模板泉」，可作为解药抵消原诅咒 ?（作者访谈承认，原作未实际治愈）
    summary: 异种泉叠加融合；同种模板泉可抵消
  special_case:
    - name: 猫拳
      desc: 另一套机制，与水温无关 —— 恐猫到极限即自我猫化，战中心智同猫、战力无敌；能让他恢复正常的只有天道茜
    - name: 止水桶固定
      desc: 被止水桶的水泼中后，形态被永久锁定，热水无效，只有开水壶能解
    - name: 镜女乱马
      desc: 魔镜投影出的女相乱马，对冷热水均无变身反应（非溺泉产物）

# ══════════════════════════════════════════════════════════════
# 五、秘宝：止水桶 与 开水壶
# ══════════════════════════════════════════════════════════════

treasures:
  - name: 止水桶
    alias: 定水桶
    owner: 麝香王朝
    effect: 以此桶打的水成为「定貌之水」；浇在已入溺泉者身上，永久锁定当前形态，热水无效
    extra: 同时是寻找开水壶的雷达 —— 但仅在开水壶一公里范围内才有反应
    used_on: 哈浦（被猴女泼中，固定为女体）
    naming_note: 中文资料有「止水桶」与「定水桶」两种写法，本归档统一用「止水桶」
  - name: 开水壶
    owner: 麝香王朝（另一件秘宝）
    effect: 用它煮沸的水浇身，即时解除止水桶效果
    location: 中国改朝换代时多次转手，现流落日本宝来山（又称蓬莱山）
    plot: 哈浦为解固定赴日寻找；与乱马决战导致宝来山山体崩塌
