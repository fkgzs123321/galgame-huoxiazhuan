# 02 · 派生作品（TV 动画 / 剧场版 / OVA / 真人 / 游戏）
# 口径：人名地名一律日文汉字转简体，不用台版盗版华人姓氏
# 可信度：★ 多源交叉一致 ｜ ☆ 单一来源 ｜ ? 存疑

tv_1989:
  studio: Studio DEEN
  network: 富士电视台
  segments:
    - name: 乱马½（无印）
      air: 1989/4/15 - 1989/9/16（周六 19:30）
      episodes: 18
    - name: 乱马½ 热斗篇
      air: 1989/10/20 - 1992/9/25（周五 17:30）
      episodes: 143
  total_episodes: 161
  coverage: 约原作第 1 卷 - 第 22 卷开头（第 217 话前后）
  not_adapted: [麝香王朝篇, 公纹道场篇, 凤凰山终章]
  differences:
    - 全校直到很后期都不知道乱马会变身（原作里同学很早就知道）
    - 五寸钉光出场极晚，前期戏份由动画原创的九能家忍者猿隐佐助顶替
    - 大量动画原创回与原创角色（铃铃·兰兰、大黑香织、杨贵妃、武藏小金、雷门手鞠等）
    - 篇章顺序重排
    - 无结局，诅咒全未解决
  note: 日本无官方分季，只有上述两段。美版 Viz 切成 7 季并重排顺序，不可作考据依据。 ☆

tv_2024:
  studio: MAPPA
  network: 日本电视台 + Netflix
  seasons:
    - season: 第1季
      air: 2024/10/6 - 2024/12/22
      episodes: 12（第1-12话）
    - season: 第2季
      air: 2025/10/5 - 2025/12/21
      episodes: 12（第13-24话）
    - season: 第3季
      air: 2026/10/3 起
      episodes: 未公布（第25话起；官方先行上映会已标明第25、26话）
      new_cast: [大文字煎太郎（福山润）, 红翼（田中美海）]
      note: 截至 2026-09-22 尚未播出，内容未详
  episode_mapping:
    status: 无官方逐话对照表
    confirmed_anchors:
      - 九能小太刀登场 = 第2卷 PART9，对应新版第6话 ☆
      - 珊璞登场 = 第4卷 PART4，对应新版第10话 ☆
    estimate: 第1季≈第1-5卷，第2季≈第5/6-11卷前后，第3季未详（推算，非考据）
  differences_from_1989:
    - 整体更忠实原作（天道靡睡衣改回原作背心短裤；九能与天道靡课堂对话改回原作版）
    - 裸露做令和合规处理：保留入浴戏但不画乳头、不画腰臀（黄金档限制）
    - 删改部分中国共产主义象征 ★
    - 战斗作画大幅强化
    - 加入漫画式拟声手写字幕
    - 主要角色沿用 1989 版声优

movies:
  - no: 1
    title: 中国寝昆仑大决战！规则无视的激斗篇!!
    date: 1991/11/02
    runtime: 74分
    director: 井内秀治
    studio: Studio DEEN
    plot: |
      八宝斋偷内衣引发全镇追捕。麒麟王子持「幸运卷轴」选拔新娘，
      小茜被掳往中国寝昆仑，乱马一行远征营救。
    original_characters: [麒麟, 荔枝, 七福神武道家（毗沙门天、大黑星、大白星、惠比天、门龙等）]
  - no: 2
    title: 决战桃幻乡！夺回新娘子!!
    date: 1992/08/01
    runtime: 60分
    plot: |
      九能游船遇难漂到南海无人岛，女生接连失踪、现场都留下桃子。
      犯人是浮空岛桃幻乡的托马王子，抓人办新娘选拔赛。
      桃幻乡的桃树树液能让触水者变成男人 —— 对乱马是个大钩子。
    original_characters: [托马王子, 半兽人部下 Sarutoru / Torristan / Wonton]
  - no: 3
    title: 超无差别决战！乱马队VS传说的凤凰
    date: 1994/08/20
    runtime: 31分
    note: 三片联映；因片长偏短，美版 Viz 归入 OVA 发行
    plot: |
      并非原创剧情，改编自单行本第 29 卷 PART1-2「凤凰剑」篇：
      九能在邪马台古董店买下凤凰蛋，蛋在他头顶孵化，东京大乱。
      唯一一部没有发生绑架、没离开风林馆的剧场版。

