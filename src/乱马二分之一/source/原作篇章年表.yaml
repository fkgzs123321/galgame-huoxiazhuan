      parts: [狮子咆哮弹威力强大, 失败的前奏, 召唤不幸的功夫, 情绪必杀功, 狮子对猛虎的决斗, 狮子重力胜利, 除夕夜的咒语, 第一百零八次的求婚, 老人与梅, 九能兄妹私斗, 丑闻风波]
      events:
        - ★ 良牙修得失传功夫「**狮子咆哮弹**」（把不幸转化为力量）
        - 乱马修得「**魔犬恸哭破**」
        - 「除夕夜」「第一百零八次的求婚」单元
      new_characters: []

    - vol: 21
      title: 幸福樱花印
      parts: [恩断义绝的大比拼, 幸福樱花印, 包含爱的啦啦队格斗]
      events:
        - 玄马与乱马「恩断义绝大比拼」，扬言断绝父子关系
        - ★ 「**幸福樱花印**」单元：脸上出现樱花印的人注定与天道茜结合 → 乱马以婚约为赌注与良牙大对决
      new_characters: []

    - vol: 22
      title: 乱马 Meet Mother
      parts: [爱还是获胜了!, 乱马meet mother, 男人的誓言, 决死大团圆, 只要看一眼, 母子一家人, 突然极厌恶, 说"爱你", 爱的逆流, 表白的行踪, 怪异！留下的内裤!]
      events:
        - ★ **早乙女佳香登场**：乱马之母，与丈夫约定「把乱马训练成男人中的男人」
        - 玄马当年立下的切腹誓约浮出：若乱马不是男子汉，父子一起切腹
        - 母子相认与身份隐瞒的攻防；乱马不能以女相被母亲看见
      new_characters: [早乙女佳香]

# ══════════════════════════════════════════════════════════════
