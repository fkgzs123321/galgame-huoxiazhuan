phase_3_lategame:
  name: 后期 · 长篇
  range: 卷 23-38
  theme: 长篇密度上升；止水桶/开水壶主线 → 咒泉洞水脉最终决战
  volumes:

    - vol: 23
      title: 裤袜太郎的逆袭
      parts: [裤袜太郎的逆袭, 黑色的秘密武器, 热水防线, 决战！封住章鱼触手, 脚印之缘, 灰姑娘报恩, 暴力料理教室, 悲哀·恋情的发生, 悲惨·恋情的成长, 悲痛·恋情的失控, 战斗之铠]
      events:
        - 裤袜太郎带着**章鱼溺泉**第二次来袭（叠泉）
        - 「热水防线」：全员被迫围绕热水资源作战
      new_characters: []

    - vol: 24
      title: 宝来山 · 止水桶与开水壶
      parts: [猫饭店的客人, 野生的王国, 失去的秘宝, 露天浴池女人的战争, 宝来山追踪, 决死宝来山, 止水桶的悲剧, 出现秘宝的瀑布, 遥远的开水壶, 哈浦愤怒的告白, 乱马，站起来！]
      events:
        - ★★ **哈浦（哈布）主线**：麝香王朝王位继承人，身负龙血
        - 哈浦因落入娘溺泉＋被猴女用**止水桶**泼中，女相被永久固定，热水无效
        - 止水桶同时是**寻找开水壶的雷达**（一公里内才有反应）
        - 开水壶在**宝来山**；一行人为争夺开水壶在宝来山展开决死战
        - 哈浦的必杀技「**龙精飞翔**」登场
      new_characters: [哈浦, 来睦, 敏杜]

    - vol: 25
      title: 史上最强的女人
      parts: [乱马，变回男生！, 乱马归来, 必杀新任教师！, 神秘的八宝五元杀, 史上最强的女人, 快按下穴位！, 地狱篮球赛, 八宝零钱反击, 终极健康法, 茜踏上旅途, 复生的记忆]
      events:
        - ★ **二宫雏子登场**：风林馆新任教师，能吸干对手斗气；喝鱼缸的水维持成人形态
        - 「地狱篮球赛」单元
      new_characters: [二宫雏子]

