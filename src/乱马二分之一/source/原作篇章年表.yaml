# 乱马½ 原作篇章年表（source）
# 依据：漫画单行本全 38 卷 PART 目录（小学馆／大然·文化传信中文版）、
#      剧场版 3 部、OVA 15 部、TV 动画（1989 版 / 热斗篇 / 2024 新版）
# 口径：人物名一律用日文汉字转简体（早乙女乱马／天道茜／九能带刀／久远寺右京），
#      不用台版盗版华人姓氏（姬乱马／钱小茜／游带刀／烙饼店）。

meta:
  title: 乱马½（らんま1/2）
  author: 高桥留美子
  serial: 周刊少年Sunday 1987年36号 - 1996年12号，全407话，单行本38卷
  structure_note: |
    ★ 原作的真实形态是「**日常单元剧的无限循环** + 偶尔插入长篇」。
    绝大多数章节是独立的「格斗XX」单元：新流派/新道具登场 → 因琐事起争端 →
    误会升级 → 一场格斗比赛解决 → 回归日常。主线（咒泉洞/水脉）只占最后两卷。
    做卡必须照这个形态来，不能按"一条主线跑到底"设计。

# ══════════════════════════════════════════════════════════════
# 第一段：开局期（卷 1-6，1988-1989）——「乱马来了」
# ══════════════════════════════════════════════════════════════

phase_1_opening:
  name: 开局期
  range: 卷 1-6
  theme: 主角抵达、身份与诅咒揭晓、四位婚约候选人陆续到齐
  volumes:

    - vol: 1
      title: 乱马来了
      parts: [乱马来了, 乱马的秘密, 最讨厌男生, 断然拒绝, 送给树上的水壶少女, 身心皆如是, 很快就明白了, 因为有喜欢的女孩子了]
      events:
        - 早乙女父子结束中国修行回到日本，以女相乱马＋熊猫玄马的形态抵达天道道场
        - 「咒泉乡」与「娘溺泉」第一次被解释；热水复原在浴室当场演示，被天道茜撞破
        - 天道早云与早乙女玄马搬出旧约，三姐妹中选出天道茜与乱马订婚
        - 天道茜对乱马第一印象极差（「最讨厌男生」），婚约在争吵中开局
      new_characters: [早乙女乱马, 早乙女玄马, 天道早云, 天道霞, 天道靡, 天道茜]

    - vol: 2
      title: 追杀乱马的男子
      parts: [笑起来很可爱喔, 追杀乱马的男子, 对决, 续·对决, 没有受伤, 好可爱啊, 良牙变身, 恨是理所当然的]
      events:
        - 响良牙登场，以「转校前的旧仇」追到天道道场
        - 良牙在乱斗中落水，暴露黑豚溺泉——变成小黑猪
        - 小猪被天道茜捡回收养，取名「小P」；良牙因此对小茜产生爱慕
        - 良牙的致命缺陷登场：**超级路痴**
      new_characters: [响良牙]

    - vol: 3
      title: 黑玫瑰的恋情
      parts: [黑玫瑰的恋情, 请关照我妹妹, 要打败你, 格斗艺术体操, 放弃吧, 可爱的雪鲁德, 在溜冰场接吻, 迷惑的唇, 夺吻战]
      events:
        - 九能小太刀登场，「黑玫瑰小太刀」，格斗新体操名手，用毒
        - 小太刀对男相乱马一见钟情，自称未婚妻
        - '**三千院帝与白鸟梓**登场：格斗双人滑冰「黄金搭档」，三千院帝以吻遍所有漂亮女孩为目标'
        - 白鸟梓登场：痴迷可爱之物并强行取名带走
      new_characters: [九能小太刀, 三千院帝, 白鸟梓]

    - vol: 4
      title: 死亡之吻
      parts: [不要放开这只手, 背水一战, 良牙曝光, 爱的水柱, 死亡之吻, 我爱你, 天道茜VS珊璞, 必杀珊璞, 混合香波119, 别了]
      events:
        - ★ **珊璞登场**：中国女杰族少女，为追杀女相乱马而来到日本
        - 女杰族法则揭晓：败给女人的给死亡之吻（杀），败给男人的要以身相许
        - 珊璞败给男相乱马后转而求婚，自称「乱马之妻」
        - 天道茜VS珊璞正式对决
      new_characters: [珊璞]

    - vol: 5
      title: 猫拳之灾
      parts: [寻找弱点, 找到弱点, 招待一游·猫的地狱, 猫拳之灾, 谁都好吗?, 珊璞再来之日, 沐丝来袭, 战斗表演会, 打败猫舌, 神秘药方——不死鸟丸, 夜市之战]
      events:
        - 乱马的致命弱点被找到：**极度怕猫**（八宝斋的修行把人扔进猫群）
        - 珊璞的猫溺泉暴露；用猫拳对付乱马
        - 沐丝来日本找珊璞，乱马变鸭计划
      new_characters: [沐丝]

    - vol: 6
      title: 格斗茶道
      parts: [切西瓜之战, 招赘的水上华尔兹, 猫拳突击战, 和我一组吗, 修行晚餐, 爆碎点穴, 不死之男, 爆碎胜负, 格斗茶道, 茶月小姐, 提亲成功]
      events:
        - 良牙的必杀技登场：**爆碎点穴**
        - ★ 「**格斗茶道**」单元：格斗茶道大文字流，茶月小姐出场，大文字家提亲线
        - 「格斗XX」这个原作招牌模式第一次成形
      new_characters: [大文字煎太郎, 大文字家元, 茶月]

# ══════════════════════════════════════════════════════════════
# 第二段：中期（卷 7-22，1989-1993）——「全员集合期」
# ══════════════════════════════════════════════════════════════

phase_2_midgame:
  name: 中期 · 全员集合
  range: 卷 7-22
  theme: 八宝斋解封、右京与可伦入局、九能校长回归、佳香相认；单元剧密度最高的一段
  volumes:

    - vol: 7
      title: 邪恶复活
      parts: [格斗送饭比赛, 冲向终点, 请吃面条, 可以吃吗, 邪恶复活, 并非常人, 公共浴室大战, 月光炸弹, 八宝斋发怒了, 女嫌香的效果, 父亲生气了]
      events:
        - ★ **八宝斋解封归来**：当年被两个徒弟（玄马、早云）封印在深山
        - 「格斗送饭比赛」单元
        - 公共浴室大乱斗
      new_characters: [八宝斋]

    - vol: 8
      title: 即席男溺泉
      parts: [即席男溺泉, 九能带刀无用, 恐怖·看板男, 再见我一次, 皇室战争·罗密欧, 我是罗密欧, 茱丽叶的游戏, 胜利之战, 和风男溺泉, 女子更衣室的陷阱, 和风男溺泉的通知]
      events:
        - ★ **即席男溺泉**：人工仿造溺泉——证明「泉是可以造的」，为卡的造泉玩法提供原作依据
        - 九能带刀的「罗马战争」单元（自编自演罗密欧）
        - 「和风男溺泉」单元
      new_characters: []

    - vol: 9
      title: 右京的原形
      parts: [黑玫瑰的饼干, 永不投降, 带我一起去洗澡, 全部吃光, 烙饼店的右京, 喜好不同, 右京的原形, 良牙对抗右京, 完美的情书, 良牙的未婚妻, 向往的约会]
      events:
        - ★ **久远寺右京登场**：乱马童年时被玄马用大阪烧铁板换走的「未婚妻」
        - 右京为了当男人，十年间男装生活；登场后才恢复女装
        - 经营大阪烧店「右京轩」，用铁板与铁铲战斗
      new_characters: [久远寺右京]

    - vol: 10
      title: 俊郎与可伦
      parts: [俊郎与可伦, 一刹那的爱情, 会喜欢谁, 将被抢走的天道茜, 让乱马变鸭的计划, 茜要变成鸭子, 沐丝加油, 沐丝的幸福, 突击！红翼, 突击！午餐时间, 突击！正确的约会]
      events:
        - ★ **可伦登场**：珊璞的曾祖母，女杰族宗师，开「猫饭店」
        - 可伦开始正式介入，撮合乱马与珊璞
      new_characters: [可伦]

    - vol: 11
      title: 良牙回家
      parts: [良牙回家, 哥哥，欢迎你回家, 良子迷路了, 虚幻的奥义, 抢夺秘笈, 炸裂！八宝大华轮, 不能不抱紧, 今夜请抱紧我, 茜力量增强, 强力羽毛板球比赛, 副作用的悲剧]
      events:
        - 八宝斋的招式「**八宝大华轮**」登场
        - 「强力羽毛板球比赛」等运动格斗单元
      new_characters: []

    - vol: 12
      title: 校长回来了
      parts: [校长回来了, 冒险！校长室, 校长的儿子, 千钧一发之际, 情势逆转, 要你迟到, 幸福的抗水肥皂, 邱比特的陷阱, 不要跟来, 哪一个最重要?, 爱的手段]
      events:
        - ★ **九能校长**回归：头上长着椰子树的失踪校长，强制推行剃发校规
        - 乱马的辫子成为冲突核心；师生集体反抗
        - 「抗水肥皂」单元（能暂时抵抗变身的肥皂）
      new_characters: [九能校长]

    - vol: 13
      title: 飞龙升天破
      parts: [传说的邪灸, 最弱的男人, 乱马，一蹶不振？, 针灸乡风云, 特训！螺旋地狱, 没有斗志的男人, 炸裂！飞龙升天破, 雪耻大战, 善良的八宝斋？, 燃烧吧！八宝斋, 啊！无情的碎纸片]
      events:
        - ★ 八宝斋对乱马施「**贫力虚脱灸**」，乱马功力全失
        - 为破灸，乱马修得上乘武功「**飞龙升天破**」
        - 「针灸乡」单元：针灸与穴位成为可玩体系
      new_characters: []

    - vol: 14
      title: 猫魔铃
      parts: [最怕猫的乱马, 猫魔铃, 龙之鬚]
      events:
        - 珊璞把传说中的「**猫魔铃**」送给乱马，铃中走出巨大猫怪
        - 乱马怕猫的梗被推到极限
      new_characters: []

    - vol: 15
      title: 龙之鬚
      parts: [圣刀满愿刃, 渴望已久的约会, 第三个愿望, 赌王KING, 为明日而赌的赌徒, 赌术特训, 反败为胜的赌徒, 被狙击的辫子, 被解开的封印, 龙之鬚的秘密, 龙之鬚争夺战]
      events:
        - ★ 「**龙之鬚**」单元：乱马尾辫上那个发圈的真身，是被封印的宝物
        - 「圣刀满愿刃」单元（实现三个愿望的刀）
        - 「赌王KING」单元：赌博格斗
      new_characters: []

    - vol: 16
      title: 温泉二人三足赛跑
      parts: []
      events:
        - 「绝叫」温泉村举办脚击**二人三足温泉赛跑**，优胜者可免费去中国咒泉乡旅行
        - 三组参赛：乱马×珊璞、天道茜×沐丝、右京×良牙
        - 乱马为恢复男儿身全力争夺
      new_characters: []

    - vol: 17
      title: 姐姐的心情
      parts: [浴室特训, 肥鹅肝绝技?, 餐桌决战, 酒足饭饱之后, 不需要乱马!, 真心的告白, 姐姐的心情, 对不起，乱马, 不要说抱歉, 爱和复仇间的迷思, 放映诅咒画]
      events:
        - ★ **天道靡篇**：乱马与天道茜的婚约被解除，未婚妻变成天道靡，姐妹战争
        - 「餐桌决战」单元（吃饭格斗）
      new_characters: []

    - vol: 18
      title: 咒泉乡来的恶魔
      parts: [咒泉乡来的恶魔, 恶魔的原形, 天道茜在哪里, 天道茜救援部队, 水的磐石, 喷出的陷阱, 反击的开水, 必杀！裤袜流星脚, 你的名字是, 通过时光隧道的老头(上), 通过时光隧道的老头(下)]
      events:
        - ★ **裤袜太郎登场**，从咒泉乡杀到日本，抓走天道茜
        - 裤袜太郎的诅咒揭晓：**牛鹤鳗毛人溺泉**（牛头＋雪人躯干＋鹤翼＋鳗尾），后追加**章鱼溺泉** → **叠泉的原作依据**
        - 水与开水的攻防战；「裤袜流星脚」必杀技
      new_characters: [裤袜太郎]

    - vol: 19
      title: 假的夫妇
      parts: [水边的西瓜男, 水边的交际鬼, 在西瓜田中围捕, 十年的调味料, 爱情调味料, 真正的真的, 假的夫妇, 希望被讨厌, 温泉街的恶梦, 爱情纸娃娃, 秘方 主从丸]
      events:
