关键事件:
  说明: 仙剑奇侠传1·30个关键事件列表（6章×5事件），供章节触发器判定进度与奖励
  变量锚点:
    章节进度: stat_data.章节进度（1-30）
    章节事件完成表: stat_data.章节事件完成表（数组）

  第1章_余杭客栈:
    - event_id: EVT_001
      名称: 婶婶中毒
      章节: 1
      进度: 1
      触发条件: 当前章节==1 且 婶婶中毒标志==0
      完成条件: 获得仙灵岛仙药 或 婶婶存活标志==1
      奖励:
        物品: 无
        属性: 婶婶存活标志=1
        解锁: 渡海仙灵岛路线
      影响事件: [酒剑仙指点, 仙灵岛结缘]
      隐藏标记: 完成时间影响姥姥存活线

    - event_id: EVT_002
      名称: 酒剑仙指点渡海仙灵岛
      章节: 1
      进度: 2
      触发条件: EVT_001完成 且 酒剑仙好感度>=0
      完成条件: 习得蜀山剑法入门 且 获得渡海方法
      奖励:
        技能: 蜀山剑法·万剑诀
        物品: 无
        属性: 酒剑仙好感度+10
      影响事件: [仙灵岛结缘, 镇妖剑获取(隐藏)]

    - event_id: EVT_003
      名称: 渡海仙灵岛
      章节: 1
      进度: 3
      触发条件: EVT_002完成 且 拥有渡海工具
      完成条件: 抵达仙灵岛 且 遇见赵灵儿
      奖励:
        物品: 无
        属性: 灵儿好感度+20
        解锁: 仙灵岛场景
      影响事件: [仙灵岛结缘, 姥姥托孤]

    - event_id: EVT_004
      名称: 姥姥托孤
      章节: 1
      进度: 4
      触发条件: EVT_003完成 且 灵儿好感度>=20
      完成条件: 接受姥姥托孤 且 获得灵儿身世信息
      奖励:
        物品: 女娲玉（信物）
        属性: 灵儿好感度+30
        解锁: 女娲后人支线
      影响事件: [灵儿被掳, 姥姥存活(隐藏)]
      隐藏标记: 若提前击败苗兵小队长，姥姥可存活

    - event_id: EVT_005
      名称: 灵儿被掳
      章节: 1
      进度: 5
      触发条件: EVT_004完成
      完成条件: 离开仙灵岛 且 追踪至苏州
      奖励:
        物品: 无
        属性: 姥姥存活标志（隐藏线判定）
        解锁: 第2章
      影响事件: [抵达苏州, 比武招亲]

