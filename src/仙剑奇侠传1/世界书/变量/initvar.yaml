      起始铜钱: 500                    # 沙盒模式起始铜钱
      自定义五灵亲和: null             # 沙盒模式自定义主角五灵亲和

    # ─── 7.4 NSFW 模式设置 ───
    # 控制全卡 NSFW 内容的开关与呈现风格
    NSFW模式:
      NSFW开关: true                   # 是否启用 NSFW 内容
      NSFW详细程度: '中等'             # 简略/中等/详细/极致
      NSFW视角: '男性'                 # 男性/女性/全知
      NSFW节奏: '正常'                 # 快速/正常/缓慢/沉浸


  # ════════════════════════════════════════════════════════════
  # 八、战斗（战斗状态变量 · 大幅扩展）
  # 支持多敌人/行动顺序/战斗日志/掉落预期/经验铜钱结算
  # ════════════════════════════════════════════════════════════
  战斗:
    # ─── 8.1 战斗基础状态 ───
    战斗状态: '和平'                   # 和平/战斗中/胜利/失败/逃跑
    是否BOSS战: false                  # 是否 BOSS 战（影响战利品与剧情分支）
    回合数: 0                          # 当前战斗回合数

    # ─── 8.2 敌方系统（支持多敌人） ───
    敌方列表: []                       # 多个敌人的列表，每项：{名称, HP, MaxHP, 攻击, 防御, 速度, 属性, 弱点}
    敌方名称: null                     # 当前主敌方名称（null=无战斗，兼容旧字段）
    敌方HP: 0                          # 当前主敌方HP（兼容旧字段）
    敌方MaxHP: 0                       # 主敌方最大HP（兼容旧字段）
    当前目标: null                    # 当前攻击目标（敌方列表中的索引或名称）

    # ─── 8.3 行动顺序（按速度排序） ───
    我方行动顺序: []                   # 我方按速度排序的行动列表
    敌方行动顺序: []                   # 敌方按速度排序的行动列表
    当前行动者: null                   # 当前回合行动者

    # ─── 8.4 战斗日志与结算 ───
    战斗日志: []                       # 最近10条战斗记录
    掉落预期: []                       # 预期掉落物品列表
    战斗经验: 0                        # 本次战斗获得经验（结算时累加到主角）
    战斗铜钱: 0                        # 本次战斗获得铜钱
    战斗AP: 0                          # 本次战斗获得灵珠AP（分配给已镶嵌灵珠）

    # ─── 8.5 五灵克制倍率表（仙剑1官方设定） ───
    # 克制方造成 150% 伤害，被克制方造成 75% 伤害
    五灵克制倍率:
      水克火: 1.5                      # 水攻火：×1.5
      火克雷: 1.5                      # 火攻雷：×1.5
      雷克风: 1.5                      # 雷攻风：×1.5
      风克土: 1.5                      # 风攻土：×1.5
      土克水: 1.5                      # 土攻水：×1.5
      同系: 1.0                        # 同属性：×1.0
      被克: 0.75                       # 被克制方：×0.75

    # ─── 8.6 死亡处理（队伍死亡与复活判定） ───
    # 与 主角.死亡状态 / 临时.难度系数.最大复活次数 联动
    死亡处理:
      队伍死亡人数: 0                  # 当前队伍中死亡人数
      全灭判定: false                  # 全队死亡=游戏结束
      复活技能可用: true               # 是否有复活技能可用
      复活道具可用: true               # 是否有复活道具可用
      复活方式列表: []                 # 可用的复活方式（技能名/道具名）


  # ════════════════════════════════════════════════════════════
  # 九、时间与位置（综合状态镜像，便于状态栏读取）
  # 与 时间 / 场景 命名空间同步
  # ════════════════════════════════════════════════════════════
  时间与位置:
    游戏日期: '仙剑历0001年01月01日'   # 与 时间.游戏日期 同步
    时段: '早'                         # 与 时间.时段 同步
    当前地点: '余杭镇客栈'             # 与 场景.当前地点 同步
    当前章节: 1                        # 与 场景.当前章节 同步
    章节进度: 1                        # 与 场景.章节进度 同步
    战斗状态: '和平'                   # 与 战斗.战斗状态 同步
    当前难度: '普通'                   # 与 临时.当前难度 同步
    游戏模式: '原著'                   # 与 临时.游戏模式 同步
