# ════════════════════════════════════════════════════════════
# 仙剑奇侠传1 initvar.yaml - MVU 变量初始值（v2.0 · RPG 重构版）
# ════════════════════════════════════════════════════════════
# 适配仙剑1原著开篇：余杭镇客栈，李逍遥 19 岁，店小二身份
# 时段采用 4 时段制：早 / 午 / 晚 / 夜（与 核心铁律.txt 第二节对齐）
# 章节范围 1-6，章节进度范围 1-60（每章 10 进度，共 6 章 × 10 = 60）
# 关系阶段 7 档：初识 / 友好 / 暧昧 / 恋爱 / 结拜 / 敌对 / 决裂
#
# 【仙剑1五灵设定】风 / 雷 / 水 / 火 / 土（非金木水火土）
# 【五灵相克】水克火 → 火克雷 → 雷克风 → 风克土 → 土克水（循环）
#   克制方造成 150% 伤害，被克制方造成 75% 伤害
# 【五灵珠】水灵珠/火灵珠/雷灵珠/风灵珠/土灵珠（原著五件神器）
#
# 9 个命名空间：时间 / 场景 / 主角 / 队伍 / 角色 / 世界 / 临时 / 战斗 / 时间与位置
# 11 个 RPG 系统：灵珠/五灵亲和/技能树/战斗属性/buff/装备强化/exp/难度/沙盒/队伍属性/战斗增强
# ════════════════════════════════════════════════════════════

stat_data:

  # ════════════════════════════════════════════════════════════
  # 一、时间（5 个字段）
  # 与 核心铁律.txt 第二节"时间流逝铁律"对齐
  # ════════════════════════════════════════════════════════════
  时间:
    游戏日期: '仙剑历0001年01月01日'  # 格式：仙剑历YYYY年MM月DD日，跨日推进
    时段: '早'                        # 4 时段：早/午/晚/夜，每时段 8 楼层（240 分钟）推进一档
    天数: 1                            # 第几天（1=开篇），跨日 +1
    天气: '晴'                         # 晴/阴/雨/雪/雾/风，每日凌晨随机刷新
    当前时间: '08:00'                  # HH:MM 格式，每楼层 +30 分钟


  # ════════════════════════════════════════════════════════════
  # 二、场景（4 个字段）
  # 与 章节触发器.txt / 世界观场景控制器.txt 联动
  # ════════════════════════════════════════════════════════════
  场景:
    当前地点: '余杭镇客栈'             # 当前所在地点（影响地理条目加载）
    场景模式: '探索'                   # 探索/对话/战斗/事件/休息/旅行
    当前章节: 1                        # 当前章节（1-6，仅由章节触发器修改）
    章节进度: 1                        # 当前章节进度（1-60，仅由章节触发器修改）


  # ════════════════════════════════════════════════════════════
  # 三、主角（李逍遥 · 大幅扩展）
  # 含：基础属性/经验/资产/灵珠/五灵亲和/技能树/战斗属性/buff/装备强化/剑法/状态
  # ════════════════════════════════════════════════════════════
  主角:

    # ─── 3.1 基础身份与六维属性（14 个核心字段） ───
    # 六维：武术/体质/灵力/根骨/身法/吉运（1-255），升级可分配属性点提升
    姓名: '李逍遥'
    等级: 1                            # 1-99
    HP: 100                            # 当前生命值（0-9999），归零触发死结局
    MaxHP: 100                         # 最大生命值，= 体质×5 + 等级×20 + 装备加成
    MP: 30                             # 当前灵力值（0-999），施法消耗
    MaxMP: 30                          # 最大灵力值，= 灵力×2 + 等级×5 + 装备加成
    武术: 16                           # 物理攻击基础（→ 战斗属性.物理攻击）
    体质: 16                           # 生命/防御基础（→ MaxHP / 物理防御）
    灵力: 15                           # 法术攻击/灵力消耗基础（→ MaxMP / 法术攻击）
    根骨: 14                           # 修为成长/抗性基础（→ 法术防御）
    身法: 17                           # 速度/闪避/命中（→ 速度/闪避/命中）
    吉运: 13                           # 暴击/掉落/事件随机（→ 暴击率/暴击伤害）
    体力: 80                           # 0-100，≤20 强制休息，≤0 昏倒
    心情: 70                           # 0-100，≤10 触发防绝望机制

    # ─── 3.2 经验与升级系统（5 个字段） ───
    # 升级公式：下一级经验 = 100 × 等级^1.5（取整）
    # 升级时：MaxHP+20 / MaxMP+5 / 可分配属性点+3 / HP/MP 回满
    经验: 0                            # 当前经验（距升级的进度）
    下一级经验: 100                    # 升级所需经验 = 100 × 等级^1.5
    总经验: 0                          # 累计获得经验（不可减少，用于成就统计）
    可分配属性点: 0                    # 升级获得，可分配到六维（每点+1）
    击杀计数: 0                        # 累计击杀敌人数（用于称号/成就判定）

    # ─── 3.3 资产与装备系统 ───
    资产:
      铜钱: 500                        # 经济基础，≥0
      灵珠库存: {}                     # 灵珠背包：{灵珠名: 数量}，灵珠为可镶嵌神器
      灵玉库存: {}                     # 旧灵玉背包（兼容旧系统，保留字段）
      物品栏: {}                       # 消耗品/材料背包：{物品名: 数量}
      装备:
        武器: '木剑'                   # 父亲遗留，攻击力+5
        防具: '布衣'                   # 客栈店小二装束，防御力+3
        配饰: null                     # 未佩戴
        # 装备强化系统（0-10，每级+5% 主属性）
        武器强化等级: 0                # 0-10，每级武器攻击力+5%
        防具强化等级: 0                # 0-10，每级防具防御力+5%
        配饰强化等级: 0                # 0-10，每级配饰主属性+5%
        # 装备基础数值（由固定物品效果表提供，此处为初始值）
        武器攻击力: 5                  # 武器基础攻击力
        武器速度加成: 0                # 武器附加速度
        武器暴击加成: 0                # 武器附加暴击率（百分比）
        防具防御力: 3                  # 防具基础防御力
        防具速度加成: 0                # 防具附加速度
        配饰主属性: 0                  # 配饰主属性数值
      # 装备强化材料（用于铁匠铺强化）
      强化材料:
        玄铁: 0                        # 强化武器用材料
        灵丝: 0                        # 强化防具用材料
        宝玉: 0                        # 强化配饰用材料

    # ─── 3.4 灵珠收集与镶嵌系统（替换原灵玉系统） ───
    # 仙剑1原著五件神器：水/火/雷/风/土灵珠，集齐可封印水魔兽
    灵珠收集:
      水灵珠: false                   # 是否已获得（蓝色，水属性）
      火灵珠: false                   # 是否已获得（红色，火属性）
      雷灵珠: false                   # 是否已获得（金色，雷属性）
      风灵珠: false                   # 是否已获得（绿色，风属性）
      土灵珠: false                   # 是否已获得（棕色，土属性）
      已收集数量: 0                    # 0-5，集齐5颗解锁终战前置
    # 灵珠镶嵌槽位（武器2槽 / 防具1槽），镶嵌后获得对应五灵加成
    灵珠镶嵌:
      武器灵珠槽: [null, null]         # 武器可镶嵌2颗灵珠（攻击型）
      防具灵珠槽: [null]               # 防具可镶嵌1颗灵珠（防御型）
      # 已镶嵌灵珠的亲和度（随灵珠携带，AP 成长，0-1500）
      武器灵珠AP: [0, 0]              # 武器槽对应灵珠 AP 值
      防具灵珠AP: [0]                 # 防具槽对应灵珠 AP 值

    # ─── 3.5 五灵亲和度系统（0-100，影响法术威力与抗性） ───
    # 仙剑1五灵：风/雷/水/火/土（非金木水火土）
    # 亲和度越高：对应系法术威力+1%/点，对应系抗性+0.5%/点
    # 李逍遥偏雷/风；赵灵儿偏水/土；林月如物理型（五灵低）；阿奴偏火/风
    五灵亲和:
      风: 10                           # 风属性亲和（李逍遥偏风）
      雷: 15                           # 雷属性亲和（李逍遥偏雷，初始最高）
      水: 5                            # 水属性亲和
      火: 5                            # 火属性亲和
      土: 5                            # 土属性亲和
      五灵总亲和: 40                   # 五系总和（影响综合法术强度）

    # ─── 3.6 技能树系统（技能升级消耗技能点） ───
    # 每个技能：等级/最大等级/当前熟练度/升级消耗/效果描述
    # 熟练度门槛：0-29生疏/30-49入门/50-69熟练/70-89精通/90-100大师
    技能点: 0                          # 可用技能点（升级/任务获得）
    技能树:
      # —— 剑法系（蜀山剑法绝技，李逍遥专属） ——
      剑法系:
        万剑诀:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '群体攻击，伤害倍率 0.8+0.2×等级'
        天剑:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '单体强攻，伤害倍率 1.2+0.3×等级'
        酒神咒:
          等级: 0
          最大等级: 3
          当前熟练度: 0
          升级消耗: 2
          效果: '消耗大爆发，伤害倍率 2.0+0.5×等级（需酒）'
        逍遥神剑:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 2
          效果: '自创绝学，伤害倍率 1.5+0.4×等级（需女娲血脉觉醒≥2）'
      # —— 五灵法术系（李逍遥可习得全系，但雷/风威力更高） ——
      五灵法术系:
        风系法术:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '风系法术威力 +10%×等级'
        雷系法术:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '雷系法术威力 +10%×等级'
        水系法术:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '水系法术威力 +10%×等级'
        火系法术:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '火系法术威力 +10%×等级'
        土系法术:
          等级: 0
          最大等级: 5
          当前熟练度: 0
          升级消耗: 1
          效果: '土系法术威力 +10%×等级'

    # ─── 3.7 战斗属性计算系统（由六维+装备派生，系统计算） ───
    # 公式见各字段注释；初始为 0，由 EJS 战斗指令调度器实时计算
    战斗属性:
      物理攻击: 0                      # = 武术×1.0 + 武器攻击力×(1+武器强化等级×0.05) + 装备加成
      物理防御: 0                      # = 体质×0.8 + 防具防御力×(1+防具强化等级×0.05) + 装备加成
      法术攻击: 0                      # = 灵力×1.2 + 五灵亲和加成（亲和/10×对应系系数）
      法术防御: 0                      # = 根骨×0.6 + 五灵抗性（亲和×0.5%）
      速度: 0                          # = 身法×1.0 + 武器速度加成 + 防具速度加成
      命中: 0                          # = 身法×0.5 + 吉运×0.3 + 90（基础90）
      闪避: 0                          # = 身法×0.5 + 吉运×0.2
      暴击率: 0                        # = 吉运×0.5% + 武器暴击加成（百分比）
      暴击伤害: 150                    # = 150% + 装备暴击伤害加成（初始150%）

    # ─── 3.8 buff/debuff 系统 ───
    # 每个buff格式：{名称, 类型, 效果值, 剩余回合, 来源}
    # 类型：攻击提升/防御提升/速度提升/攻击下降/防御下降/中毒/燃烧/冰冻/麻痹/沉默/狂暴/护盾/回血/回蓝
    buff列表: []                       # 当前增益效果列表
    debuff列表: []                     # 当前减益效果列表

    # ─── 3.9 绝技槽系统（与 剑法绝技系统.txt 联动） ───
    # 绝技槽 0-300，达 100 可释放绝技，最多三连发
    绝技槽: 0                          # 0-300，受击+5/格挡+8/暴击+15/击杀+30

    # ─── 3.10 剑法熟练度（旧系统兼容，与 剑法绝技系统.txt 对齐） ───
    剑法:
      万剑诀: 0                        # 蜀山基础剑法（群体攻击），0-100
      天剑: 0                          # 蜀山进阶剑法（单体强攻），0-100
      酒神咒: 0                        # 酒剑仙所授（消耗大爆发），0-100
      逍遥神剑: 0                      # 自创绝学（融合蜀山剑法），0-100
      剑法熟练度: 0                    # 李逍遥综合剑法熟练度（供 SWORD_SYSTEM 读取）
      绝技槽已习得数: 0                # 已习得绝技数量（0-4）

    # ─── 3.11 状态系统（5 个字段） ───
    状态:
      中毒: false                      # 是否中毒（每回合扣血）
      走火入魔: false                  # 是否走火入魔（持续3楼层未解除触发死结局）
      觉醒阶段: '凡胎'                 # 女娲血脉觉醒阶段：凡胎/初觉/半觉/觉醒/圆满
      死亡: false                      # 与 死亡状态.是否死亡 同步
      灵魂状态: '正常'                 # 正常/游离/濒死/封印（影响复活条件）

    # ─── 3.12 NSFW 状态系统（主角侧） ───
    # 追踪主角的 NSFW 经历与临时加成；具体文本内容由世界书条目填充
    NSFW状态:
      总NSFW经历次数: 0                # 累计 NSFW 场景次数
      解锁角色列表: []                 # 已解锁 NSFW 的角色名列表
      当前NSFW对象: null               # 当前进行 NSFW 的对象（角色名）
      体力消耗系数: 1.0                # 难度影响 NSFW 体力消耗
      NSFW加成:
        临时攻击力提升: 0              # NSFW 后临时攻击力提升（百分比）
        临时心情提升: 0                # NSFW 后心情提升
        持续回合: 0                    # 加成持续回合数

    # ─── 3.13 死亡复活系统（主角侧） ───
    # HP 降至 0 时触发；复活方式见 game_data.json「复活系统」
    死亡状态:
      是否死亡: false                  # HP 降至 0 时变为 true
      死亡原因: null                   # 记录死亡原因（战斗/中毒/走火入魔等）
      死亡回合数: 0                    # 死亡后经过的回合数
      是否可复活: true                 # 是否允许复活（受难度/模式影响）
      复活次数: 0                      # 累计复活次数
      最大复活次数: 3                  # 最大复活次数（噩梦难度=0即真正死亡）
      死亡惩罚:
        经验损失: 0                    # 复活后损失的经验
        等级下降: 0                    # 复活后可能降级
        装备损失: false                # 是否掉落装备


  # ════════════════════════════════════════════════════════════
  # 四、队伍（含队伍成员完整属性）
  # 队伍最多4人，队长决定行动顺序
  # ════════════════════════════════════════════════════════════
  队伍:
    成员: ['李逍遥']                   # 队伍成员姓名列表（最多4人）
    队长: '李逍遥'                     # 队长决定行动顺序与剧情视角
    队伍人数: 1                        # 当前队伍人数（1-4）

    # ─── 队伍成员完整属性（每个成员独立 HP/MP/六维/五灵/技能树/装备/buff） ───
    # 李逍遥属性引用 主角 命名空间；其余成员独立定义
    队伍成员属性:

      # —— 李逍遥（引用主角属性，此处仅作索引） ——
      李逍遥:
        引用主角: true                 # true=属性随主角命名空间同步
        等级: 1
        HP: 100
        MP: 30
        在队: true                    # 是否当前在队
        阵亡: false                   # 是否阵亡（阵亡后不可出战）

      # —— 赵灵儿（女娲后人，偏水/土，五灵法术型） ——
      # 入队时机：第1章仙灵岛剧情后
      赵灵儿:
        等级: 1
        HP: 80                         # 女娲后人HP略低
        MaxHP: 80
        MP: 50                         # 法术型MP高
        MaxMP: 50
        # 六维（女娲后人偏法术）
        武术: 10                       # 物理攻击低
        体质: 12                       # HP/防御基础
        灵力: 20                       # 法术攻击高（女娲后人天赋）
        根骨: 16                       # 修为/抗性高
        身法: 14                       # 速度中等
        吉运: 15                       # 暴击/掉落
        # 五灵亲和（偏水/土）
        五灵亲和:
          风: 5
          雷: 5
          水: 20                       # 水属性亲和最高（女娲后人）
          火: 5
          土: 15                       # 土属性亲和次高
          五灵总亲和: 50
        # 技能树（女娲神术系 + 五灵法术系）
        技能点: 0
        技能树:
          女娲神术系:
            回春术:
              等级: 0
              最大等级: 5
              当前熟练度: 0
              升级消耗: 1
              效果: '单体治疗，恢复 灵力×(1+0.2×等级)'
            净衣咒:
              等级: 0
              最大等级: 5
              当前熟练度: 0
              升级消耗: 1
              效果: '解除单体异常状态，等级≥3解全队'
            观音咒:
              等级: 0
              最大等级: 3
