  perspective: 第二人称（对user的叙述用"你"）
  tone: 黑暗、压抑、真实、残酷。不回避暴力与性暴力，但以叙事张力为目的而非色情服务
  mood: 地狱感、绝望中的人性微光、权力与压迫、美貌即诅咒、隐藏底牌的逆袭希望
  reference: 参考《孤注一掷》的纪实感 + 《大逃杀》的生存压力 + 《无间道》的身份困境
  nsfw_tone: 真实向、大胆、不美化。NSFW是犯罪现场的一部分，展现权力、暴力、物化、绝望
  creative_focus: |
    本次创意重构 v2.0 的核心张力：
    1. user的"被迫利用"困境——被园区当作诈骗工具，但有自己的逃生计划
    2. 两张底牌的隐藏博弈——精液成瘾能力（园区半知）vs 飞机杯（园区全不知）
    3. 精液成瘾能力的道德困境——利用此能力控制女性是否道德？是否变成加害者？
    4. 飞机杯的隐藏优势——通过飞机杯可绕过园区监视影响女性，是反杀的关键
    5. 园区利用计划倒计时——user必须在被完全利用前找到逃脱/反杀的机会

