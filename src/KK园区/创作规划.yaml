  - name: 防口胡机制
    type: EJS预处理
    path: 世界书/EJS/防口胡机制.txt
    purpose: "@@generate_before EJS预处理层防口胡机制——校验矩阵/validateAction校验函数"

  - name: 精液成瘾能力
    type: EJS多阶段
    path: 世界书/EJS/精液成瘾能力.txt
    purpose: "@@generate_before 按精液成瘾能力阶段注入——未觉醒/觉醒态/首次触发/后宫雏形/后宫规模/后宫王"

  - name: 飞机杯系统
    type: EJS多阶段
    path: 世界书/EJS/飞机杯系统.txt
    purpose: "@@generate_before 按飞机杯具现度阶段注入——休眠/初探/渐深/具现/投影/实体化/降临"

mvu:
  structure: |
    顶层结构（与 schema.ts 对齐）：
    ├── 时间系统（3）
    │   ├── 日期: 'YYYY.MM.DD'
    │   ├── 星期: '周X'
    │   └── 时间: 'HH:MM'
    ├── 玩家（30 字段）
    │   ├── 飞机杯三系统（3）
    │   │   ├── 当前位置: 园区分区
    │   │   ├── 飞机杯当前绑定: 角色名 | '无'
    │   │   └── 飞机杯定位: 物理位置描述
    │   ├── 生存属性（5·0~100）
    │   │   ├── 体力 / 精神 / 饥饿 / 脱水 / 疲劳
    │   ├── NSFW属性（3）
    │   │   ├── 性欲(0~100) / 勃起度(0~100) / 累计射精次数
    │   ├── 经济物品（2）
    │   │   ├── 金钱 / 持有物品: [array]
    │   ├── user专属（4·0~100）
    │   │   ├── 容貌值 / 性别稀缺度 / 被觊觎度 / 生育价值
    │   ├── 受害者状态（11）
    │   │   ├── 伪装度 / 逃跑准备 / 情报网 / 信任值 / 伤势
    │   │   ├── 恐惧值 / 希望值 / 被迫度（0~100）
    │   │   ├── 权力接触: boolean / 外部援助: boolean
    │   │   └── 警方线索: 0~5
    │   └── 精液成瘾能力（7·本次创意核心）
    │       ├── 已觉醒: boolean
    │       ├── 觉醒进度: 0~100
    │       ├── 已触发口服次数 / 已触发内射次数
    │       ├── 园区知晓程度: 0~100
    │       ├── 园区知晓途径: string
    │       └── 成瘾女性总数
    ├── 女性角色（70 字段/角色，飞机杯通用系统+精液成瘾扩展）
    │   └── [角色名]:
    │       ├── 基础元数据（4）：身份/已激活/被绑定状态/终局
    │       ├── 飞机杯三系统（3）：察觉度/倾心度/具现度（0~200）
    │       ├── 精液成瘾系统（6）：成瘾度/爱意值/成瘾触发方式/已口服次数/已内射次数/成瘾觉醒日期
    │       ├── 服装状态（6）：整体着装状态/上身/裤子/胸罩/内裤/配饰
    │       ├── 身体部位（7个部位对象，约20子字段）
    │       ├── 生理状态（含孕期监测系统，约20字段）
    │       ├── 心理状态（8）
    │       ├── 实时状态（5）
    │       ├── 互动过程（8）
    │       ├── 长期跟踪（6）
    │       ├── 总结（5）
    │       └── 状态文本（3）：心情/心声/当前状态
    ├── 男性角色（6 字段/角色，飞机杯通用系统）
    ├── 园区（30 字段）
    │   ├── 阶段系统（3）：当前阶段/剧情进度/结局分支
    │   ├── 暗网（5）：拍卖状态/拍卖价格/直播次数/暗网知名度/买家关注
    │   ├── 派系（5·-100~100）：园区董事会/管理层/打手团/受害者群/暗网网络
    │   ├── 道德（1）：善恶值(-100~100)
    │   ├── 任务（3）：当前主线任务/已接取支线/已完成任务
    │   ├── 情报（2）：已获取情报/待验证情报
    │   ├── 成就（4）：已达成/生存天数/结识NPC数/救助人数
    │   ├── 同伙（2）：已招募/待招募候选
    │   ├── 证据（2）：已收集/已传递
    │   ├── LCG（1）：LCG种子
    │   └── 园区对user的利用（3·本次创意核心）
    │       ├── 利用计划: string
    │       ├── 利用进度: 0~100
    │       └── 已诈骗金额
    ├── RPG（25 字段：六维 6 + 未分配 1 + 12 技能 + 成长 6+1）
    │   ├── 六维属性（1~10）：力量/敏捷/体质/智力/感知/魅力
    │   ├── 未分配点数
    │   ├── 12 技能（0~100）：诈骗术/格斗术/潜行术/社交术/技术术/求生术/伪装术/情报收集/逃脱术/交际手腕/暗网操作/拷问抗性
    │   └── 成长子树：六维使用计数 + 技能使用计数(record)
    ├── 人际（3）
    │   ├── NPC关系: record<string, number>
    │   ├── 当前在场角色: [array]
    │   └── 互动计数: record<string, number>
    └── 角色库（3）
        ├── 已生成列表: [array]
        ├── 当前交互角色: string
        └── 角色生成计数器: number

ejs:
  generate_before:
    - name: current_stage
      variable: 园区.当前阶段
      note: 受害者路线五阶段枚举
    - name: plot_progress
      variable: 园区.剧情进度
    - name: ending_branch
      variable: 园区.结局分支
    - name: user_appearance
      variable: 玩家.容貌值
    - name: user_scarcity
      variable: 玩家.性别稀缺度
    - name: lcg_seed
      variable: 园区.LCG种子
    - name: morality
      variable: 园区.善恶值
    - name: faction_board
      variable: 园区.园区董事会
    - name: faction_mgmt
      variable: 园区.管理层
    - name: faction_guard
      variable: 园区.打手团
    - name: faction_victim
      variable: 园区.受害者群
    - name: faction_darknet
      variable: 园区.暗网网络
    - name: utilization_progress
      variable: 园区.利用进度
      note: 园区对user的利用进度（本次创意核心）
    - name: addiction_awakened
      variable: 玩家.精液成瘾能力.已觉醒
    - name: addiction_oral_count
      variable: 玩家.精液成瘾能力.已触发口服次数
    - name: addiction_internal_count
      variable: 玩家.精液成瘾能力.已触发内射次数
    - name: addiction_park_known
      variable: 玩家.精液成瘾能力.园区知晓程度
    - name: addiction_total_women
      variable: 玩家.精液成瘾能力.成瘾女性总数
    - name: fjb_binding
      variable: 玩家.飞机杯当前绑定
    - name: fjb_location
      variable: 玩家.飞机杯定位
  entries:
    - name: 受害者_阶段指导
      complexity: 条目显隐
      stages:
        - name: 入园恐惧
          condition: "current_stage === '入园恐惧'"
        - name: 适应求生
          condition: "current_stage === '适应求生'"
        - name: 暗中谋划
          condition: "current_stage === '暗中谋划'"
        - name: 逃脱行动
          condition: "current_stage === '逃脱行动'"
        - name: 结局
          condition: "current_stage === '结局'"
    - name: 精液成瘾能力_EJS
      complexity: 多阶段注入
      stages:
        - name: 未觉醒
          condition: "!addiction_awakened"
        - name: 觉醒态
          condition: "addiction_awakened && addiction_total_women === 0"
        - name: 首次触发
          condition: "addiction_awakened && addiction_total_women === 1"
        - name: 后宫雏形
          condition: "addiction_awakened && addiction_total_women >= 2 && addiction_total_women <= 4"
        - name: 后宫规模
          condition: "addiction_awakened && addiction_total_women >= 5 && addiction_total_women <= 9"
        - name: 后宫王
          condition: "addiction_awakened && addiction_total_women >= 10"
    - name: 飞机杯系统_EJS
      complexity: 多阶段注入
      stages:
        - name: 休眠
          condition: "fjb_binding === '无' || fjb_binding === ''"
        - name: 初探期
          condition: "fjb_binding !== '无' && char_manifest >= 1 && char_manifest <= 30"
        - name: 渐深期
          condition: "fjb_binding !== '无' && char_manifest >= 31 && char_manifest <= 60"
        - name: 具现期
          condition: "fjb_binding !== '无' && char_manifest >= 61 && char_manifest <= 90"
        - name: 投影期
          condition: "fjb_binding !== '无' && char_manifest >= 91 && char_manifest <= 120"
        - name: 实体化期
          condition: "fjb_binding !== '无' && char_manifest >= 121 && char_manifest <= 150"
        - name: 降临期
          condition: "fjb_binding !== '无' && char_manifest >= 151"
    - name: 结局条目
      complexity: 条目显隐
      condition: ending_branch !== ''
    - name: NPC条目
      complexity: 段落控制
      note: 按当前在场角色用 getwi 精确拉取 NPC 人设

first_messages:
  - format: 叙事式
    word_count: 500~800
    output_path: 开场白/0.txt
    scene: KK园区·受害者入场
    opening_situation: |
      user被"小柔"网恋骗局诱骗至KK园区。车到园区，被编号#VK-001。
      是新猪仔里唯一的男性。园区已知他的"内射触发成瘾"能力（通过小柔调查记录），
      龙姐计划用他诈骗大陆有钱女性。但user身上还藏着两件园区不知道的底牌：
      1. 口服也会触发成瘾（园区仅知内射）
      2. 飞机杯（藏于贴身衣物内的神秘器具）
      地狱开局。但user手中有两张牌：一张园区知道，一张园区不知道。
    initvar_override: 开场白/0.txt (内嵌 initvar 块)

# ═══════════════ 结局硬性条件矩阵 ═══════════════
# 结局由变量阈值触发，禁止AI自行宣布结局
# 道德值影响可用结局：黑暗路线(<-50)解锁反杀/黑化；光明路线(>50)解锁被救
ending_conditions:
  受害者:
    A_逃脱成功:
      description: 利用精液成瘾+飞机杯收集情报，成功逃脱园区
      required:
        玩家.逃跑准备: "≥80"
        玩家.情报网: "≥5"
        RPG.逃脱术: "≥60"
        园区.拍卖状态: "!=已成交"
    B_沉沦:
      description: 精神崩溃，被同化为打手或认命
      required:
        玩家.精神: "<20"
        玩家.希望值: "<10"
    C_转卖:
      description: 通过暗网被卖到更惨的地方
      required:
        园区.拍卖状态: "已成交"
    D_反杀上位:
      description: 利用精液成瘾能力控制女性NPC+飞机杯具现辅助，反杀女老板成为新老板（黑化）
      required:
        玩家.伪装度: "≥80"
        玩家.性别稀缺度: "≥90"
        RPG.伪装术: "≥70"
        园区.善恶值: "<-50"
        玩家.权力接触: true
        玩家.精液成瘾能力.成瘾女性总数: "≥5"
    E_被救:
      description: 警方捣毁园区获救
      required:
        玩家.警方线索: "≥3"
        玩家.外部援助: true
        园区.善恶值: "≥30"
