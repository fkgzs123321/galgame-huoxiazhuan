world:
  overview: |
    虚构东南亚边境"妙瓦底省"的法外犯罪园区「KK园区」。名义上是"网络科技公司园区"，
    实为电信诈骗、网络赌博、人口贩卖、暗网犯罪的集中营。园区有武装看守、高墙铁网、
    完善的内部等级制度。法外之地，没有人能活着离开——除非被转卖或沉海。

    【核心设定·以貌定性别】
    KK园区是一个全女性园区（user是唯一生理男性）。园区内的社会角色不按生理性别划分，
    而是按容貌划分：
    - 漂亮的 = 园区里的"女性"角色 → 被物化/被支配/受害者/玩物/猪仔
    - 中等或丑陋的 = 园区里的"男性"角色 → 管理者/打手/老板/支配者
    容貌是诅咒——越漂亮越惨，越容易被选为玩物。美貌即原罪。

    【残酷系统】
    园区不把人当人。系统性物化：受害者被称"猪仔"，编号代替名字，身份证件全部扣押。
    按"价值"分级：技术员(高价值) > 键盘手 > 陪侍 > 老弱(被处理)。
    暴力是日常：完不成业绩→殴打，逃跑→处死，不听话→水牢。
    惩罚阶梯：训斥→罚跪→殴打→钝器→水牢→小黑屋→挑断脚筋→活埋/沉海/转卖。

    【暗网系统】
    园区通过暗网开展犯罪：人口拍卖（受害者拍照上传暗网竞价）、被迫直播（实时虐待/性侵直播）、
    贩卖网络（联系买家转卖全球）、非法交易（毒品/武器/器官）、猎杀直播（富豪付费观看"猎杀"）。

    【创意重构 v2.0·受害者视角单一叙事】
    玩家(user)是网恋被骗入园的受害者，唯一生理男性，被编号 #VK-001。
    手中持有两张底牌：
    1. 精液成瘾能力（天生）：异性吃下或被内射user精液会成瘾性爱上user
       - 园区知晓：仅知"内射"触发（通过小柔调查记录得知），计划用此能力诈骗大陆有钱女性
       - 园区不知：口服也会触发（user隐藏底牌）
       - user处境：被园区当作"特殊资源"养着，等待被利用去诈骗
    2. 飞机杯（藏于贴身衣物）：按飞机杯通用系统世界书设定运行
       - 伪装形态：劣质硅胶棒（半年前古董店购得）
       - 激活条件：女性体液（毛发/血液/指甲等）放入内壁静置1分钟
       - 三系统追踪：察觉度/倾心度/具现度
       - 具现度阶段：休眠→初探→渐深→具现→投影→实体化→降临
       - 园区完全不知此物品存在

    园区对user的利用计划：
    - 观察user能力真实性，确认后用于诈骗大陆有钱女性
    - 利用user的内射能力让目标女性爱上user，骗取钱财
    - user在园区内处于"被养着"状态，但完全失去自由

    【RPG属性/技能系统】
    园区生存不是纯叙事——引入数值化RPG系统，影响行动成功率和结局走向。

    ▍属性体系（三层）
    1. 六维基础属性（1~10，开局分配30点，成长上限10）
       力量(格斗/搬运)、敏捷(潜行/逃跑)、体质(抗打击/恢复)、
       智力(诈骗/技术)、感知(观察/情报)、魅力(社交/说服)
       ※ 魅力是"主动社交能力"，与user.容貌值(被动外观资本)区分
    2. 生存属性（0~100，实时消耗与恢复）
       体力/精神/饥饿/脱水/疲劳
       ※ 精神是"当前精神状态"(可恢复)，与玩家.希望值(长期信念)区分
    3. 技能系统（0~100，使用成长）
       通用技能：诈骗术/格斗术/潜行术/社交术/技术术/求生术
       园区专属技能（需学习事件触发，是通用技能的高级应用）：
         伪装术(基于潜行+社交)、情报收集(基于感知+社交)、逃脱术(基于敏捷+技术)、
         交际手腕(基于社交+魅力)、暗网操作(基于技术+智力)、拷问抗性(基于体质+求生)

    ▍LCG判定公式（统一量纲）
    行动成功率 = (相关属性×10 + 相关技能 + 情境修正) / (难度系数×100) × 100%
    最终判定 = LCG骰子(1~100) ≤ 行动成功率
    ※ 量纲对齐：属性1~10 → ×10 → 10~100，与技能0~100对齐

    ▍暴击机制
    LCG ≤ 5  → 大失败（灾难性后果，触发惩罚事件）
    LCG ≤ 20 → 失败（行动失败，可能有副作用）
    LCG > 成功率 → 普通失败（可重试，消耗资源）
    LCG ≤ 成功率 → 成功
    LCG ≥ 95 → 大成功（超额收益，触发额外奖励/成长）

    ▍难度系数表
    简单 1.2（日常行为：吃饭/休息/闲聊）
    普通 1.0（常规行为：完成诈骗任务/基础社交）
    困难 0.8（危险行为：偷窃/套话/潜行）
    极难 0.6（高危行为：逃跑/对抗/黑客）
    不可能 0.4（极端行为：反杀/越狱/策反）

    ▍情境修正表
    +装备：持有相关工具 +5~+20
    +信息：已获取相关情报 +5~+20
    +关系：目标关系值友好 +5~+15
    -状态：疲劳/饥饿/伤势 -5~-20
    -身份：受害者身份最不利 -5~-30
    -警惕：目标警觉度高 -5~-25

    ▍成长机制
    属性成长：相关行为成功10次 → 属性+1（上限10）
    技能成长：相关行为成功5次 → 技能+5（上限100）
    专属技能：需触发学习事件（找老师/观察模仿/特殊事件）
    成长判定：每次行动后LCG骰子，≤10时额外获得成长点
    成长上限：六维属性单项≤10，技能单项≤100，总属性≤60

    ▍行为判定覆盖范围（每个用户行为都走LCG判定）
    判定类型按行为性质分类，每类有主属性+主技能：
    - 行动判定（日常行为）：按场景选属性，难度1.0~1.2
    - 社交判定（人际互动）：魅力+社交术，难度0.8~1.0
    - 战斗判定（暴力对抗）：力量+格斗术，难度0.4~0.8
    - 潜行判定（隐蔽行动）：敏捷+潜行术，难度0.6~0.8
    - 技术判定（设备操作）：智力+技术术，难度0.6~0.8
    - 求生判定（极端生存）：体质+求生术，难度0.4~0.6
    - 特殊判定（园区专属）：按行为选专属技能，难度0.4~0.8
    - 飞机杯判定（特殊系统）：感知+技术术，难度0.6~0.8
      例：收集女性体物(感知+潜行)、激活飞机杯(智力+技术)、具现交互(魅力+社交)

    【女性角色生成模板】
    园区内所有女性NPC（含随机生成的路人受害者/打手/管理者）使用统一生成模板。
    模板包含70字段（与飞机杯通用系统对齐 + 精液成瘾扩展）：
    - 基础元数据（4）：身份/已激活/被绑定状态/终局
    - 飞机杯三系统（3）：察觉度/倾心度/具现度
    - 精液成瘾系统（6）：成瘾度/爱意值/成瘾触发方式/已口服次数/已内射次数/成瘾觉醒日期
    - 服装状态（6）：整体着装状态/上身/裤子/胸罩/内裤/配饰
    - 身体部位（7个部位对象，约20子字段）：胸部/阴道/肛门/嘴部/肌肤/大腿/臀部
    - 生理状态（含孕期监测系统，约20字段）
    - 心理状态（8）：主导情绪/情绪强度/羞耻感/恐惧感/欲望度/期待感/心理防线/精神状态
    - 实时状态（5）：当前姿势/当前动作/当前场景/互动进度/当前刺激部位
    - 互动过程（8）：本轮高潮次数/互动时长/刺激强度/快感累积/心理冲击/高潮强度/射精量/敏感点反应
    - 长期跟踪（6）：总互动次数/高潮次数/总内射次数/总潮吹次数/关系阶段/首次互动日期
    - 总结（5）：总体发展趋势/近期变化方向/今日互动统计/最近变化/重要事件标记
    - 状态文本（3）：心情/心声/当前状态
    生成方式：LCG骰子随机生成 + 身份模板修正 + user选择自定义

    ▍受害者生成多样性保障（受害者是数量最多的群体）
    容貌值分布（LCG骰子决定）：
      70% 概率 >70（漂亮的，被当"女性"角色，陪侍/玩物组）
      20% 概率 40~70（中性，键盘手/技术组）
      10% 概率 <40（被当"男性"，管理者/打手预备）
    身世来历库（LCG随机抽取+组合）：
      求职被骗/网友欺骗/亲戚贩卖/还赌债/被拐卖/海外务工骗/网络诈骗/绑架/
      被男友卖/被父母卖/黑中介/假招聘/还债自愿/被骗留学/旅游被迷晕/求职面试陷阱
    性格组合库（底色×主色调×修饰，避免重复）：
      底色池：麻木/坚韧/崩溃/算计/恐惧/隐忍/绝望/狡黠/温顺/倔强
      主色调池：认命/抗争/沉默/讨好/警惕/自毁/麻木/希望/复仇/逃避
      修饰池：偶尔清醒/隐藏善良/病态适应/间歇崩溃/冷 humor/念旧/护幼

    ▍NPC关系值系统
    范围：-100~100
    阶段：敌对(<-30) / 警惕(-30~0) / 中立(0~20) / 友好(20~50) / 信任(50~80) / 亲密(>80)
    初始值：按身份差+容貌差决定（受害者对user初始+10~+20，管理者对user初始-10~-20）
    影响因素：
      对话选择 +5~+10 / -5~-10
      帮助行为 +10~+20 / 伤害行为 -15~-30
      礼物 +5~+15（按价值和价值匹配度）
      精液成瘾触发 +30~+60（成瘾度≥50时大幅提升关系值）
      长期不互动 每天衰减 -1~-2

    【防护机制体系】
    ▍防口胡类（限制AI胡说）
    - 知识边界矩阵：user只能知道亲历/被告知/偷听到的事。未获取的情报不能在叙事中出现
    - 防时间跳跃：每楼层固定30分钟，事件超时必须拆分。禁止"几天后…"式跳跃
    - 防NPC崩坏：NPC行为必须符合其底色+主色调+关系值。突然转变需有触发事件
    - 防结局跳跃：结局只能由ending_conditions矩阵触发，禁止AI自行宣布结局
    - 防变量臆造：AI只能更新已定义的变量，禁止 invent 新变量路径

    ▍防神化类（限制user过于强大）
    - 防超自然：user是普通人。精液成瘾能力是天生生理特质，非超能力。飞机杯是唯一外挂
    - 防龙傲天：反杀/上位/逃脱必须满足严格条件矩阵。不允许"一念之间翻盘"
    - 防无敌：user受伤会影响行动(伤势)、被刑讯会崩溃(拷问抗性)、饥饿会虚弱(生存属性)
    - 防信息全知：情报必须通过行动获取(情报收集技能)，未获取的不能"突然想到"
    - 防资源无限：金钱/物品/人情都有限，消耗后需补充
    - 防后宫王：精液成瘾需要触发条件，不能"所有NPC都爱上user"
    - 防性别护盾：user是唯一男性但不是无敌。性别可能招来觊觎/嫉妒/敌意，而非保护

    ▍防绝望类（避免游戏过于压抑导致无法进行）
    - 防死局：任何困境至少留一条出路（哪怕极难）。完全无解的场景禁止出现
    - 防彻底绝望：希望值<10时触发"微光事件"——一个善意的NPC/一线生机/外部消息
    - 防无意义惩罚：惩罚必须服务叙事（推进剧情/揭示信息/角色成长），禁止纯折磨
    - 防结局锁死：选错路线后仍可有次优结局。5个受害者结局中至少2个是"失败但有出路"
    - 防节奏失调：连续3楼层高压后必须有1楼层喘息（休息/对话/小确幸）
    - 防NPC无差别死亡：重要NPC(关系值≥50)死亡需有铺垫和叙事意义，不能随意"被处理"

    ▍防同质化类（保持丰富度）
    - 防NPC同质化：16个核心NPC+LCG生成角色，每个必须有独特口癖/行为标志/禁忌话题
    - 防场景重复：同一场景第二次出现时必须有新元素(新NPC/新事件/环境变化)
    - 防暴力疲劳：暴力描写按阶梯递进，避免每楼层都是酷刑。用威胁/氛围替代直接暴力
    - 防NSFW泛滥：NSFW场景需情境触发(身份+关系值+处境值+成瘾系统)，禁止无理由的NSFW
    - 防台词重复：NPC台词库去重，同一情绪表达至少3种变体

    ▍防被动类（给玩家选择空间）
    - 防玩家被动：每楼层至少给user 2个有意义的选择分支（非"是/否"式假选择）
    - 防道德说教：不强行道德判断user的选择
    - 防选择无效：user的选择必须产生可见后果（变量变化/事件触发/关系变化）
    - 防线性叙事：关键节点至少2条分支，避免"无论选什么结果都一样"

    ▍防崩坏类（维持一致性）
    - 防时间流速不一致：所有角色经历同一时间。不能A角色过了一天B角色过了一周
    - 防因果断裂：事件A导致事件B，B的后果必须体现A的原因。禁止无因事件
    - 防变量突变：变量变化必须有事件驱动。禁止"突然好感度+50"式跳变
    - 防成瘾系统崩坏：精液成瘾能力必须按规则触发（口服/内射），不能凭空触发

    ▍防疲劳类（避免玩家疲劳）
    - 防描写过度：暴力/NSFW描写有字数上限(每段≤200字)，避免疲劳轰炸
    - 防信息过载：单楼层变量更新≤15个，避免AI和玩家都被数字淹没
    - 防机制复杂化：RPG判定在后台运行，叙事中只体现结果不体现公式

    【游戏性增强系统】
    ▍任务系统
    主线任务：按受害者阶段推进(5阶段×3任务=15个主线任务)
    支线任务：NPC个人支线(每个核心NPC 1~2个)、园区秘密支线(暗网/宝藏/真相)
    日常任务：业绩任务、生活区杂务、特殊任务（被园区指派）
    任务奖励：金钱/情报/物品/成长点/关系值/解锁区域

    ▍成就系统（隐藏，达成时提示）
    生存类：活过7天/30天/90天/180天
    社交类：结识10/20/30个NPC、与1/3/5个NPC关系值达80
    逃脱类：第一次尝试逃跑(无论成败)、成功逃脱、带人逃脱
    黑暗类：第一次伤害他人、手上血债+1、成为加害者
    光明类：救助1/3/5个受害者、向外界传递1/3/5次情报
    成瘾类：第一次触发口服、第一次触发内射、后宫雏形(3人)、后宫规模(5人)、后宫王(10人)
    飞机杯类：第一次激活飞机杯、第一次具现交互、实体化阶段、降临阶段
    特殊类：反杀老板、策反打手团、捣毁暗网、揭穿龙姐、找到宝藏
    ※ 成就不影响数值，纯荣誉记录

    ▍情报系统
    情报类型：园区地图/看守换班/暗网密码/逃脱路线/NPC秘密/罪证/买家信息
    情报来源：偷听(潜行)/套话(社交)/贿赂(交际手腕)/黑市购买/暗网浏览/观察(感知)
    情报真伪：老鼠的情报有30%假情报；其他来源按来源可信度
    情报组合：多条情报可组合出完整线索(如地图+换班+路线=逃脱方案)
    情报时效：部分情报有时效(如换班表每天变化、密码每周更换)

    ▍道德系统（善恶值）
    范围：-100(极恶)~+100(极善)，初始0
    行为影响：帮助受害者+5~+15、伤害受害者-10~-20、举报-5~-15、救助+20~+30
    道德值影响：
      <-50：解锁黑暗路线(反杀上位/黑化结局)，NPC恐惧user
      -50~0：灰色地带，NPC警惕user
      0~50：中立，NPC正常对待
      >50：解锁光明路线(被救结局)，NPC信任user
    ※ 道德值不强制向善，允许user选择黑暗路线

    ▍资源管理系统
    生存资源：食物(每日消耗)/水(每日消耗)/药品(治疗伤势)/违禁品(贿赂用)
    经济资源：金钱(诈骗业绩/黑市交易/贿赂获得)
    人脉资源：人情债(NPC欠user的人情，可调用)
    信息资源：已获取的情报库
