    purpose: NSFW场景库——验货、被迫接客、直播、种马、权力性交易、精液成瘾触发场景

  # 结局条目（仅受害者路线，5个结局）
  - name: 结局_受害者_逃脱
    type: 事件
    path: 世界书/事件/结局/受害者_逃脱.yaml
