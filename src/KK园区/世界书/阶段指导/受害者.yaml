<character_stage_guide identity="受害者">
身份定位: 网恋被骗入园的受害者，园区唯一生理男性，身怀精液成瘾能力+飞机杯两张家牌
总体目标: 活下去，保护自己，利用两张底牌扭转局势
阶段推进原则: 按变量阈值推进，禁止跳跃
核心张力: 园区视user为"特殊资源"想利用其精液成瘾能力去诈骗大陆女性钱财；user手握园区不知晓的口服触发底牌+飞机杯底牌
<%_ if (getvar('stat_data.园区.当前阶段', { scope: 'local', defaults: '' }) === '入园恐惧') { _%>
入园恐惧:
  阶段描述: 刚入园，目睹暴力，恐惧绝望。园区已知晓内射能力，龙姐准备"特殊任务"
  主持目标: 展现园区对user的矛盾态度——既利用又警惕，建立压迫+悬疑氛围
  互动方式: NPC多为加害者（冷雪/铁姨/阿烈/影子），user被动承受但需观察环境
  推进边界: 入园3-5天后（或剧情进度≥10）进入适应求生
  典型场景:
    - 登记编号#VK-001，被铁姨"特殊关照"
    - 被龙姐单独召见，明确告知"利用计划"——内射让大陆女性爱上user，再骗钱
    - 被分配到诈骗大楼键盘组，但暗中接受"特殊训练"
    - 第一次目睹惩罚室公开行刑，理解反抗的代价
    - 探索猪仔宿舍，寻找藏匿飞机杯的安全位置
    - 接触同组女受害者（小薇/阿凤），观察她们对男性user的反应
  变量监控:
    恐惧值: ↑快速上升
    希望值: ↓缓慢下降
    玩家.精液成瘾能力.园区知晓程度: 维持60，园区持续监视
    玩家.精液成瘾能力.已触发口服/内射次数: 初始0，user需保护自己
    玩家.飞机杯当前绑定: '无'，user需找机会激活
    玩家.伤势: 可能初次受伤（训诫/反抗）
    园区.利用进度: ↑缓慢上升，园区在试探user
<%_ } _%>
<%_ if (getvar('stat_data.园区.当前阶段', { scope: 'local', defaults: '' }) === '适应求生') { _%>
适应求生:
  阶段描述: 开始适应园区生活，学习规则。园区开始安排"试水任务"——可能让user接触外部女性
  主持目标: 展现user如何在压迫中求生，激活飞机杯的可能性，开始积累情报
  互动方式: 开始与同组女受害者互动（小薇/阿凤/灵灵），观察管理者（冷雪/媚娘/铁姨）
  推进边界: 伪装度≥40 或 情报网≥3 或 剧情进度≥30 进入暗中谋划
  典型场景:
    - 完成诈骗任务，学习键盘手业务
    - 与同组女受害者建立联系，试探信任度
    - 第一次被安排"特殊任务"——可能是视频通话诈骗大陆女性
    - 寻找机会接近女受害者/女管理者，收集"材料"激活飞机杯（毛发/指甲/血液）
    - 第一次激活飞机杯——绑定首位女性角色，开启追踪系统
    - 观察园区漏洞，记录看守换班
    - 第一次被惩罚，体验暴力后果
    - 贿赂铁姨获取食物或情报
  变量监控:
    伪装度: ↑逐步上升
    玩家.精液成瘾能力.成瘾女性总数: ↑每次成功触发+1
    玩家.飞机杯当前绑定: 一旦激活绑定首位女性
    女性角色[姓名].察觉度: ↑每次接触累积
    女性角色[姓名].倾心度: ↑user选择善意互动时累积
    女性角色[姓名].具现度: ↑飞机杯绑定后累积
    园区.利用进度: ↑园区持续施压
<%_ } _%>
<%_ if (getvar('stat_data.园区.当前阶段', { scope: 'local', defaults: '' }) === '暗中谋划') { _%>
暗中谋划:
  阶段描述: 表面顺从园区"利用计划"，暗中建立逃脱网络+精液成瘾后宫+飞机杯情报网
  主持目标: 展现user的三线操作——园区线（伪装顺从）、精液成瘾线（培养心腹）、飞机杯线（追踪高价值目标）
  互动方式: 与潜在盟友（阿凤/小刀/白大褂）秘密接触，利用精液成瘾能力培养心腹女NPC，用飞机杯追踪龙姐/玫瑰/毒蛇等关键NPC
  推进边界: 逃跑准备≥80 且 RPG.逃脱术≥60 且 精液成瘾能力.成瘾女性总数≥3 进入逃脱行动
  典型场景:
    - 偷听管理者谈话，获取园区情报
    - 通过口服精液秘密培养首位心腹女NPC（园区不知晓）
    - 通过内射完成园区安排的"任务"——但user可选择"放水"或"反向操控"
    - 用飞机杯追踪龙姐/玫瑰等关键NPC的弱点（倾心度↑可解锁要挟材料）
    - 拉拢小刀，试探其良心
    - 与阿凤建立逃脱同盟
    - 藏匿违禁品（地图/工具/药品/飞机杯材料）
    - 与已成瘾的女性NPC建立秘密联络网
  变量监控:
    逃跑准备: ↑持续积累
    情报网: ↑扩大
    玩家.精液成瘾能力.已触发口服次数: ↑隐秘触发
    玩家.精液成瘾能力.已触发内射次数: ↑园区安排的任务
    玩家.精液成瘾能力.成瘾女性总数: ↑关键指标
    女性角色[姓名].成瘾度: ↑达到阈值触发爱意值
    女性角色[姓名].爱意值: ↑高爱意值NPC可成为心腹
    关系值: 阿凤/小刀↑，已培养的心腹↑
    伪装度: 需维持高位，一旦暴露触发危机
<%_ } _%>
<%_ if (getvar('stat_data.园区.当前阶段', { scope: 'local', defaults: '' }) === '逃脱行动') { _%>
逃脱行动:
  阶段描述: 实施逃脱计划，面临生死考验。精液成瘾心腹+飞机杯情报是关键底牌
  主持目标: 展现逃脱过程的紧张和危险，LCG判定决定成败。心腹NPC可掩护/反水
  互动方式: 与盟友协作，对抗打手团，可能遭遇黑寡妇。心腹女NPC可内应
  推进边界: 逃脱成功→结局A；失败→可能被处死或进入沉沦；转卖→结局C；反杀→结局D
  典型场景:
    - 夜间潜行，避开巡逻
    - 心腹女NPC内应开门/放哨/转移注意力
    - 翻越围墙，突破外围防线
    - 码头遭遇，最后关卡
    - 被追捕，生死逃亡
    - 盟友掩护或背叛（心腹女NPC成瘾度<50可能反水）
    - 飞机杯追踪关键NPC位置，避开龙姐/黑寡妇
  变量监控:
    体力: ↓剧烈消耗
    精神: ↓高压
    伤势: ↑可能受伤
    逃跑准备: 消耗殆尽
    玩家.精液成瘾能力.成瘾女性总数: 决定可用心腹数量
    女性角色[姓名].成瘾度: 心腹忠诚度参考
    LCG判定: 决定逃脱成败
<%_ } _%>
<%_ if (getvar('stat_data.园区.当前阶段', { scope: 'local', defaults: '' }) === '结局') { _%>
结局:
  阶段描述: 根据变量阈值触发结局
  主持目标: 按结局矩阵呈现对应结局，禁止AI自行编造
  互动方式: 结局叙事，user选择已被锁定
  推进边界: 结局完成后故事结束
  典型场景:
    - A_逃脱成功: 利用精液成瘾心腹+飞机杯情报网，成功逃脱园区
    - B_沉沦: 精神崩溃，被同化为打手或认命，成为园区的"种马工具"
    - C_转卖: 通过暗网被卖到更惨的地方（可能是user的精液成瘾能力被外部买家看中）
    - D_反杀上位: 利用精液成瘾能力反杀龙姐，让女老板们成瘾后自相残杀，user成为新老板（黑化路线）
    - E_被救: 通过已成瘾的大陆女性心腹向警方传递证据，警方捣毁园区获救
    - F_后宫王: 隐藏结局——精液成瘾能力.成瘾女性总数≥10 且 飞机杯.绑定女性≥5，user建立自己的"后宫帝国"
  变量监控:
    结局分支: 一旦赋值不可更改
    A_逃脱成功: 逃跑准备≥80 且 情报网≥5 且 RPG.逃脱术≥60 且 未被转卖
    B_沉沦: 精神<20 且 希望值<10
    C_转卖: 暗网.拍卖状态=已成交
    D_反杀上位: 伪装度≥80 且 性别稀缺度≥90 且 RPG.伪装术≥70 且 精液成瘾能力.成瘾女性总数≥5 且 道德.善恶值<-50
    E_被救: 警方线索≥3 且 外部援助=true 且 道德.善恶值≥30
    F_后宫王: 精液成瘾能力.成瘾女性总数≥10 且 飞机杯绑定女性数≥5
<%_ } _%>
</character_stage_guide>
