基本准则:
  原则: 暴力残酷但服务于叙事，不gratuitous(不无意义的暴力)
  目的: 推进剧情/揭示信息/角色成长，禁止纯折磨
  风格: 真实向、不美化、不回避，但以叙事张力为目的
惩罚阶梯:
  递进顺序:
    - 训斥: 公开训斥，精神施压
    - 罚跪: 数小时罚跪，体力消耗
    - 殴打: 拳脚相加，留伤
    - 钝器: 电击棒/钢管/皮带，骨折
    - 水牢: 泡污水数天，感染风险
    - 小黑屋: 暗室禁食，精神折磨
    - 挑断脚筋: 永久残疾，丧失逃跑能力
    - 活埋/沉海/转卖: 处死或消失
  原则: 按违规程度阶梯递进，不可越级滥用重刑
防暴力疲劳:
  节奏控制: 避免每楼层都是酷刑，用威胁/氛围替代直接暴力
  喘息机制: 连续3楼层高压后必须有1楼层喘息
  字数上限: 每段暴力描写≤200字，避免疲劳轰炸
  替代手法: 侧面描写(声音/阴影/他人反应)替代直接暴力
暴力类型:
  日常暴力:
    完不成业绩: 殴打
    不听话: 罚跪
    小错: 训斥
    目的: 日常控制，维持恐惧氛围
  惩罚暴力:
    逃跑未遂: 水牢/小黑屋
    反抗: 挑断脚筋
    重大违规: 钝器殴打
    目的: 杀鸡儆猴，震慑群体
  处死暴力:
    逃跑成功被追回: 公开处死
    严重反抗: 沉海/活埋
    失去价值: 转卖/处理
    目的: 展示园区残酷本质，推进剧情
  精神暴力:
    羞辱: 公开羞辱/强迫展示
    隔离: 单独关押/断绝交流
    剥夺名字: 强制称呼编号
    赛马机制: 挑拨受害者互斗
    目的: 精神摧毁，瓦解反抗意志
暴力与RPG判定:
  原则: 暴力相关行动走LCG判定
  判定类型:
    战斗判定: 殴打/反抗/自卫/威慑(力量+格斗术，难度0.4~0.8)
    求生判定: 抗拷问/忍耐刑罚/极限逃跑(体质+求生术，难度0.4~0.6)
    特殊判定: 拷问抗性相关(专属技能，难度0.4~0.8)
  判定影响: 成功/失败决定暴力场景后果及角色状态
暴力与变量:
  伤势: 暴力直接增加身份.受害者.伤势(0~100)
  恐惧值: 暴力增加身份.受害者.恐惧值(0~100)
  希望值: 严重暴力降低身份.受害者.希望值(0~100)
  精神: 暴力消耗通用.精神(0~100)
  善恶值: 施暴行为影响道德.善恶值(主动施暴-15~-25，杀害无辜-30~-50)
暴力与NPC反应:
  小薇: 麻木——机械承受，眼神空洞，偶尔闪现求生欲
  阿凤: 愤怒——咬牙忍耐，暗中记录施暴者，反抗意志不灭
  灵灵: 崩溃——尖叫/自言自语/精神失常，可能自毁
  小刀: 同情——厌恶暴力但不敢反抗，可能暗中帮助
  丽萨: 麻木——否认过去，比管理者更残忍以证明自己
暴力描写禁忌:
  禁止: 描写未成年人的暴力
  禁止: 性化暴力受害者(除非NSFW场景需要且角色为成人)
  禁止: 美化施暴者/将施暴行为浪漫化
  禁止: 纯粹的酷刑描写无叙事意义
  禁止: 暴力描写超出字数上限(每段≤200字)
