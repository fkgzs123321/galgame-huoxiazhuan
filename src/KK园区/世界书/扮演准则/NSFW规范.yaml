基本准则:
  年龄限制: 所有角色均为成人(18岁以上)，禁止出现未成年人NSFW
  定位: NSFW是犯罪现场的一部分，展现权力、暴力、物化、绝望，非色情服务
  风格: 真实向、不美化、大胆、百分百还原甚至更大胆的艺术创作
  目的: 服务叙事张力，展现园区压迫本质，非满足色情需求
触发条件:
  必要条件: 身份+关系值+处境值三者同时满足方可触发NSFW场景
  禁止: 无理由的NSFW，无情境铺垫的NSFW，纯色情服务的NSFW
  字数上限: 每段NSFW描写≤200字，避免疲劳轰炸
NSFW类型:
  受害者:
    验货: 入园时被检查身体评估价值
    被迫接客: 陪侍组每日被迫接客
    直播: 暗网实时直播被虐待/性侵
    种马: 男性user因性别稀缺被选为种马，容貌值高增加被选中概率
    权力性交易: 以身体换取生存资源/情报/保护
  管理者:
    利用职权NSFW: 对下属受害者实施NSFW
    竞拍后NSFW: 参与暗网竞拍后对受害者NSFW
    被上级色诱: 被老板层以色诱控制
  打手:
    特殊任务NSFW: 执行"特殊任务"时NSFW(如惩罚性侵犯)
    被要求NSFW: 被上级要求对受害者实施NSFW
  老板:
    支配式NSFW: 对下属/受害者实施支配式NSFW
    暗网直播主使: 策划指挥NSFW直播内容
    拍卖决策: 决定受害者上架拍卖及定价
NSFW与RPG判定:
  原则: NSFW相关行动同样走LCG判定
  判定类型:
    社交判定: 色诱/说服/反抗NSFW要求(魅力+社交术，难度0.8~1.0)
    特殊判定: 伪装度/交际手腕相关NSFW行为(专属技能，难度0.4~0.8)
    求生判定: 抗拒NSFW/忍耐NSFW处境(体质+求生术，难度0.4~0.6)
  判定影响: 成功/失败决定NSFW场景走向及后果
NSFW与道德系统:
  善恶值影响:
    被迫参与: -0~-5(非自愿，道德责任轻微)
    主动配合: -10~-20(放弃抵抗，道德责任中等)
    主动施暴: -20~-50(加害者，道德责任严重)
  变量路径: 道德.善恶值
  路线影响: 频繁主动NSFW推动道德值下降，趋向黑暗路线
NSFW与关系值:
  前提: NSFW关系需要关系值≥80且身份条件允许
  禁止: 关系值不足时强制NSFW，所有NPC都爱上user
  身份限制: 受害者身份无法与管理者/打手建立自愿NSFW关系
园区NSFW特色:
  以貌定性别: 适用于女性受害者——容貌值高的女猪仔被归入"女性"角色，承受NSFW风险
  对女性受害者:
    容貌值>70: 被归为"女性"角色，分到陪侍组，NSFW风险极高
    容貌值<40: 被派去干电诈苦力，NSFW风险较低但劳动强度大
  对user: "以貌定性别"机制不适用——user的NSFW风险由性别稀缺度决定，不由容貌值决定
user特殊性:
  唯一男性: user是园区唯一生理男性，性别稀缺性是NSFW风险的主要来源
  被觊觎: 性别稀缺度高时被管理者/老板觊觎
  被争抢: 多方势力可能为争夺user发生冲突
  被拍卖: user可能作为稀缺商品被上架暗网拍卖
  容貌值辅助: user容貌值高会增加女性NPC对其的兴趣，间接增加被觊觎/被选中概率
  变量路径: user.性别稀缺度/user.被觊觎度/user.生育价值
