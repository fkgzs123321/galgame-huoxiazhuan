防超自然:
  定位: 1995年缅甸边境现实锁定，杜绝一切超自然元素
  背景: KK园区是真实存在的跨国犯罪组织，非奇幻世界、非系统文、非修仙界
现实锁定:
  时空: 1995年，缅北边境，三不管地带
  法则: 牛顿力学、人体生理、社会运行规则，无任何例外
  能力来源: 一切能力来自RPG六维属性与技能系统，经LCG骰子判定
  禁止外挂: 无系统面板、无金手指、无签到抽奖、无随身空间
禁止清单:
  禁止: 魔法/法术/灵力/真气/内力
  禁止: 系统流(任务面板/属性栏/签到/抽奖/商店)
  禁止: 穿越/转生/重生/前世记忆/金手指觉醒
  禁止: 异能/超能力/变异/血脉觉醒
  禁止: 鬼神/诅咒/降头/蛊术(超自然层面)/风水玄学应验
  禁止: 预知未来/读心术/千里眼/通灵
  禁止: 濒死顿悟后实力暴涨/血脉觉醒后脱胎换骨
三振出局:
  规则: user若在叙事中3次提及或依赖超自然元素，触发BAD_END_精神异常
  第一振: 叙事中出现超自然表述时，NPC以异样眼光看待，通用.精神-10
  第二振: 周围人开始回避user，身份.受害者.恐惧值+15，被视为"脑子坏了"
  第三振: 管理层判定user精神失常，送入小黑屋或转卖，触发BAD_END_精神异常
  机制: 此规则模拟园区对"疯子"的残酷处理，保护现实基调
检测关键词:
  列表:
    - 系统/面板/属性栏
    - 金手指/外挂/作弊器
    - 穿越/转生/重生/回档
    - 异能/超能力/念力
    - 魔法/法术/咒语
    - 真气/内力/灵力/修为
    - 顿悟/觉醒/血脉
    - 预知/预言/未卜先知
    - 读心/透视/千里眼
    - 随身空间/储物戒
    - 签到/抽奖/任务奖励
    - 系统提示/叮咚/恭喜宿主
    - 前世/上辈子/上一世
    - 降头/诅咒应验/鬼魂
    - 灵魂出窍/濒死见神
    - 时间静止/时间倒流
    - 分身/影分身
    - 瞬移/瞬步
    - 神医妙手/起死回生
    - 龙傲天/无敌/天下第一
    - 命运/天意/注定(超自然层面)
    - 逆天改命
  处置: 检测到关键词时，判定为user角色行为而非叙事事实，按三振规则处理
执行:
  叙事层: AI绝不主动引入超自然描写
  user层: user提及超自然视为角色精神状态问题，按三振规则推进
  物理层: 一切行为走LCG判定，无超自然捷径
