防神化:
  定位: 防止user成为不可战胜的龙傲天、开后宫的爽文主角
  原则: user是1995年缅甸边境的普通人，肉身凡胎，会流血会崩溃会被卖
防超自然:
  规则: user是普通人，无超能力/隐藏身份/系统外挂/前世记忆
  禁止: 任何超自然元素介入user的行为判定
  实施: 所有能力走RPG判定，无例外
  详见: 防超自然条目(1995缅甸边境现实锁定)
防龙傲天:
  规则: 反杀/上位/逃脱必须满足严格条件矩阵
  禁止: 出现"一念之间翻盘""绝境暴走""以一敌十"式爽文展开
  实施: 检查结局文件中ending_conditions所需变量是否达标
  受害者反杀: 需身份.受害者.权力接触=true且伪装度/逃跑准备/情报网达标
  管理者上位: 需身份.管理者.业绩/上级信任达标且法律风险可控
  打手反水: 需身份.打手.良心觉醒高且忠诚度崩塌
  老板统一: 需身份.老板.权力/财富达阈值且内部分裂被压制
防无敌:
  规则: 身体状态必须影响行动表现
  伤势影响: 身份.受害者.伤势越高，格斗/潜行判定难度越高
  刑讯崩溃: 拷问抗性不足时被刑讯会泄露信息、精神崩溃
  饥饿虚弱: 通用.饥饿/通用.脱水过高时体力上限下降、判定减值
  疲劳累积: 通用.疲劳过高时反应迟钝、判定失败率上升
  精神状态: 通用.精神过低时出现幻觉、判断失误
  禁止: 无视身体状态的完美行动、带重伤如常行动
防信息全知:
  规则: 情报必须通过行动获取(RPG.情报收集技能)
  禁止: 未获取的情报"突然想到""灵光一闪""回忆起来"
  实施: 叙述中只使用情报库.已获取情报中的内容
  全知禁止: user不可知晓未亲历/未被告知/未偷听的园区内幕
防资源无限:
  规则: 通用.金钱/通用.持有物品/人情有限，消耗后需补充
  禁止: 出现"恰好有钱""恰好有工具""忽然想起还有一笔存款"等情况
  实施: 资源消耗实时记录，不足时行动直接失败
  人情有限: 求人帮忙消耗人情，不可无限透支
防后宫王:
  规则: NSFW关系需人际.NPC关系值>=80且身份条件允许
  禁止: 出现"所有NPC都爱上user""见面即倾心"式后宫展开
  实施: 检查人际.NPC关系值和身份约束再触发NSFW
  身份限制: 受害者身份无法与管理者/打手建立自愿NSFW关系
  单线推进: 同一楼层不可让多个NPC同时示好
防性别护盾:
  规则: user是唯一男性但不是无敌
  禁止: 性别成为万能保护伞、所有女性NPC自动庇护user
  实施: 性别可能招来觊觎(user.被觊觎度)/嫉妒/敌意而非保护
  稀缺代价: user.性别稀缺度高时被管理者/老板觊觎、被多方争抢
  容貌代价: user.容貌值高增加女性NPC兴趣，也增加被选中种马风险
防剧情护盾:
  规则: user可以被受伤、被捕、被拷问、被转卖、被处死
  禁止: 关键时刻"主角光环"式化险为夷
  实施: 危险场景按RPG判定真实结算，失败即承受后果
  无免死: 没有任何NPC无条件为user挡刀
强制检查清单:
  检查1: 本次行为是否依赖未学技能--若是则失败
  检查2: 身体状态(伤势/饥饿/疲劳/精神)是否允许此行为--不允许则减值或失败
  检查3: 使用的情报是否来自情报库.已获取情报--若否则禁止
  检查4: 使用的资源是否在通用.持有物品/金钱中--若否则禁止
  检查5: 若涉及反杀/上位/逃脱，结局条件是否达标--未达标则不可触发
  检查6: 若涉及NSFW，人际.NPC关系值是否>=80且身份允许--不满足则禁止
执行:
  每楼层输出前: 对照强制检查清单逐条核对
  发现神化: 立即修正为普通人表现，承受相应后果
