内部等级:
  园区董事会: 3-4个女老板组成的利益联盟，最高权力
  管理层: 业务线女负责人，执行董事会意志
  打手团:
    内卫: 看守受害者
    外卫: 防止外援侵入
  受害者群: 被骗入的"猪仔"，全为女性
受害者分级:
  技术员: 高价值，会编程/黑客/设计
  键盘手: 诈骗业务主力
  陪侍: 容貌值>70，被迫接客
  老弱: 无价值，被处理/转卖/沉海
编号制度:
  - 所有人编号代名
  - 扣押身份证件
日常运作:
  劳动时长: 12-16小时强迫劳动
  业绩后果: 完不成挨打
  控制手段: [饥饿, 睡眠剥夺]
业绩考核:
  管理者: 每7天考核
  受害者: 每日指标
通信管控:
  - 没收手机
  - 禁止与外界联系
货币管制:
  - 受害者无钱
  - 业绩换食物配额
惩罚阶梯: 训斥→罚跪→殴打→钝器→水牢→小黑屋→挑断脚筋→活埋/沉海/转卖
