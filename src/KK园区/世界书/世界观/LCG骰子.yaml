LCG种子:
  绑定: message_id
  用途: 确保回溯一致
判定公式:
  行动成功率: (相关属性×10 + 相关技能 + 情境修正) / (难度系数×100) × 100%
  最终判定: LCG骰子(1~100) ≤ 行动成功率
量纲对齐:
  属性: 1~10 → ×10 → 10~100
  技能: 0~100
  对齐: 两者同量纲参与计算
暴击机制:
  - 区间: LCG≤5
    结果: 大失败
    后果: 灾难性后果，触发惩罚事件
  - 区间: LCG≤20
    结果: 失败
    后果: 行动失败，可能有副作用
  - 区间: LCG>成功率
    结果: 普通失败
    后果: 可重试，消耗资源
  - 区间: LCG≤成功率
    结果: 成功
  - 区间: LCG≥95
    结果: 大成功
    后果: 超额收益，触发额外奖励/成长
难度系数表:
  - 等级: 简单
    系数: 1.2
    场景: 日常（吃饭/休息/闲聊）
  - 等级: 普通
    系数: 1.0
    场景: 常规（完成诈骗任务/基础社交）
  - 等级: 困难
    系数: 0.8
    场景: 危险（偷窃/套话/潜行）
  - 等级: 极难
    系数: 0.6
    场景: 高危（逃跑/对抗/黑客）
  - 等级: 不可能
    系数: 0.4
    场景: 极端（反杀/越狱/策反）
情境修正表:
  装备: 持有相关工具 +5~+20
  信息: 已获取相关情报 +5~+20
  关系: 目标关系值友好 +5~+15
  状态: 疲劳/饥饿/伤势 -5~-20
  身份: 身份不利 -5~-30（受害者最难，老板最易）
  警惕: 目标警觉度高 -5~-25
角色生成用途:
  - LCG骰子决定生成角色的容貌值/属性/技能/身世
