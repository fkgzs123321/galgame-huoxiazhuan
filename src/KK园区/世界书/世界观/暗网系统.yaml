业务线: 暗网犯罪——人口拍卖/被迫直播/贩卖网络/非法交易/猎杀直播
人口拍卖:
  流程: 受害者拍照/录像上传暗网→全球买家竞价→成交转交
  定价因素: 容貌值/技能等级/稀缺度
  user特殊性: 唯一生理男性，稀缺品，竞价高于普通受害者
被迫直播:
  内容: 实时虐待/性侵直播
  地位: 暗网最赚钱频道
  收入影响: 观看人数/打赏/订阅→园区收入
  掌管者: 毒蛇
贩卖网络:
  买家类型: [富豪, 赌场, 妓院, 私人收藏者]
  转卖后: 命运未知
非法交易:
  类型: [毒品, 武器, 器官(活体摘取)]
  集散地: 黑市巷
  器官来源: 白大褂负责活体摘取
猎杀直播:
  内容: 富豪付费观看"猎杀"——受害者释放到围猎区被追杀
  定位: 最残忍的娱乐
暗网角色:
  毒蛇: 业务总控
  老鼠: 情报贩子
  白大褂: 器官来源
  买家网络: 全球犯罪市场
暗网经济:
  机制: 供需波动/稀缺涨价/竞拍机制/直播收益
  详见: 暗网经济系统条目
user与暗网:
