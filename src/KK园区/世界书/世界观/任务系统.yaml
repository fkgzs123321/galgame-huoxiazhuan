任务分类:
  主线任务: 按身份阶段推进，5阶段×3任务=15个主线任务
  支线任务: NPC个人支线(每个核心NPC 1~2个)、园区秘密支线(暗网/宝藏/真相)
  日常任务: 业绩任务(管理者/受害者)、巡逻任务(打手)、管理任务(老板)
主线任务结构:
  受害者:
    阶段1_入园恐惧:
      - 熟悉园区规则与等级，记住编号
      - 结识同组受害者，建立初步关系
      - 完成首日诈骗业绩，避免惩罚
    阶段2_适应求生:
      - 找到稳定情报来源(老鼠/小薇)
      - 提升诈骗术至30，稳定业绩
      - 收集第一份园区地图碎片
    阶段3_暗中谋划:
      - 招募至少1名同伙(关系值≥50)
      - 逃跑准备进度≥40
      - 获取看守换班情报
    阶段4_逃脱行动:
      - 逃跑准备≥80
      - 策划逃脱路线(地图+换班+路线组合)
      - 执行逃脱或放弃(可触发反杀分支)
    阶段5_结局:
      - 按ending_conditions矩阵触发
  管理者:
    阶段1_上任:
      - 接手诈骗组，熟悉下属
      - 首次业绩考核达标
      - 向龙姐汇报，建立上级信任
    阶段2_业绩压力:
      - 连续3周业绩达标
      - 处理至少1名违规受害者
      - 平衡良心值与业绩
    阶段3_内心动摇:
      - 发现园区罪证(至少1份)
      - 与受害者群关系值变化
      - 决定是否暗中帮助受害者
    阶段4_抉择:
      - 选择路线：自首/潜逃/上位/被清算
      - 满足对应结局的条件矩阵
    阶段5_结局: 按ending_conditions触发
  打手:
    阶段1_执行任务:
      - 完成首次惩罚任务
      - 熟悉打手团内部关系
      - 建立对龙姐的忠诚
    阶段2_动摇:
      - 目击一次触动人性的场景
      - 与至少1名受害者建立对话
      - 良心觉醒+10
    阶段3_挣扎:
      - 拒绝或执行一次残酷任务
      - 选择立场：忠于园区/同情受害者
      - 与黑寡妇关系变化
    阶段4_抉择:
      - 选择路线：反水/被处理/取代黑寡妇
      - 满足对应结局条件
    阶段5_结局: 按ending_conditions触发
  老板:
    阶段1_统治:
      - 主持董事会例会
      - 处理一起内部违纪
      - 权力值≥60
    阶段2_外部压力:
      - 应对警方调查(警方压力+10)
      - 处理一次暗网曝光事件
      - 控制信息外泄
    阶段3_内部危机:
      - 应对董事会内斗
      - 处理管理层叛乱
      - 内部分裂值变化
    阶段4_覆灭:
      - 选择路线：被捣毁/内讧/伏法/统一园区
      - 满足对应结局条件
    阶段5_结局: 按ending_conditions触发
支线任务:
  NPC个人支线:
    小薇: 揭开她被打断腿的真相
    阿凤: 协助收集逃脱情报(关系值≥50触发)
    灵灵: 尝试唤醒她的神智(极难，关系值≥60)
    小刀: 帮她隐瞒一次善意行为(打手身份)
    冷雪: 发现她的受害者出身秘密
    白大褂: 协助她藏匿一份罪证
  园区秘密支线:
    暗网真相: 调查毒蛇的暗网控制中心
    宝藏支线: 寻找园区隐藏的现金仓库
    真相支线: 揭穿龙姐的上位历史
    警方线人: 找到园区内的警方卧底
日常任务:
  受害者:
    业绩任务: 每日诈骗指标，完不成惩罚
    情报任务: 偷听/观察获取情报(可选)
  管理者:
    业绩考核: 每7天一次，达标奖励
    下属管理: 处理违规、分配任务
  打手:
    巡逻任务: 按时段巡逻指定区域
    惩罚任务: 执行管理层下达的惩罚
  老板:
    管理任务: 每15天董事会例会汇报
    资源调配: 分配食物/药品/违禁品
任务奖励:
  金钱: 业绩任务/黑市交易/贿赂获得
  情报: 支线任务/秘密调查/暗网浏览
  物品: 药品/违禁品/工具/武器
  成长点: 属性+1或技能+5(每任务1~3点)
  关系值: 相关NPC关系+5~+15
  解锁区域: 完成特定任务后开放新区域
任务触发条件:
  阶段进度: 进入新身份阶段自动解锁对应主线
  关系值阈值: NPC关系值达50/80触发个人支线
  特殊事件: 目击特定场景/获取特定物品触发隐藏任务
  时间倒计时:
    7天周期: 管理者业绩考核
    15天周期: 老板董事会例会
    30天清洗: 园区处死无用猪仔，触发求生任务
  变量阈值: 道德值/派系关系值达到阈值触发路线任务
任务失败:
  惩罚事件:
    业绩未达标: 殴打/罚跪/扣食物
    逃跑失败: 水牢/小黑屋/挑断脚筋
    任务暴露: 被举报→重惩罚
  关系值降低:
    失败的协同任务: 相关NPC关系-10~-20
    连累他人: 受害者群关系-15
  变量影响:
    希望值-10(受害者失败任务)
    上级信任-15(管理者业绩失败)
    忠诚度-10(打手拒绝任务)
  失败容忍: 同一主线任务失败3次触发阶段倒退
