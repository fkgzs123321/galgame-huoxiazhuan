派系列表:
  - 园区董事会
  - 管理层
  - 打手团
  - 受害者群
  - 暗网网络
派系关系值:
  范围: -100~100
  变量路径:
    园区董事会: 派系.园区董事会
    管理层: 派系.管理层
    打手团: 派系.打手团
    受害者群: 派系.受害者群
    暗网网络: 派系.暗网网络
  阶段: 敌对(<-30)/警惕(-30~0)/中立(0~20)/友好(20~50)/信任(50~80)/亲密(>80)
派系关键成员:
  园区董事会: [龙姐, 玫瑰, 毒蛇, 黑寡妇]
  管理层: [冷雪, 媚娘, 铁姨]
  打手团: [黑寡妇(兼), 阿烈, 影子, 小刀]
  受害者群: [小薇, 阿凤, 灵灵, 丽萨]
  暗网网络: [毒蛇(兼), 老鼠, 白大褂]
派系固有关系:
  园区董事会:
    内部: 龙姐vs玫瑰vs毒蛇三足鼎立，表面合作暗地内斗
    对管理层: 支配/利用
    对打手团: 通过黑寡妇控制
    对受害者群: 视为货物
    对暗网网络: 毒蛇兼任，利益绑定
  管理层:
    对董事会: 服从但暗怀野心
    对打手团: 业务执行vs暴力执行，常有摩擦
    对受害者群: 压迫/剥削
    对暗网网络: 业务合作(陪侍/直播/拍卖)
  打手团:
    对董事会: 效忠龙姐(通过黑寡妇)
    对管理层: 执行命令但看不起"坐办公室的"
    对受害者群: 暴力镇压，少数同情(小刀)
  受害者群:
    对管理层: 仇恨/恐惧
    对打手团: 恐惧
    对董事会: 绝望中恨意
    内部: 赛马机制挑拨互斗，但有隐秘互助
  暗网网络:
    独立: 只认钱，不站队
    对董事会: 利益合作(毒蛇兼任)
    对受害者群: 视为商品
    对管理层: 业务交易
站队机制:
  行动影响:
    帮助受害者: 受害者群+10、管理层-5
    忠于龙姐: 园区董事会+10
    帮助玫瑰: 玫瑰派系+10、龙姐派系-5
    暗中破坏业绩: 管理层-15、受害者群+5
    贿赂打手: 打手团+5~+10
    与老鼠交易: 暗网网络+5
    协助逃脱: 受害者群+20、打手团-20、园区董事会-15
  站队后果:
    派系关系剧变: 关键事件触发±15~±30
    多面间谍风险: 同时维护多派系关系会触发怀疑
    中立代价: 不站队也无法获得任何派系资源
派系福利:
  解锁阈值: 关系值≥50
  园区董事会福利:
    - 情报：董事会内斗秘密
    - 保护：高层庇护免受打手骚扰
    - 任务：董事会专属委托
    - 物品：违禁品/特权通行证
  管理层福利:
    - 情报：业绩考核内幕
    - 保护：下属打手不再刁难
    - 任务：管理岗位委托
    - 物品：食物配额提升
  打手团福利:
    - 情报：巡逻路线/换班时间
    - 保护：免受打手暴力
    - 任务：打手团内部任务
    - 物品：武器/电击棒
  受害者群福利:
    - 情报：园区秘密/逃脱线索
    - 保护：受害者群互助
    - 任务：协助同伴任务
    - 物品：藏匿的食物/药品
  暗网网络福利:
    - 情报：暗网密码/买家信息
    - 保护：暗网身份掩护
    - 任务：暗网交易委托
    - 物品：违禁品/加密设备
派系冲突:
  user卷入方式:
    被动卷入: 身份决定初始派系倾向(受害者→受害者群、管理者→管理层)
    主动站队: 行为选择影响派系关系
    派系拉拢: 关系值高时被派系主动拉拢
  冲突场景:
    董事会内斗: 龙姐vs玫瑰vs毒蛇，user选边站
    管理层vs打手团: 业务命令冲突，user表态
    受害者群vs管理层: user是否帮助受害者
    暗网利益冲突：毒蛇vs老鼠，情报真伪博弈
  后果:
    选边站: 获得支持方福利，失去敌方信任
    保持中立: 无派系资源，但也不树敌
    双面间谍: 高风险高回报，被发现则多派系关系-30
派系关系衰减:
  长期不互动: 每天衰减-1~-2
  敌对行为: 关系值骤降-15~-30
  背叛行为: 关系值清零并转为敌对
派系与结局联动:
  老板_内讧结局: 园区董事会关系<-30
  打手_反水结局: 受害者群关系≥50
  受害者_反杀上位: 需要董事会内部支持
  老板_统一园区: 所有派系关系≥50或压制
