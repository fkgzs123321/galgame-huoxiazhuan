善恶值:
  范围: -100(极恶)~+100(极善)
  初始: 0
  变量路径: 道德.善恶值
行为影响:
  善行:
    帮助受害者: +5~+15
    分享食物/药品: +5~+10
    暗中保护: +10~+15
    传递情报给外界: +15~+25
    救助受害者(重大): +20~+30
    协助逃脱: +20~+30
  恶行:
    伤害受害者: -10~-20
    举报同伙: -5~-15
    执行残酷任务: -10~-20
    主动施暴: -15~-25
    出卖受害者: -20~-30
    杀害无辜: -30~-50
  中性行为:
    完成业绩任务: 0(生存必需)
    贿赂/交易: 0(灰色地带)
    观望不作为: 0
道德值区间与路线:
  极恶路线:
    区间: "<-50"
    解锁: 黑暗路线(反杀上位/黑化结局)
    NPC反应: 恐惧user，关系值友好者疏远
    可触发结局:
      受害者_D_反杀上位: 道德值<-50
      打手_C_取代黑寡妇: 道德值<-50
      老板_D_统一园区: 道德值<-70
  灰色地带:
    区间: "-50~0"
    NPC反应: 警惕user，保持距离
    无路线解锁: 中立过渡区间
  中立区间:
    区间: "0~50"
    NPC反应: 正常对待
    默认区间: 大多数user所处状态
  光明路线:
    区间: ">50"
    解锁: 光明路线(自首/被救结局)
    NPC反应: 信任user，愿意合作
    可触发结局:
      受害者_E_被救: 道德值≥30
      管理者_A_自首: 道德值≥30
      打手_A_反水: 道德值≥20
道德值机制:
  不强制向善: 允许user选择黑暗路线
  道德值变化驱动: 行为事件直接触发，非AI主观判断
  道德值影响结局: 部分结局需要道德值阈值(见ending_conditions矩阵)
  道德值影响NPC态度:
    受害者群: 按道德值调整初始反应(善良者+10，邪恶者-20)
    管理层: 中立看待道德值，只看业绩
    打手团: 邪恶者获得认同(关系+5)，善良者被怀疑
  道德值与派系关系联动:
    善行→受害者群+5、管理层-3
    恶行→受害者群-10、打手团+3(短期)
道德值显示:
  状态栏: 实时显示当前善恶值
  路线提示: 跨越±50阈值时提示路线解锁
道德值防滥用:
  单次行为上限: ±30(防止单事件剧变)
  日变化上限: ±50(防止刷道德值)
  路线锁定: 进入结局阶段后道德值变化无效
