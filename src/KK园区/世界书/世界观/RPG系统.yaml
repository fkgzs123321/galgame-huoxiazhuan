属性体系: 三层（六维基础属性/生存属性/技能系统）
六维基础属性:
  范围: 1~10
  开局: 分配30点
  成长上限: 10
  属性:
    力量: 格斗/搬运
    敏捷: 潜行/逃跑
    体质: 抗打击/恢复
    智力: 诈骗/技术
    感知: 观察/情报
    魅力: 社交/说服
  区分: 魅力=主动社交能力；user.容貌值=被动外观资本
生存属性:
  范围: 0~100
  机制: 实时消耗与恢复
  属性:
    体力: 行动消耗，休息恢复
    精神: 当前精神状态，可恢复
    饥饿: 进食降低，越高越饿
    脱水: 饮水降低，越高越渴
    疲劳: 累计消耗，睡眠恢复
  区分: 精神=当前状态(可恢复)；身份.受害者.希望值=长期信念
技能系统:
  范围: 0~100
  机制: 使用成长
  通用技能:
    诈骗术: 键盘手效率/业绩
    格斗术: 暴力对抗/自保
    潜行术: 偷听/偷窃/潜行
    社交术: 拉拢/套话/说服
    技术术: 黑客/设备操作/暗网
    求生术: 生存/耐力/抗拷问
  园区专属技能:
    触发: 需学习事件
    定位: 通用技能的高级应用，基于两个通用技能
    伪装术: 基于潜行+社交，表面顺从/不被怀疑
    情报收集: 基于感知+社交，获取园区秘密
    逃脱术: 基于敏捷+技术，开锁/翻墙/躲搜查
    交际手腕: 基于社交+魅力，贿赂/拉拢/借力
    暗网操作: 基于技术+智力，暗网交易/信息获取
    拷问抗性: 基于体质+求生，被刑讯时不泄露信息
