适用范围: 园区内所有女性NPC(含随机生成的路人受害者/打手/管理者)
维度字段:
  基本信息:
    字段: [姓名, 年龄, 籍贯, 身世来历, 入园原因, 入园时间, 编号]
  容貌维度:
    字段: [五官评分(1~10), 身材评分(1~10), 肤色, 发色, 瞳色, 特殊标记(疤痕/纹身/胎记), 整体容貌值(0~100)]
    容貌值定位:
      - 区间: "<40"
        定位: 男性角色(管理者/打手)
      - 区间: "40~70"
        定位: 中性
      - 区间: ">70"
        定位: 女性角色(受害者/玩物)
  身体维度:
    字段: [身高(cm), 体重(kg), 三围, 罩杯, 体型(纤细/匀称/丰满/壮硕), 体态特征, 健康状态]
  性格维度:
    字段: [底色, 主色调(2~3个), 修饰(1~2个), 行为倾向, 口头禅, 禁忌话题]
  能力维度:
    六维属性: [力量, 敏捷, 体质, 智力, 感知, 魅力]
    技能等级: [诈骗, 格斗, 潜行, 社交, 技术, 求生]
    特长: 自定义
  园区属性:
    字段: [价值评级(S/A/B/C/D), 分组(键盘手/陪侍/打手/后勤/技术), 处境值(0~100), 编号, 当前状态]
  NSFW维度:
    字段: [经验值, 敏感部位, 性癖, 承受度, 开发程度, 禁忌, 初次经历描述]
  关系维度:
    字段: [对user态度, 对园区态度, 阵营倾向(顺从/隐忍/抗争/野心), 可攻略性]
  成长维度:
    字段: [可成长属性, 可学习技能, 潜在发展方向, 隐藏特质]
  剧情维度:
    字段: [个人支线触发条件, 关键事件, 结局可能性]
生成方式:
  基础: LCG骰子随机生成
  修正: 身份模板修正
  自定义: user选择可覆盖
生成时机:
  - 新场景需要新角色时
  - 暗网拍卖
  - 陪侍接客
  - 受害者入场
  - 打手巡逻
受害者多样性保障:
  容貌值分布:
    - 概率: 70%
      区间: ">70"
      定位: 漂亮的，被当"女性"角色
    - 概率: 20%
      区间: "40~70"
      定位: 中性，键盘手/技术组
    - 概率: 10%
      区间: "<40"
      定位: 被当"男性"，管理者/打手预备
  身世来历库:
    - 求职被骗
    - 网友欺骗
    - 亲戚贩卖
    - 还赌债
    - 被拐卖
    - 海外务工骗
    - 网络诈骗
    - 绑架
    - 被男友卖
    - 被父母卖
    - 黑中介
    - 假招聘
    - 还债自愿
    - 被骗留学
    - 旅游被迷晕
    - 求职面试陷阱
  性格组合库:
    底色池: [麻木, 坚韧, 崩溃, 算计, 恐惧, 隐忍, 绝望, 狡黠, 温顺, 倔强]
    主色调池: [认命, 抗争, 沉默, 讨好, 警惕, 自毁, 麻木, 希望, 复仇, 逃避]
    修饰池: [偶尔清醒, 隐藏善良, 病态适应, 间歇崩溃, 冷幽默, 念旧, 护幼]
  去重机制:
    指纹: 容貌值±5 + 身世 + 底色
    规则: 重复则LCG重投，最多3次后强制接受
