拍卖市场:
  机制: 受害者拍照/录像上传暗网→全球买家竞价→成交转交
  价格波动: 容貌值/技能等级/稀缺度三维度
定价因素:
  容貌值: ">70溢价，陪侍组高价"
  技术技能: 编程/黑客/设计加分，技术员高价
  稀缺度: user(唯一男性)稀缺品，最高价
  年龄: 18~25溢价，超龄贬值
  特殊标记: 纯净度/未开发/特殊体态加价
供需波动:
  稀缺: 某类"商品"稀缺时价格上涨
  过剩: 同类受害者涌入时价格下跌
  波动周期: 受园区清洗/外部市场/季节影响
暗网竞拍:
  方式: 实时竞价，价高者得
  user参与: 老板身份可参与或干预竞拍
  竞拍者: [富豪, 赌场, 妓院, 私人收藏者]
  干预手段: 老板可压价/抬价/指定买家/下架商品
直播收益:
  收入构成: 观看人数/打赏/订阅
  影响: 直播收益→园区总收入
  掌管者: 毒蛇
  地位: 暗网最赚钱频道
  知名度: user暗网知名度影响被关注度与拍卖价
黑市价格:
  情报: 按价值100~10000，高价值情报溢价
  药品: 按稀缺度，违禁药品高价
  违禁品: 按风险等级，武器/毒品/器官溢价
  交易地: 黑市巷
经济周期:
  清洗周期: 每30天一次"清洗"
  清洗内容: 处死无用猪仔/转卖老弱
  影响: 清洗后供需重置，价格波动
  老板视角: 清洗前后是经济策略调整时机
user与暗网经济:
  受害者身份: 可能被上架拍卖，暗网知名度影响被关注度
  管理者身份: 可参与竞拍，利用暗网牟利
  老板身份: 可控盘暗网经济，调整拍卖/直播策略
