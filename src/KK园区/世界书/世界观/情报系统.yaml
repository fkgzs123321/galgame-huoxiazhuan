情报类型:
  园区地图: 建筑/通道/盲区/出口分布
  看守换班表: 各岗位换班时间/间隙/人员
  暗网密码: 暗网平台登录/交易/后台密码
  逃脱路线: 可行路径/所需工具/风险点
  NPC秘密: 个人弱点/把柄/隐藏身世/真实立场
  罪证: 文件/录音/物证/人证，用于证据链
  买家信息: 暗网买家身份/出价/偏好/联系方式
情报来源:
  偷听: 潜行术判定，风险高
  套话: 社交术判定，需关系值基础
  贿赂: 交际手腕+金钱，铁姨/老鼠可被收买
  黑市购买: 金钱交易，黑市巷老鼠处
  暗网浏览: 暗网操作判定，需密码或权限
  观察: 感知属性判定，被动获取
情报真伪:
  老鼠: 30%假情报，双面间谍风险
  可信度排序: 白大褂>小薇>老鼠
  白大褂: 被迫服务，内心痛苦，情报较真
  小薇: 认命知密，情报可靠但不敢多说
  验证机制: 可信来源交叉验证，存入待验证情报数组
情报组合:
  规则: 多条情报可组合出完整线索
  逃脱方案: 地图+换班表+路线→可行逃脱计划
  罪证链: 多份罪证组合→完整证据链
  买家网络: 多条买家信息→贩运网络全貌
情报时效:
  换班表: 每天变化，需当日获取
  暗网密码: 每周更换，有时效限制
  NPC秘密: 永久有效，但NPC状态可能变
  园区地图: 长期有效，建筑变动少
  逃脱路线: 中期有效，看官认知会调整
情报保管:
  存储: 情报库.已获取情报数组
  字段: 类型/内容/来源/真伪/时效
  待验证: 存入情报库.待验证情报数组
  风险: 被发现持情报会触发惩罚
情报价值:
  单条: 影响行动成功率+5~+20情境修正
  组合线索: 解锁支线/逃脱方案/证据链
  完整证据链: 可触发警方捣毁结局(老板身份威胁)
  高价值情报: 暗网买家信息/董事会罪证/龙姐把柄
