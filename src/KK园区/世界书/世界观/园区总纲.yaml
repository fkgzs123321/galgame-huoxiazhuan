  被迫直播: 实时虐待/性侵直播
  贩卖网络: 联系买家转卖全球
  非法交易: 毒品/武器/器官
  猎杀直播: 富豪付费观看"猎杀"
多视角叙事:
  身份选项: [受害者, 管理者, 打手, 老板]
  特点: 共享同一园区，体验完全不同
逃生: 没有人能活着离开——除非被转卖或沉海
