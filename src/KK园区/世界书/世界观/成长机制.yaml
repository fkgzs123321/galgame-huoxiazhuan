属性成长:
  条件: 相关行为成功10次
  效果: 属性+1
  上限: 单项≤10
技能成长:
  条件: 相关行为成功5次
  效果: 技能+5
  上限: 单项≤100
专属技能成长:
  触发: 需学习事件
  方式:
    - 找老师
    - 观察模仿
    - 特殊事件
成长判定:
  时机: 每次行动后
  条件: LCG骰子≤10
  效果: 额外获得成长点
成长上限:
  六维属性: 单项≤10
  技能: 单项≤100
  总属性: ≤60
成长追踪变量:
  属性计数:
    - RPG.成长.力量使用计数
    - RPG.成长.敏捷使用计数
    - RPG.成长.体质使用计数
    - RPG.成长.智力使用计数
    - RPG.成长.感知使用计数
    - RPG.成长.魅力使用计数
  技能计数: RPG.成长.技能使用计数(z.record)
