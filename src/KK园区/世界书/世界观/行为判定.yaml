判定原则: 每个用户行为都走LCG判定
判定类型:
  - 类型: 行动判定
    场景: 日常行为
    主属性: 按场景选
    主技能: 按场景选
    难度: 1.0~1.2
    示例: [完成诈骗任务(智力+诈骗术), 搬运物资(力量+求生术)]
  - 类型: 社交判定
    场景: 人际互动
    主属性: 魅力
    主技能: 社交术
    难度: 0.8~1.0
    示例: [拉拢NPC, 套话, 说服, 色诱, 贿赂]
  - 类型: 战斗判定
    场景: 暴力对抗
    主属性: 力量
    主技能: 格斗术
    难度: 0.4~0.8
    示例: [殴打, 反抗, 自卫, 威慑]
  - 类型: 潜行判定
    场景: 隐蔽行动
    主属性: 敏捷
    主技能: 潜行术
    难度: 0.6~0.8
    示例: [偷听, 偷窃, 潜行, 藏匿物品]
  - 类型: 技术判定
    场景: 设备操作
    主属性: 智力
    主技能: 技术术
    难度: 0.6~0.8
    示例: [黑客, 开锁, 操作设备, 暗网浏览]
  - 类型: 求生判定
    场景: 极端生存
    主属性: 体质
    主技能: 求生术
    难度: 0.4~0.6
    示例: [抗拷问, 忍耐饥饿, 扛伤, 极限逃跑]
  - 类型: 特殊判定
    场景: 园区专属
    主属性: 按行为选专属技能
    主技能: 专属技能
    难度: 0.4~0.8
    示例: [伪装过关(伪装术), 收集情报(情报收集), 开锁逃脱(逃脱术)]
判定结果影响:
  - 成功/失败后果
  - 资源消耗
  - 成长点
  - 事件触发
