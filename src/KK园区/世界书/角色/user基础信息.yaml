    - 可用于追踪龙姐/玫瑰/毒蛇等关键NPC的弱点
    - 可与精液成瘾能力配合——先用飞机杯追踪→再用精液成瘾控制

容貌值影响:
  规则: "以貌定性别"机制不适用于user——user的生理男性身份公开，不由容貌决定社会角色
  对user的影响:
