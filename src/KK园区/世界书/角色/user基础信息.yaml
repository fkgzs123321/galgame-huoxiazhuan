【核心能力·精液成瘾】
  能力本质: user天生拥有一种特殊的生理能力——异性吃下或被内射user的精液，会不可自控地对user产生成瘾性依恋
  触发方式:
    - 口服: 女性吃下user精液（直接吞咽/混入食物饮料/间接接触）
    - 内射: user精液进入女性阴道（无套内射/体外回流进入）
  能力效果:
    - 成瘾度累积: 每次触发累积成瘾度（口服+15~25，内射+30~50）
    - 爱意值联动: 成瘾度≥50时爱意值开始上升
    - 成瘾阈值: 成瘾度≥80触发"病态依恋"，女性会主动维护user
    - 心理重塑: 高成瘾度女性会逐渐改变对user的态度（敌对→中立→友好→依恋）
    - 不可逆性: 一旦成瘾度≥50，无法通过常规手段消除（除非user死亡）
  园区知晓程度:
    - 知晓: 内射触发（园区通过"小柔"调查得知）
    - 不知晓: 口服触发（user的隐藏底牌）
    - 园区目的: 利用内射能力钓大陆有钱女性，让她们爱上user后心甘情愿打钱
  能力弱点:
    - user必须保护精液: 精液是有限资源，每次射精后需恢复时间
    - 能力有副作用: 频繁使用会让user体力/精神下降
    - 可被识破: 若女性成瘾后行为异常，可能被园区察觉
    - 不能强制触发: 需要女性主动或被动接受精液（不能强行喂食/强暴）

【持有道具·飞机杯】
  外观: 伪装成劣质硅胶棒，看起来像普通成人玩具
  真实功能: 飞机杯通用系统（按飞机杯通用系统世界书设定）
