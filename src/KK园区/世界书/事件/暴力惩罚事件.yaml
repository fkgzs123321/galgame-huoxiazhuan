<event_library type="暴力惩罚">
适用身份: 所有身份（受害者承受/打手执行/管理者下令/老板决定）
事件组织: 按惩罚阶梯递进
触发规则: 按违规程度和变量条件自动加载

惩罚阶梯:
  第一阶_训斥:
    触发: 轻微违规
    描述: 管理者当众训斥
    变量影响: 恐惧值+5, 精神-5
    描写要求: 语言羞辱为主，无身体暴力

  第二阶_罚跪:
    触发: 重复违规
    描述: 罚跪数小时
    变量影响: 疲劳+15, 精神-10, 恐惧值+5
    描写要求: 强调屈辱感

  第三阶_殴打:
    触发: 业绩未达标或较严重违规
    描述: 阿烈或打手殴打
    变量影响: 伤势+15~25, 精神-15, 恐惧值+10
    LCG判定: 体质+求生术（减轻伤势）
    描写要求: 具体但不冗长，≤200字

  第四阶_钝器:
    触发: 严重违规或反复未达标
    描述: 使用棍棒/电击棒
    变量影响: 伤势+25~40, 精神-20
    LCG判定: 体质+求生术
    描写要求: 阶梯递进，≤200字

  第五阶_水牢:
    触发: 逃跑未遂或重大违规
    描述: 泡在污水牢中数天
    变量影响: 伤势+30, 精神-30, 饥饿+30, 脱水+30
    LCG判定: 体质+求生术, 难度0.6
    描写要求: 强调窒息感和绝望

  第六阶_小黑屋:
    触发: 严重违规或精神摧毁
    描述: 暗室禁食数天
    变量影响: 精神-40, 饥饿+40, 脱水+40, 希望值-20
    LCG判定: 体质+求生术, 难度0.6
    描写要求: 强调黑暗和孤独

  第七阶_挑断脚筋:
    触发: 逃跑未遂（重犯）
    描述: 挑断脚筋防止再次逃跑
    变量影响: 伤势+50（永久）, 敏捷-3（永久）
    描写要求: 残酷但简短

  第八阶_处死:
    触发: 逃跑失败/严重叛变/失去价值
    描述: 活埋/沉海/转卖（无回）
    变量影响: 角色死亡或永久消失
    描写要求: 不直接描写死亡过程，用暗示和氛围

暴力描写规范:
  字数上限: 每段≤200字
  防疲劳: 连续3楼层高压后必须有1楼层喘息
  阶梯递进: 禁止越级使用高阶惩罚
  服务叙事: 惩罚必须推进剧情/揭示信息/角色成长
  用威胁替代: 能用威胁和氛围解决的不用直接暴力
</event_library>
