<event_library type="暗网">
适用身份: 所有身份（按身份触发不同视角）
事件组织: 按暗网业务类型分组
触发规则: 按身份和暗网业务状态自动加载

人口拍卖事件:
  - 名称: 受害者上架
    触发: 毒蛇决定拍卖某受害者
    描述: 受害者被拍照录像上架暗网拍卖平台
    身份视角:
      受害者: 如果user是被拍卖者，面临被转卖
      管理者: 可能被要求提供受害者资料
      打手: 可能被派押送受害者
      老板: 决定是否批准拍卖
  - 名称: 拍卖竞价
    触发: 拍卖进行中
    描述: 多个买家实时竞价
    变量影响: 暗网.拍卖价格按竞价变化
  - 名称: 成交交割
    触发: 拍卖成交
    描述: 受害者被移交给买家
    变量影响: 暗网.拍卖状态=已成交, 财富+拍卖价格

被迫直播事件:
  - 名称: 直播准备
    触发: 毒蛇安排直播
    描述: 受害者被带到直播间准备
    身份视角:
      受害者: 可能被迫参与直播
      管理者: 可能被要求管理直播业务
      老板: 决定直播内容和频率
  - 名称: 直播进行
    触发: 直播开始
    描述: 实时虐待或性侵直播
    变量影响: 暗网.直播次数+1, 暗网.暗网知名度+5
  - 名称: 观众互动
    触发: 直播中
    描述: 暗网观众打赏和要求
    变量影响: 财富按打赏变化

贩卖网络事件:
  - 名称: 联系买家
    触发: 有受害者待售
    描述: 通过暗网联系全球买家
    LCG判定: 智力+暗网操作, 难度0.8
  - 名称: 跨国转卖
    触发: 买家在国外
    描述: 安排受害者跨国转卖
    变量影响: 财富+大额, 法律风险+10

非法交易事件:
  - 名称: 毒品交易
    触发: 暗网订单
    描述: 通过暗网交易毒品
    变量影响: 财富±按交易, 法律风险+5
  - 名称: 武器交易
    触发: 暗网订单
    描述: 通过暗网交易武器
    变量影响: 财富±按交易, 法律风险+10
  - 名称: 器官交易
    触发: 受害者被处理
    描述: 处理死亡受害者时的器官交易
    变量影响: 财富+, 手上血债+1

猎杀直播事件:
  - 名称: 富豪下单
    触发: 暗网知名度≥50
    描述: 富豪付费观看"猎杀"直播
    变量影响: 财富+大额, 道德.善恶值-20
  - 名称: 猎杀执行
    触发: 猎杀直播
    描述: 在特定区域执行猎杀
    变量影响: 手上血债+1, 暗网.暗网知名度+10
</event_library>
