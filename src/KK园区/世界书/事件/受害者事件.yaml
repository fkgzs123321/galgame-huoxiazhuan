<event_library type="受害者">
事件组织: 按受害者身份阶段分组
触发规则: 按当前阶段和变量条件自动加载

入园恐惧阶段事件:
  - 名称: 登记编号
    触发: 入园第一天
    描述: 铁姨登记user信息，扣押护照，挂上编号牌
    变量影响: 恐惧值+20, 希望值-10
  - 名称: 第一次目睹惩罚
    触发: 入园第二天
    描述: 在诈骗大厅目睹完不成业绩的受害者被阿烈殴打
    变量影响: 恐惧值+15, 精神-10
  - 名称: 铁姨训话
    触发: 入园第一天
    描述: 铁姨介绍园区规则，强调逃跑=死
    变量影响: 恐惧值+10
  - 名称: 分配宿舍
    触发: 入园第一天
    描述: 被分配到拥挤通铺，认识同组受害者小薇
    变量影响: 人际.小薇关系+10
  - 名称: 第一顿饭
    触发: 入园第一天
    描述: 食堂剩菜剩饭，体验饥饿控制
    变量影响: 饥饿+30, 精神-5

适应求生阶段事件:
  - 名称: 第一次诈骗任务
    触发: 入园第三天
    描述: 冷雪分配诈骗任务，按话术脚本操作
    变量影响: RPG.诈骗术判定, 业绩按判定结果
    LCG判定: 智力+诈骗术, 难度1.0
  - 名称: 小薇的忠告
    触发: 与小薇互动3次以上
    描述: 小薇私下告诉user园区的一些规则和禁忌
    变量影响: 情报网+1, 人际.小薇关系+10
  - 名称: 阿凤的试探
    触发: 与阿凤首次互动
    描述: 阿凤用隐晦的话试探user的态度
    变量影响: 人际.阿凤关系+5
  - 名称: 铁姨受贿
    触发: 持有金钱≥100
    描述: 贿赂铁姨获取额外食物或情报
    变量影响: 金钱-100, 饥饿-20, 情报网+1
    LCG判定: 魅力+社交术, 难度0.8
  - 名称: 第一次惩罚
    触发: 业绩未达标
    描述: 被阿烈殴打，体验暴力后果
    变量影响: 伤势+20, 恐惧值+15, 精神-15

暗中谋划阶段事件:
  - 名称: 偷听管理者谈话
    触发: RPG.潜行术≥30
    描述: 偷听到冷雪和媚娘的私下对话，获取情报
    变量影响: 情报网+2, 逃跑准备+5
    LCG判定: 敏捷+潜行术, 难度0.8
  - 名称: 拉拢小刀
    触发: 人际.小刀关系≥30
    描述: 试探小刀的良心，暗示逃脱计划
    变量影响: 人际.小刀关系+15, 逃跑准备+10
    LCG判定: 魅力+社交术, 难度0.8
  - 名称: 收集看守换班情报
    触发: RPG.情报收集≥30 或 暗网操作≥20
    描述: 记录外围防线的巡逻规律和换班时间
    变量影响: 逃跑准备+15, 情报网+2
  - 名称: 贿赂老鼠
    触发: 金钱≥500
    描述: 向老鼠购买逃脱路线情报
    变量影响: 金钱-500, 逃跑准备+20, 情报网+1（30%概率假情报）
    LCG判定: 感知+情报收集, 难度0.8（判定真假）
  - 名称: 与阿凤结盟
    触发: 人际.阿凤关系≥50
    描述: 阿凤同意加入逃脱计划
    变量影响: 逃跑准备+20, 人际.阿凤关系+20

逃脱行动阶段事件:
  - 名称: 夜间潜行
    触发: 逃跑准备≥80, 逃脱术≥60
    描述: 夜间行动，避开巡逻
    变量影响: 体力-30
    LCG判定: 敏捷+潜行术, 难度0.6
  - 名称: 翻越围墙
    触发: 到达外围防线
    描述: 翻越铁丝网围墙
    变量影响: 伤势+15, 体力-20
    LCG判定: 力量+逃脱术, 难度0.6
  - 名称: 黑寡妇追击
    触发: 逃跑被发现
    描述: 黑寡妇亲自追击，生死关头
    变量影响: 精神-30, 伤势+30
    LCG判定: 敏捷+逃脱术 vs 黑寡妇, 难度0.4
  - 名称: 码头遭遇
    触发: 到达码头
    描述: 码头是最后关卡，可能遭遇外卫打手
    LCG判定: 综合判定, 难度0.4

结局阶段事件:
  - 名称: 逃脱成功
    触发: 逃跑准备≥80, 情报网≥5, RPG.逃脱术≥60, 未被转卖
    描述: 成功逃脱园区，重获自由
    变量影响: 结局分支=A_逃脱成功
  - 名称: 沉沦
    触发: 精神<20, 希望值<10
    描述: 精神崩溃，被同化为打手或认命
    变量影响: 结局分支=B_沉沦
  - 名称: 转卖
    触发: 暗网.拍卖状态=已成交
    描述: 通过暗网被卖到更惨的地方
    变量影响: 结局分支=C_转卖
  - 名称: 反杀上位
    触发: 伪装度≥80, 性别稀缺度≥90, RPG.伪装术≥70, 道德.善恶值<-50
    描述: 利用性别优势反杀女老板，自己成为新老板（黑化）
    变量影响: 结局分支=D_反杀上位
    LCG判定: 魅力+交际手腕, 难度0.4
  - 名称: 被救
    触发: 警方线索≥3, 外部援助=true, 道德.善恶值≥30
    描述: 警方捣毁园区，user获救
    变量影响: 结局分支=E_被救
</event_library>
