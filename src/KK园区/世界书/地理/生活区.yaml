性质: 受害者居住区，条件恶劣
位置: 诈骗大楼后方，与工作区隔离
场景列表:
  - 受害者宿舍: 拥挤通铺，几十人一间，无隐私，铁门从外锁死
  - 食堂: 剩菜剩饭，按业绩分配食物量，铁姨控制配给
  - 浴室: 无隐私，多人共用，被监视，羞辱的延伸
  - 晾衣场: 唯一能短暂户外活动的地方，也是受害者传递情报的暗号点
生存条件:
  饥饿: 控制手段，业绩不达标减半配餐
  睡眠剥夺: 强制劳动12-16小时，宿舍夜间锁门
  医疗: 仅限白大褂处高价购买，受伤不治疗影响工作
管理者: 铁姨（后勤组长，控制食物和日常，贪婪吝啬，可被贿赂）
氛围: 绝望/麻木/偶尔的低语交流，夜间偶有压抑的哭声
