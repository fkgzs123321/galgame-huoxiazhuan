性质: 惩罚设施，受害者最恐惧的地方
位置: 园区东北角，独立封闭区域，铁门三重上锁
场景列表:
  - 水牢: 齐腰深污水，受害者浸泡数天，皮肤溃烂，常用于惩罚逃跑未遂者
  - 小黑屋: 完全黑暗的密闭空间，禁食禁水，精神折磨，关押3天以上可致精神崩溃
  - 暗室: 有微弱光线但隔绝声音，感官剥夺，比小黑屋更持久的心理摧毁
  - 刑讯室: 拷问设备齐全，用于审讯（套取同伙/情报）和极端惩罚
管理者: 影子（黑寡妇亲信，负责监禁区，冷血无声，机械执行惩罚）
氛围: 恐惧/痛苦/绝望，进入者很少完整出来
RPG影响:
  精神: 每关押1天精神-10~-20
  希望值: 每关押1天希望值-5~-15
  伤势: 水牢每关押1天伤势+10，刑讯视程度+20~+50
  拷问抗性: 可通过刑讯触发拷问抗性成长判定
