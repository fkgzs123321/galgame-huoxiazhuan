性质: 诈骗业务核心，受害者主要工作区
位置: 园区中心区域
场景列表:
  - 键盘组大厅: 50台电脑排列，受害者12-16小时强迫劳动，完不成业绩挨打
  - 话务组大厅: 电话诈骗专用，戴耳机的受害者排成行，业绩板挂墙实时更新
  - 技术组办公室: 黑客/网页设计/APP开发，技术员地位较高，配独立工位
  - 会议室: 管理层开会/业绩汇报/训话场所，墙上贴业绩排行榜
  - 惩罚室: 公开惩罚场所，殴打/罚跪/电击，杀鸡儆猴，所有受害者围观
运作:
  劳动时长: 12-16小时
  业绩指标: 每日考核，按诈骗金额分级
  未达标后果: 送惩罚室公开受刑
  业绩换食物: 按业绩分配食物配额
管理者: 冷雪（诈骗组长，业绩至上，完不成指标者送惩罚室）
氛围: 压抑/恐惧/机械，键盘敲击声和电话声不断，无人敢交谈
