# 变量更新规则（额外模型遵守）
# 创意重构 v2.0：受害者视角·飞机杯系统·精液成瘾能力

更新原则:
  事件驱动: 变量变化必须由事件驱动，禁止无因跳变
  分组增量: 时间/生存/受害者状态每轮必输出，RPG/暗网/派系等增量输出
  量纲一致: 属性1~10，技能0~100，生存0~100
  上限约束: 变量更新后不得超出范围限制
  不可逆: 结局分支一旦赋值不可更改
  路径规范: JSONPatch路径用斜杠分隔，无 stat_data 前缀

单轮变化上限:
  RPG属性: 单次±1（上限10，下限1）
  RPG技能: 单次+5（上限100，只增不减除非特殊事件）
  RPG成长计数: 单次+1
  生存属性: 单次±30（饥饿/脱水每轮+5，疲劳每轮+3）
  受害者状态变量: 单次±15
  派系关系: 单次±10
  道德值: 单次±20
  NPC关系: 单次±15（对话±5~10，帮助+10~20，伤害-15~30）
  金钱: 单次变化±5000
  暗网知名度: 单次±10
  精液成瘾度: 单次+15~25（口服）/ +30~50（内射），只增不减
  爱意值: 成瘾度≥50后单次+5~15
  飞机杯三系统(察觉/倾心/具现度): 单次±10，0-200范围
  园区.利用进度: 单次+5~15
  园区.已诈骗金额: 单次+0~50000

禁止行为:
  禁止臆造变量路径（只能更新 schema.ts 中已声明的路径）
  禁止无事件驱动的变量跳变
  禁止超出范围限制
  禁止更改已锁定的结局分支
  禁止主模型输出 UpdateVariable 块
  禁止使用 delta 操作（必须用 replace 输出完整当前值）
  禁止虚构女性角色字段（女性角色70字段必须按 schema 结构输出）

更新触发:
  行为结果: 每个 user 行为后，按 LCG 判定结果更新相关变量
  事件触发: 按事件库的变量影响字段更新
  时间流逝: 每楼层固定 30 分钟，生存属性按时间消耗
  关系变化: 按互动结果更新 NPC 关系值
  精液成瘾: 按触发方式（口服/内射）累积成瘾度
  飞机杯绑定: 收集到材料后激活，绑定女性后开始追踪

更新规则:
  生存属性:
    体力: 按行为消耗（战斗-20~30/潜行-10~20/劳动-10~15），休息恢复
    精神: 按事件影响（暴力-10~30/NSFW-20~40/喘息+10~20）
    饥饿: 每楼层+5，吃饭-20~40
    脱水: 每楼层+5，喝水-20~40
    疲劳: 每楼层+3，睡眠-30~50

  NSFW属性:
    性欲: 按情境变化（视觉刺激+5~15/NSFW行为+20~40/射精后-30~50）
    勃起度: 按性欲与刺激变化（性欲>50自动勃起/NSFW行为中维持/射精后归0）
    累计射精次数: 每次射精+1，只增不减

  RPG属性:
    成长判定: 行为成功后 LCG 骰子≤10 时获得成长点
    属性成长: 相关行为成功10次→属性+1（上限10）
    技能成长: 相关行为成功5次→技能+5（上限100）
    专属技能: 需学习事件触发，使用前为0

  关系值:
    对话: +5~+10 或 -5~-10
    帮助: +10~+20
    伤害: -15~-30
    身份暴露: -20~-50
    衰减: 每天不互动 -1~-2

  道德值:
    帮助受害者: +5~+15
    伤害受害者: -10~-20
    救助: +20~+30
    举报: -5~-15
    利用精液成瘾能力操控女性: -5~-15（视情况）

  派系关系:
    帮助某派系成员: 该派系+5~+10
    对立派系: -3~-5

  精液成瘾能力（核心机制）:
    触发条件: 女性吃下user精液（口服）或被user内射（内射）
    成瘾度累积:
      口服: +15~25/次（园区不知晓）
      内射: +30~50/次（园区已知晓）
    成瘾阈值:
      成瘾度≥30: 初步成瘾，女性开始对user有特殊关注
      成瘾度≥50: 中度成瘾，爱意值开始上升
      成瘾度≥80: 病态依恋，女性会主动维护user
      成瘾度=100: 完全成瘾，不可逆
    爱意值联动: 成瘾度≥50后爱意值+5~15/次互动
    触发记录: 已触发口服/内射次数+1，成瘾女性总数（新女性首次触发时+1）
    园区察觉风险: 高成瘾度女性行为异常时，园区.知晓程度可能上升
    user资源限制: 累计射精次数过多导致体力-10~20/精神-5~10

  飞机杯系统:
    激活条件: 收集到女性"材料"（毛发/血液/指甲/体液）
    绑定变化: 玩家.飞机杯当前绑定 从'无'变为女性名
    察觉度: 每次接触+3~10（女性开始察觉到飞机杯的存在）
    倾心度: user 选择善意互动时+5~15（女性对user的好感）
    具现度: 飞机杯绑定后+5~10/次互动（达到阈值可具现女性形象）
    解绑: 需特殊条件，解绑后该女性字段保留但已激活=false

  女性角色生成:
    首次登场: 输出完整70字段对象（add 操作）
    后续更新: 仅输出变化字段（replace 子字段）
    NSFW行为发生时: 必须完整输出服装/身体部位/生理状态/心理状态/实时状态/互动过程字段
    关键字段每轮必输出: 察觉度/倾心度/具现度/成瘾度/爱意值/心情/当前状态

  园区阶段推进:
    入园恐惧 → 适应求生: 入园3-5天 或 剧情进度≥10
    适应求生 → 暗中谋划: 伪装度≥40 或 情报网≥3 或 剧情进度≥30
    暗中谋划 → 逃脱行动: 逃跑准备≥80 且 RPG.逃脱术≥60 且 精液成瘾能力.成瘾女性总数≥3
    逃脱行动 → 结局: 按 LCG 判定决定结局分支
    结局分支赋值后不可更改

  结局触发条件:
    A_逃脱成功: 逃跑准备≥80 且 情报网≥5 且 RPG.逃脱术≥60 且 未被转卖
    B_沉沦: 精神<20 且 希望值<10
    C_转卖: 暗网.拍卖状态=已成交
    D_反杀上位: 伪装度≥80 且 性别稀缺度≥90 且 RPG.伪装术≥70 且 精液成瘾能力.成瘾女性总数≥5 且 道德.善恶值<-50
    E_被救: 警方线索≥3 且 外部援助=true 且 道德.善恶值≥30
    F_后宫王: 精液成瘾能力.成瘾女性总数≥10 且 飞机杯绑定女性数≥5

禁止行为:
  禁止臆造变量路径
  禁止无事件驱动的变量跳变
  禁止超出范围限制
  禁止更改已锁定的结局分支
  禁止主模型输出 UpdateVariable 块
  禁止虚构 schema 中未声明的字段
