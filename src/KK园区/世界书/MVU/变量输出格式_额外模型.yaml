- `/角色库/已生成列表`、`/角色库/当前交互角色`、`/角色库/角色生成计数器`

═══════════════════════════════════════════════════════════
【op 操作说明】
═══════════════════════════════════════════════════════════

- `replace`：替换值（数值更新的唯一允许方式）。例：`{ "op": "replace", "path": "/玩家/饥饿", "value": 25 }`
- `add`：对象新增字段/数组追加。例：首次添加女性角色 `{ "op": "add", "path": "/女性角色/小薇", "value": {...70字段对象} }`
- `insert`：数组追加。例：`{ "op": "insert", "path": "/园区/已获取情报/-", "value": "毒蛇的弱点" }`
- `remove`：删除字段。例：`{ "op": "remove", "path": "/园区/已接取支线/0" }`
- `move`：移动字段。例：`{ "op": "move", "from": "/园区/已接取支线/0", "path": "/园区/已完成任务/-" }`
- **❌ delta 已废弃**：禁止使用 delta 操作，所有数值更新必须用 replace 输出完整当前值

═══════════════════════════════════════════════════════════
【骰子判定结果传递】
═══════════════════════════════════════════════════════════

额外模型在输出 `<UpdateVariable>` 块时，必须参考本轮骰子判定结果（由 LCG 骰子引擎生成的 `<LCG骰子判定结果>` 块）。

1. **行为判定**：根据玩家本轮实际行为选择对应动作的判定结果
   - 行为成功（effect_mult>0）：数值变化 ×effect_mult
   - 行为失败（effect_mult=0）：无正面效果，可能触发负面变化
   - 行为大失败（effect_mult<0）：效果反转（正面变负面）

2. **成长判定**：行为成功后LCG骰子≤10时获得成长点
   - 相关行为成功10次->属性+1（上限10）
   - 相关行为成功5次->技能+5（上限100）

3. **经济判定**：根据经济判定结果计算并输出完整值
   - 有折扣：消费金额 ×(1-discount_rate)
   - 有意外支出：replace `/玩家/金钱` 为计算后的完整值

═══════════════════════════════════════════════════════════
【规则】
═══════════════════════════════════════════════════════════

- 严格按「变量更新规则.yaml」中的变量更新规则计算变化；仅更新 schema.ts 中已声明的路径
- 基于**当前楼层剧情**（主 API 已输出的叙事）判断，勿引用更早楼层的过时状态
- **时间流逝规则**：每楼层固定流逝 30 分钟。无论叙事字数多少，时间只推进 30 分钟。累计填满当前时段后切换至下一时段
- 支持 op: replace / add / insert / remove / move
- **数值更新必须用 replace 输出计算后的完整当前值**（禁止 delta）
- **replace 的 value 类型必须与 schema 一致**（string/number/boolean/object/array）
- 不得更新以 _ 开头的只读字段
- **变量分组增量更新**：
  - **时间/生存/NSFW/受害者状态/精液成瘾/飞机杯/园区阶段/利用相关**：每轮必须输出
  - **RPG属性/技能/成长**：增量输出（有变化才输出）
  - **暗网/派系/道德/任务/情报/证据/同伙/成就**：增量输出（有变化才输出）
  - **当前女性角色关键字段**：每轮必输出（7字段）
  - **NSFW行为发生时的女性角色**：必须全量输出70字段
  - **首楼初始化**：由开场白 `<initvar>` 块完成
- **无变更时仍需输出完整 `<UpdateVariable>` 块**（`<JSONPatch>` 内可为仅含时间流逝的最小数组），**绝不省略 `<JSONPatch>` 标签**
- JSON Patch 路径用斜杠分隔，**无 stat_data 前缀**
- **禁止输出** `<thinking>`、`[metacognition]`、叙事正文、`<StatusPlaceHolderImpl/>` 等任何非 `<UpdateVariable>` 块内容
