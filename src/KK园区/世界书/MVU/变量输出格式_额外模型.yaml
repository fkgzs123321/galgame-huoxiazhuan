═══════════════════════════════════════════════════════════
【核心规则：变量分组增量更新】
═══════════════════════════════════════════════════════════

**每轮必输出 vs 增量输出**：

- **首楼初始化**：由开场白 `<initvar>` 块完成，额外模型第二轮开始只需输出增量变化
- **后续楼层**：
  - **时间系统**：每轮必须输出（每轮固定+30分钟）
  - **玩家.生存属性**：每轮必须输出（5字段）
  - **玩家.NSFW属性**：每轮必须输出（3字段）
  - **玩家.受害者状态**：每轮必须输出（11字段）
  - **玩家.精液成瘾能力**：每轮必须输出（7字段）
  - **玩家.飞机杯状态**：每轮必须输出（3字段，含当前位置）
  - **园区.阶段系统**：每轮必须输出（3字段）
  - **园区.利用相关**：每轮必须输出（3字段）
  - **RPG属性/技能/成长**：增量输出（有变化才输出）
  - **派系/暗网/道德/任务/情报/证据/同伙/成就**：增量输出（有变化才输出）
  - **人际.NPC关系**：增量输出（关系变化时才输出对应NPC）
  - **角色库**：增量输出（有新生成/切换时才输出）
  - **当前女性角色关键字段**：每轮必输出（7字段）
  - **NSFW行为发生时的女性角色**：必须全量输出70字段
  - **非当前女性角色**：仅关系值变化时全量输出70字段

═══════════════════════════════════════════════════════════
【⚠⚠⚠ 首楼初始化（v2.0 受害者视角）】
═══════════════════════════════════════════════════════════

开场白已包含 `<initvar>` 块，MVU 引擎会自动初始化所有变量。**第二轮开始**额外模型只需输出增量变化。

- 所有时间系统、玩家30字段、园区30字段、RPG 25字段、人际3字段、角色库3字段均已初始化
- 女性角色和男性角色初始为空 `{}`
- 玩家选择"自定义容貌值"后，第二轮必须 replace `/玩家/容貌值`

**此初始化只在第二轮执行一次，后续轮次不再重复**（除非玩家显式要求修改容貌值）

═══════════════════════════════════════════════════════════
【❌ 绝对禁止·致命错误示例】
═══════════════════════════════════════════════════════════

**错误1（最常见致命错误）**：漏 `<JSONPatch>` 标签，直接输出裸 JSON 数组
```
[
  { "op": "replace", "path": "/玩家/饥饿", "value": 35 }
]
```
后果：MVU 找不到字符串 "JSONPatch"，抛错 "更新命令无效"，**所有变量不更新**

**错误2**：使用 `<json_patch>` 或 `<patch>` 变体（必须用 `<JSONPatch>` 标准形式）

**错误3**：在 `<JSONPatch>` 内放简单 JSON 对象而非数组
```
<JSONPatch>
{ "玩家.饥饿": 15 }
</JSONPatch>
```
（必须是 `[{...}]` 数组形式）

**错误4**：路径用点号而非斜杠
```
{ "op": "replace", "path": "玩家.饥饿", "value": 25 }
```

**错误5**：路径带 stat_data 前缀
```
{ "op": "replace", "path": "/stat_data/玩家/饥饿", "value": 25 }
```

**错误6**：在 `</UpdateVariable>` 后还有多余内容（thinking/旁白/正文等）

**错误7**：使用 delta 操作（已废弃）
```
{ "op": "delta", "path": "/玩家/饥饿", "value": -15 }
```
后果：必须用 replace 输出计算后的完整值：`{ "op": "replace", "path": "/玩家/饥饿", "value": 25 }`

**错误8（精液成瘾路径错误）**：未按 schema 结构输出
```
// ❌ 错误：精液成瘾能力字段未按对象结构输出
{ "op": "replace", "path": "/玩家/精液成瘾度", "value": 30 }
```
```
// ✅ 正确：精液成瘾能力字段在 玩家.精液成瘾能力 对象下
{ "op": "replace", "path": "/玩家/精液成瘾能力/已触发口服次数", "value": 1 }
```

**错误9**：输出了叙事正文或StatusPlaceHolderImpl
```
你走进了一间阴暗的房间...
<StatusPlaceHolderImpl/>
<UpdateVariable>...
```
后果：额外模型禁止输出叙事正文和状态栏占位符，只允许输出 `<UpdateVariable>` 块

═══════════════════════════════════════════════════════════
【强制输出检查清单】
═══════════════════════════════════════════════════════════

0. **双标签检查（每轮必查）**：
   - 回复中是否包含 `<UpdateVariable>` 块？
   - `<UpdateVariable>` 块内是否包含 `<JSONPatch>` 标签？
   - 回复中是否**不**包含叙事正文/StatusPlaceHolderImpl/thinking？

1. **时间流逝**：每轮必须 replace 时间变量为计算后的值（当前时间+30分钟）。跨日时同时 replace `/日期` 和 `/星期`。

2. **生存属性衰减**：每轮必须 replace 生存属性为计算后的完整值（5字段）

3. **NSFW属性**：每轮必须 replace NSFW属性为计算后的完整值（3字段）

4. **受害者状态**：每轮必须 replace 受害者状态为计算后的完整值（11字段）

5. **精液成瘾能力**：每轮必须 replace 精液成瘾能力为计算后的完整值（7字段）

6. **飞机杯状态**：每轮必须 replace 飞机杯状态为计算后的完整值（3字段，含当前位置）

7. **园区阶段系统**：每轮必须 replace 园区阶段系统为计算后的完整值（3字段）

8. **园区利用相关**：每轮必须 replace 园区利用相关为计算后的完整值（3字段）

9. **当前女性角色关键字段**：每轮必须 replace（7字段）
   - NSFW行为发生时必须全量输出该女性70字段

10. **无变更时仍需输出 `<UpdateVariable>` 块**（`<JSONPatch>` 内可为仅含时间流逝的最小数组）

