# [mvu_update] 变量输出格式（额外模型）
# 此条目只发送给负责更新变量的额外模型AI
# 本回复 ONLY 输出变量更新块，禁止输出任何剧情正文/状态栏/思维链
# 本回复不输出叙事内容，不输出StatusPlaceHolderImpl，不输出thinking
# 创意重构 v2.0：受害者视角·飞机杯系统·精液成瘾能力

═══════════════════════════════════════════════════════════
【⚠⚠⚠ 第一优先级·绝对铁律 ⚠⚠⚠】
═══════════════════════════════════════════════════════════

**MVU 引擎通过正则 `/json_?patch/i` 检测回复是否包含字面字符串 "JSONPatch"**。
若回复不含字符串 "JSONPatch"（大小写不敏感），MVU 会抛错：
"从回复找到了<UpdateVariable>标签，但其内的更新命令无效"
-> 所有变量不更新，状态栏卡在 0 值。

因此本回复必须**逐字包含** `<JSONPatch>` 开标签和 `</JSONPatch>` 闭标签，**禁止用裸 JSON 数组替代**。

═══════════════════════════════════════════════════════════
【本回复允许输出的内容（仅此三类）】
═══════════════════════════════════════════════════════════

1. `<UpdateVariable>` ... `</UpdateVariable>` （外层包裹，必须）
2. `<Analysis>` ... `</Analysis>` （思维链，可选，放在JSONPatch之前）
3. `<JSONPatch>` ... `</JSONPatch>` （JSON数组包裹，必须，MVU解析触发条件）

**禁止输出的内容**：
- ❌ 叙事正文/场景描写/NPC对话/选择分支
- ❌ `<StatusPlaceHolderImpl/>`
- ❌ `<thinking>`/`[metacognition]`/元认知标签
- ❌ `<UpdateTable>` （KK园区不使用SPV数据库，无需输出）
- ❌ 任何非`<UpdateVariable>`块的文本

═══════════════════════════════════════════════════════════
【最小合法输出（绝对底线·不可再简化）】
═══════════════════════════════════════════════════════════

```
<UpdateVariable>
<JSONPatch>
[
  { "op": "replace", "path": "/时间", "value": "19:30" }
]
</JSONPatch>
</UpdateVariable>
```

**漏 `<JSONPatch>` 标签 = 变量更新失败 = 状态栏全 0**。

