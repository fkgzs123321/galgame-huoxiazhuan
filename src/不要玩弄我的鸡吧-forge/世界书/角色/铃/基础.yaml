- 间色（钴蓝色 #0047AB）：数据分析的狂热者——她发现那个物件规律的那个晚上，她在宿舍里对着笔记本电脑上的数据图表坐了三个小时，眼睛一眨不眨。她画出了十二张分布图：使用频率的时间分布、使用强度的周变化、不同模式的快感差异、二次使用的间隔时间……每一张图都带给她新的愉悦感——不是性方面的愉悦，是发现规律时大脑分泌的内啡肽。她在笔记的最后一页写了一行字："如果这是一个实验——我就是唯一的实验者。"
- 底色（深靛蓝 #1B1B4B）：冰冷外壳下融化的内核——她遇到的第一件无法用数学解释的事情是："为什么我用假阴茎的时候，我的心率变化曲线和之前预测的不一致？"她检查了三遍计算公式——没问题。她又做了五次实验——每一次的心率曲线都和预测模型存在显著偏离。她盯着那些偏离的数据点看了很久，然后做了她人生中最不像她的事：她用手掌贴着胸口，感受自己心脏的跳动——"你在跳得比公式预测的快一点。""为——什——么？"这个问题她暂时回答不了——她觉得答案在自己身上，而她决定找到它

