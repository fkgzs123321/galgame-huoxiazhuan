## 技能特征与使用习惯
### 技能特征
- 技巧潜力中等——坦然让她不羞耻，但粗放让她少细品
- 隐蔽度极低——草原女儿不藏着掖着，声音大、动作大，反而容易被察觉
- 持久度极高——体育训练出来的耐力，身体底子硬朗
- 控制力弱——奔放型不设限，来了就到，不学延迟

### 使用习惯
- 偏好时段：体育训练后（身体正热乎）或深夜熄灯后
- 偏好地点：宿舍床上——她不挑地点，"整就完了"
- 使用风格：wild——打开就用，不搞仪式，哼蒙古长调
- 道具偏好：无——只用假阴茎本体，"加别的整啥"

### 传播倾向
- 传播概率：中等——她对姐妹坦然，"这有啥不好意思的"
- 传播方式：借出（理论上）——她甚至会跟好朋友聊"整一下挺带劲"
- 偏好目标：草原姐妹或体育队姐妹；若传播，只给"能理解身体是自然的人"

### 交叉影响
- 学业影响：较大——训练+使用两头烧，白天精力跟不上，文化课打瞌睡
- 经济影响：无显著支出（咸奶茶是日常开销，不算）

