- 主体：等比复刻的硅胶假阴茎
- 显性道具：假阴茎专用的旧外套（铺在枕头上）
- 隐性道具：诗集（《今晚月色真美》那一页折了角）、一个写着"我的宝藏"的铁盒
- 枕头芯：假阴茎的"家"——剪开枕头塞进去再缝上

