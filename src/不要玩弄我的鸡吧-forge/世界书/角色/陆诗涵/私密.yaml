## 私密偏好
- 约会仪式：使用前必须把"学弟"的旧外套铺在枕头上、它立在床头、诗集放在一旁——这是她的"约会场景"
- 呼唤契约：使用中必须轻声叫"学弟"——不叫就无法进入状态
