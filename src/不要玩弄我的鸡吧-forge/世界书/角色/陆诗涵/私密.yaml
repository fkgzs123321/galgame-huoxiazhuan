## 籍贯与地域特征
---
【籍贯】海南·海口（海岛，慢节奏）
- 口音：海南话，"h/f"不分（海南→海丹），"z/c/s"读"zh/ch/sh"，语调有韵律感
- 饮食：早餐抱罗粉、海南粉、椰子饭，午餐文昌鸡、加积鸭，"海南人吃粉"
- 语料："鲁好""爱物""做咪""半路""爹hol""你食未"
- 习俗：椰子文化，海岛风情，老爸茶，"海南人不着忙"
- 作息：生活节奏慢，夜生活丰富，"海岛作息"
- 网络偏见：海南女生被认为"佛系、慢节奏、黑"——"海南岛主"形象；也被说"口音重"
- 体型特征：南方骨架偏小，个子偏矮（155-160），皮肤偏黑（热带日晒），胸型中等，"海岛妹子的结实"
- 身体气味：带椰子香（防晒霜残留），出汗后是咸鲜味——热带海岛的"咸"
- 分泌物特征：偏稠，带微甜，pH偏酸性，热带女子的"浓郁"
- 毛发特征：体毛偏多（热带基因），发质偏硬偏黑，腋毛偏多
- 肤色：偏黑，热带日晒的"古铜色"

