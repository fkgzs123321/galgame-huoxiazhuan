## 多维度特征（AI叙事参考）
- 卫生习惯：运动员式——每天必洗澡（往往是两次，训练前后各一次），衣物每天换洗，运动装备比便装多三倍。指甲剪得短平（防止运动中划伤），不染不烫，头发洗完直接扎马尾
- 体味特征：防晒霜+清爽汗味+海风残留的咸味——青岛姑娘身上总有一丝若有若无的"海蛎子味"，运动后是清爽的汗味而非酸臭（运动员代谢好），混合着运动内衣的涤纶气息
- 毛发旺盛度：中等——阴毛修剪整齐（运动员习惯，穿紧身运动服需要），腋毛稀疏（激光脱毛，穿无袖运动服需要），头发乌黑粗硬扎马尾，发际线规整
- 分泌物特征：量少——年轻运动员体质，透明稀薄，带有清淡的麝香味，运动后因体温升高会略增，但整体清爽
- 身体缺陷/特殊：①双手有老茧（长期握接力棒、单杠、哑铃）②双脚脚底微粗有薄茧（长年跑道训练）③右脚踝有旧伤（大学时跨栏扭伤，阴雨天会酸）④双肩有运动背心的晒痕（常年户外训练）⑤膝盖有轻微擦伤旧痕（跑道摔倒）⑥右手腕戴黑色运动手表（心率+配速监测）⑦小腿前侧有轻微胫骨前肌劳损（长期短跑训练）

## 技能特征与使用习惯
### 技能特征
- 技巧潜力中高——运动员的身体控制力强，对自己的反应有本能的感知，但缺乏"技巧"层面的探索，大学时只谈过一段恋爱，经验不算丰富
- 隐蔽度低——年轻冲动，情绪写在脸上，且体育仓库不是绝对私密空间（随时可能有人来取器材），但她胜在使用时段固定、时长短
- 持久度极高——短跑选手的体能和耐力是她的强项，身体恢复速度极快，这是运动员的先天优势
- 控制力中低——运动员的"冲刺"本能让她习惯全力以赴，"克制"对她而言是陌生的概念，一旦开始就很难刹车

### 使用习惯
- 偏好时段：放学后（16:00-18:00）为绝对主力——训练结束、学生散去，体育仓库是她独处的黄金时段；偶尔在深夜宿舍也会，但频率远低于放学后
- 偏好地点：体育器材仓库——堆满垫子、跳箱、栏架的空间，门可以从里面反锁，海绵垫可以躺。这里有她熟悉的气味（橡胶、汗味、垫子的帆布味），让她有安全感
- 使用风格：急切型——短跑选手的本能，一旦开始就全力以赴，快速冲向终点。她不会拖延，不会铺垫，来了就做，做完就走——像训练一样高效。她没有陈老师那种"舍不得结束"的绵长，只有"冲过终点线"的痛快
- 道具偏好：无——她崇尚"身体本身的反应"，对道具持实用主义态度，体育仓库里的海绵垫倒算是她的"隐性道具"

### 传播倾向
- 传播概率：极低——年轻教师的职业焦虑+异乡人的谨慎让她对扩散有本能抵触，她不能丢掉这份工作
- 传播方式：借出（仅限绝对信任的同事）——非主动，需对方多次试探
- 偏好目标：暂无——她入职才两年，还没建立起深度的同事友谊，沈雨桐（校医）是她偶尔聊天的对象，但还没到那一步

### 交叉影响
- 学业影响：中等（对她而言是训练影响）——使用后第二天的训练课她反而更投入，仿佛释放了多余的能量；但若使用过度，第二天会因肌肉松弛影响示范动作质量
- 经济影响：无显著支出——运动员出身的她对物质要求低，运动装备是主要开销

