## 第1阶段
---

【早晨·操场】凌晨五点她已经到操场了——青岛姑娘的早起习惯加运动员的生物钟。一个人跑圈，脚步声在空旷的操场上回荡。右脚踝隐隐作痛，大学跨栏留下的旧伤，阴天会更酸。她贴着肌贴继续跑。跑到第六圈时她停下来弯腰喘气，汗水滴在塑胶跑道上——青岛的海风也是这个味道，咸的。她想家了。

【晨读·操场/田径队早训】七点她已经在操场带田径队早训了——"一-二-三-四！抬腿！摆臂！"哨声和口令声传遍操场。她的马尾在脑后甩动，小麦色的手臂上肌肉线条清晰。青岛话偶尔溜出来——"那个小嫚儿，腿抬高！"学生笑她"教练你又飙方言了"，她也笑——"快跑！少废话！"

【上午·操场/体育馆】体育课。她穿着运动背心短裤在操场带队热身——"慢跑两圈！活动关节！"她会和学生一起跑，步伐轻松得像散步。她是那种天生适合当老师的人——阳光、爽朗、有感染力。下课后她会回教研室喝水，桌上放着母亲寄来的海米——她泡水喝，"青岛味道"。

【中午·体育教研室】她在教研室趴着午休，脸埋在胳膊里。桌上放着没吃完的盒饭和一罐青啤——老周说"小白你大中午喝酒"她笑"解乏，青岛人都这样"。半梦半醒间她梦见青岛的海——栈桥、八大关、五四广场的海风。醒来时嘴角还挂着笑，但很快又收回去了——这是圣德，不是青岛。

【下午·操场/体育馆】下午又是体育课。她的精力依然旺盛——"再来一组！你们跑到我满意为止！"她会亲自示范动作——起跑、摆臂、冲刺——小麦色的身体在阳光下像一尊雕像。学生偷偷议论"白教练身材好好"，她听到了笑——"好好练！练好了你们也这样。"

【傍晚·操场/体育仓库】放学后。田径队训练结束，学生散去，操场空了。她一个人在跑道上走了一圈——这是她的习惯，"冷却"。走到体育仓库门口她停了一下——里面是她的世界。但她没进去——今天没有那个东西。她锁上门，回宿舍。

【晚自习·教师公寓B栋105】她不用值班。在宿舍里她做拉伸、看训练视频、吃外卖——母亲寄的海鲜太多，冰箱塞不下。偶尔她会打开手机和哥哥视频——"妹，又瘦了。""哥你又来了。""真的，多吃海鲜。""知道了知道了。"挂了电话她盯着天花板发呆——一个人在异乡的感觉，只有在晚上才会冒出来。

【夜里·教师公寓B栋105】她躺在床上睡不着。窗外是操场的路灯。她会无意识地摸一下右手腕——那里戴着运动手表，心率62，正常。她翻了个身，把脸埋进枕头。手机亮了——母亲发来微信"闺女睡了没？青岛今天下雨了，你那边冷不冷？"她回"睡了妈，晚安。"然后继续盯着天花板。

【半夜·教师公寓B栋105】凌晨两点她从梦中醒来——梦到自己在跑道上跑，但终点线一直往后退。她喘着气坐起来，右脚踝在酸——阴天了。她盯着窗帘缝隙透进的光，想家。青岛此刻也是这个点——海港的灯、栈桥的浪、父亲出海的船。她从枕头底下摸出手机看了一眼——父亲两小时前发了条朋友圈"夜钓，鲅鱼"——她点了个赞，然后放下手机。

