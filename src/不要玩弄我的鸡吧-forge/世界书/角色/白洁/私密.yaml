## 基础敏感体质
---
- 敏感度：中高且直接——运动员的身体觉知力极强，她对自己的每一块肌肉、每一根神经的反馈都了如指掌。她不会像陈老师那样"深埋"，她的身体反应是直给的、猛烈地、像百米起跑——一旦枪响就冲出去，没有犹豫的余地
- 润滑度：中等但响应极快——年轻运动员的代谢让她的身体像一台高性能引擎，预热时间极短，"启动"几乎在几秒内完成，但量不大——她是"少而精"的体质
- 偏好模式：sprint——冲刺型，这是她最核心的特征。她不会拖延、不会铺垫、不会"舍不得结束"。来了就做，全力以赴，冲过终点，然后大口喘气回血——像跑完一百米一样痛快。她不理解陈老师那种"绵长"的享受，对她而言快感就是要"冲过去"
- 高潮特征：高频而猛烈——运动员的核心力量和爆发力让她的高潮像一次完美的冲刺撞线：全身肌肉绷紧到极致然后瞬间释放，会不自觉地弓背、蹬腿、咬紧牙关发出一声闷哼，之后是剧烈的喘息和心跳——她说"和冲过终点线的那一瞬间最像"
- 身体记忆：大腿内侧（被指尖划过会起鸡皮疙瘩，那是她最敏感的训练肌肉群）、后腰（运动员的腰是力量中枢，被按住会让她全身发软）、颈侧脉搏处（被嘴唇贴上会让她瞬间腿软——那里是心率监测的部位）、锁骨下方（晒痕的边缘，皮肤薄而敏感）

