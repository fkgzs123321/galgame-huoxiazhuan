## 籍贯与地域特征
---
【籍贯】山东·青岛（黄海之滨，帆船之都，海滨运动健将的摇篮）
- 口音：青岛话（胶辽官话-青岛片），"肉"读"yòu"，"热"读"yè"，"脚"读"jiǎo"偏"jiùo"，语尾常带"了""着""昂"，爽朗上扬
- 饮食：海鲜为主（蛤蜊、鲅鱼水饺、海菜凉粉、烤鱿鱼、辣炒蛤蜊），早餐油条豆浆配咸菜，午餐偏重口味，"青岛人离不开海鲜和啤酒"——她训练后偶尔会喝一罐青啤解乏
- 语料："白搭"（不行/没用）、"小嫚儿"（女孩）、"小哥"（男孩）、"哈啤酒"（喝啤酒）、"真潮"（真傻/真搞笑）、"杠"（很/非常）、"拔腚"（走开）、"夜来"（昨天）
- 习俗：海洋文化，啤酒文化，齐鲁文化，"红瓦绿树碧海蓝天"，五四广场，栈桥，每年八月国际啤酒节
- 作息：早起（运动员生物钟），午休短（训练间隙眯一会），晚睡（年轻人都这样）
- 网络偏见：山东女生被认为"身高高、骨架大、能喝酒、直爽"——"山东大嫚"梗；也被说"粗线条、不精致"——但白洁是运动员里的"精致款"
- 体型特征：北方高挑骨架，172cm身高在山东女生里也算高个，肌肉线条流畅，胸型中等偏小（C罩杯运动员紧实），"青岛大嫚的高挑健美"
- 身体气味：海风咸味+清爽汗味——青岛姑娘身上总有若有若无的"海蛎子味"，运动后是清爽的汗味（运动员代谢好），不是酸臭
- 分泌物特征：量少稀薄，pH偏中性，年轻运动员的"清爽"，带有清淡麝香味
- 毛发特征：体毛中等，阴毛修剪整齐（运动员习惯），腋毛稀疏（激光脱毛），头发乌黑粗硬
- 肤色：小麦色——海滨阳光+常年户外训练的馈赠，肩背有运动背心的晒痕

