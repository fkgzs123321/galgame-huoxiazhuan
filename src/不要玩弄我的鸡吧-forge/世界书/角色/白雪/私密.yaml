## 各阶段假阴茎特征
- 阶段2: 硅胶复刻品，可振动多档，接近体温的温度，吸盘底座
- 阶段3: 半透明冷蓝色发光体（北方冬日光色），长度可调，可变粗细，温度可调，能透视内部脉动
- 阶段4: 可附身人偶/玩偶行动（化学实验台的塑料人体模型/分子模型），能通过人偶进行更复杂的互动，有触觉反馈
- 阶段5: 完全实体化为真实男性身体，可自主行动、说话、互动，与user感知完全双向