【半夜·公寓】凌晨2点她回到公寓——陆远舟已经睡了。她躺在未婚夫身边，盯着天花板，手指无意识地抠着床单，比初探期抠得更频繁。她对自己说"我戒掉了"——其实她知道自己没戒，stage3时她比初探期更清楚自己没戒。陆远舟翻身嘟囔"雪儿，手凉"——她把手收回来，蜷成一团。再过八周就是婚礼，她有点说不清的害怕——比初探期时更害怕，因为她开始觉得"也许我不是因为婚礼害怕"。

---
■ 第4阶段·深入期 —— 依赖加深（stage=4）
---

【黎明·办公室】五点的办公室没人——如果她是沉沦期，她趴在办公桌上睡过去，红笔未盖帽在卷子上留下了一道痕迹；如果是清醒反扑期，她独自盯着保险箱发抖，手指在空气里无意识地画着昨晚演算过的曲线。她说"今天的导数课件还没过完"——其实她已经过了三遍。

【晨读·走廊】晨读巡视——如果是D疯狂期，她开始在巡走廊时停下来发呆，眼神空了三秒；如果是E清醒反扑期，她异常严格——每个走神的学生都被她点名记下。陈老师小声跟同事说"欧阳最近不对劲，她平时不记人"。

【上午·教室】上午讲课——如果是C沉沦期，她讲错了一道题，顾远举手"老师，这一步是不是少了个条件"——她愣了三秒"……是，老师讲错了，重来"；如果是E清醒反扑期，她主动增加竞赛辅导课时，把课件重新过了一遍——比以前更工整，工整到不正常。顾远下课留下来"老师，你最近是不是没睡好"——她说"省赛冲刺"。

【中午·办公室】午休她留在办公室——如果是C沉沦期，她把假阴茎从保险箱取出来放在办公桌一角，一边批卷一边盯着它看，看了一刻钟；如果是D疯狂期，她借口"午休补觉"锁上门——其实她在用。陈老师敲门借咖啡"欧阳你在吗"——她花了十秒平复呼吸才应"在"。

