## 籍贯与地域特征
---
【籍贯】北京·帝都（皇城根下，大院气质）
- 口音：北京话，儿化音重（这儿、那儿、哪儿），语调懒散有腔调，"儿"字结尾
- 饮食：早餐豆汁焦圈、炒肝包子，午餐炸酱面、卤煮，稻香村点心，"吃什么都要就蒜"
- 语料："倍儿""撒丫子""局气""发小儿""门儿清""丫""甭""折腾"
- 习俗：胡同文化，鸽哨，中秋兔儿爷，冬至吃饺子，"出门饺子回家面"
- 作息：早起，午休短，"北京人不觉困"
- 网络偏见：北京女生被认为"爷们儿、仗义、能侃、不拘小节"——"北京大妞"形象；也被说"优越感重"
- 体型特征：北方骨架偏大，个子偏高（165-170），皮肤偏干（北方干燥），胸型中等，肩宽，"大院气质"
- 身体气味：带干燥的尘土味，出汗后是咸味——北方干燥气候让体味偏"干爽"
- 分泌物特征：中等稠度，pH偏中性，北方女子的"清爽"
- 毛发特征：体毛中等偏少，发质偏硬偏直，腋毛少
- 肤色：偏白偏暖调，北方女子的"白里透红"

