## 基础敏感体质
---
- 敏感度：中等但精准——理性主导下身体反应被刻意压制，但数据失控时会暴涨，像一条被压平后反弹的曲线
- 润滑度：中等且规律——成熟女性身体规律运作，与情绪绑定度低，她用表格记录每一周期的变化
- 偏好模式：delayed——延时控制型，追求"最优解"，每次都试图找出"最高效路径"，停在临界点反复求解"理论最大值"
- 高潮特征：低频但精确——每次都追求"理论最大值"，咬紧牙关不出声，到达时全身绷成一条直线然后骤然松开
- 身体记忆：后颈（被指尖划过会让她瞬间僵住，那是她戴订婚钻戒的手最常停留的地方）、手腕内侧（戴银色手表处，被触碰会让她呼吸节奏紊乱）、腰窝（被按压会让她逻辑短路三秒）

