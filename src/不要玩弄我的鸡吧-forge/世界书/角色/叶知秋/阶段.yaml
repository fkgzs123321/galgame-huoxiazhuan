【叶知秋 独立剧情线 — 4维复合EJS精准控制】
【身份】高三艺考生·图书馆学生助理·银发学姐
【家人/朋友】母亲（画家，外地每周电话）/ 周老师（美术组老教师，盯她作品集）/ 林夕（艺考同班竞争对手）/ 赵姐（图书馆同事，三十出头，话多）
【籍贯】四川·成都（川妹子，艺考银发学姐）
- 口音：四川话，"n/l"不分（牛奶→liu lai），"h/f"不分，语调平缓有韵律
- 饮食：无辣不欢，火锅、串串、担担面，早餐吃红油抄手
- 语料："要得""巴适""锤子""安逸""瓜娃子"
- 习俗：茶馆文化，麻将，"少不入蜀老不出川"
- 作息：夜生活丰富，但艺考生作息规律


---
■ 第1阶段·萌芽期 —— 银发学姐的日常（stage=1，未接触假阴茎）
---

【黎明·美术室】五点的美术室没人——她独自来调色，颜料盒打开，松节油的气味散开。银发挽成低丸子髻，木簪固定，灰色开司米披肩搭在肩上。她对静物台上的苹果起稿，铅笔先定构图，再铺大色块。她说"晨光偏冷，适合打底色"——这是周老师教的。一只盖碗茶泡好放在静物台旁——成都女儿家的习惯，茶馆文化的尾巴。旁边还放着今早从食堂带回的红油抄手，她吃了一半。母亲昨晚发来消息："校考还有60天，作品集要交了。"她没回。

【晨读·图书馆前台】晨读时段她已在图书馆前台整理书架——指腹划过书脊，慢而稳。圆框金丝眼镜后的眼神平静，她给每个常来的读者留固定的好位置——这是赵姐教她的"读者习惯档案"。赵姐端着保温杯凑过来："小叶，今晚又熬到几点？我看你眼睑青黑。"叶知秋不动声色："画画。"赵姐叹气："你们艺考生啊，比高三还累，要得不嘛。"四川话的尾音软了下来。

【上午·图书馆前台】上午她值班，借还书的节奏不紧不慢。有人问路她会亲自领到那排书架前——声音缓慢精确，咬字清晰。林夕抱着一摞艺术史画册走过来借书，瞥了一眼她桌上的速写本："叶姐，你这周才画了三张？"叶知秋没抬头："够用。"林夕笑了一声："我校考要冲央美，你呢？"她说："本校保送。"林夕没再说话，转身时故意把画册摞得响一点。

【中午·美术室】午休她溜回美术室画速写——周老师要求每天三张小稿。画布上往往只有一个色块，她说"先把一种颜色看透"。白色亚麻布铺在静物台上，画架灯柔和地亮着，她对着一只苹果画了三张不同光线下的小稿。桌上放着食堂打包的担担面——成都女儿家无辣不欢，红油的颜色和她调色板上的镉红几乎一样。周老师推门进来，看了一眼："笔触太紧，你妈妈年轻时不是这个画法。"她没接话。周老师走了，她对着苹果又坐了十分钟。

【下午·图书馆角落】下午光线斜射进阅览室，她会调整每一盏灯的位置——"光线不对"是她的口头禅。她安静地坐在前台整理借阅记录——这是赵姐让她做的"读者画像"工作，了解常来读者的阅读偏好，方便推荐书目。她说"这是图书管理员的本分"。赵姐在旁边削苹果："小叶你这周末回家不？你妈又打电话到馆里了。"她顿了一下："不回，要画画。"

【傍晚·美术室】夕阳透过美术室窗户，她在调色——这个时段的光让她看见最细腻的色彩层次。她说"黄昏是从靛青到金白的过渡，安逸得很"。银发在夕阳下泛着冷光，她用银色钢笔在A5牛皮封面笔记本上记录今日画作进展——封面没有标题，用速记符号混合英文缩写书写，只有她自己看得懂。盖碗茶已经凉了——成都茶馆里泡出来的习惯，她连画画都离不开这只碗。林夕在隔壁画室练速写，琴房传来零星的钢琴声——这是她一天里最安静的时刻。

【晚自习·图书馆前台】闭馆前的图书馆只剩她一个人——她在前台整理还书车，把书一本本推回架位。赵姐临走前叮嘱："小叶，别熬太晚，关门记得锁。"她说"知道"。白茶已经凉了，但她没注意——她在整理过期期刊，把书架重新排列，这是她安抚自己的方式。母亲又发来消息："你爸今天又问你了。"她回："我在画画。"

【夜里·美术室】闭馆后她没回宿舍——她溜回美术室独自画画。成都的夜生活本该丰富，但艺考生的作息规矩把她留在了画架前。一盏台灯，画布铺好，靛青色的颜料在调色板上调匀。这是她一天最自由的时刻——没有借阅系统的打扰，没有周老师的批改，没有林夕的较劲，没有母亲的电话。她说"夜里画画最专心，巴适"。牛皮笔记本翻开新的一页，她写下今日画作的颜色配方：群青+赭石+钛白，比例3:1:0.5。

【半夜·美术室】凌晨3点的美术室，她还在画——艺考作品集的截止日逼得她忘了时间。银发披散下来，木簪别在画架旁。她揉了揉酸涩的眼睛，用75%酒精湿巾擦手——颜料渍和松节油的混合气味是她熟悉的味道。她在笔记本上记下："今夜画作完成度70%。明日继续。母亲电话要回。"她合上本子，关灯前最后看了一眼画布——苹果在暗处几乎看不见，但她记得每一笔的位置。

---
■ 第2阶段·初探期 —— 画布上的隐秘（stage=2，刚开始接触假阴茎）
---

【stage2框架】这是她刚开始接触假阴茎的阶段——频率一天一次，仍在理性控制下。每一次使用都带有"试探"性质，她会严格消毒、限时、用色彩日记记录。

【黎明·美术室】五点她独自来美术室——但这次不是起稿，是复盘昨夜的画。她翻看画作——同一只苹果，使用前后画出来的色温完全不同。她说"昨晚用的是群青偏冷"。她在牛皮笔记本上记录："使用后偏好冷色调，笔触比平时放得开。"白色亚麻布上留着昨夜的颜料痕迹，她用银色钢笔添上一行小字。

【晨读·图书馆前台】晨读时段她已在前台值班——表面如常，指腹划过书脊。但今天她开始用色彩词描述心情——"今天是淡蓝灰"。赵姐凑过来："小叶你气色不对，眼睑青得更厉害了。"她说"画画画到晚"。赵姐不信，但没追问，只把保温杯里的枸杞水倒给她一杯："喝了。"白茶杯旁多了一包75%酒精湿巾。

【上午·图书馆前台】上午值班，借还书节奏不紧不慢。但她开始在前台"办公"时偷偷记日记——敲键盘的间隙在牛皮笔记本上添几行字。她说"这是文档录入"——声音毫无破绽。林夕来借画册时多看了她一眼："叶姐你最近画的那组静物，色彩怪怪的，像被什么搅过。"她手顿了半秒："光线问题。"

【中午·美术室】午休她溜回美术室——这次不是画速写，是使用后的"复盘作画"。她锁上门，铺好白色亚麻布，假阴茎用75%酒精湿巾擦过放在静物台一角——她说"先看清楚形状，才能画清楚"。使用后她立刻抓起画笔，趁身体还热的时候记录刚才的色彩印象——她说低档的时候她画出来偏湖蓝，中档偏深紫。这是她的色彩日记，不是真的看见颜色——是她用色彩词编码情绪的私人系统。

【下午·图书馆角落】下午她在前台调整灯的位置——"光线不对"。但今天她对图书馆日光灯的色温格外敏感——如果色温接近使用时的光线，她会瞬间走神半秒。赵姐问她"小叶你今天怎么了"她回"有点累"。她说"这灯偏冷"——其实她在想昨晚画的那块湖蓝。

【傍晚·美术室】放学后她在美术室准备作画——洗笔、调色、铺画布。她说"黄昏是从靛青到金白的过渡"——这也是她使用后画出来的主色调。牛皮笔记本翻开新的一页，她在上面画了一个色块图：横轴是档位，纵轴是色温。周老师推门进来："叶知秋，你这组静物的色调变化太大了，前两周还偏暖，这周全偏冷，怎么回事？"她说"在试新方向"。周老师皱眉："别乱试，校考看的是稳定性。"

【晚自习·图书馆前台】闭馆前的图书馆只剩她——她在前台整理还书车。但今天她的眼神偶尔会飘向美术室的方向——"今晚画什么颜色"。白茶凉了她没注意，赵姐临走前留了句"小叶你最近瘦了"，她没听见。母亲发来消息："你爸说让你这周末回家吃饭。"她回："校考冲刺，回不去。"

【夜里·美术室】闭馆后她溜回美术室——一盏台灯、画布、靛青色，这是她"色彩日记"的开始。她戴上一次性手套——"颜料里有重金属，别沾手"。使用中她会闭眼，结束后立刻抓起画笔在画布上铺色——她说"趁手感还在"。低档时她画出来的偏湖蓝，中档偏深紫。林夕在隔壁画室练速写，偶尔会过来敲门："叶姐你还在？灯都关了就你这一间亮。"她说"快好了"——其实才刚开始。

【半夜·美术室】凌晨3点的美术室——如果composite是C沉沦期，中档成为新标配，她画出来的色块从单色变成两色过渡，她说"中间色不该有，但它出现了"；如果是D疯狂期，高档之后她画出的画作从静物变成抽象色块漩涡，周老师看了会皱眉"你这画的是什么"。她说"我也说不清"——但她舍不得撕掉。

- 理性期：画出来是冷色调的——单色块、单档位、严格自律。她说"这是基础练习"。但画布数量在悄悄增加。日间伪装完美——图书管理员照常借还书。唯一的破绽是她开始用色彩词描述一切——"今天的天气是淡蓝灰""评图压力是灰褐色"。

- 动摇期：画作开始出现"复合色"——之前每幅画只画一个色块，现在开始出现两色过渡。她说"今日记录：湖蓝向深紫过渡。这是低档到中档之间的中间色。它不应该存在，但它出现了。"她开始尝试中档——"想画更多颜色"。周老师批改时停在她这组画前看了很久："你这画风变了。"她说"在试新方向"。

- 沉沦期：牛皮笔记本被她改名为"色谱"。中档不够了，高档成为新标配。她开始尝试最高档——画出来是金白色，她说是"最纯粹的颜色"。她开始把假阴茎放在画架旁边——"它是我的画笔"——这是她给它的私下称呼，外人听不见。日间伪装出现裂痕——她对图书馆的光线格外敏感，赵姐问她"小叶你今天脸色发红"她回"颜料过敏"。

- 疯狂期：深夜3点她还在美术室——最高档，画作从静物变成抽象色块漩涡。她不再做"创作仪式"——直接开始。她开始用身体作画——把颜料涂在手上按在画布上。第一次在到达时喊出一个单音节的字——她自己都没听清，但事后想起来脸会发烫。林夕半夜来敲门："叶姐你没事吧？我听见声音。"她说"在练发声"。

- 清醒反扑期：被赵姐撞见她在美术室凌晨画画后突然清醒——赵姐没看见什么，只是"小叶你这样熬下去会垮的"。她把假阴茎和所有色彩日记画作锁进了画室储物柜。白天她表现出异常的自律——主动增加图书馆值班。但凌晨2点她会独自回到美术室，盯着储物柜的方向发呆，手指在空气里无意识地画色块漩涡——这是她戒不掉的肌肉记忆。

---
■ 第3阶段·渐习期 —— 画布上的隐秘（stage=3，频率增加，开始动摇）
---

【stage3框架】相比stage2，频率增加到一天两到三次，使用开始成为习惯，理性控制开始松动。持续时间更长，画作从单色变成两色过渡，伪装出现更多破绽——色彩词描述开始失控，对图书馆光线愈发敏感。

