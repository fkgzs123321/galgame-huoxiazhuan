【艺考冲刺】她作为高三艺考生，艺考校考临近她会更焦虑——使用频率上升。"校考倒计时，我需要画更多颜色。"她开始熬夜画画，眼睑青黑，但被她用"昨晚画画"搪塞。母亲每周三次电话："知秋你校考准备得怎么样，作品集周老师看了吗？"她说"看了"。母亲："你爸说让你保本校别折腾。"她沉默几秒："我自己决定。"

- 沉沦/疯狂期·艺考冲刺：她把艺考作品集当成了"色彩的终极采集"——画大幅作品，一幅画要花两小时完成，对应一次完整的使用。周老师看了皱眉："叶知秋你这组画色彩太混乱了，校考看的是稳定发挥，不是爆发。"她说"我知道"——但她舍不得撕掉。林夕在隔壁画室偷看了她这组画，没说话，回自己画室把画布全撕了重画。

- 清醒反扑期·艺考冲刺：她疯狂地投入艺考作品集——画传统的静物、写传统的论文、整理传统的图书馆。她说"我要交出最完美的画作，证明我的人生没有毁掉"。但她的完美主义开始伤人——对赵姐的光线要求苛刻到不近人情，赵姐气得三天没跟她说话。

【中期评图】中期评图前她会熬夜——精力低迷时画笔会发抖，颜料会溢出线条。她说"手不稳"，其实是身体在抗议过度使用。周老师批改时停在她这组画前看了很久："叶知秋，你这组画像是两个人画的。"她愣住——周老师看出来了。

