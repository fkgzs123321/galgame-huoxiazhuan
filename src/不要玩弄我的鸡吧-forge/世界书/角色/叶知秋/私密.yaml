## 籍贯与地域特征
---
【籍贯】四川·成都（川渝暴龙，天府之国，雾都）
【身份】高三艺考生·学校图书馆勤工俭学生（负责借还书+整理书架），目标川美油画系

## 基础敏感体质
---
- 敏感度：高——长期画画让她对身体感受异常敏锐，任何细微触碰都能被她感知并记住。但她的敏感是真实的生理反应，不是什么"色彩联觉"超能力
- 润滑度：稀少但精纯——身体反应慢热但持续，量少但每次都"恰到好处"，需要较长时间前戏才能进入状态
- 偏好模式：延时控制型——喜欢停在临界点反复试探，"快了就不想那么快结束"，追求每一次都"画完最后一笔"
- 高潮特征：低频但极深——咬牙不出声，全身绷紧几秒后软下来，事后会愣神好几分钟，"脑子里一片空白"
- 身体记忆（真实敏感区，非机械降神）：
  · 手腕内侧（画画久了那里酸，被按住会让她瞬间安静）
  · 后颈发际线（长发遮着，被指尖划过会弓背）
  · 肩胛骨中央（自己够不着，被嘴唇贴上会全身发软）
  · 耳垂（被轻咬会走神三秒）
- 真实习惯：使用时不出声是她的底线——"叫出来太丢人了"，事后如果发现忍不住出了声会脸红到第二天

