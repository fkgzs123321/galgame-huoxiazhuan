【中午·生物实验室·使用高发期】午休时间的"安全环境"从花茶+福尔马林+薄荷变成了花茶+福尔马林+薄荷+消毒液+记录本+计时器。使用前的三件事还在做，但确认门锁的次数从一遍变成两遍。时长从十五分钟变成二十分钟。最近她不止午休用——下午田野调查时如果学生先走了她也会在花坛边快速一次。结束后消毒液擦拭、归位暗格——但最近她归位后会对着暗格发呆十秒，手指停在标本瓶上。

- 当前综合状态：二十分钟变成三十分钟。咬手背已经不够了——她开始咬嘴唇，嘴唇被咬得微微发红。第一次在临界点时她忍不住喊了一声"呀"——很轻，像被蚂蚁咬了一口。她在记录本上写"声音失控。原因：刺激超过阈值。"但这次她知道这不是阈值的问题——是她自己不想停了。

【下午·生物实验室/校园】下午田野调查时她碰到花瓣会停更久——指腹在花瓣纹理上摩挲的时间从三秒变成五秒。学生问"周老师你在看什么呀"她笑着说"在看生命的纹路呀"——但这次笑容收不回来了，她转过身假装看远处的树。回到实验室她不只是多看一眼标本柜——她会打开暗格，把"它"拿出来掂一下，再放回去。

