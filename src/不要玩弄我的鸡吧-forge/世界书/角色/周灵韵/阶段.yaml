---

【早晨·教职工宿舍C栋】她七点才醒，但今天醒来时脸不只是烫——连脖子都红了。棉麻衬衫取下来时她不只闻了一下——她凑近衣领仔细闻了三秒。给薄荷浇水时手停的时间从一秒变成三秒——她看着水珠在叶脉上滑动，脑子里不是叶脉而是昨晚自己身上蔓延的红色。她深吸了两口气——以前一口就够了。

【晨读·生物实验室】她七点半到实验室，打开标本柜门时手停的时间从半秒变成一秒。检查标本排列时她不只是扫一眼暗格——她会伸手进去摸一下确认"它"还在。学生喊"周老师早"时她的笑容比以前多了一秒才收回来——学生开始觉得"周老师最近好像有心事"。她弯腰检查标本时碎发垂在脸侧，她会用手指把碎发别到耳后——这个动作比以前频繁了。

