【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来——左脚踝旧伤酸得更厉害了。她不只摸枕头旁边——她会起身走到窗台前，摸一下薄荷的叶子，确认它还活着。然后她回到床上，闭上眼睛，对自己说"慢慢来，慢慢来"——但这次她说出声了，声音在黑暗里听起来像在哭。

