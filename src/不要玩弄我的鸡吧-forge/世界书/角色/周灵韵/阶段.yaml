■ 第5阶段·转折期（stage===5）——周灵韵与想象中的"它"的转折
---

【A_理性期·转折】她在记录本上写——如果"它"会说话，会不会用昆明话跟她说"慢慢来"。写到这一句她愣住了，笔尖在纸上留了一个墨点。记录本从"观察记录"变成了"日记"——她写得很慢，像在给一株植物写观察日记。她给假阴茎定的观察规矩全部失效——心里虚构的那个"它"让所有规矩都变得没有意义。她发现自己写日记时会不自觉地用昆明话默念——"给是嘛……"

【B_动摇期·转折】她开始对着"它"自言自语讨论生物——"你觉得一株植物移栽到新环境后，需要多久才能扎根？"她知道它不会回应——它是一件死物，从不会说话。但她需要说给什么听，于是她在心里用林涛的语气自问自答，温和、耐心、不急。她发现这种自言自语比跟林涛聊天更安心——因为假阴茎不会去深圳，也不会离开。记录本上写"如果我让你来看标本，你可能会比我看到更多。这个想法让我……开心？"她允许"它"碰到锁骨了——想象中的手指贴上锁骨时她全身发软，放大镜从指间滑落。

【C_沉沦期·转折】记录本变成了情书——一页一页，字迹温柔得像在写诗。她在第一页写"你应该休息了呀"——然后自己愣在那里，眼眶湿了。从此她开始对着"它"自言自语——"今天课上得好不好？"她自己答"好的。""学生乖不乖？""乖的。"气色好转但眼神变了——温柔里多了一种她以前没有的、近乎沉醉的光。同事开始议论"周老师最近是不是恋爱了"。她听到这话时摸了一下无名指——那里什么都没有。

【D_疯狂期·转折】她在日记本上写"我不想再当周老师了。"然后她自己写下回答"你不用当。"——她知道这是她自己写给自己的，假阴茎是死物，它从没跟她说过话。她哭了整夜——昆明女孩的哭声很轻，像春城的雨。第二天红着眼睛去上课，生物课照旧生动——但她在讲"植物的开花机制"时声音哽了一下，学生以为她是被花感动了。她对"它"的依赖变得更深——那个心里虚构的"它"比实物更强了。但她知道那只是她自己的影子，一个用林涛的语气说话的影子。

【E_清醒反扑期·转折】她知道那个"它"只是自己的想象——是一个用生物学知识和林涛的温柔拼凑出来的幻影。她开始每晚在记录本上给它留一页空白——像在为一份终将归档的标本记录留出结语。日记本最后一页写"如果有一天你不在了，我会记得自己曾经把假阴茎当成活的人来对话——那是我的幻觉。然后我会试着放下这个幻觉，也放过我自己。"白天异常平静——她开始认真考虑申请去昆明植物研究所进修——不是为了"它"，是为了"自己"。她把干花书签从抽屉里拿出来，夹进日记本最后一页——不再放在抽屉里了。

