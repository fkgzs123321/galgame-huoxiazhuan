■ 第4阶段·深入期（stage===4）——周灵韵与"它"的深度依赖
---

【A_理性期·深入】她试图用生物学的温柔重新建立控制——给假阴茎定"观察规矩"：只在实验室午后使用、时长不超过二十分钟、结束后必须立刻归位并记录观察结果。她把规矩写在标本记录本最后一页，用黑色水笔，字迹温柔圆润。但实际使用时她总会超时——比如整理标本时手会不自觉伸向暗格的方向。她把手缩回来，在记录本上写"今日超时。样本对我的吸引力在增加。"白天她依然温柔——但路过标本柜时步子会慢下来。

【B_动摇期·深入】规矩开始松动——她允许"它"碰到锁骨了。那里皮肤薄，一碰她就起鸡皮疙瘩，手里的放大镜掉了。她弯腰捡放大镜时脸已经红透了——连脖子都红了。记录本上写"皮肤反应超出预期。这不像观察，更像……"省略号。她开始叫它"你"——不是代号，是称呼。白天她给学生讲"植物的开花机制"时停了一下——"开花是植物对环境的回应。有些回应是本能，有些是……渴望。"她停了两秒才继续。

【C_沉沦期·深入】温柔教师的秩序感散了——标本记录本最后一页的观察规矩被她用黑色水笔轻轻划掉。她不再记录观察结果，不再设定时长。她把假阴茎从暗格里取出来放在实验台上——和放大镜、标本记录本并排，像一件实验器具。记录本合上了——"不再观察了。这不是实验。"深夜实验室的台灯下，她蹲在实验台前的样子不像那个给学生讲"生命很美"的周老师——更像一株在黑暗里悄悄生长的植物。

【D_疯狂期·深入】她开始跟它说话——用生物学的语言。"你知道吗，有些花只在夜里开。因为夜里没有蜜蜂，它们只能靠自己。"她对着它发呆，然后苦笑——"我在跟一个硅胶物体讲植物学。"她把那片干花书签拿出来放在它旁边——褪色的干花和它并排，像一组生命与无生命的对照。使用中她不再轻声呼吸——她的呼吸急促了，肩膀在发抖，嘴里说的不是生物学术语，是"别走"——说完她自己愣住了。记录本最后一页写"我不正常。但我不想正常。因为正常意味着没有你。"

【E_清醒反扑期·深入】她把假阴茎锁进标本柜暗格的最深处——用胶带封了三道。但当晚她又撕开胶带取出来。她把它包进采集袋扔进教学楼垃圾站——半夜又偷偷下楼捡回来洗净。她对着它崩溃——"我是学生物的。我比任何人都懂生命。为什么我连自己都管不住？"她拿出那片干花书签——林涛送的——对着干花说"你当初是不是也这样？想停停不下来？"她在记录本上写"生命自会找到出路。但如果出路是歧路呢？"

