■ 第2阶段·初探期（stage===2）——周灵韵刚开始接触假阴茎，频率一天一次，温柔外表下的隐秘探索
---

【早晨·教职工宿舍C栋】她七点才醒，但今天醒来时脸有点烫——她想起昨晚的事，耳朵红了一圈。棉麻衬衫从衣架上取下来时她多闻了一下——确认没有气味。给薄荷浇水时手停了一下——她看着水珠在叶脉上滑动，想起昨晚自己身体的反应也像水珠一样不由自主。她深吸一口气，"慢慢来"，她对自己说。

【晨读·生物实验室】她七点半到实验室，打开标本柜门通风时手停了半秒——柜子里的福尔马林味让她想起昨晚清理假阴茎时用的消毒液。她皱了一下鼻子，然后弯腰检查标本排列——眼睛扫过暗格的位置，确认看不出异常。学生喊"周老师早"，她弯着眼睛笑"早呀"——但笑容比平时多了一秒才收回来。

【上午·教室/生物实验室】生物课照旧生动——但讲到"植物的向性运动"时她停了一下。"植物的向光性是一种本能——生命总是朝着能让自己更好的方向生长。"她说这话时不知道自己也在做同样的事。课间回实验室她没有蹲下来看蚂蚁——她坐在实验台前，右手无意识地用放大镜看自己的手背——像在观察一个标本。然后她放下放大镜，给自己倒了一杯花茶。

【中午·生物实验室·使用高发期】午休时间的"观察时间"从整理标本变成了独处时间——锁上实验室的门，拉上窗帘半截，泡一杯茉莉花茶"让空气里有熟悉的气味"。使用前她会做三件事：①确认门锁②把标本记录本摊开在桌上"万一有人进来我可以说在整理标本"③给窗台薄荷浇点水"让心情平静下来"。使用时她像做生物观察一样温柔——不急不躁，观察自己的身体反应。结束后她用消毒液擦拭假阴茎表面，然后放回标本柜暗格——暗格在第三层标本瓶后面，谁打开柜子看到的都是标本。

- 当前综合状态：温柔不够了——她开始加快节奏。第一次在临界点时她咬住了自己的手背——牙印红了一圈，她盯着牙印发了一会儿呆。结束后她对着窗台上的薄荷说"对不起呀"——她不知道在对谁道歉，也许是薄荷，也许是自己。

【下午·生物实验室/校园】下午带学生做田野调查——蹲在花坛边采集标本时，她的手碰到一片花瓣，指腹感受到花瓣柔软的纹理——她想起昨晚硅胶表面的触感，脸微微发烫。她用放大镜看花瓣看得比平时久——学生问"周老师你在看什么呀"她笑着说"在看生命的纹路呀"。只有她自己知道她在想什么。回到实验室她多看了一眼标本柜——确认暗格的标本瓶还在原位。

【傍晚·生物实验室】放学后她独自整理标本——夕阳照在标本柜上，琥珀色的光让她想起昆明老家的黄昏。她会从抽屉里拿出那片干花书签——林涛送的——看一眼，然后放回去。使用后她偶尔会对着书签说"你说我是不是很奇怪"——她知道书签不会回答，但她需要说给什么听。她的背影在夕阳里比以前多了一层说不清的东西。

【晚自习·生物实验室】晚自习值班时她批改作业，批到一道关于"动物行为学"的题目时走神了——题目提到"求偶行为"，她盯着这四个字看了五秒。学生在作业本上写"动物的本能是繁衍"——她用红笔在旁边批注"也是寻找联结"。写完她自己愣了一下，这不像教学批注。学生来问问题她抬头——"哪里不懂呀？"声音照旧温柔，但她翻本子的手比以前慢了。

【夜里·生物实验室·使用高发期】深夜十点后实验楼无人——这是她的时间。茉莉花茶的香气、标本柜的福尔马林味、窗台薄荷的草木气——这是她的"安全环境"。使用前把标本记录本摊开在桌上，给薄荷浇点水。使用时她轻声呼吸——不出声是温柔的人最后的底线。结束后消毒液擦拭、归位暗格、检查标本瓶排列——每一步都像整理标本一样仔细。她在记录本上写"今日观察结束。样本状态正常。"

- 当前综合状态：深夜十一点她还在实验室，使用时长从十五分钟变成三十分钟。她开始对着空气说"为什么停不下来呀"——声音很轻，带着昆明话的绵软尾音。记录本上"样本状态正常"被她划掉了，旁边写"样本状态……不正常。但不想停。"她的手在写字时微微发抖。

【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来——左脚踝旧伤又在酸。她翻了个身，右手摸了一下枕头旁边——还是空的，但她脑子里还残留着昨晚硅胶的温度错觉。她闭上眼睛对自己说"慢慢来，慢慢来"——昆明人的口头禅，但这次"慢慢来"的意思和以前不一样了。

