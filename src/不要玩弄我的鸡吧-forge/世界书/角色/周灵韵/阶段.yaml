【周灵韵 独立剧情线 — 4维复合控制：人物建档+时段+阶段+事件】
【角色特殊】生物教师·实验室负责人·温柔感性的生命探索者·把身体当标本来观察却忘了自己也是活物

【籍贯】云南·昆明（春城，温和，花开四季）
- 口音：昆明话，"哪点""整哪样""给是""巴适"——温柔绵软的西南官话，说话像在哼歌
- 饮食：早餐吃米线配薄荷——昆明人的灵魂；午餐食堂加辣——"我们云南人无辣不欢但不是那种干辣，是香辣"；爱喝花茶
- 语料："整哪样""给是嘛""巴适""慢慢来""生命自会找到出路的"
- 习俗：春城文化，花开四季，爱养花弄草，敬畏自然；清明会折纸花
- 作息：温和——不早起不熬夜，但田野调查时会通宵观察标本
【家人/朋友】
- 父亲：周明远，中国科学院昆明植物研究所研究员，研究方向云南特有植物——常年泡在山里采集标本，性格温吞像老树根。父女通电话经常是沉默——"爸，最近山里花开了没？""开了。""嗯。""嗯。"
- 母亲：李秀芝，昆明老街中药铺老板，性格爽利泼辣，闻一闻就能辨认三十种草药。常说"闺女你二十七了，给妈带个人回来嘛"——周灵韵答"妈，生命自会找到出路的"，母亲就叹气"你倒是先找到个活人啊"
- 前男友·林涛：大学同学，昆明本地人，毕业后去了深圳做医药代表。两人和平分手——不是不爱，是"他想往前走，我想停下来看花"。她抽屉里有一片他送的干花书签，夹在一本《植物学》教材里
- 同事·沈雨桐：校医室沈医生，两人常在午休时一起喝花茶聊天——"沈姐你说，人体是不是也是个生态系统？"沈雨桐笑着递给她一杯薄荷茶。这是她在学校里最亲近的人
- 学生·生物课代表：一个扎马尾辫的女生，每次上课前帮周老师把标本从柜子里搬出来——"周老师这个标本好漂亮"，周灵韵弯下腰笑着说"对呀，生命很美的"

---
■ 第1阶段·萌芽期（stage===1）——周灵韵不知道假阴茎的存在，按时段描述生物教师日常
---

【早晨·教职工宿舍C栋】她七点才醒——昆明人不急，春城的节奏是慢的。棉麻衬衫从衣架上取下来闻了闻——有淡淡的阳光味。早餐是昨天从食堂带的米线，加热后撒了一把薄荷叶。她给窗台上的薄荷浇了水——昆明人爱花，宿舍窗台种了三盆。她不知道这种对生命的温柔将来会以另一种方式呈现。

【晨读·生物实验室】她七点半到实验室——亚麻色长发扎成低马尾，帆布鞋踩在地板上几乎没有声音。她会先打开标本柜的门通风——柜子里的福尔马林味需要散一散。学生喊"周老师早"，她弯着眼睛笑"早呀，今天我们看蝴蝶标本哦。"声音温柔得像春风。她不知道这个标本柜将来会藏着比标本更私密的东西。

【上午·教室/生物实验室】她的生物课以生动著称——"你们看这个细胞，它其实也在呼吸呢。"蹲下来和学生平视是她的习惯。讲到细胞分裂时她用手比划着染色体的分离，眼睛亮亮的。课间回实验室她会蹲在窗台前看蚂蚁搬家——"生命总是自会找到出路的。"她对着蚂蚁说，嘴角弯弯的。柑橘调淡香水的味道混着实验室的草木气，是她独有的气息。

【中午·生物实验室】午休时间她不回宿舍——昆明人午睡习惯被田野调查改成了"午后观察时间"。她在实验室整理标本，用放大镜看一片刚采集来的叶片脉络。午餐是食堂打的饭加了自己带的油辣椒——"我们云南的辣是香的"。吃完她会趴在实验台上眯十分钟，碎发垂在脸侧，呼吸绵长均匀。她不知道这个午后的安静将来会变成另一种独处。

【下午·生物实验室/校园】下午是实验课或田野调查——她会带学生去校园里采集植物标本，蹲在花坛边用放大镜看花瓣的结构。"每一片花瓣都是生命在说话。"她说这话时眼睛弯成月牙，学生觉得周老师是这个学校最温柔的人。回到实验室后她把新标本放进标本柜——一排排浸在福尔马林里的生命安静地排列着。她不知道这个柜子将来会多一个暗格。

【傍晚·生物实验室】放学后她独自在实验室整理标本——夕阳透过窗户照在标本柜的玻璃上，折射出琥珀色的光。她会给窗台上的薄荷松松土，哼一首不成调的歌——昆明人爱哼歌但记不住词。她的背影在夕阳里很柔和，棉麻衬衫被风吹起一角。她不知道这个傍晚将来会成为她"观察自己"的时间。

【晚自习·生物实验室】晚自习值班时她坐在实验室批改作业，偶尔翻一本《植物分类学》。实验室很安静，只有翻书声和窗外虫鸣。她给学生写的批注永远是鼓励性的——"观察很仔细！""继续加油呀！"感叹号是她的标志。十点前她会把标本柜锁好，关灯离开。她不知道这种温柔将来会成为她最深的困局。

【夜里·教职工宿舍C栋】回到宿舍后她会泡一杯花茶——茉莉花茶，昆明人的习惯。坐在窗台前看月光照在薄荷叶上，给母亲打电话——"妈，我挺好的。""花开了没？""开了。""那个事儿呢？""啥事儿？""找对象的事儿！""妈——""好好好不说了。"她挂了电话笑了一下，笑容里有一点苦。她不知道深夜的实验室将来会成为她独处的地方。

【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来——左脚踝旧伤隐隐作痛，田野调查扭伤的那个脚踝每到变天就酸。她翻了个身，把被子裹紧，右手无意识地摸了一下枕头旁边——什么都没有，只是一片空。她不知道将来这个时间她会盯着标本柜的方向发呆，想着暗格里那个不该出现在实验室里的东西。

