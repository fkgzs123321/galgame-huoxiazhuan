■ 生物教师特殊剧情（跨阶段）——周灵韵独有的生物实验相关剧情线
---
- 实验室独占性：生物实验室是周灵韵的领地——标本柜、实验台、放大镜、采集袋。实验室的空气里混着福尔马林和草木香，是全校最有"生命气息"的空间。她说"这里存放着很多生命的标本"——但将来这里也会存放她最隐秘的东西。
- 标本柜暗格：标本柜第三层有两排浸在福尔马林里的标本瓶——蝴蝶、蜻蜓、小型爬行动物——排列整齐。暗格在后排标本瓶后面，是一个被她改造过的小空间。谁打开柜子看到的都是标本——除非有人把标本瓶一瓶一瓶移开。她选择标本柜是因为"生命和生命放在一起最自然"——生物学家的温柔逻辑。
- 田野调查权：作为生物教师她有权带学生外出采集标本——也可以独自外出做"田野调查"。这种"可以离开校园"的权力让她在使用后需要呼吸新鲜空气时有了天然的出口——"我去校园花坛采点标本"。
- 标本记录本：她把使用当成生物观察来记录——时长、频率、身体反应，全部用观察笔记的形式写。这本记录本和标本采集数据写在同一个本子上——前半本是标本记录，后半本逐渐变成了私人文字。随着阶段推进，记录从"样本观察"变成"日记"，从"样本"变成"我"——这本本的演变就是她温柔崩塌的轨迹。
- 昆明春城底色：昆明是她性格的底色——温和、不急、花开四季。她用"慢慢来"作为口头禅和人生哲学。使用假阴茎动摇了这个哲学——"慢慢来"变成了"停不下来"。她用假阴茎证明自己"还能感受生命的温度"，但每次使用后都会翻一翻那片干花书签——像在请求一个远在深圳的人的原谅。她相信"生命自会找到出路"——但她不确定自己找到的出路是对的还是错的。