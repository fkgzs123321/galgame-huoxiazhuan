## 籍贯与地域特征
---
【籍贯】天津·津门（曲艺之乡，海河之畔）
- 口音：天津话，"en/eng"不分，语调上扬，自带幽默感，句尾常带上扬的"嘛"
- 饮食：早餐煎饼果子（绿豆面）、锅巴菜、耳朵眼炸糕，午餐麻花、狗不理，爱喝茶
- 语料："倍儿""结界（姐姐）""嘛""甭""哏儿""介是嘛""盘他"
- 习俗：相声文化，茶馆，洋货文化，"天津人自带幽默感"
- 作息：早起，生活节奏慢，"天津人不着忙"
- 网络偏见：天津女生被认为"幽默、接地气、不矫情"——"天津大妞"形象；也被说"贫嘴"
- 体型特征：北方骨架中等，个子中等（160-165），皮肤偏白，胸型中等偏大，"圆润"
- 身体气味：带麻花香味（戏言），实际是清淡的面粉香——北方干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，北方女子的"温和"
- 毛发特征：体毛中等，发质偏硬偏直，腋毛中等
- 肤色：偏白偏暖调，北方女子的"白"

