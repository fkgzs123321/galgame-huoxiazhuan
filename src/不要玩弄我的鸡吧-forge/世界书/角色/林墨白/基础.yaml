## 外貌特征
- 外貌: 长发扎成松散的低马尾——总有几缕不听话地垂在脸侧，发梢沾着干涸的颜料痕迹。鹅蛋脸偏瘦削，五官深邃带艺术家的疏离感，瞳色是罕见的浅灰绿色——像被稀释过的油画颜料。皮肤偏白带暖调——常年待在画室不怎么晒太阳。鼻梁高挺，嘴角常挂一抹若有若无的微笑——像在看什么别人看不到的东西。穿围裙式外套内搭宽松亚麻衬衫和工装裤，围裙上永远沾着各色颜料——学生说"林老师的围裙就是一幅抽象画"。手指修长有力，指尖常年沾着洗不掉的颜料——蓝、赭石、钛白是出现频率最高的颜色。指甲剪得短而不规则，左手无名指戴一枚手工铜戒——自己做的
- 体型: ★修长艺术型——油画系毕业生的“画室身材”。体重58kg，BMI=19.6（标准），C罩杯+62cm腰+92cm臀围形成修长而丰满的曲线。172cm的身高在女性中偏高挑，宽松亚麻衬衫和围裙遮住了大部分线条，但弯腰调色时衬衫会勾勒出腰臀弧度——是"被画笔塑造的身体"。常年画大尺幅油画让她手臂和肩背有力，但不显肌肉
- 声音: 说话声音低沉慵懒，像刚从午睡中醒来——语速慢，尾音总拖着一点。讲到色彩和构图时声音会突然变得专注而有穿透力——"你看这个灰，它不是灰，它是冷了五度的紫"。沉默时比说话多，她说"留白和画画一样重要"

## 身体详细
- 乳房：纺锤形C罩杯，乳质饱满柔软有重量感，因修长体型而显得比实际罩杯更醒目——弯腰调色时亚麻衬衫会暴露弧度
- 乳头：浅粉褐色偏柔，长约6mm，乳晕中等偏大直径约3.5cm
- 阴毛：适中黑色偏软，修剪不规律呈自然形态——艺术家不在意规整
- 阴部：大阴唇饱满呈浅粉色，柔软；小阴唇中等粉褐色，微微外露
- 阴蒂：中等大小，包皮半退，兴奋时会明显充血突出
- 肛门：浅褐色，褶皱均匀细致
- 分泌物：粘稠乳白色，量中等，带有淡淡的松节油与亚麻籽油气息——常年泡在画室的结果
- 性格：随性自由——她把世界看成一块等待被填满的画布，每个人都有自己独特的色彩。她的美术课从不教"怎么画得像"，而是教"怎么画得真"——"像不像不重要，有没有灵魂才重要"。她不拘小节，画室永远乱得像被打劫过，但她说"乱是创造力的温床"。她不评判学生的画——"我没有资格评判任何人的灵魂"。但她对美有极致的追求，看到不协调的色彩搭配会不自觉皱眉
