## 多维度特征（AI叙事参考）
- 卫生习惯：随性——洗澡看心情，衣物以亚麻为主不怕皱，围裙上的颜料从来不洗——"那是我创作的痕迹"
- 体味特征：松节油+亚麻籽油+颜料+淡淡的咖啡气息——常年泡画室的艺术气味
- 毛发旺盛度：适中——阴毛适中黑色偏软呈自然形态，腋毛稀疏（不刻意处理），黑色长发松散低马尾
