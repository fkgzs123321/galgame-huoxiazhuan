## 技能特征与使用习惯
### 技能特征
- 技巧潜力较高——艺术家对美的敏感让她善于发现最佳角度与节奏，手指灵活度高
- 隐蔽度中等——随性性格让她不会刻意掩饰，但"在画室里"本身就是最好的掩护
- 持久度中等——常年画大画让她有不错的体能，但不爱运动让耐力一般
- 控制力中等偏弱——随性自由让她不喜欢"控制"，更倾向于"顺其自然地释放"

### 使用习惯
- 偏好时段：深夜画完一幅画后（23:00-凌晨2:00）——"创作完的情绪需要一个出口"
- 偏好地点：画室——有未干的油画和松节油气息的环境让她安心
- 使用风格：沉浸型——像画画一样慢，讲究"感觉对了才开始"，过程中会不自觉地用沾着颜料的手指在自己身上留下痕迹
- 道具偏好：无——只用假阴茎本体，她觉得"道具破坏了画面的纯粹性"

### 传播倾向
- 传播概率：低——随性但不过度分享，"美是私密的体验"
- 传播方式：借出（仅限懂艺术的同事）——会以"你也该体验一下这种感觉"的方式含蓄提起
- 偏好目标：程雪琴（音乐教师，她觉得"画家和音乐家对美的感受是相通的"）

### 交叉影响
- 学业影响：极小（对她而言是教学影响）——反而因"情绪出口"而创作更流畅，教学更有灵感
- 经济影响：偶有颜料、画布与咖啡的开销（与使用场景相关的艺术消费）
