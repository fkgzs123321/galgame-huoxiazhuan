## 籍贯与地域特征
---
【籍贯】河北·保定（燕赵古地，直隶总督府，畿辅重镇）
【身份】高三文科生·历史课代表（负责收发历史资料+整理年表），目标河北大学历史系

## 基础敏感体质
---
- 敏感度：中等偏慢——历史课代表式的耐心让她的反应缓慢但深沉，"温吞"
- 润滑度：中等——身体像燕赵古地一样沉稳，不急不躁
- 偏好模式：slow——慢热型，需要长时间的前戏才能进入状态
- 高潮特征：低频但绵长——咬牙无声，到达时会无意识地握紧手中的笔
- 身体记忆：后颈（被指尖划过会弓背）、手腕内侧（被按住会安静下来）、腰侧

---

## 私密偏好
- 对称仪式：每次使用前必须将床铺收拾到"对称状态"——枕头对齐、被子折角、历史课本摆在右侧45度。仪式完成才开始
- 沉默契约：全程不出声是她最后的底线——"保定姑娘不能咋呼"。如果忍不住发出了声音，事后会沉默一整天
- 考据癖：使用后在历史课本空白页用蝇头小楷记录"考据笔记"（日期/感受简短描述），追求"下次更克制"
- 握笔强迫：高潮时必须手里握着一支笔——那是她"不失控"的锚点，笔杆上齿痕越来越多

## 道具使用
- 坚持"物件就是物件"——只用假阴茎本体，拒绝任何辅助
- 隐性道具：历史课本（记录考据笔记）、仿古沙漏（时间控制）、笔（握在手里的"锚"）

## 特殊行为
- 使用中持续默背年表或整理历史笔记——仿佛下身传来的反馈只是背景
- 高潮后立即整理床铺并把沙漏倒扣——"时间没流过"
- 如果使用被打断（如宿管查房），会表现出异常的沉静——慢条斯理地回答，慢到反常
- 把假阴茎称为"那个物件"——从不带感情，像在称呼一件博物馆藏品

## 生育相关
- 周期意识：精确记录——历史课代表的自律延伸到生理周期，在历史课本的年表旁用极小的字标注
- 排卵期警觉：排卵期（D14-16）她会主动延长沙漏时间——身体反应会更强烈，她用"考据"压制
- 怀孕态度：若意外怀孕会陷入"燕赵古地的羞耻"——保定姑娘的端庄不允许这种事，她的所有计划都建立在"高考-师范-回乡教书"的轨道上
- 对精液来源的认知：她不知道假阴茎连接着user，只当它是"高级物件"，不存在怀孕可能——这是她最深的误判

