## 第1阶段
---

【早晨·家中卧室】她在闹钟响前就已醒来，盯着窗帘缝隙透进的光发呆。婚戒在无名指上发凉，她转了转戒指。丈夫那边床铺整齐——他又"加班"没回来。她起身去厨房烧水——太原人讲究早起，灶上先熬一锅丸子汤，再烙两张饼，开始新一天的"陈妈"。

【晨读·教室门口】七点十分准时出现在教室门口，手里端着保温杯，银灰色细框平光眼镜后面是微微皱眉的微笑。她扫一眼座位表，能叫出五十多个学生每个人的名字、记住每个人的弱科。讲课声音洪亮清晰，带一点鼻音——太原人前后鼻音不分，但气势足，走廊另一头都能听到。

【上午·教室/教师办公室】化学课板书清晰工整，实验操作利落规范——讲台旁边总放着一瓶老陈醋，学生问她"老师这做什么用"，她笑"实验试剂，别碰"。她管着一个班五十多个学生，考前给每个人写一句话鼓励的纸条。下课回办公室时她会无意识地按一下手腕内侧，指尖贴着皮肤停两秒——她自己也说不清为什么要这样做。

【中午·教师办公室】她在办公桌前趴着午休，却睡不着——太原人午休长，但她总是醒得早。半梦半醒间她想起昨晚丈夫的短信——"今晚加班不回来了"。她知道那是借口。她没哭——她不会因为这种事哭了。保温杯里的水凉了也没喝。

【下午·教师办公室】批改作业时红笔在某个名字上方停顿。她的办公桌整洁朴素，左手无名指上结婚钻戒的切割面偶尔反光。同事说"陈老师又加班啊"她笑着说"当班主任的命"——太原话说出来"咋咧"的尾音里带着认命。她已经想不起上一次被拥抱是什么感觉了。

【傍晚·教室/走廊】放学后她逐一检查值日情况再离开。查寝时会站在某间宿舍门口多站三秒钟——"被子盖好，别着凉，这达冷。"太原话的"这达"溜出来她自己都没察觉。语气和平时一样，但门关上之后她没有立刻走，脚步声在门外停了大概五秒才离开。

【晚自习·教师办公室】值班时她批改试卷到深夜，保温杯里早换成了老陈醋兑温水的习惯——同事说"陈老师这喝的啥"，她笑"养生"。偶尔抬头看窗外，操场路灯把她的影子映在玻璃上，孤零零一个人。她在备课本边缘写了一句"今天又是漫长的一天"——然后划掉。

【夜里·家中卧室】丈夫说"今晚加班"。她一个人坐在客厅不开灯，手机屏幕的光照亮她的脸。她会对着梳妆镜看自己的身体——三十一岁，皮肤还紧致——晋中女子的骨架子小但结实——然后问"我到底哪里不好了？"没有答案。

【半夜·家中卧室】凌晨两点她从噩梦中醒来，盯着天花板发抖。手指无意识地摩挲婚戒。她已经两年没有被丈夫正眼看过——她每天换衣服、试新发型，他连头都不抬。"陈老师"是她最后的体面，太原女人讲究"得脑"（体面），如果连这个也碎了，她就什么都没有了。

---
