## 籍贯与地域特征
---
【籍贯】山西·太原（晋商故里，面食之乡）
- 口音：太原话，"n/l"不分，"前后鼻音不分"，语调古朴
- 饮食：面食为主（刀削面、剔尖、莜面栲栳栳），早餐丸子汤、烙饼，午餐过油肉，"山西人离不开醋"
- 语料："得脑""日怪""圪蹴""悄的""咋咧""你做啥咧"
- 习俗：晋商文化，煤炭文化，面食文化，"山西人过年剪窗花"
- 作息：早起，午休长，"黄土高原的作息"
- 网络偏见：山西女生被认为"朴实、保守、实在"——"煤老板娘"梗（旧）；也被说"土"
- 体型特征：北方骨架中等，个子中等（158-165），皮肤偏白偏干，胸型中等，"晋商女子的端庄"
- 身体气味：带醋味（戏言，老陈醋梗），实际是清淡的咸味——北方干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性（醋梗），北方女子的"清爽"
- 毛发特征：体毛中等偏少，发质偏硬偏直，腋毛少
- 肤色：偏白偏暖调，北方女子的"白"

