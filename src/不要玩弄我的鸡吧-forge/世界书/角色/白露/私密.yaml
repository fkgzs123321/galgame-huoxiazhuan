## 基础敏感体质
---
- 敏感度：中等但爆发力强——运动员式身体反应直接而猛烈，像百米起跑的瞬间，所有神经末梢同时点火
- 润滑度：中等且稳定——长期运动维持良好循环，反应迅速但量不大，她说"身体是机器，机器要省着用"
- 偏好模式：internal——直接深入型，不喜迂回，"训练不需要花哨，需要的是到位"
- 高潮特征：高频而猛烈——急切释放型，单次短而有力，像百米冲刺的冲线瞬间。到达时她不会蜷缩叫喊，而是伸展身体，像跑完最后一圈后做整理运动一样平静地享受释放
- 身体记忆：颈后（被按住会让她全身放松，像教练按住运动员肩颈）、大腿内侧（被触碰会让她本能张开腿，起跑姿势的延伸）、脚踝（被握住会让她安静下来，像起跑器抵住脚的踏实感）

