## 籍贯与地域特征
---
【籍贯】山东·济南（齐鲁大地，泉城）
- 口音：济南话，"r"读"y"（人→银），语调硬朗直爽，"说事儿不说事儿"
- 饮食：早餐把子肉配馒头、甜沫、油旋，午餐鲁菜（九转大肠、糖醋鲤鱼），大葱蘸酱，"山东人离不开葱"
- 语料："杠赛来""尔力""也立""夜来""妮儿""老师儿"
- 习俗：孔孟之乡，礼数周全，好客，"有朋自远方来不亦乐乎"，过年磕头
- 作息：早起，作息规律，"日出而作"
- 网络偏见：山东女生被认为"高、壮、实在、能喝"——"山东大嫚"形象；也被说"保守、土"
- 体型特征：北方骨架偏大，个子偏高（165-172），皮肤偏白偏干，胸型中等偏大，肩宽，"山东大嫚"
- 身体气味：带葱味（戏言），实际是清淡的咸味——北方干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，北方女子的"清爽"
- 毛发特征：体毛中等偏少，发质偏硬偏直，腋毛少
- 肤色：偏白偏暖调，北方女子的"白里透红"

