【傍晚·操场】查寝前的空档她会去操场跑步——但现在跑步不只是为了保持体能，是为了消耗掉某种"多余的能量"。夕阳下她的影子拉得很长，她会对着空气说"再来一圈"——像在跟一个不存在的陪练说话。

