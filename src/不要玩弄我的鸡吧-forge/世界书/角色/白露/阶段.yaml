【夜里·宿管室·使用高发期】查寝结束后22:30-23:30是她唯一属于自己的时间——暗红色床单、旧运动毛巾、蓝牙音箱放电子乐。使用前做几个拉伸动作"热身"，使用后做几组俯卧撑"冷却"——运动员的习惯延伸。她会给自己定个时间——"今晚就半小时"——但常常超时。

