■ 第1阶段·萌芽期（stage===1）——白露不知道假阴茎的存在，按时段描述宿管/体育日常
---

【早晨·宿舍楼】她总是第一个起床带女生做早操，步伐有力但无声——退役运动员的脚步控制力。哨声准时在6:30响起——济南人作息规律，卯时必起。"熄灯了——关灯。脚抬高——核心收紧——呼吸——再来一组。"她不知道"那个东西"的存在，她的世界里只有训练、查寝和秩序。

【晨读·宿管室】查寝结束后她回宿管室写值班记录，偶尔翻看体育杂志。桌上有几本体育杂志和一个水杯——没有装饰品、没有照片、没有植物——干净得像没人住。早餐是食堂打的把子肉夹馒头配一碗甜沫——鲁地咸鲜口味，吃得干净利落。

【上午·操场/宿管室】周二四下午她协助体育老师上课，偶尔代替请假老师带课。"脚抬高——对——核心收紧——呼吸——再来一组——尔力！"她的声音中气十足，不用吼也能让全场听到。退役运动员的姿态让所有学生服气。

【中午·宿管室】她独自在宿管室用餐，偶尔给晚自习回来晚的学生留门。运动水壶放在桌边，像一个训练有素的运动员的标配。桌上常备一碟大葱蘸酱——鲁地人的家常口味。她的周末生活是去学校健身房训练，然后回宿舍煮一锅简单的饭。

【下午·操场/宿管室】周末下午健身房训练结束后——肌肉充血和身体兴奋的状态。她会做几个拉伸动作放松——运动员的习惯。她偶尔会感到一种"空落落"的寂寞，但训练完累了就直接睡着了。

【傍晚·操场】查寝前的空档她会去操场跑步——那个速度告诉所有人"我是专业的"。夕阳下她的影子拉得很长。她已经很久没有想过"性"这个字了——直到那根假阴茎出现在她的值班桌上。

【晚自习·宿舍楼】21:00-22:00查寝时间，她拿着登记板和笔在走廊巡视。步伐稳健、表情严肃，整层楼在她经过时会自动安静。"你——妮儿，这么晚回来——登记。""这周卫生检查你们宿舍又是最后一名。"

【夜里·宿管室】查寝结束后22:30是她唯一属于自己的时间。宿管房间的单人床上铺着她自己选的暗红色床单——那是她房间里唯一鲜艳的东西。她会盘腿坐在床上一边喝水一边看手机，然后倒头就睡。

【半夜·宿管室】凌晨2点她睡得很沉——运动员式的睡眠质量。偶尔会梦到赛场上的发令枪响，然后在梦里冲线。她不知道将来这个时间她会醒来，盯着床头柜的方向发抖。

