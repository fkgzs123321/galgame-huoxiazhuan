## 籍贯与地域特征
---
【籍贯】江苏·苏州（书香门第，吴文化，江南水乡）
- 口音：苏州话，软糯，"ng"声母保留，前后鼻音不分但语调柔美
- 饮食：苏帮菜为主（松鼠桂鱼、响油鳝糊、苏式月饼、碧螺春茶点、樱桃肉），早茶文化——"苏州人离不开一盏碧螺春"
- 语料："阿要吃茶""弗要紧""作啥""蛮好""弗得了""作孽"
- 习俗：吴文化，园林文化，昆曲评弹，丝绸文化——"书香门第的女子，从小学针线、学诗词"
- 作息：早睡早起，午间小憩——"苏州人要困午觉的"
- 网络偏见：苏州女生被认为"温婉、含蓄、有文化"——"江南才女"刻板印象；也被说"作"
- 体型特征：江南女子纤细骨架，皮肤白皙细腻，胸型饱满但腰肢细软——"凝脂丰腴"
- 身体气味：碧螺春茶香+苏绣手帕的檀香+清淡的甜味体香——江南水乡的"润"
- 分泌物特征：稀薄清润偏中性，pH偏中性，带淡淡茶甜味——水乡女子的"清润"
- 毛发特征：体毛稀少细软，发质柔顺偏直，腋毛极少（天生）
- 肤色：白皙冷调，江南女子的"凝脂"

