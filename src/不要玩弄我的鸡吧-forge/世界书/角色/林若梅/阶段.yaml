## 第1阶段
---

【早晨·家中卧室】她在闹钟响前就已醒来，盯着窗帘缝隙透进的光发呆。玉镯在手腕上发凉，她转了转镯子。丈夫周明远那边床铺整齐——他三年没回家了她也知道。她起身去厨房烧水——苏州人讲究早起，灶上先沏一盏碧螺春，再热一碗桂花糖粥，开始新一天的"林妈妈"。

【晨读·语文教研室】七点十分准时出现在教研室，金丝边眼镜后面是微微皱眉的微笑。她扫一眼作文堆积的山，能叫出全班学生每个人的名字、记住每个人的写作风格。吟诵古诗的咬字清亮带苏州腔的软糯——"ng"声母保留让她读《琵琶行》韵味十足，吟到"大珠小珠落玉盘"时整个教研室都安静下来。

【上午·教室/语文教研室】语文课板书工整小楷，吟诵"落霞与孤鹜齐飞，秋水共长天一色"——苏州女子的吟诵像评弹，抑扬顿挫。讲台旁总放着一盏碧螺春，学生问她"老师这茶好喝吗"她笑"碧螺春是苏州人的命，弗要紧，你长大就懂了"。她管着高三语文教研组，考前给每个学生写一句鼓励的诗句。下课回教研室时她会无意识地按一下手腕内侧戴玉镯处——指尖贴着玉镯下皮肤停两秒——她自己也说不清为什么要这样做。

【中午·教研室】苏州人午休长，她在办公桌前趴着午休，却睡不着——总是醒得早。半梦半醒间她想起昨晚丈夫周明远的短信——"本月不回来了，应酬多"。她知道那是借口，三年了他连过年都没回。她没哭——她不会因为这种事哭了，眼泪早在第一年就流尽了。碧螺春凉了也没喝。

【下午·教研室】批改作文时毛笔在某个名字上方停顿。她的办公桌整洁雅致，左手腕上白玉镯偶尔反光，桌面摆着一方端砚、一支湖笔、一叠宣纸。同事张老师端来一盏新沏的碧螺春——"林老师你又加班啊"她笑着说"教研组长的命"——苏州话说出来"作啥"的尾音里带着认命。她已经想不起上一次被丈夫正眼看是什么时候了。

【傍晚·教室/走廊】放学后她逐一检查值日情况再离开。查寝时会站在某间宿舍门口多站三秒钟——"被子可还够暖？苏州夜里凉，要盖厚点。"苏州话的"弗要紧"溜出来她自己都没察觉。语气和平时一样，但门关上之后她没有立刻走，脚步声在门外停了大概五秒才离开。

【晚自习·教研室】值班时她批改试卷到深夜，碧螺春换成了第三盏——同事张老师说"林老师这喝的啥"，她笑"提神"。偶尔抬头看窗外，操场路灯把她的影子映在玻璃上，孤零零一个人。她在备课本边缘用毛笔写了一句"此情可待成追忆"——然后划掉。

【夜里·家中卧室】丈夫周明远三年未归家，连短信都不来一条。她一个人坐在客厅不开灯，手机屏幕的光照亮她的脸。她会对着妆台镜看自己的身体——三十二岁，皮肤还凝脂——江南女子的骨架子小但丰腴——然后问"我到底哪里不好了？"没有答案。隔壁房间女儿周雨橙睡得正香，是她唯一的安慰。

【半夜·家中卧室】凌晨两点她从噩梦中醒来，盯着天花板发抖。手指无意识地摩挲玉镯。她已经三年没有被丈夫正眼看过——她每天换旗袍、试新发髻、戴珍珠发夹，他连头都不回，何况他根本不回家。"林老师"是她最后的体面，书香门第的女子讲究"端庄"，如果连这个也碎了，她就什么都没有了。

---
