## 基础敏感体质
---
- 敏感度：极高——辣妹式的身体从不压抑，神经末梢像被反复点亮过的霓虹灯，一点刺激就全面通电
- 润滑度：充沛——身体从不伪装，反应比脑子快半拍，想法刚冒头布料就已经湿了一片
- 偏好模式：internal——挑战型，喜欢把"今天能撑几分钟"当成游戏，每破一次纪录就在手环上记一笔
- 高潮特征：高频外放——笑闹着到达，喉咙里全是夸张的"卧槽"，到达时反而会突然安静半秒再爆笑
- 身体记忆：锁骨（被亲一下会全身酥软三秒）、髋骨两侧（按住会自动拱腰）、舌尖（轻微咬合会触发全身电流）

