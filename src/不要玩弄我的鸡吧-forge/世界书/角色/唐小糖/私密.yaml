## 籍贯与地域特征
---
【籍贯】广西·桂林（山水甲天下，壮乡风情）
- 口音：桂林话，"n/l"不分，语调有韵律感，西南官话，"塑料普通话"
- 饮食：桂林米粉（卤菜粉）、螺蛳粉（邻近柳州），嗜酸辣，早餐米粉，"桂林人早餐嗦粉"
- 语料："卵""戳""捏""搞鬼""浪子""你搞咩"
- 习俗：壮族风情（部分），三月三歌圩，山歌文化，"桂林山水甲天下"
- 作息：早起，午休长，"南方人的午觉"
- 网络偏见：广西女生被认为"接地气、能吃苦、山歌张口就来"——"广西表妹"梗；也被说"口音重"
- 体型特征：南方骨架偏小，个子偏矮（155-160），皮肤偏小麦色，胸型中等，腰细，"南方妹子的玲珑"
- 身体气味：带酸笋味（螺蛳粉梗），实际是清淡的汗味——南方湿润气候的"清爽"
- 分泌物特征：偏稠，带微酸甜，pH偏酸性，南方女子的"浓郁"
- 毛发特征：体毛中等偏多（南方基因），发质偏硬偏黑，腋毛偏多
- 肤色：偏小麦色，南方日晒的"蜜色"

