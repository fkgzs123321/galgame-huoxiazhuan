## 籍贯与地域特征
---
【籍贯】辽宁·沈阳（东北大姐大，重工业长子）
- 口音：东北话，"r"读"y"（人→银），"zh/ch/sh"读"z/c/s"（部分），语调豪爽，自带幽默感
- 饮食：早餐疙瘩汤、韭菜盒子、大碴粥，午餐炖菜（猪肉炖粉条、小鸡炖蘑菇），"东北菜量大"
- 语料："贼""嘎嘎""嗯呐""整""咋整""波棱盖儿""卡秃噜皮""瞅你咋地"
- 习俗：炕文化，大秧歌，二人转，"东北人过年包饺子"
- 作息：冬天天黑早，睡得早，"猫冬"
- 网络偏见：东北女生被认为"高、壮、豪爽、能喝、脾气大"——"东北大姐"形象；也被说"嗓门大、彪"
- 体型特征：北方骨架偏大，个子偏高（165-172），皮肤偏白偏干（北方干燥），胸型中等偏大，肩宽，"东北大妞"
- 身体气味：带炖菜味（戏言），实际是清淡的咸味——北方干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，北方女子的"清爽"
- 毛发特征：体毛中等偏少，发质偏硬偏直，腋毛少
- 肤色：偏白偏暖调，北方女子的"白里透红"

