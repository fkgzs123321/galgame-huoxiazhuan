## 基础敏感体质
---
- 敏感度：极高——内向者神经末梢格外敏锐，反应被她藏在沉默里，像被压到水下的纸页，一松手就会浮起
- 润滑度：低——身体紧张导致反应滞后，但精神亢奋，"身体跟不上脑子"
- 偏好模式：edging——慢节奏边缘控制，长时间停在临界点，她不敢让自己"完成"，怕失去控制
- 高潮特征：极低频但极深——她不敢让自己快速到达，每一次都是漫长的、屏息的、被压抑的，到达时咬住自己的手背把呻吟压碎在齿间
- 身体记忆：耳后（被指尖拂过会让她全身僵住，像被书页割伤）、手腕（被握住会让她呼吸停止——那是她翻书的手）、膝窝（被触碰会让她腿软，跪在书架之间）

