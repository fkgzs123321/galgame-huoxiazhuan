## 阶段调色盘
- 表色（淡灰色 #D3D3D3）：透明般的图书馆委员——她是图书馆的一部分，像一本安静摆在架上的旧书，你路过时不会特别注意它。她走路没有声音，呼吸没有声音，连翻书页都小心翼翼。同学们对她的印象只有"啊……图书委员好像叫……周什么来着？"她不介意——被人记住反而让她紧张。她喜欢自己在人群中隐形，因为隐形意味着安全。她的课桌在教室最后一排靠墙的位置，那里有一根柱子——正好挡住老师和其他同学的视线。她选这个位置的时候班主任还夸她"主动坐后排不挑座"，实际上她是算好了的——这个位置能看到全班，全班看不到她
- 间色（暖粉色 #FFB3B3）：书页间沉睡的欲望——她的身体从未被人触碰过，她也没想过被人触碰。直到假阴茎出现。第一次使用后她失眠了三天——不是因为愧疚或恐惧，是因为她发现了一个自己完全不知道存在的世界：原来身体可以这样。原来那些小说里写的"春潮涌动""花枝乱颤"不是夸张的修辞——是写实。她开始重新读以前看过的言情小说，发现每一段床戏她都自动带入画面——而画面里男人的脸是模糊的。她在日记里写："原来书里写的'电流穿过脊椎'是真的。原来我不是在读书——我是在找一面镜子。"
- 底色（暗红色 #8B0000）：沉默的执迷者——她最危险的一点是：她什么都不说。她不像唐小糖那样张扬、不像柳思雨那样热烈——她就只是安静地、默默地、日复一日地使用着。她每天在图书馆角落里坐多久，就用多久。不发出声音，不留下痕迹，不让人察觉。她可以这样用三年、五年、十年——直到某一天，你偶然翻开一本旧书的扉页，看到一行娟秀的小字："第854天。没有人知道。这样最好。"

