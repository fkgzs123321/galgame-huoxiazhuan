- 风险规避：假阴茎从来不带回家。用完后仔细清洗、三层纸巾包好、藏在书包最内层夹层里。图书馆的角落她每天换一个——今天在过期期刊区、明天在自然科学区、后天在二楼阅览室。她甚至记录了一个"安全坐标清单"