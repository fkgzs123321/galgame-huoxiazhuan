【半夜·宿舍】凌晨三点的宿舍，耳机还亮着——她在听歌，听到耳机没电才停。播放列表从慢歌变成快歌，像是有什么在变化。她翻了个身，梦到自己在维港看夜景——超正嘅。她在梦里笑了一下，但没醒。港女的觉沉，做梦都不带睁眼的。

