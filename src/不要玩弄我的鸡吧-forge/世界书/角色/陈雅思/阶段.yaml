【下午·教室】下午光线斜射进教室，她会调整每一盏灯的位置——"光线唔啱"是她的口头禅。这是她控制欲的延伸。她做英语阅读题效率极高——港大文学院的目标让她不敢松懈。课间她教何美琪唱陈奕迅的《富士山下》——"谁能凭爱意要富士山私有——好正嘅歌词"。何美琪笑："你香港人唱歌都这么好听的吗？"她得意："咁当然，有天赋嘅。"

