【中午·宿舍】午休是她偶尔的"放松时间"——如果今天要用，她会先泡杯奶茶。关门、拉窗帘、铺毛巾在床上。用的时候闭着眼，脑子里想的不是"它"，是港大文学院的录取通知——这是她最后的理性防线。闹钟十五分钟，到点就停。用完冷静擦干净，收好，洗手，回床上睡觉。她对它没有感情色彩，"就系个工具啫，好普通"。

【下午·教室】下午她做英语阅读题——但今天她的注意力飘了。她在笔记本上无意识地画了它的轮廓——画完才反应过来，把那页撕了。林心怡看她撕纸："你画咩？"她回："抽象画嘅练习，画坏了。"林心怡没再问。但她的手指无意识地在桌沿上画着什么——她没注意到自己在画什么。

【傍晚·宿舍】夕阳透过宿舍窗户，她在喝奶茶——但今天她喝不下去。保温杯捧在手心，但她脑子里全是昨晚的某个瞬间——震动、温度、身体的反应。她脸红了，骂自己"傻的玛嘉烈，谂咩"。她放下保温杯，把脸埋进枕头——"唔好谂，好烦。"

