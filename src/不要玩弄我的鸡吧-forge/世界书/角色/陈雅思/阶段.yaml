【半夜·宿舍】凌晨三点她通常已经睡下——港女的作息规律。除非处于动摇期或沉沦期，闹钟被关掉，使用时间失控延长。这时她可能还醒着，盯着天花板发呆，耳机里放着陈奕迅的慢歌。她翻了个身，手指无意识地摸了一下后颈——那里似乎永远不凉了。她告诉自己"快啲瞓，听日仲有课"——但脑子里全是那个震动的节奏。

