■ 第1阶段·萌芽期 —— 港女的日常（stage=1，未接触假阴茎）
---

【黎明·宿舍】五点宿舍没人醒——她独自起来泡杯奶茶。保温杯捧在手心，整个世界都安静了。她说"早晨好适合饮奶茶"。她窝在被窝里，中长发散在枕头上——"冇时间搞头发"。手机屏幕亮着，播放列表是陈奕迅的《富士山下》《单车》《岁月如歌》。她闭着眼——这是她一天最安静的时刻。妈妈昨晚发来消息："雅思你那边冷不冷？"她回："超冷的，暖气唔够。"——港女把内地暖气和香港冷气分得清清楚楚。

【晨读·教室】晨读时段她已在教室记单词——速度不快但持续，安静得连翻书声都不发出。她说"呢个时段好适合背单词"。她的英语发音带港式口音——"actually"读成"艾克切利"，但胜在流利。同桌林心怡凑过来："陈雅思你今早又听陈奕迅啊？"她笑："好听嘅，你要唔听？"林心怡摇头："我听周杰伦。"她假装生气："你哋台湾人真系嘅。"

