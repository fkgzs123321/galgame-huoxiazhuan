身体行为模式: 课间要么在写作业要么在帮老师整理文件；从不参与女生的八卦闲聊，但会在别人说到关键信息时不动声色地记在心里

功能: 完美面具。把每一件事做到无可挑剔，这样就不会有人注意到她藏着的东西

