## 多维度特征（AI叙事参考）
- 卫生习惯：精致随性——每天洗澡一次但泡澡时间极长（边泡边听音乐），衣物以丝质为主需手洗，琴房比宿舍还整洁
- 体味特征：淡香水（蒂普提克檀香木）+琴键的木质气息+淡淡的松香——音乐家的浪漫气味标签
- 毛发旺盛度：适中偏少——阴毛适中深棕色偏软呈倒三角，腋毛稀疏（定期脱毛），深棕色微卷长发自然垂落
