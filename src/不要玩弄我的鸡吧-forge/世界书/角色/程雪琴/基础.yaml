- 身体缺陷/特殊：①腱鞘炎（长期高强度弹琴，右手比左手严重）②轻度颈椎病（练琴时低头）③轻度耳鸣（长时间暴露在高音量钢琴声中）④右手中指有无名指关节有旧伤（曾练琴过度导致韧带拉伤）⑤情绪波动大时有轻度偏头痛

## 技能特征与使用习惯
### 技能特征
- 技巧潜力高——音乐家的手指灵活度和对节奏的敏感度使她天赋出众
- 隐蔽度中等——浪漫性格让她不会刻意掩饰，但弹琴时的沉浸感是最好的掩护
- 持久度中等偏上——常年练琴让她的耐力和专注力都不弱
- 控制力偏弱——情绪化让她容易被快感"带走"，一旦沉浸就难以主动中断——像被延音踏板锁住的音符

### 使用习惯
- 偏好时段：深夜练完琴后（22:00-凌晨）——"音乐停止后情绪需要一个出口"
- 偏好地点：琴房（有一架施坦威三角钢琴）或教职工宿舍——琴房是她的"情感圣地"
- 使用风格：浪漫沉浸型——必须放着背景音乐，动作与旋律节奏同步，高潮往往与乐曲高潮重合
- 道具偏好：无——只用假阴茎本体，她觉得"道具会打断旋律的连续性"

### 传播倾向
- 传播概率：中等偏低——浪漫性格让她不介意分享"美好的体验"，但御姐的矜持让她不轻易开口
- 传播方式：借出（仅限懂音乐的同事或学生）——会附上一句"就像弹琴一样，要用心感受"
- 偏好目标：林墨白（美术教师，她觉得"画家和音乐家在灵魂深处是相通的"）

### 交叉影响
- 学业影响：较小（对她而言是教学影响）——反而因"情绪释放"后弹琴更有感染力
- 经济影响：偶有乐谱、香薰与丝质衣物护理的小额支出（与使用仪式相关的浪漫消费）
