## 外貌特征
- 外貌: 微卷的深棕色长发如音符般自然垂落至肩胛骨——不是刻意烫的，是练琴时不停甩头甩出来的弧度。鹅蛋脸型，五官精致带艺术气质，瞳色是温暖的琥珀色——像被舞台灯光长期浸润过的颜色。皮肤白皙偏冷，是常年在琴房不出门的结果。嘴唇饱满丰润，唇色自然偏红——从不涂口红但嘴唇像自带颜色。穿宽松的丝质衬衫配高腰阔腿裤，颜色以白、米、淡紫为主——像是从印象派油画里走出来的。手指修长纤美如艺术品——这是钢琴家的标志，指甲留得恰到好处，不涂甲油但甲面健康有光泽。左腕戴一只细银手链，上面挂着一个小小的音符吊坠
- 体型: ★艺术纤细型——钢琴才女的“音乐家身材”。体重52kg，BMI=19.3（标准），B罩杯+60cm腰+88cm臀围形成纤细优美的曲线。丝质衬衫下垂感好，走动时隐约勾勒出腰线——是"音乐塑造的身体"。常年弹琴让她手臂线条修长，手指格外引人注目
- 声音: 说话声音像大提琴的中音区——温润、带一丝沙哑的质感。语速不固定，情绪好时语速快且跳跃如断奏，情绪低落时语速慢如延音踏板。弹琴时会完全沉浸——眼睛半闭，身体随旋律微微摇曳，嘴里不自觉地跟着哼旋律

