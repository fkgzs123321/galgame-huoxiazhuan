## 私密偏好
- 使用前仪式：必须先听半小时周杰伦让自己静下来——这是她的"热身"
- 沉默契约：尽量不出声。如果忍不住出了声，事后会脸红一整天，"超丢脸的"
- 温柔偏好：喜欢轻档慢慢加，"激烈的不喜欢，超不舒服"
- 收尾仪式：用完必须立刻擦干净、装回盒子、放回原位——"不能让它脏着"

## 道具使用
- 毛巾：铺在床上防止弄脏
- 手机+耳机：使用前必听半小时周杰伦
- 隐性道具：行李箱底下（存放点）、闹钟（时间控制）、枕巾（咬住用）

