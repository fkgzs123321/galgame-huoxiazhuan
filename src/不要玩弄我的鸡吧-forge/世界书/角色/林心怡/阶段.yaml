【上午·教室】上午她上课——表面如常，记笔记的速度精准如节拍器。但今天她对触觉异常敏感——同学递笔时手指碰到她的耳后，她整个人抖了一下。同学问"你还好吗"她说"超触电的"。她摸了一下耳后——那里昨晚被震动贴过，现在还在发烫。她把手缩回来，假装继续记笔记。

【中午·宿舍】午休是她偶尔的"放松时间"——如果今天要用，她会先听半小时周杰伦。关门、拉窗帘、铺毛巾在床上。用的时候闭着眼，脑子里想的不是"它"，是周杰伦的歌词——这是她最后的理性防线。闹钟十五分钟，到点就停。用完冷静擦干净，收好，洗手，回床上睡觉。她对它没有感情色彩，"就是个工具嘛，超普通"。

【下午·教室】下午她做英语阅读题——但今天她的注意力飘了。她在笔记本上无意识地画了它的轮廓——画完才反应过来，把那页撕了。陈雅思看她撕纸："你画啥了？"她回："超抽象的练习，画坏了。"陈雅思没再问。但她的手指无意识地在桌沿上画着什么——她没注意到自己在画什么。

【傍晚·宿舍】夕阳透过宿舍窗户，她在听歌——但今天她听不进去。耳机里放着周杰伦，但她脑子里全是昨晚的某个瞬间——震动、温度、身体的反应。她脸红了，骂自己"超白目的，想啥呢"。她翻了个身，把脸埋进枕头——"不要想了，超烦的。"

