---
■ 第1阶段·萌芽期 —— 台妹的日常（stage=1，未接触假阴茎）
---

【黎明·宿舍】五点宿舍没人醒——她独自起来听周杰伦。耳机戴上，整个世界都安静了。她窝在被窝里，奶茶色长发散在枕头上——"早上超适合听歌"。手机屏幕亮着，播放列表是《晴天》《七里香》《简单爱》。她闭着眼，手指在被角上轻轻打着拍子——这是她一天最安静的时刻。妈妈昨晚发来消息："心怡你那边冷不冷？"她回："超冷的，冷气房冻死人。"——台北女儿家把暖气叫冷气。

【晨读·教室】晨读时段她已在教室记单词——速度不快但持续，安静得连翻书声都不发出。她说"这个时段超适合背单词"。她的英语发音带台腔——"super"读成"酥泼"，但胜在流利。同桌陈雅思凑过来："林心怡你今早又听周杰伦啊？"她笑："超好听的，你要不要听？"陈雅思摇头："我听陈奕迅。"她假装生气："超没品味的。"

【上午·教室】上午她上课，记笔记的速度精准如节拍器——珍珠奶茶永远在右手边四十五度角。她的字迹圆润饱满，像她说话的尾音。老师提问她举手——英文发音带台腔但语法精准。课间她掏出手机看台北的天气——"台北今天二十六度，超舒服的，这边才十几度，冻死人。"陈雅思凑过来："香港今日都系十几度。"她俩相视而笑——两个南方姐妹在北方的寒冷里找到了共鸣。

【中午·食堂/宿舍】午休她溜回宿舍听歌——这是她"放松"的时段。她从食堂打了鸡腿便当和一杯珍珠奶茶——"三分糖去冰，超好喝"。吃完她躺下，耳机戴上，播放列表从慢歌变成快歌。她说"午休超适合发呆"。偶尔她会在笔记本上画几笔涂鸦——周杰伦专辑封面的简笔画。她睡得很沉——台妹的睡眠质量好。

【下午·教室】下午光线斜射进教室，她会调整每一盏灯的位置——"光线超不对"是她的口头禅。这是她控制欲的延伸。她做英语阅读题效率极高——台大外文系的目标让她不敢松懈。课间她教何美琪唱周杰伦的《七里香》——"雨下整夜，我的爱溢出就像雨水——超美的歌词"。何美琪笑："你台湾人唱歌都这么好听的吗？"她得意："那当然，超有天赋的。"

【傍晚·宿舍】夕阳透过宿舍窗户，她在听歌——这个时段的光让她最放松。她说"黄昏超适合听慢歌"。她窝在床上，奶茶色长发散在枕头上，耳机里放着《不能说的秘密》。妈妈发来视频通话——"心怡你今天吃饭了没？"她回："吃了，超好吃的。"妈妈："你爸说让你这周末打电话回家。"她说："好啦，我知道。"

【晚自习·教室】晚自习前的教室只剩她一个人——她在"自习"，敲键盘的节奏其实是某种她自己才懂的速记符号。她用笔记本电脑写英语作文——目标台大外文系的执念。陈雅思凑过来："林心怡你这篇作文写得超好的。"她笑："真的假的？我觉得超普通的。"陈雅思："你下次帮我改改。"她说："好啦，没问题。"

【夜里·宿舍】熄灯后她溜回床上——耳机、毛巾、周杰伦，这是她入睡的仪式。她闭着眼，手指在被角上打着拍子。隔壁床的陈雅思已经睡了，她最后看了一眼手机——台北的夜市现在应该正热闹。她有点想家——"超想念士林夜市的鸡排"。她合上眼，睡得很沉——台妹的睡眠质量好。

【半夜·宿舍】凌晨三点的宿舍，耳机还亮着——她在听歌，听到耳机没电才停。播放列表从慢歌变成快歌，像是有什么在变化。她翻了个身，梦到自己在台北的夜市吃鸡排——超香的。她在梦里笑了一下，但没醒。台妹的觉沉，做梦都不带睁眼的。

