- 沉沦期：闹钟被关掉了。"再五分钟"——但没有五分钟，是直到身体受不了为止。一周用五到六次，开始用最高那档。她开始不听歌就直接用——"听不进去，脑子里超乱"。把假阴茎从行李箱挪到了枕头底下，"方便拿"。用的时候会出声——她一直以为自己没出声，直到有一次半夜舍友翻身她吓得捂住嘴才发现自己叫了。事后脸红到第二天。

- 疯狂期：每天必用。深夜两三点还在宿舍床上，用完不收，直接放在枕头旁。她开始不在乎被撞见——"撞见就撞见嘛，超烦的"。最高档用惯了，轻档完全没感觉。她开始对着"它"说话——"你今天超不听话"——说完自己愣住，然后笑了，"我超白目的"。课本边缘开始出现它的轮廓涂鸦。

