■ 第2阶段·初探期 —— 周杰伦的掩护（stage=2，刚开始接触假阴茎）
---

【stage2框架】她刚开始接触假阴茎——频率一周两次，仍在"释放压力"的框架内。她把它当成"高级工具"，每次使用前必须先听半小时周杰伦让自己静下来——这是她的热身。闹钟十五分钟，到点就停。用完立刻装回盒子，塞进行李箱最底下。

