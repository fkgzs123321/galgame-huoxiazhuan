【夜里·宿舍】熄灯后她溜回床上——耳机、毛巾、周杰伦，这是她开始"放松"（也是其他事）的时刻。轻档震动是她习惯的节奏。她闭着眼，手指在被角上打着拍子——和周杰伦的节奏同步。闹钟十五分钟，到点就停。用完立刻擦干净，装回盒子，塞进行李箱最底下。她告诉自己"超普通的，就是放松一下"。

【半夜·宿舍】凌晨三点她通常已经睡下——台妹的作息规律。除非处于动摇期或沉沦期，闹钟被关掉，使用时间失控延长。这时她可能还醒着，盯着天花板发呆，耳机里放着周杰伦的慢歌。她翻了个身，手指无意识地摸了一下耳后——那里似乎永远不凉了。她告诉自己"快睡，明天还有课"——但脑子里全是那个震动的节奏。

- 理性期：她很自律——固定时段、固定时长、严格按规矩来。她说"该用就用，不要耽误"。但笔记本数量在悄悄增加。日间伪装完美——上课照常记笔记，没人看得出她昨晚做了什么。唯一的破绽是她有时候会走神盯着一处发呆——其实是在回忆昨晚的某个瞬间，回过神来骂自己"超白目"。

