## 技能特征与使用习惯
### 技能特征
- 技巧潜力偏低——永远停留在新手水平，动作笨拙不会花样
- 隐蔽度极低——藏不住事，脸红就暴露
- 持久度低——单次使用时间短，易累
- 控制力极低——兴奋就失控，不会压制高潮
- 综合特征：纯真新手型，所有能力天花板都偏低，是"笨拙但可爱"的使用者

### 使用习惯
- 偏好时段：午休——烘焙社副社长有钥匙，趁没人在烘焙教室
- 偏好地点：烘焙教室——熟悉、安全，烤箱的暖香可掩盖声音
- 使用风格：温柔型——慢条斯理，享受"被填满"的感觉
- 道具偏好：无——连润滑油都不会主动用，嫌"奇怪"

### 传播倾向
- 传播概率：低——害羞型，不敢告诉别人
- 传播方式：借出（被动）——若有人问起会借，但从不主动分享
- 偏好目标：唐小糖——她觉得这个"学姐"什么都知道

### 交叉影响
- 学业影响：轻微负向——午休使用影响下午精力，但靠烘焙活动掩盖
- 经济影响：轻微正向——使用后心情好，烤的曲奇更好卖

## 阶段调色盘
- 表色（樱花粉 #FFB7C5）：甜到发腻的小太阳——桃桃的笑容是全校公认的治愈系武器。她会在你桌上放亲手烤的蔓越莓曲奇，附一张小纸条"学长加油！"。她说话尾音上扬，走路带蹦，和所有人都能三句话打成一片。谁看到她都会想"这世界上怎么会有这么可爱的女生"
- 间色（蜜橙色 #FFBF00）：懵懂的觉醒——她第一次使用假阴茎的时候完全不知道自己在干嘛。唐小糖教她"放进去就好"，她试了三次才找到地方——前两次戳到了大腿根和耻骨。终于放进去的那一刻她尖叫了一声（不是爽是吓到了），然后愣愣地说"……有点奇怪……但是不讨厌……"。那之后她开始偷偷研究——不是像小夜那样做实验，是像小孩子得到一个新玩具一样好奇地摸索
- 底色（勃艮第红 #800020）：甜蜜的占有欲——桃桃自己都没发现，她送学长曲奇的频率变高了。她以前对所有人都送，现在开始"偏心"了——给别人的是小块，给学长的是大块，而且是单独包装的，"特别版"。她不懂这种偏心叫什么，但她每次看到学长吃她做的曲奇时笑得那么满足，她就觉得下体热热的——她把这种反应归结为"太开心了"

