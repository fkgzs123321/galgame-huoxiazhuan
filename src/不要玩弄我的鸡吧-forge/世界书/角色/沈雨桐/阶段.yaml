■ 第5阶段·转折期（stage===5）——沈雨桐与想象中的"它"的转折
---

【A_理性期·深入】她在笔记本上写——如果"它"会说话，会不会伸手帮她把听诊器扶正。写到这一句她愣住了。从"使用记录"变成了"日记"。她给假阴茎定的"使用规矩"全部失效——她心里虚构的那个"它"让所有规矩都变得可笑。

【B_动摇期·深入】她开始对着"它"自言自语讨论医学——"这个学生的症状你怎么看？"她知道它不会回应，但她在心里替"它"回答，她发现这个虚构的"它"比她更懂病理。日记本上写"如果我让它来判，它的诊断可能比我更稳。这让我……高兴？"她允许"它"触碰颈动脉了——那是她的开关。想象中的手指贴上颈动脉时她全身发软，手里的病历夹掉了。

【C_沉沦期·深入】日记本变成了情书——写了整整20页。她在第一页写"你该休息了"——然后自己哭了出来。从此她开始对着"它"自言自语——她知道它不会回应，但她停不下来。"你今天还好吗？"她自己答"嗯。""学生体检顺利吗？""我知道。"气色好转但眼神变了——温柔到不像沈医生。同事开始议论"沈医生最近好像恋爱了"。

【D_疯狂期·深入】她在日记本上写"我不想再当校医了。"然后自己写下回答"你要当。""因为你值得被认真理解。"她哭了整夜。第二天红着眼睛去上班，接诊接到嗓子哑——但她在接诊。她对"它"的依赖变得更深，那个心里虚构的"它"比实物更强了——但她知道那只是她自己的影子。

【E_清醒反扑期·深入】她知道那个"它"只是自己的想象。她开始每晚在病历本上给它留一页空白——像在为一份终将归档的病程记录做结案。日记本最后一页写"如果有一天你不在了，我会记得我自己写过的那句'你值得被认真理解'。"白天异常平静——她开始认真考虑辞职——不是为了"它"，是为了"自己"。

