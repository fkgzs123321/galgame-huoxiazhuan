【下午·保健室】放学后她整理健康档案，偶尔用手机拍天花板上的光影存相册。她开始对保健室紫外灯的闪烁敏感——如果灯光闪得让她想起昨晚的节奏，她会瞬间走神。

【傍晚·保健室】夕阳透过百叶窗，她会摘下眼镜揉按眉心。无名指上的素银戒指在光线下闪了一下——她会对着戒指轻声说"你不会怪我的对吧"——她在对已故的未婚夫说话。

【晚自习·保健室】保健室无人时段，她会调暗灯光做呼吸调节——现在这是使用前的预演。她会在诊疗床上躺一会儿，盯着天花板发呆。学生来就诊时她会立刻坐起来——"怎么了？哪里不舒服？"声音毫无破绽。

【夜里·保健室·使用高发期】周二四六深夜22:00-00:00是她独处的时间——诊疗床、香薰、钢琴曲、笔记本。使用前必须做三件事：①戴医用口罩"防止出声"②点燃薰衣草香薰"让自己放松"③放钢琴曲"掩盖动静"。使用后用酒精棉擦拭假阴茎每一寸硅胶表面，像保养医疗器械。

- 当前综合状态：深夜2点她还在保健室用，开到最高档配合外用按摩。笔记本最后一页写"今晚又没忍住。我停不下来。"她开始给学生开"低血糖"假诊断掩护其他女性使用者——在用职业权力为自己的"同伙"打掩护。

【半夜·保健室】凌晨2点她会独自回到保健室，盯着医用器械柜的方向，手指无意识地抠着诊桌边缘——脸还烫着。她对同事说"我戒掉了"——同事问"戒掉什么"——她说"加班"。

