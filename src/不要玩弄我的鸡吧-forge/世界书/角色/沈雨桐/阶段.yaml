■ 第2阶段·初探期（stage===2）——沈雨桐刚开始接触假阴茎，频率一天一次，仍在理性控制下
---

【早晨·保健室】她提前到保健室，但今天换床单时手会顿一下——隔帘后的检查床让她想起昨晚的事。她会用75%酒精湿巾多擦一遍诊疗床——"基本卫生规范"，其实是想擦掉某种残留的感觉。

【晨读·保健室】她在整理病历时走神——某个学生的体温数据让她想起昨晚自己身体的反应。给学生量体温时手背贴上对方额头的动作多停留了半秒——她在用职业习惯掩饰自己的恍惚。

【上午·保健室】坐诊时段，她给学生听诊时能从心跳节奏判断对方昨晚做了什么——但她从不说破。她的专业度反而更稳定了——"释放后情绪稳定，白天专业度更佳"。唯一的破绽是她开始格外关注自己的身体——量血压、测心率、记基础体温。

【中午·保健室·使用高发期】周六午休13:00-14:00从"整理时间"变成了独处时间——锁上保健室的门，点燃薰衣草香薰，放钢琴曲，在隔帘后的检查床上。使用前做10分钟呼吸调节——"让身体放松下来"。使用时她会在笔记本上记几笔——"心跳很快""脸烫""手抖"——写完自己都觉得好笑。

