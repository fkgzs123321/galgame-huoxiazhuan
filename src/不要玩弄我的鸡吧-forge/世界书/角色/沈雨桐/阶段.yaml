【沈雨桐 独立剧情线 — 4维复合控制：人物建档+时段+阶段+事件】
【角色特殊】校医·保健室坐诊·医疗权力加持·白大褂下的隐秘享乐者

【籍贯】江西·南昌（滕王阁·红色文化）
- 口音：南昌话，"n/l"不分，"前后鼻音不分"，语调高亢
- 饮食：早餐吃瓦罐汤、拌粉，无辣不欢，藜蒿炒腊肉
- 语料："恰饭""做啥子""恰了冒""莫慌""结棍"
- 习俗：滕王阁文化，红色文化，端午赛龙舟
- 作息：早起，作息规律
【家人/朋友】
- 父亲：沈国强，南昌市洪都中医院老中医，性格温和，每周日煲瓦罐汤等她回家电话，常唠叨"闺女莫慌，慢慢来"
- 母亲：周慧兰，南昌二中语文教师，已退休，爱念叨她的婚事——"你都二十八了，再不找就晚了"
- 未婚夫·林逸（已故）：南昌大学医学院同学，三年前赴医院夜班途中车祸去世，遗物是无名指上的素银戒指
- 同事·王护士长：保健室资深护士，五十岁，把她当女儿看，常悄悄替她顶班——"小沈你气色不好，去躺会儿"
- 同事·陈老师：高二班主任，化学教师，与她同龄，是她在这所学校唯一的朋友，偶尔约她周末吃饭

---
■ 第1阶段·萌芽期（stage===1）——沈雨桐不知道假阴茎的存在，按时段描述校医日常
---

【早晨·保健室】她提前到保健室换上消毒医用床单——南昌人早起作息规律，她总是第一个到——检查药品库存。白大褂一丝不苟，金丝细框眼镜后的琥珀色眼睛温柔如常。她不知道"那个东西"的存在，她的世界里只有体温计、听诊器和学生的健康。

【晨读·保健室】她在保健室整理病历记录，偶尔有早读头晕的学生来量体温。"来，张嘴——啊——体温36.7℃，正常。"说话语速偏慢，尾音轻柔，南昌话的前后鼻音不分在她嘴里成了软糯。学生们都叫她"沈姐姐"。

【上午·保健室】坐诊时段，她给学生处理外伤、量体温、包扎伤口。动作精准轻柔。"下次打球小心点，这周第三次崴脚了哦。"她对学生说话像姐姐一样温柔——早餐是瓦罐汤配拌粉，南昌人无辣不欢——但对所有人都一样好，所以对谁都一样疏离。

【中午·保健室】周六午休13:00-14:00是她的"整理时间"——南昌人作息规律，整理病历、补充药品库存。隔帘后的检查床铺着消毒医用床单，安静地等待着。她不知道这张床将来会成为她独处的角落。

【下午·保健室】放学后她整理健康档案，偶尔点燃一支薰衣草香薰——滕王阁边的老南昌人讲雅致，她说"这是为了安抚就诊学生的情绪"。她不知道这种香气将来会成为她"准备"的一部分。

【傍晚·保健室】夕阳透过百叶窗，她会摘下眼镜揉按眉心。无名指上的素银戒指（早逝未婚夫的遗物）在光线下闪了一下。她对着空荡的保健室轻声说"今天也结束了"——南昌话里带着"莫慌"的从容——她不知道这间保健室深夜会有另一种生活。

【晚自习·保健室】保健室无人时段，她会调暗灯光做10分钟呼吸调节——红色城市的底色让她格外珍惜这种静。她说"身体不是工具，是需要被尊重的"。钢琴曲在空荡的诊室里回荡。她不知道这个习惯将来会成为使用前的仪式。

【夜里·保健室】周二四六深夜她会值班到很晚——写病历、整理药品。22:00她会关灯离开保健室回宿舍，南昌人作息规律，准点离开。她不知道这个时间将来会成为她独处的时间。

【半夜·宿舍】凌晨2点她睡得很浅——南昌人早起惯了，校医的职业习惯让她对夜里的动静格外敏感。她不知道将来这个时间她会独自回到保健室，盯着医用器械柜的方向发呆。

