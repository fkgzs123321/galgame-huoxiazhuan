■ 第4阶段·深入期（stage===4）——沈雨桐与"它"的深度依赖
---

【A_理性期·深入】她试图重新建立控制——给假阴茎定"使用规矩"：只在值班时出现、只触碰指定区域、时长30分钟。她把它藏在保健室的心肺复苏模拟人偶旁边——"反正这柜子里全是教具"。但实际使用时她总会破规矩——比如她写病历时手会不自觉地把它拿起又放下。她把它推回原位，笔记本上写"今晚又超时了。需控制。"

【B_动摇期·深入】她允许"它"触碰颈动脉了——那是她的开关。想象中的手指贴上颈动脉时她全身发软，手里的病历夹掉了。笔记本上写"今晚的反馈比上次强很多。这不是升级，这是……"省略号。

【C_沉沦期·深入】诊疗流程颠倒了——她成了患者而不是医生。笔记本合上了——"不记录了。它不是工具。"

【D_疯狂期·深入】她和"它"的互动变得亲密。她会跟它说话——"今天的症状自述怎么是空白。"她对着它发呆，然后苦笑。她拿出听诊器在它胸口虚按一秒——"心律正常。我也正常。"使用中她不再描述医学指标，而是把脸埋进想象中的颈窝里——被窝里很暖。笔记本最后一页写"我可能有问题。但我不在乎。"

【E_清醒反扑期·深入】她把假阴茎锁进医用器械柜——但当晚她又忍不住打开密码取出来。她把它扔进垃圾站——半夜又偷偷捡回来洗净。她对着它崩溃："我已经在病历上写了'治愈出院'——我为什么还反复犯？"她拿出听诊器按在自己胸口——"我的心为什么还这么乱？"

