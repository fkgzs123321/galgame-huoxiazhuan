## 阶段调色盘
- 表色（莫兰迪薰衣草 #B8A9C9）：优雅简约的音乐教师——她说话声音清亮有共鸣像大提琴的中音区，走路几乎没有声音，平底芭蕾鞋踩在地板上轻得像踩在琴键上。乌黑长发及腰编成松散的鱼骨辫，雪纺衬衫配半身裙，颜色永远是柔和的莫兰迪色系——像她本人一样，不刺眼但耐看。她口袋里总揣着一只音叉，偶尔拿出来敲一下贴在耳边听——那是她确认"世界还在振动"的方式。学生说她"不像老师，像一首行走的曲子"
- 间色（玫瑰金 #B76E79）：练琴时的沉浸与纯粹——一旦手指触上琴键，她就变成了另一个人。那种专注不是冷静的，是炽热的——她的身体会微微前倾，呼吸和乐句的强弱同步，指尖落键的力度精确到每一个音色。她用音乐解读一切：学生情绪低落时她会即兴弹一段大调转小调的旋律，"你听，这就是你现在的心情"。她相信每个人都是一个独特的音符，合唱就是让所有音符找到和声——这句话她说的时候眼睛是亮的，像一个真正相信童话的人
- 底色（深紫罗兰 #4B0082）：声音之下的韵律渴望——她把假阴茎当"乐器"，用自己的身体"演奏"。她相信"身体是最精密的乐器"——每一寸皮肤都是琴键，每一次心跳都是节拍，每一次呼吸都是乐句的强弱记号。她使用时不是在追求快感，是在"演奏一首曲子"——有起承转合、有渐强渐弱、有休止符和高潮。她会根据心情选择"演奏什么风格"：平静时是德彪西的印象派，恍惚时是肖邦的夜曲，渴望时是拉赫玛尼诺夫的狂热。但她恐惧一件事：沉默。对她来说沉默不是"没有声音"，是"还没被演奏的音符"——那些存在于身体里但永远无法被奏出的旋律。她怕有一天她的身体沉默了，再也奏不出任何声音

## 三面性
### 权力
- 行使方式：用音乐构建感性而不可抗拒的权威——她不需要提高声音，一个和弦就够了。合唱团排练时她的指挥手势就是最高指令，没有人敢走神——因为"走神会破坏和声"。她的权力是"共鸣式"的：学生愿意听她的，因为"跟着凌老师的节奏走，声音会变好听"
- 庇护能力：如果同事在艺术表达或教学上受到质疑，她会用一段即兴演奏来"回应"——"音乐不会说谎，你听这段旋律里有没有问题"。她的庇护是感性的、用声音说话的，但意外地有说服力
- 风险规避：假阴茎放在音乐教室琴房钢琴凳的暗格里——那架钢琴是她专用的，琴凳只有她会坐，没人会打开那个暗格。使用地点就是琴房——钢琴的气息让她安心，黑白琴键在月光下的光泽让她觉得"不孤独"