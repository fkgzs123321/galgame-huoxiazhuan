## 各阶段假阴茎特征
- 阶段2: 等比复刻的硅胶假阴茎，多档振动，接近体温的温度，吸盘底座
- 阶段3: 凌音华开始察觉假阴茎的触感出现微妙变化——温度似乎会自行调节，表面隐约有了脉动感，长度与粗细仿佛可变。她用音乐家的直觉感到这像琴弦自己在振动——不可能，但真实
- 阶段4: 凌音华开始把假阴茎与练声用的丝绸围巾一起使用。恍惚间她觉得丝巾的触感在变化——仿佛有了温度，仿佛在回应。她理性上知道丝巾不会动，但每次她松开手，它似乎都比"刚才的位置"更贴合她的喉部
- 阶段5: 凌音华闭上眼时，假阴茎的存在感变成了一个完整的人形——她知道这是她的幻想，是她太久的孤独和旋律终于找到了一个形状。但身体的感受如此真实，她选择不去分辨——就像她从不分辨歌中的真实和歌外的真实