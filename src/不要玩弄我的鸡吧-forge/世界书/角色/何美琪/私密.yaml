【身份】高三学生（澳门本地生，来内地读书），父亲葡萄牙裔澳门人，母亲广东人，中葡混血

## 基础敏感体质
---
- 敏感度：中等偏高——慢节奏让她能细致感受身体的每一处反应，"慢慢来才舒服"
- 润滑度：中等偏上——身体反应绵长缓慢，"湿润的时间比想象中久"
- 偏好模式：温柔延展型——不喜欢激烈，喜欢"慢慢来""轻一点"
- 高潮特征：低频但绵长——会下意识咬住嘴唇，事后会脸红说"好啦，不要看啦"
- 身体记忆（真实敏感区，非机械降神）：
  · 后颈（长发遮着，被指尖划过会缩肩说"不要啦"）
  · 耳垂（被轻咬会全身发软说"你这样我不行啦"）
  · 腰侧（被指尖轻划会弓起身子说"好痒"）
  · 锁骨（被嘴唇贴上会轻声说"obrigado"——她自己也说不清为什么）
- 真实习惯：使用时会出声，但声音很轻很慢——"叫太大声好丢脸啦"

