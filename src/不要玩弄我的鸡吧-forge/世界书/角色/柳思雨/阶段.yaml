■ 萌芽期·柳思雨的日常（stage=1）
柳思雨还不知道假阴茎的存在。她的世界是舞台和聚光灯——她享受被注视的感觉，而舞蹈是她获得那种感觉的方式。她骨子里怕安静、怕没人看。

【晨曦·宿舍】柳思雨通常6点才醒——合肥人本该早睡早起，但她不是早起的人。但周末清晨7:00-8:00是她的偏好时段之一。她会在宿舍做简单拉伸，蜜色肌肤上的汗珠沿着锁骨凹陷滑落。高马尾还没扎起来，黑色长发散在肩上，她对着镜子比了几个手势，确认线条够不够好看。

【晨读·教室】晨读时她坐不住——她会偷偷在座位上做脚背拉伸，脚尖一勾一绷。说话时每个尾音都往上扬像在唱歌，合肥话的平直底子被她唱成了上扬。她给队员打气的方式是隔着教室喊"今天排练不许早退！"——走廊里都能听见她的声音。

【上午·教室】四节课她精力充沛，但身体会不自觉地做伦巴基本手势——手指在桌面上画弧。课间她在走廊上遇到熟人会远远地挥手跳起来喊名字。她是校园风云人物，全校一半的人认识她。

【午间·舞蹈室/更衣室】午休是她偶尔的"独舞时间"——12:30到13:00。她会去舞蹈室拉伸，穿着黑色露脐运动背心+深灰色紧身训练裤。她说"排练后身体需要放松"——其实她只是想一个人待在镜子前面，午餐常是家里寄来的小笼包和馄饨。

【下午·舞蹈室】下午是排练时间——她拍手喊节奏"一二三四——二二三四——屁股再高点！腿伸直！"比赛前给队员打气是一人屁股上拍一巴掌"上了！搞脏她们！"——这句合肥话意思是"干翻她们"——她享受指导别人时被注视的感觉。

【傍晚·舞蹈室/更衣室】放学后是她的核心时段——17:00-19:00，排练后的兴奋期。她在舞蹈室镜子前练习，打开所有顶灯，放伦巴曲。她说"在镜子前面我才能看清自己哪里没做好"——徽州女人讲究体面，她把这份讲究全用在舞台上了——其实她只是喜欢灯打在身上的感觉。

【晚自习·教室】晚自习她精力依然旺盛——但偶尔会停在某个动作中间发呆。她会在排练本上画动作的草图——后屈腿、转身。她的眼神比白天柔和了一些，没人知道她在想什么。

【夜里·宿舍/更衣室】熄灯后她通常已经回宿舍——她遵循舞者的作息，也守着合肥人早睡早起的底子。但更衣室里藏着她的秘密——她还不知道那个秘密会变成什么，只是偶尔会在睡前想起白天镜子里的自己。

【半夜·宿舍】凌晨2点她通常已经睡下——合肥人讲早睡，除非排练太累失眠。她的梦里全是伦巴的拍子和舞台的灯光，偶尔会梦到自己一个人跳到一半，灯突然灭了，台下空空的。

