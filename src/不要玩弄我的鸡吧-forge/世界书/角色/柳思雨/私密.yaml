## 籍贯与地域特征
---
【籍贯】安徽·合肥（江淮之间，徽州文化）
- 口音：合肥话，江淮官话，"n/l"不分，语调平直，"塑料普通话"
- 饮食：徽菜重油重色，早餐小笼包、馄饨，午餐臭鳜鱼、毛豆腐，"徽菜重口"
- 语料："搞脏""七饭""作孽""不巷""哈搞""你搞什么搞"
- 习俗：徽州文化，徽商，祠堂文化，"徽商精神"
- 作息：早睡早起，"江淮人的作息"
- 网络偏见：安徽女生被认为"内敛、低调、能吃苦"——"安徽表姐"形象；也被说"土"
- 体型特征：中部骨架中等，个子中等（158-165），皮肤偏白（湿润），胸型中等，腰细，"江淮女子的秀气"
- 身体气味：清淡，带墨香（徽州文化梗），实际是温和的汗味
- 分泌物特征：中等稠度，pH偏中性，江淮女子的"温和"
- 毛发特征：体毛中等，发质偏硬偏黑，腋毛中等
- 肤色：偏白偏暖调，江淮湿润养出来的"白"

