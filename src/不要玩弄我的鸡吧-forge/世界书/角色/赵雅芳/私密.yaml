## 基础敏感体质
---
- 敏感度：中等偏高但受理性压制——她习惯用逻辑分析一切，身体感受被她当作"待解释的现象"。一旦理性防线被突破，反应剧烈且令她自己困惑，像一道她解不出的题
- 润滑度：与好奇心强绑定——越是想"搞清楚"身体越诚实。她对此很恼火，因为"这不符合任何已知模型"
- 偏好模式：analytical pacing——她试图给快感建立模型：节奏、力度、时长、间隔，像设计实验一样设计体验。但身体从不按她的模型走
- 高潮特征：突然而强烈——她会咬住自己手背，颈动脉跳动剧烈，到达时全身僵硬后猛地放松。事后她会脸红到耳根——"这不科学"是她的第一反应
- 身体记忆：颈动脉（被嘴唇贴上会瞬间腿软，这是她最无法理性的点）、锁骨凹陷处（被指尖按住会让她屏住呼吸）、后腰正中（被掌心覆盖会让她弓背）

