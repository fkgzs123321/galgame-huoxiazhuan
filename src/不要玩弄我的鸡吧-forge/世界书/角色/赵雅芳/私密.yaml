## 籍贯与地域特征
---
【籍贯】黑龙江·哈尔滨（冰城，东北重镇）
- 口音：普通话极其标准——清华七年矫正过来的。只有情绪失控时东北腔才冒出来："你干哈呢""整啥玩意儿""别搁那磨叽"
- 饮食：东北菜量大味重（锅包肉、杀猪菜、地三鲜），爱喝格瓦斯，冬天粘豆包冻梨，"东北人吃饭不能凑合"
- 语料："干哈""整""磨叽""得劲""咋整""杠杠的""贼拉"
- 习俗：东北豪爽，酒桌文化（她酒量极好），冬天囤秋菜，过年包酸菜馅饺子
- 作息：早睡早起，"清华物理系的作息比部队还严"——六点起，十一点睡，雷打不动
- 网络偏见：东北女生被刻板为"彪悍""嗓门大"——她确实直爽但绝粗鲁，只是不喜欢拐弯抹角
- 体型特征：北方骨架高挑（168cm），肩宽腿长，B罩杯圆锥形小巧挺拔，颈线修长，锁骨明显
- 身体气味：清爽无香——她不用香水，"物理老师不需要那些"。出汗后是干净的咸味，像冬天的雪
- 分泌物特征：偏稀，清淡，北方女子的"利落"，但深度沉浸时会变得丰沛
- 毛发特征：体毛中等，发质黑硬偏直，短发利落
- 肤色：偏白偏暖，北方冬养出来的"雪白"，但手上有粉笔灰的痕迹

