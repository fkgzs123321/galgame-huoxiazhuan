## 基础敏感体质
---
- 敏感度：低且紧张——她的身体像新手护士的手，渴望接触但又会本能地颤抖
- 润滑度：偏低且需要引导——身体像需要"操作指南"的新设备，必须按"手册"才能"启动"
- 偏好模式：slow+analytical——慢节奏学习+边用边想，把使用当成一项"护理技能训练"
- 高潮特征：低频但紧张——临界时她会把拳头塞进嘴里，因为她还没习惯叫出来
- 身体记忆：手腕（戴护士表的位置，是她的"操作开关"）、后颈（被白大褂领口压过的位置，是她的"职业开关"）

