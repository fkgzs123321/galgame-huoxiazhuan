## 籍贯与地域特征
---
【籍贯】陕西·西安（十三朝古都，黄土高原）
- 口音：西安话，"n/l"部分不分，语调古朴，"塑料普通话"，"这事额给你说"
- 饮食：早餐肉夹馍、胡辣汤、羊肉泡馍，午餐biangbiang面、凉皮，"西安人离不开面"
- 语料："额滴神""咧""咋办""马达""扎势""嘹咋咧""克里马擦"
- 习俗：古都文化，兵马俑，回民街美食，"八百里秦川尘土飞扬"
- 作息：早起，午休长，"黄土高原的作息"
- 网络偏见：陕西女生被认为"古朴、实在、保守"——"西安女娃"形象；也被说"土"
- 体型特征：北方骨架中等，个子中等（160-168），皮肤偏白偏干（干燥），胸型中等，"古都女子的端庄"
- 身体气味：带羊肉味（回民街梗），实际是清淡的咸味——西北干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，西北女子的"清爽"
- 毛发特征：体毛中等，发质偏硬偏直，腋毛中等
- 肤色：偏白偏暖调，西北女子的"白"

