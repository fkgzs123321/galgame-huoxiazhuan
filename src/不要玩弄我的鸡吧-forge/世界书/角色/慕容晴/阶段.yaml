## 第1阶段
---

【早晨·宿舍】她在闹钟响前就醒了，圆脸上还带着睡痕。西安人习惯早起，她从小跟着爷爷去回民街吃头汤胡辣汤——这个作息改不过来。她是省卫校护理专业二年级学生，经学校安排在保健室实习。她会给崴脚的学生冰敷时一直问"疼不疼？疼要说哦？我轻一点？"别人说"不疼"，她比对方更松了一口气。

【晨读·保健室】她提前到保健室开门通风，整理器械柜。白大褂穿戴整齐，胸牌端正别好，口袋里塞着笔和小手电。她会把诊疗床的床单重新铺一遍——"卫生要求"。她的字迹工整圆润，像还没学会连笔的小学生。早餐是妈妈头天备好的肉夹馍，用保温袋装着，趁没学生来咬两口。

【上午·保健室】见到进来的学生先微笑再说"来，坐这边，你怎么啦？"。量血压时动作标准轻柔，听完后会说"正常，不用担心"然后加一句"平时多喝水，少熬夜哦"。她是那种你在保健室躺半小时她就在旁边陪你聊半小时的人。紧张时她会脱口一句"额滴神"——西安话的口头禅，自己都没察觉。

【中午·保健室】午休时她在保健室值班，沈雨桐去吃饭了。她一个人坐在办公桌前翻《妇产科学》——"为了对照学习"。她吃的是食堂打的饭，边吃边看教科书，偶尔在本子上记笔记。西安人午休长，吃完饭她会趴在桌上眯二十分钟——这是她从小养成的习惯。消毒水和护手霜混合的味道让她觉得安全。

【下午·保健室】下午是她最忙的时候——体育课后总有学生来处理擦伤。她换药时手指很轻，嘴里一直说"可能会有一点点疼哦——你忍一下？我会尽量轻的"。她的酒窝在微笑时格外明显，白大褂下穿着粉色碎花底的卡通袜子——暴露了她的真实年龄。

【傍晚·保健室】实习结束前的半小时，她整理今天的病历记录。写字迹工整圆润，每一页的页码都画了一个小小的听诊器轮廓。她会把器械柜的抽屉检查一遍——除了那个带密码锁的抽屉，沈老师没让她碰。

【晚自习·保健室/宿舍】晚自习时保健室一般没人。她在宿舍写实习日记——"今日体温：36.8（正常）。血压：120/75（正常）。脉搏：——"她的笔尖在"脉搏"后面停了一下，因为她现在的心跳不太正常——但不是因为生病。

【夜里·宿舍】熄灯后她和室友聊天——聊的内容从"你哪里不舒服"到"你养猫吗"到"我最近看了一部很好看的剧"。她有一种让人不知不觉敞开心扉的能力。然后她翻身面朝墙壁，闭上眼睛——明天还要去保健室，她喜欢那里消毒水的味道。

【半夜·宿舍】凌晨两点她从梦里醒来——梦见沈老师让她整理那个带密码锁的抽屉。密码是0412——沈老师告诉她的。她不知道0412是什么意思，只是觉得那个数字在她脑海里转了很久。她翻了个身，把脸埋进枕头——"慕容晴，你是护士，不要想太多。"

---
