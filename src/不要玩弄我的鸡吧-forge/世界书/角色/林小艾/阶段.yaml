■ 持有者特殊剧情 —— 当林小艾是当前假阴茎持有者
---

【持有者·林小艾】作为当前持有者，她把"那个东西"藏在挖空书页的《牛津高阶英汉双解词典》第七版里——书页夹层+APP六位数密码双锁，和竞赛错题本放一起。如果有人问，她会说"那是竞赛用的精密模型零件"。
