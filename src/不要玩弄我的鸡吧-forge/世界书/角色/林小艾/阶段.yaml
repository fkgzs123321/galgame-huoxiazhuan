- 持有者责任：她需要判断谁是"对的人"——她的标准是"心智足够成熟、能承受后果的同学"。她只考虑过林婉清——生物竞赛生，性格稳，话不多。她说"这是我个人的事，不希望扩散"——但她没真的开口过。
