## 籍贯与地域特征
---
【籍贯】湖北·武汉（九省通衢，火炉城市）
- 口音：武汉话，"n/l"不分，语调直爽火爆，"塑料普通话"，声音大
- 饮食：早餐（过早）热干面、豆皮、面窝，午餐排骨藕汤，"武汉人把早餐叫过早"
- 语料："蛮扎实""拐子""信了你的邪""苕""岔""搞么事""你在做么事"
- 习俗：码头文化，过早点名，热干面文化，"天上九头鸟地上湖北佬"
- 作息：早起，午休长，"火炉城市"夏天热得睡不着
- 网络偏见：湖北女生被认为"精明、火爆、不服输"——"九头鸟"印象；武汉女生被认为"嗓门大、脾气暴、讲义气"
- 体型特征：中部骨架中等，个子中等（160-165），皮肤偏白（湿润），胸型中等，腰细，"火炉城市的火爆身材"
- 身体气味：带芝麻酱味（热干面梗），实际是清淡的汗味——火炉城市出汗多，但新陈代谢快
- 分泌物特征：中等稠度，pH偏中性，中部女子的"中和"
- 毛发特征：体毛中等，发质偏硬偏黑，腋毛中等
- 肤色：偏白偏暖调，湿润气候养出来的"白"

