## 籍贯与地域特征
---
【籍贯】广东·广州（粤式阳光，运动型）
- 口音：粤语普通话，"zh/ch/sh"读成"z/c/s"，语调上扬，句末常加"啦""嘛""咯"
- 饮食：清淡为主，爱喝老火靓汤，早茶文化（虾饺烧麦肠粉），"食在广州"，不吃辣
- 语料："冇问题啦""搞掂""靓仔""食咗饭未啊""犀飞利""猴赛雷"
- 习俗：拜神（黄大仙），喝凉茶，冬至大过年，年初二回娘家
- 作息：夜猫子命，但运动员作息被掰成规律——晨练6点起，晚10点睡
- 网络偏见：广东人"什么都吃"——福建人瑟瑟发抖；粤式女生被认为"务实、会吃、不矫情"
- 体型特征：南方骨架偏小，但运动员身材匀称紧实，肌肉线条明显，胸型中等偏小，腰细腿长
- 身体气味：带淡淡椰子香（防晒霜残留），出汗后是清爽咸味——湿热气候让汗腺发达但新陈代谢快
- 分泌物特征：偏稠，带微甜奶香，pH偏酸性，热带女子的"浓郁"
- 毛发特征：体毛中等，发质偏硬偏黑，腋毛中等
- 肤色：偏小麦色，运动阳光晒出来的健康色
---

## 基础敏感体质
---
- 敏感度：高且外放——运动员式的身体反应极快，一旦点燃就势不可挡，像百米冲刺的起跑枪响
- 润滑度：充沛——身体从来不撒谎，只要想到"今晚要用"就会提前准备好，运动后的身体尤其诚实
- 偏好模式：edging——延时控制型，但她不是停在临界点不动，而是反复冲到边缘再被自己拉回来，像在做间歇跑训练
- 高潮特征：低频但爆发力极强——每次都像冲线那一刻的呐喊，喉咙里滚出短促有力的"哈"，全身肌肉绷紧后骤然松弛
- 身体记忆：腰侧（被手掌包住会立刻软下来）、耳后运动发带的发际线处（轻吻会让她全身发抖）、膝窝（按压会让腿发软）

