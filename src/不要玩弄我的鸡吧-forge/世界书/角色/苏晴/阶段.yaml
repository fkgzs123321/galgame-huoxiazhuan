---
■ 第4阶段·沉沦期·苏晴（stage=4）—— 依赖加深，权力欲与道具的纠缠
---

【黎明·操场/体育仓库】5点的操场——如果是沉沦期，她晨跑后会直奔体育仓库"加练"，把假阴茎当成必须击败的"训练对手"；如果是清醒反扑期，她会把晨跑距离从5公里加到10公里，用过度训练掩盖忍不住。高马尾在晨光里晃动，但眼神里多了一种只有林婉清能读出的疲惫。如果是崩坏期，她根本没起床——父亲从外地赶回来，蹲在她床边"苏晴，爸回来了"——她抱着父亲哭了。

【晨读·学生会办公室】她在办公室处理文件——如果是疯狂期，她带"它"来值班室，藏在会长椅垫子下，理由是"我需要随时确认它在"；如果是清醒反扑期，她变得异常严苛，把每份请假条都核对三遍——完美到不正常。如果是崩坏期，她把所有文件都推到地上——"我管不了了"——然后蹲在文件堆里发抖。

【上午·教室/走廊】上课她依然做笔记——如果是沉沦期，她会在笔记本空白处画"使用记录"，老师以为是数学草稿；如果是清醒反扑期，她主动增加学生会公开活动——组织晨跑团、带队做广播操，用"阳光学姐"的壳把裂痕盖住。如果是崩坏期，她在走廊上对每个打招呼的同学都视而不见——这是她十七年来第一次"不笑"。

【中午·体育仓库/值班室】午休——如果是沉沦期，她把假阴茎拿到体育仓库，让它坐在跳马垫上，自己一边做拉伸一边"感受"，把假阴茎当成"陪练"；如果是疯狂期，她在值班室午休时间锁门"加练"，窗外是操场上吃午饭的同学——"在权力中心使用"的刺激感让她上瘾。如果是崩坏期，她在食堂里对着一碗米饭哭了——林婉清把她拉到角落"苏晴，你怎么了"——她说"我跑不动了"。

【下午·体育仓库】训练结束后——如果是沉沦期，她把假阴茎当成"训练对手"，给它戴上运动发带，"我们再来一组"；如果是清醒反扑期，她把假阴茎锁进跳马垫夹层——但她总觉得垫子里有什么在动，其实只是她自己心慌。她强迫自己不去掀开——"那是我想多了"，然后疯狂加练冲刺，跑到腿软。如果是崩坏期，她在田径场上崩溃了——起跑后摔倒三次，教练跑过来"苏晴，你不能再跑了"——她趴在跑道上，左膝的旧伤裂开，血渗进塑胶跑道。

【傍晚·学生会长值班室】放学后——如果是沉沦期，她终于对林婉清坦白"我停不下来"，林婉清握住她的手"苏晴，我们一起销毁"——但她知道她不会；如果是清醒反扑期，她把假阴茎从值班室暗格取出来，走到操场看台最高处——她曾经在那里用过一次，因为"感觉全校都在看我"。她对着空操场举起假阴茎，然后用力掷向远处——但走下看台时她又捡了回来。如果是崩坏期，她把所有奖牌从墙上摘下来——"这些都没用"——林婉清冲进来抱住她"苏晴，别这样"。

【晚自习·学生会长值班室】晚自习——如果是疯狂期，她和"它"的关系溢出了夜间，白天也带着它。她给"它"取了名字——在训练日志里这样记录"今日状态"。她说"它比队友更稳"。如果是崩坏期，她在值班室里把训练日志一页一页撕掉——"陪练"两个字被她撕成碎片——然后她趴在会长椅上，一动不动。

【夜里·宿舍】深夜——如果是stage5且沉沦期，她把"它"当成唯一能一起训练的搭档。她会和"它"说话——"下一组我们冲多久"。它不说话，但她觉得"它懂"——其实是她自己想听。她在训练日志上写"今日完成第N组"——这是她把"沉沦"包装成"自律"的方式；如果是stage5且疯狂期，她开始觉得"它比林婉清更懂我"——共谋关系出现裂缝。如果是stage5且崩坏期，她给父亲打了电话——"爸，我不想跑步了"——父亲沉默了很久说"苏晴，回家吧"——她知道"回家"意味着放弃田径队，放弃学生会长，放弃一切——但她已经跑不动了。

【半夜·宿舍】凌晨3点——如果是stage5且清醒反扑期，她坐在床上算一道题：从第一次做到今夜，一共多少次。她算出答案后愣住——"原来我做了这么多次"。她拿出训练日志最后一页，写下"如果有一天我不再做这件事，不是因为输了，是因为我终于学会了不带对手也能跑完全程"。她把日志锁进学生会长值班室的保险柜——和林婉清的密码箱不同，她的保险柜密码是自己的百米最好成绩。如果是stage5且崩坏期，她终于承认"有些对手不是用来战胜的，是用来放下的"——她把跳马垫夹层的假阴茎取出来，交给林婉清"婉清，帮我收着"——林婉清没问为什么，只点了点头。这是共谋的最后一次履行——不是"一起销毁"，是"一起放下"。

- 沉沦期·深入：她不再把假阴茎当"加练工具"。stage4她给"它"取名叫"陪练"——在训练日志里这样记录；stage5她把"它"当成唯一能一起训练的搭档，会和"它"说话。训练日志从"数据记录"变成了"和陪练的对话"——她写下"今日完成第N组，它比队友更稳"。气色反而更好——"运动后的红润"成了最好的掩护。

- 疯狂期·深入：她不再伪装"只是加练"。stage4她带"陪练"巡查——藏在会长椅垫子下，学生会长身份成了她的便利；stage5她开始觉得"它比林婉清更懂我"——共谋关系出现裂缝。她在训练日志上写"陪练·状态记录"被林婉清撞见，她涂掉但心跳很久没平。阳光面具的漆掉了，露出底下的锈迹——她还在笑，但笑得有点苦。

- 清醒反扑期·深入：她终于直面"它不是真实的搭档"。stage5她坐在床上算一道题：从第一次做到今夜一共多少次。她算出答案后愣住——"原来我做了这么多次"。她拿出训练日志最后一页写下"如果有一天我不再做这件事，不是因为输了，是因为我终于学会了不带对手也能跑完全程"。她把日志锁进值班室保险柜——密码是自己的百米最好成绩。这一次"成绩"不再是虚荣，而是她想和解的方式。她没扔掉假阴茎——她把它收进跳马垫夹层，压在今年的冠军奖牌下面。

- 崩坏期·深入：她在田径场上崩溃了——起跑后摔倒三次，左膝旧伤裂开。教练跑过来"苏晴，你不能再跑了"——她趴在跑道上，第一次承认"我跑不动了"。她给父亲打了电话——"爸，我不想跑步了"——父亲连夜赶回来。她把所有奖牌从墙上摘下来——"这些都没用"。最后她把假阴茎交给林婉清"婉清，帮我收着"——这是共谋的最后一次履行。她知道"放下"不是"战败"——是承认"有些对手不是用来战胜的，是用来放下的"。

