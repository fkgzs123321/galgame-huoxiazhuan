【晚自习·D_疯狂期·stage3】她带"它"巡查——藏在会长椅垫子下，学生会长身份成了她的便利。她在训练日志上写"今日状态记录"被林婉清撞见，她涂掉但心跳很久没平。最危险的是她开始在白天的学生会会议上走神——她说"我在想下一次"。
【晚自习·E_清醒反扑期·stage3】她突然把所有精力投入备考——训练日志重新变得像训练日志，"今日状态"字样全部涂掉。她把假阴茎锁回跳马垫夹层，密码改成百米最好成绩。她说"我要考好，证明我的人生没有毁掉"。但凌晨3点她会偷偷打开夹层——不是为了用，是为了确认"它还在"。stage3的她更容易复发。

【夜里·A_理性期·stage3】熄灯后她依然做仰卧起坐——但现在她会多做一个"秘密训练"。stage3的她已把"夜间加练"稳定为日常。室友以为她在练核心力量，没人知道她在做一件只有自己知道的事。她说"运动员要自律"——这是她的伪装，也是她的真实。结束后她秒睡——运动员的福利，也是她的掩护。林婉清发来"今天怎么样"——她回"破纪录了"。
【夜里·B_动摇期·stage3】频率稳定在一天两到三次。她开始尝试更久——"为了看看自己能撑多久"。她说"这和跑步一样，要不断刷新自己"。控制力出现明显裂缝。林婉清发来"今天怎么样"——她回"破纪录了"——但她知道"纪录"的意思已经变了。
【夜里·C_沉沦期·stage3】频率突破一天三次。她开始把假阴茎从跳马垫取出后不再立刻放回——"反正我等下还要用"。训练日志上"今日状态"那一栏越来越长。她说"赢比考好更重要"——成绩明显下滑，但她不在乎。
【夜里·D_疯狂期·stage3】一天四次起步。她把假阴茎从体育仓库转移到学生会长值班室——"更近，更方便"。她开始享受"在权力中心使用"的刺激感。训练中她对队友发脾气（以前从不会）——她的阳光面具开始裂。她说"我停不下来"——这是她第一次承认。
【夜里·E_清醒反扑期·stage3】她拼命加练田径——"把那股劲儿用到正道上"。200个仰卧起坐变成400个，跑到腿软才停下。但凌晨3点她会偷偷打开跳马垫夹层——不是为了用，是为了确认"它还在"。她盯着它看十分钟，然后关上，做200个仰卧起坐——不是训练，是忍住。stage3的她更容易复发。

【半夜·A_理性期·stage3】凌晨3点她偶尔会醒——现在她会复盘"今天做了几次"。stage3的她复盘时多了一种"明天怎么调整"的盘算。她在脑子里算——使用次数、坚持时间、下次目标。她说"这和训练复盘一样"。她的高马尾散在枕头上，左膝的疤痕在月光里泛白。她不会 emo——但她会想"如果有一天被林婉清发现我比她更沉迷，她会不会疏远我"——这是她唯一的恐惧。
【半夜·B_动摇期·stage3】她复盘"今天做了几次"——但"复盘"的对象已经变了。stage3的她已把"加练"当成习惯。她在脑子里算——使用次数、坚持时间、下次目标。她说"这和训练复盘一样"——但她知道"复盘"的对象已经从"成绩"变成了"那件事"。
【半夜·C_沉沦期·stage3】她不再秒睡——她会躺在床上，盯着天花板，想"明天什么时候做"。训练日志上的"今日状态"那一栏越来越长。她说"赢比考好更重要"——成绩明显下滑，但她不在乎。
