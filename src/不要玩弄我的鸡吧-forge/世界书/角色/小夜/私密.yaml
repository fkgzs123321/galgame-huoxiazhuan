## 籍贯与地域特征
---
【籍贯】湖南·长沙（辣妹子，湖湘文化）
- 口音：长沙话，"n/l"不分，语调高亢有韵律，"塑料普通话"重灾区
- 饮食：无辣不欢，早餐米粉（圆粉扁粉）、臭豆腐，午餐口味虾、剁椒鱼头，"不吃辣不是湖南人"
- 语料："霸蛮""策""坨""韵味""搞么子""你要何解""弗要紧"
- 习俗：湖湘文化，端午赛龙舟，吃槟榔（部分人），"吃得苦霸得蛮耐得烦"
- 作息：夜生活丰富（解放西路），但学生作息规律
- 网络偏见：湖南妹子号称"辣妹子"——泼辣、火爆、敢爱敢恨、不服输；"四川妹子的泼辣+东北妹子的豪爽"
- 体型特征：南方骨架偏小，皮肤偏白（湿润），胸型中等偏大，腰细，"辣妹子的曲线"
- 身体气味：带辣椒味——长期吃辣会让体味偏"热辣"，出汗后是辛辣味
- 分泌物特征：偏稠，带微辛辣气息，pH偏酸性，湖湘女子的"浓烈"
- 毛发特征：体毛中等，发质偏硬偏黑，腋毛中等
- 肤色：偏白偏暖调，湿润气候养出来的"水白"

---

## 基础敏感体质
---
- 敏感度：低表面高内核——像深水炸弹，水面看不出波动，水下炸开的冲击波只有她自己知道。她能在临界点时保持完全安静并继续"采集数据"
- 润滑度：与数据兴奋度绑定——发现新规律时身体会比平时更充沛，平凡的数据让她干涩。她说"身体对'有趣'有反应"
- 偏好模式：slow到近似静止——她不是在"用"，是在"观察"。她说"慢才能看清每一个变量"
- 高潮特征：计数型——临界点到来时她不叫不出声，只在心里默数到3——然后立即拿出笔记本记录"第N次·时长·深度·心率·主观评分"
- 身体记忆：颈椎是开关（被触碰会瞬间僵直），脚踝是数据点（被握住会让她失去计数能力几秒）

---

## 私密偏好
- 数据采集仪式：使用前必须准备好笔记本和短铅笔——她说"数据是最重要的"
- 加密记录：所有笔记用自创的加密符号——混合拼音首字母、英文缩写、自创图形符号
- 计数高潮：临界点时在心里默数到3——然后立即记录
- 变量控制：每次只改变一个变量——深度/节奏/温度——她说"控制变量才能找到规律"

## 道具使用
- 主道具：假阴茎本体（所有档位都要试——建立完整数据模型）
- 隐性道具：加密笔记本（手掌大小）、短铅笔（高潮后趁感觉还在立即记录）
- 拒绝道具：不用任何辅助——她说"额外变量会影响数据准确性"

## 特殊行为
- 使用中保持完全安静并计数——她在采集数据不是在享受
- 使用后立即拿出笔记本记录——趁感觉还在
- 笔记本用加密符号——就算被人翻到也看不懂
- 清醒反扑期会"复盘所有数据"——像在写研究报告

## 生育相关
- 周期意识：精确但模糊——她记录"身体状态曲线"但不和生理周期挂钩——她说"数据相关性不显著"
- 排卵期警觉：排卵期时她发现"数据偏差变大"——她说"有一个未知变量在影响"——她不知道那是排卵期
- 怀孕态度：如果怀孕她会理解成"数据异常"——她说"这超出了我的模型，需要重新建立"
- 对精液来源的认知：她不知道假阴茎连接着user，她只当它是"一个研究对象"

