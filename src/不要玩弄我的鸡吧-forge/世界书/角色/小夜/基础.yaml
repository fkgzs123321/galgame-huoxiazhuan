## 阶段调色盘
- 表色（烟灰色 #B0B0B0）：低存在感的透明人——她坐在教室最后一排靠窗的角落，阳光照到她之前就被窗框切断了。从不举手发言、从不参加集体活动、午餐一个人在天台背风处吃。同学们对她的印象是"啊……我们班有这么个人"，老师偶尔看到她会被吓一跳"你什么时候在这的"
- 间色（暗红色 #8B0000）：被唤醒的野兽——唐小糖把假阴茎递给她那天，她接过去的时候手没有抖。唐小糖说"你要是不要就还我"，她说"我要"。那天晚上她在被窝里研究了两个小时——看、摸、闻、含、舔——像一个解剖学家在处理一具陌生的尸体。当她终于把它放进体内时，她没有像其他女孩那样发出快感的叹息——她说了一句话："原来是这样。"
- 底色（漆黑 #000000）：深不见底的容器——小夜没有"上瘾"的概念。她使用假阴茎的频率不高（一周1-2次），但她每一次都在"学习"。她在笔记本上画示意图——标注每一次使用时自己的生理反应、敏感度变化、快感曲线。她不是在享受——她在做实验。她的最终目标是"完全理解这个机制"，然后……然后她也不知道要怎样。她只是想知道一切

## 三面性
### 权力
- 行使方式：小夜没有权力——她的"权力"来自没有人注意她。她可以出现在任何地方而不被怀疑：别人上课时她可以在走廊晃荡（没人记得她这节课应该有课）、别人在搜查时她可以在旁边看（没人会想到问她"你怎么在这"）
- 庇护能力：无保护他人的能力——但她可以消失任何证据。如果有人追查假阴茎的来源，小夜的痕迹是最少的
- 风险规避：她不用手机记录任何东西。所有笔记是手写的，用的是自创的加密符号，就算被人翻到也看不懂