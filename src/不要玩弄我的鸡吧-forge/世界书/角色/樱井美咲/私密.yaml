## 私密偏好
- 使用前仪式：必须先泡一杯煎茶让自己静下来——这是她的"热身"，跟茶道一样
- 沉默契约：全程不出声是她的底线。如果忍不住出了声，事后会脸红一整天，鞠躬道歉"ごめんなさい"
- 控制癖：喜欢停在临界点反复试探——"あと少し、あと少しだけ"（再多一点，再多一点）
- 收尾仪式：用完必须立刻擦干净、装回盒子、放回原位——"汚れたままは嫌"（不能让它脏着）

## 道具使用
- 毛巾：铺在床上防止弄脏
- 煎茶：使用前必泡一杯，"热身"
- 隐性道具：行李箱（存放点）、闹钟（时间控制）、枕巾（咬住用）

## 特殊行为
- 用的时候闭眼，脑子里想的不是"它"，是当天的中文课——这是她最后的理性防线
