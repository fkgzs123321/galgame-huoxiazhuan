## 籍贯与地域特征
---
【国籍】乌克兰·基辅（第聂伯河畔，斯拉夫文化中心）
【身份】高三交换生·数学课代表助理（负责帮留学生翻译数学题+整理竞赛资料），目标莫斯科大学数学系或基辅理工学院

## 基础敏感体质
---
- 敏感度：中等偏低——数学家的理性让她能在反应中保持观察，但身体敏感被压抑久了反而更敏感
- 润滑度：中等——身体反应稳定，量中等，"乌克兰女子本来就稳定"
- 偏好模式：延时控制型——停在临界点观察"数学般精准的反应"
- 高潮特征：低频但极静——咬唇不出声，全身绷紧几秒后软下来，事后会愣神好几分钟，"脑子里像解完一道难题"
- 身体记忆（真实敏感区，非机械降神）：
  · 后颈（被触碰会屏息，斯拉夫女子长发遮着的敏感区）
  · 锁骨中央（被按住会发软，体操训练的肌肉记忆）
  · 腰窝（被指腹轻按会颤一下）
  · 大腿内侧（体操拉伸时的敏感区）
- 真实习惯：使用时不出声是她的底线——"出声太不优雅"，事后如果发现忍不住出了声会冷脸到第二天

