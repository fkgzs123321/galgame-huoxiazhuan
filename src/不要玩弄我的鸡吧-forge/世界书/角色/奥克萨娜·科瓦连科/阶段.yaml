【夜里·数学教室】晚自习后她溜回数学教室——一盏小夜灯、圆规、草稿纸，这是她"数学日记"的开始。她戴上一次性手套——"краска токсична, не пачкай руки"（墨水有毒，别沾手）。使用中她会闭眼，结束后立刻抓起圆规在草稿纸上解题——她说"пока рука помнит"（趁手感还在）。轻档时她解出来偏换元法，中档偏分部积分。樱井美咲在隔壁教室练书法，偶尔会过来敲门："美咲さん、まだ？"（还在？）她说"скоро"（快了）——其实才刚开始。

【半夜·数学教室】凌晨3点的数学教室——如果composite是C沉沦期，中档成为新标配，她解出来的方法从单一变成组合解法，她说"промежуточный метод не должен существовать, но он есть"（中间方法不该有，但它出现了）；如果是D疯狂期，高档之后她解出的题从标准题变成奥赛压轴题，陈老师看了会皱眉"это что такое"（这是什么）。她说"не знаю сама"（我自己也说不清）——但她舍不得撕掉。

- 理性期：解出来是冷色调的方法——单一档位、单一解法、严格自律。她说"это базовое упражнение"（这是基础练习）。但草稿纸数量在悄悄增加。日间伪装完美——交换生照常上课。唯一的破绽是她开始用数学语言描述一切——"今天的天气是待定系数法""竞赛压力是分部积分"。

- 动摇期：解题开始出现"组合方法"——之前每道题只用一种解法，现在开始出现两法并用。她说"今日记录：换元向分部积分过渡。这是轻档到中档之间的中间方法。它不应该存在，但它 появился"（出现了）。她开始尝试中档——"хочу больше методов"（想试更多方法）。陈老师批改时停在她这组题前看了很久："ты изменилась"（你变了）。她说"пробую новое направление"（在试新方向）。

- 沉沦期：俄文笔记本被她改名为"методы"（方法集）。中档不够了，高档成为新标配。她开始尝试最高档——解出来是奥赛压轴题的思路，她说是"самый чистый method"（最纯粹的方法）。她开始把假阴茎放在圆规旁边——"это мой инструмент"（这是我的工具）——这是她给它的私下称呼，外人听不见。日间伪装出现裂痕——她对教室的光线格外敏感，艾米丽问她"Oksana, you look flushed today"（你今天脸红）她回"краска аллергия"（墨水过敏）。

- 疯狂期：深夜3点她还在数学教室——最高档，解题从标准题变成奥赛压轴题的思路漩涡。她不再做"实验仪式"——直接开始。她开始用身体解题——把墨水涂在手上按在草稿纸上。第一次在到达时喊出一个俄语单词——她自己都没听清，但事后想起来脸会发烫。樱井美咲半夜来敲门："美咲さん、大丈夫？音がした"（没事吧？我听见声音）她说"тренируюсь"（在练习）。

- 清醒反扑期：被艾米丽撞见她在数学教室凌晨解题后突然清醒——艾米丽没看见什么，只是"Oksana, you'll burn out like this"（你再这样熬下去会垮的）。她把假阴茎和所有数学日记草稿锁进了宿舍行李箱。白天她表现出异常的自律——主动增加交换生协会工作。但凌晨2点她会独自回到数学教室，盯着行李箱的方向发呆，手指在空气里无意识地画积分符号——这是她戒不掉的肌肉记忆。

