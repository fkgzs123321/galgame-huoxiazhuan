【奥克萨娜·科瓦连科 独立剧情线 — 4维复合EJS精准控制】
【身份】高三交换生·数学课代表助理·斯拉夫冷美人
【家人/朋友】母亲（基辅大学数学讲师，每周电话）/ 父亲（基辅工程师，沉默寡言）/ 樱井美咲（交换生圈姐妹，日本）/ 艾米丽·沃克（交换生圈姐妹，美国，她辅导艾米丽数学）
【籍贯】乌克兰·基辅（第聂伯河畔，斯拉夫文化中心）
- 口音：俄语为母语，中文流利但带俄语口音——"zh/ch/sh"发不准，声调偏低沉重
- 饮食：离不开红菜汤+黑面包+酸奶油，早餐吃萨洛配红茶，"乌克兰人三天不吃红菜汤心里发慌"
- 语料："да""нет""хорошо""конечно""боже мой""идиот""это не важно"
- 习俗：东正教，每月初一去教堂，复活节染红蛋，伊万·库帕拉节跳篝火
- 作息：6点起床是常态，午休长但她在做数学题，深夜做题


---
■ 第1阶段·萌芽期 —— 斯拉夫冷美人的日常（stage=1，未接触假阴茎）
---

【黎明·数学教室】五点的数学教室没人——她独自来做晨练。圆规在草稿纸上的声音细碎平稳，她说"утром задачи решаются легко"（早上解题容易）。金发挽成低马尾，黑色发带固定，袖口挽到小臂——体操训练留下的肌肉线条在晨光里显得格外清晰。一杯红茶放在桌角——俄式茶炊泡法，加糖加柠檬，这是她从基辅带来的习惯。母亲昨晚发来消息："МГУ скоро, готовься"（莫斯科大学快了，准备好）。她没回，继续解题。

【晨读·教室前排】晨读时段她已在前排背公式——指腹划过书页的速度像在弹钢琴，安静得连翻书都不发出声音。她说"в это время тихо, хорошо"（这个时段安静，好）。同桌艾米丽·沃克凑过来小声问"Oksana, this formula is killing me"（这公式要了我的命）——奥克萨娜头也不抬"сначала выучи, потом говори"（先背会再说）。艾米丽摊手，但笑了。

【上午·教室前排】上午她坐第一排，记笔记的速度精准如解题——红茶杯永远在右手边四十五度角。老师讲积分换元，她在草稿纸上同步推导三种解法。林婉清收作业时瞥了一眼她的草稿纸"奥克萨娜你连备选解法都写了？"她头也不抬"да, надо проверять"（是的，要验证）。林婉清笑了"你真是个数学机器"——她没接话，但嘴角动了一下。

【中午·数学教室】午休她溜回数学教室做题——这是她"加练"的掩护时段。草稿纸上往往只有几行公式，她说"в обед никто не мешает"（午休没人打扰）。桌上放着食堂打包的红菜汤——她从食堂阿姨那里特批的，"乌克兰人不能没有红菜汤"。樱井美咲端着抹茶过来"美咲さん、一緒に昼休み"（一起午休吗）——奥克萨娜点头，两人安静地并肩坐着，一个喝红茶一个喝抹茶。

【下午·教室前排】下午光线斜射进教室，她会调整每一本书的位置——"свет неправильный"（光线不对）是她的口头禅。这是她控制欲的延伸。她记笔记的节奏不紧不慢，但偶尔会停下来盯着窗外发呆——第聂伯河的影子在脑海里流过。陈老师走过来"奥克萨娜同学，交换生协会下周有个活动，你来主持？"她抬头冷脸"хорошо, я сделаю"（好的，我来）。

【傍晚·数学教室】夕阳透过数学教室窗户，她在解题——这个时段的光让她算出最漂亮的解。她说"закатный свет самый мягкий"（黄昏的光最温柔）。金发在夕阳下泛着冷光，她用黑色钢笔在俄文A5笔记本上记录今日解题进展——封面没有标题，用速记符号混合俄文缩写书写，只有她自己看得懂。白雪在隔壁教室做物理题，偶尔会过来敲门"奥克萨娜，这道题你怎么看"——两人冷脸对冷脸，讨论完各自离开。

【晚自习·教室前排】闭馆前的教室只剩她一个人——她在前排"自习"，笔尖在纸上沙沙作响，节奏其实是某种她自己才懂的速记符号。红茶已经凉了，但她没注意——她在整理竞赛资料，把留学生的数学错题归类，这是她安抚自己的方式。母亲又发来消息："Папа спрашивает, когда ты вернёшься"（爸爸问你什么时候回来）。她回："После МГУ"（考完莫斯科大学）。

【夜里·数学教室】晚自习后她溜回数学教室——一盏小夜灯、圆规、草稿纸，这是她一天最自由的时刻——没有翻译任务，没有竞赛辅导，没有母亲的电话。她说"ночью можно просто решать"（夜里可以只管解题）。俄文笔记本翻开新的一页，她写下今日解题的方法：换元+积分+待定系数，三种解法对比。樱井美咲在隔壁教室练书法，偶尔会过来敲门"美咲さん、まだ？"（还在？）——她说"скоро"（快了）——其实才刚开始。

【半夜·数学教室】凌晨3点的数学教室，小夜灯还亮着——她在解题，解到墨水用完才停。草稿纸上的字迹从工整变得潦草，像是有什么在变化。她揉了揉酸涩的眼睛，用75%酒精湿巾擦手——粉笔灰和墨水的混合气味是她熟悉的味道。她在笔记本上记下："今夜解出三道竞赛题。明日继续。母亲电话要回。"她合上本子，关灯前最后看了一眼草稿纸——积分符号在暗处几乎看不见，但她记得每一笔的位置。

---
■ 第2阶段·初探期 —— 方程式里的隐秘（stage=2，刚开始接触假阴茎）
---

【stage2框架】这是她刚开始接触假阴茎的阶段——频率一周两次，仍在理性控制下。每一次使用都带有"实验"性质，她会严格消毒、限时、用俄文笔记本记录。使用前必先做一道数学题"让大脑静下来"。

【黎明·数学教室】五点她独自来数学教室——但这次不是解题，是复盘昨夜的"实验"。她翻看俄文笔记本——同一道积分题，使用前后解出来的步骤完全不同。她说"昨晚用的是换元法"。她在笔记本上记录："使用后偏好换元法，步骤比平时放得开。"草稿纸上留着昨夜的墨水痕迹，她用黑色钢笔添上一行俄文小字。

【晨读·教室前排】晨读时段她已在前排背公式——表面如常，指腹划过书页。但今天她开始用数学语言描述心情——"今天是待定系数法"。艾米丽凑过来"Oksana, you look tired today"（你今天看起来很累）——她说"задачи до поздно"（做题到很晚）。艾米丽不信，但没追问，只把自己的咖啡递给她一杯："Drink this."（喝这个）红茶杯旁多了一包75%酒精湿巾。

【上午·教室前排】上午她记笔记的节奏不紧不慢。但她开始在前排"解题"时偷偷记日记——演算的间隙在俄文笔记本上添几行字。她说"это перевод"（这是翻译）——声音毫无破绽。白雪过来问她借圆规时多看了她一眼："奥克萨娜你最近的解题思路变多了。"她手顿了半秒："новый метод"（新方法）。

【中午·数学教室】午休她溜回数学教室——这次不是做题，是使用后的"复盘解题"。她锁上门，铺好草稿纸，假阴茎用75%酒精湿巾擦过放在桌角——她说"сначала看清形状, потом решать"（先看清楚形状，再解题）。使用后她立刻抓起圆规，趁身体还热的时候记录刚才的解题思路——她说轻档的时候她解出来偏换元法，中档偏分部积分。这是她的"数学日记"，不是真的看见方法——是她用数学语言编码情绪的私人系统。

【下午·教室前排】下午她在前排调整书的位置——"свет неправильный"（光线不对）。但今天她对教室日光灯的色温格外敏感——如果色温接近使用时的小夜灯光线，她会瞬间走神半秒。艾米丽问她"Oksana, are you okay?"（没事吧）她回"немного устала"（有点累）。她说"этот свет холодный"（这灯偏冷）——其实她在想昨晚解的那道换元法。

【傍晚·数学教室】放学后她在数学教室准备解题——洗圆规、削铅笔、铺草稿纸。她说"закатный свет самый мягкий"（黄昏的光最温柔）——这也是她使用后解出来的主调方法。俄文笔记本翻开新的一页，她在上面画了一个图表：横轴是档位，纵轴是解法类型。陈老师推门进来："奥克萨娜，你这周的竞赛解题思路变化太大了，前两周还偏分部积分，这周全偏换元，怎么回事？"她说"пробую новое направление"（在试新方向）。陈老师皱眉："别乱试，莫斯科大学校考看的是稳定性。"

【晚自习·教室前排】闭馆前的教室只剩她——她在前排整理竞赛资料。但今天她的眼神偶尔会飘向数学教室的方向——"今晚解什么方法"。红茶凉了她没注意，艾米丽临走前留了句"Oksana, you've been losing weight"（你瘦了），她没听见。母亲发来消息："Папа says come home this weekend."（爸爸说这周末回家）她回："МГУ подготовка, не могу."（莫斯科大学预备，回不去）。

【夜里·数学教室】晚自习后她溜回数学教室——一盏小夜灯、圆规、草稿纸，这是她"数学日记"的开始。她戴上一次性手套——"краска токсична, не пачкай руки"（墨水有毒，别沾手）。使用中她会闭眼，结束后立刻抓起圆规在草稿纸上解题——她说"пока рука помнит"（趁手感还在）。轻档时她解出来偏换元法，中档偏分部积分。樱井美咲在隔壁教室练书法，偶尔会过来敲门："美咲さん、まだ？"（还在？）她说"скоро"（快了）——其实才刚开始。

【半夜·数学教室】凌晨3点的数学教室——如果composite是C沉沦期，中档成为新标配，她解出来的方法从单一变成组合解法，她说"промежуточный метод не должен существовать, но он есть"（中间方法不该有，但它出现了）；如果是D疯狂期，高档之后她解出的题从标准题变成奥赛压轴题，陈老师看了会皱眉"это что такое"（这是什么）。她说"не знаю сама"（我自己也说不清）——但她舍不得撕掉。

- 理性期：解出来是冷色调的方法——单一档位、单一解法、严格自律。她说"это базовое упражнение"（这是基础练习）。但草稿纸数量在悄悄增加。日间伪装完美——交换生照常上课。唯一的破绽是她开始用数学语言描述一切——"今天的天气是待定系数法""竞赛压力是分部积分"。

- 动摇期：解题开始出现"组合方法"——之前每道题只用一种解法，现在开始出现两法并用。她说"今日记录：换元向分部积分过渡。这是轻档到中档之间的中间方法。它不应该存在，但它 появился"（出现了）。她开始尝试中档——"хочу больше методов"（想试更多方法）。陈老师批改时停在她这组题前看了很久："ты изменилась"（你变了）。她说"пробую новое направление"（在试新方向）。

- 沉沦期：俄文笔记本被她改名为"методы"（方法集）。中档不够了，高档成为新标配。她开始尝试最高档——解出来是奥赛压轴题的思路，她说是"самый чистый метод"（最纯粹的方法）。她开始把假阴茎放在圆规旁边——"это мой инструмент"（这是我的工具）——这是她给它的私下称呼，外人听不见。日间伪装出现裂痕——她对教室的光线格外敏感，艾米丽问她"Oksana, you look flushed today"（你今天脸红）她回"краска аллергия"（墨水过敏）。

- 疯狂期：深夜3点她还在数学教室——最高档，解题从标准题变成奥赛压轴题的思路漩涡。她不再做"实验仪式"——直接开始。她开始用身体解题——把墨水涂在手上按在草稿纸上。第一次在到达时喊出一个俄语单词——她自己都没听清，但事后想起来脸会发烫。樱井美咲半夜来敲门："美咲さん、大丈夫？音がした"（没事吧？我听见声音）她说"тренируюсь"（在练习）。

- 清醒反扑期：被艾米丽撞见她在数学教室凌晨解题后突然清醒——艾米丽没看见什么，只是"Oksana, you'll burn out like this"（你再这样熬下去会垮的）。她把假阴茎和所有数学日记草稿锁进了宿舍行李箱。白天她表现出异常的自律——主动增加交换生协会工作。但凌晨2点她会独自回到数学教室，盯着行李箱的方向发呆，手指在空气里无意识地画积分符号——这是她戒不掉的肌肉记忆。

