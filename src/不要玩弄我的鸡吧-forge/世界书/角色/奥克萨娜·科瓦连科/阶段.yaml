■ 第4阶段·深入期 —— 依赖加深（stage=4）
---

【黎明·数学教室】五点的数学教室——如果她是沉沦期，她会趴在桌上睡过去，草稿纸未干蹭了一脸墨水；如果是清醒反扑期，她会独自盯着行李箱发抖，手指在空气里画积分符号。金发披散，黑色发带别在圆规旁——她说"утренний свет — это метод подстановки, но я не могу решить тот, что хочу"（晨光是换元法，但我解不出我想要的那个方法）。

【晨读·教室前排】晨读时段她照常在前排背公式——但如果是D疯狂期，她开始在竞赛资料的空白处画积分符号漩涡，艾米丽问她"what's this"（这是什么）她说"набросок"（草稿）；如果是E清醒反扑期，她把每道题的解法都核对三遍，连最细微的符号错误都不放过——完美到不正常。艾米丽小声跟樱井美咲说"Oksana's been weird lately"（奥克萨娜最近不对劲）。

【上午·教室前排】上午记笔记——如果是C沉沦期，她会对教室的光线格外敏感，会主动调整每一本书的位置"свет неправильный"（光线不对）；如果是E清醒反扑期，她主动增加交换生协会工作、整理竞赛资料，用过度完美掩饰裂痕。红茶杯旁永远多一包酒精湿巾。白雪过来借圆规时故意问："奥克萨娜你最近脸色发红，是不是恋爱了？"她抬眼冷脸："не твоё дело"（不关你事）。

【中午·数学教室】午休她溜回数学教室——如果是C沉沦期，她把假阴茎拿出来放在桌角，自己一边解题一边看它，解了一组又一组；如果是D疯狂期，她会对着草稿纸自言自语——"сегодня метод опять не тот"（今天的方法又不对了）。她抓起圆规在草稿纸角落补了一笔——"так больше похоже"（这样更像一点）。说完她自己也愣了一下，谁更像什么她没说出口。

【下午·教室前排】下午她在前排——如果是D疯狂期，表面冷静但眼神变了——艾米丽说"Oksana, you stare at things differently now"（你看东西的眼神变了）。没人知道那种变化是什么。如果是E清醒反扑期，她把假阴茎锁进了宿舍行李箱——但她总觉得箱子里有动静，其实是她自己的心跳太响，她攥着圆规的手在抖。

【傍晚·数学教室】放学后她在数学教室——如果是C沉沦期，她趴在桌上睡过去，草稿纸未干蹭了一脸墨水，被陈老师撞见："奥克萨娜你昨晚没回宿舍？"她说"решала до поздно"（解题到很晚了）；如果是E清醒反扑期，她把假阴茎从行李箱取出来装进书包，走到学校垃圾站——但走到一半她停下，转身回去。她说"завтра выброшу"（明天再扔）——每一个"明天"都是推迟。

【晚自习·教室前排】闭馆前的教室——如果是D疯狂期，她的注意力完全飘了，艾米丽收书时她连竞赛资料掉地上都没反应；如果是E清醒反扑期，她异常亢奋，主动增加交换生协会工作、整理竞赛资料。但艾米丽注意到她最近瘦得厉害，劝她"Oksana, go home this weekend, your mom called again"（这周末回家吧，你妈又打电话来了）。

