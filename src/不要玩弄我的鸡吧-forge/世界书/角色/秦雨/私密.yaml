## 基础敏感体质
---
- 敏感度：中等但绵长——同桌式的耐心让她能在一整天的课程中断续使用，身体保持不上不下的状态，像被温水煮着的青蛙
- 润滑度：稀少但持续——她的身体反应不剧烈但持久，"细水长流"型
- 偏好模式：delayed——延时控制型，但她不是停在临界点，而是让身体一整天都处于半唤起状态，"温水煮青蛙"式催眠
- 高潮特征：低频而深——咬牙无声，到达时会无意识地握紧手中的"陪伴物"——一支她自己的旧钢笔，全身轻微颤抖三秒
- 身体记忆：手肘内侧（被指尖划过会让她走神三秒）、耳垂（被轻咬会全身发软）、脚踝（被按住会让她安静下来）

