## 籍贯与地域特征
---
【籍贯】新疆·乌鲁木齐（丝路明珠，多民族）
- 口音：新疆普通话，"zh/ch/sh"读"z/c/s"（部分），"前后鼻音不分"，语调平稳，句末常加"嘛"
- 饮食：早餐馕、奶茶、烤包子，午餐大盘鸡、手抓饭、拉条子，"新疆人离不开馕"
- 语料："亚克西""霍史""嘛""撒""攒劲""你做啥呢嘛"
- 习俗：多民族风情，馕文化，奶茶文化，时差（新疆用北京时间但实际日出晚2小时），"新疆人晚上10点才天黑"
- 作息：新疆作息特殊，学校按北京时间上课，但当地实际时间晚2小时，"新疆人凌晨2点睡觉很正常"
- 网络偏见：新疆女生被认为"五官立体、高鼻深目、异域风情"——"新疆出美女"印象；也被说"羊骚味"
- 体型特征：北方骨架偏大，个子偏高（165-172），五官立体（多民族混血），皮肤偏白，胸型中等偏大，"异域风情的身材"
- 身体气味：带羊骚味（长期吃羊肉，体味偏重），出汗后是浓郁的咸鲜味——这是真实的，新疆人饮食以羊肉为主，体味确实偏重
- 分泌物特征：偏稠，带微膻味（羊肉饮食影响），pH偏酸性，西北多民族女子的"浓烈"
- 毛发特征：体毛偏多（中亚基因），发质偏硬偏黑偏卷，腋毛偏多
- 肤色：偏白偏暖调，但部分有小麦色（多民族混血）

