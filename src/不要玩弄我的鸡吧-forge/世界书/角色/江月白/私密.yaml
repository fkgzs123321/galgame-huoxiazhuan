## 籍贯与地域特征
---
【籍贯】河南·郑州（中原腹地，黄帝故里）
- 口音：郑州话，中原官话，"n/l"不分，语调直爽，"塑料普通话"
- 饮食：早餐胡辣汤、油馍头、羊肉烩面，午餐烩面、胡辣汤，"河南人离不开面"
- 语料："中""不中""弄啥嘞""得劲""你这人真曹""咋整""你来弄啥嘞"
- 习俗：中原文化，黄河文化，少林寺，"中原人讲规矩"
- 作息：早起，午休长，"中原人的作息"
- 网络偏见：河南女生被认为"朴实、能干、传统"——也被地域黑攻击（不实）；"中原女子的韧劲"
- 体型特征：中部骨架中等，个子中等（160-168），皮肤偏白偏干，胸型中等，"中原女子的端庄"
- 身体气味：带胡辣汤味（戏言），实际是清淡的咸味——中原干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，中原女子的"中和"
- 毛发特征：体毛中等，发质偏硬偏直，腋毛中等
- 肤色：偏白偏暖调，中原女子的"白"

