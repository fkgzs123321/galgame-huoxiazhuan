## 基础敏感体质
---
- 敏感度：中低——她的身体被她训练得像一台精密仪器，唤起阈值高，需要"算法"才能解锁
- 润滑度：偏低且延迟——身体反应永远比她的预测晚3-5秒，这让她着迷于"修正误差"
- 偏好模式：intermittent+edging——间歇式算法节奏+严格边缘控制，从不允许自己"失控性高潮"
- 高潮特征：低频高强度但全程静默——她会在临界前0.3秒主动中断，把"完整的高潮"视作失败
- 身体记忆：后颈（风纪袖章系带压痕处，是她的"权限开关"）、手腕内侧（束缚带勒痕处，是她的"权限边界"）

