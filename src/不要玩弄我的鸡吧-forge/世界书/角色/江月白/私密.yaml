## 私密偏好
- 算法仪式：每次使用前必须在平板上填写"今日使用清单"——档位/时长/目标耐受值/预计中断点。仪式完成才开始
- 束缚契约：左手腕必须用黑色皮质束缚带固定在座椅扶手上——她告诉自己这是"防止手部不受控移动"，其实是她需要"被限制"的感觉才能进入状态
- 袖章开关：风纪袖章必须摘下来放在胸前口袋里——她不能容忍自己"在使用时"还穿着象征权力的袖章。但摘下袖章时后颈会起鸡皮疙瘩——那个位置空了
- 数据闭环：使用后必须填写6项数据——心率峰值/呼吸最高频率/肌肉张力变化/皮肤电导峰值/体温变化/湿润度评分。每一项都精确到小数点后一位

## 道具使用
- 主体：等比复刻的硅胶假阴茎
- 显性道具：黑色皮质束缚带（长30cm，宽2cm，金属搭扣）、平板电脑（自编数据记录软件）
- 隐性道具：银色钢笔（写数据用）、风纪袖章（摘下放进口袋的仪式）、保险柜（存放假阴茎）
- 监控屏幕光：使用时必须关闭主灯，只留监控屏幕的冷蓝光——她说"这是为了减少视觉干扰"，其实是身体的反应在冷光下更明显

## 特殊行为
- 使用中持续盯着手腕上的束缚带——金属搭扣反光的节奏让她进入一种"权限确认"状态
- 高潮临界前会主动用银色钢笔在自己大腿上画一个"×"——中断标记
- 如果使用被打断（如夜间值班电话），会表现出异常的冷静——"我马上到。"然后挂电话、整理仪容、解开束缚带、5分钟内出现在事发现场
- 笔记本上的数据用银色钢笔书写，字迹冷静如印刷体，但每一页的页码都画了一个小小的风纪袖章轮廓

## 生育相关
- 周期意识：精确记录——她的生理周期被纳入"使用清单"的算法中，排卵期自动降低档位
- 排卵期警觉：排卵期她会主动停用——理性告诉她"那个东西没有活性"但身体的反应数据会出现异常
- 怀孕态度：若意外怀孕会陷入"算法失效"的彻底恐慌——她的一切都建立在"可控"之上，一个孩子是最大的不可控变量
- 对精液来源的认知：她不知道假阴茎连接着user，只当它是"高级实验样本"，不存在怀孕可能——这是她最深的误判

