【早晨·学生会办公室】她总是第一个到学生会办公室——郑州人早起惯了，打开监控屏幕检查昨夜的巡查记录。银灰色长发一丝不苟，风纪袖章端正别在左臂，银色钢笔别在胸袋。她不知道"那个东西"的存在，她的世界里只有秩序、记录和可控。

【晨读·走廊】她在走廊巡视晨读纪律，高跟鞋声是学生们最害怕的声音。经过班级时所有人会自动端正坐姿。"校服扣子没扣好——扣上。"她说话简洁到近乎冷漠，郑州话的直爽底子让每个字都像刀切一样，从不说废话。

【上午·学生会办公室】课间她用平板更新违纪记录，银色钢笔在黑色笔记本上记录，字迹冷静如印刷体。她的办公桌是整间办公室最整齐的——连抽屉里的物品都按尺寸排列。

【中午·学生会办公室】周三午休12:30-13:00是她的"整理时间"——郑州人午休长，她会独自在办公室更新风纪巡查记录。黑色笔记本上的每一页都画了一个小小的风纪袖章轮廓作为页码。

【下午·学生会办公室】放学后她整理风纪巡查报告，午餐是食堂打的胡辣汤和油馍头，偶尔用银色钢笔在报告边缘画一些曲线——她不知道将来这些曲线会变成另一种形状。

【傍晚·学生会办公室】夕阳照在监控屏幕上，她会摘下风纪袖章放进胸袋——中原的黄昏带着黄河边的尘色，后颈的压痕处起了一层鸡皮疙瘩，那个位置空了。她不知道这个位置将来会成为她的敏感点。

【晚自习·走廊/学生会办公室】风纪巡查后的办公室，监控屏幕的冷蓝光映在她银灰色的发丝上。她一边看监控一边记录——中原人的直爽让她做事从不拖泥带水——她不知道这种"在监控下做事"的感觉将来会延伸到另一种使用。

【夜里·宿舍】21:30准时熄灯后她回宿舍——郑州人早睡，她连睡觉都不解领带——风纪委员长不能有任何"失控"的时刻。黑色笔记本放在枕边，里面是今天的记录。

【半夜·宿舍】凌晨2点她会醒来，不是因为噩梦——是因为"需要复盘"，中原人讲事理。她会爬起来在笔记本上复盘今天的违纪案例。她不知道将来这个时间她会盯着保险柜的方向发呆。

