## 籍贯与地域特征
---
【籍贯】甘肃·兰州（黄河之都，丝路要冲）
- 口音：兰州话，"n/l"不分，"前后鼻音不分"，语调平直
- 饮食：早餐牛肉面（兰州拉面），午餐灰豆子、酿皮子，"兰州人早餐必吃牛肉面"
- 语料："攒劲""莎莎""日塌""这达""娃子""你做啥呢"
- 习俗：黄河文化，回族风情（部分），牛肉面文化，"兰州人的一天从牛肉面开始"
- 作息：早起，作息规律，"西北人的作息"
- 网络偏见：甘肃女生被认为"朴实、能吃苦、实在"——"西北女娃"形象；也被说"干、土"
- 体型特征：北方骨架中等，个子中等（160-168），皮肤偏白偏干（干燥），胸型中等，"西北女子的挺拔"
- 身体气味：带羊肉味（西北饮食），实际是清淡的咸味——西北干燥气候的"干爽"
- 分泌物特征：中等稠度，pH偏中性，西北女子的"清爽"
- 毛发特征：体毛中等偏少，发质偏硬偏直，腋毛少
- 肤色：偏白偏暖调，西北日照强但干燥的"高原白"

