## 籍贯与地域特征
---
【籍贯】贵州·贵阳（山城，多民族）
- 口音：贵阳话，西南官话，"n/l"不分，"h/f"不分，语调有韵律
- 饮食：早餐肠旺面、丝娃娃、牛肉粉，午餐酸汤鱼、折耳根，"贵州人离不开折耳根"
- 语料："折耳根""拐了""老火""鬼火戳""搞哪样""你整哪样"
- 习俗：苗族风情（部分），山歌文化，酸辣文化，"贵州人吃酸不吃辣"
- 作息：生活节奏慢，夜生活丰富，"山城作息"
- 网络偏见：贵州女生被认为"佛系、能吃酸、山歌张口就来"——"贵州表妹"梗；也被说"黑、土"
- 体型特征：南方骨架偏小，个子偏矮（155-160），皮肤偏小麦色，胸型中等，"山城妹子的玲珑"
- 身体气味：带折耳根味（戏言），实际是清淡的草木香——湿润山城的"清"
- 分泌物特征：偏稠，带微酸，pH偏酸性，山城女子的"浓郁"
- 毛发特征：体毛偏多（南方基因），发质偏硬偏黑，腋毛偏多
- 肤色：偏小麦色，山城湿润但紫外线强的"蜜色"

