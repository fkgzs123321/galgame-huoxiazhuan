## 基础敏感体质
---
- 敏感度：中低——身体像被采访对象，需要"提问"才能"回答"。她的快感是信息处理型，必须边用边记录
- 润滑度：偏低且延迟——身体像受访者的口风，需要"建立信任"才会松口
- 偏好模式：analytical+internal——边用边分析+常规内置，她把每次使用当成一次"独家采访"
- 高潮特征：低频但伴随数据爆发——临界时她的大脑会异常清晰，能捕捉到平时忽略的细节
- 身体记忆：嘴唇（默念采访词的位置，是她的"提问开关"）、耳后（戴耳机听录音的位置，是她的"接收开关"）

