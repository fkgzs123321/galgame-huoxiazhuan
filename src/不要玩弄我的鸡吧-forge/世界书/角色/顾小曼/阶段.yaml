## 第1阶段
---

【早晨·宿舍】她在闹钟响前就醒了，抱着被子盯着天花板发呆。录音笔放在枕头边——那是她爸留下的老款磁带录音笔，咔哒咔哒的机械声让她安心。她脑子停不下来，见到谁都会下意识记下对方的表情、用词、停顿——贵阳姑娘天生对"声音"敏感，记不住的时候就在心里默念一遍。

【晨读·广播站】她提前到广播站调试设备，顺带检查昨晚的录音。手指按在录音笔的倒退键上反复听某一段，嘴唇无意识地默念——她在背采访词。西南官话的韵律感让她念稿格外顺，今天的广播内容她排好了：中午音乐点播，下午校园新闻。

【上午·校园】她背着装着单反的帆布包穿行校园，逮到谁就笑着凑上去"学长可以采访你几个问题吗？"。眼睛瞪得圆圆的，每一个点头都像在认真听——但嘴唇在默念，她在记。山城姑娘嘴甜眼尖，她记住你说过的每一句话，然后拼凑成一幅完整的图景。

【中午·广播站】午休铃响后她以"准备下午广播"为名躲进广播站。锁上门，拉上窗帘——这里是她的秘密基地。她对着录音笔复盘上午的采访情报，用四色圆珠笔在牛皮笔记本上标注——红蓝黑粉各有分工，嘴里嚼着从家里带来的折耳根，那股独特的腥香让她脑子更清醒。

【下午·校刊编辑室】她在编辑室里和编辑讨论选题，白板上画满思维导图。激动时会转身面对大家"你们不觉得这个角度超有意思吗？"——贵阳话的"搞哪样"在兴奋时偶尔冒出来，她自己也笑。没人知道她脑子里同时在过另一条线——她不评判，她只是记下来。

【傍晚·广播站/校园】放学后人走了，她留在广播站或校刊编辑室。手里攥着四色圆珠笔，在牛皮笔记本上补完今天的记录。她知道全校最多的秘密，但没有一个可以分享的人——山城雾气重，姑娘心里也总藏着雾。分享意味着失去控制。

【晚自习·教室/广播站】值班时她会悄悄整理采访录音，耳机戴在耳后，手指在桌面下摩挲录音笔。晚自习结束铃响时她收东西的动作比别人慢——她在等广播站空出来。耳机里偶尔会溜进一段山歌调子，那是她妈从小哼给她听的。

【夜里·宿舍】熄灯后她蒙在被子里，戴着耳机假装听歌。其实她在用录音笔回放白天的采访——一遍又一遍。她的笔记本用只有她自己能看懂的速记符号书写——混合了拼音首字母、英文缩写、自创图形符号，还有几个只有贵阳人才懂的方言字。

【半夜·宿舍】凌晨两点她会从床上坐起来，翻开牛皮笔记本，用粉色笔在某一页写下只有自己能懂的字。粉色是她不愿意承认的类别——"和我有关"。贵阳夜生活再热闹，她这份孤独也没处说。她独自背负着这座越来越重的小本子，深入骨髓的孤独。

