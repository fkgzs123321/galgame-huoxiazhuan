- 表色（奶黄色 #FFF8DC）：甜到发腻的校园小记者——她的招牌笑容是她的名片，她采访时的语气像在和你分享小秘密："诶我跟你说——我上次拍到一张超好看的照片，想不想看？"吃饭时她会端着餐盘到处找人拼桌，聊天时她是最认真的倾听者——你说话的时候她用力点头，眼睛一眨不眨地看着你，让你觉得自己说的一切都很重要。这是她天生的特质，也是她最有力的武器——每个人都希望被认真地倾听，而顾小曼给了每个人这种感觉。但如果你仔细观察——她听你说话时，嘴唇在默念，像在背书。她在记
- 间色（藤黄色 #DAA520）：深不可测的信息档案馆——她的大脑像一台永不停止运转的图书馆索引系统。每个人在她这里都有一个虚拟档案：姓名、班级、关系网、爱好、弱点、秘密。她不评判——她只是存档。"张雨萱和体育老师走得很近"、"赵灵儿周末晚上总不在宿舍"、"林婉清的快递寄件人姓名每次都不同"——这些信息在她脑子里没有任何道德判断，它们只是"事实"。她不分有用无用——她知道今天无用的信息明天可能就变成了钥匙
- 底色（深赭色 #8B4513）：信息独裁者的孤寂——她知道全校最多的秘密，但她没有一个可以分享这些秘密的人。因为分享意味着失去控制——她一旦把某个秘密说出口，就失去了对这个秘密的独占权。所以她独自背负着这座越来越重的信息宫殿。有时候她会感到一种深入骨髓的孤独——她认识每个人，但没有人完全认识她。假阴茎的出现给了她一个"自己也是秘密持有者"的身份——她不再只是别人的秘密的保管人，她终于有了一个自己的秘密

## 三面性
### 权力
- 行使方式：她不拥有任何正式的头衔权力——但她的权力比大多数正式职位更大。她知道谁和谁在谈恋爱（包括老师和学生）、谁拿了不该拿的东西、谁在背后说了谁的坏话。她用这些信息来"平衡"——不是威胁（她不做那种低级的事），而是恰到好处地在适当的场合"不经意地"透露一点点，来引导事态向对她有利的方向发展。她习惯出现在她想出现的地方——"诶好巧，你也来这里？"——不是巧合，是她算好了时间和路线
- 庇护能力：如果有人想对她不利——她只需要说"你确定要这样做吗？我刚好知道一些你可能不希望别人知道的事情"——对方就会退让。她不威胁人，她只是"提醒"。她利用信息构筑了一张无形的保护网——没人敢动她，因为她知道的太多了
- 风险规避：所有信息都是"加密"的。她的笔记本用一种只有她自己能看懂的速记符号书写——混合了拼音首字母、英文缩写、和她自创的图形符号。比如关于假阴茎的使用记录，她写的是"V0: 15min/3x, Lv.2"——V0代表自己，15min是时长，3x是高潮次数，Lv.2是她自评的"当天使用质量等级"