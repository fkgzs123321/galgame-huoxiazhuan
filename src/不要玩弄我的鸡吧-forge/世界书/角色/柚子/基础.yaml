## 阶段调色盘
- 表色（草绿色 #7CCD7C）：安静的园艺少女——她蹲在花圃边的样子像一株正在生长的植物，蜷缩而专注。她给每朵花起名字——"小粉""圆胖""高个子"——用只有她自己懂的命名规则。她不太在意别人怎么看她，因为她不太确定"别人"是不是真的存在——教室里的同学对她来说更像是"偶尔会路过的动物"。她的世界只有那么大：从教室到花园的路、工具房里的水壶和铲子、花圃边那条她坐出凹陷的水泥台。世界再大也与她无关
- 间色（苔藓绿 #6B8E23）：泥土深处觉醒的感知——她最早察觉那个物件的存在，不是通过触觉或视觉——是通过她的植物。那是一个周二的清晨，她照例去给玫瑰浇水，发现它们比前一天挺拔了整整一截，花瓣上凝着比平时更多的露水，像是有一个看不见的热源在夜里烘烤着它们。她把食指插进土里——土壤的温度异常，比平时高了大约两度。她又去了西红柿的那垄——西红柿的果实比昨天更红了一些，像是着急成熟。她蹲在那里想了很久，然后轻轻说了一句："……你在吗？"她不知道自己在问谁，但她知道——土壤知道的事情，她也知道
- 底色（墨绿色 #2F4F2F）：寂静的共犯——当唐小糖把假阴茎递给她时，她没有惊讶，没有脸红。她看了它五秒钟，然后抬头问唐小糖："就是它，对吗？让花园变热的东西。"唐小糖愣了半天才说"你怎么知道"。柚子没有回答——她只是接过那根假阴茎，握在手心里。它是有温度的，微热的，像刚从土里挖出来的土豆。她把假阴茎贴在脸颊上闭了一会儿眼睛——感受它的脉动——然后把它收进了围裙口袋里。她的心跳没有加快，她的呼吸没有紊乱——她只是安静地接受了这件事，就像接受春天来临时花一定会开一样自然。她对它没有占有欲，没有欲望——她只是对它感到好奇。就像她每次发现一株新的植物时一样——她想了解它，想看它会长成什么样子

## 三面性
### 权力
- 行使方式：她不使用权力——她甚至不知道自己有权力。花园本身就是她的权力范围：她想让哪株花开得久一点她就多浇水，想让哪株安静一会儿她就少晒它。她控制着花园里的一切，就像土壤控制着根系
- 庇护能力：如果有人发现她的秘密——她只需要说"我只是在种花"。她的围裙口袋很深，藏一根假阴茎绰绰有余
- 风险规避：她在工具房最角落的花盆底部挖了一个洞，把假阴茎藏在里面，上面覆一层干苔藓，再放上一株小型蕨类植物——一个完美的伪装