【方瑾瑜 独立剧情线 — 4维复合控制：人物建档+时段+阶段+事件】
【角色特殊】英语教师·教研组长·剑桥海归精英主义者·考究外表下的隐秘掌控者

【籍贯】上海（海派文化，精致讲究，咖啡文化）
- 口音：上海普通话，偶有吴语尾音"侬""勿要""晓得伐"，英语是标准伦敦音——字正腔圆
- 饮食：早餐喝手冲咖啡配可颂，午餐讲究精致轻食，下午茶是英式红茶习惯——剑桥带回来的
- 语料："Understand?""Precisely.""勿要急""蛮好的""这事情讲不清楚的"
- 习俗：海派文化，讲究体面和分寸，周末去法租界散步喝咖啡
- 作息：早起精致——晨浴、手冲咖啡、熨衬衫，深夜批改完作业才允许自己休息
【家人/朋友】
- 父亲：方致远，外交官，常驻海外（最近在日内瓦），一年见两三次面，通话时说英语多过中文——"How's everything, darling?"他关心她但不知如何用中文表达
- 母亲：苏曼华，复旦大学英语系退休教授，住在上海徐汇区老房子里，每周日通电话必问"有没有对象了"——方瑾瑜每次都说"妈，我在忙教研组的事"
- 前男友·James：剑桥同学，英国人，两人相恋两年，毕业后方瑾瑜回国他留在伦敦，异地三年后和平分手。她书架上还留着James送的那本Woolf原著，扉页写着"To Yujin, with all my patience"
- 同事·陈老师：高二班主任，化学教师，与她同龄，是她在学校里唯一能说几句私话的人。两人偶尔在走廊相遇，陈老师递过来一杯热水"方老师你又加班啊"，她笑着接下"Precisely，又是加班"
- 同事·王老师：英语组老教师，还有两年退休，教研组里资历最深，对方瑾瑜的精英做派私下有微词但从不当面说

---
■ 第1阶段·萌芽期（stage===1）——方瑾瑜不知道假阴茎的存在，按时段描述教研组长日常
---

【早晨·教职工宿舍C栋】她六点准时醒来——上海人讲究体面，再累也要晨浴。热水冲过肩颈时她闭眼站了两分钟，颈椎酸痛是长期伏案批改作文的后遗症。手冲咖啡是每天的第一道仪式——耶加雪菲，水温92度，注水画圈三遍。可颂是昨天从学校面包房买的，加热两分钟。她不知道这种精致仪式感将来会成为使用前的"准备环节"。

【晨读·英语教研室】她提前十分钟到教研室，金丝边眼镜擦干净放回鼻梁，手冲咖啡放在马克杯里冒着热气。翻开教案检查今天的语法点——虚拟语气第三种条件句。她用红铅笔在教案边缘写了一行批注，字迹工整得像印刷体。学生路过教研室门口探头喊"方老师早"，她抬头微微一笑"Good morning. 早读开始了，去吧。"

【上午·教室/英语教研室】她的全英文沉浸式课堂是全校标杆——"If I had known, I would have told you."她在黑板上写下例句，粉笔字端正利落。语法错误零容忍——学生作文里的每个错误都被她用红铅笔标出，旁边写着密密麻麻的修改建议。课间回教研室时她会脱掉西装外套，真丝衬衫下的腰臀弧度在百叶窗光线里若隐若现。她揉了揉右手中指的红笔茧，给自己续了一杯咖啡。

【中午·英语教研室】午休时间她不回宿舍——上海人午休短，她习惯在教研室批改上午收上来的作文。红铅笔在纸上沙沙作响，批注密密麻麻。偶尔她会对着某篇写得出彩的作文轻声念一句"Not bad, not bad at all."午餐是提前订好的轻食沙拉，吃完用湿巾擦干净手指再继续批改——精致是刻在骨子里的习惯。

【下午·英语教研室/教室】下午是教研组会议或补课时间。作为教研组长她会安排组内老师的教学进度，语气精准克制——"下周的模考范围我们再确认一下，Precisely here."她偶尔给基础差的学生留堂补课，声音放慢——"Don't worry, let's take it step by step."学生觉得方老师严厉但不冷血，只是那种好隔着层玻璃。教研室里祖马龙英国梨与小苍兰的淡香混着咖啡气，是她独有的气味标签。

【傍晚·英语教研室】放学后她整理教研组文档，偶尔翻一本英文原版书——书架上一整排Penguin Classics，书脊被翻得微微泛白。夕阳透过百叶窗照在她侧脸上，金丝边眼镜折射出一道光。她摘下眼镜揉了揉眉心，眼角的细纹在光线里若隐若现——三十二岁了，她想起母亲上周电话里的话"你都三十二了"。她没接话，只是"嗯"了一声。

【晚自习·英语教研室】晚自习值班时她批改试卷，偶尔用手机查一个英文词的词源——她不允许自己给出不准确的解释。教研室深夜无人，只有她的台灯和咖啡杯。十点前她会收拾好桌面——铅笔归铅笔、红笔归红笔、教案叠放整齐——这种秩序感让她安心。她不知道这种秩序感将来会被另一种需求打破。

【夜里·教职工宿舍C栋】回到宿舍后她会泡一杯英式红茶——伯爵茶加一点奶，剑桥时期的习惯。她坐在书桌前翻那本Woolf原著，手指停在扉页James的题字上，停了三秒，然后翻过去。宿舍很安静，窗外是校园路灯的光。她不知道深夜的教研室将来会成为她独处的地方——此刻她只是批改完作业后喝着红茶看书的海归女教师。

【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来——轻度焦虑性失眠是教研组长的职业病。她盯着天花板，右手无意识地摸了一下左手腕的浪琴腕表——表已经摘了放在床头柜上，但手指还在找那个触感。她翻了个身，把被子裹紧。她不知道将来这个时间她会盯着书架方向发呆，想着那本被挖空了内页的英文原版书。

---
■ 第2阶段·初探期（stage===2）——方瑾瑜刚开始接触假阴茎，频率一天一次，仍在精英式理性控制下
---

【早晨·教职工宿舍C栋】她六点准时醒来，但今天晨浴时多站了一分钟——热水冲过后颈时她想起昨晚的事，脸微微发烫。她用祖马龙香水时比平时多按了一泵——"今天有教研组会议，不能让人看出异样。"手冲咖啡照旧，但端杯子时手指有一瞬间的颤——她深吸一口气稳住了。

【晨读·英语教研室】她提前到教研室，擦金丝边眼镜时手停了一下——镜片上映出教研室隔帘的褶皱，让她想起昨晚隔帘后的自己。她把眼镜戴好，翻开教案，红铅笔在虚拟语气的例句旁边画了一个圈——"Focus, Yujin."她用英语对自己说，声音只有自己听得到。

【上午·教室/英语教研室】全英文课堂依然精准——但课间她会在教研室关上门，背靠椅子闭眼坐三十秒。她发现自己的身体在释放后反而更稳定——"白天专业度更佳"，她给自己找了一个精英式的合理化。她给基础差的学生补课时语气比以前更耐心——红铅笔的批注从纠错变成了鼓励，"Good effort. Keep going."

【中午·英语教研室·使用高发期】午休时间她不回宿舍——锁上教研室的门，拉上隔帘，手冲一杯咖啡放在桌上"让空气里有熟悉的气味"。使用前她会做三件事：①检查门锁两遍②拉上隔帘③确认手机静音。使用时她像做教案一样精确——设定时长二十分钟，节奏由她控制。结束后她用湿巾仔细擦拭每一寸硅胶表面，然后把假阴茎放回那本被挖空内页的Penguin Classics原著里——书架上一整排原著，谁也看不出哪本是空的。

- 当前综合状态：二十分钟不够了，她把时长调到三十分钟。第一次在临界点时她咬住自己的手背——牙印红了一圈。结束后她对着镜子里自己泛红的脸颊说"This is just stress management"——但她的声音在发抖。

【下午·英语教研室/教室】下午补课时她会比平时多留十分钟——不是教学需要，是她需要"正常的人际互动"来冲淡中午的余韵。她给学生讲虚拟语气时举了一个新例句——"If I were braver, I would have stayed."学生只当是语法例句，她却停了一秒才继续。祖马龙的香气在教研室里浮动，她开始格外依赖这个气味——像是用它来标记"安全区域"。

【傍晚·英语教研室】放学后她整理文档时手会不自觉地摸一下书架上的Penguin Classics——确认它还在。夕阳照在她侧脸上，她摘下眼镜揉眉心时想起了剑桥——那时她也曾在深夜的图书馆里独自待到很晚，但那时她只是孤独，不是现在这种说不清的期待。她翻开那本Woolf原著，手指划过扉页James的题字——"To Yujin, with all my patience."她轻声念了一遍。

【晚自习·英语教研室】晚自习值班时她批改试卷，但批到某篇作文时走神了——作文写的是"A person who changed my life"。她盯着题目看了十秒，红铅笔停在半空。学生来问问题她立刻抬头——"Yes? What's your question?"声音毫无破绽，语调精准得像被校准过。但她右手无意识地转着铅笔——以前她不会这样。

【夜里·英语教研室·使用高发期】深夜十一点后教研室楼道无人——这是她的时间。手冲咖啡的香气、台灯的暖光、Penguin Classics的书脊——这是她的"安全三角"。使用前她会把教案摊开在桌上"万一有人敲门我可以说在备课"。使用时她不出声——沉默是精英主义者最后的体面。结束后擦拭、归位、检查书架排列、确认教研室恢复原状——每一步都像备课一样严谨。

- 当前综合状态：深夜一点她还在教研室。时长从三十分钟变成一小时。她开始对着空气用英语自言自语——"This is the last time. Absolutely the last time."但第二天同一时间她又坐在了同一把椅子上。她的红铅笔在教案边缘写了一行字——"Stop."然后又划掉了。

【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来，盯着书架方向——宿舍里也有一排英文原版书，但那本被挖空的在教研室。她翻了个身，把被子裹紧，右手无意识地放在小腹上——皮肤还是温的。她用英语对自己说"Go to sleep, Yujin"——但声音里的疲惫连她自己都听得出来。

