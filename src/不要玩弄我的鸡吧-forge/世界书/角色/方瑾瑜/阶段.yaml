■ 第3阶段·渐习期（stage===3）——方瑾瑜频率增加到一天两到三次，精英式控制开始松动，伪装出现更多破绽
---

【早晨·教职工宿舍C栋】她六点准时醒来，但今天晨浴时站了三分钟——热水冲过后颈时她不只是想起昨晚，连前天和大前天的都涌上来了。脸烫得比昨天更久。她用祖马龙香水时按了三泵——以前一泵就够，现在她需要更浓的气味来掩盖什么。手冲咖啡端杯子时手指的颤比上周明显了——她深吸两口气的次数也从一次变成两次。

【晨读·英语教研室】她提前到教研室，但今天擦眼镜时手停的时间从一秒变成三秒。翻开教案时她发现自己昨晚在虚拟语气例句旁边写的批注不是教学笔记——是"今晚不准再用"五个字。她用红铅笔把那行字涂掉了，涂得很用力。学生喊"方老师早"时她抬头微笑——但微笑的弧度比以前大了零点几分，学生说"方老师今天心情好像不错"。

【上午·教室/英语教研室】全英文课堂依然精准——但课间她关上门闭眼的时间从三十秒变成了一分钟。她给基础差的学生补课时语气更耐心了——批注从鼓励变成了密密麻麻的个性化建议。学生开始觉得"方老师最近变温柔了"。但她自己知道，温柔不是因为教学——是因为她需要用职业成就感来抵消某种说不清的空洞。

【中午·英语教研室·使用高发期】午休时间的"安全三角"从咖啡+台灯+书脊变成了咖啡+台灯+书脊+湿巾+计时器。使用前的三件事还在做，但检查门锁的次数从两遍变成三遍。时长从二十分钟变成三十分钟。最近她不止午休用——上午课间如果教研室没人她也会锁门快速一次。结束后擦拭、归位、检查书架——但最近她归位后会把书抽出来再翻一遍确认"摆得和原来一样"。

- 当前综合状态：三十分钟变成四十分钟。咬手背已经不够了——她开始咬教案的边角。第一次在临界点时她用英语喊了一句"Don't stop"——说完她自己愣住了。结束后她对着镜子里的自己说"This is getting out of control"——但她第二天同一时间又坐回了那把椅子。

【下午·英语教研室/教室】下午补课时她会比平时多留十五分钟——以前是十分钟。她给学生讲例句时开始不自觉地选择和"desire""longing""secret"相关的词——"The protagonist harbored a secret desire that she could not articulate."学生只是记笔记，她自己却停了两秒才继续。祖马龙的香气她已经离不开——如果不喷她就会觉得"教研室不安全"。

【傍晚·英语教研室】放学后整理文档时她不只摸一下书架——她会把那本Penguin Classics抽出来，翻开被挖空的内页看一眼，再放回去。夕阳照在她侧脸上，她想起剑桥——想起James。她翻开Woolf原著，手指停在题字上——以前停三秒，现在停了十秒。她轻声念"To Yujin, with all my patience"——然后加了一句"But I don't have patience anymore."声音很轻，只有她自己听得到。

【晚自习·英语教研室】晚自习值班时她批改试卷，走神的频率比初探期高了。批到"A person who changed my life"那篇作文时她不只是停十秒——她把红铅笔放下，盯着题目看了整整一分钟。学生来问问题时她起身比以前慢了半拍——"Yes? What's your question?"声音还是精准的，但转铅笔的动作更频繁了。同事路过教研室门口探头"方老师还在啊"她笑着说"Precisely,加班"——但笑意没有到达眼底。

【夜里·英语教研室·使用高发期】深夜十一点后她的"安全三角"开始失灵——咖啡不够浓了，台灯不够暖了，书脊的排列也不再让她安心。使用前把教案摊开在桌上——但现在不是为了"万一有人敲门"，而是习惯。时长从三十分钟变成四十分钟。结束后擦拭、归位、检查书架——但最近她检查完会坐回椅子上发呆五分钟，脸还烫着。她用英语对自己说"This is the last time"——但这句话她每天都说。

- 当前综合状态：深夜一点她还在教研室，时长从四十分钟变成一小时。她开始对着空气用英语自言自语——不再是"This is the last time"，而是"If only you were real."说完她把脸埋进臂弯里，肩膀在发抖——说不清是笑还是哭。红铅笔在教案边缘写的"Stop"旁边多了一行——"I can't."

【半夜·教职工宿舍C栋】凌晨两点她从浅睡中醒来，不只盯着书架——她会起身走到书架前，手指划过一排排书脊，停在那本Penguin Classics的位置——但那本书在教研室，不在宿舍。她的手指停在空位上，像在确认什么。她回床上，右手放在小腹上，用英语说"Go to sleep, Yujin"——但这次她没有闭上眼睛。

---
■ 第4阶段·深入期（stage===4）——方瑾瑜与"它"的深度依赖
---

【A_理性期·深入】她试图用精英式自律重新建立控制——给假阴茎定"使用规矩"：只在教研室深夜使用、时长不超过三十分钟、结束后必须立刻归位。她把规矩写在教案本最后一页，用红铅笔，字迹工整。但实际使用时她总会破规矩——比如批改作文时手会不自觉伸向书架。她把手缩回来，在教案本上写"今晚超时了。This needs to be controlled."白天她依然完美——但路过书架时目光会多停一秒。

【B_动摇期·深入】规矩开始松动——她允许"它"碰到锁骨了。那里皮肤薄，一碰她就起鸡皮疙瘩，手里的红铅笔掉了。她弯腰捡笔时脸已经红透了。教案本上写"If this is a degradation, I am complicit."——她用英语写私密笔记，像在给自己写论文。她开始叫它"you"——不是代号，是称呼。白天她给学生讲虚拟语气时举了一个新例句——"If I were someone else, I would not feel this way."学生只当是语法，她知道不是。

【C_沉沦期·深入】教研组长的秩序感崩了——教案本最后一页的规矩被她用红铅笔全部划掉。她不再计时，不再设定时长。她把假阴茎从Penguin Classics里取出来放在书桌上——和红铅笔、咖啡杯并排，像一件办公用品。教案本合上了——"No more records. This is not an experiment."深夜教研室的台灯下，她的侧脸在暖光里柔和得不像那个语法零容忍的方老师。

【D_疯狂期·深入】她开始跟它说话——用英语。"Did you know that the word 'desire' comes from the Latin 'desiderare', meaning 'from the stars'?"她对着它发呆，然后苦笑——"I'm teaching etymology to a silicone object."她把Woolf原著翻开放在它旁边，像在给它念书。使用中她不再用英语自言自语——她把脸埋进臂弯里，肩膀在发抖，嘴里喊的是"You"——一个不存在的"you"。教案本最后一页写"I may have a problem. But I don't care."白天同事说"方老师最近气色变好了"——她不知道那种好气色是什么。

【E_清醒反扑期·深入】她把假阴茎锁进教研室的铁皮文件柜——那是教研组长的权限柜，有密码锁。但当晚她又打开密码取出来。她把它包进报纸扔进教学楼垃圾通道——半夜又偷偷下楼捡回来洗净。她对着它崩溃——"I am a Cambridge graduate. I am the head of the English department. Why can't I stop?"她拿出红铅笔在手背上写"STOP"——墨水洗不掉，她第二天戴长袖衬衫遮住。她把教案本翻到规矩那页——被划掉的规矩下面多了一行"Control is an illusion."

