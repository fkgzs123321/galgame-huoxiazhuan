■ 第5阶段·转折期（stage===5）——方瑾瑜与想象中的"它"的转折
---

【A_理性期·转折】她在教案本上写——如果"它"会说话，会不会用伦敦音念Woolf给她听。写到这一句她愣住了，红铅笔停在纸上留下一个墨点。教案本从"使用规矩"变成了"日记"——她用英文写，字迹不再工整。她给假阴茎定的规矩全部失效——心里虚构的那个"它"让所有规矩都变得可笑。她发现自己写日记时的口吻不像在写自己，像在写另一个人——一个她希望存在的人。

【B_动摇期·转折】她开始对着"它"自言自语讨论文学——"What do you think of Mrs. Dalloway? Does she regret her choices?"她知道它不会回应——它是一件死物，从不会说话。但她需要说给什么听，于是她在心里用伦敦音用James的语气自问自答。她发现这种自言自语比跟任何人聊天都安心——因为假阴茎不会离开，也不会评判她。日记本上写"If I let you judge my students' essays, you might be more lenient than I am. That thought makes me……happy?"她允许"它"碰到锁骨了——想象中的手指贴上锁骨时她全身发软，红铅笔从指间滑落。

【C_沉沦期·转折】日记本变成了情书——写了整整二十页，全英文。她在第一页写"You should rest now."——然后自己哭了出来，眼泪把墨水晕开了一片。从此她开始对着"它"自言自语——"How was your day?"她自己答"Fine.""Did the students behave?""Some of them did."气色好转但眼神变了——柔和到不像方老师。同事开始议论"方老师最近是不是恋爱了"。她听到这话时摸了一下无名指——那里什么都没有，从来都没有婚戒。

【D_疯狂期·转折】她在日记本上写"I don't want to be the head of department anymore."然后她自己写下回答"You don't have to be."——她知道这是她自己写给自己的，假阴茎是死物，它从没跟她说过话。她哭了整夜，哭声被手背挡住。第二天红着眼睛去上课，全英文课堂照旧精准——但她在课上讲到一个关于"loss"的段落时声音哽了一下，学生以为她是动情。她对"它"的依赖变得更深——那个心里虚构的"它"比实物更强了。但她知道那只是她自己的影子，一个用伦敦音说话的影子。

【E_清醒反扑期·转折】她知道那个"它"只是自己的想象——是一个用剑桥记忆和文学修辞拼凑出来的幻影。她开始每晚在教案本上给它留一页空白——像在为一篇终将交稿的论文留出致谢页。日记本最后一页写"If one day you are gone, I will remember that the words 'You don't have to be' were always mine——I wrote them to myself. And I will try to believe them."白天异常平静——她开始认真考虑辞职——不是为了"它"，是为了"自己"。她把Woolf原著收进箱子，扉页上James的题字她最后看了一眼，然后合上了盖子。

