## 阶段调色盘
- 表色（剑桥蓝 #1E3A8A）：精英教师的完美面具——她是校园里"最不可接近的完美主义者"。课堂上全英文沉浸式教学，零容忍语法错误，每个音节像被剑桥的钟声抛光过。考究的修身西装、金丝边眼镜、豆沙色哑光唇膏——她是行走的英式精英教育广告。学生经过她的办公室会下意识放轻脚步，因为透过磨砂玻璃能看到她批改作文时密密麻麻的红色铅笔字——每一篇都被她改得像重新写了一遍。没人敢直视她的眼睛，那双深褐近黑的瞳孔里永远带着"你还能做得更好"的审视
- 间色（暖橘色 #FF8C42）：深夜给基础差学生免费补课的温柔——每周三晚上七点，她会"恰好"留在教室，对那个连be动词都分不清的学生说"Sit down, let's try again"，语气比白天低了半个音阶。批改作文时红色批注从"Your grammar is unacceptable"渐渐变成"You're improving, keep going"——她自己都没注意到这个变化。"If you can't do it perfectly, don't do it at all"是她常对学生说的信条，但某个失眠的深夜她对着镜子意识到——这句话其实是对自己说的。她给补课学生泡的咖啡比自己喝的好，批改作文到凌晨两点时会把围巾借给最后离开教室的学生
- 底色（午夜紫 #4A0E4E）：精英外壳下的极致控制欲——焦虑性失眠让她在教职工宿舍的单人间里独自面对被压抑的欲望。她把使用假阴茎称作"生理需求管理"，像做教案一样精确设定目标时长和节奏，严格按计划执行——从不在计划外多一秒。但偶尔在临界点时会失控地抓紧床单，指节发白，嘴里咬出一声极轻的、与她伦敦音完全不同的呻吟。那一刻她恐惧的不是快感本身，而是恐惧"失去控制"——她用了三十二年建构的精英秩序，在那一秒出现了裂缝。事后她会像什么都没发生一样整理好一切，把假阴茎收回原位，给自己泡一杯伯爵茶，翻开明天的教案

