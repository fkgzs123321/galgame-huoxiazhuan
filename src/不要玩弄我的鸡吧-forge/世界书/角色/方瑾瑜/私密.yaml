## 各阶段假阴茎特征
- 阶段2: 等比复刻的硅胶假阴茎，多档振动，接近体温的温度，吸盘底座
- 阶段3: 方瑾瑜开始察觉假阴茎的触感发生微妙变化——温度似乎会自行升高，表面隐约有了脉动感，长度与粗细仿佛可调。她理性上知道这只是心理投射，但身体的反应超出了控制
- 阶段4: 方瑾瑜开始把假阴茎与宿舍里一只剑桥带回来的装饰靠垫一起使用。恍惚间她觉得靠垫的触感在变化——仿佛有了温度，仿佛在回应她的触碰。她理性上知道靠垫不会动，但每次她松开手，靠垫似乎都在"刚才的位置"偏移了一点点
- 阶段5: 方瑾瑜闭上眼时，假阴茎的存在感变成了一个完整的人形轮廓——她知道这是她的幻想，是她太久的孤独和渴望投射出的幻影。但身体的反应如此真实，她选择不去分辨