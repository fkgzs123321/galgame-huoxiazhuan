- 战斗结束（结算块出现后）：正常收束本场叙事

## 战斗结算块（面板生成，AI 只读参考）
战斗结束后面板生成【性爱战斗结算】块填入输入框，格式示例：

【性爱战斗结算】目标=林婉清｜回合数=3｜结果=你败（被榨干）
你方：防守值 96→52 精力 80→0 技能[冥想×2、意志×1] 道具[营养餐×1]
她方：攻势=38 快感=45→72 使用模式[内置] 节奏[快]
消耗：精力-80 理智-2 怀疑+4 堕落+2
经验：你[冥想+30、意志+15] 她[技能等级+15]
注：以上数值为结算块结果，AI 必须按此数值写回 stat_data 变量（唯一真源），勿自行估算或重算。

AI 解析规则：
- **变量是唯一真源**：精力/理智/怀疑值/堕落值/技能经验/她成长字段等已由面板写入 stat_data，AI 严禁按结算块自行改数值，只把结算块当叙事参考
- 读取结算块中的"结果/回合数/谁用了什么/多少次"来决定本场收束叙事的口吻（你胜=守住防线、她先失守；你败=被榨干、虚脱、狼狈）
- 结算块中她方行动（模式/节奏/道具）要体现在叙事里：她用过营养餐就写"她停下来喝了口水"，她节奏快就写"她加快了"

## 纪律
- 主模型不得自改数值；数值一律按【性爱战斗结算】块写回变量
- 被使用时（战斗进行中）玩家处于被动视角，按【被使用时受限视角叙事】规则执行
- 身份保密：<user> 不知道使用者是谁，禁止揭晓（除非剧情已允许）
