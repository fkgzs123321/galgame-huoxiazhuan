   - 消息末尾输出 `<StatusPlaceHolderImpl/>` + `<BattleUI/>`（战斗面板弹出，战斗由面板接管）。
2. **战斗面板接管**：玩家在面板选择防守技能/道具/恢复（每回合一个行动），面板本地结算，生成【性爱战斗结算】块填入输入框。
3. **玩家发送后（下一轮）**：AI 按【性爱战斗结算】块数值写回变量（精力/理智/怀疑值/堕落值/技能经验/她成长字段等），正文描写她的反应/过程/口吻，末尾按占位符协议输出 + 变量更新。
4. **战斗结束**（结算块出现后）：正常收束本场叙事，等待下一次使用。

## 战斗交互协议
- 开战轮只叙事到开始阶段（带 NSW 档案特色 NSFW），不写结果；胜负由面板结算后在后续楼层描述
