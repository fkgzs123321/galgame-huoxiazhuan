    - 新增信号 add /雷达/信号/<编号> 完整对象。
    - 信号消失 remove 对应条目。
    - 最后扫描日/时 每次扫描后 replace。

规则变化:
  type: |-
    {
      世界变化: record<string, {
        编号: string;
        标题: string;
        内容: string;
        范围: string;
        目标: string;
        强度: string;
        来源: string;
        过期: string;
        备注: string;
        奖励: string;
        奖惩: string;
      }>;
      学校变化: record<string, {
        编号: string;
        标题: string;
        内容: string;
        范围: string;
        目标: string;
        强度: string;
        来源: string;
        过期: string;
        备注: string;
        奖励: string;
        奖惩: string;
      }>;
    }
  check:
    - 新增规则变化 add /规则变化/世界变化/<编号> 或 /规则变化/学校变化/<编号>。
    - 规则过期 remove 对应条目。

关系图谱:
  type: |-
    record<string, record<string, {
      类型: '闺蜜' | '好友' | '对手' | '暗恋' | '师生' | '母女' | '买卖' | '同事' | '上下级' | '陌生人';
      信任: number;
      亲密度: '亲密' | '普通' | '疏远' | '敌对';
    }>>
  check:
    - key 为源角色 UID → 目标角色 UID → 关系对象。
    - 新增关系 add /关系图谱/<源UID>/<目标UID>。
    - 关系变化 replace 对应子字段。

事件:
  type: |-
    record<string, {
      编号: string;
      日: number;
      时: number;
      类型: '使用' | '症状' | '调查' | '社交' | '考试' | '结局' | '系统';
      描述: string;
      相关: string[];
      榨取: number;
      阶段: number;
      人数: number;
      模式: string;
      节奏: string;
      场景: string;
      已阻挡: boolean;
    }>
  check:
    - 类型 枚举：使用/症状/调查/社交/考试/结局/系统。
    - 日/时 为事件发生时间（天数/小时），不是字符串。
    - 相关 为字符串数组，replace 整个数组。
    - 新增事件 add /事件/<编号> 完整对象。

结局:
  type: |-
    {
      健康: boolean;
      平庸: boolean;
      真相揭示: boolean;
      坠落: boolean;
      崩坏: boolean;
      黑市掌控: boolean;
      同归于尽: boolean;
      未解之谜: boolean;
      某人清醒: record<string, string>;
      某人崩坏: record<string, string>;
    }
  check:
    - 某人清醒/某人崩坏 add /结局/某人清醒/<角色名> "清醒" 或 /结局/某人崩坏/<角色名> "崩坏"（value 为 string 类型）。

陌生模板:
  type: object
  check:
    - 陌生女性生成模板，由系统配置，AI 只读。

课程表:
  type: |-
    {
      周一~周日: array<{
        时段: string;
        节次: number;
        科目: string;
        老师: string;
        老师UID: string;
        教室: string;
        类型: '正课' | '早读' | '自习' | '体育' | '实验' | '活动' | '班会';
        备注: string;
      }>;
    }
  check:
    - 周固定课程表，初始定义后 AI 只读，禁止 replace/add/remove。
    - 特殊情况（如调课、代课）由脚本或事件触发更新。

配置:
  type: object
  check:
    - 只读配置层，AI 不可写。
    - 子字段：经验阈值/学业阈值/天数阈值/难度倍率/LCG常数/持有者每日使用上限/持有者经验倍率。
    - 难度倍率 包含玩家方向和女方方向的倍率数组（索引 0=普通/1=困难/2=地狱）。
    - LCG常数 为骰子种子公式的参数，禁止修改。

排班:
  当前战斗目标:
    type: string
    check:
      - 性爱战斗开战时 replace 为使用者真名/UID（多人时 = "多人" 并写全 隐藏层.活跃使用人数）。
      - 漏写目标 → 战斗面板无法显示战斗（卡同步中），剧情无法推进。
      - 战斗结束（结算块出现）后 replace 为 ''。
  战斗状态:
    type: '未开始'|'进行中'|'已结算'
    check:
      - 开战轮 replace 为"进行中"（必须同时写 当前战斗目标 + 隐藏层.当前使用者UID）。
      - 结算块出现后 replace 为"已结算"。
      - 本轮将战斗状态改为"进行中"（战斗开始）时，消息**正文 content 末尾**必须输出 <StatusPlaceHolderImpl/> 和 <BattleUI/>（禁止输出到思维链内）。
  战斗.${回合|主角防守值|主角防守值上限|主角精力|她攻势值|她快感值}:
    type: number
    check:
      - 由战斗面板本地结算自动写回，AI 只读，禁止手改。
  战斗.${主角BUFF|她BUFF}:
    type: object
    check:
      - 由战斗面板按道具/技能效果写回（{剩余回合, 效果值}），AI 只读。
      - 战斗结束清空为 {}。

UID计数器:
  type: record<string, number>
  check:
    - 系统自增计数器，AI 只读，禁止 replace/add/remove。
    - 包含 女性/事件 等计数器。
