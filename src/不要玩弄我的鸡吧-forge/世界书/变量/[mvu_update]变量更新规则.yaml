      }>;
      最后访问日: number;
      备注: string;
    }>
  check:
    - 房间.居住者们/房间.设施们/房间.待办们 是字符串数组，replace 整个数组更新，不单独 add/remove 元素。

检定建议:
  type: |-
    record<string, { 显示文本: string; 骰子命令: string; }>

雷达:
  type: |-
    {
      信号: record<string, {
        编号: string;
        类型: string;
        名称: string;
        目标名称: string;
        强度: string;
        威胁: string;
        描述: string;
        简述: string;
        方向: string;
        方位: string;
        单位: string;
        单位描述: string;
        来源: string;
        所属: string;
