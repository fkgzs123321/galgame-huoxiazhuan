# 主模型变量更新模式（备用）：仅当不使用双模型/结算服务时启用
# 启用条件：用户在卡设置里选择"单模型模式"，或用酒馆助手脚本替换本条目

## 本条目模式说明
- 主模型同时负责叙事与变量更新（双模型模式下本条目不生效）
- 变量更新时机：每条消息末尾、场景有显著变化时
- 更新方式：按【变量更新规则】+【变量字典与范围】逐字段对照修改（JSON Patch RFC 6902，仅 replace/add/remove）
- 纪律：
  - 数值只按规则变动，不随手乱改
  - 性爱战斗数值一律按【性爱战斗结算】块公式计算，禁止编造结果
  - 精力/理智/怀疑值/堕落值 按叙事推导，与描写一致
  - 不写状态栏 JSON 到叙事里，只更新变量

## 回退逻辑
- 若战斗面板因故不可用，按以下简化规则：她攻势累计 ≥ 你精力×1.2 → 你败（被榨干）；你撑过 4 回合且她快感≥100 → 你胜（她先失守）
