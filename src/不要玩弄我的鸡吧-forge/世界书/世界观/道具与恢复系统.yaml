# 道具与恢复系统（面板本地结算）
# 对齐欲望都市道具体系：玩家道具栏 + 她方道具栏 + 恢复技能，全部面板本地结算，写回 stat_data

## 总则
- 道具、BUFF/DEBUFF、恢复技能全部在战斗面板内本地结算（不依赖额外模型），写回 `stat_data`。
- 玩家道具 `stat_data.物品栏`（或商店商品购买后入 物品栏）；她道具 `stat_data.女性角色.{名}.道具栏`（缺失时由 商店/剧情 提供）。
- BUFF/DEBUFF 为战斗内临时状态，存 `stat_data.排班.战斗.主角BUFF / 她BUFF`（记录剩余回合与效果值），战斗结束清空。

## 玩家道具（物品栏，数量 0~99，购买见【金钱与补给系统】）
| 道具 | 效果 | 持续 | 获取 |
|------|------|------|------|
| 营养餐 | 精力回复 +15，攻击/防守 +2 | 立即+2回合 | 食堂/商店 |
| 功能饮料 | 精力回复 +10，体力 +5 | 立即 | 小卖部 |
| 维生素片 | 理智回复 +10，防守值 +5 | 立即 | 药店 |
| 安眠药 | 压力 -15，本场她攻势 -10%（精神安定） | 2 回合 | 药店 |
| 高级补剂 | 精力回复 +25，防守值 +10 | 立即 | 商店 |
| 特制药膳 | 全状态回复：精力+20/体力+10/理智+10，防守值上限 +5 | 立即+3回合 | 隐藏渠道 |

- 玩家可在战斗面板选择道具，每回合最多使用 1 个道具。
- 使用道具时：数量 -1（写回 `物品栏.{编号}.数量`），效果写入 `排班.战斗.主角BUFF` 或直接数值变更。

## 每回合行动规则（技能/道具/恢复 三选一 + 互斥）
- 玩家每回合只能选 **1 个技能** 或 **1 个道具**（二选一，互斥），也可都不选（恢复技能算独立行动，同样占用本回合）。
- 技能有冷却（面板显示剩余回合，冷却中灰色不可点）：冥想 2 回合 / 意志 1 回合 / 洞察 2 回合 / 伪装 1 回合 / 恢复 3 回合 / 锻炼 1 回合。
- 她方同理：每回合只有 1 个行动，恢复 / 道具 / 榨取 三选一。

## 恢复技能（不消耗道具，使用算一回合）
### 玩家恢复技能
- 恢复 Lv：回复防守值 +Lv×1.2；精力 +2。冷却 3 回合。
- 冥想 Lv（辅助恢复）：精力 +Lv×0.5，且本回合她攻势 -10%。冷却 2 回合。
- 使用恢复技能时：不攻击（本回合防守修正 0），她照常榨取；技能经验 +15（沿用升级公式）。

### 她方恢复技能（她自动使用，面板按机制触发）
- 她防守值 <35% 且有恢复能力时触发（每场最多 2 次）：`多维状态.理智` 微升、攻势短暂 -15%。
- 她"喘息恢复"回合：不榨取，仅累积快感 ×0.5（缓一口气）。

## BUFF / DEBUFF 规则（持续回合制）
- 结构：`{ 名字: { 剩余回合: N, 效果值: V } }`，每回合结算时剩余回合 -1，归 0 移除。
- 玩家 BUFF：防守+5（营养餐）、攻势抵抗（冥想/伪装）、精力回复（恢复）。
- 她 BUFF：攻势+（欲望/阶段）、攻势-（喘息/被洞察预判）、快感+（敏感度修正）。
- 面板按【战斗系统】公式应用 BUFF 后写回 `排班.战斗.主角BUFF / 她BUFF`。

## 战斗面板展示
- 面板显示：双方道具栏（数量）、当前 BUFF/DEBUFF（名字+剩余回合）、恢复技能按钮（含冷却）。
- 每回合结算记录中显示：道具使用、BUFF 生效/过期、恢复技能触发。
- 结算块中她方行动（模式/节奏/道具）AI 叙事时须体现。

## 她购买道具（成长机制，沿用现有规则）
- 她赢（你败）时，她用零花钱补货 1~2 个道具（写回她的道具栏）；她输也有 40% 概率补 1 个。
- 可购买：营养餐/功能饮料/维生素片/安眠药/高级补剂/特制药膳（或按她的消费习惯设定）。
- 结算块显示"她动向"时，AI 叙事描写她逛街补货的场景。
