## 她每回合行动（面板自动）
- 她每回合自动发动"榨取"：你精力 -= 她攻势（按你的防守修正结算）；同时她自身累积 **快感值**（= 攻势×0.6 + 敏感度修正），快感值满 100 → 她先高潮失守，你撑住（你胜）。
- 她使用道具（她的道具栏，见【道具与恢复系统】）时，该回合榨取暂停，改丢道具效果。
- 她经验：本场使用后 +15 × 使用次数，写回 `女性角色.{名}.成长.技能经验` 与 `能力.技能等级`（沿用升级公式）。

## 回合流程（面板内）
1. 你在面板选择防守技能（或道具/恢复）→ 点击"坚持本回合"。
2. 面板计算：她攻势（含修正）→ 你防守值 -= 她攻势×防守系数；你精力 -= 她攻势×精力系数。
3. 面板计算：你防守行动效果（冥想减攻势/恢复回防守值等）。
4. 面板更新经验并写回 `stat_data.排班.战斗`。
5. 回合数 +1；你精力 ≤0 或她快感 ≥100 → 战斗结束。

## 胜负判定
- 你精力 ≤0（被榨干）→ 你败：触发射精判定（按【射精判定与精液系统】走 LCG），你 `状态.精力/理智/怀疑值/堕落值` 按消耗公式写回，她 `与玩家关系.好感度 +2`、`NSFW.假阴茎经验.总次数 +1`。
- 她快感 ≥100（她先失守）→ 你胜：你精力保留 ≥30%，她 `多维状态.执念 +1~3`、`与玩家关系.熟悉度 +1`，你 `技能.冥想.经验 +15`。
- 战斗结束生成结算块（见下），AI 按块数值写回 stat_data（唯一真源）。

## 结算块格式（面板生成，填入输入框带到下一楼）
```
【性爱战斗结算】目标=姓名｜回合数=N｜结果=你胜/你败（撑住/被榨干）
你方：防守值 X→Y 精力 X→Y 技能[冥想×2] 道具[营养餐×1]
她方：攻势=Z 快感=X→Y 使用模式[内置] 节奏[快]
消耗：精力-X 理智-Y 怀疑+Z 堕落+W
经验：你[冥想+30] 她[技能等级+15]
注：以上数值为结算块结果，AI 必须按此数值写回 stat_data 变量（唯一真源），勿自行估算或重算。
```
- AI 解析规则：读取结算块中"结果/回合数/谁用了什么/多少次"决定本场收束叙事口吻（你胜=守住防线、她先失守；你败=被榨干、虚脱），她方行动（模式/节奏/道具）须体现进叙事。

## 写回纪律
- 主模型不得自改数值；数值一律按【性爱战斗结算】块写回 `stat_data`（精力/理智/怀疑值/堕落值/技能经验/她成长字段/排班.战斗状态=已结算、当前战斗目标 清空''）。
- 战斗结束后 `排班.战斗状态` = 已结算，`排班.当前战斗目标` 清空；`隐藏层.对抗结果` 写 你胜/你败。
- 本场使用计入 `使用阶段.今日使用/总使用次数`（沿用现有计数器，AI 按结算块 +1）。
