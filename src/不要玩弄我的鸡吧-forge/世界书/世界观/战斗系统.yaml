## 双方数值
- 她（进攻方·使用者）：**攻势值** = 能力.诱惑×0.35 + 能力.欲望×0.30 + 能力.技能等级×0.25 + NSFW.敏感度/100×10（基础区间约 25~75，随成长上升）
  - 上限修正：NSFW.润滑度 <30 → 攻势×0.85（干涩受限）；≥70 → 攻势×1.15（湿滑加成）
  - 阶段修正：多维状态.综合阶段 C沉沦期 → ×1.2；D疯狂期 → ×1.4（越沉沦越凶猛）
  - 多人使用（隐藏层.活跃使用人数>1）→ 每多 1 人攻势 +25%
- 你（防守方·被榨取者）：**防守值** = 体力×1.2（上限 = 开战瞬间的体力×1.2，取整）；**精力** 作为"榨取条"（她的攻势直接扣你精力，精力归零 = 被榨干）
- 战斗开始时双方值 = 各自上限。

