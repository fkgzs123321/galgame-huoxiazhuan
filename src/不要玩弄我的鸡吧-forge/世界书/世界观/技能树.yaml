# 技能树（面板本地结算 · 6 防守技能 + 她方能力体系）
# 对齐欲望都市技能树架构：玩家技能树 + 她方技能体系 + 能力值

## 玩家 6 防守技能（Lv1~100，5 档阈值：1-20/21-40/41-60/61-80/81-100）
- 每场战斗实际使用过的技能结算经验：+15 × 使用次数；升级所需经验 100+等级×50，等级上限 20（面板结算经验与 LCG 训练经验并存，取高不冲突）。
- 未使用的技能不加经验；今日已用/今日上限 计数器沿用现有规则。

| 技能 | 面板效果（战斗内） | 日常/调查效果（LCG 系） |
|------|-------------------|------------------------|
| 冥想 Lv | 她攻势 ×(1 - Lv×0.008)（下限 ×0.5）；可感知她状态 | 感知使用/减缓消耗/锁定/阻断/反制（见【玩家防御与对抗规则】） |
| 意志 Lv | 防守值 +Lv×0.8/回合；射精阈值 +Lv×0.8% | 抵抗/延时/压制/掌控/超凡（射精阈值提升） |
| 洞察 Lv | 预判她攻势，她攻势 -(Lv×0.5) | 警觉/识别/定位/预判/真视（调查系） |
| 伪装 Lv | 被榨取感知-30%，她攻势 ×(1 - Lv×0.006) | 掩盖/如常/迷惑/隐匿/消失（隐藏系） |
| 恢复 Lv | 回复防守值 +Lv×1.2/回合 | 自愈/耐受/强韧/再生/不朽（精力恢复） |
| 锻炼 Lv | 防守值上限 +Lv×0.6（被动）；主动防守值 +Lv×1.5 | 基础/强健/敏捷/爆发/钢铁（体力上限） |

- 状态修正（精力/体力/理智 折算）与回合细节见【战斗系统】。

## 她方能力体系（每位女性建档，随使用成长）
- 能力值（0~100，随使用成长，能力上限由阶段轨迹自动计算）：
  - **诱惑**：攻势核心系数（×0.35）；她主动勾引/主导的强度
  - **欲望**：攻势核心系数（×0.30）；沉沦越深越强
  - **技能等级**：攻势核心系数（×0.25）；熟练度（假阴茎经验）
  - **持久**：她快感累积抗性（快感增速 ×(1 - 持久/100×0.5)）
  - **控制**：她可主动调节攻势（面板修正 -持久×0.1 ~ +诱惑×0.1）
  - **隐蔽**：调查/被发现对抗（LCG 系）
- 她每场战斗后：`成长.技能经验 +15`、`能力.技能等级/诱惑/欲望` 按成长公式升级（沿用现有成长脚本）。
- 她的攻势/快感数值全部由面板按【战斗系统】公式本地计算，AI 只读结算块写回。

## 能力值（固定建档，不随战斗变化的部分）
- 基础三围/罩杯/身高/体重等：见各自 `基础信息` 档案。
- 初始能力上限：由 阶段轨迹.当前阶段 自动计算（沿用 schema 能力上限逻辑）。

## 综合阶段（她沉沦度，自动计算）
- A理性期 → B动摇期 → C沉沦期 → D疯狂期 → E清醒反扑期/E崩坏期（由 多维状态 理性/执念/理智/逃避意识 自动计算，AI 禁手写）。
- 阶段影响战斗：C 沉沦期她攻势 ×1.2；D 疯狂期 ×1.4；E 清醒反扑期她可主动中断榨取（你反制机会）。
