<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>状态栏 · 不要玩弄我的鸡吧</title>
<style>
/* fjb-* 美化标记样式主版本位于 bubble.css（含 11 类组件 + 关键帧动画 + data-attribute 变色）。
   通过 @import 加载；本文件已移除内联 fjb-* 重复定义以避免维护分歧。
   注意：@import 必须位于 <style> 开头（CSS 规范要求 @import 先于其他规则）。 */
@import url('bubble.css');
:root{
  --bg-0:#fff0f5;--bg-1:#ffe4ec;--bg-card:rgba(255,192,203,.2);
  --c-text:#4a0e2e;--c-dim:#7a2d4d;--c-border:rgba(255,105,180,.3);
  --c-danger:#d63558;--c-warn:#e0607f;--c-orange:#db4f73;--c-safe:#c4476e;--c-accent:#d63384;--c-blue:#b8327a;--c-pink:#c2185b;--c-silver:#9e3a5e;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:clamp(10px,2vw,11px);--fs-sm:clamp(11px,2.2vw,12px);--fs-base:clamp(12px,2.5vw,13px);--fs-md:clamp(13px,2.8vw,15px);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);color:var(--c-text);background:transparent;font-size:var(--fs-base);line-height:1.5}
.sb{position:sticky;bottom:0;background:linear-gradient(135deg,var(--c-bg-grad1),var(--c-bg-grad2));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--c-border);border-radius:18px;padding:12px 14px;margin:6px 0;box-shadow:0 4px 20px var(--c-shadow)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:8px;flex-wrap:wrap}
.hd-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.hd-t{font-size:var(--fs-md);font-weight:700;color:var(--c-accent);letter-spacing:1px}
.hd-sub{font-size:var(--fs-xs);color:var(--c-dim);width:100%;margin-top:2px}
.pill{font-size:var(--fs-xs);padding:4px 10px;border-radius:14px;background:var(--c-bg-pill);border:1px solid var(--c-bg-pill-border);color:var(--c-accent);white-space:nowrap;font-weight:600}
.pill.warn{background:var(--c-bg-pill);border-color:var(--c-bg-pill-border);color:var(--c-warn)}
.pill.danger{background:var(--c-bg-pill);border-color:var(--c-bg-pill-border);color:var(--c-danger)}
.pill.safe{background:var(--c-bg-pill);border-color:var(--c-bg-pill-border);color:var(--c-safe)}
.pill.silver{background:var(--c-bg-pill);border-color:var(--c-bg-pill-border);color:var(--c-silver)}
.rfr{min-width:44px;min-height:44px;background:var(--c-bg-btn-hover);border:1px solid var(--c-border);color:var(--c-accent);border-radius:14px;padding:6px 12px;cursor:pointer;font-size:var(--fs-md);flex-shrink:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s;font-weight:600}
.rfr:hover{color:var(--c-text);background:var(--c-bg-btn-active)}
.rfr.spinning{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
details.block{background:var(--c-bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--c-border);border-radius:16px;padding:0;margin-bottom:8px;overflow:hidden}
details.block>summary{font-size:var(--fs-sm);font-weight:700;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;list-style:none;color:var(--c-text)}
details.block>summary::-webkit-details-marker{display:none}
details.block[open]>summary{border-bottom:1px solid var(--c-border)}
details.block[open]>summary .caret{transform:rotate(90deg)}
details.block>summary .caret{margin-left:auto;transition:transform .2s}
.card-t.player{color:var(--c-safe)}
.card-t.heroine{color:var(--c-accent)}
.card-t.skill{color:#a01543}
.card-t.academic{color:var(--c-blue)}
.card-t.symptom{color:var(--c-pink)}
.card-t.hidden{color:var(--c-dim)}
.card-t.list{color:var(--c-accent)}
.card-t.event{color:var(--c-silver)}
.block-body{padding:8px 12px 10px;display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.kv{display:flex;flex-direction:column;gap:1px}
.kv .k{font-size:var(--fs-xs);color:var(--c-dim);font-weight:500}
.kv .v{font-size:var(--fs-sm);font-weight:600;color:var(--c-text)}
.v.danger{color:var(--c-danger)}.v.warn{color:var(--c-warn)}.v.safe{color:var(--c-safe)}.v.neutral{color:var(--c-dim)}.v.accent{color:var(--c-accent)}.v.blue{color:var(--c-blue)}.v.pink{color:var(--c-pink)}.v.silver{color:var(--c-silver)}
.bar{margin:4px 0}
.bar-h{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--c-dim);margin-bottom:2px;font-weight:500}
.bar-h .bv{color:var(--c-text);font-weight:600}
.bar-t{height:8px;border-radius:6px;background:var(--c-bg-card);overflow:hidden}
.bar-f{height:100%;border-radius:6px;transition:width .5s ease;width:0}
.bar-f.r{background:linear-gradient(90deg,#ff6b8a,#ff1493)}
.bar-f.o{background:linear-gradient(90deg,#ff85a2,#ff69b4)}
.bar-f.y{background:linear-gradient(90deg,#ffb6c1,#ff85a2)}
.bar-f.g{background:linear-gradient(90deg,#ffb6d9,#ff69b4)}
.bar-f.b{background:linear-gradient(90deg,#ffc0cb,#ff85a2)}
.bar-f.p{background:linear-gradient(90deg,#ff1493,#ff69b4)}
/* ===== 每轮变更高亮动画 ===== */
@keyframes highlight-pulse{0%{background:rgba(255,215,0,.35);box-shadow:0 0 0 2px rgba(255,165,0,.6)}30%{background:rgba(255,215,0,.22)}60%{background:rgba(255,215,0,.12)}100%{background:transparent;box-shadow:none}}
.kv.changed,.bar.changed{animation:highlight-pulse 3.4s ease-out;border-radius:8px;padding-left:2px;padding-right:2px}
.pill.changed{animation:highlight-pulse 3.4s ease-out}
.hd-sub.changed{animation:highlight-pulse 3.4s ease-out;border-radius:4px;padding:2px 4px}
.kv.changed .v,.bar.changed .bv,.bar.changed .bar-h span:first-child{font-weight:800}
.kv.changed .v{color:#ff4500!important;text-shadow:0 0 4px rgba(255,165,0,.5)}
.sect-title{font-size:var(--fs-xs);color:var(--c-dim);margin:8px 0 4px;font-weight:600;border-bottom:1px solid rgba(255,182,193,.3);padding-bottom:3px}
.heroine-item{background:var(--c-bg-card);border:1px solid rgba(255,182,193,.35);border-radius:12px;padding:6px 8px;margin-bottom:4px;cursor:pointer;transition:background .2s}
.heroine-item:hover{background:var(--c-bg-pill)}
.heroine-item.active{border-color:rgba(255,105,180,.5);background:var(--c-bg-btn-hover)}
.heroine-row{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
.heroine-name{font-weight:700;font-size:var(--fs-sm);color:var(--c-accent)}
.heroine-role{font-size:var(--fs-xs);color:var(--c-dim);font-weight:500}
.heroine-stats{display:flex;gap:4px;margin-top:2px;font-size:var(--fs-xs);color:var(--c-dim);flex-wrap:wrap;font-weight:500}
.shop-item{cursor:pointer;transition:background .15s}
.shop-item.buyable:hover{background:var(--c-bg-pill)}
.shop-item.disabled{opacity:.5;cursor:not-allowed}
.shop-status{font-size:var(--fs-xs);padding:3px 10px;border-radius:10px;text-align:right;margin-top:3px;font-weight:600}
.shop-status.buyable{color:var(--c-safe)}
.shop-status.disabled{color:var(--c-danger)}
.loading{text-align:center;padding:30px;color:var(--c-dim);font-size:var(--fs-md);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--c-bg-overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(135deg,var(--c-bg-modal-grad1),var(--c-bg-modal-grad2));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--c-border);border-radius:20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:14px;box-shadow:0 8px 32px var(--c-shadow)}
.modal-title{font-size:var(--fs-md);font-weight:700;margin-bottom:10px;color:var(--c-accent);display:flex;justify-content:space-between;align-items:center}
.modal-close{min-width:44px;min-height:44px;background:var(--c-bg-pill);border:1px solid var(--c-border);color:var(--c-accent);border-radius:12px;padding:4px 10px;cursor:pointer;font-size:var(--fs-md)}
.nsfw-tag{font-size:var(--fs-xs);padding:2px 6px;border-radius:8px;background:rgba(255,107,138,.15);border:1px solid rgba(255,107,138,.3);color:#ff6b8a;margin-left:4px}
.sb-pages{min-height:150px}
.sb-page{display:none}
.sb-nav{display:flex;justify-content:flex-start;align-items:stretch;gap:3px;padding:8px 0 0;border-top:1px solid var(--c-border);margin-top:8px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,105,180,.3) transparent}
.sb-nav::-webkit-scrollbar{height:4px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,105,180,.3);border-radius:2px}
.sb-nav button{flex:0 0 auto;min-width:42px;min-height:44px;background:var(--c-bg-btn);border:1px solid var(--c-border);color:var(--c-dim);border-radius:12px;padding:6px 4px;cursor:pointer;font-size:var(--fs-xs);transition:all .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;font-family:var(--font)}
.sb-nav button.active{background:var(--c-bg-btn-active);border-color:var(--c-accent);color:var(--c-accent);font-weight:700;box-shadow:0 2px 8px rgba(255,105,180,.2)}
.sb-nav button:hover{background:var(--c-bg-btn-hover);color:var(--c-accent)}
.skill-card{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.skill-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.skill-name{font-weight:700;font-size:var(--fs-sm);color:var(--c-accent)}
.skill-tier{font-size:var(--fs-xs);padding:2px 8px;border-radius:8px;font-weight:700}
.skill-tier.tg{background:rgba(255,182,217,.2);color:var(--c-safe)}
.skill-tier.tb{background:var(--c-bg-btn-hover);color:var(--c-blue)}
.skill-tier.ty{background:rgba(255,182,217,.2);color:var(--c-warn)}
.skill-tier.to{background:rgba(255,158,196,.2);color:var(--c-orange)}
.skill-tier.tr{background:rgba(255,107,138,.2);color:var(--c-danger)}
.skill-desc{font-size:var(--fs-xs);color:var(--c-dim);margin-bottom:4px}
.skill-foot{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--c-dim);margin-top:2px}
.skill-next{color:var(--c-accent)}
.event-filter{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.filter-btn{min-height:44px;background:var(--c-bg-btn);border:1px solid var(--c-border);color:var(--c-dim);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:var(--fs-xs);font-family:var(--font)}
.filter-btn.active{background:var(--c-bg-btn-active);color:var(--c-accent);border-color:var(--c-accent)}
.event-timeline{position:relative;padding-left:12px;border-left:2px solid var(--c-border)}
.event-item{margin-bottom:6px;padding:6px 8px;background:var(--c-bg-skill);border-radius:8px;border:1px solid var(--c-border)}
.event-row{display:flex;justify-content:space-between;align-items:center;gap:4px}
.event-type{font-size:var(--fs-xs);font-weight:700;color:var(--c-accent);padding:1px 6px;border-radius:6px;background:var(--c-bg-event-type)}
.event-time{font-size:var(--fs-xs);color:var(--c-dim)}
.event-desc{font-size:var(--fs-xs);color:var(--c-text);margin-top:3px;line-height:1.4}
.setting-btn{min-height:44px;background:var(--c-bg-btn);border:1px solid var(--c-border);color:var(--c-dim);border-radius:12px;padding:8px;cursor:pointer;font-size:var(--fs-sm);transition:all .2s;text-align:center;font-family:var(--font)}
.setting-btn.active{background:var(--c-bg-btn-active);border-color:var(--c-accent);color:var(--c-accent);font-weight:700}
.setting-btn:hover{background:var(--c-bg-btn-hover);color:var(--c-accent)}
.switch-label{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:12px;font-size:var(--fs-sm);color:var(--c-dim);cursor:pointer;min-height:44px}
.switch-label input{margin:0;width:16px;height:16px}
.empty-state{text-align:center;color:var(--c-dim);padding:30px 10px;font-size:var(--fs-md)}
.batch-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:10px;margin-bottom:6px}
.batch-bar .batch-info{font-size:var(--fs-xs);color:var(--c-dim)}
.batch-btn{min-height:36px;background:var(--c-bg-bar);border:1px solid var(--c-border);color:var(--c-accent);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:var(--fs-xs);font-family:var(--font)}
.batch-btn:hover{background:var(--c-bg-bar-hover)}
.batch-btn.danger{color:var(--c-danger);border-color:rgba(255,107,138,.3)}
.record-item{position:relative}
.record-item .batch-check{position:absolute;top:6px;right:8px;width:16px;height:16px}
.rec-expand-btn{font-size:var(--fs-xs);padding:2px 8px;border-radius:8px;background:var(--c-bg-event-type);border:1px solid var(--c-border);color:var(--c-accent);cursor:pointer;margin-top:3px}
.rec-expand-btn:hover{background:var(--c-bg-bar-hover)}
.rec-detail{display:none;padding:6px 8px;margin-top:4px;background:var(--c-bg-btn);border-radius:8px;font-size:var(--fs-xs);line-height:1.5}
.rec-detail.show{display:block}
.event-importance{font-size:var(--fs-xs);padding:1px 6px;border-radius:6px;font-weight:700;margin-left:4px}
.event-importance.high{background:rgba(255,107,138,.2);color:var(--c-danger)}
.event-importance.mid{background:rgba(255,158,196,.2);color:var(--c-warn)}
.event-importance.low{background:rgba(255,182,217,.15);color:var(--c-safe)}
.radar-svg{display:block;margin:6px auto;max-width:200px;width:100%;height:auto}
.radar-svg polygon.data{fill:rgba(255,105,180,.25);stroke:var(--c-accent);stroke-width:1.5;transition:all .4s ease}
.radar-svg circle.dot{fill:var(--c-accent)}
.radar-svg text{fill:var(--c-dim);font-size:9px;text-anchor:middle;dominant-baseline:middle}
.radar-svg line.grid{stroke:rgba(255,182,193,.2);stroke-width:.5}
.task-card{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:12px;padding:8px 10px;margin-bottom:6px;border-left:3px solid var(--c-accent)}
.task-card.main{border-left-color:var(--c-warn)}
.task-card.side{border-left-color:var(--c-blue)}
.task-card.daily{border-left-color:var(--c-safe)}
.task-card.hidden_t,.task-card.hidden{border-left-color:var(--c-pink)}
.task-type-tag{font-size:var(--fs-xs);padding:1px 6px;border-radius:6px;font-weight:700}
.task-type-tag.main{background:rgba(255,158,196,.2);color:var(--c-warn)}
.task-type-tag.side{background:rgba(255,133,162,.2);color:var(--c-blue)}
.task-type-tag.daily{background:rgba(255,182,217,.2);color:var(--c-safe)}
.task-type-tag.hidden_t,.task-type-tag.hidden{background:rgba(255,20,147,.2);color:var(--c-pink)}
.task-diff-tag{font-size:var(--fs-xs);padding:1px 5px;border-radius:5px;font-weight:700}
.task-diff-tag.d-d{background:rgba(200,200,200,.15);color:#ccc}
.task-diff-tag.d-c{background:rgba(180,200,220,.15);color:#b4c8dc}
.task-diff-tag.d-b{background:rgba(150,180,200,.2);color:#96b4c8}
.task-diff-tag.d-a{background:rgba(255,182,193,.2);color:var(--c-warn)}
.task-diff-tag.d-s{background:rgba(255,158,196,.25);color:var(--c-orange)}
.task-diff-tag.d-ss{background:rgba(255,107,138,.25);color:var(--c-danger)}
.task-status-tag{font-size:var(--fs-xs);padding:1px 6px;border-radius:6px}
.task-status-tag.todo{background:rgba(200,200,200,.15);color:#ccc}
.task-status-tag.doing{background:rgba(133,162,255,.15);color:#85a2ff}
.task-status-tag.done{background:rgba(120,200,130,.2);color:#78c882}
.task-status-tag.failed{background:rgba(255,107,138,.2);color:var(--c-danger)}
.rule-card{background:var(--c-bg-btn);border:1px solid var(--c-border);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.rule-card.world{border-left:3px solid var(--c-blue)}
.rule-card.school{border-left:3px solid var(--c-warn)}
.rule-card h4{font-size:var(--fs-sm);color:var(--c-accent);margin-bottom:4px}
.rule-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:var(--fs-xs);color:var(--c-dim)}
.shop-quality{font-size:var(--fs-xs);padding:1px 5px;border-radius:5px;font-weight:700;margin-left:4px}
.shop-quality.common{background:rgba(200,200,200,.15);color:#ccc}
.shop-quality.fine{background:rgba(120,160,220,.2);color:#78a0dc}
.shop-quality.rare{background:rgba(180,120,220,.2);color:#b478dc}
.shop-quality.epic{background:rgba(255,158,96,.25);color:#ff9e60}
.shop-quality.legend{background:rgba(255,200,80,.25);color:#ffc850}
.shop-stock-tag{font-size:var(--fs-xs);padding:1px 5px;border-radius:5px}
.shop-stock-tag.plenty{background:rgba(120,200,130,.2);color:#78c882}
.shop-stock-tag.tight{background:rgba(255,200,80,.2);color:#ffc850}
.shop-stock-tag.low{background:rgba(255,158,96,.2);color:#ff9e60}
.shop-stock-tag.none{background:rgba(200,200,200,.15);color:#999}
.env-card{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.env-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:4px}
.env-item{background:rgba(255,182,193,.1);border-radius:8px;padding:4px 8px;font-size:var(--fs-xs)}
.env-item .k{color:var(--c-dim)}.env-item .v{color:var(--c-accent);font-weight:600}
.radar-signal{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:10px;margin-bottom:4px}
.radar-type{font-size:var(--fs-xs);padding:1px 6px;border-radius:6px;font-weight:700;white-space:nowrap}
.radar-type.person{background:rgba(255,133,162,.2);color:var(--c-blue)}
.radar-type.vehicle{background:rgba(180,120,220,.2);color:#b478dc}
.radar-type.building{background:rgba(255,182,217,.2);color:var(--c-safe)}
.radar-type.item{background:rgba(52,152,219,.2);color:#3498db}
.radar-strength{font-size:var(--fs-xs);padding:1px 5px;border-radius:5px;font-weight:700}
.radar-strength.strong{background:rgba(255,107,138,.2);color:var(--c-danger)}
.radar-strength.medium{background:rgba(255,158,96,.2);color:var(--c-orange)}
.radar-strength.weak{background:rgba(200,200,200,.15);color:#ccc}
.radar-strength.very_weak{background:rgba(200,200,200,.1);color:#999}
.radar-strength.trace{background:rgba(200,200,200,.08);color:#888}
.radar-threat{font-size:var(--fs-xs);padding:1px 5px;border-radius:5px}
.radar-threat.harmless{background:rgba(120,200,130,.2);color:#78c882}
.radar-threat.suspicious{background:rgba(255,200,80,.2);color:#ffc850}
.radar-threat.hostile{background:rgba(255,158,96,.2);color:var(--c-orange)}
.radar-threat.extreme{background:rgba(255,107,138,.2);color:var(--c-danger)}
.radar-threat.unknown{background:rgba(200,200,200,.15);color:#999}
.asset-section{margin-bottom:8px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
@media(max-width:480px){.char-grid{grid-template-columns:repeat(2,1fr)}}
.char-card{background:var(--c-bg-card);border:1px solid rgba(255,182,193,.35);border-radius:10px;padding:6px 8px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.char-card:hover{background:var(--c-bg-pill);transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,105,180,.15)}
.char-card.danger{border-color:rgba(231,76,60,.5);background:rgba(231,76,60,.05)}
.char-card.warn{border-color:rgba(243,156,18,.5);background:rgba(243,156,18,.05)}
.char-card.safe{border-color:rgba(46,204,113,.4)}
.char-card.highlight{box-shadow:0 0 0 3px var(--c-accent),0 4px 16px rgba(255,105,180,.4);animation:charCardHighlight 1.5s ease}
@keyframes charCardHighlight{0%,100%{box-shadow:0 0 0 3px var(--c-accent),0 4px 16px rgba(255,105,180,.4)}50%{box-shadow:0 0 0 4px var(--c-accent),0 6px 20px rgba(255,105,180,.6)}}
.char-card-head{display:flex;align-items:center;gap:4px;min-width:0}
.char-card-icon{font-size:14px;flex-shrink:0}
.char-card-name{font-weight:700;color:var(--c-text);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.char-card-role{font-size:10px;color:var(--c-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--c-dim);margin-top:2px}
.char-card-stage{font-size:10px;font-weight:600;padding:1px 4px;border-radius:4px;background:rgba(255,105,180,.12);color:var(--c-accent);text-align:center;margin-top:2px}
.char-card-cls{font-size:9px;color:var(--c-dim);text-align:center;border-top:1px solid rgba(255,182,193,.2);padding-top:2px;margin-top:2px}
.asset-card{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:10px;padding:6px 8px}
.asset-card .name{font-weight:600;font-size:var(--fs-sm);color:var(--c-accent)}
.asset-card .qty{font-size:var(--fs-xs);color:var(--c-dim);float:right}
.asset-card .meta{font-size:var(--fs-xs);color:var(--c-dim);margin-top:2px}
.craft-layout{display:flex;gap:8px;flex-wrap:wrap}
.craft-list{flex:1;min-width:200px}
.craft-detail{flex:1;min-width:200px}
.craft-recipe{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:10px;padding:6px 8px;margin-bottom:4px;cursor:pointer}
.craft-recipe.active{border-color:var(--c-accent);background:rgba(255,105,180,.15)}
.craft-search{width:100%;padding:6px 8px;background:var(--c-bg-btn);border:1px solid var(--c-border);border-radius:10px;color:var(--c-text);font-size:var(--fs-sm);margin-bottom:6px;font-family:var(--font)}
.craft-search::placeholder{color:var(--c-dim)}
.craft-mat{display:flex;justify-content:space-between;font-size:var(--fs-xs);padding:2px 0}
.craft-mat .ok{color:#78c882}.craft-mat .no{color:var(--c-danger)}
.craft-diff{background:rgba(255,182,193,.08);border-radius:8px;padding:6px;margin:4px 0}
.craft-diff-row{display:flex;justify-content:space-between;font-size:var(--fs-xs);padding:1px 0}
.craft-diff-row .before{color:var(--c-dim);text-decoration:line-through}
.craft-diff-row .after{color:var(--c-safe);font-weight:600}
.craft-flash{animation:craftFlash .6s ease}
@keyframes craftFlash{0%{background:rgba(120,200,130,.3)}100%{background:transparent}}
.vehicle-card,.residence-card{background:var(--c-bg-skill);border:1px solid var(--c-border);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.vehicle-status{font-size:var(--fs-xs);padding:1px 6px;border-radius:6px;font-weight:700}
.vehicle-status.parked{background:rgba(133,162,255,.15);color:#85a2ff}
.vehicle-status.moving{background:rgba(120,200,130,.2);color:#78c882}
.vehicle-status.repair{background:rgba(255,200,80,.2);color:#ffc850}
.vehicle-status.damaged{background:rgba(255,107,138,.2);color:var(--c-danger)}
.sub-card{background:rgba(255,182,193,.08);border:1px solid rgba(255,182,193,.2);border-radius:8px;padding:5px 8px;margin:4px 0;font-size:var(--fs-xs)}
@media(max-width:480px){.g{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.hd-t{font-size:var(--fs-sm)}.hd-l{width:100%}.sb-nav button{padding:6px 2px;font-size:10px}.skill-card{padding:6px 8px}}
@media(max-width:360px){.g{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.sb-nav button{padding:4px 1px;font-size:9px}}

<script>
// 注：原 {{format_message_variable::stat_data}} 宏在 iframe srcdoc 中不会被 ST 替换，已移除
// 数据获取统一走 postMessage 桥接（fjb-mvu-stat-request → fjb-mvu-stat-data）
var TH_HOSTS=[window,window.parent,window.top].filter(function(w,i,arr){return w&&arr.indexOf(w)===i});
function pickHostValue(name){if(window[name]!==undefined)return window[name];for(var i=0;i<TH_HOSTS.length;i++){try{if(TH_HOSTS[i][name]!==undefined)return TH_HOSTS[i][name]}catch(e){}}return undefined}
function getMvu(){return pickHostValue('Mvu')||window.Mvu||null}
function parseEmbeddedStat(){var el=document.getElementById('mvu-stat-embed');if(!el)return null;var raw=(el.textContent||el.innerText||'').trim();if(!raw||raw.indexOf('format_message_variable')>=0)return null;try{var parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'){if(parsed.stat_data&&typeof parsed.stat_data==='object')return parsed.stat_data;return parsed}}catch(e){}return null}
function hasData(o){return o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length>0}
// 通用：record 对象转数组（兼容旧 array 数据；record 的 key 存入元素 _key 字段供 id 回退使用）
function recToArray(x){if(!x)return [];if(Array.isArray(x))return x;if(typeof x==='object'){var arr=[];for(var k in x){if(!Object.prototype.hasOwnProperty.call(x,k))continue;var v=x[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!v._key)v._key=k;arr.push(v)}else{arr.push(v)}}return arr}return []}
// 通用：record 对象的 key 列表（用于 某人清醒/某人崩坏 等key即角色名的场景）
function recKeys(x){if(!x||typeof x!=='object'||Array.isArray(x))return [];return Object.keys(x)}
function resolveMessageIdFromDom(){try{var frame=window.frameElement;if(frame&&frame.closest){var mes=frame.closest('.mes');if(mes){var id=parseInt(mes.getAttribute('mesid'),10);if(id>=0)return id}}var el=frame;while(el){if(el.classList&&el.classList.contains('mes')){var id2=parseInt(el.getAttribute('mesid'),10);if(id2>=0)return id2}el=el.parentElement}}catch(e){}return -1}
function resolveMessageIdFromIframeName(){var fn=pickHostValue('getIframeName');if(typeof fn==='function'){try{var name=String(fn()||'');var m=/^TH-message--(\d+)--/.exec(name);if(m)return parseInt(m[1],10)}catch(e){}}return -1}
function resolveMessageId(){var fromDom=resolveMessageIdFromDom();if(fromDom>=0)return fromDom;var fromName=resolveMessageIdFromIframeName();if(fromName>=0)return fromName;if(typeof window.message_id==='number'&&window.message_id>=0)return window.message_id;var fn=pickHostValue('getCurrentMessageId');if(typeof fn==='function'){try{return fn()}catch(e){}}return -1}
function getMessageOption(){var messageId=resolveMessageId();return{type:'message',message_id:messageId>=0?messageId:'latest'}}
function pickStatData(source){if(!source||typeof source!=='object')return null;var stat=source.stat_data;return hasData(stat)?stat:null}
var cachedStatFromBridge=null;
function readStatDataSync(){if(cachedStatFromBridge&&hasData(cachedStatFromBridge))return deepMergeStat(DEFAULT_STAT,cachedStatFromBridge);var embedded=parseEmbeddedStat();if(embedded)return deepMergeStat(DEFAULT_STAT,embedded);return deepMergeStat(DEFAULT_STAT,{})}
// 桥接获取：优先从控制中心发布的 FjbHudBridge 取数据（与控制中心桥接同构）
function getHudBridge(){try{var B=window.FjbHudBridge||(window.parent&&window.parent.__FJB_HUD_BRIDGE)||null;return B}catch(e){return null}}
async function readStatFromBridge(){var B=getHudBridge();if(!B)return null;try{if(typeof B.getVariables==='function'){var v=B.getVariables();if(v&&v.stat_data&&hasData(v.stat_data))return deepMergeStat(DEFAULT_STAT,v.stat_data)}}catch(e){}try{if(typeof B.waitForMvu==='function'){var mvu=await B.waitForMvu(3000);if(mvu&&typeof mvu.getMvuData==='function'){var mid=typeof B.getCurrentMessageId==='function'?B.getCurrentMessageId():-1;if(mid>=0){var mv=await mvu.getMvuData({type:'message',message_id:mid});var stat=pickStatData(mv);if(stat&&hasData(stat))return deepMergeStat(DEFAULT_STAT,stat)}}}}catch(e){}return null}
async function readStatDataAsync(){// 优先桥接
var bridgeStat=await readStatFromBridge();if(bridgeStat&&hasData(bridgeStat))return bridgeStat;
// 方案1: 直接用 latest 从 MVU/getVariables 读取
try{var Mvu=getMvu();var gv=pickHostValue('getVariables');if(Mvu&&typeof Mvu.getMvuData==='function'){var v=await Mvu.getMvuData({type:'message',message_id:'latest'});var stat=pickStatData(v);if(stat&&hasData(stat))return deepMergeStat(DEFAULT_STAT,stat)}if(gv){var v2=await gv({type:'message',message_id:'latest'});var stat2=pickStatData(v2);if(stat2&&hasData(stat2))return deepMergeStat(DEFAULT_STAT,stat2)}}catch(e){}
// 方案2: 从最新消息往前找
try{var fnGetLast=pickHostValue('getLastMessageId');var fnGetMsg=pickHostValue('getChatMessages');if(typeof fnGetLast==='function'&&typeof fnGetMsg==='function'){var maxId=fnGetLast();var Mvu2=getMvu();var gv2=pickHostValue('getVariables');for(var i=0;i<15;i++){var cid=maxId-i;if(cid<0)break;var msg=null;try{msg=fnGetMsg(cid)}catch(e){continue}if(Array.isArray(msg))msg=msg[0];if(!msg||msg.role!=='assistant')continue;var mid=msg.message_id;if(typeof mid!=='number'||mid<0)continue;var v=null;try{if(Mvu2&&typeof Mvu2.getMvuData==='function'){v=await Mvu2.getMvuData({type:'message',message_id:mid})}else if(gv2){v=await gv2({type:'message',message_id:mid})}}catch(e){}var stat=pickStatData(v);if(stat&&hasData(stat))return deepMergeStat(DEFAULT_STAT,stat)}}}catch(e){}
var embedded=parseEmbeddedStat();if(embedded)return deepMergeStat(DEFAULT_STAT,embedded);return deepMergeStat(DEFAULT_STAT,{})}
function requestStatFromBridge(){var mesId=resolveMessageId();var payload={type:'fjb-mvu-stat-request',messageId:mesId};var origin=window.location.origin||'*';for(var i=0;i<TH_HOSTS.length;i++){try{TH_HOSTS[i].postMessage(payload,origin)}catch(e){}}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(v,d){v=parseFloat(v);d=(d===undefined)?0:d;return isNaN(v)?d:v}
function pct(v,max){v=num(v,0);max=num(max,100);return Math.max(0,Math.min(100,max>0?(v/max)*100:0))}
function barClass4(v){v=parseInt(v)||0;if(v>=80)return'g';if(v>=60)return'y';if(v>=30)return'o';return'r'}
function barClass5(v){v=parseInt(v)||0;if(v>=80)return'g';if(v>=60)return'b';if(v>=40)return'y';if(v>=20)return'o';return'r'}
// ===== 每轮变更高亮系统 =====
// 保存上一轮的 stat_data 哈希快照，对比字段变化时为 kv 添加 .changed 类
var __lastSnapshot=null;var __currentSnapshot=null;var __changedKeys={};
function __hashVal(v){if(v==null)return'null';if(typeof v==='object'){var keys=Object.keys(v).sort();var s='';for(var i=0;i<keys.length;i++)s+=keys[i]+':'+__hashVal(v[keys[i]])+';';return s}return String(v)}
function __diffPath(prev,curr,prefix){prefix=prefix||'';if(prev==null&&curr==null)return;if(typeof prev!=='object'||typeof curr!=='object'||prev==null||curr==null){if(__hashVal(prev)!==__hashVal(curr)){__changedKeys[prefix]=true}return}var keys=Object.keys(prev).concat(Object.keys(curr).filter(function(k){return prev[k]===undefined}));var seen={};for(var i=0;i<keys.length;i++){var k=keys[i];if(seen[k])continue;seen[k]=true;__diffPath(prev[k],curr[k],prefix?prefix+'.'+k:k)}}
function startDiffTracking(newStat){__changedKeys={};if(__lastSnapshot!=null){__diffPath(__lastSnapshot,newStat,'')}__currentSnapshot=newStat}
function commitSnapshot(){__lastSnapshot=__currentSnapshot;__currentSnapshot=null;setTimeout(function(){__changedKeys={}},3500)}
function hasChanged(key){return !!__changedKeys[key]}

Array(rm.待办们)?rm.待办们:[];var todoStr=rm.待办||'';var lastClean=rm.最后清洁日||'';var roomNote=rm.备注||'';detail+='<div class="sub-card"><div class="heroine-row"><span>'+(roomType||'房间'+(ridx+1))+'</span>'+(roomStatus?'<span class="heroine-stat">'+esc(roomStatus)+'</span>':'')+'</div>'+(occupants.length>0?'<div class="heroine-stats"><span>👥 居住者: '+occupants.map(function(o){return esc(String(o))}).join('、')+'</span></div>':(occupant?'<div class="heroine-stats"><span>👤 '+esc(occupant)+'</span></div>':''))+'<div class="heroine-stats">'+(privacy?'<span>隐私: '+esc(privacy)+'</span>':'')+(cleanliness!==''?'<span>整洁: '+esc(cleanliness)+'</span>':'')+(comfort!==''?'<span>舒适: '+esc(comfort)+'</span>':'')+'</div>'+(atmosphere?'<div class="heroine-stats"><span>氛围: '+esc(atmosphere)+'</span></div>':'')+(lock?'<div class="heroine-stats"><span>🔒 门锁: '+esc(lock)+'</span></div>':'')+(facilitiesList.length>0?'<div class="heroine-stats"><span>设施: '+facilitiesList.map(function(f){return esc(String(f))}).join('、')+'</span></div>':(facilityStr?'<div class="heroine-stats"><span>设施: '+esc(facilityStr)+'</span></div>':''))+(todos.length>0?'<div class="heroine-stats"><span>📋 待办: '+todos.map(function(t){return esc(String(t))}).join('、')+'</span></div>':(todoStr?'<div class="heroine-stats"><span>📋 待办: '+esc(todoStr)+'</span></div>':''))+(lastClean?'<div class="heroine-stats"><span>🧹 最后清洁: D'+esc(lastClean)+'</span></div>':'')+(roomNote?'<div class="heroine-stats"><span>备注: '+esc(roomNote)+'</span></div>':'')+'</div>'})}if(facilities.length>0){detail+='<div class="sect-title">公共设施 ('+facilities.length+')</div>';facilities.forEach(function(f,fidx){var fType=f.类型||f.设施类型||'';var fName=f.名称||f.设施||'';var fStatus=f.状态||f.开放状态||'';var fUser=f.占用者||f.当前人员||'';var fClean=f.清洁度||'';var fPrivacy=f.隐私||'';var fNote=f.备注||'';detail+='<div class="sub-card"><div class="heroine-row"><span>'+(fType||fName||'设施'+(fidx+1))+'</span>'+(fStatus?'<span class="heroine-stat">'+esc(fStatus)+'</span>':'')+'</div>'+(fUser?'<div class="heroine-stats"><span>👤 占用者: '+esc(fUser)+'</span></div>':'')+'<div class="heroine-stats">'+(fClean?'<span>清洁: '+esc(fClean)+'</span>':'')+(fPrivacy?'<span>隐私: '+esc(fPrivacy)+'</span>':'')+'</div>'+(fNote?'<div class="heroine-stats"><span>备注: '+esc(fNote)+'</span></div>':'')+'</div>'})}body+=renderRecordItem('居所',id,inner,detail)});return body}

function switchPage(page){currentPage=page;render()}

function notifyCC(type,payload){try{var msg={type:type};if(payload)for(var k in payload)if(Object.prototype.hasOwnProperty.call(payload,k))msg[k]=payload[k];var origin=window.location.origin||'*';window.postMessage(msg,origin);if(window.parent&&window.parent!==window)window.parent.postMessage(msg,origin);if(window.top&&window.top!==window)window.top.postMessage(msg,origin)}catch(e){}}
function findHostTextarea(){for(var i=0;i<TH_HOSTS.length;i++){try{var doc=TH_HOSTS[i].document;if(doc){var el=doc.querySelector('#send_textarea textarea')||doc.querySelector('textarea#send_textarea');if(el)return el}}catch(e){}}return null}
var ccSwitchState={floatball:true,opening:true,media_lib:false,auto_refresh:true,event_notify:true,diy:false};
function requestCCState(){notifyCC('fjb-cc-get-state',{})}
function switchTheme(theme){currentTheme=theme;var root=document.documentElement;var t=THEMES[theme]||THEMES.pink;for(var k in t){if(Object.prototype.hasOwnProperty.call(t,k))root.style.setProperty(k,t[k])}try{localStorage.setItem('fjb-status-theme',theme)}catch(e){}notifyCC('fjb-set-theme',{theme:theme});render()}
function loadPersistedTheme(){try{var t=localStorage.getItem('fjb-status-theme');if(t&&THEMES[t]){currentTheme=t;var root=document.documentElement;var tv=THEMES[t];for(var k in tv){if(Object.prototype.hasOwnProperty.call(tv,k))root.style.setProperty(k,tv[k])}}}catch(e){}}
function setDifficulty(diff){notifyCC('fjb-set-difficulty',{difficulty:diff});var s=State.mvu;if(s&&s.stats)s.stats.difficulty=diff;render()}
// 女性综合阶段中文映射
var STAGE_LABELS={'A_理性期':'理性期','B_动摇期':'动摇期','C_沉沦期':'沉沦期','D_疯狂期':'疯狂期','E_崩坏期':'崩坏期'};
function stageLabel(cs){if(!cs)return '理性期';if(STAGE_LABELS[cs])return STAGE_LABELS[cs];var m=/^([A-E])_/.exec(cs);return m?(m[1]+'阶段'):'理性期'}
function stageShort(cs){if(!cs)return 'A';var m=/^([A-E])/.exec(cs);return m?m[1]:'A'}
function stageDesc(cs){var map={'A_理性期':'理性·未受影响','B_动摇期':'动摇·开始好奇','C_沉沦期':'沉沦·主动寻求','D_疯狂期':'疯狂·无法自拔','E_崩坏期':'崩坏·人格解离'};return map[cs]||'未知状态'}

// 展开状态持久化（防止 render() 重新渲染丢失展开的详情）
var expandedDetailIds={};
function saveExpandedDetails(){expandedDetailIds={};var els=document.querySelectorAll('.rec-detail.show');for(var i=0;i<els.length;i++){var id=els[i].getAttribute('id');if(id)expandedDetailIds[id]=true}var openDetails=document.querySelectorAll('details.block[open]');for(var j=0;j<openDetails.length;j++){var key=openDetails[j].getAttribute('data-key');if(key)State.expanded[key]=true}}
function restoreExpandedDetails(){for(var id in expandedDetailIds){if(Object.prototype.hasOwnProperty.call(expandedDetailIds,id)){var el=document.getElementById(id);if(el)el.classList.add('show');var btn=document.querySelector('[data-act="toggle-detail"][data-id="'+id.replace(/^detail-/,'')+'"]');if(btn)btn.textContent='收起'}}}
function render(){var loadingEl=document.getElementById('sb-loading');var bodyEl=document.getElementById('sb-body');if(!bodyEl)return;if(State.loading){loadingEl.style.display='';bodyEl.style.display='none';return}loadingEl.style.display='none';bodyEl.style.display='';saveExpandedDetails();var pageEls=document.querySelectorAll('.sb-page');for(var i=0;i<pageEls.length;i++){var p=pageEls[i].getAttribute('data-page');if(p===currentPage){pageEls[i].style.display='block';pageEls[i].innerHTML=renderPageByName(p)}else{pageEls[i].style.display='none'}}var navBtns=document.querySelectorAll('.sb-nav button');for(var j=0;j<navBtns.length;j++){if(navBtns[j].getAttribute('data-page')===currentPage)navBtns[j].classList.add('active');else navBtns[j].classList.remove('active')}restoreExpandedDetails()}

function showModal(title,content){var overlay=document.getElementById('modal-overlay');var modal=document.getElementById('modal-content');modal.innerHTML='<div class="modal-title"><span>'+esc(title)+'</span><button class="modal-close" data-act="close-modal">✕</button></div>'+content;overlay.className='modal-overlay show'}
function closeModal(){document.getElementById('modal-overlay').className='modal-overlay'}

function bindEvents(){var root=document.getElementById('sb-root');root.addEventListener('toggle',function(e){var t=e.target;if(t&&t.tagName==='DETAILS'){var key=t.getAttribute('data-key');if(key){State.expanded[key]=t.hasAttribute('open')}}},true);root.addEventListener('click',function(e){var navBtn=e.target.closest('.sb-nav button');if(navBtn){switchPage(navBtn.getAttribute('data-page'));return}var t=e.target.closest('[data-act]');if(!t)return;var act=t.getAttribute('data-act');if(act==='refresh'){refresh()}else if(act==='heroine-detail'){renderHeroineDetail(t.getAttribute('data-key'))}else if(act==='set-difficulty'){var val=t.getAttribute('data-val');setDifficulty(val);var input=findHostTextarea();if(input){input.value='切换难度为'+val;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}}else if(act==='set-theme'){switchTheme(t.getAttribute('data-val'))}else if(act==='filter-event'){currentEventFilter=t.getAttribute('data-val');render()}
// P0-1: 批量选择/展开折叠/批量删除
else if(act==='toggle-batch'){batchSelectMode=!batchSelectMode;if(!batchSelectMode)batchSelected={};render()}
else if(act==='toggle-detail'){var did=t.getAttribute('data-id');var el=document.getElementById('detail-'+did);if(el){var isShow=el.classList.toggle('show');t.textContent=isShow?'收起':'展开'}}
else if(act==='batch-delete'){var cat=t.getAttribute('data-cat');if(batchSelected[cat]){var ids=Object.keys(batchSelected[cat]).filter(function(k){return batchSelected[cat][k]});if(ids.length>0){var input=findHostTextarea();if(input){input.value='删除'+cat+'记录: '+ids.join(', ');input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}}}}
else if(act==='filter-radar'){currentRadarFilter=t.getAttribute('data-val');render()}
else if(act==='filter-craft'){craftFilter=t.getAttribute('data-val');render()}
else if(act==='select-craft'){craftSelectedId=t.getAttribute('data-id');render()}
else if(act==='execute-craft'){var cid=t.getAttribute('data-id');var input=findHostTextarea();if(input){input.value='执行制造: '+cid;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}}
else if(act==='switch-schedule-week'){switchScheduleWeek(t.getAttribute('data-val'))}
else if(act==='char-filter-class'){State.charClassFilter=t.getAttribute('data-val')||'全部';render()}
else if(act==='goto-characters'){var gotoUid=t.getAttribute('data-uid')||'';switchPage('characters');State.charSearch=gotoUid;State.charClassFilter='全部';State.charHighlight=gotoUid;render();setTimeout(function(){var card=document.getElementById('char-card-'+gotoUid);if(card){card.classList.add('highlight');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){card.classList.remove('highlight')},3000)}},200)}
});
root.addEventListener('input',function(e){var t=e.target;if(!t)return;if(t.id==='craft-search'){craftSearchText=t.value;render()}else if(t.id==='char-search'){State.charSearch=t.value;render()}});
root.addEventListener('change',function(e){var t=e.target;if(!t)return;if(t.getAttribute('data-act')==='toggle-fn'){var sw=t.getAttribute('data-val');ccSwitchState[sw]=t.checked;notifyCC('fjb-cc-set-switch',{key:sw,value:t.checked})}else if(t.getAttribute('data-act')==='batch-check'){var cat=t.getAttribute('data-cat');var id=t.getAttribute('data-id');if(!batchSelected[cat])batchSelected[cat]={};batchSelected[cat][id]=t.checked;var bar=document.querySelector('.batch-bar .batch-info');if(bar){var count=Object.keys(batchSelected[cat]).filter(function(k){return batchSelected[cat][k]}).length;bar.textContent='已选 '+count+' 条'}}});root.addEventListener('click',function(e){var item=e.target.closest('.shop-item.buyable');if(!item)return;var itemId=item.getAttribute('data-item');var price=Number(item.getAttribute('data-price'))||0;var itemName=item.getAttribute('data-name')||item.querySelector('.heroine-name').textContent;var input=findHostTextarea();if(input){input.value='购买'+itemName+'（'+price+'元）';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}});document.getElementById('modal-overlay').addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(t&&t.getAttribute('data-act')==='close-modal'){closeModal()}})}

async function refresh(){if(State._refreshing)return;State._refreshing=true;State.refreshing=true;var quickStat=readStatDataSync();if(hasData(quickStat)){State.mvu=quickStat;State.loading=false}startDiffTracking(State.mvu);render();try{var realStat=await readStatDataAsync();if(hasData(realStat)){State.mvu=realStat;cachedStatFromBridge=realStat;State.loading=false}}catch(e){}startDiffTracking(State.mvu);State._refreshing=false;State.refreshing=false;render();commitSnapshot();requestStatFromBridge()}

(function init(){bindEvents();loadPersistedTheme();var autoRefresh=function(){if(!ccSwitchState.auto_refresh)return;setTimeout(refresh,800)};var hostEventOn=pickHostValue('eventOn');try{if(typeof hostEventOn==='function'){hostEventOn('GENERATION_ENDED',autoRefresh);hostEventOn('MESSAGE_EDITED',autoRefresh);hostEventOn('mag_variable_update_ended',autoRefresh);hostEventOn('MESSAGE_SWIPED',autoRefresh);hostEventOn('chat_changed',autoRefresh);hostEventOn('chat_loaded',autoRefresh)}}catch(e){}
// HUD 桥接信号订阅（与变量订阅桥接同构）：控制中心 emitHudSignal('data-changed') 时自动刷新
try{var B=getHudBridge();if(B&&typeof B.subscribeHud==='function'){B.subscribeHud(function(signal,payload){try{if(signal==='data-changed'){if(payload&&payload.stat_data&&hasData(payload.stat_data)){cachedStatFromBridge=payload.stat_data;State.mvu=deepMergeStat(DEFAULT_STAT,payload.stat_data);State.loading=false;render()}else{refresh()}}}catch(e){}})}}catch(e){}
window.addEventListener('message',function(e){try{if(e.origin&&e.origin!==window.location.origin)return;var data=e.data;if(data&&data.type==='fjb-mvu-stat-data'&&data.stat_data){var mesId=resolveMessageId();if(mesId>=0&&typeof data.messageId==='number'&&data.messageId>=0&&data.messageId!==mesId)return;if(hasData(data.stat_data)){cachedStatFromBridge=data.stat_data;State.mvu=deepMergeStat(DEFAULT_STAT,data.stat_data);State.loading=false;render()}return}if(data&&data.type==='fjb-set-theme'&&data.theme){currentTheme=data.theme;var root=document.documentElement;var t=THEMES[currentTheme]||THEMES.pink;for(var k in t){if(Object.prototype.hasOwnProperty.call(t,k))root.style.setProperty(k,t[k])}render();return}if(data&&data.type==='fjb-cc-state'&&data.state){if(data.state.switches)ccSwitchState=data.state.switches;if(data.state.theme){currentTheme=data.state.theme;var root2=document.documentElement;var t2=THEMES[currentTheme]||THEMES.pink;for(var k2 in t2){if(Object.prototype.hasOwnProperty.call(t2,k2))root2.style.setProperty(k2,t2[k2])}}render();return}}catch(x){}});
// 初始化数据源：优先桥接 → 嵌入宏 → postMessage 请求
var embedded=parseEmbeddedStat();if(embedded)cachedStatFromBridge=embedded;
// 优先尝试桥接同步获取
try{var B2=getHudBridge();if(B2&&typeof B2.getVariables==='function'){var bv=B2.getVariables();if(bv&&bv.stat_data&&hasData(bv.stat_data))cachedStatFromBridge=bv.stat_data}}catch(e){}
requestStatFromBridge();requestCCState();refresh();
// 显式设置桥接就绪标记（供控制中心 4 条件握手检测，boot 脚本已设置，此处双保险）
try{document.documentElement.setAttribute('data-fjb-hud-ready','1')}catch(e){}
console.log('[不要玩弄我的鸡吧] 状态栏已初始化, 桥接:'+((typeof getHudBridge()==='object')?'可用':'不可用'))})();
</script>
