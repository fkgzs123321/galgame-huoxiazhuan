# ════════════════════════════════════════════════════════════
# 底座_nanpa2 · 目的清单（goal_units 契约）
# ════════════════════════════════════════════════════════════
# 作用：把「她.目的进度 0-100」从一个抽象数字，变成【可枚举的达成清单】。
#       引擎侧只认两个数：总单元数、已达成数。进度 = 已达成 / 总数 × 100。
#
# 为什么需要它：
#   原卡的 `她.目的进度` 是想象出来的 0-100，什么算推进、什么算达成全靠文字描述。
#   纪清（100% 全 CG）这个钩子尤其无法量化 —— 「全 CG」到底是几张？没人说得清。
#   本清单把它钉死成一个有限集合，于是：
#     · 她的目的进度可计算、可显示
#     · 「她要什么」变成可核对的清单，而不是 AI 的感觉
#     · 每套人设取不同子集，于是同一份内容能撑起 7 种玩法
#
# ⚠️ 边界：本文件只管【她要什么】。
#    【她怎么玩】（手段：快进 / 反复看同一段 / 挂机 / 外挂 / 精算…）
#    见 `机制层规范.md §E6` —— 每套人设的手段都不同，
#    **外挂只是其中一种，不是通用层级**。
# ════════════════════════════════════════════════════════════

meta:
  底座: nanpa2
  总单元数: 88
  进度公式: '已达成单元数 / 88 × 100'

# ════════════════════════════════════════════════════════════
# 单元来源
# ════════════════════════════════════════════════════════════
# ⚠️ 本文件【不复制】88 张 CG 的完整定义，只做契约与映射。
#    完整定义（含 cg_visual 画面描写、【这才是真内容】）在原卡：
#
#      同级生2/世界书/事件/CG触发条件表.txt
#
#    每张 CG 的字段结构：
#
#      cg_id            唯一标识
#      cg_name          名称（含女角名）
#      cg_type          分类（见下）
#      heroine_id       归属女角（1-20）
#      trigger_condition {
#        day / time_slot / location          时间地点
#        affection_min / heartbeat_min / trust_min      关系值门槛
#        relationship_stage                              关系阶段门槛
#        flags_required                                  必须已触发的 flag
#        h_exp_min                                       H 进度门槛
#      }
#      unlock_condition 人话版触发说明
#      unlock_record    解锁记录名
#      cg_visual        ★ 画面描写 —— 内容主体，按需加载时才需要进 prompt
#      is_hidden        是否隐藏
#      priority         优先级
#
#    加载方式：**只在单元达成的那一刻加载那一张**，不常驻。
#    （88 张全进 prompt 约 13,000 字符，常驻等于白烧 token）

# ════════════════════════════════════════════════════════════
# 单元分类（88 张）
# ════════════════════════════════════════════════════════════
分类:
  主线:
    数量: 19
    id_前缀: CG_MAIN_
    说明: 每女角 1 张 True End CG。触发集中在 1/7 告白日（day 17 晚）+ 关键 flag 全对 + affection ≥ 80
    id范围: CG_MAIN_001 ~ CG_MAIN_019

  H事件:
    数量: 19
    id_前缀: CG_H_
    说明: 各女角的初 H 场面
    id范围: CG_H_001 ~ CG_H_019

  进阶H:
    数量: 19
    id_前缀: CG_ADVH_
    说明: 口交 / 肛交 / 多人 / 道具等
    id范围: CG_ADVH_001 ~ CG_ADVH_019

  关键剧情:
    数量: 18
    id_前缀: CG_KEY_
    说明: 女角高光时刻 / 剧情转折点（含第 8 段新增的 8 张女主角高光 CG）
    id范围: CG_KEY_001 ~ CG_KEY_018

  隐藏:
    数量: 5
    id_前缀: CG_HIDDEN_
    说明: 隐藏线（樱子线 / 日记全收集 / 变数屋全解锁等）
    id范围: CG_HIDDEN_001 ~ CG_HIDDEN_005

  BAD_END:
    数量: 8
    id_前缀: CG_BADEND_
    说明: 8 个死结局。BAD_END_1_报警 / 2_学园开除 / 3_破产 / 4_崩溃 / 5_嫉妒杀戮 /
          6_西御寺阴谋 / 7_法律制裁 / 8_时间终焉
    id范围: CG_BADEND_001 ~ CG_BADEND_008

# ════════════════════════════════════════════════════════════
# 7 套人设各取什么（同一份内容撑起 7 种玩法）
# ════════════════════════════════════════════════════════════
# 这里填的是「她的目的进度按哪些单元算」。
# 引擎只认数量，具体内容从原卡 CG 表取。
人设目标:

  gentle:            # 温砚 —— 带你走到最好的结局
    取: 主线（19 张里的任意 1 张，条件必须全对）
    隐性门槛:
      - 累计储蓄 ≥ 50000
      - 违法计数 = 0
      - 任一女角嫉妒值 ≤ 30
    单位数: 1
    说明: |
      她要的不是数量，是「对」。全卡最难的一条路 ——
      她得盯着你别违法、还得让你打工攒够五万。
      True End 的四个硬条件里，有两个是她必须主动为你做的（攒钱），
      两个是她必须主动拦着你的（别违法、别让谁吃醋到 30）。

  greedy:            # 丰娆 —— 看遍每一个女角的身体
    取: [H事件, 进阶H]
    单位数: 38
    说明: |
      她要 20 个人都看过。但互斥组会拦住她 ——
      齐藤姐妹 / 田中铃木 / 仁科正树 / 永岛婆媳 里，
      每一组只能走一个人。
      于是她为了看全，会**故意同时踩两条互斥线**，
      亲手把你推进 BAD_END_6_互斥锁定。
      这就是她「贪」的代价，也是她的玩法必然会撞上的墙。

  smirking:          # 舒晏 —— 看挣扎
    取: [关键剧情]   # （偏嫉妒链）
    单位数: 18
    隐性门槛: 任一女角嫉妒值 ≥ 90 → BAD_END_5_嫉妒杀戮
    说明: |
      她不看你的痛，她看**女角之间的绞杀**。
      她故意把关系同时铺开，就为了等那一句失控的台词。

  daredevil:         # 唐响 —— 找最极端的分支
    取: [BAD_END]
    单位数: 8
    说明: 8 个死结局全开一遍。平淡的日常她直接跳过。

  quiet:             # 沈眠 —— 把剧情推向死亡
    取: [BAD_END]   # 中偏静默的那一类（重点 BAD_END_8_时间终焉）
    单位数: 1
    说明: |
      她要的不是血。是**十七天过完，什么都没有发生**。
      BAD_END_8 的判定是「day 17 且所有女角 affection < 30」——
      也就是说，她只要什么都不做，就会得到她要的东西。

  indifferent:       # 莫漾 —— 没有目的，只是消磨一个下午
    取: []
    单位数: 0
    说明: |
      她没有任何目的，所以目的进度永远不动。
      游戏会自己滑向 BAD_END_8_时间终焉。
      她是唯一一个「不推进也是推进」的人设。

  completionist:     # 纪清 —— 100% 全结局全 CG
    取: 全部
    单位数: 88
    说明: |
      她要 100%。她不会满足于「拿到了大部分」——
      清单上还空着一格，她就还在玩。

# ════════════════════════════════════════════════════════════
# 单元体系
# ════════════════════════════════════════════════════════════
# 单元 = 一份可枚举的内容清单，每格对应一张 CG。
# 她要什么、拿到几格，进度就算到几。
#
# ⚠️ 不在卡里规定「哪一格规则上拿不到、该怎么绕过去」——
#    SillyTavern 本来就允许玩家做任何事（重新生成、编辑楼层、改变量、装插件），
#    那是平台给的玩法，**不需要卡来设定或额外解释**。
单元体系:
  来源: 原卡 CG 表
  数量: 88
  分类: 见上方「分类」
  进度: '已达成数 / 该人设取的单位数 × 100'

# ════════════════════════════════════════════════════════════
# 与引擎的接口
# ════════════════════════════════════════════════════════════
接口:
  读:
    - 她.人设            → 决定取哪个子集
    - 已达成单元列表      → 存哪见下
  写:
    - 她.目的进度 = 已达成数 / 该人设的单位数 × 100

  存储建议:
    已达成: 'z.record(z.string(), z.object({ 何时: string, 在哪: string }))'
    键名: 用单元 id   # 例如 CG_MAIN_001 → { 何时: '01-07 23:00', 在哪: '鸣泽家客厅' }

  ⚠️ 待定（2 项）:
    1. 「已达成单元」的命名空间（候选：主角. 下新增，或独立顶层）
    2. **突破单元的具体清单** —— 需要与女角线设计对齐后再定，
       因为「那条路」的具体形态取决于每个女角的规则怎么设
