# ════════════════════════════════════════════════════════════
# 底座_nanpa2 · initvar（变量初始值）
# ════════════════════════════════════════════════════════════
# 结构严格对应 `状态表.yaml` 的 T2。
#
# 与原卡 initvar 的差异（不是精简，是纠正分类错误）：
#   · 女角从 70 字段 × 20 位（1400 个变量位）→ 9 字段 × 20 位 → 180
#     删掉的：外貌与性征 23 个（静态人设 → 移入角色条目）
#             属性技能副本 19 个（与 主角 / 技能 完全重复）
#             中间态 8 个（静态设定或纯记账）
#             互斥锁定 5 个（事实已在 剧情.互斥触发）
#             H经验次数（用次数当门槛是黑箱）
#   · 主角生存从 6 个变量（体力/疲劳/睡眠质量/饥饿/口渴/清洁）→ 1 个「身体状态」
#   · 义理属性从 24 维（6属性+6性格+12技能）→ 3 维（说话/做事/懂东西）
#   · 经济从两套账本 → 一套
#   · 每个状态在 `状态表.yaml` 里都写了「意义」，答不出的不许存在
# ════════════════════════════════════════════════════════════

# ─── 时间（5）───
时间:
  当前日期: '12-22'
  天数: 1
  时段: '早'
  章节: '寒假前奏'
  天气: '晴'

# ─── 场景（3）───
场景:
  当前地点: '自宅'
  当前女角: ''
  场景模式: '休息'

# ─── 主角（7）───
主角:
  $骰子种子: 20260915     # LCG 伪随机种子，AI 不可见，由判定引擎读写
  身体状态: 80
  心情: 70
  说话: 40
  做事: 40
  懂东西: 40
  不可逆损伤: {}          # 她造成的、无法挽回的损失

# ─── 当前女角的即时状态（5，只存这一份，不 20 位各存一份）───
当前女角状态:
  当前衣着: ''
  暴露程度: ''
  湿润度: 0
  兴奋度: 0
  精液残留: ''

# ─── 经济（3）───
经济:
  现金: 5000
  累计储蓄: 0
  当日盈亏: 0

# ─── 过程（7）───
过程:
  时段楼层数: 0
  当前难度: '普通'
  死结局标识: ''
  连续无收入天数: 0
  超自然妄想计数: 0
  世界的裂缝: 0          # 她开挂（L3 手段）的累计痕迹；不惩罚她，是他在恶化
  她用过的手段: {}        # 记录她每次开挂改了什么，供他在离线态自己发现

# ─── 剧情 flag（16）───
剧情:
  日记收集数: 0
  美纪线进度: 0
  樱子线解锁: false
  樱子死讯: false
  医院访问次数: 0
  变数屋访问次数: 0
  变数屋全解锁: false
  阴谋偷听: false
  西寺解决进度: 0
  西寺债务陷阱: false
  泉美H完成: false
  友美误会解决: false
  毕业生外传完成: false
  洋子短发完成: false
  互斥触发:
    友美泉: false        # ★ 原作明写「不能同时做友美和泉的男朋友」
    鸣泽母女: false      # 美佐子 ↔ 唯
    永岛母女: false      # 佐知子 ↔ 久美子（女儿想走，母亲守着旅馆）

