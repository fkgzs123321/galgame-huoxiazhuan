# F3 在场名单查询
# ════════════════════════════════════════════════════════════
在场名单:
  查询键: '(日期, 时段, 地点)'
  输出: '该地点此刻有谁'
  索引来源: '人物出现总表'
  ⚠️_待重做: |
    原卡的 `人物出现总表`（EJS预处理/寒假日程调度器/人物出现总表.txt）只有 **7 个 region**，
    而本底座有 **8 个区域 / 30 个地点** → **必须按新的地点结构重做**。
    重做时要保留原卡的三个好设计：
      ① DEFAULT_SCHEDULE（时段 × 地点的默认在场模式）
      ② DATE_OVERRIDES（按天数的覆盖与锁定）
      ③ WEEKDAY_OFFS（周间休假规则）

