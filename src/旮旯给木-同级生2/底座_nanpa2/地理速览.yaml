# ════════════════════════════════════════════════════════════
# 底座_nanpa2 · 地理速览
# ════════════════════════════════════════════════════════════
# 双重身份：
#   ① 世界书条目（地理类型的索引，给 AI 读）
#      —— 依据 skills `contents-creation/worldbuilding/geography.md`：
#        「当区域数量超过 5 个且有大量单独的场景条目，可以考虑编写地理速览，
#          列出区域名称、地点/场景、势力/组织的名称」
#        本底座 8 个区域 / 33 个地点 → **必须写**
#   ② T1 地图机制数据（给引擎读）—— 距离 / 开放时段 / 在场名单查询
#
# ⚠️ 本底座不设 faction（势力）part —— 同级生2 没有势力对抗。
# ⚠️ 内容只取原作。原作没有的一律不做。
#     注：「88 海岸」曾被我误判为原作没有而删除，后经攻略原文恢复
#     （「12月29日以后的傍晚，在 88 海岸看到友美哭」）—— **此条不要再删**。
#     判「原作没有」之前必须搜全，不能凭一轮搜索下结论。
# ════════════════════════════════════════════════════════════

meta:
  地点总数: 33
  区域数: 8
  基准点: 自宅（距离 0）

# ════════════════════════════════════════════════════════════
# 距离的定义（F1 时间消耗）
# ════════════════════════════════════════════════════════════
距离定义:
  0: '同一次出行内（如同一栋建筑的不同房间），不额外消耗'
  1: '同区域内移动'
  2: '跨区域移动'
  3: '远距离（跨町 / 温泉乡）'
  扣减对象: '时间.时段进度'
  说明: |
    移动消耗时间，但**不直接跳过一个时段** —— 而是累积「这个时段已经用掉多少」。
    一个时段内能覆盖的距离总量有限，超了就必须推进到下一时段。
    这就是「她一天只有 5 个时段」这句话的机制含义。

