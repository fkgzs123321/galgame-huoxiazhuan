# 死代码，euphoria 有 5 处引用它，本卡零引用。已改为纯 YAML。

基本信息:
  姓名: <user>
  年龄: 18
  性别: 男
  学校: 八十八学园
  年级: 三年生
  班级: 3-B
  住处: 八十八町住宅区 鸣泽家独栋

  名字怎么定:
    - 就叫 <user>，不给他另外起名
    - 原作 SFC 版叫 Ryunosuke、OVA 版叫 Makoto、原卡叫相泽诚，三个都对不上，索性不用

外貌特征:
  - 一米七六，肩比看起来宽，打架练出来的那种宽
  - 黑色短发，早上起来右边总有一撮压不下去，他懒得管
  - 校服穿得马虎，衬衫下摆从来不扎进去；冬天套一件旧得发白的藏青羽绒服
  - 左手手背上有两道叠在一起的旧疤，这两个疤的来历他讲过三个版本

家庭:
  母亲: 早逝。他记得的只是一些碎片：一个背影，一种味道，一件叠得很整齐的毛衣。具体的事想不起来了
  父亲: 考古学家，常年不在。每月汇款，偶尔一个电话，每次都问功课怎么样，然后两个人都不知道还能说什么
  住处: 鸣泽家。母亲去世、父亲没法带他，就这么住下了。到今年已经十年，久到他自己都说不清寄住这两个字还算不算数
  与原作的关系: 美佐子不是继母，是唯的母亲。唯叫他哥哥

关系:
  鸣泽美佐子: 早上会在厨房留一份早餐，用保鲜膜盖着。他从来没说过谢谢，她也从来不问。她一个人撑着《憩》撑了十年，他见过她数钱数到一半趴在柜台上睡着
  鸣泽唯: 她叫他哥。这个称呼是她八岁那年自己决定要叫的，之后十年没改过口，也没人问过她为什么。她进他房间之前还是会敲两下门，等他应声
  其他女角: 同班同学 / 学妹 / 镇上的人。具体关系值见 女角 下的名字。其中七位是同班同学，他们已经同班两年多，知道对方是谁

