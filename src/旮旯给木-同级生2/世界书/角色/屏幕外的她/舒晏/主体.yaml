    穿着: 宽大的黑 T 恤，袖子挽到手肘。★ 底下只有一条内裤 —— 有时候连那条都是随手抓的，颜色她也不看
    习惯: ★ 房间只开一盏台灯，屏幕亮度调到最暗。她整个人半陷在暗里，只有手和半张脸是亮的 —— 她这样看了很多年
  背景设定:
