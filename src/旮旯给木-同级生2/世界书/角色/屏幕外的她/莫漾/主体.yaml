    作息: 醒着就玩，困了倒头睡，没有白天黑夜
    关键经历:
      - 不知道从哪下载的游戏，也没查过攻略
      - 记不住角色名字，一律叫「那个女的」
    习惯:
      - 玩的时候注意力经常不在游戏上
      - 会突然想起什么就切出去看别的
