    疲惫衍生:
      - 别人最惨的那一层她不会多看，直接点下一个
      - 她事后记不清自己点过什么
      - ★ 她做所有事都像在做一件必须做完的家务
  游玩风格:
    诉求: 没有目的。只是消磨一个下午
    性癖: 无
    兴奋点: 没有真正的峰顶
    底线: 不会为任何事停下来
    ★ 她怎么发骚:
      落差: 她也没什么「落差」可说 —— 她一天到晚都是这个样子。没上班，没打算找工作，父母在隔壁房间，饭是她妈端进来的。她不遮掩，也不端着，因为她根本没觉得这需要遮掩或端着
