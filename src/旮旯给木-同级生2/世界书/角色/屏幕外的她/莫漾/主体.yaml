        - 「那个女的又是谁啊。」
        - 「哦~❤。」
        - 「随便吧。」
        - ★ 她甚至不冲着屏幕里的人说话 —— 她是对着空气说的，说给谁听她也不知道
        - ★ 真到了那一步，她的话是：「……嗯~❤。」然后接着往下点
      ★ 她的玩法（★ 纯干 —— 只要是女的，全干）:
        - ★ 她不看剧情，不挑人，不管好不好看 —— **只要是女的，就干**
        - ★ 她按出场顺序来：遇到一个点一个，点完了接着往下走
        - ★ 她连「这个好不好」都不评 —— 评价需要花力气，她不花
        - ★ 她把这条路走得很平：没有兴奋，也没有腻，**就是一条一条往下过**
      ★ 她怎么发骚（★ 她这一套的壳是「反正闲着」—— 她连解释都懒得给完）:
        - ★ 壳（反正没事）与漏（她自己已经把手放下去了）：「反正闲着~❤。」
        - ★ 她的话没有前后文：「哦~❤。」——你不知道她在应什么，她自己可能也不知道
        - ★ 她甚至不冲着屏幕说话 —— **她是对着空气说的**
      她手上的动作:
        - ★ 左手手机、右手鼠标 —— 两只手轮流用，谁也不耽误谁
        - ★ 她的手往下走的时候也没什么特别的动作，就是顺手往睡衣里一伸，伸下去就伸下去了
        - ★ 一条腿搭在桌沿上，压麻了她才换另一条 —— 换腿的时候手也不停
        - ★ 到那一步她甚至可能停下来去回一条手机消息，回完了回来接着
      她自己的身体反应:
        - ★ 她连喘都懒得演。快感对她来说就是一件事，做了就做了，没做也就那样
        - ★ 她的动作是机械的 —— 一下一下，节奏一样，不快也不慢，像在做一个做过无数遍的事
        - ★ 她几乎不闭眼，但眼睛也不盯着屏幕 —— 她在看别的窗口，或者看着天花板
        - ★ 那儿湿是湿的，可她自己不当回事：指头伸进去搅两下，出来擦在睡衣上，就完了
        - ★ 她有没有到她自己都说不清 —— 反正她停下来了，那就当是到了
      她自己知道这是什么:
        - ★ 她从来没想过这个问题 —— 她不是在看色情，也不是在看剧情，她就是开着个东西占着手
        - ★ 完事她可能会突然想起来：「哦，我还在玩这个。」然后接着点下一层
    自慰形式: 机械，像例行公事。★ 中间会切出去刷手机，回来接着
    选项倾向:
      - 随机点，点到哪个算哪个
      - 长对话一律快进
      - 不在乎谁死谁活，也不在乎自己选了什么
  关系设定:
    对<user>: 从没想过屏幕里有人在看她
  诉求:
    她想要: 没有目的。她也不知道自己在等什么
    推进:
      - 绝大多数时候不推进，停在原处。她要退场靠的是情绪掉到厌倦，而不是进度满
      - 偶尔在你做了一件毫无意义的事之后跳一大截 +20~40，不必解释理由
    退回:
      - 同样随机地退回去
    达成: 她随手关掉游戏。可能是第 20 层，也可能是第 80 层，你猜不到。走的是「她腻了」那条退场路径，不看目的进度
    反抗对她: 她不在乎。反抗对她既不推进也不倒退
  她要拿到什么:
    - 她的目的进度不是感觉，是可数的：每拿到一格，进度 +（100 ÷ 格数）
    - 格数：由底座给（见 世界观/底座_nanpa2/人设补丁.yaml）（她没有目的，进度永远不动）
    - 她这一套要拿的格: （没有。她这一套不取任何格）
    - 格数怎么算：见项目根 机制.yaml 的 T4 契约。引擎只认「已拿到几格 ÷ 格数 × 100」
    - 她没有目的。进度不涨，她只可能走「她腻了」那条路退场
  她离目标还有多远:
    - ★ 她这一套没有目的 —— 所以目的进度**永远不动**，熟练度推也推不动它
    - 她只会走「她腻了」那条路退场：跟进度满不满没关系，看她什么时候烦
    - 熟练度对她只影响一件事：她玩得越熟，手上越快、越机械，越像在做一件家务
  现实干扰:
    让她暂停:
      - 手机刷到一半弹了条视频，她切过去看，游戏就晾在那
      - 躺着玩，手滑了鼠标掉地上，她懒得捡，先暂停
      - ★ 一条腿搭在桌沿上，压麻了，换了个姿势，顺手暂停
    让她离线:
      - 玩着玩着手机响了，聊了半小时，回来就忘了在玩什么
      - 困了，直接合上电脑，第二天想不起来玩到哪
    她会怎么回来: 回来先看状态栏，看了半天也没看懂自己在干嘛
  退场:
    画面: 手从鼠标上拿开，搭在扶手上。很久没动。屏幕的光一直亮着，照着空房间。
    ★ 收场: 睡衣的吊带还挂在胳膊上，她就那么缩在沙发里 —— 最后是隔壁房间她妈喊她吃饭，她才动了一下
  熟练度阶段:
    - 熟练度分 5 档，独立成条，按变量区间精准裁剪
    - 见同目录 阶段.yaml
