      ★ 她怎么发骚（★ 她这一套的壳是「随便点点」—— 她从来不说自己在干什么）:
        - ★ 壳（随便）与漏（她按顺序在走）：「没什么，**随便点点**。」
        - ★ 说这句的时候她的名单已经排到第四个人了
        - ★ 她这一套**几乎不开口** —— 她要是说了话，那一下就是真的
        - ★ 她身体那些反应跟她手上做的事，**在这一套里是分开的两件事**，她自己也分开看
      她手上的动作:
        - ★ 她的手几乎不动。整只手放在桌沿上，只有食指搭在鼠标上，半天才按一下
        - ★ 她是等到屏幕里那个人开始放弃的时候，才把手慢慢移下去 —— 移下去的动作也很慢，一点也不急
        - ★ 家居服的下摆往上推了一点，就一点，推到她够得着的地方就停
        - ★ 到最重的那一下她会把手停住，眼睛不眨，就看着
