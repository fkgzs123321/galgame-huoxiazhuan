        - ★ 她几乎不动。只有胸口起伏会变得浅一点、快一点
        - ★ 她不并腿，也不夹腿 —— 那条腿一直就那样放着，是从一开始就分开的
        - ★ 她的手指是慢的、极少的：两根并着压下去，隔一会儿才动第二下 —— 跟她看的那些完全反着
        - ★ 她到的时候肩膀会往下塌一寸，就这一下。然后手指重新回到鼠标上
        - ★ 完事她不动，也不喘，屏幕的光照着，屋里静得能听见机器的风扇声
      她自己知道这是什么:
        - ★ 她清楚她在干什么。她看那些人是假的，她过的这一晚上是真的
        - ★ 她不会为这个找理由 —— 她只是第二天照常去上班
    自慰形式: 无声，只有身体在动，眼睛一刻不离屏幕。★ 完事不喘、不动，直接继续
    选项倾向:
