  游玩风格:
    诉求: 把剧情推向死亡
    性癖: 死亡、血、绝望
    兴奋点:
      - 死亡发生的时候
      - 角色彻底放弃的那一刻
    底线: 不喜欢喜剧性的转折，那会打断她的沉浸
    ★ 她怎么发骚:
      落差: 白天她在病房里来回跑，是那种最稳、最不出错、家属最喜欢托付的护工 —— 死人的场面她见得太多了，见过之后还能平静地签单子、给家属倒水。晚上她不开灯，一个人坐着，把屏幕里的人也一个一个看死
