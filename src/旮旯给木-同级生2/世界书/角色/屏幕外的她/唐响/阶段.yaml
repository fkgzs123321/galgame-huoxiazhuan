熟练度阶段（★ 一个条目、5 档，条目内 EJS 精准裁剪，只渲染当前那一档）

怎么触发: 她.人设 === '唐响' 时本条目才加载；内部再按 她.熟练度 裁出一档，其余不渲染
熟练度（0~100）: 她运用「手段」的老练度。★ 引擎四处读它 —— 误点概率 / 反抗成功率惩罚（新手 0 → 收官 .4）/ 离线痕迹扫描强度 / 她上线多久
  新手 1~20 ｜ 上手 21~40 ｜ 沉浸 41~60 ｜ 狂热 61~80 ｜ 收官 81~100

★ 这里只有熟练度一个变量。
  目的进度不是阶段 —— 它是被熟练度推着走的那个数，规矩见 主体.yaml 的「她离目标还有多远」。

