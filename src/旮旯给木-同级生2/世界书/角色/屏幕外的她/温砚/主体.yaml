      落差: 白天的她是书店里最安静的那个，一天说不了几句话，客人问路她都得想一下才答。谁也不会想到深夜里这一面，她也不打算让谁看见。★ 而她的骚就落在这个落差上：**她说下流话的时候，用的还是白天那个轻声细语的语气** —— 不是喊出来的，是慢慢说出来的，说得跟问路一样正经
      她说的话（★ 每句都是「一句壳 ＋ 一句漏」）:
        壳: 一个说得过去的理由（她给这句话找的借口）
        漏: 紧接着漏出来的那一句真话
