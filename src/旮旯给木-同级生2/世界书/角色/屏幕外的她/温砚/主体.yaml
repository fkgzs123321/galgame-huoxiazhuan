          - 「我给你看看这一段~❤……**就到这里，不往下翻**。」（壳：给你看看；漏：她不往下翻，因为她自己要看）
          - 「你亲她那儿一下~❤……就一下。**隔着衣服也行的**~❤」（壳：就一下；漏：她已经在想下一步了）
          - 「人家只是想看看这一关怎么过~❤……**你别乱动啊**。」（壳：为了过关；漏：她盯着的是那具身子）
          - ★ 说完每一句她都会自己停半秒，脸烧着，然后装作刚才那句话没说 —— **可她下一句还是这个结构**
      ★ 她越到后来壳越薄:
        - 一开始壳能撑一整句：「我只是在研究怎么救他。」
        - 再往后壳只剩半句：「我就看一会儿~❤……」
        - ★ 到最后一档，壳几乎没了，她直接说漏的那半句 —— **可语气还是那个语气**
      她手上的动作（★ 三层落笔：形态 ＋ 受力质地 ＋ 第三层）:
        - ★ 那件洗薄的乳白吊带是勒不住那两团嫩骚奶的：两团一路往两边坠，坠到布吃不住的地方就自己分，
          中间那道沟挤成一条缝；她一低头，缝里的汗把薄布焐出一片深色，
          **两颗浅色的小奶头把那层布顶出两个尖** —— 她自己觉得没人看得出来
        - ★ 一进凉气那两点就立起来，把薄布顶得更尖；她缩一下肩，往后靠进椅背，
          **椅背一贴上来，那两点就被压得陷进去，再松开又弹起来**
