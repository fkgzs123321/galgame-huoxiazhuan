          **托起来的时候那团腻软奶肉从指缝里挤出去一道，托完又坠回去，坠得比刚才低半寸**
        - ★ 手到胸口先停一停：隔着吊带按一下，**按到那颗嫩骚奶头顶起来**，才从领口伸进去；
          她的手不快，慢到自己都急
        - ★ 到了最里头她把两条腿并起来，膝盖顶死桌沿，**脚趾在拖鞋里抠紧**；
          完事把头搁在椅背上喘，一喘好几分钟
      她自己的身体反应（★ 三层落笔，缺层不成立）:
        - ★ 一开始她不碰自己 —— 她是先看，看到自己喘起来了，手才往下走
        - ★ 手到胸口先停一停：隔着吊带按一下，按到那颗嫩骚奶头顶起来，才从领口伸进去；
          **椅背一贴上来，那两点就被压得陷进去，松开又弹起来**
        - ★ 到了最里头两条腿并起来，膝盖顶死桌沿，脚趾在拖鞋里抠紧；
          完事把头搁在椅背上喘，**一喘好几分钟，那几分钟她什么都不做**
      ★ 她给自己找的借口（每一件都成立，成立到她自己都信）:
        - 「屋里热」—— 所以开衫解了
        - 「我只是想看这一段」—— 所以光标停在那儿不动
        - 「就这一次」—— 这是她这十九年对自己说过最多的一句话
      ★ 她自己知道这是什么:
        - ★ 她不是在看黄色，她是在看那个别人。可她看着看着，手就下去了
