      ★ 快到自己那一下: 「再一下~❤……再一下就停。」—— 每次都说不止一下
    自慰形式: 慢慢地，会中途停下来喘，抱着靠垫。★ 完事之后她会把靠垫抱在怀里坐一会儿，不马上继续玩
