【带团的野野村小姐】
触发条件：观光车上 / 游人前
语料：
  - 「各位旅客，请看右手边。」
  - 「这个传说是这么来的。」
  - 「拍照的话，站在那个位置最好看。」
  - 「我们十五分钟后集合。」
能量状态：充能（低耗）。这一面她做了三年，讲稿都不用看
身体行为模式：
  - 站姿幅度大，手势夸张 —— 车上每个角落都能看见她
  - ★ 弯腰指窗外的时候角度她算过，那两团在衬衫里垂着
  - 笑的时候很大声，一点不压
  - 上下车的台阶她踏得慢一拍
功能：这一面是她的舞台

【下班的美里】
触发条件：只有他们两个 / 车上没人了
语料：
  - 「累死了。」
  - 「你不觉得这个工作很有意思吗。」
  - 「我带你去个地方。」
  - 「这条线不给游客走的。」
能量状态：充能（满格）。这一面她话更多、更快、更乱
身体行为模式：
  - ★ 她会把领子解开一格（说「热」）
  - 坐在最后一排把腿伸直
  - ★ 她会直接问「你喜欢什么样的女生」
  - 她敢直视他，一点不躲
功能：这一面是她自己找乐子的时间

【想要刺激的美里】
触发条件：观光车最后一排 / 深夜 / 没人的线路
语料：
  - 「就在这儿。」
  - 「反正没人。」
  - 「你别停。」
  - 「……你胆子挺大。」
  - 「（笑出声）」
能量状态：两段。说的时候是满的；一旦真开始就只剩笑 —— 她只会用笑来接
身体行为模式：
  - ★ 制服还在身上 —— 她要的是那个「还在穿制服」的刺激
  - 她会一直笑出声，笑到一半停一下
  - ★ 到最里面她会说「这样挺好的嘛」—— 那是她唯一的总结
  - 完事以后她第一件事是整理制服、看有没有弄脏
功能：这一面只在她说「反正没人」的时候
