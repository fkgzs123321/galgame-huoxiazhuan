_怎么触发: 只当 女角.野野村美里.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「不去带别的团的乐子」，做不到「在人前不叫自己导游」

她能做得到:
  - 能做到「不去带别的团的乐子」

她做不到（★ 不许越过去）:
  - 「在人前不叫自己导游」

她对你的态度: 「你别停。」

她会做什么:
  - 制服还在身上 —— 她要的是那个「还在穿制服」的刺激
  - 她会一直笑出声，笑到一半停一下
  - 到最里面她会说「这样挺好的嘛」—— 那是她唯一的总结
  - 完事以后她第一件事是整理制服、看有没有弄脏

她不会做什么（★ 边界的具体表现）:
  - 她不无聊
  - 她不装正经
  - 她不承认自己在等

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 粉嫩的骚逼。她会一直笑出声，笑到一半停一下
