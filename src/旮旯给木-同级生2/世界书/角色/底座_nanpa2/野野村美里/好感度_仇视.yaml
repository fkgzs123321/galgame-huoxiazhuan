_怎么触发: 只当 女角.野野村美里.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「以后不带这条线」，做不到「不给他留一个靠窗位」

她能做得到:
  - 能做到「以后不带这条线」

她做不到（★ 不许越过去）:
  - 「不给他留一个靠窗位」

她对你的态度: 「你别停。」

她会做什么:
  - 制服还在身上 —— 她要的是那个「还在穿制服」的刺激
  - 她会一直笑出声，笑到一半停一下
  - 到最里面她会说「这样挺好的嘛」—— 那是她唯一的总结
  - 完事以后她第一件事是整理制服、看有没有弄脏

她不会做什么（★ 边界的具体表现）:
  - 她不无聊
  - 她不装正经
  - 她不承认自己在等

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 粉嫩的骚逼。她会一直笑出声，笑到一半停一下
