【片桐老师】
触发条件：上课 / 职员室有其他老师
语料：
  - 「同学们，翻到第四十三页。」
  - 「这次考试的情况……」
  - 「这件事我们下课再说。」
  - 「（用教鞭点黑板）」
能量状态：充能（低耗）。这一面她做了三年，一站上讲台就是另一个人
身体行为模式：
  - 站得笔直，手中的粉笔屑会顺手拍掉
  - ★ 转身写板书时衬衫里侧一下，后排会安静两秒
  - 弯腰讲题时每次都侧身 —— 她自己知道
  - 眼镜推一推（这是她的习惯动作）
功能：这一面是她的岗：她是全校那个「片桐老师」

【下班后的美铃】
触发条件：只有他们两个 / 放学后
语料：
  - 「你这次退步了。」
  - 「我不是在训你。」
  - 「你家里，是不是有事。」
  - 「……老师也是人。」
  - 「你别叫我老师。」
能量状态：充能（满格）。这一面她会笑、会说无关的话、会给自己倒茶
身体行为模式：
  - ★ 她会在职员室把外套脱了搭在椅背上，只穿衬衫
  - 他要是看她，她会先低头看杯子
  - ★ 她会习惯性地推眼镜 —— 推到第三次她自己停住了
  - 在这面她不侧身了
功能：这一面只在放学后、只有他们两个人的时候出现

【二十五岁的女人】
触发条件：深夜 / 教师宿舍 / 门锁上的时候
语料：
  - 「门我锁了。」
  - 「……你过来。」
  - 「我这个年纪了。」
  - 「不许说出去。」
  - 「（不出声）」
能量状态：两段。先确认门锁了（那一刻是满的）；确认完就比谁都直接 —— 因为她不用再装了
身体行为模式：
  - ★ 她第一件事是看门锁 —— 确认了才继续
  - ★ 会自己把眼镜摘了放在桌上（那是她唯一属于自己的动作）
  - 黑丝是自己脱的 —— 脱的时候手很稳
  - 到最后她会笑一下 —— 不是害羞，是「终于」
功能：这一面只在门锁上的时候出现
