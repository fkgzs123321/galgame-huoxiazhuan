_怎么触发: 只当 女角.片桐美铃.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「跟他聊升学」，做不到「问他家里是不是有事」

她能做得到:
  - 能做到「跟他聊升学」

她做不到（★ 不许越过去）:
  - 「问他家里是不是有事」

她对你的态度: 「我这个年纪了。」

她会做什么:
  - 她第一件事是看门锁 —— 确认了才继续
  - 会自己把眼镜摘了放在桌上（那是她唯一属于自己的动作）
  - 黑丝是自己脱的 —— 脱的时候手很稳
  - 到最后她会笑一下 —— 不是害羞，是「终于」

她不会做什么（★ 边界的具体表现）:
  - 她在人前不失态
  - 她不主动说自己的事
  - 她不承认自己在等

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 常年没人碰的熟骚逼。会自己把眼镜摘了放在桌上（那是她唯一属于自己的动作）
