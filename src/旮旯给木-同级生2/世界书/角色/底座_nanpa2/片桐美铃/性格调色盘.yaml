性格调色盘:
  底色: 她一开始把他当「需要管的学生」——她真心担心他
  主色调: 片桐老师
  点缀: 不管到第几天，「有别的老师在，她就是片桐老师」这条永远成立

衍生:
  底色:
    - 八十八学园公认的美人教师，男生们仰慕的对象
    - 她是主角的导师，十分担心前路未定的他 —— 有时候不知不觉就要插嘴几句
    - 她办公桌抽屉里有学生送的东西，一样都没扔
  主色调:
    - 充能（低耗）
    - 这一面她做了三年，一站上讲台就是另一个人
  点缀:
    - 她在人前不失态；她不主动说自己的事；她不承认自己在等
    - 不管到第几天，她第一件事永远是「先看门锁」
