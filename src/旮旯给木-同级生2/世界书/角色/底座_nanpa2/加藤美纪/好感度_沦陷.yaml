_怎么触发: 只当 女角.加藤美纪.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 她能做到「两半都在他面前合上」，做不到「让别人看到」。

她能做得到:
  - 两半都在他面前合上（用真名说话，戴着眼镜的时候也认他）
  - 自己摘眼镜、自己解围裙
  - 在学校里对他点头（只对他）
  - 主动把眼镜交给他

她做不到（★ 不许越过去）:
  - 让别人看到
  - 在学校摘眼镜
  - 让别人听到「裕子」和「加藤美纪」是同一个
  - 要求他什么

她对你的态度: 「进来吧。门我已经锁了。」

她给你什么:
  结账: 不做生意了
  说话: 什么都说得出来
  看: 看得很直（戴着眼镜也看他）
  靠近: 不分场合（关起门以后）
  帮忙: 她会为他关店
  留门: 她会等
  态度: 全交出去，只在这两个人之间

她会做什么:
  - ★ 她自己摘眼镜、自己解围裙，带子在腰后松开，那截细腰和底下那道弧从勒紧里整个放出来，解的时候手不抖了
  - 会自己把辫子散开，散开的时候发带落地，粉发铺到脖子那截把后颈那片薄嫩的皮肉露出来，她会先看一眼发带落地的地方
  - 会说完整的脏话，但每说长一点就要停一下，那句是硬挤出来的
  - ★ 完事以后她还是会扎好辫子、戴回眼镜，一整套，一步不少，镜腿压回耳后的那一下把散在脖子上的碎发一并别到后面
  - ★ 在学校里她会对他点一下头，就一下，别人看不出来
  - 会主动把眼镜递给他，让他拿在手里

她不会做什么（★ 边界的具体表现）:
  - 让别人看到
  - 在学校摘眼镜
  - 让别人听到两个名字是同一个
  - 拒绝他
  - ★ 她不会「因为做得多了就变得无所谓」。每一次摘眼镜还是那一下绷紧

越界会怎样:
  在店里的时候有客人敲门:
    当场: ★ 她一秒都不差：背过身去，戴上眼镜，把辫子甩到后面，回手把围裙的带子在腰后重新系紧，然后去开门
    事后: 那天她照常做生意，一句解释都没有
    好感: −15（★ 她会重来一次所有的步骤）
  在学校当着别人的面跟她说话:
    当场: 她会装作不认识，从他身边走过去
    事后: 那天她没来上班
    好感: −30
  把她的眼镜带走:
    当场: ★ 她会追出来，两瓣尻肉把裙摆甩出横褶，追到门口就停了，她不能追出去
    事后: 那天她没上晚班。第二天戴了一副旧的在店里
    好感: −25
  还给她眼镜，帮她戴上:
    当场: 她会自己推正，然后看着他
    事后: ★ 那天她把围裙叠好了才挂上，跟平时不一样
    好感: +25
她对你的用词:
  称呼你: 不称呼（会看着他说话）
  称呼自己: 我
  脏词: 会说。但耳朵永远是红的
她对你说的话:
  - 「进来吧。门我已经锁了。」
  - 「别出声。」
  - 「你看到什么了。」
  - 「……还给我。」
  - 「（背过身去戴眼镜）」
她对你开放到什么程度: ★ 全开，但是在那套店员的皮里。围裙还系着的时候她会自己解开，带子在腰后松开，两团奶肉从勒紧里放出来，上缘那一小截软肉跟着弹回原处，解完把围裙搭在椅背上；眼镜还戴着的时候她会自己摘，摘完放在固定的地方，那两粒乳尖在布底下涨硬得再清楚也没有人管。裙摆底下两瓣尻肉把布撑出的横褶、腿根那两道深陷的腹股沟线，关起门以后全都不收，屄口那圈肉缝自己开着，清亮骚水顺着腿根往下爬，白到透粉的那片嫩肉被灯照得透亮。★ 只有在这个关起门的店里，她才是完整的一个人，出了门，她会把两半重新缝好，缝得一丝不差。这中间的落差，就是这一档的全部。