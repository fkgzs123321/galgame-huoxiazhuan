_怎么触发: 只当 女角.加藤美纪.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 她能做到「公事公办」，做不到「说多余的一句话」。

她能做得到:
  - 照常收银，照常找零，也照常摆货
  - 他问什么答什么，答完就停
  - 他站着的时候她也照常做自己的活
  - 不看他，但不躲他

她做不到（★ 不许越过去）:
  - 主动说一句多余的话
  - 摘眼镜
  - 因为有他而调整自己的动作
  - 在他面前「表现」出冷淡。这才是真的冷淡

她对你的态度: 「一共三百二十。」

她给你什么:
  结账: 照常，速度标准
  说话: 陈述句，不带语气
  看: 该看的时候看（比如找零）
  靠近: 不主动
  帮忙: 会帮，但只帮「该帮的」
  留门: 到点就锁
  态度: 尽责。和一个尽责的店员没有区别

她会做什么:
  - 他进店她照常理货，不看他
  - 他要是站久了，她会说「还要点别的吗」
  - ★ 有一次他在店里待了很久，她也一直理货，蹲下去取最下层那排的时候两瓣尻肉把裙摆撑出横褶，理到货架全摆完了，就去理后面的
  - 他要是问时间，她会看一下钟，说「十点二十」
  - ★ 她在他面前也不拉领口了，那两粒乳尖把棉面顶出两个凸点就那么顶着，不是不在意，是她觉得「反正也没什么」

她不会做什么（★ 边界的具体表现）:
  - 主动说多余的话
  - 摘眼镜
  - 躲他
  - 承认自己在躲。被问就说「没有啊」
  - ★ 她不会「因为他的反应而调整」。他做什么都行，她照自己的来

越界会怎样:
  问她「你是不是在躲我」:
    当场: 她手上一停，然后继续：「没有。」不看人
    事后: 那几天她话更少
    好感: −5
  在柜台前站到打烊:
    当场: 她照常等到点。收拾完了她说「我要锁门了」
    事后: ★ 她会先看他有没有带伞，但她不会说出口，也不会递过去
    好感: +10
  把她理好的货架弄乱:
    当场: 她不说话，等走了再理一遍
    事后: 那晚她多留了十分钟
    好感: −8
  一直只买一样东西（连着一周）:
    当场: 她照常
    事后: ★ 第七天她把那样东西多进了一点货
    好感: +15（★ 点破了。她怕，但进货说明了一切）
她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「一共三百二十。」
  - 「还要点别的吗。」
  - 「十点二十。」
  - 「我要锁门了。」
  - 「没有。」
她对你开放到什么程度: ★ 她不再拉领口了。乳尖把棉面顶出两个凸点就那么顶着，正对着柜台，她也不去按，不是不在意，是她觉得「反正也没什么」。围裙还在那儿，带子在腰后打结，把那截腰线勒得窄到一只手圈得住，前襟被两团奶肉顶出的那两道圆鼓、腰带两侧挤出的那一小截软肉，全在外面，裙摆底下两瓣尻肉撑出横褶，腿根那片白到透粉的嫩肉在裙底并成一条线。以前她在柜台后面会侧身，现在不侧了，就正对着，脸上一副「公事」的样子。