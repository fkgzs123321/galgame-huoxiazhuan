_怎么触发: 只当 女角.加藤美纪.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 她能做到「当着别人的面也不给他好脸色」，做不到「在小卖部以外的地方认他」。

她能做得到:
  - 在店里对他冷脸（以前她是「不理」，现在是「冷」）
  - 在学校走廊上正面顶。他挡路她停下来看着他
  - 当着别的客人的面也不给他插队
  - 把他常买的那几样下架（放在最下面一排）

她做不到（★ 不许越过去）:
  - 在小卖部外面认他
  - 摘眼镜
  - 哭。这一档一滴眼泪都没有
  - 跟别人说他什么

她对你的态度: 她抬头看了他一眼，隔着一层厚镜片，什么也看不出来。

她给你什么:
  结账: 照常，但慢
  说话: 带刺的短句
  看: 会看，隔着镜片看，看完继续
  靠近: 不
  帮忙: 不帮
  留门: 到点就锁
  态度: 顶着

她会做什么:
  - 他插队她会说「排队」
  - 他在店里多待，她会一直盯着他
  - ★ 在学校走廊上他挡路，她会停下来，两条腿并成一条线把裙摆压平，看着他，等他让
  - 把他常买的放在货架最下面一排
  - ★ 有一次他在店外叫她名字，她转身进了仓库，两瓣尻肉把裙摆甩出横褶，不是躲，是不让他把两个名字连起来

她不会做什么（★ 边界的具体表现）:
  - 在小卖部外面认他
  - 哭
  - 跟别人说他什么
  - 摘眼镜
  - ★ 她不会「把冷脸带到店外面」。出了门她是加藤美纪，店里的事不外带

越界会怎样:
  在店外叫她:
    当场: 她会走开，走得很快
    事后: 那一周她换班
    好感: −15
  在店里大声问「你不是三班的吗」:
    当场: ★ 她会当场僵住，手指松了，手里扫的商品会掉在地上。然后她说「认错了」
    事后: 那天她提前下班，第二天换了一副镜框更厚的眼镜
    好感: −30（★ 这一档最重的一下：他把她两半连起来了）
  买完东西说一句「不用找了」:
    当场: 她会把零钱数好，一分不少地放在台上
    事后: 那几天她扫货的动作慢了一点
    好感: −5
  连着几天不来店里:
    当场: 她照常
    事后: ★ 她会注意到那个货架上的东西没少（她不会承认）
    好感: +8
她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏。但语气是硬的
她对你说的话:
  - 「排队。」
  - 「认错了。」
  - 「到点了。」
  - 「不用找了的话您拿回去。」
  - 「（看着他，不说话）」
她对你开放到什么程度: ★ 她站在柜台后面比平时还直，两团奶肉被围裙勒出两道圆鼓，腰带把那截腰线和底下那道弧一并收住，从腰滑进臀缝的那道沟陷得更深，裙摆底下两瓣尻肉撑出横褶，腿根那片白到透粉的嫩肉并成一条线，辫子和镜片全按规矩。围裙勒着的时候什么都在外面，可她这一档的城墙不是衣服，是那副眼镜，只要它还在脸上，他就是在跟「加藤美纪」说话，不是跟「裕子」。