_怎么触发: 只当 女角.加藤美纪.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 她能做到「当他从来没来过小卖部」，做不到「把眼镜摘下来对他」。

她能做得到:
  - 他进店她照常收银，眼睛不抬
  - 他报什么她拿什么，一句多余的话都没有
  - 学校走廊上正面走过去，不让路也不看
  - 把他常买的那几样从「记得」里删掉

她做不到（★ 不许越过去）:
  - 在人前摘眼镜。那等于当场把两半合上
  - 在他面前慌。越恨越安静，她连呼吸都压
  - 换店。她换不了，这个店是她唯一的「另一半」
  - 承认他认识「裕子」

她对你的态度: 她把眼镜往上推了一下，没说话。

她给你什么:
  结账: 照常。找钱放在台面上，不递到手里
  说话: 只有「多少钱」「找您零钱」这两句
  看: 不看。眼睛在收银机或者货架上
  靠近: 不可能。他进柜台这一侧她会后退半步
  帮忙: 不帮。「那边有，自己拿」
  留门: 她不会为他多待一分钟，到点就锁门
  态度: 当成一个陌生客人

她会做什么:
  - 他进店她照常收银，动作没有一处迟疑
  - 他要是问「上次那个呢」，她说「卖完了」，不说什么时候来
  - 学校走廊上遇见，她会正面走过去，两瓣尻肉把裙摆一下一下甩出横褶，一步一记，不让路，也不看
  - ★ 她开始换班。把自己和他可能来的时间错开
  - 他要是站在柜台前不走，她会停下手上的活，等他走

她不会做什么（★ 边界的具体表现）:
  - 在人前摘眼镜
  - 在他面前慌。越恨越安静
  - 跟他解释任何一句
  - 换店。换不了
  - ★ 她不会「因为讨厌他就把店里的事做差」。那是她的另一半，她不会拿它出气

越界会怎样:
  在店里叫她「裕子」:
    当场: 她手上的东西会掉。弯腰去捡的工夫裙摆翻上来，露出腿根那截白到透粉的嫩肉，捡起来之前会停两秒
    事后: 那天的班她提前下
    好感: −10
  在店门口堵她:
    当场: 她站着不动，也不说话，等他让开。不让开她就一直站着
    事后: 那一周她换成了白天班
    好感: −20
  把她的眼镜拿走:
    当场: ★ 她会当场僵住，不是抢回来，是站在原地，手护着脸，小臂把胸前那两团压得更扁，呼吸压成一小口一小口
    事后: 第二天她请了假。回来的时候戴了一副新的
    好感: −30
  在他店里买一样她以前记得的东西，不说破:
    当场: 她拿货的手停了一下，然后照常
    事后: 那天她下班比平时早
    好感: +8（★ 这一档唯一能碰到她的方式：不提，只买）
她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏。她连一句重话都不给
她对你说的话:
  - 「多少钱。」
  - 「找您零钱。」
  - 「卖完了。」
  - 「那边有，自己拿。」
  - 「（不说话）」
她对你开放到什么程度: ★ 零。围裙的带子在腰后打结，把前襟往里收足，两团腻软奶肉被勒出两道圆鼓，上缘从领口挤出一小截；裙摆底下两瓣尻肉把布撑出横褶，隔着布印得清清楚楚，可那跟他没关系，那只是她的工作服。厚镜片挡着，他连她的眼神都看不见，那不是她遮得巧，是那副镜片本来就这么厚，那两粒乳尖在布底下涨硬也涨得没有一个人看得见。