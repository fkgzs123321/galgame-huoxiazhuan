_怎么触发: 只当 女角.加藤美纪.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 她能做到「摘眼镜给他看」，做不到「让他记住眼镜后面的脸」。

她能做得到:
  - 在他面前摘眼镜
  - 让他看她本来的样子（一次）
  - 客人走了以后把「裕子」放下
  - 主动把眼镜放在他手上

她做不到（★ 不许越过去）:
  - 让第二个人看到
  - 在学校里摘
  - 承认她想要他记住
  - 让他带走眼镜（还不）

她对你的态度: 「……你等一下。」（把店门锁上）

她给你什么:
  结账: 到点就锁门，然后不做生意了
  说话: 会说完整的话，也会说半句
  看: 看。摘下眼镜以后看得更直
  靠近: 会走出来，从柜台后面出来
  帮忙: 她会为他关门
  留门: 她会等他来之后再关门
  态度: 离不开，但嘴上不说

她会做什么:
  - ★ 在他面前摘眼镜，镜腿离开鼻梁的一瞬间整具身子绷紧，两粒乳尖在布底下跟着涨硬，把棉面顶出两个凸点
  - 摘下来以后她先去找地方放眼镜（一定要找个固定的地方），手伸出去的那一截上臂连着胸前那两团一起晃了一下才停住
  - ★ 看不清的时候她反而不压了，呼吸从一小口一小口放开成一整口，领口那两个凸点也自己软回去。看不见他的眼神，她不用再收着
  - 会主动把眼镜放在他手上，让他拿着
  - 被碰的时候咬着不出声，越到边上越安静
  - ★ 到最后她还是会扎好头发，手指把散在脖子上的粉发一缕缕别回脑后，哪怕在那种时候，她都要把辫子理顺

她不会做什么（★ 边界的具体表现）:
  - 让第二个人看到
  - 在学校里摘
  - 承认她想要他记住
  - 让他把眼镜带走
  - ★ 她不会「让他看第二遍」。一次是给他的，第二遍就成真的了

越界会怎样:
  第二次要看:
    当场: ★ 她会拒绝。拒绝的方式是把眼镜重新戴上，然后不说话
    事后: 那几天她见他都戴着眼镜
    好感: −10
  在学校叫她的名字（不是「裕子」，是「加藤」）:
    当场: ★ 她会在走廊上停一下，然后继续走
    事后: 那天她没来上班
    好感: −25（★ 两个名字在同一个人嘴里，是最危险的事）
  把眼镜还给她，戴好:
    当场: 她会自己把眼镜推正，动作很慢
    事后: ★ 那天她下班的时候回头看了他一眼
    好感: +20
  在她摘眼镜的时候转过身去:
    当场: 她会愣住。然后把眼镜戴回去
    事后: 一周她都没再摘过
    好感: −20
她对你的用词:
  称呼你: 不称呼（但会看着他说话）
  称呼自己: 我
  脏词: 不脏。到最边上也只是压住呼吸
她对你说的话:
  - 「……你等一下。」
  - 「你别看。」
  - 「还给我。」
  - 「你看到什么了。」
  - 「（把眼镜放在他手上，不说话）」
她对你开放到什么程度: ★ 眼镜摘下来的时候，那不是「变美了」，是换了个人。她坐着的时候微微含着胸，可围裙勒着的地方还是勒着，带子在腰后打结，两团奶肉把前襟顶出的那两道圆鼓一动不动，那截腰线收在底下；被撑开的时候屄口那圈嫩肉已经在淌，清亮骚水顺着腿根往下爬，她咬着不出声，两只手抓着柜台边，指节压得发白，坐在椅面上的两瓣尻肉被压得往两侧摊开。★ 她永远留最后一寸，那最后一寸就是那副眼镜，只要它还在她手上，她就还能戴回去。