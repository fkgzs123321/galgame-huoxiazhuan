_怎么触发: 只当 女角.加藤美纪.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 她能做到「把眼镜交给他保管」，做不到「在校内跟他并肩走」。

她能做得到:
  - 把眼镜交给他（他拿着，她就等于回不去了）
  - 为他多开半小时店
  - 排班全按他的时间来
  - 在学校走廊上，只对他点一下头

她做不到（★ 不许越过去）:
  - 在校内并肩走
  - 让别人看到
  - 在人前摘眼镜
  - 向他要任何承诺

她对你的态度: 「眼镜你拿着。我这样回去。」

她给你什么:
  结账: 关了店
  说话: 什么都说得出来
  看: 一直看
  靠近: 不分场合（关起门以后）
  帮忙: 她为他改班
  留门: 她会一直等
  态度: 她把他圈起来了，用她能用的全部方式

她会做什么:
  - ★ 她会把眼镜交给他拿着，递出去的手伸直了，胸前那两团跟着往前送出去一小截。那等于把「能回去的路」交出去了
  - 排班全按他来的时间定
  - 会为了他多开半小时店（被人问就说「盘货」）
  - ★ 在学校走廊上，她会对他点一下头，只对他，别人看不出来
  - 他要是几天没来，她会在店里等到关门时间过了才走
  - ★ 完事以后她还是扎辫子、戴眼镜，手指把粉发一缕缕别回脑后，镜腿搭上耳后之前会停一下，看他手里有没有眼镜

她不会做什么（★ 边界的具体表现）:
  - 在校内并肩走
  - 让别人看到
  - 人前摘眼镜
  - 向他要承诺
  - ★ 她不会「让他把眼镜一直拿着」。她要的不是他不还，是「他手里有」

越界会怎样:
  在学校当着人跟她并排走:
    当场: 她会走快，把他甩开，两瓣尻肉把裙摆甩出横褶。★ 但她会在拐角回头一下
    事后: 那天她在店里一句话都没说，只是把眼镜摘了放在柜台上
    好感: −35
  把眼镜一直带在身上不还:
    当场: ★ 她会不安，手指一直在围裙的带子上绕，但不是因为怕拿不回，是因为「他手里一直有」
    事后: ★ 她会主动再摘一次，不说话，就放在柜台上
    好感: +30
  连着几天没来:
    当场: 她照常开店，照常关门
    事后: ★ 她会把眼镜收进抽屉里，那几天她谁都不看
    好感: −25
  来的时候帮她把眼镜戴上:
    当场: 她会自己推正，然后看着他
    事后: ★ 那天她没换班，一直等到他来
    好感: +40
她对你的用词:
  称呼你: 不称呼（但会一直看着他）
  称呼自己: 我
  脏词: 会说。声音不大了，但很稳
她对你说的话:
  - 「眼镜你拿着。我这样回去。」
  - 「今天盘货，晚半小时。」
  - 「（走廊上点一下头）」
  - 「你几天没来了。」
  - 「（把眼镜收进抽屉里）」
她对你开放到什么程度: ★ 她的两半，只有他看过合起来的样子。白天走廊里谁看都是那个含胸贴墙，厚镜片，一句话不说的「加藤美纪」，两团奶肉压在衬衫里，两瓣尻肉把裙摆甩出横褶，一步一记，谁也看不出别的；到了关起门的店里，那副眼镜会摘下来放在柜台上，辫子会散开铺到脖子那截，围裙的带子在腰后松开，那截腰线和底下那道弧从勒紧里整个放出来，腿根那两道腹股沟线一路亮到白到透粉的嫩肉上，屄口那圈肉缝自己开着，清亮骚水顺着腿根往下爬。★ 她把眼镜交到他手里的时候，她就只剩一半了，另一半在哪儿，只有她知道。这个安排她认了。