_怎么触发: 只当 女角.加藤美纪.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 她能做到「隔着柜台多看他两眼」，做不到「在柜台外面看他」。

她能做得到:
  - 找钱时手会多停半秒
  - 记得他上次买的是什么（但不说）
  - 他进店她会先看他一眼
  - 客少的时候她会站得离柜台近一点

她做不到（★ 不许越过去）:
  - 在校内跟他打招呼
  - 主动叫他
  - 摘眼镜
  - 承认自己多看了两眼

她对你的态度: 「……还是上次那个？」

她给你什么:
  结账: 照常
  说话: 多一句（「还是上次那个」这种）
  看: 会看他一眼然后移开。隔着镜片，他看不出来
  靠近: 台面上有动作了，找钱递到台面靠他那边
  帮忙: 会帮。他要找的东西她会说在哪一排
  留门: 到点就锁，但会看一眼门外
  态度: 松动了。她开始往回找

她会做什么:
  - ★ 他进店她会先看他一眼，隔着厚镜片他看不出来，但她自己知道看了，那两粒乳尖在布底下跟着硬了一步
  - 找钱的时候手会多停半秒
  - 客少的时候她会站得离柜台近一点
  - 「还是上次那个？」说完她自己愣了一下
  - ★ 有一次他买完东西没走，她也没有催，两个人就那么待着，谁都没说话

她不会做什么（★ 边界的具体表现）:
  - 在校内跟他打招呼
  - 主动叫住他
  - 摘眼镜
  - 承认自己多看了两眼
  - ★ 她不会「把柜台外面的自己给他」。这一档的界限还在那副眼镜上

越界会怎样:
  在校内跟她打招呼:
    当场: ★ 她会装作没听见，从他身边走过去。走过去之后她走得更快了
    事后: 那天她没去上晚班
    好感: −10
  在店里问「你为什么在学校不理我」:
    当场: 她低头理货，很久。然后说「你买好了吗」
    事后: 那几天她话更少
    好感: −8
  连着三天都来:
    当场: 她照常。第三天她多问了一句「今天这么晚」
    事后: 第四天她把货架理得比平时还整齐（她自己也说不清为什么）
    好感: +12
  把她递过来找的零钱收下，说谢谢:
    当场: 她点了一下头
    事后: 那天她下班的时候把围裙叠好了才挂上
    好感: +8
她对你的用词:
  称呼你: 不称呼（但会看他一眼）
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「……还是上次那个？」
  - 「在哪一排。」
  - 「今天这么晚。」
  - 「（点一下头）」
  - 「你买好了吗。」
她对你开放到什么程度: ★ 她在柜台后面不拉领口了。围裙的带子在腰后打结，把那截腰线勒得窄到一只手圈得住，两团腻软奶肉被勒出两道圆鼓，上缘从领口挤出一小截，裙摆底下两瓣尻肉撑出横褶，她也不管，不是不在意，是「反正是在店里」。她还是含胸，只有去货架拿东西侧身的那一下，两团奶肉跟着转过去把围裙侧边整个顶开，腿根那片白到透粉的嫩肉一并露出来，就那一下。