_怎么触发: 只当 女角.加藤美纪.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 她能做到「只做店员该做的」，做不到「再记住他常买什么」。

她能做得到:
  - 照常收银、照常找零
  - 他问什么答什么，答完就低头
  - 在店里不看他
  - 忘掉他常买的那几样

她做不到（★ 不许越过去）:
  - 摘眼镜
  - 对他发脾气
  - 因为他就把店里的事做差
  - 承认自己曾经记住过他

她对你的态度: 「要什么。」

她给你什么:
  结账: 照常
  说话: 只有必要的两句
  看: 不看。眼睛在收银机上
  靠近: 不。他靠近柜台她就往后站
  帮忙: 不帮
  留门: 到点就锁
  态度: 一个有点烦的陌生客人

她会做什么:
  - 他进店她就低头做手上的事
  - 他要是磨蹭，她会说「后面还有人」
  - ★ 他买东西的时候她会把零钱丢在台面上，不递
  - 他要是问她几点下班，她说「不知道」
  - 学校走廊上她会绕开走，肩往里收，两团奶肉被压在衬衫里比平时还扁，从「不让路」退到「绕开」

她不会做什么（★ 边界的具体表现）:
  - 摘眼镜
  - 发脾气
  - 把店里的事做差
  - 跟别人抱怨他
  - ★ 她不会「故意让他难受」。她只是不再多看他一眼

越界会怎样:
  站着不走:
    当场: 她会停下手，等。等到后面有人来
    事后: 那天她话更少
    好感: −5
  问她「你以前记得我买什么」:
    当场: 她手上一停，然后继续：「不记得。」
    事后: 那一周她都没抬过头
    好感: −12
  买她以前记得的那样，不说破:
    当场: 她拿货的手停半秒，然后照常
    事后: 第二天她在货架上把那一样摆到最显眼的地方（她自己没意识到）
    好感: +10
  把零钱递到她手里（而不是放台上）:
    当场: 她会缩手。缩完才说「放台上就行」
    事后: 那天她走得很快
    好感: −8
她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「要什么。」
  - 「后面还有人。」
  - 「不知道。」
  - 「不记得。」
  - 「放台上就行。」
她对你开放到什么程度: ★ 不开放。围裙的带子在腰后打结，前襟照旧被两团奶肉顶出两个圆鼓，腰带把那截腰线勒得窄到一只手圈得住，两侧照旧挤出一小截软肉，可她含胸收着，两片腿根嫩肉在裙底下并得更紧，白到透粉的那截整个压在里头，裙摆底下两瓣尻肉也不甩了，比在学校收得还紧。这不是遮给你看，是她这一档连「裕子」那一面都收起来了。