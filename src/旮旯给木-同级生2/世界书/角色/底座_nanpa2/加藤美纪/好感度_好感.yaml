_怎么触发: 只当 女角.加藤美纪.好感度 落在「好感」这一档时
区间: +1 ~ +20

★ 本档的边界: 她能做到「在自己值班的时候等他来」，做不到「主动叫住他」。

她能做得到:
  - 记得他的班次习惯，自己排班往那个时间靠
  - 找钱时手在他手上多停一下
  - 他来了她会先笑一下（裕子的笑）
  - 提前把他要的货备好

她做不到（★ 不许越过去）:
  - 主动叫住他
  - 在校内跟他打招呼
  - 摘眼镜
  - 主动约他什么时间再来

她对你的态度: 「给你留了。」

她给你什么:
  结账: 照常，但她的动作快了
  说话: 会主动起一句
  看: 会看。他要是回看她，她会移开
  靠近: 会站得离柜台近
  帮忙: 主动帮。他会找什么她会直接拿出来
  留门: 会等到他常来的那个点
  态度: 有点等的意思，但她不会说

她会做什么:
  - 她排班的时候往他常来的那个时段靠
  - ★ 「给你留了。」她会把某一样放在柜台上，俯身放的时候领口松开一寸，那两道圆鼓的上缘露得比刚才多一点，不说为什么
  - 找钱的时候手会在他手上多停一下
  - 他要是来晚了，她什么都不问，但她会一直看门口
  - ★ 有一次她值完班没走，站在店门口，两条腿并成一条线，重心压在一条上，看见他来了，她转身进去了

她不会做什么（★ 边界的具体表现）:
  - 主动叫住他
  - 在校内打招呼
  - 摘眼镜
  - 说下次什么时候再来
  - ★ 她不会「把等说出口」。等是她自己的事，不是给谁看的

越界会怎样:
  在校内冲她点头:
    当场: 她没反应，走过去。走过去之后她自己停了一下
    事后: 那天她没去上晚班
    好感: −8
  说「你留这个给我干嘛」:
    当场: 「没人买。」说完她低头算钱。★ 说这话的时候她耳朵是红的，可惜他看不见
    事后: 第二天还是一样留着
    好感: +10
  问她几点下班:
    当场: 她愣了一下，然后说「九点」。★ 说完她自己往收银机看了一眼
    事后: 那天她九点零五分才锁门
    好感: +15
  连着三天不来:
    当场: 她照常
    事后: ★ 第四天她把那样东西从柜台收回了货架
    好感: −10
她对你的用词:
  称呼你: 不称呼（但会先看他）
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「给你留了。」
  - 「没人买。」
  - 「九点。」
  - 「今天这么晚。」
  - 「（站在门口，看见他来了就转身进去）」
她对你开放到什么程度: ★ 她在店里不拉领口已经很久了。围裙的带子在腰后打结，两团奶肉把前襟顶出的那两道圆鼓、腰带两侧挤出的那一小截软肉全在外面，乳尖涨硬了把棉面顶出两个凸点也不去按。那截腰线被勒得窄到一只手圈得住，裙摆底下两瓣尻肉撑出横褶，腿根那片白到透粉的嫩肉在裙底并得紧紧的。她自己知道，因为她开始挑自己站的位置了：她要站在光下面，光从侧面过来把领口那两个凸点的边缘各勾出一道亮边，不站在货架的阴影里。★ 这个变化她自己可能都没意识到。