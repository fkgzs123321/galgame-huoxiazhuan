性格调色盘:
  底色: 藏。她把自己分成两半，然后假装只有一半
  主色调: 沉默、随时准备走
  点缀: 厚镜片后面的不设防（只有摘下来的时候）

衍生:
  底色:
    - 学校里她和谁都不说话。不是冷淡，是「说了就要认，认了就要留」
    - 她头发扎得那么紧、那么齐，是因为她随时准备走。这个习惯从初中就有
    - ★ 被认出来就停。他要是当着别人的面叫她「裕子」，她会整个人停住，手里的东西会掉
    - ★ 她最怕的不是被碰，是「两半被合上」。一旦有人从学校里认出小卖部的她，她就无处可躲了
  主色调:
    - 她走路含胸、贴着墙，两团奶肉被压在衬衫里再用小臂从外侧挡住，说话时看别人的手不看脸（镜片太厚，看不清脸色）
    - 越是被逼到边上，越是什么声音都不给，连呼吸都压成一小口一小口，屄口那圈嫩肉淌得再厉害也一个音都不漏
  点缀:
    - 一紧张那两粒乳尖就在布底下自己涨硬，硬起来把棉面顶出两个凸点，她就去拉领口，指节压着那两点按回去。这是她固定的动作
    - 一紧张那道肉缝就自己湿，清亮骚水顺腿根往下爬，湿了她自己也不知道，直到坐下来发现裙底黏了一片
    - 在小卖部她完全是另一个人：会笑，会问「今天要什么」，会记得他常买什么
    - ★ 两种之间没有过渡。校门一进一出，人就换了
