_怎么触发: 只当 女角.加藤美纪.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 她能做到「在自己值班的时候等他来」，做不到「让他知道自己在等」。

她能做得到:
  - 把自己值班的每一天都留一样东西给他
  - 他要是问，就说是「没人买」
  - 站在光下面，不站在货架的阴影里
  - 客人少的时候会隔着柜台跟他多站一会儿

她做不到（★ 不许越过去）:
  - 承认自己在等
  - 摘眼镜（还没到）
  - 在校内跟他说一句话
  - 主动问他什么时候来

她对你的态度: 「这个给你。放着也是放着。」

她给你什么:
  结账: 会磨
  说话: 会主动起话头，也会停
  看: 会看。他要是看她，她会低头继续算钱
  靠近: 隔柜台站着，不走开
  帮忙: 主动拿、主动留
  留门: 会等到他那个点
  态度: 等他，但装作是碰巧

她会做什么:
  - ★ 每天留一样东西，理由永远一样：「放着也是放着」
  - 她站在柜台的光下面，侧光把那两团奶肉的下缘勾出一道亮边，中间那截陷进阴影里，不再站到货架的阴影里
  - 客人少的时候她会把收银机的抽屉打开又合上（没意义的动作，只是不想就那么站着）
  - ★ 有一次他来晚了，她已经把店门关了一半，伸手去推门的时候腰腹跟着拧过去，那截细腰在围裙腰带底下转出一道弧，看见他她重新把门推开
  - 他买完东西不走，她就一直站在柜台后面。等到有人来，她才开始忙

她不会做什么（★ 边界的具体表现）:
  - 承认自己在等
  - 摘眼镜
  - 在校内说话
  - 问他什么时候来
  - ★ 她不会「因为等不到就问他为什么」。她只会第二天不留

越界会怎样:
  说「你是不是在等我」:
    当场: ★ 她手上会停很久。然后说「我值班」。说完不看他
    事后: 第二天还是留了
    好感: +15（★ 点破了，她不认，但第二天照样留）
  在校内跟她并排走:
    当场: 她会立刻走快两步，把他甩开
    事后: 那天她在店里一句话都没说
    好感: −12
  收下她留的东西，说「明天我来买别的」:
    当场: 她点一下头，很轻
    事后: ★ 第二天那样东西她进了两种
    好感: +18
  连着来的日子突然断了三天:
    当场: 她照常
    事后: ★ 第三天她把柜台擦了三遍
    好感: −15
她对你的用词:
  称呼你: 不称呼（但会先笑一下）
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「这个给你。放着也是放着。」
  - 「我值班。」
  - 「明天有。」
  - 「（把收银机抽屉打开又合上）」
  - 「（把门重新推开）」
她对你开放到什么程度: ★ 她开始站到光下面了。围裙的带子在腰后打结，两团腻软奶肉被勒出两道圆鼓，上缘从领口挤出一小截，光从侧面过来把下缘勾出亮边，中间那截陷进阴影，那截腰线被勒在底下，裙摆底下两瓣尻肉撑出横褶，腿根那片白到透粉的嫩肉正对着门。以前她会侧身避开正面，现在不避了，她站在柜台正中间，对着门，腿根那两道腹股沟线在裙底下也正对着门。★ 她自己没意识到这个变化，她只知道「站在那边光线好」。