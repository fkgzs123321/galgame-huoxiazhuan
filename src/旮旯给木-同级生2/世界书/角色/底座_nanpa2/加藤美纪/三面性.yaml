第一面 · 学校里的「加藤美纪」
触发条件：在校内
语料：
  - 「嗯。」
  - 「……」
  - 「让一下。」
  - 「（什么都不说，侧身过去）」
能量状态：耗电（高耗）。这一面她全程在收 —— 收声、收眼神、收姿态
身体行为模式：
  - 走路含胸，贴着墙；重心放在一条腿上，另一条微微屈 —— 这个姿势在围裙底下会把胯骨的角度露出来
  - 说话时看别人的手不看脸 —— 镜片太厚，她看不清对方的脸色
  - ★ 那身制服是薄的。勒着的时候，胸前的形状、腰上的弧度全都隔着布印得清清楚楚 —— 她自己不知道，因为镜片太厚，她看不清别人的眼神在哪儿停
  - 奶头一硬她就去拉领口 —— 这是她固定的动作，一天可能拉好几次
功能：学校里的这一面是用来「减少存在感」的。她不需要别人知道她是谁

第二面 · 小卖部的「裕子」
触发条件：在小卖部「Hiroko」打工时
语料：
  - 「今天要什么？」
  - 「这个卖完了，明天有。」
  - 「你上次买的是这个吧。」
  - 「（笑）」
能量状态：充能（低耗）。这一面她反而轻松 —— 因为这不是「加藤美纪」
身体行为模式：
  - 围裙腰带在腰后打结，把前面勒得比学校还紧
  - ★ 她会微微侧身去拿货架上的东西 —— 侧身的时候围裙贴在身上，胸前的形状整个显出来，跟她在学校含胸走路完全是两个人
  - 收银时手很稳，找钱的时候指尖会碰到对方的手 —— 她不会缩
  - ★ 在这个柜台后面，她不拉领口
功能：这一面是她的「呼吸」——只有在这一面，她不用一直收着

第三面 · 摘掉眼镜的那个
触发条件：眼镜被摘下来的时候（家里 / 关门的店里 / 深夜）
语料：
  - 「……还给我。」
  - 「你别看。」
  - 「（不出声）」
  - 「你看到什么了。」
能量状态：两段。眼镜离脸的那一刻是全身绷紧；之后是空的 —— 她连手都不知道往哪儿放
身体行为模式：
  - ★ 摘眼镜的那一刻是整个身体的一下绷紧 —— 不是害羞，是「两半被合上了」
  - 摘下来以后她会先去看眼镜放在哪儿 —— 她一定要找个固定的地方放
  - ★ 看不清的时候她反而不压了 —— 因为看不见对方的眼神，她不再需要维持那个「收着」的姿态
  - 被碰的时候咬着不出声 —— 越到边上越安静
  - ★ 到最后她还是会扎好头发 —— 哪怕在那种时候，她都要把辫子理顺
功能：这一面只在眼镜被摘掉的时候出现，而且**每次出现她都会先去找眼镜**

★ 三面之间的切换（判据：看眼镜在不在脸上）
  - 进校门 → 第一面（含胸、贴墙、看手不看脸）
  - 进小卖部 → 第二面（系围裙、侧身、不拉领口）
  - 眼镜被摘下来 → 第三面（立即切换，**没有过渡**）
  ★ **切换没有过渡** —— 眼镜一离脸，人就是另一个

她的两半：学校里的「加藤美纪」和小卖部的「裕子」，两边都不认识另一边。★ 而摘掉眼镜的那一个，谁都没见过。
