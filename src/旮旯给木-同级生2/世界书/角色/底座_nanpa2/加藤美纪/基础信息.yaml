体型落点: 小奶 ＋ 丰腴。胸前那两团收在衬衫里只够填满一只掌心，腰线以下顺着髂骨一路往两侧铺开，落到两瓣把裙摆从底下撑出横褶的尻肉上。

外貌:
  整体: 制服外面再系一条围裙，那具前窄后阔的身子被两层布裹着。腰线以上收得又窄又紧，两团奶肉把前襟顶出两个圆鼓，腰线以下顺着髂骨往两侧铺开，两瓣尻肉把裙摆从底下撑出横褶。布底下那层皮肉白到透粉，薄处的光整个透过去，把腿根内侧那片嫩肉底下浮着的血色一并映出来。她把扣子扣到最上一粒，可厚镜片挡的是别人的眼神，不是这身肉。
  奶子: 一对紧致翘挺小奶，隆起的弧度刚够填满一只掌心。围裙的带子在腰后打结，把前襟往里收足，两团腻软奶肉被勒出两道圆鼓，上缘从领口挤出一小截。浅粉乳尖贴着布底，一涨硬就把棉面顶出两个小凸点，呼吸一次在上面蹭过去一次。她走路含胸，那两团就压在衬衫里不给看，一到柜台后面把围裙系上，勒得比学校还清楚。
  奶头: 两粒浅粉乳尖是整具身子最藏不住的一处。她一紧张那两粒就自己涨硬，硬起来隔着衬衫戳出两个尖，她自己第一时间就去拉领口。指节压着棉面把那两个凸点按回去，松开又弹起来顶回原处，那截布面跟着一鼓一鼓地动。
  屁股: 两瓣腴软肥尻比看着的厚一圈。校裙是标准长度，可她走路的时候整片尻肉左右交替把裙摆甩出横褶，一步一记，节奏准得她自己都知道会落在别人眼里。蹲下去取货架最下层那排货的工夫，两瓣尻肉被这个折角推到腰窝上方撅成全身最高的一处，裙面绷开一片匀净高光，臀腿折痕陷进腿根那截最嫩的皮肉里。
  腰腹: 一截被围裙腰带勒出来的细腰，窄到一只手能圈住。带子在腰后打结，结一收紧，那截腰和底下从腰滑进深邃臀缝的那道弧就全被勒出来，多余的软肉从腰带两侧挤出一小截。她系围裙的动作快，手在背后绕两圈就抽紧，像是怕人看见那道弧是怎么被勒出来的。
  腿: 两条并得很紧的腿。站着的时候重心压在一条腿上，那侧胯骨往外沉出去，另一条微微屈着，把两道深陷的腹股沟线从裙底拉出来。两片腿根嫩肉并紧了往两侧翻，坐下来整片压在椅面上，起来的时候黏连着扯出一声轻响。
  逼: 粉嫩小骚逼，还没被人碰过。★ 先淌水，后夹人：一紧张那道肉缝自己就湿，清亮骚水顺着腿根往下爬，湿到她坐下来才发现裙底黏了一片。捅开以后一圈嫩肉螺旋着往里绞，收得死紧，手指难动。一被捅就合不拢，得等它自己慢慢并上，并上的工夫里还在往下淌。
  特色: 粉色头发，长度到脖子；双马尾 + 辫子 + 发带，全扎在脑后一根不落。★ 扎得这么齐不是为了好看，是为了「随时能离开现场」。厚镜片，摘下来的时候那不是「变美了」，是换了个人
  反应: 牙咬死了不出声。两片屄唇被撑开的时候那圈嫩肉已经在淌，声音却一个都不漏，连呼吸都压成一小口一小口。越是被逼到边上，越是什么都不给。

