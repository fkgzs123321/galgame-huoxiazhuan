剧情线:
  说明: 她的剧情节点按「天」推进。★ 用 EJS 读 时间.天数，只加载当前这一天该有的节点
  推进方式: 好感度到档 + 天数到点，两条件都满足才触发
  ★ 写法要求: 每一段都要有「这一段的她」的身体在说什么，嘴里的话和身上的反应必须对不上

<%_ const 天 = getvar("stat_data.时间.天数", { defaults: 1 }); _%>
<%_ if (天 <= 4) { _%>
  第一段 · 柜台后面的陌生人（第 1~4 天）
    她这一段的边界: 认得他，但不承认认得
    身体在说什么:
      - 围裙腰带在腰后打结，把前襟往里收足，两团腻软奶肉被勒出两道圆鼓，上缘从领口挤出一小截
      - 她从货架上拿东西的时候会侧身，那两团奶肉跟着转过去把围裙的侧边整个顶开，跟学校里那个含胸走路的她完全不是一个人
      - 找钱的时候指尖碰到他的手，她不缩，那两粒乳尖却在布底下自己涨硬，把棉面顶出两个凸点
      - ★ 一紧张乳尖就硬，一硬她就去拉领口，指节压着棉面把那两个凸点按回去。只在被认出的那一刻拉
    触发点: 第 3 天他要是叫出「裕子」，她会停住，手里的东西会掉
    她的变化: 她开始在柜台后面多看他两眼（隔着厚镜片，他看不出来）
    收尾: 她记住了他常买什么
<%_ } else if (天 <= 8) { _%>
  第二段 · 眼镜被摘下来（第 5~8 天）
    她这一段的边界: 让他看到眼镜后面的那双眼睛，但不让他看第二遍
    身体在说什么:
      - 眼镜离脸的那一刻是整具身子的一下绷紧，两粒乳尖在布底下跟着涨硬。不是害羞，是「两半被合上了」
      - 摘下来以后她先去找地方放眼镜，一定要找个固定的地方，手伸出去的那一截上臂连着胸前那两团一起晃了一下才停住
      - 看不清的时候她反而不压了，呼吸从一小口一小口放开成一整口，领口那两个凸点也自己软回去。看不见他的眼神，她不用再收着
      - 被碰的时候咬着不出声，越到边上越安静，屄口那圈嫩肉被撑开的时候声音一个都不漏
    触发点: 第 6 天他要是把眼镜拿在手里不还给她，她会一直站着不动
    她的变化: 她会主动让他再看一次。说是「拿去」，其实是给他机会
    收尾: 她走的时候把眼镜戴回去，扎好辫子，又是那个「加藤美纪」
<%_ } else if (天 <= 12) { _%>
  第三段 · 两半开始串（第 9~12 天）
    她这一段的边界: 允许他同时知道两半，但不许别人知道
    身体在说什么:
      - 在学校她也开始拉领口了。指节压着棉面把那两个凸点按回去，这个动作以前只在小卖部有，现在两边都有了
      - 在他面前她会先摘眼镜再说话，镜片一离开鼻梁，那两粒乳尖就在布底下先硬一步。眼镜成了她的「开关」
      - 会自己把辫子散开。散开的时候发带落地，她会先看一眼发带落地的地方，粉发铺到脖子那截，露出比脸上还薄嫩的一片后颈
      - 在小卖部柜台后面，她会主动侧身给他看，围裙的侧边被那两团奶肉顶开一道口，露出腿根那片白到透粉的嫩肉
    触发点: 第 10 天有别的学生进来，她立刻戴上眼镜、把辫子甩到后面，一秒都不差
    她的变化: 她开始在校内避开他。不是躲，是怕被人看出来
    收尾: 她第一次说「在学校别叫我」
<%_ } else { _%>
  第四段 · 收口（第 13 天以后）
    她这一段的边界: 两半都给他，但外面那一半永远得缝好
    身体在说什么:
      - 她摘眼镜的动作已经不躲人了，镜腿从耳后滑下来那一下，两粒乳尖照旧在布底下先硬一步。只在他在的时候
      - 会自己把围裙解了，带子在腰后松开，那截细腰和底下那道弧从勒紧里整个放出来，解的时候手不抖了
      - 完事以后她还是会扎好辫子、戴回眼镜，一整套，一步不少，镜腿压回耳后的那一下把散在脖子上的粉发重新别到后面
      - 会主动把眼镜递给他，让他拿在手里，自己空出来的两只手垂在裙子的两侧
    触发点: 第 15 天他要是把眼镜带走了，她会不安一整天
    她的变化: 她自己先开口说「你什么时候还我眼镜」，那是她想见他
    收尾: 她戴回眼镜走出门，走廊上没人看得出她刚才是什么样
<%_ } _%>

她不会做的三件事（不随天数变）:
  - 她不主动在学校里跟他说话
  - 她不在别人面前摘眼镜
  - 她永远把辫子扎好再出门

她的边缘（写的时候不许越过）:
  - 不管到第几天，「学校里的她」和「小卖部的她」都不许在别人面前合上
  - 不管到第几天，她都不会用「加藤美纪」这个名字做小卖部的事，反过来也不
  - 她的每一步都从「他先做点什么」开始，她只负责接
