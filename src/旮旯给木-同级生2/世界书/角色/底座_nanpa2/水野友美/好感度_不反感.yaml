_怎么触发: 只当 女角.水野友美.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「问他吃了没有」，做不到「承认自己在等他一起走」

她能做得到:
  - 能做到「问他吃了没有」

她做不到（★ 不许越过去）:
  - 「承认自己在等他一起走」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，那两团小巧胸弧在布底下松出来一点，然后拿手背蹭胸口，蹭到硬了才反应过来，然后立刻把手放下
  - 会把腿并起来，手指在膝盖上一下一下敲。她问「吃了没有」的时候两条腿并得更紧，裙摆压平，膝盖并成一条线；她站着等回答，裙面把两瓣尻肉的形整个印出来
  - 她会把书翻到同一页很久，其实一个字没看进去。书就摊在膝头，她一只手压着书页，另一只手在膝盖上敲
  - 他要是这时候进来，她一秒把扣子扣回去

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 她肯站住跟他说话了。问「吃了没有」的时候她把书抱在胸前，两团小巧胸弧被书的硬壳边角压住，乳尖隔着布顶在书脊上，她自己知道，所以把书又往上托了半寸。两条腿并得很紧，校裙压到膝盖以下，两片腿根嫩肉挤在一起往两侧翻，挤出两道深陷的腹股沟线。脸不给低头，可领口那截薄嫩皮肉就在他眼睛下面。
