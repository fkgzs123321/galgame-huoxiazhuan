性格调色盘:
  底色: 她和他之间有一条「不用说话的默契」，从小就有
  主色调: 委员长水野
  点缀: 不管到第几天，「他客气一句她就会炸」这条永远成立

衍生:
  底色:
    - 住在主角家隔壁，青梅竹马，从小到大一起上学。那条一起上学的路上她走在他侧后半步，衬衫扎进裙腰，裙摆压平，腰线以上绷得又紧又平，走近了只看得见领口那截薄嫩皮肉透着光
    - 校内有名的才女：成绩第一，委员长，什么都会。她站在讲台前收作业，一截细腰被裙腰头的布缘勒出来，腰侧的软肉从扎紧的地方挤出一小截，伸手臂去接本子的时候胸前那两团小巧胸弧跟着往上提
    - 她只在主角面前有另一面：会闹，会说难听的话，会把书乱放。关上门换上家居服，她一弯腰捡书，领口从肩头滑下去一截，两团奶肉在布底下跟着往前坠，坠到最底那一下乳尖把布顶出两个凸点，弹回来极快
  主色调:
    - 耗电（中耗）。撑住「完美」的那层壳全穿在布上：扣到最上一粒，衬衫扎进裙腰，裙摆压平，把底下那具白腻肉躯整个收住，一点形状都不给外面看
    - 这一面她要撑住「完美」。她坐着的时候两条腿并得很紧，校裙压到膝盖以下，两片腿根嫩肉挤在一起往两侧翻，脸上什么都没有
  点缀:
    - 她不主动说「我想要」；她不在人前乱；她不承认自己有需要。嘴上不说，两瓣肥厚屄唇在裙底下自己分开一线又合拢回去，那道肉缝里渗出来的一点清亮骚水抹在腿根上；她自己发现了就把腿并得更紧
    - 不管到第几天，她都不会把「想要的」直接说出口
