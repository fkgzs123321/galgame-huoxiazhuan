_怎么触发: 只当 女角.水野友美.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「在他面前把衬衫解开一格」，做不到「承认自己在想他」

她能做得到:
  - 能做到「在他面前把衬衫解开一格」

她做不到（★ 不许越过去）:
  - 「承认自己在想他」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，然后拿手背蹭胸口，蹭到硬了也不立刻放下，手背压在那团奶肉上又蹭了两个来回
  - 会把腿并起来，手指在膝盖上一下一下敲。敲到一半手指停住，两条腿松开一点又立刻并回去，腿根那两片嫩肉挤得往两侧翻
  - 她会把书翻到同一页很久，其实一个字没看进去。书压在胸口上，乳尖隔着布顶在书脊上，她低头看了那本书很久
  - 他要是这时候进来，她一秒把扣子扣回去，可领口那道缝还开着，布底下那两点照旧顶着

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 当着他的面解开那一格，领口往下敞出一片，薄棉底下那层白到透粉的皮肉连着锁骨下面两道浅窝一起露出来，乳尖在布底下浮出两个尖。她说是「热」，说完不扣回去。坐下的时候两条腿并着，裙摆往上滑到膝盖上面，露出腿根那一片比别处更潮热的嫩肉，挤出两道深陷的腹股沟线；她一弯腰，两瓣尻肉把裙面顶出两道横褶。
