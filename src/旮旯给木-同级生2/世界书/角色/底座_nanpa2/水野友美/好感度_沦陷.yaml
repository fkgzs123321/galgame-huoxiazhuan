_怎么触发: 只当 女角.水野友美.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「在他面前哭」，做不到「说自己到底在烦恼什么」

她能做得到:
  - 能做到「在他面前哭」

她做不到（★ 不许越过去）:
  - 「说自己到底在烦恼什么」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，然后拿手背蹭胸口，蹭到硬了也不立刻放下，手背压着不动，每一次呼吸都把那团奶肉顶到手背上
  - 会把腿并起来，手指在膝盖上一下一下敲。哭的时候两条腿并得更紧，腿根那两片嫩肉挤出更深一道，裙面绷在膝头上抖
  - 她会把书翻到同一页很久，其实一个字没看进去。书被她抱在胸前抱得很紧，两团奶肉从两侧被挤出来，乳尖隔着布顶在书壳上
  - 他要是这时候进来，她一秒把扣子扣回去，那两点还硬着把布顶着，她自己知道

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 哭给他看的那一次，她整个人伏下去，家居服的领口从肩头滑开，两团奶肉的上缘整个露出来，连中间那两粒涨硬的乳尖都把布顶着。她哭的时候肩一抽，那两团就跟着抖，抖得布面一阵一阵地皱。裙摆早滑到腿根上面，露出腿根那两片泛着水光的嫩肉，挤出两道深陷的腹股沟线，底下那道被她自己夹紧的肉缝在两瓣肥厚阴唇中间合着。她不抬头，也不叫他走。
