_怎么触发: 只当 女角.水野友美.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「从此当邻居」，做不到「不走那条一起上学的路」

她能做得到:
  - 能做到「从此当邻居」

她做不到（★ 不许越过去）:
  - 「不走那条一起上学的路」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，刚松开一点领口又立刻扣回去，那两团小巧胸弧连在布底下起伏的机会都没有，手指压在扣子上按了两下才走开
  - 会把腿并起来，手指在膝盖上一下一下敲。两条腿并成一条线，两片腿根嫩肉挤在一起往两侧翻，裙摆压平纹丝不动
  - 她会把书翻到同一页很久，其实一个字没看进去。书脊抵在下颌上，把领口那截薄嫩皮肉挡得严严实实
  - 他要是这时候进来，她一秒把扣子扣回去

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 零。衬衫扣到最上一粒，下摆扎进裙腰，裙摆压平，腰线以上绷得又平又紧，那具白腻肉躯被布整个收住，一点形状都不给外面看。她不是遮给你看，是根本看不见你。从走廊那头过来只剩一个齐整的轮廓，擦肩过去只留下一身皂味，两瓣尻肉在裙底下把布撑出的那点形跟着脚步往远处走，走到拐角就看不见了。
