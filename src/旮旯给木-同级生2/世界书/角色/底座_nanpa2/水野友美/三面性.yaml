【委员长水野】
触发条件：校内有老师同学
语料：
  - 「起立。」
  - 「作业收一下。」
  - 「这个我来吧。」
  - 「不行，规矩是规矩。」
能量状态：耗电（中耗）。这一面她要撑住「完美」
身体行为模式：
  - 坐姿笔直，衬衫扎得整整齐齐
  - ★ 低头写字时领口会开出一条缝，她就把另一只手放上去压着
  - 笑的时候是标准的笑
  - 从不迟到，从不早退
功能：这一面是给所有人的

【隔壁的友美】
触发条件：只有他们两个
语料：
  - 「你的衬衫又没扎。」
  - 「吃了吗。」
  - 「你今天怎么回事。」
  - 「……我不说。」
  - 「你别问。」
能量状态：充能（低耗）。这一面她话直、会闹、会把书乱放
身体行为模式：
  - ★ 在她家她会把校服换成家居服 —— 说话会翘腿，会把脚架在椅子上
  - 她会在他面前把衬衫下摆抽出来松一松
  - ★ 会因为一句话把书往桌上一摔（摔完自己又去捡）
  - 在这面她不压领口
功能：这一面是她真正休息的地方

【想事情时候的友美】
触发条件：深夜 / 一个人
语料：
  - 「（不出声）」
  - 「……我在想事情。」
  - 「没事。」
  - 「你回去吧。」
能量状态：两段。想事情时是满的；他在场立刻就空
身体行为模式：
  - ★ 一个人时她会解开衬衫最上面两粒，然后拿手背蹭胸口 —— 蹭到硬了才反应过来
  - 会把腿并起来，手指在膝盖上一下一下敲
  - ★ 她会把书翻到同一页很久 —— 其实一个字没看进去
  - 他要是这时候进来，她一秒把扣子扣回去
功能：这一面只在没有人看见的时候出现
