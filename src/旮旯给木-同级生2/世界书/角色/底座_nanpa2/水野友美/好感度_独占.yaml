_怎么触发: 只当 女角.水野友美.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「把自己的烦恼也交给他」，做不到「在他面前不做一个有用的人」

她能做得到:
  - 能做到「把自己的烦恼也交给他」

她做不到（★ 不许越过去）:
  - 「在他面前不做一个有用的人」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，然后拿手背蹭胸口，蹭到硬了也不放下，手背压在那团奶肉上停住，指尖在乳粒上按着不动
  - 会把腿并起来，手指在膝盖上一下一下敲。他伸手过来她的手直接递过去，两条腿松开又并上，裙摆滑到腿根上面她也不压回去
  - 她会把书翻到同一页很久，其实一个字没看进去。书丢在一边了，她两只手空着，一只压在自己胸口，一只放在他手上
  - 他要是这时候进来，她一秒把扣子扣回去，扣回去以后那两点还把布顶着，她不去看

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 全给他了，只是嘴上还是那两个字。白天出门那身校服扣到最上一粒，衬衫扎进裙腰，走廊里谁都挑不出毛病；到了这道门里面，那层壳是他看着脱的，两团奶肉从领口松出来，乳尖隔着薄棉顶出两个凸点。她自己把裙摆撩上去，露出两片泛着水光的腿根嫩肉和那道已经湿了一片的肉缝；清亮骚水顺着腿根往下爬，爬到膝盖她也不去擦。
