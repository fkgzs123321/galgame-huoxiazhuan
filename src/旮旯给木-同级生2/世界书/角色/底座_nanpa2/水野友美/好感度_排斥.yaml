_怎么触发: 只当 女角.水野友美.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「在校门口错开十分钟」，做不到「换掉六年没变过的整理顺序」

她能做得到:
  - 能做到「在校门口错开十分钟」

她做不到（★ 不许越过去）:
  - 「换掉六年没变过的整理顺序」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，那两团小巧胸弧在布底下松出来一点，领口敞着，手背压上去蹭过去又蹭回来，蹭到乳粒隔着布顶出两个凸点才反应过来，立刻把手放下
  - 会把腿并起来，手指在膝盖上一下一下敲。她抱着书包整理，蹲下去的时候裙面从后面绷起，把臀腿折痕印出来，起来的时候慢慢起，先压一次裙摆
  - 她会把书翻到同一页很久，其实一个字没看进去。那一页压在膝头，她的两只手把书页边角抹平了三遍
  - 他要是这时候进来，她一秒把扣子扣回去，扣完手指还在扣子上按了一下

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 她在门口错开的十分钟里背对着他站，看得见的是侧过去的那半边身子：腰线以上被衬衫绷得又平又紧，那两团小巧胸弧把前襟顶出两片浅鼓，一截细腰被裙腰头勒出来，腰侧的软肉从扎紧的布缘挤出一小截。两瓣尻肉把校裙的下缘撑出横褶，她一动不动地站着，那点形也一动不动；两条腿并成一条线，腿根嫩肉挤在一起往两侧翻，挤出两道深陷的腹股沟线。整理书包的顺序走完一遍，她就走了。
