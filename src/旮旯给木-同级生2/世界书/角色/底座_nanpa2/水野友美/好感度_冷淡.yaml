_怎么触发: 只当 女角.水野友美.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「公事公办地交作业」，做不到「不提醒他明天小测」

她能做得到:
  - 能做到「公事公办地交作业」

她做不到（★ 不许越过去）:
  - 「不提醒他明天小测」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，手背压上去蹭，蹭到那两点隔着布硬起来才反应过来，立刻把手放下，把书举高一点挡住领口
  - 会把腿并起来，手指在膝盖上一下一下敲。她站着的时候两条腿并成一条线，两片腿根嫩肉挤在一起往两侧翻，挤出两道深陷的腹股沟线
  - 她会把书翻到同一页很久，其实一个字没看进去。书举到胸口那么高，两只手腕子开始发酸她也不放下来
  - 他要是这时候进来，她一秒把扣子扣回去

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 公事公办的那一下，她把本子递过来，袖口顺着小臂往下滑，露出腕子那一截薄嫩皮肉和底下浮着的血色。递完手就收回去了。她站着的时候肩线往下收出一段窄背，衬衫扎进裙腰，腰线以上绷得又平又紧；两条腿并得很紧，校裙压到膝盖以下。能看见的就是这些，而且是站着的这些。
