_怎么触发: 只当 女角.水野友美.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「不再等他一起走」，做不到「不看那扇窗的灯」

她能做得到:
  - 能做到「不再等他一起走」

她做不到（★ 不许越过去）:
  - 「不看那扇窗的灯」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，领口松出一道缝，缝里露出半圈乳丘上缘那层白到透粉的皮肉，她低头看了一眼又立刻扣回去
  - 会把腿并起来，手指在膝盖上一下一下敲。敲到第四下停住，两条腿并得更紧，腿根那两片嫩肉挤出更深一道
  - 她会把书翻到同一页很久，其实一个字没看进去。书翻开来压在胸口，把领口那道缝压住
  - 他要是这时候进来，她一秒把扣子扣回去

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 看得见的只有背。她不再等他一起走，从校门口错身过去的时候裙面从后面绷起来，把两瓣尻肉的形连臀腿折痕那道线印出来，走过那一下整片尻肉左右各荡了一记才停住。她站定了重心压到一条腿上，另一侧胯骨往外沉出去，两片腿根嫩肉挤出两道深陷的腹股沟线。人不停，脸不给，那件校服把正面能看的地方全盖住了，只剩裙摆底下随着步子抽出又收回的一截腿，和擦肩时飘过来的一点皂味。
