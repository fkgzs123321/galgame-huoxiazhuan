_怎么触发: 只当 女角.水野友美.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 能做到「让他碰自己的手」，做不到「说一句『你需要我』」

她能做得到:
  - 能做到「让他碰自己的手」

她做不到（★ 不许越过去）:
  - 「说一句『你需要我』」

她对你的态度: 「没事。」

她会做什么:
  - 一个人时她会解开衬衫最上面两粒，那两团小巧胸弧在布底下松出来一点，然后拿手背蹭胸口，蹭得乳粒隔着布顶出两个凸点，整片薄棉被压出一道斜褶，她也不立刻放下手
  - 会把腿并起来，手指在膝盖上一下一下敲。他伸手过来的时候她的手在半空停了一下才递出去，两条腿并得更死，裙面绷在膝头上
  - 她会把书翻到同一页很久，其实一个字没看进去。书从膝头滑下去她也没捡，两只手交叠着压在大腿上
  - 他要是这时候进来，她一秒把扣子扣回去，那两点还硬着把布顶着，她自己知道

她不会做什么（★ 边界的具体表现）:
  - 她不主动说「我想要」
  - 她不在人前乱
  - 她不承认自己有需要

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 手给他了，别处还没有。那只手被他握住的时候，她的肩线往下松了半寸，衬衫前襟跟着塌下去一点，两团小巧胸弧在布底下顶出的形状比站着时清楚。她坐着的时候两条腿并得更紧，可裙摆已经压不住了，滑到膝盖上面，露出腿根那两片泛着水光的嫩肉和两道深陷的腹股沟线；她一弯腰去捡掉在地上的书，两瓣尻肉把裙面顶出两道横褶，臀缝被自身分量压得更深。她一直看着他，不说话。
