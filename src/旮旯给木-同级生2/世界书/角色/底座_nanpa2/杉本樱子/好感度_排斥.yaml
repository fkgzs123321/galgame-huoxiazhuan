_怎么触发: 只当 女角.杉本樱子.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「假装睡着了」，做不到「不数他今天来了几次」

她能做得到:
  - 能做到「假装睡着了」

她做不到（★ 不许越过去）:
  - 「不数他今天来了几次」

她对你的态度: 「我怕……但是我不怕你。」

她会做什么:
  - 她装睡，呼吸放得又平又长。被单拉到胸口，那两团随着呼吸一起一伏，起伏的幅度她自己压不住，越压越明显。眼皮底下眼珠还在动，动一下被单就跟着晃一下。她把呼吸放得更轻，轻了那两团起伏得反而更清楚，清楚得她自己都想伸手按住。按不得，一按就装不下去了。
  - 装睡装久了，被单底下那两粒自己硬起来，把布顶出两个凸点。她两只手放在被单外面，不敢进去压，怕一动就装不下去。指节攥紧，指甲压进掌心，压出四道白印。那两点顶着布顶了一整个下午，顶得她胸口那一小块布比别处热。热归热，她的手还在被单外面，一次都没进去过，手背上的青筋倒是鼓起来了。
  - 两片腿根嫩肉在被单底下并拢，并拢的地方早闷出一层薄汗，汗把布贴死在肉上，撕都撕不开。膝盖骨支出来两块，把被单顶成两个尖。她的脚趾抠进床单，抠出几道褶。抠着抠着那处自己热起来，热了她把腿夹得更紧，紧到发麻。
  - 她数他今天来了几次，数到第三次的时候腰线松了一截，被单跟着滑下去一点，露出一截肋骨。她赶紧拉回去，拉的动作快得不像病人，拉完心跳得更响。跳得胸口那两团也跟着一跳一跳，跳完她把被单压平，压得一点起伏都不给外面看。
  - 装睡的时候她的下巴绷着，绷出一道硬线。脖颈拉成一条，锁骨底下那片白到透粉的皮整个露在领口外，那一片随着呼吸一起一伏。她不敢咽口水，咽一下胸口那两团就跟着晃。病房的白灯照在那片皮上，皮底下几根青色的血管都数得清。
  - 她瘦成那样，胸前那点形状在病号服底下反而更清楚，两团把薄布坠出两个圆，圆底下两点顶出两个小尖。装睡的时候这两点比她先醒，醒了她自己知道，也压不住。她只能把手在被单外面攥成拳，攥着干着急，急得眼眶都热了。
  - 被碰那一下她整个人抖一下，抖完没睁眼，可两片腿根嫩肉自己往两侧分了一点，分完又并上。屄口那圈肉先热起来，热得她呼吸乱了一拍，乱完还得装成平的。她把嘴唇抿紧，抿出一道白线，抿着才能不出声。
  - 她一边被碰一边笑，笑的时候肩膀抖，抖得病号服底下那两团一晃。她真的太高兴有人来了，笑完赶紧把脸埋回枕头里装睡，埋进去了肩膀还在抖。枕头被她埋出一个坑，坑里那块布是潮的，潮的是她自己呼出来的气。
  - 她一直看着天花板，眼皮半睁着从缝里看，那样才不至于哭出来。看着看着她的腰线松了，被单滑到大腿根，两条细白的腿露出来一截，她也没往上拉。露出那一截腿上起了一层细粒，凉风吹过去，细粒一直起到膝盖。
  - 护士进来量体温，她继续装睡。体温计塞到腋下那一下她夹紧胳膊，夹紧的时候两团奶肉被挤到中间，挤出一道乳沟，挤完她自己脸红，眼睛还是闭着。护士走了她才松胳膊，松开那一下乳沟还在，还在那一小会儿她没去拢领口。
  - 她的手在被单外面，指节攥紧，攥到发白。手腕细得能看见骨头，凉了一整天。她不敢把手伸进被单，伸进去就得承认自己没睡，那两粒也就不必再藏着。她就那么把手放在外面放着，放着放到指尖发凉。
  - 鸟在笼子里扑腾，她跟着动一下眼皮。扑腾完屋子静下来，静得她能听见自己的呼吸。呼吸一重，胸口那两团就起伏得更明显，她赶紧放轻，放轻了那两粒还顶着布。顶着的那两个尖比她的呼吸诚实多了，她拿它们一点办法都没有。
  - 两瓣尻肉压在床单上压了一整天，压平的那一片焖出薄汗，凉气顺着臀沟走一遍她才敢动。一动被单就窸窣响，响了等于承认没睡，她就继续压着不动。压到后来那一整片是麻的，麻了也还是压着，压出一整块死白的印。
  - 他站在床边看她，她的睫毛抖了一下。抖完那两粒在布底下硬得更厉害，把薄布顶成两个明显的尖。她把两只手在被单外面攥成拳，攥到指节发白，攥了一整个下午。他站了多久，那两点就顶了多久，顶到她自己都觉得那层布太薄了。
  - 等他走了她才睁眼，睁眼那一下腰线整个松下来，被单滑到腰上，露出那道腹部的凹和一整排浮在薄皮底下的肋骨。她躺在那儿喘，喘完把被单拉回去，拉回去的时候手是抖的。抖着拉到胸口，拉完那两粒还硬着，硬着她才伸手去压。
  - 她装睡的时候那件病号服的扣子扣得整整齐齐，一粒都没松。可领口那块布被那两团从里面坠着，坠出两个圆，圆底下两点顶出两个尖。她要是醒着，这两粒绝不至于顶成这样，顶成这样她自己也知道瞒不住。
  - 护士走的时候把门带上，门响那一下她的腰线松了半分，被单跟着滑下去一点。她伸手拉回去，拉到一半手停住，停在那儿听着走廊里的脚步声，听完了才拉上去，拉上去以后手指在被单边上多捏了一会儿。
  - 夜里她终于真睡着了，睡着以后那两粒在布底下自己塌下去，塌成两个小圆。被单滑到腰上一整晚没人管，露出那道腹部的凹，凹里积了一小汪汗，天亮护士来的时候已经干了，干在那一小块皮上留下一道印。

她不会做什么（★ 边界的具体表现）:
  - 她不问自己的病
  - 她不挽留
  - 她不在别人面前露出想要什么

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 装睡的那一层。她闭着眼，被单拉到胸口，那两团随着呼吸一起一伏，起伏的幅度她压不住。两片腿根嫩肉在被单底下并拢，闷出的薄汗把布贴死在肉上，撕都撕不开。露在外面的只有锁骨底下那片白到透粉的皮和支出来的两块膝盖骨。这一档她给的是假装的睡，身上的肉一件都没醒过来给她看，只有那两点在布底下先硬了，硬完她不敢伸手去压，怕一动就装不下去。她数他今天来了几次，数到第三次的时候腰线松了一截，被单滑下去露出一截肋骨，她拉回去的动作快得不像病人。她装了一整天，装的是那张脸，那具身子的每一处都在替她答话，答得比她嘴上诚实得多。这一档她不给你看，可她躺在那儿的样子本身就是给你看的，那两团在布底下一会儿硬一会儿软，瞒都瞒不住。
