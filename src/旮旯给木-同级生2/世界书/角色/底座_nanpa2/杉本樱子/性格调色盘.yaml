性格调色盘:
  底色: 她认得的第一个人是「窗外的那个」。她一开始都不知道他长什么样，只看过他的上半身
  主色调: 病房里的小鸟主人
  点缀: 不管到第几天，「她在人前都是那个懂事的住院女孩」这条永远成立

衍生:
  底色:
    - 她本该坐在八十八学园的教室里，如今躺在宽大的病号服里。那件衣服能装下两个她，挂在锁骨上晃，抬手的时候袖口滑下去一截，露出腕骨那一圈。躺了这些年肉没长，骨头倒是长开了，两团奶肉在松垮的布底下坠出两个圆，圆底下两点乳尖把薄布顶出两个小尖。病房的白灯照在薄皮上，皮底下几根青色的血管都数得清。她自己低头看得见，看见了就去拉被单。她没穿过校服，只穿过这一件。
    - 他每天爬树到窗外，她就撑着床头坐起来，病号服领口张开一道口子，两团奶肉在布底下坠着，说话的时候一晃一晃。玻璃那面是冷的，她凑近了说话，呼出的气在玻璃上糊出一小片白，白雾散了又糊一层。八天，说起来很短，可她这具身子在第八天已经认得他的脚步声。耳朵一动，被单底下那两粒先硬了，硬完她才想起来去拉。她住院无聊，只能和他说话，就那样日久生情。
    - 除夕夜八十八町下起大雪，她请假出来。雪落在后颈上，化开的水顺着脊沟往下走，走进病号服领子里，那两粒硬得发疼。被雪打湿的布贴在胸前，两团奶肉的轮廓从湿布上整个透出来，乳尖把布顶成两个点，她低头看见了也没去遮。两个人握着手走在天地之间，她走得很慢，两条细腿一步一步挪，停下来的时候两瓣尻肉绷紧。她的手在他掌心里全是汗。
    - 她认得的第一个人是窗外的那个。从窗外看进来只看得见上半身，她就特意坐直了让他看，坐直的时候腰腹那道凹收进去，肋骨从薄嫩皮肉底下浮出一排。她一开始都不知道他长什么样，只记住了他趴在窗台上那个姿势。后来他第一次从门进来，她才看见他的下半身，看见的那一下把被单拉到下巴。那两粒在布底下先立起来，她自己知道，知道也不去压。她认人先认声音，认住了就再也改不掉。
    - 后来有一些误会导致的悲欢离合，最后还是在一起了。那段时间她瘦得更快，两团奶肉塌下去一圈，托着它们的那点肉没了，乳尖在布底下还是硬的，硬得没有地方躲。胯上那两瓣更薄，侧躺的时候被单顺着滑下去，深邃臀缝里能直接摸到骨头，臀腿折痕那道线深得发暗。等这些过去，她又慢慢长回来，长回来的那两团比以前软，一晃就晃得比原来厉害。她还是笑，笑完眼角红。
  主色调:
    - 她整个人是省着用的。说话声气是平的，动作是慢的，抬手理头发都要歇一下。躺着的时候两片腿根嫩肉并得拢，并拢的地方夹出一道白痕，两道腹股沟线从那里往里收。她的身子也在省着用，不轻易湿，不轻易热，可一旦被碰，省下来的那点力气一次就全交出去。充能低耗，说的是她活着的法子，也写在那具身子上。她笑一下都要喘，喘完接着笑。省着用的人被碰一下反应反而更大，那是攒出来的。
    - 这一面她最像一个普通住院的女孩，已经练了几年。护士进来她就把被单拉到胸口，拉的动作练得又快又平，一点都不像有病。可那两团奶肉在病号服底下还是坠出两个圆，圆底下两点把薄布顶出两个凸点，她压不住。被单底下那两片腿根嫩肉早就在出汗，汗闷在布里，护士一走她就掀开一角透气。她练的是脸和手，身子没跟着练。练了几年的那张脸，底下藏着一具一碰就湿的肉。
    - 她养了一只小鸟，那是病房里唯一活着的东西。喂鸟的时候她要侧过身去够笼子，侧过去那一下病号服下摆卷上去一截，卷上去露出来的那段腰比脸还白，肋骨一根一根在薄皮底下浮着。鸟在笼子里跳，她跟着笑，笑得肩膀发抖，抖得两团奶肉在布底下一晃。她伸手进笼子里换水，手腕细得能看见骨头，鸟落在她手背上她一动都不敢动。那间病房里她只对着两样东西说话，一样是鸟，一样是窗外的他。
  点缀:
    - 她不问自己的病，不挽留，也不在别人面前露出想要什么。别人在的时候她把手压在被单上，压得平平整整，指节攥紧，指甲压进掌心，被单底下那两粒硬了她也不去管。护士问她哪里不舒服，她说没有，说话的时候腰腹那道凹一收一放，收下去整排肋骨都在薄皮底下动。她把想要的东西全藏在那层布底下，藏到连她自己都快信了。她不挽留，可他一转身，被单底下那两片腿根嫩肉就自己分开了。
    - 不管到第几天她都不会说你别走，她只会看着他。他起身要走的时候她两只手攥住被单边，攥到指节发白，被单底下两片腿根嫩肉夹紧又松开，松开的时候那处已经湿了一片。她看着他，眼睛不眨，眨一下眼泪就下来了。那道肉缝一下一下地收，收得她自己都躺不住，嘴上还是一个字都没有。她能给的只有眼睛和那具一碰就湿的肉。
    - 护士推门进来那一下，她一秒就把被单拉上去，动作快得像没病。上半身收拾得干干净净，脖子以下压成一条直线，两团奶肉被小臂压住看不见了。可被单底下那两瓣尻肉还压在床单上，压平的那一片早焖出一层薄汗，掀开一角就能闻见那股潮气。她说自己没事，声音是平的，只有攥着被单边的手指在抖。懂事是练给人看的，薄布底下的东西她一件都收不回去。门一关，被单自己就滑下来了。
    - 她的破绽不是身体，是他今天没来。窗户那面空着的时候她躺着不动，两条细白的腿在被单底下并成一条，两片腿根嫩肉夹出一道白痕，夹到发麻也不松开。一整天没等到那串脚步声，她的身子先垮，那两粒在布底下塌下去，怎么蹭都硬不起来。他要是真不来，她哭得比被碰还厉害，哭的时候腰线塌成一团，两瓣尻肉在床单上蹭出一道斜褶。她不怕被碰，她怕的是那扇窗户空着。
    - 她的世界里只有病房和他，没有外面，所以她也不防着谁。他不敲门就进来的时候她不遮，病号服领口敞着，两团奶肉在布底下坠出两个圆，她伸手去拿床头的水杯，抬手的时候袖口滑下去一截。她不知道该防谁，也不知道布底下那两点顶着布的样子该不该收起来。她唯一的规矩是病号服那几粒扣子，扣几粒全看那天他来不来。来就少扣一粒，不来就扣到最上面。
    - 等他来的那段下午长得没有尽头，她自己摸过自己。手指从被单底下伸进去，先碰到的是两片腿根嫩肉，肉是凉的，往里才热。指腹按在肉缝上，按一下里面先一跳一跳地顶，按久了就湿，湿了以后她自己也不知道那算不算，手停在里头不动。清亮骚水顺着手腕往下走，走一路都是腥甜的。等听见那串脚步声她把手抽出来，抽出来的时候指尖是亮的。这件事她从来不跟人提。
