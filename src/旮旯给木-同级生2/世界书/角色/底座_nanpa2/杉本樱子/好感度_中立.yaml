_怎么触发: 只当 女角.杉本樱子.好感度 落在「中立」这一档时
区间: = 0（初始）

★ 本档的边界: 能做到「跟他说今天护士做了什么」，做不到「承认自己讲这些是为了让他多待一会儿」

她能做得到:
  - 能做到「跟他说今天护士做了什么」

她做不到（★ 不许越过去）:
  - 「承认自己讲这些是为了让他多待一会儿」

她对你的态度: 「我怕……但是我不怕你。」

她会做什么:
  - 她讲护士今天做了什么，讲的时候坐起来一点，被单滑到胸口下面。两团奶肉的轮廓从病号服上鼓出来，随着她说话一晃一晃。她讲一句晃一下，晃得自己都低头看了一眼。
  - 那两粒顶着薄布，顶出两个凸点，她说话说得快，那两点跟着一颤一颤。她自己低头看见了，把被单往上拉，拉到一半又停住，停住以后就没再拉上去。
  - 她讲得越多，腰线越往下塌，塌下去那道腹部的凹更深，肋骨一根一根从薄嫩皮肉底下浮上来。浮出来的那一片比别处白，白得在病房的白灯下整片发亮。
  - 讲到小鸟的时候她侧过身去指笼子，侧过去那一下病号服下摆卷上去一截，卷上去露出来的那段腰比脸还白。她自己没往下拉，指完才慢慢放下来。
  - 她瘦成那样，胸前那点形状在病号服底下反而更清楚，两团把薄布坠出两个圆。她讲一句低头看一次，看完了接着讲，像是讲给他听，其实是讲给那两点听。
  - 被碰那一下她整个人抖一下，抖完两片腿根嫩肉自己往两侧分，分开了就不躲了。屄口那圈肉先热起来，热完清亮骚水就亮了一片，把薄布浸出一块湿痕。
  - 她一边被碰一边笑，笑得肩膀发抖，抖得病号服底下那两团一晃一晃。她真的太高兴有人来了，笑到一半想起还没讲完，讲完接着笑，笑完接着讲。
  - 她一直看着天花板，讲累了才躺回去，躺回去的时候脖颈拉成一条，锁骨底下那片白到透粉的皮整个露出来。那样她才不至于哭出来。
  - 她的手在被单外面比划，比划护士怎么给她扎针，比划到一半手停在自己胸口前面。停住了她自己没觉出来，停了好一会儿才放下去，放下去接着讲。
  - 讲到一半她咳嗽，咳的时候那道腹部的凹一收一放，收下去整排肋骨都在薄皮底下动。咳完她喘两口，喘的时候那两团起伏得更明显，明显得她把手压上去。
  - 护士推门进来，她一秒就把被单拉到胸口，拉的动作快得不像病人。护士走了她又把被单滑下去，滑到胸口下面，滑完接着讲刚才讲到哪儿。
  - 两条细白的腿在被单底下伸着，脚踝露在被子外面，细得一只手能圈住。她讲的时候脚在被单底下动，脚趾一抠一松，抠得床单上起几道褶。
  - 她的手腕细得能看见骨头，说话的时候抬起来比划，抬起来那一下袖口滑下去一截。皮底下几根青色的血管都数得清，青得在白灯下发暗。
  - 讲到护士给她换了新床单，她拍了拍身下那块布，拍的时候两瓣尻肉在床单上压出两块印。拍完她没挪，就那么坐着，坐着把整件事讲完。
  - 她说护士扎针扎疼了，说的时候把手伸到他面前让他看手背上那个针眼。伸过去的时候病号服的袖口又滑下去一截，露出整条小臂，细得只剩骨头包着皮。
  - 他起身要走的时候她正讲到一半，讲到一半停住，停住那一下被单还滑在胸口下面。她没往上拉，也没接着讲，就那么看着他，看到他重新坐回去。
  - 两瓣尻肉压在床单上压了一整天，压平的那一片焖出薄汗，凉气顺着臀沟走一遍她才敢翻身。翻身要花很久，翻完她喘两口，喘完接着讲。
  - 她的脸讲得发红，红到耳朵根，红的原因她说不清楚。那两点在布底下顶了一整个下午，顶得比她的嘴诚实，她讲的全是为了让他多待一会儿。
  - 他走了以后她躺回被子里，被单拉到胸口，拉完手压在那两粒上，压着不让它们再顶着布。压了很久那两点才塌下去，塌下去的时候她已经讲不动了。
  - 她讲药有多苦，讲的时候皱一下鼻子，皱鼻子那一下脖颈拉紧，锁骨底下那片皮绷得更薄。绷薄了那一片透着底下的血色，透得比别处明显，连皮底下几根青色的血管都浮出来。
  - 她说护士的手很凉，说的时候把手贴到自己胸口上比划。贴上去那一下掌心正好压在那两粒上，压住了还比划，比划完才发觉手放错了地方，赶紧挪开，挪开的时候耳朵是红的。
  - 讲到高兴的地方她笑出声，笑的时候整个人往前倾，倾过去那一下被单滑到大腿根，两条细白的腿露出来一截。她笑完往后靠，被单还留在腿根那儿没拉回去，留着留着就忘了。
  - 她的声音讲到后来是哑的，哑了她还在讲。讲的时候那两粒在布底下一直顶着，顶了一整个下午，顶到薄布上那两块比别处深，深得像汗浸过。
  - 他终于要走的时候她讲完最后一句，讲完那一下腰线整个松下来，被单滑到腰上。她没拉，就那么让他看了一眼那道腹部的凹和一整排肋骨，看完了才慢慢拉回去。
  - 那天晚上她自己把手伸进被单里摸了一下，指腹按在肉缝上，按一下里面先一跳一跳地顶。按久了清亮骚水就出来，出来以后她自己也不知道那算不算，手停在里头不动，停到听见走廊里的脚步声才抽出来。

她不会做什么（★ 边界的具体表现）:
  - 她不问自己的病
  - 她不挽留
  - 她不在别人面前露出想要什么

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 被单滑到胸口以下那一层。她坐起来讲话，两团奶肉的轮廓从病号服上鼓出来，那两点顶着薄布顶出两个凸点，说话说得快就跟着一颤一颤。腰线往下塌，那道腹部的凹更深，肋骨一根一根浮上来。侧过身指鸟笼的时候病号服下摆卷上去一截，露出比脸还白的一段腰。腿还盖着，只露出脚踝那一截。这一档她给的是领口、腰腹和那两点，胯以下还压在被单底下。她讲护士，讲小鸟，讲药有多苦，讲的全是为了让他多待一会儿，这件事她自己不承认，那两点替她承认了。
