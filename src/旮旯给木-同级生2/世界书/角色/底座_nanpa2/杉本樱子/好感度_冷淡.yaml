_怎么触发: 只当 女角.杉本樱子.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「只聊天气」，做不到「不问他明天来不来」

她能做得到:
  - 能做到「只聊天气」

她做不到（★ 不许越过去）:
  - 「不问他明天来不来」

她对你的态度: 「我怕……但是我不怕你。」

她会做什么:
  - 她只聊天气，说今天风大。说的时候两只手在被单外面，指节攥紧，指甲压进掌心，压出四道白印。被单被她压得平平整整，一点起伏都不给外面看。她的声音也是平的，平得像在念一张纸。风大的事她能说一整个下午，说到自己都信了，信完了那两粒还在布底下顶着。
  - 病号服领口扣到最上面一粒，那两团被布收得死死的，只在她抬手的时候从侧面鼓出一线弧。弧底下那两点顶着布，顶出两个浅浅的凸。她自己低头看见了，把领口又拢紧一格，拢完那两个凸还在。她把那粒扣子又捻了一次，捻完指腹是热的，热的是她自己的汗。
  - 她躺着不动，两瓣尻肉压在床单上压了整整一天，压平的那一片焖出薄汗。翻身的时候布从肉上撕开，撕开那声很轻，她自己听见了。翻完她喘两口，喘完接着平躺，躺回原来那个印里。那一整块压痕半天都没消，深邃臀缝里也焖着汗，她伸手擦过一次，擦完手上是腻的。
  - 问「明天还来吗」的时候她的脚在被单底下动了一下，脚踝细得能看见骨头。动完她把腿蜷起来，蜷起来那两片腿根嫩肉自己捂热，捂出一层薄汗。汗闷在布里走不出去，她也没掀开透气。捂热的那一小片贴着布，贴得比别处深，她自己伸手摸到了，摸完赶紧把手抽出来。
  - 她的手腕露在被单外面凉着，细得能看见骨头，皮底下几根青色的血管都数得清。病房的白灯照上去，那截手腕白得发亮。她就这么放着，放了一整天都没收进被子里。凉的那截手腕放到发青，护士来的时候问她冷不冷，她说不冷。
  - 她瘦成那样，胸前那点形状在病号服底下反而更清楚，一低头领口里什么都看得见。可她不低头，脸一直朝着天花板，只在换气的工夫胸口的布才起伏一下。起伏那一下她自己压不住，压完赶紧把呼吸放浅。放浅了胸口还是起伏，起伏的幅度不大，可在那层薄布底下一眼就看得出。
  - 被碰那一下她整个人抖一下，抖完腰线往里收，收出那道腹部的凹。两片腿根嫩肉并得死紧，并出一道白痕，过了很久才松开。松开的时候她喘了一口，喘完接着聊天气。聊到第三句她的手还在被单外面攥着，攥得那道褶一直没松开。
  - 她一边被碰一边笑，笑得肩膀发抖，抖得病号服底下那两团一晃。她真的太高兴有人来了，笑完继续说天气，说到风停了才停嘴。停嘴那一下屋里静得只剩她自己的呼吸。静下来那两点顶着布顶得更清楚，清楚得她把手臂压上去，压着继续说风。
  - 她一直看着天花板，脖颈拉成一条，那样才不至于哭出来。哭的时候腰线会塌，塌下去那两瓣就被床面压平。她不让腰线塌，就一直平躺着，躺到那两瓣压出一块死白的印。她不哭，她把眼泪咽回去，咽回去的时候脖颈上那道筋鼓了一下。
  - 她的手在被单外面攥着被单边，攥出一道褶。褶松开了又攥上，攥了一整个下午。她的指节发白，白得跟那截手腕一个颜色。被单底下的身子一动不动，只有那只手在动。被单底下那两粒硬了又软软了又硬，一遍一遍，她的手在外面一次都没进去压过。
  - 护士进来换药，她把病号服下摆往下拉，拉到盖住膝盖，拉完手还压在上面压着。换完药她把下摆放开，放开那一下下摆弹回去，露出一小截大腿根，她赶紧又拉下来。拉下来以后她的手掌还压在大腿根那一截上，压着不敢挪，怕它再弹回去一次。
  - 鸟在笼子里跳，她的眼睛跟着鸟转，转到一半又回到天花板上。转的时候脖颈动一下，锁骨底下那片白到透粉的皮从领口露出来一线。露完她把下巴收回去，收得那片皮又藏进领口里。藏进去的那一小片比别处白，白得透着底下的血色，她自己低头看了一眼就转开。
  - 她说风停了，说的时候把被单往上提了半寸。提上去那一下两团奶肉被小臂从底下托住，托出来的形比躺着时更圆，托了一会儿她自己也觉出来，赶紧把手放平。放平以后那两团又摊开，摊得平平的，比刚才托着的时候还显眼一点。
  - 她的脚在被单底下绷了一整天，脚趾抠进床单，抠出几道褶。松开那一下整条小腿都在抖，抖完她又绷上。膝盖骨支出来两块，把被单顶成两个尖，尖底下那两片腿根嫩肉并得死紧。绷了一整天，松开那一下整条腿都在抖，抖完她还是把腿蜷起来。
  - 他起身要走的时候她没开口。她的手在被单外面攥成拳，攥到指节发白，攥了一整个下午都没松开。被单底下那两粒硬起来顶着布，顶了两个小尖，顶了他走出去那一路。走出去以后她才把手松开，松开的时候掌心全是汗，汗把被单边那一块浸得比别处深。
  - 她把被单的边压在腋下，压得整整齐齐，压完两只手交叠放在肚子上。交叠的地方正好是那道腹部的凹，凹被手掌盖住，盖住了她才敢喘气。手放在那儿一整个下午，挪开的时候那道凹里积了一小汪汗。
  - 天黑以后病房只剩监控灯那点绿光，她还是平躺着，两瓣尻肉压在床单上压出那一整块死白的印。她的手在被单外面，指节发白，白得在绿光里发青。她就这么躺着等到天亮，一整夜没翻过一次身。天亮护士来换床单，掀开那块压痕还在，压痕底下的皮是红的，红了一整块。她翻个身把那一块盖住，盖住了才肯让护士进来。

她不会做什么（★ 边界的具体表现）:
  - 她不问自己的病
  - 她不挽留
  - 她不在别人面前露出想要什么

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 只到被单边缘那一层。被单压得平平整整，一点起伏都不给外面看。病号服领口扣到最上一粒，那两团只在她抬手的时候从侧面鼓出一线弧，弧底下那两点顶出两个浅浅的凸。两瓣尻肉压在床单上压了一整天，压平的那一片焖出薄汗，翻身的时候布从肉上撕开，撕开那声很轻。能看的只有露在被子外面那截脚踝和手腕，两处都细得能看见骨头。这一档她给的是天气和一个躺平的身子，布底下的东西一件都不拿出来。她问得出今天风大不大，问不出明天来不来，问不出口的那句话全压在那层薄布底下，压得那两粒一整个下午都在顶着布。
