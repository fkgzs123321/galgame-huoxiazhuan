_怎么触发: 只当 女角.杉本樱子.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「背对着窗户躺」，做不到「不看那只鸟吃饭」

她能做得到:
  - 能做到「背对着窗户躺」

她做不到（★ 不许越过去）:
  - 「不看那只鸟吃饭」

她对你的态度: 「我怕……但是我不怕你。」

她会做什么:
  - 她侧躺背对着窗户，两片肩胛骨支出来，把病号服顶起两个尖，中间那道脊沟从后颈一路陷到腰，陷进去那一段一节一节的骨头都数得清。两瓣尻肉绷着，绷到床单上压出一块死白的印。她不翻身，翻过去就得看见那扇窗，她宁可压着这半边。压了半宿那半边身子发麻，麻了她也不动。病房的白灯照在她背上，那道脊沟陷得比白天更深。她的脸埋在枕头里，埋着还能听见窗那面的风。
  - 脊沟那道线在灯下发暗，汗顺着它往下走，走到腰上被病号服的带子挡住，挡住那一段焖出一层薄汗。她躺着不动，汗就积在那一小段里，积到发凉。两瓣尻肉之间那道深邃臀缝也焖着，她伸手进去擦过一次，擦完手指是腻的。擦完她把被单掀开一角透气，透气那一下凉气顺着臀沟走了一遍，她自己抖一下，抖完又把被单压回去。
  - 吃饭的时候眼睛只看着鸟笼，不看窗。勺子送到嘴边那一下病号服领口张开一道口子，两团奶肉在布底下坠着晃一下，晃完她把领口拢上。拢的时候手指蹭过那两点，蹭得它们硬了一点，她立刻把手挪开。挪开以后那两点还在布上顶着，顶了两个小尖，她就低头盯着碗，一口一口把饭吃完。
  - 两团奶肉被她自己的手臂压在身下，压得变了形，压久了那一小团开始发烫。烫得乳尖在布底下自己硬起来，顶出两个凸点，她把胳膊往外挪一点，挪完又压回去。压回去的时候她自己的呼吸乱了一拍，乱完接着吃。吃完那两点还是硬的，硬得她把胳膊压得更紧，紧到肩膀发酸。
  - 他说话她不答。答的时候脖子转过来一半，锁骨底下那片白到透粉的皮从领口露出来一线，露完立刻转回去。转回去那一下后颈起一层细粒，细粒从后颈一直起到肩胛。她的手在被单外面攥紧，攥到指节发白。那半边露出来的锁骨在她转回去以后还亮着，亮了一小会儿才被领口的布盖住。
  - 她瘦成那样，胸前那点形状在病号服底下反而更清楚，两团把薄布坠出两个圆，一低头就能看见领口里。她低头喂鸟的时候那两团在布底下一晃一晃，晃完鸟跳一下，她跟着笑一下，笑完又绷起来。绷起来的时候乳尖在布上顶得更明显，她自己低头看见了，把领口拢紧一格。
  - 被碰那一下她整个人抖一下，抖完肩胛往里收，收得整条脊沟更深。两片腿根嫩肉并拢，并拢的地方夹出一道白痕，夹得死紧。她的腰线往里收，收出那道腹部的凹，一整排肋骨从薄皮底下浮上来。她的手攥着被单边，攥出一道褶。攥完她没推开，也没回头，就那么僵着让人碰。
  - 她一边被碰一边笑，笑的时候肩膀抖，抖得病号服底下那两团跟着一晃，浅色乳尖顶着布顶出两个尖。她真的太高兴有人来了，笑完还是背对着窗躺回去。躺回去那一下两瓣尻肉重新绷紧，绷得比刚才更紧。笑着的那张脸和绷着的那两瓣是两回事，她自己也知道。
  - 她一直看着天花板，脖颈拉成一条，那样才不至于哭出来。看久了她侧过身去够鸟笼，侧过去那一下病号服下摆卷上去一截，卷上去露出来的那段腰比脸还白，肋骨一根一根在薄皮底下浮着。她够完把下摆拉下来，拉得很慢，拉完手在被单上压平，压得一点褶都没有。那一截腰她自己知道有多白，拉下摆的时候手指在上面多停了一下才放开。
  - 鸟在笼子里跳，她伸手进去换水，手腕细得能看见骨头，鸟落在她手背上她一动都不敢动。换完水她把手收回来，收回来的时候指缝里是湿的。她把手在被单上擦干，擦完那只手一直压在胸口，压着那两点。压着的时候鸟在笼子里叫，她跟着应一声，应完继续压着不放。
  - 夜里病房只剩监控灯那点绿光，她侧躺着，两瓣尻肉压在床单上压了半宿，压平的那一片早焖出薄汗。她翻一次身要喘三口，喘完还是背对着窗。窗那面有风声，她听见了，肩胛绷了一下，绷完继续躺着。躺到天亮那半边身子的压痕还没消，护士来量体温的时候看见了，问她是不是一直没翻身。
  - 她不问自己的病，也不问他明天来不来。她的手在被单外面，指节攥紧，指甲压进掌心，压出四道白印。手腕细得能看见骨头，露在被单外面凉着。她的脸朝着鸟笼那一边，朝那一整夜都不肯转过来。屋子里只有鸟在动，她的这具身子一动不动，只有胸口那两点在被单底下一硬一软地顶着布。
  - 护士推门进来给她擦身，手掌从腰滑到胯，滑到那道深邃臀缝上停一下，她没吭声。擦完那一整片是凉的，凉完被单盖回去又焖起来。她躺着让人擦，擦到哪儿都不躲，眼睛还是看着鸟笼。
  - 她的脚在被单底下绷着，脚趾抠进床单，抠出几道褶。脚踝细得能看见骨头，绷了一整天绷到发白。松开那一下整条小腿都在抖，抖完她又绷上。绷着的这两条腿从膝盖到脚踝绷成一条直线，被单压在上面压出两个尖。
  - 窗那边的人走了以后，她把脸从枕头里抬起来，抬起来那一下脖颈拉成一条，锁骨底下那片白到透粉的皮整个露出来。她看了窗户一眼，看得很短，看完把脸埋回去，埋回去的时候那两粒在布底下才软下去。

她不会做什么（★ 边界的具体表现）:
  - 她不问自己的病
  - 她不挽留
  - 她不在别人面前露出想要什么

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 侧躺背对窗那一面。能看的只有背，支出来的两片肩胛骨，从后颈一路陷到腰的那条脊沟，还有被单底下绷紧的两瓣尻肉，绷到床单上压出一块死白的印。她把正面全留给自己，病号服领口只在低头喂鸟的时候张开一道口子，露出两团奶肉在布底下坠出的两个圆。侧过身够鸟笼的那一下下摆卷上去一截，露出比脸还白的一段腰和浮在薄皮底下的肋骨。两片腿根嫩肉在被子底下并得拢，并出一道白痕。这一档她给的是一整条背，胸前那两点只在换水的时候蹭硬过一次，蹭完她立刻把手挪开了。她给的是一整条背和一小段腰，正面那两团只隔着一层薄布坠着，一次都没拿出来过。这一档她的身子是背对着他的，转过来那一半她自己也不许。她能忍住不看窗，可那两粒在布底下硬了又软，软了又硬，一整个下午都没停过。
