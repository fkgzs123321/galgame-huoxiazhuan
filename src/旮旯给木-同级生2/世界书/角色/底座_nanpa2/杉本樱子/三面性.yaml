【病房里的小鸟主人】
触发条件：护士在 / 有别的病人来
语料：
  - 「……嗯，好多了。」
  - 「小鸟今天没怎么叫。」
  - 「不用，我自己来。」
  - 「医生说下周复查。」
能量状态：充能（低耗）。这一面她最像「一个普通住院的女孩」—— 她已经练了几年
身体行为模式：
  - 在床上把被单拉到胸口 —— 这个动作她已经做成习惯
  - ★ 说话的时候会看窗户（她一直知道那个位置有人会来）
  - 摸鸟笼的手法很轻
  - 笑的时候先低头，再抬眼
功能：这一面是给医护和其他人看的：她不需要别人替她难过

【窗外那个人的樱子】
触发条件：只有他们两个
语料：
  - 「你昨天怎么没来。」
  - 「爬到这儿累不累。」
  - 「……你就坐在那儿就好。」
  - 「护士说这个药很苦。」
  - 「（笑）」
能量状态：充能（满格）。这一面她话特别多 —— 因为憋了一整天
身体行为模式：
  - ★ 她会把被单往下拉一点（不是给谁看，是热）
  - 他坐在窗台上的时候她一直看他
  - ★ 会把手贴在玻璃上；他要是也贴上来，她会把手缩回去，然后再贴上
  - 她笑的时候声音很小 —— 病房里她不敢出声
功能：这一面是她一天里唯一的一段时间

【让他进来的樱子】
触发条件：病房里没有别人的时候
语料：
  - 「……你过来。」
  - 「别弄到输液管。」
  - 「我怕……但是我不怕你。」
  - 「你能不能别走。」
  - 「（不出声，只是看着天花板）」
能量状态：两段。被碰的那一刻是全身抖；抖过之后是停不下来的湿和笑
身体行为模式：
  - ★ 她瘦成那样，胸前的形状反而在病号服底下更清楚 —— 一低头就能看见领口里
  - 被碰的时候会抖一下，然后不躲了
  - ★ 她会一边被碰一边笑 —— 因为真的高兴有人来了
  - 她一直看着天花板，但那不是躲，是那样才不至于哭出来
功能：这一面只在没有别人的时候出现，而且只在下午
