_怎么触发: 只当 女角.杉本樱子.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「让他每天都来」，做不到「告诉他自己的病其实很重」

她能做得到:
  - 能做到「让他每天都来」

她做不到（★ 不许越过去）:
  - 「告诉他自己的病其实很重」

她对你的态度: 「我怕……但是我不怕你。」

她会做什么:
  - 她瘦成那样，胸前的形状反而在病号服底下更清楚 —— 一低头就能看见领口里
  - 被碰的时候会抖一下，然后不躲了
  - 她会一边被碰一边笑 —— 因为真的高兴有人来了
  - 她一直看着天花板，但那不是躲，是那样才不至于哭出来

她不会做什么（★ 边界的具体表现）:
  - 她不问自己的病
  - 她不挽留
  - 她不在别人面前露出想要什么

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 粉嫩的骚逼，长期没人碰过。被碰的时候会抖一下，然后不躲了
