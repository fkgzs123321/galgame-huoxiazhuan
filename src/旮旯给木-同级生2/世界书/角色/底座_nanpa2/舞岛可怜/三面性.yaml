【台上的舞岛可怜】
触发条件：舞台 / 镜头前
语料：
  - 「大家好，我是舞岛可怜。」
  - 「谢谢大家。」
  - 「（笑的弧度刚刚好）」
  - 「（看镜头）」
能量状态：充能（看着满，其实是耗）。这一面她做了十年，笑的角度都不会错
身体行为模式：
  - 站姿是练过的：重心在一条腿上，肩膀是平的
  - ★ 会主动找镜头的角度
  - 穿造型服的时候胸前的形状是设计过的
  - 摘下帽子的时候头发会甩一下 —— 那也是设计过的
功能：这一面是她十年里练出来的

【学校里的转学生】
触发条件：校内 / 没有人认出她
语料：
  - 「……嗯。」
  - 「（压低帽子）」
  - 「不用了。」
  - 「我先走了。」
能量状态：耗电（高耗）。这一面她全程在防 —— 防认出来、防被拍、防上新闻
身体行为模式：
  - ★ 帽子压低，口罩不离；坐着永远靠墙
  - 走路很快，不看人
  - ★ 有人拿手机她整个身子会绷一下
  - 她的手机反面朝上放
功能：这一面是她唯一能「不存在」的地方

【不是偶像的她】
触发条件：深夜 / 酒店房间 / 他的地方
语料：
  - 「你先看看有没有人。」
  - 「你别说出去。」
  - 「我今天不想笑。」
  - 「……你能不能别看我。」
  - 「（哭得很难看）」
能量状态：两段。确认没有镜头是满的；确认完就散 —— 她只剩哭
身体行为模式：
  - ★ 第一件事是拉窗帘、检查有没有镜头
  - 会自己把妆卸了 —— 卸完自己都不看镜子
  - ★ 她会哭得很难看 —— 那是她唯一不用对镜头的样子
  - 他不看她的时候她反而会过来靠
功能：这一面只在确认没有镜头之后
