性格调色盘:
  底色: 她在学校里不认得任何人 —— 因为认得就会上新闻
  主色调: 台上的舞岛可怜
  点缀: 不管到第几天，「她第一件事是看有没有镜头」这条永远成立

衍生:
  底色:
    - 八岁出道，现在是人气 No.1 的偶像歌手
    - 工作极忙，很少到学校 —— 她在学校是个「几乎不存在的人」
    - 她向往平凡校园生活 —— 但她从来没得到过
  主色调:
    - 充能（看着满，其实是耗）
    - 这一面她做了十年，笑的角度都不会错
  点缀:
    - 她不承认自己是偶像；她不在人前失控；她不让人拍她
    - 不管到第几天，她都不会在人前哭 —— 只会在他面前哭得很难看
