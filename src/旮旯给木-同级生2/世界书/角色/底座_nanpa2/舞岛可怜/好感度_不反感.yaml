_怎么触发: 只当 女角.舞岛可怜.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「跟他聊学校的事」，做不到「说自己从来没上过体育课」

她能做得到:
  - 能做到「跟他聊学校的事」

她做不到（★ 不许越过去）:
  - 「说自己从来没上过体育课」

她对你的态度: 「我今天不想笑。」

她会做什么:
  - 第一件事是拉窗帘、检查有没有镜头
  - 会自己把妆卸了 —— 卸完自己都不看镜子
  - 她会哭得很难看 —— 那是她唯一不用对镜头的样子
  - 他不看她的时候她反而会过来靠

她不会做什么（★ 边界的具体表现）:
  - 她不承认自己是偶像
  - 她不在人前失控
  - 她不让人拍她

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 粉嫩的骚逼，没被人碰过。会自己把妆卸了 —— 卸完自己都不看镜子
