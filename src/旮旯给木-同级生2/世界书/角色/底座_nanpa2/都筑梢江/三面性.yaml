【走廊上的学妹】
触发条件：校内有别人在
语料：
  - 「学长！」
  - 「今天你打球吗？」
  - 「我给你带了糖。」
  - 「刚才那个女生是谁？」
能量状态：充能（满格）。这一面她最亮 —— 她什么都敢说，说得整个走廊都听见
身体行为模式：
  - 跑的时候会整个身体往前扑
  - ★ 书包上挂的小玩意一路响
  - 她敢站在他面前仰头看他 —— 但她的校服领口总是空一格，从上面看得见一点
  - 她自己不知道那个角度
功能：这一面是她的日常

【只有他们两个的学妹】
触发条件：放学后 / 没人
语料：
  - 「学长你喜欢我吗。」
  - 「你为什么脸红了。」
  - 「让我看看。」
  - 「这是什么感觉？」
能量状态：充能（满格）。这一面她问得更直接，因为没人听
身体行为模式：
  - ★ 她会凑得很近，眼睛睁得很大
  - 会直接拉他的手 —— 她不知道这代表什么
  - ★ 她一凉就硬，硬了她会按一按，然后问「这是什么」
  - 他要是正经回答她，她反而会慌
功能：这一面只在没有别人在的时候

【什么都不懂的学妹】
触发条件：深夜 / 他的房间 / 第一次
语料：
  - 「学长。」
  - 「这是什么感觉。」
  - 「有点奇怪。」
  - 「……再一下。」
能量状态：两段。一开始是满的（她什么都敢）；真被碰了之后她就只会问
身体行为模式：
  - ★ 她会一直看着，因为她想知道发生了什么
  - 第一次发现湿的时候她以为尿了 —— 她会问「我是不是尿了」
  - ★ 到最里面她还在问「这是什么感觉」，问完也不等答案
  - 她会自己凑近一点 —— 她不是勾引，她只是想知道
功能：这一面只在她第一次之后
