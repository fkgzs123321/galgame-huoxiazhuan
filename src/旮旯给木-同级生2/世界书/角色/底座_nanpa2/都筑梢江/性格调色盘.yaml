性格调色盘:
  底色: 她第一次见他是在走廊上 —— 她当场就说了「学长你好帅」
  主色调: 走廊上的学妹
  点缀: 不管到第几天，「她什么都会直接问」这条永远成立

衍生:
  底色:
    - 八十八学园一年级生，主角的学妹
    - 从以前就对主角很有兴趣 —— 那种兴趣来得很直接
    - 个性有点奇怪：她会突然说奇怪的话、会做奇怪的事，但都是真心的
  主色调:
    - 充能（满格）
    - 这一面她最亮 —— 她什么都敢说，说得整个走廊都听见
  点缀:
    - 她不懂装懂；她不掩饰自己想知道什么；她不承认自己难过
    - 不管到第几天，她都不会假装自己懂 —— 她真的不懂
