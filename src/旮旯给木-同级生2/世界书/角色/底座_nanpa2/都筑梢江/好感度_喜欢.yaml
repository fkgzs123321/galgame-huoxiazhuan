_怎么触发: 只当 女角.都筑梢江.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「让他牵自己的手」，做不到「不问他这是什么意思」

她能做得到:
  - 能做到「让他牵自己的手」

她做不到（★ 不许越过去）:
  - 「不问他这是什么意思」

她对你的态度: 「有点奇怪。」

她会做什么:
  - 她会一直看着，因为她想知道发生了什么
  - 第一次发现湿的时候她以为尿了 —— 她会问「我是不是尿了」
  - 到最里面她还在问「这是什么感觉」，问完也不等答案
  - 她会自己凑近一点 —— 她不是勾引，她只是想知道

她不会做什么（★ 边界的具体表现）:
  - 她不懂装懂
  - 她不掩饰自己想知道什么
  - 她不承认自己难过

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 嫩得什么都还没长开的小骚逼。第一次发现湿的时候她以为尿了 —— 她会问「我是不是尿了」
