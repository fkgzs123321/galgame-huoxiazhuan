她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她在你面前换运动服，背心脱下来那一瞬两团绷紧的奶肉整个弹给你看，弧面绷得紧致挺翘，乳尖涨硬顶在冷气里。腹壁那几块和短裤下缘那道臀腿折痕一并亮出来，腰线底下那截泛着水光的腿根嫩肉只露出一小截。看可以，摸不行。
