_怎么触发: 只当 女角.田中美沙.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「把回东京的票退了」，做不到「不用球赛当借口」

她能做得到:
  - 能做到「把回东京的票退了」

她做不到（★ 不许越过去）:
  - 「不用球赛当借口」

她对你的态度: 「……我不后悔。」

她会做什么:
  - 她自己脱，脱完自己躺下把腿分开。两团绷紧的奶肉在胸口绷出两道弧，腹壁那层薄肌绷成一整块，臀腿折痕从短裤底下露出来陷进腿根，深邃臀缝往下那道肉缝自己张着，骚水顺着腿根往下爬到膝盖上方那块旧伤疤上
  - 喘。这回她的节拍是被撞散的，胸廓起落一下比一下浅，落到底那一下两团绷紧的奶肉只提半寸就收住，喉咙里出去的气带着跑完最后一圈那股劲，乳尖硬得顶在冷气里发亮
