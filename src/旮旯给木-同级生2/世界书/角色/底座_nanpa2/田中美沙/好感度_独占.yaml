  - 完事以后她去洗澡，回来照常躺下，像什么都没发生。躺下以后她把腿架上去，膝盖下方那块旧伤疤蹭着你的腰，两瓣尻肉贴着你绷出一道紧实的弧，一整夜没挪开

她不会做什么（★ 边界的具体表现）:
  - 她不绕弯子
  - 她不问以后
  - 她不承认自己在为谁留下

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她自己躺下把腿分开，腹壁那层薄肌绷成一整块，腰线底下那两道深陷的腹股沟线一直排到腿根，深邃臀缝往下那道肉缝自己张着，屄口那圈嫩肉外翻出来一点，涨硬阴蒂挺在肉缝上头，骚水顺着腿根往下爬到膝盖上方那块旧伤疤上。她自己掰开给你看，怎么摆都行。
