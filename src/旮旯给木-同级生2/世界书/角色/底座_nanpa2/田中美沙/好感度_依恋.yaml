她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她把头发放下来，散下来的头发盖住肩胛骨，拨开才看得见底下绷成一整块的薄肌和顺着脊沟往下淌的汗。背心撩起来以后两团绷紧的奶肉露在外头，乳尖顶着不缩回去，腰线底下那截泛着水光的腿根嫩肉全在你眼前。你的手贴上去她不挪开。
