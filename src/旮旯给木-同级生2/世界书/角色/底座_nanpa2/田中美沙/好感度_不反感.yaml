_怎么触发: 只当 女角.田中美沙.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「跟他复盘那场球」，做不到「承认自己故意让他赢一分」

她能做得到:
  - 能做到「跟他复盘那场球」

她做不到（★ 不许越过去）:
  - 「承认自己故意让他赢一分」

她对你的态度: 「……我不后悔。」

她会做什么:
  - 她当着你面脱，脱完自己把背心下缘撩起来一截擦汗。撩出来的那块腹壁分块清楚，指腹按下去硬得推不动，那是这 15 位里唯一一处硬的，腰线两侧那两道腹股沟线一并露在裤腰上头
  - 喘。她让你看着她喘匀，胸廓起落一下比一下浅，落到底那一下两团绷紧的奶肉只提半寸就收住，腹肌跟着绷一记再松开，乳尖在布底下顶出的两个凸点跟着一起收
  - 到最里面她会说一句很直接的话，直接到让人愣。说完照旧喘，不解释，节拍一个不乱
  - 完事以后她去洗澡，回来照常躺下，像什么都没发生。躺下之前她先去关灯，回来顺手把一瓶水放在你这边，躺下的时候两瓣尻肉在睡衣底下绷出一道紧实的弧，深邃臀缝压在布中缝上

她不会做什么（★ 边界的具体表现）:
  - 她不绕弯子
  - 她不问以后
  - 她不承认自己在为谁留下

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她让你看她喘匀的全过程，胸廓起落一下比一下浅，两团绷紧的奶肉跟着一提一沉。她会自己把背心下缘撩起来一截擦汗，撩出来的那块腹壁分块清楚，摸上去硬得推不动，腰线底下那截泛着水光的腿根嫩肉只露出一小截就缩回裤腰里。再往下那一层不给看。
