_怎么触发: 只当 女角.田中美沙.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「当面说他没出息」，做不到「不把球拍带在身上」

她能做得到:
  - 能做到「当面说他没出息」

她做不到（★ 不许越过去）:
  - 「不把球拍带在身上」

她对你的态度: 「……我不后悔。」

她会做什么:
  - 她自己把运动服脱了，动作和脱球衣一样利落，这回她不背身，让你看着她把衣服叠好，肩胛骨那两片随着叠的动作一收一放，短裤下缘被绷紧的腿肉顶出一道边，那道臀腿折痕陷进腿根更深一寸
  - 喘。胸廓起落一下比一下浅，两团绷紧的奶肉跟着一提一沉，腹肌绷一记再松开，腰线两侧那两道腹股沟线随着呼吸一隐一现
  - 到最里面她会说一句很直接的话，直接到让人愣。说完照旧喘，不解释，节拍一个不乱
  - 完事以后她去洗澡，回来照常躺下，像什么都没发生。她仰着躺，腹肌那几块在睡衣底下绷成一片，两瓣尻肉压在床面上摊开一圈，一整夜没松下来

她不会做什么（★ 边界的具体表现）:
  - 她不绕弯子
  - 她不问以后
  - 她不承认自己在为谁留下

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她在场上打给你看，跨一步大腿从裤摆底下抽出长长一截，落地那一下整条腿的肉被自己的力道震得一沉就收住，短裤下缘那道臀腿折痕随着每一步陷进腿根又弹开。挥拍送出去的时候肩胛骨在薄背底下支出来，腰腹那层薄肌绷成一整块。看得见，碰不到。
