  - 她不问以后
  - 她不承认自己在为谁留下

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她自己说想要，说完自己把背心和短裤都脱了，两团绷紧的奶肉弹出来晃半记就收住，腹壁那几块绷成一片，深邃臀缝往下那道肉缝一并亮出来，涨硬阴蒂挺出来蹭着冷气。手指拨开那两瓣薄嫩的阴唇，清亮骚水先自己亮了一片。全给你看。
