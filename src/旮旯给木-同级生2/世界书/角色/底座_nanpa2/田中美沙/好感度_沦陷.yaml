她对你的态度: 「……我不后悔。」

她会做什么:
  - 她自己说想要，说完自己脱。背心和短裤一起褪下来，两团绷紧的奶肉弹出来晃了半记就收住，腹壁那几块绷成一片，腰线底下那两道深陷的腹股沟线一直排到腿根，深邃臀缝底下那道肉缝一并亮出来，她不遮
