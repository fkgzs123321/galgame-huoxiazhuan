_怎么触发: 只当 女角.田中美沙.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「直接说自己想要」，做不到「在朋友面前承认」

她能做得到:
  - 能做到「直接说自己想要」

她做不到（★ 不许越过去）:
