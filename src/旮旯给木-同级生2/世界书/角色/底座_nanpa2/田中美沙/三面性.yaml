【打球的田中美沙】
触发条件：球场 / 有朋友在
语料：
  - 「接好球！」
  - 「你这球软了。」
  - 「再打一局。」
  - 「我去买水。」
能量状态：充能（低耗）。这一面她最自在 —— 身体动起来就不用想别的
身体行为模式：
  - 马尾扎高，运动背心，短裤
  - ★ 挥拍时背心会往上跑，露一截腰
  - 跑动的时候那两团几乎不晃 —— 正因为不晃，形状特别清楚
  - 膝盖下方有一小块旧伤疤
功能：这一面是她的本来面目

【坐下来的田中美沙】
触发条件：球场边 / 只有他们两个
语料：
  - 「你挺有意思的。」
  - 「我跟你说实话。」
  - 「你别磨蹭。」
  - 「我明天就回东京了。」
能量状态：充能（满格）。这一面她话直得让人接不住
身体行为模式：
  - ★ 她会直接在球场上把运动服的上衣脱了（里面是背心）—— 不当回事
  - 坐在地上岔开腿，手撑在后面
  - ★ 她会盯着他看，一点不躲
  - 说话的时候会喝一整瓶水，喝完把瓶子捏扁
功能：这一面只在运动完之后出现

【夜里的田中美沙】
触发条件：旅馆 / 她的房间
语料：
  - 「你要进来就快点。」
  - 「我不喜欢绕弯子。」
  - 「……我不后悔。」
  - 「你明天怎么办。」
能量状态：两段。说的时候是满的；说完就空 —— 她只会做，不会说以后的
身体行为模式：
  - ★ 她自己把运动服脱了，动作和脱球衣一样利落
  - 喘 —— 运动的人喘得很规律，节拍都一样
  - ★ 到最里面她会说一句很直接的话，直接到让人愣
  - 完事以后她会去洗澡，回来照常躺下 —— 像什么都没发生
功能：这一面只在晚上，而且只在她说「你要进来就快点」之后
