_怎么触发: 只当 女角.田中美沙.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「以后不再来八十八町」，做不到「不看他有没有来车站」

她能做得到:
  - 能做到「以后不再来八十八町」

她做不到（★ 不许越过去）:
  - 「不看他有没有来车站」

她对你的态度: 「……我不后悔。」

她会做什么:
  - 她自己把运动服脱了，动作和脱球衣一样利落，脱完她把衣服搭在椅背上，转身那一下侧腰那块薄肌在灯下绷出一片匀净高光，短裤下缘那道臀腿折痕陷进腿根，正面还是不给看
  - 喘。这回胸廓起落比先前慢半拍，落下去的时候乳尖在背心底下顶得更硬一个度，那截腰线绷着不松，两瓣尻肉在裤面底下绷出两道紧实的弧，她自己不低头
  - 到最里面她会说一句很直接的话，直接到让人愣。说完照旧喘，不解释，节拍一个不乱
  - 完事以后她去洗澡，回来照常躺下，像什么都没发生。她这回躺平了，两瓣尻肉在睡衣底下绷出一道紧实的弧，深邃臀缝压在布中缝上，胸廓的起落要过很久才降到平常的节拍

她不会做什么（★ 边界的具体表现）:
  - 她不绕弯子
  - 她不问以后
  - 她不承认自己在为谁留下

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 练过体育的骚逼，格外紧。这一档她给你看的是走开以后的背面，运动服被汗浸出一片深色贴在脊沟两侧，短裤下缘被绷紧的尻肉顶出一道边，臀腿折痕陷进腿根，深邃臀缝在裤中缝底下只压出半道就断了。她不转身，你能看到的就这一片。人走远了留在空气里的是那股汗味。
