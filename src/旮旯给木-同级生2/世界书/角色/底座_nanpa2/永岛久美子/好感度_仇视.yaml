_怎么触发: 只当 女角.永岛久美子.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「当他是普通客人」，做不到「不去车站那边等过路车」

她能做得到:
  - 能做到「当他是普通客人」

她做不到（★ 不许越过去）:
  - 「不去车站那边等过路车」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，双膝并死，和服后摆铺得连一道褶都不留；腰带还是紧的，她不敢自己解，那一圈带子把那截细腰整个封在里面，只从带子上缘溢出一小截软肉。
  - 他碰她的时候她不动，指腹压到哪一处那一处就在布底下僵住，腰线不塌，两条小腿也不分开；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快：手先搭在他手腕上不动，再顺着那根小臂往下滑，滑到一半又停下来。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 这一档什么都不给他看。和服系到领口，交叠的两片襟压到锁骨底下，袖口拉到指尖，跪坐时后摆铺平，把两条腿的形连两片腿根嫩肉一并盖住，两瓣尻肉压在身下连那道臀缝都不露，露在外头的只有手背那一截和木屐里那几个脚趾。他伸手过去能够到的，是端托盘时滑到小臂的那一小段白到透粉的嫩皮，再往上就被袖口挡回来。腰线以下一寸都不给。
