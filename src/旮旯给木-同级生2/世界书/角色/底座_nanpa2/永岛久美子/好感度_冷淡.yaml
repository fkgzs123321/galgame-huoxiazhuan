_怎么触发: 只当 女角.永岛久美子.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「公事公办地领他到房间」，做不到「不给他讲讲附近有什么」

她能做得到:
  - 能做到「公事公办地领他到房间」

她做不到（★ 不许越过去）:
  - 「不给他讲讲附近有什么」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上铺被褥，上身压低，交叠的领口顺着这个角度垂下去，锁骨底下那道窄沟整个露出来；腰带还是紧的，她不敢自己解，两片软肉从带子上缘挤出一小截。
  - 他碰她的时候她不动，只有被压住的那一处往下陷半寸，腰线不跟着走，两条小腿仍旧并成一条线；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，做完还要把和服前襟重新拢好才肯起身。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 弯下身去的时候领口能看进乳沟上缘。那两团紧致翘挺小奶的上半截弧贴在襦袢上，浅粉乳尖还没来得及顶出布面就被她直起身的动作收了回去，垂下去的那一小片布面上留着一点被焐热的潮气。腰线以下到两条腿一寸没露，跪坐时两瓣尻肉被后摆压平，深邃臀缝夹在身下，手伸到腰带上就被她按住不放。
