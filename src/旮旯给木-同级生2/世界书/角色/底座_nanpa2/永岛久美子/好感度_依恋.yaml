_怎么触发: 只当 女角.永岛久美子.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 能做到「在他面前把和服解开」，做不到「让他答应带自己去东京」

她能做得到:
  - 能做到「在他面前把和服解开」

她做不到（★ 不许越过去）:
  - 「让他答应带自己去东京」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，领口已经被解开到乳下，两团紧致翘挺小奶从交叠的襟里整个露出来；腰带还是紧的，她不敢自己解，那一圈带子把腰线勒出的横褶从头到尾没松过。
  - 他碰她的时候她不动，浅粉乳尖先自己涨硬立进冷气里，被碰到的那一处顺着这个涨硬往下沉，两片腿根嫩肉在跪坐里挤得往两侧翻；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，手伸下去的时候她的腰线自己往下塌了半截，跪着的双膝跟着分开一拳。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 领口在他面前解开到乳下，两团紧致翘挺小奶整个露出来，浅粉乳尖涨硬了立在冷气里，把周围那圈嫩皮绷得发亮。手覆上去攥紧，腻软奶肉从指缝里挤出一小截，乳粒被掌心压着来回蹭，蹭得她那截细腰自己往下塌。腰线以下那一圈腰带还是她自己系的，手摸到带子上缘就被那道横褶拦住，两瓣尻肉仍旧压在后摆底下。
