_怎么触发: 只当 女角.永岛久美子.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「什么都不懂也留下」，做不到「问他要不要娶她」

她能做得到:
  - 能做到「什么都不懂也留下」

她做不到（★ 不许越过去）:
  - 「问他要不要娶她」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，和服整个从肩上滑下去堆在腰带上，只剩一层襦袢贴着那副窄骨架；腰带还是紧的，她不敢自己解，那一圈带子成了身上唯一还系着的东西。
  - 他碰她的时候她不动，被碰到的那一处先渗出清亮骚水把襦袢下摆洇出一片湿痕，两条小腿却仍旧并死；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，动手的时候她的两条腿终于自己分开了一线，膝盖在榻榻米上往外挪了半寸。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 和服从肩上滑下去堆在腰带上，只剩一层薄襦袢贴着那副窄骨架，跪着的时候两片腿根嫩肉从下摆底下露出来，白到透粉的那层皮底下浮着血色。手指拨开那道肉缝，清亮骚水先自己亮了一片顺着腿根往下爬，屄口那圈嫩肉一张一合地翕动，是这具身子先招的。腰上那一圈带子仍旧是她自己系的，解不开也递不到他手里。
