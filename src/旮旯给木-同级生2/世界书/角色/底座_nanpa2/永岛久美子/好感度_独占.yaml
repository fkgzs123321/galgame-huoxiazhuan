_怎么触发: 只当 女角.永岛久美子.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「跟母亲摊牌」，做不到「在他面前不做一个乖巧的女儿」

她能做得到:
  - 能做到「跟母亲摊牌」

她做不到（★ 不许越过去）:
  - 「在他面前不做一个乖巧的女儿」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，和服和襦袢全堆在腰带上，从那两团奶肉到那道肉缝之间再没有一寸布；腰带还是紧的，她不敢自己解，那一圈带子由他来松。
  - 他碰她的时候她不动，屄口那圈嫩肉先自己一张一合地翕动，清亮骚水顺着腿根往下爬到膝弯，两条小腿却还保持着跪坐的规矩样子；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，学完之后她会把他的手按回刚才那一处不放开，按住的地方还留着上一回被攥出来的形。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 和服和襦袢全堆在腰带上，从那两团奶肉到那道肉缝之间再没有一寸布。她跪着把两瓣尻肉往脚跟外面挪出来一点，那道肉缝整个亮着，清亮骚水顺着腿根爬到膝弯，把身下那块榻榻米洇出一小片深色。她把自己拆成两半：一半在客人面前是永岛旅馆的女儿，领口压到锁骨，后摆铺平；另一半全给他，连腰带上那一圈都由他来松。
