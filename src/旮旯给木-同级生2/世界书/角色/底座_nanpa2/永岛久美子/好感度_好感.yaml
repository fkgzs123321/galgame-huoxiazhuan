_怎么触发: 只当 女角.永岛久美子.好感度 落在「好感」这一档时
区间: +1 ~ +20

★ 本档的边界: 能做到「让他看自己的杂志」，做不到「问他外面有没有女朋友」

她能做得到:
  - 能做到「让他看自己的杂志」

她做不到（★ 不许越过去）:
  - 「问他外面有没有女朋友」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，人往他这一侧偏过去，和服前襟交叠的那道缝正对着他的视线，领口里头那层襦袢的边露出一指宽；腰带还是紧的，她不敢自己解。
  - 他碰她的时候她不动，肩膀先塌下来半寸，被碰到的那一处却在薄布底下自己发起热来，浅粉乳尖隔着两层布顶出两个小点；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，只是手伸进去了脸还别到另一边去，不肯看自己正在做的事。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 并排坐着翻杂志，肩膀贴过来，襦袢领口里的乳沟上缘整个露着，两团奶肉把那层薄布顶出两个圆鼓。他手放上去，隔着一层襦袢能把那团腻软奶肉整个覆住攥紧，攥紧了从指缝里挤出一小截，乳粒被掌心压着来回蹭。腰线以下还压在后摆里，两瓣尻肉跪坐时压平在身下，深邃臀缝一点不露，两条腿一条都没松开过。
