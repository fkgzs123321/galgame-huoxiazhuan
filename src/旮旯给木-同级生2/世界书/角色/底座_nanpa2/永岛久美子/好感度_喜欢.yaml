_怎么触发: 只当 女角.永岛久美子.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「深夜去他的房间」，做不到「说自己想跟他走」

她能做得到:
  - 能做到「深夜去他的房间」

她做不到（★ 不许越过去）:
  - 「说自己想跟他走」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，深夜的廊灯从背后照过来把和服照得只剩一层轮廓，胸口顶出的两个形状连乳尖那两个凸点一起浮在布面上；腰带还是紧的，她不敢自己解。
  - 他碰她的时候她不动，两条小腿在他身侧并得很紧，被碰到的那一处却先湿了一片，把贴身那层襦袢洇出一块深色；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，动手的那只手抓着他的手腕不放，指尖在他腕骨上按出一道白痕。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 深夜进他房间，跪坐在榻榻米上，腰带还是紧的。灯从背后照过来，和服只剩一层轮廓，胸口那两个形状和浅粉乳尖顶出的凸点全浮在布面上。手从襟口伸进去能一路摸到乳下被勒出的那道压痕，指腹压上去那团腻软奶肉整个陷下去再慢慢弹回来；再往下被腰带挡住，手停在带子上缘就不敢动了，那一圈带子底下连着的两瓣尻肉和那截被勒紧的腰线一整段都还在后摆里。
