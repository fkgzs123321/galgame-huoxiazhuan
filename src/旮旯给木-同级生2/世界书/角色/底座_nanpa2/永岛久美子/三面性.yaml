【旅馆的女儿】
触发条件：有客人在 / 母亲在场
语料：
  - 「欢迎光临。」
  - 「这边请。」
  - 「晚饭是六点。」
  - 「不客气，应该的。」
能量状态：充能（低耗）。这一面她做了十几年，手比脑子快
身体行为模式：
  - 跪坐，双手放在膝上，和服后摆铺得很规整
  - ★ 起身时和服前襟会重新鼓起来一下
  - 走路是小碎步
  - 从来不多说一句话
功能：这一面是她的岗位

【自己房里的久美子】
触发条件：一个人 / 深夜
语料：
  - 「……好想看一次。」
  - 「东京到底是什么样的。」
  - 「（翻时尚杂志）」
  - 「……他今天没有跟我说话。」
能量状态：充能（满格）。这一面她话很多 —— 但只说给自己听
身体行为模式：
  - ★ 房里她会脱掉和服上半身，只穿襦袢，对着镜子看自己
  - 会翻时尚杂志，翻到某一页会停下来看很久
  - ★ 她会在镜子前面试杂志上的坐姿 —— 试完自己笑一下
  - 她不知道「湿」是什么，所以会用手碰一下，然后立刻缩回去
功能：这一面是她的全部：她想出去

【他房间里的久美子】
触发条件：深夜，她主动跑去他房间
语料：
  - 「我睡不着。」
  - 「……你带我走好不好。」
  - 「我不懂……你教我。」
  - 「疼吗。」
能量状态：两段。说话时是满的（练了好几遍）；说出口之后就空
身体行为模式：
  - ★ 她跪坐在榻榻米上，腰带还是紧的（她不敢自己解）
  - 他碰她的时候她不动 —— 不是抗拒，是不知道该怎么办
  - ★ 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手 —— 学得很快
功能：这一面只在深夜出现，而且每次她都是偷偷过来的
