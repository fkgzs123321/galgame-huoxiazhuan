_怎么触发: 只当 女角.永岛久美子.好感度 落在「中立」这一档时
区间: = 0（初始）

★ 本档的边界: 能做到「把他当住客照顾」，做不到「问他这次住几天」

她能做得到:
  - 能做到「把他当住客照顾」

她做不到（★ 不许越过去）:
  - 「问他这次住几天」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上端茶，托盘送到他面前那一下袖口滑到小臂，露出一截白到透粉的嫩皮；腰带还是紧的，她不敢自己解，那圈带子把腰线分成上下两截。
  - 他碰她的时候她不动，端托盘的两只手停在原处，指尖被托盘的边压得发白，两条小腿在身下并死；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，学的时候她一直抬着脸看他的表情，手上的动作全跟着那张脸走。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 端茶的时候袖口滑到小臂，两只手连着小臂那一截都搁在外头。跪坐时和服前襟交叠的那道缝正对着他的视线，缝里能看进去一层襦袢的边，往里就是被襟口压住的那道窄沟，再深的地方全在布底下。腰线以下从髋到脚跟一整段被后摆盖着，两瓣尻肉压平在身下，深邃臀缝连同两片腿根嫩肉一并藏进去，手顺着小腿往上摸，摸到膝弯那层嫩肉就被布面拦住。
