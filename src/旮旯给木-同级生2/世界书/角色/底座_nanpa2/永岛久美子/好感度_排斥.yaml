_怎么触发: 只当 女角.永岛久美子.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「当面说他失礼」，做不到「把偷看的杂志收起来」

她能做得到:
  - 能做到「当面说他失礼」

她做不到（★ 不许越过去）:
  - 「把偷看的杂志收起来」

她对你的态度: 「我不懂……你教我。」

她会做什么:
  - 她跪坐在榻榻米上，膝头比规矩的那一档分开半拳，和服后摆顺着分开的角度塌下两道斜褶；腰带还是紧的，她不敢自己解，那道横褶把腰线上下的肉分成两截。
  - 他碰她的时候她不动，肩先往上耸一点把领口拉紧，被碰到的地方却在布底下自己发起热来；不是抗拒，是不知道该怎么办。
  - 第一次她会问「疼吗」，第二遍不问了
  - 到最后她学会了自己动手，学得很快，手伸出去之后停在半路，等他来接那一下。

她不会做什么（★ 边界的具体表现）:
  - 她不主动解和服
  - 她不在客人面前失礼
  - 她不说自己想哭

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 襟口错开了半指。她说话的时候交叠的两片襟会跟着手势错开一点，锁骨底下那道窄沟露到底，能看进去一层襦袢的边，再往下就是被腰带勒住的地方。手伸过去能够到的是那一小段皓颈和手背上那层白到透粉的嫩肉，别处仍旧压在和服底下：两瓣尻肉跪坐时被后摆铺平着，深邃臀缝夹在身下一点不露，一整段下来没有一处松过。
