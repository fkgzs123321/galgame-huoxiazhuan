性格调色盘:
  底色: 她对主角一开始是「客人」，旅馆里最不能动心的人
  主色调: 旅馆的女儿
  点缀: 不管到第几天，「在客人面前她永远是永岛旅馆的女儿」这条永远成立

衍生:
  底色:
    - 自幼丧父，和母亲佐知子两人经营永岛旅馆
    - 不知世事的深闺千金，去过最远的地方是车站
    - 很向往大城市丰富多彩的生活，会偷偷看时尚杂志
  主色调:
    - 充能（低耗）
    - 这一面她做了十几年，手比脑子快：跪坐下去双膝先并死，两片腿根嫩肉被自身分量压得往两侧翻，和服后摆顺着那两瓣尻肉的弧铺平，两只手交叠压在襟口那道缝上把腰线上头那截软肉一并压进去，起身时前襟重新鼓起来一下，被压平的那两团奶肉才弹回来，袖口滑到小臂露出一截白到透粉的嫩皮
  点缀:
    - 她不主动解和服；她不在客人面前失礼；她不说自己想哭
    - 不管到第几天，她都不会主动说要什么，她只会看着他
