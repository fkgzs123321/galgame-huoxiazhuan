_怎么触发: 只当 女角.筱原泉美.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「在道场里不理他」，做不到「不看他射了多少环」

她能做得到:
  - 能做到「在道场里不理他」

她做不到（★ 不许越过去）:
  - 「不看他射了多少环」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她把胸当往下拉了一格。两团沉坠奶肉被压回去一片，被碰的那圈嫩肉还是绷紧的
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后抱住自己的弓。两团奶肉被胳膊从下面托着往上挤，她自己浑然不觉
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。两瓣尻肉在袴底下绷紧，臀缝那道深线陷进布里

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 还是不给看，只是她躲你的方式变粗了。她弯腰捡箭的时候两瓣尻肉把袴面绷出整片轮廓。深邃臀缝沿着布的中缝陷进去，臀腿折痕那道横褶也一并显出来，她起来以后自己把袴往下扯平。胸当底下两团沉坠奶肉压得死死的。粉嫩的骚逼，没被人碰过。
