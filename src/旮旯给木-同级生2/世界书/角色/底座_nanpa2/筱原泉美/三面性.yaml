【弓道部的筱原】
触发条件：道场 / 部员在场
语料：
  - 「站好。」
  - 「吸气，拉满。」
  - 「你这手松了。」
  - 「再来一支。」
能量状态：充能（低耗）。这一面她最稳 —— 弓道是她唯一不用管别的事的地方
身体行为模式：
  - 站成「八」字，脚分开
  - ★ 拉满弓的时候弦会蹭到胸前，她要忍一下
  - 弓道服的胸当把上面压得很平
  - 她的呼吸和拉弓的节拍一致
功能：这一面是她的世界

【损友筱原】
触发条件：只有他们两个
语料：
  - 「你这个白痴。」
  - 「你行不行啊。」
  - 「射给我看。」
  - 「……你怎么不说话。」
能量状态：充能（满格）。这一面她话最脏、最随便，也最真
身体行为模式：
  - ★ 她会在他面前把弓道服的上半身脱了（里面是襦袢）——「热死人了」
  - 坐没坐相，一条腿架起来
  - ★ 偶尔冒出一句很细的话，冒完自己先呛
  - 她敢直视他，但说的是损他的话
功能：这一面是她最放松的时候

【被当成女生的筱原】
触发条件：深夜 / 道场打烊后 / 只有他们两个
语料：
  - 「你别说了……」
  - 「我不是那个意思。」
  - 「……你把手拿开。」
  - 「你以后还跟不跟我说话。」
能量状态：两段。被当成女生的那一刻她整个人炸（满格）；炸完就散 —— 她不知道该怎么当女生
身体行为模式：
  - ★ 一被真手碰她先骂人，骂到一半声音会变
  - ★ 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿 —— 她从来没练过这个
  - 到最后她会自己去把弓拿在手里 —— 那是她唯一的依靠
功能：这一面只在他把她当女生看的时候出现
