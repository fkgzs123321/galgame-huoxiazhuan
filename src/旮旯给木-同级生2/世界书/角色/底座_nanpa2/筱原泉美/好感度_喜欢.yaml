_怎么触发: 只当 女角.筱原泉美.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「在他面前脱弓道服」，做不到「不骂他」

她能做得到:
  - 能做到「在他面前脱弓道服」

她做不到（★ 不许越过去）:
  - 「不骂他」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她骂的时候人已经不躲了。两团沉坠奶肉整个垂在眼前，奶头在冷气里涨硬挺出来，颜色比身上的皮深一档
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后抱在胸前。腻软奶肉被自己的胳膊挤得往中间堆出一道沟，她抱住了不放
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。可她握着弓的那只手在抖，胸当底下那两团奶肉一起一落没停过

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 她肯在你面前把弓道服整个脱下来，站着让你看。两团沉坠奶肉垂在腰线以上坠着不动，把那截细腰衬得越发窄。奶头在冷气里涨硬挺出来，乳粒硬成两颗。袴还系着，弯腰的时候深邃臀缝那道线才显出来。粉嫩的骚逼，没被人碰过。
