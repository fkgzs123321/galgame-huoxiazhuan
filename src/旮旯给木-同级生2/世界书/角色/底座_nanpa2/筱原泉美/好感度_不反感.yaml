_怎么触发: 只当 女角.筱原泉美.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「跟他一起练」，做不到「准他碰自己的弓」

她能做得到:
  - 能做到「跟他一起练」

她做不到（★ 不许越过去）:
  - 「准他碰自己的弓」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她骂的时候人没往后撤。两团奶肉在胸当底下一起一落，奶头随着呼吸隔着布一挺一挺
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后按在自己的大腿根上。两片腿根嫩肉被按出两道印，她按住了不挪开
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。腰线以上那两团沉坠奶肉跟着一起一落，她握弓的那只手一直在出汗

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 你终于看得见她拉满弓那一下。涨硬凸起的奶头被弓弦压出一道印，她忍一下才放箭。两团沉坠奶肉在胸当压不住的地方顶出一道弧，从领口露出来。腰线以下那两瓣尻肉还压在袴底下，一动就甩出横褶。也就这些。粉嫩的骚逼，没被人碰过。
