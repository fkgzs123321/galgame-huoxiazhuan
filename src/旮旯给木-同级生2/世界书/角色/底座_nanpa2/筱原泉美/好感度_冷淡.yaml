_怎么触发: 只当 女角.筱原泉美.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「只谈道场的事」，做不到「不提醒他明天有比赛」

她能做得到:
  - 能做到「只谈道场的事」

她做不到（★ 不许越过去）:
  - 「不提醒他明天有比赛」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她骂的时候人不躲。奶头隔着弓道服那层布硬着顶出来，她自己装作没这回事
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后插进袴的口袋里。两片腿根嫩肉在袴底下闷出一层薄汗，她站定不动
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。腰线以下那两瓣尻肉绷紧，脚下还是那个「八」字

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 看得见的只有练完那身汗。弓道服底下那层衬衣是潮的，贴在背上把那截细腰勒出一道印。两团奶肉在湿布底下透出两点深色，奶头隔着两层布硬着，她当着你的面也不换。那道肉缝连隔着袴闷出来的那股潮气都不给你闻。粉嫩的骚逼，没被人碰过。
