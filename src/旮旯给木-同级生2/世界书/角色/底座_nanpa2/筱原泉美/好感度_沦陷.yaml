_怎么触发: 只当 女角.筱原泉美.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「承认自己是女的」，做不到「在别人面前承认」

她能做得到:
  - 能做到「承认自己是女的」

她做不到（★ 不许越过去）:
  - 「在别人面前承认」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她骂的时候两条腿已经分开了。屄口那圈嫩肉泥泞得厉害，一收一收地淌，骚水顺着腿根往下爬，把大腿内侧拉出一条亮痕
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后攥住身下的袴。两瓣尻肉在她自己手里绷紧，深邃臀缝被攥出一道深线
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。这次她没把弓举起来，只是抱在怀里，两团沉坠奶肉压在弓臂上被挤扁

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 承认自己是女的以后，身上就没什么藏着的地方了。两瓣肥尻被掰开，深邃臀缝里那道肉缝整个露着。屄口那圈嫩肉一收一收地淌，腥甜屄水顺着大腿内侧往下爬，把身下那片布浸出一片湿痕。奶头硬着顶在空气里。她让你看着，嘴上还在骂。粉嫩的骚逼，第一次是他开的。
