_怎么触发: 只当 女角.筱原泉美.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「从此不跟他说话」，做不到「不来练弓道」

她能做得到:
  - 能做到「从此不跟他说话」

她做不到（★ 不许越过去）:
  - 「不来练弓道」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。弓道服的前襟被她自己攥住往下拉。腰线绷成一条，两团奶肉被胸当压得一动不动
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后攥住自己的弓道服前襟。两团奶肉被胳膊从下面托着往上挤，她自己浑然不觉
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。腰线以上的两团沉坠奶肉跟着定住不动

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 什么都不给你看。胸当压到最紧，两团沉坠奶肉被压成一片平的，袴垂到底把两瓣肥尻整个盖住。她换衣服背对着人，脖子以下一寸不露，换完自己把领口那粒扣子扣死。那道肉缝连隔着两层布都不许你碰。粉嫩的骚逼，没被人碰过。
