_怎么触发: 只当 女角.筱原泉美.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「当面损他」，做不到「不把箭筒借他」

她能做得到:
  - 能做到「当面损他」

她做不到（★ 不许越过去）:
  - 「不把箭筒借他」

她对你的态度: 「……你把手拿开。」

她会做什么:
  - 一被真手碰她先骂人，骂到一半声音会变。她骂的时候人往后撤半步。两团奶肉在胸当底下跟着一晃，奶头隔着那层布顶出两点
  - 那是她第一次不是「男生的口气」
  - 她自己都不知道手该放哪儿，她从来没练过这个。两只手最后叉在那截细腰上。腻软奶肉被自己的胳膊挤得往中间堆，她自己低头看不见
  - 到最后她会自己去把弓拿在手里，那是她唯一的依靠。那截细腰在弓握上手的瞬间挺直了。两团沉坠奶肉被弓弦压过那一下，她照样忍得住

她不会做什么（★ 边界的具体表现）:
  - 她不用女生口气说话（除非他自己发现了）
  - 她不提自己的家世
  - 她不承认自己在意

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 看得见的只有她凑上来损你那一下。两团沉坠奶肉压上你的手臂，腻软奶肉被挤得往两侧摊开一片，她自己往回撤半步，假装没这回事。腰线以下那两瓣尻肉还压在袴底下，一动就甩出横褶。领口以下不许看，那道肉缝连名字都不许你提。粉嫩的骚逼，没被人碰过。
