_怎么触发: 只当 女角.安田爱美.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「只做职责内的事」，做不到「对孩子也冷」

她能做得到:
  - 能做到「只做职责内的事」

她做不到（★ 不许越过去）:
  - 「对孩子也冷」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的那一下带子底下那截腰线绷紧，压痕上下溢出的软肉跟着收回去，僵完眼泪自己往下掉
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的位置就在腰上那个结上，把结抓得更紧
  - ★ 她越哭底下收得越紧，那道肉缝里一圈嫩肉往里绞成一团，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，布离开身子的那段工夫那两团先往下坠了一下才落回去

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 只做职责内的事，身体也一样。围裙在腰上打结打得死紧，前襟把两团沉坠奶肉收得只剩两个圆鼓，蹲下去的时候裙摆压住膝盖，两瓣尻肉绷出形状也被布整个兜住，臀缝那道线隔着裙面都看不出来。她背对着他收拾东西，带子底下焖了一整天的汗气散不出来，隔着两步能闻见那股皂味里混着的潮热。对孩子那部分她全给，对他那部分一寸都没有。
