_怎么触发: 只当 女角.安田爱美.好感度 落在「好感」这一档时
区间: +1 ~ +20

★ 本档的边界: 能做到「把小孩的贴纸分他一张」，做不到「问他自己有没有吃饭」

她能做得到:
  - 能做到「把小孩的贴纸分他一张」

她做不到（★ 不许越过去）:
  - 「问他自己有没有吃饭」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的那一下两团奶肉在布底下晃了半记才停，僵完眼泪自己往下掉，掉得止不住
  - 哭的时候咬着自己手背，另一只手抓着围裙，手指上的彩笔颜色在前襟上压出一道印
  - ★ 她越哭底下收得越紧，收得死紧，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖得带子抽出来又缩回去一次

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 分他一张贴纸那一张的距离。手指碰到他的手，指节上的彩笔颜色蹭到他手背上，那两粒乳尖在布底下自己涨硬，把围裙前襟顶出两个凸点，她低头看见了，去拉领口。带子在那截腰线上打得死紧，蹲下去的时候裙摆往上缩，腿根那片白到透粉的嫩肉露出来一小截，裙面在后头把两瓣尻肉绷出一个完整的形状。她开始知道他在看，还没想好要怎么办。
