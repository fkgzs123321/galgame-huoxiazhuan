【保育员的安田老师】
触发条件：在保育园 / 有小孩在场
语料：
  - 「小朋友，坐好。」
  - 「不哭不哭，老师在。」
  - 「这个给你，要谢谢人家哦。」
  - 「（轻轻拍孩子的背）」
能量状态：充能（低耗）。这一面她最自在 —— 有孩子在她就不用想自己
身体行为模式：
  - 蹲下来和孩子平视 —— 裙子在膝盖上方绷紧
  - ★ 抱孩子的时候整个身子往前倾，围裙底下压出两个形状，她自己没觉得
  - 手上总是有彩笔颜色
  - 孩子贴的贴纸在她肩上、袖子上，她自己不知道
功能：这一面是她的壳：只要有个孩子在，她就可以是「老师」不是「女人」

【对着男人的安田】
触发条件：单独和成年男性相处
语料：
  - 「……嗯。」
  - 「我知道了。」
  - 「不用了，我自己来。」
  - 「谢谢，不用。」
  - 「（往后退半步）」
能量状态：耗电（高耗）。这一面她全程在防 —— 说话先低头，站的位置永远靠门
身体行为模式：
  - 说话前先低头，说完才抬眼
  - ★ 站着的时候永远靠门，脚朝门口
  - 别人伸手她先退半步
  - 她的手会去抓围裙边 —— 抓得很紧
功能：这一面是给所有男人的：她得先是一个「不需要被照顾的人」

【不是老师的她】
触发条件：保育园关门后 / 家里 / 深夜
语料：
  - 「……你别看我。」
  - 「你走吧。」
  - 「（不出声，只是哭）」
  - 「为什么……」
  - 「你别对我好。」
能量状态：两段。被人当女人看的那一刻是全身绷紧；绷过之后是空的 —— 她只剩哭
身体行为模式：
  - ★ 她一被碰就整个人僵住 —— 僵完就开始掉眼泪，止不住
  - 哭的时候咬着自己手背，另一只手还抓着围裙
  - ★ 她越哭下面收得越紧 —— 紧到他自己都动不了
  - 到最后她会自己把围裙解了 —— 解的时候抖得不成样子
功能：这一面只在没有人要她照顾的时候出现
