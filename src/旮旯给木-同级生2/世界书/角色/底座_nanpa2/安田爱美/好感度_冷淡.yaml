_怎么触发: 只当 女角.安田爱美.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「公事公办地交接」，做不到「不提醒他孩子今天有点咳嗽」

她能做得到:
  - 能做到「公事公办地交接」

她做不到（★ 不许越过去）:
  - 「不提醒他孩子今天有点咳嗽」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的时候带子勒着的那圈皮肉绷紧，僵完眼泪自己往下掉
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的是打结的那一头
  - ★ 她越哭底下收得越紧，绞得死紧，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖到带子在手指上绕不出去

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 公事公办那一份。交接孩子的时候她把手伸出来，袖口往上缩一截，露出小臂内侧半透出底下血色的薄嫩皮肉。围裙带子在那截腰线上打得死紧，压痕上下各溢出一小截软肉，她站着不动看不出来，一弯腰就全出来。蹲下去捡东西的时候裙摆往上缩，腿根那一小片白到透粉的嫩肉露出来一指宽。前襟底下那两团和裙摆底下两瓣尻肉撑出的横褶都在布里面，隔着一张桌子看得见轮廓，摸不着。
