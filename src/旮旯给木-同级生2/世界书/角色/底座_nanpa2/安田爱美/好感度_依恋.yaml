_怎么触发: 只当 女角.安田爱美.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 能做到「让他抱着自己不哭」，做不到「说一句『你别走』」

她能做得到:
  - 能做到「让他抱着自己不哭」

她做不到（★ 不许越过去）:
  - 「说一句『你别走』」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的那一下围裙带子松开那一格跟着滑下去，僵完眼泪自己往下掉，掉得止不住
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的力道比上一档轻，是松着搭在那儿
  - ★ 她越哭底下收得越紧，清亮骚水顺着腿根往下爬，越爬越湿，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖得带子解开以后她还在原地站了一会儿

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: ★ 让他抱着自己不哭那一段，带子松了一格。那一格松开以后，那截细腰和底下从腰滑进臀缝的那道弧从勒紧里放出来一半，勒了一天的压痕还红着，红痕底下焖的汗气一并散出来。她靠过去的时候两团沉坠奶肉整个压在他胸口，被压得往两侧摊开。裙摆缩上去的工夫，腿根那两道腹股沟线一路亮到内侧那片嫩肉上。
