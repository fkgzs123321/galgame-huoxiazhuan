_怎么触发: 只当 女角.安田爱美.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「只照顾他一个人」，做不到「不把他当孩子」

她能做得到:
  - 能做到「只照顾他一个人」

她做不到（★ 不许越过去）:
  - 「不把他当孩子」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵完就开始掉眼泪，掉得止不住，泪水爬到下巴的那段工夫里面那圈肉已经在绞
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的是已经穿回去的那件，抓在腰上那个结上
  - ★ 她越哭底下收得越紧，里面一圈圈绞上来，收得死紧，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，这一档她解完会自己伸手去够他

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: ★ 全给，给完她要穿回去。捅开以后那圈嫩肉螺旋着往里绞，一抽一抽地收，收得死紧，拔都拔不出来；抽出去那一下带出来的清亮骚水顺着腿根往下爬，爬到大腿内侧留下一道水痕。两团沉坠奶肉被压得往两侧摊开，涨硬的乳粒顶在他掌心里。完事她第一件事是找围裙，带子打回死紧，勒出的那道压痕和上一次在同一个位置。第二天她照常蹲下去和孩子说话，好像什么都没发生。
