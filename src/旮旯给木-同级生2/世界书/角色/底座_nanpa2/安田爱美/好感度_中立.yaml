_怎么触发: 只当 女角.安田爱美.好感度 落在「中立」这一档时
区间: = 0（初始）

★ 本档的边界: 能做到「把他当成大孩子」，做不到「承认自己刚才多看了他一眼」

她能做得到:
  - 能做到「把他当成大孩子」

她做不到（★ 不许越过去）:
  - 「承认自己刚才多看了他一眼」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的时候胸前那两团在围裙底下顿了半记才停，僵完眼泪自己往下掉
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的时候把小孩往另一侧胯上挪
  - ★ 她越哭底下收得越紧，那圈嫩肉一收一收地绞，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，布一离开身子那两团先往下一沉

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 他把她当孩子看，她把身体当工作服用。抱孩子给他看的时候围裙前襟敞着，两团沉坠奶肉被小孩压得往两侧摊开，中间那道乳沟露着，她一点没觉得要收。蹲下去的时候裙面在后头绷出完整的形状，那道深邃臀缝陷进去一条线。带子在腰上打得死紧。她这一档什么都不瞒，因为她自己不觉得那有什么可瞒的。
