_怎么触发: 只当 女角.安田爱美.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「有他在就不进那个房间」，做不到「承认自己在绕」

她能做得到:
  - 能做到「有他在就不进那个房间」

她做不到（★ 不许越过去）:
  - 「承认自己在绕」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的那一下围裙前襟跟着绷平，僵完眼泪自己往下掉，掉得止不住
  - 哭的时候咬着自己手背，另一只手抓着围裙的边，抓得指节发白
  - ★ 她越哭底下收得越紧，里面一圈圈往里收，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖得带子在手上绕了两圈才解开

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 她绕着他走，他看得见的只有背影。有他在的那个房间她不进，走开的步子比平时快，两瓣尻肉一步一记把裙摆甩出横褶，甩到拐角才停住。围裙带子在腰上打得死紧，勒出的压痕上下溢出一小截软肉，她一转身那截软肉跟着晃一下。前襟底下两团沉坠奶肉顶出的那两道弧和蹲下时绷出来的形状都不是给他的，他只是刚好站在能看见的角度，裙摆掀起来的那一瞬腿根那片白到透粉的嫩肉露过一次，也是给风看的。
