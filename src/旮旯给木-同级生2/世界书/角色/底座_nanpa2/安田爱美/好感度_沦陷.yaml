_怎么触发: 只当 女角.安田爱美.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「在他面前把围裙解了」，做不到「不哭」

她能做得到:
  - 能做到「在他面前把围裙解了」

她做不到（★ 不许越过去）:
  - 「不哭」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的时候那两团已经从围裙里放出来，在空气里晃了半记，僵完眼泪自己往下掉
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的是解下来捏在手里的那一团布
  - ★ 她越哭底下收得越紧，收得死紧，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖得布落到地上她也没去捡

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: ★ 在他面前把围裙解了，这一档她整个人是放出来的。两团沉坠奶肉从两层布里整个出来，坠着的弧度往下压出一道乳沟，乳沟里焖的汗香和胸口的皂味混在一起扑上来。腰上那截压痕还没退，两瓣尻肉在裙摆底下把布撑出横褶。腿根那两道腹股沟线一路亮到那片白到透粉的嫩肉上，那道肉缝自己开着一线，清亮骚水顺着腿根往下爬。她哭着，哭的时候底下更紧。
