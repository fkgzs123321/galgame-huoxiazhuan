_怎么触发: 只当 女角.安田爱美.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「和他说孩子的事」，做不到「让他帮忙搬东西」

她能做得到:
  - 能做到「和他说孩子的事」

她做不到（★ 不许越过去）:
  - 「让他帮忙搬东西」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的那一下围裙前襟被绷出两个圆鼓，僵完眼泪自己往下掉，掉得止不住
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的力道把前襟往下拉，领口那道乳沟跟着露出一点
  - ★ 她越哭底下收得越紧，收得死紧，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖得那两团在布底下跟着晃

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 肯跟他说孩子的事，身体上多出来的只有蹲下来那一点。她蹲在他旁边和孩子说话，裙摆往上缩，露出腿根那一小片白到透粉的嫩肉，她自己没拉。围裙带子在腰上打得死紧，压痕上下溢出的软肉在蹲着的时候被挤得更明显，裙面在后头把两瓣尻肉绷出一个完整的形状，那道深邃臀缝陷进去一条线。前襟被两团沉坠奶肉顶出的两道弧离他不到一尺，他看得见形状，也只到形状为止。
