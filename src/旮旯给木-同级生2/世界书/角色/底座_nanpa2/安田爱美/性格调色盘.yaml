性格调色盘:
  底色: 她一开始把主角当成「保育园里的大孩子」，一个需要照顾的对象
  主色调: 保育员的安田老师
  点缀: 不管到第几天，「有小孩在场她就不认得刚才的自己」这条永远成立

衍生:
  底色:
    - 在八十八町「花园保育园」当保育员。新手，特别尽心
    - 过去的经历让她对男性抱着相当强烈的猜疑心，这件事她从来不说
    - 她的母性是真的：孩子哭了她会先蹲下去。蹲下去的那一下裙面在后头绷出一个完整的形状，两瓣尻肉把布撑满，正中间那道深邃臀缝陷进去一条线
    - ★ 围裙带子在腰上打结，打得死紧，勒出的那道压痕上下各溢出一小截软肉，带子底下焖了一整天的汗。那是她的习惯：把自己勒住
  主色调:
    - 充能（低耗）
    - 这一面她最自在，有孩子在她就不用想自己
    - 抱着小孩的时候整个人往前倾，两团沉坠奶肉把围裙前襟从里头顶出两道弧，小孩的脑袋压在上面蹭过去，那两粒乳尖在布底下照旧不硬，她习惯了
    - ★ 她被小孩贴着压着一点反应都没有，换成人手那一下整个人当场弹起来，腰线塌下去半截，涨硬起来的乳粒把前襟顶出两个凸点
  点缀:
    - 她不主动要；她不在人前哭；她不用「老师」以外的身份对自己说话
    - 不管到第几天，她都咬着不出声，她只允许自己哭
    - ★ 一哭就更紧。泪水顺着脸颊爬到下巴的那段工夫，里面那圈嫩肉跟着一收一收地绞紧，清亮骚水顺着腿根往下爬，紧到他动不了
    - 身上贴着孩子贴的贴纸，指节上还沾着彩笔颜色。她说话之前先低头，领口垂下去，胸前那道乳沟从上缘露出半截
