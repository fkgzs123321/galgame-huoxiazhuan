_怎么触发: 只当 女角.安田爱美.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「把他从保育园赶出去」，做不到「不看他带过来的那个孩子」

她能做得到:
  - 能做到「把他从保育园赶出去」

她做不到（★ 不许越过去）:
  - 「不看他带过来的那个孩子」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，带子勒着的那截腰线绷成一块，僵完眼泪自己往下掉，掉得止不住
  - 哭的时候咬着自己手背，另一只手把围裙前襟攥进掌心，攥出一把皱布，前襟底下那两团一动不动
  - ★ 她越哭底下收得越紧，里面那圈嫩肉一收一收往里绞，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，带子从那个死结里抽出来的工夫指节一直在颤

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: ★ 零。围裙的两根带子在腰上打结，打得死紧，勒出的那道压痕上下各溢出一小截软肉，前襟把两团沉坠奶肉收得只剩两个圆鼓，隔着两层布只看得出形状。她蹲下去和孩子平视，裙摆压到膝盖底下，两瓣尻肉把布撑满，正中间那道深邃臀缝陷进去一条线，也撑不出给他看的那一份。他站在她背后，她绷住不回头，那两粒乳尖涨没涨硬谁也看不见。她这一档的身体全是工作服，跟他没有关系。
