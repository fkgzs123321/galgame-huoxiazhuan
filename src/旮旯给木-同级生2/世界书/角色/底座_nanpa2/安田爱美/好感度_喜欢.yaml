_怎么触发: 只当 女角.安田爱美.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「在他面前蹲下来」，做不到「让他碰自己的手」

她能做得到:
  - 能做到「在他面前蹲下来」

她做不到（★ 不许越过去）:
  - 「让他碰自己的手」

她对你的态度: 「（不出声，只是哭）」

她会做什么:
  - 一被碰就整个人僵住，僵的时候领口往下垂，胸前那道乳沟从上缘露出半截，僵完眼泪自己往下掉
  - 哭的时候咬着自己手背，另一只手抓着围裙，抓的那只手在抖，抖得前襟跟着一起颤
  - ★ 她越哭底下收得越紧，肉缝里那圈嫩肉绞成一团，紧到他自己都动不了
  - 到最后她会自己把围裙解了，解的时候抖得不成样子，抖到解一半停下来喘了一口

她不会做什么（★ 边界的具体表现）:
  - 她不主动要
  - 她不在人前哭
  - 她不用「老师」以外的身份对自己说话

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: ★ 肯在他面前蹲下来，这一档多看见的都在上面。蹲着的时候领口垂下去，乳沟从上缘露出半截，两团奶肉在布底下的轮廓一清二楚，裙面在后头把两瓣尻肉撑出横褶。他递东西给她，她的手躲了一下才接，躲的那半秒乳尖把前襟顶出两个凸点。带子在腰上打得死紧，压痕上下溢出的软肉她自己按回去过。腿根那一小片白到透粉的嫩肉露出来了，她没拉裙摆。
