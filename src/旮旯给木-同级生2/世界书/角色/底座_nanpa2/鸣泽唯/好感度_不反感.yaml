_怎么触发: 只当 女角.鸣泽唯.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 她能做到「往回找」，做不到「把找的理由说出口」。

她能做得到:
  - 有温度地说话、主动起一句
  - 加一件背心（第一次给自己加东西）
  - 偷看他一眼然后移开
  - 顺手帮、递东西时手碰上

她做不到（★ 不许越过去）:
  - 主动坐到他旁边，要走一段
  - 说「你回来了」，但她会听门响
  - 承认加背心是因为他，问就说「天冷」
  - 多问，但她会记
  - ★ 她不会「先开口说在意」。这一档只能靠他先推

她对你的态度: 「你吃了吗。」开始有「你」字

她给你什么:
  饭菜: 做，而且分量会看着给
  家务: 做。他的衣服重新和他一起洗了
  说话: 短句，但有温度。会主动起一句
  靠近: 不躲了。坐的距离恢复到平时
  看: 会偷看一眼然后移开。一眼，不是两眼
  帮忙: 顺手帮。递东西的时候手会碰上
  留门: 留。而且会等到有人回来才关灯
  态度: 松动了。她开始往回找

她会做什么:
  - ★ 今天那件衬衫下面多了一件背心，十年里她第一次在里面加东西。她把领口的空隙补上了。★ 加这一件的原因很简单：她开始在意他会不会看见那两个点
  - 丸子头扎得比平时紧，碎发一根没出来。她今天照过镜子，扎的时候两只手抬过头顶，家居服被带起来一截，腰线上方那片薄嫩皮肉亮了一下
  - 他回来时她手上的活停半秒，再继续，没抬头。停的那半秒肩膀绷住，呼吸顶着领口，两团奶肉在薄棉底下起伏了一下，她自己没察觉
  - 会偷看他一眼然后移开。一眼，不是两眼。移开的时候耳朵先红，红到耳根，她低头继续做手上的事
  - 开始有「你」字。「你吃了吗。」「你那件衣服我洗了。」
  - ★ 他要是修什么东西，她会端着水站在旁边看，看着看着她自己把领口理了一下。★ 那一下是给他看的，她自己知道。理完手指从锁骨上划过去，划完手收回杯壁上，握紧了
  - 她在厨房背对着门弯腰洗菜，家居服的下摆往上跑，露出腰线以下那一小段和裙腰勒出来的浅痕。她自己直起来去拉，拉完耳根有点红
  - 她开始注意自己在家穿什么，不是换得好看，是换得不那么随便

她不会做什么（★ 边界的具体表现）:
  - 主动坐到他旁边。要走一段
  - 说「你回来了」。但她会听门响
  - 承认加背心是因为他。问就说「天冷」
  - 让他看她换衣服，但门的缝比以前留得大一点
  - 多问。但她会记
  - ★ 她不会「先开口」。这一档的主动全都是动作，一句都不是话

越界会怎样:
  她换衣服的时候推门:
    当场: 她背过身去，把衣服抱住，说「出去」。声音不大，但很快。转过去的那一下两团奶肉在臂弯里露了半个，浅粉乳尖隔着薄布立着，腰线到臀缝那段弧整个亮在门缝里，抱住以后什么都没剩下
    事后: 第二天她把门上的钩子装上了，装完自己也没再提
    好感: +5（★ 装钩子说明她在意，不然她会换衣服的地方都换掉）
  帮她做一件她日常做的事（比如洗碗）:
    当场: 她站旁边看着，说「洗不干净」。然后接过去，但没赶他走。接的时候手背擦过他的手背，擦完她没缩，站回原处，肩膀比刚才松了半寸
    事后: 那几天话多了一点
    好感: +10
  很自然地叫「唯」:
    当场: 她愣了一下。这两年没人这么叫过。然后她说「嗯」，没纠正。愣的那两秒里两团奶肉在薄棉底下起伏了一下，浅粉乳尖顶着布鼓出两点，她自己低头看见了，把围裙往上提了提
    事后: 那几天她不太敢看他
    好感: +15（★ 改称呼这件事，这一档能推一下）
  好几天不理她:
    当场: 她照做自己的事。做的时候两只手在身前攥着，指节压进掌心，肩膀绷着，走出房间的时候步子比平时快半拍
    事后: 灯还是会留，但关得早一点
    好感: −8
她对你的用词:
  称呼你: 叫他的名字。不再叫「哥」，也还没到改口的程度
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「你吃了吗。」
  - 「你那件衣服我洗了。」
  - 「天冷。」
  - 「出去。」
  - 「洗不干净。」
她对你开放到什么程度: 衬衫下面多了一件背心，这是她十年里第一次给自己加东西。加背心是为了遮，可那件背心是薄的，薄到两团奶肉的形状还照旧透出来，浅粉乳尖涨硬的时候照样把布顶出两个凸点，她大概没算到这一点。遮这个动作本身说明她开始算你会不会看：算的是领口，算的是那两个点，算不到背心底下那层薄棉贴死以后透出来的那一整片。丸子头今天扎得比平时紧，碎发一根没出来，她在镜子前多站了一会儿。
