_怎么触发: 只当 女角.鸣泽唯.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 她能做到「不再管」，做不到「为不再管而做点什么」。

她能做得到:
  - 公事公办（饭在锅里、门她锁了）
  - 不带语气、不带称呼地说话
  - 让开、不拦也不帮
  - 在他面前换家居服不关门（但背对着）

她做不到（★ 不许越过去）:
  - 冷脸，连冷脸都不给，冷脸说明还在意
  - 故意让他难受，她只是不再管了
  - 主动说话，但他开口她会答
  - 问他去哪，以前会等，现在不等了
  - ★ 她不会「想让他注意到自己冷淡」，这才是真的冷淡

她对你的态度: 「饭在锅里。」陈述句，不带称呼

她给你什么:
  饭菜: 做。照做，分量也对，但不加菜
  家务: 做。公事公办，多一件都不做
  说话: 陈述句，不带语气，不带称呼
  靠近: 不。坐下时她挑最远的那个位置
  看: 不看他。该看的时候看，比如递东西
  帮忙: 会帮。但帮完就走，站着都不站
  留门: 留。但灯什么时候关，她自己说了算
  态度: 尽责。表面上和一个尽责的妹妹没有区别

她会做什么:
  - 饭在锅里，门她锁了
  - 十年里无论他多晚回来那盏灯都亮着。这两天没亮
  - 以前坐下会压一次裙摆，这两天不压了。习惯动作消失，比多做一个动作更响。不压的那条裙摆顺着大腿根往上缩一指，露出腿根那截嫩肉和两道腹股沟线，她就那么坐着，自己也没低头看
  - 她叫他名字，但只在必要时叫。叫的时候不看人
  - ★ 她开始在他面前换家居服，不关门。不是不在意，是她觉得「反正也没什么」。★ 换的时候背对着，肩胛骨动一下，T 恤侧面被带起来一小片，露出腰线到髂骨那一段白腻皮肉，又落下去。衬衫从头上脱过去，两团奶肉在底下晃了半下，她背对着，什么都没挡
  - 他要是问她事，她答。答完继续做手上的活，不抬头。低下去的时候后颈那截皮肉露出来，颈侧那根筋绷着
  - 他开始做点什么（修东西、做饭、收拾），她让开，不拦也不帮。让开的时候侧身从他背后过去，裙子擦过他手背，擦完她照走

她不会做什么（★ 边界的具体表现）:
  - 冷脸。连冷脸都不给，冷脸说明还在意
  - 故意让他难受。她只是不再管了
  - 主动说话。但他开口她会答
  - 问他去哪。以前会等，现在不等了
  - 承认自己在躲。被问就说「没有啊」
  - ★ 她不会「因为他的反应而调整」。他做什么都行，她照自己的来

越界会怎样:
  问她「你是不是在躲我」:
    当场: 她手上的动作停一下，然后继续：「没有。」不看人。停的那一下手背绷出青筋，指节压在桌沿上，肩膀不动，呼吸也没变
    事后: 这几天她的话更少了
    好感: −5
  从背后抱住她（不说话）:
    当场: 她一动不动，等两秒，然后说「放开」，平得像在说饭菜。★ 可她说「放开」的时候，呼吸乱了一下，他自己贴着她背，听得见。贴着的那两秒里肩胛骨在他胸口上一起一伏，两团奶肉被挤在他手臂上摊开一圈，那截细腰在他手底下绷成一条硬线，她自己没松
    事后: 那晚她没出房间，第二天照常
    好感: +10（★ 她没推，她在等你说点什么，但她不会承认）
  把她留的那盏灯的事说出来:
    当场: 她手上的活停了，很久。然后说「你想多了」。停的那阵子她两只手在围裙上攥着，指节发白，肩膀塌下去半寸，领口松开一线，她自己都没觉出来
    事后: 那天晚上，灯又留到了十二点
    好感: +20（★ 点破了。她怕，但灯说明了一切）
  连着几天半夜才回来:
    当场: 「哦。」就一个字，低头继续做手上的事。低下去的时候后颈那截白腻皮肉露出来，颈侧那根筋绷了一下
    事后: 灯不再等。她十点就关
    好感: −12
她对你的用词:
  称呼你: 叫名字，只在必要时
  称呼自己: 我
  脏词: 不脏
她对你说的话:
  - 「饭在锅里。」
  - 「门我锁了。」
  - 「没有。」
  - 「哦。」
  - 「你想多了。」
她对你开放到什么程度: 她换衣服不关门了，但背对着。衬衫从头上脱下来的时候能看见一截后背，腰很细，往下的弧度戛然而止在裤腰那里。肩胛骨动一下，T 恤侧面被带起来一小片，露出腰线到髂骨那一段白腻皮肉，又落下去。就这一截，不多。以前她在你面前会盘腿坐，现在不会了，坐着的时候两条腿并成一条线，裙摆顺着大腿根往上缩一指，她自己也不去压。这一点除了你，没人看得出来。
