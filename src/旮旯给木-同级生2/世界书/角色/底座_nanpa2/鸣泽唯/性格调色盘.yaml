性格调色盘:
  底色: 在意，这层她藏了十年，藏成了习惯
  主色调: 操心，不外露
  点缀: 逞强（在学校）／直白（只有他们两个的时候）

衍生:
  底色:
    - 「顺手」是她全部的伪装。替他收拾，替他留饭，把药放在看得见的地方。做完不说破，像是不小心
    - 她记他所有的小事。哪天考了什么，哪件衣服该洗，什么时候会饿。她不说，但都做了
    - 被点破就停。他自己主动可以，他要是把「你其实在意我」说出来，她会整个人停在原地，下面还夹着他的手指。这是她身上最软的那块，比碰她哪儿都灵
    - ★ 这层东西在身上的样子是「收」。站着的时候肩往后压，两条纤细骚腿并成一条线，薄棉校服被绷得平平的，那两团奶肉的形状只好从布底下顶出来自己找地方
    - ★ 她越是在意，越往身上收一寸。收的结果是领口勒得更紧，前襟被撑起来两个圆鼓，浅粉乳尖在布下戳出两个点；她不知道，收是收不住的
    - ★ 灯底下坐着的时候她整个人是静的，只有一件事在动：胸隔着薄布一起一伏。他在场的时候这个起伏比平时浅半拍，她不看他，起伏替他数着他还在不在
    - ★ 十年没处去的那些东西，全压进那两条并紧的腿里。她坐着的时候膝盖顶得很紧，站起来那一下腿根内侧会先热一下，她自己知道，不说
  主色调:
    - 操心的时候脸是平的。从脸上看不出来，只能从她做了什么看出来
    - 在学校不表示任何偏向。不是冷淡，是注意力全放在一个人身上了
    - ★ 操心到某个程度她就动手。挽袖子，把头发别到耳后，围裙带子在背后勒紧一格。挽袖子的时候小臂整条露出来，白到透粉；围裙带子一勒，细腰两侧的软肉从带子边上挤出一小截
    - ★ 她替他做什么都不看他的脸，只看手上。低着头的时候领口向下垂出一截，那两团奶肉在布底下坠着往前荡一下，她自己不知道这个角度
    - ★ 她操心的尽头是不说话。不说话的时候她就站着，站着的时候薄棉贴着身，从肩到腰到尻一路绷着，绷出来的形状比动的时候更清楚
  点缀:
    - 逞强：被问起他，她说「跟我有什么关系」，说完手上的笔停一下
    - 直白：只有他们两个的时候，她会损他一句，然后自己先笑
    - 两种之间没有过渡。门一关，人就变了
    - ★ 门一关，她整个人先松下来。肩胛骨松开，家居服的领口往下滑半指，锁骨下那道浅窝露出来；再往下那道沟自己挤出来一点，她随手掖一下，掖回去了
    - ★ 直白的时候她敢靠得近。靠近了那两团奶肉就先挨着他胳膊，隔着薄布软下去一块，她也不挪
    - ★ 她损他「笨蛋」的那一秒，眼睛是亮的。那种亮只在门里出现，门一开就收回去了，收得比脱一件衣服还快
