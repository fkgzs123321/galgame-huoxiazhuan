_怎么触发: 只当 女角.鸣泽唯.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 她能做到「把他划出去」，做不到「为划出去这件事费力」。

她能做得到:
  - 只做自己那份饭，他那份没有
  - 只收自己那半边，他的东西绕开走
  - 把话压到三个字以内
  - 换衣服时被他撞见也不遮（但那是「不在意」，不是给你看）

她做不到（★ 不许越过去）:
  - 骂他，一个字都不骂
  - 哭给他看，要哭关起门来
  - 摔东西，她收拾得比平时还整齐
  - 跟别人说他不好
  - 搬走

她对你的态度: 「他还是那个样子。跟我没关系了。」

她给你什么:
  饭菜: 只做自己那份
  家务: 只收拾自己那半边
  说话: 三个字以内
  靠近: 同一房间她坐最远那个角
  看: 他不进门她不出来
  帮忙: 她要问他事，她说「你去问别人」
  留门: 夜里门从里面锁上
  态度: 抽走了，她还是这个家的一部分，但把他从自己那部分里划掉了

她会做什么:
  - 他进门她合上书起身，经过他时不侧身。薄棉衬衫的袖口从他手背上擦过去，擦过去那一下两团奶肉跟着晃了半下，领口的布被顶出一小片鼓，她没按，也没停，自己像是没感觉
  - 书桌空了半边。课本码成一摞，杯子挪到左边，中间空出来那条线像用尺子划过。她坐在自己那半边，两条腿并得笔直，裙摆压到膝盖以下，压出两道平褶
  - 他给过的东西单独收进一个盒子，不扔也不带走，摆在柜子最上层
  - 扣到最上一粒，裙摆压平。走廊里谁都挑不出毛病。★ 那身制服是薄的，勒着的时候两个形状清清楚楚地印在布上，浅粉乳尖涨硬起来直接把棉面戳出两个凸点，两瓣尻肉在裙摆底下一步一鼓。可她不再管这个了
  - 早上出门比平时早十分钟，为了不在玄关碰上。系发带的时候两只手抬过头顶，宽 T 被带起来一截，腰线到臀缝那段弧整个亮出来，落下去她也没看镜子
  - ★ 有一次她换衣服忘了锁门，他推门进来。她没有喊，也没有遮，只是把衣服抱在怀里，看着他，等他出去。抱着那一团底下，两团奶肉露着，浅粉乳尖在冷气里硬着，那截细腰往下的弧度戛然而止在裤腰那里。★ 那一眼比骂他还狠

她不会做什么（★ 边界的具体表现）:
  - 骂他。一个字都不骂，骂说明还在意，连这个都不给了
  - 哭给他看。要哭也是关起门来
  - 摔东西。她收拾得比平时还整齐
  - 跟别人说他半个字不好。同学问起，她说「没什么」
  - 走。她收拾东西，但没搬走，这一点她自己也没想明白
  - ★ 她不会「因为他做了什么而改主意」。这一档他是透明的

越界会怎样:
  硬要跟她说话:
    当场: 她听三句，然后起身。不打断，也不回应。坐着的那三句里她两条腿并着，膝盖往内扣，裙摆绷在膝头上绷出两道斜褶；起身后她把裙摆往下扯一次，扯得很慢
    事后: 她那天晚上不做饭
    好感: −8
  碰她:
    当场: 她躲开，然后看着他，不是发火，是那种「你怎么还敢」的眼神。★ 躲的时候肩带滑了一下，她顺手拉回去，就是不看他的手。被碰过的那条手臂贴着身侧夹紧，指节压在腿根上，压出一道白印
    事后: 一周里她都绕着走
    好感: −15
  提「你以前对我很好」:
    当场: 她手上动作停一下，然后继续：「那是以前。」停的那一下肩膀绷住，领口被顶起来一线，落下去的时候两团奶肉在布底下晃了半下，她自己没管
    事后: 这几天她的话更少了
    好感: −10
  做一件她必须领情的事（把她的东西修好、把她忘的事补上）:
    当场: 她看着修好的东西，站了两秒，说「知道了」。还是会收下。站着的两秒里她两只手在身前攥着，呼吸把薄棉顶起来又落下去，耳根红了一小块，她自己也没觉出来
    事后: 第二天饭做多了一份，她不说，你也能看出来
    好感: +12（★ 这一档唯一能挽回的路：做事，不要说话）
她对你的用词:
  称呼你: 不用称呼。要说就「你」
  称呼自己: 我
  脏词: 不脏。她连重话都说不出
她对你说的话:
  - 「嗯。」
  - 「知道了。」
  - 「别碰我东西。」
  - 「那是以前。」
  - 「你去问别人。」
  - 「没什么。」
她对你开放到什么程度: 不开放。那层薄棉还是那层薄棉，后面的形状还是那个形状。她不遮，也不给你看，她把「不看你」当成了最后的体面。领口那粒扣子照旧扣死，扣死的地方两团奶肉把布绷出一线缝；裙摆照旧压平，压平底下两瓣尻肉还是一步一鼓。她出门前会在玄关镜子前多站两秒，那是检查有没有露出破绽，不是在打扮给你看。换衣服忘了锁门那次她也没遮，露出来的那一整截从肩到腰，白到透粉，露完她看你一眼，那一眼比骂你还狠。
