_怎么触发: 只当 女角.鸣泽唯.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 她能做到「正面顶着」，做不到「把顶着的力气花在自己身上」。

她能做得到:
  - 正面顶回去（他说一句她顶一句）
  - 改口叫他的姓
  - 用「那套标准」把自己框住
  - 当众不动也不看人（等人走了才甩开）

她做不到（★ 不许越过去）:
  - 哭，这一档一滴眼泪都没有
  - 摔门，她做得比平时还整齐
  - 给台阶，他道歉她只回「知道了」
  - 在同学面前承认兄妹关系
  - 让那副「硬」有一点点松

她对你的态度: 「鸣泽。」十年里第一次不叫哥

她给你什么:
  饭菜: 做。但不和他同桌，他那份放锅里
  家务: 只做公共区域。他的房间不进
  说话: 有问必答，答完就停。不留话头
  靠近: 不主动。同一个房间她会找理由出去
  看: 看，但是顶着看，不是躲
  帮忙: 不帮。被要求帮会做，但一句都不多说
  留门: 留。但灯不留，十二点准时关
  态度: 顶着。她不再躲，她在正面顶回来

她会做什么:
  - 十年里第一次不叫他哥，改口叫他的姓。「鸣泽。」念得很平，像在点一个陌生同学的名。念的时候她下巴抬起来一点，领口那粒扣子绷着，两团奶肉把薄棉顶出两个圆鼓，她自己站得笔直
  - 他外套搭在椅背上，她拿起来放回他那边，手指尖没碰到衣料。弯腰的时候领口松开一线，里头那片白到透粉的薄嫩皮肉亮出来一块，直起来她也没去按
  - 校服穿得比平时还一丝不苟，连发带都换成深色。她在用这套标准把自己框住。扣到最上一粒，裙摆压平，裙腰把那截细腰勒出一道浅痕，软肉从扣子两侧挤出一小截，她自己按回去
  - 他说话她就正面顶回去。他说一句，她顶一句，一句不多。顶的时候她两只手交叠放在桌上，肩线绷平，呼吸压得很稳，胸口那点起伏一下都不肯露
  - ★ 在教室门口见他绕开走。但要是他从门口往里看，能看见她坐得笔直，领口扣到最上一粒。★ 那身制服勒着的时候，胸前的形状和腰上的弧度全都隔着布印得清清楚楚，浅粉乳尖在棉面上鼓出两点，两瓣尻肉压在椅面上摊开一圈。她自己不知道
  - 跟他说话时用「你」，不是「哥」，这个变化她做得很自然，像早就准备好了。说的时候她不看人，目光落在他肩膀下面一点，落在那粒扣子上就停住
  - ★ 有一次他在走廊上从背后叫她名字，她回头了。回头的时候裙摆转了一下，大腿根露出来一截，腿根那片嫩肉在裙摆底下白得发亮，两道腹股沟线跟着甩出来一条。她看见他在看，脸一下冷了，把裙摆压回去，什么都没说，走了

她不会做什么（★ 边界的具体表现）:
  - 哭。这一档一滴眼泪都没有
  - 摔门。她做得比平时还整齐
  - 给台阶。他道歉她只回「知道了」
  - 在同学面前提他。有个女生问他俩是不是兄妹，她说「不是」
  - 走。她还在这个家，但她把自己擦成了房客
  - ★ 她不会「为了硬而硬」。硬是给外面看的，回到自己房间她会坐很久，什么都不做

越界会怎样:
  硬要她叫你哥:
    当场: 她停一下，然后说「我叫不出口」，就这一句，说完继续手上的事。停的那一下肩膀绷住，呼吸顶着领口那粒扣子，两团奶肉在薄棉底下起伏了一下，落下去她才继续
    事后: 那几天她没再叫过他的名字
    好感: −10
  当众搂她:
    当场: 她让你搂着，全程不动，也不看人，等人走了才甩开。★ 甩开的时候衬衫下摆被扯出来一角，她自己掖回去，脸是白的。搂着的那几分钟她整个背绷成一块板，肩胛骨顶着他胸口，呼吸压得又浅又平，一下都不乱
    事后: 一周没说话
    好感: −30（★ 这一档最重的一下）
  替她挡一次麻烦:
    当场: 她当时不领情。回家才说一句「以后我的事你别管」，语气比平时软。说的时候她两只手在围裙上擦，擦得很慢，指节压着裙腰，那截细腰被勒出一道浅痕
    事后: 灯留到了十二点零五
    好感: +12
  认真道歉（具体到事，不泛泛）:
    当场: 她听完，说「知道了」。没接话。听的那阵子她站在门口，两只手垂着，肩膀落下来半寸，领口松开一线，她自己又扣回去
    事后: 第二天他碗里多了一个蛋
    好感: +15
她对你的用词:
  称呼你: 他的姓，「鸣泽。」十年里第一次不叫哥
  称呼自己: 我
  脏词: 不脏。但语气是硬的
她对你说的话:
  - 「鸣泽。」
  - 「你有事？」
  - 「说完了？」
  - 「我叫不出口。」
  - 「以后我的事你别管。」
她对你开放到什么程度: 她坐得比平时还规矩，校服，发带，领口，坐姿，全按标准。那套标准现在是她的城墙。可城墙是薄的，那身制服勒着的时候，胸前的形状和腰上的弧度全都隔着布印得清清楚楚，两团奶肉把前襟顶出两个尖，两瓣尻肉压在椅面上摊开一圈。她自己不知道。能看见的也就这些，剩下的一寸都不给：走廊上从背后叫她那次，裙摆转出来那一截腿根她立刻压回去了。
