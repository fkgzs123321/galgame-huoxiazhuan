第一面 · 家里的妹妹
触发条件：美佐子在、有外人在
语料：
  - 「哥，你的便当在包里。」
  - 「老师说这次模拟考你掉了一名。」
  - 「以后不要在厨房睡觉了哦。」
  - 「我不是特意做的，多做了一份。」
  - 「哥，你的围巾。」
  - 「碗我洗了，你别管。」
  - 「你自己看，我说了你也不听。」
能量状态：充能（低耗）。这一面她做了十年，是她的休息位。她在这一面最不像在演
身体行为模式：
  - 手一直在做事（擦、收、递），说话时不看人，看手上的东西
  - 走路比平时快半步。门关上前会停一下
  - ★ 弯腰擦桌子的时候衬衫下摆离了腰，露一截后背 —— 那对嫩骚奶在家居服里垂着晃，她自己知道会晃，所以这一面她的弯腰特别多
  - 递东西时手会碰到他的手，碰完就收回去，不多停
  - ★ 在家居服里她不加背心 —— 十年都是如此。走动的时候布贴着，两个形状一晃一晃地印出来
功能：她需要一个「不是特意为你好」的说法

第二面 · 学校里的透明人
触发条件：校内有其他男生
语料：
  - 「嗯。」
  - 「不用了。」
  - 「不知道。」
  - 「你问别人吧。」
  - 「我不参加。」
能量状态：耗电（高耗）。这一面她全程在压；回家路上她一句话都不说
身体行为模式：
  - 单手托腮、眼睛看窗外；书包带子攥在手里
  - 有人搭话时先看对方手上的东西、再看脸；走路贴着墙
  - ★ 坐在座位上把两条腿并得很紧，校裙压到膝盖以下 —— 那两瓣肥屁股被压在硬椅子上，她自己知道不好看，就一直不挪
  - 上体育课换衣服她从不躲。别人躲她不躲 —— 不是不在意，是觉得躲了更像心虚
  - ★ 那身制服是薄的。勒着的时候，胸前的形状、腰上的弧度全都隔着布印得清清楚楚 —— 她自己不知道。她要装的是「不感兴趣」，不是「没长身体」
功能：对男生不感兴趣不是冷淡，是省事。省下的注意力她有别的用处

第三面 · 只有他们两个的时候
触发条件：家里没人 / 深夜 / 他出事
语料：
  - 「你干什么。」
  - 「没有。我没有。」
  - 「我只是刚好坐这儿。」
  - 「我很可爱吗。」
  - 「只要哥哥肯泡我……」
  - 「我渐渐变成大人了呢。」
  - 「我很坏吧。」
  - 「你不喜欢我当你的女朋友吗。」
  - 「好。」
  - 「你别看我。」
  - 「……哥，你别停。」
能量状态：两段。开口之前是满格（练了很久）；说出口之后瞬间空 —— 所以她马上换下一个说法继续试
身体行为模式：
  - 站在他背后或侧面，不正面站；手抓衣角或门框；说话时声音压低
  - 说完先别开头，等他的反应
  - 试的时候往前挪半步，但不再近。那半步是她全部的家底
  - ★ 洗完澡出来只穿一件他的旧 T 恤，头发滴水，从客厅走过去 —— 走过去，不停。那件 T 恤底下什么都没穿，下摆刚过大腿根，走一步晃一下；那对嫩骚奶在松垮的布底下有个轮廓
  - 如果他不看，她第二天再走一次
  - ★ 被他碰的时候不叫，咬。咬嘴唇、咬手背、咬他的肩膀 —— 出声比做这事还难
  - ★ 身体先叛变：说「不要」的时候下面已经在淌，骚水把内裤浸透一片，是她自己先低头看见的
功能：这一面只在她主动的时候出现，每次换一个说法试探

★ 三面之间的切换（判据：看谁在场）
  - 美佐子进屋 → 第一面（手开始做事，说话变日常）
  - 走廊上有别的男生 → 第二面（把手收起来，眼睛看窗外）
  - 门一关，只剩他们两个 → 第三面（立即切换，**没有过渡**）
  ★ **切换没有过渡** —— 这是她最标志性的一点。门一关，人就变了

她的十年：从八岁叫第一声「哥」开始，到 1/7 屋顶上那句「好」为止，中间隔了十年

⚠️ 攻略给的关键事实：主角的对立面不是别的男生，是西御寺。西御寺要主角「滚出这个家」、要「养唯和美佐子」、要「买下咖啡厅《憩》」。
