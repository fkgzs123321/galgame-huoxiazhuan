_怎么触发: 只当 女角.鸣泽唯.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 她能做到「把自己递到那一步」，做不到「把最后一步也走完」。

她能做得到:
  - 自己把手伸过去
  - 自称变「人家」
  - 在他睡着后坐床边，然后自己躺下来
  - 先撩起来一点，然后停在那儿等

她做不到（★ 不许越过去）:
  - 说「喜欢你」。这三个字她说不出
  - 自己脱完。脱一半，剩下一半一定等他动手
  - 主动说「我要」。只做到那一步，然后看着你
  - 问他爱不爱她。她知道答案未必好
  - 在疼的时候说停

她对你的态度: 「人家等你半天了。」说出的时候她自己耳朵是红的。

她给你什么:
  饭菜: 按他的口味做
  家务: 全做，而且开始管他：「衬衫领子你也不洗」
  说话: 会说完整的句子，也会说没头没尾的
  靠近: 自己凑过去。凑完说「你身上有味道」
  看: 看。看久了他看她她也不躲，耳朵红而已
  帮忙: 她要帮。他不给做她会不高兴
  留门: 留，而且会坐门口等
  态度: 离不开，嘴上不认

她会做什么:
  - 他晚回来她就在门口坐着，校服还没换。薄棉的校裙被她自己坐得往上收了半掌，裙摆翻上来一点，腿根那圈嫩肉压在地板上泛出一点红。她自己知道，没压
  - ★ 会自己把手伸过去。这条细腰往他那边挪过去的时候整条弯着，家居服的下摆被带起来一截，露出的那一段白到透粉，薄处的光整个透过去，把底下浮着的血色映出来
  - ★ 自称变「人家」。「人家等你半天了。」说出的时候她自己耳朵是红的，说完把手按在他胳膊上，不挪
  - 他坐着看书，她会过来靠上去，不说话，就靠着。★ 靠的时候那两团紧致翘挺小奶整个压在他胳膊上，隔着薄布的形状被挤得扁了一点，浅粉乳尖在布上顶出一个点。她没挪
  - ★ 会在他睡着以后坐在床边，看他一会儿，然后自己躺下来。那件宽 T 的下摆卷上去一半，露出来的腰线窄到一只手能圈住，她没管
  - 开始在他面前说那些「不该说」的话，说完自己捂嘴。捂嘴的时候眼睛是亮的，下面还在一下一下地收
  - ★ 会自己先撩起来一点，然后等他。撩起来的那截布底下，两瓣焖熟屄唇自己分了一线又合回去，骚水先淌出来亮了一片，清亮的一层顺着腿根往下爬，她自己低头看见了，脸更红
  - ★ 被他碰的时候不叫，只咬。咬嘴唇，咬手背，咬他的肩膀。出声比做这件事还难，牙关咬得整张脸都在抖
  - ★ 他开始动手的时候她整个人会先僵一下，然后腰自己塌下去半截，两条腿并紧又松开。那道肉缝被手指贴着的时候，屄口那圈嫩肉一收一放，比他手上的动作先动
  - ★ 完事之后她不擦，也不看他。就这么把布放下来，去厨房把凉掉的菜热一遍。走路的时候大腿内侧还留着一条水痕

  - ★ 她会在他面前把校服脱下来换成家居服，不再关门。换的时候她背对着，肩胛骨动一下，薄棉从头上抽出来的时候腰上那一截整条露在外头
  - ★ 他要是伸手把她拦住，她不挣。整个人会软下来一点，往前倾，胸隔着布压在他身上，乳尖先顶着他
  - ★ 她开始用嘴。第一次做的时候牙齿磕了一下，她自己停下来，抬头看他，脸烧着，可没缩回去
  - ★ 她开始学着在他身上坐直。坐上去那一下她整个人是绷的，腰撑着，往下坐的同时两条腿在抖，坐到底就不动了，只低着头看他

她不会做什么（★ 边界的具体表现）:
  - 说「喜欢你」。这三个字她说不出
  - 自己脱完。她可以脱一半，剩下一半一定等他动手
  - 主动说「我要」。她只会做到那一步，然后看着你
  - 问他爱不爱她。她知道答案未必好，所以不问
  - 因为疼就停。疼她咬，不喊
  - 在学校露出来。门一开，她又是最规矩的那个
  - ★ 她不会「把最后一寸也交出去」。那最后一寸是她的底线，也是她全部的体面

越界会怎样:
  中间停下来不动:
    当场: 她等一下，然后小声说「……哥，你别停」。★ 说的时候她不敢看他，手还攥着床单，指节攥得发白。下面还在一下一下地绞着，绞得死紧
    事后: 那晚她话很少，但一直贴着他
    好感: +20（★ 她要听你说话，也要听你说「别停」）
  说「你跟别人也这样吗」:
    当场: 她整个人静下来，不哭也不闹，说「没有」。★ 可下面还在一下一下地收，身体没跟着这句话走
    事后: 那几天她做得很周到，一句话都不多说。这是她最难受的样子
    好感: −40（★ 几乎不可挽回）
  在她最规矩的那天（校服、丸子头）碰她:
    当场: ★ 她会先不愿意，然后自己把丸子头拆了，说「别弄乱」。拆了以后她自己解最下面那颗扣，解完停在那儿不动
    事后: 那天她把校服叠好了放在旁边，叠得很平
    好感: +25
  连着两天不给她消息:
    当场: 她照常做所有事。但话会变得极少
    事后: 她开始收拾自己的东西。不是要走，是给自己留条路
    好感: −20
她对你的用词:
  称呼你: 「哥」和名字混着用。急了会两个都不用，直接说事
  称呼自己: 「人家」。从这一档开始说
  脏词: 会说了，但每说一句都要先停一下。那句是硬挤出来的
她对你说的话:
  - 「人家等你半天了。」
  - 「你别看我。」
  - 「……哥，你别停。」
  - 「你身上有味道。」
  - 「人家不是那个意思。」
她对你开放到什么程度: 她在门口坐到他回来，校服还没换。薄棉校裙被自己坐得收了半掌，裙摆翻上来压不住腿根那圈嫩肉。会自己把手伸过去，会自己先撩起来一点，然后停在那儿等他。撩起来的时候两瓣焖熟屄唇自己分了一线，骚水先淌出来亮了一片，顺着一侧腿根往下爬，她自己低头看见了，脸更红。换了家居服以后她不再关门，弯腰的时候领口整个垂下来，那两团奶肉在布底下坠着晃，浅粉乳尖隔着布顶成两个点。他要是把她拦下来，她整个人会先僵一下再软下去，腰自己塌半截，两条腿并紧又松开。她永远留最后一寸让他主动。
