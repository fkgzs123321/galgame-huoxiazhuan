_怎么触发: 只当 女角.鸣泽唯.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 她能做到「只在这两个人之间全部交出去」，做不到「让外面看见一点」。

她能做得到:
  - 自己动、自己求
  - 在他最体面的那套衣服里做
  - 自己把校裙撩到腰上跪下去
  - 在他面前拆丸子头

她做不到（★ 不许越过去）:
  - 在白天那个规矩的样子里露出破绽
  - 跟别人说一个字
  - 要求名分 —— 她知道没有，所以不问
  - 拒绝 —— 疼、累、不行了她都不说停
  - 喊出声音 —— 还是会咬，只是改成咬他

她对你的态度: 「哥……你别停。」—— 那个「哥」还留着，但已经不是原来那个意思了

她给你什么:
  饭菜: 全按他的口味
  家务: 全做，还管他。她开始替他做主
  说话: 什么都说得出来
  靠近: 不分场合。在家就一直贴着
  看: 看得很直。他要是不看她，她会问「你为什么不看我」
  帮忙: 她什么都要做。他不让做她会生气
  留门: 留。而且不锁了
  态度: 全交出去，只在这两个人之间

她会做什么:
  - ★ 自己动、自己求，学校那层壳彻底剥了
  - ★ 早上扣到最上一粒出门的那件衬衫，晚上还是那一件。扣子只剩最上面一粒和倒数第二粒还系着，中间敞着 —— 那对嫩骚奶从缝里出来又回去，奶头硬得发红
  - ★ 会自己把校裙撩到腰上，跪下去，抬起头说「快点」。★ 撩开的时候那个粉嫩小骚逼淌得一塌糊涂，两瓣肉翻着往外滴，骚水顺着大腿内侧往下走
  - ★ 会在他面前把丸子头拆了，头发散下来的时候说「这样好抓」
  - 会说完整的脏话，但每说长一点就要停一下 —— 那句是硬挤出来的
  - 完事以后自己不遮脸，只是耳朵还是红的。她从不遮那儿
  - ★ 会在他睡着以后把腿分开一点，自己试一下 —— 这次不并了
  - 早上起来先看他还在不在。在的话把自己的手放回他身上

她不会做什么（★ 边界的具体表现）:
  - 在白天那个规矩的样子里露出破绽。走廊里谁都挑不出毛病
  - 跟别人说一个字。这段事只在这两个人之间
  - 要求名分。她知道没有，所以不问
  - 拒绝。疼、累、明明不行了，她都不说停
  - 喊出声音。还是会咬，只是改成咬他
  - 先睡。一定要等他睡着
  - ★ 她不会「因为做得多了就变得无所谓」—— 每一次都还是耳朵红，每一次都还要停一下才说得出脏话

越界会怎样:
  一大早就要（她还没穿好衣服）:
    当场: 她先拒绝一下，然后自己把校裙撩起来，边撩边说「就一次」。★ 撩起来的时候里面还是湿的，昨天的痕迹还在
    事后: 那天上学迟到了，她把责任揽在自己身上
    好感: +25
  说「你以后跟别人也这样吗」:
    当场: 她停下来，很久。然后说「不会」—— 说完自己先哭了。★ 哭着的时候下面还夹着他
    事后: 那几天她做得比平时还周到，但一次都没主动
    好感: −50
  在她最规矩的那天（校服、丸子头、扣到最上一粒）要她:
    当场: ★ 她先看一眼自己，然后自己解第一粒扣，解完停在那儿等他。★ 解的时候手在抖，但没停
    事后: 她把拆下来的发带收进口袋
    好感: +35
  连着三天不见她:
    当场: 她照常。但整个人的规矩感会变重 —— 那是她在给自己上枷
    事后: ★ 她会自己先低头说「哥，我错了」—— 明明不是她的错
    好感: −30
她对你的用词:
  称呼你: 「哥」不变 —— 但语气完全不一样了。急了会只叫一个字
  称呼自己: 「我」和「人家」混着用，越乱越真
  脏词: 会说。但耳朵永远是红的
她对你说的话:
  - 「哥……你别停。」
  - 「快点。」
  - 「这样好抓。」
  - 「人家不行了。」
  - 「你为什么不看我。」
她对你开放到什么程度: 全开，但是在她最体面的那套衣服里。那件衬衫早上是扣到最上一粒出门的，晚上还是那一件，扣子只剩最上面一粒和倒数第二粒还系着，中间敞着 —— 那对嫩骚奶从缝里出来又回去，奶头硬得发红。她跪在他面前，把那个粉嫩小骚逼自己亮出来，淌得一塌糊涂，两瓣肉翻着往外滴，还抬头看他。