_怎么触发: 只当 女角.永岛佐知子.好感度 落在「好感」这一档时
区间: +1 ~ +20

★ 本档的边界: 能做到「给他讲这地方的旧事」，做不到「问他会不会带久美子走」

她能做得到:
  - 能做到「给他讲这地方的旧事」

她做不到（★ 不许越过去）:
  - 「问他会不会带久美子走」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松了一格，腰腹软肉从两侧挤出一小截不再被压平，前襟散开的那道缝露出乳沟上端
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。僵住的两息过去两团奶肉先沉下去，整片腿根跟着潮起来，腥甜的骚水漫到腿根把里衣洇湿一片
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 腰带肯松一格。跪坐时腰腹那截软肉从带子两侧挤出一小截，按下去柔韧回弹；前襟散开的那道缝里能看见乳沟上端，乳丘下缘压着衣缘陷出的压痕随呼吸挪动，缝里冒出焖了一整天的汗意。他的手贴上去，两团沉坠奶肉顺着掌心往下坠，坠到乳丘下缘压住他的指根，乳粒隔着里衣顶在他掌心里硬住。腿根那两道腹股沟线在他凑近的时候陷得更深，绷到泛白的沟底嫩肉一直焖着体温散不出去。
