_怎么触发: 只当 女角.永岛佐知子.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「为了他把旅馆抵出去」，做不到「在久美子面前不装作什么都没发生」

她能做得到:
  - 能做到「为了他把旅馆抵出去」

她做不到（★ 不许越过去）:
  - 「在久美子面前不装作什么都没发生」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。和服整个褪到腰间，两团奶肉随呼吸起伏，被攥住时腻软奶肉从指缝里一道道挤出来鼓成肉棱
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。两息过去整条肉缝已经泥泞，屄口被撑开吞进去，抽出来那一下带出的黏液顺着腿根往下淌
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 会改口
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 和服整个褪到腰间，腰带松垮地挂在胯上。两团沉坠奶肉随呼吸起伏，被攥住的时候腻软奶肉从五指缝里一道道挤出来鼓成肉棱，指根压着的那圈乳晕被挤得往外摊开半圈。两瓣尻肉被压平摊开又翻出肉浪，臀沟焖出的潮气一路冒上来。下身那道泥泞淫屄整根吞进去，撑成屌形的肉腔裹紧不放，抽出来时带出的黏液顺着腿根往下淌到膝弯，淌出的那道水痕到第二天清晨还在。
