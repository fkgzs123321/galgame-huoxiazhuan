【永岛旅馆的老板娘】
触发条件：有客人在 / 女儿在场
语料：
  - 「欢迎光临。」
  - 「房间已经备好了。」
  - 「久美子，去把水烧上。」
  - 「旅费的事，不急。」
能量状态：充能（低耗）。这一面她做了十年，一个动作都不会多
身体行为模式：
  - 跪坐迎客，双手叠在膝上，脖子是直的
  - ★ 起身时和服前襟会重新沉下去
  - 说话时看对方的领口高度，不看脸
  - 算盘打得极快，眼睛不看手上的珠子
功能：这一面是她的岗：她是永岛旅馆的老板娘，这个身份比她自己重要

【一个人扫落叶的佐知子】
触发条件：清晨 / 没有人
语料：
  - 「（不说话）」
  - 「今年的叶子落得早。」
  - 「（停了很久）」
能量状态：充能（满格）。这一面她什么都不做 —— 扫叶子是唯一一件「做完就没了」的事
身体行为模式：
  - ★ 清晨她会把和服下摆掖起来扫，露出小腿
  - 扫到一半会直起腰歇一下，手撑着扫帚
  - ★ 那半小时她脸上什么都不挂 —— 那是一天里唯一的时候
  - 有声音她立刻就恢复成老板娘的样子
功能：这一面是她唯一自己的时间

【决定了的佐知子】
触发条件：深夜 / 廊下 / 只有他们两个
语料：
  - 「……你过来。」
  - 「久美子睡了。」
  - 「这十年，我没让人碰过。」
  - 「你别跟她说。」
  - 「（不出声）」
能量状态：两段。决定之前是满的（她在算后果）；一旦决定了就比谁都放得开 —— 因为她不再犹豫
身体行为模式：
  - ★ 她自己解开腰带 —— 解得很慢，但一步都不停
  - 他碰她的时候她会先僵住，然后湿得很快 —— 她自己也愣了一下
  - ★ 完事以后她第一件事是把和服重新系好，系得和刚才一模一样
  - 第二天清晨她照常扫叶子，一句都不多
功能：这一面只在深夜、只在没有人看见的时候出现
