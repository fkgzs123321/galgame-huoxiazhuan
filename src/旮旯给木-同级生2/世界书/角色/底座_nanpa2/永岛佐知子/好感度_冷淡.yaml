_怎么触发: 只当 女角.永岛佐知子.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「公事公办」，做不到「不给他多上一道菜」

她能做得到:
  - 能做到「公事公办」

她做不到（★ 不许越过去）:
  - 「不给他多上一道菜」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松开那一下腰腹软肉从两侧挤出一小截，她停了两息，又自己系回去，系得比刚才紧
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。绷住的两三息过去，里头一圈腔肉才自己松开，清亮骚水从屄口漫出来顺着腿根往下爬，爬到腿根中段停住
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 她肯让他跪坐在近处看。前襟那两道斜褶，乳丘下缘陷出的压痕，后摆被两瓣尻肉印出的形，这些中距离才看得见的东西都给了他。交领底下那一小片暗影随呼吸一起一伏，起伏的幅度比她说话的语气大。他伸手过去掌根压在腰侧，那道沟陷下去又弹回，弹回的时候她把交领往上拢了半寸，底下那道熟骚逼依旧合着，一线都没开给他看。
