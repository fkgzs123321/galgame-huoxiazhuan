_怎么触发: 只当 女角.永岛佐知子.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「当面说出他失礼」，做不到「把账本上的那笔抹掉」

她能做得到:
  - 能做到「当面说出他失礼」

她做不到（★ 不许越过去）:
  - 「把账本上的那笔抹掉」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松开那一下腰腹软肉从两侧挤出一小截，然后她当着他的面重新系了一次，系的时候腰侧那道沟陷得比刚才深
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。僵住的两息里两瓣尻肉往里夹，松开的时候屄口那圈嫩肉已经一开一合，清亮骚水漫到腿根就没再往下走
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 她开始在他面前整理衣襟。领口散开一线又拢回去，那一线里能看见乳丘上端和锁骨勾出的两道浅窝，拢回去的时候两团奶肉被从两侧挤得更深。腰带的结她当着他的面重新系过一次，系紧时腰腹软肉从带子两侧挤出一小截，系完再压平。跪坐时后摆铺开摊在木板上，两瓣尻肉的形从布下透出来，他看得见轮廓，看不见肉。
