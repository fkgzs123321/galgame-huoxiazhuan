_怎么触发: 只当 女角.永岛佐知子.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「以后不亲自接待」，做不到「不看他有没有回来」

她能做得到:
  - 能做到「以后不亲自接待」

她做不到（★ 不许越过去）:
  - 「不看他有没有回来」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松开那一下腰腹软肉从两侧挤出一小截，随即被重新勒回去，交领始终合着
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。僵住的两息里两瓣尻肉往里夹，等松开的时候里衣上已经洇出一小片湿痕，那片湿痕她自己回去洗
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 隔着布的形状开始漏出来。她跪坐迎客时前襟被两团奶肉撑出两道很深的斜褶，褶底压着的那圈软肉从衣缘里挤出一小截；起身那一下后摆贴着两瓣尻肉走了一遍，从臀腿折痕一路印到深邃臀缝上端才松开。布底下的一概不给，乳丘下缘陷出的压痕与腰侧那道沟全收在厚布里头，只在他凑近的时候飘过来一点腰带底下焖了一整天的汗意。
