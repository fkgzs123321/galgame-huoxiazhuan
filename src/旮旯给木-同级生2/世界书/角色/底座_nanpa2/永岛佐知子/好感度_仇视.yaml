_怎么触发: 只当 女角.永岛佐知子.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「请他退房」，做不到「不给他留一间最好的房」

她能做得到:
  - 能做到「请他退房」

她做不到（★ 不许越过去）:
  - 「不给他留一间最好的房」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松开那一下腰腹软肉从两侧挤出一小截，随即被重新勒回去，她在他面前始终合着交领
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。僵住的两息里两瓣尻肉往里夹，屄口那圈嫩肉收紧，接下来清亮骚水自己漫出来，隔着里衣一块布都没湿到外面
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 一片布都不给他看。交领合到顶，袖口盖住手腕，跪坐时下摆压平铺在地板上，全身只剩领口那截皓颈和锁骨勾出的两道浅窝露在外面。走动时两团奶肉在和服底下坠着晃，隔着浆过的厚布只看得出前襟偶尔被顶起一下，随即被衣缘压回去。他伸手过去，整片腰腹先绷紧，绷到他收手为止，底下那道熟骚逼连一线缝都不给他开。
