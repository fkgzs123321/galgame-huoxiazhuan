_怎么触发: 只当 女角.永岛佐知子.好感度 落在「中立」这一档时
区间: = 0（初始）

★ 本档的边界: 能做到「把他当一位常住客」，做不到「承认自己多留了一间房」

她能做得到:
  - 能做到「把他当一位常住客」

她做不到（★ 不许越过去）:
  - 「承认自己多留了一间房」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。带子松开那一下腰腹软肉从两侧挤出一小截，前襟散开一线，她停在那儿没有拢回去
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。两息之后两瓣尻肉松开，屄口那圈嫩肉一开一合，清亮骚水顺着腿根往下爬，爬到膝弯被下摆接住
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 常住客的距离。她在廊下跪着陪他说话，后摆铺开摊平，大腿与膝弯的形从布下整个透出来。交领底下那一小片暗影随呼吸起伏，乳粒隔着里衣涨硬顶出的两个凸点在逆光里浮出轮廓。他伸手过去，掌心覆在腰侧那道沟上，沟底焖了一天的汗意沾上他的指腹，两团奶肉跟着往下沉了半寸。再往下的那一整片，布还压着。
