_怎么触发: 只当 女角.永岛佐知子.好感度 落在「喜欢」这一档时
区间: +21 ~ +45

★ 本档的边界: 能做到「深夜在廊下等他」，做不到「说自己这十年怎么过的」

她能做得到:
  - 能做到「深夜在廊下等他」

她做不到（★ 不许越过去）:
  - 「说自己这十年怎么过的」

她对你的态度: 「这十年，我没让人碰过。」

她会做什么:
  - 她自己解开腰带，解得很慢，但一步都不停。最外面那层被她解开一次，解到一半停住，停住的那工夫里整片腰腹和两瓣尻肉的形状从松掉的布下显出来，然后她自己又系上
  - 他碰她的时候她会先僵住，然后湿得很快，她自己也愣了一下。两息过去屄口那圈嫩肉已经合不拢，清亮骚水从屄口漫出来顺着腿根往下爬，爬到膝弯还在往下走，她夹着腿也拦不住
  - 完事以后她第一件事是把和服重新系好，系得和刚才一模一样。腰侧那道沟勒回原处，前襟重新合到顶，乳丘下缘的压痕被整个收进布里
  - 第二天清晨她照常扫叶子，一句都不多。弯腰的弧度与前一天分毫不差，跪下去膝头压着的地方还泛着酸

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不跟女儿解释
  - 她不为自己的事开口

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 她肯在他面前解开最外面那层，解到一半停住。带子一松，腰腹软肉从两侧挤出一小截，两瓣尻肉在腰带底下往横里铺开，散开的前襟把乳沟露出大半，乳丘下缘压着衣缘陷出的压痕整个显形。停住的那两息里呼吸变浅，两团奶肉一起一伏把领口顶开，乳粒在里衣上顶出两个凸点。系回去之前屄口那圈嫩肉已经自己松开一线，清亮骚水漫到腿根，把里衣洇出一片她回去才发现的湿痕。
