性格调色盘:
  底色: 她把主角当成「客人」，一开始就是这样
  主色调: 永岛旅馆的老板娘
  点缀: 不管到第几天，「只要有客人在，她就是那个老板娘」这条永远成立

衍生:
  底色:
    - 丈夫去世后，独自一人经营永岛旅馆，把女儿久美子拉大
    - 她很关心久美子，但偶尔也会保护过度。她怕女儿重复自己的路
    - 她每天清晨在廊下扫落叶，那是她唯一不做事的时候。弯腰时整团乳肉从领口垂坠下去，起身时后摆被两瓣尻肉从里头顶起来把形印在布面上，那半小时里没人看着，她的身子比白天松
  主色调:
    - 充能（低耗）
    - 这一面她做了十年，一个动作都不会多。跪下去膝头压着后摆铺开摊平，起身那一下和服后摆贴着两瓣尻肉走一遍，走完就松，十年里没有多出任何一个多余的动作
  点缀:
    - 她不在客人面前失态；她不跟女儿解释；她不为自己的事开口
    - 不管到第几天，她都不会主动说「我要」，她只会说「你过来」。说这句的时候交领拢得更高，乳丘下缘压着衣缘陷出的那道压痕一动不动，露在外面的只有领口那截皓颈
