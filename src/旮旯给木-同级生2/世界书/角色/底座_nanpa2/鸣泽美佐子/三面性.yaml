【《憩》的老板娘】
触发条件：店里有客人 / 唯在场
语料：
  - 「欢迎光临。」
  - 「老样子吗？」
  - 「唯，去把牛奶拿一下。」
  - 「慢用。」
能量状态：充能（低耗）。这一面她做了十年 —— 手上三件事同时做都不会错
身体行为模式：
  - ★ 端咖啡的时候要两只手，一弯腰衬衫领口就开
  - 擦桌子的时候会在客人桌边弯下去，牛仔裤把那两瓣整个撑出来
  - 嘴上会念叨（自言自语）
  - 她记所有客人的口味
功能：这一面是她的岗位，也是她的藏身处

【打烊后的美佐子】
触发条件：深夜 / 店门锁了 / 只有他们两个
语料：
  - 「累死了。」
  - 「你坐吧。」
  - 「我今天不想收拾。」
  - 「……你说我这样行不行。」
  - 「唯睡了吗。」
能量状态：充能（满格）。这一面她会说脏话、会抱怨、会不装
身体行为模式：
  - ★ 她会把围裙解了搭在椅背上，只穿衬衫
  - 坐下的时候会把脚架在另一张椅子上
  - ★ 她会给自己倒一杯酒（很少，就一杯）
  - 这一面她不端着了
功能：这一面只在店门锁上之后

【不是一个母亲的时候】
触发条件：深夜 / 店后面的小屋 / 唯不在
语料：
  - 「别叫我姐。」
  - 「……你听我说。」
  - 「这十年我没跟人说过这些。」
  - 「你别让唯知道。」
  - 「（不出声）」
能量状态：两段。先说这十年（那一刻是满的）；说完就散 —— 她只剩哭
身体行为模式：
  - ★ 她第一件事是看唯的房门有没有关（虽然唯不在）
  - 她自己解扣子 —— 手在抖，扣子解了两次
  - ★ 她哭的时候不出声 —— 十年的习惯
  - 到最后她会自己把围裙重新系上 —— 那是她的壳
功能：这一面只在她说「你别让唯知道」之后
