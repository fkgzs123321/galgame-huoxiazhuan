_怎么触发: 只当 女角.鸣泽美佐子.好感度 落在「冷淡」这一档时
区间: −40 ~ −21

★ 本档的边界: 能做到「点单、上单、结账」，做不到「不问他最近考得怎么样」

她能做得到:
  - 能做到「点单、上单、结账」

她做不到（★ 不许越过去）:
  - 「不问他最近考得怎么样」

她对你的态度: 「这十年我没跟人说过这些。」

她会做什么:
  - 她第一件事是看唯的房门有没有关（虽然唯不在）
  - 她自己解扣子 —— 手在抖，扣子解了两次
  - 她哭的时候不出声 —— 十年的习惯
  - 到最后她会自己把围裙重新系上 —— 那是她的壳

她不会做什么（★ 边界的具体表现）:
  - 她不在客人面前失态
  - 她不让唯知道
  - 她不承认自己一个人

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 常年没人碰的熟骚逼。她自己解扣子 —— 手在抖，扣子解了两次
