性格调色盘:
  底色: 她把他当成「店里的孩子」—— 十年了
  主色调: 《憩》的老板娘
  点缀: 不管到第几天，「有客人在她就是老板娘」这条永远成立

衍生:
  底色:
    - 是唯的亲生母亲。丈夫早逝（唯八岁那年出事）
    - 一人独力经营咖啡店《憩》—— 那是她们母女俩的命
    - 她对主角而言也是近似母亲的存在 —— 他八岁起就常在她店里
  主色调:
    - 充能（低耗）
    - 这一面她做了十年 —— 手上三件事同时做都不会错
  点缀:
    - 她不在客人面前失态；她不让唯知道；她不承认自己一个人
    - 不管到第几天，她第一件事永远是看唯的房门
