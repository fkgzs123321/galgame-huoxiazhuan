_怎么触发: 只当 女角.南川洋子.好感度 落在「沦陷」这一档时
区间: +71 ~ +95

★ 本档的边界: 能做到「承认自己怀孕了，要结婚」，做不到「说一句『我喜欢你』」

她能做得到:
  - 能做到「承认自己怀孕了，要结婚」

她做不到（★ 不许越过去）:
  - 「说一句『我喜欢你』」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来的那阵她连车都不骑了，人整个慢下去，两团奶肉比从前涨出一圈，把背心前襟顶得悬起来靠着那两个尖在布上蹭。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来发白。揪着的那只手到头来顺下去改攥他的手腕，攥着就不撒手了。
  - 她不会主动靠过来，他凑上去她也不躲，只是这一回她整个人是软的，两条胳膊没有一处使劲的地方，嘴里的脏话到最后也不剩几句。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。埋下去那阵整个人往他身上塌，塌下去的分量全先压在那两团顶到他的奶肉上。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 牛仔裤最上面那颗扣松了一格，坐下去两片软肉从扣子两侧挤出来挤成一小圈，深邃臀缝在座面上被压得更深。背心让两粒涨硬凸起的奶头从里头顶着，隔着布连那两点的深色都浮得出来，两团沉坠奶肉比起从前整整涨了一圈，涨出来的那片绷到白到透粉。
