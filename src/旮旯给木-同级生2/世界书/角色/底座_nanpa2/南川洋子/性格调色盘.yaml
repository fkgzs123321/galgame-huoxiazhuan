性格调色盘:
  底色: 她和主角是「孽缘」。从一年级吵到三年级
  主色调: 机车行的老板娘
  点缀: 不管到第几天，「嘴上还在骂」这条永远成立

衍生:
  底色:
    - 家里经营机车行。她是独生女，从小在车库里长大
    - 从一年级起就和主角经常吵架，到三年级连她自己都说不清是为什么了
    - 她的兄弟川尻信良喜欢她，托主角传话。主角传话的时候添油加醋，鼓励她「勇敢追求梦想」
  主色调:
    - 充能（低耗）
    - 这一面她最真。十根指头的缝里嵌着洗不掉的黑油，洗洁精泡过也是那层底色。头发一把抓到头顶扎紧，扎上去那一下整条后颈和两边肩头全摊开在外头。说话随便，坐相也随便，一屁股坐下时两瓣尻肉就那么摊着被她自己压平成一片，那条腰线在油污背心底下跟着一呼一吸地绷。伏到车头上去的时候两团沉坠奶肉顺着重力从领口坠下去，把这具白腻肉躯的反光铺在引擎盖上。
  点缀:
    - 她不示弱；她不说「我喜欢你」；她不为任何人放弃骑车
    - 不管到第几天，她都不会主动说软话，话到嘴边全让那副身子替她说出去了。
