_怎么触发: 只当 女角.南川洋子.好感度 落在「好感」这一档时
区间: +1 ~ +20

★ 本档的边界: 能做到「修车的时候让他在旁边看」，做不到「承认自己刚才在等他来」

她能做得到:
  - 能做到「修车的时候让他在旁边看」

她做不到（★ 不许越过去）:
  - 「承认自己刚才在等他来」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来她就当没他这个人似的继续拧螺丝，俯下去那一下领口张开，看进去是小半片腻软奶肉和那道刚起来的沟，两瓣尻肉跟着这个折角提到全身最高的一处，深邃臀缝在牛仔裤底下被撑出两道斜褶。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来发白。揪完不松开，就这么揪着把人往自己车这边一路带过去。
  - 她不会主动靠过来，他凑上去她也不躲，只是手上的活照做不误，扳手拧到一半才想起嘴里的脏话还没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。油污的两只手悬在半空不敢碰他，悬到发酸才垂下去。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 她俯下去干活的时候，顺着领口能看进去小半片奶肉，连那道刚起来的沟都能看见它的起点。她不直起身，也不伸手把领口拢上。
