_怎么触发: 只当 女角.南川洋子.好感度 落在「依恋」这一档时
区间: +46 ~ +70

★ 本档的边界: 能做到「让他坐后座」，做不到「问他愿不愿意一直坐」

她能做得到:
  - 能做到「让他坐后座」

她做不到（★ 不许越过去）:
  - 「问他愿不愿意一直坐」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来她把车停稳扭腰朝后递一句「上来」，扭过来的那半边背在他贴上去之前先僵了一息，松下来的那口气把背心从那条腰线处吹得陷进去一道。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来发白。揪完把人往自己背后一带，那两只手抓着就不撒手了。
  - 她不会主动靠过来，他坐上来她也不躲，只是把腰一直挺着不敢往后靠实，两条丰润长腿把车身夹得死死的，嘴里的脏话一句没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。埋着的那阵他的两只手正圈在她腰上，圈住的那两处软肉被按下去再没弹回来。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 骑车的时候整条后背交出去由他贴着，深邃臀缝从座垫前缘一路上提到他坐上去的地方。两瓣尻肉厚厚地摊在座垫两侧，由他两条大腿从外面夹住，一路夹到停车为止。
