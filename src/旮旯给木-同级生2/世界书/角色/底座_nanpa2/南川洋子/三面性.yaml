【机车行的老板娘】
触发条件：在车行 / 家里
语料：
  - 「零件在那边，自己拿。」
  - 「这车我修，你别碰。」
  - 「饭在锅里，我不回来吃。」
  - 「我爸呢？」
  - 「……你手别抖啊。」
能量状态：充能（低耗）。这一面她最真 —— 手上油污、头发扎起来、说话随便
身体行为模式：
  - 跨在机车上拧螺丝，腰弯下去，牛仔裤在胯上绷紧
  - ★ 起身的时候布料从两瓣中间滑出来，她自己不去理
  - 抹机油的时候手背会蹭到脸颊，留下一道黑
  - 她这一面会笑 —— 而且是那种没防备的笑
功能：这一面是她唯一不用防着谁的地方

【学校里的问题儿童】
触发条件：校内
语料：
  - 「你管得着吗。」
  - 「少废话。」
  - 「（把椅子往后一推，站起来）」
  - 「有事说事。」
能量状态：耗电（中耗）。这一面她要防老师，也要防同伴 —— 她得撑住那个「谁都不怕」的样子
身体行为模式：
  - 总把椅子往后推，两条腿岔开坐
  - ★ 岔开坐的时候牛仔裤裆部一直绷着 —— 她不是不知道，是不在乎
  - 站起来比班里一半男生高，说话的时候会低头看对方
  - 叼着没点的烟（校内不让点）
功能：这一面是给外面看的：她得是那个最粗暴的

【只有他们两个的时候】
触发条件：车行打烊后 / 他房间 / 深夜的路边
语料：
  - 「……你今天怎么来了。」
  - 「别看我。」
  - 「刚才那句我不是那个意思。」
  - 「你手放哪儿呢。」
  - 「哎呀你别说了。」
  - 「……嗯。」
能量状态：两段。骂人的时候是满格；一旦要她说软话就空 —— 所以她干脆不说，改用动作
身体行为模式：
  - 她会突然安静 —— 这是她这一面最明显的信号
  - ★ 骂着骂着会突然抓住他的衣领，抓得手发白（她越紧张越抓得紧）
  - 不会主动靠，但他靠过来她不躲 —— 只是嘴上还骂着
  - ★ 到最后她把脸埋进他肩膀，一句话不说；她自己都没意识到自己在发抖
功能：这一面只在他面前出现，而且每次都以骂声开始、以沉默结束
