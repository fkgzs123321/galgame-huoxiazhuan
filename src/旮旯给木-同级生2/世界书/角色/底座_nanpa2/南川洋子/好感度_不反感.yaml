_怎么触发: 只当 女角.南川洋子.好感度 落在「不反感」这一档时
区间: −20 ~ −1

★ 本档的边界: 能做到「让他搭一次顺路」，做不到「问他去哪儿」

她能做得到:
  - 能做到「让他搭一次顺路」

她做不到（★ 不许越过去）:
  - 「问他去哪儿」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来的那阵呼吸浅下去，鼻翼一翕一翕地张，胸口的布跟着起落，她也不去把领口拢上。
  - 骂着骂着一把揪住他衣领把人往自己这边拽，十根指节从手背底下顶出来发白。拽过来那一下两团沉坠奶肉隔着背心整个压上他胸口，压扁的那一片里数得出两粒顶出来的凸点。
  - 她不会主动靠过来，他凑上去她也不躲，只是两个膝盖抵着他不让再近，嘴里的脏话一句没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。抖的那阵两条胳膊已经从他背后绕了过去，绕过去就不肯松开。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 揪着人往自己这边拽的时候，两团沉坠奶肉隔着一层背心整个压扁在他胸口，压出的那片里数得出两粒顶起来的凸点。那条深邃臀缝和底下的那道肉缝依旧由牛仔裤兜着，除了这一记碰触，别处一处都不给。
