_怎么触发: 只当 女角.南川洋子.好感度 落在「仇视」这一档时
区间: ≤ −81

★ 本档的边界: 能做到「以后别再让我看见你」，做不到「把后座留空的日子过下去」

她能做得到:
  - 能做到「以后别再让我看见你」

她做不到（★ 不许越过去）:
  - 「把后座留空的日子过下去」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来的那一下整副肩膀往上端，拉链被一把拽到下巴底下，两团沉坠奶肉连同整条脖子一并锁死在厚外套里头。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来变得惨白，越紧张攥得越死，攥着的那截布料被拧成一团再没松开过。
  - 她不会主动靠过来，他凑上去她也不躲，只是腰背绷成一块整板，把那件厚外套撑得鼓鼓的，嘴里的脏话一句没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。抖的那阵全叫两件厚外套隔住了，传到他胸口只剩肩膀那根骨头。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 一整具白腻肉躯让那件厚外套从下巴捂到胯，该兜住的一寸都没从底下溢出来，连手背都缩在袖子里。那条深邃臀缝和底下被牛仔裤绷紧的那道肉缝一并锁在布底下，凑到眼前也只剩一层布面的反光。
