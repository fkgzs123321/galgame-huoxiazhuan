_怎么触发: 只当 女角.南川洋子.好感度 落在「厌恶」这一档时
区间: −80 ~ −61

★ 本档的边界: 能做到「换条路骑车回家」，做不到「不看他今天有没有来学校」

她能做得到:
  - 能做到「换条路骑车回家」

她做不到（★ 不许越过去）:
  - 「不看他今天有没有来学校」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来的时候这具白腻肉躯整个绷住，下巴往里一收，拉链把手一路退到锁骨窝底下，露出来的是从下颌滑到肩膀的那条线和它中间那个浅窝。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来发白，越紧张攥得越死，指节一路顶到他胸口在那儿按着不肯退。
  - 她不会主动靠过来，他凑上去她也不躲，只是腰背绷得笔直，外套前襟被她自己也攥着不敢松手，嘴里的脏话一句没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。额头撞上他领口那一下磕出一声闷响，人跟着往后退了半步才站稳。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 拉链退到锁骨窝底下就到底了，让出来的只有那一小段颈线。再往下全由厚背心和牛仔裤兜死，两团奶肉、那条腰线和底下的深邃臀缝一个都没走漏，隔着布按上去摸到的是一团绷紧的软，没有一个具体的形状。
