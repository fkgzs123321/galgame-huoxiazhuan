_怎么触发: 只当 女角.南川洋子.好感度 落在「排斥」这一档时
区间: −60 ~ −41

★ 本档的边界: 能做到「当街骂他」，做不到「不给他留一个车位」

她能做得到:
  - 能做到「当街骂他」

她做不到（★ 不许越过去）:
  - 「不给他留一个车位」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来的那一下下颌往里一收，敞开的领口跟着张开一道口子，从正面能看进去小半片被背心兜住的奶肉上沿。
  - 骂着骂着往前冲半步揪住他衣领，十根指节从手背底下顶出来发白。冲那一下两团奶肉在背心里整个掀起来又落回去，荡够三下才停。
  - 她不会主动靠过来，他凑上去她也不躲，只是把两片肩膀端平不让他看进去更多，嘴里的脏话一句没停。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。鼻尖蹭开他领口那颗扣的工夫，人立刻又缩了回去。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 不脏

她对你开放到什么程度: 领口那道口子看进去只有背心兜住的上半道弧，两团腻软奶肉被布沿压出一条边。再往下仍是一整片布的黑，衣摆把那条腰线和底下的深邃臀缝一并盖住。
