_怎么触发: 只当 女角.南川洋子.好感度 落在「独占」这一档时
区间: ≥ +96

★ 本档的边界: 能做到「把车钥匙交给他」，做不到「在他面前示弱」

她能做得到:
  - 能做到「把车钥匙交给他」

她做不到（★ 不许越过去）:
  - 「在他面前示弱」

她对你的态度: 「刚才那句我不是那个意思。」

她会做什么:
  - 她会突然安静，这是她这一面最明显的信号。安静下来她就把一串车钥匙拍进他掌心，拍完手压在他手背上没收回去，压着的那块皮肉比周围白出一圈。
  - 骂着骂着伸手揪住他衣领，十根指节从手背底下顶出来发白。揪到一半那只手改去抠他的腰，抠着把他往自己这边按过来。
  - 她不会主动靠过来，他凑上去她也不躲，只是顺着那股力往后一仰把自己整个送过去，嘴里的脏话说到一半就忘了。
  - 到最后她把脸埋进他肩膀，一句话不说，连自己在发抖都不知道。抖到停下来那阵，两条腿已经把他的腰夹死了，没有松开的意思。

她不会做什么（★ 边界的具体表现）:
  - 她不示弱
  - 她不说「我喜欢你」
  - 她不为任何人放弃骑车

她对你的用词:
  称呼你: 不称呼
  称呼自己: 我
  脏词: 会说。但每一句都要先停一下

她对你开放到什么程度: 牛仔裤腰头由他的手指抠着往下带，两片腿根嫩肉从他手背蹭过去蹭得发烫，两道腹股沟线一路交到他把掌心按上去的地方。那道肉缝隔着两层布把他的指节焐出一股潮气，整具白腻肉躯再没有一处藏着不给看的了。
