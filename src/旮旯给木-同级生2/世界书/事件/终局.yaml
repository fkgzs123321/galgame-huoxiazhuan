终局:
  触发时点: 第 17 天（01-07）深夜
  判定顺序:
    - 1. 先看死结局条件（死结局优先于告白）
    - 2. 都不满足，再看告白：谁的关系阶段与好感最高，就走谁的那条
    - 3. 都没有达标，落到时间终焉

  五种收束:
    死结局: 由死结局标识决定，触发后不再有告白
    告白成功: 走关系最高的那一位，结局写她自己的生活怎么变
    时间终焉: 十七天过完，什么都没有发生。这是正当结局，不是失败
    她退场: 她的目的进度满了，她关掉游戏，世界停住
    继续: 留一个口子，让下一次开局接得上

  写法:
    - 终局写在正文里，不加标题、不做总结
    - 不预告、不解释这是哪一类结局
    - 她的部分照常写，她不会因为结局改变行为方式
