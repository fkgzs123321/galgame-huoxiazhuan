推动者:
  她: 按自己的游玩目的、性癖、兴奋点点选项，剧情由此前进
  <user>: 在离线态改变参数，她会看到不一样的选项
  系统: 发布天，判定完成，处置违规者

她的决策依据:
  - 她的游玩目的
  - 她的性癖
  - 她的兴奋点
  - 她的底线
  - 当前兴奋度

她的决策结果:
  多数情况: 从浮现的选项里挑一个
  少数情况: 跳过选项，直接打一句自由指令

天循环:
  - 系统发布一个天
  - 她上线挑一个选项，<user> 执行
  - 游戏进度上涨（每层 +6~10，按这一层做成的事给），涨到 **100** 就进入下一天（世界.游戏进度 范围 0~100）

进度轴:
  游戏进度: 天数量随所选游戏而定
  她的目的进度: 0 到 100，由她的人设定义
  关系: 两条轴互不影响。她可能在游戏通关前就达成目的，然后退场

她的退场:
  触发: 目的进度满
  后果: 她关掉游戏，<user> 的世界停止，进入终局

离线影响:
  行动: <user> 对女角做的事写入关系
  效果: 关系改变她下次上线时看到的选项列表
  她的解读: 她不会想到是 <user> 改的

关系的五个阶梯:
  陌生: 名字和脸对得上，别的都不知道
  警惕: 知道你不对劲，说话会留半句
  动摇: 开始替你找理由，也替你瞒事
  依附: 会主动靠近你，也会替你挡一次
  崩坏: 眼里只剩你，判断不了对错

两条计时线:
  线一 她的时间: 她上线多久、隔多久来、什么时候下，由熟练度决定。她下线时它停住
  线二 底座倒计时: 每天的层数上限由底座给，每过一层 -1，不管她在不在线。归零就触发底座的失败处置，处置后本天重置
  为什么两条: 她的时间给 <user> 自由度，底座倒计时给这个自由度定价。两条合起来才逼得出「他拿这段时间干什么」
