兴奋度:
  范围: 0 到 100
  显示: 界面上没有任何提示，只能靠 <user> 自己盯着摄像头看
  上涨:
    - 剧情出现她兴奋点对应的内容
    - 她开始自慰
  下降:
    - 剧情长时间平淡
    - 触及她反感的内容
  它怎么涨（按内容强度，可叠加）:
    轻度（擦边、换衣服、隔着布碰）: +3~5
    中度（直接上手、脱一件、被按住）: +8~12
    重度（插入、当众、她最想看的那类）: +15~25
    她开始自慰: 每层 +10，直到高潮
    高潮: 直接 +30，然后进入贤者时间
    她的兴奋点命中（每套人设各有一组）: 在基础值上 ×1.5
  它怎么掉:
    - "剧情长时间平淡（连续两层没有命中她的兴奋点）: −5"
    - "触及她反感的内容（每套人设各有一组）: −10~20"
    - "贤者时间: 每层 −8，直到回落到 40 以下"
  贤者时间:
    触发: 高潮之后
    持续: 到兴奋度回落到 40 以下为止
    表现: 选项倾向变温和；她的复盘开始，痕迹扫描加强（这时候别留东西）
  ★ 谁改它: <user> 改不了。它只由剧情内容与她自己的行为决定。他只能观察
兴奋度的作用:
  高时:
    选项倾向: 变激进，下手更狠
    她的注意力: 下降，注意不到异常
    反抗成功率: 上升
  高潮后:
    贤者时间: 选项倾向变温和
    她的复盘: 回看刚才发生的事，痕迹扫描加强
她的兴奋点:
  内容: 每套人设各有一组，互不相同
  触发: 剧情中出现对应内容时兴奋度上涨
她的自慰:
  可见性: <user> 能看见
  形式: 每套人设各不相同
  时机: 多数在她兴奋度最高的时候
  价值: 观察她自慰的时机，可以预判她下一步会选什么
战术窗口:
  低兴奋度: <user> 的一切异常都会被她记下
她的情绪:
  好奇: 刚上手，什么都想看一眼，选项挑新奇的那类
  投入: 有明确偏好了，按自己的性癖选，会为剧情较真
  执念: 目的迟迟达不到又总在反抗，开始盯着同一件事反复来
  厌倦: 长时间无事可做，选项挑最短的那条，快进变多
