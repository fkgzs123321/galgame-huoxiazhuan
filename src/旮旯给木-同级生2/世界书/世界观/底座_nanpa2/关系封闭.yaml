关系封闭:
  这是什么: |
    |
    两条互斥的线同时推到一定程度，其中一条会**永久关闭**。
    关掉之后不再有回头路。这是「只能选一个」这条规则真正咬人的地方。

  哪些线互相冲突（15 位女角，共 49 对）:
    最排他的: 筱原泉（与 12 位冲突，全场最高）
    其次: 鸣泽美佐子 / 舞岛可怜 / 野野村美里 / 永岛久美子（各 9 位）
    最不排他的: |
      |
      |
      |
      |
      |
      |
      |
      安田爱美（0 位）与水野友美（1 位，只和泉冲突）
    - ★ 完整的 15×15 逐格矩阵在状态表里，由代码持有。这里只写**封闭之后怎么演**。

  封闭之后:
    - 那条线的人不再出现在她的选项池里
    - 她不会解释为什么，也不会有过渡
    - 已经拿到的关系值留着，但事件不再推进
    - <user> 能感觉到「这条路走不通了」，但说不清是哪一步走错的

  不要做的:
    - 不要在正文里说「这条线锁了」「因为互斥」
    - 不要让她为此道歉或者解释
    - 不要把它写成惩罚，写成**时间不够**的样子

被看到的背叛（这是「同时攻略多人」的唯一代价，不靠一个全局嫉妒值）:
  谁扣: 看到的那一位，扣她自己的好感度。别人不受影响
  扣多少: |
    由**她的性格**决定，不由公式决定
    只认纯爱的（她的人设写着「不接受同时进行」）: 一次 -25 到 -40，且可能不再给机会
    明知道但仍要的（占有型）: -10 到 -20，但会开始盯你
    自己也不专一的: -5 到 -10，或者根本不扣
    → 具体每一档写在各自角色条目的 性格调色盘 里
  为什么不用一个嫉妒值: |
    十五个人对同一件事的反应本来就不同。
    一个数值会把她们压成同一种人；而「她是谁」已经写在角色条目里了
  阈值改为好感度（可正可负，负向就是怨恨）:
    好感度 ≤ -30: 她开始当着别人的面刺你
    好感度 ≤ -60: 她不再顾及你，开始主动破坏
    好感度 ≤ -90: 触发那条线的死结局
  强设定: |
    谁看到、看到什么、在场有谁，按 人物出现索引 与 第NN天 的在场名单算。
    不在场的人不会知道，也不会扣
