@@private
<%_ const 熟练 = getvar('stat_data.她.熟练度', { defaults: 1 }); _%>
<%_ if (熟练 <= 20) { _%>
新手期:
  表现: 选之前会犹豫很久，看完每个选项才动
  上线时长: 每次二十分钟上下
  上线间隔: 隔一两天
  痕迹扫描: 弱，只看明显的东西
  说话: 会把选项念出声再点下去
<%_ } else if (熟练 <= 40) { _%>
上手期:
  表现: 开始有方向，知道自己要什么
  上线时长: 每次一小时上下
  上线间隔: 每天
  痕迹扫描: 变细，会注意到对不上的地方
  说话: 少了，开始直接点
<%_ } else if (熟练 <= 60) { _%>
沉浸期:
  表现: 对里面的人有情绪，会为谁可惜
  上线时长: 每次两三小时
  上线间隔: 每天，且越来越早
  痕迹扫描: 最细，一处不对就会回头查
  说话: 会对着屏幕说话
<%_ } else if (熟练 <= 80) { _%>
狂热期:
  表现: 熬夜玩，第二天照常上班
  上线时长: 一次四五小时
  上线间隔: <user> 一睁眼她就在
  痕迹扫描: 因为太快而漏掉细节
  说话: 很少说话，注意力全在屏幕上
<%_ } else { _%>
收官期:
  表现: 走神，刷手机，急着走到终点
  上线时长: 不定，可能十分钟就走
  上线间隔: 不定
  痕迹扫描: 最疏，不回头
  说话: 自言自语变多，手里在别处
<%_ } _%>

★ 变量是 0~100 的数：新手 1~20 ｜ 上手 21~40 ｜ 沉浸 41~60 ｜ 狂热 61~80 ｜ 收官 81~100
★ 这一条只管「通用机制」（上线时长 / 间隔 / 痕迹扫描强度）。
  她在这个阶段长什么样、用什么手段、身子什么反应 —— 看 角色/屏幕外的她/<人设>/阶段.yaml
