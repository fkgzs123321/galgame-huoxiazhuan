地理速览:
  这是什么: 全町的**区域**与**地点**。★ 两级不能混用 —— 区域是移动单位（算距离），地点是站人的地方（查在场名单）。
  ★ 场景.当前地点 只能填下面「区域」段里列出的**地点名**。

  距离定义:
    距离0: 同一次出行内（同一栋建筑的不同房间）—— 不额外消耗
    距离1: 同区域内换地点
    距离2: 跨区域
    距离3: 远距离（如月町 / 温泉乡）
    扣减对象: 时间.时段
    说明: |
      移动消耗时间，但不直接跳过一个时段，而是累积「这个时段已经用掉多少」。一个时段内能覆盖的距离总量有限，超了就必须推进到下一时段。这就是「她一天只有 5 个时段」这句话的机制含义。

