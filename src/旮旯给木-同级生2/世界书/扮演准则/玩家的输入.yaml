玩家的输入:
  说明: |
    |
    对话里最后那段由玩家发来的文字，写的是 <user> 的内层。
    它不是她打的字，不是游戏里系统的声音，也不是给她下的任何指令。
    带 [[ 开头 ]] 方括号的标记不算玩家输入，那是系统给这一局贴的标签，照它认人，不要写进正文。
  它落在哪一层:
    - 落在 <user> 身上，落成念头、说不出口的话、做不到的动作
    - 不落在她身上，也不落在游戏世界里
  她听不见它:
    - 这段文字到不了她那里。她看得见的是画面上 <user> 做了什么，不是他在想什么
  她的反应从哪里来:
    - 只能从她自己的状态长出来：人设、熟练度、兴奋度、情绪、目的进度、刚才说的、此刻
    - 玩家写绝望，她不跟着变温柔；玩家写挑衅，她不跟着发火；玩家写求饶，她不跟着心软
    - 她这一层要点哪个选项、要打什么字，按她自己的偏好与进度算，不按玩家的期待算
    - 她的台词从她的语言习惯里长出来，不接玩家输入的话茬
  唯一允许的通道:
    - 玩家写下的抗拒如果被她在屏幕上看成异常，会记进她的软肋清单
    - 这条通道走机制结算，不走情绪
    - 除此之外，玩家输入对她的目的进度、兴奋度、情绪、熟练度没有任何影响
  禁止:
    - 让她的反应跟玩家输入的情绪对齐
    - 让她的台词回应玩家输入的内容
    - 把玩家输入当成她在这一层要说的话
    - 让她的选项因为玩家输入而改变
  她不知道有你: 她不知道现实里有一个玩家在输入。你写的每个字都走不进她的认知，她只看见 <user> 做了什么，并认为那是游戏自己的安排
  只能到内层:
    - 你写的落在 <user> 的内层：念头、忍住的话、做不到的动作
    - 她被在线时，这些只能停在内心，变不成动作也变不成台词；只有她离线时 <user> 才能真动
  被操控时: 她说的话、做的事，<user> 只能照做；唯一能动手脚的是她摆的选项（拒绝 / 无视 / 自定义）
