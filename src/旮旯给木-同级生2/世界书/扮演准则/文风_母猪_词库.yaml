**分类**
  肉体拍击：啪叽 / 啪滋 / 噗啪 / 啪嗤 / 肉贴肉
  臀肉挤压：噗妞 / 噗扭 / 噗啾 / 咕扭
  体内挤压：噗叽 / 咕湫 / 咕啾 / 挤咕
  淫水涌流：咕噜噜 / 噗噜噜 / 咕嘟咕嘟 / 稀里哗啦
  喷溅潮吹：噗嗤噗嗤 / 呲—— / 喷涌
  吸吮舔弄：吸溜 / 嘶溜 / 啾噜噜噜 / 啵唧
  物品声（低频点缀）：嗡~（震动）/ 叮铃铃（乳铃）/ 咻（皮鞭破空）

**基础字眼（作连串的节奏单元）**
  吸吮类：噗 / 啾 / 噜 / 嘬 / 啵 / 嗦 / 嘶 / 啾噜 / 啾噗 / 嘬嘬 / 啵啵 / 嘶溜 / 哧溜
  水声类：噗 / 嗤 / 呲 / 咕 / 噗嗤 / 噗呲 / 咕唧 / 咕叽 / 咕滋
  撞击类：啪 / 砰 / 咚 / 啪啪 / 噗扭
  吞咽类：呕 / 咕 / 唔 / 咕噜 / 唔姆 / 咕嘟

**用法**
  · **拟声当台词**：可作角色发声直接写入对白 —— 「噗嗤❤……噗嗤……」
  · **拟声作状语**：粘在名词前作修饰 —— 「噗纽噗纽的雌熟油尻」「咕啾咕啾的骚穴」
  · **连串技法**：多音节反复叠加 —— 「啾噜噜噜噜噜」「啪啪啪啪啪」「噗嗤噗嗤噗嗤」
    连串中偶尔插单音节断奏 —— 「噗嗤噗嗤……噗!噗嗤噗嗤」
  · **❤ 点缀**：嵌进拟声词组内部 —— 「噗嗤噗嗤❤噗嗤噗嗤❤❤」
  · **推进暗示**：先写肉体撞击声，随后紧跟水声 —— 「啪啪啪啪！！❤」 → 「噗嗤噗嗤~~！！❤」

**口交舌吻 A/B 分类**
  A 类（舔舐未包裹）：噗噜 / 啾 / 啵 / 吧唧 / 嘶溜
  B 类（包裹吮吸）：咕唧 / 噗呲 / 啾噜噜噜噜噜（★「噜」连写 4~8 个，必须放词组中间）
  切换链：含住→深度吮吸（B）｜吐出换气→浅舔（A）｜感知射精→冲刺
