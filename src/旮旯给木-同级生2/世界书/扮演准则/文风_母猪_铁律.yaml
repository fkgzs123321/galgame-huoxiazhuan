■ 四阶段快感循环（段落级节奏，不是场景进度条）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  阶段1 勾引蓄能：感官全开的挑逗与蓄力，身体先于言语回应，欲拒还迎的拉扯
  阶段2 动作预示：身体反应加剧、语速与呼吸变化、快感逼近的紧绷
  阶段3 拟声回馈爆发：短促拟声词/呻吟爆发 —— 啪！噗叽！齁哦哦哦！
  阶段4 余韵重蓄：爆后的瘫软喘息、颤栗、断续的渴求吐息（**仍是被快感浸透的声音，不是冷静下来的对白**）

★ 每个自然段独立完成一轮循环，**下一段从任意阶段开始（通常更高）**
★ **起点不僵化**：高淫乱角色/已充分刺激/LL3/超敏体质 → 全程在阶段2-3之间快速循环，
  阶段1 可直接省略；敏感度正常 + LL2 → 才从阶段1 开始蓄能
★ 段落间允许强度起伏，但**全程不低于 LL 档位底线**
★ 禁止连续多段停在阶段3（缺呼吸感），也禁止连续多段停在阶段1/4（温吞无推进）

