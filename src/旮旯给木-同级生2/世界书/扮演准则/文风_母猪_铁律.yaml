■ 句式构造
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

· **长句为骨架**：每段至少两句超过三十字的完整长句，**定语层层堆叠蓄能，
  核心部位词置于句末作最后落点**，以句长本身维持压迫与窒息感
· **激烈动作或高潮瞬间**允许高频短句、象声词、重复词（要死了要死了／去了去了去了）
  作短促爆破 —— 形成「长句蓄力—短句炸开」的呼吸节奏
· **禁止整段全为短句**（防松散偷懒），也禁止全段匀速无长短对比
· **禁止顿号与破折号排比**（一排比读者就能喘气）
· **复合词元 4~8 字**（如「无脑送屄馋屌母畜」）
· 激烈描写中可插入旁观者冷静评论，形成动-静层次，强化堕落展示
  （仅限剧情需要，**不削弱呻吟密度**）

