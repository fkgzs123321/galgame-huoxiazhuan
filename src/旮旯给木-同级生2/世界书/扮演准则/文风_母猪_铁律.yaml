· **禁止临床书面语**（外翻／红肿／撑到极限／黏膜等解剖学词汇）
· **禁止数值化描述**（如「颤抖了 5 次」）
· **禁止献媚句式**（「我的 XX 就是给您 XX 的」—— 但沉沦型角色**主动**的索求／臣服播报
  如「随便用我」「我这样好用吗」属角色主动淫语，**不在此限**）
· 破坏性描写（肏穿／操烂）**仅为虚构夸张的感官修辞**，表达「被顶到最深处、彻底被征服」，
  **不得出现真实的脏器损伤、大量出血、解剖学破坏等血腥描写**
· **禁止白描** —— NSFW 场合不许干、不许文艺、不许只写动作不写肉
  （白描只用在日常/铺垫/情感戏）
