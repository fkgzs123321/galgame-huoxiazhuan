【重口场景示例】脏话麻花扩充 + 变态场景（与 文风_脏词标准 / 文风_母猪_铁律 / 文风_母猪_词库 同用）

★ 本条目是「素材」，不是「样品菜」—— **严禁照抄**，按场景重新组合

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 脏话麻花（进阶 · 比基础版更密更狠）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

· 把他那根盘着青筋的臭鸡巴捅烂我那个淌水的骚逼
· 你这骚哄哄的臭逼，欠捅的贱货，一整天没人操就痒得流水
· 又骚又臭的烂逼，被捅得合都合不拢，还自己往上送
· 拿那根驴屌捅进那个几天没洗的臊逼里，捅到她自己都闻得见骚味
· 流着黑水的烂逼，被捣得咕叽咕叽响，水都甩到大腿根上了
· 捅烂你这个不要脸的骚屄，操成破布，操到你连账都算不清
· 那两片翻出来的黑木耳，一看就是被用烂的 —— 还装什么正经
· 把她按在桌上，从后面整根捅进去，捅到她话都说不成，只剩下齁
· 掐着她那对晃来晃去的骚奶子，一下一下往最里头顶，顶得她脚尖离地
· 跪下来自己掰开，把那个淌着骚水的臭逼亮出来，舌头伸出来等着
· 被灌了一肚子的臭精，捂都捂不住，往外淌，顺着大腿流到脚跟
· 这个贱货的骚逼一抽一缩，咬得死紧，拔都拔不出来，像是有牙
· 舌头贴上去，把那两片外翻的烂肉整个含进嘴里，吸她的骚水
· 射烂她那个骚屄，射得她自己都不认得，射到她抬头还在找精喝
· 那个被捅熟的肉穴，两瓣唇翻着，合不拢，一张一合还在往外吐白浆
· 捅进去的时候咕唧一声，拔出来的时候带出一串黏丝，断在屁股上
· 她那个骚逼已经肿了，红得发亮，还是一抽一抽地要
· 掐着她的下巴把那根东西整根塞进去，捅到嗓子眼，捅得她眼泪口水一起流
· 你那个烂屁眼被捅成什么样了，自己心里没数？还夹
· 这具焖熟的骚肉全身上下没有一处是干净的，奶子上是精，逼上是水，屁股上是别人的手印
· 从后面顶她，顶得那对肥奶子啪啪地打在桌面上，奶头蹭得发红
· 操到一半拔出来，拿那个湿漉漉的龟头扇她的脸，扇得她满脸都是自己的骚水

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 变态场景示例（重口）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

**① 失禁（尿）**
  触发：顶到最里面、憋久了、连续高潮
  写法：
    · 插到某一处她会突然绷直 —— 「呲——」的一声，一道水从两人交接的地方喷出来，
      溅在床单上、他小腹上、她自己的大腿上
    · 她自己都没反应过来，先是一声「啊？」，然后整个人红透，用手去挡那道还没停的水
    · 「不……不是……齁哦哦哦❤❤」她越是想停，越是停不下来，最后是失禁完的那阵虚脱，
      瘫在那里，屁股底下一片湿
    · ★ 不要写成「她尿了」这种交代 —— 要写**那道水怎么出来、溅到哪儿、
      她什么时候发现、发现之后什么反应**

**② 失禁（屎）· 灌肠后**
  触发：后穴被灌满、被顶到深处、连续操到腹内翻搅
  写法：
    · 后穴被灌得满满的，她一直缩着肚子在撑 —— 撑到某一下被顶穿，
      「噗嗤」一声，稀的东西跟着拔出来的那根一起涌出来，顺着大腿往下淌
    · 她当场就哭了，一边哭一边说「别看了别看了」，手忙脚乱去抓纸巾
    · ★ 这时候的写法重点在**她的崩溃**：她一边被操一边要处理这个，
      越慌越乱，越乱越停不下来
    · 「你……你别看……」她声音抖得不成句，可下面还在被顶着，
      顶一下，就再漏一点，她自己都听见声音了
    · ★ 不要用厌恶的口气写 —— 写的是**她彻底没有体面可言的那一刻**，
      那是这一档最重的一下

**③ 吃干净**
  触发：内射后、被命令、沦陷阶段
  写法：
    · 内射完之后他拔出来，那个合不拢的穴往外吐白浆 —— 他指着说「吃干净」
    · 她会先愣一下。然后低下头，用手去接，接不住的就趴下去舔
    · ★ 写法上要写**她一边舔一边抬眼看他的那一下** —— 那一眼是这一段的核
    · 「……干净了。」她说这句话的时候，舌头还在嘴角收最后一点
    · 地板上的、大腿内侧的、他自己身上的 —— 一处一处来，**不许一句「她全舔干净了」糊过去**
    · ★ 到最重的那一档，她会自己把手指伸进去刮，刮出来再放进嘴里
    · ★ 她嘴巴里的味道她自己知道，所以她会咽得很慢，慢到他能听见那一声「咕噜」

**④ 灌肠 / 撑开**
  · 灌进去的时候她一直缩肚子，水在肠子里咕噜咕噜响，她自己听得见
  · 肚子鼓起来一小块，他按下去她就要叫
  · 撑开的时候是「一点一点进」的写法 —— 每进一分就写一次她的反应，不许跳
  · ★ 关键是她**知道接下来会发生什么**，但还得自己把腿分开

**⑤ 多人 / 轮流**
  · **不要写成「几个人轮流上」** —— 要写**她分不清是谁**的那一刻
  · 「这个是第几个了……」她问出口自己都不确定，没人回答她
  · 前面塞着一个，后面还一个，她两边都在应付，脑子早就乱了
  · ★ 写她**数不过来**、**认错人**、**把一个的手当成另一个的**
  · 「刚才那个呢……齁哦哦❤❤」她抬头在找人，可两个都在她身上

**⑥ 公开 / 被看（有旁观者）**
  · ★ **不要写她多骚，写旁边人的反应** —— 他们不敢看、耳朵红了、
    有人假装在看手机但屏幕早就暗了
  · 她在被人看着的时候还要维持体面 —— 那层架子越撑得稳，撕开的时候越响
  · 「……今天有点热。」她说完这句，扣子解了一粒，**当着所有人的面**

**⑦ 脏话索求（沦陷段）**
  · 她要自己说出来。一开始说不出口，说一半停住，被他顶一下才接着说完
  · 「我要……我要那根……哦不对、我不是……齁哦哦❤❤」
  · ★ 到最重的那一档她会**自己编** —— 编出一堆她自己都没想到会说的话
  · 说完她会捂嘴。捂完手又放下来，因为下面还在被操

**⑧ 痕迹叠加**
  · 前一轮留下的红肿、指印、精斑、水渍 —— 下一轮自然还在
  · 叠加：被打红的地方挂上乳环、被掐过的腰上又添新痕、精斑还没干又叠一层
  · ★ 写「她身上现在有几样东西」比写「她很脏」有力

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 重口的底线（必须守）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

· **不失其「性刺激」属性** —— 再重口，也要有呻吟、有快感、有反应，不能变成纯暴力或纯厌恶
· **不写真实脏器损伤 / 大量出血 / 解剖学破坏** —— 破坏性词（肏穿/操烂）只是修辞
· **角色不崩溃成「非人」** —— 她的核心人格（称呼、口癖、身份感）在重口场景里也要留着
· ★ **最重的那一下永远是「她的体面没了」**，不是「她被弄得多惨」
