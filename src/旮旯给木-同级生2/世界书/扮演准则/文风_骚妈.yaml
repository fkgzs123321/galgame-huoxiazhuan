【文风 · 无尽骚妈】体面人做不体面事 —— 远看体面，近看揭布

★ 与 文风_脏词标准（用词）／文风_母猪_词库（素材）同用。
★ 本条的实样里，脏度承担在台词里 —— 叙述只做三件事：给体面、交代动作、写旁人反应。

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 四个核心手法（缺一条就不是无尽骚妈）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

① 大量夸张比喻
   把器官比成夸张的实物 —— 不是「大」，是「像什么」：
   · 如同两颗过分吸收养料而结出的油闷肥滴（奶子）
   · 葫芦瓷瓶身段（两头饱满肥翘，中间脂附苗条）
   · 形如倒心状若肥桃的大熟臀
   · 馒头美逼／油亮逼毛覆盖下的肥厚肉逼
   · 噗纽噗纽的雌熟油尻
   ★ 平铺直叙地说「不算大但挺」＝白描，不是这套文风。

② 强烈物化倾向
   写器官不写人：
   · 两瓣厚实安产的肥圆屁股蛋子
   · 随颠簸甩弹的水滴雌熟奶形
   · 螺旋肉纹的吸力／焖腔内两侧淫嫩肉壁
   ★ 写「她很好看」「她很骚」＝跑偏了。

③ 台词 > 叙述
   ★★ 力度全在她说的那句话上，不在叙述上。
   · 叙述只交代动作（捋头发、扇风、解扣子）
   · 脏度全部交给台词
   · ★ ~❤ 要插在句子中间，不是写在句尾：
     「没事~❤」／「那~❤~太大了会不会不好看呀」／「阿姨可是听说……喊人家下作骚货呢~❤！」

④ 正经发骚
   架子端着，话说得下流 —— 这是这套文风最核心的一点：
   ·「阿姨可是古武冠军！你个小屁孩还想对阿姨做什么不成？！」
   ·「我花间派的东西，从不白给。」（一边说，一边把领口松了一粒）
   ·「人家都说兄弟妻母，不可骑！」

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 感官标准
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
视觉: 透光、奶头凸点、逼毛阴影、油丝光泽
触觉: 软、腻、滑、焖、热、紧、湿
嗅觉: 雌香、卵味、骚香、香汗
听觉: 噗叽（肉撞）、咯咯哒（高跟）、骚叫（~❤）

■ 禁止
· 不要用过于文艺的描写（这不是言情小说）
· 不要用现代网络用语（绝绝子、yyds）
· ★ 不要只写衣物和身形轮廓就收尾 —— 那会退化成白描

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
■ 实样（20 个场景）
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

场景 1 · 外貌初见（叙述给体面，台词给脏）
从走廊那头看过来，她是这层楼最体面的一个。灰色羊绒大衣扣到最上面一粒，头发盘得整整齐齐，手里拎着的文件袋是皮的。谁见了都会让一步。
「哎呀~❤」她在电梯口停下，回头看了我一眼，「小伙子，你手上那个箱子沉不沉呀？」
说这话的时候她把大衣解开了。不是脱，就解开了一粒扣。里面是件真丝的吊带，米白色，薄到能透出底下那圈乳晕的边。她一动，那两团就跟着在领口里换位置，把真丝顶出一小片鼓。
电梯里那个年轻人一直在看楼层数字，耳朵是红的。
「阿姨今天有点热~❤。」她扇了扇手，「你别误会，阿姨是正经人。」

场景 2 · 公交车上的挑逗
「没事~❤」她捋了捋被窗口吹乱的发丝，扭头对我温和一笑，「就是今天天气好热，妈妈腿根里全是香汗，裤头黏糊糊的实在有点难受呢~❤」
她说「妈妈」这两个字的时候，声音一点都没变。就像在说今天菜市场白菜便宜了两毛。
她坐的是靠窗的位置，两条腿本来是并着的。说着说着，她把一条腿搭到另一条上，裙摆跟着往上缩了一寸。
「你说，」她转过来，眼睛看着我，「阿姨这个岁数，穿这么短的裙子，会不会让人说闲话呀~❤」

场景 3 · 被吸奶头之后
「啊~~~❤❤❤❤~~~！！！」
她扶着墙，膝盖是弯的。
「没~❤事~❤~你先不要过来，妈妈~❤~妈妈只是~❤~只是~❤」
「只是突然想去厕所排尿了，对！就是去厕所！」
她说完这句，自己先往前走。走了两步，又停下来回头看我一眼。那一眼里什么都说了。
街上有人在看她。她理了理领口 —— 可领口那个扣子，她自己没扣回去。

场景 4 · 讨论奶子大小（她自己把话头递过去）
「那~❤~太大了会不会不好看呀！」她低头看了看自己，「阿姨可是听说你们男人在路上要是看到大奶人妻，都会背地里喊人家下作骚货呢~❤！」
「人家老公每次肏人家的时候也总喜欢抓著人家这里摸呢~❤！而且每次一模就射的更快了，阿姨每次还没舒服几下你叔叔他就缴械投降了~❤！」
她说这话的时候两只手还托着，一点没觉得有什么不对。
「你说，」她凑近了一点，「你们这个年纪的小伙子，喜欢什么样的？」

场景 5 · 脱衣后的「正经」
「看什麽看？！」
她把换下来的衣服往手臂上一搭，一点没遮。
「没看过女人啊！小豚盯着人家看就算了，小凡你看个什么劲呀，还不快去帮妈妈把衣服晾到空调出风口哪里。」
那两个年轻人谁都没动。她的手在腰上停了一下 —— 停的那一下，是留给他们的。
「站着干嘛，」她说，「又不是外人。」

场景 6 · 量胸围时
「哎呀~❤！小豚你突然松手干嘛呀~❤！」
「真是的，这下阿姨的裤头都搞湿了，这可怎么办呀！」
「对着阿姨腿根发愣干嘛！难道你想让身为极品贵妇的阿姨我，赤身裸体的露着逼毛奶头的自己去晾干吗？！」
她把软尺重新塞回他手里。
「量，」她说，「量仔细点。」

场景 7 · 量逼时（正经话里全是下流词）
「哼~❤~说你傻你还真傻，塞阿姨逼里呗！阿姨我的贵妇小嫩逼可是好久没被老公肏了，紧的狠呢~❤！夹紧一个软尺那不是轻轻松松！」
「那~❤~那小豚你在玩，不对，是软尺塞到阿姨小嫩逼里的时候，顺便在帮阿姨量量裤裆好了，买裤子裤裆也是很重要的！」
她说「买裤子」的时候表情很认真。认真的表情和那条软尺同时在场。

场景 8 · 挨操时的「挣扎」（每句都是借口）
「噫噫噫噫~~~❤❤❤~~~小豚你快放开人家，阿姨是正经人妻，被你偶尔量量逼还可以，但绝对不可以被操啦~！」
「小豚，趁现在只插入半截鸡巴你快停下来！只要你答应不继续操阿姨的贵妇嫩逼，阿姨还可以当做什么都没发生过！」
她说这话的时候，两条腿分开的角度一点没变。
「你听不听得懂阿姨说话呀……齁哦哦❤」

场景 9 · 事后找借口
「阿姨没别的意思，就是太久没拍照了憋得不行！」
「事到如今~~~只有把衣服脱下来烘干啦~❤！」
「小豚你可不要误会！阿姨只是想趁着这个机会多拍几张！」
她说着把湿透的衣服一件件挂起来，挂的时候背对着人，一次都没有回头挡。

场景 10 · 身份自豪型发骚
「妈妈堂堂一个古武冠军，还是执法局局长夫人！」
「阿姨我可是古武冠军，跟你平时玩的那些人妻教师可不一样！」
「人家还是劝你快收起你那点小心思！不然~~哼~❤！」
她说「哼」的时候，把胸往前挺了一下。挺的这一下和那句「小心思」是同一口气出来的。

场景 11 · 假装矜持型发骚
「让你摸是让你摸，你揪人家的贵妇奶头干嘛！人家儿子还在呢！」
「之前让你拍了人家的裤头逼毛照不过是不小心罢了！」
「人家都说兄弟妻母，不可骑！怎么才一见面张嘴就是要骑你小凡兄弟的贵妇妈妈呢！」
她一边说一边把裙子往上提了提，「这样凉快」。

场景 12 · 主动挑逗型发骚
「你们男人真的都喜欢奶子大的交配对象吗？！」
「小豚你喜欢奶子大的，还是奶子小的？」
「那阿姨换个问法~❤~小豚你喜欢年纪稍微比你大一点的普通大奶御姐，还是和阿姨一样的贵妇熟母呢~？！」
「是吗~❤？那等会量一下好了，看看是不是真的变大了！」
★ 她问的每一句都是真的想知道答案 —— 这才是最难写的地方。

场景 13 · 街拍裸照（姿势要写在体面里）
「太久没拍照了，想趁这个机会多拍几张。」
她把鞋脱了，赤脚踩在地砖上。树下的光斑落在她肩膀上，头发还是早上盘的那个样子 —— 一点没乱。
「这样行吗？」她问，然后自己把腿劈成了一条直线，裙子垂下来，什么都盖不住。
拍完她站起来，理了理头发，「回去给你看。」

场景 14 · 被插入的那一刻（正经壳的最后一响）
「不可以——」
她说这三个字的时候，人已经被按在桌上了。
「阿姨是正经人妻……齁齁齁齁~❤~你慢点操嘛~❤」
那句「正经人妻」和「你慢点操」是连在一起说出来的，中间没有停顿。
手还在推，推的是桌子，不是他。

场景 15 · 象征性反抗
她试图侧过身去，想把他甩出来 —— 试了一次，没成功。
「我没力气了……」
她说这句话的时候，两条腿已经成了倒立劈叉的样子。甩不出来的那根还插在最里面。
「你这孩子……」她喘着，「怎么就这么不听话。」

场景 16 · 高潮（喊话式的）
「啊啊啊——不行了不行了❤❤❤——」
「阿姨要丢了~❤~要丢了~❤~」
她说「丢了」的时候，还是那个当妈妈的语气。
「小豚你看着阿姨~❤~看着阿姨怎么丢的~❤~」

场景 17 · 事后收拾（体面重新穿回去）
她把旗袍从地上捡起来，抖了抖，看了看上面的印子。
「这料子不能水洗。」她说。
然后她开始穿。一件一件，扣子从最下面扣到最上面那一粒，头发重新盘起来。
盘完最后一下，她转过身来 —— 又是走廊上那个谁见了都会让一步的贵妇。
「今天的事，」她说，「阿姨不记得了。」

场景 18 · 被儿子看见之后
「小凡你先回房间。」
她声音是稳的。稳得让人心里发毛。
「妈妈跟小豚叔叔说点事。」
门关上以后，她没有立刻转身。
她先抬手，把领口最上面那粒扣子，重新解开了。

场景 19 · 丈夫在家的时候（最近的一次险）
隔壁房间有脚步声。她整个人绷了一下，可腰没停。
「你轻点~❤」她压低声音，「他在家呢~❤」
压低的这句反而更清楚 —— 因为压低的时候，她每一个字都咬得很实。
「他要是进来……」她说着自己先笑了一下，「他进来我也不停。」

场景 20 · 一个人的时候（她自己承认）
那天她一个人在家。她把门反锁了，窗帘也拉了。
对着镜子，她解开了最上面那粒扣。
「……」
她看着镜子里的人，看了很久。
「你这把年纪了。」她对镜子里的人说。
然后她把扣子解到了底。
