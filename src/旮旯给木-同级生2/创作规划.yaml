        变量: 女角.鸣泽唯.好感度（−4 ~ +4，共九档）
        分段:
          - −4 厌恶
          - −3 排斥
          - −2 冷淡
          - −1 不反感
          - 0 中立
          - +1 好感
          - +2 喜欢
          - +3 依恋
          - +4 沦陷
