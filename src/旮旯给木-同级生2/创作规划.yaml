  - file: 底座_nanpa2/状态表.yaml
    what: T2 状态表（221 状态，每个填「意义」）+ ★ 15×15 互斥矩阵（逐格照搬 + 49 对冲突）
  - file: 底座_nanpa2/initvar.yaml
    what: 变量初始值
  - file: 底座_nanpa2/目的清单.yaml
    what: goal_units 数值契约（88 张 CG + 7 套人设的单元映射）—— 「她要什么」的**条目版**在 她_XX，本文是**数值版**
  - file: 底座_nanpa2/偏好系数表.yaml（待写）
    what: 出招时各女角的偏好权重 —— 引擎算给「她」看，AI 不需要
  - file: 底座_nanpa2/地理速览.yaml
    what: T1 地图机制数据（距离 / 开放时段 / 在场名单）
  - file: 机制/判定引擎.txt
    what: E3 判定引擎实现（LCG + 判定链），不含任何世界观/角色/地点名
  - file: Token 预算与加载策略.md
    what: token 规范与八条手段、定稿转换清单
  - file: budget.json（待建）
    what: 项目级预算（覆盖校验器默认值）
  - file: schema.ts（待建）
    what: MVU 变量类型定义（由 状态表.yaml 派生）
mvu:
  structure: |
    顶层结构（详见 底座_nanpa2/状态表.yaml，T2 契约，221 个状态）：
    ├── 世界
    │   ├── 日期 / 天数 / 时段 / 时段进度 / 章节
    │   ├── 当前地点 / 当前女角 / 场景模式
    │   ├── 天气 / 只能选一个 / 互斥状态
    │   └── 底座（= nanpa2）
    ├── 主角
    │   ├── 身体状态 / 心情
    │   ├── 说话 / 做事 / 懂东西（3 维明牌）
    │   └── 拒绝 / 判定结果（引擎写入）
    ├── 女角 ×15
    │   └── 关系阶段 / 好感度 / 心动值 / 信任度 / 嫉妒值
    ├── 经济
    ├── 过程（世界的裂缝 / 她用过的手段）
    └── 剧情（日记 / 樱子线 / 美纪线 / 互斥触发 / 死结局标识）
  variables: []
  "[mvu_update] 提示词条目（配置，非创作条目）":
    说明: 带 [mvu_update] 前缀 → 只发给「负责更新变量的 AI」（额外模型解析开启时生效）。它们不进 entries
    条目:
      - name: "[mvu_update]变量输出格式"
        path: 世界书/变量/变量输出格式.txt
        来源: skills 模板（assets/mvu-templates），默认不改
      - name: "[mvu_update]选项池输出"
        path: 世界书/变量/选项池输出.yaml
        用途: 告诉额外模型怎么写 局面.当前选项
      - name: "[mvu_update]本卡变量路径"
        path: 世界书/变量/本卡变量路径.yaml
        用途: 钉死 JSON Patch 的 path 写法（不带 stat_data）
