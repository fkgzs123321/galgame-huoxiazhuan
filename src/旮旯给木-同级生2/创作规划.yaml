world:
  overview: 八十八町，一个普通的日本小镇，冬天。现实世界，无任何超自然元素。全部角色为成年人。 玩家扮演的主角 18 岁，母亲早逝、父亲是常年在外的考古学家，寄住在鸣泽家十年。 唯一的非现实元素承袭引擎：他能通过摄像头看见「屏幕外的她」。
  regions:
    - name: 住宅区
    - name: 八十八学园
    - name: 商业区
    - name: 车站与娱乐
    - name: 郊外
    - name: 如月町
    - name: 温泉乡
    - name: 医院
  factions: []
