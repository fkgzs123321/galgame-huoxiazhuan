<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>状态栏 · 同级生2</title>
<style>
:root{
  --bg-0:#0a0e1a;--bg-1:#161a2e;--bg-card:rgba(28,32,58,.88);
  --c-text:#f3f4f6;--c-dim:#9ca3af;--c-border:rgba(99,102,241,.22);
  --c-danger:#ef4444;--c-warn:#f59e0b;--c-orange:#db6d28;--c-safe:#10b981;--c-accent:#a371f7;--c-blue:#3b82f6;--c-pink:#f472b6;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:clamp(10px,2vw,11px);--fs-sm:clamp(11px,2.2vw,12px);--fs-base:clamp(12px,2.5vw,13px);--fs-md:clamp(13px,2.8vw,15px);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);color:var(--c-text);background:transparent;font-size:var(--fs-base);line-height:1.5}
.sb{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;margin:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--c-border);margin-bottom:8px;flex-wrap:wrap}
.hd-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.hd-t{font-size:var(--fs-md);font-weight:700;letter-spacing:.5px}
.hd-sub{font-size:var(--fs-xs);color:var(--c-dim);width:100%;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:var(--fs-xs);padding:2px 8px;border-radius:10px;background:rgba(163,113,247,.12);border:1px solid rgba(163,113,247,.3);color:#d2a8ff;white-space:nowrap}
.pill.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:var(--c-warn)}
.pill.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:var(--c-danger)}
.pill.safe{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:var(--c-safe)}
.pill.hell{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.5);color:#fca5a5;font-weight:700}
.rfr{background:transparent;border:1px solid var(--c-border);color:var(--c-dim);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:var(--fs-md);flex-shrink:0;transition:color .2s}
.rfr:hover{color:var(--c-text)}
.rfr.spinning{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
details.block{background:var(--bg-card);border:1px solid var(--c-border);border-radius:8px;padding:0;margin-bottom:8px;overflow:hidden}
details.block>summary{font-size:var(--fs-sm);font-weight:700;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;list-style:none}
details.block>summary::-webkit-details-marker{display:none}
details.block[open]>summary{border-bottom:1px solid var(--c-border)}
details.block[open]>summary .caret{transform:rotate(90deg)}
details.block>summary .caret{margin-left:auto;transition:transform .2s}
.card-t.user{color:var(--c-safe)}
.card-t.heroine{color:var(--c-accent)}
.card-t.skill{color:#34d399}
.card-t.economy{color:#fbbf24}
.card-t.personality{color:var(--c-pink)}
.card-t.hidden{color:var(--c-dim)}
.card-t.temp{color:var(--c-blue)}
.card-t.list{color:var(--c-accent)}
.block-body{padding:6px 10px 8px;display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.kv{display:flex;flex-direction:column;gap:1px}
.kv .k{font-size:var(--fs-xs);color:var(--c-dim)}
.kv .v{font-size:var(--fs-sm);font-weight:600}
.v.danger{color:var(--c-danger)}.v.warn{color:var(--c-warn)}.v.safe{color:var(--c-safe)}.v.neutral{color:var(--c-dim)}.v.accent{color:var(--c-accent)}.v.blue{color:var(--c-blue)}.v.pink{color:var(--c-pink)}
.bar{margin:5px 0}
.bar-h{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--c-dim);margin-bottom:2px}
.bar-h .bv{color:var(--c-text);font-weight:600}
.bar-t{height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .5s ease;width:0}
.bar-f.r{background:linear-gradient(90deg,#7f1d1d,var(--c-danger))}
.bar-f.o{background:linear-gradient(90deg,#78350f,var(--c-orange))}
.bar-f.y{background:linear-gradient(90deg,#78350f,var(--c-warn))}
.bar-f.g{background:linear-gradient(90deg,#064e3b,var(--c-safe))}
.bar-f.b{background:linear-gradient(90deg,#1e3a8a,var(--c-blue))}
.bar-f.p{background:linear-gradient(90deg,#831843,var(--c-pink))}
.loading{text-align:center;padding:30px;color:var(--c-dim);font-size:var(--fs-md);animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.sect-title{font-size:var(--fs-xs);color:var(--c-dim);margin:8px 0 4px;font-weight:600;border-bottom:1px solid rgba(99,102,241,.1);padding-bottom:2px}
.heroine-item{background:rgba(163,113,247,.06);border:1px solid rgba(163,113,247,.2);border-radius:6px;padding:6px 8px;margin-bottom:4px;cursor:pointer;transition:background .2s}
.heroine-item:hover{background:rgba(163,113,247,.12)}
.heroine-item.active{border-color:rgba(163,113,247,.6);background:rgba(163,113,247,.15)}
.heroine-row{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}
.heroine-name{font-weight:700;font-size:var(--fs-sm);color:var(--c-accent)}
.heroine-stage{font-size:var(--fs-xs);padding:1px 6px;border-radius:8px;background:rgba(163,113,247,.2);color:#d2a8ff}
.heroine-stage.safe{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--c-safe)}
.heroine-stage.warn{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--c-warn)}
.heroine-stage.pink{background:rgba(244,114,182,.15);border:1px solid rgba(244,114,182,.3);color:var(--c-pink)}
.cur-tag{font-size:var(--fs-xs);color:var(--c-pink);font-weight:bold;margin-left:4px}
.heroine-stats{display:flex;gap:6px;margin-top:3px;font-size:var(--fs-xs);color:var(--c-dim)}
.heroine-stats span{white-space:nowrap}
.flag-on{color:var(--c-safe);font-weight:700}
.flag-off{color:var(--c-dim)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}
.modal-overlay.show{display:flex}
.modal{background:linear-gradient(160deg,var(--bg-0),var(--bg-1));border:1px solid var(--c-border);border-radius:10px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:12px}
.modal-title{font-size:var(--fs-md);font-weight:700;margin-bottom:8px;color:var(--c-accent);display:flex;justify-content:space-between;align-items:center}
.modal-close{background:transparent;border:1px solid var(--c-border);color:var(--c-dim);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:var(--fs-md)}
.modal-close:hover{color:var(--c-text)}
.nsfw-tag{font-size:var(--fs-xs);padding:1px 5px;border-radius:4px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;margin-left:4px}
@media(max-width:480px){
  .g{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .hd-t{font-size:var(--fs-sm)}
  .hd{flex-wrap:wrap}
  .hd-l{width:100%}
  .rfr{padding:4px 10px}
  .pill{font-size:9px;padding:1px 6px}
  .modal{max-width:95vw;max-height:80vh;padding:10px}
  .heroine-stats{flex-wrap:wrap;gap:4px}
  .heroine-stats span{font-size:9px}
  .hd-sub{font-size:9px}
}
@media(max-width:360px){
  .g{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .hd-t{font-size:var(--fs-xs)}
  .heroine-name{font-size:var(--fs-xs)}
}
</style>
</head>
<body>
<div id="sb-root">
  <div class="loading" id="sb-loading">正在载入状态栏…</div>
  <div class="sb" id="sb-body" style="display:none"></div>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>
<script type="application/json" id="mvu-stat-embed">{{format_message_variable::stat_data}}</script>
<script>
/* ===== 状态栏 · 同级生2 · 纯ES5 + 全变量显示 ===== */
var TH_HOSTS=[window,window.parent,window.top].filter(function(w,i,arr){return w&&arr.indexOf(w)===i});
function pickHostFn(name){
  if(typeof window[name]==='function')return function(){return window[name].apply(window,arguments)};
  for(var i=0;i<TH_HOSTS.length;i++){try{var h=TH_HOSTS[i];if(typeof h[name]==='function')return function(host,n){return function(){return host[n].apply(host,arguments)}}(h,name)}catch(e){}}
  return null;
}
function pickHostValue(name){
  if(window[name]!==undefined)return window[name];
  for(var i=0;i<TH_HOSTS.length;i++){try{if(TH_HOSTS[i][name]!==undefined)return TH_HOSTS[i][name]}catch(e){}}
  return undefined;
}
function getMvu(){return pickHostValue('Mvu')||window.Mvu||null}

function parseEmbeddedStat(){
  var el=document.getElementById('mvu-stat-embed');
  if(!el)return null;
  var raw=(el.textContent||el.innerText||'').trim();
  if(!raw||raw.indexOf('format_message_variable')>=0)return null;
  try{var parsed=JSON.parse(raw);
    if(parsed&&typeof parsed==='object'){
      if(parsed.stat_data&&typeof parsed.stat_data==='object')return parsed.stat_data;
      return parsed;
    }
  }catch(e){}
  return null;
}
function hasData(o){return o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length>0}

function resolveMessageIdFromDom(){
  try{
    var frame=window.frameElement;
    if(frame&&frame.closest){var mes=frame.closest('.mes');if(mes){var id=parseInt(mes.getAttribute('mesid'),10);if(id>=0)return id}}
    var el=frame;
    while(el){if(el.classList&&el.classList.contains('mes')){var id2=parseInt(el.getAttribute('mesid'),10);if(id2>=0)return id2}el=el.parentElement}
    for(var i=0;i<TH_HOSTS.length;i++){try{var host=TH_HOSTS[i];var host$=host.$||host.jQuery;if(!host$||!frame)continue;var $mes=host$(frame).closest('.mes');if($mes&&$mes.length){var id3=parseInt($mes.attr('mesid'),10);if(id3>=0)return id3}}catch(e){}}
  }catch(e){}
  return -1;
}
function resolveMessageIdFromIframeName(){
  var fn=pickHostFn('getIframeName');if(!fn)return -1;
  try{var name=String(fn()||'');var m=/^TH-message--(\d+)--/.exec(name);if(m)return parseInt(m[1],10)}catch(e){}
  return -1;
}
function resolveMessageId(){
  var fromDom=resolveMessageIdFromDom();if(fromDom>=0)return fromDom;
  var fromName=resolveMessageIdFromIframeName();if(fromName>=0)return fromName;
  if(typeof window.message_id==='number'&&window.message_id>=0)return window.message_id;
  var fn=pickHostFn('getCurrentMessageId');
  if(fn){try{var id=fn();if(typeof id==='number'&&id>=0)return id}catch(e){}}
  return -1;
}
function getMessageOption(){var messageId=resolveMessageId();return{type:'message',message_id:messageId>=0?messageId:'latest'}}
function hasMeaningfulStatData(stat){return stat&&typeof stat==='object'&&!Array.isArray(stat)&&Object.keys(stat).length>0}
function pickStatData(source){if(!source||typeof source!=='object')return null;var stat=source.stat_data;return hasMeaningfulStatData(stat)?stat:null}

var cachedStatFromBridge=null;
var cachedBridgeMessageId=-1;

/* 同步降级读取：仅用于初始化快速渲染（数据可能滞后） */
function readStatDataSync(){
  var embedded=parseEmbeddedStat();
  if(embedded)return deepMergeStat(DEFAULT_STAT,embedded);
  if(cachedStatFromBridge&&hasMeaningfulStatData(cachedStatFromBridge)){
    return deepMergeStat(DEFAULT_STAT,cachedStatFromBridge);
  }
  return deepMergeStat(DEFAULT_STAT,{});
}

/* 异步读取：参考暗黑地牢生产级实现，用 getLastMessageId 遍历找最后一条 assistant 消息 */
async function readStatDataAsync(){
  try{
    if(typeof getLastMessageId==='function'){
      var maxId=getLastMessageId();
      var Mvu=getMvu();
      var gv=pickHostFn('getVariables');
      for(var i=0;i<15;i++){
        var cid=maxId-i;
        if(cid<0)break;
        var msg=null;
        try{msg=getChatMessages(cid)}catch(e){continue}
        if(Array.isArray(msg))msg=msg[0];
        if(!msg||msg.role!=='assistant')continue;
        var mid=msg.message_id;
        if(typeof mid!=='number'||mid<0)continue;
        var v=null;
        try{
          if(Mvu&&typeof Mvu.getMvuData==='function'){
            v=await Mvu.getMvuData({type:'message',message_id:mid});
          }else if(gv){
            v=await gv({type:'message',message_id:mid});
          }
        }catch(e){}
        var stat=pickStatData(v);
        if(stat&&hasMeaningfulStatData(stat)){
          return deepMergeStat(DEFAULT_STAT,stat);
        }
      }
    }
  }catch(e){}
  /* 降级1：embed 快照（消息生成时的数据） */
  var embedded=parseEmbeddedStat();
  if(embedded)return deepMergeStat(DEFAULT_STAT,embedded);
  /* 降级2：bridge 缓存 */
  if(cachedStatFromBridge&&hasMeaningfulStatData(cachedStatFromBridge)){
    return deepMergeStat(DEFAULT_STAT,cachedStatFromBridge);
  }
  /* 降级3：DEFAULT_STAT */
  return deepMergeStat(DEFAULT_STAT,{});
}

function requestStatFromBridge(){
  var mesId=resolveMessageId();var payload={type:'dj2-mvu-stat-request',messageId:mesId};
  for(var i=0;i<TH_HOSTS.length;i++){try{TH_HOSTS[i].postMessage(payload,'*')}catch(e){}}
}

/* 工具 */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(v,d){v=parseFloat(v);d=(d===undefined)?0:d;return isNaN(v)?d:v}
function pct(v,max){v=num(v,0);max=num(max,100);return Math.max(0,Math.min(100,max>0?(v/max)*100:0))}
function barClass4(v){v=parseInt(v)||0;if(v>=80)return'g';if(v>=60)return'y';if(v>=30)return'o';return'r'}
function kv(k,v,cls){return '<div class="kv"><span class="k">'+k+'</span><span class="v'+(cls?' '+cls:'')+'">'+esc(v)+'</span></div>'}
function bar(label,val,max){
  max=max||100;var v=num(val,0);
  return '<div class="bar"><div class="bar-h"><span>'+label+'</span><span class="bv">'+v+'/'+max+'</span></div><div class="bar-t"><div class="bar-f '+barClass4(v)+'" style="width:'+pct(v,max)+'%"></div></div></div>';
}
function flagStr(v){return v?'<span class="flag-on">✓</span>':'<span class="flag-off">✗</span>'}

function deepMergeStat(dst,src){
  if(!src||typeof src!=='object')return dst;
  var out={};try{out=JSON.parse(JSON.stringify(dst||{}))}catch(e){out={}}
  for(var k in src){
    if(!Object.prototype.hasOwnProperty.call(src,k))continue;
    var sv=src[k],dv=out[k];
    if(sv&&typeof sv==='object'&&!Array.isArray(sv)&&dv&&typeof dv==='object'&&!Array.isArray(dv)){out[k]=deepMergeStat(dv,sv)}
    else{out[k]=sv}
  }
  return out;
}

/* 女角详情（当前女角直接读 /当前女角/*，避免镜像不同步） */
function showHeroineDetail(name){
  var curName=mvuObj('场景').当前女角名||'无';
  var h;
  if(name===curName){
    /* 当前女角：直接读 /当前女角/* 变量，无需 AI 输出镜像 */
    h=mvuObj('当前女角');
  }else{
    /* 非当前女角：读 /女角/${name}/* 镜像 */
    var heroines=mvuObj('女角');
    h=heroines[name];
  }
  if(!h){showModal('错误','<p>未找到女角：'+esc(name)+'</p>');return}
  var content=renderHeroineBody(h,name);
  showModal(esc(name)+' · 完整详情',content);
}

/* refresh - 异步版本，参考暗黑地牢 */
async function refresh(){
  if(State._refreshing)return;
  State._refreshing=true;State.refreshing=true;
  /* 第一步：用 embed 快照快速渲染一次（避免界面空白） */
  var quickStat=readStatDataSync();
  if(hasData(quickStat)){State.mvu=quickStat;State.loading=false}
  render();
  /* 第二步：异步获取最新 MVU 数据 */
  try{
    var realStat=await readStatDataAsync();
    if(hasData(realStat)){State.mvu=realStat;State.loading=false}
  }catch(e){}
  State._refreshing=false;State.refreshing=false;
  render();
  requestStatFromBridge();
}

/* 事件绑定 */
function bindEvents(){
  var root=document.getElementById('sb-root');
  root.addEventListener('toggle',function(e){
    var t=e.target;
    if(t&&t.tagName==='DETAILS'){var key=t.getAttribute('data-key');if(key){State.expanded[key]=t.hasAttribute('open')}}
  },true);
  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(!t)return;
    var act=t.getAttribute('data-act');
    if(act==='refresh'){refresh()}
    else if(act==='heroine-detail'){showHeroineDetail(t.getAttribute('data-name'))}
  });
  document.getElementById('modal-overlay').addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(t&&t.getAttribute('data-act')==='close-modal'){closeModal()}
  });
}

/* 初始化 */
(function init(){
  bindEvents();
  var autoRefresh=function(){setTimeout(refresh,800)};
  try{if(typeof eventOn==='function'){eventOn('GENERATION_ENDED',autoRefresh);eventOn('MESSAGE_EDITED',autoRefresh);eventOn('mag_variable_update_ended',autoRefresh)}}catch(e){}
  try{var Mvu=getMvu();if(Mvu&&Mvu.events&&Mvu.events.VARIABLE_UPDATE_ENDED&&typeof eventOn==='function'){eventOn(Mvu.events.VARIABLE_UPDATE_ENDED,autoRefresh)}}catch(e){}
  window.addEventListener('message',function(e){
    try{
      var data=e.data;
      if(data&&data.type==='dj2-mvu-stat-data'&&data.stat_data){
        var mesId=resolveMessageId();
        if(mesId>=0&&typeof data.messageId==='number'&&data.messageId>=0&&data.messageId!==mesId)return;
        if(hasMeaningfulStatData(data.stat_data)){
          cachedStatFromBridge=data.stat_data;
          cachedBridgeMessageId=typeof data.messageId==='number'?data.messageId:mesId;
          State.mvu=deepMergeStat(DEFAULT_STAT,data.stat_data);
          State.loading=false;render();
        }
        return;
      }
      var t=(data&&data.type)||data||'';
      if(typeof t==='string'&&(t.indexOf('generation_ended')>=0||t.indexOf('message_edit')>=0))autoRefresh();
    }catch(x){}
  });
  var embedded=parseEmbeddedStat();
  if(embedded){cachedStatFromBridge=embedded;cachedBridgeMessageId=resolveMessageId()}
  requestStatFromBridge();refresh();
})();
</script>
