.hgw-victory-banner {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9800;
  padding: 24px 48px;
  background: linear-gradient(135deg, rgba(16, 26, 38, 0.97), rgba(10, 15, 24, 0.97));
  border: 2px solid var(--hgw-gold);
  border-radius: var(--hgw-r-lg);
  box-shadow: var(--hgw-shadow-lg), var(--hgw-shadow-glow);
  text-align: center;
  font-family: var(--hgw-font-title);
  font-size: var(--hgw-fs-2xl);
  letter-spacing: 6px;
  color: var(--hgw-gold-bright);
  text-shadow: 0 0 30px rgba(232, 212, 139, 0.8);
  animation: hgw-banner-in 0.5s var(--hgw-ease) both, hgw-banner-out 0.5s var(--hgw-ease) 2s both;
  pointer-events: none;
}
@keyframes hgw-banner-in {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@keyframes hgw-banner-out {
  0% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1.1); }
}

/* —— 移动端底部导航适配 —— */
@media (max-width: 640px) {
  #hgw-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: 100%;
    height: 52px;
    min-width: 0;
    flex-direction: row;
    overflow-x: auto;
    border-right: none;
    border-top: 1px solid var(--hgw-gold-line);
    background: rgba(10, 15, 24, 0.97);
    padding: 0 6px;
    z-index: 30;
  }
  #hgw-nav .nav-sec-title { display: none; }
  .hgw-nav-item {
    flex-direction: column;
    gap: 0;
    padding: 6px 10px;
    font-size: 9px;
    min-width: 52px;
    border-radius: 8px;
  }
  .hgw-nav-item .ic { font-size: 18px; }
  .hgw-nav-item .txt { display: block; }
  .hgw-nav-item .badge { top: 0; right: 2px; }
  .nav-footer { display: none; }
  #hgw-main { flex-direction: column; }
  #hgw-content { order: -1; }
  #hgw-view { padding-bottom: 60px; }
  #hgw-inputbar { padding-bottom: 62px; }
}

/* ============================================================
   霍格沃茨 · 同层应用 组件细节层（全状态/微交互/视图补全）
   ============================================================ */

/* —— 按钮全状态细节 —— */
.hgw-btn { position: relative; overflow: hidden; }
.hgw-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18), transparent 60%);
  opacity: 0;
  transition: opacity var(--hgw-dur-fast);
  pointer-events: none;
}
.hgw-btn:hover::after { opacity: 1; }
.hgw-btn:focus-visible { outline: 2px solid var(--hgw-gold); outline-offset: 2px; }
.hgw-btn.lg { letter-spacing: 2px; }
.hgw-btn.sm { letter-spacing: 0; }

/* —— 卡片全状态 —— */
.hgw-card:active { transform: scale(0.99); }
.hgw-card .card-title .sub { margin-left: auto; font-weight: 400; font-size: 10px; color: var(--hgw-text-faint); }

/* —— 输入全状态 —— */
.hgw-input:hover, .hgw-select:hover { border-color: rgba(255, 255, 255, 0.28); }
.hgw-input:disabled, .hgw-select:disabled { opacity: 0.5; cursor: not-allowed; }
.hgw-input.invalid, .hgw-select.invalid { border-color: var(--hgw-danger); box-shadow: 0 0 0 3px rgba(226, 75, 74, 0.12); }
.hgw-field .hint { font-size: 10px; color: var(--hgw-text-faint); margin-top: 3px; }
.hgw-field .hint.err { color: var(--hgw-danger); }

/* —— 进度条细节 —— */
.hgw-bar i { min-width: 0; }
.hgw-bar .stripe {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.08) 0 6px, transparent 6px 12px);
  border-radius: inherit;
}
.hgw-bar-label .val { color: var(--hgw-gold-bright); font-weight: 600; }

/* —— 徽章细节 —— */
.hgw-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; display: inline-block; }
.hgw-tag { transition: all var(--hgw-dur-fast); }
.hgw-tag.clickable { cursor: pointer; }
.hgw-tag.clickable:hover { filter: brightness(1.3); }

/* —— 表格细节 —— */
.hgw-table th { position: sticky; top: 0; background: rgba(11, 16, 24, 0.95); z-index: 2; }
.hgw-table td .hgw-tag { margin-right: 0; }
.hgw-table tr { transition: background var(--hgw-dur-fast); }

/* —— 列表行细节 —— */
.hgw-row .row-actions { margin-left: auto; display: flex; gap: 6px; }
.hgw-row .row-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }

/* —— 空状态细节 —— */
.hgw-empty .icon { animation: hgw-float-soft 3s ease-in-out infinite; }
@keyframes hgw-float-soft {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* —— 加载状态细节 —— */
.hgw-loading .spinner { border-width: 3px; }

/* —— 模态细节 —— */
.hgw-modal { scrollbar-width: thin; }
.hgw-modal-body > *:last-child { margin-bottom: 0; }
.hgw-modal .hgw-note { word-break: break-word; }

/* —— 抽屉细节 —— */
.hgw-drawer-body > *:last-child { margin-bottom: 0; }

/* —— 顶栏细节 —— */
#hgw-topbar .hgw-top-stat { transition: all var(--hgw-dur-fast); }
#hgw-topbar .hgw-top-stat:hover { border-color: var(--hgw-gold-line); background: rgba(201, 162, 39, 0.12); }
#hgw-topbar .hgw-logo .title { transition: text-shadow var(--hgw-dur-md); }
#hgw-topbar .hgw-logo:hover .title { text-shadow: 0 0 20px rgba(201, 162, 39, 0.7); }

/* —— 导航细节 —— */
.hgw-nav-item { transition: all var(--hgw-dur-fast); }
.hgw-nav-item .badge { transition: transform var(--hgw-dur-fast); }
.hgw-nav-item:hover .badge { transform: scale(1.15); }

/* —— 会话卡细节 —— */
.hgw-session-card { position: relative; }
.hgw-session-card.current::after {
  content: '🎯';
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 14px;
}
.hgw-session-card .sess-parts .hgw-badge { transition: all var(--hgw-dur-fast); }
.hgw-session-card .sess-parts .hgw-badge:hover { transform: scale(1.08); filter: brightness(1.2); }

/* —— 角色卡细节 —— */
.hgw-char-card { transition: all var(--hgw-dur-fast); }
.hgw-char-card .c-axes .hgw-axis-mini { transition: all var(--hgw-dur-fast); }
.hgw-char-card:hover .c-axes .hgw-axis-mini { background: rgba(255, 255, 255, 0.05); }
.hgw-char-ava .house-ring { transition: all var(--hgw-dur-md); }
.hgw-char-card:hover .hgw-char-ava .house-ring { opacity: 1; }

/* —— 详情抽屉细节 —— */
.hgw-char-detail-hero .d-secret { transition: all var(--hgw-dur-fast); }
.hgw-char-detail-hero .d-secret:hover { background: rgba(142, 124, 195, 0.12); }

/* —— 战斗细节 —— */
.hgw-spell-pick .pick-cell { position: relative; }
.hgw-spell-pick .pick-cell:active { transform: scale(0.95); }
#hgw-battle-stage .hgw-duel-hp { transition: all var(--hgw-dur-md); }
.hgw-battle-log .lg-you { font-weight: 600; }
.hgw-battle-log .lg-her { font-weight: 600; }

/* —— 亲密细节 —— */
.hgw-dim-card { transition: all var(--hgw-dur-fast); }
.hgw-dim-card:hover { border-color: var(--hgw-love-line); }
.hgw-combo-item { transition: all var(--hgw-dur-fast); }
.hgw-combo-item .ci-del { transition: all var(--hgw-dur-fast); }

/* —— 炼药细节 —— */
.hgw-recipe-row .rr-rate { font-family: var(--hgw-font-serif); }
.hgw-shop-cell { transition: all var(--hgw-dur-fast); }
.hgw-shop-cell:hover { border-color: var(--hgw-gold-line); transform: translateY(-2px); }

/* —— 图鉴细节 —— */
.hgw-lib-card .lc-desc { max-height: none; }
.hgw-lib-card.clickable:hover .lc-name { color: var(--hgw-gold-bright); }

/* —— 大段文档 —— */
.hgw-doc {
  padding: 14px 16px;
  border-radius: var(--hgw-r-md);
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.06);
  font-size: var(--hgw-fs-sm);
  line-height: 2;
  color: var(--hgw-text-dim);
  white-space: pre-wrap;
  word-break: break-word;
}
.hgw-doc .doc-h {
  font-family: var(--hgw-font-title);
  font-size: var(--hgw-fs-lg);
  color: var(--hgw-gold-bright);
  letter-spacing: 2px;
  margin: 16px 0 8px;
}
.hgw-doc .doc-h:first-child { margin-top: 0; }

/* —— 图鉴全文条目 —— */
.hgw-full-entry {
  padding: 12px 14px;
  border-radius: var(--hgw-r-md);
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--hgw-dur-fast);
}
.hgw-full-entry:hover { border-color: var(--hgw-gold-line); background: rgba(201, 162, 39, 0.04); }
.hgw-full-entry .fe-name { font-size: var(--hgw-fs-md); font-weight: 700; color: var(--hgw-text-bright); margin-bottom: 4px; }
.hgw-full-entry .fe-preview { font-size: var(--hgw-fs-xs); color: var(--hgw-text-dim); line-height: 1.8; }

/* —— 时间线细节 —— */
.hgw-tl-item .tl-title .hgw-badge { font-weight: 400; }
.hgw-tl-item.now { background: rgba(201, 162, 39, 0.05); border-radius: var(--hgw-r-md); }

/* —— 首页 hero 细节 —— */
#hgw-home-hero .hero-chips .hgw-badge { transition: all var(--hgw-dur-fast); }
#hgw-home-hero .hero-chips .hgw-badge:hover { transform: translateY(-2px); box-shadow: var(--hgw-shadow-gold); }

/* —— 存档细节 —— */
.hgw-save-card .sv-ava { transition: all var(--hgw-dur-fast); }
.hgw-save-card:hover .sv-ava { transform: rotate(-6deg) scale(1.08); }

/* —— 设置行细节 —— */
.hgw-settings-row .sr-action .hgw-btn { min-width: 64px; }

/* —— 打字机效果（结算块） —— */
.hgw-typewriter { animation: hgw-type-in 0.4s steps(12) both; overflow: hidden; }
@keyframes hgw-type-in { from { width: 0; } to { width: 100%; } }

/* —— 消息进入序列 —— */
.hgw-msg:nth-child(odd) { animation-delay: 0.05s; }
.hgw-msg:nth-child(even) { animation-delay: 0.1s; }

/* —— 滚动指示 —— */
.hgw-scroll-fade { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%); }

/* —— 焦点环统一 —— */
.hgw-btn:focus, .hgw-card:focus, .hgw-row:focus, .hgw-nav-item:focus { outline: none; }
.hgw-btn:focus-visible, .hgw-card:focus-visible, .hgw-row:focus-visible, .hgw-nav-item:focus-visible { outline: 2px solid var(--hgw-gold); outline-offset: 2px; }

/* —— 高对比度标题 —— */
.hgw-title-rule {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 12px;
  color: var(--hgw-gold-bright);
  font-family: var(--hgw-font-title);
  font-size: var(--hgw-fs-lg);
  letter-spacing: 3px;
}
.hgw-title-rule::before, .hgw-title-rule::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hgw-gold-line), transparent);
}

/* —— 角饰 —— */
.hgw-corner::before, .hgw-corner::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  pointer-events: none;
}
.hgw-corner::before { top: 6px; left: 6px; border-top: 2px solid var(--hgw-gold-dim); border-left: 2px solid var(--hgw-gold-dim); border-top-left-radius: 6px; }
.hgw-corner::after { bottom: 6px; right: 6px; border-bottom: 2px solid var(--hgw-gold-dim); border-right: 2px solid var(--hgw-gold-dim); border-bottom-right-radius: 6px; }

/* —— 分隔纹 —— */
.hgw-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--hgw-gold-dim);
  font-size: 10px;
  letter-spacing: 6px;
  margin: 12px 0;
}
.hgw-ornament::before, .hgw-ornament::after {
  content: '◆';
  font-size: 7px;
  color: var(--hgw-gold-dim);
}

/* —— 数值变化高亮 —— */
.hgw-flash-up { animation: hgw-flash-up 0.8s ease both; }
@keyframes hgw-flash-up {
  0% { color: var(--hgw-ok); text-shadow: 0 0 12px rgba(127, 208, 168, 0.8); }
  100% { color: inherit; text-shadow: none; }
}
.hgw-flash-down { animation: hgw-flash-down 0.8s ease both; }
@keyframes hgw-flash-down {
  0% { color: var(--hgw-danger); text-shadow: 0 0 12px rgba(226, 75, 74, 0.8); }
  100% { color: inherit; text-shadow: none; }
}

/* —— 帮助浮层 —— */
.hgw-help-tip {
  position: fixed;
  z-index: 9900;
  max-width: 260px;
  padding: 10px 14px;
  background: rgba(16, 26, 38, 0.98);
  border: 1px solid var(--hgw-gold-line);
  border-radius: var(--hgw-r-md);
  box-shadow: var(--hgw-shadow-lg);
  font-size: var(--hgw-fs-xs);
  color: var(--hgw-text-dim);
  line-height: 1.7;
  animation: hgw-fade-in var(--hgw-dur-fast) both;
  pointer-events: none;
}

/* ============================================================
   霍格沃茨 · 同层应用 动效库（附加动画/粒子/氛围）
   ============================================================ */

/* —— 烛光闪烁 —— */
.hgw-candle { animation: hgw-candle 2.8s ease-in-out infinite; }
@keyframes hgw-candle {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  25% { opacity: 1; transform: scale(1.04); }
  50% { opacity: 0.9; transform: scale(0.98); }
  75% { opacity: 1; transform: scale(1.02); }
}

/* —— 羽毛飘落 —— */
.hgw-feather-fall {
  position: absolute;
  pointer-events: none;
  font-size: 12px;
  animation: hgw-feather 6s linear infinite;
  opacity: 0.5;
}
@keyframes hgw-feather {
  0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.6; }
  50% { transform: translateY(50vh) translateX(30px) rotate(180deg); }
  90% { opacity: 0.4; }
  100% { transform: translateY(100vh) translateX(-20px) rotate(360deg); opacity: 0; }
}

/* —— 扫帚尾迹 —— */
.hgw-broom-trail {
  position: absolute;
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(232, 212, 139, 0.7));
  border-radius: 2px;
  pointer-events: none;
  animation: hgw-trail 1.2s ease-out forwards;
}
@keyframes hgw-trail {
  0% { opacity: 0.8; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(0.2) translateX(-30px); }
}

/* —— 魔杖挥动光弧 —— */
.hgw-wand-arc {
  position: fixed;
  width: 140px;
  height: 140px;
  border: 2px solid transparent;
  border-top-color: rgba(232, 212, 139, 0.8);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9600;
  animation: hgw-arc 0.6s ease-out forwards;
}
@keyframes hgw-arc {
  0% { transform: rotate(0deg) scale(0.6); opacity: 1; }
  100% { transform: rotate(160deg) scale(1.3); opacity: 0; }
}

/* —— 药水气泡上升 —— */
.hgw-bubble-rise {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(127, 208, 168, 0.7), rgba(127, 208, 168, 0.1));
  pointer-events: none;
  animation: hgw-bubble-rise linear forwards;
}
@keyframes hgw-bubble-rise {
  0% { transform: translateY(0) scale(0.6); opacity: 0; }
  20% { opacity: 0.8; }
  100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
}

/* —— 心形飘升（亲密面板） —— */
.hgw-heart-rise {
  position: fixed;
  pointer-events: none;
  z-index: 9600;
  font-size: 16px;
  animation: hgw-heart-rise 2.2s ease-out forwards;
}
@keyframes hgw-heart-rise {
  0% { transform: translateY(0) scale(0.6) rotate(-8deg); opacity: 0; }
  15% { opacity: 0.9; }
  50% { transform: translateY(-60px) scale(1.1) rotate(6deg); }
  100% { transform: translateY(-140px) scale(0.8) rotate(-4deg); opacity: 0; }
}

/* —— 金加隆翻转 —— */
.hgw-coin-spin {
  animation: hgw-coin-spin 0.8s ease both;
}
@keyframes hgw-coin-spin {
  0% { transform: rotateY(0deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.2); }
  100% { transform: rotateY(360deg) scale(1); }
}

/* —— 决斗开始横幅入场 —— */
.hgw-duel-start {
  animation: hgw-duel-start 0.5s var(--hgw-ease) both;
}
@keyframes hgw-duel-start {
  0% { transform: scaleX(0); opacity: 0; }
  100% { transform: scaleX(1); opacity: 1; }
}

/* —— 幽灵漂浮 —— */
.hgw-ghost-float { animation: hgw-ghost-float 3.5s ease-in-out infinite; }
@keyframes hgw-ghost-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* —— 雾气流动 —— */
.hgw-fog {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(142, 124, 195, 0.06), transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(79, 195, 247, 0.05), transparent 50%);
  animation: hgw-fog-drift 12s ease-in-out infinite alternate;
}
@keyframes hgw-fog-drift {
  0% { transform: translateX(-2%); opacity: 0.7; }
  100% { transform: translateX(2%); opacity: 1; }
}

/* —— 魔法阵旋转 —— */
.hgw-magic-ring {
  position: relative;
  width: 120px;
  height: 120px;
  margin: 0 auto;
  border: 2px dashed rgba(142, 124, 195, 0.4);
  border-radius: 50%;
  animation: hgw-ring-spin 8s linear infinite;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hgw-magic-ring::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1px solid rgba(142, 124, 195, 0.25);
  border-radius: 50%;
}
.hgw-magic-ring::after {
  content: '✦';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  color: #c3b4e8;
  font-size: 14px;
}
@keyframes hgw-ring-spin { to { transform: rotate(360deg); } }

/* —— 突破光柱 —— */
.hgw-light-beam {
  position: fixed;
  left: 50%;
  top: -10%;
  width: 120px;
  height: 130%;
  transform: translateX(-50%);
  background: linear-gradient(180deg, transparent, rgba(232, 212, 139, 0.18), transparent);
  clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%);
  pointer-events: none;
  z-index: 9400;
  animation: hgw-beam 1.6s ease-out forwards;
}
@keyframes hgw-beam {
  0% { opacity: 0; }
  30% { opacity: 1; }
  100% { opacity: 0; }
}

/* —— 落雪 —— */
.hgw-snowflake {
  position: absolute;
  top: -10px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 10px;
  pointer-events: none;
  animation: hgw-snow linear forwards;
}
@keyframes hgw-snow {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  100% { transform: translateY(105vh) translateX(40px) rotate(300deg); opacity: 0.2; }
}

/* —— 蜡烛火光 —— */
.hgw-flame-icon { animation: hgw-flame-icon 0.9s ease-in-out infinite; }
@keyframes hgw-flame-icon {
  0%, 100% { transform: scale(1) rotate(-2deg); }
  50% { transform: scale(1.12) rotate(2deg); }
}

/* —— 摆动提示 —— */
.hgw-swing { animation: hgw-swing 1.6s ease-in-out infinite; transform-origin: top center; }
@keyframes hgw-swing {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

/* —— 缩放脉冲（数字强调） —— */
.hgw-pulse-num { animation: hgw-pulse-num 1.2s ease-in-out infinite; display: inline-block; }
@keyframes hgw-pulse-num {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* —— 渐显上浮（列表项） —— */
.hgw-list-in > * { animation: hgw-list-in 0.3s var(--hgw-ease) both; }
.hgw-list-in > *:nth-child(2) { animation-delay: 0.05s; }
.hgw-list-in > *:nth-child(3) { animation-delay: 0.1s; }
.hgw-list-in > *:nth-child(4) { animation-delay: 0.15s; }
.hgw-list-in > *:nth-child(5) { animation-delay: 0.2s; }
.hgw-list-in > *:nth-child(6) { animation-delay: 0.25s; }
.hgw-list-in > *:nth-child(7) { animation-delay: 0.3s; }
.hgw-list-in > *:nth-child(8) { animation-delay: 0.35s; }
.hgw-list-in > *:nth-child(9) { animation-delay: 0.4s; }
.hgw-list-in > *:nth-child(10) { animation-delay: 0.45s; }
@keyframes hgw-list-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* —— 波纹点击 —— */
.hgw-ripple {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(201, 162, 39, 0.5);
  pointer-events: none;
  animation: hgw-ripple 0.6s ease-out forwards;
}
@keyframes hgw-ripple {
  0% { transform: scale(0.3); opacity: 1; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* —— 成就解锁闪光 —— */
.hgw-ach-flash {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9800;
  padding: 16px 32px;
  background: linear-gradient(135deg, rgba(16, 26, 38, 0.98), rgba(20, 30, 44, 0.98));
  border: 2px solid var(--hgw-gold);
  border-radius: var(--hgw-r-lg);
  box-shadow: var(--hgw-shadow-lg), var(--hgw-shadow-glow);
  text-align: center;
  animation: hgw-ach-in 0.5s var(--hgw-ease) both, hgw-ach-out 0.5s var(--hgw-ease) 3s both;
  pointer-events: none;
}
.hgw-ach-flash .af-icon { font-size: 34px; }
.hgw-ach-flash .af-title { font-family: var(--hgw-font-title); font-size: var(--hgw-fs-lg); color: var(--hgw-gold-bright); letter-spacing: 3px; margin: 6px 0 2px; }
.hgw-ach-flash .af-desc { font-size: var(--hgw-fs-xs); color: var(--hgw-text-dim); }
@keyframes hgw-ach-in {
  0% { opacity: 0; transform: translateX(-50%) scale(0.6) rotate(-4deg); }
  100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
}
@keyframes hgw-ach-out {
  0% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) scale(1.1); }
}

/* —— 消息输入脉冲提示 —— */
.hgw-input-glow { animation: hgw-input-glow 2s ease-in-out infinite; }
@keyframes hgw-input-glow {
  0%, 100% { box-shadow: 0 0 0 rgba(201, 162, 39, 0); }
  50% { box-shadow: 0 0 16px rgba(201, 162, 39, 0.25); }
}

/* ============================================================
   霍格沃茨 · 同层应用 主聊天界面（RPG 沉浸式）
   ============================================================ */

/* —— 场景横幅 —— */
#hgw-chat-scene {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--hgw-r-md) var(--hgw-r-md) 0 0;
  background:
    radial-gradient(ellipse at 85% 0%, rgba(201, 162, 39, 0.12), transparent 55%),
    linear-gradient(180deg, #16202e, #101a26);
  border: 1px solid var(--hgw-gold-line);
  border-bottom: none;
  margin-top: 12px;
}
#hgw-chat-scene .sc-ico { font-size: 22px; }
#hgw-chat-scene .sc-info { flex: 1; min-width: 0; }
#hgw-chat-scene .sc-where { font-size: var(--hgw-fs-sm); font-weight: 700; color: var(--hgw-gold-bright); letter-spacing: 1px; }
#hgw-chat-scene .sc-when { font-size: 10px; color: var(--hgw-text-faint); margin-top: 1px; }
#hgw-chat-scene .sc-tags { display: flex; gap: 5px; flex-shrink: 0; }

/* —— 对话对象卡 —— */
#hgw-chat-target {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-top: none;
}
#hgw-chat-target .ct-ava {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #fff;
  border: 2px solid var(--hgw-gold-dim);
  background: linear-gradient(135deg, #2c3e50, #1a252f);
}
#hgw-chat-target .ct-info { flex: 1; min-width: 0; }
#hgw-chat-target .ct-name { font-size: var(--hgw-fs-md); font-weight: 700; color: var(--hgw-text-bright); display: flex; align-items: center; gap: 6px; }
#hgw-chat-target .ct-meta { font-size: 10px; color: var(--hgw-text-faint); margin-top: 1px; }
#hgw-chat-target .ct-bars { display: flex; gap: 14px; margin-top: 6px; }
#hgw-chat-target .ct-bar { flex: 1; min-width: 70px; }
#hgw-chat-target .ct-bar .hgw-bar-label { font-size: 9px; margin-bottom: 2px; }
#hgw-chat-target .ct-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

/* —— 玩家状态条（聊天内嵌） —— */
#hgw-chat-playerbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-top: none;
  flex-wrap: wrap;
}
#hgw-chat-playerbar .pb-ava {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hgw-gryffindor), #7a1f15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  border: 1px solid var(--hgw-gold-dim);
}
#hgw-chat-playerbar .pb-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--hgw-text-dim); }
#hgw-chat-playerbar .pb-item .ic { font-size: 11px; }
#hgw-chat-playerbar .pb-item .vl { color: var(--hgw-text-bright); font-weight: 700; font-variant-numeric: tabular-nums; }
#hgw-chat-playerbar .pb-bars { display: flex; gap: 10px; flex: 1; min-width: 180px; }
#hgw-chat-playerbar .pb-bar { flex: 1; }
#hgw-chat-playerbar .pb-bar .hgw-bar-label { font-size: 9px; margin-bottom: 2px; }

/* —— 消息流容器 —— */
#hgw-chat-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.03), transparent 60%),
    rgba(7, 11, 18, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-top: none;
}

/* —— RPG 消息气泡 —— */
.hgw-cmsg { max-width: 88%; animation: hgw-view-in var(--hgw-dur-md) both; }
.hgw-cmsg .cm-head { display: flex; align-items: center; gap: 6px; font-size: 10px; margin-bottom: 3px; }
.hgw-cmsg .cm-head .cm-ava {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  background: #1a252f; border: 1px solid var(--hgw-gold-dim);
}
.hgw-cmsg .cm-head .cm-name { font-weight: 700; }
.hgw-cmsg .cm-body {
  padding: 10px 14px;
  border-radius: var(--hgw-r-md);
  font-size: var(--hgw-fs-md);
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}
.hgw-cmsg.ai { align-self: flex-start; }
.hgw-cmsg.ai .cm-body {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-top-left-radius: 4px;
}
.hgw-cmsg.ai .cm-name { color: var(--hgw-gold-bright); }
.hgw-cmsg.user { align-self: flex-end; }
.hgw-cmsg.user .cm-head { flex-direction: row-reverse; }
.hgw-cmsg.user .cm-name { color: var(--hgw-text-dim); }
.hgw-cmsg.user .cm-body {
  background: linear-gradient(135deg, rgba(201, 162, 39, 0.18), rgba(201, 162, 39, 0.08));
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-top-right-radius: 4px;
}
.hgw-cmsg.sys { align-self: center; max-width: 72%; }
.hgw-cmsg.sys .cm-body {
  background: rgba(127, 208, 168, 0.05);
  border: 1px solid rgba(127, 208, 168, 0.2);
  color: var(--hgw-ok);
  font-size: var(--hgw-fs-xs);
  text-align: center;
}
/* 学院色消息边 */
.hgw-cmsg.ai.gry .cm-body { border-left: 3px solid var(--hgw-gryffindor); }
.hgw-cmsg.ai.sly .cm-body { border-left: 3px solid var(--hgw-slytherin); }
.hgw-cmsg.ai.rav .cm-body { border-left: 3px solid var(--hgw-ravenclaw); }
.hgw-cmsg.ai.huf .cm-body { border-left: 3px solid var(--hgw-hufflepuff); }

/* —— 结算块卡片 —— */
.hgw-cmsg .cm-body .hgw-settle-card {
  margin: 8px 0;
  padding: 10px 12px;
  border-radius: var(--hgw-r-sm);
  background: rgba(127, 208, 168, 0.04);
  border: 1px dashed rgba(127, 208, 168, 0.25);
  font-size: 10px;
  color: var(--hgw-ok);
  font-family: Consolas, monospace;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
}
.hgw-cmsg .cm-body .settle-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 4px;
  background: rgba(127, 208, 168, 0.12);
  color: var(--hgw-ok);
  margin: 2px 0;
}

/* —— 快捷动作区 —— */
#hgw-chat-quick {
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(13, 20, 31, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-top: none;
  flex-wrap: wrap;
  align-items: center;
}
#hgw-chat-quick .qk-label { font-size: 10px; color: var(--hgw-text-faint); margin-right: 2px; }
#hgw-chat-quick .hgw-btn { padding: 5px 12px; font-size: 11px; }

/* —— 战斗内嵌条（聊天内） —— */
#hgw-chat-duel {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: rgba(226, 75, 74, 0.05);
  border: 1px solid rgba(226, 75, 74, 0.2);
  border-top: none;
}
#hgw-chat-duel .dd-name { font-size: 11px; font-weight: 700; color: var(--hgw-text-bright); white-space: nowrap; }
#hgw-chat-duel .dd-bar { flex: 1; }
#hgw-chat-duel .dd-vs { font-size: 10px; color: var(--hgw-gold-dim); font-weight: 700; }
#hgw-chat-duel .dd-btn { flex-shrink: 0; }

/* —— 欢迎横幅（首次） —— */
.hgw-chat-welcome {
  align-self: center;
  max-width: 90%;
  padding: 14px 18px;
  border-radius: var(--hgw-r-lg);
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.1), transparent 60%),
    rgba(16, 26, 38, 0.9);
  border: 1px solid var(--hgw-gold-line);
  margin: 20px 0;
}
.hgw-chat-welcome .wl-title { font-family: var(--hgw-font-title); font-size: var(--hgw-fs-lg); color: var(--hgw-gold-bright); letter-spacing: 3px; margin-bottom: 8px; }
.hgw-chat-welcome .wl-text { font-size: var(--hgw-fs-xs); color: var(--hgw-text-dim); line-height: 2; }
.hgw-chat-welcome .wl-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

/* ============================================================
   霍格沃茨 · 同层应用 聊天主界面右侧信息栏（RPG 常驻面板）
   参照凡人修仙传三栏布局：左导航 | 中间聊天 | 右侧状态栏
   ============================================================ */

/* —— 聊天布局（两栏） —— */
.hgw-chat-layout {
  display: flex;
  gap: 12px;
  align-items: stretch;
  height: 100%;
  min-height: 72vh;
}
.hgw-chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* —— 右侧信息栏 —— */
#hgw-sidebar {
  width: 236px;
  min-width: 236px;
  max-width: 236px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  padding-right: 2px;
}
#hgw-sidebar .hgw-sec-card {
  background: rgba(16, 26, 38, 0.88);
  border: 1px solid rgba(201, 162, 39, 0.22);
  border-radius: var(--hgw-r-md);
  padding: 10px 12px;
  flex-shrink: 0;
}
#hgw-sidebar .hgw-sec-card .sc-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--hgw-gold-bright);
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid rgba(201, 162, 39, 0.15);
}
#hgw-sidebar .hgw-sec-card .sc-title .ic { font-size: 13px; }
#hgw-sidebar .hgw-sec-card .sc-title .more { margin-left: auto; font-size: 9px; color: var(--hgw-text-faint); cursor: pointer; font-weight: 400; }
#hgw-sidebar .hgw-sec-card .sc-title .more:hover { color: var(--hgw-gold-bright); }

/* 玩家卡 */
#hgw-sidebar .sb-player {
  text-align: center;
  padding: 12px 10px;
}
#hgw-sidebar .sb-player .sp-ava {
  width: 52px;
  height: 52px;
  margin: 0 auto 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--hgw-gryffindor), #7a1f15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  border: 2px solid var(--hgw-gold);
  box-shadow: var(--hgw-shadow-gold);
}
#hgw-sidebar .sb-player .sp-name { font-size: 13px; font-weight: 700; color: var(--hgw-text-bright); }
#hgw-sidebar .sb-player .sp-realm { font-size: 10px; color: var(--hgw-gold-bright); margin: 2px 0 8px; }
#hgw-sidebar .sb-player .sp-bars { display: flex; flex-direction: column; gap: 6px; text-align: left; }
#hgw-sidebar .sb-player .sp-bars .hgw-bar-label { font-size: 9px; margin-bottom: 2px; }

/* 魔咒列表 */
#hgw-sidebar .sb-spell {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
}
#hgw-sidebar .sb-spell:last-child { border-bottom: none; }
#hgw-sidebar .sb-spell .ss-name { font-size: 11px; color: var(--hgw-text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hgw-sidebar .sb-spell .ss-lv { font-size: 10px; color: var(--hgw-gold-bright); font-weight: 700; }
#hgw-sidebar .sb-spell .ss-exp { width: 46px; }
#hgw-sidebar .sb-spell.ext .ss-name { color: #c3b4e8; }

/* 物品格 */
#hgw-sidebar .sb-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
#hgw-sidebar .sb-item {
  text-align: center;
  padding: 5px 2px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
#hgw-sidebar .sb-item .si-ico { font-size: 15px; }
#hgw-sidebar .sb-item .si-num { font-size: 10px; color: var(--hgw-gold-bright); font-weight: 700; margin-top: 1px; }
#hgw-sidebar .sb-item .si-name { font-size: 8px; color: var(--hgw-text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 目标/任务卡 */
#hgw-sidebar .sb-target {
  padding: 8px;
  border-radius: var(--hgw-r-sm);
  background: rgba(201, 162, 39, 0.05);
  border: 1px solid rgba(201, 162, 39, 0.18);
  margin-bottom: 6px;
}
#hgw-sidebar .sb-target .st-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--hgw-text-bright); }
#hgw-sidebar .sb-target .st-namei { font-size: 9px; color: var(--hgw-text-faint); margin: 3px 0 6px; }
#hgw-sidebar .sb-target .st-bars { display: flex; flex-direction: column; gap: 4px; }
#hgw-sidebar .sb-target .st-bars .hgw-bar-label { font-size: 8px; margin-bottom: 1px; }
#hgw-sidebar .sb-target .st-bars .hgw-bar { height: 5px; }
#hgw-sidebar .sb-no-target {
  font-size: 10px;
  color: var(--hgw-text-faint);
  line-height: 1.7;
  padding: 4px 0;
}

/* 迷你课表 */
#hgw-sidebar .sb-session { display: flex; align-items: center; gap: 6px; font-size: 10px; padding: 3px 0; color: var(--hgw-text-dim); }
#hgw-sidebar .sb-session .ss-time { color: var(--hgw-gold-bright); font-weight: 700; width: 32px; flex-shrink: 0; }
#hgw-sidebar .sb-session .ss-who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hgw-sidebar .sb-session .ss-res { font-size: 9px; }

/* 装备 */
#hgw-sidebar .sb-equip { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--hgw-text-dim); padding: 3px 0; }
#hgw-sidebar .sb-equip .eq-ico { font-size: 14px; }
#hgw-sidebar .sb-equip .eq-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hgw-sidebar .sb-equip .eq-rank { font-size: 9px; }

/* 响应式：窄屏隐藏右栏 */
@media (max-width: 900px) {
  #hgw-sidebar { display: none; }
  .hgw-chat-layout { display: block; }
}

</style>

/* ========== 工具函数 ========== */
App.clamp = (v, min, max) => Math.max(min, Math.min(max, v));
App.rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
App.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
App.pickN = (arr, n) => {
  const a = arr.slice();
  const out = [];
  while (out.length < n && a.length) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);
  return out;
};
App.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
App.esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
App.nl2br = (s) => App.esc(s).replace(/\n/g, '<br>');
App.fmtNum = (n) => (n == null ? 0 : Number(n).toLocaleString());
App.now = () => new Date().toLocaleString('zh-CN', { hour12: false });
App.deepGet = (obj, path, dft) => {
  const segs = String(path || '').split('.');
  let o = obj;
  for (const s of segs) {
    if (o == null) return dft;
    o = o[s];
  }
  return o == null ? dft : o;
};
App.deepSet = (obj, path, val) => {
  const segs = String(path || '').split('.');
  let o = obj;
  for (let i = 0; i < segs.length - 1; i++) {
    const k = segs[i];
    if (o[k] == null || typeof o[k] !== 'object') o[k] = {};
    o = o[k];
  }
  o[segs[segs.length - 1]] = val;
};
App.deepMerge = (target, ...srcs) => {
  for (const src of srcs) {
    if (!src || typeof src !== 'object') continue;
    for (const k of Object.keys(src)) {
      const v = src[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
        App.deepMerge(target[k], v);
      } else {
        target[k] = v;
      }
    }
  }
  return target;
};

App.realmName = (stat) => {

  return App.REALMS[App.clamp((rp.大境界 || 1) - 1, 0, 8)] + '·' + (rp.层 || 1);
};
App.realmMul = (stat) => {
  const rp = (stat.玩家 && stat.玩家.魔力阶位) || {};
  const idx = App.clamp(((rp.大境界 || 1) - 1) * 3 + ((rp.层 || 1) - 1), 0, 26);
  return App.REALM_MUL[idx];
};

/* ========== 事件总线 ========== */
App.events = {};
App.on = function (name, fn) {
  (App.events[name] = App.events[name] || []).push(fn);
  return () => App.off(name, fn);
};
App.off = function (name, fn) {
  const l = App.events[name];
  if (l) App.events[name] = l.filter(f => f !== fn);
};
App.emit = function (name, payload) {
  const l = App.events[name];
  if (l) l.slice().forEach(fn => { try { fn(payload); } catch (e) { console.error('[HGW] event error:', name, e); } });
};

/* ========== 简单 DOM 助手 ========== */
App.$ = (sel, root) => (root || document).querySelector(sel);
App.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
App.el = (tag, attrs, html) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (html != null) e.innerHTML = html;
  return e;
};

/* 防抖 */
App.debounce = (fn, ms) => {
  let t = null;
  return function (...args) {
    if (t) clearTimeout(t);
    t = setTimeout(() => { t = null; fn.apply(this, args); }, ms);
  };
};

App.addLog = function (type, text) {
  App.log.unshift({ type, text, time: App.now(), ts: Date.now() });
  if (App.log.length > 500) App.log.length = 500;
  try {
    const saved = JSON.parse(localStorage.getItem('HGW_APP_LOG_V1') || '[]');
    saved.unshift({ type, text, time: App.now(), ts: Date.now() });
    localStorage.setItem('HGW_APP_LOG_V1', JSON.stringify(saved.slice(0, 300)));
  } catch (e) { /* ignore */ }
};
App.loadLog = function () {
  try { return JSON.parse(localStorage.getItem('HGW_APP_LOG_V1') || '[]'); } catch (e) { return []; }
};

/* ========== RPC 发送 ========== */
App.rpc = function (method, params, timeoutMs) {
  return new Promise((resolve) => {
    const id = App.uid();
    const timer = timeoutMs ? setTimeout(() => resolve({ ok: false, error: 'timeout' }), timeoutMs) : null;
    const handler = (ev) => {
      const d = ev.data;
      if (!d || d.channel !== App.RPC.CHANNEL || d.id !== id) return;
      window.removeEventListener('message', handler);
      if (timer) clearTimeout(timer);
      resolve(d);
    };
    window.addEventListener('message', handler);
    const msg = { channel: App.RPC.CHANNEL, id, method, params };
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage(msg, '*'); } catch (e) { resolve({ ok: false, error: String(e) }); }
    } else {
      // 无父窗口：尝试本地降级
      App._localRpc(msg).then(resolve);
    }
  });
};

      try {
        const mvu = localStorage.getItem('HGW_MVU_MIRROR_V1');
        if (mvu) stat = JSON.parse(mvu);
      } catch (e) { /* ignore */ }
      if (!stat) stat = App.defaultStat();
      return { ok: true, id: msg.id, channel: App.RPC.CHANNEL, result: stat };
    }
    case App.RPC.WRITE_STAT: {
      const cur = await App._localRpc({ method: App.RPC.READ_STAT, id: msg.id });
      App.deepMerge(cur.result, msg.params.patch || {});
      try { localStorage.setItem('HGW_MVU_MIRROR_V1', JSON.stringify(cur.result)); } catch (e) { /* ignore */ }
      App.emit('stat_changed', cur.result);
      return { ok: true, id: msg.id, channel: App.RPC.CHANNEL, result: cur.result };
    }
    case App.RPC.SEND_ACTION: {
      console.log('[HGW·调试] 发送行动:', msg.params.text);
      App.addLog('social', '发送：' + String(msg.params.text).slice(0, 80));
      return { ok: true, id: msg.id, channel: App.RPC.CHANNEL };
    }
    case App.RPC.GET_TRANSCRIPT: {
      try {
        const t = JSON.parse(localStorage.getItem('HGW_TRANSCRIPT_V1') || '[]');
        return { ok: true, id: msg.id, channel: App.RPC.CHANNEL, result: t };
      } catch (e) { return { ok: true, id: msg.id, channel: App.RPC.CHANNEL, result: [] }; }
    }
    case App.RPC.SET_GEN_STATE: {
      App._genState = msg.params.state || 'idle';
      App.emit('gen_state', App._genState);
      return { ok: true, id: msg.id, channel: App.RPC.CHANNEL };
    }
    case App.RPC.GET_GEN_STATE: {
      return { ok: true, id: msg.id, channel: App.RPC.CHANNEL, result: App._genState || 'idle' };
    }
    default:
      return { ok: false, id: msg.id, channel: App.RPC.CHANNEL, error: 'unknown method' };
  }
};

/* ========== 状态读写 ========== */
App._stat = null;
App.readStat = async function (force) {
  if (App._stat && !force) return App._stat;
  const r = await App.rpc(App.RPC.READ_STAT, {}, 3000);
  if (r.ok && r.result) {
    App._stat = r.result;
    App.emit('stat_loaded', App._stat);
  }
  if (!App._stat) App._stat = App.defaultStat();
  return App._stat;
};
App.writeStat = async function (patch) {
  const stat = await App.readStat(true);
  App.deepMerge(stat, patch);
  const r = await App.rpc(App.RPC.WRITE_STAT, { patch }, 5000);
  if (r.ok && r.result) App._stat = r.result;
  App.emit('stat_changed', App._stat);
  return App._stat;
};
App.get = (path, dft) => App.deepGet(App._stat || {}, path, dft);

/* ========== 行动发送（主链路） ========== */
App.sendAction = async function (text) {
  const raw = String(text || '').trim();
  if (!raw) return;
  App.addLog('social', '行动：' + raw.slice(0, 60));
  await App.rpc(App.RPC.SEND_ACTION, { text: raw }, 5000);
  App.emit('action_sent', raw);
};

/* ========== 剧情镜像 ========== */
App.getTranscript = async function () {
  const r = await App.rpc(App.RPC.GET_TRANSCRIPT, {}, 3000);
  if (r.ok && Array.isArray(r.result)) return r.result;
  return [];
};

/* ========== 生成状态 ========== */
App.setGenState = function (state) {
  App.rpc(App.RPC.SET_GEN_STATE, { state }, 2000);
};
App.getGenState = async function () {
  const r = await App.rpc(App.RPC.GET_GEN_STATE, {}, 2000);
  return r.ok ? r.result : 'idle';
};

/* ========== 初始化（探测 bridge 可用性） ========== */
App.initBridge = async function () {
  // 若运行在 ST 楼层 iframe：window.parent 存在且非自身 → 走 RPC
  // 但同层应用可能以 srcdoc 独立 iframe 形式挂载（parent 是 shell），同样走 RPC
  try {
    const r = await App.rpc(App.RPC.PING, {}, 1500);
    App.BRIDGE_READY = r.ok;
  } catch (e) {
    App.BRIDGE_READY = false;
  }
  if (!App.BRIDGE_READY) {
    // 本地模式：直接使用 localStorage 镜像
    App._localMode = true;
    console.warn('[HGW] 桥接未就绪，进入本地降级模式（调试用）');
  }
  return App.BRIDGE_READY;
};

/* ========== 默认状态（首次启动 / 降级） ========== */
App.defaultStat = function () {
  // 完整初始模板（initvar.yaml 生成）：含 11 女巫初始档案
  return App.INIT_STAT ? JSON.parse(JSON.stringify(App.INIT_STAT)) : {};
};

/* ========== 状态归一化（缺字段补默认） ========== */
App.normalizeStat = function (stat) {
  const dft = App.defaultStat();
  App.deepMerge(dft, stat || {});
  return dft;
};

/* ========== Toast 通知 ========== */
App.UI.toast = function (msg, type, duration) {
  type = type || 'ok';
  duration = duration || 3200;
  const icons = { ok: '✅', warn: '⚠️', danger: '❌', love: '💗', magic: '✨', gold: '🌟' };
  const root = App.$('#hgw-toasts');
  if (!root) return;

    el.classList.add('out');

/* ========== Modal 模态框 ========== */
App.UI.modal = function (opts) {
  // opts: { title, icon, body(html|node), footer(html), wide|xl|sm, onClose, closeBtn }
  const root = App.$('#hgw-modal-root');
  const overlay = App.el('div', { class: 'hgw-overlay' });
  const modal = App.el('div', { class: 'hgw-modal' + (opts.wide ? ' wide' : '') + (opts.xl ? ' xl' : '') + (opts.sm ? ' sm' : '') });
  const head = App.el('div', { class: 'hgw-modal-head' });
  head.innerHTML = '<div class="mtitle">' + (opts.icon ? '<span>' + opts.icon + '</span>' : '') + App.esc(opts.title || '') + '</div>';
  if (opts.closeBtn !== false) {
    const closeBtn = App.el('button', { class: 'mclose', 'aria-label': '关闭' }, '✕');
    closeBtn.addEventListener('click', () => close());
    head.appendChild(closeBtn);
  }
  const body = App.el('div', { class: 'hgw-modal-body' });
  if (typeof opts.body === 'string') body.innerHTML = opts.body;
  else if (opts.body) body.appendChild(opts.body);
  modal.appendChild(head);
  modal.appendChild(body);
  if (opts.footer) {
    const foot = App.el('div', { class: 'hgw-modal-foot' });
    foot.innerHTML = opts.footer;
    modal.appendChild(foot);
  }
  overlay.appendChild(modal);
  root.appendChild(overlay);
  function close() {
    modal.classList.add('hide');
    overlay.classList.add('hide');
    setTimeout(() => { overlay.remove(); if (opts.onClose) opts.onClose(); }, 220);
  }
  overlay.addEventListener('click', (e) => { if (e.target === overlay && opts.closable !== false) close(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  return { overlay, modal, body, close };
};

/* ========== Confirm 确认框 ========== */
App.UI.confirm = function (opts) {
  // opts: { title, msg, sub, icon('warn'|'danger'|'ok'|'love'), okText, cancelText, onOk }
  const ico = { warn: '⚠️', danger: '💀', ok: '✅', love: '💗' };
  return new Promise((resolve) => {
    const m = App.UI.modal({
      title: opts.title || '确认',
      sm: true,
      body: '<div class="hgw-confirm">' +
        '<div class="icon-box ' + (opts.icon || 'warn') + '">' + (ico[opts.icon] || '❓') + '</div>' +
        '<div class="cmsg">' + App.esc(opts.msg || '确定吗？') + '</div>' +
        (opts.sub ? '<div class="csub">' + App.esc(opts.sub) + '</div>' : '') +
        '</div>',
      footer: '<button class="hgw-btn ghost" data-c="0">' + App.esc(opts.cancelText || '取消') + '</button>' +
        '<button class="hgw-btn ' + (opts.icon === 'danger' ? 'danger' : 'ok') + '" data-c="1">' + App.esc(opts.okText || '确定') + '</button>',
      closeBtn: false,
      onClose: () => resolve(false),
    });
    m.modal.querySelector('[data-c="0"]').addEventListener('click', () => { m.close(); resolve(false); });
    m.modal.querySelector('[data-c="1"]').addEventListener('click', () => { m.close(); resolve(true); if (opts.onOk) opts.onOk(); });
  });
};

/* ========== Prompt 输入框 ========== */
App.UI.prompt = function (opts) {
  // opts: { title, msg, placeholder, value, okText, onOk(value) }
  return new Promise((resolve) => {
    const input = App.el('input', { class: 'pinput', placeholder: opts.placeholder || '', value: opts.value || '' });
    const m = App.UI.modal({
      title: opts.title || '输入',
      sm: true,
      body: '<div class="hgw-prompt">' +
        (opts.msg ? '<div class="pmsg">' + App.esc(opts.msg) + '</div>' : '') +
        '</div>',
      footer: '<button class="hgw-btn ghost" data-c="0">取消</button><button class="hgw-btn ok" data-c="1">' + App.esc(opts.okText || '确定') + '</button>',
      closeBtn: false,
      onClose: () => resolve(null),
    });
    m.body.querySelector('.hgw-prompt').appendChild(input);
    input.focus();
    const doOk = () => { const v = input.value.trim(); m.close(); resolve(v); if (opts.onOk) opts.onOk(v); };
    m.modal.querySelector('[data-c="0"]').addEventListener('click', () => { m.close(); resolve(null); });
    m.modal.querySelector('[data-c="1"]').addEventListener('click', doOk);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doOk(); });
  });
};

/* ========== 输入栏绑定 ========== */
App.bindInput = function () {
  const input = App.$('#hgw-input');
  const send = App.$('#hgw-btn-send');
  const roll = App.$('#hgw-btn-roll');
  if (!input) return;
  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(120, input.scrollHeight) + 'px';
  };
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  if (send) send.addEventListener('click', doSend);
  if (roll) roll.addEventListener('click', () => {
    const n = App.rand(1, 20);
    App.UI.toast('🎲 投出 d20：' + n + (n === 20 ? ' —— 大成功！' : (n === 1 ? ' —— 大失败！' : '')), n === 20 ? 'gold' : (n === 1 ? 'warn' : 'magic'));
    App.sendAction('（我投了个 d20，结果：' + n + '）');
  });
  async function doSend() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    autoGrow();
    // 独立 AI 模式：输入直接走用户配置的 API
    if (App.cfg && App.cfg.aiMode === 'independent' && App.AI && App.AI.enabled()) {
      App.setGenState('sending');
      const reply = await App.aiChat(text);
      if (reply != null) {
        // 本地回显：AI 回复 + 用户消息
        const body = App.$('#hgw-chat-body');
        if (body) {
          body.insertAdjacentHTML('beforeend', App.renderMsg ? renderChatMsgLocal(text, 'user') : '');
          body.insertAdjacentHTML('beforeend', App.renderMsg ? renderChatMsgLocal(reply, 'ai') : '');
          body.scrollTop = body.scrollHeight;
        } else {
          // 非聊天视图也提示
          App.UI.toast('独立 AI 已回复（切到聊天界面查看）', 'ok');
        }
        App.refreshTopbar();
      }
      App.setGenState('idle');
      return;
    }
    App.setGenState('sending');
    await App.sendAction(text);
    App.setGenState('busy');
  }
  function renderChatMsgLocal(text, role) {
    const name = role === 'user' ? '你' : '霍格沃茨';
    return '<div class="hgw-cmsg ' + role + '"><div class="cm-head"><span class="cm-ava">' + (role === 'user' ? '🧙' : '👩') + '</span><span class="cm-name">' + name + '</span></div><div class="cm-body">' + App.nl2br(text) + '</div></div>';
  }
};

/* ========== 启动 ========== */
App.start = async function () {
  try {
    await App.initBridge();
  } catch (e) { /* 降级模式 */ }
  // 加载状态
  await App.readStat(true);
  App._stat = App.normalizeStat(App._stat);
  // 首次初始化：角色级变量为空/残缺时，把补全后的完整默认 stat 持久化写回
  // （防：新聊天无 stat_data → 写回基于空 stat → 数据永久残缺）
  // 带延迟重试：应用启动早期桥可能未就绪（RPC 超时静默失败），桥就绪后补做
  const tryInitStat = async () => {
    try {
      const p = App._stat.玩家 || {};
      const wc = Object.keys(App._stat.女巫角色 || {}).length;
      if (!p.属性 || !p.学业 || wc === 0) {
        await App.writeStat(App._topPatch(App._stat));
        console.log('[HGW] stat_data 首次初始化完成（角色级变量已持久化）');
      }
    } catch (e) { console.warn('[HGW] stat 初始化写回失败', e); }
  };
  await tryInitStat();
  if (!App.BRIDGE_READY) setTimeout(tryInitStat, 2500);
  // 本地 UI 配置
  App.cfg = {};
  try { App.cfg = JSON.parse(localStorage.getItem(App.CFG_KEY) || '{}'); } catch (e) { App.cfg = {}; }
  App.saveCfg = function () {
    try { localStorage.setItem(App.CFG_KEY, JSON.stringify(App.cfg)); } catch (e) { /* ignore */ }
  };
  // 渲染骨架
  App.bindTopbar();
  App.bindNav();
  App.bindInput();
  App.refreshTopbar();
  // 默认视图：首次进入先做开局引导（分院仪式·角色创建），完成后进主聊天
  let guideDone = false;
  try { guideDone = !!localStorage.getItem('HGW_GUIDE_DONE'); } catch (e) { }
  await App.navigate(guideDone ? 'story' : 'create');
  // 记忆自动总结（新楼层 → 自动压缩入库，静默）
  if (App.summarizeNewFloors) App.summarizeNewFloors(false).catch(() => { });
  // 自动推演（轮次阈值 → 全员演化，静默）
  if (App.checkAutoEvolution) App.checkAutoEvolution(false).catch(() => { });
  // 桥接就绪通知
  if (App.BRIDGE_READY) {
    App.rpc(App.RPC.SET_GEN_STATE, { state: 'idle' });
    console.log('[HGW] 桥接就绪，同层应用启动完成');
  } else {
    console.warn('[HGW] 本地降级模式：界面可用，行动不会进入真实聊天');
    App.UI.toast('本地预览模式：行动不发送到酒馆', 'warn', 4000);
  }
  App.emit('app_ready', {});
};

/* 消息监听：shell 转发的状态推送 */
window.addEventListener('message', function (ev) {
  const d = ev.data;
  if (!d || d.channel !== App.RPC.CHANNEL) return;
  if (d.event === 'stat_pushed') {
    if (d.stat) { App._stat = d.stat; App.emit('stat_changed', d.stat); }
    if (App.currentView && App.views[App.currentView]) {
      const inner = App.$('#hgw-view-inner');
      if (inner) App.views[App.currentView].render(inner);
    }
    App.refreshTopbar();
  }
  if (d.event === 'gen_state') {
    App.setGenState(d.state || 'idle');
  }
  if (d.event === 'transcript_changed') {
    if (App.currentView === 'story') App.navigate('story');
    // 自动记忆（楼层阈值：每 N 层中期 / 每 M 层长期，静默）
    if (App.summarizeNewFloors) App.summarizeNewFloors(false).catch(() => { });
    // 自动推演（轮次阈值：全员演化，静默）
    if (App.checkAutoEvolution) App.checkAutoEvolution(false).catch(() => { });
  }
});

/* ========== 对话对象卡 ========== */
function targetCard(stat) {
  const target = (stat.课表 || {}).当前目标 || '';
  const chars = stat.女巫角色 || {};
  const names = Object.keys(chars);
  if (!target || !chars[target]) {
    // 无目标：显示可对话对象速选

      '<div class="ct-ava" style="background:linear-gradient(135deg,#2c3e50,#1a252f)">👥</div>' +
      '<div class="ct-info"><div class="ct-name">选择对话对象</div>' +
      '<div class="ct-meta">' + (names.length ? '点击下面任意女巫设为当前目标——调度器将加载她的性格/性癖条目' : '在剧情中结识女巫后，这里会出现她们的档案') + '</div>' +
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">' + names.slice(0, 6).map(n => {
        const c = chars[n] || {};
        const info = App.houseInfo(c.学院);

    '<div class="ct-name">' + App.esc(target) + App.houseBadge(c.学院) + '<span class="hgw-badge gold">目标</span></div>' +
    '<div class="ct-meta">' + App.esc(String(c.身份 || '').slice(0, 24)) + ' ｜ 名器：' + App.esc(String(c.名器 || '').split('—')[0]) + '</div>' +

/* ========== 玩家状态条 ========== */
function playerBar(stat) {
  const p = stat.玩家 || {};

  const st = p.状态 || {};
  const btl = (stat.课表 || {}).战斗 || {};
  const hpMax = btl.主角防守值上限 || Math.round((at.魔力值 || 76) * 1.2 * App.realmMul(stat));

  return '<div id="hgw-chat-playerbar">' +
    '<div class="pb-ava">🧙</div>' +

    '<span class="pb-item"><span class="ic">🪙</span><span class="vl">' + App.gold(stat) + '</span></span>' +
    '<span class="pb-item"><span class="ic">⚡</span><span class="vl">' + (p.胜点 || 0) + '</span></span>' +

/* ========== 战斗内嵌条 ========== */
function duelBar(stat) {
  const cd = stat.课表 || {};
  const btl = cd.战斗 || {};
  const target = cd.当前目标 || '';
  if (cd.战斗状态 !== '进行中' || !target) return '';
  const playerMax = btl.主角防守值上限 || 96;
  const playerHp = btl.主角防守值 != null ? btl.主角防守值 : playerMax;
  const herMax = btl.她防守值上限 || 44;
  const herHp = btl.她防守值 != null ? btl.她防守值 : herMax;
  return '<div id="hgw-chat-duel">' +
    '<span class="dd-name">🧙 你</span>' +
    '<div class="dd-bar">' + App.UI.bar(playerHp, 'green', '', true) + '</div>' +
    '<span class="dd-vs">VS</span>' +
    '<div class="dd-bar">' + App.UI.bar(herHp, 'red', '', true) + '</div>' +
    '<span class="dd-name">' + App.esc(target) + '</span>' +
    '<button class="hgw-btn sm danger dd-btn" data-ct="battle">⚔️ 进入决斗</button></div>';
}

/* ========== 右侧信息栏（玩家/魔咒/物品/目标/课表/装备） ========== */
function sidebarPanel(stat) {
  const p = stat.玩家 || {};
  const at = p.属性 || {};
  const st = p.状态 || {};
  const rp = p.魔力阶位 || {};
  const spells = p.咒语 || {};
  const lib = p.魔咒库 || {};
  const pots = p.魔药 || {};
  const mats = p.材料 || {};
  const eq = p.装备 || {};
  const chars = stat.女巫角色 || {};
  const target = (stat.课表 || {}).当前目标 || '';
  const cd = stat.课表 || {};
  const sessions = cd.今日场次 || {};

  let h = '<div id="hgw-sidebar">';

  // —— 玩家卡 ——
  h += '<div class="hgw-sec-card sb-player">' +
    '<div class="sp-ava">🧙</div>' +
    '<div class="sp-name">你 · 转学生</div>' +
    '<div class="sp-realm">' + App.realmName(stat) + ' · 系数×' + App.realmMul(stat) + '</div>' +
    '<div class="sp-bars">' +
    App.UI.bar(at.魔力值 || 0, 'gold', '魔力', true) +
    App.UI.bar(at.体力 || 0, 'green', '体力', true) +
    App.UI.bar(st.情欲 || 0, 'pink', '情欲', true) +
    App.UI.bar(st.快感 || 0, 'red', '快感', true) +
    '</div>' +
    '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:#9aa7b8">' +
    '<span>🪙 <b style="color:#e8d48b">' + App.gold(stat) + '</b></span>' +
    '<span>⚡ 胜点 <b style="color:#c3b4e8">' + (p.胜点 || 0) + '</b></span>' +
    '<span>🏆 <b style="color:#e8d48b">' + ((p.战绩 || {}).决斗荣誉 || 0) + '</b></span>' +
    '</div></div>';

  // —— 魔咒 ——
  h += '<div class="hgw-sec-card"><div class="sc-title"><span class="ic">🪄</span>魔咒<span class="more" data-navto="status">全部 →</span></div>';
  let spellCount = 0;
  for (const s of App.SPELLS) {
    const sp = spells[s.名] || { 等级: 1, 经验: 0 };
    const pct = Math.min(100, (sp.经验 || 0) / App.expNeed(sp.等级 || 1) * 100);
    h += '<div class="sb-spell"><span class="ss-name">' + s.名 + '</span><span class="ss-lv">Lv' + (sp.等级 || 1) + '</span><div class="ss-exp hgw-bar thin gold"><i style="width:' + pct + '%"></i></div></div>';
    spellCount++;
  }
  for (const k in lib) {
    const lv = lib[k].等级 || 1;
    h += '<div class="sb-spell ext"><span class="ss-name">' + k + '</span><span class="ss-lv">Lv' + lv + '</span><div class="ss-exp hgw-bar thin purple"><i style="width:100%"></i></div></div>';
    spellCount++;
  }
  if (!spellCount) h += '<div class="sb-no-target">暂无魔咒</div>';
  h += '</div>';

  // —— 物品 ——
  h += '<div class="hgw-sec-card"><div class="sc-title"><span class="ic">🎒</span>物品<span class="more" data-navto="status">背包 →</span></div><div class="sb-items">';
  let itemCount = 0;
  for (const k in pots) {
    if (pots[k] > 0) {
      h += '<div class="sb-item"><div class="si-ico">' + (App.POTION_ICONS[k] || '🧴') + '</div><div class="si-num">×' + pots[k] + '</div><div class="si-name">' + k + '</div></div>';
      itemCount++;
    }
  }
  for (const k in mats) {
    const m = mats[k] || {};
    if (m.数量 > 0) {
      h += '<div class="sb-item"><div class="si-ico">🌿</div><div class="si-num">×' + m.数量 + '</div><div class="si-name">' + k + '</div></div>';
      itemCount++;
    }
  }
  if (!itemCount) h += '<div class="sb-no-target" style="grid-column:1/-1">空空如也</div>';
  h += '</div></div>';

  // —— 当前目标/任务 ——
  h += '<div class="hgw-sec-card"><div class="sc-title"><span class="ic">🎯</span>当前目标<span class="more" data-navto="roster">名录 →</span></div>';
  if (target && chars[target]) {
    const c = chars[target] || {};
    h += '<div class="sb-target">' +
      '<div class="st-head">👩 ' + App.esc(target) + '</div>' +
      '<div class="st-namei">名器：' + App.esc(String(c.名器 || '').split('—')[0]) + ' ｜ ' + App.esc(c.身份 || '').slice(0, 14) + '</div>' +
      '<div class="st-bars">' +
      App.UI.bar(c.好感度 || 0, 'pink', '♥ 好感', true) +
      App.UI.bar(c.缴械值 || 0, 'red', '⚔ 服气', true) +
      App.UI.bar(c.堕落值 || 0, 'purple', '💜 堕落', true) +
      App.UI.bar(c.欲望积压 || 0, '', '🔥 积压', true) +
      '</div></div>';
  } else {
    h += '<div class="sb-no-target">未设目标。在聊天顶部点选女巫，或在名录里选择——调度器将按目标加载她的性格/性癖条目。</div>';
  }
  h += '</div>';

  // —— 今日场次（迷你课表） ——
  h += '<div class="hgw-sec-card"><div class="sc-title"><span class="ic">🗓️</span>今日场次<span class="more" data-navto="schedule">课表 →</span></div>';
  let hasSess = false;
  for (const pd of App.PERIODS) {
    const s = sessions[pd];
    if (s && s.参与者) {
      hasSess = true;
      h += '<div class="sb-session"><span class="ss-time">' + pd + '</span><span class="ss-who">' + App.esc(s.参与者) + '</span><span class="ss-res hgw-badge ' + (s.结果 === '你胜' ? 'ok' : s.结果 === '你败' ? 'danger' : 'ghost') + '" style="font-size:8px;padding:0 5px">' + (s.结果 || '未开战') + '</span></div>';
    }
  }
  if (!hasSess) h += '<div class="sb-no-target">尚未生成课表——去课表页点「生成课表」</div>';
  h += '</div>';

  // —— 装备 ——
  if (eq && Object.keys(eq).length) {
    h += '<div class="hgw-sec-card"><div class="sc-title"><span class="ic">🛡️</span>装备</div>';
    for (const k in eq) {
      const e = eq[k] || {};
      if (e.名) h += '<div class="sb-equip"><span class="eq-ico">' + (k === '魔杖' ? '🪄' : k === '巫师袍' ? '🧥' : '💍') + '</span><span class="eq-name">' + App.esc(e.名) + '</span><span class="eq-rank rar-' + String(e.品级 || '普通').toLowerCase() + '">' + (e.品级 || '普通') + '</span></div>';
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

/* ========== 快捷动作 ========== */
function quickActions(stat) {
  const target = (stat.课表 || {}).当前目标 || '';
  const tgt = target ? '（对' + target + '）' : '';
  const acts = [
    ['💬 搭话', '（我走向' + (target || '礼堂长桌旁的人') + '，自然地打了个招呼）'],
    ['🌹 调情', '（我凑近' + (target || '她') + '，压低声音说了句暧昧的话）'],
    ['👀 观察', '（我留意着' + (target || '四周') + '的一举一动，记下她的状态）'],
    ['🎁 送礼', '（我拿出准备好的小礼物，递给' + (target || '她') + '）'],
  ];
  if (target) {
    acts.push(['⚔️ 邀战', '（我向' + target + '发起决斗挑战，扬了扬魔杖）']);
    acts.push(['💗 邀约', '（我试着邀请' + target + '单独相处）']);
  }
  acts.push(['📅 看课表', 'goto:schedule'], ['🌙 推进一天', 'goto:nextday'], ['🏰 大厅', 'goto:home']);
  let h = '<div id="hgw-chat-quick"><span class="qk-label">快捷行动' + tgt + '：</span>';
  for (const [label, action] of acts) {
    const isGo = String(action).startsWith('goto:');
    h += '<button class="hgw-btn sm ' + (isGo ? 'ghost' : '') + '" data-qk="' + (isGo ? action : action) + '">' + label + '</button>';
  }
  h += '</div>';
  return h;
}

/* ========== 消息渲染（RPG 气泡） ========== */
function renderMsg(m) {
  const role = m.role === 'user' ? 'user' : (m.role === 'system' ? 'sys' : 'ai');
  if (role === 'sys') {
    return '<div class="hgw-cmsg sys"><div class="cm-body">' + App.esc(String(m.message || '')) + '</div></div>';
  }
  const name = m.name || (m.role === 'user' ? '你' : '');
  // 学院色（按 name 匹配女巫）
  let cls = '';
  const stat = App._stat || {};
  const ch = (stat.女巫角色 || {})[String(name).split(' ')[0]] || (stat.女巫角色 || {})[name];
  if (ch && ch.学院) cls = App.houseInfo(ch.学院).cls;
  let text = String(m.message || '');
  // 结算块 → 卡片
  text = text.replace(/(【(对抗|双修|突破|植入|高潮确认|双修完成|炼药)结算】[^\n]*)/g,
    '<div class="hgw-settle-card">$1</div>');
  return '<div class="hgw-cmsg ' + role + ' ' + cls + '">' +
    '<div class="cm-head"><span class="cm-ava">' + (m.role === 'user' ? '🧙' : '👩') + '</span><span class="cm-name">' + App.esc(name) + '</span></div>' +
    '<div class="cm-body">' + App.nl2br(text) + '</div></div>';
}

/* ========== 主聊天视图 ========== */
App.registerView('story', async function (box) {
  const stat = await App.readStat();
  const msgs = await App.getTranscript();
  const target = (stat.课表 || {}).当前目标 || '';
  const chars = stat.女巫角色 || {};
  const hasChar = Object.keys(chars).length > 0;

  let h = '';
  h += '<div class="hgw-chat-layout">';
  h += '<div class="hgw-chat-main">';
  h += sceneBanner(stat);
  h += targetCard(stat);
  h += playerBar(stat);
  h += duelBar(stat);
  h += '<div id="hgw-chat-body">';

  if (!msgs.length || !localStorage.getItem('HGW_GUIDE_V1')) {
    // 欢迎横幅（首次进入必显示，之后仅在空聊天显示；可"知道了"关闭）
    h += '<div class="hgw-chat-welcome">' +
      '<div class="wl-title">⚡ 欢迎来到霍格沃茨</div>' +
      '<div class="wl-text">1991 年 9 月 1 日，你踏进霍格沃茨——这里是你的主聊天界面。<br>' +
      (hasChar ? '在下方输入你的第一个行动，或点击快捷行动按钮开始。' : '在剧情中认识女巫后，她们会出现在顶部对象卡。') + '<br>' +
      '<span class="hgw-text-faint">【酒馆内】对话经真实楼层发送，AI 回复出现在这里。' +
      '【本地预览】行动只打印到控制台，不会发送。</span></div>' +
      '<div class="wl-actions">' +
      (hasChar ? '<button class="hgw-btn ok sm" data-wl="talk">💬 打招呼</button><button class="hgw-btn magic sm" data-wl="observe">👀 观察四周</button>' : '') +
      '<button class="hgw-btn sm" data-wl="home">🏰 查看城堡大厅</button>' +
      '<button class="hgw-btn sm" data-wl="schedule">🗓️ 今日课表</button>' +
      '<button class="hgw-btn sm" data-wl="guide">✔ 知道了，开始游玩</button>' +
      '</div></div>';
  } else {
    const list = msgs.slice(-50);
    for (const m of list) h += renderMsg(m);
  }
  h += '</div>';
  h += quickActions(stat);
  h += '</div>';
  h += sidebarPanel(stat);
  h += '</div>';

  box.innerHTML = h;
  // 滚动到底
  const body = App.$('#hgw-chat-body');
  if (body) body.scrollTop = body.scrollHeight;

  /* 事件绑定 */
  // 右栏更多跳转
  App.$$('[data-navto]', box).forEach(el => el.addEventListener('click', () => App.navigate(el.dataset.navto)));
  // 选目标
  App.$$('[data-chattarget]', box).forEach(el => el.addEventListener('click', async () => {
    await App.writeStat({ 课表: { 当前目标: el.dataset.chattarget } });
    App.UI.toast('已设目标：' + el.dataset.chattarget, 'gold');
    App.navigate('story');
  }));
  // 对象卡动作
  App.$$('[data-ct]', box).forEach(el => el.addEventListener('click', () => {
    const act = el.dataset.ct;
    if (act === 'detail') App.openCharDetail ? App.openCharDetail(target) : App.navigate('roster');
    else if (act === 'battle') App.navigate('battle');
    else if (act === 'love') App.navigate('love');
  }));
  // 快捷动作
  App.$$('[data-qk]', box).forEach(el => el.addEventListener('click', async () => {
    const action = el.dataset.qk;
    if (action.startsWith('goto:')) {
      const dest = action.slice(5);
      if (dest === 'nextday') { await App.nextDay(); App.navigate('schedule'); }
      else App.navigate(dest);
      return;
    }
    App.setGenState('sending');
    await App.sendAction(action);
    App.setGenState('busy');
    // 本地模式立即回显
    if (!App.BRIDGE_READY) {
      const body2 = App.$('#hgw-chat-body');
      if (body2) {
        body2.insertAdjacentHTML('beforeend', renderMsg({ role: 'user', message: action }));
        body2.scrollTop = body2.scrollHeight;
      }
    }
  }));
  // 欢迎横幅动作
  App.$$('[data-wl]', box).forEach(el => el.addEventListener('click', async () => {
    const act = el.dataset.wl;
    if (act === 'talk') await App.sendAction('（我走向' + (target || '礼堂长桌旁的女巫们') + '，自然地打了个招呼）');
    else if (act === 'observe') await App.sendAction('（我环顾四周，观察今天城堡里的气氛和人们的表情）');
    else if (act === 'home') App.navigate('home');
    else if (act === 'schedule') App.navigate('schedule');
    else if (act === 'guide') {
      try { localStorage.setItem('HGW_GUIDE_V1', '1'); } catch (e) { }
      App.UI.toast('欢迎横幅已收起——随时可到「帮助」页查看玩法', 'ok');
      App.navigate('story');
    }
  }));
});

/* ========== 课表生成 ========== */
async function generateSchedule() {
  const stat = await App.readStat(true);
  const chars = stat.女巫角色 || {};
  const names = Object.keys(chars);
  if (!names.length) {
    App.UI.toast('还没有女巫建档——先让 AI 在剧情中引入角色', 'warn');
    return;
  }
  const byStack = (arr) => arr.slice().sort((a, b) => (chars[b].欲望积压 || 0) - (chars[a].欲望积压 || 0));
  const pick = (pool) => { const arr = byStack(pool); return arr.length ? arr.slice(0, Math.min(3, arr.length)).join('、') : ''; };
  const sessions = {};
  for (const pd of App.PERIODS) {
    sessions[pd] = { 参与者: pick(names), 结果: '未开战', 是否参战: false };
  }
  await App.writeStat({ 课表: { 今日场次: sessions } });
  App.addLog('social', '生成今日课表');
  App.UI.confetti(16);
  App.UI.toast('今日课表已生成——看看谁在线', 'gold');
  App.navigate('schedule');
}
App.generateSchedule = generateSchedule;

/* ========== 推进一天 ========== */
async function nextDay() {
  const stat = await App.readStat(true);
  const t = stat.时间 || {};
  const chars = stat.女巫角色 || {};
  const p = stat.玩家 || {};
  const wi = App.WEEK.indexOf(t.星期 || '星期一');
  t.星期 = App.WEEK[(wi + 1) % 7];
  const dayMap = { '星期一': 1, '星期二': 2, '星期三': 3, '星期四': 4, '星期五': 5, '星期六': 6, '星期日': 7 };
  const curDay = dayMap[t.星期] || 1;
  t.日期 = '199' + String(t.学年 || 1) + '年9月' + Math.min(30, Math.max(1, curDay)) + '日';
  for (const n in chars) {
    const c = chars[n];
    if (!c) continue;
    c.欲望积压 = App.clamp((c.欲望积压 || 0) + Math.max(2, Math.round((c.压力值 || 50) / 20)), 0, 100);
    if (c.堕落值 > 0) c.堕落值 = Math.max(0, Math.round(c.堕落值 - 2));
    if (c.心理状态) c.心理状态.欲望度 = App.clamp((c.心理状态.欲望度 || 0) + Math.round((c.欲望积压 || 0) / 25), 0, 100);
    c.今日已使用 = false;
  }
  if (p.属性) p.属性.体力 = App.clamp((p.属性.体力 || 0) + 40, 0, 100);
  if (p.生理) {
    p.生理.射精冷却剩余 = Math.max(0, (p.生理.射精冷却剩余 || 0) - 1);
    p.生理.今日射精次数 = 0;
  }
  const names = Object.keys(chars);
  const byStack = (arr) => arr.slice().sort((a, b) => (chars[b].欲望积压 || 0) - (chars[a].欲望积压 || 0));
  const pick = (pool) => { const arr = byStack(pool); return arr.length ? arr.slice(0, Math.min(3, arr.length)).join('、') : ''; };
  const sessions = {};
  for (const pd of App.PERIODS) sessions[pd] = { 参与者: pick(names), 结果: '未开战', 是否参战: false };
  // 植入念头阶段推进（潜伏→萌芽）
  const jumps = App.advanceImplant ? App.advanceImplant(stat) : [];
  await App.writeStat({ 时间: t, 女巫角色: chars, 玩家: p, 课表: { 今日场次: sessions, 当前目标: '' } });
  if (jumps && jumps.length) App.UI.toast('🧠 念头浮现：' + jumps.join('、'), 'magic');
  App.addLog('social', '推进一天 → ' + t.日期 + ' ' + t.星期);
  App.UI.toast('时间推进一天：' + t.日期 + ' ' + t.星期, 'magic');
  await App.refreshTopbar();
  App.navigate('schedule');
}
App.nextDay = nextDay;

  dr.body.addEventListener('click', async (e) => {

/* ========== 关系图谱视图（SVG 星图） ========== */
App.registerView('bonds', async function (box) {
  const stat = await App.readStat();
  const chars = stat.女巫角色 || {};
  const names = Object.keys(chars);
  const W = 760, H = 420, cx = W / 2, cy = H / 2;

  let h = '';
  h += '<div class="hgw-panel"><div class="panel-title"><span>🕸️</span>关系图谱<span class="sub">你与她们的距离 · 四轴汇聚</span></div>';
  if (!names.length) {
    h += App.UI.empty('🕸️', '暂无关系——在剧情中结识女巫后，这里会生成星图。');
    h += '</div>';
    box.innerHTML = h;
    return;
  }
  // 节点布局：环形
  const nodes = names.map((n, i) => {
    const ang = (Math.PI * 2 * i) / names.length - Math.PI / 2;
    return { n, x: cx + Math.cos(ang) * (W / 2 - 90), y: cy + Math.sin(ang) * (H / 2 - 70) };
  });
  let svg = '<svg id="hgw-bond-map" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  // 连线（到你）
  for (const nd of nodes) {
    const c = chars[nd.n] || {};
    const fav = c.好感度 || 0;
    const op = 0.15 + (fav / 100) * 0.65;
    const col = fav >= 60 ? '#d4537e' : (fav >= 30 ? '#c9a227' : '#4a5260');
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + nd.x + '" y2="' + nd.y + '" stroke="' + col + '" stroke-width="' + (1 + fav / 25) + '" opacity="' + op + '"/>';
  }
  // 中心玩家
  svg += '<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="#101a26" stroke="#c9a227" stroke-width="2"/>';
  svg += '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" fill="#e8d48b" font-size="14" font-weight="bold">你</text>';
  // 节点
  for (const nd of nodes) {
    const c = chars[nd.n] || {};
    const info = App.houseInfo(c.学院);
    const fav = c.好感度 || 0;
    const r = 22 + (fav / 100) * 8;
    svg += '<g data-char="' + nd.n + '" style="cursor:pointer">';
    svg += '<circle cx="' + nd.x + '" cy="' + nd.y + '" r="' + r + '" fill="' + info.color + '33" stroke="' + info.color + '" stroke-width="1.5"/>';
    svg += '<text x="' + nd.x + '" y="' + (nd.y - r - 6) + '" text-anchor="middle" fill="#d8d3c0" font-size="11">' + App.esc(nd.n) + '</text>';
    svg += '<text x="' + nd.x + '" y="' + (nd.y + 4) + '" text-anchor="middle" fill="#e8d48b" font-size="9">♥' + fav + '</text>';
    svg += '</g>';
  }
  svg += '</svg>';

  h += svg;
  h += '<div class="hgw-note" style="margin-top:10px">节点大小与颜色代表好感度；点击节点打开档案。服气（决斗）、堕落（心理）、积压（状态）见名录详情。</div>';
  h += '</div>';
  box.innerHTML = h;

  App.$$('g[data-char]', box).forEach(g => {
    g.addEventListener('click', () => openCharDetail(g.dataset.char));
  });
});

   霍格沃茨 · 同层应用 战斗引擎（魔法决斗 · 本地结算）

'use strict';

App.Battle = {
  picked: new Set(),
  libPicked: new Set(),
  log: [],
  target: '',
};

/* ========== 开始决斗 ========== */
App.Battle.start = async function (target) {
  const stat = await App.readStat(true);
  const ch = (stat.女巫角色 || {})[target];
  if (!ch) {
    App.UI.toast('目标不存在：' + target, 'danger');
    return false;
  }
  const mp = (stat.玩家 && stat.玩家.属性 && stat.玩家.属性.魔力值) || 76;
  const playerMax = Math.round(mp * 1.2 * App.realmMul(stat));
  const herMax = ch.防守值上限 || 44;
  App.Battle.target = target;
  App.Battle.log = [];
  App.Battle.logPush('⚔️ 决斗开始：你（防线 ' + playerMax + '）VS ' + target + '（防线 ' + herMax + '）', 'sys');
  await App.writeStat({
    课表: {
      当前目标: target,
      战斗状态: '进行中',
      战斗: {
        回合: 0,
        主角防守值: playerMax,
        主角防守值上限: playerMax,
        她防守值: herMax,
        她防守值上限: herMax,
        目标列表: [target],
        本场经验: {},
        主角BUFF: {},
        她BUFF: {},
      },
    },
  });
  App.UI.spellFlash('gold');
  App.UI.toast('决斗开始！缴械（魔杖脱手）即胜', 'gold');
  return true;
};

/* ========== 战斗日志 ========== */
App.Battle.logPush = function (text, who) {
  App.Battle.log.push({ text, who, t: Date.now() });
  if (App.Battle.log.length > 80) App.Battle.log.shift();
};

/* ========== 进攻结算 ========== */
App.Battle.attack = async function (pickedSpells, pickedLib) {
  const stat = await App.readStat(true);
  const cd = stat.课表 || {};
  const btl = cd.战斗 || {};
  const target = cd.当前目标;
  if (!target || btl.战斗状态 !== '进行中') {
    App.UI.toast('当前没有进行中的决斗', 'warn');
    return;
  }
  if ((!pickedSpells || !pickedSpells.length) && (!pickedLib || !pickedLib.length)) {
    App.UI.toast('至少选择 1 个咒语', 'warn');
    return;
  }
  const p = stat.玩家 || {};
  const ch = (stat.女巫角色 || {})[target] || {};
  const spells = p.咒语 || {};
  const lib = p.魔咒库 || {};
  const mul = App.realmMul(stat);

  /* —— 我方伤害 —— */
  let dmg = 0;
  const used = [];
  const expUpdates = {};
  for (const s of pickedSpells) {
    const sp = spells[s.名] || { 等级: 1 };
    let d = Math.round(sp.等级 * s.系数 * mul);
    // 摄神取念：她防线低时×2
    if (s.名 === '摄神取念' && btl.她防守值 < btl.她防守值上限 * 0.5) d *= 2;
    dmg += d;
    used.push(s.名 + 'Lv' + sp.等级 + '(' + d + ')');
    expUpdates[s.名] = { 等级: sp.等级, 经验: (sp.经验 || 0) + 15 };
  }
  // 粉身碎骨连击
  if (pickedSpells.some(s => s.名 === '粉身碎骨')) dmg = Math.round(dmg * 1.5);

  /* —— 扩展咒效果 —— */
  let counterMul = 1, dmgTakenMul = 1, selfHeal = 0;
  const libUsed = [];
  for (const l of pickedLib) {
    const lv = (lib[l.名] && lib[l.名].等级) || 1;
    libUsed.push(l.名 + 'Lv' + lv);
    if (l.类型 === '防御') counterMul *= 0.7;
    if (l.类型 === '控制') counterMul *= 0.8;
    if (l.类型 === '恢复') selfHeal = 8 + lv * 2;
    if (l.类型 === '闪避') dmgTakenMul = 0.7;
  }

  /* —— 魔药 —— */
  const pots = p.魔药 || {};
  let potUsed = '';
  if (pots.福灵剂 > 0) { dmg += 2; pots.福灵剂 -= 1; potUsed = '福灵剂+2'; }

  /* —— 她减伤 —— */
  let reduce = (ch.名器防御 || 0) + Math.floor(((ch.能力值 && ch.能力值.持久) || 5) / 2);
  const stack = ch.欲望积压 || 0;
  if (stack >= 60) reduce -= 2;
  if (stack >= 80) reduce -= 4;
  reduce = Math.max(0, reduce);
  const real = Math.max(0, dmg - reduce);
  const herHp = btl.她防守值;
  const herHpNew = Math.max(0, herHp - real);

  /* —— 她反击 —— */
  let counter = ((ch.能力值 && ch.能力值.反攻) || 5) * 1.5 + Math.floor((ch.名器防御 || 0) / 2);
  if (stack >= 80) counter = Math.round(counter * 1.25);
  counter = Math.round(counter * counterMul * dmgTakenMul);
  const playerHp = btl.主角防守值;
  const playerHpNew = Math.max(0, Math.min(btl.主角防守值上限 || 999, playerHp - counter + selfHeal));

  /* —— 她技能经验 —— */
  const herExpOld = (ch.技能 && ch.技能.经验) || 0;
  const herExpNew = herExpOld + 15;

  const round = (btl.回合 || 0) + 1;
  let result = '未分胜负';
  let sheScore = 0;
  const zj = p.战绩 || {};
  const tc = (stat.女巫角色 || {})[target] || {};

  if (herHpNew <= 0) {
    result = '你胜';
    sheScore = Math.max(1, 10 - round + 1);
    tc.缴械值 = Math.min(100, (tc.缴械值 || 0) + sheScore);
    tc.败场 = (tc.败场 || 0) + 1;
    tc.战斗次数 = (tc.战斗次数 || 0) + 1;
    zj.今日胜场 = (zj.今日胜场 || 0) + 1;
    zj.累计缴械 = (zj.累计缴械 || 0) + 1;
    p.胜点 = (p.胜点 || 0) + Math.max(10, 15 - round + 1); // 胜点：回合越少越多
    const rp = p.魔力阶位 || {};
    rp.层进度 = Math.min(100, (rp.层进度 || 0) + 8);
    zj.决斗荣誉 = (zj.决斗荣誉 || 0) + 10;
    const subj = App.pick(['魔咒学', '变形术', '黑魔法防御术']);
    if (p.学业 && p.学业.各科) p.学业.各科[subj] = Math.min(100, (p.学业.各科[subj] || 0) + 2);
    App.Battle.logPush('🎉 你胜！' + target + ' 的魔杖脱手——缴械！服气度+' + sheScore, 'you');
    App.UI.confetti(40);
  } else if (playerHpNew <= 0) {
    result = '你败';
    zj.今日败场 = (zj.今日败场 || 0) + 1;
    zj.累计被缴械 = (zj.累计被缴械 || 0) + Math.max(1, 5 - Math.floor(round / 2));
    if (tc.缴械值) tc.缴械值 = Math.max(0, tc.缴械值 - 5);
    tc.胜场 = (tc.胜场 || 0) + 1;
    tc.战斗次数 = (tc.战斗次数 || 0) + 1;
    App.Battle.logPush('💔 你败——你的魔杖脱手。败绩+（决斗有输有赢是常事）', 'her');
    App.UI.spellFlash('red');
  } else {
    tc.战斗次数 = (tc.战斗次数 || 0) + 1;
    App.Battle.logPush('回合 ' + round + '：你造成 ' + real + ' 实伤，她反击 ' + counter + '。她防线 ' + herHpNew + '，你防线 ' + playerHpNew, 'sys');
  }

  /* —— 写回 —— */
  const patchCh = {};
  patchCh[target] = { 缴械值: tc.缴械值, 胜场: tc.胜场, 败场: tc.败场, 战斗次数: tc.战斗次数 };
  if (ch.技能) {
    const lv = ch.技能.等级 || 1;
    patchCh[target].技能 = {
      名: ch.技能.名 || '',
      等级: lv + (herExpNew >= App.expNeed(lv) ? 1 : 0),
      经验: herExpNew >= App.expNeed(lv) ? herExpNew - App.expNeed(lv) : herExpNew,
      技能组: ch.技能.技能组 || {},
    };
  }
  const spellPatch = {};
  for (const k in expUpdates) {
    const lv = expUpdates[k].等级;
    spellPatch[k] = {
      等级: lv + (expUpdates[k].经验 >= App.expNeed(lv) ? 1 : 0),
      经验: expUpdates[k].经验 >= App.expNeed(lv) ? expUpdates[k].经验 - App.expNeed(lv) : expUpdates[k].经验,
    };
  }
  await App.writeStat({
    课表: {
      战斗状态: result === '未分胜负' ? '进行中' : '已结算',
      战斗: {
        回合: round,
        她防守值: herHpNew,
        主角防守值: playerHpNew,
        本场经验: expUpdates,
        她BUFF: btl.她BUFF || {},
        主角BUFF: btl.主角BUFF || {},
      },
    },
    玩家: { 咒语: spellPatch, 魔药: pots, 战绩: zj, 胜点: p.胜点 },
    女巫角色: patchCh,
  });

  /* —— 结算块（真实楼层发送） —— */
  const block = '【对抗结算】目标=' + target + '|回合=' + round + '|我方=' + used.join('+') +
    (libUsed.length ? '+' + libUsed.join('+') : '') +
    (potUsed ? '+' + potUsed : '') +
    '|她减伤' + Math.round(reduce) + '|实伤' + real +
    '|她防线' + herHp + '→' + herHpNew +
    '|她反击' + Math.round(counter) +
    '|你防线' + playerHp + '→' + playerHpNew +
    (selfHeal ? '|自愈+' + selfHeal : '') +
    '|' + (result === '你胜' ? '她缴械' : (result === '你败' ? '你被缴械' : '未分胜负')) +
    '|服气度' + (sheScore ? '+' + sheScore : (result === '你败' ? '-5' : '0'));
  await App.sendAction(block);
  App.addLog('battle', block);
  App.UI.floatNum('-' + real, 'dmg', window.innerWidth / 2 - 60, window.innerHeight / 2 - 40);
  if (counter > 0) App.UI.floatNum('-' + counter, 'dmg', window.innerWidth / 2 + 40, window.innerHeight / 2 - 20);
  if (selfHeal) App.UI.floatNum('+' + selfHeal, 'heal', window.innerWidth / 2, window.innerHeight / 2 - 80);
  return result;
};

/* ========== 契合度提示 ========== */
App.Love.computeHints = function (stat) {
  const target = (stat.双修 || {}).对象 || (stat.课表 || {}).当前目标 || '';
  const ch = (stat.女巫角色 || {})[target];
  if (!ch) return [];
  const hints = [];
  const bs = ch.身体状态 || {};
  if (bs.胸部 && bs.胸部.敏感度 >= 60) hints.push('她的胸部敏感度 ' + bs.胸部.敏感度 + '——乳尖/乳肉是强点');
  if (bs.阴道 && bs.阴道.敏感度 >= 60) hints.push('她的花径敏感度 ' + bs.阴道.敏感度 + '——花径/花核是强点');
  if (bs.大腿 && bs.大腿.状态 && String(bs.大腿.状态).includes('敏感')) hints.push('她的大腿内侧格外敏感');
  if (bs.脖颈 && bs.脖颈.敏感度 >= 60) hints.push('她的脖颈敏感度 ' + bs.脖颈.敏感度 + '——啃咬脖颈是高伤害部位');
  if (ch.名器) hints.push('名器【' + String(ch.名器).split('—')[0] + '】——结合名器特性选动作');
  const sens = [];
  if (bs.胸部 && bs.胸部.敏感度 >= 55) sens.push('乳尖');
  if (bs.阴道 && bs.阴道.敏感度 >= 55) sens.push('花径');
  if (bs.大腿 && bs.大腿.状态 && String(bs.大腿.状态).includes('敏感')) sens.push('大腿内侧');
  if (sens.length) hints.push('建议优先：' + sens.join('/') + '（命中敏感部位→上佳）');
  return hints;
};

/* ========== 引导（结算一轮） ========== */
App.Love.guide = async function (actions, leader, pos, item) {
  const stat = await App.readStat(true);
  const d = stat.双修 || {};
  const target = d.对象;
  if (!target || d.会话状态 !== '进行中') {
    App.UI.toast('没有进行中的亲密会话', 'warn');
    return;
  }
  if (!actions.length) { App.UI.toast('先编排动作（1~3 组）', 'warn'); return; }
  const p = stat.玩家 || {};
  const pots = p.魔药 || {};
  const ch = (stat.女巫角色 || {})[target] || {};

  // 品质判定
  let quality = '普通';
  let fits = 0;
  for (const a of actions) {
    if (App.SENS.includes(a.部位)) fits++;
    if (a.风格 === '缠绵' || a.风格 === '轻柔' || a.风格 === '深入') fits++;
  }
  const sub = d.顺从 || 0;
  if (sub >= 60) quality = '上佳';
  else if (fits >= 3) quality = '上佳';
  else if (fits >= 1) quality = '普通';
  else quality = '低效';
  const qm = quality === '上佳' ? 1.5 : (quality === '低效' ? 0.6 : 1);

  // 数值
  let 修为 = Math.round((5 + App.rand(0, 10)) * qm);
  let 情欲 = Math.round((3 + App.rand(0, 5)) * qm);
  let 快感 = Math.round((12 + fits * 4) * (leader === '我来' ? 1 : 1.2));
  let 堕落 = Math.round((2 + App.rand(0, 4)) * qm);
  let 顺从 = Math.round((2 + App.rand(0, 3)) * (leader === '我来' ? 1.3 : 0.8));
  let itemUsed = '';
  if (item === '迷情剂' && pots.迷情剂 > 0) { 情欲 += 30; pots.迷情剂 -= 1; itemUsed = '迷情剂+30情欲'; }
  else if (item === '润滑魔油' && pots.润滑魔油 > 0) { 快感 += 20; pots.润滑魔油 -= 1; itemUsed = '润滑魔油+20快感'; }
  if (pos === '后入式' || pos === '骑乘式' || pos === '正常位') 快感 += 3;

  const np = {
    修为进度: Math.min(100, (d.修为进度 || 0) + 修为),
    情欲: Math.min(100, (d.情欲 || 0) + 情欲),
    快感: Math.min(100, (d.快感 || 0) + 快感),
    堕落: Math.min(100, (d.堕落 || 0) + 堕落),
    顺从: Math.min(100, (d.顺从 || 0) + 顺从),
  };
  const orgasm = np.快感 >= 100;
  if (orgasm) np.高潮待宣 = true;

  const hist = d.历史轮 || [];
  const actStr = actions.map(a => a.行为 + '·' + a.部位 + '·' + a.风格).join(' + ');
  hist.push({ 轮次: hist.length + 1, 动作: actStr, 结果: quality, 修为进度: 修为, 快感变化: 快感, 堕落变化: 堕落, 顺从变化: 顺从 });

  await App.writeStat({
    双修: {
      会话状态: '裁决中',
      当前体位: pos,
      主导方: leader,
      本轮动作: actions.map(a => ({ 行为: a.行为, 部位: a.部位, 风格: a.风格 })),
      使用物品: item,
      修为进度: np.修为进度,
      情欲: np.情欲,
      快感: np.快感,
      堕落: np.堕落,
      顺从: np.顺从,
      高潮待宣: np.高潮待宣,
      可回溯: true,
      历史轮: hist,
    },
    玩家: { 魔药: pots },
  });

  // 周期信息
  const cyc = ch.生理周期 || {};
  const cycNote = '周期:' + (cyc.月经状态 || '?') + ' 排卵日' + (cyc.排卵日 || 14) + ' 避孕' + (cyc.避孕 !== false ? '是' : '否');

  const block = '【双修结算】对象=' + target + '|轮=' + hist.length +
    '|动作=' + actStr +
    '|体位=' + pos + '|主导=' + leader +
    '|品质=' + quality +
    '|修为+' + 修为 + '|情欲+' + 情欲 + '|快感+' + 快感 + '|堕落+' + 堕落 + '|顺从+' + 顺从 +
    (itemUsed ? '|' + itemUsed : '') +
    (orgasm ? '|高潮待宣：快感已满，请在正文宣布高潮' : '') +

};

/* ========== 确认高潮 ========== */
App.Love.confirmOrgasm = async function () {
