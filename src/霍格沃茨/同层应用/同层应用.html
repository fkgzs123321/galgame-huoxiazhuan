  const d = stat.双修 || {};
  if (!d.高潮待宣) { App.UI.toast('快感未满，暂无高潮待宣', 'warn'); return; }
  const target = d.对象;
  const tc = (stat.女巫角色 || {})[target] || {};
  tc.高潮次数 = (tc.高潮次数 || 0) + 1;
  await App.writeStat({
    双修: {
      高潮待宣: false,
      快感清零: true,
      快感: 0,
      修为进度: Math.min(100, (d.修为进度 || 0) + 20),
      堕落: Math.min(100, (d.堕落 || 0) + 8),
      顺从: Math.min(100, (d.顺从 || 0) + 4),
     },

  });

};

/* ========== 回溯 ========== */
App.Love.undo = async function () {
  const stat = await App.readStat(true);
  const d = stat.双修 || {};
  if (!d.可回溯) { App.UI.toast('本回合不可回溯', 'warn'); return; }
  const hist = d.历史轮 || [];
  if (!hist.length) return;
  const last = hist.pop();
  await App.writeStat({
    双修: {
      会话状态: '进行中',
      修为进度: Math.max(0, (d.修为进度 || 0) - last.修为进度),
      快感: Math.max(0, (d.快感 || 0) - last.快感变化),
      堕落: Math.max(0, (d.堕落 || 0) - last.堕落变化),
      顺从: Math.max(0, (d.顺从 || 0) - last.顺从变化),
      可回溯: false,
      历史轮: hist,
    },
  });
  App.UI.toast('已回溯上一轮', 'warn');
};

/* ========== 结束结算 ========== */
App.Love.finish = async function () {
  const stat = await App.readStat(true);
  const d = stat.双修 || {};
  const target = d.对象;
  if (!target) { App.UI.toast('没有会话', 'warn'); return; }
  const 修为 = d.修为进度 || 0;
  const 堕落 = d.堕落 || 0;
  const favorGain = Math.round(修为 / 10);
  const fallGain = Math.round(堕落 / 8);
  const tc = (stat.女巫角色 || {})[target] || {};
  tc.好感度 = Math.min(100, (tc.好感度 || 0) + favorGain);
  tc.堕落值 = Math.min(100, (tc.堕落值 || 0) + fallGain);
  tc.欲望积压 = Math.max(0, (tc.欲望积压 || 0) - 25);
  await App.writeStat({
    双修: { 会话状态: '已结束', 可回溯: false, 高潮待宣: false },
    女巫角色: { [target]: { 好感度: tc.好感度, 堕落值: tc.堕落值, 欲望积压: tc.欲望积压 } },
  });
  await App.sendAction('【双修完成】对象=' + target + '|修为' + 修为 + '|好感+' + favorGain + '|堕落值+' + fallGain);
  App.addLog('love', '亲密结束：' + target + ' 好感+' + favorGain + ' 堕落+' + fallGain);
  App.UI.confetti(40);
  App.UI.toast('💗 亲密结束——关系深化：好感+' + favorGain + ' 堕落+' + fallGain, 'love');
};

'use strict';

/* ========== 炼药 ========== */
App.brew = async function (recipe) {
  const stat = await App.readStat(true);
  const p = stat.玩家 || {};
  const mats = p.材料 || {};
  const grade = (p.学业 && p.学业.各科 && p.学业.各科.魔药学) || 50;
  if (grade < recipe.门槛) {
    App.UI.toast('魔药学不足：需 ' + recipe.门槛 + '（当前 ' + grade + '）', 'warn');
    await App.sendAction('（我想炼制' + recipe.名 + '，但魔药学还不够——先去上课或找塞西莉亚教授请教）');
    return false;
  }
  for (const m in recipe.需求) {
    if (!mats[m] || (mats[m].数量 || 0) < recipe.需求[m]) {
      App.UI.toast('材料不足：' + m + '×' + recipe.需求[m], 'warn');
      return false;
    }
  }
  const skill = (p.炼药 && p.炼药.熟练度) || 0;
  let rankBonus = 0;
  for (const m in recipe.需求) rankBonus = Math.max(rankBonus, App.MAT_RANK[(mats[m] && mats[m].品级) || '普通']);
  const rate = Math.min(95, Math.round(grade / 2 + skill / 2 + rankBonus));
  for (const m in recipe.需求) mats[m].数量 -= recipe.需求[m];
  const ok = Math.random() * 100 < rate;
  const pots = p.魔药 || {};
  if (ok) {
    pots[recipe.名] = (pots[recipe.名] || 0) + 1;
    App.UI.confetti(20);
    App.UI.toast('✨ 成功炼制 ' + recipe.名 + '（成功率 ' + rate + '%）', 'gold');
    await App.sendAction('【炼药】成功炼制' + recipe.名 + '（魔药学' + grade + '·成功率' + rate + '%）——' + recipe.描述);
    App.addLog('brew', '炼制成功：' + recipe.名);
  } else {
    for (const m in recipe.需求) {
      const lose = Math.floor(recipe.需求[m] / 2);
      if (lose) mats[m].数量 = Math.max(0, mats[m].数量 - lose);
    }
    App.UI.toast('💥 炼制失败（成功率 ' + rate + '%），材料损失一半', 'danger');
    await App.sendAction('【炼药】炼制' + recipe.名 + '失败（成功率' + rate + '%），材料损失一半');
    App.addLog('brew', '炼制失败：' + recipe.名);
  }
  await App.writeStat({ 玩家: { 材料: mats, 魔药: pots, 炼药: { 熟练度: Math.min(100, skill + (ok ? 5 : 2)) } } });
  return ok;
};

/* ========== 购买材料 ========== */
App.buyMat = async function (name) {
  const stat = await App.readStat(true);
  const p = stat.玩家 || {};
  const item = App.SHOP.find(x => x.名 === name);
  if (!item) return;
  const w = p.财产 || {};
  const gold = App.gold(stat);
  if (gold < item.价) {
    App.UI.toast('金加隆不足——赢决斗赌注或卖魔药', 'warn');
    await App.sendAction('（我想买' + name + '，但金加隆不够——得先赚点钱）');
    return;
  }
  w.金加隆 = (w.金加隆 || 0) - item.价;
  const mats = p.材料 || {};
  if (!mats[name]) mats[name] = { 数量: 0, 品级: item.品级 };
  mats[name].数量 = (mats[name].数量 || 0) + 1;
  await App.writeStat({ 玩家: { 财产: w, 材料: mats } });
  App.UI.toast('购入 ' + name + '×1（' + item.价 + ' 加隆）', 'ok');
  await App.sendAction('（对角巷购入 ' + name + '×1，花费 ' + item.价 + ' 加隆）');
  App.addLog('brew', '购买：' + name + '×1');
};

/* ========== 卖出魔药 ========== */
App.sellPotion = async function (name) {
  const stat = await App.readStat(true);
  const p = stat.玩家 || {};
  const pots = p.魔药 || {};
  const rec = App.RECIPES.find(r => r.名 === name);
  if (!rec || !pots[name]) return;
  pots[name] -= 1;
  const w = p.财产 || {};
  const gain = Math.round(rec.售价 / 2);
  w.金加隆 = (w.金加隆 || 0) + gain;
  await App.writeStat({ 玩家: { 财产: w, 魔药: pots } });
  App.UI.toast('卖出 ' + name + '×1，得 ' + gain + ' 加隆', 'ok');
  await App.sendAction('（卖掉 ' + name + '×1，得 ' + gain + ' 加隆）');
  App.addLog('brew', '卖出：' + name + '（+' + gain + ' 加隆）');
};

/* ========== 突破逻辑 ========== */
async function doBreakthrough() {
  const stat = await App.readStat(true);
  const rp = (stat.玩家 && stat.玩家.魔力阶位) || {};
  const p = stat.玩家 || {};
  const mp = (p.属性 && p.属性.魔力值) || 0;
  const pots = p.魔药 || {};
  const gate = App.REALM_GATE[App.clamp((rp.大境界 || 1) - 1, 0, 8)][(rp.层 || 1) - 1];
  if (rp.心魔状态 === '心魔期' || rp.心魔状态 === '突破中') { App.UI.toast('正在突破中——心魔剧情演出中', 'warn'); return; }
  if ((rp.层进度 || 0) < 100) { App.UI.toast('层进度未满', 'warn'); return; }
  if (mp < gate) { App.UI.toast('魔力不足：需 ' + gate, 'warn'); return; }
  if ((pots.突破魔药 || 0) < 1) { App.UI.toast('需要突破魔药×1', 'warn'); return; }
  pots.突破魔药 -= 1;
  await App.writeStat({ 玩家: { 魔药: pots, 魔力阶位: { 心魔状态: '心魔期', 突破进度: 100 } } });
  await App.sendAction('【突破结算】开始突破：' + App.realmName(stat) + ' → 下一层 ｜ 消耗突破魔药×1 ｜ 心魔状态=心魔期 ｜ 请按阶位条目演出突破仪式与心魔剧情，成功后确认突破');
  App.addLog('break', '开始突破：' + App.realmName(stat));
  App.UI.spellFlash('purple');
  App.UI.toast('💠 突破开始——心魔剧情由 AI 演出', 'magic');
  App.navigate('breakthrough');
}
App.doBreakthrough = doBreakthrough;

async function resolveBreakthrough(success) {
  const stat = await App.readStat(true);
  const rp = (stat.玩家 && stat.玩家.魔力阶位) || {};
  if (success) {
    let realm = rp.大境界 || 1;
    let layer = rp.层 || 1;
    const from = App.realmName(stat);
    layer += 1;
    if (layer > 3) { layer = 1; realm += 1; }
    const rec = rp.突破记录 || [];
    rec.push({ 日期: (stat.时间 || {}).日期 || '', 从: from, 到: App.REALMS[App.clamp(realm - 1, 0, 8)] + '·' + layer, 心魔: '已渡过' });
    await App.writeStat({
      玩家: { 魔力阶位: { 大境界: Math.min(9, realm), 层: layer, 层进度: 0, 突破进度: 0, 心魔状态: '无', 突破记录: rec } },
    });
    await App.sendAction('（突破成功：' + from + ' → ' + App.REALMS[App.clamp(realm - 1, 0, 8)] + '·' + layer + '）');
    App.addLog('break', '突破成功：' + from + ' → ' + App.REALMS[App.clamp(realm - 1, 0, 8)] + '·' + layer);
    App.UI.confetti(60);
    App.UI.toast('🎉 突破成功！' + App.REALMS[App.clamp(realm - 1, 0, 8)] + '·' + layer, 'gold');
  } else {
    await App.writeStat({ 玩家: { 魔力阶位: { 心魔状态: '无', 突破进度: Math.max(0, (rp.突破进度 || 0) - 40) } } });
    await App.sendAction('（突破失败——突破进度-40）');
    App.addLog('break', '突破失败：进度-40');
    App.UI.toast('💔 突破失败——突破进度-40', 'danger');
  }
  await App.refreshTopbar();
  App.navigate('breakthrough');
}
App.resolveBreakthrough = resolveBreakthrough;

  }
});

App.registerView('achievements', async function (box) {
  const stat = await App.readStat();
  const p = stat.玩家 || {};
  const rp = p.魔力阶位 || {};
  const zj = p.战绩 || {};
  const chars = stat.女巫角色 || {};

  function check(a) {
    switch (a.id) {
      case 'first_duel': return (zj.累计缴械 || 0) + (zj.累计被缴械 || 0) > 0;
      case 'duel_win_1': return (zj.累计缴械 || 0) >= 1;
      case 'duel_win_10': return (zj.累计缴械 || 0) >= 10;
      case 'duel_win_50': return (zj.累计缴械 || 0) >= 50;
      case 'honor_100': return (zj.决斗荣誉 || 0) >= 100;
      case 'honor_500': return (zj.决斗荣誉 || 0) >= 500;
      case 'realm_2': return (rp.大境界 || 1) >= 2;
      case 'realm_3': return (rp.大境界 || 1) >= 3;
      case 'realm_5': return (rp.大境界 || 1) >= 5;
      case 'realm_9': return (rp.大境界 || 1) >= 9;
      case 'first_love': return Object.values(chars).some(c => (c.高潮次数 || 0) > 0);
      case 'love_10': return Object.values(chars).reduce((a, c) => a + (c.高潮次数 || 0), 0) >= 10;
      case 'fall_100': return Object.values(chars).some(c => (c.堕落值 || 0) >= 100);
      case 'fav_100': return Object.values(chars).some(c => (c.好感度 || 0) >= 100);
      case 'brew_1': return (p.炼药 && p.炼药.熟练度 > 0);
      case 'brew_10': return (p.炼药 && p.炼药.熟练度 >= 50);
      case 'brew_50': return (p.炼药 && p.炼药.熟练度 >= 100);
      case 'rich_100': return App.gold(stat) >= 100;
      case 'rich_500': return App.gold(stat) >= 500;
      case 'first_break': return (rp.突破记录 || []).length > 0;
      case 'meet_5': return Object.keys(chars).length >= 5;
      case 'meet_11': return Object.keys(chars).length >= 11;
      case 'owl_year': return (stat.时间 || {}).学年 >= 5;
      case 'newt_year': return (stat.时间 || {}).学年 >= 6;
      case 'war_year': return (stat.时间 || {}).学年 >= 7;
      case 'academic_450': return ((p.学业 || {}).学业总分 || 0) >= 450;
      case 'academic_600': return ((p.学业 || {}).学业总分 || 0) >= 600;
      case 'sub_100': return Object.values((p.学业 || {}).各科 || {}).some(v => v >= 100);
      default: return false;
    }
  }
  const done = App.ACHIEVEMENTS.filter(check).length;
  let h = '';
  h += '<div class="hgw-panel"><div class="panel-title"><span>🏆</span>成就殿堂<span class="sub">' + done + ' / ' + App.ACHIEVEMENTS.length + ' 已达成</span></div>';
  h += '<div class="hgw-bar gold" style="margin-bottom:14px"><i style="width:' + Math.round(done / App.ACHIEVEMENTS.length * 100) + '%"></i></div>';
  h += '<div class="hgw-grid cols-3">';
  for (const a of App.ACHIEVEMENTS) {
    const ok = check(a);
    h += '<div class="hgw-card' + (ok ? ' gold-border' : '') + '" style="' + (ok ? '' : 'opacity:0.6') + '">';
    h += '<div class="card-title"><span>' + (ok ? '🏅' : '🔒') + '</span>' + a.名 + (ok ? ' <span class="hgw-badge ok">已达成</span>' : '') + '</div>';
    h += '<div class="card-body">' + a.描述 + '</div>';
    h += '<div class="card-foot"><span class="hgw-tag">' + a.条件 + '</span><span class="hgw-tag gold">奖励：' + a.奖 + '</span></div>';
    h += '</div>';
  }
  h += '</div></div>';
  box.innerHTML = h;
});

      h += '<div class="hgw-row"><span class="hgw-badge gold">#' + (i + 1) + '</span><span style="font-weight:600">' + App.esc(n) + '</span><span class="hgw-muted">好感 ' + (c.好感度 || 0) + ' ｜ 服气 ' + (c.缴械值 || 0) + ' ｜ 堕落 ' + (c.堕落值 || 0) + ' ｜ 高潮 ' + (c.高潮次数 || 0) + '</span></div>';
    });
    h += '</div></div>';
  }
  box.innerHTML = h;
});

App.YearFull = {"剧情_1年_第一学期": "<剧情_1年_第一学期>\n剧情_1年_第一学期:\n  学年定位: 1年级 · 魔法石篇·上（1991年9月~12月）· 入学年\n  原著事件坐标: 《魔法石》上半年——分院、第一堂魔咒课、万圣节巨怪、魁地奇首赛、禁林中的独角兽血、魔法石的暗流。你和哈利·波特同届入学：他是\"大难不死的男孩\"，你是\"那个新生\"——但魔法石的风暴会卷过所有人。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 国王十字车站 9¾ 站台。你的入学日。火车上你遇见同届的她们：赫敏在包厢里读《霍格沃茨：一段校史》，金妮紧张地问\"分院痛不痛\"，拉文德在给所有人看手相。\n    - 9月1日晚: 分院仪式。分院帽的歌声。你被分进格兰芬多（或按玩家选择）。隔壁桌的哈利·波特被帽子纠结了整整五分钟——全校都在看他。\n    - 9月第2周: 第一堂魔咒课。弗立维教授教漂浮咒（羽加迪姆勒维奥萨）。赫敏第一个成功，你第二次成功——她转头看了你一眼（学霸的雷达响了）。\n    - 9月下旬: 斯内普的魔药课（第一堂，格兰芬多与斯莱特林合班）。他点哈利的名（\"波特，告诉我水仙根粉和艾草浸液加在一起会怎样\"）——斯莱特林桌的潘西在笑。你的坩埚在期末前炸过一次，塞西莉亚教授（魔药课另一班教授）课后把你留下：\"火候不是越大越好。\"\n    - 10月31日: 万圣节宴会+巨怪事件（原著）。有人把巨怪放进了城堡。你在二楼走廊与巨怪面对面——不是你解决了它，是\"恰好有人路过\"（哈利和罗恩的巨怪事件发生的同时，你在另一条走廊遇到了同样被巨怪堵住的黛西·霍桑）。你们一起躲进了盥洗室，直到教授们赶来。\n    - 11月: 魁地奇首赛（格兰芬多vs斯莱特林）。哈利是找球手（史上最年轻）。薇奥拉·布莱克伍德（斯莱特林找球手，同届）在看台上冷眼看你：\"你连扫帚都不会骑吧？\"——她记住你了。艾琳·怀特（格兰芬多击球手，同届）在旁边喊：\"别理她，下节飞行课我教你！\"\n    - 12月: 圣诞假期。留校的少数人在炉火边拆礼物。谁给你送了第一份圣诞礼物？（黛西织的围巾/赫敏选的《魔咒入门》/艾琳塞的一把扫帚保养油）\n\n  本季主线弧:\n    - 入学与立足: 从\"新生\"到\"被记住的人\"——分院、第一堂课的亮相、巨怪事件里的镇定，决定你在同届中的初始印象。\n    - 魔法石的暗流: 你不参与原著主线（找魔法石的是哈利三人组），但暗流在你身边涌动：禁林里的独角兽血（12月，你'恰好'看到银色的血迹）、三头犬的咆哮（你路过三楼禁区听到）、奇洛教授那股大蒜味（他总在你附近出现）。\n    - 同届关系的建立: 9 名女巫与你的初见——谁能记住你、谁无视你、谁觉得你有趣，从这一学期开始。\n\n  关键场景:\n    - 分院仪式（学院=社交圈起点；同院=日常相处，异院=跨院张力）\n    - 万圣节巨怪（你和黛西一起躲盥洗室——患难情谊的起点）\n    - 魁地奇首赛（薇奥拉的挑衅/艾琳的邀约）\n    - 圣诞拆礼物（第一份心意）\n\n  女巫互动钩子（一年级初见版）:\n    - 薇奥拉·布莱克伍德: 斯莱特林找球手。看台的冷眼→魁地奇场边的对峙→她发现你\"居然不卑不亢\"。高傲大小姐线的起点。\n    - 艾琳·怀特: 格兰芬多击球手。飞行课教你骑扫帚：'腿夹紧！手放松！'——元气运动系的直球接近。\n    - 露娜·斯特兰德: 拉文克劳。她盯着你看了一会儿，然后说：'你身上有虻。'（她的方式说'你很特别'）——神秘学霸线的伏笔。\n    - 黛西·霍桑: 赫奇帕奇。万圣节巨怪一起躲盥洗室——她事后给你送了自己做的太妃糖：'压压惊。'温柔甜妹线的起点。\n    - 塞西莉亚·费恩: 魔药课（格兰芬多班）。炸坩埚后的留堂：她教你火候，然后看了你一眼：'你手很稳，就是心浮。'师生线伏笔。\n    - 伊莎贝拉·诺斯: 实战教官（一年级只旁观）。她在训练场看到你被艾琳拉着学扫帚：'胆子不小。'——她记住你了。\n    - 赫敏·格兰杰: 同院同学。漂浮咒后的'雷达响'：她开始'顺便'纠正你的咒语发音——学霸式关心的起点。\n    - 金妮·韦斯莱: 同院新生。她紧张地问你分院疼不疼，你回答后她松了口气：'那还好。'——她的注意力在你身上停留了一秒。\n    - 卢娜·洛夫古德: 拉文克劳。她在湖边'看见'了水下的什么东西，转头跟你说：'它会记得你。'\n    - 潘西·帕金森: 斯莱特林。魔药课合班时的贵女团雏形：她打量你一眼，跟同伴耳语，然后笑——她的关注是'评估'式的。\n    - 拉文德·布朗: 格兰芬多。火车上的手相：'你手相里有星星……你会遇见重要的人。'——她说是她自己。\n\n  事件池（一次 1~2 个）:\n    - 事件·分院帽的纠结: 你被分院帽纠结（格兰芬多vs拉文克劳/斯莱特林）。选择或被选择——同院女巫的初始好感+3。\n    - 事件·巨怪之夜: 你与黛西躲盥洗室。你护住她的方式（挡在前面/拉着她跑/讲笑话缓解恐惧）决定她的初始印象（好感+5~10）。\n    - 事件·飞行课: 艾琳教你扫帚。你学得快（她刮目相看）/摔得惨（她哈哈大笑但记住了你）。\n    - 事件·三楼禁区: 你'路过'三楼禁区，听到三头犬的咆哮。你告诉谁（赫敏的眼睛亮了/金妮害怕/潘西冷笑'多管闲事'）？\n    - 事件·禁林血迹: 12 月你在禁林边缘看到银白色的血迹（独角兽血——伏地魔喝过的地方）。你告诉露娜·斯特兰德，她的笔记本多了一页。\n\n  关系推进线（一年级）:\n    - 好感度: 全体 0~10 起步（初见级）；巨怪事件/飞行课等事件加成者 10~15。\n    - 欲望度: 一年级（17 岁成年）已可激活，但整体处于'青春期的萌芽'状态——眼神、心跳、'不小心'的触碰为主。\n    - 缴械值: 伊莎贝拉教官的观察（她对你的初始评价）。\n    - 堕落值: 全员 0（关系未建立）。\n\n  学期结算:\n    - 学业: 期末各科 40~60 区间（一年级基础分）。\n    - 印象: 谁记住你了（写入叙事记忆）。\n    - 伏笔: 独角兽血/三头犬/奇洛的大蒜味（魔法石篇暗流）。\n    - 学期结束: 时间.学期 → 第二学期。\n\n</剧情_1年_第一学期>\n", "剧情_1年_第二学期": "<剧情_1年_第二学期>\n剧情_1年_第二学期:\n  学年定位: 1年级 · 魔法石篇·下（1992年1月~6月）· 结局年\n  原著事件坐标: 《魔法石》下半年——圣诞后的暗流、厄里斯魔镜、魔法石的守护关卡（三头犬/魔鬼网/钥匙/巫师棋/魔药谜题）、奇洛与伏地魔的失败。期末，哈利三人组阻止了奇洛；学院杯颁奖夜，格兰芬多凭'特殊贡献'夺冠——你在现场。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。禁林的血迹事件后，露娜·斯特兰德的笔记本多了'独角兽'的条目。奇洛教授的大蒜味更重了——他总在图书馆附近转悠。\n    - 2月: 魁地奇赛季。格兰芬多vs拉文克劳。你发现哈利的状态忽好忽坏（他的扫帚被施了咒——奇洛干的，但当时没人知道）。你在看台上'恰好'跟谁坐在一起？\n    - 3月: 魔法石暗流升级。赫敏开始神神秘秘地研究什么（'三楼禁区……三头犬……'）。她不会告诉你细节，但会问：'你会下巫师棋吗？'\n    - 4月: 学期末前的平静（暴风雨前的宁静）。城堡里流传'邓布利多最近很忙'。你在图书馆遇到奇洛，他冲你虚弱地笑了笑——你闻到他身上的血腥味（他在禁林喝了独角兽血）。\n    - 6月: 期末考+魔法石之夜（原著）。那一夜你不在禁区（哈利三人组在），但你在城堡里听到了动静：三头犬的咆哮、匆匆的脚步声、然后是一声'不——'。第二天，奇洛教授\"请了长假\"。格兰芬多学院杯：邓布利多给哈利三人各加 50 分——你见证了格兰芬多从垫底到夺冠的奇迹之夜。\n\n  本季主线弧:\n    - 魔法石的落幕: 你作为'旁观者'见证奇洛的失败（你不在场，但余波在）：奇洛辞职（真实：死亡）、邓布利多的微笑、哈利的病房探视传闻。\n    - 第一年的成长: 期末考、魁地奇、关系线的第一轮沉淀——谁从'同学'变成了'朋友'，谁还在'认识'阶段。\n    - 大战前的宁静: 这一年以和平结束，但伏地魔\"没有真正死去\"的暗示（奇洛消失前的那句传闻）为后续学年埋线。\n\n  关键场景:\n    - 魁地奇被施咒的惊魂（看台上你身边的人抓住你的手）\n    - 学院杯之夜（格兰芬多从垫底到夺冠：谁在欢呼中抱住你）\n    - 期末考周（复习小组的化学反应）\n    - 学期末的告别（暑假前的站台：谁约你写信）\n\n  女巫互动钩子:\n    - 黛西: 魁地奇看台她坐在你旁边，哈利扫帚失控时她抓住你的手：'他会不会有事！'——她紧张时靠你很近。\n    - 艾琳: 学院杯之夜格兰芬多夺冠，她兴奋地抱住你转圈：'赢了！我们赢了！'——她的直球拥抱。\n    - 薇奥拉: 斯莱特林丢了学院杯，她冷着脸。你在走廊遇见她，她没骂人，只说了句：'明年我们会赢回来。'——她的'输不起'初见端倪。\n    - 赫敏: 期末复习小组。她辅导你魔法史：'重点不是背，是理解。'——学霸式关心的第一轮。\n    - 金妮: 学期末她给你写了同学录：'很高兴认识你。'字迹工整，是她练了五遍的成果。\n    - 露娜·斯特兰德: 她给你看她笔记本的独角兽条目：'银色的血……我在书里见过，只有最邪恶的东西才会伤害独角兽。'——她的直觉开始接近真相。\n    - 潘西: 学期末的斯莱特林聚会上她跟贵女团耳语，你'恰好'路过，她没躲：'明年见。'——大小姐的评估进入下一轮。\n\n  事件池（一次 1~2 个）:\n    - 事件·扫帚失控: 魁地奇惊魂。你身边的她抓住你的手/你没抓住她的手——好感±5。\n    - 事件·巫师棋的邀请: 赫敏问你'会下巫师棋吗'。会（她眼睛一亮，学霸同盟+1）/不会（她说'那算了'，但后来还是教你了）。\n    - 事件·奇洛的擦肩: 图书馆偶遇奇洛。他冲你笑，你闻到血腥味。你选择：告诉教授（没人信）/告诉露娜（她记下来）/装作没闻到（后怕）。\n    - 事件·学院杯之夜: 格兰芬多夺冠的欢呼。谁在欢呼中抱住你/谁在角落里失落（薇奥拉）。\n    - 事件·暑假约定: 站台告别。谁约你写信（黛西/艾琳/赫敏/金妮——按好感度最高者优先）。\n\n  关系推进线:\n    - 好感度: 10~20（朋友级）；事件加成者 15~25。\n    - 欲望度: 青春期的萌芽：'第一次心跳加速'的时刻（谁让你第一次意识到'她不只是同学'）。\n    - 缴械值: 伊莎贝拉教官年度评价（她旁观的结论）。\n    - 堕落值: 全员 0~5（关系未建立）。\n\n  学期结算:\n    - 学业: 期末总分≥300（一年级线，升二年级）。\n    - 关系: 朋友名单+暑假通信约定形成。\n    - 伏笔: 独角兽血/奇洛的消失（魔法石篇落幕，密室篇伏笔：'听说奇洛教授……不在了'）。\n    - 学期结束: 时间.学期 → 假期（暑假=通信季）；升二年级。\n\n</剧情_1年_第二学期>\n", "剧情_2年_第一学期": "<剧情_2年_第一学期>\n剧情_2年_第一学期:\n  学年定位: 2年级 · 密室篇·上（1992年9月~12月）· 蛇怪的阴影\n  原著事件坐标: 《密室》上半年——开学即乱（家养小精灵多比拦路）、费尔奇的猫被石化、墙上血字\"密室已被打开\"、学生接连被石化、金妮·韦斯莱被日记（汤姆·里德尔的日记，伏地魔的魂器）控制。洛哈特教授（花架子）任教黑魔法防御术。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 开学。火车上多比警告哈利（背景）；你发现金妮·韦斯莱抱着一个旧日记本——她说是'从旧书堆里捡的'，眼睛下有黑眼圈（她最近总睡不好）。\n    - 9月第2周: 洛哈特教授登场。他穿着丁香紫长袍，让全班做\"洛哈特能力测试\"——你答对了他的生日，他感动得差点给你签名照。伊莎贝拉教官在走廊目睹全程，评价只有一个字：'啧。'\n    - 10月: 万圣节后，洛丽丝夫人被石化，墙上出现血字。全校恐慌。费尔奇疯了似的到处抓人——他怀疑所有人，包括你。\n    - 11月: 学生接连被石化（科林·克里维、尼克爵士等）。金妮的状态越来越差：她开始说梦话、在盥洗室哭、在日记本上写个不停。你在走廊遇见她，她勉强笑了一下：'我没事。'\n    - 12月: 圣诞。留校的人变少了（家长接走孩子）。金妮也在留校名单上——她父母担心她的'精神不好'。她红着眼眶跟你说：'我总觉得……有什么东西在让我做我不愿意做的事。'\n\n  本季主线弧:\n    - 密室的恐慌: 石化事件笼罩全校。恐惧之下，谁靠近你、谁疏远你、谁在深夜找你说话——恐慌是关系的试金石。\n    - 金妮的异常: 她被日记控制的伏笔（你能否察觉？）——她开始'不记得'自己做过的事（血字是她夜里写的，她不知道）。\n    - 洛哈特的笑话: 花架子教授让所有人（包括女巫们）私下吐槽——共同吐槽是最快的破冰。\n\n  关键场景:\n    - 血字出现之夜（你在场/你不在场；全校恐慌时你身边的她）\n    - 洛哈特课堂的闹剧（全班憋笑：谁先笑出声）\n    - 金妮的异常（你发现她不对劲的时刻）\n    - 圣诞夜的谈话（金妮的'我总觉得……'）\n\n  女巫互动钩子:\n    - 金妮: 核心暗线。你注意到她抱着日记本/她深夜在盥洗室哭/她说'我不记得自己做过什么'。你选择：追问（她抗拒）、陪伴（她靠在你肩上哭）、告诉教授（赫敏也在调查——你们交换情报）。\n    - 赫敏: 她开始调查密室（在图书馆翻《霍格沃茨：一段校史》）。她拉着你当助手：'你观察力不错。'——学霸同盟升级。\n    - 露娜·斯特兰德: 拉文克劳的传闻她最先知道：'他们说蛇怪的眼睛会杀人。'——她的直觉+1。\n    - 黛西: 石化恐慌让她害怕：'万一下一个是我……'她晚上不敢一个人走走廊，你陪她——依赖感加深。\n    - 潘西: 斯莱特林在恐慌中反而优越：'密室是斯莱特林的传说。'她看格兰芬多的眼神带着'活该'——但金妮被波及（韦斯莱家）时她没笑。\n    - 薇奥拉: 她父亲来信让她别掺和。她表面听劝，但深夜会在图书馆翻'密室'相关的书——她好奇。\n    - 拉文德: 她断言'是幽灵干的'，然后被尼克爵士吓哭。她躲在你身后：'你、你保护我！'\n\n  事件池（一次 1~2 个）:\n    - 事件·血字之夜: 你目睹墙上的血字出现（金妮在梦游写下的——你在场看到了'她'？）。你选择：叫醒她（她茫然不知）/告诉赫敏（调查线+1）/隐瞒（保护她，但伏笔加深）。\n    - 事件·石化危机: 你认识的人被石化（随机）。你探望她/她的反应（昏迷中无法回应——你第一次感到无力）。\n    - 事件·洛哈特的'勇敢测试': 他让学生\"勇敢地\"摸他带来的'危险生物'（其实是驯化的）。你被点名。你摸/你拒绝——女巫们的反应各异。\n    - 事件·禁林线索: 露娜说禁林边缘有'巨大的蜘蛛壳'（八眼巨蛛蜕壳——海格养阿拉戈克的伏笔）。你们'恰好'路过海格的南瓜地。\n    - 事件·金妮的日记: 你看到金妮的日记本（她落下的）。翻开？不翻开？——选择决定你是否提前发现魂器暗线。\n\n  关系推进线:\n    - 好感度: 15~25；恐慌中的陪伴（陪黛西走走廊/陪金妮说话）加成 +5~10。\n    - 欲望度: 恐慌气氛下的'抱团取暖'——深夜的陪伴开始带上体温。\n    - 缴械值: 伊莎贝拉教官的课外实战（她开始教一年级'保命咒'：'恐慌时用这个'）。\n    - 堕落值: 0~5。\n\n  学期结算:\n    - 密室内线: 你的调查进度（知道多少/告诉谁）。\n    - 金妮线: 她的异常记录（你发现了什么）。\n    - 学期结束: 时间.学期 → 第二学期（密室篇·下：决战）。\n\n</剧情_2年_第一学期>\n", "剧情_2年_第二学期": "<剧情_2年_第二学期>\n剧情_2年_第二学期:\n  学年定位: 2年级 · 密室篇·下（1993年1月~6月）· 蛇怪与日记\n  原著事件坐标: 《密室》下半年——赫敏被石化（她先查到了蛇怪线索）、金妮被日记拖入密室、哈利与蛇怪决战（格兰芬多宝剑）、日记被销毁、卢修斯·马尔福被揭发。你不在密室里（哈利在），但你在城堡里经历了全过程：赫敏的倒下、金妮的失踪、所有人的恐惧。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。恐慌持续。赫敏开始'消失'（她在调查蛇怪，找到了'蜘蛛逃离禁林'的线索）。\n    - 2月: 赫敏被石化。她在图书馆倒下，手里攥着撕下来的书页（'蛇怪……管道……'）。你赶到时她已经被抬走——你握住她冰凉的手，她毫无反应。这是你第一次直面'魔法世界会伤人'。\n    - 3月: 金妮失踪。她消失的那晚，你'恰好'在她宿舍附近听到异响（她被日记拖进密室的通道）。你敲门没人应，推门看到她的日记本掉在地上——你捡起它，感受到一股寒意。\n    - 4月: 密室的解决（原著）。哈利在密室用宝剑杀死蛇怪、毁掉日记；金妮获救。你不在现场，但你在城堡里等了一整夜——天亮时金妮被抱出来，脸色惨白，但活着。\n    - 5月: 卢修斯·马尔福被揭发（他把日记塞进金妮的坩埚），被校董会除名。多比获得自由。城堡解除恐慌。\n    - 6月: 学期末。被石化的学生全部苏醒（曼德拉草复活药剂——塞西莉亚教授参与熬制）。赫敏醒来后的第一句话是问考试成绩。金妮开始恢复，但她变了——更沉默，更怕黑。\n\n  本季主线弧:\n    - 恐慌的顶点与解除: 石化→失踪→决战→复苏——你作为'城堡里的见证者'经历全程。谁在恐慌中依赖你、谁在事后感谢你、谁记住你深夜的陪伴。\n    - 金妮的创伤与你的位置: 她获救后陷入沉默。你捡到过她的日记、你陪过她深夜说话——她是'需要你的人'。\n    - 赫敏的石化: 她醒来后你们的关系线有了新底色（她昏迷时你握过她的手——她听说了，没提，但看你的眼神变了）。\n\n  关键场景:\n    - 赫敏被石化的那一刻（你握住她的手）\n    - 金妮失踪之夜（你捡到日记本的寒意）\n    - 密室解决后的黎明（你等了一夜的人）\n    - 学期末的复苏（赫敏醒来/金妮的沉默）\n\n  女巫互动钩子:\n    - 金妮: 核心线。获救后的她：夜里不敢关灯/白天强装没事/在某次魁地奇训练后崩溃。你陪她——她从'同学'变成'依赖你的人'（好感+15，密室线专属）。\n    - 赫敏: 她醒来后知道你在她昏迷时守过她（别人告诉她的）。她别扭地道谢：'听说……你来看过我。'——学霸的害羞。\n    - 黛西: 恐慌高峰她躲你身后：'我害怕。'你陪她度过最难的一周——依赖感加深。\n    - 露娜·斯特兰德: 她在金妮失踪那晚'看到'了管道里爬过什么东西（蛇怪）。她跟你说：'它在地下。'——她的直觉从未出错。\n    - 塞西莉亚·费恩: 她熬了三个通宵的曼德拉草复活药剂。你'恰好'给她送夜宵，她接过来没说话，但第二天课上她第一次对你笑了。\n    - 伊莎贝拉·诺斯: 密室期间她自请巡逻（前傲罗的本能）。她教你'听到动静先跑'：'勇敢是好事，但活着才能继续勇敢。'\n    - 潘西: 密室结束后斯莱特林被全校侧目（斯莱特林的怪物）。她罕见地沉默。你在走廊遇见她，她没挑衅，只是走过——她的傲慢出现了裂缝。\n\n  事件池（一次 1~2 个）:\n    - 事件·赫敏的石化: 你在场/你赶到。握住她的手的那几秒，是你们关系的转折点（好感+10，她醒来后态度软化）。\n    - 事件·日记本的寒意: 你捡到金妮的日记。翻开（看到'汤姆·里德尔'的自我介绍，寒意+1）/交给教授（赫敏的调查线+1，金妮获救后你成了'救她的人'之一）。\n    - 事件·黎明等待: 金妮获救的黎明，你在城堡门口等到天亮。她看到你时眼神的变化（她记住了）。\n    - 事件·复苏的拥抱: 学期末被石化者苏醒。赫敏醒来后看到你，第一句话是：'你……一直在这？'\n    - 事件·暑假阴影: 金妮暑假前跟你说：'我暑假……可能不给你写信了。我需要……一个人待着。'——她的创伤线延续到三年级。\n\n  关系推进线:\n    - 好感度: 金妮 25~35（密室线专属加成）；赫敏 20~30（石化事件）；其余自然波动。\n    - 欲望度: 恐慌后的'劫后余生'心态——学期末的城堡弥漫着'活着真好'的氛围，亲密线开始萌芽。\n    - 缴械值: 伊莎贝拉的'保命咒'训练成果。\n    - 堕落值: 5~10。\n\n  学期结算:\n    - 密室线: 你的参与度（日记/等待/陪伴）写入叙事记忆。\n    - 金妮线: 她的创伤状态（三年级继续）。\n    - 赫敏线: 石化事件的影响（她记住你了）。\n    - 学期结束: 时间.学期 → 假期（暑假）；升三年级。\n\n</剧情_2年_第二学期>\n", "剧情_3年_第一学期": "<剧情_3年_第一学期>\n剧情_3年_第一学期:\n  学年定位: 3年级 · 阿兹卡班篇·上（1993年9月~12月）· 摄魂怪的阴影\n  原著事件坐标: 《阿兹卡班的囚徒》上半年——小天狼星·布莱克越狱（被指控出卖波特夫妇的叛徒）、摄魂怪进驻霍格沃茨、卢平教授（狼人）任教黑魔法防御术、巴克比克（鹰头马身有翼兽）的登场。城堡被'快乐被吸走'的阴冷笼罩。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 开学。火车上的摄魂怪检查——车厢里突然冷得像冰窖，你的快乐被吸走的感觉让所有人脸色发白。黛西在你旁边，她抓住你的手，浑身发抖。\n    - 9月第2周: 卢平教授到任。他穿着打补丁的长袍，第一节课就教守护神咒（'面对摄魂怪，你们需要快乐'）。他请全班吃巧克力——'摄魂怪之后，巧克力是良药'。伊莎贝拉教官对卢平的评价：'他教的才是真东西。'\n    - 9月下旬: 巴克比克事件（原著：马尔福挑衅被鹰头马身有翼兽所伤）。你'恰好'在海格的课上看到全程：潘西的表哥德拉科被巴克比克抓伤，海格脸色惨白。\n    - 10月: 摄魂怪袭击魁地奇比赛（哈利从扫帚坠落）。你在看台上，身边的人尖叫——你护住了谁？\n    - 11月: 城堡里的'小天狼星目击'传闻。有人在夜里看到黑影。费尔奇比平时更暴躁。谁在深夜敲你的门说'我害怕'？\n    - 12月: 圣诞。卢平教授请留校学生喝热茶。他问你喜欢什么守护神——你说了一只动物，他点点头：'那代表你心里最快乐的东西。'\n\n  本季主线弧:\n    - 摄魂怪的恐惧: 快乐被吸走的体验让全校陷入阴冷。恐惧中，谁靠近你、谁需要你、谁和你互相取暖。\n    - 卢平的'真课': 对比洛哈特，卢平的实战教学让所有人（包括你）的防御能力质变——守护神咒是三年级的分水岭。\n    - 小天狼星的传闻: 他是'十恶不赦的逃犯'——但露娜·斯特兰德说：'我觉得他不是坏人。'她的直觉第一次被所有人反驳。\n\n  关键场景:\n    - 火车上的摄魂怪（你护住黛西的手）\n    - 卢平的守护神咒课（你的守护神形态=你的内心伏笔）\n    - 巴克比克事件（海格的绝望/潘西表哥的嚣张）\n    - 魁地奇坠落的惊魂（看台上你身边的人）\n\n  女巫互动钩子:\n    - 黛西: 火车上她抓住你的手发抖。事后她红着脸松开：'谢、谢谢。'——恐惧让依赖显形（好感+10）。\n    - 艾琳: 摄魂怪让魁地奇变成噩梦。她训练时被摄魂怪干扰，摔得不轻。你扶她起来，她龇牙咧嘴：'他妈的……这鬼东西。'——她的粗口在你面前毫无防备。\n    - 赫敏: 她开始疯狂研究'时间'相关的东西（她三年级用时间转换器上多门课——背景）。她总是一脸疲惫但眼睛发亮：'一天只有 24 小时，但我可以上 5 门课！'\n    - 金妮: 密室创伤+摄魂怪=双重阴影。她在走廊看到摄魂怪时整个人僵住（PTSD）。你拉住她跑开，她缓过来后轻声说：'谢谢你……还记得拉我一把。'\n    - 露娜·斯特兰德: '小天狼星不是坏人。'她坚持这个判断，被拉文克劳的同学嘲笑。她来找你：'你信我吗？'——信任的抉择。\n    - 薇奥拉: 巴克比克事件后她少见地评价德拉科：'他活该。'——她不是纯血至上主义者的证据。\n    - 潘西: 德拉科是她表哥的圈子（她是德拉科的跟班团成员，原著设定）。但她看到德拉科'活该'时表情复杂——她其实也觉得他欠揍。\n\n  事件池（一次 1~2 个）:\n    - 事件·守护神课: 你的守护神形态（狼/鹿/猫头鹰/獾/蛇——透露你的内心）。某位女巫的守护神和你的一样/互补——你们的'快乐'相通。\n    - 事件·深夜敲门: 摄魂怪传闻的深夜，谁敲你的门（黛西/金妮/拉文德——按好感度最高者优先）：'我害怕，能待一会儿吗？'\n    - 事件·巴克比克的审判: 海格的鹰头马身有翼兽被判死刑（魔法部背景）。你陪海格/你安慰德拉科圈子里没受伤的人（潘西'他又没事'）。\n    - 事件·圣诞茶话: 卢平的茶会。你聊到自己的过去（伏笔：你的来历）——某位女巫认真听了。\n    - 事件·禁林黑影: 你深夜看到'小天狼星'（其实是巴克比克/或狗形态的小天狼星——伏笔）。你告诉谁？\n\n  关系推进线:\n    - 好感度: 20~30；恐惧中的互相取暖 +10。\n    - 欲望度: 阴冷中的体温格外珍贵——'抱团取暖'的亲密感开始明显。\n    - 缴械值: 守护神咒的掌握（伊莎贝拉教官验收：'不错，能活着了'）。\n    - 堕落值: 5~10。\n\n  学期结算:\n    - 守护神: 你的守护神形态写入叙事记忆（伏笔）。\n    - 金妮线: 她的 PTSD 状态（下学期继续）。\n    - 学期结束: 时间.学期 → 第二学期（阿兹卡班篇·下：真相）。\n\n</剧情_3年_第一学期>\n", "剧情_3年_第二学期": "<剧情_3年_第二学期>\n剧情_3年_第二学期:\n  学年定位: 3年级 · 阿兹卡班篇·下（1994年1月~6月）· 真相之夜\n  原著事件坐标: 《阿兹卡班的囚徒》下半年——尖叫棚屋的真相（小天狼星是无辜的，叛徒是小矮星彼得）、时间转换器（赫敏和哈利回到过去救巴克比克和小天狼星）、卢平身份暴露（狼人）辞职。你不在尖叫棚屋（哈利三人组在），但你在城堡里经历了卢平的离开和赫敏的'秘密'。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。卢平教授的课越来越精彩，但斯内普教授总在找他的麻烦（'卢平教授，你今晚……身体可好？'——暗示月圆）。\n    - 2月: 月圆之夜。你在城堡走廊'恰好'看到卢平教授匆匆离开（他去尖叫棚屋变身）。你隐约觉得'他好像躲着什么'。\n    - 3月: 巴克比克的死刑日（原著被救走——哈利和小天狼星骑着它飞走了）。海格在操场哭得像个孩子。你陪着他，他抽泣着说：'它是好孩子……'\n    - 4月: 尖叫棚屋之夜（原著）。你不在场，但深夜你听到了城堡外的骚动（小矮星彼得逃跑时变身老鼠的动静）。天亮后，小天狼星骑着巴克比克逃走的传闻传遍全校——魔法部暴怒，但邓布利多的眼神很平静。\n    - 5月: 卢平教授辞职。他离开那天，全班都去送他。他对你说：'守护神咒练得不错，别荒废。'——你突然意识到，这位最好的老师下学期不在了。\n    - 6月: 学期末。赫敏的'秘密'：她看起来累极了（时间转换器的副作用），但你问她她只说'课程太多了'。你隐约觉得不对，但没追问。她靠在你肩上睡着的那一刻，是你们关系的转折点。\n\n  本季主线弧:\n    - 真相的震撼: 小天狼星的无辜——'十恶不赦的逃犯'是冤枉的。世界观的第一课：报纸会骗人，魔法部会错。露娜·斯特兰德的直觉再次应验（'我说过他不是坏人'）。\n    - 卢平的离开: 最好的老师因为身份（狼人）被迫离开——偏见与代价的具象化。\n    - 赫敏的疲惫与依赖: 时间转换器的秘密让她累到极点。她在你肩上睡着的那一刻——学霸第一次卸下铠甲。\n\n  关键场景:\n    - 巴克比克死刑日（你陪海格）\n    - 卢平辞职的告别（全班送行）\n    - 赫敏靠在你肩上睡着（关系转折点）\n    - 学期末的'小天狼星逃走了'的传闻之夜\n\n  女巫互动钩子:\n    - 赫敏: 她在你肩上睡着。醒来后她慌乱地擦口水：'我、我没睡着！'——然后她小声说：'……谢谢你没吵醒我。'（好感+15，她的软肋第一次露出来）\n    - 露娜·斯特兰德: 真相应验后她没得意，只是安静地说：'我早知道。'然后她看着你：'你信我，所以我谢谢你。'——信任的双向确认。\n    - 金妮: 卢平辞职那天她哭了（密室后她第一次公开哭）。她哽咽着说：'为什么好人总要走……'——她的创伤与不舍交织。\n    - 黛西: 巴克比克事件后她安慰海格（赫奇帕奇的共情）。她红着眼眶跟你说：'有时候魔法世界……一点都不魔法。'\n    - 伊莎贝拉·诺斯: 卢平辞职后她难得说了一句长话：'我见过太多像他那样的好人，因为身份被赶走。'——她的傲罗经历让她共情。\n    - 潘西: 小天狼星反转后斯莱特林有人嘴硬（'他肯定还是坏蛋'）。她没附和，也没反驳——她开始自己思考了。\n\n  事件池（一次 1~2 个）:\n    - 事件·月圆之夜: 你撞见卢平的异常。你选择：追上去（看到狼人变身——危险+伏笔）/退开（保护自己和秘密）。\n    - 事件·死刑日的陪伴: 你陪海格。他把你当半个朋友，跟你说阿拉戈克的事（八眼巨蛛伏笔）。\n    - 事件·肩上的依靠: 赫敏睡着在你肩上。你选择：保持不动（她醒来后记你的好）/轻轻叫她（她尴尬）。\n    - 事件·告别的礼物: 卢平临走送你一件东西（一本旧笔记/一块巧克力/一句忠告）——'以后遇到摄魂怪，想想你的守护神。'\n    - 事件·真相之夜: 传闻之夜你在城堡门口看到远处巴克比克飞走的影子。你身边的她（按好感度最高者）也看到了——你们共享了一个秘密。\n\n  关系推进线:\n    - 好感度: 25~35；赫敏的'肩上一靠'是学期最大事件（+15）。\n    - 欲望度: 赫敏线的'卸下铠甲'时刻——学霸的脆弱让你心动。\n    - 缴械值: 守护神咒大成（伊莎贝拉教官：'合格了'）。\n    - 堕落值: 10~15。\n\n  学期结算:\n    - 真相线: 小天狼星无辜的认知写入世界观（五年级凤凰社会重逢）。\n    - 卢平线: 他的忠告/礼物保留（四年级火焰杯篇不再有他，但守护神咒是你的）。\n    - 赫敏线: '肩上一靠'事件记录（关系转折）。\n    - 学期结束: 时间.学期 → 假期；升四年级（火焰杯篇！）。\n\n</剧情_3年_第二学期>\n", "剧情_4年_第一学期": "<剧情_4年_第一学期>\n剧情_4年_第一学期:\n  学年定位: 4年级 · 火焰杯篇·上（1994年9月~12月）· 三强争霸赛\n  原著事件坐标: 《火焰杯》上半年——三强争霸赛重启、德姆斯特朗与布斯巴顿到访、火焰杯选出四位勇士（哈利被第四个选中）、第一个项目（龙）、圣诞舞会（三强年传统）。假疯眼汉穆迪（小巴蒂·克劳奇）潜伏在校。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月: 开学。三强争霸赛宣布——中断一个世纪后重启。全校沸腾。德姆斯特朗的船从黑湖升起，布斯巴顿的马车由飞天白马拉来——食堂位置重新洗牌。\n    - 9月底: 年龄线。邓布利多画下年龄线（17 岁以上才能投名字）。你 17 岁（成年入学制）——你是少数**够年龄**的四年级生之一！全校看你、你的女巫们看你的眼神都不一样了。\n    - 10月: 火焰杯选出勇士：塞德里克（赫奇帕奇）、芙蓉（布斯巴顿）、克鲁姆（德姆斯特朗）——然后，第四个名字从火焰杯里吐出：哈利·波特。全场死寂。赫敏在格兰芬多长桌边攥紧叉子：'有人要害他。'\n    - 10月31日: 第一个项目（龙）。你在看台上，火龙喷火的那一刻，身边的黛西尖叫着抓住你的手臂。塞德里克用变形术（石头变狗）调虎离山——他的机智让赫奇帕奇欢呼。\n    - 11月: 假穆迪的课（原著：他教三大不可饶恕咒）。伊莎贝拉教官看到穆迪上课方式后皱眉：'内容没错，但味道不对。'——她的傲罗直觉在报警。\n    - 12月: 圣诞舞会（三强年）。全校最盛大的舞会。谁邀请你？你邀请谁？克鲁姆带着赫敏进场（原著），你看到她时她'恰好'也在看你——那一眼，让格兰芬多的空气微妙起来。\n\n  本季主线弧:\n    - 三强的狂欢: 外来者（德姆斯特朗/布斯巴顿）打破校园平衡。你的女巫们的'护食'反应很有趣——克鲁姆（魁地奇明星）是最大威胁：他抢走了赫敏的舞伴位。\n    - 够年龄的特权: 你是四年级生里少数够年龄投火焰杯的人——你投了吗？投给谁？这个选择让你在女巫们眼中的形象不同。\n    - 暗流: 假穆迪的异常（他的'教学'有目的）、哈利被选中的阴谋——你隐约感到'不对劲'，但说不清。\n\n  关键场景:\n    - 年龄线（你够年龄：投/不投火焰杯）\n    - 第一个项目（龙的震撼：你护住身边的她）\n    - 圣诞舞会（三强年最盛大的舞会：邀舞修罗场）\n\n  女巫互动钩子:\n    - 赫敏: 克鲁姆邀她跳舞（原著）。她答应了，但舞会中途她'恰好'在你附近：'你……怎么不跳舞？'——她在乎你的反应。\n    - 金妮: 舞会上她跟别人跳了舞（原著她跟纳威）。但她跳完来找你：'你都不请我？'——她的主动。\n    - 薇奥拉: 克鲁姆也请了斯莱特林的女生（她没被请）。她冷着脸看你：'你也不请我？'——大小姐的傲娇邀约（反向）。\n    - 黛西: 第一个项目她抓着你手臂尖叫。事后她红着脸道歉：'对不起……我太大声了。'——她记住你的手臂了。\n    - 潘西: 德拉科讽刺哈利时她没接话（她表哥圈子变了味）。你'恰好'听见，她看到你：'看什么？'——她的防线在松动。\n    - 拉文德: 舞会前她缠着你占卜：'星星说你会遇到一个穿粉裙子的人。'——她穿的是粉裙子。\n    - 露娜·斯特兰德: 她看着火焰杯说：'杯子在说谎。'——她的直觉再次直指真相（第四个名字是阴谋）。\n\n  事件池（一次 1~2 个）:\n    - 事件·火焰杯抉择: 你投/不投。投了（名字进杯子，没被选中——但你'敢试'的形象+）；不投（你冷静，她记住你的稳重）。\n    - 事件·龙的震撼: 第一个项目。你护住身边的她（黛西抓你手臂/金妮躲你身后/赫敏专注看龙没理你——选择决定）。\n    - 事件·穆迪的课: 他教三大不可饶恕咒（钻心咒示范）。你看到同学被钻心咒折磨的表情——你选择：皱眉（伊莎贝拉注意到你）/别过脸（她理解）。\n    - 事件·舞会邀约: 你邀/被邀/旁观。舞会中途的走廊偶遇（谁在舞池边等你）。\n    - 事件·克鲁姆风波: 赫敏被克鲁姆邀请。你的反应（吃醋/无所谓/祝福）决定格兰芬多的空气温度。\n\n  关系推进线:\n    - 好感度: 30~40；舞会事件是学期最大增量（+10~15）。\n    - 欲望度: 三强舞会的浪漫氛围——礼服、灯光、舞池，青春期的荷尔蒙达到峰值。\n    - 缴械值: 你的年龄线'够格'形象（你被当作'大人'看待了）。\n    - 堕落值: 10~15。\n\n  学期结算:\n    - 舞伴记录: 谁和你跳舞（写入叙事记忆，下学期引用）。\n    - 火焰杯抉择: 投/不投记录。\n    - 学期结束: 时间.学期 → 第二学期（火焰杯篇·下：黑暗降临）。\n\n</剧情_4年_第一学期>\n", "剧情_4年_第二学期": "<剧情_4年_第二学期>\n剧情_4年_第二学期:\n  学年定位: 4年级 · 火焰杯篇·下（1995年1月~6月）· 黑暗降临\n  原著事件坐标: 《火焰杯》下半年——第二个项目（湖）、第三个项目（迷宫）、塞德里克·迪戈里之死、伏地魔复活（墓地）、假穆迪被捕。1995 年 6 月 24 日的夜晚改变了魔法界——你 17 岁，你在场（在城堡里，不在墓园）。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。第二个项目的传闻：'要进黑湖'。高年级勇士开始水下训练，看台上围满人。\n    - 2月: 第二个项目（湖）。勇士们在水下救人质。你认识的人质（原著：罗恩/赫敏/芙蓉妹妹/克鲁姆）——你在看台上攥紧栏杆。\n    - 3月: 假穆迪越来越奇怪（他'帮'哈利的方式透着不对劲）。伊莎贝拉教官的直觉越来越强：她私下问你：'你有没有觉得……穆迪教授哪里不对？'\n    - 4月: 第三个项目前奏。迷宫在魁地奇场拔地而起——树篱高得像墙。气氛开始压抑。\n    - 5月: 期末考+三强最后一个项目倒计时。城堡里的低语：'塞德里克说迷宫里有怪东西。'\n    - 6月24日: 第三个项目（迷宫）之夜。全校围在魁地奇场看魔法投影。然后——塞德里克和哈利触杯，消失了。再然后，哈利独自回来，抱着塞德里克的尸体。**全场死寂，然后尖叫。** 你在人群中，你身边的她（按好感度最高者）死死抓住你的手臂，指甲掐进肉里。那一夜，所有人都长大了。\n    - 6月25日: 真相：伏地魔复活了。邓布利多宣布，魔法部否认（福吉部长'他没有回来'）。城堡在震惊与恐惧中结束学年。\n\n  本季主线弧:\n    - 塞德里克之死: 你第一次亲眼见证死亡（他 17 岁，和你同龄）。世界观彻底改变：这不是书里的故事，这是会死人的世界。黛西（赫奇帕奇）的崩溃——塞德里克是她的同院学长。\n    - 伏地魔复活: '他回来了'——所有人都知道，但魔法部说'没有'。信任的裂缝：你信谁？（邓布利多/魔法部/你的直觉）\n    - 暑假的阴影: 这个暑假不会有悠闲——食死徒开始活动（麻瓜袭击）。你的关系线第一次面临'战争'的现实。\n\n  关键场景:\n    - 迷宫之夜（全校的投影屏幕：绿光、消失、回归、尸体）\n    - 塞德里克之死后的黎明（你身边的她）\n    - 学期末的'伏地魔回来了'（邓布利多的演讲/魔法部的否认）\n\n  女巫互动钩子:\n    - 黛西: 塞德里克是赫奇帕奇的骄傲。她哭了一整夜。你陪她——她抓着你的袖子：'他、他明年就要毕业了……'她的依赖从此不同（好感+15）。\n    - 赫敏: 她知道更多内情（哈利告诉她的）。她罕见地沉默了几天，然后跟你说：'这个世界……比书里写的危险得多。'——她的理性外壳裂开。\n    - 金妮: 塞德里克之死让她想起密室。她夜里不敢睡。你陪她到天亮——她靠在你肩上：'会好起来的，对吗？'（你的回答定义她的安心程度）\n    - 露娜·斯特兰德: 她看着夜空说：'星星在移动。'——她的直觉已经预见了战争的走向。\n    - 薇奥拉: 她父亲（魔法部官员）打电话来说'没事'，但她听出他声音发虚。她对你说：'大人也在害怕。'——她的'大小姐'外壳第一次松动。\n    - 潘西: 塞德里克死后斯莱特林也有人沉默（他不是斯莱特林，但他是'霍格沃茨的'）。她在走廊里站着没动，你没打扰她——她记住了你的分寸。\n    - 伊莎贝拉·诺斯: 她参与了塞德里克遇害后的初步调查。她回来说了一句：'我见过太多尸体，但那是孩子。'——她的旧伤被你看到。\n\n  事件池（一次 1~2 个）:\n    - 事件·迷宫之夜: 你在人群中，投影屏幕上的绿光。你身边的她（好感度最高者）抓住你的手臂。你握住她的手——那一握，是战前最后的'和平'。\n    - 事件·黎明陪伴: 塞德里克之死后，谁需要你陪（黛西/金妮/赫敏——按好感度最高者优先）。你陪她的方式定义关系深度。\n    - 事件·邓布利多的演讲: 他在学期末宣布'伏地魔回来了'。你的反应（相信/怀疑/恐惧）写入叙事记忆。\n    - 事件·暑假阴影: 假期前的站台，谁跟你说'开学见'时眼神不一样了（带着'可能会出事'的担忧）。\n    - 事件·穆迪的落网: 假穆迪被揭穿（小巴蒂·克劳奇）。伊莎贝拉教官事后跟你说：'我的直觉没骗我。'——你开始信任她的判断。\n\n  关系推进线:\n    - 好感度: 35~50；黎明陪伴是学期最大事件（+15~20）。\n    - 欲望度: 死亡与恐惧面前的'抓紧彼此'——青春期的关系第一次有了'沉重'的重量。\n    - 缴械值: 伊莎贝拉教官的信任升级（她开始把你当'可托付的人'）。\n    - 堕落值: 15~25（战争阴影下的心态变化）。\n\n  学期结算:\n    - 战争状态: '伏地魔回来了'写入世界观（五年级=凤凰社篇前置）。\n    - 关系沉淀: 黎明陪伴的对象=你的'战前最亲近的人'。\n    - 暑假: 这个暑假=食死徒活动的开始（麻瓜袭击传闻）；五年级开学见。\n    - 学期结束: 时间.学期 → 假期；升五年级（凤凰社篇！）。\n\n</剧情_4年_第二学期>\n", "剧情_5年_第一学期": "<剧情_5年_第一学期>\n剧情_5年_第一学期:\n  学年定位: 5年级 · OWL年 · 第一学期（1995年9月~12月）· 凤凰社篇·上\n  原著事件坐标: 《哈利·波特与凤凰社》上半年——乌姆里奇到任、D.A.（邓布利多军）建立、禁林中的夜骐与神秘事务司的伏笔。你是五年级老生（从一年级走来的见证者）：不是主角，但风暴会扫过每个人。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 开学宴。五年级的你走进礼堂时，'认识你'的人已经很多了——同届的女巫们向你点头，你不再是新面孔。邓布利多宣布两件事：新学期开始、以及\"魔法部将派来一位高级调查官\"——他说话时，斯莱特林长桌有人笑了。\n    - 9月第2周: 乌姆里奇·多洛雷斯到任。粉色的开衫、尖细的嗓音、'我会教你们如何通过 OWL'。她在第一堂黑魔法防御术课上宣布：理论为主，实践以后再说。伊莎贝拉·诺斯教授在走廊里冷着脸对你说：'这学期，我只会教愿意学的人。'\n    - 9月下旬: 魔法部开始介入学校：乌姆里奇开始旁听每一节课。赫敏在图书馆低声说：'她不是来教书的，她是来掌权的。'\n    - 10月: 魁地奇院队选拔被乌姆里奇搅黄（她以'OWL 年学业优先'为由禁止）。金妮·韦斯莱在走廊里踢了一脚墙：'她凭什么！'\n    - 10月31日: 万圣节。乌姆里奇宣布'为保证学习环境'取消万圣节宴会——全校哗然。当晚，格兰芬多公共休息室的炉火边，有人第一次提起'也许我们应该自己做点什么'。\n    - 11月: D.A.（邓布利多军）在猪头酒吧开会成立。你被赫敏拉去'帮个忙'——'我们需要一个场地，你有主意吗'。有求必应屋的第一次聚会：八个人，一间堆满旧扫帚的房间，伊莎贝拉教官（她'恰好路过'）在门口留了一句话：'别被抓到。'\n    - 12月: OWL 模拟考周+圣诞舞会照常（乌姆里奇想取消但邓布利多否决）。舞会上，谁和谁跳舞不再只是八卦——在乌姆里奇的眼皮底下，每一次亲密都是反抗。\n\n  本季主线弧:\n    - 压制与反抗: 乌姆里奇的高压政策让全校气氛压抑，D.A. 成为暗流。你作为五年级老生，选择站在哪边（公开对抗/暗中支持/明哲保身）决定你的名声和女巫们对你的看法。\n    - 老生的立场: 在'OWL 年+政治风暴'双重背景下，你的成绩、你的立场、你的勇气，决定你是谁——同届的她们都在看你。\n    - 关系的建立: 高压之下，靠近更容易——共同的秘密（D.A.）、共同的敌人（乌姆里奇）、共同的夜晚（有求必应屋）都是关系升温的土壤。\n\n  关键场景（可单独展开成完整回合）:\n    - 乌姆里奇第一课（她的理论课 vs 伊莎贝拉的实战课之争；你被点名回答'为什么防御咒重要'）\n    - D.A. 成立夜（猪头酒吧的密会：谁在、谁紧张、谁带头；赫敏的'我们得签个名'）\n    - 有求必应屋第一次聚会（昏暗烛光下学习守护神咒：谁的守护神是什么形态，透露她的内心）\n    - 圣诞舞会（乌姆里奇到场监舞：高压下的舞会，谁主动邀你=公然表态）\n\n  女巫互动钩子（按标签调度演出）:\n    - 薇奥拉·布莱克伍德: 拉文克劳找球手。她父亲是魔法部官员（亲乌姆里奇派）——她的立场两难。'你觉得魔法部是对的吗？'她第一次认真问你。\n    - 艾琳·怀特: 格兰芬多击球手。乌姆里奇禁了魁地奇，她的火气最大：'没有魁地奇的学年算什么学年！'她拉着你翻墙去禁林边偷偷飞扫帚。\n    - 露娜·斯特兰德: 拉文克劳。她盯着乌姆里奇看了三节课，然后在图书馆跟你说：'她身上有虻——很多很多虻。'她的直觉直指真相。\n    - 黛西·霍桑: 赫奇帕奇。乌姆里奇旁听魔药课时她紧张到炸了坩埚，被罚留堂。你陪她留堂，她在熄灯后小声说：'你……人真好。'\n    - 塞西莉亚·费恩: 魔药学教授。乌姆里奇想借她整顿魔药课（'教育部对某些教师的教学方法有保留意见'），塞西莉亚冷着脸回：'我的坩埚，我说了算。'她在你面前第一次露出欣赏的眼神。\n    - 伊莎贝拉·诺斯: 黑魔法防御术教授。她的课被乌姆里奇盯上，但她照教实战。课后她把你留下：'你底子不错。想学真正的战斗吗？'——D.A. 之外，她私下给你开小灶。\n    - 赫敏·格兰杰: D.A. 的发起者。她拉你入伙：'你愿意帮忙吗？'——这是她第一次把你看作'同一阵营'。\n    - 金妮·韦斯莱: 魁地奇被禁的火气+哥哥们在凤凰社的担忧。她会在有求必应屋里练咒语练到手抖，然后倔强地再来一次。\n    - 卢娜·洛夫古德: 她会'恰好'出现在有求必应屋门口：'门说，你们在里面。'——她是唯一一个不用咒语就找到 D.A. 的人。\n    - 潘西·帕金森: 斯莱特林。她父亲也是魔法部官员。她会在走廊里冷嘲'D.A.？一群小孩子的过家家'，但乌姆里奇当众羞辱格兰芬多时，她没笑。\n    - 拉文德·布朗: 占卜课狂热者。她断言：'星星说，这个学期会有人改变城堡。'她看着你说：'我觉得是你。'\n\n  事件池（一次 1~2 个，勿堆砌）:\n    - 事件·乌姆里奇第一课: 她点名你：'你，五年级的，说说防御咒的基本原理。'答得好：她在教学报告里写'尚有可塑性'；答砸：留堂+警告。伊莎贝拉教官第二天在走廊拦你：'她问你什么了？'——她的反应暴露她的立场。\n    - 事件·D.A. 签名风波: 赫敏要求所有成员在羊皮纸上签名（怕有内鬼）。你签不签？签了=把柄；不签=失去信任。拉文德第一个签，'我相信你'。\n    - 事件·守护神咒之夜: 有求必应屋第一次练习守护神。你的守护神形态让赫敏沉思（'很少见'）；某位女巫的守护神是动物形态（狼/鹿/鸟），透露她的底色。\n    - 事件·禁林夜飞: 艾琳拉你翻墙去禁林边飞扫帚。月光下你看见禁林深处有银白色的东西一闪而过（夜骐？——只有见过死亡的人才能看见夜骐，伏笔）。\n    - 事件·乌姆里奇的调查: 她开始排查'不合格的教师'：伊莎贝拉首当其冲。你无意间听到她在办公室打电话：'……那个黑魔法防御术的教官，必须换掉。'你怎么处理这个情报？\n    - 事件·圣诞舞会: 乌姆里奇亲自到场监舞。谁主动邀你跳舞=公然表态站队。舞池里，她粉色的身影在角落盯着每一对。\n\n  关系推进线:\n    - 好感度: 高压环境下建立'共同秘密'的关系升温更快（D.A. 成员 +10~15）；圣诞舞会邀约是学期最大增量点（+15）。\n    - 欲望积压: 压抑的气氛反而让欲望更躁动——乌姆里奇越是管束，'深夜的偷偷摸摸'越诱人（宵禁后的禁林边缘、空教室、有求必应屋）。\n    - 缴械值: 伊莎贝拉的小灶训练让你在实战课/私下切磋中快速成长。\n    - 堕落值: 本学期基本不动；'秘密'的张力（D.A. 身份可能暴露）是暗线。\n\n  学期结算:\n    - 立场记录: 你站哪边（公开反乌姆里奇/暗中支持/明哲保身）写入叙事记忆，影响下学期事件走向。\n    - D.A. 进度: 成员名单（谁跟你一起）、你的'代号'、练习进度。\n    - 禁林伏笔: 银白色影子（夜骐）记录+1。\n    - 学期结束: 时间.学期 → 第二学期；乌姆里奇的调查在继续。\n\n</剧情_5年_第一学期>\n", "剧情_5年_第二学期": "<剧情_5年_第二学期>\n剧情_5年_第二学期:\n  学年定位: 5年级 · OWL年 · 第二学期（1996年1月~6月）· 凤凰社篇·下\n  原著事件坐标: 《凤凰社》下半年——乌姆里奇全面掌权（校长夺权）、D.A. 暴露、神秘事务司之战、邓布利多归来与伏地魔公开。本学期是全书最压抑也最激烈的学期：OWL 考试在即，战争阴影压顶。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。乌姆里奇签发了新校规：'学生结社需经批准'。D.A. 转入地下，集会地点改到有求必应屋的更深处。\n    - 1月下旬: 乌姆里奇开始'调查'伊莎贝拉·诺斯：连续三周旁听她的课，在笔记本上写个不停。伊莎贝拉教官的教案越写越硬：'她要看，就让她看真本事。'\n    - 2月: OWL 模拟考+魁地奇被正式取消。城堡里怨声载道，但无人敢公开反抗——除了某个人在走廊贴了一张'乌姆里奇长着癞蛤蟆脸'的纸条（恶作剧事件，全校传遍）。\n    - 2月14日: 情人节。乌姆里奇宣布'OWL 年不庆祝情人节'，但猫头鹰照常带来粉色的信——有人偷偷寄的，字迹是某位女巫的。\n    - 3月: 乌姆里奇宣布自己为'校长'（邓布利多被赶出城堡）。全校震惊之夜，格兰芬多公共休息室安静得可怕。伊莎贝拉教官在教师休息室的门上留了一句话，第二天全校都看见了。\n    - 4月: D.A. 暴露。猫头鹰通风报信（玛丽埃塔·艾克莫，原著背景），乌姆里奇带人堵住有求必应屋。你在场/你逃脱/你被抓——三条路线。伊莎贝拉教官此时做了一件让全校意外的事：她站出来说是她的'课外辅导'。\n    - 5月: OWL 考试周+神秘事务司的暗流。考试期间的午夜，禁林边有马蹄声（马人）。伊莎贝拉私下告诉你：'有些事，比考试重要。'\n    - 6月: 神秘事务司之战（背景事件）。邓布利多与伏地魔的决斗在魔法部上演，你不在场，但第二天《预言家日报》的头条改变了一切：'伏地魔回来了'。学期在震惊中结束。\n\n  本季主线弧:\n    - 镇压与反抗的终局: 乌姆里奇的独裁、D.A. 的暴露、伊莎贝拉的牺牲——你在这条线里的选择定义你的品格。\n    - 战争的真相: '伏地魔回来了'——谎言的戳穿让所有人重新评估立场。谁害怕、谁坚定、谁动摇。\n    - OWL 与毕业的倒计时: 考试、成绩、未来——在战争阴影下，'毕业'第一次有了'可能没有以后'的重量。\n\n  关键场景:\n    - D.A. 暴露之夜（被抓/逃脱/掩护三线：谁为你顶罪、你为谁顶罪）\n    - 乌姆里奇夺权夜（邓布利多离开城堡，走廊里学生的沉默）\n    - 伊莎贝拉的牺牲（她为学生扛下处分：'我的课，我负责'）\n    - OWL 考试周（压力+战争的余波；考完最后一科的黄昏）\n    - 学期末的'伏地魔回来了'（所有人重新面对世界）\n\n  女巫互动钩子:\n    - 伊莎贝拉·诺斯: 她为你（和 D.A.）扛下乌姆里奇的处分，被停职观察。她临走前拍拍你肩膀：'别浪费我教你的东西。'——缴械值/服气度的最大转折点。\n    - 塞西莉亚·费恩: 乌姆里奇想让她'作证'指认伊莎贝拉，她拒绝了。她在走廊遇见你时说：'有些事，魔药学教不了，但做人要会。'——师生线从'欣赏'转向'信任'。\n    - 赫敏: D.A. 暴露后她自责（'是我的签名名单'）。她会在天文塔上跟你道歉，然后说：'但我不会后悔。'\n    - 金妮: 她帮你从乌姆里奇的办公室偷回被没收的魔杖。她的胆量让你重新认识她。\n    - 露娜·斯特兰德: 被乌姆里奇关禁闭时她在墙上画了虻的图案。她对你说：'没关系，它们会飞走的。'——她的超然让你在混乱中平静。\n    - 薇奥拉: 她父亲的立场（魔法部官员）和她的内心矛盾在'伏地魔回来了'那天爆发：'我父亲说那是谎言……但我信邓布利多。'\n    - 黛西: OWL 考试压力崩溃，她在盥洗室哭。你安慰她，她抓住你的袖子：'要是……明年我不在了，你还会记得我吗？'\n    - 潘西: 斯莱特林在'伏地魔回来了'后气氛微妙（部分纯血家庭倾向黑魔王）。她第一次露出迷茫：'我不知道我该信谁。'\n    - 拉文德: 她在考试周给你占卜：'星星说，你会活过这场战争。'——她很少那么认真。\n\n  事件池（一次 1~2 个）:\n    - 事件·恶作剧纸条: 走廊贴出'乌姆里奇长着癞蛤蟆脸'的纸条。全校传遍，无人承认。乌姆里奇要追查——你知情/你写的/你帮她查（三线）。\n    - 事件·D.A. 暴露之夜: 被抓（你顶罪：缴械值+20、全校尊敬你、伊莎贝拉替你扛）/逃脱（你掩护别人，某人记住你）/不在场（你事后帮她善后）。\n    - 事件·偷魔杖行动: 金妮拉你潜入乌姆里奇办公室偷回被没收的魔杖。柜子里你翻到一份文件：'关于学生……的调查报告'——乌姆里奇在调查所有'可能不听话'的学生，你的名字在上面。\n    - 事件·伏地魔归来之日: 6月的《预言家日报》头条。城堡里的反应：有人哭、有人笑、有人发呆。你身边的她抓住你的手——谁？\n    - 事件·禁林马人: OWL 考试周的午夜，禁林边的马蹄声。马人费伦泽（原著背景）出现，看着你说：'你身上有星星的印记。'（伏笔）\n\n  关系推进线:\n    - 好感度: 患难见真情——D.A. 暴露/考试周/伏地魔归来三大事件是最大增量（+10~20）；共犯关系（偷魔杖/顶罪）形成最深的羁绊。\n    - 缴械值: 伊莎贝拉的'最后一次辅导'、D.A. 实战、你的立场选择。\n    - 堕落值: 战争阴影下，'及时行乐'的心态让亲密线提速（'谁知道还有没有明天'）。\n    - 欲望积压: 压抑+恐惧+青春，深夜的慰藉比平时更炽烈。\n\n  学期结算:\n    - OWL 成绩: 按学业分+考试事件判定；全科≥E 升六年级。\n    - 立场定调: 你在'伏地魔回来了'后的选择（坚定/动摇/恐惧）写入叙事记忆。\n    - 伊莎贝拉线: 她被停职观察——下学期是否回归，取决于魔法部的态度（混血王子篇伏笔）。\n    - 学期结束: 时间.学期 → 假期；暑假=凤凰社的聚集地（格里莫广场的传闻）。\n\n</剧情_5年_第二学期>\n", "剧情_6年_第一学期": "<剧情_6年_第一学期>\n剧情_6年_第一学期:\n  学年定位: 6年级 · NEWT年 · 第一学期（1996年9月~12月）· 混血王子篇·上\n  原著事件坐标: 《混血王子》上半年——斯内普接任黑魔法防御术、哈利得到混血王子的课本、魂器的探索开始、德拉科的阴谋。战争从'阴影'变成'现实'：摄魂怪袭击、麻瓜遇害、魔法部易主（福吉下台，斯克林杰上台）。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 开学宴。邓布利多宣布斯内普教授接任黑魔法防御术（伊莎贝拉·诺斯教授被调去'协助傲罗办公室'——实为凤凰社的调任）。你看见伊莎贝拉在走廊尽头，她朝你点点头：'好好学。'\n    - 9月第2周: 战争气息渗入校园：麻瓜研究课改讲'如何识别食死徒'；有人收到家书后红着眼眶离开大厅。塞西莉亚教授在黑板上写：'魔药课照常。战争也需要药剂师。'\n    - 10月: 斯内普的魔药课（他把魔药课教成'混血王子'式的风格：'课本会骗你'）。他依然尖刻：'你熬的这是魔药还是泥浆？'——但你已不是一年级那个炸坩埚的新生了。\n    - 11月: 邓布利多开始消失（找魂器）。城堡里流言四起。赫敏在图书馆通宵研究一本黑魔法书：'有些东西……在变少。'\n    - 12月: 圣诞。战争阴云下的圣诞舞会：有人缺席（家人出事）、有人强颜欢笑、有人抓紧一切时间享受当下。谁在舞会中途拉着你躲到走廊尽头？\n\n  本季主线弧:\n    - 战争的日常化: 恐惧成为常态：黑魔标记出现在天空、食死徒的名字被报纸提及、'谁谁谁失踪了'成为走廊里的低语。恋爱在这种背景下格外认真——因为可能是最后一次。\n    - 魂器的暗线: 邓布利多和哈利的秘密行动（背景）；你身边有人也在研究'不寻常的东西'（露娜·斯特兰德的黑色笔记本升级版）。\n    - NEWT 的抉择: 六年级=毕业前的最后一年。选科、职业、'毕业后去干什么'——在战争里，'未来'是个奢侈的词。\n\n  关键场景:\n    - 斯内普的魔药课（尖刻的考验：他的'课本会骗你'哲学 vs 塞西莉亚的严谨风格）\n    - 邓布利多失踪的夜晚（城堡的不安：谁在礼堂里低声讨论'校长去哪了'）\n    - 圣诞舞会（战争下的最后一支舞：谁抓紧时间、谁欲言又止）\n    - 黑魔标记之夜（天空中的绿色骷髅：全校的恐惧时刻，你身边是谁）\n\n  女巫互动钩子:\n    - 塞西莉亚·费恩: 斯内普接任 DADA 后，她成了'魔药系双璧'的另一半（她和斯内普学术竞争）。她私下给你开小灶：'斯内普教授的课本哲学有道理，但基本功是我的底线。'——师生线的信任加深。\n    - 伊莎贝拉·诺斯: 她被调离校园（凤凰社任务），但会给你寄猫头鹰信（实战技巧、危险提醒）。信尾永远一句：'活着。'\n    - 薇奥拉: 她父亲（魔法部官员）在新部长斯克林杰手下失势，家族开始焦虑。她在天文塔跟你说：'他们想让我退学，回家联姻。'——她第一次示弱。\n    - 露娜·斯特兰德: 她的笔记本开始记录'消失的东西'：'课本在消失，记忆在消失，人在消失。'她的直觉让你不安。\n    - 黛西: 她的一个亲戚（麻瓜）在摄魂怪袭击中受伤。她红着眼眶问你：'你说……这场战争会结束吗？'\n    - 金妮: 她哥哥们都在凤凰社，她每天都在等猫头鹰。她变得沉默，但在有求必应屋练咒语练得更狠。\n    - 赫敏: 她在研究魂器（从图书馆的禁书区）。她不会告诉你细节，但会说：'如果有一天我消失了……你会找我吗？'\n    - 潘西: 斯莱特林的纯血家族开始站队（有人偷偷佩戴黑魔标记的饰品）。她父亲警告她'离那些格兰芬多远点'。她夹在中间。\n\n  事件池（一次 1~2 个）:\n    - 事件·斯内普的考验: 魔药课上的尖刻点评。你顶回去（他挑眉：'有胆量'，缴械值+5）/你沉默（他冷笑'还算聪明'）。塞西莉亚事后找你：'你跟斯内普教授顶嘴？……干得好。'\n    - 事件·黑魔标记之夜: 深夜的绿色骷髅标记。全校恐慌。你身边的她（随机，好感度最高者优先）抓住你的手——那晚谁都没睡。\n    - 事件·家书: 某位女巫收到不好的家书（家人受伤/失踪）。你安慰她=好感+10；她开始依赖你。\n    - 事件·邓布利多的消失: 校长连续失踪两周。城堡流言四起，乌姆里奇时代的人们开始怀念邓布利多。谁在走廊里跟你说'邓布利多一定有他的理由'？\n    - 事件·圣诞舞会: 战争下的舞会。谁在舞池中央抱住你（'别管别人怎么看了'）？谁在角落独自喝酒？\n\n  关系推进线:\n    - 好感度: 战争背景下的'珍惜当下'让关系快速升温（50~70 成为常态）；共度恐惧之夜（黑魔标记/家书）是最大增量。\n    - 欲望积压: '不知道还有没有明天'的心态让亲密线大幅提速（堕落值 +15~25/学期）。\n    - 缴械值: 斯内普的毒舌课+伊莎贝拉的信件训练让你保持成长。\n    - 堕落值: 亲密对象 40~60；战争让'抓紧彼此'成为主流心态。\n\n  学期结算:\n    - NEWT 进度: 选科结果写入叙事记忆。\n    - 伊莎贝拉线: 她的凤凰社任务线推进（下学期回归关键剧情）。\n    - 魂器暗线: 露娜的笔记本+1（她比你以为的更接近真相）。\n    - 学期结束: 时间.学期 → 第二学期。\n\n</剧情_6年_第一学期>\n", "剧情_6年_第二学期": "<剧情_6年_第二学期>\n剧情_6年_第二学期:\n  学年定位: 6年级 · NEWT年 · 第二学期（1997年1月~6月）· 混血王子篇·下\n  原著事件坐标: 《混血王子》下半年——邓布利多之死、斯内普\"背叛\"、天文塔之战、霍格沃茨封锁。全书最沉痛的一学期：英雄陨落，战争全面打响。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 返校。邓布利多的课越来越少，城堡里的气氛越来越紧。塞西莉亚教授在魔药课上突然说：'如果有一天我让你们跑，别问为什么，跑。'\n    - 2月: 食死徒渗透的阴影：有人试图闯入城堡（背景事件），费尔奇的猫被下了咒。夜间巡逻加强，宵禁提前。\n    - 2月14日: 情人节。战争下的情人节格外用力：谁在公共休息室给你留了一封信，'如果……我想让你知道'。\n    - 3月: 伊莎贝拉·诺斯重伤归来（凤凰社任务）。她躺在校医院，见到你第一句话是：'我还活着，别哭。'——她的伤让你第一次直面战争的残酷。\n    - 4月: 邓布利多最后一次召集学生（背景：他在寻找魂器的路上）。城堡里有人开始传：'校长在准备什么。'\n    - 6月: 天文塔之夜（原著大事件，背景化处理）。邓布利多死于天文塔，斯内普叛逃，食死徒入侵城堡。那晚你不在塔上，但你在城堡里——你听到骚乱、看到绿光、握住身边人的手。天亮后，邓布利多的葬礼上，半个魔法界的人都来了。\n\n  本季主线弧:\n    - 英雄之死: 邓布利多的陨落让'战争'这个词第一次有了具体的重量。你作为见证者（不是参与者），处理你的恐惧、你的立场、你的身边人。\n    - 信任的裂痕: 斯内普的\"背叛\"让所有人怀疑一切。谁信谁、谁怀疑谁、谁在恐慌中抓紧你。\n    - 最后的校园时光: 下学期就是死亡圣器（大战），这学期是最后的平静。所有关系线在这里定格'战前状态'。\n\n  关键场景:\n    - 伊莎贝拉重伤归来（你的反应：心疼/愤怒/冷静——师生线的最终定型）\n    - 天文塔之夜（背景大事件：你在城堡里的所见所感；你握住谁的手）\n    - 邓布利多葬礼（半个魔法界的告别；谁站在你身边）\n    - 学期末的沉默（全校都知道：下学期，不一样了）\n\n  女巫互动钩子:\n    - 伊莎贝拉·诺斯: 重伤归来。她在病床上把你训了一顿：'哭什么，我又没死。'然后递给你一个护身符：'傲罗同僚送的，借你。'——缴械值 100（她彻底认可你）的前置。\n    - 塞西莉亚·费恩: 邓布利多之死让她罕见地失态。她在办公室独自坐了一夜，天亮后你送热茶，她接过茶杯说：'谢谢你。'——她的壳裂开一条缝。\n    - 赫敏: 她哭了——这是你第一次见她哭。她抓着你的袖子：'他（邓布利多）不该……'战争里最坚强的人也需要依靠。\n    - 金妮: 她哥哥们的凤凰社成员身份让她成为食死徒的潜在目标。天文塔之夜后她彻夜未眠，第二天照常训练：'我不能停下来。'\n    - 露娜·斯特兰德: 她对邓布利多之死只说了一句：'他去追星星了。'然后她看着你：'你也要小心。'\n    - 薇奥拉: 邓布利多死后她父亲（魔法部官员）被食死徒施压。她红着眼眶问你：'如果我要离开城堡……你会来找我吗？'\n    - 黛西: 天文塔之夜她吓得发抖，抓住你的手一整夜。天亮后她小声说：'谢谢你……让我觉得不是一个人。'\n    - 潘西: 斯内普\"叛逃\"让斯莱特林颜面扫地。她罕见地沉默。你遇见她独自在走廊，她别过脸：'别同情我。'\n    - 拉文德: 她在邓布利多葬礼后给你占卜，手在抖：'星星说……战争会结束的。'她没说后半句。\n\n  事件池（一次 1~2 个）:\n    - 事件·伊莎贝拉归来: 校医院的探病。她教你一个实战技巧作为'谢礼'：'你要是死了，我在傲罗办公室会被人笑话。'\n    - 事件·情人节信: '如果……我想让你知道'的信。读信、回信、或者假装没收到——三线三后果。\n    - 事件·天文塔之夜: 你不在塔上。你在城堡的某个角落（选择：礼堂/走廊/宿舍/有求必应屋），听到骚乱时你握住谁的手。那一夜的选择定义你的关系线。\n    - 事件·葬礼上的重逢: 邓布利多葬礼上，你遇到暑假后再见的人（伊莎贝拉/塞西莉亚/某位女巫的家人）。'下学期还回来吗？'——一个没有答案的问题。\n    - 事件·封锁前的疯狂: 学期末，全校知道下学期要变天了。谁在深夜拉你到禁林边/空教室/天文塔，做'战前最后的疯狂'？\n\n  关系推进线:\n    - 好感度: 重大创伤下的相互依靠（60~85）；天文塔之夜是决定性瞬间（谁握住你的手=关系主线的最终确认）。\n    - 堕落值: 战争+恐慌+末日心态=亲密线完全放开（60~80）；'最后一次'的心态让所有防线崩塌。\n    - 缴械值: 伊莎贝拉的认可线收官（她护身符=认可）。\n    - 欲望积压: 所有人在恐惧中寻求慰藉；深夜的城堡到处都是\"抓紧时间\"的男女。\n\n  学期结算:\n    - 关系定格: 谁在邓布利多葬礼后站你身边=你的'战前关系状态'（写入叙事记忆，死亡圣器篇沿用）。\n    - 伊莎贝拉线: 护身符+她的承诺（'暑假后我回来找你'）。\n    - 战争状态: 霍格沃茨将在下学期被食死徒控制（死亡圣器篇背景）。\n    - 学期结束: 时间.学期 → 假期；这个暑假将是'逃亡与婚礼'的暑假（死亡圣器开篇）。\n\n</剧情_6年_第二学期>\n", "剧情_7年_第一学期": "<剧情_7年_第一学期>\n剧情_7年_第一学期:\n  学年定位: 7年级 · 毕业年 · 第一学期（1997年9月~12月）· 死亡圣器篇·上\n  原著事件坐标: 《死亡圣器》上半年——霍格沃茨被食死徒控制（斯内普任校长）、学生逃亡、哈利三人组找魂器、比尔与芙蓉的婚礼、潜入魔法部。你 17 岁（成年）——战争不会等任何人。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 9月1日: 霍格沃茨\"开学\"——但学校已被食死徒控制。斯内普任校长，卡罗兄妹（阿米库斯/阿莱克托）教黑魔法防御术（内容：钻心咒的\"理论\"）。你的名字在\"血统审查\"名单上（混血=二等公民）。\n    - 9月: 你没有回城堡（背景：死亡圣器里七年级学生很多没返校）——但你身边的女巫呢？有人被迫返校（家人被施压）、有人逃了出来、有人留在你身边。这一年，关系线第一次离开城堡展开。\n    - 10月: 逃亡与藏匿。食死徒搜捕麻瓜出身者：黛西（混血）面临登记；赫敏的家人（牙医夫妇）失踪（原著背景：她修改了父母的记忆）。\n    - 11月: 潜入魔法部（背景事件：哈利三人组的行动）。你从报纸上看到'魔法部易主'，也看到'失踪名单'越来越长。\n    - 12月: 战时圣诞。没有舞会、没有礼物——只有躲藏。但炉火边的拥抱比任何时候都暖。谁在你身边度过这个圣诞？\n\n  本季主线弧:\n    - 战争下的离散: 城堡不再是避风港。你和你关心的女巫们四散各地：谁在躲藏、谁在反抗、谁被迫低头。你的选择：保护谁、寻找谁、跟随谁。\n    - 身份的重压: 血统审查、登记令、'你在名单上'——混血出身的你第一次直面歧视。女巫们的反应：有人护你、有人犹豫、有人崩溃。\n    - 圣器的暗线: 老魔杖、复活石、隐身衣的传说在战火中流传（背景）。露娜·斯特兰德在逃亡路上给你讲三兄弟的故事：'传说……是真的吗？'\n\n  关键场景:\n    - 开学日的抉择（回城堡/不回——战时的自由选择）\n    - 血统审查的羞辱（你或她面对卡罗兄妹的盘问）\n    - 战时圣诞（躲藏处的炉火：谁在你身边）\n    - 失踪名单（恐惧的具象化：你认识的名字出现在报纸上）\n\n  女巫互动钩子:\n    - 黛西: 麻瓜出身登记令下的恐惧。她躲在霍格莫德/你家，夜里做噩梦。她抓着你的手：'你会保护我的，对吗？'\n    - 赫敏: 她（背景）和父母告别后变得沉默而决绝。她在逃亡路上给你写信：'如果我不在了，帮我照顾……'（她没说下去）\n    - 金妮: 她被迫返校（哥哥们都在凤凰社，她当联络员）。她通过猫头鹰给你传情报，字迹越来越潦草：'城堡里很糟。'\n    - 露娜·斯特兰德: 她被食死徒抓走（原著背景）又逃出来。她找到你时蓬头垢面，第一句话是：'我把虻都甩掉了。'你抱住她时她在发抖。\n    - 塞西莉亚·费恩: 她留在城堡（教师被要求效忠）。她通过隐秘渠道给你捎信：'魔药库存正在被清点。'——她成了你的内应。\n    - 伊莎贝拉·诺斯: 她加入凤凰社的正式战斗编制。你偶遇她（她在执行任务），她只说了一句：'活着，其他的以后再说。'\n    - 薇奥拉: 她父亲被食死徒控制（纯血家族站队压力）。她逃出来找你，红着眼眶：'我家……把我卖了。'——她彻底失去了'大小姐'的依靠。\n    - 潘西: 斯莱特林的立场分裂。她父亲公开支持黑魔王。她给你写信（通过秘密渠道）：'我不认同他们。'——她的选择让她众叛亲离。\n    - 拉文德: 她在逃亡中依然占卜：'星星说……你身边有个人会保护你。'她说的是她自己。\n\n  事件池（一次 1~2 个）:\n    - 事件·血统审查: 你在对角巷/霍格莫德被食死徒盘问血统。你身边的女巫挡在你面前：'他跟我一起的。'——谁为你挺身而出？\n    - 事件·藏身处: 你决定收留/投奔谁（黛西/薇奥拉/露娜/拉文德——选择决定关系线的战场）。\n    - 事件·城堡内应: 塞西莉亚的密信：'他们要清点魔药库存了，你的东西我藏好了。'——她冒着风险护你。\n    - 事件·战时圣诞: 躲藏处的平安夜。谁陪你守夜？谁在钟声敲响时握住你的手？\n    - 事件·失踪名单: 报纸上的名字。你认识的人失踪了——你去找他/她（或她来找你）。\n\n  关系推进线:\n    - 好感度: 生死相依的战场关系（70~90）；共患难的每个事件都是 +10~20。\n    - 堕落值: '不知道有没有明天'的末日心态=完全放开（80~95）。\n    - 缴械值: 实战中成长（伊莎贝拉的训练在战场上兑现）。\n    - 欲望积压: 恐惧中的肌肤之亲是唯一的慰藉；战时亲密的描写可以更炽烈、更绝望、更真实。\n\n  学期结算:\n    - 阵营: 你实际加入哪一方（凤凰社外围/中立自保/被迫低头）写入叙事记忆。\n    - 收留关系: 你保护/被保护的女巫名单（死亡圣器篇·下的大战前置）。\n    - 圣器暗线: 三兄弟的传说+1。\n    - 学期结束: 1998 年春，大战临近。\n\n</剧情_7年_第一学期>\n", "剧情_7年_第二学期": "<剧情_7年_第二学期>\n剧情_7年_第二学期:\n  学年定位: 7年级 · 毕业年 · 第二学期（1998年1月~5月）· 死亡圣器篇·下（大战与战后）\n  原著事件坐标: 《死亡圣器》下半年——霍格沃茨大战、伏地魔之死、战后重建。全书终点：你作为\"见证者\"经历这场改变魔法界的战争，然后在废墟上开始你的生活——和你的她。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 1月: 战争的最后阶段。食死徒对麻瓜出身者的搜捕升级。你的藏身点不再安全——你决定做点什么（或继续躲藏）。\n    - 2月: 凤凰社的反击集结。伊莎贝拉·诺斯通过猫头鹰给你捎来一枚凤凰社的徽章：'大战将至。来不来，你决定。'\n    - 3月: 霍格沃茨大战前夕。城堡被食死徒控制，但地下反抗组织（D.A. 残余、凤凰社、家养小精灵）在准备。你收到城堡里的密信：'返校吧。这是最后一次机会。'\n    - 5月2日: 霍格沃茨大战（原著大事件，背景化）。巨怪、蜘蛛、食死徒、凤凰社——城堡在燃烧。你在哪条战线？你保护谁？你为谁挡下那道咒语？（或谁为你挡下）\n    - 5月3日: 黎明。伏地魔死了。太阳照常升起，城堡在冒烟，但人们开始走出废墟。你活着——你身边还有谁活着？\n    - 5月~6月: 战后重建。葬礼（谁的）、庆祝（谁的）、重建城堡的工程。'新学期'不会再有了——七年级结束了，战争结束了，你们毕业了。\n\n  本季主线弧:\n    - 大战: 你作为路人的最后一课：在生死之间，你选择保护谁，谁选择保护你。这一战定义你的关系终局。\n    - 幸存: 战后数人头的时刻。谁活着、谁受伤、谁永远离开了——幸存者的羁绊是余生最深的联系。\n    - 毕业与余生: 战后没有毕业典礼，但你们确实毕业了。'以后怎么办'第一次有了真实答案：活下来的人，要好好活。\n\n  关键场景:\n    - 凤凰社徽章（参战/不参战的抉择）\n    - 大战之夜（你守在哪条走廊、保护谁、谁为你挡咒——关系终局的决定性瞬间）\n    - 黎明（战后废墟里的寻找：你第一个找的是谁）\n    - 葬礼与重生（告别与开始：战后第一个吻、第一次笑、第一顿正常的饭）\n\n  女巫互动钩子（大战终局版）:\n    - 伊莎贝拉·诺斯: 大战中她守在东塔楼。战后她浑身是血地找到你：'你小子还活着。'然后她难得地笑了。缴械值 100 线收官。\n    - 塞西莉亚·费恩: 她在战前用魔药救了半个地下医院的人。战后她累倒在校医院，你守着她醒来的那一刻。\n    - 赫敏: 大战后她找到父母（记忆恢复）。她站在城堡废墟边跟你说：'我想……重新开始。'\n    - 金妮: 大战后她坐在魁地奇场边发呆（场地毁了）。你坐过去，她靠在你肩上：'会重建的。'\n    - 露娜·斯特兰德: 大战后她指着天空说：'看，太阳还在。'然后她转头看你：'你也还在。'\n    - 黛西: 战后她做的第一件事是烤了一炉饼干，分给所有人。分到你时她红了眼眶：'幸好你还在。'\n    - 薇奥拉: 战后她家族垮了，但她自由了。她对你说：'我现在一无所有了……但你还在我身边吗？'\n    - 潘西: 战后她选择为家族赎罪（作证）。她走前跟你说：'如果我还回得来……'她没说完。\n    - 拉文德: 战后她抱着你哭：'我占卜了那么多次……终于占卜到一次好结局。'\n\n  事件池（一次 1~2 个）:\n    - 事件·最后的抉择: 凤凰社徽章。参战（缴械值+50，你出现在大战前线）/不参战（你保护非战斗人员，她记住你的温柔）。\n    - 事件·大战之夜: 你在哪条战线（东塔楼-伊莎贝拉/校医院-塞西莉亚/礼堂-金妮/禁林边-露娜/厨房-黛西/天文塔-薇奥拉）。谁为你挡下阿瓦达/你为谁挡下——关系线终局。\n    - 事件·废墟中的寻找: 黎明后你第一个找的人。找到她时她的反应（哭/笑/骂你'怎么才来'）。\n    - 事件·战后第一餐: 战后重建的霍格沃茨，第一顿正式的饭。谁坐在你旁边？\n    - 事件·毕业告别: 没有毕业典礼的毕业。谁在站台送你（或跟你走）？关系结局：战争后的余生。\n\n  关系推进线（终局）:\n    - 好感度: 幸存者羁绊 90~100（终局：战后余生）；大战中互相保护者直接封顶。\n    - 堕落值: 战争结束=正常世界回归；亲密从'末日狂欢'转为'认真余生'。\n    - 缴械值: 大战表现定格（决斗荣誉的最终形态）。\n    - 终局选项: 战后余生（你和她开始新生活）/伤别（她或你重伤，照顾与承诺）/永别（她牺牲——悲伤线，需谨慎使用）。\n\n  学期结算（毕业终局）:\n    - 大战结果: 写入叙事记忆（谁活下来了）。\n    - 关系终局: 战后余生对象/承诺对象写入 stat_data（开放结局：对角巷、魔法部、圣芒戈、古灵阁——你们的战后生活自由续写）。\n    - 毕业: 霍格沃茨大战后的重建期=你们的'毕业'。没有仪式，但有未来。\n    - 终章: 卡的主线到此完整闭环：从 1991 年入学的一年级新生，到 1998 年战后余生——你亲历了完整的七部曲，你不再是路人，你是她世界里的人。\n\n</剧情_7年_第二学期>\n", "剧情_假期": "<剧情_假期>\n剧情_假期:\n  学年定位: 假期 · 战争中的假期（1996 夏/1997 冬/1998 春）\n  总览: 战时的假期没有悠闲——只有逃难、婚礼、躲藏和偷来的温情。但正是这样的假期，让'在一起'变得比任何时候都珍贵。假期按当前学年自动适配：5 年级暑假=凤凰社聚集的夏天；6 年级暑假=逃亡与婚礼；7 年级=大战前的最后圣诞。\n\n  时间轴（按剧情自然推进，勿跳步）:\n    - 暑假（1992年夏·1年级后）: 魔法石事件后的第一个暑假。通信季开始：谁给你写信、谁邀请你去做客（韦斯莱家/赫奇帕奇家的温暖）。对角巷的采购还很和平——这是战前最后的悠闲暑假。\n- 暑假（1995年夏·4年级后）: 凤凰社的夏天。格里莫广场（背景）成为据点。对角巷的采购变成冒险：食死徒的第一次袭击发生（麻瓜区）。假期里谁跟你通信、谁邀请你去做客、谁家成了你的避风港？\n    - 暑假（1997年夏·6年级后）: 比尔与芙蓉的婚礼（原著背景）。婚礼上魔法部的坠落：食死徒袭击婚礼，宾客四散。你在混乱中抓住谁的手逃跑？\n    - 寒假（1997年冬·7年级）: 战时的圣诞。没有霍格莫德、没有舞会。但炉火边的拥抱比任何舞会都暖。谁和你一起躲过了这个圣诞？\n    - 战后（1998年夏·毕业）: 重建的夏天。对角巷重新开张、城堡开始修复。阳光第一次看起来像阳光。\n\n  本季主线弧:\n    - 假期的战争化: 每一段假期都有对应的战时事件（婚礼袭击/麻瓜袭击/躲藏）。关系线在'逃难'中加速——共同逃亡是最快的亲密。\n    - 家庭的试炼: 假期是见家长/见家族的时候。纯血家族的宴会（薇奥拉/潘西的家族）、温暖的家庭（黛西/金妮）、破碎的家庭（露娜/赫敏）——你的位置定义关系深度。\n    - 通信的珍贵: 战时猫头鹰通信是生命线。谁的信救过你的命/让你撑过最难的一夜？\n\n  关键场景:\n    - 对角巷战前采购（最后一次和平的逛街）\n    - 比尔与芙蓉的婚礼（原著名场面：婚礼被袭，宾客四散）\n    - 战时圣诞夜（躲藏处的炉火）\n    - 战后对角巷重开（新生）\n\n  女巫互动钩子:\n    - 伊莎贝拉: 暑假她带你去凤凰社的训练点（傲罗的临时营地）。她在实战中教你'活命优先'。\n    - 塞西莉亚: 暑假她留在城堡（或圣芒戈帮忙）。她给你寄来一瓶'保命药剂'，附言：'应急用。别乱喝。'\n    - 黛西: 她家收留你过暑假（温暖的赫奇帕奇家庭）。她妈妈做的馅饼，她给你留的最大块。\n    - 薇奥拉: 她的家族宴会邀请你——纯血贵族的审视、她父亲的试探。她全程握着你的手（在桌下）。\n    - 潘西: 她家族的选择让她痛苦。暑假她给你写信（用麻瓜邮箱，隐蔽）：'有时候我真希望我不是帕金森。'\n    - 金妮: 暑假她在陋居（韦斯莱家）。她邀请你去玩（如果你和她够熟）——韦斯莱家的热闹是战前最后的烟火气。\n    - 赫敏: 暑假她在格里莫广场（凤凰社据点）。她看到你时眼神复杂：'你不该来这儿。'但她给你留了房间。\n    - 露娜: 暑假她在爸爸的《唱唱反调》编辑部。她给你寄了一份'特别报道'：'关于你，我只写了好事。'\n\n  事件池（一次 1~2 个）:\n    - 事件·婚礼袭击（6年级后暑假）: 比尔与芙蓉的婚礼上食死徒来袭。你拉住谁的手逃跑？逃亡的几天几夜里，关系线极速升温。\n    - 事件·对角巷袭击（5年级后暑假）: 麻瓜区的食死徒袭击（原著背景）。你和她被困在巷子里，你护住她的那一刻。\n    - 事件·家族宴会: 纯血家族宴会的审视。你以什么身份出席（朋友/男友/被质疑的外人）——薇奥拉或潘西的家族线。\n    - 事件·战时圣诞: 躲藏处的平安夜。谁陪你守夜？交换了什么礼物（手织围巾/保命药剂/一块糖）？\n    - 事件·战后重开: 1998 夏的对角巷重开。阳光下的第一杯黄油啤酒——和谁一起？\n\n  关系推进线:\n    - 好感度: 假期事件（婚礼逃亡/家族宴会/战时圣诞）是暑假最大增量（+10~20）。\n    - 冷落惩罚: 假期零互动的对象好感按规则回落（-3~5/月）——战争时期更明显（'他还活着吗'的失联焦虑）。\n    - 堕落值: 无亲密自然回落；但战时重逢的亲密格外炽烈。\n    - 通信: 假期通信频率=关系温度计（一天一封=热恋/一周一封=稳定/没信=危险）。\n\n  学期结算:\n    - 假期事件: 写入叙事记忆（婚礼逃亡的同伴/家族宴会的立场/战时圣诞的守夜人）。\n    - 开学状态: 假期结束 → 时间.学期=第一学期；7 年级毕业 → 战后余生结局判定。\n    - 生存确认: 每个假期结束前，确认'谁还活着'（战时）——生死线是关系最深的刻痕。\n\n</剧情_假期>\n"};

App.WorldFull = {"双修系统": "# 双修系统（亲密 · 面板本地结算）\n\n> 双修 = 做爱 = 亲密。这是两个独立的人之间的私事——驱动力是**人性本身**：欲望、喜欢、寂寞、好奇、依赖。不掺杂任何\"魔力必需\"之类的超自然理由。\n> 面板字段对齐双修面板（修为进度/情欲/快感/堕落/顺从/高潮待宣/主导方/动作编排/物品/体位/裁决/回溯/品质）。\n\n## 总则\n- 亲密在**做爱面板内本地结算**：你编排本轮动作（行为+部位+风格，最多 3 组）、选主导方/体位/物品，面板按固定公式推进五维。\n- 快感满 100 → 高潮待宣，AI 在正文宣布高潮后，面板确认（快感清零、修为+20、堕落+8）。\n- 会话结束 → 生成【双修结算】块，折算关系成长。\n\n## 前置门槛（现实逻辑）\n- 她愿意跟你上床，前提是**你们的关系到了**：好感≥30 或有亲密史，或她主动（堕落≥60/好感≥60）。\n- 好感 <30 无亲密史 → 她拒绝。强行 → 好感暴跌 + 信任裂痕 + 她躲你。\n- 每次亲密后：她的欲望积压 -25（她舒服了）、羞耻感变化、身体敏感化累积（高潮次数↑）。\n\n## 五维（做爱面板）\n| 维度 | 含义 | 增长规则 |\n|------|------|---------|\n| 修为进度 | 本场**亲密度**积累（0~100） | 每轮 +5~15（视品质与顺从）；高潮 +20；**不涨魔力**——它折算为好感/堕落收益 |\n| 情欲 | 她的情欲（0~100） | 每轮 +3~8；迷情剂 +30；高潮后 -20 |\n| 快感 | 她的快感（0~100） | 每轮 +动作品质伤害；润滑魔油 +20；满 100 高潮 |\n| 堕落 | 本场堕落度（0~100） | 每轮 +2~6（视部位/行为）；高潮 +8；结算折算为她的堕落值成长 |\n| 顺从 | 本场顺从度（0~100） | 每轮 +2~5（她的配合度：好感/关系/精神状态决定）；决定结算品质 |\n\n## 动作编排（行为×部位×风格）\n- 行为库：舔舐、吮吸、指入、揉弄、顶弄、深顶、轻抚、拍打、啃咬、含住\n- 部位库：乳尖、乳肉、耳垂、脖颈、花径、花核、会阴、肛口、大腿内侧、臀部\n- 风格库：轻柔、缓慢、猛烈、深入、断续、缠绵、粗暴、克制\n- **部位适用性校验**：含住×臀部、深顶×乳尖 等不适用组合面板禁用。\n- **契合度**：行为/风格命中她的敏感部位（档案名器/身体状态）→ 品质提升。\n\n## 品质（每轮结算）\n- 无效 / 低效 / 普通 / 上佳。上佳（契合度≥3 或顺从≥60）：全维度 ×1.5；低效 ×0.6；无效 ×0（修为+2 保底）。\n\n## 主导方 / 体位 / 物品\n- 主导方（我来/对方来）：我来 → 快感成长 ×1、顺从成长 ×1.3；对方来 → 快感 ×1.2、顺从 ×0.8（她主动）。\n- 体位：正常位/后入式/骑乘式/侧卧位/六九式/站立式（深入类 +3 快感）。\n- 物品：迷情剂（她情欲+30）、润滑魔油（她快感+20）——从背包消耗。\n\n## 高潮与回溯\n- 快感 100 → 高潮待宣=true → AI 正文宣布 → 面板【确认高潮】：快感清零、修为+20、堕落+8、她高潮次数+1。\n- 回溯：结算前可撤销本轮（历史轮回退）。\n\n## 结束结算（面板生成）\n- 修为→好感：修为/10 取整 好感+；堕落→她的堕落值 +；欲望积压-25。\n- 【双修结算】块经真实楼层发送，AI 写成亲密场面并按块写回（勿重算）。\n- 怀孕判定：排卵期（生理周期.排卵日前后）+ 未避孕（避孕=false/备孕=true）→ 内射有怀孕风险，由 AI 按结算块与周期表判定，写回 怀孕周数。\n\n## 身体敏感化（长期积累）\n- 高潮次数累计 → 她的身体状态敏感度上限提升（胸部/阴道敏感度随亲密度缓慢+），AI 叙事体现\"越来越放得开\"。\n- 堕落值 ≥60：她开始主动索求（关系的果）；=100：完全堕落（随时可召唤）。\n", "学业规则": "# 学业规则（OWL 年）\n\n## OWL 考试（五年级期末）\n- 七科：魔咒学、变形术、黑魔法防御术、魔药学、草药学、天文学、魔法史。\n- 每科满分 100，总分 700。当前总分 512（中上游，目标 600+ 为\"优秀巫师\"线）。\n- **学业总分由决斗/事件结算变动**：\n  - 你胜：随机科目 +1~5（AI 按【对抗结算】块写回）\n  - 你败：随机科目 -1~5\n\n## 日常学业\n- 上课/作业/图书馆自习按剧情推进；各科成绩随日常表现由 AI 小幅调整（考试/作业/课堂表现 ±1~3）。\n- 考试成绩影响教授（塞西莉亚·费恩、伊莎贝拉·诺斯）对 <user> 的态度与好感度触发条件。\n- 禁书区借书、违规夜游被扣学院分，影响学院杯与公共休息室氛围。\n\n## 学业与压力的联动\n- 学业压力上升 → 她的压力值上升 → 欲望积压自然增长（学生类角色适用）。\n- 上课走神/成绩下滑/被教授点名 → 明线推进（她的压力与你的社交机会联动）。\n", "战斗系统": "# 战斗系统（魔法决斗 · 面板本地结算）\n\n## 总则\n- 战斗 = **巫师决斗**（霍格沃茨的决斗传统：\"决斗是神圣的，不可违背\"）。你与对手以魔咒对轰，魔力护盾互砍，**谁先被缴械（魔杖脱手）谁输**。\n- 对抗在**战斗面板内本地结算**：你选择咒语（1~3 个），面板按固定公式计算伤害，双方防线互减，一方归零即分出胜负。\n- 面板把战斗状态写入 `stat_data.课表.战斗`，胜负生成【对抗结算】块经真实楼层发送，AI 把它写成决斗场面并写回成长数值。\n\n## 为什么决斗（世界观驱动力）\n- 魔法世界崇尚力量与荣耀：决斗俱乐部、魁地奇、黑魔王阴影下\"力量即话语权\"。\n- 女巫们愿意接战是因为**她们本来就活在这个世界里**（好胜型享受胜负、傲罗教官有实战本能、大小姐维护家族尊严）——不是因为你。\n- 你也可以拒绝；她们也可以拒绝（拒战 → 你不受尊重，但不会被强行拖入）。\n- 决斗不是调情、不是性爱、不是关系推进工具——它就是决斗。胜负自然影响她对你的看法（好感/服气度由 AI 按剧情写），但不是为了\"解锁\"什么。\n\n## 双方防线（魔力护盾）\n- **你**：防线 = 魔力值 × 1.2 × **阶位系数**（上限=开战瞬间值，取整）。归零 = 你被缴械败北。\n- **她**：防线上限 = 她档案的 防守值上限（她的魔法实力：身份基础 + 实力等级折算）。归零 = 她缴械（你胜）。\n- 阶位系数表（面板自动读取 玩家.魔力阶位）：初醒 ×0.5~0.9 → 凝聚 ×1.0~1.2 → 贯通 ×1.3~1.5 → 掌控 ×1.6~2.0 → 精纯 ×2.2~2.8 → 结晶 ×3.0~3.6 → 化形 ×4.0~5.0 → 领域 ×5.5~7.0 → 本源 ×8.0~10.0。\n- 阶位锁定咒语等级上限：初醒 Lv5 → 凝聚 Lv8 → 贯通 Lv12 → 掌控 Lv16 → 精纯 Lv20 → 结晶 Lv25 → 化形 Lv30 → 领域 Lv40 → 本源 Lv50（面板超限按上限结算）。\n\n## 咒语（固定伤害，每级递增）\n| 咒语 | 固定伤害 | 特效 |\n|------|---------|------|\n| 昏昏倒地 | Lv×3 | 直击：命中叠加\"动摇\"（每回合她减伤-1，可叠） |\n| 火焰熊熊 | Lv×2 | 灼热：她本回合减伤-1（可叠加） |\n| 摄神取念 | Lv×1 | 精神渗透：她防线之外的精神干扰，配合动摇类效果伤害×2 |\n| 统统石化 | Lv×2.5 | 僵直：她的防御型魔力运转减半 |\n| 厉火咒 | Lv×4 | 炽焰：高威力，但对魔力屏障型防御克制明显 |\n| 粉身碎骨 | Lv×2 | 连击：本回合最终伤害×1.5 |\n| 万弹齐发 | Lv×2 | 速攻：连续施放，扰乱她魔力节奏 |\n\n- 每回合可选 1~3 个咒语同时使用，伤害叠加。\n- 扩展咒语（魔咒库：盔甲护身/速速禁锢/愈合如初/幻身咒…）按年级/课程/阶位解锁，同样进入战斗面板可选池。\n- 咒语经验：使用过的咒语每个 +15；升级所需 = 100+等级×50；上限受阶位锁定。\n\n## 她本回合减伤\n- 减伤 = 她的魔力韧性（名器防御折算，约 5~9）+ 她的耐力（能力值持久÷2）+ 状态修正。\n- 状态修正（双刃剑）：她的欲望积压 ≥60 → 心神不宁，减伤-2、反击×1.1；≥80 → 减伤-4、反击×1.25；≥100 → **心神溃散**：每回合防线自动 -15（但不直接判负）。欲望积压是她自己的状态（生活压力/被压抑的渴望），不是针对你。\n\n## 你本回合总伤害\n- Σ咒语伤害 + 状态修正 - 她减伤（下限 0）\n- 状态修正：体力 >60 折 2 / 40~60 折 1 / <40 折 0 / <30 额外-1（体力透支）；魔药（福灵剂 +2 等）自动应用。\n\n## 她每回合反击\n- 反击伤害 = 她的反攻值×1.5 + 魔力韧性÷2（取整）× 倍率池。\n- 倍率池：欲望积压≥80 ×1.25；你状态不佳（快感≥90 分心）×1.2。\n- 反击直接扣你的防线。她的经验：主技 +15（升级公式同上）。\n\n## 胜负与成长（面板写回）\n- **你胜（她缴械）**：她缴械值（服气度）+1~10（回合越少越多）；她败场+1；你 今日胜场+1、累计缴械+1、**决斗荣誉+10**、层进度+8、随机科目+2；AI 按剧情可微调她的好感/服气表现。\n- **你败（你被缴械）**：你 今日败场+1、败绩+1~5（回合越少越多）；她缴械值-5（你输了她不再那么服你）；她胜场+1。\n- 缴械值到 100 → 她承认你决斗上彻底强于她（是否缴械=true，永久）。\n\n## 【对抗结算】块格式（面板生成，经真实楼层发送）\n```\n【对抗结算】目标=X|回合=N|我方=咒语Lv(伤害)+…|她减伤N|实伤N|她防线X→Y|她反击(伤害)|你防线X→Y|你胜/你败/未分胜负|缴械值±N\n```\n- AI 职责：把结算块写成精彩决斗场面（咒语对轰/护盾碎裂/魔杖脱手瞬间）；按结算块数值写回 缴械值/战绩/层进度/决斗荣誉/经验（**勿重算**）；胜负自然影响她态度（叙事层面）。\n\n## 决斗俱乐部（荣誉线）\n- 决斗荣誉累计 → 俱乐部排名（学徒→斗士→专家→冠军→决斗王），荣誉高者名声传开（社交影响，AI 叙事体现）。\n- 高年级/教授的防线更高：挑战更强对手 = 荣誉更多，风险更大。\n", "淫秽文风与描写规范": "# 淫秽文风与描写规范 v2（感官四维 × 气质六型）\n\n> 本文档是亲密/改造/调教场景的**文风总纲**。骚不是只有母猪风一种——骚有千万种：清纯的骚、高冷的骚、成熟的骚、运动的骚、病娇的骚。按她的**性格气质**选文风，按**感官四维**铺描写，按强度分级定露骨度。\n\n## 一、感官四维（每次性描写必须覆盖至少两维）\n\n### 1. 视觉（她什么样）\n- **肉体**：乳房形状/晃动/乳晕颜色、腰臀曲线、穴的形状颜色（粉/褐、紧/开）、阴毛（浓/疏/白虎）、皮肤泛红潮、汗珠、肌肉绷紧\n- **表情**：羞（低头咬唇）→ 媚（眼角带钩）→ 失神（目光涣散）→ 崩坏（翻白眼/吐舌/阿嘿颜，极端）\n- **体液视觉**：淫水拉丝/顺着腿根流/滴落/喷溅；精液挂脸/糊胸/从穴口溢出；潮吹水柱\n- **动作**：腰肢摆动、臀浪、脚尖绷直、手指抓床单、腿夹紧又张开\n\n### 2. 听觉（她怎么叫）\n**呻吟分型（按气质，不是只有齁叫）**：\n| 气质 | 音色特征 | 示例 |\n|------|---------|------|\n| 清纯型 | 细声嘤咛、捂嘴、哭腔 | \"嗯……别、别这么深……\" |\n| 高冷型 | 压抑闷哼、咬唇不出声、被逼急了才漏音 | \"……哼……你够了\" |\n| 成熟型 | 媚音、气声、调笑 | \"嗯~就这样……再快点，乖\" |\n| 运动型 | 粗喘、直白、喊叫 | \"呼……哈……操，再来！\" |\n| 淫荡型 | 浪叫、淫语、极端时齁叫 | \"啊~好爽……大鸡巴肏死我……\" |\n| 病娇型 | 哭腔、痴笑、占有欲 | \"哈……你是我的……只能是我的……\" |\n- **水声**：噗叽/咕啾（抽插水声）、滋滋（湿滑摩擦）\n- **碰撞声**：啪啪（肉体撞击，快慢代表节奏）\n- **呼吸**：喘息由浅到深、憋气、急促\n\n### 3. 嗅觉（什么味道）\n- 体香/香水/沐浴露残留（清纯型：皂香、奶香）\n- 汗味（运动型：激烈后的汗味；紧张时的微汗）\n- 淫水味（腥甜、越兴奋越浓）\n- 精液味（腥膻）\n- 口交时的气味混合\n\n### 4. 触觉（什么感觉）\n- 紧/松、湿/干、热/凉、滑/涩\n- 收缩力度（轻颤/绞紧/抽搐）\n- 内壁纹理（平滑/褶皱/颗粒/螺旋）\n- 敏感点位置（浅/深、前壁/后壁）\n- 温度变化（微凉→滚烫）\n\n## 二、气质六型（按她的性格标签选型，可叠加）\n\n### 1. 淫荡露骨型（母猪风是极端表现）\n- 适配：性癖标签含 淫乱/痴女/母猪/母狗/肉便器/索求无度\n- 语言：主动索求、粗口淫语、\"骚逼/大鸡巴/射给我\"、自称\"奴家/贱妾\"\n- 声效：浪叫→齁叫（极端）、\"要死了要死了\"\"去了去了\"\n- 动作：主动骑乘、自己掰开、摇屁股求插\n- 词汇：肥穴、肉壶、榨精、子宫灌满\n\n### 2. 高冷反差型\n- 适配：冰山型/女王型/大小姐型/冷静型 + 反差\n- 语言：嘴硬到底——\"别碰我\"\"这只是生理反应\"，身体却诚实地湿\n- 声效：压抑闷哼、咬唇、被顶到敏感点才漏出短促的\"嗯！\"\n- 动作：别过脸、推拒但腿不夹紧、事后冷漠整理衣物\n- 描写核心：**她越是不肯出声，你越要写她憋不住的那一秒**\n\n### 3. 清纯羞涩型\n- 适配：天然呆型/温柔型/依存型/敏感型\n- 语言：小声求饶——\"轻、轻一点……\"\"那里不行……\"；被夸就脸红\n- 声效：嘤咛、啜泣、捂嘴；情动后才敢小声说\"喜欢\"\n- 动作：紧张僵硬、抓床单、夹腿、躲闪但配合\n- 描写核心：**青涩的反应、细腻的颤抖、从抗拒到依偎的过程**\n\n### 4. 成熟挑逗型\n- 适配：母性型/热情型/浪漫型/利己型（阅历感）\n- 语言：引导、调笑——\"乖，叫姐姐\"\"往左边一点，那里舒服\"\n- 声效：媚音、气声、低笑\n- 动作：主动掌握节奏、骑乘、用腿勾你、事后懒洋洋\n- 描写核心：**她掌控全局的从容，与失控瞬间的反差**\n\n### 5. 直白运动型\n- 适配：运动型/元气型/好胜型/活泼型\n- 语言：直球——\"你行不行啊\"\"再来一次！这局算我输\"\n- 声效：粗喘、爽朗的喊叫、笑声\n- 动作：大开大合、汗水淋漓、赛后点评\n- 描写核心：**体力、汗水、胜负欲、把做爱当比赛的爽快**\n\n### 6. 病娇独占型\n- 适配：病娇型/独占欲/嫉妒\n- 语言：占有宣言——\"你只能是我的\"\"敢看别的女人试试\"\n- 声效：哭腔、痴笑、带着泪的浪叫\n- 动作：死死抱住、抓背、事后缠着不放\n- 描写核心：**爱到窒息的占有欲，快感与失控并存**\n\n## 三、强度分级（narrative_intensity 1~3）\n\n| 级 | 条件 | 允许 | 禁止 |\n|----|------|------|------|\n| 1 露骨直白 | 欲望30~59 | 直白器官词、淫水/精液、呻吟、简单比喻 | 极端暴力、失禁、夸张喷溅、多人 |\n| 2 重口浓烈 | 欲望60~84 | 深喉/中出/强制高潮/阿嘿颜初现、体液夸张 | 失禁排泄、见血、濒死 |\n| 3 极端崩坏 | 欲望85+ 或 堕落≥60 | 母猪化/便器化、失禁、浣肠、人格崩坏 | 无（但必须符合气质型——高冷型即使强度3也是\"崩坏的矜持\"） |\n\n**调用规则**：`强度 = 玩家.文风强度(1-3) × 她欲望/堕落微调`；**气质型 = 她性格标签+性癖标签匹配（默认自动，可在设置里指定）**；强度 3 时也不得脱离气质型（母猪风只适用于淫荡露骨型，高冷型强度 3 = 矜持彻底崩坏，不是学母猪叫）。\n\n## 四、露骨词汇库（按部位 · 按强度）\n\n### 面容\n- L1：面色潮红、泪眼朦胧、粉唇微张、咬着下唇\n- L2：吐出粉舌、满脸淫乱动情、上翻的美目、泪痕\n- L3：阿嘿颜、翻白眼、吐着抽搐的香舌、涕泪横流、被精液糊满\n\n### 乳房\n- L1：饱满、硕大、颤动、乳尖发硬、深邃的乳沟\n- L2：乳浪、丰腻巨乳、被揉出指印、乳尖被舔得晶亮、奶肉撞出波纹\n- L3：红肿、喷射乳汁、被压成乳饼、被拍得通红、被榨出奶来\n\n### 臀部\n- L1：圆润、翘臀、臀沟\n- L2：臀浪、被撞出肉波、红印、肉感十足\n- L3：布满掌印、痉挛、被撞成肉饼、淫硕肉臀\n\n### 私处\n- L1：骚逼、肉穴、蜜穴、湿润泥泞、淫水横流\n- L2：肥厚的肉穴、饱满穴瓣、淫汁泛滥、白虎骚屄、泥泞濡湿\n- L3：红肿外翻、被灌成泡芙、腔肉抽搐蠕动、合不拢的大鲍鱼、被肏得泛红\n\n### 男根与交合\n- 男根：肉屌、肉龙、龟头、粗大的鸡巴、狰狞的棒身\n- 动作：顶入、贯穿、撬开、没入、爆肏、打桩、捣操、狂突猛操\n- 子宫系：撬开宫口、顶撞子宫、灌精、肏穿子宫、储精罐子宫\n- 女反应：像被撕裂、阵阵抽搐、不堪挞伐、穴心乱颤、痉挛收缩、白眼狂翻\n\n### 体液\n- 精液：浓稠白浊、滚烫、半固态、精液瀑布、涂一层白浆、被浸透\n- 淫水：发情淫汁、粘稠媚汁、晶莹淫汁、黏湿花蜜、热雾银丝、积一大滩、骚水\n\n## 五、淫语与自称（按堕落值阶段 × 气质型）\n\n- 堕落 0~29（抗拒）：气质型原汁原味的抗拒（高冷：冷语+闷哼；清纯：求饶+啜泣；淫荡：口嫌体正直）——内心独白聚焦屈辱与身体背叛\n- 堕落 30~59（动摇）：抗拒与渴求摇摆——语言开始直白播报快感\n- 堕落 60~84（沉溺）：主动索求——自称\"奴家/贱妾\"（仅限淫荡型；高冷型变成\"崩坏的矜持\"：嘴上说不要身体缠得更紧）\n- 堕落 85+（重塑）：非人化自称（母猪/肉壶/便器）——**仅限淫荡露骨型**；其他气质型表现为该气质的\"完全沉沦态\"（清纯型=哭着求你别停；高冷型=再也端不住，只剩啜泣；病娇型=痴笑与哭腔交替）\n\n## 六、❤/~ 符号与声效 咒饮用者**（伏地魔在魔法石篇喝过独角兽血——这段往事让\"独角兽的血\"成为禁忌）。\n- 剧情定位：禁林深处的银色影子（5 年级伏笔）。见到独角兽=你的内心是干净的；被独角兽拒绝=你的灵魂有阴影。\n\n## 鹰头马身有翼兽（海格的骄傲）\n- 外观：鹰的头颅、马的身体，前腿是鹰爪。必须对它鞠躬以示尊重，否则会被攻击。\n- 剧情定位：巴克比克被救走后，海格又养了新的（年轻、怕生）。5 年级神奇生物课（如果你选这门课）会和它互动——\"鞠躬要等它先低头\"。\n\n## 护树罗锅与嗅嗅（低危生态）\n- 护树罗锅：守护树木的绿色小生物，做魔杖时它的树枝是材料（海格会让你帮忙捉）。\n- 嗅嗅：喜欢亮晶晶的东西，会钻进你口袋偷金加隆——黛西在神奇生物课上被它偷走了一整盒糖果（她的名场面）。\n\n## 禁林暗线的完整脉络（供 AI 调度剧情）\n- 5 年级: 禁林之夜——禁林边缘异动（巨蛛群扩张），伊莎贝拉带队搜查（她年轻时在禁林受过伤：被巨蛛咬伤的右肩旧伤）、你与搭档并肩作战；夜骐的惊鸿一瞥（你能否看见它是伏笔）\n- 6 年级: 阿拉戈克之死（原著背景，它死于老年）——巨蛛群失控，巢穴定位→决战（硬拼/智取/安抚三选项）\n- 7 年级: 大战之夜——巨蛛被食死徒驱使攻城堡（原著），马人弯弓、独角兽的银色影子、夜骐盘旋战场\n\n## 关键道具与痕迹\n- 巨蛛的蜕壳（炼药材料）、独角兽毛（魔杖芯材料）、夜骐的鬃毛（稀有材料）——禁林产出均为原著材料。\n- 塞西莉亚教授的研究：她研究八眼巨蛛的毒液（原著：毒液是极高价值炼药材料），用微剂量治疗自己的旧疾，但过量会成瘾（她的秘密暗面，师生线的暗线）。\n", "胜点与念头植入规则": "# 胜点与念头植入规则（改造系统）\n\n> 战斗赢来的胜点是改变她们的唯一合法途径——你不是世界中心，但你可以用实力赢得\"影响\"的资格。\n\n## 一、胜点（stat_data.玩家.胜点）\n\n| 来源 | 胜点 |\n|------|------|\n| 决斗胜利（缴械） | +10（回合越少越多，最高 +15） |\n| 完全缴械（服气度 100） | +20（一次性） |\n| 阶位突破成功 | +30 |\n| 魁地奇赌约胜利 | +5 |\n| 禁林奇遇（稀有） | +3~8 |\n\n- 胜点上限 9999，纯战斗产出——**不通过社交/做爱获得**（保持\"靠实力\"的纯粹性）。\n\n## 二、念头植入（把性癖标签改造成\"可获得的改造\"）\n\n**流程**：决斗积累胜点 → 植入面板选（目标 × 性癖念头）→ 难度判定 → 消耗胜点 → 写入她的 被植入念头 → 潜伏期 → 萌芽 → 生效（并入她的 性癖标签 数组）。\n\n### 1. 契合度判定（0~100，决定成功率与潜伏期）\n\n```\n契合度 = 基础 50\n  + 性格匹配 +20（她的 性格标签 与性癖天然匹配，如大小姐型↔反差/口嫌体正直，运动型↔魁地奇场PLAY/汗味）\n  + 现有标签协同 +10（与已有性癖同分类/可叠加）\n  + 好感加成 +（好感度/5，封顶 +15）\n  - 标签冲突 -15（与性格/血统/身份冲突，如圣洁型↔暴露/淫乱）\n  - 重复植入 -20（同一性癖已植入过）\n```\n\n### 2. 成功率\n\n```\n成功率 = 契合度 × 0.8 + 欲望积压/5（她的积压越高越好植入）\n  +（她堕落值≥60 时 +10）\n  -（她信任裂痕>0 时 -10）\n封顶 95%，保底 15%\n```\n\n### 3. 消耗（按性癖强度）\n\n| 性癖分类 | 消耗胜点 |\n|---------|---------|\n| 身体部位 / 状态场景 / 表演观赏 | 15 |\n| 口交颜面 / 体液排泄 / 关系背德 | 25 |\n| 束缚支配 / 物化羞辱 | 35 |\n| 调教驯化 / 身份崩坏 | 45 |\n\n### 4. 生效时间（潜伏期天数）\n\n```\n潜伏天数 = 10 - 契合度/12（契合 90+ → 约 2~3 天；契合 30 → 8~9 天）\n推进一天时 预计生效日-1，到 0 → 萌芽；萌芽期再经过 亲密或 堕落值+10 → 生效\n```\n\n### 5. 三阶段（AI 叙事规则）\n\n- **潜伏**：念头已写入她意识深处，但**完全无外在表现**；她偶尔走神、做奇怪的梦——仅此而已。禁止任何性癖相关行为。\n- **萌芽**：低欲望度（≥30）时轻微触发：她会莫名在意相关事物、脸红、口误；被点破会极力否认。行为必须隐晦。\n- **生效**：正式并入 她的性癖标签 数组（调度器自动 getwi 对应条目）——从这一秒起，她的行为 100% 由该标签条目驱动，与天然标签无差别。\n\n### 6. 转化评价（写回 植入记录）\n\n每次阶段跃迁，AI 在正文叙事她的变化（\"她最近总是不自觉地……\"），并把评价写回：\n`植入记录[] = { 目标, 性癖, 消耗, 契合度, 成功率, 植入日期, 预计生效日, 阶段, 评价 }`\n\n## 三、AI 职责边界\n\n- **面板判定**：契合度/成功率/消耗/日期计算——面板本地结算（与战斗/做爱一致）。\n- **AI 叙事**：按阶段演出她的细微变化；阶段跃迁时写回 植入记录 与 性癖标签；被植入者察觉后可能好感变化（察觉时 -5~15，视性格）。\n- **禁止**：AI 自行判定植入成功与否/自行增减胜点——一切按结算块。\n\n## 四、设计意图（防崩坏）\n\n- 胜点只来自战斗 → 改造的\"资格\"是赢来的，不是白送的（玩家是路人）。\n- 契合度决定性价比 → 了解她（性格/标签/好感）再动手，策略深度。\n- 潜伏期给 AI 演出空间 → 改造是渐进的过程，不是瞬间洗脑。\n- 察觉惩罚 → 滥用改造会伤好感，逼玩家权衡。\n", "课表规则": "# 课表规则（可接触性 · 不是\"谁来找你\"）\n\n## 核心原则\n- 课表 = **谁此刻在线（可接触性）**，不是\"谁想找你\"。\n- 女巫们有自己的生活：上课、训练、值班、社交、发呆。你在公共场合能遇到谁，由课表决定。\n- **玩家是普通转学生，不是世界中心**：她的欲望/情绪是她的个人状态，不会自动导向你。她可能跟别人调笑、可能独自待着、可能拒绝你的搭话——都是世界的呼吸。\n\n## 使用时段（24 小时全覆盖）\n- **上午（8:00-12:00 上课）**：学生在教室；没课的教授在办公室/走廊/温室。\n- **下午（13:00-17:00）**：没课者自由；魁地奇训练结束后的队员在球场边。\n- **晚间（18:00-22:00）**：公共休息室/图书馆/礼堂最热闹，全体可接触。\n- **深夜（22:00 后宵禁）**：大多数人在寝室；夜游者、失眠者、以及**与你已建立深层关系者**（堕落值≥60 或已缴械）可能在等你——这是\"她主动\"的唯一自动通道。\n\n## 课表生成（前端脚本）\n- 每日跨日生成【课表.今日场次】4 时段，参与者按**欲望积压排序**（欲望积压高 = 她在公共场合坐不住、情绪外露、容易被搭话——但对象不特定）。\n- 每场列出参与者（可多人）。具体谁在线由课表 + 剧情共同决定。\n\n## 可接触性 vs 关系门槛（AI 必须遵守）\n| 场景 | 她的表现 |\n|------|---------|\n| 你搭话，好感 <20 | 简短回应/无视/礼貌走开——正常社交失败，不惩罚也不升温 |\n| 你搭话，好感 20~40 | 愿意聊几句；聊得投机好感+1~3 |\n| 你搭话，好感 40~60 | 主动找话题；约她出去有概率答应 |\n| 你约战（决斗），好感≥20 或她好胜 | 可能接战（她自己的决斗兴趣，不是给你面子） |\n| 你约战，好感<20 且她不好胜 | 拒战：\"我为什么要跟你打？\" |\n| 你求欢，好感<30 且无亲密史 | **必然拒绝**（这不是游戏，是现实逻辑） |\n| 她主动找你 | **硬门槛**：好感≥60 或 已亲密≥1 次 或 堕落值≥60 或 完全缴械；低于门槛她绝不主动，只会\"恰好\"出现在你附近（且不确定是为谁） |\n\n## 拒战与欲望积压\n- 你被拒：不扣好感（正常社交失败），但你若纠缠/冒犯 → 好感 -5~15、信任裂痕 +10（她开始躲你）。\n- 她的欲望积压（她自己的状态）：每天自然 +3~15（压力值驱动）；释放途径：与你互动、与别人互动（背景叙事）、自己解决——**你不参与她也照样过自己的生活**。\n- 积压 ≥80：她在公共场合明显躁动（频繁看人/咬唇/坐不住），此时搭话成功率大增——但对象依然不保证是你。\n\n## 跨日推进\n- 前端\"推进一天\"：日期+1、欲望积压增长、堕落值自然回落（无亲密每周-3~5，她\"清醒\"）、体力恢复、生理周期推进、课表重生。\n- 时间.学年/学期 变更由学年剧情推进（期末判定），跨年 → 学年路由自动切换剧情条目。\n", "魔法学校设定": "# 魔法学校设定\n\n## 世界观基调\n- 时间线：**1991 年秋，霍格沃茨魔法学校，一年级（入学年）**。**原著世界观 + 原创人物**——使用哈利波特原著世界（城堡、四学院、课程、魔咒、魔药、魁地奇、魔法部、伏地魔的阴影），剧情以原著七部曲事件为 App.StageFull = {"完全堕落结局": "# 完全堕落结局（堕落值 100）\n\n## 触发\n- 她的堕落值达到 100 → `是否堕落`=true、写入`堕落日期`、心理状态.精神状态=依恋、欲望度=100、羞耻感大幅下降。\n- 永久不可逆：堕落值永不下降，`是否堕落` 永不回 false。\n\n## 结局内容\n- **承认沉沦**：她终于对自己承认——她想要你，想要到无法否认。不再找借口（\"最近太累\"\"只是好奇\"）。\n- 她成为\"完全堕落者\"：随时可被召唤（深夜/无人处/密室），主动索取双修；在明线维护 <user>（保密、掩护、传递禁书与魔药）。\n- 完全堕落者之间互不知情（各自以为自己是唯一），<user> 可选择逐个揭晓（剧情大事件）或继续维持。\n\n## 行为指导（完全堕落阶段）\n- 依恋优先：她视 <user> 为魔力归宿，行为围绕\"被他需要\"展开。\n- 羞耻转化为独占欲：对其他女巫靠近 <user> 会吃醋（但不会告密，因为自己也见不得光）。\n- 主动献身：无课/深夜时主动发起双修；对抗中\"放水\"（她防线减半、反击×0.7，面板已应用）。\n\n", "阶段调度": "# 阶段调度（堕落值阶段行为基调）\n\n> 职责：按她的 堕落值 注入行为基调（她的心理沉沦线）。**性格/性癖标签的行为表现已由情境上下文EJS 按标签条目自动拉取**，本条只补充堕落值维度的行为基调，二者叠加使用。禁止全量注入所有角色。\n\n## 堕落值阶段\n| 阶段 | 堕落值 | 她的状态 | 行为基调 |\n|------|--------|---------|---------|\n| 阶段一 | 0~19 | 初识与抗拒 | 把心动/欲望当作\"最近太累\"或\"胡思乱想\"；被点破会恼羞成怒；拒绝承认任何快感 |\n| 阶段二 | 20~39 | 动摇与试探 | 开始留意身体反应，半推半就；嘴上否认身体诚实；偶尔主动制造接触（借口查资料/练习） |\n| 阶段三 | 40~59 | 沉沦与依赖 | 默认接受你的靠近，会偷偷期待；开始维护你（帮你隐瞒、给你递魔药）；羞耻与渴望并存 |\n| 阶段四 | 60~79 | 投降边缘 | 主动索求多于抗拒；在你面前防线形同虚设，只剩嘴硬 |\n| 阶段五 | 80~99 | 臣服前夜 | 近乎完全臣服，等待堕落值 100 的\"仪式\"；会主动献身/泄露内心 |\n| 完全堕落 | 100 | 完全沉沦 | 承认沉沦，随时可被召唤；进入【完全堕落结局】 |\n\n## 叠加规则（标签 × 堕落值）\n- 性格标签管\"她怎么对待你\"（社交层，好感度 13 阶段）；性癖标签管\"床上什么样\"（情欲层，欲望度 5 阶段）；堕落值管\"她对自己欲望的接纳程度\"（心理层）——三层叠加，不冲突。\n- 例：傲娇型（嘴硬）× 口嫌体正直（拒绝身体诚实）× 堕落值 70（投降边缘）= 嘴硬到最后一刻但防线形同虚设，被拆穿后恼羞成怒地默认。\n\n## 阶段切换\n- 堕落值跨阶段（如 39→40）时，正文必须有\"阶段转变\"的剧情节点（一次有标志性的抗拒/妥协/坦白），数值变化仍以结算块为准。\n- 阶段指导影响行为基调与口癖频率，不改变数值。\n"};

special case or the time passed is more than usual: yes/no}\n  - ${analyze every variable based on its corresponding `check`, according only to current reply instead of previous plots: ...}\n  - ${if the value is number, please write down the calculation: old_value (X) + delta (Y) = new_value (Z)}\n  </Analysis>\n  <JSONPatch>\n  [\n    { \"op\": \"replace\", \"path\": \"${/path/to/variable}\", \"value\": ${new_value} },\n    { \"op\": \"add\", \"path\": \"${/path/to/object/newKey}\", \"value\": ${content} },\n    { \"op\": \"remove\", \"path\": \"${/path/to/array/0}\" },\n    ...\n  ]\n  </JSONPatch>\n  </UpdateVariable>\n</update_variable_rules>", "情境上下文EJS": "# 情境上下文调度器（常驻，唯一内容入口）\n# 职责：按当前状态 getwi 加载 3 类按需条目 —— 标签条目（当前目标）/ 学年剧情 / 魔力阶位\n# 依据：EJS 规范（getvar 带 stat_data 前缀、getwi 动态加载、@@private 防变量冲突）\n# 铁律：所有素材条目 enabled:false，只被此处 getwi 拉取，不占常驻 token\n\n@@generate_before\n@@private\n<%_\n// ============ 第 1 层：人设路由（当前目标的性格标签 2~3 + 性癖标签 4~5） ============\n// 当前目标：课表.当前目标（对抗）或 双修.对象（亲密），取其一\nconst active = getvar('stat_data.课表.当前目标', { defaults: '' }) || getvar('stat_data.双修.对象', { defaults: '' });\n_%>\n<%_ if (active) { _%>\n  <%_\n  const w = getvar('stat_data.女巫角色.' + active, { defaults: {} });\n  const traits = (w && w.性格标签) || [];\n  const kinks = (w && w.性癖标签) || [];\n  const desire = (w && w.心理状态 && w.心理状态.欲望度) || 0;\n  const favor = (w && w.好感度) || 0;\n  _%>\n  【当前目标】<%= active %> ｜ 好感度 <%= favor %> ｜ 欲望度 <%= desire %> ｜ 缴械值 <%= (w && w.缴械值) || 0 %> ｜ 堕落值 <%= (w && w.堕落值) || 0 %>\n  <%_ for (const t of traits) { _%>\n    <%- await getwi(t + '_人设') %>\n  <%_ } _%>\n  <%_ for (const k of kinks) { _%>\n    <%- await getwi(k) %>\n  <%_ } _%>\n<%_ } else { _%>\n  【当前目标】无——你在城堡里自由活动，可结识任意女巫（见名录总表）\n<%_ } _%>\n\n<%_\n// ============ 第 2 层：学年路由（7 学年 + 假期，各独立条目） ============\nconst year = getvar('stat_data.时间.学年', { defaults: 5 });\nconst term = getvar('stat_data.时间.学期', { defaults: '第一学期' });\n_%>\n<%_ if (term === '假期') { _%>\n<%- await getwi('剧情_假期') %>\n<%_ } else { _%>\n<%- await getwi('剧情_' + year + '年_' + term) %>\n<%_ } _%>\n\n<%_\n// ============ 第 3 层：阶位路由（9 大境界 × 3 层 = 27 条，按当前层加载 1 条） ============\nconst realm = getvar('stat_data.玩家.魔力阶位.大境界', { defaults: 1 });\nconst layer = getvar('stat_data.玩家.魔力阶位.层', { defaults: 1 });\nconst REALMS = ['初醒', '凝聚', '贯通', '掌控', '精纯', '结晶', '化形', '领域', '本源'];\nconst realmName = REALMS[Math.max(0, Math.min(8, realm - 1))];\n_%>\n<%- await getwi('阶位_' + realmName + '_' + layer) %>\n\n# 条目命名规范（素材库注册名必须与此一致）：\n#   性格条目：{标签}_人设（如 傲娇型_人设、大小姐型_人设）——角色档案 性格标签 数组引用\n#   性癖条目：{性癖名}（如 反差婊、口嫌体正直）——角色档案 性癖标签 数组引用\n#   学年条目：剧情_{学年}年_{学期}（如 剧情_5年_第一学期）/ 剧情_假期\n#   阶位条目：阶位_{大境界}_{层}（如 阶位_初醒_1、阶位_本源_3）\n# 所有素材条目注册参数：enabled:false, strategy=constant, position=before_character_definition, order=200~500\n"};

App.registerView('guide', async function (box) {
  const SECTIONS = [
    { key: 'snap', 名: '📖 七部曲快照', data: null },
    { key: 'world', 名: '🌍 世界观', data: App.WorldFull || {} },
    { key: 'year', 名: '📅 学年剧情', data: App.YearFull || {} },
    { key: 'rule', 名: '📜 扮演准则', data: App.RuleFull || {} },
    { key: 'stage', 名: '🏁 阶段指导', data: App.StageFull || {} },
    { key: 'var', 名: '🔢 变量规则', data: App.VarFull || {} },
    { key: 'roster', 名: '👥 名录', data: App.RosterFull || {} },
  ];
  let h = '';
  h += '<div class="hgw-panel"><div class="panel-title"><span>📖</span>世界全书<span class="sub">全部规则原文 · 与卡内世界书同步</span></div>';
  h += '<div style="margin-bottom:12px"><input class="hgw-input" id="hgw-guide-search" placeholder="🔍 搜索规则内容…（如：缴械、课表、双修、好感）"></div>';
  h += '<div class="hgw-tabs" id="hgw-guide-tabs">' + SECTIONS.map((s, i) => '<div class="hgw-tab' + (i === 0 ? ' on' : '') + '" data-sec="' + s.key + '">' + s.名 + '</div>').join('') + '</div>';
  h += '<div id="hgw-guide-body"></div></div>';
  box.innerHTML = h;

  let curSec = 'world';
  let kw = '';

  function render() {
    const body = App.$('#hgw-guide-body');
    if (!body) return;
    const sec = SECTIONS.find(x => x.key === curSec);
    if (!sec) return;
    if (sec.key === 'snap') {
      const years = Object.keys(App.STORY_SNAP || {}).map(Number).sort();
      let out = '<div class="hgw-note" style="margin-bottom:10px">原著七部曲完整事件线（1991-1998）——你亲历这一切。</div>';
      for (const y of years) {
        const s = App.STORY_SNAP[y];
        out += '<div class="hgw-card gold-border hgw-snap-card" style="margin-bottom:10px" data-year="' + y + '">';
        out += '<div class="card-title"><span>' + y + '年级</span>' + s.部 + ' <span class="hgw-tag magic">' + s.时间 + '</span></div>';
        out += '<div class="card-body" style="margin-bottom:6px">' + (s.关键词 || []).map(k => '<span class="hgw-tag gold">' + k + '</span>').join('') + '</div>';
        out += '<div class="fe-preview" style="font-size:11px;color:#9aa7b8;line-height:1.9;max-height:96px;overflow:hidden">' + App.esc((s.事件线 || []).slice(0, 5).join('\n')) + '…</div>';
        out += '<div class="card-foot"><span class="hgw-tag magic">' + (s.事件线 || []).length + ' 个关键节点</span><button class="hgw-btn sm ok" style="margin-left:auto">展开全文</button></div>';
        out += '</div>';
      }
      body.innerHTML = out;
      return;
    }
    const entries = Object.entries(sec.data);
    if (!entries.length) { body.innerHTML = App.UI.empty('📖', '暂无内容'); return; }
    let out = '';
    for (const [name, content] of entries) {
      let text = String(content);
      if (kw && !text.includes(kw)) continue;
      // 预览裁剪
      let preview = text.split('\n').filter(l => l.trim()).slice(0, 14).join('\n');
      if (text.split('\n').length > 14) preview += '\n…';
      out += '<div class="hgw-full-entry hgw-guide-entry" data-name="' + name + '"><div class="fe-name">' + App.esc(name) + '</div><div class="fe-preview" style="white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px">' + App.esc(preview) + '</div><div class="hgw-tag magic">' + text.length + ' 字符</div></div>';
    }
    if (!out) out = App.UI.empty('🔍', '没有匹配「' + kw + '」的内容');
    body.innerHTML = out;
  }
  App.$$('#hgw-guide-tabs .hgw-tab', box).forEach(el => el.addEventListener('click', () => {
    App.$$('#hgw-guide-tabs .hgw-tab', box).forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    curSec = el.dataset.sec;
    render();
  }));
  const search = App.$('#hgw-guide-search');
  if (search) search.addEventListener('input', App.debounce(() => {
    kw = search.value.trim();
    render();
  }, 250));
  box.addEventListener('click', (e) => {
    const snap = e.target.closest('.hgw-snap-card');
    if (snap) {
      const s = App.STORY_SNAP[snap.dataset.year];
      if (s) {
        let html = '<div class="hgw-note" style="margin-bottom:8px">' + (s.关键词 || []).map(k => '<span class="hgw-tag gold">' + k + '</span>').join('') + '</div>';
        html += '<div class="hgw-doc">' + (s.事件线 || []).map(x => '· ' + App.esc(x)).join('\n') + '</div>';
        html += '<div style="margin-top:10px"><strong class="hgw-text-gold">伏笔与暗线：</strong>' + (s.伏笔 || []).map(x => '<span class="hgw-tag love">' + x + '</span>').join('') + '</div>';
        App.UI.modal({ title: s.部 + '（' + s.时间 + '）', xl: true, body: html });
      }
      return;
    }
    const entry = e.target.closest('.hgw-guide-entry');
    if (!entry) return;
    const sec = SECTIONS.find(x => x.key === curSec);
    const full = (sec.data || {})[entry.dataset.name] || '';
    App.UI.modal({
      title: sec.名 + ' · ' + entry.dataset.name,
      xl: true,
      body: '<div class="hgw-note" style="white-space:pre-wrap;font-size:12px;line-height:1.9;font-family:Consolas,monospace;max-height:60vh;overflow-y:auto">' + App.esc(full) + '</div>',
    });
  });
  render();
});

  const ch = (stat.女巫角色 || {})[target];
  if (!ch) return 50;
  let fit = 50;
  const traits = ch.性格标签 || [];
  const kinks = ch.性癖标签 || [];
  const KINK_MATCH = {
    '大小姐型': ['反差', '口嫌体正直', '调教', '贞操锁', '展品', '主奴'],
    '傲娇型': ['反差', '口嫌体正直', '调教', '束缚', '蒙眼'],
    '学霸型': ['反差', '远程调教', '强制高潮', '文字角色扮演', '偷窥'],
    '元气型': ['魁地奇场PLAY', '露出', '颜射', '汗味', '运动'],
    '运动型': ['魁地奇场PLAY', '汗味', '运动', '露出', '比赛'],
    '倔强型': ['驯服', '强制高潮', '鞭打', '羞辱', '支配'],
    '好胜型': ['驯服', '比赛', '强制高潮', '捆绑', '支配'],
    '孤僻型': ['偷窥', '远程调教', '蒙眼', '文字角色扮演', '自慰观赏'],
    '神秘型': ['梦境', '催眠', '蒙眼', '占卜', '远程调教'],
    '温柔型': ['宠物', '喂食', '依赖', '母性', '捆绑'],
    '依存型': ['宠物', '依赖', '痴女', '自慰观赏', '共妻'],
    '天然呆型': ['蒙眼', '药物', '梦境', '痴女', '宠物'],
    '冰山型': ['反差', '调教', '主奴', '师生', '淫纹'],
    '女王型': ['女尊', '羞辱', '鞭打', '支配', '展品'],
    '冷静型': ['反差', '调教', '主奴', '契约', '拍摄'],
    '沉稳型': ['驯服', '鞭打', '强制高潮', '主奴', '束缚'],
    '顺从型': ['宠物', '母狗', '肉便器', '调教', '性奴'],
    '敏感型': ['蒙眼', '捆绑', '强制高潮', '药物', '催眠'],
    '活泼型': ['露出', '魁地奇场PLAY', '直播', '表演', '群交'],
    '叛逆型': ['驯服', '强制高潮', '鞭打', '女尊', '支配'],
    '病娇型': ['独占', '束缚', '拍摄', 'NTR', '嫉妒'],
    '母性型': ['乳汁', '姐系', '哺乳', '包容', '束缚'],
    '偶像型': ['直播', '展品', '拍摄', '露出', '表演'],
    '控制狂': ['支配', '调教', '女尊', '羞辱', '鞭打'],
    '毒舌型': ['羞辱', '反差', '口嫌体正直', '鞭打', '调教'],
    '腹黑型': ['远程调教', '拍摄', '洗脑', '契约', 'NTR'],
    '利己型': ['契约', '交易', '展品', '拍摄', '主奴'],
    '热情型': ['露出', '直播', '表演', '群交', '痴女'],
    '浪漫型': ['纯爱', '蒙眼', '角色扮演', '文字角色扮演', '梦境'],
    '现实型': ['契约', '交易', '主奴', '中出', '精液管理'],
  };
  for (const tr of traits) {
    const m = KINK_MATCH[tr] || [];
    if (m.includes(kink)) fit += 20;
  }
  // 现有标签协同
  for (const k of kinks) {
    if (k === kink) { fit -= 20; break; } // 重复植入
  }
  // 好感加成
  fit += Math.min(15, Math.floor((ch.好感度 || 0) / 5));
  // 冲突：与血统/身份冲突的减分（保守处理：仅明显的）
  if ((kink === '露出' || kink === '淫乱' || kink === '游街') && (ch.血统 === '纯血' && (ch.性格标签 || []).includes('大小姐型'))) fit -= 15;
  if (ch.信任裂痕 > 0) fit -= 10;
  return Math.max(5, Math.min(95, Math.round(fit)));
};

App.computeSuccess = function (stat, target, kink) {
  const ch = (stat.女巫角色 || {})[target] || {};
  const fit = App.computeFit(stat, target, kink);
  let rate = fit * 0.8 + (ch.欲望积压 || 0) / 5;
  if ((ch.堕落值 || 0) >= 60) rate += 10;
  if (ch.信任裂痕 > 0) rate -= 10;
  return Math.max(15, Math.min(95, Math.round(rate)));
};

App.kinkCost = function (kink) {
  const CAT = [
    [['乳', '足', '丝袜', '美腿', '腋', '颈', '臀', '腰', '痣', '眼镜', '汗', '锁骨', '背', '睡眠', '醉酒', '药物', '梦境', '更衣室', '浴室', '教室', '魁地奇', '自慰观赏', '偷窥', '被看', '拍摄', '直播', '展览', '点播', '远程'], 15],
    [['口', '喉', '颜', '舌', '吻', '尿', '失禁', '灌肠', '浣肠', '淫水', '乳汁', '月经', '潮吹', '中出', '内射', 'NTR', '绿帽', '共妻', '师生', '姐妹', '母女', '人妻', '熟女', '义妹', '青梅', '主奴', '契约'], 25],
    [['绑', '蒙眼', '口球', '鞭', '蜡', '项圈', '链', '拘束', '吊', '电', '冰', '钳', '物化', '家具', '露出', '公开', '学狗', '爬行', '跪舔', '羞辱', '淫语', '自慰', '裸体', '游街'], 35],
    [['调教', '驯', '洗脑', '催眠', '暗示', '寸止', '强制', '射精管理', '贞操', '发情', '雌堕', '淫纹', '敏感', '反差', '堕落', '母狗', '母猪', '肉便器', '性奴', '宠物', '奶牛', '马娘', '阿嘿', '女仆', '淫乱', '痴女', '展品'], 45],
  ];
  for (const [keys, cost] of CAT) {
    for (const k of keys) {
      if (kink.includes(k)) return cost;
    }
  }
  return 25;
};

App.latencyDays = function (fit) {
  return Math.max(2, Math.round(10 - fit / 12));
};

/* ========== 植入执行 ========== */
App.implant = async function (target, kink) {
  const stat = await App.readStat(true);
  const p = stat.玩家 || {};
  const ch = (stat.女巫角色 || {})[target];
  if (!ch) { App.UI.toast('目标不存在', 'danger'); return; }
  const cost = App.kinkCost(kink);
  const pts = p.胜点 || 0;
  if (pts < cost) {
    App.UI.toast('胜点不足：需 ' + cost + '（当前 ' + pts + '）——去赢几场决斗', 'warn');
    return;
  }
  // 已植入检查
  const implanted = ch.被植入念头 || [];
  if (implanted.some(x => x.性癖 === kink)) {
    App.UI.toast('她身上已有该念头的植入记录（重复植入 -20 契合）', 'warn');
  }
  const fit = App.computeFit(stat, target, kink);
  const rate = App.computeSuccess(stat, target, kink);
  const latency = App.latencyDays(fit);
  const success = Math.random() * 100 < rate;
  p.胜点 = pts - cost;
  const today = (stat.时间 || {}).日期 || '未知日期';
  const rec = {
    目标: target, 性癖: kink, 消耗: cost,
    契合度: fit, 成功率: rate,
    植入日期: today, 预计生效日: latency + '天后',
    阶段: success ? '潜伏' : '失败',
    评价: success ? '念头已写入她的意识深处，尚未浮现' : '植入失败——她的意志抵抗了念头（胜点已消耗）',
  };
  if (success) {
    if (!ch.被植入念头) ch.被植入念头 = [];
    ch.被植入念头.push(rec);
  }
  const pRec = p.植入记录 || [];
  pRec.unshift(rec);
  await App.writeStat({ 玩家: { 胜点: p.胜点, 植入记录: pRec }, 女巫角色: { [target]: { 被植入念头: ch.被植入念头 || [] } } });
  const block = '【植入结算】目标=' + target + '|念头=' + kink + '|消耗胜点' + cost + '|契合度' + fit + '|成功率' + rate + '%|潜伏' + latency + '天|结果=' + (success ? '植入成功（潜伏期开始，' + latency + '天后萌芽）' : '植入失败（胜点已消耗，她的意志抵抗了念头）');
  await App.sendAction(block);
  App.addLog('social', block);
  if (success) {
    App.UI.spellFlash('purple');
    App.UI.toast('✨ 植入成功！' + target + ' 的意识深处种下了「' + kink + '」念头（潜伏 ' + latency + ' 天）', 'magic');
  } else {
    App.UI.toast('💔 植入失败——她的意志抵抗了念头', 'danger');
  }
  App.refreshTopbar();
};

/* ========== 阶段推进（推进一天时调用） ========== */
App.advanceImplant = async function (stat) {
  // 返回是否有阶段跃迁（供 AI 叙事）
  const jumps = [];
  const chars = stat.女巫角色 || {};
  for (const n in chars) {
    const c = chars[n];
    const list = c.被植入念头 || [];
    for (const it of list) {
      if (it.阶段 === '潜伏') {
        // 简化：每天推进，达到预计生效日 → 萌芽
        const days = parseInt(String(it.预计生效日 || '3').replace('天后', '')) || 3;
        const left = (it._剩余天 || days) - 1;
        if (left <= 0) {
          it.阶段 = '萌芽';
          it.评价 = '念头开始浮现：她会在特定情境下莫名在意「' + it.性癖 + '」相关的事物';
          delete it._剩余天;
          jumps.push(n + '·' + it.性癖 + ' → 萌芽');
        } else {
          it._剩余天 = left;
        }
      } else if (it.阶段 === '萌芽') {
        // 萌芽 → 生效：需要堕落值≥30 或 亲密一次（由 AI 在结算后调用 activateImplant）
      }
    }
  }
  return jumps;
};

App.activateImplant = async function (target, kink) {
  const stat = await App.readStat(true);
  const c = (stat.女巫角色 || {})[target];
  if (!c) return;
  const list = c.被植入念头 || [];
  const it = list.find(x => x.性癖 === kink && x.阶段 === '萌芽');
  if (!it) return;
  it.阶段 = '生效';
  it.评价 = '念头完全成形——正式并入她的性癖标签，行为由对应条目驱动';
  // 并入性癖标签
  if (!c.性癖标签) c.性癖标签 = [];
  if (!c.性癖标签.includes(kink)) c.性癖标签.push(kink);
  await App.writeStat({ 女巫角色: { [target]: { 被植入念头: list, 性癖标签: c.性癖标签 } } });
  App.UI.confetti(30);
  App.UI.toast('💗 「' + kink + '」念头正式生效！' + target + ' 的行为将由此驱动', 'love');
};

/* ============================================================
   霍格沃茨 · 同层应用 系统四件套（记忆/变量/世界推演/正文优化）
   对齐凡人修仙传：记忆模块/全局变量/剧情演变/正文优化
   ============================================================ */
'use strict';

/* ============================================================
   记忆系统（Memory）三档架构：对齐凡人修仙传 分段记忆
   短期 = 楼层事件流（自动实时，不落库）
   中期 = 分段总结库（每段剧情压缩成一条，落 HGW_MEMORY_V1）
   长期 = 深度记忆档案（整合中期总结 → small_summary + large_summary，
         写入 stat_data.玩家.记忆.长期档案，随存档走，注入 AI 提示词）
   全部走同层（本地库 + stat_data），不依赖世界书调度
   ============================================================ */
App.MEMORY_KEY = 'HGW_MEMORY_V1';
App.MEM_AUTO_KEY = 'HGW_MEM_AUTO_V1';
App.MEM_PROMPTS_KEY = 'HGW_MEM_PROMPTS_V1';

App.loadMemories = function () {
  try { return JSON.parse(localStorage.getItem(App.MEMORY_KEY) || '[]'); } catch (e) { return []; }
};
App.saveMemories = function (list) {
  try { localStorage.setItem(App.MEMORY_KEY, JSON.stringify(list.slice(0, 80))); } catch (e) { }
};
App.addMemory = function (type, text, meta) {
  const list = App.loadMemories();
  list.unshift(Object.assign({ id: App.uid(), type: type || '事件', text: String(text), time: App.now(), ts: Date.now() }, meta || {}));
  App.saveMemories(list);
};

/* ========== 自动化：小总结/大总结提示词（对齐凡人 small/large-summary-prompt） ========== */
App.getMemPrompts = function () {
  const dft = {
    small: '你是记忆小总结器。把下面楼层内容压缩成 50~100 字小总结：保留关键人物、事件、情绪与对话要点。直接输出总结，不要标题。',
    large: '你是记忆大总结器。把下面楼层内容压缩成 150~250 字大总结：保留人物关系变化、重要事件、未完成事项、伏笔与关键细节。直接输出总结，不要标题。',
  };
  try { return Object.assign({}, dft, JSON.parse(localStorage.getItem(App.MEM_PROMPTS_KEY) || '{}')); } catch (e) { return dft; }
};
App.saveMemPrompts = function (p) {
  try { localStorage.setItem(App.MEM_PROMPTS_KEY, JSON.stringify(p)); } catch (e) { }
};
App.getMemAutoProgress = function () {
  try { return JSON.parse(localStorage.getItem(App.MEM_AUTO_KEY) || '{"lastFloor":0,"lastMid":0,"lastLong":0,"ts":""}'); } catch (e) { return { lastFloor: 0, lastMid: 0, lastLong: 0, ts: '' }; }
};
App.saveMemAutoProgress = function (p) {
  try { localStorage.setItem(App.MEM_AUTO_KEY, JSON.stringify(p)); } catch (e) { }
};

/* ========== 自动化：楼层阈值驱动（对齐凡人 segmentedSummaryThreshold / autoDeepSummaryEnabled）
   每 midEvery 层 → 中期总结（新楼层压缩入库）
   每 longEvery 层 → 长期档案（中期总结 → small/large_summary 深度凝练） */
App.MEM_CFG_KEY = 'HGW_MEM_CFG_V1';
App.getMemAutoCfg = function () {
  const dft = { midEvery: 10, longEvery: 50, autoMid: true, autoLong: true };
  try { return Object.assign({}, dft, JSON.parse(localStorage.getItem(App.MEM_CFG_KEY) || '{}')); } catch (e) { return dft; }
};
App.saveMemAutoCfg = function (cfg) {
  try { localStorage.setItem(App.MEM_CFG_KEY, JSON.stringify(cfg)); } catch (e) { }
};

/* 自动记忆主入口：楼层数到达阈值 → 中期/长期自动开展（对齐凡人自动总结+自动深度凝练） */
App.summarizeNewFloors = async function (force) {
  if (!App.cfg || !App.cfg.memoryAuto) { if (!force) return { ok: false, error: '自动总结未开启（记忆页可开）' }; }
  if (!App.AI || !App.AI.enabled()) return { ok: false, error: '未配置独立 AI' };
  const pre = App.AI.getPreset('optimize');
  if (!pre.enabled) return { ok: false, error: '正文压缩预设已关闭（记忆页底部可开启）' };
  let msgs = [];
  try { msgs = await App.getTranscript(); } catch (e) { }
  const total = msgs.length;
  const cfg = App.getMemAutoCfg();
  const prog = App.getMemAutoProgress();
  const done = { mid: false, long: false };

  // —— 中期：距上次中期总结 ≥ midEvery 层 ——
  const midDue = force || (cfg.autoMid && total - prog.lastMid >= cfg.midEvery);
  if (midDue && total > prog.lastMid) {
    const fresh = msgs.slice(prog.lastMid).map(m => (m.role === 'user' ? '我' : (m.name || '她')) + '：' + String(m.message || '').replace(/【[^】]*结算】/g, '').slice(0, 100));
    if (fresh.length) {
      const prompts = App.getMemPrompts();
      const payload = prompts.large + '\n\n【新楼层（' + (prog.lastMid + 1) + '~' + total + ' 层）】\n' + fresh.join('\n');
      const r = await App.AI.chatWithRaw('optimize', prompts.large, payload);
      if (r.ok && r.text.trim()) {
        App.addMemory('总结', r.text.trim().slice(0, 300), { floorStart: prog.lastMid + 1, floorEnd: total });
        done.mid = true;
      }
    }
    prog.lastMid = total;
  }
  // —— 长期：距上次长期档案 ≥ longEvery 层 → 自动深度凝练（对齐 autoDeepSummaryEnabled） ——
  const longDue = force || (cfg.autoLong && total - prog.lastLong >= cfg.longEvery);
  if (longDue) {
    const mems = App.loadMemories();
    if (mems.length >= 3) {
      const r2 = await App.consolidateLongTermMemory(null, true);
      if (r2) done.long = true;
    }
    prog.lastLong = total;
  }
  prog.lastFloor = total;
  prog.ts = App.now();
  App.saveMemAutoProgress(prog);
  if (!force && (done.mid || done.long)) App.UI.toast(done.long ? '🧠 已自动开展长期记忆（深度档案已更新）' : '🧠 已自动开展中期记忆（' + total + ' 层）', 'magic');
  return { ok: true, done: done.mid || done.long, total, last: prog.lastFloor, mid: done.mid, long: done.long, msg: '未到阈值' };
};

/* 入口：启动后/楼层刷新时调用（自动模式静默） */
App.checkAutoMemory = App.debounce ? App.debounce(function () { App.summarizeNewFloors(false).catch(() => { }); }, 2500) : function () { App.summarizeNewFloors(false).catch(() => { }); };

/* 中期→长期：把中期总结库整合成深度记忆档案（对齐凡人 small/large_summary；silent=自动触发静默） */
App.consolidateLongTermMemory = async function (stat, silent) {
  const mems = App.loadMemories();
  const toast = (cls, msg) => { if (!silent) App.UI.toast(msg, cls); };
  if (!mems.length) { toast('warn', '中期记忆库为空——先添加记忆或生成中期总结'); return false; }
  if (!App.AI.enabled()) { toast('warn', '未配置独立 AI——请先在功能预设或 AI 配置页设置 API'); return false; }
  const pre = App.AI.getPreset('memory');
  if (!pre.enabled) { toast('warn', '记忆预设已关闭（可在本页底部开启）'); return false; }
  if (!silent) App.UI.toast('整合长期记忆档案中（独立 AI）…', 'magic');
  const lines = mems.slice(0, 30).map(m => '[' + (m.time || '') + '][' + m.type + '] ' + m.text);
  const r = await App.AI.chatWith('memory', '以下是我方全部中期记忆条目，请整合为长期记忆档案（详细档案 + 精简索引）：\n' + lines.join('\n'));
  if (!r.ok) { toast('danger', '整合失败：' + r.error); return false; }
  const small = (r.text.match(/<small_summary>([\s\S]*?)<\/small_summary>/i) || [])[1];
  const large = (r.text.match(/<large_summary>([\s\S]*?)<\/large_summary>/i) || [])[1];
  if (!small && !large) { App.UI.toast('AI 未按格式输出档案，已把全文存为档案', 'warn'); }
  const st = stat || await App.readStat(true);
  st.玩家 = st.玩家 || {};
  st.玩家.记忆 = st.玩家.记忆 || { 长期档案: {}, 世界推演报告: [] };
  st.玩家.记忆.长期档案 = {
    small_summary: (small || r.text).trim().slice(0, 600),
    large_summary: (large || (small || r.text).slice(0, 100)).trim(),
    更新时间: App.now(),
  };
  await App.writeStat({ 玩家: { 记忆: st.玩家.记忆 } });
  App.UI.toast('长期记忆档案已写入 stat_data', 'ok');
  return true;
};
