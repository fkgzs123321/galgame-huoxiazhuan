# 双修系统（亲密 · 面板本地结算）

> 双修 = 做爱 = 亲密。这是两个独立的人之间的私事——驱动力是**人性本身**：欲望、喜欢、寂寞、好奇、依赖。不掺杂任何"魔力必需"之类的超自然理由。
> 面板字段对齐双修面板（修为进度/情欲/快感/堕落/顺从/高潮待宣/主导方/动作编排/物品/体位/裁决/回溯/品质）。

## 总则
- 亲密在**做爱面板内本地结算**：你编排本轮动作（行为+部位+风格，最多 3 组）、选主导方/体位/物品，面板按固定公式推进五维。
- 快感满 100 → 高潮待宣，AI 在正文宣布高潮后，面板确认（快感清零、修为+20、堕落+8）。
- 会话结束 → 生成【双修结算】块，折算关系成长。

## 前置门槛（现实逻辑）
- 她愿意跟你上床，前提是**你们的关系到了**：好感≥30 或有亲密史，或她主动（堕落≥60/好感≥60）。
- 好感 <30 无亲密史 → 她拒绝。强行 → 好感暴跌 + 信任裂痕 + 她躲你。
- 每次亲密后：她的欲望积压 -25（她舒服了）、羞耻感变化、身体敏感化累积（高潮次数↑）。

## 五维（做爱面板）
| 维度 | 含义 | 增长规则 |
|------|------|---------|
| 修为进度 | 本场**亲密度**积累（0~100） | 每轮 +5~15（视品质与顺从）；高潮 +20；**不涨魔力**——它折算为好感/堕落收益 |
| 情欲 | 她的情欲（0~100） | 每轮 +3~8；迷情剂 +30；高潮后 -20 |
| 快感 | 她的快感（0~100） | 每轮 +动作品质伤害；润滑魔油 +20；满 100 高潮 |
| 堕落 | 本场堕落度（0~100） | 每轮 +2~6（视部位/行为）；高潮 +8；结算折算为她的堕落值成长 |
| 顺从 | 本场顺从度（0~100） | 每轮 +2~5（她的配合度：好感/关系/精神状态决定）；决定结算品质 |

## 动作编排（行为×部位×风格）
- 行为库：舔舐、吮吸、指入、揉弄、顶弄、深顶、轻抚、拍打、啃咬、含住
- 部位库：乳尖、乳肉、耳垂、脖颈、花径、花核、会阴、肛口、大腿内侧、臀部
- 风格库：轻柔、缓慢、猛烈、深入、断续、缠绵、粗暴、克制
- **部位适用性校验**：含住×臀部、深顶×乳尖 等不适用组合面板禁用。
- **契合度**：行为/风格命中她的敏感部位（档案名器/身体状态）→ 品质提升。

## 品质（每轮结算）
- 无效 / 低效 / 普通 / 上佳。上佳（契合度≥3 或顺从≥60）：全维度 ×1.5；低效 ×0.6；无效 ×0（修为+2 保底）。

## 主导方 / 体位 / 物品
- 主导方（我来/对方来）：我来 → 快感成长 ×1、顺从成长 ×1.3；对方来 → 快感 ×1.2、顺从 ×0.8（她主动）。
- 体位：正常位/后入式/骑乘式/侧卧位/六九式/站立式（深入类 +3 快感）。
- 物品：迷情剂（她情欲+30）、润滑魔油（她快感+20）——从背包消耗。

## 高潮与回溯
- 快感 100 → 高潮待宣=true → AI 正文宣布 → 面板【确认高潮】：快感清零、修为+20、堕落+8、她高潮次数+1。
- 回溯：结算前可撤销本轮（历史轮回退）。

## 结束结算（面板生成）
- 修为→好感：修为/10 取整 好感+；堕落→她的堕落值 +；欲望积压-25。
- 【双修结算】块经真实楼层发送，AI 写成亲密场面并按块写回（勿重算）。
- 怀孕判定：排卵期（生理周期.排卵日前后）+ 未避孕（避孕=false/备孕=true）→ 内射有怀孕风险，由 AI 按结算块与周期表判定，写回 怀孕周数。

## 身体敏感化（长期积累）
- 高潮次数累计 → 她的身体状态敏感度上限提升（胸部/阴道敏感度随亲密度缓慢+），AI 叙事体现"越来越放得开"。
- 堕落值 ≥60：她开始主动索求（关系的果）；=100：完全堕落（随时可召唤）。
