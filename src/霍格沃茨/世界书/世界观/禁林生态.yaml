# 禁林生态（原著生物与材料设定）

## 禁林（原著生态圈）
- 禁林位于城堡西北，占地辽阔，越深处越危险。校规禁止学生入内，但历代都有"胆大的"偷跑进去（猎场看守海格是例外，他三天两头往里钻）。
- 原著生物圈：马人（禁林深处，占卜与星象）、独角兽（银白色，纯洁之物）、八眼巨蛛（阿拉戈克一族，禁林深处）、夜骐（只有见过死亡的人才能看见）、护树罗锅（守护树木）、嗅嗅（喜欢亮晶晶）、鹰头马身有翼兽（巴克比克一族）。
- 本卡禁林主线围绕"禁林深处的异动"展开：八眼巨蛛群的活动范围近年异常扩大（海格会忧心忡忡地说"阿拉戈克的孩子越来越不安分"）。

## 夜骐（关键伏笔生物）
- 外观：黑色马形生物，骨瘦如柴，皮如龙皮，长着巨大的蝙蝠状翅膀，没有眼睛（靠感知灵魂）。
- 关键设定：**只有亲眼见过死亡的人才能看见夜骐**。你（玩家）是否看得见夜骐，是剧情的重要伏笔——它直接揭示你的过去（你见过死亡）。
- 剧情定位：5 年级禁林边惊鸿一瞥（如果你看得见它，说明你有过"失去"的经历；如果你看不见，说明你还算幸运）。6 年级夜骐拉着马车运送伤员（大战前兆）。7 年级大战前后，夜骐是死亡与重生的见证者。

## 八眼巨蛛（禁林深层威胁）
- 外观：黑色巨蛛，八只眼，腿部展开可达十几英尺。阿拉戈克（海格的宠物，原著）已老，但它的子孙在禁林深处繁衍。
- 习性：肉食性，会主动攻击人类（阿拉戈克本人约束后代不吃人，但"孩子们"越来越不受控）。怕声波咒（驱散咒）。
- 剧情定位：5 年级禁林之夜事件——你遭遇的"异动"源头是巨蛛群扩张；6 年级狼蛛之王式的决战改为"巨蛛巢穴"（阿拉戈克之死前后）；7 年级大战中巨蛛被食死徒驱使攻打霍格沃茨（原著）。

## 马人（禁林的神秘智者）
- 外观：上半身人、下半身马，高傲、睿智，精通占星术。
- 习性：不与巫师交往（"我们和你们走的路不同"），但会观察、会在关键时刻出手（原著中大战中参战）。
- 剧情定位：5 年级 OWL 考试周（费伦泽被逐出马人群落，来霍格沃茨任教占卜课——原著背景，特里劳妮教授的助手）。6-7 年级大战中，马人弯弓搭箭的画面是名场面。

## 独角兽（纯洁与危险的并存）
- 外观：银色小马，独角，只亲近纯洁者。
- 关键设定：**独角兽血可以延续生命，但会诅咒饮用者**（伏地魔在魔法石篇喝过独角兽血——这段往事让"独角兽的血"成为禁忌）。
- 剧情定位：禁林深处的银色影子（5 年级伏笔）。见到独角兽=你的内心是干净的；被独角兽拒绝=你的灵魂有阴影。

## 鹰头马身有翼兽（海格的骄傲）
- 外观：鹰的头颅、马的身体，前腿是鹰爪。必须对它鞠躬以示尊重，否则会被攻击。
- 剧情定位：巴克比克被救走后，海格又养了新的（年轻、怕生）。5 年级神奇生物课（如果你选这门课）会和它互动——"鞠躬要等它先低头"。

## 护树罗锅与嗅嗅（低危生态）
- 护树罗锅：守护树木的绿色小生物，做魔杖时它的树枝是材料（海格会让你帮忙捉）。
- 嗅嗅：喜欢亮晶晶的东西，会钻进你口袋偷金加隆——黛西在神奇生物课上被它偷走了一整盒糖果（她的名场面）。

## 禁林暗线的完整脉络（供 AI 调度剧情）
- 5 年级: 禁林之夜——禁林边缘异动（巨蛛群扩张），伊莎贝拉带队搜查（她年轻时在禁林受过伤：被巨蛛咬伤的右肩旧伤）、你与搭档并肩作战；夜骐的惊鸿一瞥（你能否看见它是伏笔）
- 6 年级: 阿拉戈克之死（原著背景，它死于老年）——巨蛛群失控，巢穴定位→决战（硬拼/智取/安抚三选项）
- 7 年级: 大战之夜——巨蛛被食死徒驱使攻城堡（原著），马人弯弓、独角兽的银色影子、夜骐盘旋战场

## 关键道具与痕迹
- 巨蛛的蜕壳（炼药材料）、独角兽毛（魔杖芯材料）、夜骐的鬃毛（稀有材料）——禁林产出均为原著材料。
- 塞西莉亚教授的研究：她研究八眼巨蛛的毒液（原著：毒液是极高价值炼药材料），用微剂量治疗自己的旧疾，但过量会成瘾（她的秘密暗面，师生线的暗线）。
