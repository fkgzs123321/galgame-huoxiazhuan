### 魔力值（魔力总量，决斗属性）
- 无硬上限（0~9999，按阶位层区间划分）；冥想/过夜 +20；决斗胜场 +；学业推进 +；施法过度 -5~15/天。
- 魔力值决定决斗防线（防线=魔力值×1.2×阶位系数）与突破判定（见战斗系统/阶位条目）。

