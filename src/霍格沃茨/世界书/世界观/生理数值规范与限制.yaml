# 生理数值规范与限制（硬规则，防玩家口胡）

> 所有数值都有上限、衰减、恢复机制，AI 与玩家都必须遵守。面板与 AI 叙事保持一致，玩家不能"我说怎样就怎样"。

## 玩家方（stat_data.玩家.属性 + 状态 + 生理）

### 玩家身体设定（铁律，AI 叙事必须遵守）
- **勃起尺寸 20cm**：<user> 是天生的巨根——完全勃起时长约 20cm、粗如小臂，尺寸固定不变，任何人（含 AI 叙事）不得缩小、不得削弱。
- **勃起视觉**：勃起后裤裆鼓起的具体状态（宽松/紧身差异）由 AI 按场景自然描写，本卡不预设细节。
- **双修交互**：她的乳房/手/腿碰到勃起处、或被压着时，紧绷感与尺寸带来的压迫感要在叙事中体现。

### 情欲 ↔ 快感 联动（硬限制）
| 情欲 | 快感上限 | 能否对抗 |
|------|---------|---------|
| 0~19 | 20 | 不能勃起，无法对抗 |
| 20~39 | 40 | 勉强，对抗中快感衰减+ |
| 40~69 | 70 | 正常 |
| 70~89 | 90 | 亢奋 |
| 90~100 | 100 | 极易失控 |

- 公式：快感 = min(快感, 情欲上限)。情欲 <20 时快感强制 0（软）。

### 硬不起来（勃起不足）的对抗门槛（AI 必须执行）
- **情欲 < 20（无法勃起）= 无法进入对抗（唯一拒战途径）**：
  - **★玩家不能主动拒战**：没有任何"拒绝对抗"的选项/机制，唯一拒战途径 = 硬不起来（情欲<20 且 快感0）。
  - **主动挑战/课表开战**：开战被拒，对抗不开始——必须先恢复情欲（过夜/刺激）或使用道具【欢欣剂】情欲+40 后才能开战。
  - **她主动贴上来（欲望积压高/关系近）**：你这边没反应（勃起不足）= 亲密不成立、**不产生任何败果**（不扣好感/科目/败场），战斗状态置"已结算（结果：拒战）"。
- 情欲 20~39（勉强）可进入对抗，但快感上限 40、对抗中快感衰减+，处于明显劣势（面板显示"勉强"）。
- 情欲消耗：**数值驱动，不是回合制**——每次射精 -20~30（视当日次数衰减）；对抗内每次攻防 -2（兴奋消耗，面板自动）；对抗外由刺激/恢复事件增减。
- 情欲恢复：每日自然恢复 +10（过夜），亲密互动/视觉刺激 +5~15（AI 叙事后写变量）。
- **★完全无法勃起时的判定与正文（AI 必须按此执行）**：
  - **判定**：情欲 <20 且 快感 =0 = 完全无法勃起（硬限制）。
  - **她主动索求时**：你硬不起来 = 亲密不成立：战斗面板不结算，**无任何败果**，战斗状态置"已结算（结果：拒战）"。
  - **正文描写（拒战）**：你这边疲软——"那东西软趴趴地垂着，一点反应都没有"；她那边尴尬又失落（"……算了，当我没说"），转身离开但**欲望积压不降**（未释放成功，甚至因落空 +5~10）。基调是"**没成**"，不是对抗、不是战败。
  - **主动想开战（情欲<20）**：正文写"你试着鼓起劲，但那东西软趴趴地垂着，怎么都起不来"——开战被拒，需恢复情欲或用【欢欣剂】。
  - **勉强（情欲 20~39）**：可开战但面板显示"勉强"，正文写"好不容易硬起来，却半软不硬，一碰就发颤，明显撑不久"。

### 射精规则（由 体力/情欲/快感 驱动，无每日次数硬上限）
- **射精去向（由使用者念头决定，AI 按此叙事）**：她让你射进去 → 精液射入她的子宫，**永不漏出、永不外流**；她不让你射进去 → 射在你的内裤上。输了提前缴械 = 已射精（同上判定）。
- **射精门槛（三条件缺一不可）**：快感 ≥ 60（充分勃起）且 情欲 ≥ 30 且 体力 ≥ 30。任一不足即无法射精。
- **射精消耗（公式，随当日次数递增）**：
  - 体力：-(10 + 当日已射次数×5) → 第1次 -10、第2次 -15、第3次 -20……
  - 情欲：-(30 + 当日已射次数×10) → 第1次 -30、第2次 -40、第3次 -50……
  - 快感：归 0
- **次数自然限制**：每次射精后 体力/情欲 下降，当 体力 < 30 或 情欲 < 30 时自动无法再射；一般 2~3 次后见底，但高体力高情欲者可突破。
- **射精后不应期**：`射精冷却剩余` = 4 + 当日已射次数×4。**推进规则：仅对抗/双修回合内每回合 -1（面板自动递减）；日常不递减**——日常的不应期状态由数值体现（情欲/体力不足自然射不出、快感上限减半）；新的一天（跨日推进）清零。冷却归 0 前无法再次射精；冷却期间快感上限减半（软）。
- **强行射精（数值不足仍射）**：射精困难（量少/断续）、体力额外 -10、情欲额外 -20；若体力 < 15 直接虚脱倒地，本日无法再战。
- **恢复（公式，AI 按此更新）**：
  - 情欲：过夜自然 +15（上限100）；亲密互动/视觉刺激 +5~15/次；情欲 < 20 时晨勃消失。
  - 体力：过夜 +40、三餐 +10/餐、休息半日 +20（上限100）；体力 < 15 无法对抗（硬限制）。
  - 快感：**数值事件驱动，没有"回合"概念**——射精归 0；受刺激（视觉/贴身/道具欢欣剂/咒语效果）按事件 +5~15；无刺激自然回落 -5~10/小时；晨勃（睡眠后 50~80）；**对抗内不自动衰减**。
- 写回：`玩家.生理.今日射精次数`、`射精冷却剩余`、`最后射精日期`。

### 体力恢复
- 体力上限 100；每天过夜 +40（上限内）；三餐 +10/餐；休息半日 +20。
- 体力 <30 时战斗力 -50%（面板已应用 stateBonus）。
- 体力 <15 时无法进行对抗（硬限制）。

