# 课表规则（可接触性 · 不是"谁来找你"）

## 核心原则
- 课表 = **谁此刻在线（可接触性）**，不是"谁想找你"。
- 女巫们有自己的生活：上课、训练、值班、社交、发呆。你在公共场合能遇到谁，由课表决定。
- **玩家是普通转学生，不是世界中心**：她的欲望/情绪是她的个人状态，不会自动导向你。她可能跟别人调笑、可能独自待着、可能拒绝你的搭话——都是世界的呼吸。

## 使用时段（24 小时全覆盖）
- **上午（8:00-12:00 上课）**：学生在教室；没课的教授在办公室/走廊/温室。
- **下午（13:00-17:00）**：没课者自由；魁地奇训练结束后的队员在球场边。
- **晚间（18:00-22:00）**：公共休息室/图书馆/礼堂最热闹，全体可接触。
- **深夜（22:00 后宵禁）**：大多数人在寝室；夜游者、失眠者、以及**与你已建立深层关系者**（堕落值≥60 或已缴械）可能在等你——这是"她主动"的唯一自动通道。

## 课表生成（前端脚本）
- 每日跨日生成【课表.今日场次】4 时段，参与者按**欲望积压排序**（欲望积压高 = 她在公共场合坐不住、情绪外露、容易被搭话——但对象不特定）。
- 每场列出参与者（可多人）。具体谁在线由课表 + 剧情共同决定。

## 可接触性 vs 关系门槛（AI 必须遵守）
| 场景 | 她的表现 |
|------|---------|
| 你搭话，好感 <20 | 简短回应/无视/礼貌走开——正常社交失败，不惩罚也不升温 |
| 你搭话，好感 20~40 | 愿意聊几句；聊得投机好感+1~3 |
| 你搭话，好感 40~60 | 主动找话题；约她出去有概率答应 |
| 你约战（决斗），好感≥20 或她好胜 | 可能接战（她自己的决斗兴趣，不是给你面子） |
| 你约战，好感<20 且她不好胜 | 拒战："我为什么要跟你打？" |
| 你求欢，好感<30 且无亲密史 | **必然拒绝**（这不是游戏，是现实逻辑） |
| 她主动找你 | **硬门槛**：好感≥60 或 已亲密≥1 次 或 堕落值≥60 或 完全缴械；低于门槛她绝不主动，只会"恰好"出现在你附近（且不确定是为谁） |

## 拒战与欲望积压
- 你被拒：不扣好感（正常社交失败），但你若纠缠/冒犯 → 好感 -5~15、信任裂痕 +10（她开始躲你）。
- 她的欲望积压（她自己的状态）：每天自然 +3~15（压力值驱动）；释放途径：与你互动、与别人互动（背景叙事）、自己解决——**你不参与她也照样过自己的生活**。
- 积压 ≥80：她在公共场合明显躁动（频繁看人/咬唇/坐不住），此时搭话成功率大增——但对象依然不保证是你。

## 跨日推进
- 前端"推进一天"：日期+1、欲望积压增长、堕落值自然回落（无亲密每周-3~5，她"清醒"）、体力恢复、生理周期推进、课表重生。
- 时间.学年/学期 变更由学年剧情推进（期末判定），跨年 → 学年路由自动切换剧情条目。
