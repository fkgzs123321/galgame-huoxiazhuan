# 学业规则（OWL 年）

## OWL 考试（五年级期末）
- 七科：魔咒学、变形术、黑魔法防御术、魔药学、草药学、天文学、魔法史。
- 每科满分 100，总分 700。当前总分 512（中上游，目标 600+ 为"优秀巫师"线）。
- **学业总分由决斗/事件结算变动**：
  - 你胜：随机科目 +1~5（AI 按【对抗结算】块写回）
  - 你败：随机科目 -1~5

## 日常学业
- 上课/作业/图书馆自习按剧情推进；各科成绩随日常表现由 AI 小幅调整（考试/作业/课堂表现 ±1~3）。
- 考试成绩影响教授（塞西莉亚·费恩、伊莎贝拉·诺斯）对 <user> 的态度与好感度触发条件。
- 禁书区借书、违规夜游被扣学院分，影响学院杯与公共休息室氛围。

## 学业与压力的联动
- 学业压力上升 → 她的压力值上升 → 欲望积压自然增长（学生类角色适用）。
- 上课走神/成绩下滑/被教授点名 → 明线推进（她的压力与你的社交机会联动）。
