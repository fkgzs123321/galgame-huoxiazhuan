# 胜点与念头植入规则（改造系统）

> 战斗赢来的胜点是改变她们的唯一合法途径——你不是世界中心，但你可以用实力赢得"影响"的资格。

## 一、胜点（stat_data.玩家.胜点）

| 来源 | 胜点 |
|------|------|
| 决斗胜利（缴械） | +10（回合越少越多，最高 +15） |
| 完全缴械（服气度 100） | +20（一次性） |
| 阶位突破成功 | +30 |
| 魁地奇赌约胜利 | +5 |
| 禁林奇遇（稀有） | +3~8 |

- 胜点上限 9999，纯战斗产出——**不通过社交/做爱获得**（保持"靠实力"的纯粹性）。

## 二、念头植入（把性癖标签改造成"可获得的改造"）

**流程**：决斗积累胜点 → 植入面板选（目标 × 性癖念头）→ 难度判定 → 消耗胜点 → 写入她的 被植入念头 → 潜伏期 → 萌芽 → 生效（并入她的 性癖标签 数组）。

### 1. 契合度判定（0~100，决定成功率与潜伏期）

```
契合度 = 基础 50
  + 性格匹配 +20（她的 性格标签 与性癖天然匹配，如大小姐型↔反差/口嫌体正直，运动型↔魁地奇场PLAY/汗味）
  + 现有标签协同 +10（与已有性癖同分类/可叠加）
  + 好感加成 +（好感度/5，封顶 +15）
  - 标签冲突 -15（与性格/血统/身份冲突，如圣洁型↔暴露/淫乱）
  - 重复植入 -20（同一性癖已植入过）
```

### 2. 成功率

```
成功率 = 契合度 × 0.8 + 欲望积压/5（她的积压越高越好植入）
  +（她堕落值≥60 时 +10）
  -（她信任裂痕>0 时 -10）
封顶 95%，保底 15%
```

### 3. 消耗（按性癖强度）

| 性癖分类 | 消耗胜点 |
|---------|---------|
| 身体部位 / 状态场景 / 表演观赏 | 15 |
| 口交颜面 / 体液排泄 / 关系背德 | 25 |
| 束缚支配 / 物化羞辱 | 35 |
| 调教驯化 / 身份崩坏 | 45 |

### 4. 生效时间（潜伏期天数）

```
潜伏天数 = 10 - 契合度/12（契合 90+ → 约 2~3 天；契合 30 → 8~9 天）
推进一天时 预计生效日-1，到 0 → 萌芽；萌芽期再经过 亲密或 堕落值+10 → 生效
```

### 5. 三阶段（AI 叙事规则）

- **潜伏**：念头已写入她意识深处，但**完全无外在表现**；她偶尔走神、做奇怪的梦——仅此而已。禁止任何性癖相关行为。
- **萌芽**：低欲望度（≥30）时轻微触发：她会莫名在意相关事物、脸红、口误；被点破会极力否认。行为必须隐晦。
- **生效**：正式并入 她的性癖标签 数组（调度器自动 getwi 对应条目）——从这一秒起，她的行为 100% 由该标签条目驱动，与天然标签无差别。

### 6. 转化评价（写回 植入记录）

每次阶段跃迁，AI 在正文叙事她的变化（"她最近总是不自觉地……"），并把评价写回：
`植入记录[] = { 目标, 性癖, 消耗, 契合度, 成功率, 植入日期, 预计生效日, 阶段, 评价 }`

## 三、AI 职责边界

- **面板判定**：契合度/成功率/消耗/日期计算——面板本地结算（与战斗/做爱一致）。
- **AI 叙事**：按阶段演出她的细微变化；阶段跃迁时写回 植入记录 与 性癖标签；被植入者察觉后可能好感变化（察觉时 -5~15，视性格）。
- **禁止**：AI 自行判定植入成功与否/自行增减胜点——一切按结算块。

## 四、设计意图（防崩坏）

- 胜点只来自战斗 → 改造的"资格"是赢来的，不是白送的（玩家是路人）。
- 契合度决定性价比 → 了解她（性格/标签/好感）再动手，策略深度。
- 潜伏期给 AI 演出空间 → 改造是渐进的过程，不是瞬间洗脑。
- 察觉惩罚 → 滥用改造会伤好感，逼玩家权衡。
