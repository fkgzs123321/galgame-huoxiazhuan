# 战斗系统（魔法决斗 · 面板本地结算）

## 总则
- 战斗 = **巫师决斗**（霍格沃茨的决斗传统："决斗是神圣的，不可违背"）。你与对手以魔咒对轰，魔力护盾互砍，**谁先被缴械（魔杖脱手）谁输**。
- 对抗在**战斗面板内本地结算**：你选择咒语（1~3 个），面板按固定公式计算伤害，双方防线互减，一方归零即分出胜负。
- 面板把战斗状态写入 `stat_data.课表.战斗`，胜负生成【对抗结算】块经真实楼层发送，AI 把它写成决斗场面并写回成长数值。

## 为什么决斗（世界观驱动力）
- 魔法世界崇尚力量与荣耀：决斗俱乐部、魁地奇、黑魔王阴影下"力量即话语权"。
- 女巫们愿意接战是因为**她们本来就活在这个世界里**（好胜型享受胜负、傲罗教官有实战本能、大小姐维护家族尊严）——不是因为你。
- 你也可以拒绝；她们也可以拒绝（拒战 → 你不受尊重，但不会被强行拖入）。
- 决斗不是调情、不是性爱、不是关系推进工具——它就是决斗。胜负自然影响她对你的看法（好感/服气度由 AI 按剧情写），但不是为了"解锁"什么。

## 双方防线（魔力护盾）
- **你**：防线 = 魔力值 × 1.2 × **阶位系数**（上限=开战瞬间值，取整）。归零 = 你被缴械败北。
- **她**：防线上限 = 她档案的 防守值上限（她的魔法实力：身份基础 + 实力等级折算）。归零 = 她缴械（你胜）。
- 阶位系数表（面板自动读取 玩家.魔力阶位）：初醒 ×0.5~0.9 → 凝聚 ×1.0~1.2 → 贯通 ×1.3~1.5 → 掌控 ×1.6~2.0 → 精纯 ×2.2~2.8 → 结晶 ×3.0~3.6 → 化形 ×4.0~5.0 → 领域 ×5.5~7.0 → 本源 ×8.0~10.0。
- 阶位锁定咒语等级上限：初醒 Lv5 → 凝聚 Lv8 → 贯通 Lv12 → 掌控 Lv16 → 精纯 Lv20 → 结晶 Lv25 → 化形 Lv30 → 领域 Lv40 → 本源 Lv50（面板超限按上限结算）。

## 咒语（固定伤害，每级递增）
| 咒语 | 固定伤害 | 特效 |
|------|---------|------|
| 昏昏倒地 | Lv×3 | 直击：命中叠加"动摇"（每回合她减伤-1，可叠） |
| 火焰熊熊 | Lv×2 | 灼热：她本回合减伤-1（可叠加） |
| 摄神取念 | Lv×1 | 精神渗透：她防线之外的精神干扰，配合动摇类效果伤害×2 |
| 统统石化 | Lv×2.5 | 僵直：她的防御型魔力运转减半 |
| 厉火咒 | Lv×4 | 炽焰：高威力，但对魔力屏障型防御克制明显 |
| 粉身碎骨 | Lv×2 | 连击：本回合最终伤害×1.5 |
| 万弹齐发 | Lv×2 | 速攻：连续施放，扰乱她魔力节奏 |

- 每回合可选 1~3 个咒语同时使用，伤害叠加。
- 扩展咒语（魔咒库：盔甲护身/速速禁锢/愈合如初/幻身咒…）按年级/课程/阶位解锁，同样进入战斗面板可选池。
- 咒语经验：使用过的咒语每个 +15；升级所需 = 100+等级×50；上限受阶位锁定。

## 她本回合减伤
- 减伤 = 她的魔力韧性（名器防御折算，约 5~9）+ 她的耐力（能力值持久÷2）+ 状态修正。
- 状态修正（双刃剑）：她的欲望积压 ≥60 → 心神不宁，减伤-2、反击×1.1；≥80 → 减伤-4、反击×1.25；≥100 → **心神溃散**：每回合防线自动 -15（但不直接判负）。欲望积压是她自己的状态（生活压力/被压抑的渴望），不是针对你。

## 你本回合总伤害
- Σ咒语伤害 + 状态修正 - 她减伤（下限 0）
- 状态修正：体力 >60 折 2 / 40~60 折 1 / <40 折 0 / <30 额外-1（体力透支）；魔药（福灵剂 +2 等）自动应用。

## 她每回合反击
- 反击伤害 = 她的反攻值×1.5 + 魔力韧性÷2（取整）× 倍率池。
- 倍率池：欲望积压≥80 ×1.25；你状态不佳（快感≥90 分心）×1.2。
- 反击直接扣你的防线。她的经验：主技 +15（升级公式同上）。

## 胜负与成长（面板写回）
- **你胜（她缴械）**：她缴械值（服气度）+1~10（回合越少越多）；她败场+1；你 今日胜场+1、累计缴械+1、**决斗荣誉+10**、层进度+8、随机科目+2；AI 按剧情可微调她的好感/服气表现。
- **你败（你被缴械）**：你 今日败场+1、败绩+1~5（回合越少越多）；她缴械值-5（你输了她不再那么服你）；她胜场+1。
- 缴械值到 100 → 她承认你决斗上彻底强于她（是否缴械=true，永久）。

## 【对抗结算】块格式（面板生成，经真实楼层发送）
```
【对抗结算】目标=X|回合=N|我方=咒语Lv(伤害)+…|她减伤N|实伤N|她防线X→Y|她反击(伤害)|你防线X→Y|你胜/你败/未分胜负|缴械值±N
```
- AI 职责：把结算块写成精彩决斗场面（咒语对轰/护盾碎裂/魔杖脱手瞬间）；按结算块数值写回 缴械值/战绩/层进度/决斗荣誉/经验（**勿重算**）；胜负自然影响她态度（叙事层面）。

## 决斗俱乐部（荣誉线）
- 决斗荣誉累计 → 俱乐部排名（学徒→斗士→专家→冠军→决斗王），荣誉高者名声传开（社交影响，AI 叙事体现）。
- 高年级/教授的防线更高：挑战更强对手 = 荣誉更多，风险更大。
