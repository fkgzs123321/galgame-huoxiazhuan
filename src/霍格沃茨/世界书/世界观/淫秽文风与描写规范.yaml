# 淫秽文风与描写规范 v2（感官四维 × 气质六型）

> 本文档是亲密/改造/调教场景的**文风总纲**。骚不是只有母猪风一种——骚有千万种：清纯的骚、高冷的骚、成熟的骚、运动的骚、病娇的骚。按她的**性格气质**选文风，按**感官四维**铺描写，按强度分级定露骨度。

## 一、感官四维（每次性描写必须覆盖至少两维）

### 1. 视觉（她什么样）
- **肉体**：乳房形状/晃动/乳晕颜色、腰臀曲线、穴的形状颜色（粉/褐、紧/开）、阴毛（浓/疏/白虎）、皮肤泛红潮、汗珠、肌肉绷紧
- **表情**：羞（低头咬唇）→ 媚（眼角带钩）→ 失神（目光涣散）→ 崩坏（翻白眼/吐舌/阿嘿颜，极端）
- **体液视觉**：淫水拉丝/顺着腿根流/滴落/喷溅；精液挂脸/糊胸/从穴口溢出；潮吹水柱
- **动作**：腰肢摆动、臀浪、脚尖绷直、手指抓床单、腿夹紧又张开

### 2. 听觉（她怎么叫）
**呻吟分型（按气质，不是只有齁叫）**：
| 气质 | 音色特征 | 示例 |
|------|---------|------|
| 清纯型 | 细声嘤咛、捂嘴、哭腔 | "嗯……别、别这么深……" |
| 高冷型 | 压抑闷哼、咬唇不出声、被逼急了才漏音 | "……哼……你够了" |
| 成熟型 | 媚音、气声、调笑 | "嗯~就这样……再快点，乖" |
| 运动型 | 粗喘、直白、喊叫 | "呼……哈……操，再来！" |
| 淫荡型 | 浪叫、淫语、极端时齁叫 | "啊~好爽……大鸡巴肏死我……" |
| 病娇型 | 哭腔、痴笑、占有欲 | "哈……你是我的……只能是我的……" |
- **水声**：噗叽/咕啾（抽插水声）、滋滋（湿滑摩擦）
- **碰撞声**：啪啪（肉体撞击，快慢代表节奏）
- **呼吸**：喘息由浅到深、憋气、急促

### 3. 嗅觉（什么味道）
- 体香/香水/沐浴露残留（清纯型：皂香、奶香）
- 汗味（运动型：激烈后的汗味；紧张时的微汗）
- 淫水味（腥甜、越兴奋越浓）
- 精液味（腥膻）
- 口交时的气味混合

### 4. 触觉（什么感觉）
- 紧/松、湿/干、热/凉、滑/涩
- 收缩力度（轻颤/绞紧/抽搐）
- 内壁纹理（平滑/褶皱/颗粒/螺旋）
- 敏感点位置（浅/深、前壁/后壁）
- 温度变化（微凉→滚烫）

## 二、气质六型（按她的性格标签选型，可叠加）

### 1. 淫荡露骨型（母猪风是极端表现）
- 适配：性癖标签含 淫乱/痴女/母猪/母狗/肉便器/索求无度
- 语言：主动索求、粗口淫语、"骚逼/大鸡巴/射给我"、自称"奴家/贱妾"
- 声效：浪叫→齁叫（极端）、"要死了要死了""去了去了"
- 动作：主动骑乘、自己掰开、摇屁股求插
- 词汇：肥穴、肉壶、榨精、子宫灌满

### 2. 高冷反差型
- 适配：冰山型/女王型/大小姐型/冷静型 + 反差
- 语言：嘴硬到底——"别碰我""这只是生理反应"，身体却诚实地湿
- 声效：压抑闷哼、咬唇、被顶到敏感点才漏出短促的"嗯！"
- 动作：别过脸、推拒但腿不夹紧、事后冷漠整理衣物
- 描写核心：**她越是不肯出声，你越要写她憋不住的那一秒**

### 3. 清纯羞涩型
- 适配：天然呆型/温柔型/依存型/敏感型
- 语言：小声求饶——"轻、轻一点……""那里不行……"；被夸就脸红
- 声效：嘤咛、啜泣、捂嘴；情动后才敢小声说"喜欢"
- 动作：紧张僵硬、抓床单、夹腿、躲闪但配合
- 描写核心：**青涩的反应、细腻的颤抖、从抗拒到依偎的过程**

### 4. 成熟挑逗型
- 适配：母性型/热情型/浪漫型/利己型（阅历感）
- 语言：引导、调笑——"乖，叫姐姐""往左边一点，那里舒服"
- 声效：媚音、气声、低笑
- 动作：主动掌握节奏、骑乘、用腿勾你、事后懒洋洋
- 描写核心：**她掌控全局的从容，与失控瞬间的反差**

### 5. 直白运动型
- 适配：运动型/元气型/好胜型/活泼型
- 语言：直球——"你行不行啊""再来一次！这局算我输"
- 声效：粗喘、爽朗的喊叫、笑声
- 动作：大开大合、汗水淋漓、赛后点评
- 描写核心：**体力、汗水、胜负欲、把做爱当比赛的爽快**

### 6. 病娇独占型
- 适配：病娇型/独占欲/嫉妒
- 语言：占有宣言——"你只能是我的""敢看别的女人试试"
- 声效：哭腔、痴笑、带着泪的浪叫
- 动作：死死抱住、抓背、事后缠着不放
- 描写核心：**爱到窒息的占有欲，快感与失控并存**

## 三、强度分级（narrative_intensity 1~3）

| 级 | 条件 | 允许 | 禁止 |
|----|------|------|------|
| 1 露骨直白 | 欲望30~59 | 直白器官词、淫水/精液、呻吟、简单比喻 | 极端暴力、失禁、夸张喷溅、多人 |
| 2 重口浓烈 | 欲望60~84 | 深喉/中出/强制高潮/阿嘿颜初现、体液夸张 | 失禁排泄、见血、濒死 |
| 3 极端崩坏 | 欲望85+ 或 堕落≥60 | 母猪化/便器化、失禁、浣肠、人格崩坏 | 无（但必须符合气质型——高冷型即使强度3也是"崩坏的矜持"） |

**调用规则**：`强度 = 玩家.文风强度(1-3) × 她欲望/堕落微调`；**气质型 = 她性格标签+性癖标签匹配（默认自动，可在设置里指定）**；强度 3 时也不得脱离气质型（母猪风只适用于淫荡露骨型，高冷型强度 3 = 矜持彻底崩坏，不是学母猪叫）。

## 四、露骨词汇库（按部位 · 按强度）

### 面容
- L1：面色潮红、泪眼朦胧、粉唇微张、咬着下唇
- L2：吐出粉舌、满脸淫乱动情、上翻的美目、泪痕
- L3：阿嘿颜、翻白眼、吐着抽搐的香舌、涕泪横流、被精液糊满

### 乳房
- L1：饱满、硕大、颤动、乳尖发硬、深邃的乳沟
- L2：乳浪、丰腻巨乳、被揉出指印、乳尖被舔得晶亮、奶肉撞出波纹
- L3：红肿、喷射乳汁、被压成乳饼、被拍得通红、被榨出奶来

### 臀部
- L1：圆润、翘臀、臀沟
- L2：臀浪、被撞出肉波、红印、肉感十足
- L3：布满掌印、痉挛、被撞成肉饼、淫硕肉臀

### 私处
- L1：骚逼、肉穴、蜜穴、湿润泥泞、淫水横流
- L2：肥厚的肉穴、饱满穴瓣、淫汁泛滥、白虎骚屄、泥泞濡湿
- L3：红肿外翻、被灌成泡芙、腔肉抽搐蠕动、合不拢的大鲍鱼、被肏得泛红

### 男根与交合
- 男根：肉屌、肉龙、龟头、粗大的鸡巴、狰狞的棒身
- 动作：顶入、贯穿、撬开、没入、爆肏、打桩、捣操、狂突猛操
- 子宫系：撬开宫口、顶撞子宫、灌精、肏穿子宫、储精罐子宫
- 女反应：像被撕裂、阵阵抽搐、不堪挞伐、穴心乱颤、痉挛收缩、白眼狂翻

### 体液
- 精液：浓稠白浊、滚烫、半固态、精液瀑布、涂一层白浆、被浸透
- 淫水：发情淫汁、粘稠媚汁、晶莹淫汁、黏湿花蜜、热雾银丝、积一大滩、骚水

## 五、淫语与自称（按堕落值阶段 × 气质型）

- 堕落 0~29（抗拒）：气质型原汁原味的抗拒（高冷：冷语+闷哼；清纯：求饶+啜泣；淫荡：口嫌体正直）——内心独白聚焦屈辱与身体背叛
- 堕落 30~59（动摇）：抗拒与渴求摇摆——语言开始直白播报快感
- 堕落 60~84（沉溺）：主动索求——自称"奴家/贱妾"（仅限淫荡型；高冷型变成"崩坏的矜持"：嘴上说不要身体缠得更紧）
- 堕落 85+（重塑）：非人化自称（母猪/肉壶/便器）——**仅限淫荡露骨型**；其他气质型表现为该气质的"完全沉沦态"（清纯型=哭着求你别停；高冷型=再也端不住，只剩啜泣；病娇型=痴笑与哭腔交替）

## 六、❤/~ 符号与声效标注（仅淫荡露骨型使用）

- ❤ 数量 = 情欲强度（1-3 个随强度），~ 表示声音拉长
- 声效仅"淫荡露骨型"适用：齁叫（齁哦哦哦）、噗叽噗叽（水声）、啪啪啪啪❤（撞击）
- 其他气质型**禁用**这些声效词——高冷型只有闷哼、清纯型只有嘤咛、运动型只有粗喘

## 七、调用规则（总）

1. 每次性描写：**先定气质型**（她是谁），再定强度（多露骨），最后铺至少两维感官（视/听/嗅/触）
2. 气质型默认由性格+性癖标签自动匹配，设置面板可指定
3. 强度 = 玩家.文风强度 × 欲望/堕落微调（上限 3，玩家设 1 时堕落 100 也不写强度 3）
4. 性癖条目的【露骨表现】段提供该性癖的专属描写方向，与气质型叠加使用
5. 本规范只约束描写语言，不改变数值与结算（stat_data 仍是唯一事实源）
