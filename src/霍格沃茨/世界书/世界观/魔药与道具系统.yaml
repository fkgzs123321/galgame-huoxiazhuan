# 魔药与道具系统

## 玩家魔药（stat_data.玩家.魔药）
| 魔药 | 效果 | 获取 |
|------|------|------|
| 福灵剂 | 下一场决斗全属性小幅提升（面板自动应用：伤害+2、反击-1） | 魔药课高分/霍格莫德购买 |
| 迷情剂 | 双修中对方情欲+30（一次性） | 禁书区配方/斯莱特林渠道 |
| 复方汤剂 | 叙事道具，伪装身份用（不参与数值） | 魔药课进阶 |
| 欢欣剂 | 情欲+40（可用于做爱前提高状态） | 校医室"丢失"的库存 |
| 润滑魔油 | 双修中对方快感+20（一次性） | 对角巷魔法用品店 |
| 安神药剂 | 双修后魔力值恢复+15 | 魔药课制作 |

## 她道具栏（stat_data.女巫角色.{她}.道具栏）
- 每位女巫有自己的私藏道具（按档案登记）。
- AI 按档案描述她的道具来源（魔药课偷藏/家族传家/黑市），面板道具按钮按登记生效。

## 使用规则
- 玩家每轮对抗/双修最多使用 1 件道具（面板下拉选择，扣库存）。
- 她的道具由 AI 在叙事中驱动（如她恼羞成怒用束缚咒/迷情剂反制），面板按【她BUFF】或结算块应用。
- 道具不足 0 时面板置灰；购买/制作需在剧情中完成（霍格莫德/对角巷/魔药课），AI 在叙事中结算加隆与制作时间。

## 恢复机制
- 安神药剂：双修后魔力值 +15（面板应用）。
- 冥想/睡眠：过夜魔力值 +20、体力 +40；三餐 +10 体力；课间小憩 +5 体力。
- 福灵剂效果持续 1 场对抗，结束后失效。
