剧情_6年_第一学期:
  学年定位: 6年级 · NEWT年 · 第一学期（1996年9月~12月）· 混血王子篇·上
  原著事件坐标: 《混血王子》上半年——斯内普接任黑魔法防御术、哈利得到混血王子的课本、魂器的探索开始、德拉科的阴谋。战争从'阴影'变成'现实'：摄魂怪袭击、麻瓜遇害、魔法部易主（福吉下台，斯克林杰上台）。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 开学宴。邓布利多宣布斯内普教授接任黑魔法防御术（伊莎贝拉·诺斯教授被调去'协助傲罗办公室'——实为凤凰社的调任）。你看见伊莎贝拉在走廊尽头，她朝你点点头：'好好学。'
    - 9月第2周: 战争气息渗入校园：麻瓜研究课改讲'如何识别食死徒'；有人收到家书后红着眼眶离开大厅。塞西莉亚教授在黑板上写：'魔药课照常。战争也需要药剂师。'
    - 10月: 斯内普的魔药课（他把魔药课教成'混血王子'式的风格：'课本会骗你'）。他依然尖刻：'你熬的这是魔药还是泥浆？'——但你已不是一年级那个炸坩埚的新生了。
    - 11月: 邓布利多开始消失（找魂器）。城堡里流言四起。赫敏在图书馆通宵研究一本黑魔法书：'有些东西……在变少。'
    - 12月: 圣诞。战争阴云下的圣诞舞会：有人缺席（家人出事）、有人强颜欢笑、有人抓紧一切时间享受当下。谁在舞会中途拉着你躲到走廊尽头？

  本季主线弧:
    - 战争的日常化: 恐惧成为常态：黑魔标记出现在天空、食死徒的名字被报纸提及、'谁谁谁失踪了'成为走廊里的低语。恋爱在这种背景下格外认真——因为可能是最后一次。
    - 魂器的暗线: 邓布利多和哈利的秘密行动（背景）；你身边有人也在研究'不寻常的东西'（露娜·斯特兰德的黑色笔记本升级版）。
    - NEWT 的抉择: 六年级=毕业前的最后一年。选科、职业、'毕业后去干什么'——在战争里，'未来'是个奢侈的词。

  关键场景:
    - 斯内普的魔药课（尖刻的考验：他的'课本会骗你'哲学 vs 塞西莉亚的严谨风格）
    - 邓布利多失踪的夜晚（城堡的不安：谁在礼堂里低声讨论'校长去哪了'）
    - 圣诞舞会（战争下的最后一支舞：谁抓紧时间、谁欲言又止）
    - 黑魔标记之夜（天空中的绿色骷髅：全校的恐惧时刻，你身边是谁）

  女巫互动钩子:
    - 塞西莉亚·费恩: 斯内普接任 DADA 后，她成了'魔药系双璧'的另一半（她和斯内普学术竞争）。她私下给你开小灶：'斯内普教授的课本哲学有道理，但基本功是我的底线。'——师生线的信任加深。
    - 伊莎贝拉·诺斯: 她被调离校园（凤凰社任务），但会给你寄猫头鹰信（实战技巧、危险提醒）。信尾永远一句：'活着。'
    - 薇奥拉: 她父亲（魔法部官员）在新部长斯克林杰手下失势，家族开始焦虑。她在天文塔跟你说：'他们想让我退学，回家联姻。'——她第一次示弱。
    - 露娜·斯特兰德: 她的笔记本开始记录'消失的东西'：'课本在消失，记忆在消失，人在消失。'她的直觉让你不安。
    - 黛西: 她的一个亲戚（麻瓜）在摄魂怪袭击中受伤。她红着眼眶问你：'你说……这场战争会结束吗？'
    - 金妮: 她哥哥们都在凤凰社，她每天都在等猫头鹰。她变得沉默，但在有求必应屋练咒语练得更狠。
    - 赫敏: 她在研究魂器（从图书馆的禁书区）。她不会告诉你细节，但会说：'如果有一天我消失了……你会找我吗？'
    - 潘西: 斯莱特林的纯血家族开始站队（有人偷偷佩戴黑魔标记的饰品）。她父亲警告她'离那些格兰芬多远点'。她夹在中间。

  事件池（一次 1~2 个）:
    - 事件·斯内普的考验: 魔药课上的尖刻点评。你顶回去（他挑眉：'有胆量'，缴械值+5）/你沉默（他冷笑'还算聪明'）。塞西莉亚事后找你：'你跟斯内普教授顶嘴？……干得好。'
    - 事件·黑魔标记之夜: 深夜的绿色骷髅标记。全校恐慌。你身边的她（随机，好感度最高者优先）抓住你的手——那晚谁都没睡。
    - 事件·家书: 某位女巫收到不好的家书（家人受伤/失踪）。你安慰她=好感+10；她开始依赖你。
    - 事件·邓布利多的消失: 校长连续失踪两周。城堡流言四起，乌姆里奇时代的人们开始怀念邓布利多。谁在走廊里跟你说'邓布利多一定有他的理由'？
    - 事件·圣诞舞会: 战争下的舞会。谁在舞池中央抱住你（'别管别人怎么看了'）？谁在角落独自喝酒？

  关系推进线:
    - 好感度: 战争背景下的'珍惜当下'让关系快速升温（50~70 成为常态）；共度恐惧之夜（黑魔标记/家书）是最大增量。
    - 欲望积压: '不知道还有没有明天'的心态让亲密线大幅提速（堕落值 +15~25/学期）。
    - 缴械值: 斯内普的毒舌课+伊莎贝拉的信件训练让你保持成长。
    - 堕落值: 亲密对象 40~60；战争让'抓紧彼此'成为主流心态。

  学期结算:
    - NEWT 进度: 选科结果写入叙事记忆。
    - 伊莎贝拉线: 她的凤凰社任务线推进（下学期回归关键剧情）。
    - 魂器暗线: 露娜的笔记本+1（她比你以为的更接近真相）。
    - 学期结束: 时间.学期 → 第二学期。

</剧情_6年_第一学期>
