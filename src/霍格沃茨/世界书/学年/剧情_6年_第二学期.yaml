剧情_6年_第二学期:
  学年定位: 6年级 · NEWT年 · 第二学期（1997年1月~6月）· 混血王子篇·下
  原著事件坐标: 《混血王子》下半年——邓布利多之死、斯内普"背叛"、天文塔之战、霍格沃茨封锁。全书最沉痛的一学期：英雄陨落，战争全面打响。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。邓布利多的课越来越少，城堡里的气氛越来越紧。塞西莉亚教授在魔药课上突然说：'如果有一天我让你们跑，别问为什么，跑。'
    - 2月: 食死徒渗透的阴影：有人试图闯入城堡（背景事件），费尔奇的猫被下了咒。夜间巡逻加强，宵禁提前。
    - 2月14日: 情人节。战争下的情人节格外用力：谁在公共休息室给你留了一封信，'如果……我想让你知道'。
    - 3月: 伊莎贝拉·诺斯重伤归来（凤凰社任务）。她躺在校医院，见到你第一句话是：'我还活着，别哭。'——她的伤让你第一次直面战争的残酷。
    - 4月: 邓布利多最后一次召集学生（背景：他在寻找魂器的路上）。城堡里有人开始传：'校长在准备什么。'
    - 6月: 天文塔之夜（原著大事件，背景化处理）。邓布利多死于天文塔，斯内普叛逃，食死徒入侵城堡。那晚你不在塔上，但你在城堡里——你听到骚乱、看到绿光、握住身边人的手。天亮后，邓布利多的葬礼上，半个魔法界的人都来了。

  本季主线弧:
    - 英雄之死: 邓布利多的陨落让'战争'这个词第一次有了具体的重量。你作为见证者（不是参与者），处理你的恐惧、你的立场、你的身边人。
    - 信任的裂痕: 斯内普的"背叛"让所有人怀疑一切。谁信谁、谁怀疑谁、谁在恐慌中抓紧你。
    - 最后的校园时光: 下学期就是死亡圣器（大战），这学期是最后的平静。所有关系线在这里定格'战前状态'。

  关键场景:
    - 伊莎贝拉重伤归来（你的反应：心疼/愤怒/冷静——师生线的最终定型）
    - 天文塔之夜（背景大事件：你在城堡里的所见所感；你握住谁的手）
    - 邓布利多葬礼（半个魔法界的告别；谁站在你身边）
    - 学期末的沉默（全校都知道：下学期，不一样了）

  女巫互动钩子:
    - 伊莎贝拉·诺斯: 重伤归来。她在病床上把你训了一顿：'哭什么，我又没死。'然后递给你一个护身符：'傲罗同僚送的，借你。'——缴械值 100（她彻底认可你）的前置。
    - 塞西莉亚·费恩: 邓布利多之死让她罕见地失态。她在办公室独自坐了一夜，天亮后你送热茶，她接过茶杯说：'谢谢你。'——她的壳裂开一条缝。
    - 赫敏: 她哭了——这是你第一次见她哭。她抓着你的袖子：'他（邓布利多）不该……'战争里最坚强的人也需要依靠。
    - 金妮: 她哥哥们的凤凰社成员身份让她成为食死徒的潜在目标。天文塔之夜后她彻夜未眠，第二天照常训练：'我不能停下来。'
    - 露娜·斯特兰德: 她对邓布利多之死只说了一句：'他去追星星了。'然后她看着你：'你也要小心。'
    - 薇奥拉: 邓布利多死后她父亲（魔法部官员）被食死徒施压。她红着眼眶问你：'如果我要离开城堡……你会来找我吗？'
    - 黛西: 天文塔之夜她吓得发抖，抓住你的手一整夜。天亮后她小声说：'谢谢你……让我觉得不是一个人。'
    - 潘西: 斯内普"叛逃"让斯莱特林颜面扫地。她罕见地沉默。你遇见她独自在走廊，她别过脸：'别同情我。'
    - 拉文德: 她在邓布利多葬礼后给你占卜，手在抖：'星星说……战争会结束的。'她没说后半句。

  事件池（一次 1~2 个）:
    - 事件·伊莎贝拉归来: 校医院的探病。她教你一个实战技巧作为'谢礼'：'你要是死了，我在傲罗办公室会被人笑话。'
    - 事件·情人节信: '如果……我想让你知道'的信。读信、回信、或者假装没收到——三线三后果。
    - 事件·天文塔之夜: 你不在塔上。你在城堡的某个角落（选择：礼堂/走廊/宿舍/有求必应屋），听到骚乱时你握住谁的手。那一夜的选择定义你的关系线。
    - 事件·葬礼上的重逢: 邓布利多葬礼上，你遇到暑假后再见的人（伊莎贝拉/塞西莉亚/某位女巫的家人）。'下学期还回来吗？'——一个没有答案的问题。
    - 事件·封锁前的疯狂: 学期末，全校知道下学期要变天了。谁在深夜拉你到禁林边/空教室/天文塔，做'战前最后的疯狂'？

  关系推进线:
    - 好感度: 重大创伤下的相互依靠（60~85）；天文塔之夜是决定性瞬间（谁握住你的手=关系主线的最终确认）。
    - 堕落值: 战争+恐慌+末日心态=亲密线完全放开（60~80）；'最后一次'的心态让所有防线崩塌。
    - 缴械值: 伊莎贝拉的认可线收官（她护身符=认可）。
    - 欲望积压: 所有人在恐惧中寻求慰藉；深夜的城堡到处都是"抓紧时间"的男女。

  学期结算:
    - 关系定格: 谁在邓布利多葬礼后站你身边=你的'战前关系状态'（写入叙事记忆，死亡圣器篇沿用）。
    - 伊莎贝拉线: 护身符+她的承诺（'暑假后我回来找你'）。
    - 战争状态: 霍格沃茨将在下学期被食死徒控制（死亡圣器篇背景）。
    - 学期结束: 时间.学期 → 假期；这个暑假将是'逃亡与婚礼'的暑假（死亡圣器开篇）。

</剧情_6年_第二学期>
