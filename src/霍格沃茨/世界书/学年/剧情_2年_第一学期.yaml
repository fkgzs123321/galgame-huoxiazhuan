剧情_2年_第一学期:
  学年定位: 2年级 · 密室篇·上（1992年9月~12月）· 蛇怪的阴影
  原著事件坐标: 《密室》上半年——开学即乱（家养小精灵多比拦路）、费尔奇的猫被石化、墙上血字"密室已被打开"、学生接连被石化、金妮·韦斯莱被日记（汤姆·里德尔的日记，伏地魔的魂器）控制。洛哈特教授（花架子）任教黑魔法防御术。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 开学。火车上多比警告哈利（背景）；你发现金妮·韦斯莱抱着一个旧日记本——她说是'从旧书堆里捡的'，眼睛下有黑眼圈（她最近总睡不好）。
    - 9月第2周: 洛哈特教授登场。他穿着丁香紫长袍，让全班做"洛哈特能力测试"——你答对了他的生日，他感动得差点给你签名照。伊莎贝拉教官在走廊目睹全程，评价只有一个字：'啧。'
    - 10月: 万圣节后，洛丽丝夫人被石化，墙上出现血字。全校恐慌。费尔奇疯了似的到处抓人——他怀疑所有人，包括你。
    - 11月: 学生接连被石化（科林·克里维、尼克爵士等）。金妮的状态越来越差：她开始说梦话、在盥洗室哭、在日记本上写个不停。你在走廊遇见她，她勉强笑了一下：'我没事。'
    - 12月: 圣诞。留校的人变少了（家长接走孩子）。金妮也在留校名单上——她父母担心她的'精神不好'。她红着眼眶跟你说：'我总觉得……有什么东西在让我做我不愿意做的事。'

  本季主线弧:
    - 密室的恐慌: 石化事件笼罩全校。恐惧之下，谁靠近你、谁疏远你、谁在深夜找你说话——恐慌是关系的试金石。
    - 金妮的异常: 她被日记控制的伏笔（你能否察觉？）——她开始'不记得'自己做过的事（血字是她夜里写的，她不知道）。
    - 洛哈特的笑话: 花架子教授让所有人（包括女巫们）私下吐槽——共同吐槽是最快的破冰。

  关键场景:
    - 血字出现之夜（你在场/你不在场；全校恐慌时你身边的她）
    - 洛哈特课堂的闹剧（全班憋笑：谁先笑出声）
    - 金妮的异常（你发现她不对劲的时刻）
    - 圣诞夜的谈话（金妮的'我总觉得……'）

  女巫互动钩子:
    - 金妮: 核心暗线。你注意到她抱着日记本/她深夜在盥洗室哭/她说'我不记得自己做过什么'。你选择：追问（她抗拒）、陪伴（她靠在你肩上哭）、告诉教授（赫敏也在调查——你们交换情报）。
    - 赫敏: 她开始调查密室（在图书馆翻《霍格沃茨：一段校史》）。她拉着你当助手：'你观察力不错。'——学霸同盟升级。
    - 露娜·斯特兰德: 拉文克劳的传闻她最先知道：'他们说蛇怪的眼睛会杀人。'——她的直觉+1。
    - 黛西: 石化恐慌让她害怕：'万一下一个是我……'她晚上不敢一个人走走廊，你陪她——依赖感加深。
    - 潘西: 斯莱特林在恐慌中反而优越：'密室是斯莱特林的传说。'她看格兰芬多的眼神带着'活该'——但金妮被波及（韦斯莱家）时她没笑。
    - 薇奥拉: 她父亲来信让她别掺和。她表面听劝，但深夜会在图书馆翻'密室'相关的书——她好奇。
    - 拉文德: 她断言'是幽灵干的'，然后被尼克爵士吓哭。她躲在你身后：'你、你保护我！'

  事件池（一次 1~2 个）:
    - 事件·血字之夜: 你目睹墙上的血字出现（金妮在梦游写下的——你在场看到了'她'？）。你选择：叫醒她（她茫然不知）/告诉赫敏（调查线+1）/隐瞒（保护她，但伏笔加深）。
    - 事件·石化危机: 你认识的人被石化（随机）。你探望她/她的反应（昏迷中无法回应——你第一次感到无力）。
    - 事件·洛哈特的'勇敢测试': 他让学生"勇敢地"摸他带来的'危险生物'（其实是驯化的）。你被点名。你摸/你拒绝——女巫们的反应各异。
    - 事件·禁林线索: 露娜说禁林边缘有'巨大的蜘蛛壳'（八眼巨蛛蜕壳——海格养阿拉戈克的伏笔）。你们'恰好'路过海格的南瓜地。
    - 事件·金妮的日记: 你看到金妮的日记本（她落下的）。翻开？不翻开？——选择决定你是否提前发现魂器暗线。

  关系推进线:
    - 好感度: 15~25；恐慌中的陪伴（陪黛西走走廊/陪金妮说话）加成 +5~10。
    - 欲望度: 恐慌气氛下的'抱团取暖'——深夜的陪伴开始带上体温。
    - 缴械值: 伊莎贝拉教官的课外实战（她开始教一年级'保命咒'：'恐慌时用这个'）。
    - 堕落值: 0~5。

  学期结算:
    - 密室内线: 你的调查进度（知道多少/告诉谁）。
    - 金妮线: 她的异常记录（你发现了什么）。
    - 学期结束: 时间.学期 → 第二学期（密室篇·下：决战）。

</剧情_2年_第一学期>
