<剧情_5年_第二学期>
剧情_5年_第二学期:
  学年定位: 5年级 · OWL年 · 第二学期（1996年1月~6月）· 凤凰社篇·下
  原著事件坐标: 《凤凰社》下半年——乌姆里奇全面掌权（校长夺权）、D.A. 暴露、神秘事务司之战、邓布利多归来与伏地魔公开。本学期是全书最压抑也最激烈的学期：OWL 考试在即，战争阴影压顶。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。乌姆里奇签发了新校规：'学生结社需经批准'。D.A. 转入地下，集会地点改到有求必应屋的更深处。
    - 1月下旬: 乌姆里奇开始'调查'伊莎贝拉·诺斯：连续三周旁听她的课，在笔记本上写个不停。伊莎贝拉教官的教案越写越硬：'她要看，就让她看真本事。'
    - 2月: OWL 模拟考+魁地奇被正式取消。城堡里怨声载道，但无人敢公开反抗——除了某个人在走廊贴了一张'乌姆里奇长着癞蛤蟆脸'的纸条（恶作剧事件，全校传遍）。
    - 2月14日: 情人节。乌姆里奇宣布'OWL 年不庆祝情人节'，但猫头鹰照常带来粉色的信——有人偷偷寄的，字迹是某位女巫的。
    - 3月: 乌姆里奇宣布自己为'校长'（邓布利多被赶出城堡）。全校震惊之夜，格兰芬多公共休息室安静得可怕。伊莎贝拉教官在教师休息室的门上留了一句话，第二天全校都看见了。
    - 4月: D.A. 暴露。猫头鹰通风报信（玛丽埃塔·艾克莫，原著背景），乌姆里奇带人堵住有求必应屋。你在场/你逃脱/你被抓——三条路线。伊莎贝拉教官此时做了一件让全校意外的事：她站出来说是她的'课外辅导'。
    - 5月: OWL 考试周+神秘事务司的暗流。考试期间的午夜，禁林边有马蹄声（马人）。伊莎贝拉私下告诉你：'有些事，比考试重要。'
    - 6月: 神秘事务司之战（背景事件）。邓布利多与伏地魔的决斗在魔法部上演，你不在场，但第二天《预言家日报》的头条改变了一切：'伏地魔回来了'。学期在震惊中结束。

  本季主线弧:
    - 镇压与反抗的终局: 乌姆里奇的独裁、D.A. 的暴露、伊莎贝拉的牺牲——你在这条线里的选择定义你的品格。
    - 战争的真相: '伏地魔回来了'——谎言的戳穿让所有人重新评估立场。谁害怕、谁坚定、谁动摇。
    - OWL 与毕业的倒计时: 考试、成绩、未来——在战争阴影下，'毕业'第一次有了'可能没有以后'的重量。

  关键场景:
    - D.A. 暴露之夜（被抓/逃脱/掩护三线：谁为你顶罪、你为谁顶罪）
    - 乌姆里奇夺权夜（邓布利多离开城堡，走廊里学生的沉默）
    - 伊莎贝拉的牺牲（她为学生扛下处分：'我的课，我负责'）
    - OWL 考试周（压力+战争的余波；考完最后一科的黄昏）
    - 学期末的'伏地魔回来了'（所有人重新面对世界）

  女巫互动钩子:
    - 伊莎贝拉·诺斯: 她为你（和 D.A.）扛下乌姆里奇的处分，被停职观察。她临走前拍拍你肩膀：'别浪费我教你的东西。'——缴械值/服气度的最大转折点。
    - 塞西莉亚·费恩: 乌姆里奇想让她'作证'指认伊莎贝拉，她拒绝了。她在走廊遇见你时说：'有些事，魔药学教不了，但做人要会。'——师生线从'欣赏'转向'信任'。
    - 赫敏: D.A. 暴露后她自责（'是我的签名名单'）。她会在天文塔上跟你道歉，然后说：'但我不会后悔。'
    - 金妮: 她帮你从乌姆里奇的办公室偷回被没收的魔杖。她的胆量让你重新认识她。
    - 露娜·斯特兰德: 被乌姆里奇关禁闭时她在墙上画了虻的图案。她对你说：'没关系，它们会飞走的。'——她的超然让你在混乱中平静。
    - 薇奥拉: 她父亲的立场（魔法部官员）和她的内心矛盾在'伏地魔回来了'那天爆发：'我父亲说那是谎言……但我信邓布利多。'
    - 黛西: OWL 考试压力崩溃，她在盥洗室哭。你安慰她，她抓住你的袖子：'要是……明年我不在了，你还会记得我吗？'
    - 潘西: 斯莱特林在'伏地魔回来了'后气氛微妙（部分纯血家庭倾向黑魔王）。她第一次露出迷茫：'我不知道我该信谁。'
    - 拉文德: 她在考试周给你占卜：'星星说，你会活过这场战争。'——她很少那么认真。

  事件池（一次 1~2 个）:
    - 事件·恶作剧纸条: 走廊贴出'乌姆里奇长着癞蛤蟆脸'的纸条。全校传遍，无人承认。乌姆里奇要追查——你知情/你写的/你帮她查（三线）。
    - 事件·D.A. 暴露之夜: 被抓（你顶罪：缴械值+20、全校尊敬你、伊莎贝拉替你扛）/逃脱（你掩护别人，某人记住你）/不在场（你事后帮她善后）。
    - 事件·偷魔杖行动: 金妮拉你潜入乌姆里奇办公室偷回被没收的魔杖。柜子里你翻到一份文件：'关于学生……的调查报告'——乌姆里奇在调查所有'可能不听话'的学生，你的名字在上面。
    - 事件·伏地魔归来之日: 6月的《预言家日报》头条。城堡里的反应：有人哭、有人笑、有人发呆。你身边的她抓住你的手——谁？
    - 事件·禁林马人: OWL 考试周的午夜，禁林边的马蹄声。马人费伦泽（原著背景）出现，看着你说：'你身上有星星的印记。'（伏笔）

  关系推进线:
    - 好感度: 患难见真情——D.A. 暴露/考试周/伏地魔归来三大事件是最大增量（+10~20）；共犯关系（偷魔杖/顶罪）形成最深的羁绊。
    - 缴械值: 伊莎贝拉的'最后一次辅导'、D.A. 实战、你的立场选择。
    - 堕落值: 战争阴影下，'及时行乐'的心态让亲密线提速（'谁知道还有没有明天'）。
    - 欲望积压: 压抑+恐惧+青春，深夜的慰藉比平时更炽烈。

  学期结算:
    - OWL 成绩: 按学业分+考试事件判定；全科≥E 升六年级。
    - 立场定调: 你在'伏地魔回来了'后的选择（坚定/动摇/恐惧）写入叙事记忆。
    - 伊莎贝拉线: 她被停职观察——下学期是否回归，取决于魔法部的态度（混血王子篇伏笔）。
    - 学期结束: 时间.学期 → 假期；暑假=凤凰社的聚集地（格里莫广场的传闻）。

</剧情_5年_第二学期>
