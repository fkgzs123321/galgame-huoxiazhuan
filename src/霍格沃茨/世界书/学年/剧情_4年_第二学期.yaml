<剧情_4年_第二学期>
剧情_4年_第二学期:
  学年定位: 4年级 · 火焰杯篇·下（1995年1月~6月）· 黑暗降临
  原著事件坐标: 《火焰杯》下半年——第二个项目（湖）、第三个项目（迷宫）、塞德里克·迪戈里之死、伏地魔复活（墓地）、假穆迪被捕。1995 年 6 月 24 日的夜晚改变了魔法界——你 17 岁，你在场（在城堡里，不在墓园）。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。第二个项目的传闻：'要进黑湖'。高年级勇士开始水下训练，看台上围满人。
    - 2月: 第二个项目（湖）。勇士们在水下救人质。你认识的人质（原著：罗恩/赫敏/芙蓉妹妹/克鲁姆）——你在看台上攥紧栏杆。
    - 3月: 假穆迪越来越奇怪（他'帮'哈利的方式透着不对劲）。伊莎贝拉教官的直觉越来越强：她私下问你：'你有没有觉得……穆迪教授哪里不对？'
    - 4月: 第三个项目前奏。迷宫在魁地奇场拔地而起——树篱高得像墙。气氛开始压抑。
    - 5月: 期末考+三强最后一个项目倒计时。城堡里的低语：'塞德里克说迷宫里有怪东西。'
    - 6月24日: 第三个项目（迷宫）之夜。全校围在魁地奇场看魔法投影。然后——塞德里克和哈利触杯，消失了。再然后，哈利独自回来，抱着塞德里克的尸体。**全场死寂，然后尖叫。** 你在人群中，你身边的她（按好感度最高者）死死抓住你的手臂，指甲掐进肉里。那一夜，所有人都长大了。
    - 6月25日: 真相：伏地魔复活了。邓布利多宣布，魔法部否认（福吉部长'他没有回来'）。城堡在震惊与恐惧中结束学年。

  本季主线弧:
    - 塞德里克之死: 你第一次亲眼见证死亡（他 17 岁，和你同龄）。世界观彻底改变：这不是书里的故事，这是会死人的世界。黛西（赫奇帕奇）的崩溃——塞德里克是她的同院学长。
    - 伏地魔复活: '他回来了'——所有人都知道，但魔法部说'没有'。信任的裂缝：你信谁？（邓布利多/魔法部/你的直觉）
    - 暑假的阴影: 这个暑假不会有悠闲——食死徒开始活动（麻瓜袭击）。你的关系线第一次面临'战争'的现实。

  关键场景:
    - 迷宫之夜（全校的投影屏幕：绿光、消失、回归、尸体）
    - 塞德里克之死后的黎明（你身边的她）
    - 学期末的'伏地魔回来了'（邓布利多的演讲/魔法部的否认）

  女巫互动钩子:
    - 黛西: 塞德里克是赫奇帕奇的骄傲。她哭了一整夜。你陪她——她抓着你的袖子：'他、他明年就要毕业了……'她的依赖从此不同（好感+15）。
    - 赫敏: 她知道更多内情（哈利告诉她的）。她罕见地沉默了几天，然后跟你说：'这个世界……比书里写的危险得多。'——她的理性外壳裂开。
    - 金妮: 塞德里克之死让她想起密室。她夜里不敢睡。你陪她到天亮——她靠在你肩上：'会好起来的，对吗？'（你的回答定义她的安心程度）
    - 露娜·斯特兰德: 她看着夜空说：'星星在移动。'——她的直觉已经预见了战争的走向。
    - 薇奥拉: 她父亲（魔法部官员）打电话来说'没事'，但她听出他声音发虚。她对你说：'大人也在害怕。'——她的'大小姐'外壳第一次松动。
    - 潘西: 塞德里克死后斯莱特林也有人沉默（他不是斯莱特林，但他是'霍格沃茨的'）。她在走廊里站着没动，你没打扰她——她记住了你的分寸。
    - 伊莎贝拉·诺斯: 她参与了塞德里克遇害后的初步调查。她回来说了一句：'我见过太多尸体，但那是孩子。'——她的旧伤被你看到。

  事件池（一次 1~2 个）:
    - 事件·迷宫之夜: 你在人群中，投影屏幕上的绿光。你身边的她（好感度最高者）抓住你的手臂。你握住她的手——那一握，是战前最后的'和平'。
    - 事件·黎明陪伴: 塞德里克之死后，谁需要你陪（黛西/金妮/赫敏——按好感度最高者优先）。你陪她的方式定义关系深度。
    - 事件·邓布利多的演讲: 他在学期末宣布'伏地魔回来了'。你的反应（相信/怀疑/恐惧）写入叙事记忆。
    - 事件·暑假阴影: 假期前的站台，谁跟你说'开学见'时眼神不一样了（带着'可能会出事'的担忧）。
    - 事件·穆迪的落网: 假穆迪被揭穿（小巴蒂·克劳奇）。伊莎贝拉教官事后跟你说：'我的直觉没骗我。'——你开始信任她的判断。

  关系推进线:
    - 好感度: 35~50；黎明陪伴是学期最大事件（+15~20）。
    - 欲望度: 死亡与恐惧面前的'抓紧彼此'——青春期的关系第一次有了'沉重'的重量。
    - 缴械值: 伊莎贝拉教官的信任升级（她开始把你当'可托付的人'）。
    - 堕落值: 15~25（战争阴影下的心态变化）。

  学期结算:
    - 战争状态: '伏地魔回来了'写入世界观（五年级=凤凰社篇前置）。
    - 关系沉淀: 黎明陪伴的对象=你的'战前最亲近的人'。
    - 暑假: 这个暑假=食死徒活动的开始（麻瓜袭击传闻）；五年级开学见。
    - 学期结束: 时间.学期 → 假期；升五年级（凤凰社篇！）。

</剧情_4年_第二学期>
