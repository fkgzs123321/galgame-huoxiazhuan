<剧情_7年_第一学期>
剧情_7年_第一学期:
  学年定位: 7年级 · 毕业年 · 第一学期（1997年9月~12月）· 死亡圣器篇·上
  原著事件坐标: 《死亡圣器》上半年——霍格沃茨被食死徒控制（斯内普任校长）、学生逃亡、哈利三人组找魂器、比尔与芙蓉的婚礼、潜入魔法部。你 17 岁（成年）——战争不会等任何人。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 霍格沃茨"开学"——但学校已被食死徒控制。斯内普任校长，卡罗兄妹（阿米库斯/阿莱克托）教黑魔法防御术（内容：钻心咒的"理论"）。你的名字在"血统审查"名单上（混血=二等公民）。
    - 9月: 你没有回城堡（背景：死亡圣器里七年级学生很多没返校）——但你身边的女巫呢？有人被迫返校（家人被施压）、有人逃了出来、有人留在你身边。这一年，关系线第一次离开城堡展开。
    - 10月: 逃亡与藏匿。食死徒搜捕麻瓜出身者：黛西（混血）面临登记；赫敏的家人（牙医夫妇）失踪（原著背景：她修改了父母的记忆）。
    - 11月: 潜入魔法部（背景事件：哈利三人组的行动）。你从报纸上看到'魔法部易主'，也看到'失踪名单'越来越长。
    - 12月: 战时圣诞。没有舞会、没有礼物——只有躲藏。但炉火边的拥抱比任何时候都暖。谁在你身边度过这个圣诞？

  本季主线弧:
    - 战争下的离散: 城堡不再是避风港。你和你关心的女巫们四散各地：谁在躲藏、谁在反抗、谁被迫低头。你的选择：保护谁、寻找谁、跟随谁。
    - 身份的重压: 血统审查、登记令、'你在名单上'——混血出身的你第一次直面歧视。女巫们的反应：有人护你、有人犹豫、有人崩溃。
    - 圣器的暗线: 老魔杖、复活石、隐身衣的传说在战火中流传（背景）。露娜·斯特兰德在逃亡路上给你讲三兄弟的故事：'传说……是真的吗？'

  关键场景:
    - 开学日的抉择（回城堡/不回——战时的自由选择）
    - 血统审查的羞辱（你或她面对卡罗兄妹的盘问）
    - 战时圣诞（躲藏处的炉火：谁在你身边）
    - 失踪名单（恐惧的具象化：你认识的名字出现在报纸上）

  女巫互动钩子:
    - 黛西: 麻瓜出身登记令下的恐惧。她躲在霍格莫德/你家，夜里做噩梦。她抓着你的手：'你会保护我的，对吗？'
    - 赫敏: 她（背景）和父母告别后变得沉默而决绝。她在逃亡路上给你写信：'如果我不在了，帮我照顾……'（她没说下去）
    - 金妮: 她被迫返校（哥哥们都在凤凰社，她当联络员）。她通过猫头鹰给你传情报，字迹越来越潦草：'城堡里很糟。'
    - 露娜·斯特兰德: 她被食死徒抓走（原著背景）又逃出来。她找到你时蓬头垢面，第一句话是：'我把虻都甩掉了。'你抱住她时她在发抖。
    - 塞西莉亚·费恩: 她留在城堡（教师被要求效忠）。她通过隐秘渠道给你捎信：'魔药库存正在被清点。'——她成了你的内应。
    - 伊莎贝拉·诺斯: 她加入凤凰社的正式战斗编制。你偶遇她（她在执行任务），她只说了一句：'活着，其他的以后再说。'
    - 薇奥拉: 她父亲被食死徒控制（纯血家族站队压力）。她逃出来找你，红着眼眶：'我家……把我卖了。'——她彻底失去了'大小姐'的依靠。
    - 潘西: 斯莱特林的立场分裂。她父亲公开支持黑魔王。她给你写信（通过秘密渠道）：'我不认同他们。'——她的选择让她众叛亲离。
    - 拉文德: 她在逃亡中依然占卜：'星星说……你身边有个人会保护你。'她说的是她自己。

  事件池（一次 1~2 个）:
    - 事件·血统审查: 你在对角巷/霍格莫德被食死徒盘问血统。你身边的女巫挡在你面前：'他跟我一起的。'——谁为你挺身而出？
    - 事件·藏身处: 你决定收留/投奔谁（黛西/薇奥拉/露娜/拉文德——选择决定关系线的战场）。
    - 事件·城堡内应: 塞西莉亚的密信：'他们要清点魔药库存了，你的东西我藏好了。'——她冒着风险护你。
    - 事件·战时圣诞: 躲藏处的平安夜。谁陪你守夜？谁在钟声敲响时握住你的手？
    - 事件·失踪名单: 报纸上的名字。你认识的人失踪了——你去找他/她（或她来找你）。

  关系推进线:
    - 好感度: 生死相依的战场关系（70~90）；共患难的每个事件都是 +10~20。
    - 堕落值: '不知道有没有明天'的末日心态=完全放开（80~95）。
    - 缴械值: 实战中成长（伊莎贝拉的训练在战场上兑现）。
    - 欲望积压: 恐惧中的肌肤之亲是唯一的慰藉；战时亲密的描写可以更炽烈、更绝望、更真实。

  学期结算:
    - 阵营: 你实际加入哪一方（凤凰社外围/中立自保/被迫低头）写入叙事记忆。
    - 收留关系: 你保护/被保护的女巫名单（死亡圣器篇·下的大战前置）。
    - 圣器暗线: 三兄弟的传说+1。
    - 学期结束: 1998 年春，大战临近。

</剧情_7年_第一学期>
