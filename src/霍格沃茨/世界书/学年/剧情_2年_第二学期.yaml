剧情_2年_第二学期:
  学年定位: 2年级 · 密室篇·下（1993年1月~6月）· 蛇怪与日记
  原著事件坐标: 《密室》下半年——赫敏被石化（她先查到了蛇怪线索）、金妮被日记拖入密室、哈利与蛇怪决战（格兰芬多宝剑）、日记被销毁、卢修斯·马尔福被揭发。你不在密室里（哈利在），但你在城堡里经历了全过程：赫敏的倒下、金妮的失踪、所有人的恐惧。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。恐慌持续。赫敏开始'消失'（她在调查蛇怪，找到了'蜘蛛逃离禁林'的线索）。
    - 2月: 赫敏被石化。她在图书馆倒下，手里攥着撕下来的书页（'蛇怪……管道……'）。你赶到时她已经被抬走——你握住她冰凉的手，她毫无反应。这是你第一次直面'魔法世界会伤人'。
    - 3月: 金妮失踪。她消失的那晚，你'恰好'在她宿舍附近听到异响（她被日记拖进密室的通道）。你敲门没人应，推门看到她的日记本掉在地上——你捡起它，感受到一股寒意。
    - 4月: 密室的解决（原著）。哈利在密室用宝剑杀死蛇怪、毁掉日记；金妮获救。你不在现场，但你在城堡里等了一整夜——天亮时金妮被抱出来，脸色惨白，但活着。
    - 5月: 卢修斯·马尔福被揭发（他把日记塞进金妮的坩埚），被校董会除名。多比获得自由。城堡解除恐慌。
    - 6月: 学期末。被石化的学生全部苏醒（曼德拉草复活药剂——塞西莉亚教授参与熬制）。赫敏醒来后的第一句话是问考试成绩。金妮开始恢复，但她变了——更沉默，更怕黑。

  本季主线弧:
    - 恐慌的顶点与解除: 石化→失踪→决战→复苏——你作为'城堡里的见证者'经历全程。谁在恐慌中依赖你、谁在事后感谢你、谁记住你深夜的陪伴。
    - 金妮的创伤与你的位置: 她获救后陷入沉默。你捡到过她的日记、你陪过她深夜说话——她是'需要你的人'。
    - 赫敏的石化: 她醒来后你们的关系线有了新底色（她昏迷时你握过她的手——她听说了，没提，但看你的眼神变了）。

  关键场景:
    - 赫敏被石化的那一刻（你握住她的手）
    - 金妮失踪之夜（你捡到日记本的寒意）
    - 密室解决后的黎明（你等了一夜的人）
    - 学期末的复苏（赫敏醒来/金妮的沉默）

  女巫互动钩子:
    - 金妮: 核心线。获救后的她：夜里不敢关灯/白天强装没事/在某次魁地奇训练后崩溃。你陪她——她从'同学'变成'依赖你的人'（好感+15，密室线专属）。
    - 赫敏: 她醒来后知道你在她昏迷时守过她（别人告诉她的）。她别扭地道谢：'听说……你来看过我。'——学霸的害羞。
    - 黛西: 恐慌高峰她躲你身后：'我害怕。'你陪她度过最难的一周——依赖感加深。
    - 露娜·斯特兰德: 她在金妮失踪那晚'看到'了管道里爬过什么东西（蛇怪）。她跟你说：'它在地下。'——她的直觉从未出错。
    - 塞西莉亚·费恩: 她熬了三个通宵的曼德拉草复活药剂。你'恰好'给她送夜宵，她接过来没说话，但第二天课上她第一次对你笑了。
    - 伊莎贝拉·诺斯: 密室期间她自请巡逻（前傲罗的本能）。她教你'听到动静先跑'：'勇敢是好事，但活着才能继续勇敢。'
    - 潘西: 密室结束后斯莱特林被全校侧目（斯莱特林的怪物）。她罕见地沉默。你在走廊遇见她，她没挑衅，只是走过——她的傲慢出现了裂缝。

  事件池（一次 1~2 个）:
    - 事件·赫敏的石化: 你在场/你赶到。握住她的手的那几秒，是你们关系的转折点（好感+10，她醒来后态度软化）。
    - 事件·日记本的寒意: 你捡到金妮的日记。翻开（看到'汤姆·里德尔'的自我介绍，寒意+1）/交给教授（赫敏的调查线+1，金妮获救后你成了'救她的人'之一）。
    - 事件·黎明等待: 金妮获救的黎明，你在城堡门口等到天亮。她看到你时眼神的变化（她记住了）。
    - 事件·复苏的拥抱: 学期末被石化者苏醒。赫敏醒来后看到你，第一句话是：'你……一直在这？'
    - 事件·暑假阴影: 金妮暑假前跟你说：'我暑假……可能不给你写信了。我需要……一个人待着。'——她的创伤线延续到三年级。

  关系推进线:
    - 好感度: 金妮 25~35（密室线专属加成）；赫敏 20~30（石化事件）；其余自然波动。
    - 欲望度: 恐慌后的'劫后余生'心态——学期末的城堡弥漫着'活着真好'的氛围，亲密线开始萌芽。
    - 缴械值: 伊莎贝拉的'保命咒'训练成果。
    - 堕落值: 5~10。

  学期结算:
    - 密室线: 你的参与度（日记/等待/陪伴）写入叙事记忆。
    - 金妮线: 她的创伤状态（三年级继续）。
    - 赫敏线: 石化事件的影响（她记住你了）。
    - 学期结束: 时间.学期 → 假期（暑假）；升三年级。

</剧情_2年_第二学期>
