剧情_假期:
  学年定位: 假期 · 战争中的假期（1996 夏/1997 冬/1998 春）
  总览: 战时的假期没有悠闲——只有逃难、婚礼、躲藏和偷来的温情。但正是这样的假期，让'在一起'变得比任何时候都珍贵。假期按当前学年自动适配：5 年级暑假=凤凰社聚集的夏天；6 年级暑假=逃亡与婚礼；7 年级=大战前的最后圣诞。

  时间轴（按剧情自然推进，勿跳步）:
    - 暑假（1992年夏·1年级后）: 魔法石事件后的第一个暑假。通信季开始：谁给你写信、谁邀请你去做客（韦斯莱家/赫奇帕奇家的温暖）。对角巷的采购还很和平——这是战前最后的悠闲暑假。
- 暑假（1995年夏·4年级后）: 凤凰社的夏天。格里莫广场（背景）成为据点。对角巷的采购变成冒险：食死徒的第一次袭击发生（麻瓜区）。假期里谁跟你通信、谁邀请你去做客、谁家成了你的避风港？
    - 暑假（1997年夏·6年级后）: 比尔与芙蓉的婚礼（原著背景）。婚礼上魔法部的坠落：食死徒袭击婚礼，宾客四散。你在混乱中抓住谁的手逃跑？
    - 寒假（1997年冬·7年级）: 战时的圣诞。没有霍格莫德、没有舞会。但炉火边的拥抱比任何舞会都暖。谁和你一起躲过了这个圣诞？
    - 战后（1998年夏·毕业）: 重建的夏天。对角巷重新开张、城堡开始修复。阳光第一次看起来像阳光。

  本季主线弧:
    - 假期的战争化: 每一段假期都有对应的战时事件（婚礼袭击/麻瓜袭击/躲藏）。关系线在'逃难'中加速——共同逃亡是最快的亲密。
    - 家庭的试炼: 假期是见家长/见家族的时候。纯血家族的宴会（薇奥拉/潘西的家族）、温暖的家庭（黛西/金妮）、破碎的家庭（露娜/赫敏）——你的位置定义关系深度。
    - 通信的珍贵: 战时猫头鹰通信是生命线。谁的信救过你的命/让你撑过最难的一夜？

  关键场景:
    - 对角巷战前采购（最后一次和平的逛街）
    - 比尔与芙蓉的婚礼（原著名场面：婚礼被袭，宾客四散）
    - 战时圣诞夜（躲藏处的炉火）
    - 战后对角巷重开（新生）

  女巫互动钩子:
    - 伊莎贝拉: 暑假她带你去凤凰社的训练点（傲罗的临时营地）。她在实战中教你'活命优先'。
    - 塞西莉亚: 暑假她留在城堡（或圣芒戈帮忙）。她给你寄来一瓶'保命药剂'，附言：'应急用。别乱喝。'
    - 黛西: 她家收留你过暑假（温暖的赫奇帕奇家庭）。她妈妈做的馅饼，她给你留的最大块。
    - 薇奥拉: 她的家族宴会邀请你——纯血贵族的审视、她父亲的试探。她全程握着你的手（在桌下）。
    - 潘西: 她家族的选择让她痛苦。暑假她给你写信（用麻瓜邮箱，隐蔽）：'有时候我真希望我不是帕金森。'
    - 金妮: 暑假她在陋居（韦斯莱家）。她邀请你去玩（如果你和她够熟）——韦斯莱家的热闹是战前最后的烟火气。
    - 赫敏: 暑假她在格里莫广场（凤凰社据点）。她看到你时眼神复杂：'你不该来这儿。'但她给你留了房间。
    - 露娜: 暑假她在爸爸的《唱唱反调》编辑部。她给你寄了一份'特别报道'：'关于你，我只写了好事。'

  事件池（一次 1~2 个）:
    - 事件·婚礼袭击（6年级后暑假）: 比尔与芙蓉的婚礼上食死徒来袭。你拉住谁的手逃跑？逃亡的几天几夜里，关系线极速升温。
    - 事件·对角巷袭击（5年级后暑假）: 麻瓜区的食死徒袭击（原著背景）。你和她被困在巷子里，你护住她的那一刻。
    - 事件·家族宴会: 纯血家族宴会的审视。你以什么身份出席（朋友/男友/被质疑的外人）——薇奥拉或潘西的家族线。
    - 事件·战时圣诞: 躲藏处的平安夜。谁陪你守夜？交换了什么礼物（手织围巾/保命药剂/一块糖）？
    - 事件·战后重开: 1998 夏的对角巷重开。阳光下的第一杯黄油啤酒——和谁一起？

  关系推进线:
    - 好感度: 假期事件（婚礼逃亡/家族宴会/战时圣诞）是暑假最大增量（+10~20）。
    - 冷落惩罚: 假期零互动的对象好感按规则回落（-3~5/月）——战争时期更明显（'他还活着吗'的失联焦虑）。
    - 堕落值: 无亲密自然回落；但战时重逢的亲密格外炽烈。
    - 通信: 假期通信频率=关系温度计（一天一封=热恋/一周一封=稳定/没信=危险）。

  学期结算:
    - 假期事件: 写入叙事记忆（婚礼逃亡的同伴/家族宴会的立场/战时圣诞的守夜人）。
    - 开学状态: 假期结束 → 时间.学期=第一学期；7 年级毕业 → 战后余生结局判定。
    - 生存确认: 每个假期结束前，确认'谁还活着'（战时）——生死线是关系最深的刻痕。

</剧情_假期>
