剧情_3年_第二学期:
  学年定位: 3年级 · 阿兹卡班篇·下（1994年1月~6月）· 真相之夜
  原著事件坐标: 《阿兹卡班的囚徒》下半年——尖叫棚屋的真相（小天狼星是无辜的，叛徒是小矮星彼得）、时间转换器（赫敏和哈利回到过去救巴克比克和小天狼星）、卢平身份暴露（狼人）辞职。你不在尖叫棚屋（哈利三人组在），但你在城堡里经历了卢平的离开和赫敏的'秘密'。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。卢平教授的课越来越精彩，但斯内普教授总在找他的麻烦（'卢平教授，你今晚……身体可好？'——暗示月圆）。
    - 2月: 月圆之夜。你在城堡走廊'恰好'看到卢平教授匆匆离开（他去尖叫棚屋变身）。你隐约觉得'他好像躲着什么'。
    - 3月: 巴克比克的死刑日（原著被救走——哈利和小天狼星骑着它飞走了）。海格在操场哭得像个孩子。你陪着他，他抽泣着说：'它是好孩子……'
    - 4月: 尖叫棚屋之夜（原著）。你不在场，但深夜你听到了城堡外的骚动（小矮星彼得逃跑时变身老鼠的动静）。天亮后，小天狼星骑着巴克比克逃走的传闻传遍全校——魔法部暴怒，但邓布利多的眼神很平静。
    - 5月: 卢平教授辞职。他离开那天，全班都去送他。他对你说：'守护神咒练得不错，别荒废。'——你突然意识到，这位最好的老师下学期不在了。
    - 6月: 学期末。赫敏的'秘密'：她看起来累极了（时间转换器的副作用），但你问她她只说'课程太多了'。你隐约觉得不对，但没追问。她靠在你肩上睡着的那一刻，是你们关系的转折点。

  本季主线弧:
    - 真相的震撼: 小天狼星的无辜——'十恶不赦的逃犯'是冤枉的。世界观的第一课：报纸会骗人，魔法部会错。露娜·斯特兰德的直觉再次应验（'我说过他不是坏人'）。
    - 卢平的离开: 最好的老师因为身份（狼人）被迫离开——偏见与代价的具象化。
    - 赫敏的疲惫与依赖: 时间转换器的秘密让她累到极点。她在你肩上睡着的那一刻——学霸第一次卸下铠甲。

  关键场景:
    - 巴克比克死刑日（你陪海格）
    - 卢平辞职的告别（全班送行）
    - 赫敏靠在你肩上睡着（关系转折点）
    - 学期末的'小天狼星逃走了'的传闻之夜

  女巫互动钩子:
    - 赫敏: 她在你肩上睡着。醒来后她慌乱地擦口水：'我、我没睡着！'——然后她小声说：'……谢谢你没吵醒我。'（好感+15，她的软肋第一次露出来）
    - 露娜·斯特兰德: 真相应验后她没得意，只是安静地说：'我早知道。'然后她看着你：'你信我，所以我谢谢你。'——信任的双向确认。
    - 金妮: 卢平辞职那天她哭了（密室后她第一次公开哭）。她哽咽着说：'为什么好人总要走……'——她的创伤与不舍交织。
    - 黛西: 巴克比克事件后她安慰海格（赫奇帕奇的共情）。她红着眼眶跟你说：'有时候魔法世界……一点都不魔法。'
    - 伊莎贝拉·诺斯: 卢平辞职后她难得说了一句长话：'我见过太多像他那样的好人，因为身份被赶走。'——她的傲罗经历让她共情。
    - 潘西: 小天狼星反转后斯莱特林有人嘴硬（'他肯定还是坏蛋'）。她没附和，也没反驳——她开始自己思考了。

  事件池（一次 1~2 个）:
    - 事件·月圆之夜: 你撞见卢平的异常。你选择：追上去（看到狼人变身——危险+伏笔）/退开（保护自己和秘密）。
    - 事件·死刑日的陪伴: 你陪海格。他把你当半个朋友，跟你说阿拉戈克的事（八眼巨蛛伏笔）。
    - 事件·肩上的依靠: 赫敏睡着在你肩上。你选择：保持不动（她醒来后记你的好）/轻轻叫她（她尴尬）。
    - 事件·告别的礼物: 卢平临走送你一件东西（一本旧笔记/一块巧克力/一句忠告）——'以后遇到摄魂怪，想想你的守护神。'
    - 事件·真相之夜: 传闻之夜你在城堡门口看到远处巴克比克飞走的影子。你身边的她（按好感度最高者）也看到了——你们共享了一个秘密。

  关系推进线:
    - 好感度: 25~35；赫敏的'肩上一靠'是学期最大事件（+15）。
    - 欲望度: 赫敏线的'卸下铠甲'时刻——学霸的脆弱让你心动。
    - 缴械值: 守护神咒大成（伊莎贝拉教官：'合格了'）。
    - 堕落值: 10~15。

  学期结算:
    - 真相线: 小天狼星无辜的认知写入世界观（五年级凤凰社会重逢）。
    - 卢平线: 他的忠告/礼物保留（四年级火焰杯篇不再有他，但守护神咒是你的）。
    - 赫敏线: '肩上一靠'事件记录（关系转折）。
    - 学期结束: 时间.学期 → 假期；升四年级（火焰杯篇！）。

</剧情_3年_第二学期>
