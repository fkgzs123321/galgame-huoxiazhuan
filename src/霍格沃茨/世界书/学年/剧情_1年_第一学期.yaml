剧情_1年_第一学期:
  学年定位: 1年级 · 魔法石篇·上（1991年9月~12月）· 入学年
  原著事件坐标: 《魔法石》上半年——分院、第一堂魔咒课、万圣节巨怪、魁地奇首赛、禁林中的独角兽血、魔法石的暗流。你和哈利·波特同届入学：他是"大难不死的男孩"，你是"那个新生"——但魔法石的风暴会卷过所有人。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 国王十字车站 9¾ 站台。你的入学日。火车上你遇见同届的她们：赫敏在包厢里读《霍格沃茨：一段校史》，金妮紧张地问"分院痛不痛"，拉文德在给所有人看手相。
    - 9月1日晚: 分院仪式。分院帽的歌声。你被分进格兰芬多（或按玩家选择）。隔壁桌的哈利·波特被帽子纠结了整整五分钟——全校都在看他。
    - 9月第2周: 第一堂魔咒课。弗立维教授教漂浮咒（羽加迪姆勒维奥萨）。赫敏第一个成功，你第二次成功——她转头看了你一眼（学霸的雷达响了）。
    - 9月下旬: 斯内普的魔药课（第一堂，格兰芬多与斯莱特林合班）。他点哈利的名（"波特，告诉我水仙根粉和艾草浸液加在一起会怎样"）——斯莱特林桌的潘西在笑。你的坩埚在期末前炸过一次，塞西莉亚教授（魔药课另一班教授）课后把你留下："火候不是越大越好。"
    - 10月31日: 万圣节宴会+巨怪事件（原著）。有人把巨怪放进了城堡。你在二楼走廊与巨怪面对面——不是你解决了它，是"恰好有人路过"（哈利和罗恩的巨怪事件发生的同时，你在另一条走廊遇到了同样被巨怪堵住的黛西·霍桑）。你们一起躲进了盥洗室，直到教授们赶来。
    - 11月: 魁地奇首赛（格兰芬多vs斯莱特林）。哈利是找球手（史上最年轻）。薇奥拉·布莱克伍德（斯莱特林找球手，同届）在看台上冷眼看你："你连扫帚都不会骑吧？"——她记住你了。艾琳·怀特（格兰芬多击球手，同届）在旁边喊："别理她，下节飞行课我教你！"
    - 12月: 圣诞假期。留校的少数人在炉火边拆礼物。谁给你送了第一份圣诞礼物？（黛西织的围巾/赫敏选的《魔咒入门》/艾琳塞的一把扫帚保养油）

  本季主线弧:
    - 入学与立足: 从"新生"到"被记住的人"——分院、第一堂课的亮相、巨怪事件里的镇定，决定你在同届中的初始印象。
    - 魔法石的暗流: 你不参与原著主线（找魔法石的是哈利三人组），但暗流在你身边涌动：禁林里的独角兽血（12月，你'恰好'看到银色的血迹）、三头犬的咆哮（你路过三楼禁区听到）、奇洛教授那股大蒜味（他总在你附近出现）。
    - 同届关系的建立: 9 名女巫与你的初见——谁能记住你、谁无视你、谁觉得你有趣，从这一学期开始。

  关键场景:
    - 分院仪式（学院=社交圈起点；同院=日常相处，异院=跨院张力）
    - 万圣节巨怪（你和黛西一起躲盥洗室——患难情谊的起点）
    - 魁地奇首赛（薇奥拉的挑衅/艾琳的邀约）
    - 圣诞拆礼物（第一份心意）

  女巫互动钩子（一年级初见版）:
    - 薇奥拉·布莱克伍德: 斯莱特林找球手。看台的冷眼→魁地奇场边的对峙→她发现你"居然不卑不亢"。高傲大小姐线的起点。
    - 艾琳·怀特: 格兰芬多击球手。飞行课教你骑扫帚：'腿夹紧！手放松！'——元气运动系的直球接近。
    - 露娜·斯特兰德: 拉文克劳。她盯着你看了一会儿，然后说：'你身上有虻。'（她的方式说'你很特别'）——神秘学霸线的伏笔。
    - 黛西·霍桑: 赫奇帕奇。万圣节巨怪一起躲盥洗室——她事后给你送了自己做的太妃糖：'压压惊。'温柔甜妹线的起点。
    - 塞西莉亚·费恩: 魔药课（格兰芬多班）。炸坩埚后的留堂：她教你火候，然后看了你一眼：'你手很稳，就是心浮。'师生线伏笔。
    - 伊莎贝拉·诺斯: 实战教官（一年级只旁观）。她在训练场看到你被艾琳拉着学扫帚：'胆子不小。'——她记住你了。
    - 赫敏·格兰杰: 同院同学。漂浮咒后的'雷达响'：她开始'顺便'纠正你的咒语发音——学霸式关心的起点。
    - 金妮·韦斯莱: 同院新生。她紧张地问你分院疼不疼，你回答后她松了口气：'那还好。'——她的注意力在你身上停留了一秒。
    - 卢娜·洛夫古德: 拉文克劳。她在湖边'看见'了水下的什么东西，转头跟你说：'它会记得你。'
    - 潘西·帕金森: 斯莱特林。魔药课合班时的贵女团雏形：她打量你一眼，跟同伴耳语，然后笑——她的关注是'评估'式的。
    - 拉文德·布朗: 格兰芬多。火车上的手相：'你手相里有星星……你会遇见重要的人。'——她说是她自己。

  事件池（一次 1~2 个）:
    - 事件·分院帽的纠结: 你被分院帽纠结（格兰芬多vs拉文克劳/斯莱特林）。选择或被选择——同院女巫的初始好感+3。
    - 事件·巨怪之夜: 你与黛西躲盥洗室。你护住她的方式（挡在前面/拉着她跑/讲笑话缓解恐惧）决定她的初始印象（好感+5~10）。
    - 事件·飞行课: 艾琳教你扫帚。你学得快（她刮目相看）/摔得惨（她哈哈大笑但记住了你）。
    - 事件·三楼禁区: 你'路过'三楼禁区，听到三头犬的咆哮。你告诉谁（赫敏的眼睛亮了/金妮害怕/潘西冷笑'多管闲事'）？
    - 事件·禁林血迹: 12 月你在禁林边缘看到银白色的血迹（独角兽血——伏地魔喝过的地方）。你告诉露娜·斯特兰德，她的笔记本多了一页。

  关系推进线（一年级）:
    - 好感度: 全体 0~10 起步（初见级）；巨怪事件/飞行课等事件加成者 10~15。
    - 欲望度: 一年级（17 岁成年）已可激活，但整体处于'青春期的萌芽'状态——眼神、心跳、'不小心'的触碰为主。
    - 缴械值: 伊莎贝拉教官的观察（她对你的初始评价）。
    - 堕落值: 全员 0（关系未建立）。

  学期结算:
    - 学业: 期末各科 40~60 区间（一年级基础分）。
    - 印象: 谁记住你了（写入叙事记忆）。
    - 伏笔: 独角兽血/三头犬/奇洛的大蒜味（魔法石篇暗流）。
    - 学期结束: 时间.学期 → 第二学期。

</剧情_1年_第一学期>
