剧情_1年_第二学期:
  学年定位: 1年级 · 魔法石篇·下（1992年1月~6月）· 结局年
  原著事件坐标: 《魔法石》下半年——圣诞后的暗流、厄里斯魔镜、魔法石的守护关卡（三头犬/魔鬼网/钥匙/巫师棋/魔药谜题）、奇洛与伏地魔的失败。期末，哈利三人组阻止了奇洛；学院杯颁奖夜，格兰芬多凭'特殊贡献'夺冠——你在现场。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 返校。禁林的血迹事件后，露娜·斯特兰德的笔记本多了'独角兽'的条目。奇洛教授的大蒜味更重了——他总在图书馆附近转悠。
    - 2月: 魁地奇赛季。格兰芬多vs拉文克劳。你发现哈利的状态忽好忽坏（他的扫帚被施了咒——奇洛干的，但当时没人知道）。你在看台上'恰好'跟谁坐在一起？
    - 3月: 魔法石暗流升级。赫敏开始神神秘秘地研究什么（'三楼禁区……三头犬……'）。她不会告诉你细节，但会问：'你会下巫师棋吗？'
    - 4月: 学期末前的平静（暴风雨前的宁静）。城堡里流传'邓布利多最近很忙'。你在图书馆遇到奇洛，他冲你虚弱地笑了笑——你闻到他身上的血腥味（他在禁林喝了独角兽血）。
    - 6月: 期末考+魔法石之夜（原著）。那一夜你不在禁区（哈利三人组在），但你在城堡里听到了动静：三头犬的咆哮、匆匆的脚步声、然后是一声'不——'。第二天，奇洛教授"请了长假"。格兰芬多学院杯：邓布利多给哈利三人各加 50 分——你见证了格兰芬多从垫底到夺冠的奇迹之夜。

  本季主线弧:
    - 魔法石的落幕: 你作为'旁观者'见证奇洛的失败（你不在场，但余波在）：奇洛辞职（真实：死亡）、邓布利多的微笑、哈利的病房探视传闻。
    - 第一年的成长: 期末考、魁地奇、关系线的第一轮沉淀——谁从'同学'变成了'朋友'，谁还在'认识'阶段。
    - 大战前的宁静: 这一年以和平结束，但伏地魔"没有真正死去"的暗示（奇洛消失前的那句传闻）为后续学年埋线。

  关键场景:
    - 魁地奇被施咒的惊魂（看台上你身边的人抓住你的手）
    - 学院杯之夜（格兰芬多从垫底到夺冠：谁在欢呼中抱住你）
    - 期末考周（复习小组的化学反应）
    - 学期末的告别（暑假前的站台：谁约你写信）

  女巫互动钩子:
    - 黛西: 魁地奇看台她坐在你旁边，哈利扫帚失控时她抓住你的手：'他会不会有事！'——她紧张时靠你很近。
    - 艾琳: 学院杯之夜格兰芬多夺冠，她兴奋地抱住你转圈：'赢了！我们赢了！'——她的直球拥抱。
    - 薇奥拉: 斯莱特林丢了学院杯，她冷着脸。你在走廊遇见她，她没骂人，只说了句：'明年我们会赢回来。'——她的'输不起'初见端倪。
    - 赫敏: 期末复习小组。她辅导你魔法史：'重点不是背，是理解。'——学霸式关心的第一轮。
    - 金妮: 学期末她给你写了同学录：'很高兴认识你。'字迹工整，是她练了五遍的成果。
    - 露娜·斯特兰德: 她给你看她笔记本的独角兽条目：'银色的血……我在书里见过，只有最邪恶的东西才会伤害独角兽。'——她的直觉开始接近真相。
    - 潘西: 学期末的斯莱特林聚会上她跟贵女团耳语，你'恰好'路过，她没躲：'明年见。'——大小姐的评估进入下一轮。

  事件池（一次 1~2 个）:
    - 事件·扫帚失控: 魁地奇惊魂。你身边的她抓住你的手/你没抓住她的手——好感±5。
    - 事件·巫师棋的邀请: 赫敏问你'会下巫师棋吗'。会（她眼睛一亮，学霸同盟+1）/不会（她说'那算了'，但后来还是教你了）。
    - 事件·奇洛的擦肩: 图书馆偶遇奇洛。他冲你笑，你闻到血腥味。你选择：告诉教授（没人信）/告诉露娜（她记下来）/装作没闻到（后怕）。
    - 事件·学院杯之夜: 格兰芬多夺冠的欢呼。谁在欢呼中抱住你/谁在角落里失落（薇奥拉）。
    - 事件·暑假约定: 站台告别。谁约你写信（黛西/艾琳/赫敏/金妮——按好感度最高者优先）。

  关系推进线:
    - 好感度: 10~20（朋友级）；事件加成者 15~25。
    - 欲望度: 青春期的萌芽：'第一次心跳加速'的时刻（谁让你第一次意识到'她不只是同学'）。
    - 缴械值: 伊莎贝拉教官年度评价（她旁观的结论）。
    - 堕落值: 全员 0~5（关系未建立）。

  学期结算:
    - 学业: 期末总分≥300（一年级线，升二年级）。
    - 关系: 朋友名单+暑假通信约定形成。
    - 伏笔: 独角兽血/奇洛的消失（魔法石篇落幕，密室篇伏笔：'听说奇洛教授……不在了'）。
    - 学期结束: 时间.学期 → 假期（暑假=通信季）；升二年级。

</剧情_1年_第二学期>
