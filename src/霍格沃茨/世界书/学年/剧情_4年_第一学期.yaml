剧情_4年_第一学期:
  学年定位: 4年级 · 火焰杯篇·上（1994年9月~12月）· 三强争霸赛
  原著事件坐标: 《火焰杯》上半年——三强争霸赛重启、德姆斯特朗与布斯巴顿到访、火焰杯选出四位勇士（哈利被第四个选中）、第一个项目（龙）、圣诞舞会（三强年传统）。假疯眼汉穆迪（小巴蒂·克劳奇）潜伏在校。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月: 开学。三强争霸赛宣布——中断一个世纪后重启。全校沸腾。德姆斯特朗的船从黑湖升起，布斯巴顿的马车由飞天白马拉来——食堂位置重新洗牌。
    - 9月底: 年龄线。邓布利多画下年龄线（17 岁以上才能投名字）。你 17 岁（成年入学制）——你是少数**够年龄**的四年级生之一！全校看你、你的女巫们看你的眼神都不一样了。
    - 10月: 火焰杯选出勇士：塞德里克（赫奇帕奇）、芙蓉（布斯巴顿）、克鲁姆（德姆斯特朗）——然后，第四个名字从火焰杯里吐出：哈利·波特。全场死寂。赫敏在格兰芬多长桌边攥紧叉子：'有人要害他。'
    - 10月31日: 第一个项目（龙）。你在看台上，火龙喷火的那一刻，身边的黛西尖叫着抓住你的手臂。塞德里克用变形术（石头变狗）调虎离山——他的机智让赫奇帕奇欢呼。
    - 11月: 假穆迪的课（原著：他教三大不可饶恕咒）。伊莎贝拉教官看到穆迪上课方式后皱眉：'内容没错，但味道不对。'——她的傲罗直觉在报警。
    - 12月: 圣诞舞会（三强年）。全校最盛大的舞会。谁邀请你？你邀请谁？克鲁姆带着赫敏进场（原著），你看到她时她'恰好'也在看你——那一眼，让格兰芬多的空气微妙起来。

  本季主线弧:
    - 三强的狂欢: 外来者（德姆斯特朗/布斯巴顿）打破校园平衡。你的女巫们的'护食'反应很有趣——克鲁姆（魁地奇明星）是最大威胁：他抢走了赫敏的舞伴位。
    - 够年龄的特权: 你是四年级生里少数够年龄投火焰杯的人——你投了吗？投给谁？这个选择让你在女巫们眼中的形象不同。
    - 暗流: 假穆迪的异常（他的'教学'有目的）、哈利被选中的阴谋——你隐约感到'不对劲'，但说不清。

  关键场景:
    - 年龄线（你够年龄：投/不投火焰杯）
    - 第一个项目（龙的震撼：你护住身边的她）
    - 圣诞舞会（三强年最盛大的舞会：邀舞修罗场）

  女巫互动钩子:
    - 赫敏: 克鲁姆邀她跳舞（原著）。她答应了，但舞会中途她'恰好'在你附近：'你……怎么不跳舞？'——她在乎你的反应。
    - 金妮: 舞会上她跟别人跳了舞（原著她跟纳威）。但她跳完来找你：'你都不请我？'——她的主动。
    - 薇奥拉: 克鲁姆也请了斯莱特林的女生（她没被请）。她冷着脸看你：'你也不请我？'——大小姐的傲娇邀约（反向）。
    - 黛西: 第一个项目她抓着你手臂尖叫。事后她红着脸道歉：'对不起……我太大声了。'——她记住你的手臂了。
    - 潘西: 德拉科讽刺哈利时她没接话（她表哥圈子变了味）。你'恰好'听见，她看到你：'看什么？'——她的防线在松动。
    - 拉文德: 舞会前她缠着你占卜：'星星说你会遇到一个穿粉裙子的人。'——她穿的是粉裙子。
    - 露娜·斯特兰德: 她看着火焰杯说：'杯子在说谎。'——她的直觉再次直指真相（第四个名字是阴谋）。

  事件池（一次 1~2 个）:
    - 事件·火焰杯抉择: 你投/不投。投了（名字进杯子，没被选中——但你'敢试'的形象+）；不投（你冷静，她记住你的稳重）。
    - 事件·龙的震撼: 第一个项目。你护住身边的她（黛西抓你手臂/金妮躲你身后/赫敏专注看龙没理你——选择决定）。
    - 事件·穆迪的课: 他教三大不可饶恕咒（钻心咒示范）。你看到同学被钻心咒折磨的表情——你选择：皱眉（伊莎贝拉注意到你）/别过脸（她理解）。
    - 事件·舞会邀约: 你邀/被邀/旁观。舞会中途的走廊偶遇（谁在舞池边等你）。
    - 事件·克鲁姆风波: 赫敏被克鲁姆邀请。你的反应（吃醋/无所谓/祝福）决定格兰芬多的空气温度。

  关系推进线:
    - 好感度: 30~40；舞会事件是学期最大增量（+10~15）。
    - 欲望度: 三强舞会的浪漫氛围——礼服、灯光、舞池，青春期的荷尔蒙达到峰值。
    - 缴械值: 你的年龄线'够格'形象（你被当作'大人'看待了）。
    - 堕落值: 10~15。

  学期结算:
    - 舞伴记录: 谁和你跳舞（写入叙事记忆，下学期引用）。
    - 火焰杯抉择: 投/不投记录。
    - 学期结束: 时间.学期 → 第二学期（火焰杯篇·下：黑暗降临）。

</剧情_4年_第一学期>
