<剧情_7年_第二学期>
剧情_7年_第二学期:
  学年定位: 7年级 · 毕业年 · 第二学期（1998年1月~5月）· 死亡圣器篇·下（大战与战后）
  原著事件坐标: 《死亡圣器》下半年——霍格沃茨大战、伏地魔之死、战后重建。全书终点：你作为"见证者"经历这场改变魔法界的战争，然后在废墟上开始你的生活——和你的她。

  时间轴（按剧情自然推进，勿跳步）:
    - 1月: 战争的最后阶段。食死徒对麻瓜出身者的搜捕升级。你的藏身点不再安全——你决定做点什么（或继续躲藏）。
    - 2月: 凤凰社的反击集结。伊莎贝拉·诺斯通过猫头鹰给你捎来一枚凤凰社的徽章：'大战将至。来不来，你决定。'
    - 3月: 霍格沃茨大战前夕。城堡被食死徒控制，但地下反抗组织（D.A. 残余、凤凰社、家养小精灵）在准备。你收到城堡里的密信：'返校吧。这是最后一次机会。'
    - 5月2日: 霍格沃茨大战（原著大事件，背景化）。巨怪、蜘蛛、食死徒、凤凰社——城堡在燃烧。你在哪条战线？你保护谁？你为谁挡下那道咒语？（或谁为你挡下）
    - 5月3日: 黎明。伏地魔死了。太阳照常升起，城堡在冒烟，但人们开始走出废墟。你活着——你身边还有谁活着？
    - 5月~6月: 战后重建。葬礼（谁的）、庆祝（谁的）、重建城堡的工程。'新学期'不会再有了——七年级结束了，战争结束了，你们毕业了。

  本季主线弧:
    - 大战: 你作为路人的最后一课：在生死之间，你选择保护谁，谁选择保护你。这一战定义你的关系终局。
    - 幸存: 战后数人头的时刻。谁活着、谁受伤、谁永远离开了——幸存者的羁绊是余生最深的联系。
    - 毕业与余生: 战后没有毕业典礼，但你们确实毕业了。'以后怎么办'第一次有了真实答案：活下来的人，要好好活。

  关键场景:
    - 凤凰社徽章（参战/不参战的抉择）
    - 大战之夜（你守在哪条走廊、保护谁、谁为你挡咒——关系终局的决定性瞬间）
    - 黎明（战后废墟里的寻找：你第一个找的是谁）
    - 葬礼与重生（告别与开始：战后第一个吻、第一次笑、第一顿正常的饭）

  女巫互动钩子（大战终局版）:
    - 伊莎贝拉·诺斯: 大战中她守在东塔楼。战后她浑身是血地找到你：'你小子还活着。'然后她难得地笑了。缴械值 100 线收官。
    - 塞西莉亚·费恩: 她在战前用魔药救了半个地下医院的人。战后她累倒在校医院，你守着她醒来的那一刻。
    - 赫敏: 大战后她找到父母（记忆恢复）。她站在城堡废墟边跟你说：'我想……重新开始。'
    - 金妮: 大战后她坐在魁地奇场边发呆（场地毁了）。你坐过去，她靠在你肩上：'会重建的。'
    - 露娜·斯特兰德: 大战后她指着天空说：'看，太阳还在。'然后她转头看你：'你也还在。'
    - 黛西: 战后她做的第一件事是烤了一炉饼干，分给所有人。分到你时她红了眼眶：'幸好你还在。'
    - 薇奥拉: 战后她家族垮了，但她自由了。她对你说：'我现在一无所有了……但你还在我身边吗？'
    - 潘西: 战后她选择为家族赎罪（作证）。她走前跟你说：'如果我还回得来……'她没说完。
    - 拉文德: 战后她抱着你哭：'我占卜了那么多次……终于占卜到一次好结局。'

  事件池（一次 1~2 个）:
    - 事件·最后的抉择: 凤凰社徽章。参战（缴械值+50，你出现在大战前线）/不参战（你保护非战斗人员，她记住你的温柔）。
    - 事件·大战之夜: 你在哪条战线（东塔楼-伊莎贝拉/校医院-塞西莉亚/礼堂-金妮/禁林边-露娜/厨房-黛西/天文塔-薇奥拉）。谁为你挡下阿瓦达/你为谁挡下——关系线终局。
    - 事件·废墟中的寻找: 黎明后你第一个找的人。找到她时她的反应（哭/笑/骂你'怎么才来'）。
    - 事件·战后第一餐: 战后重建的霍格沃茨，第一顿正式的饭。谁坐在你旁边？
    - 事件·毕业告别: 没有毕业典礼的毕业。谁在站台送你（或跟你走）？关系结局：战争后的余生。

  关系推进线（终局）:
    - 好感度: 幸存者羁绊 90~100（终局：战后余生）；大战中互相保护者直接封顶。
    - 堕落值: 战争结束=正常世界回归；亲密从'末日狂欢'转为'认真余生'。
    - 缴械值: 大战表现定格（决斗荣誉的最终形态）。
    - 终局选项: 战后余生（你和她开始新生活）/伤别（她或你重伤，照顾与承诺）/永别（她牺牲——悲伤线，需谨慎使用）。

  学期结算（毕业终局）:
    - 大战结果: 写入叙事记忆（谁活下来了）。
    - 关系终局: 战后余生对象/承诺对象写入 stat_data（开放结局：对角巷、魔法部、圣芒戈、古灵阁——你们的战后生活自由续写）。
    - 毕业: 霍格沃茨大战后的重建期=你们的'毕业'。没有仪式，但有未来。
    - 终章: 卡的主线到此完整闭环：从 1991 年入学的一年级新生，到 1998 年战后余生——你亲历了完整的七部曲，你不再是路人，你是她世界里的人。

</剧情_7年_第二学期>
