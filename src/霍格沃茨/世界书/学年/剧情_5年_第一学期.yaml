<剧情_5年_第一学期>
剧情_5年_第一学期:
  学年定位: 5年级 · OWL年 · 第一学期（1995年9月~12月）· 凤凰社篇·上
  原著事件坐标: 《哈利·波特与凤凰社》上半年——乌姆里奇到任、D.A.（邓布利多军）建立、禁林中的夜骐与神秘事务司的伏笔。你是五年级老生（从一年级走来的见证者）：不是主角，但风暴会扫过每个人。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 开学宴。五年级的你走进礼堂时，'认识你'的人已经很多了——同届的女巫们向你点头，你不再是新面孔。邓布利多宣布两件事：新学期开始、以及"魔法部将派来一位高级调查官"——他说话时，斯莱特林长桌有人笑了。
    - 9月第2周: 乌姆里奇·多洛雷斯到任。粉色的开衫、尖细的嗓音、'我会教你们如何通过 OWL'。她在第一堂黑魔法防御术课上宣布：理论为主，实践以后再说。伊莎贝拉·诺斯教授在走廊里冷着脸对你说：'这学期，我只会教愿意学的人。'
    - 9月下旬: 魔法部开始介入学校：乌姆里奇开始旁听每一节课。赫敏在图书馆低声说：'她不是来教书的，她是来掌权的。'
    - 10月: 魁地奇院队选拔被乌姆里奇搅黄（她以'OWL 年学业优先'为由禁止）。金妮·韦斯莱在走廊里踢了一脚墙：'她凭什么！'
    - 10月31日: 万圣节。乌姆里奇宣布'为保证学习环境'取消万圣节宴会——全校哗然。当晚，格兰芬多公共休息室的炉火边，有人第一次提起'也许我们应该自己做点什么'。
    - 11月: D.A.（邓布利多军）在猪头酒吧开会成立。你被赫敏拉去'帮个忙'——'我们需要一个场地，你有主意吗'。有求必应屋的第一次聚会：八个人，一间堆满旧扫帚的房间，伊莎贝拉教官（她'恰好路过'）在门口留了一句话：'别被抓到。'
    - 12月: OWL 模拟考周+圣诞舞会照常（乌姆里奇想取消但邓布利多否决）。舞会上，谁和谁跳舞不再只是八卦——在乌姆里奇的眼皮底下，每一次亲密都是反抗。

  本季主线弧:
    - 压制与反抗: 乌姆里奇的高压政策让全校气氛压抑，D.A. 成为暗流。你作为五年级老生，选择站在哪边（公开对抗/暗中支持/明哲保身）决定你的名声和女巫们对你的看法。
    - 老生的立场: 在'OWL 年+政治风暴'双重背景下，你的成绩、你的立场、你的勇气，决定你是谁——同届的她们都在看你。
    - 关系的建立: 高压之下，靠近更容易——共同的秘密（D.A.）、共同的敌人（乌姆里奇）、共同的夜晚（有求必应屋）都是关系升温的土壤。

  关键场景（可单独展开成完整回合）:
    - 乌姆里奇第一课（她的理论课 vs 伊莎贝拉的实战课之争；你被点名回答'为什么防御咒重要'）
    - D.A. 成立夜（猪头酒吧的密会：谁在、谁紧张、谁带头；赫敏的'我们得签个名'）
    - 有求必应屋第一次聚会（昏暗烛光下学习守护神咒：谁的守护神是什么形态，透露她的内心）
    - 圣诞舞会（乌姆里奇到场监舞：高压下的舞会，谁主动邀你=公然表态）

  女巫互动钩子（按标签调度演出）:
    - 薇奥拉·布莱克伍德: 拉文克劳找球手。她父亲是魔法部官员（亲乌姆里奇派）——她的立场两难。'你觉得魔法部是对的吗？'她第一次认真问你。
    - 艾琳·怀特: 格兰芬多击球手。乌姆里奇禁了魁地奇，她的火气最大：'没有魁地奇的学年算什么学年！'她拉着你翻墙去禁林边偷偷飞扫帚。
    - 露娜·斯特兰德: 拉文克劳。她盯着乌姆里奇看了三节课，然后在图书馆跟你说：'她身上有虻——很多很多虻。'她的直觉直指真相。
    - 黛西·霍桑: 赫奇帕奇。乌姆里奇旁听魔药课时她紧张到炸了坩埚，被罚留堂。你陪她留堂，她在熄灯后小声说：'你……人真好。'
    - 塞西莉亚·费恩: 魔药学教授。乌姆里奇想借她整顿魔药课（'教育部对某些教师的教学方法有保留意见'），塞西莉亚冷着脸回：'我的坩埚，我说了算。'她在你面前第一次露出欣赏的眼神。
    - 伊莎贝拉·诺斯: 黑魔法防御术教授。她的课被乌姆里奇盯上，但她照教实战。课后她把你留下：'你底子不错。想学真正的战斗吗？'——D.A. 之外，她私下给你开小灶。
    - 赫敏·格兰杰: D.A. 的发起者。她拉你入伙：'你愿意帮忙吗？'——这是她第一次把你看作'同一阵营'。
    - 金妮·韦斯莱: 魁地奇被禁的火气+哥哥们在凤凰社的担忧。她会在有求必应屋里练咒语练到手抖，然后倔强地再来一次。
    - 卢娜·洛夫古德: 她会'恰好'出现在有求必应屋门口：'门说，你们在里面。'——她是唯一一个不用咒语就找到 D.A. 的人。
    - 潘西·帕金森: 斯莱特林。她父亲也是魔法部官员。她会在走廊里冷嘲'D.A.？一群小孩子的过家家'，但乌姆里奇当众羞辱格兰芬多时，她没笑。
    - 拉文德·布朗: 占卜课狂热者。她断言：'星星说，这个学期会有人改变城堡。'她看着你说：'我觉得是你。'

  事件池（一次 1~2 个，勿堆砌）:
    - 事件·乌姆里奇第一课: 她点名你：'你，五年级的，说说防御咒的基本原理。'答得好：她在教学报告里写'尚有可塑性'；答砸：留堂+警告。伊莎贝拉教官第二天在走廊拦你：'她问你什么了？'——她的反应暴露她的立场。
    - 事件·D.A. 签名风波: 赫敏要求所有成员在羊皮纸上签名（怕有内鬼）。你签不签？签了=把柄；不签=失去信任。拉文德第一个签，'我相信你'。
    - 事件·守护神咒之夜: 有求必应屋第一次练习守护神。你的守护神形态让赫敏沉思（'很少见'）；某位女巫的守护神是动物形态（狼/鹿/鸟），透露她的底色。
    - 事件·禁林夜飞: 艾琳拉你翻墙去禁林边飞扫帚。月光下你看见禁林深处有银白色的东西一闪而过（夜骐？——只有见过死亡的人才能看见夜骐，伏笔）。
    - 事件·乌姆里奇的调查: 她开始排查'不合格的教师'：伊莎贝拉首当其冲。你无意间听到她在办公室打电话：'……那个黑魔法防御术的教官，必须换掉。'你怎么处理这个情报？
    - 事件·圣诞舞会: 乌姆里奇亲自到场监舞。谁主动邀你跳舞=公然表态站队。舞池里，她粉色的身影在角落盯着每一对。

  关系推进线:
    - 好感度: 高压环境下建立'共同秘密'的关系升温更快（D.A. 成员 +10~15）；圣诞舞会邀约是学期最大增量点（+15）。
    - 欲望积压: 压抑的气氛反而让欲望更躁动——乌姆里奇越是管束，'深夜的偷偷摸摸'越诱人（宵禁后的禁林边缘、空教室、有求必应屋）。
    - 缴械值: 伊莎贝拉的小灶训练让你在实战课/私下切磋中快速成长。
    - 堕落值: 本学期基本不动；'秘密'的张力（D.A. 身份可能暴露）是暗线。

  学期结算:
    - 立场记录: 你站哪边（公开反乌姆里奇/暗中支持/明哲保身）写入叙事记忆，影响下学期事件走向。
    - D.A. 进度: 成员名单（谁跟你一起）、你的'代号'、练习进度。
    - 禁林伏笔: 银白色影子（夜骐）记录+1。
    - 学期结束: 时间.学期 → 第二学期；乌姆里奇的调查在继续。

</剧情_5年_第一学期>
