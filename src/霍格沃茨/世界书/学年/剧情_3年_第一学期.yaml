剧情_3年_第一学期:
  学年定位: 3年级 · 阿兹卡班篇·上（1993年9月~12月）· 摄魂怪的阴影
  原著事件坐标: 《阿兹卡班的囚徒》上半年——小天狼星·布莱克越狱（被指控出卖波特夫妇的叛徒）、摄魂怪进驻霍格沃茨、卢平教授（狼人）任教黑魔法防御术、巴克比克（鹰头马身有翼兽）的登场。城堡被'快乐被吸走'的阴冷笼罩。

  时间轴（按剧情自然推进，勿跳步）:
    - 9月1日: 开学。火车上的摄魂怪检查——车厢里突然冷得像冰窖，你的快乐被吸走的感觉让所有人脸色发白。黛西在你旁边，她抓住你的手，浑身发抖。
    - 9月第2周: 卢平教授到任。他穿着打补丁的长袍，第一节课就教守护神咒（'面对摄魂怪，你们需要快乐'）。他请全班吃巧克力——'摄魂怪之后，巧克力是良药'。伊莎贝拉教官对卢平的评价：'他教的才是真东西。'
    - 9月下旬: 巴克比克事件（原著：马尔福挑衅被鹰头马身有翼兽所伤）。你'恰好'在海格的课上看到全程：潘西的表哥德拉科被巴克比克抓伤，海格脸色惨白。
    - 10月: 摄魂怪袭击魁地奇比赛（哈利从扫帚坠落）。你在看台上，身边的人尖叫——你护住了谁？
    - 11月: 城堡里的'小天狼星目击'传闻。有人在夜里看到黑影。费尔奇比平时更暴躁。谁在深夜敲你的门说'我害怕'？
    - 12月: 圣诞。卢平教授请留校学生喝热茶。他问你喜欢什么守护神——你说了一只动物，他点点头：'那代表你心里最快乐的东西。'

  本季主线弧:
    - 摄魂怪的恐惧: 快乐被吸走的体验让全校陷入阴冷。恐惧中，谁靠近你、谁需要你、谁和你互相取暖。
    - 卢平的'真课': 对比洛哈特，卢平的实战教学让所有人（包括你）的防御能力质变——守护神咒是三年级的分水岭。
    - 小天狼星的传闻: 他是'十恶不赦的逃犯'——但露娜·斯特兰德说：'我觉得他不是坏人。'她的直觉第一次被所有人反驳。

  关键场景:
    - 火车上的摄魂怪（你护住黛西的手）
    - 卢平的守护神咒课（你的守护神形态=你的内心伏笔）
    - 巴克比克事件（海格的绝望/潘西表哥的嚣张）
    - 魁地奇坠落的惊魂（看台上你身边的人）

  女巫互动钩子:
    - 黛西: 火车上她抓住你的手发抖。事后她红着脸松开：'谢、谢谢。'——恐惧让依赖显形（好感+10）。
    - 艾琳: 摄魂怪让魁地奇变成噩梦。她训练时被摄魂怪干扰，摔得不轻。你扶她起来，她龇牙咧嘴：'他妈的……这鬼东西。'——她的粗口在你面前毫无防备。
    - 赫敏: 她开始疯狂研究'时间'相关的东西（她三年级用时间转换器上多门课——背景）。她总是一脸疲惫但眼睛发亮：'一天只有 24 小时，但我可以上 5 门课！'
    - 金妮: 密室创伤+摄魂怪=双重阴影。她在走廊看到摄魂怪时整个人僵住（PTSD）。你拉住她跑开，她缓过来后轻声说：'谢谢你……还记得拉我一把。'
    - 露娜·斯特兰德: '小天狼星不是坏人。'她坚持这个判断，被拉文克劳的同学嘲笑。她来找你：'你信我吗？'——信任的抉择。
    - 薇奥拉: 巴克比克事件后她少见地评价德拉科：'他活该。'——她不是纯血至上主义者的证据。
    - 潘西: 德拉科是她表哥的圈子（她是德拉科的跟班团成员，原著设定）。但她看到德拉科'活该'时表情复杂——她其实也觉得他欠揍。

  事件池（一次 1~2 个）:
    - 事件·守护神课: 你的守护神形态（狼/鹿/猫头鹰/獾/蛇——透露你的内心）。某位女巫的守护神和你的一样/互补——你们的'快乐'相通。
    - 事件·深夜敲门: 摄魂怪传闻的深夜，谁敲你的门（黛西/金妮/拉文德——按好感度最高者优先）：'我害怕，能待一会儿吗？'
    - 事件·巴克比克的审判: 海格的鹰头马身有翼兽被判死刑（魔法部背景）。你陪海格/你安慰德拉科圈子里没受伤的人（潘西'他又没事'）。
    - 事件·圣诞茶话: 卢平的茶会。你聊到自己的过去（伏笔：你的来历）——某位女巫认真听了。
    - 事件·禁林黑影: 你深夜看到'小天狼星'（其实是巴克比克/或狗形态的小天狼星——伏笔）。你告诉谁？

  关系推进线:
    - 好感度: 20~30；恐惧中的互相取暖 +10。
    - 欲望度: 阴冷中的体温格外珍贵——'抱团取暖'的亲密感开始明显。
    - 缴械值: 守护神咒的掌握（伊莎贝拉教官验收：'不错，能活着了'）。
    - 堕落值: 5~10。

  学期结算:
    - 守护神: 你的守护神形态写入叙事记忆（伏笔）。
    - 金妮线: 她的 PTSD 状态（下学期继续）。
    - 学期结束: 时间.学期 → 第二学期（阿兹卡班篇·下：真相）。

</剧情_3年_第一学期>
