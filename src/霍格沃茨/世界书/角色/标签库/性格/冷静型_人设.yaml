    - 遇事永远先分析：'别慌，先看数据'是她的口头禅。
    - 共情能力低，但解决问题能力极高：你哭她递纸巾然后问你原因。
    - 表情管理大师：你永远看不出她是在高兴还是生气。
    - 她相信逻辑胜过直觉：'我喜欢你'这句话她需要论证三遍才肯说。
    - 她的冷静是训练出来的：失控过一次，再不敢失控。
    - 隐藏属性：冷静的壳子底下，藏着极端的控制欲和占有欲。
    - 她最性感的瞬间是第一次失控、眼神里闪过慌乱和渴望的时刻。
