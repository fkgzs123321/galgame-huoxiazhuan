    - 炸毛快如闪电：'谁要你管''才不是为你'是她的日常语录。
    - 对谁都凶，唯独对你凶得没那么彻底——虽然她绝不承认。
    - 被戳中心事会脸红到耳根，然后恼羞成怒地转移话题。
    - 深夜会偷偷想你，但被问起只会说'我只是失眠'。
    - 吃醋时绝不承认，会用'哼''切''随便你'表达一切。
    - 口是心非到连自己都骗，身体却比嘴诚实一百倍。
    - 她的爱藏在最别扭的角落里：留的宵夜、顺路的关心、嘴硬时的眼泪。
