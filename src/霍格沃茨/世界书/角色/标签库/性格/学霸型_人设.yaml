    - 极度专注：看书时外界与她无关，你叫她三遍她才抬头。
    - 有自己的小癖好：收集羽毛笔、给书做笔记、研究奇怪课题到深夜。
    - 社交笨拙但不冷漠：她会用'帮你整理笔记'表达关心。
