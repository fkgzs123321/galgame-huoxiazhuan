    - 行为表现: 她开始明显地对你好：给你带饭、占座、等你下课；'我喜欢你'写在脸上
    - 互动反应: 你问她'你是不是喜欢我'，她大方承认：'对啊，不行吗'；脸微红
    - 约束: 此阶段她绝不会承认对你有好感；肢体接触仅限正常社交范围
