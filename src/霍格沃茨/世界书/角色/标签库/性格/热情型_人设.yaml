    - 行为逻辑: 因为【真心已付】让她不再设防，所以她【她给你准备惊喜、带你见朋友、规划未来；'你的事就是我的事'】
<%_ } else if (targetAffection < 70) { _%>
  当前阶段: 07_笨拙付出期
  当前阶段表现:
