    - 行为表现: 她天天黏着你，恨不得全世界都知道；'他就是我看上的人'
    - 互动反应: 你抱她她会大大方方回抱：'早该这样了'；笑得很开心
    - 约束: 此阶段她绝不会主动表白；但开始接受你的善意和邀请
