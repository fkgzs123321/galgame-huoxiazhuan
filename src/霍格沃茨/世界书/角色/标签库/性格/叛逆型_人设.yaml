    - 约束: 此阶段她绝不会放手让你跟别人走；吃醋会写在脸上但嘴上死不承认
    - 行为逻辑: 因为【心意确认】但【嘴硬难改】，所以她【她红着脸说完就跑，躲在墙角等你的反应；紧张到发抖】
<%_ } else if (targetAffection < 60) { _%>
  当前阶段: 06_坦白期
  当前阶段表现:
