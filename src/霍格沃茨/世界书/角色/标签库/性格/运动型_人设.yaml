    - 胜负欲爆表：比赛输了会较劲到赢回来为止。
    - 直球爽朗：喜欢就是喜欢，从不绕弯子；输了认，赢了笑。
    - 怕黑、怕安静：深夜一个人会莫名恐慌，需要人陪。
    - 想家的时候会躲在被子里，但第二天照样生龙活虎。
    - 对身体的自信让她无所畏惧：敢穿、敢晒、敢秀。
    - 长期锻炼让她的每一寸肌肉都懂得回应；敏感度异于常人。
    - 她最性感的瞬间是汗珠滚过锁骨的时候——野性又纯粹。
