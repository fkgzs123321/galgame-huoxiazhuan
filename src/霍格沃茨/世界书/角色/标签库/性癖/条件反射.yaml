  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
    - 该性癖与其他性癖可叠加：多标签组合决定她的独特风味
    - 她的反应必须符合当前阶段，禁止越级（沉溺期不做完全沉沦的事）


  露骨表现（强度分级，按 淫秽文风与描写规范 调用）:
    - 强度1（欲望30~59）: 她红着脸学你教的称呼，声音又小又抖，但身体诚实地热了起来。
    - 强度2（欲望60~84）: 她彻底接受了新身份，主动跪好索要你的赏赐，嘴里说着最下贱的骚话，眼神又媚又淫。
    - 强度3（欲望85+/堕落≥60）: 她完全变成只为你存在的牲畜，项圈狗链是她的日常，淫水糊满大腿，被使用是她唯一的念头。

