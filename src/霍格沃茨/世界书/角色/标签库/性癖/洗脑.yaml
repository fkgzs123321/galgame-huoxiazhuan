  性癖定义: 用语言和重复暗示改造她的认知：把'你是我的''你要服从我'一遍遍植入她脑海——不是魔法，是心理暗示的力量，让她从心里认定属于你。
  触发条件: 欲望度≥70（暗区，默认关闭）；她自愿接受心理调教时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
