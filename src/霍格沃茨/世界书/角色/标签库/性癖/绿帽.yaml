<绿帽>
绿帽:
  性癖分类: 关系背德
  性癖定义: 让她看着你和其他人做爱/或者你看着她和别人——绿帽的羞辱感让她崩溃，但也让你们的占有关系更加扭曲而深刻。
  触发条件: 欲望度≥70（暗区，默认关闭）；双方明确同意时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
