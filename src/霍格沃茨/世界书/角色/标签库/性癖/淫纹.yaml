<淫纹>
淫纹:
  性癖分类: 调教驯化
  性癖定义: 在她身上画上/刺上淫纹：小腹的淫纹、胸口的印记、大腿内侧的标记——淫纹是她的勋章，证明她是你的人，被你的标记烙进皮肤。
