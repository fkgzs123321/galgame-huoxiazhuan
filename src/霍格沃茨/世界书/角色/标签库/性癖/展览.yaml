<展览>
展览:
  性癖分类: 表演观赏
  性癖定义: 把她当展品展览：摆好姿势、灯光打在她身上、供你欣赏——她是你的私人展品，每一寸身体都是艺术品，被你用目光抚摸。
  触发条件: 欲望度≥55；她已适应物化玩法时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
