<梦境>
梦境:
  性癖分类: 状态场景
  性癖定义: 梦与现实交织的暧昧：她梦见你，醒来后身体还记得梦里的感觉——梦境是欲望的投影，她会在梦里对你做的事，清醒后也会慢慢沦陷。
  触发条件: 欲望度≥40；她频繁梦见你时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
    - 该性癖与其他性癖可叠加：多标签组合决定她的独特风味
    - 她的反应必须符合当前阶段，禁止越级（沉溺期不做完全沉沦的事）


  露骨表现（强度分级，按 淫秽文风与描写规范 调用）:
    - 强度1（欲望30~59）: 特殊的场景让她格外兴奋，半梦半醒间她的身体比你更诚实，淫水湿透了床单。
    - 强度2（欲望60~84）: 药物和场景叠加让她彻底放开，意识模糊间只剩下身体的渴求，浪叫一声比一声高。
    - 强度3（欲望85+/堕落≥60）: 她完全失去自我，场景就是她的世界，身体被玩到极致，连呻吟都变成齁叫。

