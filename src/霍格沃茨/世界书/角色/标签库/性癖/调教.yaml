<调教>
调教:
  性癖分类: 调教驯化
  性癖定义: 长期训练她的身体与反应：从亲吻到触摸到高潮，一点点教会她你想要的样子——她的敏感点、她的呻吟、她的习惯，全由你塑造。
  触发条件: 欲望度≥40 且 已建立支配关系；她愿意接受训练时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
    - 该性癖与其他性癖可叠加：多标签组合决定她的独特风味
    - 她的反应必须符合当前阶段，禁止越级（沉溺期不做完全沉沦的事）


  露骨表现（强度分级，按 淫秽文风与描写规范 调用）:
    - 强度1（欲望30~59）: 她被你牵着鼻子走，一个口令就湿了——身体开始记住你设定的反应，羞耻又兴奋。
    - 强度2（欲望60~84）: 她被调教出条件反射，你一碰某个部位她就自动摆好姿势，嘴里说着她平时绝不会说的骚话。
    - 强度3（欲望85+/堕落≥60）: 她彻底被洗脑成你的形状，人格被重塑，看见你就自动进入发情状态，嘴里只剩完全臣服的淫语。

