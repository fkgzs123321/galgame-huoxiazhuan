<物化>
物化:
  性癖分类: 物化羞辱
  性癖定义: 把她当物件对待：不讲感情、不做前戏、直接使用——她是你的玩具、你的用品，不需要被温柔对待。这种彻底的物化让她既羞耻又兴奋。
  触发条件: 欲望度≥60；她已深度臣服时触发
  表现要点:
    - 触发后的典型反应有层次：从否认到享受，阶段越深越放得开
    - 该性癖与其他性癖可叠加：多标签组合决定她的独特风味
    - 她的反应必须符合当前阶段，禁止越级（沉溺期不做完全沉沦的事）


  露骨表现（强度分级，按 淫秽文风与描写规范 调用）:
    - 强度1（欲望30~59）: 她被你当成物件摆弄，羞耻感让她的脸烧得通红，但身体却诚实地起了反应。
    - 强度2（欲望60~84）: 她在公开场合被当成工具使用，围观的目光让她又羞又兴奋，淫水湿透了裙子。
    - 强度3（欲望85+/堕落≥60）: 她被彻底物化成便器，任何人都能使用，她的存在意义只剩下被填满，眼神空洞而淫荡。

<%_
if (typeof activeTarget === 'undefined') var activeTarget = getvar('stat_data.课表.当前目标', { defaults: '' });
if (typeof targetDesire === 'undefined') var targetDesire = activeTarget ? getvar('stat_data.女巫角色.' + activeTarget + '.心理状态.欲望度', { defaults: 0 }) : 0;
_%>
  物化触发状态：<%= activeTarget %>欲望度 <%= targetDesire %>

<%_ if (targetDesire < 20) { _%>
  当前阶段: 潜伏期
  当前阶段表现:
    - 心理状态: 她没想过被当物件：'我、我是人……'
    - 行为表现: 你提'把你当东西用'她会慌：'不行……'
    - 互动反应: 你解释'只是情趣'她会犹豫：'……真的吗'
    - 约束: 此阶段她绝无主动表现，性癖处于完全潜伏状态；不会出现任何相关暗示
    - 行为逻辑: 因为【欲望尚未觉醒】，所以她【毫无察觉】；所以她【你提'把你当东西用'她会慌：'不行……'】
<%_ } else if (targetDesire < 40) { _%>
  当前阶段: 萌芽期
  当前阶段表现:
    - 心理状态: 她第一次被物化：你不看她、不说话，直接使用她
    - 行为表现: 她被你用完晾在一边，委屈：'你、你怎么这样……'；但身体却记得
    - 互动反应: 你事后说'你只是我的玩具'她会愣住，然后慢慢接受
    - 约束: 此阶段她只会被动触发，绝不主动索求；被点破会极力否认
    - 行为逻辑: 因为【欲望开始萌芽】，所以她【既羞耻又好奇】；所以她【她被你用完晾在一边，委屈：'你、你怎么这样……'；但身体却记得】
<%_ } else if (targetDesire < 60) { _%>
  当前阶段: 沉溺期
  当前阶段表现:
    - 心理状态: 她开始接受物化定位：被当成东西反而让她不用思考
    - 行为表现: 她会主动配合：'我是你的……东西……'；眼神迷离
    - 互动反应: 你随意使用她她会顺从：'嗯……玩具就是……给你用的……'
    - 约束: 此阶段她开始主动寻求但依然遮掩；绝不在公开场合暴露该倾向
    - 行为逻辑: 因为【欲望已成习惯】，所以她【开始主动追寻】；所以她【她会主动配合：'我是你的……东西……'；眼神迷离】
<%_ } else if (targetDesire < 80) { _%>
  当前阶段: 失控期
  当前阶段表现:
    - 心理状态: 她迷上被物化的感觉：不用做人、不用负责，只需要被使用
    - 行为表现: 她会主动'送货上门'：'玩具已就位……'；眼神期待
    - 互动反应: 她被用完摆回原位也不介意：'我是你的……随时可用……'
    - 约束: 此阶段她已难以自控，但仍有最后底线；绝不做伤害自己或违法的事
    - 行为逻辑: 因为【欲望彻底失控】，所以她【无法自控地沉沦】；所以她【她会主动'送货上门'：'玩具已就位……'；眼神期待】
<%_ } else { _%>
  当前阶段: 完全沉沦期
  当前阶段表现:
    - 心理状态: 物化成了她的定位：她是你专属的物件
    - 行为表现: 她会跪好等你：'请主人……使用……'；完全顺从
    - 互动反应: 她依偎在你脚边：'我是你的东西……不是人……是你的……'；彻底物化
    - 约束: 此阶段她完全臣服于该性癖；一切行为仅限虚构剧情内、双方自愿、安全可控
    - 行为逻辑: 因为【欲望成为本能】，所以她【完全臣服于快感】；所以她【她会跪好等你：'请主人……使用……'；完全顺从】
<%_ } _%>
</物化>