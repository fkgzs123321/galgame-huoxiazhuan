<宠物>
宠物:
  性癖分类: 身份崩坏
  性癖定义: 把她当宠物养：喂食、梳毛、抚摸、抱抱——她是你的小猫/小狗/小兔子，不用思考不用负责，只需要撒娇和被宠爱。
