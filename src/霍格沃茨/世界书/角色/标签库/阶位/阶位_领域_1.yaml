<阶位_领域_1>
阶位_领域_1:
  层定位: 8-1 领域·初期
  魔力值区间: 2200~2529
  咒语上限: Lv35 | 魔咒库容量: 48
  战力系数: 防守值×5.5 | 双修效率×5.5
  层详解:
    - 魔力展开领域，领域内即规则；言出法随。规则意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×5.5（面板自动应用）；咒语等级上限 Lv35
    - 本层爆发特性：领域展开
  双修表现:
    - 魔力流转效率×5.5，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥2200 且 层进度 100 且 突破魔药×1（神话（本源之核））
  突破瓶颈:
    - 天劫——领域境第 1 层的核心考验
  突破仪式:
    - 魔力天雷淬体（九死一生）
  突破材料: 神话（本源之核）
  失败后果:
    - 天劫重伤，境界跌落
  表现细节:
    - 气质/魔力波动：领域境 初期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
</阶位_领域_1>
