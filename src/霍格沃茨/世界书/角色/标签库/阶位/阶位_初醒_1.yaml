<阶位_初醒_1>
阶位_初醒_1:
  层定位: 1-1 学徒期初层（魔力初醒·微光）
  魔力值区间: 0~29
  咒语上限: Lv3 | 魔咒库容量: 4
  战力系数: 防守值×0.5 | 施咒失败率30% | 双修效率×0.5
  层详解:
    - 魔力如烛火初燃，时明时灭。情绪激动时魔力会失控外泄：让杯子无故飘起、油灯忽明忽暗、无意识念出听到过的咒语。
    - 只能稳定施展 1~2 个非战斗小咒（荧光闪烁都可能失败）；魔力储量极少，连续施法 2~3 次即告枯竭。
    - 施法特征: 指尖发烫、额头冒细汗；魔力波动肉眼可见（空气涟漪、光点跃动）。
  战斗表现:
    - 防守值系数×0.5，施咒失败率 30%（面板自动应用）
    - 高威力咒语（厉火咒等）直接魔力枯竭倒地，本回合行动失败
  双修表现:
    - 魔力流通不畅：敏感但极易疲惫，双修效率×0.5
    - 高潮时魔力外溢（电火花/灯光闪烁），事后昏睡
  突破条件:
    - 魔力值 ≥30 且 任意咒语等级 ≥3
  突破瓶颈:
    - 情绪不稳——越紧张魔力越逆流，冥想时杂念如潮
  突破仪式:
    - 月圆之夜，在钟楼顶端独自冥想至午夜；静心剂辅助（无则靠意志）
  突破材料: 无需（学徒期根基突破，无需外物）
  失败后果:
    - 魔力短暂紊乱 1 天（当天施咒全失败，面板标记"魔力紊乱"状态）
  表现细节:
    - 气质: 生涩的认真；施法时眉头微蹙，像在搬很重的东西
    - 旁人感知: 靠近时能感到极轻微的魔力波动，像冬天静电
  突破成功后:
    - 写回 stat_data: 层 1→2，层进度清零，突破记录追加一行；AI 按心魔剧情演出后输出【突破结算】块
</阶位_初醒_1>
