<阶位_初醒_2>
阶位_初醒_2:
  层定位: 1-2 初醒·中期
  魔力值区间: 30~59
  咒语上限: Lv4 | 魔咒库容量: 8
  战力系数: 防守值×0.7 | 双修效率×0.7
  层详解:
    - 魔力如烛火初燃，时明时灭；情绪激动时魔力失控外泄。烛火意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×0.7（面板自动应用）；咒语等级上限 Lv4
    - 本层爆发特性：无额外特性
  双修表现:
    - 魔力流转效率×0.7，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥30 且 层进度 100 且 突破魔药×1（无需）
  突破瓶颈:
    - 情绪不稳——初醒境第 2 层的核心考验
  突破仪式:
    - 月圆之夜钟楼顶端冥想
  突破材料: 无需
  失败后果:
    - 魔力短暂紊乱 1 天
  表现细节:
    - 气质/魔力波动：初醒境 中期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
</阶位_初醒_2>
