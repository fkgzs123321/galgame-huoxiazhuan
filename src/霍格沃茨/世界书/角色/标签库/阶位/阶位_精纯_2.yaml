<阶位_精纯_2>
阶位_精纯_2:
  层定位: 5-2 精纯·中期
  魔力值区间: 800~899
  咒语上限: Lv19 | 魔咒库容量: 32
  战力系数: 防守值×2.5 | 双修效率×2.5
  层详解:
    - 杂质淬炼殆尽，魔力纯净如水银；同咒威力大增，消耗大减。水银意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×2.5（面板自动应用）；咒语等级上限 Lv19
    - 本层爆发特性：无额外特性
  双修表现:
    - 魔力流转效率×2.5，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥800 且 层进度 100 且 突破魔药×1（稀有（龙血石））
  突破瓶颈:
    - 执念——精纯境第 2 层的核心考验
  突破仪式:
    - 龙血石+凤凰泪，魔力白焰外放
  突破材料: 稀有（龙血石）
  失败后果:
    - 心神受创，跌落两个层位
  表现细节:
    - 气质/魔力波动：精纯境 中期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
</阶位_精纯_2>
