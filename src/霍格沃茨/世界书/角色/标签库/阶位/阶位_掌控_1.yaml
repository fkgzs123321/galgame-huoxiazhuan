<阶位_掌控_1>
阶位_掌控_1:
  层定位: 4-1 掌控·初期
  魔力值区间: 450~529
  咒语上限: Lv14 | 魔咒库容量: 24
  战力系数: 防守值×1.6 | 双修效率×1.6
  层详解:
    - 从有力量到掌控力量：魔力精度质变，可感知、可分心操控。操控意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×1.6（面板自动应用）；咒语等级上限 Lv14
    - 本层爆发特性：无额外特性
  双修表现:
    - 魔力流转效率×1.6，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥450 且 层进度 100 且 突破魔药×1（稀有（火龙血））
  突破瓶颈:
    - 欲望——掌控境第 1 层的核心考验
  突破仪式:
    - 魔法部登记，三天静默冥想
  突破材料: 稀有（火龙血）
  失败后果:
    - 魔力灼伤，1 个月无法施法
  表现细节:
    - 气质/魔力波动：掌控境 初期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
</阶位_掌控_1>
