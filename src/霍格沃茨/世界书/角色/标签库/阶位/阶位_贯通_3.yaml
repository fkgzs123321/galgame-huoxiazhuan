<阶位_贯通_3>
阶位_贯通_3:
  层定位: 3-3 贯通·后期
  魔力值区间: 390~449
  咒语上限: Lv12 | 魔咒库容量: 22
  战力系数: 防守值×1.5 | 双修效率×1.5
  层详解:
    - 液态魔力贯通全身经脉，与身体合一；施咒如臂使指。经脉意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×1.5（面板自动应用）；咒语等级上限 Lv12
    - 本层爆发特性：无额外特性
  双修表现:
    - 魔力流转效率×1.5，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥390 且 层进度 100 且 突破魔药×1（精良（曼德拉草叶+凤凰泪））
  突破瓶颈:
    - 傲慢——贯通境第 3 层的核心考验
  突破仪式:
    - 独自穿越禁林，突破魔药辅助
  突破材料: 精良（曼德拉草叶+凤凰泪）
  失败后果:
    - 魔力暴走，卧床 3 天
  表现细节:
    - 气质/魔力波动：贯通境 后期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
