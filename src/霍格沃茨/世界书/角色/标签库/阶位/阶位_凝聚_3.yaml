<阶位_凝聚_3>
阶位_凝聚_3:
  层定位: 2-3 凝聚·后期
  魔力值区间: 200~249
  咒语上限: Lv8 | 魔咒库容量: 16
  战力系数: 防守值×1.2 | 双修效率×1.2
  层详解:
    - 魔力凝为液态核心，可压缩储存；施咒不再临场抽取而是有储备。液态意象贯穿本层。
    - 施法特征: 本层特有的魔力外显，与上一层有明显差异。
  战斗表现:
    - 防守值系数×1.2（面板自动应用）；咒语等级上限 Lv8
    - 本层爆发特性：无额外特性
  双修表现:
    - 魔力流转效率×1.2，亲密中的感知与传导随层精进
  突破条件:
    - 魔力值 ≥200 且 层进度 100 且 突破魔药×1（精良（曼德拉草））
  突破瓶颈:
    - 魔力固化——凝聚境第 3 层的核心考验
  突破仪式:
    - 禁林月光泉边，凝聚魔药辅助
  突破材料: 精良（曼德拉草）
  失败后果:
    - 核心裂纹，魔力上限永久-20
  表现细节:
    - 气质/魔力波动：凝聚境 后期 的典型外显
    - 旁人感知: 靠近时的魔力压力等级
  突破成功后:
    - 写回 stat_data: 层推进，层进度清零；AI 按心魔剧情演出后输出【突破结算】块
