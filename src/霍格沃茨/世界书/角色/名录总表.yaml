# 角色名录（轻量速览 · 身份外壳）

> **行为表现一律由标签库驱动**：她的性格标签（2~3）与性癖标签（4~5）条目按 好感度13阶段/欲望度5阶段 自动调度（情境上下文EJS 按 课表.当前目标 getwi 加载）。本名录只承载身份外壳速览；完整数值/秘密/身体状态在 stat_data（initvar 建档）。

## 设计原则
- 角色 = **通用标签组合 + 身份外壳**。标签（傲娇型/大小姐型/学霸型/反差/调教/母狗…）是通用人性组件，任何角色挂上即获得完整行为表现；身份外壳（学院/年级/秘密/口癖）让"这个人"区别于"另一个人"。
- 同一标签可被任意角色使用；同一角色换标签组合 = 不同版本的她（玩家可配置）。
- 新增角色：在 stat_data.女巫角色 按 initvar 格式建档（身份/学院/年级/性格标签/性癖标签/秘密/口癖/名器/技能/能力值/身体状态/生理周期/心理状态），名录追加一行，即可完全由标签库驱动。

