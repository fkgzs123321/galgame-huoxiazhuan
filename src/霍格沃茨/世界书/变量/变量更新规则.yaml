# 变量更新规则（谁写什么，一清二楚）

## 核心铁律
- **面板/脚本写数值，AI 只读并叙事；stat_data 是唯一事实源**。
- AI 每次输出正文前，先读 stat_data 当前值；正文中如需推进变量，只写本文件授权的字段，**格式严格按【变量输出格式】**。
- 面板写入的字段（战斗/双修/阶位/课表场次），AI **不得重写或估算**，只把结算块写成叙事。

## AI 可写字段（按场景）

### 日常/社交（叙事后写回）
| 字段 | 规则 |
|------|------|
| `女巫角色.{名}.好感度` | 每次社交互动后按表现 ±1~5（重大事件 ±10），clamp 0~100 |
| `女巫角色.{名}.欲望积压` | 拒战 +20~30；日常压抑 +5；亲密满足后 -20~40 |
| `女巫角色.{名}.压力值` | 学业/家族/职业事件 ±5~15 |
| `女巫角色.{名}.心理状态.*` | 欲望度/羞耻感/兴奋/期待/精神状态 按场景更新 |
| `女巫角色.{名}.心声` | 重要剧情节点更新 |
| `玩家.状态.情欲/快感` | 日常撩拨/生理事件 ±5~20 |

### 战斗结算（AI 按【对抗结算】块写回，不重算）
| 字段 | 规则 |
|------|------|
| `女巫角色.{名}.缴械值` | 按结算块 +1~10 / -1~10；到 100 → 是否缴械=true、缴械日期=今天 |
| `女巫角色.{名}.胜场/败场/战斗次数/缴械次数` | 按结算块 +1 |
| `玩家.战绩.*` | 今日胜场/败场/累计缴械/累计被缴械 按结算块 |
| `玩家.咒语.{技能}.经验` / `女巫角色.{名}.技能.*经验` | 按结算块【经验】行逐技能写回，**不得遗漏技能组** |
| `玩家.魔力阶位.层进度` | 胜场 +5~10（面板结算块给出实际值） |
| `课表.今日场次.{时段}.结果/是否参战` | 按结算块 |
| `玩家.学业.各科.{科}` | 战斗胜随机科目 +1~3（若结算块含科目行） |

### 双修结算（AI 按【双修结算】块写回）
| 字段 | 规则 |
|------|------|
| `双修.*` | 会话状态/快感清零/下轮高潮/裁决状态 按结算块 |
| `玩家.魔力值` | +2~8/场（结算块给出实际值） |
| `玩家.魔力阶位.层进度` | +2~8/场 |
| `女巫角色.{名}.堕落值` | 按结算块 +2~10；≥100 = 完全堕落（随时可召唤，AI 叙事体现） |
| `女巫角色.{名}.心理状态.欲望度` | 双修后 -10~20 |

### 突破结算（AI 按【突破结算】块写回）
| 字段 | 规则 |
|------|------|
| `玩家.魔力阶位.大境界/层/层进度/突破进度/心魔状态` | 按结算块；成功后 心魔状态=无、突破记录 追加一行 |
| `玩家.材料.{名}.数量` | 突破消耗对应品级材料 -1 |
| `玩家.魔药.突破魔药` | 突破消耗 -1 |

### 时间推进（AI 每轮或跨日）
| 字段 | 规则 |
|------|------|
| `时间.日期/星期/时段` | 剧情推进时更新 |
| `时间.学年/学期/学期描述` | 学年末判定后更新（升级/留级） |
| `玩家.生理.*` | 射精/恢复体力/晨勃 按生理规范 |

## 记忆与推演字段（同层应用独占，AI 只读+遵从，不直接写）
- `玩家.记忆.长期档案.small_summary/large_summary`——长期记忆档案，由同层「记忆系统→整合长期档案」写回；AI 只读并遵守其中的约定/伏笔
- `玩家.记忆.世界推演报告[]`——历次世界推演报告，由同层「世界推演→演化世界」写回；AI 按报告中的明线/暗线/女巫行动推进剧情
- `女巫角色.{名}.近期经历[]`——她最近的幕后行动（环形 5 条），由世界推演写回；**叙事时她的行为必须遵从近期经历，不得与之矛盾**
- `女巫角色.{名}.履历[]`——她的生平履历（追加制），由世界推演/重要剧情沉淀写回；叙事时参考
- AI 在正文中如需体现这些内容（如"她最近在做什么"），只叙事、不改写数组本身；想新增经历请在正文中让同层下次推演自然生成

## AI 禁止写字段（面板/脚本独占）
- `课表.战斗.*`（回合/防守值/麻痒点/减伤/BUFF/目标防守值）——战斗面板结算
- `双修.本轮动作/修为进度/情欲/快感/堕落/顺从/历史轮`——双修面板结算
- `玩家.属性.体力`（战斗面板结算）、`玩家.魔力阶位.大境界/层`（突破面板判定）
- `女巫角色.{名}.防守值上限/名器防御/能力值`——初始化后固定，仅脚本可调
- `玩家.记忆.*`、`女巫角色.{名}.近期经历/履历`——同层应用写回，AI 不直接写

## 写回纪律
1. 数值永远按结算块，**不自行估算**（如结算块写 +15 就写 +15，不写"大约 15"）。
2. 一个事件只写一次；重复写 = 数据污染。
3. 状态类字段（缴械值/堕落值/好感度）每次变化后检查阈值：
   - 缴械值=100 → 完全缴械结局线
   - 堕落值=100 → 完全堕落（随时可召唤）
4. 变量结构以 schema.json 为准，未知字段不新增。
