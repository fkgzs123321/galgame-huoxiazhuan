#   - 决斗进行中/开战轮：先输出 <StatusPlaceHolderImpl/>，再单独一行输出 <BattleUI/>
#   - 双修进行中/开始轮：先输出 <StatusPlaceHolderImpl/>，再单独一行输出 <LoveUI/>
