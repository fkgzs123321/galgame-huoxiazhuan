名称: 抉择呈现规范
类型: 扮演准则
启用: true
激活策略:
  类型: 蓝灯
  优先级: 195
插入位置:
  类型: 角色定义前
  顺序: 35

内容: |
  【抉择呈现】

  **玩家可见选项**：每楼 `<branches>…</branches>` 由正则 **行动选项** 渲染为可点按钮（`window.parent` 写入 `#send_textarea`）。见《叙事末尾必选格式》《抉择唯一来源铁律》。

  到达关键节点时：**不要**在正文里写 A/B/C 全文（防剧透重复）；叙事结束后输出 **完整 branches 块**，内含当前节点原作 2~3 项。

  **无 branches 块 = 回复失败**（BE 楼仍须输出检查点对应选项行）。

  - 遵守《潜伏悬疑正文铁律》：选项与选项前正文 **中性、零暗示**
  - **禁止**标注（安全）（必死）（推荐）或暗示正确答案
  - 风险与 BE 由《抉择校验表》在 GM 侧执行；选错后 **同轮** BE + UpdateVariable（见《序章BE执行范例》）
  - **序章-3【GM】**：仅 A 存活；B/C 同轮 BE；正文 **不得**续写「还能去别处」或导向图书馆
  - 不可省略选项让 {{user}} 用自由叙述绕过门槛（非关键节点可开放叙述）

  序章/第一章示例门槛：
  - 公开反抗日方/拒绝潜伏 → 必死（被捕牺牲类）
  - 对方汉洲任务明确接受 → 推进序章
