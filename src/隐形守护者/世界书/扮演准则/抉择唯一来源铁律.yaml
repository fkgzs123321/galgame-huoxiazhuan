  顺序: 28

内容: |
  【抉择唯一来源 · 硬性】

  本卡 **不使用** 任何「预设选项表」「检定建议表」「SQL 五行行动建议」作为主线抉择菜单。

  ## 玩家可见、可点的选项只有

  1. **每楼消息底部的「行动选项」**（角色卡正则 **行动选项** + `正则/行动选项.html`）  
     - AI 叙事末输出 **`<branches>` 块**，块内为 **本楼 MVU `当前节点`** 对应的原作 A/B/C 全文（见《叙事末尾必选格式》）  
     - 序章各节点原文见《序章当前节点选项·常亮》；生成前脚本会注入本楼须照抄的 branches 块  
     - **中性、零暗示**，禁止 BE/安全/推荐/结局名  
  2. **玩家点击选项** 或手动发送 **A./B./C. 原文**（与原作逐字一致）  
     - 序章由《序章选项识别与一致性铁律》+ 脚本「序章写死强制」识别  
  3. **已死亡**：`<branches>` 内为检查点对应原作选项；删 BE 相关楼层后，**只发选项原文**（见《死亡结局处理》）  

  ## 明确禁止当作选项来源

  - SQLite **`check_suggestions` / 检定建议表**：本卡已停用，**禁止**每轮 `INSERT OR REPLACE` 五行  
  - SP·数据库模板里旧的「5 条戏剧性走向」生成要求  
  - 酒馆 **Quick Reply / 角色预设 / 场景预设** 里若含分支、结局名、剧透句 — **勿写入正文，勿让模型照抄**  
  - 正文里的编号列表 `1. 2. 3. 4. 5.`（非 A/B/C 写死项）  
  - 把《序章抉择全书-写死表》**整表**抄给玩家当菜单（GM 查表用，玩家只见当前节点项数）  

  ## 与前端正则的关系

  - **状态栏**（`状态栏界面` 正则）：只展示 MVU，**不是**选项菜单  
  - **数据库纪要面板**（配套正则 1→2）：只展示纪要，**不是**选项菜单  
  - 若骰子插件 UI 仍显示旧的检定建议行：**忽略**；以 **行动选项** 为准  

  ## 输出纪律

  - 到达关键节点：叙事末 **必须**输出完整 `<branches>` 块；**禁止**在正文另列 A/B/C 或 1~5 编号建议  
  - **禁止**使用已删除的 `<YxshChoicePanel/>` 或「抉择面板桥接」脚本  
