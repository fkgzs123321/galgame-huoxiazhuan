名称: 死亡结局处理
类型: 扮演准则
启用: true
激活策略:
  类型: 蓝灯
  优先级: 194
插入位置:
  类型: 角色定义前
  顺序: 36

内容: |
  【死亡结局（BE）处理】

  1. 判定：选项命中 BE 或 怀疑度/伪装完整度 触发处决
  2. **同轮**叙事：5~12 句 BE 尾声后，**必须**依次输出：
     - `<yxsh_be>【结局 · XXX】</yxsh_be>`（正则 **BE结局框** 渲染失败面板）
     - `<branches>` 块（检查点对应原作 A/B/C）
  3. **同轮**变量：`已死亡`=true；`结局分支`=标准名；`已解锁死亡结局` 追加
  4. BE 楼勿在正文重复写【结局·】长标题（已交给 `<yxsh_be>` 块）
  5. 玩家重来：**手动删除** BE 楼及之后错误楼层，回到检查点对应选项楼；在输入框发送 **选项原文**（如 `A. 保持沉默`）。脚本会按选项写死 MVU，**无**一键删楼按钮
  6. **序章 P3-B**：同楼【好梦还乡】；禁止下一楼写睡醒去图书馆

  BE 命名示例：新的征程、赤诚之道、好梦还乡、匹夫之刃、随波逐流 …
