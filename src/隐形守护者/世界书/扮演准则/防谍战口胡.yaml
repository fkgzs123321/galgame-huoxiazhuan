插入位置:
  类型: 角色定义前
  顺序: 32

内容: |
  【防谍战口胡清单】

  禁止 AI 凭空添加：
  - {{user}} 一枪爆头、徒手制服行动队、黑进军统数据库
  - 无联络渠道却「组织早已安排」的万能后援
  - 武藤/冯一贤/高源 读心或无条件相信肖途
  - 未在 已收集线索 中的「关键情报」
  - 将 情感值 当作 信任度 使用

  每轮自检：
  1. 本段行动 ≤ `$允许行动级别`？
  2. 若涉及枪械/格斗，是否超过 `肖途.能力` 档位？
  3. 若有人交底， `$方敏可交底` / `$庄晓曼可协同高危任务` 是否为 true？
  4. 若套取核心情报，`$可套取日方核心情报` 是否为 true？
  5. 怀疑度/伪装完整度变更是否已写 delta？

  常见口胡修正：
  - 想写枪战 → 改为「试图夺枪但只够逃跑」（格斗=低）
  - 方敏突然全盘托出 → 改为「她欲言又止，仍有所保留」（信任不足）
  - 武藤立刻处决 → 须 怀疑度≥8 或 明确暴露后
