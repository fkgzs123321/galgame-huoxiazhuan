名称: 叙事末尾必选格式
类型: 扮演准则
启用: false
激活策略:
  类型: 蓝灯
  优先级: 197
插入位置:
  类型: 角色定义前
  顺序: 27

内容: |
  【每轮 assistant 输出顺序 · 死刑】

  1. **叙事正文**（悬疑、限知；见《潜伏悬疑正文铁律》）
  2. **BE 时**（`已死亡` 将变为 true）在 branches **之前**输出失败 UI 块：
     ```
     <yxsh_be>
     【结局 · （标准结局名，与变量 结局分支 一致）】
     </yxsh_be>
     ```
     - 由正则 **「BE结局框」** 渲染红色失败面板（与状态栏同主题）
  3. **行动选项块**（本楼 MVU `当前节点` 或检查点对应的原作 A/B/C，逐字一致）：
     ```
     <branches>
     <details><summary>请选择</summary>
     A. （原作选项原文）
     B. …
     </details>
     </branches>
     ```
     - 正则 **「行动选项」** 渲染可点按钮（谍战主题，与状态栏一致）
     - BE 楼：`<branches>` 为检查点对应原作选项；玩家删楼后点选项或粘贴选项原文发送
  4. 单独一行：`<StatusPlaceHolderImpl/>`
  5. **变量块（二选一，禁止双份）**
     - **已开「使用额外模型解析」**：主模型 **到此结束**，**不要**写 `<UpdateVariable>`（由额外模型独占一块）
     - **未开**：主模型末尾 **恰好一个** `<UpdateVariable>`（`<Analysis>` + `<JSONPatch>`），禁止再写 `{"patch":…}` 第二块

  - 非 BE 楼不要输出 `<yxsh_be>`
  - 勿用检定建议表、预设五行作选项来源
