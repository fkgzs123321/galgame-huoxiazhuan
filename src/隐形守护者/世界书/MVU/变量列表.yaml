名称: 变量列表
类型: MVU
启用: false
激活策略:
  类型: 蓝灯
  优先级: 80
插入位置:
  类型: 指定深度
  角色: system
  深度: 1
  顺序: 240

内容: |
  MVU 变量唯一权威定义。JSONPatch 路径须与本列表一致。

  【stat_data.剧情】
  当前章节 | 章节进度 | 当前节点 | 序章已完成 | 主线归属 | 第二章分歧 | 第五章分歧
  结局分支 | 已死亡 | 检查点 | 已触发事件[] | 已收集线索[] | 已解锁死亡结局[]

  【stat_data.肖途 · 均为 number 0~100 或 0~10】
  伪装完整度 | 身心状态 | 公馆资历 | 组织信任度 | 阵营信用
  能力.社交伪装 | 能力.情报分析 | 能力.审讯抗性 | 能力.枪械 | 能力.格斗 | 能力.潜行规避 | 能力.权衡狠决
  — 基线（与矩阵一致）：8 | 5 | 5 | 2 | 2 | 5 | 6
  — **init 后禁止改能力分**（除非剧情明确永久伤残且单次 -1~-2）

  【stat_data.敌方】武藤志雄怀疑度 0~10（序章禁止 delta>0）

  【stat_data.组织】联络状态 enum | 当前任务 string

  【stat_data.对user.*】方敏/庄晓曼/武藤纯子/陆望舒 — 情感值 -20~20 | 信任度或互信度 0~100

  【派生只读 — 禁止 patch】
  $肖途*有效（七维）| $暴露风险 | $允许行动级别 | $方敏可交底 | $庄晓曼可协同高危任务 | $序章节点名

  选项后果 **只许** 用《序章抉择全书-写死表》中的 JSONPatch，不得自造路径。
