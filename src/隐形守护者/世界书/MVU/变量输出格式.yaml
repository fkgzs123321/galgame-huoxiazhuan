名称: 变量输出格式
类型: MVU
启用: false
# 与「[mvu_update]变量输出格式」同内容；主模型备用。默认关，请用「[mvu_update]变量输出格式（额外模型）」。
激活策略:
  类型: 蓝灯
  优先级: 90
插入位置:
  类型: 指定深度
  角色: system
  深度: 1
  顺序: 260

内容: |
  **未开「使用额外模型解析」时**，主模型每轮叙事末附带 **恰好一个** 变量块（开了则由额外模型独占，主模型不要写）：

  <UpdateVariable>
  ```json
  [
    { "op": "delta", "path": "/肖途/伪装完整度", "value": -5 },
    { "op": "delta", "path": "/对user/庄晓曼/情感值", "value": 1 }
  ]
  ```
  </UpdateVariable>

  - 路径为 JSON Pointer，不含 stat_data 前缀；**能力为 0~10 数字**，禁止写「高/中/低」
  - **序章选项**：JSON 必须 **照抄**《序章抉择全书-写死表》对应选项块，禁止自造 delta
  - 玩家做出抉择的同一楼：**禁止** `[]`（通过/BE 都要有补丁）
  - 仅纯氛围、无节点无数值变化时才可 `[]`

  **同轮顺序（强制）**
  1. 叙事正文
  2. `<StatusPlaceHolderImpl/>`（单独一行）
  3. `<UpdateVariable>` … `</UpdateVariable>`

  状态栏读 **本楼层** MVU；补丁写在下一楼则面板不更新。
