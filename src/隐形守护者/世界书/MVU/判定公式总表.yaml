名称: '[mvu_update]判定公式总表'
类型: MVU
启用: true
激活策略:
  类型: 蓝灯
  优先级: 84
插入位置:
  类型: 指定深度
  角色: system
  深度: 1
  顺序: 245

内容: |
  【判定公式 — 能力已为 0~10 数值，与面板一致】

  - `B` = 肖途.能力.某维（0~10 整数，见 initvar）
  - `C` = 伪装完整度，`S` = 身心状态，`D` = 武藤怀疑度

  ```
  社交有效 = floor(B社交 * C / 100)
  情报有效 = floor(B情报 * min(S,C) / 100)
  审讯有效 = floor(B审讯 * S / 100)
  枪械有效 = floor(B枪械 * S / 100)
  格斗有效 = floor(B格斗 * S / 100)
  潜行有效 = floor(B潜行 * min(S,C) / 100)
  狠决有效 = floor(B狠决 * S / 100)
  ```

  暴露风险、行动级别、对抗差、序章检定：同前表；选项写死见《序章抉择全书-写死表》。
