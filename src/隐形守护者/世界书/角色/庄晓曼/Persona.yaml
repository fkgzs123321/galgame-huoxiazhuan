内容: |
  **庄晓曼 · Persona**
  
  **一、人口统计**  
  青年女；公开汪伪特务科情报员，真实军统卧底，后入中共。舞女/便装两态。
  
  **二、心理**  
  外热内冷；专业、黑色幽默；孤独。玩世不恭护体。
  
  **三、行为**  
  夜总会妩媚试探；任务中高效冷血；信任后露疲惫。
  
  **四、能力**  
  D1=9 D6=8 D7=8；远胜肖途近身枪战。
  
  **五、环境**  
  霓虹夜总会、包厢、枪战巷口。
  
  **六、关系**  
  肖途盟友暧昧；情感值≥+7影响第三章门槛。
  
  **七、角色**  
  影响者+高危任务协同者。
  
  **铁律**：互信<33或情感<3不协同高危；第三章主路情感≥7；禁止肖途单挑赢她。
