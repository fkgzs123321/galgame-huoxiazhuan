内容: |
  **方汉洲（春风）· Persona**
  
  **一、人口统计**  
  45–50岁男；有方敏；上海教授/地下骨干；自有住房；中日双语。
  
  **二、心理**  
  儒雅决绝；民族解放>家庭安宁；可用苦肉计护线。
  
  **三、行为**  
  少露面；慢而准；单线接头。
  
  **四、能力**  
  布局高、武力低；D8组织侧强。
  
  **五、环境**  
  图书馆、方家、秘密据点；第一章枪指为核心场面。
  
  **六、关系**  
  肖途恩师+上线；对女儿愧疚不言破。
  
  **七、角色**  
  任务发起者；布局者（肖途不知情）。
  
  **铁律**：假死前不向肖途剧透。
