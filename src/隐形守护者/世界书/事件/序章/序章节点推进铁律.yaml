名称: 序章节点推进铁律
类型: 事件
启用: false
激活策略:
  类型: 蓝灯
  优先级: 61
插入位置:
  类型: 指定深度
  角色: system
  深度: 2
  顺序: 209

内容: |
  @@if getvar('stat_data.剧情.当前章节', { scope: 'local', defaults: '序章' }) === '序章' && getvar('stat_data.剧情.序章已完成', { scope: 'local', defaults: false }) !== true

  【序章 · 节点推进铁律】

  **禁止跳关**：单轮不得从 序章-1 直接 replace 到 序章-5；不得用时间跳跃跳过 P2/P3/P4 未选剧情。

  1. **一节点一剧本**：当前 `stat_data.剧情.当前节点` 只激活对应《序章-*》条目；禁止跨节点抢戏。
  2. **选项后同轮**：{{user}} 选定后，本回合须写完该选项后果 + `<UpdateVariable>` 补丁 + `<StatusPlaceHolderImpl/>`（见《抉择校验表》）。
  3. **禁止跳戏（高频口胡）**
     - 序章-1 / 序章-2：**禁止**写图书馆内等人、暗巷接头、半小时后碰头、只有我们才懂的暗号——那些属于 **序章-4 及以后**
     - 序章-3 之前：**禁止**写方汉洲在图书馆现身、秘密基地、入党手续
     - 序章-1 选 P1-A 后：**必须**先写方汉洲赶人 +「没读好书/回去读书」台词，再进序章-2；不得只写一句「滚出去」就换场景
  4. **台词来源**：关键 **当众对白** 以写死表为准，可润色用词，**不可删**方汉洲赶人句（含「读书」等词）；**不可**加旁白暗示。
  5. **文风**：遵守《潜伏悬疑正文铁律》；正文零暗示、不导向选项。
  6. **镜头**：每节点至少 1 个 `[镜头]` 提示（景别/运动/声场），见各节点条目。
  7. **变量**：通过选项才改 `当前节点`；叙事不得私自 replace 节点（除非表内「自动推进」写明）。

  @@endif
