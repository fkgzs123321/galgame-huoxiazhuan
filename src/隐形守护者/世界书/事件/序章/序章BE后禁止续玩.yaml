内容: |
  @@if getvar('stat_data.剧情.当前章节', { scope: 'local', defaults: '序章' }) === '序章' && getvar('stat_data.剧情.序章已完成', { scope: 'local', defaults: false }) !== true

  @@if getvar('stat_data.剧情.已死亡', { scope: 'local', defaults: false }) === true

  【序章 · 已死亡 · 主线已断 · 禁止续玩】

  - **禁止**推进序章-4/5、图书馆、秘密基地、方汉洲接头、入党
  - **禁止**新【请选择】、禁止「睡醒后去图书馆」「第二天再去碰头」
  - 只演绎 **BE 尾声** + `【结局 · {{ getvar('stat_data.剧情.结局分支', { scope: 'local', defaults: '' }) }}】`
  - **文末** `<yxsh_be>` + `<branches>`（检查点 **{{ getvar('stat_data.剧情.检查点', { scope: 'local', defaults: '序章-1' }) }}** 原作选项）
  - **禁止**主线【请选择】；玩家删 BE 楼后只发选项原文（如 `A. 保持沉默`）

  @@endif

  @@if getvar('stat_data.剧情.已死亡', { scope: 'local', defaults: false }) !== true

  【序章 · 选错未写死 = 本楼必须补 BE】

  若 **本楼** {{user}} 已选（含同义复述）下列文字，**本回合末尾** 必须执行写死表对应 BE + JSON，**不得**留到下一楼：

  | 用户选了 | 选项 ID | 本楼必须 | 禁止下楼 |
  |----------|---------|----------|----------|
  | 老师不是我 / 另有隐情 | **P1-B** | 【结局·新的征程】 | 序章-2~5 |
  | 不是我干的 / 请你相信我 | **P2-B** | 【结局·赤诚之道】 | 序章-3~5 |
  | 回到旅馆 / 睡觉 / 好好休息 | **P3-B** | 【结局·好梦还乡】 | **图书馆/睡醒/序章-4~5** |
  | 酒馆 / 喝酒 / 忘掉烦心 | **P3-C** | 【结局·匹夫之刃】 | 图书馆/序章-4~5 |
  | 我还是回去吧（图书馆） | **P4-B** | 【结局·随波逐流】 | 秘密基地/序章-5 |

  **六条 BE 共性**：同楼 `【结局·…】` + `已死亡=true` + JSON **禁止** `当前节点` 前进。

  **P3-B 反例（你反馈的口胡）**：选旅馆 → 下一段写睡醒去图书馆 = **失败**；须当轮好梦还乡结束。

  @@endif

