内容: |
  @@if getvar('stat_data.剧情.当前章节', { scope: 'local', defaults: '序章' }) === '序章' && getvar('stat_data.剧情.序章已完成', { scope: 'local', defaults: false }) !== true

  【序章 · 十二选 · 机读表（最高优先级 · 回复前必对表）】

  **规则**：{{user}} 本楼已点选 → **只许**执行对应一行；BE **同楼**收束；**禁止**拖楼、禁止替用户选未点项。  
  **生成前**：脚本「序章写死强制」会注入 `[序章写死·本楼已锁定·…]` 系统条并预置 MVU，**正文必须以该条为准**（勿等变量更新后才收 BE）。

  | 节点 | ID | 游戏原文（匹配用） | 本楼终点 | `/剧情/当前节点` | `已死亡` | 禁止叙事/变量 |
  |------|-----|-------------------|----------|------------------|----------|---------------|
  | 序章-1 | P1-A | 保持沉默 | 赶人+读书台词→可进序章-2 | **→序章-2** | false | 图书馆/接头/序章-3选项提前 |
  | 序章-1 | P1-B | 老师不是我/另有隐情 | **【结局·新的征程】** | **不改前进** | **true** | 序章-2及以后 |
  | 序章-2 | P2-A | 都已经过去了 | 方敏离开→本楼末序章-3三选一 | **→序章-3** | false | 图书馆内/接头 |
  | 序章-2 | P2-B | 不是我干的/请你相信我 | **【结局·赤诚之道】** | **不改前进** | **true** | 序章-3及以后 |
  | 序章-3 | P3-A | 去图书馆看看书 | 进馆等待 | **→序章-4** + insert图书馆接头 | false | 秘密基地/方汉洲已接头 |
  | 序章-3 | P3-B | 回到旅馆/好好休息/睡觉 | **【结局·好梦还乡】** | **禁止→序章-4** | **true** | **睡醒/图书馆/接头/序章-4/5** |
  | 序章-3 | P3-C | 酒馆/喝酒/忘掉烦心 | **【结局·匹夫之刃】** | **禁止→序章-4** | **true** | 图书馆/序章-4/5 |
  | 序章-4 | P4-A | 再呆一会儿 | 方汉洲现身→秘密基地 | **→序章-5** | false | 武藤/枪战/第一章 |
  | 序章-4 | P4-B | 我还是回去吧 | **【结局·随波逐流】** | **禁止→序章-5** | **true** | 秘密基地/入党 |
  | 序章-5 | P5-A | 逐一了解 | append 四项简报之一 | **保持序章-5** | false | 跳第一章 |
  | 序章-5 | P5-B | 跳过了解 | 方汉洲喝止，回 P5-A | **保持序章-5** | false | 直接通关 |
  | 序章-5 | P5-C | 取入党申请书 | 四项齐后通关 | **→第一章-0** + 序章已完成 | false | 四项未齐时禁止 |

  **EJS 准入（变量门控，非叙事）**
  - 仅 `已触发事件` 含「序章-图书馆接头」→ 才可演序章-4
  - `已死亡=true` → **禁止**注入序章-1~5 分节点剧本
  - `当前节点=序章-4` 且无图书馆接头 → **非法**，执行熔断或补 BE

  叙事+完整 JSON →《序章抉择全书-写死表》；BE JSON 照抄 →《序章BE执行范例》。

