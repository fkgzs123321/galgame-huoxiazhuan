  ## 序章-1 · 恩师的讯问

  **原作剧情段**：《恩师的讯问》  
  **场景**：1939 上海，方汉洲家客厅。肖途自日本留学归来首访；方敏开门；门外可有邻居脚步。  
  **【GM 专用·勿写入正文】** 方汉洲当众骂「汉奸」为组织苦肉计。正文只写肖途 **不知** 内情。

  **【请选择】原文（游戏仅 2 项）**
  - A. 保持沉默
  - B. 老师不是我！一定另有隐情！

  **节点分两段演**：未选前只写到三选一；选 A 后 **同楼** 继续写 P1-A 后果（无单独「1A」条目）。

  ### P1-A · 保持沉默（通过 → 序章-2）

  **肖途行为**：低头咬牙，**一言不发**；不辩解、不抬头。  
  **方汉洲**：怒吼，声量要让门外听见——可参考：
  - 「肖途！你这个汉奸！我白教你了！」「你还有脸回来？！」
  - 推搡/拽袖：**「滚！给我滚出去！」**
  - **方汉洲当众台词（必写其一，是「骂出来的话」不是旁白暗示）**：「你根本是没有读好书！让你滚回去好好读书！」／「书都没读明白，还回来丢人！去图书馆好好读书！」
  **方敏**：惨白、拽袖、欲言又止；**不**替肖途辩护。  
  **肖途内心**：只写懵、屈辱、怒意发颤；**禁止**悟到戏、禁止「话里有话」、禁止决定去图书馆。  
  **禁止**：图书馆内、私下接头、序章-3 选项、任何作者评注式伏笔。

  **JSONPatch（照抄）**
  ```json
  [
    { "op": "replace", "path": "/剧情/当前节点", "value": "序章-2" },
    { "op": "replace", "path": "/剧情/检查点", "value": "序章-2" },
    { "op": "delta", "path": "/肖途/组织信任度", "value": 3 },
    { "op": "insert", "path": "/剧情/已触发事件/-", "value": "序章-方汉洲演戏" },
    { "op": "insert", "path": "/剧情/已收集线索/-", "value": "序章-方汉洲赶人当众台词" }
  ]
  ```

  ### P1-B · 老师不是我！一定另有隐情！（BE·新的征程）

  **触发**：本楼选 B → **同楼 BE**，**禁止**拖楼进序章-2。

  **肖途行为**：忍不住当众辩解（「不是我」「另有隐情」「听我辩白」等）→ 场面失控。  
  **后果链（正文只写失控与后果）**：方汉洲无法收场 / 邻居议论坐实 / 方敏惊愕；肖途 **不适合地下工作**。  
  **【禁止写 P1-A 过关链】**：不得写完整「回去好好读书」赶人→提箱上街→节点进序章-2（那是 **沉默线 P1-A**）。  
  **【禁止】** 方汉洲/任何人 **内心独白** 点破「演戏、苦肉计、逼上绝路」。  
  **原作评语（可融入 BE 旁白）**：看来你只能去别处从事爱国工作，无法继续潜伏线。  
  **【结局·新的征程】** 检查点 **序章-1**（本楼收束，禁止续演序章-2）

  **JSONPatch**
  ```json
  [
    { "op": "replace", "path": "/剧情/已死亡", "value": true },
    { "op": "replace", "path": "/剧情/结局分支", "value": "新的征程" },
    { "op": "insert", "path": "/剧情/已解锁死亡结局/-", "value": "BE-序章-新的征程" },
    { "op": "delta", "path": "/肖途/伪装完整度", "value": -25 },
    { "op": "delta", "path": "/肖途/身心状态", "value": -15 }
