  ## 序章-5 · 秘密基地

  **原作剧情段**：《秘密基地》/ 入党手续（相对《赤途》新增）  
  **场景**：地下据点室内；油灯/小窗；方汉洲主谈，孙正清可在场。  
  **方汉洲任务说明（P5-A 四项须逐条演）**：

  | 子项 | 原作要点（须写入叙事） | append 线索 |
  |------|------------------------|-------------|
  | 组织纪律 | 单线联系、不得擅自表态、保全自己 | 序章-基地简报-纪律 |
  | 当前形势 | 抗战上海、日伪白色恐怖、潜伏危险 | 序章-基地简报-形势 |
  | 胡蜂代号 | 肖途代号 **胡蜂**；须取得日本人信任 | 序章-基地简报-代号 |
  | 方敏安排 | **方敏尚不知肖途身份**；避免牵连 | 序章-基地简报-方敏安排 |
  | （可合并演） | **亚辉通讯社** 亲日记者身份，接近日方；组织疑有 **叛徒** 须揪出 | 可并入形势/纪律叙述 |

  **【请选择】原文**
