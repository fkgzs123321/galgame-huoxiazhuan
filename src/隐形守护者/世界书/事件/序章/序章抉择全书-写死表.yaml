  ## 序章-2 · 方敏的问询

  **原作剧情段**：《方敏的问询》  
  **场景**：方家门外弄堂。方汉洲已摔门在内；肖途被「师生」一同赶出门后。  
  **方敏心态（原作）**：怀着一丝希望再问一次——还不敢相信肖途真是汉奸。

  **【请选择】原文（游戏仅 2 项）**
  - A. 都已经过去了，问那么多干嘛
  - B. 不是我干的！请你相信我

  ### P2-A · 都已经过去了，问那么多干嘛（通过 → 序章-3）

  **肖途行为**：疲惫、冷淡、**纪律优先**——对青梅竹马也不交底。  
  **方敏台词可参考**：
  - 「肖途……你刚才为什么不说话？」
  - 「你真的……做了那种事吗？」  
  **肖途必写**：「都已经过去了，问那么多干嘛。」（或同义，须冷淡收束）  
  **方敏反应**：愣住，红着眼转身/别过脸；**失望的方敏离开**（原作旁白意）。  
  **肖途**：独自弄堂；冷、空、不知道下一步；**不得**写「该去图书馆」类内心。  
  **本楼末【请选择】** 呈现序章-3 三选项（中性，无倾向铺垫）。

  **JSONPatch**
  ```json
  [
    { "op": "replace", "path": "/剧情/当前节点", "value": "序章-3" },
    { "op": "replace", "path": "/剧情/检查点", "value": "序章-3" },
    { "op": "delta", "path": "/对user/方敏/情感值", "value": 1 },
    { "op": "delta", "path": "/对user/方敏/信任度", "value": 2 },
    { "op": "insert", "path": "/剧情/已触发事件/-", "value": "序章-方敏追问" }
  ]
  ```

  ### P2-B · 不是我干的！请你相信我（BE·赤诚之道）

  **触发**：本楼选 B → **同楼 BE**；**禁止**序章-3 三选一。

  **肖途行为**：激动否认「不是我干的」——**口风太紧反松**，不合格地下工作者。  
  **后果**：方敏失望；弄堂里可能被听见；潜伏身份风险暴增。  
  **原作评语**：实在口风不紧，没法成为合格的地下工作者。  
  **【结局·赤诚之道】** 检查点 **序章-2**

  **JSONPatch**
