内容: |
  【序章 · 非法状态 · 熔断（由 EJS 在 序章-4 无图书馆接头 时注入）】

  `当前节点=序章-4`，但 **无**「序章-图书馆接头」→ 上轮 **未选 P3-A** 或 BE 未写死。

  **本楼禁止**演图书馆等待、禁止方汉洲现身、禁止 P4-A/B 选项。

  **必须二选一**：
  1. 若 {{user}} 上轮选 **旅馆** → 补 **P3-B 好梦还乡** + `已死亡=true`（《序章BE执行范例》）
  2. 若上轮选 **酒馆** → 补 **P3-C 匹夫之刃** + `已死亡=true`
  3. 否则要求玩家删楼后从检查点 **序章-3** 重发选项原文
