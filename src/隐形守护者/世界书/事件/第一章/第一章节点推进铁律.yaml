内容: |
  @@if getvar('stat_data.剧情.当前章节', { scope: 'local', defaults: '' }) === '第一章' && getvar('stat_data.剧情.已死亡', { scope: 'local', defaults: false }) !== true

  【第一章 · 节点推进铁律】

  1. **一节点一剧本**：只演当前 `当前节点` 对应《第一章-*》条目（EJS 按节点 getwi）。
  2. **禁止跳关**：`当前节点` 不得领先 `检查点`；单轮最多 +1 格（通过项）；禁止 第一章-1→10、禁止未 C1-15-A 进第二章。
  3. **变量**：仅允许 schema 路径；禁止 `/肖途/能力` delta、禁止 `$` 派生字段、禁止自创顶层键。脚本会净化 MVU。
  4. **方老师枪指前**：禁止写方汉洲已死、禁止肖途悟到组织布局。
  5. **方老师枪指后（C1-10-A 同楼）**：须演被迫举枪；禁止写成主动弑师邀功。
  6. 变量 `当前节点` 仅能通过写死表选项变更；BE 时 **禁止** 节点前进。

  @@endif
