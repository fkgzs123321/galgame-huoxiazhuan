内容: |
  【第一章 · 非法状态 · 熔断】

  `当前节点` **领先于** `检查点`（未按写死表逐格推进），或 `序章已完成≠true` 却演第一章。

  **本楼禁止**：跳段叙事、提前方老师枪指/叛徒收束、擅自进入第二章。

  **必须**：
  1. 将 `当前节点` **replace** 回 `检查点` 对应格（见机读表上一通过项）；
  2. 或要求 {{user}} 删楼后从 **检查点** 重发选项原文；
  3. 若本楼有点选 → 只执行《第一章抉择全书-写死表》该 ID 的 JSON，**禁止**额外路径。

  脚本「第一章写死强制」会强制净化变量并阻止一次跳多格。
