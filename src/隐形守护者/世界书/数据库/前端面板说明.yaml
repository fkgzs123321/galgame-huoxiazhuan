名称: 前端面板说明
类型: 数据库
启用: false
激活策略:
  类型: 蓝灯
  优先级: 94
插入位置:
  类型: 指定深度
  角色: system
  深度: 0
  顺序: 106

内容: |
  【HTML 面板 · 安装位置】

  ## A. MVU 谍战状态栏（本角色卡正则）

  | 正则名 | 作用 |
  |--------|------|
  | `对AI隐藏状态栏` | promptOnly，隐藏占位符 |
  | `状态栏界面` | `<StatusPlaceHolderImpl/>` → `正则/界面/状态栏.html`（全剧章节轴、本章节点轨、门闩、关系/线索/能力有效值） |

  **状态栏按章节展示**
  - **全剧章节**：序章→终章时间轴；第五章后按 `主线归属` 高亮扶桑/红色/美丽分支章
  - **本章节点**：序章/一/二/三完整轨（三：0~16，14 黄夫人、16 章末里程碑）；第四章起动态 `章-N` 轨
  - **门闩**：Zod 派生（方敏交底、庄协同、自保线、第三章主路等）
  - **关系**：按章节只显示已出场角色（序章仅方敏；二章起庄/纯子等）
  - **剧情档案**：最近线索、已触发事件、BE 收录数

  ## B. 数据库纪要（本角色卡正则）

  配套 1→2→远楼层；需 SP·数据库 注入纪要文本。

  ## C. BE 失败框 + 行动选项（每楼底部 · 必开）

  | 正则名 | 作用 |
  |--------|------|
  | `对AI隐藏BE结局` | promptOnly，隐藏 `<yxsh_be>…</yxsh_be>` |
  | `BE结局框` | BE 失败面板（与状态栏同主题） |
  | `对AI隐藏行动选项` | promptOnly，隐藏 `<branches>…</branches>` |
  | `行动选项` | 可点选项；BE 楼为检查点选项，需手动删楼后重选 |

  - BE 楼顺序：`<yxsh_be>` → `<branches>` → `<StatusPlaceHolderImpl/>`
  - 须启用 **序章写死强制**（自动补 `<branches>`）+ MVU
