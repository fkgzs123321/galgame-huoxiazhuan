名称: 条件模板说明
类型: 数据库
启用: true
激活策略:
  类型: 蓝灯
  优先级: 95
插入位置:
  类型: 指定深度
  角色: 系统
  深度: 0
  顺序: 105

内容: |
  【条件模板 · 启用方法】
  SP·数据库 → 更新 → 勾选 **「启用条件模板功能」**。

  **处理顺序**：EJS 脚本块 → 占位符 → 随机数 → **if cell / if cond 条件模板**（读数据库表，勿在正文写尖括号标签名）

  **本卡表名**
  - `角色属性表` — 方敏/庄晓曼等：情感值、信任度、关系阶段
  - `剧情状态表` — 当前节点（可选 cond 与 EJS 双保险）
  - `肖途潜伏表` — 暴露风险、行动级别（叙事自检）

  **示例（方敏·信任不足不交底）**
  ```
  <if cond="cell:角色属性表/方敏/信任度 < 35">
  方敏欲言又止，只谈家事，不谈组织。
  </if>
  ```

  数值每轮由 MVU JSONPatch 更新后，同轮 SQL UPDATE `character_attr` 镜像。
