名称: 插件栈与分工
类型: 数据库
启用: true
激活策略:
  类型: 蓝灯
  优先级: 98
插入位置:
  类型: 指定深度
  角色: 系统
  深度: 0
  顺序: 102

内容: |
  【隐形守护者 · 标准插件栈】

  **酒馆助手脚本（本卡内置，全部启用）**
  1. **SP·数据库** — `shujuku@spv3.9.8.1`，SQLite + `<tableEdit>` + 条件模板 `<if cell>`
  2. **【骰子系统】-自动更新** — 仅处理正文内 **显式检定 DSL**；**不**读 `检定建议表` 作主线选项（本表已停用）
  3. **MVU** + **Zod** — 剧情节点、BE、伪装/怀疑、情感/信任（权威数值源）

  **正则**
  - **角色卡正则**（见《前端面板说明》）：数据库配套1→2→远楼层 + 状态栏 2 条 + 变量美化 3 条
  - **可选全局正则**（见《全局正则导入说明》）：多卡共用时再导入；与角色卡内嵌二选一

  **导入后**
  - 选中本角色 → 等约 3 秒或点 **「应用本卡SQL模板」**
  - SP·数据库 → **数据隔离** = `隐形守护者` → **表格模板预设** = `隐形守护者·骰子SQL_v4.3`
  - 勾选 **「启用条件模板功能」**
  - 新聊天执行一次「开局初始化SQL」

  **四层分工**
  | 层 | 管什么 | 工具 |
  |----|--------|------|
  | MVU | 当前节点、BE、抉择后果、肖途能力枚举、派生 $暴露风险 | JSONPatch + schema |
  | EJS | 按 `当前节点` 注入序章/章节事件、阶段指导 | @@if + getvar |
  | SQL | 时间地点、NPC 档案、纪要、**角色属性表镜像**（不含检定建议作选项） | `<tableEdit>` |
  | `<if cell>` | 分阶段人设（方敏情感/信任段） | 读 `角色属性表`，不占正文 token |

  **前端召回面板**：见《前端面板说明》；须用户发消息后才会出现，且三条正则已启用。

  **MVU（默认配置）**
  - 酒馆：**勾选**「使用额外模型解析」
  - 世界书：**开启** `[mvu_update]变量输出格式（额外模型）`；**关闭** `[mvu_update]变量输出格式`（主模型随楼写变量，易与额外模型重复出双份 👾 面板）
  - 仍须开启 `[mvu_update]变量更新规则`、`变量列表`（规则与 schema，不是第二份输出格式）

  **互斥**：蛊真人内嵌数据库、第二份 shujuku 预设、st-memory-enhancement 表格插件。
