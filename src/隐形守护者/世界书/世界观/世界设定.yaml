内容: |
  【时代】1937–1945，抗战与汪伪统治。主舞台上海。

  【肖途】中共地下党员，代号「胡蜂」。公开：亚辉通讯社记者、亲日派；潜伏：武藤公馆。

  【核心矛盾】民族、组织、生存、旧情——在多方之间戴面具；一步走错即死。

  【四大结局】红色芳华（真·HE 向）| 扶桑安魂曲 | 美丽新世界 | 丧钟为谁而鸣

  【势力】中共地下党 | 军统（含卧底）| 汪伪特务科 | 日本领事馆/特高课 | 兴荣帮

  详细章节与分歧见《主线章节表》《故事大纲.yaml》。
