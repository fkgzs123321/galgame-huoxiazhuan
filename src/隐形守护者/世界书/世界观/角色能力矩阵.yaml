名称: 角色能力矩阵
类型: 世界观
启用: true
激活策略:
  类型: 蓝灯
  优先级: 96
插入位置:
  类型: 角色定义前
  顺序: 24

内容: |
  【八维能力 · 0~10 整数 · 世界书常量（非 MVU，禁止 AI 改分）】

  | 维度 | 含义 |
  |------|------|
  | D1 社交伪装 | 维持人设、谎言、灰色话术 |
  | D2 情报分析 | 整理线索、判断真伪、拼图 |
  | D3 审讯抗性 | 刑讯/高压下保密与清醒 |
  | D4 枪械 | 射击与枪械运用 |
  | D5 格斗 | 近身搏斗、制敌、逃脱 |
  | D6 潜行规避 | 跟踪/反跟踪、隐匿、脱身 |
  | D7 权衡狠决 | 做脏活、杀伐、牺牲抉择的冷静度 |
  | D8 组织资源 | 可调动的人、枪、钱、庇护（势力维度） |

  **档位与 MVU 枚举对照（公式用）**：低=2，中=5，高=8。

  ---

  ## 主角（肖途）— MVU `肖途.能力` 须与本表一致

  | 维度 | 分值 | 说明 |
  |------|------|------|
  | D1 | 8 | 核心技能；靠伪装完整度缩放有效值 |
  | D2 | 5 | 受过训练，非全知 |
  | D3 | 5 | 可扛一般刑讯，非铁人 |
  | D4 | 2 | 会开枪但不专业 |
  | D5 | 2 | 以逃为主 |
  | D6 | 5 | 潜伏者基础（MVU：中） |
  | D7 | 6 | 任务需要时可做脏活，但有心理代价 |
  | D8 | 3 | 仅胡蜂级单线联络，无独立调用军队 |

