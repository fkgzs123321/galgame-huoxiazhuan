  ## 对比铁律（叙事强制）

  1. 肖途 D4/D5 有效值 **永远低于** 胡一彪、庄晓曼（近身/枪战不可赢）
  2. 肖途 D1 有效值 **仍低于** 武藤志雄、庄晓曼（不可「骗过所有试探」）
  3. 肖途 D8 **低于** 武藤、董旺成、郑西海 — 不可无铺垫「调军队/全城封锁」
  4. 方敏 D7 高但 D1/D6 低 — 她会刚直犯错，不会专业潜伏
  5. 纯子战斗维度低 — 情感/信任线，非战斗 NPC

  有效值计算见《判定公式总表》；叙事前查 `$允许行动级别` 与对抗公式。
