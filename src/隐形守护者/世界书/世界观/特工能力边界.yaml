名称: 特工能力边界
类型: 世界观
启用: true
激活策略:
  类型: 蓝灯
  优先级: 95
插入位置:
  类型: 角色定义前
  顺序: 25

内容: |
  【能力体系入口】

  - **静态矩阵**：《角色能力矩阵》— 全员八维 0~10，禁止 AI 改分
  - **动态有效值**：《判定公式总表》— 肖途七维有效 + 暴露风险 + 行动级别
  - **MVU 基线**：`肖途.能力.*` 枚举（低=2/中=5/高=8），init 后禁止升级
  - **对抗**：肖途.X有效 − NPC.Dx ≤ −3 → 肖途必败

  叙事前自检三连：
  1. `$允许行动级别` 是否够？
  2. 若对抗 NPC，对抗差是否 ≥ −1？
  3. 若交底/协同，`$方敏可交底` / `$庄晓曼可协同高危任务` 是否为 true？

  序章仅检社交伪装与纪律，见《抉择校验表·序章》。
