# 隐形守护者 · 原作剧情骨架（严格复刻用）
# 来源：游戏本体章节结构 + 维基百科人物表 + 社区全结局攻略
# 用途：阶段指导、事件条目、MVU 门槛、抉择校验的事实来源

meta:
  原作: 隐形守护者（改编自橙光《潜伏之赤途》）
  主角: 肖途，代号「胡蜂」
  公开身份: 亚辉通讯社记者 → 武藤公馆干事
  时代: 1937–1945，抗战与汪伪统治下的上海等地

四大主线结局:
  红色芳华:
    路线: 序章 → 一至五章 → 至暗抉择 → 丛林法则 → 大风起兮 → 游戏的规则 → 远东残阳 → 极恶非道 → 终章
    性质: 真结局/HE 方向（肖途完成任务，与方敏重逢）
    主题曲: 深渊的等待
  扶桑安魂曲:
    路线: 序章 → 一至五章 → 菊·刀末刺杀浅野 → 扶桑安魂曲
    性质: 日本线 BE（杀纯子后逃日，死于空袭）
    主题曲: 扶桑安魂曲
  美丽新世界:
    路线: 序章 → 至暗抉择 → 丛林法则 → 美丽世界（背叛组织投靠军统）
    性质: 堕落 BE（抛弃原则，诬陷方敏，被高源毒杀）
    主题曲: 叶雪 / 红
  丧钟为谁而鸣:
    路线: 美丽世界线分歧（第八章关键抉择找回自我）
    性质: 悲壮 BE（掩护方敏撤离，独自面对追兵战死）
    主题曲: 归来

关键路线分歧:
  第二章末:
    共荣圈: 解锁第三章隐藏线，无法通关第三章主路线
    自保的感慨: 第三章主路线前置；需配合庄晓曼情感值≥+7
  第三章:
    庄晓曼情感值≥+7 + 第二章【自保】→ 可通关主路线
    庄晓曼情感值<+7 + 仍走绑架方敏线 → 隐藏死亡/失败结局
  第五章末:
    刺杀浅野博文 → 锁扶桑安魂曲线
    不刺杀/继续潜伏 → 至暗抉择线（可分叉美丽世界/红色芳华）
  第八章美丽世界:
    多个小结局: 行尸走肉、你的名字、十万青年、玉石俱焚、替罪羔羊、残局棋子、美丽世界、丧钟为谁而鸣

