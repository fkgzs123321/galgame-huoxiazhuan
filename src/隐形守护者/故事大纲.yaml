核心情感线（原版复刻）:
  方敏:
    关系: 青梅竹马；地下党「第三号」；红色芳华 HE 归宿
    关键: 不可在第十章过度情报交易式试探；信任她才能过测试
  庄晓曼:
    关系: 汪伪特务科情报员，实为军统卧底，后入中共；肖途重要盟友
    关键: 第二章大量选项±情感；第三章门槛+7；低好感隐藏结局
  武藤纯子:
    关系: 武藤志雄之女，历史老师；扶桑线核心；红色线亦需保护/好感
    关键: 第五章后路线相关；整理书籍解锁日记（好感≥阈值）
  陆望舒:
    关系: 亚辉通讯社同事，肖途妻子（红色芳华线）
    关键: 红色芳华线中后期才充分展开

主要势力:
  - 中共地下党: 春风(方汉洲)、古城(孙正清)、第二号(董旺成)、第三号(方敏)、胡蜂(肖途)
  - 军统: 庄晓曼(卧底)、高源(双面)、郑西海
  - 汪伪: 特务科李峰/胡一彪、公馆冯一贤
  - 日方: 武藤志雄、浅野博文、武藤纯子

