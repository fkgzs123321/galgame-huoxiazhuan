mvu:
  structure: |
    剧情:
      当前章节 / 章节进度 / 主线归属 / 分歧 / 结局 / 已死亡 / 检查点 / 事件与线索
    肖途（动态谍战）:
      伪装完整度 / 身心状态 / 公馆资历 / 组织信任度 / 阵营信用
      能力（基线·禁止升级）: 社交伪装|情报分析|审讯抗性|枪械|格斗
    敌方:
      武藤志雄怀疑度
    组织:
      联络状态 / 当前任务
    对user（情感+信任双轨）:
      方敏 / 庄晓曼 / 武藤纯子 / 陆望舒 — 各含 情感值 + 信任度或互信度
    派生只读:
      $暴露风险 / $允许行动级别 / $方敏可交底 / $庄晓曼可协同高危任务 等

  design_note: |
    好感度 alone 不足以防口胡。情感管态度，信任管交底与协同；
    肖途.能力 为训练基线（ mostly 固定）；伪装/怀疑/行动级别 管「能做什么」。

  variables:
    - path: 剧情.当前章节
      description: 当前所在章节 id，见故事大纲.yaml
    - path: 剧情.章节进度
      type: number
      description: 章内节点序号，用于细分抉择
    - path: 剧情.主线归属
      description: 第五章后锁定；决定注入哪条章节事件链
    - path: 剧情.第二章分歧
      description: 共荣圈/自保；影响第三章门槛与隐藏结局
    - path: 剧情.第五章分歧
      description: 刺杀浅野→扶桑；否则→至暗/红色/美丽
    - path: 剧情.结局分支
      description: 空=进行中；死亡或通关时写入
    - path: 剧情.已死亡
      type: boolean
    - path: 剧情.检查点
      description: 最近一次安全节点 id，供「重来」回滚
    - path: 剧情.已触发事件
      type: array
    - path: 剧情.已收集线索
      type: array
      description: 如方敏信件、纯子日记、帝国黄昏情报等
    - path: 剧情.已解锁死亡结局
      type: array
      description: 探索度记录，可选
    - path: 肖途.伪装完整度
      type: number
      range: 0~100
    - path: 肖途.身心状态
      type: number
      range: 0~100
    - path: 肖途.公馆资历
      type: number
      range: 0~100
    - path: 肖途.组织信任度
      type: number
      range: 0~100
    - path: 肖途.阵营信用
      type: number
      range: 0~100
    - path: 肖途.能力.*
      type: enum
      check: 训练基线，禁止 AI 升级
    - path: 敌方.武藤志雄怀疑度
      type: number
      range: 0~10
    - path: 对user.方敏.情感值
      type: number
      range: -20~+20
    - path: 对user.方敏.信任度
      type: number
      range: 0~100
    - path: 对user.庄晓曼.情感值
      type: number
    - path: 对user.庄晓曼.互信度
      type: number
    - path: 对user.武藤纯子.情感值
      type: number
    - path: 对user.武藤纯子.信任度
      type: number
    - path: 对user.陆望舒.情感值
      type: number
    - path: 对user.陆望舒.信任度
      type: number

ejs:
  generate_before: true
  entries:
    - target: 阶段指导
      condition: 剧情.当前章节 + 剧情.主线归属
    - target: 方敏-调色盘
      stages: [序章至第三章, 第四章后互信, 美丽世界/丧钟线]
    - target: 章节事件条目
      condition: 剧情.当前章节 与 剧情.主线归属 双门控

first_message:
  format: 电影开场 + 首个抉择
  scene: 序章·济仁大学/亚辉通讯社前后，方汉洲布置任务，武藤公馆即将进入
  opening_situation: |
    雨后的上海，潮湿而肃杀。你——肖途——刚收到恩师方汉洲的密谈邀约。
    你知道这一去，可能再也回不到单纯的「学生」身份。
    电报或口信里还有一句：武藤志雄的公馆，需要一双中国人的眼睛。
    第一个抉择即将出现：你如何回应方汉洲的布置？（不可替 {{user}} 代选）

  draft: |
    1939 年，上海。

    亚辉通讯社的走廊里弥漫着油墨和霉味。你把刚排好的稿子交给蒋旭之，他拍着你的肩说：「小肖，今晚别排夜班了，方教授找你。」

    你知道方汉洲找你不会是聊功课。

    济仁大学图书馆后面的旧书库，灯光昏黄。方汉洲合上《资本论》的扉页，声音压得很低：「肖途，组织需要你。武藤志雄的公馆，要一个看起来亲日、读得懂日本报纸的中国人。」

    他顿了顿：「公开身份，还是亚辉的记者。代价——你要让所有人，包括……」他没说完「方敏」两个字。

    窗外传来电车铃声。这一去，可能没有回头路。

    **请选择你的回应：**
    A. 「我接受。请组织明确任务边界与联络方式。」（安全：推进序章）
    B. 「老师，方敏那边我该如何交代？」（灰色：触发方敏相关前置）
    C. 「我拒绝。我不想伪装成汉奸。」（高危：接近序章 BE「被捕牺牲」）
    D. 「我需要时间考虑。」（灰色：可能增加怀疑/延误节点）

implementation_phases:
  phase1:
    name: 可玩 MVP
    scope: 序章 + 第一章 + 第二章前半；MVU 基础；死亡 BE 机制；庄晓曼/方敏情感初值
  phase2:
    name: 第三章门槛
    scope: 共荣圈/自保分歧；庄晓曼 +7；第三章全 BE
  phase3:
    name: 路线分叉
    scope: 第四五章；扶桑 vs 至暗；主线归属锁定
  phase4:
    name: 四大结局
    scope: 第六至终章；美丽世界/丧钟/扶桑/红色芳华；抉择校验表补全
  phase5:
    name: 探索度
    scope: 已解锁死亡结局记录；检查点回滚；可选状态栏 HTML

notes_for_user:
  - 条目约 60+，建议按 phase1 先写 15 条试玩，再扩章
  - 抉择校验表需对照游戏逐选项录入（可边玩边补）
  - 头像 png 就绪后可改 project.avatar 并 pack 为 .png
  - 确认本规划后进入条目创作；如有名称/路线错误请指出
