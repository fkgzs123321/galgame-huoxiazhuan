4',名:'假掰致死',述:'像那种别脚的谎言，轻易出口可是要付出代价的。\n性命诚可贵，但你的比较便宜。'},{编号:'10025',名:'被马踩死',述:'被马踩死'},{编号:'10026',名:'妨碍别人谈恋爱被打死',述:'你迫使别人割舍了一段深挚感情，\n难道还期待人家对你手下留情？'},{编号:'10027',名:'被吵架情侣拳剑合璧打死',述:'打死了你之后，他们就和好了。'},{编号:'10028',名:'被炼死',述:'你被投入炉中，活活炼死。\n制成的丹药投入江中喂鱼。'},{编号:'10029',名:'清理门户',述:'你这唐门叛徒，死有余辜。'},{编号:'10030',名:'斗殴致死',述:'你与人当街斗殴致死，属于斗杀，\n情节较轻，又因江湖纷争，\n官府睁一只眼闭一只眼，所以犯人没受惩罚，\n打死了你这无名小卒，晚饭一样吃得很香。'},{编号:'10031',名:'被鸡腿杀死',述:'在高手眼里，随手一草一木都能当作克敌制胜的兵器，\n何况是鸡腿呢？你死去以后，被后人嘲笑了八百多年。'},{编号:'10032',名:'被龙湘误杀',述:'龙湘作梦都想不到，你竟会接不住这剑。'},{编号:'10033',名:'烂死',述:'你武功实在太差，大师兄还以为你应付得来，\n结果想救都来不及。'},{编号:'10034',名:'分身而死',述:'左边归她，右边归她。\n大家都有，感情才不会散。'},{编号:'10035',名:'被愤怒的铁匠槌死',述:'被愤怒的铁匠槌死。'},{编号:'10036',名:'被女飞贼埋伏刺杀',述:'被女飞贼埋伏刺杀。'},{编号:'10037',名:'被小梅刺杀',述:'你不曾见过比她眼底更深的晦暗。'},{编号:'10038',名:'遭到连累而死',述:'今天本来不是你的死期，你只是受到波及。'},{编号:'10039',名:'人为财死',述:'一场因为金钱纠纷引发的凶杀案。'},{编号:'10040',名:'遭人活活压死',述:'唐门的重担，你终究扛不起，你是一根被骆驼压死的稻草。'},{编号:'10041',名:'丧家之犬的末路',述:'你没有家。你很早以前就死了，残喘至今的，\n不过是一具没有灵魂的躯壳罢了。'},{编号:'10042',名:'恶贯满盈',述:'你半生行恶，不是不报，你的时候已到了。'},{编号:'10043',名:'逃跑失败被处决',述:'逃跑失败被处决。'},{编号:'10044',名:'江湖仇杀令．崆峒',述:'你这崆峒之敌终于恶贯满盈，伏诛而死。'},{编号:'10045',名:'恐惧而死',述:'你没能战胜内心的恐惧，任由那不真实的幻影无边无际扩散，\n令你无法喘息，最终被掐停了呼吸。'},{编号:'10046',名:'为虎作伥',述:'多行不义必自毙，没点本事，连坏人都没得当。'},{编号:'10047',名:'卷入别人的恩怨而死',述:'本来不关你的事，你自找的。'},{编号:'10048',名:'上官萤的制裁',述:'这位姑娘气急败坏，将你一阵狂殴，\n岂料打着打着你就不会动了。'},{编号:'10049',名:'被下马威随手杀死',述:'庸俗的坏人要给下马威，经常随手杀几个喽啰路人，\n以此彰显自己心狠手辣。于是你被杀了。'},{编号:'10050',名:'点苍剑下亡魂',述:'你该知道点苍唐门素有旧仇，既然刀剑相向，\n拿命为人新添一笔剑下功业，应属无怨无尤。'},{编号:'10051',名:'自尽死',述:'生命诚可贵，你怎么会有这种疯狂的想法？'},{编号:'10052',名:'高手过招被波及而死',述:'你就像那些不经打的家具一样脆弱不堪，\n碰你两下就四分五裂。'},{编号:'10053',名:'蒙古大夫你',述:'大夫嘱咐你静养可不是说笑的，\n你非要自创一套说词在那边乱动，\n这下可好，你永远不必动了。'},{编号:'10054',名:'被太阳晒死',述:'二师兄研发的血毒令你死于阳光直晒。\n后世称其此状为紫质症。'},{编号:'10055',名:'被海盗喂鱼死',述:'鱼若有灵必很怒：\n「不要什么垃圾都往海里倒！」'},{编号:'10056',名:'被雷劈死',述:'你以为你赢了，其实你是输家。'},{编号:'10057',名:'咎由自取',述:'身为反派应该有自觉，\n自己撞在正派人士手里，无异于送头。'},{编号:'10058',名:'命如草芥',述:'你失去的只是一条命，\n别的英雄少年失去的可是他的脚趾甲啊！\n就算他脚趾甲跟你无关，你也不能这么自私博取关注啊！'},{编号:'10059',名:'被誤殺而死',述:'比武過招本就有風險，\n人一激動起來，就很難拿捏分寸，\n不小心多打了兩百多拳，請多擔待一下。'},{编号:'10060',名:'被盗版逼到没有活路',述:'你很努力，吃足苦头活到今天。\n但假货根本不在意你感受，他弄死了你，\n代替你享受你应得的福报。'},{编号:'10061',名:'食物中毒死',述:'唐门弟子服毒练功稀松平常，\n普通毒物尝着至多就味儿呛点，\n然而这锅不是普通毒物。'},{编号:'10062',名:'累死',述:'人力有时穷尽，你该掂量掂量自己的余力。'},{编号:'10063',名:'捉拿江洋大盗被反杀',述:'杀了你之后，江洋大盗的悬赏金攀至新高峰，\n然而这并不是什么值得夸耀的事，又不是嫌命太长。'},{编号:'10064',名:'出身未捷身先死',述:'你判断失误，带着师兄弟全军覆没于道中。'},{编号:'10065',名:'被道士当妖怪误杀',述:'何方妖孽，纳命来！\n什么，是人？妈的，这下糟了。'},{编号:'10066',名:'含恨而死',述:'不是所有的冤屈都能雪洗，人间总是不公平。'},{编号:'10067',名:'被揍死',述:'被揍死。'},{编号:'10068',名:'自找死路',述:'你自找的，但起码你有一饱眼福啊。'},{编号:'10069',名:'溺死',述:'你变得皱巴巴的。'},{编号:'10070',名:'眼睛睁睁看你死',述:'夏侯兰冷眼看你犯蠢自杀，\n她可不想承认自己教过你这么个愚蠢又丢人的弟子。'},{编号:'10071',名:'被猪拱死',述:'山猪把你给活活撞死了。'},{编号:'10072',名:'小菜之死',述:'你只是一碟小菜，而且卖相很差。'},{编号:'10073',名:'与花合葬',述:'夏侯兰抱着你的尸身，低声浅唱摇篮曲。\n将你放入墓穴，自己也跳了进去，与雪山先烈合葬。'},{编号:'10074',名:'随便死',述:'夏侯兰杀光了敌人，转头才发现你死在地上。'},{编号:'10075',名:'找死',述:'被你找到了。'},{编号:'10076',名:'看不顺眼被杀',述:'没啥深仇大恨，不过你长得碍眼，\n所以人家不想让你活了。'},{编号:'10077',名:'莽撞而死',述:'你丧生在上官隼刀下，随你而来的师弟妹们，\n一个也没能活着生离风雨山。'},{编号:'10078',名:'天地无声',述:'软弱的正义发不出任何声响，\n你的控诉被喧嚣掩没，深埋尘埃之下。'},{编号:'10079',名:'被人借刀杀死',述:'你死在南宫浅手里，南宫浅死在唐门手里，\n唐门毁在南宫世家手里，冤冤相报何时了？'},{编号:'10080',名:'泄愤不成反被杀',述:'世上多的是不讲理的事，这便是不自量力的下场。'},{编号:'10081',名:'跟黑暗大法师一样',述:'因为你不光明的行径，故称黑暗。\n因为你宛如施展法术般玩弄时间与人心，故称大法师。\n你负了几人，就被分成几半。'},{编号:'10082',名:'殉情',述:'你快步追上了小梅，小梅又好气又好笑，\n希望你下次别再那么冲动了。'},{编号:'10083',名:'被吓死',述:'太可怕了。'},{编号:'10084',名:'被蛇咬死',述:'身为唐门弟子，却被毒蛇咬死，\n非但无人同情，反而令人发噱。'},{编号:'10085',名:'被肉包噎死',述:'你眼看对方人多势众，打不过，\n抓了几个肉包塞嘴里便跑，有道是天理昭昭\n，报应不爽，你给包子活活噎死了。\n路过的狗从你嘴里挖出包子吃掉。'},{编号:'10086',名:'黑吃黑失败',述:'真正的废物，连抢个劫都办不到。\n对，说的就是你。'},{编号:'10087',名:'被卖艺人的毒蛇咬死',述:'蛇见了你，心里害怕，\n为了自保才咬你的。'},{编号:'10088',名:'公报私仇杀',述:'就算他南宫深不要的人，也轮不到你染指！\n去死吧！'},{编号:'10089',名:'偷吃被老丈人砍死',述:'你又没啥好希罕的，老丈人对你压根不需要容忍，\n剁碎了喂狗，再给女儿找个更好更俊的。'},{编号:'10090',名:'六亲不认的胖子',述:'每个人都有逆鳞，四师兄的逆鳞长得像铜钱。'},{编号:'10091',名:'假死变真死',述:'装死的风险请参阅江湖鬼蜮录。'},{编号:'10092',名:'功成名将的脚下枯骨',述:'杀了你，江湖少侠的经验值增加了。\n将来他还会杀掉很多像你这样的喽啰，\n并且获得金钱与道具。'},{编号:'10093',名:'被惊恐的师姊妹失手打死',述:'大半夜你不吱声就先露脸，是想吓死谁？\n你活该啦！'},{编号:'10094',名:'快剑封喉',述:'叶家兄妹卸下了肩上重担，但盼能够投胎到好人家。\n而你个畜生自然要去到畜生道。'},{编号:'10095',名:'降魔不成反被降',述:'史书由胜者书写，赢家说的才算话。\n你会输，只因为正义必胜！受死吧邪魔歪道！'},{编号:'10096',名:'全家餐',述:'狼把你拖走吃了，全家中毒而亡。'},{编号:'10097',名:'败寇之死',述:'赢的才是大侠，死掉的只是尸体。'},{编号:'10098',名:'走路不看路而死',述:'千万不要倒退走路，除非你腚子开了眼。'},{编号:'10099',名:'手贱而死',述:'有没有人告诉过你别胡乱开别的抽屉？'},{编号:'10100',名:'被反震而死',述:'他都没有出手，你就已经倒下了。'},{编号:'10101',名:'狼的宵夜',述:'狼对你的滋味给予好评。'},{编号:'10102',名:'护花死者',述:'你生前没屁用，\n好歹尸身腐朽之后，化作春泥尚能护花。'},{编号:'10103',名:'吸毒死',述:'你都知道有剧毒，还吸，你到底有什么毛病？'},{编号:'10104',名:'传说之下',述:'千面人魔的传说，更添一笔。'},{编号:'11000',名:'忽然就死了',述:'Library/Title/20000 = 回疆隐居'},{编号:'20001',名:'毁灭性声波攻击',述:'对于世界而言，你来得太早了。你的歌声(咆哮)唤醒了人们沉寂在心底的黑暗情感，使死亡金属音乐提前九百年降临在人间。'},{编号:'20002',名:'青春的尾声，梦想的残渣',述:'你送别了梦想，成为大人，此后便不再做梦了。你听闻过他们的音讯，那些旧日时光却像前世一样遥远，难以追回。'},{编号:'20003',名:'唐门叛徒',述:'你背叛了唐门。你说，是为了生存，为了荣华富贵，但内心深处，你知道自己背叛了那份比血还浓的师徒情。'},{编号:'20004',名:'独善其身',述:'比起师门，你选择保全自身，转身逃跑了。纵使无可厚非，你却到老也难以释怀，时时梦见旧事，便热泪盈眶。'},{编号:'20005',名:'睡死',述:'人世最苦莫过于独自清醒，愿君好梦安息。'},{编号:'20006',名:'孤独死',述:'万籁俱寂，天地无声，你终于找到了安宁。'},{编号:'20007',名:'被煮的狗',述:'兔死狗烹，你这走狗已经没有用了。用张大饼就能骗得你团团转，可真划算。'},{编号:'20008',名:'竹之城',述:'你托人弄来了竹苗，在岛上种了一片竹林，自称城主，在竹林围绕之下享天年而终。'},{编号:'20009',名:'退隐江湖',述:'离江湖纷扰，悠悠隔世，往后余生有如笔墨在纸上写下的日记，平淡无奇，日复一日，但每一天都不是虚度。你真实的活过，你自己记得。'},{编号:'20010',名:'魂归故里',述:'欢迎回家。'},{编号:'20011',名:'孤独终老',述:'你身边的花盛开又谢，来去匆匆，而你始终孤独。'},{编号:'20012',名:'西游记',述:'你远赴西域，寻了稳妥营生，学当地的语言与风尚礼节，花钱买了妻子，到老没生大病，临终亦有儿女侍疾，该算是美满才对啊……。'},{编号:'20013',名:'天下寂寥事，与君阔别时',述:'仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她开颜浅笑。活该一生煎熬，来赎她眼泪。'},{编号:'20014',名:'天下寂寥事，与君阔别时',述:'仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她嫣然一笑。活该一生煎熬，来赎她眼泪。'},{编号:'20015',名:'猿鹤虫沙',述:'《抱朴子》曰：「周穆王南征，一军尽化，君子为猿为鹤，小人为虫为沙。」死后尽归黄土。'},{编号:'20016',名:'盲剑客',述:'你瞎眼之后，龙湘十分愧疚，将一身剑法传授给你。你一度凭此扬名于江湖，但是几年以后碰上了狡猾小人，设陷阱害你踏空，随后将你活埋了。'},{编号:'20017',名:'被关到老',述:'你的后半生都在牢里度过，日复一日都面对同一堵墙。往事既遥远又鲜明，回过神来也已经离你好远好远了。'},{编号:'20018',名:'流浪汉',述:'浪迹天涯说得潇洒，说穿便是流浪汉罢。你没有家。'},{编号:'20019',名:'入无穷之门，游无极之野',述:'道可道，非常道。\n你所悟越深，能言越少，终至万籁俱寂，天地无声。\n你没有留下足迹，不施不欠，就像自始自终不曾存在。'},{编号:'20020',名:'退隐江湖',述:'你封剑退隐，一生不再与人动武，活到天命之年。\n偶尔有人对你友善，但有更多的人无端厌恶你、仇视你、嘲讽你。\n恶意无处不在，离了江湖亦然，人间就是这样。'},{编号:'20021',名:'恩仇的尽头',述:'你的怒火将天边的云霞都烧得通红。报了恩，也报了仇。\n恩怨皆成灰，席卷上天，随风远去。'},{编号:'20022',名:'宦海浮沉',述:'你学会官场交际，对上逢迎拍马，对下蛮横无情。\n就是面目丑恶，只要权势够大，一样没人敢说你闲话。\n只是那些噤若寒蝉的人们、那些终生不来看望你的江湖旧友，心底有没有瞧不起你，那就难说了。'},{编号:'20023',名:'赶海人',述:'你一相情愿认为她被溪水冲走了，循着岷江穿流一路向东，直到海边，可是那里也没有她的身影。你每日都看着海，日渐苍老，悔不当初。'},{编号:'20024',名:'退隐江湖',述:'你退隐之后，江湖故事再也不闻不问。\n波澜都在头先廿载，余生不受盛名所牵。你来过，你走了，也许没人在意，可是你自己晓得。'},{编号:'20025',名:'山中老人',述:'你老年被称为山中老人，是天下暗杀者的老祖宗。\n千面人魔的传说还在延续，恐惧笼罩这片大地。'},{编号:'20026',名:'世外桃源',述:'往昔恩怨随风散，岁月悠悠不染尘，你俩的余生既慢且好。'},{编号:'20027',名:'血河刀',述:'江湖人利欲熏心，无人猜得到你不怀好意。\n你用这把刀给唐门报了仇，未斩一人，刀下已伏尸千万，血流成河。'},{编号:'20028',名:'再世庞统',述:'深谋远虑是假，只有其貌不扬是真的。\n拜你所赐，唐门的冤屈得以平反，虽然大家各散东西，却都扬眉吐气。'},{编号:'20029',名:'山林隐逸',述:'你俩是隐居的雅士，反正这个时代配不上你们，不妨孤芳自赏、独善其身，晴时耕牧雨读书，夏赏荷花冬赏雪，不也畅怀？'},{编号:'20030',名:'传说之人',述:'世人众说纷纭，都想知道那位头戴人皮面具的前辈高人是何方神圣，然而，你那天根本没戴面具。'},{编号:'20031',名:'殉志而死',述:'这一路太长太远，本来就强人所难，你已经足够努力了。'},{编号:'20032',名:'全军覆没',述:'是日，唐门叛逆全歼于眉山，无一幸还。大院外堡付之一炬，功过皆化乌有。你们活过，只是谁也不记得了。'},{编号:'20033',名:'行尸走肉',述:'你活着，却已死了很久。\n夏侯兰后悔那日不该绑着你，让你多受几十年煎熬。'},{编号:'20034',名:'慷慨就义',述:'你有路可活，可你非要做那唐门弟子，笑看生杀，慷慨赴义。'},{编号:'20035',名:'唐门的暗器',述:'人死如灯灭，你们燃尽了生命之火，还以颜色。\n几十年后，世人依然记得唐门绝响。'},{编号:'20036',名:'唐门薪火',述:'世上再无唐门，可是薪火不曾断绝。有你和小师妹，以及你们未来的家人。\n唐门最初是一家人，最后仍是一家人。唐家香火，还将继续传承。'},{编号:'20037',名:'神州旅人',述:'你们的旅行，从出发那一日就没停过，走到哪儿玩到哪，她出钱，你卖命，拜访过旧友，又不吝情去留，绕遍神州大地，足迹止于昆仑山。'},{编号:'20038',名:'富甲一方',述:'托上官萤故，赵家成为富甲一方的大户人家。\n上官萤渐渐把生意交给你，自己执掌中馈。\n身为贤妻良母，她从来不打小孩，倘若小孩犯了错，就打你。'},{编号:'20039',名:'小梅私藏',述:'小梅平时贤慧温柔，只是一受刺激就会犯病将你放倒蹂躏。她曾持刀把方圆百里所有女子都恐吓过一遍，警告她们不许靠近你。'},{编号:'20040',名:'千古名匠',述:'你和小竹造出了精妙绝伦的机关人，藏于池水之下，因为机关构造过于复杂，不得不造得大些，分为人、狮、鹰，可以合体。\n如此成就，足以青史留名，但你们唯恐机关人遭到恶用，最终还是决定毁去。'},{编号:'20041',名:'隐世大儒',述:'你夫妻有风骨而不骄衿。\n文士雅士、贩夫走卒都无任欢迎。\n谈笑有鸿儒，往来亦不拒白丁，士农工商皆可为友，平等尊敬认真生活的每个人。'},{编号:'20042',名:'失宠',述:'有了孩子以后，夏侯兰冰冷的心终于化了，而你也失宠了。\n她专心相夫教子，经常庆幸孩子像她不像你，也不许你打骂小孩，极端宠腻。\n为了孩子能有良好的教育，某天出门活捉了魏菊回家担任夫子。'},{编号:'20043',名:'鸡腿大亨',述:'龙渊悄悄来看过你们，一度气得眼冒金星，想想自己也没啥出息，索性就由着你们。\n反正轰轰烈烈的活、平平安安的过，同样是一生。你的岳丈对你要求不多，不用你管天下苍生，只要保护自己家人，只做她的英雄足矣。'},{编号:'20044',名:'最后的唐门弟子',述:'你打算尽可能活久一点，要是连你都没了，世上就再也没人记得唐门了。'},{编号:'20045',名:'相声二人组',述:'你们有时甚至不必准备剧本，随口说话就能引人发笑，你长得越奇怪反而越受欢迎，这才知道原来相声是你的天职。在这领域，你比大师兄还受欢迎，拥有他嫉妒不来的才能。'},{编号:'20046',名:'君所愿兮江湖行',述:'终于轮你当主角，你的谢幕可歌可泣，世上无人再敢看轻你。'},{编号:'20047',名:'武林传奇',述:'耕阳读书斋将你的事迹编撰成书，发行于市。\n唐门活侠的大名一朝传遍中原，无人不知、无人不晓。\n你的名字，从今往后便是传说，受万人崇敬。'},{编号:'20048',名:'丧家之犬',述:'你有一间房子可以遮风挡雨，但已没有故乡能够回去。'},{编号:'20049',名:'峨嵋弟子',述:'你成为峨嵋弟子，享受和旁人一样的待遇与义务。\n以武林一员的身份参与了几件武林大事，无功无过，老了退隐。'},{编号:'20050',名:'窝囊死',述:'被这无情世道以乱拳加身，你的心比身体还要短寿，老早就死了。'},{编号:'20051',名:'苟且偷生',述:'你的骨气打从骨头断掉的那一刻，就烟消云散了。'},{编号:'20052',名:'划地为牢',述:'谁也没留你，你却不舍走远。终你一生，困守于她坟前，流泪忏悔，可她怎会答应？'},{编号:'20053',名:'与妳同行',述:'无论几度轮回，都愿为她跋涉冥河，穿越地狱。'},{编号:'30000',名:'命中有数',述:'尽管未必如意，能够坦然走到这里，也很了不起。'},{编号:'30001',名:'师门砥柱',述:'你从此刻脱胎换骨，像你从前望着大师兄，师弟妹们也信赖你。'},{编号:'30016',名:'武林传奇',述:'你成遂了儿时梦想，证明天弃如你，努力不懈也能有出息。'},{编号:'30017',名:'飞侠归来',述:'他固有他的机缘，但若无你，飞侠归来便遥遥无期。'},{编号:'30018',名:'魔王的爪牙',述:'你是她的心腹，她是你心肝。'}],rj={捅人:[{编号:'001',名:'反击'},{编号:'002',名:'犯剑'},{编号:'003',名:'舞剑'},{编号:'004',名:'追击'},{编号:'005',名:'夺魄幽灵爪'},{编号:'006',名:'雪山飞鸿爪'},{编号:'007',名:'抽人'}],备揍:[{编号:'001',名:'一趾神通'},{编号:'002',名:'归元'},{编号:'003',名:'石灰粉'},{编号:'004',名:'金钟罩'},{编号:'005',名:'收势'},{编号:'006',名:'枯荣神功'}],嘴攻:[{编号:'001',名:'战神语录'},{编号:'002',名:'核枣钉'},{编号:'003',名:'狮子吼'},{编号:'004',名:'苍龙吟'},{编号:'005',名:'虎啸吼'}],绝招:[{编号:'001',名:'天罡伏魔剑'},{编号:'002',名:'太白仙迹'},{编号:'003',名:'猿王回风'},{编号:'004',名:'绝影奇袭'},{编号:'005',名:'铁臂飞拳'},{编号:'006',名:'阴阳夺'},{编号:'007',名:'点破云关'},{编号:'008',名:'云霄雷霆霹雳刀'},{编号:'009',名:'风雷神脚'},{编号:'010',名:'神雷'},{编号:'011',名:'保护云裳'},{编号:'012',名:'同舟剑法'},{编号:'013',名:'第一极招'},{编号:'014',名:'第二极招'},{编号:'015',名:'第三极招'}],暗器:[{编号:'001',名:'打穴娟索'},{编号:'002',名:'金刚神枪指'},{编号:'003',名:'飞燕流星翎'}]},ij=Object.values(rj).flat().map(e=>e.名);const oj={地点代号:{Alchemy:'炼丹房',BackMountain:'后山',Center:'练功场',Door:'大门',Downtown:'闹市',Farm:'义田',Forge:'锻冶场',Fortress:'外堡',Kitchen:'伙房',Mall:'正心堂',Pharmacy:'药铺',Room1:'男弟子房',Room2:'女弟子房',Secret:'神秘房子',Section_01_01:'飞天殿',Section_01_02:'夺魄森林',Section_01_03:'铁拳巷',Section_01_04:'玄功洞',Section_01_05:'夺魄峰',Section_01_06:'无色广场',Section_02_01:'常风观',Section_02_02:'上清宫',Section_02_03:'青城山镇',Spa:'温泉',Study:'讲经堂',Teashop:'茶肆',Tower:'练功塔'},地图地点:{},天赋表:tj,秘籍原文:[{编号:'0000',名:'你的日记',述:'记录了你在唐门打滚的日子。\n只要有时间就会写。\n已经很脏了，其中有缺几页，\n是当年如厕时没有草纸，急用时撕下的。'},{编号:'1000',名:'唐门暗器总纲',述:'唐门弟子人手一本的武功秘籍，\n与《毒经》并列二宝。\n若无师长传授心诀、运劲手法，\n仅靠自学极难寸进。\n开篇《忘形论》你已读得滚瓜烂熟。'},{编号:'1010',名:'掷石问天',述:'飞石帮镇帮秘籍，是帮主年轻时得高人传授的独门暗器手法。\n据说练到精深处，可以在平静水面上以飞石点水，弹跳八十八次。'},{编号:'1020',名:'拈花指法',述:'闻名天下的嵩山指法，取自「释迦拈花，迦叶微笑」的典故。涅盘妙心，不可言说，亦难以文字描述，无形无相，不可思议。这套武学精深奥妙之处，非有慧根而不可得。'},{编号:'1030',名:'金钟罩',述:'嵩山派的经典硬气功，\n乃是嵩山寺十八铜人的拿手绝活。\n金钟罩兼修内外，外壮筋骨，内固脏腑，\n功成之人身似铜铁，纵有拳脚加诸于身，亦不痛不痒。'},{编号:'2000',名:'云霄雷霆霹雳刀',述:'创自前朝大侠雷沾，命名霸气，招数亦丝毫不含糊，招招大开大阔，好似真有九天之雷劈落的气势，出刀之际，还要搭配声嘶力竭的大喝，轰破敌人护体气劲。'},{编号:'2001',名:'流星剑谱',述:'点苍派高深剑诀，剑光奔若流星，一泻千里。\n不求飘逸，只求瞬发。穷究快剑二字，身剑合一，意发并进，快到连影子都追不上身法。\n「足踏、曲弓蓄势、离」，无论身形如何，皆离不开这三句心诀，其快如弓箭离弦，瞬息而至，可瞬间欺入敌怀，不成功便成仁。'},{编号:'2002',名:'翻浪刀法',述:'活跃于福、建地区的沧帮弟子所习练的武功。\n沧帮背后有上官世家撑腰，这是人人都心照不宣的秘密，就连翻浪刀法，都是从上官家传刀法演化出来的，改以船桨、船橹施展，反而欲盖弥彰。\n此刀法施展开来，有如江上波涛汹涌，连绵不绝，遇弱则阵阵相逼，遇强则意守后着，敌人若奋力相抗，不免扑空，一但露出破绽，后浪便咄咄逼来。刚中有柔，柔中有刚，攻中有守，守中有攻，是极上乘的刀法。\n但你拿桨橹习练，注定学歪。'},{编号:'2003',名:'君子论剑',述:'一代儒侠曾文先生所著，总结四书五经十三经，论君子慎其独，由心而表于体，由知而形于礼，不亢不卑，言行如一。月换星移由他，江山易主随你，我自本心，修养自己。\n人间再好，我亦不过是我而已；世道再坏，我亦不过是我而已。舍此色身，亦复如是。\n凡我练剑习武之人，当守本心，以剑锋两刃为镜，不耻问亦求诸己，谦而自强不息，处患难不忧，当宴游惕虑，遇权豪无惧，是为君子剑。'},{编号:'2004',名:'鸳鸯拳剑谱',述:'峨嵋、唐门侠侣闭关钻研出的合击之术。\n一人使拳，一人使剑，交相互补，琴瑟和谐，越是心意相通威力越强。\n你有秘籍，但是没有伴侣。'},{编号:'2005',名:'斩天黑翼双龙剑',述:'需要刀剑齐使才能施展，命名浮夸，招数本身却似乎华而不实，凭着气势一阵乱砍，意外很多人吃这套。'},{编号:'2006',名:'孔夫子剑',述:'这套剑法起草自儒家孔夫子手笔，与骑射之术一并传授弟子的剑术，及后孔夫子周游列国，网罗七国剑法，不断改良精进，身后更经数朝更迭，精益求精，如应「天行健，君子以自强不息」的卦象，刚毅图强，永不停息。\n行己也恭，无所争，无适，无莫，临大节而不可夺，是谓谦仲平和之剑，君子之剑。'},{编号:'2007',名:'柴刀八斩法',述:'峨嵋还是剑派时，遗传下来的古老锻身法，化繁为简，大开大阔，刚猛之处，却又峰回路转，留有余地。八路斩法看似平凡，其实，练不出高深武功，但于强健体魄、拉身筋骨帮助匪浅。'},{编号:'2008',名:'八门锁金刀',述:'青城秘籍，根据《奇门遁甲》中八门方位、星象、地形所制定的单人阵法。\n将此阵法分拆化简，融会入刀招，即成为八门锁金刀，精妙无穷。'},{编号:'2009',名:'三五斩妖剑',述:'东汉道人张陵所传，揉合正一道学问的青城派独门剑法。\n强调以气御剑，于剑中求道，剑路光明正大，斩妖伏魔。'},{编号:'2010',名:'松风剑法',述:'松风剑法'},{编号:'2011',名:'盘古开天破',述:'静江九县小盟主方震天的成名绝技，本是奇门武功，要以铁锤与钉子合使。\n机缘巧合为方震天所得，声称这是他苦心创制的独门武功，为免被人看出手脚，将原本锤法改为刀法，至于钉法则略去不用，因此平空多了许多意义不明的怪招，破绽不小。'},{编号:'2200',名:'天师剑法',述:'泥教六道法王，「判官」赵逵的成名绝招。形似起乩的招数匪夷所思，施展开来阴风阵阵、鬼气森森。虽是剑谱，也有符咒等异术的记载，非常诡异。\n其实正邪焉能貌相，存乎一心而矣！我自一口正气足，何忧世人悠悠之口，不怒自威，宛如钟馗再世，手提三尺天师剑，不斩妖邪誓不休。'},{编号:'2300',名:'点苍剑谱',述:'点苍派剑谱，专走轻、柔、快、变的路子。\n一旦使开，剑意绵绵不绝，有如行云流水般灵动飘逸。'},{编号:'2301',名:'同舟剑谱',述:'苍松剑客叶云舟习剑半生一切所得，在风雨山与恩师诀别之际始终顿悟。\n剑出如奔雷，凌驾于点苍所有快剑之上，乃是唐门的剑法。'},{编号:'2302',名:'云裳剑法',述:'点苍派万里挑一的弟子，能破格进入剑庐三日，参悟点苍剑圣留在剑庐中的三式剑意。\n三招剑意各有奥义，无分高下，得一足以独步江湖，但是十之有九，住上十天半个月都一无所获。\n叶云裳好奇心使然，偷溜进去玩，片刻就被人提了出来。\n她虽不会武功，但是聪明绝顶，而又不落窠臼，仅那片刻，就若有所悟，只是年纪太小，迷迷糊糊。\n今日诀别，才识离愁滋味，往事涌现心头，豁然顿悟，写就此招。\n虽只一式，却残念无穷，此剑即为剑圣第四极招－－「魂游故里芳盈袖，春啼晓，莫挽留」。'},{编号:'2303',名:'点苍棒法',述:'叶云裳擅自涂改点苍剑谱所创的棒法。\n没有杀伤力可言，但是补完了点苍剑法中不尽人意的缺憾之处，料敌所不料，单论招数变化，不失为妙着，就是卑鄙了一点，正常人不会这样。'},{编号:'2400',名:'太白仙迹',述:'李白中年将侍于翰林院，封剑退隐之前留下的剑法，一共三十六式。\n这套剑法只在弟子武谔面前使过仅仅一次，那时李白还喝醉了。\n起似随兴挥洒，偏生处处神来一笔，妙到颠毫，似剑而非剑，破千古窠臼，辟未有之奇。\n一套剑法使完，独立树梢，衣袂飘飘，宛如神仙。而坐观的武谔却全身大汗淋漓。\n相传武谔有艰涩难解处，欲请教师父，李白却道：「莫问我，问了你便学不会。」武谔猛然顿悟，欢天喜地而去，殊不知李白只是宿醉推搪而已。'},{编号:'2401',名:'全真天遁剑法',述:'太古道人郝大通于华山创设全真华山派时携去的原始全真剑法，此书由王喆亲笔写就，丹阳子马钰抄录成七册分予师弟留作纪念，以缅怀师尊。\n气、剑双修，难学难精，深奥非常。'},{编号:'3000',名:'苦恼拳',述:'嵩山寺中僧人禅修苦行，需得戒断三不善根，贪、嗔、痴是世间一切烦恼的根本，烦恼会驱使人造下种种恶业。\n若要得解脱，须了知五蕴，远离颠倒梦想，方能究竟涅盘。\n然而大道在此，世上又有几人能够办到？\n这时，苦恼拳就是一个良善的治标方案，透过练拳挥洒汗水，累瘫了，自然就没力气胡思乱想了。'},{编号:'3001',名:'太祖长拳',述:'因宋太祖赵匡胤而得名，讲究实战攻防，套路严谨，脚步灵活。\n囚身似猫，抖身如虎，行似尤龙，动如闪电。\n虽然冠以太祖之名，但其实是嵩山拳法。'},{编号:'3002',名:'揍狗拳',述:'《道德经》云：「天地不仁，以万物为刍狗。」\n揍狗拳指称的狗，并非真狗，而是世间所有敌人。无论是谁都一视同仁，将他当狗毒打。区区狗仔，何足惧哉？只要认定自己会赢，气势压过对方，那怕是狼、是虎也得在你面前夹着尾巴逃跑。'},{编号:'3010',名:'酩酊玄剑掌',述:'一门神奇的武功，作者姓名已经失佚。\n既是掌法，也是剑法，手中无剑，心中却有剑。\n招数精妙，却无半分杀气，似乎只为自娱，舞来有如清辉明月，酣畅淋漓。'},{编号:'3020',名:'五毒秘录',述:'苗疆五毒教中的用毒法门，与唐门毒经可谓各擅胜场，药理亦不相同。\n它山之石，可以为错。'},{编号:'4000',名:'四平枪谱',述:'四平枪谱'},{编号:'4001',名:'金刚腿',述:'嵩山派名扬天下的硬功之一，由踢桩功为根基，习练者双腿系沙袋，轮流踢踹木桩百次为一趟，初习者分早午晚日踢三趟，随着功力日深，一日踢上十趟、二十趟都是日常。\n及至百日，除却沙袋，脚腿轻灵而势猛如昔，根基已成，再练技巧，弹、蹬、踹、砸、摆、点、撩、扫，八字腿诀，无一不是脚到擒来。'},{编号:'4002',名:'很是用力踢',述:'原名为「风雷神脚」，是善使腿法闻名的英俊侠客「风神」解无尘的成名绝技。可惜在挑战饿鬼道法王刘颚之时，惨遭「犯剑」当众羞辱，解无尘急怒攻心，呕血饮败，被迫依约将「风雷神腿」更名为「很是用力踢」。\n很是用力踢使起来极为凌厉，速度迅猛，宛如风雷引至，能蹴裂山岩，所向披靡，端的是厉害无比。'},{编号:'4003',名:'蛇兔鹰猿搏',述:'相传峨嵋派白猿祖师一日得闲，又去寻他山间猿友游戏，却不意撞见令他震惊至永生难以忘怀的奇葩场面。\n山猿手抓小白兔，蛇缠住了猿猴的身体，老鹰从天而降扑击蛇，小白兔飞脱踩了老鹰的眼睛。\n这画面转瞬即逝，四兽均受了偌大惊吓，四散逃亡，唯独白猿祖师怔然半晌，返屋后不思茶饭，终于第三日融会贯通，于早饭时拍案而起，当众弟子之面演示了这套蛇兔鹰猿搏。\n众弟子各自印证，依资质高低领悟有多寡之别，却唯有一人参悟了兔形拳。'},{编号:'4004',名:'玄玄如意指',述:'武林盟主大侠龙渊七种成名绝技之一。\n玄玄如意，妙手空空，能以素手接人兵器，探人衣囊，无往不利。\n龙渊少年时没少用这招扒人钱财，直到他醒悟茁壮，一肩扛起武林命运，才将秘籍中窃物的手法删除。'},{编号:'4005',名:'那由它劫指',述:'一本古老的指谱，由梵文写成，深藏于藏经阁之下，若非地震，恐怕永世不见天日。\n那由他是为佛教数字概念，意为「多不胜数」。\n劫则是天竺的时间通称，历经成、住、坏、空之后，即为一大劫，故行此功须参悟禅机，不生不灭，以色身历劫无尽，方始证悟大道。'},{编号:'4006',名:'雷神脚',述:'峨嵋派腿法之最，腾跃上天，潜卧于云波诡谲之间，吞吐无定，不鸣则已，一鸣惊人，动如九天神雷轰破云霄，似雷公降下天谴，威力万钧。\n此腿法没有固定套路，有招无式，是为形意拳的究极型态，所象者乃天雷之形，是为雷神脚。'},{编号:'4008',名:'蛇形拳',述:'丐帮善牧蛇，丐帮的蛇形拳不只模仿蛇形，而是货真价实地与爱蛇共斗，出拳、出腿全都需与蛇相配合，除了啄击、缠绕擒拿以外还藏着一记隐形杀招，招数使老的时候，就是必杀之时－－蛇会猝不及防冲出袖子咬人一口！'},{编号:'4009',名:'清峰三十六路',述:'青城天下幽，有山阴阳三十六峰，背靠雪岭，林木森森，四季常青。\n相传唐时有富贾，畏死而求仙，山下问童子，曰：「在林间。」林间问童子：「在山涧。」山涧问童子：「在峦颠。」一路连问三十六峰，又见童子。贾遂知神异，拜于地，童子笑曰：「孺子可教。清修何须苦烦恼，心谦不躁可问道。」\n富贾清修多年，接任掌门，写下此书，字里行间都是闲游三十六峰的快活心境，初入山时的怕心，早已不知不觉遗落在路上了。'},{编号:'4010',名:'历战血书',述:'修罗道法王军旅生涯中随笔的手记，\n所载内容与其说是武功，不如说是沙场见闻。'},{编号:'4020',名:'逍遥游腿法',述:'全真派的轻功兼腿法，逍遥游出自庄子一书，亦是古琴曲。全真派弟子每日练功时会由传功师父奏曲，鲲化为鹏、翼若垂云、将徙天地、上干青霄、扶摇万里、御风冷然、气适北溟、磅礡万物、翱翔广和九段奏完，方始收功。'},{编号:'4030',名:'八荒夺路逃',述:'丐帮中人约定成俗的逃跑技巧，人多时使出非常壮观，一哄而散，四面八方夺路而出，如有心有灵犀般指东跑西，教敌人难以一网打尽，最终总会有落网之鱼可以回家通风报信。\n这逃法以歌诀形式传唱，歌云：「眼看东边走西边，无处可逃上树颠，三五成群铁没命，生死有数莫拖牵。」词虽俗俚浅白，却不单有诡道、还提前做了万一落网的心理建设。'},{编号:'4040',名:'阿摩搪墙拳',述:'阿摩二字，究竟是甚么意思，根本没有人知道。就连丐帮传功长老、耕阳读书斋那群活书包都不知道。\n但是搪墙的意思，则被解读成「涂抹」，换言之这套拳法，是在极狭小的空间里才能发挥最大功效的武功：将敌人推到墙上死命地打，打成肉酱涂抹在墙上。\n虽说理念单纯，可这套武功若无外功底子根本无法成立、寸劲、顿肘、铁山靠，全都是实打实的实战功夫。'},{编号:'6001',名:'罗汉拳谱',述:'嵩山寺中被盗出的拳经，是嵩山武功之根本，易学难精。\n流转民间的罗汉拳谱在数百年间衍生出诸多套路，各领风骚，每本都不太一样，你也不知手里这本是否原版，你既然捡到了这本拳谱，你就有佛缘，练它。'},{编号:'6002',名:'飞天脚',述:'崆峒派‧飞天门的秘籍。\n是先掌派人将《仙鹤迷踪拳》简化以传授弟子的入门版本。\n略去迷踪与拳路，仅就下盘轻功锻炼，浅显易懂。'},{编号:'6003',名:'仙鹤迷踪拳',述:'崆峒派．飞天门的传世武学。\n身法轻灵，拳快步松，最是敏捷多变。时而漫步闲游，时而振翅急袭，叫人捉摸不透，防不胜防。\n只是这路拳法过于复杂，共有三十六路、七十二变、百零八种后着，甚难熟练，因此飞天门中反倒鲜少有人深入钻研。'},{编号:'6004',名:'无影爪',述:'曾经名动一时的怪盗铁面人所独创的爪功。\n不循正理，而是剑走偏锋，潜于昏冥，化身为影，遁入黑夜，施以致命一击。\n铁面人受命于庞太师，意欲袭杀包拯，反心折于包公铁面无私的气魄，不愿以私戕害青天，亦不敢背信，遂自舍优势，暗中行出，向南侠展昭请战，败得光明正大，自断十指，包拯遂赦免死罪。\n铁面人归隐于崆峒，请人铸造铁爪义手，写就此书。'},{编号:'6005',名:'铁臂神拳',述:'相传是陷空岛五义之一，排行老三的「穿山鼠徐庆」所擅长的武功。\n徐庆是铁匠出身，力大无穷，有异术能钻地，故称穿山鼠，五鼠归顺开封府，辅佐包拯。\n嘉佑七年，包公病逝，次年归葬合肥，五鼠一路相送，叩首拜别，各奔东西。\n及后徐庆归隐崆峒，传下铁臂神拳与铁匠技术，逝于铁拳巷大铁铺。\n修练者须双臂涂油，穿入铁环，运功令双臂充血坚硬，再使劲抡打木桩；抡断了木桩以后，抡石桩；抡断了石桩，抡铁桩。万一断的是手臂，就涂药膏待好了继续抡，久而久之，双手就会变得像铁一样。'},{编号:'6006',名:'白猿通臂拳',述:'峨嵋派白猿祖师的成名绝技，严格来说也算是一种猴拳，却与民间所传的猴拳南辕北辙。劲由背发，经肩过肘通达手指，是为通臂。'},{编号:'6007',名:'夺魄幽灵爪',述:'江湖第一美人夺魄幽兰的成名绝技。\n揉合夺魄门暗袭之术与雪山派内功，身法如鬼魅，能勾人魂魄。\n摧心、蚀骨、销魂、夺魄四式，一招狠似一招，极其毒辣，习之恐怕有伤天和。'},{编号:'6008',名:'登云踏．望月',述:'你唐门大师兄登徒子行径中自创的武功，收录于登云梯续集。为了求见美人，可以登云上楼台，其中踏月式是由这路轻功衍生出的攻招，「月」指光辉，暗喻所有加诸于己的兵刃。故而踏月式的真义是专门踏到别人兵刃上，居高临下踩人脸面。'},{编号:'6009',名:'雪山飞鸿爪',述:'你恩师夏侯兰集夺魄、雪山两家之神髓，去芜存菁，又揉合了控鹤气功，终于创制出的神技。\n旨不在杀伤，乃是专门对付高手用的武功，就算是天下最高明的轻功，也捉得到。\n发力恰似飞鸿踏雪泥，泥上偶然留指爪，鸿飞那复计东西？轻描淡写抓出，力使三分藏七分，后着隐于无形。破坏敌人架势，而我迅速回气，施以夺命猛袭。'},{编号:'6010',名:'千刀万剐杀',述:'极度疯狂的刀法，乃是一名身负夺妻之恨的三流刀客所创。\n受冤下狱13年间，在心中揣想过几千次敌人的武功路子，在脑海中将夺妻的仇敌凌迟几万次。\n他出狱后不久，惊动江湖的血案「碧血狂杀」案件旋即爆发。'},{编号:'6011',名:'赤脚神通',述:'与夺魄《镇魂功》、铁拳《伤拳》、玄功《铁琵琶功》同出《南岳真经》的飞天门失传神通。\n飞天脚、仙鹤迷踪步的原始之型。\n功成者可以一趾立地，无须屈膝使力，仅凭内力驱使，便能滑行疾飙。出脚时劲由身通腿，腿通脚，脚通趾，将万钧威力收束于一点，视乎意念，可刚可柔，刚能一趾点破金钟罩，柔能以趾劲封人穴道。'},{编号:'6012',名:'八仙指',述:'唐门女侠唐芬基于青城《八仙剑法》五行学说，以五毒替代之，创成的独门武功。\n论招式至多二流，却隐含唐门医、毒二术，十分艰涩难读，读了也未必能有多大成就。'},{编号:'7000',名:'龟息功',述:'经典江湖鬼蜮伎俩，很多小人都会用。\n敌人太强，不敌之时，便抓准时机，自行运功封阻体内经脉，使气血凝滞，脉搏暂时停止，便好似死了一般。\n待敌人离去后，再藉由预先藏于掌心的石灰发热将自身唤醒。\n不过使用这套内功风险颇高，万一唤醒的机关不太灵验，醒来后也会因为脑缺氧从此变得痴痴呆呆；又万一招惹了狠角色，见你倒下了二话不说便先补个两刀子，假死就便真死了。'},{编号:'7001',名:'莲花落',述:'丐帮人人都会唱的帮歌莲花落，其实是讲究求生技巧的一部内功歌诀。\n每夜收工以后，由辈分较老的乞丐带着小辈齐唱，边唱边以筷敲碗，以此掌握节拍，配合歌曲换气，吐纳习惯自然养成。\n只不过歌词往往粗鄙不堪，有辱斯文，有些对着姑娘家唱还会被报官。'},{编号:'7002',名:'全真剑法',述:'全真教为了推广教义，开民智，而刻意外传的养气内功。\n将剑诀删减，杂以养命之道，以浅白口语重新编译过，浅显易懂，可以初窥道学，延年益命。\n乡亲父老人手一本，人人有功练，堪称国民健康操，但想要以此克敌制胜，恐怕是行不通的。'},{编号:'7003',名:'烈火禅',述:'传自西域密宗的神秘禅功，习练方法与中原武术截然不同，不单姿势古怪，遣词亦十分晦涩，最终二章译得牛头不对马嘴，难以阅读。\n练此禅功讲究身体力行，需点燃炭木，铺以尖锐碎石，再于石上练功，练功者必须潜运内功，将热力排出体外，否则必将引火烧身。\n据闻修练至最高境界可以打坐浮空、手脚关节脱臼伸长打人、口吐烈火。\n但不知最后二章的内容，这个境界是无论如何难以得见的。'},{编号:'7004',名:'杨家练兵操',述:'北宋杨门忠烈的练兵体操。号称体操，然而为了确实提高沙场生还率，本操的锻炼强度不仅远超朝廷正规军，甚至比武林中小门派的功法还要严格，杂以棍操、一百零八阵操、铜锤十八打，这套体操即令是武林中人，怕也没几个受得了。'},{编号:'7005',名:'龙吟功',述:'道门苍龙吟，是以九霄龙吟为譬，形容得道之人飞升清啸，有如龙吟破空般清亮。\n此功须由丹田内气外发，与人交手之际，发功呼啸，声如雷霆疾泻千里，使人心魄为之所夺，甚至还能造成内伤。'},{编号:'7006',名:'混元童子气',述:'虽然效果强大、流传亦广，却没人要练的气功。这是因为此功乃是一门童子的缘故，殊为可惜。\n听说一旦成亲，苦练而来的功力就会散去，任谁都不想孤独终老，所以没人愿意修练这套武功，然则这是世人的误解。所谓童子功，是指留守先天之气以养后天，故而由儿童时期起练最有效果的意思。若打娘胎出生便开始练，不出十二年即可大成。若志学之年起练，筋骨已成，先天之气逸散，则效果半减，而立之年再学，已无用处。\n跟成亲与否其实没有关系。'},{编号:'7007',名:'巫山洞府九宝图',述:'藏于巫山与长江流域交会的钟乳洞中，绘于壁上的神秘武功，不知来历为何，亦不知历时几朝，以九张连环图画演示修练法门，似乎亦正亦邪，绝非寻常练功法门，然则言简意赅，有发聋振聩之效。\n被一名失足落水的渔夫发现以后，誊拓下来，上交朝廷换得奖赏，而朝廷亦不重视，这套武功就此被埋没于达官贵人的书架之上。\n而那钟乳洞亦因水位上升，已被彻底淹没。'},{编号:'7008',名:'铁琵琶功',述:'习练者需单脚立桩，以腿托琵琶，这是飞天门「鹤桩」的轻功；若要掀动铁琴弦，需先习练夺魄门「霜刀破竹指」；再来要鼓动音箱，便须运使玄功门内力，使其共振；御敌时，更能抄起琵琶作为武器，施展铁拳奇门「如意砸」的招数，打爆敌人脑袋瓜。\n功成心念一动，百脉齐鸣，动如响弦，历久不衰，是为崆峒第一神功。'},{编号:'7009',名:'焚心火印',述:'飞天门和夺魄门角逐崆峒门面之选，为求速成，不惜饮鸩止渴，以火蝎毒助长内力，强行突破瓶颈。\n运使焚心火印，能够暂时加速心搏，推动血流、以燃烧余寿为代价，全面提升肉体能力。\n但是代价不只这些，火毒囤积在体内，每达鼎盛就会溢于表征，轻则口干舌燥、牙龈渗血、失眠易怒，重则火气冲脑，不是痴呆就是暴毙。\n每年端午阳气最盛之时尤为凶险，不可不慎。'},{编号:'7010',名:'雪山心法',述:'现今已不存在的雪山派心法，修练方法非常特殊。需吸足真气，赤身裸体、头下脚上插进雪中，只将脚掌露在外边，再由旁人以艾炙足底涌泉穴，使修练者运使心法借艾炙的热力温经通络，调适体温、抵御冰雪。\n没有雪水的话，就近找条清凉的溪流，也可以替代。'},{编号:'7011',名:'玄烛心经',述:'锦香宫主费煞苦心创制，由南宫心法演化而来，旨在助人心意宁定，不致因为悲切而伤身。\n玄烛意指月亮，故而此功又名望月心经。\n人有悲欢离合，月有阴晴圆缺，此事古难全，可即使天各一方，照的都是同一片月光。\n每当恸动之时，当行此功，收敛心神，化悲伤为力量，好好活着。'},{编号:'7012',名:'南宫心法',述:'南宫家世代承传的家学心法，人手一本，歌诀大方的抄录在书本内页。\n揉合道家思想，万变犹定，神怡气静，意守玄关，降伏邪气，虚怀若谷，心神清明。\n以守心为本，而后护身、保家、卫国，是南宫家学的根基。'},{编号:'7013',名:'龙渊七绝',述:'传奇一般的前任武林盟主龙渊的成名功夫，其实并不是一套武功，而是龙渊曾使过的七种绝技。\n刀剑：斩落星辰纲；拳掌：割山掌；腿法：射日腿；枪棍：小霸王枪；长索：离奇点穴绳；暗器：如意指；内功：玄玄造化功。\n当年龙渊号令群雄，攻入旧魔教天堂总坛，独斗极乐教主，斩星射日、霸王割山连番使出，震骇当世正邪两派高手，不约而同都想：「这便是当今天下第一了。」'},{编号:'7014',名:'逐浪诀',述:'武林三大世家上官一脉承传的心法，翻浪刀法的真髓。\n需借汹涌激流练刀，练到能在惊涛之中屹立不摇，挥刀斩浪的地步。\n招数有如沧浪一波未平、一波又起，咄咄逼人，内力到处，更是威力大增，教人便招架住了，也得踉跄几步。'},{编号:'7015',名:'无为丹法',述:'青城派的内功心法，主张无为持修，守无致虚。\n心性清净无为，便是有为，无心无念是为大成，切忌一切意象存想，然道自生。\n难学难精，但是功成之日，非同小可。'},{编号:'7016',名:'虎啸功',述:'道门虎啸功，是以猛虎咆啸为譬，形容修道之人勇猛精进，有如猛虎一般威猛，使群邪辟易。\n此功须由丹田内气外发，与人交手之际，发功呼啸，声如雷霆疾泻千里，使人心魄为之所夺，甚至还能造成内伤。'},{编号:'7017',名:'枯荣神功上卷',述:'枯荣神功上卷'},{编号:'7018',名:'阴阳夺',述:'青城派的神妙武功，融会太极之理，气敛入骨，内固精神，于掌心造化万物，一收一放，一阴一阳，一静一动。\n无论来者劲道是阴是阳，均能化收，犹如泥牛入海，消散无形。'},{编号:'8000',名:'论语',述:'以春秋思想家孔子的言论汇编，\n为儒家最重要的经典之一。\n这是三师兄当私塾先生时，\n为了教授不识字学童而编辑的简单白话本。'},{编号:'8001',名:'孙子兵法',述:'春秋兵圣孙武所著，是为中原最早的兵书，被兵家奉为经典。\n一共十三篇，论述军事，总结战争经验，对后世军策影响极其深远。'},{编号:'8003',名:'雪球教战守则',述:'作者叶云裳，字迹很娟秀，笔锋有些稚趣，就像她的人一般。\n这书写了她的雪仗技巧，煞有其事分了《正攻》、《奇袭》两篇，此书中的招数，多数是她想象出来的。\n包含了在雪球里藏石头、毛虫或者雪球塞裤管等等无所不用其极的残忍伎俩。'},{编号:'8004',名:'十八种奇兵锻法杂记',述:'崆峒铁拳门当代掌门雷谦所书的杂记。\n他自知资质愚钝，唯恐先代巧艺失佚，虽无能开创新局，却发偌大宏愿，将诸般奇兵铸法整汇于此书之中。\n这是一部写给凡人的书。'},{编号:'8005',名:'江湖鬼蜮录',述:'记载了种种江湖伎俩的醒世录，撰书人本意是提醒无辜百姓，莫受人欺，须知人心隔肚皮，害人之心不可有，防人之心亦不可无。\n奈何此书落到坏人手里，登时就变成诈骗宝典，怎么带劲怎么来。'},{编号:'8006',名:'江湖鬼蜮录．续',述:'江湖鬼域录不具名受害者以口代手，咬笔所写的陈情录。\n书中陈述他如何从一个天真无邪、四肢健全的孩童，被诈骗得家破人亡，流落异乡，自食其力却又被人构陷盗窃，获罪入狱，斩去双臂。\n最终他逃出生天，以狱中苦练的核枣钉报仇雪恨。'},{编号:'8007',名:'战神语录',述:'儒家战神孟子周游列国之时舌战群雄、以唇枪舌剑嘴诛口伐，平定中原的语录。来源不可考，不过在乡野传说中，象棋里的「炮」指的其实就是孟子的嘴，可以隔空杀人，而且恐怖之处在于方位拿准了，谁都杀得了。\n无论对方地位如何尊崇、请教的态度如何谦恭，都会惨被孟子教训，他甚至在吵架时甚至用上了孙子兵法和内功，让人被骂时都回不了嘴，被活活骂死都不奇怪。\n骂遍诸子百家，却不许旁人非议他，怒驳：「予岂好辩哉！？予不得已也！！」乃成千古绝响。'},{编号:'8008',名:'南宫风流扇',述:'名闻天下的南宫家学，莫看纸扇摇摇，一派儒雅若不经风，实则非同小可。\n扇法攻防一体，扇柄能打穴，扇面翩飞更藏后手，实为虚，虚为实，内力强者光凭搧风即可憾人，脱手飞旋来去，更是难防难闪。难得的是深有儒风，不骄不馁，谦逊致和。'},{编号:'8009',名:'崆峒玄兵锻法',述:'记载了崆峒四门秘传奇兵的锻造方法，其中颇有机巧之术，鬼斧神工。\n子母鸳鸯钺、机关锯、钩绳飞爪均有所载。\n你虽不使这些兵器，但造出来琢磨研究，精进自身技艺却是可以。'},{编号:'8010',名:'南宫武备论',述:'南宫高祖，武林盟主南宫智的手书抄本。\n笔力雄健，一撇一捺宛若横扫千军，常为南宫族人习帖练字所临摹。\n虽不记载武功，却杂记了南宫智生平所悟，有兵法、学问、医术、心路历程、当代流行穿搭、笑话。\n其实这书还满好看的。'},{编号:'8011',名:'火炎山锻谱',述:'不仅是火炎山剑阁各式兵器、铁器的型录，也涵盖了秘而不宣的锻冶奥秘。\n书中记录了不同金属与合金的特性、配方，利用火炎山地热进行退火、淬火和回火等工艺。\n与你所熟知的唐门锻法相较，更为正宗严谨。'},{编号:'8013',名:'当世词选',述:'一本很新的书，几经波折才流转到你手里。\n前半篇收录了近代词家的名词佳句，包含晏殊、范仲淹、欧阳修、柳永、三苏等才子的杰作。\n后半篇则收录了当世文人的作品，最末数页被人刻意抹黑破坏，已不可读，隐约可见作者姓魏。'},{编号:'8100',名:'温阳活血符',述:'泥教天道的魔教心法。\n一部由医书演变出来的养生气功，以中医「温法」为基础，用有温、辛性质的药物艾炙穴道，驱散寒气，亦能补气养血，十分灵验，有回阳就逆之效。'},{编号:'8101',名:'备急千金要方',述:'药王孙思邈所著，验方经方俱备的医学巨著。\n此书基于《黄帝内经》脏腑学说，搜罗医论、医方、用药、针灸，共有二百三十门，药方五千三百首。\n开卷《大医精诚》一文，首论医德，仁怀天下，影响后世深远。'},{编号:'8102',名:'伤寒杂病论',述:'东汉医国手张仲景所著，是汉医学经典。原典因战火辗转而失佚，此书是后人集《伤寒论》与《金匮要略》所编撰而成。'},{编号:'8104',名:'唐门药典',述:'唐门祖传医书，当世唯一以毒用药的医书。揉合苗疆、佛家学说，观一碗水有八万四千虫，虫即为毒，亦分五行六合，对应五脏六腑，多则害，少则病，尽则虚，错则狂。\n人非不害于五毒，实乃毒性未发而已，唯得用药养之，使其顺心不逆，躯毒为己用，则百病难侵。'},{编号:'8105',名:'宋词选集',述:'魏菊精选的当代杰出文人词集，节录宋词一百阙，平理若衡，照辞如镜。\n所录未必皆是名家手笔，但必为杰作。\n此书是魏菊手抄，字迹娟秀，有如美女簪花，又似鸾飘凤泊，郁郁不能得志，但凡文人雅士，见此册无不欣喜若狂，唯独赠了你这江湖中人。\n她谨守誓约，却藏了一点私心，以「佚名」身份，私心收录了自己旧时著作。'},{编号:'8106',名:'太平圣惠方',述:'翰林医官奉太宗皇帝诏令所编纂的医书。\n包括诊法、处方用药、五脏诸病、内、外、妇、儿、服食、丹药、外益、针炙等内容。\n原典足有一百册，你所得者仅为纲目，因为二师兄认为略去的内容是常识，你应该要知道。'},{编号:'8107',名:'难经',述:'全名为《黄帝八十一难经》，乃著名医学著作，旨为阐发《黄帝内经》的疑难与要旨。\n传为名医扁鹊所著，强调「五邪相干」、「十变」理论，解释五脏生克关系，\n论脉学、经络、脏腑乃至针法的论述，对后世医学影响深远。'},{编号:'8108',名:'折纸集',述:'收录了古今流行的折纸方案，纸盒、纸船、纸蛙、纸鹤、纸鱼、纸花、纸剑到纸登云梯。\n画工细腻，解说清晰，有了这本书，谁都能够成为折纸战士。'},{编号:'8109',名:'九转残篇',述:'记载了极乐教镇教三宝之一《九转轮回大法》的秘籍残篇。\n此册仅为上半卷，旨在讲述心法，而运功法门并不完全。'},{编号:'9001',名:'证类本草',述:'宋代重要医书，记载了多种本草植物的图录。'}],装备表:[{编号:'Ball_01',名:'鞭炮',述:'以硝石、硫磺、碳合成，\n点燃引信掷出后，以霹雳火星伤人。'},{编号:'Ball_10',名:'神奇球',述:'经唐门改良的法宝，只在命中目标时启动，\n展开绳网，将敌人收于袋中，\n同时致毒。时常用来打猎。'},{编号:'Ball_11',名:'流星箭',述:'以护腕机括射出的箭雨，\n流星雨从天而降，故称流星箭。'},{编号:'Ball_20',名:'雷火弹',述:'硫磺、焰硝、麻茹、黄蜡、松脂……等诸多种材料揉成的黑色药粉，\n一旦触地摩擦，就会瞬间引爆，\n威力强大，绝非闹着玩的。'},{编号:'Cloth_01',名:'唐门制服',述:'唐门弟子的旧款制服，\n含护腕，但可动性很差，\n大家都不爱戴。\n制服里刻意缝了沙包，令弟子习惯负重，\n以此锻炼体魄。'},{编号:'Cloth_10',名:'护心镜',述:'往制服内里缝进铜镜，\n保护心脏要害，进一步变重了，\n与此同时，防护的效果也大幅上升了。'},{编号:'Cloth_11',名:'轻量化',述:'舍弃了沙包这等不人道设计的新型制服，\n大伙儿的步伐顿时轻快了许多，\n但是防御性能也趋近没有了。'},{编号:'Cloth_20',名:'密密缝',述:'青衫有缺，蓝衣来补。\n用师父袍子衣料缝补的破衣，\n不仔细看的话青蓝两色不分彼此，\n说是雪山派弟子的制服也不为过。'},{编号:'Cloth_21',名:'纸甲',述:'将韧性极强的树皮和棉混合，\n以唐门药水浸泡，\n经过反复垂打而成。\n虽然是纸，但层层堆栈，\n异常结实，遇水更韧，\n利刃飞矢亦不能轻易洞穿，\n而且远较寻常铁甲轻盈。'},{编号:'Cloth_22',名:'牛皮制服',述:'叶云裳参详青城剑法，\n为你改良的制服。\n在诸要害处缝上牛皮，\n不妨碍活动，\n却能有效预防意外发生。'},{编号:'Knife_01',名:'脱手镖',述:'江湖中人最常用的暗器，\n唐门弟子使飞镖时，\n常往镖身涂毒，纵使一镖射不死人，\n也可制伏敌人。'},{编号:'Knife_10',名:'铁橄榄',述:'形似橄榄的暗器，\n又称核子钉、枣核箭，\n通常以手投掷伤人，亦有高手可以含入口中，\n以内力呵气发射。'},{编号:'Knife_11',名:'飞梭',述:'打造得极为扁薄的银梭，\n唐门打造的飞梭尤其细小，\n不以杀伤力为目标，而是淬以毒药，\n威胁性丝毫不逊于利刃。'},{编号:'Knife_12',名:'袖里箭',述:'藏在护腕里，掀动机关发射的暗器，\n为了掩饰护腕秘密，\n唐门中人使用袖箭时还是会假作挥掷姿势。'},{编号:'Knife_20',名:'飞煌石',述:'路边掂来趁手的坚石皆能作为暗器，\n一股脑儿投出时有如飞蝗过境，\n因而得名，费用低廉，\n难以淬毒，纯以重量伤人。'},{编号:'Knife_21',名:'无形箭',述:'无影无形，无声无兆，\n乍见锋芒，人已封喉。\n是唐门暗器总纲之中的终极暗器，\n真面目是近乎完全透明的琉璃玉镖，\n造价极其昂贵，其威力亦冠绝天下。'},{编号:'Medi_01',名:'南蝥礜石散',述:'用毒虫、毒砂以醋淬煅七次制成的药散，\n味辛热，有蒜臭。\n常人服之五内俱焚，\n唐门弟子服之可以活血祛湿寒。'},{编号:'Medi_02',名:'穿心龙胆汤',述:'用穿心莲、龙胆等药草熬汁炖煮的汤药，\n其苦非常人之所能受，药性之重业已成毒，\n常人服之心悸头疼，唐门弟子服之清热解渴。'},{编号:'Medi_03',名:'胡椒粉丸',述:'把胡椒粉跟山药泥混在一起，\n炙烤成丸。有毒，但是好吃。'},{编号:'Medi_04',名:'乖乖水',述:'可以让人变得听话的药水，\n喝了以后性情会变得温驯。'},{编号:'Medi_05',名:'睡丹',述:'希夷老祖高卧华山，一睡不起，于睡中得道。\n采精神以为药，取静定以为火，\n心息相依，反璞归真。'},{编号:'Medi_22',名:'万灵油',述:'唐门药典残方，出门必备灵药。\n气味清凉，嗅之可提神醒脑，\n夏可解暑、冬可点燃取暖，\n兑水喝可以治腹泻，\n抹在腕上可防蛇虺蚊蚋。\n天下疑难，此方解得十之八九'},{编号:'Melee_01',名:'唐门小剑',述:'唐门弟子人手一柄的标准配备。\n外型看似与脱手标相去不远，\n实则是柄机关剑，\n剑身中空，内有钢球。\n若非习练暗器总纲，等闲难以驾驭。'},{编号:'Melee_10',名:'唐门菁英小剑',述:'根据图谱改良的新型武器，\n取消钢球设计，将刃身打造得极薄，\n平时收纳起来，临阵时以软鞭手法打出，\n出其不意，这也是一种暗器。'},{编号:'Melee_11',名:'切鱼刀',述:'造型奇特、\n却极其锋利的东洋杀鱼刀。'},{编号:'Melee_12',名:'金钱剑',述:'道士驱邪用的法器，\n没人会拿来与人搏斗，除了你。\n倒持的时候，\n是一柄出人意料的凶残钝器。'},{编号:'Melee_20',名:'唐门传承小剑',述:'唐门承传至今的古老小剑，\n以现今弃用的方法铸造。\n将剑中钢球灌注水银，\n使重心无时不刻变动，\n须以内力制驭。\n如果能够熟练使用，可谓其变无穷。'},{编号:'Melee_21',名:'玉霄神匕',述:'小梅爱用的匕首，\n乃是铁拳前掌门手把手带着小竹，\n为小梅打造的兵器。\n玉霄神是对梅花高洁品行的至高赞赏。'},{编号:'Melee_22',名:'沥泉小剑',述:'岳王爷生前爱用的名枪，\n浇过英雄碧血，\n可昭浩然正气，\n破虏光复河山。\n天命会指引它，\n来到下一个英雄手中。'},{编号:'Melee_30',名:'唐门祖师剑',述:'按造失传图谱重铸的祖师短剑，\n此剑是唐门小剑的祖宗，\n形无虚实，势无刚柔，\n执在掌中似剑而非剑，\n脱手可飞旋来去。\n江湖讹传御剑仙术之说，便是由此而生。'},{编号:'Poison_01',名:'赤炼砂',述:'唐门毒经所载，\n以赤炼蛇毒为基调的经典入门款。\n毒性虽烈，却非无药可救。'},{编号:'Poison_10',名:'乌水仙',述:'唐门毒经所载，\n以黄水仙花的球根、草乌炼制的入门麻痹毒药。\n唐门弟子常以此毒涂于暗器，用来打野味。'},{编号:'Poison_11',名:'三阴虫草胶',述:'唐门代表毒药之一，以三种阴毒虫草制成，\n兼具血毒、麻痹两种毒性，\n甚是厉害，适合涂抹在兵刃上伤敌。'},{编号:'Poison_20',名:'彼岸仙香',述:'唐门一位医毒双绝的女前辈所研发的毒香，\n此香对常人有剧毒，\n却对身具胡椒粉的唐门中人有补益效果，\n甚是神妙，正心堂里所焚即为此香。'},{编号:'Trap_01',名:'似草针',述:'锻造成草状，涂成绿色的毒针，\n置于地面，使人难以辨识，\n惊觉的时候，往往便已着了道。\n此陷阱在我方近战弟子阵亡时原地安装。'},{编号:'Trap_10',名:'地鸣雷',述:'以机关制造的小型机雷，\n中有雷火弹，置于地面，\n一旦踩中，便会爆炸。\n此陷阱在我方弟子阵亡时原地安装。'},{编号:'Trap_11',名:'猛火油柜',述:'与四师兄箧笥有相近的变形机构，\n安装以后会回旋喷火。'}],奇物表:[{编号:'1000',名:'小师妹的香囊',述:'小师妹随身配戴的香囊，有她喜欢的香料。\n可以驱虫、驱蛇，但闻久会中毒。'},{编号:'1001',名:'大师兄的涂鸦',述:'完全不知道在画什么东西，\n但是很好笑所以姑且留着。'},{编号:'1002',名:'夏侯兰的发带',述:'夏侯兰爱用的发带，不是什么希罕的事物，质地也普通。\n因为她配戴过，所以才意义非凡。'},{编号:'1003',名:'上官萤的发簪',述:'上官萤的发簪，簪身纯金，串有三颗珍珠，异常名贵。\n是她谈成第一笔大买卖时，奢侈一回送给自己的礼物。'},{编号:'1004',名:'龙湘的发簪',述:'龙湘的玉髓发髻，共有两对，来自大宋进贡给金国的一尊玉龙像。\n她爹龙渊少年时引以为耻，愤而折断龙角逃亡，后来做成发簪，留赠女儿。'},{编号:'1005',名:'叶云裳的梳子',述:'叶云裳所收藏的第一号宝物，象牙梳子。\n纹饰为云与叶，赠你以为结发之证。'},{编号:'2000',名:'反唐门联盟成员清单',述:'反唐门联盟成员清单'},{编号:'2001',名:'机巧飞蝗',述:'你以纯熟匠艺打造的掌心玩物，\n会叫会跳，有多种变速与音效。\n无法当作暗器使用，会坏掉。'},{编号:'2002',名:'崆峒磨喝乐',述:'七夕日供乞巧用的娃娃。常用木、泥或蜡制成，好一点的会用瓷、玉。\n常做成可爱儿童的模样，沦为孩童的玩具。'},{编号:'2003',名:'小竹按摩券',述:'小竹满怀感激，鼓起勇气送出的按摩券。\n多年无人敢用，辗转易主，来到你的手里。'},{编号:'2004',名:'文房四宝',述:'质地上好的文房四宝，即为毛笔、墨、宣纸、砚台'},{编号:'2005',名:'发簪',述:'你自己手削的发簪，其实做工挺精细的，自己看着都挺满意的。'},{编号:'2006',名:'赵活磨喝乐',述:'赵活磨喝乐'},{编号:'3104',名:'江湖快报四月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3105',名:'江湖快报五月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3106',名:'江湖快报六月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3107',名:'江湖快报七月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3108',名:'江湖快报八月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3109',名:'江湖快报九月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3110',名:'江湖快报十月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3111',名:'江湖快报十一月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3112',名:'江湖快报十二月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3201',名:'江湖快报一月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3202',名:'江湖快报二月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3203',名:'江湖快报三月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3204',名:'江湖快报四月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3205',名:'江湖快报五月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3206',名:'江湖快报六月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3207',名:'江湖快报七月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3208',名:'江湖快报八月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3209',名:'江湖快报九月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3210',名:'江湖快报十月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3211',名:'江湖快报十一月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3212',名:'江湖快报十二月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说江湖奇闻轶事之外，还有连载武侠小说。'},{编号:'3301',名:'江湖快报一月号',述:'出自神秘组织耕阳读书斋的江湖刊物。\n除了讲说 服用，则能相生相克，化其药力以为己用。\n龙渊弄丢了一粒，导致相克循环无法收束，只好送你碰碰运气，死了也是你自找的。'},{编号:'6002',名:'九泉丹方',述:'龙渊从极乐教夺来的九泉丹方。\n相传「九转轮回大法」功力每深一层，就会面临一次生死大关，\n届时就得靠这九泉丹由死苏生，脱胎换骨。\n你可以拿去炼丹试试，但是吃了后果自行负责。'},{编号:'6003',名:'还虚丹',述:'还虚丹'},{编号:'6004',名:'睡丹药方',述:'希夷老祖高卧华山，一睡不起，于睡中得道。\n此丹方仅为辅药，倘若再得心诀，合为《睡功》。'},{编号:'6005',名:'万灵油药方',述:'真名为「万法通灵神验膏」。\n传说能够医死人、肉白骨，治万病解万毒，调水可以外敷，内服可以镇毒，舔一舔消暑止腹泻，研磨成粉末，点燃还可以驱蚊，与胡椒粉毒并为唐门两大神药。\n可惜自从唐门药典被焚，药方早已失佚。'}],杂物表:[{编号:'0000',名:'测试杂物',述:'测试杂物'},{编号:'0001',名:'唐门改良金创药',述:'唐门改良金创药'},{编号:'0002',名:'唐门金创药',述:'唐门金创药'},{编号:'0003',名:'狼毒散',述:'狼毒散'},{编号:'0004',名:'健胃药',述:'健胃药'},{编号:'0005',名:'无效健胃药',述:'无效健胃药'},{编号:'1001',名:'岁月欺霜残盒',述:'岁月欺霜残盒'},{编号:'2001',名:'黄酒',述:'四师兄从山下酒家打来，兑水抬价卖给师兄弟们的廉价酒。\n喝了心情会变好，但是喝多不太健康。'},{编号:'2002',名:'茅台酒',述:'产自贵州，酱香型大曲白酒，气味芳香浓郁，\n一瓶能顶两次喝，够劲儿赞。'},{编号:'2003',名:'烧刀子',述:'不调味、酒气浓烈，似火烧，故得此名。\n是百姓的酒，是天下万民的酒。'},{编号:'2004',名:'苏合香酒',述:'相传为宫廷御用的药酒，与苏合香同煮，融其效于酒水中，能安顺五气之气，极为名贵。\n此酒是四师兄历时数月，冒着被官府追缉的风险与同伙私酿的，只敢卖熟人。'},{编号:'2005',名:'羊羔酒',述:'起源于汉魏，兴盛于唐宋之间的高级酒。\n《东京梦华录》有云：色泽白莹，入口绵甘，是以羊羔肉、木香、杏仁等药材入锅煮烂，与黍米同酿而成。能健脾胃、益腰身、大捕元气。'},{编号:'2006',名:'猴儿酒',述:'猴儿酒'},{编号:'3001',名:'纳溪梅岭',述:'产于四川泸县的名茶。\n总是在地最早采摘摘的茶业，每年除夕前煮上，作为年夜茶。\n这茶买来，是你闲来自饮的。'},{编号:'3002',名:'蒙顶露芽',述:'产于四川蒙山顶的名茶。\n蒙顶石花是前朝第一名茶，蒙山茶又称仙茶，世代入贡。\n这茶买来，是你闲来自饮的。'},{编号:'3003',名:'峨嵋雪芽',述:'盛产于峨嵋山云深雾缠处的四川名茶。\n香气清新馥郁，茶汤明亮淡雅，又名「雪香」、「清明香」。\n这茶买来，是你闲来自饮的。'},{编号:'4001',名:'龙象豹力子丹',述:'崆峒铁拳门秘传灵药「龙象豹力丹」，传说服之能生龙象之力，开天辟地。\n这枚是炉底残渣搓成的子丹，母丹被小竹吃了。'},{编号:'4101',名:'南蝥礜石散',述:'用毒虫、毒砂以醋淬煅七次制成的药散，味辛热，有蒜臭。\n常人服之五内俱焚，唐门弟子服之可以活血祛湿寒。'},{编号:'4102',名:'穿心龙胆汤',述:'用穿心莲、龙胆等药草熬汁炖煮的汤药，其苦非常人之所能受，药性之重业已成毒，常人服之心悸头疼，唐门弟子服之清热解渴。'},{编号:'4103',名:'胡椒粉丸',述:'把胡椒粉跟山药泥混在一起，炙烤成丸。有毒，但是好吃。'},{编号:'4104',名:'乖乖水',述:'可以让人变得听话的药水，喝了以后性情会变得温驯。'},{编号:'4105',名:'睡丹',述:'希夷老祖高卧华山，一睡不起，于睡中得道。\n采精神以为药，取静定以为火，心息相依，反璞归真。'},{编号:'4106',名:'万灵油',述:'唐门药典残方，出门必备灵药。\n气味清凉，嗅之可提神醒脑，夏可解暑、冬可点燃取暖，兑水喝可以治腹泻，抹在腕上可防蛇虺蚊蚋。\n天下疑难，此方解得十之八九。'},{编号:'4500',名:'降真香',述:'又名紫檀香，道士开坛请神、作醮、科仪皆用此香。\n青城降真香配方乃当代掌门邹博独门研制，焚之有调养性情，增益修行的效果。'},{编号:'5001',名:'甘蔗',述:'后山砍来的甘蔗，闲时啃一根清凉消暑。\n请不要在床上吃，会弄得到处黏黏的长蚂蚁。'},{编号:'5002',名:'烤鱼',述:'山溪里捉来的鱼，\n一度因为唐门弟子滥捕几乎绝迹。\n唐门弟子变少了以后，此鱼的香火又鼎盛了起来。'},{编号:'5003',名:'肉馅馒头',述:'宋国的馒头，是有馅儿的，与包子的区分就是皮的薄厚、馅的多寡罢了。\n馒头可能有各种口味，但这颗是猪肉包子，因为四师兄酷爱肥滋滋的猪肉，吃来满嘴油花。\n很香，吃的时候经常令旁人垂涎。'},{编号:'5004',名:'肉干',述:'方便保存的干粮。\n有时是炙鸡、有时是鹿脯、獐豝、猪肉。\n吃起来风味不同，滋味也过得去，没赶上饭点的时候可以充饥。'},{编号:'5005',名:'姜记肉包',述:'传说中的姜记肉包，好吃到不行。'},{编号:'5006',名:'中药蜜饯',述:'唐芳之姐发明的甜点，以川贝母、枇杷叶、甘草、白芍、蜂蜜、桔梗、三阴虫草胶所腌渍的蜜饯，不仅有清热止血的功效，常用于治疗喉咙痛、咳嗽等症状，而且还很好吃，哄骗小孩的利器，二师兄孩提时候曾因此蛀牙。'},{编号:'5007',名:'盐腌山猪肉',述:'用唐门赤炼砂盐腌的山猪肉，\n味辛而咸香，很有嚼劲\n，有一股原始而质朴的风味，但是有毒。'},{编号:'5008',名:'豆沙包',述:'揉以甜豆馅中和苦味的药包子，叶云裳咬了一口。'},{编号:'5009',名:'湘妃鱼糕',述:'相传是女英所创，因为娥皇想吃鱼却怕刺，故以鱼糜混以蛋清、蜂蜜、糯米粉，蒸煮成糕。江陵无羡居的鱼膏尤为名贵，价格不斐。\n四师兄送你的这一块，是从地上捡到的，沾了灰尘，还发霉。'},{编号:'6001',名:'接骨草',述:'接骨草'},{编号:'6002',名:'海芋的茎',述:'海芋的茎'},{编号:'7001',名:'折价卷',述:'折价卷'},{编号:'7002',名:'色纸',述:'四师兄知道这笔买卖绝对不会失败。\n唐门里必定会有人买下这件事物，送给小师妹。\n不论是你或是谁都可以，四师兄不在意你们的儿女情长，他只在意他自己。'},{编号:'7003',名:'磨喝乐',述:'时下流行的玩具，在京师贵人口里谓之磨喝乐，源自梵文音译。\n但在你西蜀乡下，就朴实的称作泥孩儿。\n以土、木为材料做成的玩偶，栩栩如生。'},{编号:'7100',名:'失败木剑',述:'叶云舟应外堡孩童要求所削的木剑，因为不太熟练，所以削得像狗啃，惨不忍睹。'},{编号:'7101',名:'木剑',述:'叶云舟应外堡孩童要求所削的木剑，削得多了自然掌握诀窍，因此变得熟练了一点，可以削出笔直的剑形了。'},{编号:'7102',名:'听云木剑',述:'叶云舟应外堡孩童要求所削的木剑，最近削出心得来了。\n不仅学会用工具，还有闲心雕花，做成了听云剑的造型。'},{编号:'7200',名:'龙湘的碎银',述:'龙湘被偷走的盘缠。'},{编号:'7300',名:'金念珠',述:'金念珠'}],图鉴表:nj,骰子表:{Act_1_001:'你是',Act_2_1_001:'对手是',Act_2_3_001:'是谁？',Act_3_2_001:'挑战者是',Back_Work_501_001:'叶云裳的冲击',Back_Work_M_02_001:'不速之客向你逼近',Ch_0_4_001:'做点事情吧',Ch_0_4_002:'小师妹的想法',Ch_0_5_001:'落跑的唐门弟子',Ch_0_5_002:'来者何人',Ch_0_M_02_001:'你想说的事情',Ch_0_M_03_02_001:'送给飞石帮主的礼物',Ch_0_M_04_01_001:'段考的考官',Ch_1_1_001:'招募弟子结果',Ch_1_1_1_001:'掌门找你的原因',Ch_1_1_1_002:'你干了哪件事',Ch_1_1_2:'愤怒指数',Ch_1_2_1_001:'段考的考官',Ch_1_2_3_001:'三师兄想教你练功',Ch_1_2_3_002:'惊吓指数',Ch_1_2_3_3:'大师兄要求与飞石帮战斗',Ch_1_4_2_1:'是否听过杏梢锦囊',Ch_1_4_2_2:'你的反应',Ch_1_4_2_3:'领悟其中之意',Ch_1_4_3_4:'要做什么呢',Ch_1_4_3_5:'是否听过阎关三煞的名号',Ch_1_5_1:'客栈的消遣',Ch_1_5_1_1:'赢钱了吗',Ch_1_5_1_2:'要读什么书呢',Ch_1_5_1_3:'找工作的际遇',Ch_1_5_4:'了解二师兄的深意',Ch_1_5_5_1:'这口痰命中你的机率',Ch_1_5_5_2:'可疑行径的威慑力',Ch_1_5_6_1:'理解二师兄的深意',Ch_1_5_6_2:'为何你会身中此毒',Ch_1_5_6_3:'往下跳的结果',Ch_1_5_7_1_1:'你的察觉',Ch_1_5_7_1_2:'你的抉
