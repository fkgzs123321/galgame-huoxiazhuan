# ════════════════════════════════════════════════════════════
# 同级生2 · 时间线 / 关键事件总表
# ════════════════════════════════════════════════════════════
# 单一真相源：本文件汇总所有按 day/time_slot 触发的关键事件
# 子调度器：世界书/EJS预处理/寒假日程调度器/<dayXX>.txt
# 详细分支：世界书/事件/<event_name>.txt
# 章节切换：世界书/阶段指导/<chapter>.txt
# ════════════════════════════════════════════════════════════

timeline:
  # ─── 寒假前奏（day 1-5，12-22 ~ 12-26） ───
  - day: 1
    date: '12-22'
    weekday: '周五'
    chapter: '寒假前奏'
    key_events:
      - time_slot: '早'
        event_id: 'EV001'
        type: '开场'
        description: '主角醒来，美佐子提议去咖啡店/学园'
        trigger: '首次对话'
        flag_set: 'chapter_progress=寒假前奏'
      - time_slot: '上午'
        event_id: 'EV002'
        type: '女角登场'
        description: '水野友美邻家重逢（10年邻居）'
        trigger: '场景.当前地点=自宅周边 OR 主角外出'
        flag_set: 'has_met_水野友美=true'
      - time_slot: '下午'
        event_id: 'EV003'
        type: '场景探索'
        description: '商业区/学园/海岸开放探索'
        trigger: '主角选择移动'
      - time_slot: '晚'
        event_id: 'EV004'
        type: '家庭'
        description: '与唯/美佐子晚餐场景'
        trigger: '场景.当前地点=鸣泽家'
  - day: 2
    date: '12-23'
    weekday: '周六'
    chapter: '寒假前奏'
    key_events:
      - time_slot: '上午'
        event_id: 'EV005'
        type: '女角登场'
        description: '舞岛可怜学园偶遇（卸妆状态）'
        trigger: '场景.当前地点=八十八学园'
        flag_set: 'has_met_舞岛可怜=true'
      - time_slot: '下午'
        event_id: 'EV006'
        type: '女角登场'
        description: '筱原泉美图书馆偶遇'
        trigger: '场景.当前地点=八十八学园图书馆'
        flag_set: 'has_met_筱原泉美=true'
  - day: 3
    date: '12-24'
    weekday: '周日'
    chapter: '寒假前奏'
    key_events:
      - time_slot: '上午'
        event_id: 'EV007'
        type: '女角登场'
        description: '加藤美纪学园神秘少女初遇'
        trigger: '场景.当前地点=八十八学园'
        flag_set: 'has_met_加藤美纪=true'
      - time_slot: '下午'
        event_id: 'EV008'
        type: '女角登场'
        description: '南川洋子海岸机车行初遇'
        trigger: '场景.当前地点=八十八海岸 OR 机车行'
        flag_set: 'has_met_南川洋子=true'
      - time_slot: '上午'
        event_id: 'EV009'
        type: '女角登场'
        description: '片桐美铃教师室初遇'
        trigger: '场景.当前地点=八十八学园教师室'
        flag_set: 'has_met_片桐美铃=true'
  - day: 4
    date: '12-25'
    weekday: '周一'
    chapter: '寒假前奏'
    key_events:
      - time_slot: '全天'
        event_id: 'EV010'
        type: '季节事件'
        description: '圣诞夜事件（7 分支）'
        trigger: '日期=12-25 自动触发'
        flag_set: 'christmas_event_completed=true'
        branches:
          - '唯：家中圣诞'
          - '美佐子：咖啡店圣诞'
          - '友美：邻家圣诞'
          - '泉美：图书馆圣诞'
          - '可怜：学园圣诞'
          - '梢江：酒吧夜鳥圣诞'
          - '独自：88公园独行'
      - time_slot: '夜'
        event_id: 'EV011'
        type: '女角登场'
        description: '都筑梢江酒吧夜鳥初遇（如未在圣诞分支遇）'
        trigger: '场景.当前地点=八十八町商业区酒吧夜鳥'
        flag_set: 'has_met_都筑梢江=true'
      - time_slot: '下午'
        event_id: 'EV012'
        type: '女角登场'
        description: '安田爱美保育园初遇'
        trigger: '场景.当前地点=保育园'
        flag_set: 'has_met_安田爱美=true'
  - day: 5
    date: '12-26'
    weekday: '周二'
    chapter: '寒假前奏'
    key_events:
      - time_slot: '上午'
        event_id: 'EV013'
        type: '女角登场'
        description: '野野村美里便利店初遇'
        trigger: '场景.当前地点=八十八町便利店'
        flag_set: 'has_met_野野村美里=true'
      - time_slot: '下午'
        event_id: 'EV014'
        type: '女角登场'
        description: '田中美沙88车站初遇（条件：flag:has_met_田中美沙 触发器）'
        trigger: '场景.当前地点=88车站'
        flag_set: 'has_met_田中美沙=true'

  # ─── 寒假核心（day 6-12，12-27 ~ 01-02） ───
  - day: 6
    date: '12-27'
    weekday: '周三'
    chapter: '寒假核心'
    key_events:
      - time_slot: '早'
        event_id: 'EV015'
        type: '女角登场'
        description: '永岛久美子自宅周边偶遇（铺垫）'
        trigger: '场景.当前地点=自宅周边'
        flag_set: 'has_met_永岛久美子=true'
  - day: 7
    date: '12-28'
    weekday: '周四'
    chapter: '寒假核心'
    key_events:
      - time_slot: '下午'
        event_id: 'EV016'
        type: '深化'
        description: '片桐美铃教师室深化窗口'
        trigger: 'has_met_片桐美铃=true AND affection_片桐美铃≥20'
      - time_slot: '夜'
        event_id: 'EV017'
        type: '深化'
        description: '都筑梢江酒吧夜鳥深化窗口'
        trigger: 'has_met_都筑梢江=true AND affection_都筑梢江≥20'
  - day: 8
    date: '12-29'
    weekday: '周五'
    chapter: '寒假核心'
    key_events:
      - time_slot: '上午'
        event_id: 'EV018'
        type: '谜团'
        description: '加藤美纪谜团第二层揭开（神秘眼镜少女背景）'
        trigger: 'has_met_加藤美纪=true AND affection_加藤美纪≥30'
      - time_slot: '下午'
        event_id: 'EV019'
        type: '事件'
        description: '南川洋子机车行事件'
        trigger: 'has_met_南川洋子=true AND affection_南川洋子≥20'
  - day: 9
    date: '12-30'
    weekday: '周六'
    chapter: '寒假核心'
    key_events:
      - time_slot: '晚'
        event_id: 'EV020'
        type: '反转'
        description: '舞岛可怜卸妆后偶遇（关键反转点）'
        trigger: 'has_met_舞岛可怜=true AND 场景.当前地点=非偶像场合'
      - time_slot: '下午'
        event_id: 'EV021'
        type: '偶遇'
        description: '筱原泉美商业区书店偶遇'
        trigger: 'has_met_筱原泉美=true AND 场景.当前地点=八十八町商业区书店'
  - day: 10
    date: '12-31'
    weekday: '周日'
    chapter: '寒假核心'
    key_events:
      - time_slot: '上午'
        event_id: 'EV022'
        type: '女角登场'
        description: '齐藤姐妹同时登场（互斥预警）'
        trigger: '场景.当前地点=八十八学园学生会室'
        flag_set: 'has_met_齐藤澪=true, has_met_齐藤澪奈=true'
      - time_slot: '下午'
        event_id: 'EV023'
        type: '女角登场'
        description: '铃木美穗88车站初遇（与田中美沙互斥预警）'
        trigger: '场景.当前地点=88车站'
        flag_set: 'has_met_铃木美穗=true'
      - time_slot: '下午'
        event_id: 'EV024'
        type: '女角登场'
        description: '仁科/正树夏子学园初遇（互斥预警）'
        trigger: '场景.当前地点=八十八学园'
        flag_set: 'has_met_仁科=true, has_met_正树夏子=true'
  - day: 11
    date: '01-01'
    weekday: '周一'
    chapter: '寒假核心'
    key_events:
      - time_slot: '全天'
        event_id: 'EV025'
        type: '季节事件'
        description: '跨年事件（7 分支）'
        trigger: '日期=01-01 自动触发'
        flag_set: 'new_year_event_completed=true'
        branches:
          - '唯：家中跨年'
          - '友美：邻家跨年'
          - '美沙：88车站跨年'
          - '佐知子：温泉乡跨年（前置：has_met_永岛佐知子）'
          - '美铃：教师室跨年'
          - '独自：88公园独行'
          - '温泉旅馆：特殊分支'
  - day: 12
    date: '01-02'
    weekday: '周二'
    chapter: '寒假核心'
    key_events:
      - time_slot: '全天'
        event_id: 'EV026'
        type: '季节事件'
        description: '元日事件（4 分支）'
        trigger: '日期=01-02 自动触发'
        flag_set: 'new_year_day_event_completed=true'
        branches:
          - '跨年延续：与跨年分支女角延续'
          - '独自初诣：神社参拜'
          - '温泉乡：佐知子路线深化'
          - '商业区：偶遇其他女角'
      - time_slot: '下午'
        event_id: 'EV027'
        type: '女角登场'
        description: '永岛佐知子正式登场（如未在跨年分支遇）'
        trigger: '场景.当前地点=温泉乡 OR 八十八町商业区'
        flag_set: 'has_met_永岛佐知子=true'

  # ─── 寒假尾声（day 13-16，01-03 ~ 01-06） ───
  - day: 13
    date: '01-03'
    weekday: '周三'
    chapter: '寒假尾声'
    key_events:
      - time_slot: '上午'
        event_id: 'EV028'
        type: '深化'
        description: '永岛佐知子路线深化窗口（如未触发互斥）'
        trigger: 'has_met_永岛佐知子=true AND affection_永岛佐知子≥20'
  - day: 14
    date: '01-04'
    weekday: '周四'
    chapter: '寒假尾声'
    key_events:
      - time_slot: '全天'
        event_id: 'EV029'
        type: '专属事件'
        description: '主攻略女角专属事件触发窗口（每位女角独特剧情）'
        trigger: '主攻略女角 affection ≥ 60'
  - day: 15
    date: '01-05'
    weekday: '周五'
    chapter: '寒假尾声'
    key_events:
      - time_slot: '晚'
        event_id: 'EV030'
        type: '表白'
        description: '表白事件可触发'
        trigger: '主攻略女角 affection ≥ 75 AND heartbeat ≥ 45'
        flag_set: 'confession_triggered=true'
  - day: 16
    date: '01-06'
    weekday: '周六'
    chapter: '寒假尾声'
    key_events:
      - time_slot: '夜'
        event_id: 'EV031'
        type: '初H'
        description: '初H 临界窗口'
        trigger: '主攻略女角 affection ≥ 80 AND heartbeat ≥ 50 AND trust ≥ 60 AND 触发亲密事件'
        flag_set: 'first_h_triggered=true'

  # ─── 结局阶段（day 17，01-07） ───
  - day: 17
    date: '01-07'
    weekday: '周日'
    chapter: '结局'
    key_events:
      - time_slot: '全天'
        event_id: 'EV032'
        type: '结局'
        description: '结局事件触发，根据累积状态决定结局类型'
        trigger: 'day_count=17 自动触发'
        flag_set: 'final_ending_type=<True End | Good End | Normal End | Bad End | BAD_END_X>'
        ending_matrix:
          'True End': '主攻略女角 affection ≥ 100 + savings ≥ 50000 + illegal_count = 0 + jealousy ≤ 30'
          'Good End': '主攻略女角 affection ≥ 80 + savings ≥ 50000 + illegal_count = 0'
          'Normal End': '主攻略女角 affection ≥ 60 + savings ≥ 30000'
          'Bad End': '主攻略女角 affection < 60 OR savings < 30000'
          'BAD_END_X': '已在前 16 天触发任一死结局标识'

# ════════════════════════════════════════════════════════════
# 死结局触发条件总表（前 16 天任一触发即锁定结局类型）
# ════════════════════════════════════════════════════════════
bad_endings:
  - id: 'BAD_END_1'
    name: '报警结局'
    trigger: '强迫初H（未达阈值强行H）'
    consequence: '女角报警 → 警察带走 → 强制结局'
  - id: 'BAD_END_2'
    name: '强迫亲密结局'
    trigger: '未达亲吻阈值强行亲吻'
    consequence: '女角反抗 → 信任度归零 → 关系破裂'
  - id: 'BAD_END_3'
    name: '生存红线结局'
    trigger: 'hunger=100 OR thirst=100 OR 连续 3 天无收入'
    consequence: '主角被强制送医 / 修学旅行取消'
  - id: 'BAD_END_4'
    name: '修学旅行取消结局'
    trigger: 'savings < 50000 + day 17'
    consequence: '修学旅行取消，所有女角关系冻结'
  - id: 'BAD_END_5'
    name: '嫉妒失控结局'
    trigger: 'jealousy ≥ 90（任一女角）'
    consequence: '女角失控事件 → 关系破裂'
  - id: 'BAD_END_6'
    name: '互斥锁定结局'
    trigger: '同时攻略互斥女角（如齐藤姐妹/永岛婆媳等）'
    consequence: '双方关系永久破裂'
  - id: 'BAD_END_7'
    name: '法律红线结局'
    trigger: 'illegal_count ≥ 3'
    consequence: '警察介入 → 强制结局'
  - id: 'BAD_END_8'
    name: '时间终焉结局'
    trigger: 'day_count=17 且所有女角 affection < 30（兜底结局）'
    consequence: '寒假虚度，无任何女角建立深层关系 → 时间终焉'

# ════════════════════════════════════════════════════════════
# 互斥关系总表
# ════════════════════════════════════════════════════════════
mutex_groups:
  - group_id: '齐藤姐妹'
    members: [15, 16]
    type: '严格互斥'
    consequence: '攻略其一则另一永久不可攻略（锁定仇视）'
  - group_id: '田中铃木'
    members: [10, 17]
    type: '严格互斥'
    consequence: '原作女主 vs 重制版新女主，路线互斥'
  - group_id: '仁科正树'
    members: [18, 19]
    type: '严格互斥'
    consequence: '重制版新增互斥'
  - group_id: '永岛婆媳'
    members: [13, 14]
    type: '严格互斥（伦理锁定）'
    consequence: '攻略儿媳则婆婆锁定仇视，反之亦然'
  - group_id: '鸣泽母女'
    members: [1, 2]
    type: '非严格互斥'
    consequence: '攻略母亲后女儿路线复杂化，但不强制锁定仇视'

# ════════════════════════════════════════════════════════════
# 章节切换条件
# ════════════════════════════════════════════════════════════
chapter_transitions:
  - from: '寒假前奏'
    to: '寒假核心'
    condition: 'day_count = 6（12-27 早上）'
    auto_event: '寒假核心章节开始'
  - from: '寒假核心'
    to: '寒假尾声'
    condition: 'day_count = 13（01-03 早上）'
    auto_event: '寒假尾声阶段开始'
  - from: '寒假尾声'
    to: '结局'
    condition: 'day_count = 17（01-07 早上）'
    auto_event: '结局阶段开始，根据累积状态触发对应结局'