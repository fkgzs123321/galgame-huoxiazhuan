    储蓄目标: 50000  # 修学旅行缴费单

  # ─── 当前女角（70 个·对齐 DB important_npc 表 83 列，其中 70 列为动态字段） ───
  # 与 DDL.important_npc 表的关系：DB 存全集（含描述性字段），MVU 存 EJS 读取 + 可能动态变化字段
  # 描述性字段（性别/年龄/介绍/外貌/身份/基础属性/特有属性/人际关系/交互选项/过往经历）留 DB
  # 注：所有 70 字段都可能动态变化（乳头/阴部/敏感度/体重等），哪里有变化就更新哪里
  当前女角:
    # ═══ 关系核心（6 个） ═══
    姓名: '无'
    好感度: 0
    心动值: 0
    嫉妒值: 0
    信任度: 0
    关系阶段: '初识'  # 10 正常阶段（决裂/仇视/厌恶/冷漠/疏离/初识/熟悉/暧昧/心动/亲密）+ 2 特殊态（攻略完成/失恋，事件触发）

    # ═══ 互斥与锁定（5 个·对应 DB stage_locked/is_pursued/route_locked/mutex_group/mutex_partner_name） ═══
    阶段锁定: 0           # 0=可变化, 1=互斥触发后锁定
    是否在攻略中: 0       # 0=非当前攻略, 1=正在攻略
    攻略路线锁定: 0       # 0=未锁定, 1=已选定不可切换
    互斥组名: ''          # 如 'narisawa'/'saito' 等，空表示无互斥
    互斥伙伴姓名: '无'         # 被互斥影响的伙伴姓名，'无'=无

    # ═══ H 经验进度（4 个·对应 DB h_exp/first_kiss_done/first_h_done/advanced_h_done） ═══
    H经验次数: 0          # H 经验累计次数，≥0
    初吻: 0               # 0/1，不可逆
    初H: 0                # 0/1，不可逆
    进阶H: 0              # 0/1，不可逆
    # ═══ 6 维属性（新增·对应 DB charm/academic/physical/social/perception/reputation） ═══
