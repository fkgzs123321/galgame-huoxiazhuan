    学业: 0               # 0-100，学习成绩
    体力: 0               # 0-100，体能/运动
    社交: 0               # 0-100，交际能力
    敏感: 0               # 0-100，察言观色/直觉
    声誉: 0               # 0-100，在校/社区名声
    # ═══ 13 项技能（新增·对应 DB strength/agility/intelligence/will_skill/stealth/speech/medical/cooking/art/driving/fighting/observation/romance_skill） ═══
    力量: 0               # 0-100，物理对抗/搬运
    敏捷: 0               # 0-100，反应/逃跑
    智力: 0               # 0-100，解谜/计划
    意志技能: 0           # 0-100，抗压/抵抗诱惑
    潜行: 0               # 0-100，暗中行动
    口才: 0               # 0-100，说服/调情
    医学: 0               # 0-100，诊疗/急救
    烹饪: 0               # 0-100，料理
    艺术: 0               # 0-100，审美/创作
    驾驶: 0               # 0-100，开车（未成年通常 0）
    格斗: 0               # 0-100，防身
    观察: 0               # 0-100，情报收集
    恋爱技能: 0           # 0-100，约会/亲密推进


    # ═══ NSFW 身体测量 - 胸部（12 个·对应 DB 列 29-40） ═══
    罩杯: '无'             # 无/A-H
    胸围: 0               # cm
    腰围: 0               # cm
    臀围: 0               # cm
    身高: 0               # cm，必填
    体重: 0               # kg
    乳头大小: ''
    乳头颜色: ''
