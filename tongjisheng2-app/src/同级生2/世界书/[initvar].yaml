  #   P4 西御寺有友：无加成
  #   P5 天道新干线：无加成
  技能:
    力量: 30        # 力量：物理对抗/搬运/威慑
    敏捷: 40         # 敏捷：逃跑/反应/潜行基础
    智力: 50    # 智力：学业/解谜/计划
    意志: 40       # 意志：抵抗诱惑/坚持/抗压
    潜行: 20         # 潜行：尾随/偷窥/暗中行动（初始生疏·长冈芳树 +40）
    口才: 40          # 口才：说服/表白/调情/谈判（川尻信良 +50）
    医学: 10         # 医学：诊疗/急救/药物（几乎不会）
    烹饪: 20         # 烹饪：料理质量/家庭料理效果（只会基础）
    艺术: 20             # 艺术：画作/音乐/审美/手工
    驾驶: 0          # 驾驶：开车/修学旅行（未成年无驾照）
    格斗: 25        # 格斗：战斗/防身/威慑
    观察: 40     # 观察：察言观色/情报收集/破绽发现（长冈芳树 +50）
    恋爱: 25         # 恋爱：约会策划/表白时机/亲密推进（与 口才 协同）

