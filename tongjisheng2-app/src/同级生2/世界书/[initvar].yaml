# ════════════════════════════════════════════════════════════
# 同级生2 initvar.yaml — MVU 变量初始值（身份感知动态初始化 · 13 技能+隐藏/性格/女角命名空间）
# ════════════════════════════════════════════════════════════
# 与 DDL protagonist_info 表初始值保持一致
# 包含身份、生存属性、4维关系值、法律状态、13 技能、性格/隐藏/女角命名空间等完整字段
#
# ★ 关键变更：身份感知动态初始化
# - 默认值：未选择（身份隔离机制）
# - 玩家在开场白选择 P1~P6 后，AI 应通过 <UpdateVariable> 重写以下字段：
#   1. 玩家身份: 改为玩家选择的身份（'自定义' 对应 P6）
#   2. 现金: 按身份对应金额重写（5000/4000/3000/50000/20000/玩家自定义）
#   3. 魅力/学业/体力/社交/敏感/声誉: 按身份对应数值重写
#   4. skills_bonus: 应用身份对应技能加成（如长冈芳树 潜行+40, 观察+50）
#   5. 储蓄: 重置为 0
#   6. 初始关系：按身份对应的 initial_relations 重写 important_npc 表对应行的 4 维关系值
#
# ★ 身份-初始值映射表（与 全局规则总表.txt PLAYER_IDENTITIES 严格对齐）
# ┌──────┬──────────┬───────┬─────────────────────────────────────────────────────┐
# │ 选项 │ 身份     │ 现金 │ 6维属性(魅力/学业/体力/社交/敏感/声誉) │
# ├──────┼──────────┼───────┼─────────────────────────────────────────────────────┤
# │ P1   │ 原作主角 │ 5000  │ 50/50/80/50/30/50                                  │
# │ P2   │ 川尻信良 │ 4000  │ 45/40/70/60/40/55                                  │
# │ P3   │ 长冈芳树 │ 3000  │ 35/45/60/30/50/20                                  │
# │ P4   │ 西御寺有友│ 50000 │ 60/30/50/70/20/40                                  │
# │ P5   │ 天道新干线│ 20000 │ 55/70/60/65/15/60                                  │
# └──────┴──────────┴───────┴─────────────────────────────────────────────────────┘
# ════════════════════════════════════════════════════════════

stat_data:
  # ─── 时间（8 个） ───
  时间:
    当前日期: '12-22'
    星期: '周五'
    时段: '早'
    当前时间: '08:00'  # HH:MM 格式，每楼层 +30 分钟
    天数: 1
    季节: '冬'
    章节: '寒假前奏'
    天气: '晴'

  # ─── 场景（3 个） ───
  场景:
    当前地点: '未选择'  # 身份初始化后由 AI 重写为对应住所（如 P3→长冈家）
    当前女角名: '无'
    场景模式: '休息'

  # ─── 主角（25 个·未选择状态，玩家选择后由 AI 重写）───
  主角:
    # 身份（开局后由玩家选择 P1~P6 决定，默认 '未选择'；P6='自定义'）
    玩家身份: '未选择'
    玩家姓名: '{{user}}'  # 玩家姓名，由SillyTavern自动替换为用户名
    年龄: 0  # 年龄
    住所: '未选择'  # 住所

    # 6 维属性（中性默认值(0)，其他身份参见上方映射表）
    魅力: 0
    学业: 0
    体力: 0
    社交: 0
    敏感: 0
    声誉: 0

    # 3 生存属性（关键真实机制·所有身份共用）
    饥饿: 30        # 0=饱腹，100=饿死，每时段+10
    口渴: 20        # 0=不渴，100=脱水，每时段+15
    清洁: 80       # 0=极脏，100=洁净，每日-20

    # 3 副状态（所有身份共用）
    疲劳: 0
    心情: 70
    睡眠质量: 70

    # 经济（中性默认值(0)，其他身份按映射表重写）
    现金: 0
    储蓄: 0

    # 法律/道德
    违法计数: 0
    法律警告: 0

    # 今日消费统计（新增·每日凌晨重置）
