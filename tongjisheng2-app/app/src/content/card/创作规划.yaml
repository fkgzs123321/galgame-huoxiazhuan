project:
  name: 同级生2
  worldbookName: 同级生2
  form: charactercard
  mvu: true
  avatar: 头像.png

world:
  overview: |
    1995 年 elf 经典恋爱模拟《同级生2》改编卡。故事发生在八十八町，
    主角是八十八学园三年生，寒假（12-22 ~ 01-07）期间与町内 14 位原作女角
    + 重制版新增女角（齐藤姐妹/铃木美穗/仁科/正树夏子）展开多线恋爱攻略。
    核心机制：每日 5 时段（早/上午/下午/晚/深夜）× 17 天 = 85 个时点，
    每个时点按地点加载当日可能出现的 NPC 条目，EJS 调度器精准控制 token。
    经济系统：打工赚钱（6 种工作）+ 强制三餐 + 礼物消费 + 储蓄目标（修学旅行费 5万）。
    RPG 养成：6 维属性 + 3 副状态 + LCG 确定性骰子判定（工作/约会/学业/事件/经济）。
    NSFW 重 H：参考系统哥的末日 bound_women 表，每位女角含 NSFW 字段
    （衣着/暴露度/湿润度/皮肤痕迹/兴奋程度/精液残留/占有印记/H 经验/性癖偏好）。

  regions:
    - name: 自宅周边
      scenes: [主角自宅, 鸣泽家(唯与美佐子), 水野家(友美), 信良家, 芳树家]
      description: 主角住所附近，邻居住宅集中区
    - name: 八十八学园
      scenes: [校庭, 体育馆后, 弓箭练习场, 校舍走廊, 屋顶]
      description: 主角就读学校，寒假期间部分开放
    - name: 八十八町商业区
      scenes: [88车站, 旅行代理店, 便利店, 咖啡店《憩》(美佐子经营), 88公园, 白蛇池公园]
      description: 町内主要活动区域
    - name: 八十八海岸
      scenes: [海岸, 海水浴场, 灯塔]
      description: 海边区域，重要约会点
    - name: 温泉乡
      scenes: [旅馆, 温泉, 如月神宫, 游园地, 电影院, 游乐中心, 才艺中心]
      description: 篠原泉美温泉之旅+永岛佐知子线主要场景
    - name: 88市民医院
      scenes: [病栋, 美佐子病房, 樱子病房]
      description: 美佐子线关键场景
    - name: 保育园
      scenes: [花园保育园, 安田爱美办公室]
      description: 安田爱美线主要场景

  factions:
    - name: 主角团
      description: 主角+唯+友美+信良+泉美+美佐子+美里等核心朋友圈
      key_members: [主角, 鸣泽唯, 水野友美, 川尻信良, 筱原泉美]
    - name: 西御寺财阀
      description: 西御寺有友为主的对立势力，欲以财力夺取唯
      key_members: [西御寺有友]
    - name: 学园教师阵营
      description: 片桐美铃(主角导师)+天道新干线(虐待狂教师)
      key_members: [片桐美铃, 天道新干线]
    - name: 八十八町女性网络
      description: 14+ 位女角构成的复杂关系网，含嫉妒链/家族关系
      key_members: [鸣泽唯, 鸣泽美佐子, 舞岛可怜, 永岛佐知子, 永岛久美子]

