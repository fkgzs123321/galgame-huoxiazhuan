mvu:
  structure: |
    顶层结构：
    ├── 时间
    │   ├── current_date (12-22 ~ 01-07 字符串)
    │   ├── weekday (星期)
    │   ├── time_slot (早/上午/下午/晚/深夜)
    │   ├── day_count (1-17 累计天数)
    │   ├── season (冬)
    │   └── chapter (寒假前奏/核心/尾声/结局)
    ├── 场景
    │   ├── current_location (当前地点)
    │   ├── current_heroine_id (当前对话女角 ID)
    │   └── scene_mode (约会/上学/打工/事件/休息)
    ├── 主角
    │   ├── charm (魅力 0-100)
    │   ├── academic (学业 0-100)
    │   ├── stamina (体力 0-100)
    │   ├── money (金钱 ≥0)
    │   ├── social (社交 0-100)
    │   ├── sensitivity (敏感 0-100)
    │   ├── fatigue (疲劳 0-100)
    │   ├── mood (心情 0-100)
    │   └── reputation (声誉 0-100)
    ├── 临时
    │   ├── last_event_id
    │   ├── last_choice_result
    │   ├── turn_actions_used
    │   └── current_difficulty (轻松/普通/挑战/地狱)
    └── 经济
        ├── daily_income
        ├── daily_expense
        └── total_savings

  variables:
    - path: 时间.current_date
      format: MM-DD
      description: 当前游戏日期（12-22 ~ 01-07）
    - path: 时间.weekday
      enum: [周一, 周二, 周三, 周四, 周五, 周六, 周日]
    - path: 时间.time_slot
      enum: [早, 上午, 下午, 晚, 深夜]
      description: 5 时段/天
    - path: 时间.day_count
      type: number
      range: 1~17
      description: 寒假累计天数（1=12-22, 17=01-07）
    - path: 时间.season
      enum: [冬]
    - path: 时间.chapter
      enum: [寒假前奏, 寒假核心, 寒假尾声, 结局]
    - path: 场景.current_location
      description: 当前地点（如：自宅/学园/咖啡店/海岸）
    - path: 场景.current_heroine_id
      type: number
      description: 当前对话女角 ID（对应 important_npc 表 row_id）
    - path: 场景.scene_mode
      enum: [约会, 上学, 打工, 事件, 休息]
    - path: 主角.charm
      type: number
      range: 0~100
      check: 关键事件提升，每日自然衰减1点
    - path: 主角.academic
      type: number
      range: 0~100
      check: 学习行动提升，打工消耗学业
    - path: 主角.stamina
      type: number
      range: 0~100
      check: 休息/睡眠恢复，工作/约会消耗
    - path: 主角.money
      type: number
      range: 0~
      check: 工作获得，消费支出，DDL CHECK ≥0
    - path: 主角.social
      type: number
      range: 0~100
    - path: 主角.sensitivity
      type: number
      range: 0~100
      description: 影响女角心动速度与 NSFW 场景细腻度
    - path: 主角.fatigue
      type: number
      range: 0~100
      check: 工作累积，休息恢复，≥80 强制休息
    - path: 主角.mood
      type: number
      range: 0~100
    - path: 主角.reputation
      type: number
      range: 0~100
      description: 八十八町名声，影响女角初始好感
    # 3 生存属性（关键真实机制）
    - path: 主角.hunger
      type: number
      range: 0~100
      description: 饥饿值（0=饱腹，100=饿死，每时段+10×难度倍率）
    - path: 主角.thirst
      type: number
      range: 0~100
      description: 口渴值（0=不渴，100=脱水，每时段+15×难度倍率）
    - path: 主角.hygiene
      type: number
      range: 0~100
      description: 清洁度（0=极脏，100=洁净，每日-20×难度倍率）
    - path: 主角.sleep_quality
      type: number
