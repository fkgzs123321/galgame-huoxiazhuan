ejs:
  generate_before:
    - name: current_difficulty
      variable: 临时.current_difficulty
    - name: day_count
      variable: 时间.day_count
    - name: time_slot
      variable: 时间.time_slot
    - name: current_location
      variable: 场景.current_location
    - name: current_heroine_id
      variable: 场景.current_heroine_id
    - name: scene_mode
      variable: 场景.scene_mode
  entries:
    - name: D0系统控制器
      complexity: 段落控制
      condition: 按 scene_mode 切换系统提示
    - name: 角色性格控制器
      complexity: 条目显隐
      condition: 按 current_heroine_id 加载对应 NPC 条目
    - name: 世界观场景控制器
      complexity: 段落控制
      condition: 按 current_location + time_slot 加载场景描述
    - name: 寒假日程调度器
      complexity: 条目显隐
      condition: 按 day_count 加载当日事件清单与可能出现 NPC
      note: 17 个日期文件作为子条目，await getwi 动态注入
    - name: 鸣泽唯_性格调色盘
      complexity: 段落控制
      stages:
        - name: 客气期
          condition: affection_唯 < 10
        - name: 警觉期
          condition: affection_唯 >= 10 && affection_唯 < 30
        - name: 心动期
          condition: affection_唯 >= 30 && affection_唯 < 60
        - name: 亲密期
          condition: affection_唯 >= 60

first_messages:
  - format: 叙事式
    word_count: 500~700
    output_path: 开场白/0.txt
    scene: 12月22日早晨，主角自宅客厅
    opening_situation: |
      寒假第一天。主角醒来下楼，听见厨房传来美佐子准备早餐的声音。
      唯在客厅沙发上看电视，瞥了主角一眼说了声"早"。
      美佐子从厨房探出头："今天开始放寒假了，但是不要整天窝在家里啊。
      对了，今天要不要去咖啡店帮忙？或者去学园看看？"
      主角的寒假冒险，从这一刻开始。
