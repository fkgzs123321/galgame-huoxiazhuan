        内容: |-
          /* ============================================================
           * SP Database Template Injector  (Universal / 通用轮子版)
           * Flow : read WI entry -> extract single-line JSON -> create template -> conflict check
           * Mount: window.parent.document (visible from iframe) + class toggle
           * Done : mobile layout reflow / perf guard / memory release (AbortController)
           * FIX  : 移动端软键盘把 fixed 弹窗顶飞且不归位 -> visualViewport 动态居中复位
           * NEW  : 三大数据源(世界书名/条目名/预设名) 改为脚本变量存储, 面板内可改 -> 通用轮子
           * Orig : discord @hzy9527 (raft_13) — 二创需署名
           * ============================================================ */
          
          /* ========= DEFAULTS (仅作首次/重置时的兜底, 实际值从脚本变量读取) ========= */
          const DEFAULTS = {
            bookName  : '同级生2',          // worldbook holding the template JSON（与角色卡同名）
            entryName : '表格模板JSON',     // target entry comment/name (keep it DISABLED)
            presetName: 'dokyusei2',        // preset name for the created template
          };
          
          const BTN_NAME      = '📦 创建同级生2表格模板';     // script button name
          const DEFAULT_SCOPE = 'global';                  // 'chat' | 'global'
          
          const CONFIG_VAR_KEY = '__dokyusei2_tpl_config__';    // 脚本变量里存配置用的键名
          
          const PANEL_ID      = 'dokyusei2-tpl-panel';
          const CSS_ID        = 'dokyusei2-tpl-style';
          const INSTANCE_FLAG = '__dokyusei2TplInjectorAC__';   // perf: re-init guard key
          const API_RETRY     = 20;
          const API_INTERVAL  = 300;
          
          const topDocument = window.parent.document;
          const topWindow   = window.parent;
          const topBody     = topDocument.body;
          
          /* ========= runtime config (从脚本变量加载, 可被面板修改) ========= */
          let CFG = { ...DEFAULTS };
          
          /* 读取脚本变量中的配置, 合并到 CFG; 缺项用默认值兜底 */
          function loadConfig() {
            try {
              const vars = getVariables({ type: 'script' });
              const saved = vars && vars[CONFIG_VAR_KEY];
              if (saved && typeof saved === 'object') {
                CFG = {
                  bookName  : (saved.bookName   || DEFAULTS.bookName),
                  entryName : (saved.entryName  || DEFAULTS.entryName),
                  presetName: (saved.presetName || DEFAULTS.presetName),
                };
              }
            } catch (_) { /* 读取失败则保持默认值 */ }
          }
          
          /* 把当前 CFG 写回脚本变量(持久化) */
          async function saveConfig() {
            try {
              await insertOrAssignVariables({ [CONFIG_VAR_KEY]: { ...CFG } }, { type: 'script' });
              return true;
            } catch (e) {
              notify('保存配置失败: ' + (e && e.message), 'err');
              return false;
            }
          }
          
          /* ========= PERF: tear down previous instance before re-init ========= */
          function disposePrevious() {
            try { topWindow[INSTANCE_FLAG]?.abort?.(); } catch (_) {}
            topDocument.getElementById(CSS_ID)?.remove();
            topDocument.getElementById(PANEL_ID)?.remove();
            topDocument.getElementById(`${PANEL_ID}-overlay`)?.remove();
            topDocument.getElementById(`${PANEL_ID}-confirm`)?.remove();
            topDocument.getElementById(`${PANEL_ID}-config`)?.remove();
            try { eventClearEvent(getButtonEvent(BTN_NAME)); } catch (_) {}
          }
          disposePrevious();
          
          /* MEMORY: every listener tied to this controller; one abort() frees them all */
          const ac  = new AbortController();
