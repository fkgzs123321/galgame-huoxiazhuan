      # ── SP·数据库（shujuku）：chatSheets 表格执行引擎 ──
      - 名称: SP·数据库
        id: b3f2a1c4-0002-4000-8000-000000000002
        启用: true
        类型: 脚本
        内容: |-
          import 'https://gcore.jsdelivr.net/gh/AlbusKen/shujuku@spv7.9/index.js';

      # ── LCG 骰子系统：自动更新最新版 ──
      - 名称: LCG骰子系统
        id: b3f2a1c4-0003-4000-8000-000000000003
        启用: true
        类型: 脚本
        内容: |-
          async function getLatestVersion() {
            try {
              const response = await fetch('https://api.github.com/repos/jerryzmtz/my-tavern-scripts/tags');
              const tags = await response.json();
              return tags[0]?.name || 'main';
            } catch {
              return 'main';
            }
          }
          const version = await getLatestVersion();
          import(`https://testingcf.jsdelivr.net/gh/jerryzmtz/my-tavern-scripts@${version}/dist/骰子系统/stable.js`);

      # ── Zod schema 注册：MVU 变量类型校验与默认值 ──
      - 名称: Zod结构
        id: b3f2a1c4-0004-4000-8000-000000000004
        启用: true
        类型: 脚本
        内容: |-
          import { registerMvuSchema } from 'https://testingcf.jsdelivr.net/gh/StageDog/tavern_resource/dist/util/mvu_zod.js';
          // ════════════════════════════════════════════════════════════
          // 同级生2 MVU schema.ts — 61 个变量定义
          // 与 DDL 表的关系：
          //   - 单值状态（日期/时段/位置/主角属性等）→ MVU 变量
          //   - 集合数据（物品/NPC列表/事件记录等）→ chatSheets 表格
          //   - 表格行的字段值需被 EJS 控制器读取做条件分支 → 同时存一份到 MVU 变量
          // ════════════════════════════════════════════════════════════



          const Schema = z.object({
            // ─── 时间（8 个） ───
            时间: z.object({
              当前日期: z.coerce.string().prefault('12-22'), // MM-DD（12-22 ~ 01-07）
              星期: z.enum(['周一','周二','周三','周四','周五','周六','周日']).prefault('周五'),
              时段: z.enum(['早','上午','下午','晚','深夜']).prefault('早'),
              当前时间: z.coerce.string().prefault('08:00'), // HH:MM 格式，每楼层 +30 分钟
              天数: z.coerce.number().transform(v => _.clamp(Math.round(v), 1, 17)).prefault(1), // 寒假累计天数
              季节: z.enum(['冬']).prefault('冬'),
              章节: z.enum(['寒假前奏','寒假核心','寒假尾声','结局']).prefault('寒假前奏'),
              天气: z.enum(['晴','阴','雨','雪','风','雾']).prefault('晴')
            }).prefault({}),

            // ─── 场景（3 个） ───
            场景: z.object({
              当前地点: z.coerce.string().prefault('未选择'), // 身份初始化后由 AI 重写为对应住所
              当前女角名: z.coerce.string().prefault('无'), // 当前对话女角姓名，'无'=无对话女角
              场景模式: z.enum(['约会','上学','打工','事件','休息']).prefault('休息')
            }).prefault({}),

            // ─── 主角（25 个：身份1 + 姓名/年龄/住所3 + 6维属性 + 3生存属性 + 3副状态 + 经济3 + 法律2） ───
            主角: z.object({
              // 身份（v3.0 扩展到 5 预设 + 1 自定义 = 6 种可扮演男性角色）
              玩家身份: z.enum(['未选择','原作主角','川尻信良','长冈芳树','西御寺有友','天道新干线','自定义']).prefault('未选择'),
              玩家姓名: z.coerce.string().prefault(''), // 玩家姓名
              年龄: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 30)).prefault(0), // 年龄（v5.0: 0=未选择,身份初始化后改为实际值）
              住所: z.coerce.string().prefault('未选择'), // 住所（v5.0: 未选择=等待身份初始化）

              // 6 维属性（0-100）
              魅力: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 魅力
              学业: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 学业
              体力: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 体力
              社交: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 社交
              敏感: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 敏感
              声誉: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 声誉

              // 3 生存属性（0-100，关键真实机制）
              饥饿: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(30), // 饥饿值（0=饱腹，100=饿死，每时段+10）
              口渴: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(20), // 口渴值（0=不渴，100=脱水，每时段+15）
              清洁: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(80), // 清洁度（0=极脏，100=洁净，每日-20）

              // 3 副状态（0-100）
              疲劳: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(0), // 疲劳（≥80 强制休息）
              心情: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(70), // 心情
              睡眠质量: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 100)).prefault(70), // 睡眠质量（影响次日恢复）

              // 经济
              现金: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0), // 现金（≥0，v5.0: 0=未选择,身份初始化后改为实际值）
              储蓄: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0), // 储蓄（修学旅行费目标 50000）

              // 法律/道德
              违法计数: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 3)).prefault(0), // 违法计数（≥3 触发 BAD_END_7）
              法律警告: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 2)).prefault(0), // 法律警告等级（0=无/1=警告/2=传唤）
              // 今日消费统计（v2.0 新增·每日凌晨重置）
              今日餐费: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0),
              今日礼费: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0),
              今日交通费: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0),
              今日总消费: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0),
              储蓄目标: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(50000)
            }).prefault({}),

            // ─── 当前女角（50 个·v3.0 对齐 DB important_npc 表 64 列动态字段） ───
            // 与 DDL.important_npc 表的关系：DB 存全集（含静态描述），MVU 仅存动态/EJS 读取字段
            // 静态字段（姓名/性别/年龄/介绍/外貌/身份/基础属性/特有属性/人际关系/交互选项/过往经历）留 DB
            当前女角: z.object({
              // ═══ 关系核心（6 个） ═══
              姓名: z.coerce.string().prefault('无'),
              好感度: z.coerce.number().transform(v => _.clamp(Math.round(v), -100, 100)).prefault(0),
              心动值: z.coerce.number().transform(v => _.clamp(Math.round(v), -100, 100)).prefault(0),
              嫉妒值: z.coerce.number().transform(v => _.clamp(Math.round(v), -100, 100)).prefault(0),
              信任度: z.coerce.number().transform(v => _.clamp(Math.round(v), -100, 100)).prefault(0),
              关系阶段: z.enum([
                '决裂','仇视','厌恶','冷漠','疏离',  // 负向 5 档
                '初识','熟悉','暧昧','心动','亲密',   // 正向 5 档
                '攻略完成','失恋'                    // 2 特殊状态
              ]).prefault('初识'),

              // ═══ 互斥与锁定（5 个·对应 DB stage_locked/is_pursued/route_locked/mutex_group/mutex_partner_name） ═══
              阶段锁定: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),
              是否在攻略中: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),
              攻略路线锁定: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),
              互斥组名: z.coerce.string().prefault(''),
              互斥伙伴姓名: z.coerce.string().prefault('无'),

              // ═══ H 经验进度（4 个·对应 DB h_exp/first_kiss_done/first_h_done/advanced_h_done） ═══
              H经验次数: z.coerce.number().transform(v => Math.max(0, Math.round(v))).prefault(0),
              初吻: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),
              初H: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),
              进阶H: z.coerce.number().transform(v => _.clamp(Math.round(v), 0, 1)).prefault(0),

              // ═══ NSFW 身体测量 - 胸部（11 个·对应 DB 列 29-40） ═══
