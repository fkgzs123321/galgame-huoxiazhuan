<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1625"/>
      <stop offset="100%" stop-color="#3d2952"/>
    </linearGradient>
    <linearGradient id="petalM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd6e7"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>
  <!-- maskable:安全区为中央 80%,故填满背景并保留边距 -->
  <rect width="512" height="512" fill="url(#bgM)"/>
  <g transform="translate(256,256) scale(0.7)">
    <g fill="url(#petalM)" opacity="0.95">
      <ellipse cx="0" cy="-90" rx="50" ry="100" transform="rotate(0)"/>
      <ellipse cx="0" cy="-90" rx="50" ry="100" transform="rotate(72)"/>
      <ellipse cx="0" cy="-90" rx="50" ry="100" transform="rotate(144)"/>
      <ellipse cx="0" cy="-90" rx="50" ry="100" transform="rotate(216)"/>
      <ellipse cx="0" cy="-90" rx="50" ry="100" transform="rotate(288)"/>
    </g>
    <circle r="28" fill="#fff4c2"/>
    <circle r="14" fill="#e91e63"/>
  </g>
</svg>
